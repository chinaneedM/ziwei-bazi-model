name: verify-tianwen-13gz-d14-original-source-tiles
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native-tile-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/verify-tianwen-13gz-native-segmentation.py --output-dir /tmp/13gz --log-panels
      - run: python -m unittest discover -s tests -p 'test_tianwen_13gz*' -v
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13gz-original-d14-disjoint-native-pixel-tiles
          path: /tmp/13gz/
          if-no-files-found: error
          retention-days: 30
