name: probe-najda-suishu-yuan-ming-louke

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-najda-suishu-yuan-ming-louke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Acquire NAJDA 280-0071 Sui Shu zhi 13-14 and locate clepsydra passage
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/najda-suishu-280-0071-louke'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages" "$ROOT/ocr"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra >/dev/null
          python -m pip install --quiet pillow
          python - <<'PY'
          import hashlib, html, json, pathlib, re, subprocess, urllib.parse, urllib.request
          from PIL import Image, ImageDraw

          root=pathlib.Path("audit/najda-suishu-280-0071-louke")
          title="File:NAJDA-280-0071 隋書 志第13，14.pdf"
          api="https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({
              "action":"query","format":"json","formatversion":"2",
              "prop":"imageinfo","iiprop":"url|size|sha1|extmetadata","titles":title
          })
          req=urllib.request.Request(api,headers={"User-Agent":"Tianwen-Provenance-Audit/1.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              meta=json.load(r)
          page=meta["query"]["pages"][0]
          ii=page["imageinfo"][0]
          url=ii["url"]
          (root/"commons-metadata.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          req=urllib.request.Request(url,headers={"User-Agent":"Tianwen-Provenance-Audit/1.0"})
          with urllib.request.urlopen(req,timeout=180) as r:
              data=r.read()
          pdf=root/"NAJDA-280-0071-suishu-zhi13-14.pdf"
          pdf.write_bytes(data)
          pdf_sha=hashlib.sha256(data).hexdigest()

          info=subprocess.run(["pdfinfo",str(pdf)],stdout=subprocess.PIPE,check=True).stdout.decode("utf-8",errors="replace")
          (root/"pdfinfo.txt").write_text(info,encoding="utf-8")
          m=re.search(r"^Pages:\s+(\d+)",info,re.M)
          pages=int(m.group(1)) if m else None

          # Try any existing text layer first; this is locator-only.
          ptxt=subprocess.run(["pdftotext","-layout",str(pdf),"-"],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False).stdout.decode("utf-8",errors="replace")
          (root/"embedded-text.txt").write_text(ptxt,encoding="utf-8")

          subprocess.run(["pdftoppm","-jpeg","-r","120",str(pdf),str(root/"pages"/"page")],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          page_files=sorted((root/"pages").glob("page-*.jpg"))

          terms=["漏刻","四十八箭","四十八","改箭","一十九日","十九日","五十九刻","八十六分","二十四氣","冬至","夏至","箭"]
          hits=[]
          manifest=[]
          for i,p in enumerate(page_files,1):
              b=p.read_bytes()
              manifest.append({"page":i,"file":p.name,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
              proc=subprocess.run(["tesseract",str(p),"stdout","-l","chi_tra","--psm","6"],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False)
              txt=proc.stdout.decode("utf-8",errors="replace")
              (root/"ocr"/f"page-{i:03d}.txt").write_text(txt,encoding="utf-8")
              compact="".join(txt.split())
              found=[t for t in terms if t in compact]
              # Broad fallback for poor vertical OCR: retain pages containing multiple diagnostic single characters.
              diagnostic=sum(ch in compact for ch in ["漏","箭","冬","夏","刻"])
              if found or diagnostic>=3:
                  hits.append({"page":i,"terms":found,"diagnostic_score":diagnostic,"context":" ".join(txt.split())[:2400]})

          # Contact sheets covering every page. Final textual claims must be made by direct image review.
          cols=4
          per_sheet=16
          for start in range(0,len(page_files),per_sheet):
              chunk=page_files[start:start+per_sheet]
              thumbs=[]
              for j,p in enumerate(chunk,start+1):
                  im=Image.open(p).convert("RGB")
                  tw=320
                  ratio=tw/im.width
                  im=im.resize((tw,max(1,int(im.height*ratio))))
                  canvas=Image.new("RGB",(tw,im.height+28),"white")
                  canvas.paste(im,(0,28))
                  ImageDraw.Draw(canvas).text((6,6),f"PDF page {j}",fill="black")
                  thumbs.append(canvas)
              cw=max(x.width for x in thumbs); ch=max(x.height for x in thumbs)
              rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new("RGB",(cols*cw,rows*ch),"white")
              for k,im in enumerate(thumbs):
                  sheet.paste(im,((k%cols)*cw,(k//cols)*ch))
              sheet.save(root/f"contact-{start+1:03d}-{start+len(chunk):03d}.jpg",quality=88,optimize=True)

          report={
              "schema":"NAJDA-SUISHU-280-0071-LOUKE-PHYSICAL-PROBE-R1",
              "schema_version":"1.0.0",
              "commons_file_title":title,
              "commons_api_url":api,
              "source_url":url,
              "commons_sha1":ii.get("sha1"),
              "commons_size":ii.get("size"),
              "pdf_sha256":pdf_sha,
              "pdf_pages":pages,
              "rendered_pages":len(page_files),
              "ocr_locator_hits":hits,
              "ocr_authority":"LOCATOR_ONLY_NOT_FINAL_TEXT_AUTHORITY",
              "target":[
                  "霍融: 依日行黃道去極每差二度四分為增減一刻凡用四十八箭",
                  "袁充: explicit 改箭 schedules including solstitial limits",
                  "劉焯皇極曆: 24 qi and 59.86/40.14 solstitial values",
                  "firewall: 胄玄及焯漏刻並不施用"
              ],
              "bibliographic_gate":"Separate NAJ/NDL bibliographic scholarship identifies accession 280-0071 as a Yuan Dade Raozhou-route print / later Yuan recut mixed copy with Ming repairs dated Zhengde 10 through Jiajing 12 (1515-1533). This workflow only binds the digital file and physical text pages; final formalization must cite the bibliographic authority separately.",
              "product_boundary":"Probe only; no runtime rule change, algorithm reopen, candidate collapse, or Sanming-parent promotion."
          }
          (root/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({
              "commons_title":title,
              "source_url":url,
              "commons_sha1":ii.get("sha1"),
              "pdf_sha256":pdf_sha,
              "pdf_pages":pages,
              "ocr_locator_hits":hits
          },ensure_ascii=False,indent=2))
          PY

      - name: Upload NAJDA Sui Shu physical-locus probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: najda-suishu-280-0071-louke
          path: audit/najda-suishu-280-0071-louke
          if-no-files-found: error
          retention-days: 30
