name: probe-tianwen-13jl-snu-gk5553-original-neighborhood-jpegs
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'scripts/probe-tianwen-13jl-snu-gk5553-neighbor-jpegs.py'
      - 'tests/test_tianwen_13jl_snu_neighbor_jpegs.py'
      - '.github/workflows/probe-tianwen-13jl-snu-neighborhood-jpegs.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  six-source-original-jpegs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -p 'test_tianwen_13jl_snu_neighbor_jpegs.py' -v
      - run: python scripts/probe-tianwen-13jl-snu-gk5553-neighbor-jpegs.py
        env: {TIANWEN_13JL_OUT: /tmp/tianwen-13jl}
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13jl-snu-gk5553-six-neighbor-source-jpegs
          path: /tmp/tianwen-13jl/
          if-no-files-found: error
