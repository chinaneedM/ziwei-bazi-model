name: verify-yehuobian-12ve-paratext-semantics-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12ve-paratext-semantics-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VE-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VE-*.md
      - scripts/verify-yehuobian-shenzhen-three-predicates-12ve.py
      - tests/test_yehuobian_shenzhen_three_predicates_12ve.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continuity, source registry, genealogy
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: 12VE semantic separation
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-shenzhen-three-predicates-12ve.py
          python -m unittest discover -s tests -p 'test_yehuobian_shenzhen_three_predicates_12ve.py' -v
