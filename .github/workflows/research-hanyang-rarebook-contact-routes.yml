name: research-hanyang-rarebook-contact-routes

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-hanyang-rarebook-contact-routes.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Follow only public navigation labels already rendered by Hanyang UI
        shell: python
        run: |
          import json
          import time
          import urllib.parse
          from pathlib import Path

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          OUT=Path("probe"); OUT.mkdir()
          START="https://lib.hanyang.ac.kr/library-guide/outer"
          LABELS=["조직/연락처","학술정보관 이용신청"]
          KEYWORDS=["고전","고서","자료실","연락처","전화","이메일","email","복사","원문","열람","이용신청","특별"]

          opts=Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1800,2400")
          opts.add_argument("--lang=ko-KR")
          opts.set_capability("goog:loggingPrefs",{"performance":"ALL"})

          result={
            "schema":"ZIWEI-HANYANG-RAREBOOK-CONTACT-ROUTES-R1",
            "target_biblio_id":484926,
            "target_accession":"HOM000001861",
            "start_url":START,
            "labels_from_rendered_public_navigation":LABELS,
            "authentication_attempted":False,
            "form_submission_attempted":False,
            "route_guessing_attempted":False,
            "navigation_results":[]
          }

          driver=webdriver.Chrome(options=opts)
          try:
            driver.set_page_load_timeout(90)
            for idx,label in enumerate(LABELS,1):
              driver.get(START); time.sleep(7)
              candidates=driver.find_elements(By.XPATH, f"//*[normalize-space(text())='{label}']")
              visible=[e for e in candidates if e.is_displayed()]
              row={"label":label,"visible_candidate_count":len(visible)}
              if not visible:
                row["status"]="NO_VISIBLE_EXACT_LABEL"
                result["navigation_results"].append(row)
                continue
              el=visible[0]
              row["tag"]=el.tag_name
              row["href_before_click"]=el.get_attribute("href")
              try:
                driver.execute_script("arguments[0].scrollIntoView({block:'center'});",el)
                time.sleep(0.5)
                el.click()
                time.sleep(8)
              except Exception as exc:
                row["click_error"]=repr(exc)
                result["navigation_results"].append(row)
                continue
              row["final_url"]=driver.current_url
              row["title"]=driver.title
              body=driver.find_element(By.TAG_NAME,"body").text
              row["body_text"]=body[:60000]
              row["keyword_lines"]=[
                line for line in body.splitlines()
                if any(k.lower() in line.lower() for k in KEYWORDS)
              ][:500]
              links=[]
              for a in driver.find_elements(By.CSS_SELECTOR,"a[href]"):
                try:
                  if not a.is_displayed(): continue
                  txt=" ".join((a.text or "").split())
                  href=a.get_attribute("href") or ""
                  if any(k.lower() in (txt+" "+href).lower() for k in KEYWORDS):
                    links.append({"text":txt[:500],"href":href})
                except Exception:
                  pass
              seen=set(); dedup=[]
              for x in links:
                key=(x["text"],x["href"])
                if key not in seen:
                  seen.add(key); dedup.append(x)
              row["relevant_rendered_links"]=dedup[:300]
              driver.save_screenshot(str(OUT/f"nav-{idx:02d}.png"))
              (OUT/f"nav-{idx:02d}.html").write_text(driver.page_source,encoding="utf-8")
              result["navigation_results"].append(row)

            network=[]
            for entry in driver.get_log("performance"):
              try: msg=json.loads(entry["message"])["message"]
              except Exception: continue
              if msg.get("method") not in ("Network.requestWillBeSent","Network.responseReceived"): continue
              p=msg.get("params",{})
              if msg["method"]=="Network.requestWillBeSent":
                req=p.get("request",{}); url=req.get("url",""); method=req.get("method"); status=None
              else:
                resp=p.get("response",{}); url=resp.get("url",""); method=None; status=resp.get("status")
              if "lib.hanyang.ac.kr" not in url: continue
              u=urllib.parse.urlsplit(url)
              q={}
              for k,v in urllib.parse.parse_qsl(u.query,keep_blank_values=True):
                q[k]="__REDACTED__" if any(s in k.lower() for s in ("token","auth","password","session")) else v[:500]
              network.append({"event":msg["method"],"method":method,"status":status,
                              "url":urllib.parse.urlunsplit((u.scheme,u.netloc,u.path,"","")),
                              "safe_query":q})
            result["public_ui_network_observations"]=network[-1500:]
          finally:
            driver.quit()

          result["adjudication"]={
            "goal":"BIND_FIRST_PARTY_CONTACT_OR_SPECIAL_MATERIAL_ACCESS_POLICY",
            "target_page_status":"PENDING_DIRECT_PAGE",
            "algorithm_effect":"NONE"
          }
          (OUT/"hanyang-rarebook-contact-routes.json").write_text(
            json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
            "navigation_results":[{
              "label":r.get("label"),"visible_candidate_count":r.get("visible_candidate_count"),
              "tag":r.get("tag"),"href_before_click":r.get("href_before_click"),
              "final_url":r.get("final_url"),"title":r.get("title"),
              "keyword_lines":r.get("keyword_lines"),"relevant_rendered_links":r.get("relevant_rendered_links")
            } for r in result["navigation_results"]],
            "adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))

      - name: Upload Hanyang contact-route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-hanyang-rarebook-contact-routes
          path: probe/
          if-no-files-found: warn
          retention-days: 14
