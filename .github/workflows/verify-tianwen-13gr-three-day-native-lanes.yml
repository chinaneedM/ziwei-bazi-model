name: verify-tianwen-13gr-three-day-native-lanes
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13gr-three-day-native-lanes.py
      - .github/workflows/verify-tianwen-13gr-three-day-native-lanes.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact source inspection dependencies
        run: python -m pip install 'PyMuPDF>=1.24,<1.28' 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Extract same-page independently headed source-native three-day controls
        env:
          TIANWEN_LOG_LANES_BASE64: "1"
        run: python scripts/acquire-tianwen-13gr-three-day-native-lanes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncl13gr-original-d12-d14-lanes
          path: ncl13gr-original-d12-d14-lanes/
          retention-days: 30
          if-no-files-found: warn
