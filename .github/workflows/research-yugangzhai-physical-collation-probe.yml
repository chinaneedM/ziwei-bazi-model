name: research-yugangzhai-physical-collation-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-yugangzhai-physical-collation-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public-domain Commons scan and render finite target band
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install --quiet pillow
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/CADAL02038286%20%E9%AC%B1%E5%B2%A1%E9%BD%8B%E7%AD%86%E9%BA%88%EF%BC%88%E4%B8%89%EF%BC%89.djvu'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 -A 'ziwei-bazi-model historical-provenance-research/1.1' "$URL" -o yugangzhai-v3.djvu
          file yugangzhai-v3.djvu
          sha256sum yugangzhai-v3.djvu | tee scan.sha256
          djvused yugangzhai-v3.djvu -e n | tee page-count.txt
          mkdir -p pages ppm
          for n in $(seq 70 96); do
            ddjvu -format=ppm -page=$n -scale=60% yugangzhai-v3.djvu "ppm/page-$(printf '%03d' $n).ppm"
          done
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          for f in sorted(Path('ppm').glob('page-*.ppm')):
              Image.open(f).convert('RGB').save(Path('pages')/(f.stem+'.png'))
          files=sorted(Path('pages').glob('page-*.png'))
          for batch_i in range(0,len(files),9):
              batch=files[batch_i:batch_i+9]
              thumbs=[]
              for f in batch:
                  im=Image.open(f).convert('RGB')
                  im.thumbnail((360,560))
                  canvas=Image.new('RGB',(380,600),'white')
                  canvas.paste(im,((380-im.width)//2,28))
                  ImageDraw.Draw(canvas).text((8,6),f.stem,fill='black')
                  thumbs.append(canvas)
              sheet=Image.new('RGB',(380*3,600*3),'white')
              for j,im in enumerate(thumbs):
                  sheet.paste(im,((j%3)*380,(j//3)*600))
              sheet.save(f'contact-{batch_i//9+1}.jpg',quality=90)
          PY
          ls -lh pages contact-*.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: yugangzhai-physical-collation-probe
          path: |
            scan.sha256
            page-count.txt
            contact-*.jpg
            pages/page-*.png
          if-no-files-found: error
