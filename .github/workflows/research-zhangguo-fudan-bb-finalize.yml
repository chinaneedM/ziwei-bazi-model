name: research-zhangguo-fudan-bb-finalize

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-zhangguo-fudan-bb-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Batch 12BB semantic closure
        run: python .github/scripts/finalize-zhangguo-fudan-bb.py
      - name: Verify prepared state
        run: |
          python scripts/verify-project-continuity-state-r1.py
          git diff --check
      - name: Remove one-shot Batch 12BB machinery
        run: |
          git rm -f \
            .github/workflows/research-zhangguo-fudan-jiangsu-bb-probe.yml \
            .github/workflows/research-zhangguo-fudan-bb-contract-probe.yml \
            .github/workflows/research-zhangguo-fudan-bb-general-catalog-contract-probe.yml \
            .github/workflows/research-zhangguo-fudan-bb-opac-guji-contract-probe.yml \
            .github/workflows/research-zhangguo-fudan-bb-opac-title-query.yml \
            .github/workflows/research-zhangguo-fudan-bb-opac-detail-contract-probe.yml \
            .github/workflows/research-zhangguo-fudan-bb-opac-item-detail-query.yml \
            .github/workflows/research-zhangguo-fudan-bb-finalize.yml \
            .github/scripts/finalize-zhangguo-fudan-bb.py
      - name: Verify and commit semantic closure
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "close Batch 12BB Fudan Ming-Wanli holding provenance"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
