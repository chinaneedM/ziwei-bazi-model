name: research-zhangguo-fudan-bb-finalize

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-zhangguo-fudan-bb-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct transient Fudan evidence-layer transcription
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          script = Path('.github/scripts/finalize-zhangguo-fudan-bb.py')
          text = script.read_text(encoding='utf-8')

          # Correct a transient hand-copied identifier against the first-party OPAC response.
          text = text.replace('fudan_ancient_001127121', '34053686')

          # Keep search-level assertions at the search layer; physical-description fields belong
          # to the item-detail response and must retain its exact glyphs/punctuation.
          old_title_markers = "'34053686', 'rb2314', '10冊(1函)', '刻本', '善本', '綫裝',"
          new_title_markers = "'34053686', 'rb2314',"
          if old_title_markers not in text:
              raise SystemExit('title-marker layer anchor missing')
          text = text.replace(old_title_markers, new_title_markers, 1)

          old_detail_markers = "for marker in ('AB0613271-80', '光华楼古籍书库', '古籍馆藏', '在馆', '34053686', 'rb2314'):"
          new_detail_markers = "for marker in ('AB0613271-80', '光华楼古籍书库', '在馆', '34053686', 'rb2314', '10冊（1函）', '刻本', '善本綫裝', '新編評註通玄先生張果星宗大全', '明萬曆間', 'FDU01001127121'):"
          if old_detail_markers not in text:
              raise SystemExit('detail-marker layer anchor missing')
          text = text.replace(old_detail_markers, new_detail_markers, 1)

          # Preserve first-party field semantics exactly: library != location, and there is no
          # "古籍馆藏" holdings field in the returned object.
          text = text.replace("'physical_extent': '10冊(1函)'", "'physical_extent': '10冊（1函）'")
          old_hold = "        'permanent_location_name': '复旦大学',\n        'sub_location_name': '光华楼古籍书库',\n        'individual_library_name': '古籍馆藏',"
          new_hold = "        'permanent_library_name': '复旦大学',\n        'permanent_location_name': '光华楼古籍书库',"
          if old_hold not in text:
              raise SystemExit('physical-holding semantic anchor missing')
          text = text.replace(old_hold, new_hold, 1)
          text = text.replace('physical extent=10冊(1函)', 'physical extent=10冊（1函）')
          text = text.replace('permanent location=复旦大学\nsub-location=光华楼古籍书库\nindividual library=古籍馆藏', 'permanent library=复旦大学\npermanent location=光华楼古籍书库')
          text = text.replace('hold12bb.get("sub_location_name") != "光华楼古籍书库"', 'hold12bb.get("permanent_location_name") != "光华楼古籍书库"')
          script.write_text(text, encoding='utf-8')

          # Correct the transient provenance wrapper too; the raw API payload itself is untouched.
          p = Path('docs/research/ZIWEI-ZHANGGUO-FUDAN-OPAC-ITEM-DETAIL-R1.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          rec = data['authority_chain']['target_search_record']
          old = rec.get('docId')
          if old not in ('fudan_ancient_001127121', '34053686'):
              raise SystemExit(f'unexpected transient docId: {old}')
          rec['docId'] = '34053686'
          rec['doc_id_correction'] = 'Corrected against first-party OPAC search response: docId equals resource_smjlh 34053686.'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Prepare Batch 12BB semantic closure
        run: python .github/scripts/finalize-zhangguo-fudan-bb.py
      - name: Verify prepared state
        run: |
          python scripts/verify-project-continuity-state-r1.py
          git diff --check
      - name: Remove one-shot Batch 12BB machinery
        run: |
          git rm -f \
            .github/workflows/research-zhangguo-fudan-jiangsu-bb-probe.yml \
            .github/workflows/research-zhangguo-fudan-bb-contract-probe.yml \
            .github/workflows/research-zhangguo-fudan-bb-general-catalog-contract-probe.yml \
            .github/workflows/research-zhangguo-fudan-bb-opac-guji-contract-probe.yml \
            .github/workflows/research-zhangguo-fudan-bb-opac-title-query.yml \
            .github/workflows/research-zhangguo-fudan-bb-opac-detail-contract-probe.yml \
            .github/workflows/research-zhangguo-fudan-bb-opac-item-detail-query.yml \
            .github/workflows/research-zhangguo-fudan-bb-finalize.yml \
            .github/scripts/finalize-zhangguo-fudan-bb.py
      - name: Verify and commit semantic closure
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "close Batch 12BB Fudan Ming-Wanli holding provenance"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
