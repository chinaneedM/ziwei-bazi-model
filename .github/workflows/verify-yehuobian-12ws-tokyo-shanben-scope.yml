name: verify-yehuobian-12ws-tokyo-shanben-scope
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12ws-tokyo-shanben-scope.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12WS-*
      - scripts/verify-yehuobian-12ws-tokyo-shanben-scope.py
      - tests/test_yehuobian_12ws_tokyo_shanben_scope.py
      - scripts/probe-yehuobian-12wr-tokyo-shanben-form-search.py
      - tests/test_yehuobian_12wr_tokyo_shanben_form_search.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actual no-hit HTML query-echo and historical-source scopes
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-12ws-tokyo-shanben-scope.py
          python -m unittest discover -s tests -p 'test_yehuobian_12ws_tokyo_shanben_scope.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_12wr_tokyo_shanben_form_search.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_12wq_tokyo_shanben_source_index.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_12wp_tokyo_shanben_official_navigation.py' -v
