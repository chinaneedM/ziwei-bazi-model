name: windows-portable-desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-portable.yml"
      - "pyproject.toml"
      - "config/time-calendar-policies.json"
      - "scripts/build-windows-portable.ps1"
      - "scripts/fortune_chart_desktop.py"
      - "src/fortune_training/desktop_application/**"
      - "src/fortune_training/combined_chart_application/**"
      - "tests/test_windows_portable_desktop_launcher_r1.py"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[desktop-build]"
      - name: Build portable Windows bundle
        shell: pwsh
        run: ./scripts/build-windows-portable.ps1 -SourceCommit "$env:SOURCE_COMMIT"
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortuneChart-windows-x64-${{ env.SOURCE_COMMIT }}
          path: dist/FortuneChart-windows-x64.zip
          if-no-files-found: error
