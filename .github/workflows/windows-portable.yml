name: windows-portable-desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-portable.yml"
      - ".github/workflows/windows-stable-promote-push.yml"
      - ".github/workflows/windows-stable-promote-pr.yml"
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "config/time-calendar-policies.json"
      - "scripts/build-windows-portable.ps1"
      - "scripts/fortune_chart_desktop.py"
      - "scripts/fortune_chart_updater.py"
      - "scripts/verify-fusion-chart-product-r1.py"
      - "src/fortune_training/desktop_application/**"
      - "src/fortune_training/combined_chart_application/**"
      - "docs/FUSION-CHART-PRODUCT-R1-FINAL-ACCEPTANCE-20260904.md"
      - "docs/FUSION-CHART-FIELD-CLOSURE-AUDIT-R1.md"
      - "docs/FUSION-CHART-FIELD-PARITY-MATRIX-R1.json"
      - "README.md"
      - "tests/test_windows_portable_desktop_launcher_r1.py"
      - "tests/test_windows_verified_auto_update_r1.py"
      - "tests/test_windows_stable_release_promotion_branch_r1.py"
      - "tests/test_windows_stable_release_promotion_push_control_r3.py"
      - "tests/test_windows_stable_release_promotion_pr_control_r4.py"
  push:
    branches:
      - "release/fortune-chart-v*"
    tags:
      - "fortune-chart-v*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Resolve exact source commit
        shell: pwsh
        run: |
          $sourceCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') { throw "invalid HEAD commit: $sourceCommit" }
          "SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[desktop-build]"
      - name: Run Fusion Chart Product R1 machine gate
        shell: pwsh
        run: python scripts/verify-fusion-chart-product-r1.py
      - name: Run Windows portable/update focused tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_windows_portable_desktop_launcher_r1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_windows_verified_auto_update_r1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_windows_stable_release_promotion_branch_r1.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_windows_stable_release_promotion_push_control_r3.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_windows_stable_release_promotion_pr_control_r4.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate release ref matches packaged version
        if: startsWith(github.ref, 'refs/tags/fortune-chart-v') || startsWith(github.ref, 'refs/heads/release/fortune-chart-v')
        shell: pwsh
        run: |
          $version = (python -c "from fortune_training.desktop_application.distribution import DESKTOP_APPLICATION_VERSION; print(DESKTOP_APPLICATION_VERSION)").Trim()
          $expected = "fortune-chart-v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          elseif ($env:GITHUB_REF_TYPE -eq 'branch' -and $env:GITHUB_REF_NAME.StartsWith('release/fortune-chart-v')) {
            $releaseTag = $env:GITHUB_REF_NAME.Substring('release/'.Length)
          }
          else {
            throw "unsupported release ref: type=$env:GITHUB_REF_TYPE name=$env:GITHUB_REF_NAME"
          }
          if ($releaseTag -notmatch '^fortune-chart-v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "malformed release ref: $releaseTag"
          }
          if ($releaseTag -ne $expected) {
            throw "release ref/version mismatch: release=$releaseTag expected=$expected"
          }
      - name: Build portable Windows bundle and update manifest
        shell: pwsh
        run: ./scripts/build-windows-portable.ps1 -SourceCommit "$env:SOURCE_COMMIT"
      - name: Run emitted Windows binary platform smoke
        shell: pwsh
        run: |
          $zip = (Resolve-Path 'dist/FortuneChart-windows-x64.zip').Path
          $manifest = Get-Content 'dist/fortune-chart-update.json' -Raw | ConvertFrom-Json
          $actualHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualSize = (Get-Item $zip).Length
          if ($actualHash -ne $manifest.asset_sha256) { throw 'binary smoke ZIP SHA-256 mismatch' }
          if ($actualSize -ne $manifest.asset_size) { throw 'binary smoke ZIP size mismatch' }

          $smokeRoot = Join-Path $env:RUNNER_TEMP 'fortune-chart-emitted-zip-smoke'
          $receiptRoot = Join-Path (Resolve-Path 'dist').Path 'platform-acceptance'
          New-Item -ItemType Directory -Force -Path $smokeRoot, $receiptRoot | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $smokeRoot -Force
          $bundle = Join-Path $smokeRoot 'FortuneChart'
          $appReceipt = Join-Path $receiptRoot 'windows-binary-smoke.json'
          $updaterReceipt = Join-Path $receiptRoot 'windows-updater-binary-smoke.json'

          $app = Start-Process -FilePath (Join-Path $bundle 'FortuneChart.exe') `
            -ArgumentList @('--platform-smoke-receipt', $appReceipt) -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "FortuneChart binary smoke failed: $($app.ExitCode)" }
          $updater = Start-Process -FilePath (Join-Path $bundle 'FortuneChartUpdater.exe') `
            -ArgumentList @('--platform-smoke-receipt', $updaterReceipt) -Wait -PassThru
          if ($updater.ExitCode -ne 0) { throw "FortuneChartUpdater binary smoke failed: $($updater.ExitCode)" }

          $appResult = Get-Content $appReceipt -Raw | ConvertFrom-Json
          $updaterResult = Get-Content $updaterReceipt -Raw | ConvertFrom-Json
          if ($appResult.schema -ne 'FORTUNE-CHART-WINDOWS-BINARY-SMOKE-R1' -or $appResult.status -ne 'PASS') {
            throw 'invalid FortuneChart binary smoke receipt'
          }
          if ($appResult.source_commit -ne $env:SOURCE_COMMIT) { throw 'binary smoke source commit mismatch' }
          if ($appResult.application_version -ne $manifest.version) { throw 'binary smoke version mismatch' }
          if ($appResult.bind_policy -ne 'LOOPBACK_ONLY') { throw 'binary smoke bind policy mismatch' }
          if ($updaterResult.schema -ne 'FORTUNE-CHART-WINDOWS-UPDATER-BINARY-SMOKE-R1' -or $updaterResult.status -ne 'PASS') {
            throw 'invalid updater binary smoke receipt'
          }
          if ($updaterResult.mutation_performed -ne $false) { throw 'updater binary smoke performed mutation' }
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortuneChart-windows-x64
          path: |
            dist/FortuneChart-windows-x64.zip
            dist/fortune-chart-update.json
            dist/platform-acceptance/*.json
          if-no-files-found: error

  publish-stable-release:
    if: startsWith(github.ref, 'refs/tags/fortune-chart-v') || startsWith(github.ref, 'refs/heads/release/fortune-chart-v')
    needs: build-windows-x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FortuneChart-windows-x64
          path: release-dist
      - name: Resolve immutable release identity
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseTag = $env:GITHUB_REF_NAME
            $releaseMode = 'PREEXISTING_TAG'
          }
          elseif ($env:GITHUB_REF_TYPE -eq 'branch' -and $env:GITHUB_REF_NAME.StartsWith('release/fortune-chart-v')) {
            $releaseTag = $env:GITHUB_REF_NAME.Substring('release/'.Length)
            $releaseMode = 'PROMOTION_BRANCH'
          }
          else {
            throw "unsupported release ref: type=$env:GITHUB_REF_TYPE name=$env:GITHUB_REF_NAME"
          }
          if ($releaseTag -notmatch '^fortune-chart-v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "malformed release ref: $releaseTag"
          }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_MODE=$releaseMode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify release manifest before publication
        shell: pwsh
        run: |
          $manifest = Get-Content 'release-dist/fortune-chart-update.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:RELEASE_TAG.Replace('fortune-chart-v','')) {
            throw 'release manifest version/ref mismatch'
          }
          if ($manifest.asset_url -ne "https://github.com/chinaneedM/ziwei-bazi-model/releases/download/$env:RELEASE_TAG/FortuneChart-windows-x64.zip") {
            throw 'release manifest asset URL mismatch'
          }
          if ($manifest.source_commit -ne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw "release manifest source commit mismatch: manifest=$($manifest.source_commit) workflow=$($env:GITHUB_SHA.ToLowerInvariant())"
          }
          $actual = (Get-FileHash 'release-dist/FortuneChart-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.asset_sha256) { throw 'release ZIP SHA-256 mismatch' }
          $size = (Get-Item 'release-dist/FortuneChart-windows-x64.zip').Length
          if ($size -ne $manifest.asset_size) { throw 'release ZIP size mismatch' }
      - name: Publish immutable version release and stable-channel manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content 'release-dist/fortune-chart-update.json' -Raw | ConvertFrom-Json

          gh release view "$env:RELEASE_TAG" --json tagName 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "immutable FortuneChart release already exists: $env:RELEASE_TAG"
          }

          if ($env:RELEASE_MODE -eq 'PREEXISTING_TAG') {
            gh release create "$env:RELEASE_TAG" `
              'release-dist/FortuneChart-windows-x64.zip' `
              'release-dist/fortune-chart-update.json' `
              --verify-tag `
              --title "FortuneChart $($manifest.version)" `
              --notes "Verified Windows portable FortuneChart release. Update metadata is bound to this exact release asset and source commit."
          }
          elseif ($env:RELEASE_MODE -eq 'PROMOTION_BRANCH') {
            gh release create "$env:RELEASE_TAG" `
              'release-dist/FortuneChart-windows-x64.zip' `
              'release-dist/fortune-chart-update.json' `
              --target "$($manifest.source_commit)" `
              --title "FortuneChart $($manifest.version)" `
              --notes "Verified Windows portable FortuneChart release promoted from an audited release branch. Update metadata is bound to this exact release asset and source commit."
          }
          else {
            throw "unsupported release mode: $env:RELEASE_MODE"
          }
          if ($LASTEXITCODE -ne 0) { throw 'immutable FortuneChart release publication failed' }

          gh release view fortune-chart-stable --json tagName 1>$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create fortune-chart-stable `
              --target "$($manifest.source_commit)" `
              --title "FortuneChart Stable Update Channel" `
              --notes "Mutable stable-channel manifest pointer. Versioned FortuneChart ZIP releases remain immutable." `
              --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'stable update channel creation failed' }
          }

          gh release upload fortune-chart-stable `
            'release-dist/fortune-chart-update.json' `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'stable update manifest publication failed' }
