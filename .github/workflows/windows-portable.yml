name: windows-portable-desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-portable.yml"
      - "pyproject.toml"
      - "config/time-calendar-policies.json"
      - "scripts/build-windows-portable.ps1"
      - "scripts/fortune_chart_desktop.py"
      - "scripts/fortune_chart_updater.py"
      - "src/fortune_training/desktop_application/**"
      - "src/fortune_training/combined_chart_application/**"
      - "tests/test_windows_portable_desktop_launcher_r1.py"
      - "tests/test_windows_verified_auto_update_r1.py"
  push:
    tags:
      - "fortune-chart-v*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Resolve exact source commit
        shell: pwsh
        run: |
          $sourceCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sourceCommit -notmatch '^[0-9a-f]{40}$') { throw "invalid HEAD commit: $sourceCommit" }
          "SOURCE_COMMIT=$sourceCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[desktop-build]"
      - name: Validate release tag matches packaged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (python -c "from fortune_training.desktop_application.distribution import DESKTOP_APPLICATION_VERSION; print(DESKTOP_APPLICATION_VERSION)").Trim()
          $expected = "fortune-chart-v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "release tag/version mismatch: tag=$env:GITHUB_REF_NAME expected=$expected"
          }
      - name: Build portable Windows bundle and update manifest
        shell: pwsh
        run: ./scripts/build-windows-portable.ps1 -SourceCommit "$env:SOURCE_COMMIT"
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortuneChart-windows-x64
          path: |
            dist/FortuneChart-windows-x64.zip
            dist/fortune-chart-update.json
          if-no-files-found: error

  publish-stable-release:
    if: startsWith(github.ref, 'refs/tags/fortune-chart-v')
    needs: build-windows-x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FortuneChart-windows-x64
          path: release-dist
      - name: Verify release manifest before publication
        shell: pwsh
        run: |
          $manifest = Get-Content 'release-dist/fortune-chart-update.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:GITHUB_REF_NAME.Replace('fortune-chart-v','')) {
            throw 'release manifest version/tag mismatch'
          }
          if ($manifest.asset_url -ne "https://github.com/chinaneedM/ziwei-bazi-model/releases/download/$env:GITHUB_REF_NAME/FortuneChart-windows-x64.zip") {
            throw 'release manifest asset URL mismatch'
          }
          $actual = (Get-FileHash 'release-dist/FortuneChart-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.asset_sha256) { throw 'release ZIP SHA-256 mismatch' }
          $size = (Get-Item 'release-dist/FortuneChart-windows-x64.zip').Length
          if ($size -ne $manifest.asset_size) { throw 'release ZIP size mismatch' }
      - name: Publish immutable version release and stable-channel manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            'release-dist/FortuneChart-windows-x64.zip' `
            'release-dist/fortune-chart-update.json' `
            --verify-tag `
            --title "FortuneChart $($env:GITHUB_REF_NAME.Replace('fortune-chart-v',''))" `
            --notes "Verified Windows portable FortuneChart release. Update metadata is bound to this exact release asset and source commit."

          gh release view fortune-chart-stable --json tagName 1>$null 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create fortune-chart-stable `
              --target "$env:GITHUB_SHA" `
              --title "FortuneChart Stable Update Channel" `
              --notes "Mutable stable-channel manifest pointer. Versioned FortuneChart ZIP releases remain immutable." `
              --prerelease
          }

          gh release upload fortune-chart-stable `
            'release-dist/fortune-chart-update.json' `
            --clobber
