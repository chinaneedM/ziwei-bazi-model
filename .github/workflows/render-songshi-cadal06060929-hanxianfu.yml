name: render-songshi-cadal06060929-hanxianfu

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-songshi-cadal06060929-hanxianfu.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install DJVU and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y djvulibre-bin poppler-utils
          python -m pip install pillow

      - name: Download CADAL06060929 Songshi juan 69-70
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/pages evidence/contact
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/CADAL06060929%20%E5%AE%8B%E5%8F%B2%C2%B7%E5%8D%B7%E5%85%AD%E5%8D%81%E4%B9%9D~%E5%8D%B7%E4%B8%83%E5%8D%81.djvu'
          curl -L --fail --retry 3 --retry-delay 2 "$url" -o evidence/songshi_cadal06060929.djvu
          sha256sum evidence/songshi_cadal06060929.djvu | tee evidence/source.sha256
          djvused evidence/songshi_cadal06060929.djvu -e n | tee evidence/djvu-page-count.txt

      - name: Convert and render every physical page without OCR
        shell: bash
        run: |
          set -euo pipefail
          ddjvu -format=pdf evidence/songshi_cadal06060929.djvu evidence/songshi_cadal06060929.pdf
          pdfinfo evidence/songshi_cadal06060929.pdf | tee evidence/pdfinfo.txt
          pdftoppm -jpeg -jpegopt quality=94 -r 190 evidence/songshi_cadal06060929.pdf evidence/pages/page
          n=$(find evidence/pages -maxdepth 1 -name 'page-*.jpg' | wc -l)
          echo "RENDERED_PAGE_COUNT=$n" | tee evidence/render-count.txt
          test "$n" -eq 152
          sha256sum evidence/pages/*.jpg | sort -V > evidence/pages.sha256
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          pages=sorted(Path('evidence/pages').glob('page-*.jpg'), key=lambda p:int(p.stem.split('-')[-1]))
          for i in range(0,len(pages),8):
              batch=pages[i:i+8]
              thumbs=[]
              for p in batch:
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((470,740))
                  canvas=Image.new('RGB',(490,780),'white')
                  canvas.paste(im,((490-im.width)//2,28))
                  ImageDraw.Draw(canvas).text((8,6),p.name,fill='black')
                  thumbs.append(canvas)
              rows=(len(thumbs)+3)//4
              sheet=Image.new('RGB',(4*490,rows*780),'white')
              for j,im in enumerate(thumbs):
                  sheet.paste(im,((j%4)*490,(j//4)*780))
              a=i+1;b=i+len(batch)
              sheet.save(f'evidence/contact/contact-{a:03d}-{b:03d}.jpg',quality=93)
          PY
          sha256sum evidence/contact/*.jpg | sort -V > evidence/contact.sha256
          cat > evidence/manifest.txt <<'EOF'
          NO_OCR_USED_FOR_GLYPH_CLAIMS=true
          SOURCE=CADAL06060929 宋史·卷六十九~卷七十
          SOURCE_ROLE=DIRECT_PHYSICAL_COLLATION_TARGET_FOR_RECEIVED_SONGSHI_WITNESS
          DIGITAL_PROVIDER=Wikimedia Commons / CADAL / Zhejiang University
          TARGET=卷七十 律曆志 韓顯符 大中祥符三年 銅渾儀法要 二十四氣晝夜進退日出沒刻數立成之法
          DATE_FIREWALL=1010_IS_THE_RECORDED_TECHNICAL_EVENT_DATE_NOT_THE_DATE_OF_THIS_SURVIVING_PHYSICAL_OR_DIGITAL_WITNESS
          TRANSMISSION_FIREWALL=CHRONOLOGY_OR_NUMERIC_SIMILARITY_ALONE_DOES_NOT_PROVE_DIRECT_TEXTUAL_GENEALOGY_TO_MING_TABLES
          EOF

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: songshi-cadal06060929-hanxianfu-physical-facsimile
          path: evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
