name: research-kyujanggak-g894-access

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-kyujanggak-g894-access.yml"
      - "scripts/research_kyujanggak_g894_access.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install transport dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Probe Kyujanggak G894 digital-object routes
        run: |
          python scripts/research_kyujanggak_g894_access.py \
            --output artifacts/g894-access
      - name: Upload read-only access evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-g894-access-${{ github.sha }}
          path: artifacts/g894-access/
          if-no-files-found: warn
          retention-days: 7
