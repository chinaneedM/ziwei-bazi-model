name: research-wushizhai-pku-title-results-gc

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-wushizhai-pku-title-results-gc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query PKU title field with source-emitted page contract
        run: |
          set -euo pipefail
          mkdir -p artifacts/pku-title-gc
          python - <<'PY'
          from __future__ import annotations
          import http.cookiejar, hashlib, html, json, re, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          OUT=Path("artifacts/pku-title-gc")
          ORIGIN="https://ccj.pku.edu.cn"
          TERM="五石斋文史札记"
          SEARCH_PAGE=ORIGIN+"/Search/search?fd0=1&kw0="+urllib.parse.quote(TERM)
          API=ORIGIN+"/Search/SearchArticleByElasticsearch"
          UA="Mozilla/5.0 TianwenResearch/1.0"

          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

          def fetch(req):
              try:
                  with opener.open(req,timeout=30) as r:
                      b=r.read()
                      return r.status,r.geturl(),dict(r.headers),b
              except Exception as e:
                  code=getattr(e,"code",None); body=b""
                  try: body=e.read()
                  except Exception: body=repr(e).encode()
                  return code,getattr(e,"url",req.full_url),{},body

          st,final,headers,page=fetch(urllib.request.Request(SEARCH_PAGE,headers={"User-Agent":UA}))
          (OUT/"search_page.html").write_bytes(page)
          text=page.decode("utf-8","replace")
          mt=re.search(r'name="__RequestVerificationToken"[^>]*value="([^"]+)"',text)
          token=html.unescape(mt.group(1)) if mt else None

          # Verify the page itself emitted the expected title-field query item.
          mq=re.search(r'queryItem:\s*(\[[^\n;]+\])',text)
          source_query_item=None
          if mq:
              try: source_query_item=json.loads(mq.group(1))
              except Exception: pass

          pairs=[
              ("pageSize","100"),
              ("pageIndex","1"),
              ("sortType","desc"),
              ("sortField","_score"),
              ("queryItem[0][Field]","1"),
              ("queryItem[0][Desc]","Title"),
              ("queryItem[0][Type]","0"),
              ("queryItem[0][IsAccurate]","false"),
              ("queryItem[0][IsExactValue]","false"),
              ("queryItem[0][Value]",TERM),
          ]
          if token: pairs.append(("__RequestVerificationToken",token))
          body=urllib.parse.urlencode(pairs).encode()
          req=urllib.request.Request(API,data=body,method="POST",headers={
              "User-Agent":UA,
              "Content-Type":"application/x-www-form-urlencoded; charset=UTF-8",
              "Referer":SEARCH_PAGE,
              "X-Requested-With":"XMLHttpRequest",
              "Accept":"application/json, text/javascript, */*; q=0.01",
          })
          ast,afinal,ah,abody=fetch(req)
          (OUT/"search_response.json").write_bytes(abody)
          parsed=None; err=None
          try: parsed=json.loads(abody.decode("utf-8"))
          except Exception as e: err=repr(e)

          rows=[]
          if isinstance(parsed,dict):
              for key in ("list","items","rows"):
                  if isinstance(parsed.get(key),list): rows=parsed[key]; break
              if not rows and isinstance(parsed.get("data"),dict):
                  for key in ("list","items","rows"):
                      if isinstance(parsed["data"].get(key),list): rows=parsed["data"][key]; break

          def clean_title(v):
              s=html.unescape(str(v or ""))
              s=re.sub(r"<[^>]+>","",s)
              return s.replace("（","(").replace("）",")").replace(" ","").replace("\u3000","")

          exact=[]
          for row in rows:
              if not isinstance(row,dict): continue
              t=clean_title(row.get("title") or row.get("Title") or "")
              if "五石斋文史札记" in t and ("二十八" in t or "(28)" in t):
                  exact.append(row)

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]; self.text=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag in ("a","link") and d.get("href"): self.hrefs.append(d["href"])
              def handle_data(self,data):
                  if data.strip(): self.text.append(data.strip())

          details=[]
          for idx,row in enumerate(exact[:5]):
              rid=row.get("id") or row.get("Id") or row.get("articleId") or row.get("ArticleId")
              if rid is None: continue
              u=ORIGIN+"/article/info?aid="+urllib.parse.quote(str(rid),safe="")
              dst,dfinal,dh,db=fetch(urllib.request.Request(u,headers={"User-Agent":UA,"Referer":SEARCH_PAGE}))
              (OUT/f"detail_{idx:02d}.html").write_bytes(db)
              dt=db.decode("utf-8","replace"); p=P()
              try:p.feed(dt)
              except Exception:pass
              details.append({
                  "source_returned_id":rid,
                  "source_row":row,
                  "requested_url":u,
                  "status":dst,
                  "final_url":dfinal,
                  "sha256":hashlib.sha256(db).hexdigest(),
                  "bytes":len(db),
                  "contains_target_title":"五石斋文史札记" in dt,
                  "contains_121_129":("121-129" in dt or "121–129" in dt),
                  "contains_download":("download" in dt.lower() or "下载" in dt),
                  "hrefs":p.hrefs[:500],
                  "text_sample":p.text[:500],
              })

          meta={}
          if isinstance(parsed,dict):
              for k in ("total","Total","pages","Pages","pageSize","PageSize","maxPages","MaxPages"):
                  if k in parsed: meta[k]=parsed[k]

          manifest={
              "policy":{
                  "authentication_used":False,
                  "paywall_bypass_attempted":False,
                  "id_enumeration_or_guessing":False,
                  "title_query_only":True,
                  "detail_ids_followed_only_if_returned_by_official_search_endpoint":True,
              },
              "source_contract":{
                  "search_page":SEARCH_PAGE,
                  "backend":API,
                  "csrf_token_source_emitted":bool(token),
                  "source_query_item":source_query_item,
                  "source_ui_allows_page_size_100":("selectPageSize(100)" in text),
                  "request_shape":"pageSize/pageIndex/sortType/sortField/queryItem from getNewPageArticle",
              },
              "search_page":{"status":st,"final_url":final,"sha256":hashlib.sha256(page).hexdigest(),"bytes":len(page)},
              "backend_response":{"status":ast,"final_url":afinal,"sha256":hashlib.sha256(abody).hexdigest(),"bytes":len(abody),"json_parsed":parsed is not None,"parse_error":err,"meta":meta},
              "result_row_count":len(rows),
              "result_rows":rows,
              "installment_28_match_count":len(exact),
              "installment_28_matches":exact,
              "details":details,
          }
          (OUT/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wushizhai-pku-title-results-gc
          path: artifacts/pku-title-gc
          if-no-files-found: error
