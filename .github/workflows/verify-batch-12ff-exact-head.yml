name: verify-batch-12ff-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ff-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FF continuity and genealogy
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("docs/research/ZIWEI-NLC-OPAC-ZHUNZHAI-MICROFILM-SOURCE-CROSSBINDING-R1.json").read_text(encoding="utf-8"))
          assert evidence["batch_id"] == "BATCH-12-ZIWEI-NLC-OPAC-ZHUNZHAI-MICROFILM-SOURCE-CROSSBINDING-FF"
          assert evidence["object_binding_adjudication"]["official_copper_zhunzhai_one_volume_binding_closed"] is True
          assert evidence["identifier_adjudication"]["unique_physical_call_number_proved"] is False
          assert evidence["chronology_and_rule_firewall"]["direct_sanming_parent_vote_increment"] == 0

          state = json.loads(Path("docs/PROJECT-CURRENT-STATE-R1.json").read_text(encoding="utf-8"))
          assert state["historical_audit"]["latest_batch_doc"].endswith("NLC-OPAC-ZHUNZHAI-MICROFILM-SOURCE-CROSSBINDING-FF.md")
          assert state["invariants"]["deterministic_fusion_chart_product_r1"] == "CLOSED"
          PY

# rerun-after-12fb-forward-only-verifier-repair
