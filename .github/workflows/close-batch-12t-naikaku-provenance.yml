name: close-batch-12t-naikaku-provenance

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/close-batch-12t-naikaku-provenance.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0
      - name: Refuse stale trigger
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/fusion-chart-core-r1-20260822
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/fusion-chart-core-r1-20260822)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply Batch 12T
        run: python scripts/close-batch-12t-naikaku-provenance.py
      - name: Run focused gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python -m unittest discover -s tests -p 'test_fusion_chart_historical_provenance_audit_matrix_r1.py' -v
      - name: Commit and push atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Research Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/close-batch-12t-naikaku-provenance.py .github/workflows/close-batch-12t-naikaku-provenance.yml
          git add README.md docs scripts/verify-project-continuity-state-r1.py
          git diff --cached --check
          git commit -m 'close Naikaku Nanyangtang provenance bridge batch 12T'
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
