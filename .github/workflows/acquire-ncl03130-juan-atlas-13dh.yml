name: acquire-ncl03130-juan-boundary-atlas-13dh
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - "scripts/acquire-ncl03130-juan-atlas-13dh.py"
      - ".github/workflows/acquire-ncl03130-juan-atlas-13dh.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ncl-public-mirror-juan-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: [8, 9, 10, 11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image tooling without OCR
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<1.28" "Pillow>=10,<12" requests
      - name: Capture SHA-bound bounded PDF-part page atlas
        env:
          NCL13DH_PART: ${{ matrix.part }}
        run: python scripts/acquire-ncl03130-juan-atlas-13dh.py
      - name: Preserve original page-map and image provenance or access boundary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncl03130-13dh-juan-atlas-part${{ matrix.part }}
          path: ncl03130-13dh-part*/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
