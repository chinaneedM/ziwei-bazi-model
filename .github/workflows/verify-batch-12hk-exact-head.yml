name: verify-batch-12hk-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hk-exact-head.yml
      - .github/workflows/verify-batch-12hj-exact-head.yml
      - docs/research/ZIWEI-NLC-ZUOZHUAN-412004000069-TIEQIN-YUAN-IDENTITY-BIFURCATION-FIREWALL-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-412004000069-TIEQIN-YUAN-IDENTITY-BIFURCATION-FIREWALL-HK.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HK exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-NLC-ZUOZHUAN-412004000069-TIEQIN-YUAN-IDENTITY-BIFURCATION-FIREWALL-HK'
          e=json.loads(Path('docs/research/ZIWEI-NLC-ZUOZHUAN-412004000069-TIEQIN-YUAN-IDENTITY-BIFURCATION-FIREWALL-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          d=e['nlc_digital_object']
          assert d['nlc_fid']=='412004000069'
          assert d['public_backup_book_count_display']==15
          assert d['observed_book1_description']==['卷首','卷第一','卷第二']
          assert d['observed_book15_description']==['卷第二十八','卷第二十九']
          t=e['nlc_tieqin_yuan_research_control']
          assert t['tieqin_tongjian_lou_old_collection'] is True
          assert t['prior_catalog_classification']=='元刻明修本'
          assert t['revised_physical_adjudication']=='元刻元印十行本'
          i=e['identity_bifurcation_adjudication']
          assert i['fid_412004000069_equals_zhang_tieqin_yuan_copy']=='NOT_PROVED'
          assert i['physical_distinctness_between_the_two_descriptions']=='UNRESOLVED'
          assert i['same_object_collapse_authorized'] is False
          assert i['hj_named_song_print_member_equals_fid_412004000069']=='UNRESOLVED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,223,0)
          assert bid in state['historical_audit']['completed_batches']
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-NLC-DIGITAL-ZUOZHUAN-412004000069-COMMONS-BACKUP']['batch_12hk']['nlc_fid']=='412004000069'
          assert src['EXT-NOPSS-ZHANG-LIJUAN-NLC-TIEQIN-YUAN-ZUOZHUAN']['batch_12hk']['revised_physical_adjudication']=='元刻元印十行本'
          assert src['EXT-TIEQIN-CATALOG-ZUOZHUAN-60-BAISONG-FINGERPRINT-SHIDIAN']['batch_12hk']['old_provenance']=='旧藏黄氏百宋一廛'
          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['transmission_impact']['same_object_edge_authorized'] is False
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          PY
