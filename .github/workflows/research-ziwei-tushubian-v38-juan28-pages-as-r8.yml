name: research-ziwei-tushubian-v38-juan28-pages-as-r8

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-tushubian-v38-juan28-pages-as-r8.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Render Juan 28 page window
        shell: python
        run: |
          import hashlib, json, urllib.parse, urllib.request
          from pathlib import Path
          import fitz

          out=Path('batch12as-r8'); out.mkdir(exist_ok=True)

          def get_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          q='intitle:"圖書編 v.38.pdf"'
          s='https://commons.wikimedia.org/w/api.php?action=query&format=json&list=search&srnamespace=6&srlimit=50&srsearch='+urllib.parse.quote(q)
          titles=[x.get('title') for x in get_json(s).get('query',{}).get('search',[])]
          selected=next((t for t in titles if 'Harvard' in t and '圖書編' in t and 'v.38.pdf' in t),None)
          if not selected: raise SystemExit('target not resolved')
          u='https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo&iiprop=url%7Csize%7Csha1&titles='+urllib.parse.quote(selected)
          page=next(iter(get_json(u).get('query',{}).get('pages',{}).values()))
          info=(page.get('imageinfo') or [None])[0]
          if not info or not info.get('url'): raise SystemExit('no pdf url')
          pdf=out/'v38.pdf'
          req=urllib.request.Request(info['url'],headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=180) as r: pdf.write_bytes(r.read())
          doc=fitz.open(str(pdf))
          rendered=[]
          for p1 in range(3,35):
              if p1>len(doc): break
              pix=doc[p1-1].get_pixmap(matrix=fitz.Matrix(1.45,1.45),alpha=False)
              fn=f'page-{p1:03d}.png'; pix.save(str(out/fn))
              rendered.append({'page':p1,'file':fn,'sha256':hashlib.sha256((out/fn).read_bytes()).hexdigest()})
          receipt={
              'scope':'BATCH12AS_R8_V38_INTERNAL_JUAN28_FULL_RESOLUTION_WINDOW',
              'selected_title':selected,
              'pdf_sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),
              'page_count':len(doc),
              'rendered_pages':rendered,
              'juan28_window_basis':'MANUAL_VISUAL_R7_P3_STARTS_JUAN28_AND_P34_SHOWS_JUAN29_BOUNDARY',
              'ocr_generated':False,
              'manual_visual_review_required':True,
              'runtime_standard_selected':False,
              'algorithm_reopen_authorized':False,
          }
          (out/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n','utf-8')
          pdf.unlink()

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-tushubian-v38-juan28-pages-as-r8
          path: batch12as-r8
          retention-days: 90
