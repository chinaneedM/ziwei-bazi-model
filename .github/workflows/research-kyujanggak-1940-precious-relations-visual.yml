name: research-kyujanggak-1940-precious-relations-visual

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1940-precious-relations-visual.yml"
      - "scripts/research_kyujanggak_1940_precious_relations_visual.py"

permissions:
  contents: read

jobs:
  visual:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 1, end: 50 }
          - { start: 51, end: 100 }
          - { start: 101, end: 148 }
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi pillow
      - name: Build direct no-OCR contact sheets
        run: |
          python scripts/research_kyujanggak_1940_precious_relations_visual.py \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --output "artifacts/kyujanggak-1940-precious-${{ matrix.start }}-${{ matrix.end }}"
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1940-precious-${{ matrix.start }}-${{ matrix.end }}-${{ github.sha }}
          path: artifacts/kyujanggak-1940-precious-${{ matrix.start }}-${{ matrix.end }}/
          if-no-files-found: warn
          retention-days: 7
