name: probe-batch-12jc-cnbksy-public-search-contract
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12jc-cnbksy-public-search-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe documented public CNBKSY entry surfaces
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          UA = "Mozilla/5.0 (compatible; TianwenHistoricalAudit/1.0; +https://github.com/chinaneedM/ziwei-bazi-model)"
          entries = [
              "https://www.cnbksy.com/",
              "https://www.cnbksy.com/home",
              "https://www.cnbksy.com/v1",
          ]

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read(2_000_000)
                      return {
                          "status": resp.status,
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("Content-Type"),
                          "body": body.decode("utf-8", errors="replace"),
                      }
              except urllib.error.HTTPError as e:
                  body = e.read(2_000_000)
                  return {
                      "status": e.code,
                      "final_url": e.geturl(),
                      "content_type": e.headers.get("Content-Type"),
                      "body": body.decode("utf-8", errors="replace"),
                  }
              except Exception as e:
                  return {
                      "status": None,
                      "final_url": url,
                      "content_type": None,
                      "body": "",
                      "error": f"{type(e).__name__}: {e}",
                  }

          def classify_forms(base_url, body):
              forms=[]
              for m in re.finditer(r"<form\b([^>]*)>(.*?)</form>", body, re.I|re.S):
                  attrs=m.group(1)
                  inner=m.group(2)
                  am=re.search(r'action=["\']([^"\']*)["\']', attrs, re.I)
                  mm=re.search(r'method=["\']([^"\']*)["\']', attrs, re.I)
                  action=urljoin(base_url, html.unescape(am.group(1))) if am else base_url
                  method=(mm.group(1).upper() if mm else "GET")
                  inputs=[]
                  for im in re.finditer(r"<input\b([^>]*)>", inner, re.I|re.S):
                      ia=im.group(1)
                      nm=re.search(r'name=["\']([^"\']+)["\']', ia, re.I)
                      tm=re.search(r'type=["\']([^"\']+)["\']', ia, re.I)
                      vm=re.search(r'value=["\']([^"\']*)["\']', ia, re.I)
                      if nm:
                          inputs.append({
                              "name": html.unescape(nm.group(1)),
                              "type": (tm.group(1).lower() if tm else "text"),
                              "value_present": vm is not None,
                          })
                  forms.append({
                      "action": action,
                      "method": method,
                      "same_host": urlparse(action).hostname in {"www.cnbksy.com","cnbksy.com"},
                      "inputs": inputs,
                  })
              return forms

          def source_links(base_url, body):
              out=[]
              for href in re.findall(r'href=["\']([^"\']+)["\']', body, re.I):
                  u=urljoin(base_url, html.unescape(href))
                  if urlparse(u).hostname in {"www.cnbksy.com","cnbksy.com"}:
                      low=u.lower()
                      if any(k in low for k in ("search","query","index","period","newspaper","paper","article","home")):
                          out.append(u)
              return sorted(set(out))[:100]

          out=Path("artifacts/batch-12jc")
          out.mkdir(parents=True, exist_ok=True)
          results=[]
          for idx,url in enumerate(entries):
              r=get(url)
              body=r.pop("body")
              rec={
                  "requested_url": url,
                  **r,
                  "body_bytes_utf8": len(body.encode("utf-8")),
                  "title": (re.search(r"<title[^>]*>(.*?)</title>", body, re.I|re.S).group(1).strip()
                            if re.search(r"<title[^>]*>(.*?)</title>", body, re.I|re.S) else None),
                  "forms": classify_forms(r.get("final_url") or url, body),
                  "source_emitted_candidate_links": source_links(r.get("final_url") or url, body),
                  "target_title_literal_present": "永乐大典展览的意义" in body or "永樂大典展覽的意義" in body,
                  "target_author_literal_present": "赵万里" in body or "趙萬里" in body,
                  "login_terms_present": any(x in body for x in ("登录","登入","login","Login")),
                  "ip_access_terms_present": any(x in body for x in ("IP","ip地址","校园网","机构用户","访问权限")),
              }
              results.append(rec)
              (out/f"entry-{idx}.html").write_text(body,encoding="utf-8")

          # This probe deliberately does not submit any form. It only determines whether
          # a public, source-emitted search contract exists before any target query is sent.
          result={
              "probe":"BATCH-12JC-CNBKSY-PUBLIC-SEARCH-CONTRACT",
              "documented_entry_urls":entries,
              "results":results,
              "target_query_submitted":False,
              "login_used":False,
              "account_action_used":False,
              "subscription_or_ip_bypass_used":False,
              "guessed_api_endpoint_used":False,
              "followup_rule":"Only submit target terms in a later probe if a public source-emitted search form/link contract is observed.",
          }
          (out/"probe.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12jc-cnbksy-public-search-contract
          path: artifacts/batch-12jc
          if-no-files-found: error
