name: audit-leibian-jiajing30-1551-target-pages-highres

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-leibian-jiajing30-1551-target-pages-highres.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Lock 1551 Leibian identity and day-night target pages
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/leibian-jiajing30-1551-target-pages-highres'
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-411999026677-72517_%E9%A1%9E%E7%B7%A8%E6%9B%86%E6%B3%95%E9%80%9A%E6%9B%B8%E5%A4%A7%E5%85%A8_%E7%AC%AC1%E5%86%8A.pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"

          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source.sha256"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"

          for p in 14 17 20 21; do
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 360 "$ROOT/source.pdf" "$ROOT/page-$p"
          done
          sha256sum "$ROOT"/page-*.png | sort -V | tee "$ROOT/pages.sha256"

          printf '%s\n'             'SOURCE=NLC892-411999026677-72517 類編曆法通書大全 第1冊'             'SET_ID=411999026677'             'BIBLIOGRAPHIC_PUBLICATION_CONTROL=劉釪明嘉靖30年[1551]; 刻本 遞修本; 存28卷1-28'             'P14_ROLE=work/table-of-contents identity and internal structural control'             'P17_ROLE=time-measurement section transition/control'             'P20_ROLE=四時加減晝夜節氣 target table including winter/spring Dahan-Yushui ranges'             'P21_ROLE=continuation/context control after the target table'             'QUESTION=Does this 1551 physical edition preserve the 38/62 fine branch, and do Dahan/Yushui rows reproduce the direct 12DE mismatch against Sanming/Yueling?'             'RENDER_DPI=360'             'OCR_USED_FOR_FINAL_GLYPH_CLAIMS=false'             > "$ROOT/manifest.txt"

          rm "$ROOT/source.pdf"

      - name: Upload high-resolution target evidence
        uses: actions/upload-artifact@v4
        with:
          name: leibian-jiajing30-1551-target-pages-highres
          path: audit/leibian-jiajing30-1551-target-pages-highres/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
