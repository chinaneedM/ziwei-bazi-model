name: verify-yehuobian-12wb-wenzhou-secondary-holding-scope
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12wb-wenzhou-secondary-holding-scope.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12WB-*
      - scripts/verify-yehuobian-wenzhou-holding-lead-12wb.py
      - tests/test_yehuobian_wenzhou_holding_lead_12wb.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Registry continuity and source-scope regression
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-wenzhou-holding-lead-12wb.py
          python -m unittest discover -s tests -p 'test_yehuobian_wenzhou_holding_lead_12wb.py' -v
