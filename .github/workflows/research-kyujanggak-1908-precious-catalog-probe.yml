name: research-kyujanggak-1908-precious-catalog-probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1908-precious-catalog-probe.yml"
      - "scripts/research_kyujanggak_1908_precious_catalog_probe.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Probe 1908 precious-book catalog
        run: |
          python scripts/research_kyujanggak_1908_precious_catalog_probe.py \
            --output artifacts/kyujanggak-1908-precious-catalog
      - name: Upload 1908 catalog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1908-precious-catalog-${{ github.sha }}
          path: artifacts/kyujanggak-1908-precious-catalog/
          if-no-files-found: warn
          retention-days: 7
