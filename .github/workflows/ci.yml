name: clean-training-system

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: ./scripts/bootstrap-work-env.sh --check
      - run: python scripts/check-no-github-credentials.py
      - run: fortune-train verify
      - run: python -m unittest discover -s tests -v
