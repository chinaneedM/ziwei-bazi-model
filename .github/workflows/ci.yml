name: clean-training-system

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e . 'Pillow>=10,<12'
      - name: Work environment bootstrap check
        run: ./scripts/bootstrap-work-env.sh --check
      - name: GitHub credential safety gate
        run: python scripts/check-no-github-credentials.py
      - name: Fusion Chart Product R1 machine gate
        run: python scripts/verify-fusion-chart-product-r1.py
      - name: Fusion Chart Capability & Performance R1 machine gate
        run: python scripts/verify-fusion-chart-capability-performance-r1.py
      - name: Fusion Chart Historical Provenance Audit R1 machine gate
        run: python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
      - name: Project continuity state R1 machine gate
        run: python scripts/verify-project-continuity-state-r1.py
      - name: Research omission continuity review R1 gate
        run: python scripts/verify-research-omission-risk-ledger-r1.py
      - name: G893 12XW provenance research live-stage gate
        run: |
          python scripts/verify-g893-cross-ledger-live-stage-12xw.py
          python -m unittest discover -s tests -p 'test_g893_cross_ledger_live_stage_12xw.py' -v
      - name: G893 12XX source original L124 field / forward-only gate
        run: |
          python scripts/verify-g893-l124-live-stage-r1.py
          python -m unittest discover -s tests -p 'test_g893_l124_live_stage_r1.py' -v
      - name: G893 12XY original neighbor-column provenance / non-adjudication gate
        run: |
          python scripts/verify-g893-l101-d16-neighbor-scope-12xy.py
          python -m unittest discover -s tests -p 'test_g893_l101_d16_neighbor_scope_12xy.py' -v
      - name: G893 12XZ L101 direct original field and zero-place source gate
        run: |
          python scripts/verify-g893-l101-direct-field-12xz.py
          python -m unittest discover -s tests -p 'test_g893_l101_direct_field_12xz.py' -v
      - name: G893 12YA solar D16 source print vs external arithmetic gate
        run: |
          python scripts/verify-g893-d16-solar-scope-12ya.py
          python -m unittest discover -s tests -p 'test_g893_d16_solar_scope_12ya.py' -v
      - name: G893 12YB L35/L159 same-original loss-gain polarity boundary
        run: |
          python scripts/verify-g893-symmetric-polarity-12yb.py
          python -m unittest discover -s tests -p 'test_g893_symmetric_polarity_12yb.py' -v
      - name: G893 12YC same-original four-row complete printed glyph pair gate
        run: |
          python scripts/verify-g893-symmetric-original-pairs-12yc.py
          python -m unittest discover -s tests -p 'test_g893_symmetric_original_pairs_12yc.py' -v
      - name: G893 12YD D15-D17 original short printed solar lane scope gate
        run: |
          python scripts/verify-g893-solar-original-short-lane-12yd.py
          python -m unittest discover -s tests -p 'test_g893_solar_original_short_lane_12yd.py' -v
      - name: G893 12YE archival false precision retained and 12YF retraction gate
        run: |
          python scripts/verify-g893-solar-eight-place-12ye.py
          python -m unittest discover -s tests -p 'test_g893_solar_eight_place_12ye.py' -v
      - name: G893 12YF archived numeric error preserved and 12YG retraction gate
        run: |
          python scripts/verify-g893-dual-column-erratum-12yf.py
          python -m unittest discover -s tests -p 'test_g893_dual_column_erratum_12yf.py' -v
      - name: G893 12YG direct original seven-day subtractive table and second historical erratum gate
        run: |
          python scripts/verify-g893-solar-seven-day-original-12yg.py
          python -m unittest discover -s tests -p 'test_g893_solar_seven_day_original_12yg.py' -v
      - name: G893 12YH original D21-D25 cross-folio source print and five exact Decimal edges gate
        run: |
          python scripts/verify-g893-solar-d21-d25-original-12yh.py
          python -m unittest discover -s tests -p 'test_g893_solar_d21_d25_original_12yh.py' -v
      - name: G893 12YI original D26-D30 same-folio glyph and Decimal recurrence gate
        run: |
          python scripts/verify-g893-solar-d26-d30-original-12yi.py
          python -m unittest discover -s tests -p 'test_g893_solar_d26_d30_original_12yi.py' -v
      - name: G893 12YJ original header versus received textual arithmetic and unit-scope gate
        run: |
          python scripts/verify-g893-header-mingshi-received-arithmetic-12yj.py
          python -m unittest discover -s tests -p 'test_g893_header_mingshi_received_arithmetic_12yj.py' -v
      - name: G893 12YK MingShi Siku received two-locus arithmetic and physical-copy firewall
        run: |
          python scripts/verify-g893-mingshi-siku-dual-locus-12yk.py
          python -m unittest discover -s tests -p 'test_g893_mingshi_siku_dual_locus_12yk.py' -v
      - name: MingShi 12YL exact CADAL 168-page bibliographic source-route nonpromotion gate
        run: |
          python scripts/verify-mingshi-cadal-12yl-bibliography.py
          python -m unittest discover -s tests -p 'test_mingshi_cadal_source_route_12yl.py' -v
      - name: MingShi 12YM exact scanned-original two-locus glyph conflict and source-pixel scope gate
        run: |
          python scripts/verify-mingshi-cadal-12ym-original-dual-locus.py
          python -m unittest discover -s tests -p 'test_mingshi_cadal_original_dual_locus_12ym.py' -v
      - name: MingShi 12YN second original NLC lithograph two-locus disjoint pixel and recension gate
        run: |
          python scripts/verify-mingshi-nlc1892-two-originals-12yn.py
          python -m unittest discover -s tests -p 'test_mingshi_nlc1892_two_originals_12yn.py' -v
      - name: Mei 12YO volume3 original facsimile route and catalog-only evidence firewall
        run: |
          python scripts/verify-mei-lizhi-12yo-facsimile-locator.py
          python -m unittest discover -s tests -p 'test_mei_lizhi_12yo_facsimile_locator.py' -v
      - name: Mei 12YP cross-juan received numeric roles and physical-original firewall
        run: |
          python scripts/verify-mei-v3-v4-received-field-12yp.py
          python -m unittest discover -s tests -p 'test_mei_v3_v4_received_field_12yp.py' -v
      - name: Historical source registry extension integrity gate
        run: |
          python scripts/verify-historical-source-registry-extensions-r1.py
          python -m unittest discover -s tests -p 'test_historical_source_registry_extensions_r1.py' -v
      - name: Focused historical provenance audit tests
        run: |
          python -m unittest discover -s tests -p "test_fusion_chart_historical_provenance_audit_matrix_r1.py" -v
          python -m unittest discover -s tests -p "test_ziwei_jielan_1581_historical_candidates_r1.py" -v
          python -m unittest discover -s tests -p "test_historical_calendar_adapter_contract_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1578_month_start_oracle_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1578_d1_source_replay_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1578_ncl_06313_physical_almanac_collation_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1569_qishuo_method_research_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1569_interpolation_replay_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1569_chiji_day_rate_column_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1569_chiji_central_transition_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1569_chiji_full_numeric_reconstruction_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1569_lunar_chiji_primary_collation_ledger_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1569_lunar_xingdu_primary_collation_ledger_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1569_cross_edition_variant_ledger_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1569_yingsuo_full_numeric_reconstruction_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1569_solar_primary_collation_ledger_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_1569_time_coordinate_r1.py" -v
          python -m unittest discover -s tests -p "test_ming_datong_qishuo_geographic_critical_cases_r1.py" -v
      - name: NLC old20 exact-source-page graded union gates
        run: |
          python scripts/verify_yehuobian_nlc_f1_f5_union_12rw.py
          python scripts/verify_yehuobian_nlc_all1030_union_12rx.py
          python -m unittest discover -s tests -p "test_yehuobian_nlc_f1_f5_union_12rw.py" -v
          python -m unittest discover -s tests -p "test_yehuobian_nlc_all1030_union_12rx.py" -v
      - name: NLC old20 F6 native original source p1-20 gate
        run: |
          python scripts/verify_yehuobian_nlc_f6_p1_20_native_12ry.py
          python -m unittest discover -s tests -p "test_yehuobian_nlc_f6_p1_20_native_12ry.py" -v
      - name: NLC old20 F6 native original source p21-40 gate
        run: |
          python scripts/verify_yehuobian_nlc_f6_p21_40_native_12rz.py
          python -m unittest discover -s tests -p "test_yehuobian_nlc_f6_p21_40_native_12rz.py" -v
      - name: NLC old20 F6 source p41-80 native bounded replay gate
        run: |
          python scripts/verify_yehuobian_nlc_f6_p41_80_native_12sa.py
          python -m unittest discover -s tests -p "test_yehuobian_nlc_f6_p41_80_native_12sa.py" -v
      - name: NLC old20 F6 full116 original source page closure gate
        run: |
          python scripts/verify_yehuobian_nlc_f6_all116_native_12sb.py
          python -m unittest discover -s tests -p 'test_yehuobian_nlc_f6_all116_native_12sb.py' -v
      - name: NLC old20 F7 p21-60 original source bounded review gate
        run: |
          python scripts/verify_yehuobian_nlc_f7_p21_60_native_12sc.py
          python -m unittest discover -s tests -p 'test_yehuobian_nlc_f7_p21_60_native_12sc.py' -v
      - name: NLC old20 F7 full110 original-source bounded page gate
        run: |
          python scripts/verify_yehuobian_nlc_f7_all110_native_12sd.py
          python -m unittest discover -s tests -p 'test_yehuobian_nlc_f7_all110_native_12sd.py' -v
      - name: NLC old20 F8 all87 original-source bounded identity gate
        run: |
          python scripts/verify_yehuobian_nlc_f8_all87_native_12se.py
          python -m unittest discover -s tests -p 'test_yehuobian_nlc_f8_all87_native_12se.py' -v
      - name: NLC old20 F9 p1-80 native source SHA-grade gate
        run: |
          python scripts/verify_yehuobian_nlc_f9_p1_80_native_12sf.py
          python -m unittest discover -s tests -p 'test_yehuobian_nlc_f9_p1_80_native_12sf.py' -v
      - name: NLC old20 F9 all141 original source page grade and crossleaf gate
        run: |
          python scripts/verify_yehuobian_nlc_f9_all141_native_12sg.py
          python -m unittest discover -s tests -p 'test_yehuobian_nlc_f9_all141_native_12sg.py' -v
      - name: NLC old20 F10 all145 source-JPEG bounded coverage and chain gate
        run: |
          python scripts/verify_yehuobian_nlc_f10_all145_native_12sh.py
          python -m unittest discover -s tests -p 'test_yehuobian_nlc_f10_all145_native_12sh.py' -v
      - name: Focused capability acceptance tests
        run: |
          python -m unittest discover -s tests -p "test_fusion_chart_capability_acceptance_r1.py" -v
          python -m unittest discover -s tests -p "test_fusion_chart_temporal_torture_r1.py" -v
          python -m unittest discover -s tests -p "test_fusion_chart_reference_diff_framework_r1.py" -v
          python -m unittest discover -s tests -p "test_fusion_chart_acceptance_metrics_r1.py" -v
      - name: Focused desktop acceptance tests
        run: |
          python -m unittest discover -s tests -p "test_windows_portable_desktop_launcher_r1.py" -v
          python -m unittest discover -s tests -p "test_windows_verified_auto_update_r1.py" -v
          python -m unittest discover -s tests -p "test_fusion_chart_desktop_product_shell_r1.py" -v
          python -m unittest discover -s tests -p "test_combined_workbench_real_machine_calibration_r1.py" -v
          python -m unittest discover -s tests -p "test_real_machine_calibration_regression_closure_r1.py" -v
          python -m unittest discover -s tests -p "test_windows_platform_calibration_evidence_r1.py" -v
      - name: Verify
        run: fortune-train verify
      - name: Full unittest
        run: python -m unittest discover -s tests -v
      - name: Workbench smoke
        run: python scripts/combined-workbench-smoke.py
      - name: Workbench HTTP smoke
        run: python scripts/combined-workbench-http-smoke.py
