name: verify-xuxiu1174-source-loci-exact-head-r1
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-xuxiu1174-source-loci-exact-head-r1.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-SOURCE-REGISTRY-EXTENSIONS-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12ST-XUXIU-1174-PUBLIC-SOURCE-SHARD-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UC-XUXIU1174-DIRECT-THREE-LOCI-AND-SEAM-GATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UD-XUXIU1174-FOUR-LOCI-SEAM-CORRECTION-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UE-XUXIU1174-SAME-SOURCE-GLYPH-MISREAD-REPAIR-R1.json
      - tests/test_yehuobian_xuxiu1174_same_source_correction_12ue.py
      - docs/research/MING-DATONG-YEHUOBIAN-12UF-SOURCE-READING-CONTROL-AND-IMPRESSION-GATES-R1.json
      - tests/test_yehuobian_xuxiu1174_controlling_witness_12uf.py
      - tests/test_yehuobian_xuxiu1174_canonical_url_correction_12su.py
      - tests/test_yehuobian_xuxiu1174_archive_route_12tt.py
      - tests/test_yehuobian_xuxiu1174_mirror_dedupe_12tu.py
      - tests/test_yehuobian_xuxiu1174_source_glyph_scope_12uc.py
      - tests/test_yehuobian_xuxiu1174_four_loci_seam_12ud.py
      - docs/research/MING-DATONG-YEHUOBIAN-12UG-NAJ3080212-DIGITIZATION-PLAN-AND-TARGET-ACCESS-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UG-NAJ-DIGITIZATION-PLAN-SOURCE-SHARD-R1.json
      - tests/test_yehuobian_naj_plan_scope_12ug.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source registry, genealogy and continuity
        run: |
          set -euo pipefail
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Regression historical evidence must be append-safe
        run: |
          python -m unittest discover -s tests -p 'test_yehuobian_xuxiu1174_*.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_naj_plan_scope_12ug.py' -v
