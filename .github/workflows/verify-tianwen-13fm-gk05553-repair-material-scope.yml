name: verify-tianwen-13fm-gk05553-repair-material-scope
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - docs/research/TIANWEN-13FM-GK05553-REPLACEMENT-MATERIAL-AND-ORDINAL-TRIPLE-SOURCE-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - scripts/verify-tianwen-13fm-gk05553-repair-material-scope.py
      - scripts/verify-tianwen-13fl-gk05553-repair-ordinal-scope.py
      - scripts/verify-tianwen-13fk-ncl-fourfen-p74-crossphoto.py
      - tests/test_verify_tianwen_13fm_gk05553_repair_material_scope.py
      - .github/workflows/verify-tianwen-13fm-gk05553-repair-material-scope.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstparty-material-and-ordinal-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record exact HEAD and tree
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Source-scope and negative-replay gate
        run: |
          python -m py_compile scripts/verify-tianwen-13fm-gk05553-repair-material-scope.py tests/test_verify_tianwen_13fm_gk05553_repair_material_scope.py
          python scripts/verify-tianwen-13fm-gk05553-repair-material-scope.py
          python -m unittest discover -s tests -p 'test_verify_tianwen_13fm_gk05553_repair_material_scope.py' -v
      - name: Archived 13FL / 13FK continuity
        run: |
          python scripts/verify-tianwen-13fl-gk05553-repair-ordinal-scope.py
          python -m unittest discover -s tests -p 'test_verify_tianwen_13fl_gk05553_repair_ordinal_scope.py' -v
          python scripts/verify-tianwen-13fk-ncl-fourfen-p74-crossphoto.py
          python -m unittest discover -s tests -p 'test_verify_tianwen_13fk_ncl_fourfen_p74_crossphoto.py' -v
