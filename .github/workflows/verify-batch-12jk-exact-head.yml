name: verify-batch-12jk-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12jk-exact-head.yml
      - .github/workflows/probe-batch-12jk-nlc-review-wenwu-wenhui-bibliographic-tension.yml
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-ZHAO-WANLI-WENWU-WENHUI-BIBLIOGRAPHIC-TENSION-JK.md
      - docs/research/ZIWEI-ZHAO-WANLI-WENWU-WENHUI-BIBLIOGRAPHIC-TENSION-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending JK status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'tianwen/batch-12jk-exact-head', description: 'Batch 12JK exact-head verification running'})
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12JK exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-ZHAO-WANLI-WENWU-WENHUI-BIBLIOGRAPHIC-TENSION-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-ZHAO-WANLI-WENWU-WENHUI-BIBLIOGRAPHIC-TENSION-JK'
          assert e['controlling_probe']['workflow_run_id']==36829969296
          assert e['controlling_probe']['artifact_id']==11147240797
          o=e['official_nlc_review']
          assert o['sha256']=='08bf6adcf9a2d200128a80b26156f9de06731094426a116c44ae02386822af20'
          assert o['pdf_pages']==17
          assert o['target_pdf_page']==5
          assert o['target_bibliographic_bundle']['bundle_closed'] is True
          assert o['target_page_wenhui_present'] is False
          assert o['omission_is_negative_wenhui_evidence'] is False
          a=e['adjudication']
          assert a['wenwu_issue9_bibliographic_carrier']=='CLOSED_AT_OFFICIAL_MODERN_SCHOLARLY_REVIEW_LEVEL'
          assert a['direct_wenwu_issue9_pp221_233']=='NOT_REVIEWED'
          assert a['wanhui_1951_08_18_publication']=='SECONDARY_LEAD_UNVERIFIED_BY_PRIMARY_PAGE'
          assert a['first_publication_status']=='UNRESOLVED'
          assert a['relationship_wenhui_to_wenwu_issue9']=='UNRESOLVED'
          assert a['no_winner_selected'] is True
          assert e['transmission_impact']['status']=='UNRESOLVED_QUESTION_ONLY'
          assert e['transmission_impact']['graph_change'] is False
          assert e['project_consequence']['product_change'] is False
          PY
      - name: Publish success JK status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'success', context: 'tianwen/batch-12jk-exact-head', description: 'Batch 12JK exact-head verification passed'})
      - name: Publish failure JK status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'failure', context: 'tianwen/batch-12jk-exact-head', description: 'Batch 12JK exact-head verification failed'})
