name: research-ziwei-zhangguo-aw-r5-jangseogak-image-api

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-zhangguo-aw-r5-jangseogak-image-api.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Query documented public Jangseogak image API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import json, urllib.parse, urllib.request, hashlib, pathlib
          base='https://jsg.aks.ac.kr/jsgimg/api/search'
          queries=[
            ('tit','新編評註通玄先生張果星宗大全','title-exact'),
            ('tit','張果星宗','title-short'),
            ('bookId','C9A-20','call-C9A-20'),
            ('bookId','PC9A-20','call-PC9A-20'),
          ]
          summary={'batch':'12AW','provider':'Jangseogak','record':'LIB_169178','documented_api':base,'queries':[]}
          for cond,q,label in queries:
            params=urllib.parse.urlencode({'qCond':cond,'q':q,'startIndex':0,'pageUnit':100})
            url=base+'?'+params
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Batch12AW-R5 research'})
            try:
              with urllib.request.urlopen(req,timeout=90) as r:
                body=r.read(); status=r.status; ctype=r.headers.get('Content-Type','')
              pathlib.Path(f'evidence/{label}.json').write_bytes(body)
              try: data=json.loads(body.decode('utf-8-sig'))
              except Exception: data={}
              header=data.get('header') or {}
              results=data.get('results') or []
              summary['queries'].append({'label':label,'qCond':cond,'q':q,'url':url,'http_status':status,'content_type':ctype,'sha256':hashlib.sha256(body).hexdigest(),'totalCount':header.get('totalCount'),'result_count':len(results),'first_results':results[:5]})
            except Exception as e:
              summary['queries'].append({'label':label,'qCond':cond,'q':q,'url':url,'error':repr(e)})
          pathlib.Path('evidence/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Upload Batch 12AW R5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-zhangguo-aw-r5-jangseogak-image-api
          path: evidence
          if-no-files-found: error
