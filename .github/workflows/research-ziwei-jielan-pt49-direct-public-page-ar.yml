name: research-ziwei-jielan-pt49-direct-public-page-ar

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-jielan-pt49-direct-public-page-ar.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Follow source-emitted PT49 through standard public page route
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          out=Path("batch12ar"); out.mkdir(exist_ok=True)
          vid="rZRcCwAAQBAJ"

          def get(url,name):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read(); status=r.status; final=r.geturl(); ctype=r.headers.get("Content-Type")
              except Exception as e:
                  return {"url":url,"error":repr(e)}
              (out/name).write_bytes(data)
              return {"url":url,"final_url":final,"http_status":status,"content_type":ctype,
                      "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}

          receipt={
              "scope":"SOURCE_EMITTED_PT49_ID_TO_STANDARD_PUBLIC_GOOGLE_BOOKS_PAGE_ONLY",
              "access_control_bypass_attempted":False,
              "hidden_id_guessed":False,
              "signature_forged_or_reused":False,
              "volume_id":vid,
              "search":{},
              "page_requests":[],
              "pt49_source_emitted_signed_image_urls":[],
              "pt49_images":[]
          }

          term="陰雨"
          search_url="https://books.google.com/books?jscmd=SearchWithinVolume2&q="+urllib.parse.quote(term)+"&vid="+vid
          receipt["search"]["request"]=get(search_url,"search-inclement.json")
          obj=json.loads((out/"search-inclement.json").read_text("utf-8"))
          results=obj.get("search_results",[])
          pt49=next((x for x in results if x.get("page_id")=="PT49"),None)
          receipt["search"]["results"]=[{"page_id":x.get("page_id"),"page_url":x.get("page_url"),"snippet_text":x.get("snippet_text")} for x in results]
          receipt["search"]["pt49_source_emitted"]=pt49 is not None
          receipt["search"]["pt49_page_url_source_emitted"]=bool(pt49 and pt49.get("page_url"))
          if not pt49:
              raise SystemExit("PT49 no longer source-emitted for inclement query")

          # PT49 is source-emitted. Request only the ordinary public Books page route using
          # that emitted page id. No image URL/signature is synthesized.
          page_urls=[
              ("plain","https://books.google.com/books?id="+vid+"&pg="+pt49["page_id"]),
              ("with_source_query","https://books.google.com/books?id="+vid+"&pg="+pt49["page_id"]+"&vq="+urllib.parse.quote(term)),
          ]
          all_emitted=[]
          for label,url in page_urls:
              rec=get(url,f"pt49-{label}.html")
              p=out/f"pt49-{label}.html"
              txt=p.read_text("utf-8",errors="ignore") if p.exists() else ""
              raw=re.findall(r'https?://books\.google\.com/books/publisher/content\?[^"<> ]+',txt)
              emitted=[]
              for x in raw:
                  x=html.unescape(x).replace("\\u0026","&")
                  if x not in emitted: emitted.append(x)
              mapped=[]
              for x in emitted:
                  q=urllib.parse.parse_qs(urllib.parse.urlparse(x).query)
                  mapped.append({
                      "url":x,
                      "pg":q.get("pg",[None])[0],
                      "img":q.get("img",[None])[0],
                      "zoom":q.get("zoom",[None])[0],
                      "sig":q.get("sig",[None])[0],
                      "has_sig":bool(q.get("sig")),
                  })
                  if q.get("pg",[None])[0]=="PT49" and q.get("img",[None])[0]=="1" and q.get("sig") and x not in all_emitted:
                      all_emitted.append(x)
              receipt["page_requests"].append({
                  "label":label,
                  "request":rec,
                  "source_emitted_publisher_content_urls":mapped,
                  "html_contains_pt49":("PT49" in txt),
                  "html_contains_inclement_term":(term in txt),
              })

          receipt["pt49_source_emitted_signed_image_urls"]=all_emitted
          for i,u in enumerate(all_emitted):
              rec=get(u,f"pt49-image-{i}.bin")
              rec["source_emitted_by_pt49_public_page"]=True
              receipt["pt49_images"].append(rec)

          receipt["adjudication"]={
              "pt49_standard_public_page_reachable":any(x.get("request",{}).get("http_status")==200 for x in receipt["page_requests"]),
              "pt49_signed_image_url_emitted":bool(all_emitted),
              "pt49_physical_image_obtained":any(
                  x.get("http_status")==200 and str(x.get("content_type","")).startswith("image/")
                  for x in receipt["pt49_images"]
              ),
              "constructed_or_forged_image_signature":False,
              "physical_glyph_authority_claimed_before_manual_review":False,
          }

          (out/"receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n","utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-jielan-pt49-direct-public-page-ar
          path: batch12ar
          retention-days: 90
