name: probe-batch-12kp-ncpssd-articlelist-init-request-contract

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12kp-ncpssd-articlelist-init-request-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read the already source-emitted articlelist.js initialization contract
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          import requests

          URL="https://www.ncpssd.cn/js/web/Literature/articlelist.js"
          UA={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; source-emitted NCPSsd articlelist initialization contract)"}

          def sha(b):
              return hashlib.sha256(b).hexdigest()

          def decode_text(raw):
              for enc in ("utf-8","utf-8-sig","gb18030","gbk","big5"):
                  try:
                      return raw.decode(enc),enc
                  except UnicodeDecodeError:
                      pass
              return raw.decode("utf-8","replace"),"utf-8-replacement"

          r=requests.get(URL,headers=UA,timeout=45,allow_redirects=True)
          raw=r.content
          txt,enc=decode_text(raw)

          tokens=[
              'getUrlParam("search")',
              'getUrlParam("searchname")',
              'getUrlParam("sType")',
              '$.base64.decode',
              'base64.decode',
              'pageSize',
              'pageIndex',
              'ajaxKeys',
              'order',
              'search(',
              'searchcount(',
              'searchname',
              'var search',
              'var pages'
          ]

          contexts={}
          for token in tokens:
              arr=[]
              for m in re.finditer(re.escape(token),txt,re.I):
                  arr.append({
                      "start":m.start(),
                      "context":txt[max(0,m.start()-3500):min(len(txt),m.end()+8000)]
                  })
                  if len(arr)>=25:
                      break
              contexts[token]=arr

          assignments=[]
          for pat in [
              r'(?im)^\s*(?:var|let|const)\s+[^;\n]*(?:search|searchname|pageSize|pageIndex|ajaxKeys|order|pages)[^;\n]*;',
              r'(?im)^\s*(?:search|searchname|pageSize|pageIndex|ajaxKeys|order|pages)\s*=\s*[^;\n]+;',
              r'(?im)^\s*search\s*\([^;\n]+\);',
              r'(?im)^\s*searchcount\s*\([^;\n]+\);'
          ]:
              for m in re.finditer(pat,txt):
                  assignments.append({
                      "start":m.start(),
                      "statement":m.group(0),
                      "context":txt[max(0,m.start()-2500):min(len(txt),m.end()+5000)]
                  })

          out={
              "source_contract":{
                  "parent_batch":"12KO",
                  "script_url":URL,
                  "script_was_source_emitted_by_result_shell":True,
                  "dynamic_endpoint_executed":False
              },
              "script_response":{
                  "http_status":r.status_code,
                  "final_url":r.url,
                  "bytes":len(raw),
                  "sha256":sha(raw),
                  "decode_used":enc
              },
              "initialization_contexts":contexts,
              "assignment_and_call_statements":assignments,
              "adjudication":{
                  "dynamic_endpoint_executed":False,
                  "post_request_used":False,
                  "target_zhao_query_submitted":False,
                  "login_used":False
              },
              "security":{
                  "anonymous_get_only":True,
                  "reader_account_used":False,
                  "registration_used":False,
                  "post_request_used":False,
                  "state_changing_request_used":False,
                  "private_endpoint_guessed":False,
                  "dynamic_endpoint_guessed":False,
                  "captcha_bypass_used":False,
                  "tls_verification_disabled":False
              }
          }

          Path("batch-12kp-ncpssd-articlelist-init-request-contract.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12kp-ncpssd-articlelist-init-request-contract
          path: batch-12kp-ncpssd-articlelist-init-request-contract.json
