name: research-wushizhai-pku-source-routes-gc

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-wushizhai-pku-source-routes-gc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe only source-emitted PKU public routes
        run: |
          set -euo pipefail
          mkdir -p artifacts/pku-gc
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          OUT=Path("artifacts/pku-gc")
          BASE="https://ccj.pku.edu.cn/"
          urls=[
              ("issue","https://ccj.pku.edu.cn/journal/info?issueNo=03&jid=94408&viid=12482306&volumeNo="),
              ("search_prior_fz","https://ccj.pku.edu.cn/Search/search?fd0=2&kw0=%E9%82%93%E5%A3%B0%E5%A8%81"),
              ("search_author_deng","https://ccj.pku.edu.cn/Search/search?fd0=2&kw0=%E9%82%93%E4%B9%8B%E8%AF%9A"),
              ("search_author_dengrui","https://ccj.pku.edu.cn/Search/search?fd0=2&kw0=%E9%82%93%E7%91%9E"),
              ("search_title","https://ccj.pku.edu.cn/Search/search?fd0=0&kw0=%E4%BA%94%E7%9F%B3%E6%96%8B%E6%96%87%E5%8F%B2%E6%9C%AD%E8%AE%B0"),
          ]
          headers={"User-Agent":"Mozilla/5.0 TianwenResearch/1.0"}

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]; self.hrefs=[]; self.forms=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=="script" and d.get("src"): self.scripts.append(d["src"])
                  if tag in ("a","link") and d.get("href"): self.hrefs.append(d["href"])
                  if tag=="form" and d.get("action"): self.forms.append(d["action"])

          manifest={"policy":{
              "authentication_used":False,
              "paywall_bypass_attempted":False,
              "id_enumeration_or_guessing":False,
              "only_known_text_queries_and_source_emitted_assets":True,
          },"pages":[],"source_emitted_scripts":[]}

          def fetch(url):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      b=r.read()
                      return r.status, r.geturl(), dict(r.headers), b
              except Exception as e:
                  return None, url, {}, repr(e).encode()

          emitted_scripts=[]
          for label,url in urls:
              status,final,hs,b=fetch(url)
              fp=OUT/f"{label}.html"
              fp.write_bytes(b)
              rec={"label":label,"url":url,"status":status,"final_url":final,
                   "sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)}
              text=b.decode("utf-8","replace")
              p=P()
              try: p.feed(text)
              except Exception: pass
              rec["script_src"]=p.scripts
              rec["hrefs"]=p.hrefs[:500]
              rec["form_actions"]=p.forms
              rec["signals"]={
                  "contains_target_title":"五石斋文史札记" in text,
                  "contains_pp_121_129":("121-129" in text or "121–129" in text),
                  "contains_fulltext":("Fulltext" in text or "全文" in text),
                  "contains_download":("download" in text.lower() or "下载" in text),
              }
              manifest["pages"].append(rec)
              for src in p.scripts:
                  absu=urllib.parse.urljoin(final,src)
                  if urllib.parse.urlparse(absu).netloc=="ccj.pku.edu.cn" and absu not in emitted_scripts:
                      emitted_scripts.append(absu)

          for i,url in enumerate(emitted_scripts[:80]):
              status,final,hs,b=fetch(url)
              suffix=".js"
              fp=OUT/f"script_{i:03d}{suffix}"
              fp.write_bytes(b)
              text=b.decode("utf-8","replace")
              hits=[]
              for pat in [
                  r"""["']([^"']*(?:Search|search|journal|Journal|Article|article|Download|download|Fulltext|fulltext|ajax|Ajax|api|Api)[^"']*)["']""",
                  r"""url\s*:\s*["']([^"']+)["']""",
              ]:
                  for m in re.finditer(pat,text):
                      v=m.group(1)
                      if 0 < len(v) < 500 and v not in hits: hits.append(v)
              manifest["source_emitted_scripts"].append({
                  "url":url,"status":status,"final_url":final,
                  "sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b),
                  "route_like_strings":hits[:300],
              })

          (OUT/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wushizhai-pku-source-routes-gc
          path: artifacts/pku-gc
          if-no-files-found: error
