name: verify-batch-12gc-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gc-exact-head.yml
      - docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-PKU-STABLE-DETAIL-ARTICLEFILE-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-PKU-STABLE-DETAIL-ARTICLEFILE-BOUNDARY-GC.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GC exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-PKU-STABLE-DETAIL-ARTICLEFILE-BOUNDARY-GC'
          ep=Path('docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-PKU-STABLE-DETAIL-ARTICLEFILE-BOUNDARY-R1.json')
          dp=Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-PKU-STABLE-DETAIL-ARTICLEFILE-BOUNDARY-GC.md')
          assert ep.is_file() and dp.is_file()
          e=json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          q=e['official_search_contract']
          assert q['backend']=='https://ccj.pku.edu.cn/Search/SearchArticleByElasticsearch'
          assert q['source_query_item']['Field']==1
          assert q['source_query_item']['Value']=='五石斋文史札记'
          assert q['executed_page_size']==100
          assert q['backend_total']=='37'
          assert q['result_row_count']==37
          assert q['id_enumeration_or_guessing'] is False

          a=e['target_article_identity']
          assert a['article_id']=='286663046'
          assert a['volume_issue_id']=='12482306'
          assert a['journal_id']=='94408'
          assert a['year']==2008 and a['issue']=='03'
          assert a['pages']=='121-129'
          assert a['has_full_text_flag'] is True
          assert a['is_file_exist'] is False
          assert a['fulltext_fid'] is None

          d=e['stable_detail_control']
          assert d['url']=='https://ccj.pku.edu.cn/article/info?aid=286663046'
          assert d['status']==200
          assert d['exact_title_displayed'] is True
          assert d['exact_page_range_displayed'] is True
          assert d['directly_rendered_primary_article_body_observed'] is False

          f=e['articlefile_control']
          assert f['source_emitted_url']=='https://ccj.pku.edu.cn/Article/DownLoad?id=286663046&&type=ArticleFile'
          assert f['status']==200
          assert f['content_type']=='application/json; charset=utf-8'
          assert f['response_sha256']=='70e6fc2a80ba2a231907d056ee834355c3ef458e9165cf7adb3f81fdc1e6fe6b'
          assert f['response_error']=='文件不存在'
          assert f['starts_pdf'] is False
          assert f['retrievable_article_file_obtained'] is False
          assert f['primary_journal_text_obtained'] is False

          fw=e['access_and_authority_firewall']
          for key in (
              'has_full_text_flag_does_not_equal_retrievable_article_file',
              'fulltext_label_does_not_equal_primary_text_review',
              'stable_detail_metadata_does_not_equal_page_glyph_authority',
              'articlefile_error_does_not_prove_other_provider_content_absence',
              'articlefile_error_does_not_prove_historical_file_never_existed',
              'no_authentication_bypass_attempted',
              'no_paywall_bypass_attempted',
              'no_article_id_enumeration_or_guessing',
              'target_id_followed_only_after_official_search_backend_return',
              'no_provider_account_action_taken',
              'no_purchase_or_fee_incurred',
              'no_date_to_page_interpolation',
              'journal_pagination_does_not_map_to_2007_facsimile_pagination_without_direct_crosswalk',
          ):
              assert fw[key] is True

          t=e['target_status_after_batch']
          assert t['article_identity']=='CLOSED_CURRENT_FIRST_PARTY_SEARCH_BACKEND'
          assert t['article_id']=='286663046'
          assert t['article_page_range']=='121-129'
          assert t['stable_detail_route']=='CLOSED_CURRENT_FIRST_PARTY_DETAIL_ROUTE'
          assert t['current_pku_articlefile']=='SOURCE_EMITTED_ROUTE_RETURNS_FILE_NOT_FOUND'
          assert t['target_1950_01_29_exact_journal_page']=='UNRESOLVED'
          assert t['target_1950_01_29_primary_journal_text']=='NOT_REVIEWED'
          assert t['target_1950_01_29_exact_facsimile_page']=='UNRESOLVED'
          assert t['target_1950_01_29_handwriting_directly_collated'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['schema_version']=='1.189.0'
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc'].endswith('PKU-STABLE-DETAIL-ARTICLEFILE-BOUNDARY-GC.md')
          assert state['historical_audit']['row_count']==198
          assert state['historical_audit']['audited_row_count']==166
          assert state['historical_audit']['current_missing_from_product_row_count']==10
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==14
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==14
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          s=next(x for x in reg['sources'] if x.get('source_id')=='EXT-PKU-CCJ-WUSHIZHAI28-2008-03-PP121-129-INDEX')
          b=s['batch_12gc']
          assert b['article_id']=='286663046'
          assert b['page_range']=='121-129'
          assert b['stable_detail_route_closed'] is True
          assert b['has_full_text_flag'] is True
          assert b['is_file_exist'] is False
          assert b['fulltext_fid'] is None
          assert b['articlefile_response_error']=='文件不存在'
          assert b['articlefile_retrieved'] is False
          assert b['primary_journal_text_reviewed'] is False
          assert b['no_article_id_enumeration_or_guessing'] is True

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_row_count_change'] is False
          PY
