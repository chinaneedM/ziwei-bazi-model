name: verify-batch-12hq-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hq-exact-head.yml
      - .github/workflows/verify-batch-12hp-exact-head.yml
      - docs/research/ZIWEI-NLC-2026-RAREBOOK-CALLNUMBER-FORMAT-3388-CURRENT-SEARCH-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-2026-RAREBOOK-CALLNUMBER-FORMAT-3388-CURRENT-SEARCH-BOUNDARY-HQ.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HQ exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-NLC-2026-RAREBOOK-CALLNUMBER-FORMAT-3388-CURRENT-SEARCH-BOUNDARY-HQ'
          e=json.loads(Path('docs/research/ZIWEI-NLC-2026-RAREBOOK-CALLNUMBER-FORMAT-3388-CURRENT-SEARCH-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          p=e['fresh_current_nlc_probe']
          assert p['rerun_attempt']==2
          assert p['query_outcomes']['any_3388']=='NO_MATCHING_RESULT'
          assert p['query_outcomes']['any_03388']=='NO_MATCHING_RESULT'
          f=e['nlc_2026_callnumber_format_control']
          assert f['literal_label_used_on_page']=='索书号'
          assert [x['call_number'] for x in f['direct_examples']]==['02461','09373','11261']
          assert f['direct_3388_to_03388_crosswalk'] is False
          i=e['identifier_adjudication']
          assert i['automatic_zero_padding_as_asserted_identity']=='FORBIDDEN'
          assert i['literal_03388_as_search_candidate']=='AUTHORIZED_AS_SEARCH_ONLY_HYPOTHESIS'
          assert i['current_sys']=='UNRESOLVED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,229,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc']=='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-2026-RAREBOOK-CALLNUMBER-FORMAT-3388-CURRENT-SEARCH-BOUNDARY-HQ.md'
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-NLC-PCAB-2026-BEITU-SHANBEN-PEIBU-CALLNUMBER-FORMAT']['batch_12hq']['target_3388_to_03388_crosswalk'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_chart_algorithm_defect_count']==0
          PY
