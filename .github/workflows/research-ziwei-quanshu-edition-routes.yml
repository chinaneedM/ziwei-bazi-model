name: research-ziwei-quanshu-edition-routes

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-quanshu-edition-routes.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe independent Fullbook facsimile and preview routes
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          UA = "Mozilla/5.0 research-only public historical-edition route probe"
          ISBN = "9789888266944"

          PAGES = {
              "publisher": "https://publish.sunyata.hk/product/973.html",
              "buybook": "https://www.buybook.tw/book-0010746528.htm",
              "books_product": "https://www.books.com.tw/products/0010746528",
              "xingqiao": "https://www.ncc.com.tw/books/goods.php?id=14701",
              "secondary_woodblock_comparison": "https://superskylightfy.blogspot.com/2017/04/blog-post.html",
              "wenchengtang_official_collation": "https://publish.sunyata.hk/product/972.html",
          }
          GOOGLE_APIS = {
              "google_books_isbn": "https://www.googleapis.com/books/v1/volumes?q=isbn%3A9789888266944",
              "google_books_title": "https://www.googleapis.com/books/v1/volumes?q=%E7%B4%AB%E5%BE%AE%E6%96%97%E6%95%B8%E5%85%A8%E6%9B%B8+%E5%BF%83%E4%B8%80%E5%A0%82",
          }
          PREVIEW_IMAGES = [
              "https://www.books.com.tw/img/001/074/65/0010746528.jpg",
              "https://www.books.com.tw/img/001/074/65/0010746528_bc_01.jpg",
              "https://www.books.com.tw/img/001/074/65/0010746528_bi_01.jpg",
              "https://www.books.com.tw/img/001/074/65/0010746528_bi_02.jpg",
              *[
                  f"https://www.books.com.tw/img/001/074/65/0010746528_b_{i:02d}.jpg"
                  for i in range(1, 9)
              ],
              "https://www.books.com.tw/img/001/074/65/0010746528_bf_01.jpg",
          ]

          def fetch(url, *, accept="*/*", referer=None, max_bytes=8_000_000):
              headers = {
                  "User-Agent": UA,
                  "Accept": accept,
                  "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.7",
              }
              if referer:
                  headers["Referer"] = referer
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      data = resp.read(max_bytes + 1)
                      if len(data) > max_bytes:
                          raise RuntimeError(f"response exceeded {max_bytes} byte guard")
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "content_length": resp.headers.get("content-length"),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "data": b""}

          def meta(result):
              data = result.get("data", b"")
              return {
                  k: v for k, v in result.items() if k != "data"
              } | {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest() if data else None,
              }

          def textify(data):
              raw = data.decode("utf-8", "replace")
              raw = re.sub(r"(?is)<script.*?</script>|<style.*?</style>", " ", raw)
              raw = re.sub(r"(?s)<[^>]+>", " ", raw)
              return re.sub(r"\s+", " ", html.unescape(raw)).strip()

          def jpeg_size(data):
              if not data.startswith(b"\xff\xd8"):
                  return None
              i = 2
              while i + 9 < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  marker = data[i + 1]
                  i += 2
                  if marker in (0xD8, 0xD9):
                      continue
                  if i + 2 > len(data):
                      break
                  seglen = int.from_bytes(data[i:i+2], "big")
                  if seglen < 2 or i + seglen > len(data):
                      break
                  if marker in {
                      0xC0, 0xC1, 0xC2, 0xC3, 0xC5, 0xC6, 0xC7,
                      0xC9, 0xCA, 0xCB, 0xCD, 0xCE, 0xCF,
                  }:
                      height = int.from_bytes(data[i+3:i+5], "big")
                      width = int.from_bytes(data[i+5:i+7], "big")
                      return [width, height]
                  i += seglen
              return None

          result = {
              "schema": "ZIWEI-QUANSHU-INDEPENDENT-EDITION-ROUTE-PROBE-R1",
              "isbn": ISBN,
              "target_section": "論人生時要審的確",
              "target_reading": "上五刻屬昨夜亥時下五刻屬今日子時",
              "ocr_used": False,
              "authentication_or_paywall_bypass_attempted": False,
              "identifier_bruteforce_attempted": False,
              "page_routes": {},
              "google_books": {},
              "preview_images": [],
          }

          key_terms = [
              "敦化堂", "繼述堂", "继述堂", "文光堂", "文盛堂", "文誠堂", "文诚堂",
              "明末清初", "清中期", "9789888266944", "論人生時要審的確",
              "上五刻", "下五刻", "亥時", "亥时",
          ]

          for key, url in PAGES.items():
              r = fetch(url, accept="text/html,application/xhtml+xml,*/*;q=0.8")
              row = meta(r)
              if r.get("ok"):
                  text = textify(r["data"])
                  row["matched_terms"] = [term for term in key_terms if term in text]
                  snippets = []
                  for term in row["matched_terms"]:
                      idx = text.find(term)
                      snippets.append(text[max(0, idx-180):idx+420])
                  row["snippets"] = snippets[:20]
                  (OUT / f"{key}.html").write_bytes(r["data"])
              result["page_routes"][key] = row

          for key, url in GOOGLE_APIS.items():
              r = fetch(url, accept="application/json,*/*;q=0.8")
              row = meta(r)
              if r.get("ok"):
                  try:
                      payload = json.loads(r["data"].decode("utf-8"))
                      row["totalItems"] = payload.get("totalItems")
                      row["items"] = [
                          {
                              "id": item.get("id"),
                              "title": item.get("volumeInfo", {}).get("title"),
                              "publisher": item.get("volumeInfo", {}).get("publisher"),
                              "publishedDate": item.get("volumeInfo", {}).get("publishedDate"),
                              "industryIdentifiers": item.get("volumeInfo", {}).get("industryIdentifiers"),
                              "viewability": item.get("accessInfo", {}).get("viewability"),
                              "webReaderLink": item.get("accessInfo", {}).get("webReaderLink"),
                          }
                          for item in payload.get("items", [])[:20]
                      ]
                      (OUT / f"{key}.json").write_bytes(r["data"])
                  except Exception as exc:
                      row["parse_error"] = repr(exc)
              result["google_books"][key] = row

          for index, url in enumerate(PREVIEW_IMAGES):
              r = fetch(
                  url,
                  accept="image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
                  referer=PAGES["books_product"],
                  max_bytes=5_000_000,
              )
              row = meta(r)
              row["url"] = url
              data = r.get("data", b"")
              row["jpeg_magic"] = data.startswith(b"\xff\xd8")
              row["png_magic"] = data.startswith(b"\x89PNG")
              row["dimensions"] = jpeg_size(data)
              if r.get("ok") and (row["jpeg_magic"] or row["png_magic"]):
                  suffix = ".jpg" if row["jpeg_magic"] else ".png"
                  name = f"preview-{index:02d}{suffix}"
                  (OUT / name).write_bytes(data)
                  row["saved_file"] = name
              result["preview_images"].append(row)

          saved_preview_count = sum(
              1 for row in result["preview_images"] if row.get("saved_file")
          )
          result["route_adjudication"] = {
              "heart_one_2017_facsimile_identity":
                  "BIBLIOGRAPHICALLY_PUBLICLY_DOCUMENTED_DUNHUATANG_PLUS_JISHUTANG_WENGUANGTANG_BLOCK_FAMILY",
              "target_page_exposed_by_public_preview": (
                  "SAVED_PREVIEW_IMAGES_REQUIRE_DIRECT_VISUAL_REVIEW"
                  if saved_preview_count
                  else "NO_TARGET_PAGE_OBSERVED_NO_PREVIEW_IMAGE_RETRIEVED"
              ),
              "saved_preview_image_count": saved_preview_count,
              "wenchengtang_mid_qing_route":
                  "PUBLICLY_DOCUMENTED_AS_SEPARATE_FULLBOOK_COLLATION_WITNESS_TARGET_PAGE_NOT_YET_BOUND",
              "algorithm_effect": "NONE",
              "candidate_effect": "NONE_UNTIL_DIRECT_TARGET_GLYPH_COLLATION",
          }
          (OUT / "edition-route-probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              "page_routes": {
                  k: {
                      "ok": v.get("ok"),
                      "status": v.get("status"),
                      "matched_terms": v.get("matched_terms"),
                  }
                  for k, v in result["page_routes"].items()
              },
              "google_books": {
                  k: {
                      "ok": v.get("ok"),
                      "status": v.get("status"),
                      "totalItems": v.get("totalItems"),
                  }
                  for k, v in result["google_books"].items()
              },
              "preview_images": [
                  {
                      "index": i,
                      "ok": row.get("ok"),
                      "status": row.get("status"),
                      "bytes": row.get("bytes"),
                      "dimensions": row.get("dimensions"),
                      "saved_file": row.get("saved_file"),
                  }
                  for i, row in enumerate(result["preview_images"])
              ],
          }, ensure_ascii=False, indent=2))

      - name: Upload edition-route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-quanshu-independent-edition-routes
          path: probe/
          if-no-files-found: warn
          retention-days: 14
