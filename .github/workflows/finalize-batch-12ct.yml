name: finalize-batch-12ct

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/finalize-batch-12ct.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and verify Batch 12CT continuity state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          batch_id = 'BATCH-12-ZIWEI-DATONG-RICHU-NCL06267-DIGITAL-SURROGATE-DEDUP-CT'
          batch_doc = 'docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DATONG-RICHU-NCL06267-DIGITAL-SURROGATE-DEDUP-CT.md'

          state_path = Path('docs/PROJECT-CURRENT-STATE-R1.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['schema_version'] = '1.106.0'
          hist = state['historical_audit']
          completed = hist['completed_batches']
          if batch_id not in completed:
              completed.append(batch_id)
          hist['latest_batch_doc'] = batch_doc
          focus = hist['current_focus']
          notes = [
              'Batch 12CT resolves the Batch 12CS NCL-6267 follow-up public facsimile to EXT-NCL-DATONG-RICHU-NCL06267 and byte-identifies the acquired 21-page PDF with the already reviewed Batch 12CG object by SHA-256 0d3ed2b54f92b5eb2f11e5d06babebcc177e04ec5b8c7168b56f1fb25f94797d.',
              'Because the 12CT acquisition is the exact same digital object already counted in Batch 12CG, independent physical-witness, recension, 59/41, Sanming intermediate/change-day and transmission vote increments are all zero. NPM 平圖011910 and the NCL physical holding are not declared to be the same physical copy.',
              'After 12CT dedup closure, the highest-value Sanming ancestry gate returns to an independent directly readable 大統曆通軌 / 大統曆日通軌 / 大統日出分 witness with 晨昏分 or equivalent cells, plus securely pre-1578 Nanjing/Datong evidence reproducing both 59/41 and the exact 1578 Sanming change-day fingerprint or a deterministic quantization rule. HPA-ZDATE-006 remains MISSING_FROM_PRODUCT; runtime, algorithm-reopen and candidate-collapse states remain unchanged.'
          ]
          for note in notes:
              if note not in focus:
                  focus.append(note)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          verifier_path = Path('scripts/verify-project-continuity-state-r1.py')
          verifier = verifier_path.read_text(encoding='utf-8')
          if f'    "{batch_id}",' not in verifier:
              anchor = '    "BATCH-12-ZIWEI-DATONG-RICHU-NPM-PINGTU011910-CATALOG-CLOSURE-CS",\n]'
              repl = '    "BATCH-12-ZIWEI-DATONG-RICHU-NPM-PINGTU011910-CATALOG-CLOSURE-CS",\n    "' + batch_id + '",\n]'
              if anchor not in verifier:
                  raise SystemExit('continuity verifier CS-tail anchor missing')
              verifier = verifier.replace(anchor, repl, 1)
          old_doc = 'LATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DATONG-RICHU-NPM-PINGTU011910-CATALOG-CLOSURE-CS.md"'
          new_doc = f'LATEST_BATCH_DOC = "{batch_doc}"'
          if old_doc in verifier:
              verifier = verifier.replace(old_doc, new_doc, 1)
          elif new_doc not in verifier:
              raise SystemExit('continuity verifier latest-doc anchor missing')
          verifier_path.write_text(verifier, encoding='utf-8')
          PY
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT-CURRENT-STATE-R1.json scripts/verify-project-continuity-state-r1.py
          if ! git diff --cached --quiet; then
            git commit -m 'finalize Batch 12CT continuity state'
            git push origin HEAD:agent/fusion-chart-core-r1-20260822
          fi
