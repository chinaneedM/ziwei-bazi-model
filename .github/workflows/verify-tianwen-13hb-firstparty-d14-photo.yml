name: verify-tianwen-13hb-source-photo-d14
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstparty-photo-day14:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/verify-tianwen-13hb-photo4-day14-direct-glyph.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13hb*' -v
      - run: python -m unittest discover -s tests -p 'test_tianwen_13lk_source_transport_retry.py' -v
      - name: Verify previously source-declared official photo4 pixels
        run: |
          python scripts/fetch-tianwen-13hb-photo4-source.py --output /tmp/13hb-original.jpg --report /tmp/13hb-fetch.json
          python scripts/verify-tianwen-13hb-photo4-day14-direct-glyph.py --image /tmp/13hb-original.jpg
