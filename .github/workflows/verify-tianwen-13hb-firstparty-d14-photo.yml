name: verify-tianwen-13hb-source-photo-d14
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firstparty-photo-day14:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/verify-tianwen-13hb-photo4-day14-direct-glyph.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13hb*' -v
      - name: Verify previously source-declared official photo4 pixels
        run: |
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          e=json.loads(Path('docs/research/TIANWEN-13HB-NIKH-JUAN52-GALLERY04-D14-DIRECT-PHOTO-GLYPHS-R1.json').read_text(encoding='utf8'))
          u=e['source']['source_emitted_download_url']
          assert u=='https://db.history.go.kr/common/imageProxy.do?filePath=/kr/052/kr_052_1058.jpg&mode=download'
          q=urllib.request.Request(u,headers={'User-Agent':'Tianwen-13HB-Exact-Official-Gallery-Source/1.0'})
          with urllib.request.urlopen(q,timeout=25) as f:
              assert f.geturl().startswith('https://db.history.go.kr/')
              data=f.read(260000)
          assert len(data)==e['source']['jpeg_bytes']
          Path('/tmp/13hb-original.jpg').write_bytes(data)
          PY
          python scripts/verify-tianwen-13hb-photo4-day14-direct-glyph.py --image /tmp/13hb-original.jpg
