name: verify-yehuobian-12uu-original-juan20-intake-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12uu-original-juan20-intake-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UU-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UU-*.md
      - scripts/verify-yehuobian-original-juan20-acquisition-packet-12uu.py
      - tests/test_yehuobian_original_juan20_acquisition_packet_12uu.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project continuity, sharded source registry, genealogy
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Validate exact-source original juan20 acquisition packet
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-original-juan20-acquisition-packet-12uu.py
          python -m unittest discover -s tests -p 'test_yehuobian_original_juan20_acquisition_packet_12uu.py' -v
