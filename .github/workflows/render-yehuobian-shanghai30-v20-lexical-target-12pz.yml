name: render-yehuobian-shanghai30-v20-lexical-target-12pz

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-yehuobian-shanghai30-v20-lexical-target-12pz.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed PDF imaging utilities
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Fetch Shanghai 30-volume PDF part2 and verify exact existing source SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 12pz-sh-lexical/source 12pz-sh-lexical/pages
          root='https://commons.wikimedia.org/wiki/Special:Redirect/file'
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 3 --max-time 1200 \
            -A 'Tianwen-Historical-Provenance-R1/1.0' \
            "$root/Shanghai_%E8%90%AC%E6%9B%86%E9%87%8E%E7%8D%B2%E7%B7%A8%E4%B8%89%E5%8D%81%E5%8D%B7_part_2.pdf" \
            -o 12pz-sh-lexical/source/part2.pdf
          echo '7ea8fe57f5baebd8f2841771d87ec5e3ed34c271e0fe89596a28d2521c9165a6  12pz-sh-lexical/source/part2.pdf' | sha256sum -c -
          pdfinfo 12pz-sh-lexical/source/part2.pdf > 12pz-sh-lexical/pdfinfo.txt
          test "$(awk '/^Pages:/ {print $2}' 12pz-sh-lexical/pdfinfo.txt)" = 550
      - name: Render eight bounded adjacent original-image pages without OCR
        shell: bash
        run: |
          set -euo pipefail
          for p in 441 442 443 444 445 446 447 448; do
            pdftoppm -f "$p" -l "$p" -r 200 -jpeg -jpegopt quality=94 \
              -singlefile 12pz-sh-lexical/source/part2.pdf \
              "12pz-sh-lexical/pages/$(printf 'part2-p%04d' "$p")"
          done
          test "$(find 12pz-sh-lexical/pages -type f -name '*.jpg' | wc -l)" -eq 8
          (cd 12pz-sh-lexical && sha256sum pages/*.jpg > image-sha256.txt)
          cat > 12pz-sh-lexical/manifest.txt <<'EOF'
          TARGET=改造漏刻
          SOURCE=Shanghai-Library-labelled categorized 30-volume PDF part2
          SOURCE_SHA256=7ea8fe57f5baebd8f2841771d87ec5e3ed34c271e0fe89596a28d2521c9165a6
          PDF_TOTAL_PAGES=550
          SELECTED_PDF_1BASED_PAGES=441..448
          IMAGE_DPI=200
          OCR_USED=false
          EDITION_1827=UNVERIFIED
          HEADING_AND_GLYPHS=NOT_ATTESTED_UNTIL_MANUAL_PAGE_IMAGE_INSPECTION
          DO_NOT_TRANSFER_READINGS_TO_1447_OR_1450=true
          EOF
      - name: Upload only evidence page images and SHA manifests
        uses: actions/upload-artifact@v4
        with:
          name: shanghai30-v20-lexical-target-p441-448-12pz
          path: |
            12pz-sh-lexical/pages/
            12pz-sh-lexical/image-sha256.txt
            12pz-sh-lexical/pdfinfo.txt
            12pz-sh-lexical/manifest.txt
          retention-days: 30
          if-no-files-found: error
