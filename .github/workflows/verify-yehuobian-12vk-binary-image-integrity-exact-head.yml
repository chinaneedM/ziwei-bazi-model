name: verify-yehuobian-12vk-binary-image-integrity-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12vk-binary-image-integrity-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-yehuobian-physical-leaf-attestation-r1.py
      - tests/test_yehuobian_binary_integrity_12vk.py
      - docs/research/MING-DATONG-YEHUOBIAN-12VK-*.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve continuity, registries and transmission graph
        run: |
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: 12SM current null-evidence queue and 12VK synthetic bytes regressions
        run: |
          python scripts/verify-yehuobian-physical-leaf-attestation-r1.py
          python -m unittest discover -s tests -p 'test_yehuobian_tokyo_shanben_access_12sm.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_binary_integrity_12vk.py' -v
