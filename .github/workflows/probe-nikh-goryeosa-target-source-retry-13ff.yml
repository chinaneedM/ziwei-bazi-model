name: probe-nikh-goryeosa-target-source-retry-13ff
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/probe-nikh-goryeosa-target-retry-13ff.py
      - tests/test_probe_nikh_goryeosa_target_retry_13ff.py
      - .github/workflows/probe-nikh-goryeosa-target-source-retry-13ff.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-source-index-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test only source-attested two-page retry
        run: |
          python -m py_compile scripts/probe-nikh-goryeosa-source-atlas-13fe.py scripts/probe-nikh-goryeosa-target-retry-13ff.py
          python -m unittest discover -s tests -p 'test_probe_nikh_goryeosa_target_retry_13ff.py' -v
      - name: Source-only two page bounded retries
        run: python scripts/probe-nikh-goryeosa-target-retry-13ff.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13ff-source-target-retry
          path: /tmp/tianwen-13ff-retry/
          if-no-files-found: warn
          retention-days: 30
