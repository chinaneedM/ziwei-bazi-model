name: research-ziwei-tushubian-v32-juan22-contact-as-r11

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-tushubian-v32-juan22-contact-as-r11.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Resolve Harvard v32 and render visual locator
        shell: python
        run: |
          import hashlib, io, json, urllib.parse, urllib.request
          from pathlib import Path
          import fitz
          from PIL import Image, ImageDraw

          out=Path('batch12as-r11'); out.mkdir(exist_ok=True)
          def gj(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          q='intitle:"圖書編 v.32.pdf"'
          s=('https://commons.wikimedia.org/w/api.php?action=query&format=json&list=search&srnamespace=6'
             '&srlimit=50&srsearch='+urllib.parse.quote(q))
          titles=[x.get('title') for x in gj(s).get('query',{}).get('search',[])]
          selected=next((t for t in titles if 'Harvard' in t and '圖書編' in t and 'v.32.pdf' in t),None)
          if not selected: raise SystemExit('No Harvard 圖書編 v.32.pdf title resolved')

          u=('https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo'
             '&iiprop=url%7Csize%7Csha1&titles='+urllib.parse.quote(selected))
          page=next(iter(gj(u).get('query',{}).get('pages',{}).values()))
          info=(page.get('imageinfo') or [None])[0]
          if not info or not info.get('url'): raise SystemExit('No source-emitted PDF URL')

          pdf=out/'v32.pdf'
          req=urllib.request.Request(info['url'],headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=180) as r: pdf.write_bytes(r.read())
          doc=fitz.open(str(pdf))

          thumbs=[]
          for i,pg in enumerate(doc):
              pix=pg.get_pixmap(matrix=fitz.Matrix(0.34,0.34),alpha=False)
              im=Image.open(io.BytesIO(pix.tobytes('jpeg'))).convert('RGB')
              canvas=Image.new('RGB',(im.width,im.height+34),'white')
              canvas.paste(im,(0,34)); ImageDraw.Draw(canvas).text((6,8),f'PDF p{i+1}',fill='black')
              thumbs.append(canvas)

          sheets=[]; cols=3; rows=3; per=9
          for start in range(0,len(thumbs),per):
              batch=thumbs[start:start+per]
              w=max(x.width for x in batch); h=max(x.height for x in batch)
              sheet=Image.new('RGB',(cols*w,rows*h),'white')
              for j,im in enumerate(batch): sheet.paste(im,((j%cols)*w,(j//cols)*h))
              fn=f'contact-{start+1:03d}-{start+len(batch):03d}.jpg'
              sheet.save(out/fn,quality=92)
              sheets.append({'pages':[start+1,start+len(batch)],'file':fn,'sha256':hashlib.sha256((out/fn).read_bytes()).hexdigest()})

          first=[]
          for p1 in range(1,min(len(doc),20)+1):
              pix=doc[p1-1].get_pixmap(matrix=fitz.Matrix(0.92,0.92),alpha=False)
              im=Image.open(io.BytesIO(pix.tobytes('jpeg'))).convert('RGB')
              fn=f'page-{p1:03d}.jpg'; im.save(out/fn,quality=93)
              first.append({'page':p1,'file':fn,'sha256':hashlib.sha256((out/fn).read_bytes()).hexdigest()})

          receipt={
            'scope':'BATCH12AS_R11_HARVARD_V32_JUAN22_VISUAL_LOCATOR',
            'hypothesis':'HARVARD_PHYSICAL_V32_CONTAINS_INTERNAL_JUAN22_TIMEKEEPING_MATERIAL',
            'selected_title':selected,'imageinfo':info,
            'pdf_sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),
            'page_count':len(doc),'contact_sheets':sheets,'first_pages':first,
            'ocr_generated':False,'manual_visual_review_required':True,
            'cross_edition_juan_number_equivalence_assumed':False,
            'runtime_standard_selected':False,'algorithm_reopen_authorized':False
          }
          (out/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n','utf-8')
          pdf.unlink()
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-tushubian-v32-juan22-contact-as-r11
          path: batch12as-r11
          retention-days: 90
