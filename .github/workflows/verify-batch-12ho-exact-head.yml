name: verify-batch-12ho-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hn-exact-head.yml
      - .github/workflows/verify-batch-12ho-exact-head.yml
      - docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-PROVENANCE-SEAL-VISUAL-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-PROVENANCE-SEAL-VISUAL-BOUNDARY-HO.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HO exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-PROVENANCE-SEAL-VISUAL-BOUNDARY-HO'
          e=json.loads(Path('docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-PROVENANCE-SEAL-VISUAL-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          p=e['direct_visual_adjudication']['book1_page2']
          assert p['physical_provenance_seal_traces_visible'] is True
          assert p['target_leaf_status']=='PROVENANCE_MARKS_PRESENT_INSCRIPTION_UNRESOLVED'
          assert p['directly_readable_baisong_yichan'] is False
          assert p['directly_readable_tieqin_tongjian_lou'] is False
          assert p['unique_seal_fingerprint_closed'] is False
          m=e['direct_visual_probes']['strategic_multibook']
          assert m['discovered_fid_file_count']==32
          assert sorted(map(int,m['books']))==[2,16,32]
          i=e['identity_adjudication']
          assert i['direct_provenance_marks_on_fid070']=='CLOSED_PRESENT_ON_BOOK1_PAGE2'
          assert i['exact_provenance_seal_text']=='UNRESOLVED'
          assert i['fid070_equals_zhang_tieqin_yuan_copy']=='STRONGLY_COMPATIBLE_NOT_PROVED'
          assert i['same_object_edge_authorized'] is False
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,227,0)
          assert bid in state['historical_audit']['completed_batches']
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-FSN-BAISONG-YICHAN-SEAL']['batch_12ho']['target_fid070_match']=='UNRESOLVED'
          assert src['EXT-TAIWAN-NCL-2018-TIEQIN-SEAL-FIG7']['batch_12ho']['target_fid070_match']=='UNRESOLVED'
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_chart_algorithm_defect_count']==0
          PY
