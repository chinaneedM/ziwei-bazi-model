name: verify-batch-12id-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12id-exact-head.yml
      - docs/research/ZIWEI-GUOXUEJIKAN11-ITEM-LEVEL-ISBN-FORWARD-CORRECTION-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-GUOXUEJIKAN11-ITEM-LEVEL-ISBN-FORWARD-CORRECTION-ID.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending ID status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'tianwen/batch-12id-exact-head',
              description: 'Batch 12ID provenance repair verification running'
            })

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12ID exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-GUOXUEJIKAN11-ITEM-LEVEL-ISBN-FORWARD-CORRECTION-ID'
          e=json.loads(Path('docs/research/ZIWEI-GUOXUEJIKAN11-ITEM-LEVEL-ISBN-FORWARD-CORRECTION-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          r=e['provenance_defect_repair']
          assert r['provenance_defect_id']=='PROV-DEFECT-017'
          assert r['repair_status']=='REPAIRED_FORWARD_ONLY_DURING_BATCH_12ID'
          assert r['corrected_claim']['isbn']=='9787209115001'
          assert r['corrected_claim']['publication_date']=='2018-09'
          assert r['corrected_claim']['extent_pages']==222
          assert r['displaced_adjacent_record']['isbn']=='9787209115018'
          assert r['displaced_adjacent_record']['publication_date']=='2018-12'
          assert r['displaced_adjacent_record']['extent_pages']==277
          assert e['adjudication']['issue11_institutional_or_publisher_catalog_binding']=='UNRESOLVED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,242,0)
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count'] >= 17
          assert state['historical_audit']['repaired_provenance_metadata_defect_count'] >= 17
          assert bid in state['historical_audit']['completed_batches']
          PY

      - name: Publish successful ID status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12id-exact-head',
              description: 'Batch 12ID provenance repair gates PASS'
            })

      - name: Publish failed ID status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12id-exact-head',
              description: 'Batch 12ID exact-head verification FAILED'
            })
