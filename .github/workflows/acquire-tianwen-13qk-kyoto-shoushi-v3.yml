name: acquire-tianwen-13qk-kyoto-shoushi-v3
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths: [.github/workflows/acquire-tianwen-13qk-kyoto-shoushi-v3.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-issued-volume3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet pillow
      - name: Acquire source-issued public image neighborhood only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, hashlib, io, json, pathlib, urllib.parse, urllib.request
          from PIL import Image, ImageDraw
          OUT=pathlib.Path('/tmp/tianwen-13qk-kyoto-rb00028639')
          OUT.mkdir(parents=True,exist_ok=True)
          IMG=OUT/'originals';IMG.mkdir(exist_ok=True)
          MANIFEST='https://rmda.kulib.kyoto-u.ac.jp/iiif/metadata_manifest/RB00028639/manifest.json'
          HOST='rmda.kulib.kyoto-u.ac.jp'
          START,STOP=67,98
          def digest(b):return hashlib.sha256(b).hexdigest()
          def fetch(url,cap=18000000):
              p=urllib.parse.urlsplit(url)
              if p.scheme!='https' or p.hostname!=HOST or p.username or p.password:raise ValueError('off-provider input')
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'TIANWEN/13QK source-limited research'}),timeout=60) as r:
                  final=urllib.parse.urlsplit(r.geturl())
                  if r.status!=200 or final.scheme!='https' or final.hostname!=HOST:raise ValueError('off-provider response')
                  data=r.read(cap+1)
                  if len(data)>cap:raise ValueError('bounded transfer cap exceeded')
                  return data,r.geturl(),r.headers.get('Content-Type','')
          def source_image(c):
              if c.get('images'):res=c['images'][0].get('resource') or {}
              else:
                  pages=c.get('items') or []
                  annotations=(pages[0].get('items') or []) if pages else []
                  res=(annotations[0].get('body') or {}) if annotations else {}
              service=res.get('service')
              if isinstance(service,list):service=service[0] if service else None
              sid=(service.get('@id') or service.get('id')) if isinstance(service,dict) else service
              return (sid.rstrip('/')+'/full/1600,/0/default.jpg',sid) if sid else (None,None)
          report={'schema':'TIANWEN-13QK-KYOTO-RB00028639-VOL3-IMAGE-ATLAS-R1',
                  'manifest':MANIFEST,'target':'利 元史54 授時暦經上',
                  'source_anchor_volume3_page':START,'source_anchor_volume4_page':STOP,
                  'original_glyph_reviewed':False,'ocr_used':False,
                  'g893_independent_original_witness_votes':0,'g893_numeric_decisions':0,'pages':[]}
          try:
              raw,url,typ=fetch(MANIFEST,35000000)
              (OUT/'manifest.json').write_bytes(raw)
              data=json.loads(raw.decode('utf-8-sig'))
              canvases=(data.get('sequences') or [{}])[0].get('canvases') or data.get('items') or []
              if len(canvases)<START:raise ValueError('source canvas count below target')
              report.update(manifest_sha256=digest(raw),manifest_bytes=len(raw),canvas_count=len(canvases),
                            manifest_final_url=url,manifest_content_type=typ)
              # Source viewer page uses a 1-based anchor, so include two neighboring canvases.
              selected=range(max(0,START-2),min(len(canvases),STOP+2))
              report['canvas_zero_based_bounds']=[selected.start,selected.stop-1]
              def capture(i):
                  c=canvases[i];u,sid=source_image(c)
                  rec={'index_zero_based':i,'label':str(c.get('label',''))[:200],
                       'canvas_id':c.get('@id') or c.get('id'),'service_id':sid,'source_image_url':u}
                  if not u:return {**rec,'status':'NO_SOURCE_ISSUED_IMAGE_SERVICE'}
                  try:
                      b,final,ctype=fetch(u)
                      im=Image.open(io.BytesIO(b));im.load()
                      if im.width>2100 or im.height>3500:raise ValueError('pixel cap exceeded')
                      name=f'canvas-{i:04}.jpg';(IMG/name).write_bytes(b)
                      return {**rec,'status':'ACQUIRED','source_sha256':digest(b),'pixels':[im.width,im.height],
                              'filename':name,'content_type':ctype,'final_url':final}
                  except Exception as exc:return {**rec,'status':'UNAVAILABLE','error':type(exc).__name__+': '+str(exc)[:250]}
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
                  report['pages']=sorted(pool.map(capture,selected),key=lambda x:x['index_zero_based'])
              good=[p for p in report['pages'] if p['status']=='ACQUIRED']
              report['images_acquired']=len(good)
              for n in range(0,len(good),12):
                  sheet=Image.new('RGB',(1200,1095),'white');draw=ImageDraw.Draw(sheet)
                  for j,p in enumerate(good[n:n+12]):
                      im=Image.open(IMG/p['filename']).convert('RGB');im.thumbnail((286,315))
                      x=(j%4)*300;y=(j//4)*365
                      draw.text((x+5,y+4),f"index {p['index_zero_based']} {p['label'][:12]}",fill='black')
                      sheet.paste(im,(x+5,y+27))
                  sheet.save(OUT/f'contact-{n//12+1:02}.jpg',quality=85)
              report['status']='SOURCE_ORIGINALS_ACQUIRED' if good else 'MANIFEST_ONLY'
          except Exception as exc:report.update(status='MANIFEST_OR_CANVAS_BOUNDARY',error=type(exc).__name__+': '+str(exc)[:350])
          (OUT/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:report.get(k) for k in ('status','manifest_sha256','canvas_count','canvas_zero_based_bounds','images_acquired','error')},ensure_ascii=False))
          for row in report['pages']:
              print(json.dumps({k:row.get(k) for k in ('index_zero_based','label','status','source_sha256','source_image_url','error')},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13qk-kyoto-rb00028639-vol3
          path: /tmp/tianwen-13qk-kyoto-rb00028639/
          retention-days: 30
          if-no-files-found: warn
