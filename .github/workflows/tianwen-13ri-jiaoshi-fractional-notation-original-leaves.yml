name: tianwen-13ri-jiaoshi-fractional-notation-original-leaves
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/tianwen-13ri-jiaoshi-fractional-notation-original-leaves.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-notation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --silent puppeteer-core@24.16.0
      - run: python -m pip install --quiet "Pillow>=10,<12"
      - name: Bind firstparty item and acquire unreviewed early original folios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/13ri /tmp/tianwen-13ri
          cat >audit/13ri/source.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const book='GK00067_00',root='/tmp/tianwen-13ri';
          const folios=['018a','018b','019a','019b','020a','020b','021a','021b','022a','022b','023a','023b'];
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.BROWSER,args:['--no-sandbox','--disable-setuid-sandbox']});
          const page=await browser.newPage();
          await page.goto('https://kyudb.snu.ac.kr/book/list.do?book_cate=SIC04&mid=GDS',{waitUntil:'networkidle2',timeout:90000});
          const record=await page.evaluate(book=>{
            const row=[...document.querySelectorAll('tr')].find(x=>x.textContent?.includes('交食推步法')&&x.querySelector('input[value="'+book+'"]'));
            return row?{title:'交食推步法',book_cd:book,source_original_control:row.querySelector('a[onclick*="fn_originalImg"]')?.getAttribute('onclick')}:null;
          },book);
          if(!record?.source_original_control?.includes(book))throw Error('Firstparty source item identity unavailable');
          const rows=[];
          for(const p of folios){
            const fn=book+'IH_0001_'+p+'.jpg';
            const sourcePath='/data01/stream/SIC/IMG/'+book+'/'+book+'_0001/'+fn;
            const url='https://kyudb.snu.ac.kr/ImageServlet.do?imgFileNm='+encodeURIComponent(fn)+'&path='+encodeURIComponent(sourcePath);
            const tab=await browser.newPage(); let bytes=null,status=null,error=null;
            for(let attempt=1;attempt<=2;attempt++){
              try{
                const response=await tab.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                status=response?.status()??null;
                if(response?.ok()){
                  const b=await response.buffer();
                  if(b.length>50000&&b[0]===255&&b[1]===216){bytes=b;break;}
                }
              }catch(e){error=String(e)}
            }
            await tab.close();
            const rec={folio:p,status,bytes:bytes?.length??0,sha256:bytes?crypto.createHash('sha256').update(bytes).digest('hex'):null,url,error};
            if(bytes)fs.writeFileSync(root+'/'+p+'.jpg',bytes);
            rows.push(rec);
            console.log('13RI_SOURCE '+JSON.stringify({folio:p,status,bytes:rec.bytes,sha256:rec.sha256,error}));
          }
          fs.writeFileSync(root+'/receipt.json',JSON.stringify({
            schema:'TIANWEN-13RI-GK00067-FIRSTPARTY-EARLY-NOTATION-ATLAS',
            identity:record,rows,issue:'TW-OPEN-0005',ocr:false,
            evidence_status:'IMAGE_ACQUISITION_ONLY_UNTIL_MANUAL_GLYPH_REVIEW',
            note:'One existing SNU physical item only; 12 newly examined early a/b leaves; do not count as additional copy'
          },null,2)+'\n');
          await browser.close();
          if(rows.some(x=>!x.sha256))process.exitCode=2;
          JS
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          BROWSER="$BROWSER" node audit/13ri/source.mjs
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import base64,hashlib
          d=Path('/tmp/tianwen-13ri')
          pages=['018a','018b','019a','019b','020a','020b','021a','021b','022a','022b','023a','023b']
          for k in range(2):
            selected=pages[k*6:(k+1)*6]
            contact=Image.new('RGB',(3*480,2*875),'white')
            for i,p in enumerate(selected):
              f=d/(p+'.jpg')
              if not f.exists():continue
              im=Image.open(f).convert('RGB')
              print('13RI_RGB',p,im.size,hashlib.sha256(im.tobytes()).hexdigest())
              im.thumbnail((460,820))
              contact.paste(im,((i%3)*480+(480-im.width)//2,(i//3)*875+30))
              ImageDraw.Draw(contact).text(((i%3)*480+8,(i//3)*875+8),p,fill='black')
            output=d/('contact-'+str(k+1)+'.jpg')
            contact.save(output,quality=72,optimize=True)
            raw=output.read_bytes()
            print('13RI_CONTACT',output.name,hashlib.sha256(raw).hexdigest(),len(raw))
            encoded=base64.b64encode(raw).decode('ascii')
            for start in range(0,len(encoded),3000):print('13RI_CONTACT_B64',output.name,encoded[start:start+3000])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13ri-jiaoshi-early-original-folios
          path: /tmp/tianwen-13ri/
          retention-days: 14
          if-no-files-found: warn
