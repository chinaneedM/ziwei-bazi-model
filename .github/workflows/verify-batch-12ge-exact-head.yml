name: verify-batch-12ge-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ge-exact-head.yml
      - docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-JAPAN-PHYSICAL-SERIAL-HOLDINGS-COPY-ACTION-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-JAPAN-PHYSICAL-SERIAL-HOLDINGS-AND-COPY-ACTION-BOUNDARY-GE.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GE exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-JAPAN-PHYSICAL-SERIAL-HOLDINGS-AND-COPY-ACTION-BOUNDARY-GE'
          ep=Path('docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-JAPAN-PHYSICAL-SERIAL-HOLDINGS-COPY-ACTION-BOUNDARY-R1.json')
          dp=Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-JAPAN-PHYSICAL-SERIAL-HOLDINGS-AND-COPY-ACTION-BOUNDARY-GE.md')
          assert ep.is_file() and dp.is_file()
          e=json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          n=e['ndl_first_party_serial_control']
          assert n['ndl_call_number']=='Z21-AC41'
          assert n['ndl_bib_id']=='a0000052718'
          assert n['issn']=='10043241'
          assert n['target_issue']=='2008(03)'
          assert n['target_issue_within_listed_holding_span'] is True
          assert n['exact_target_issue_child_record_id']=='UNRESOLVED'
          assert n['exact_target_issue_material_label_id']=='UNRESOLVED'
          assert n['target_pages_121_129_directly_reviewed'] is False

          c=e['cinii_union_holding_control']
          assert c['ncid']=='AA1225301X'
          assert len(c['holdings_covering_2008'])==6
          assert c['negative_holding_control']['institution']=='奈良大学 図書館'
          assert c['negative_holding_control']['target_2008_issue_3_in_listed_holdings'] is False

          s=e['ndl_service_control']
          assert s['registered_individual_remote_copy_service_documented'] is True
          assert s['remote_copy_is_paid'] is True
          assert s['registered_individual_article_location_investigation_documented'] is True
          assert s['exact_target_issue_remote_copy_eligibility']=='NOT_CHECKED_AUTHENTICATED'
          assert s['account_login_performed'] is False
          assert s['remote_copy_request_submitted'] is False
          assert s['article_location_investigation_submitted'] is False
          assert s['fee_incurred'] is False

          fw=e['access_and_authority_firewall']
          for key in (
              'series_holding_span_does_not_equal_target_page_review',
              'union_catalog_holding_does_not_equal_article_text_authority',
              'remote_copy_service_availability_does_not_equal_target_issue_eligibility',
              'physical_holding_does_not_equal_same_copy_or_same_issue_item_identity',
              'exact_issue_child_record_required_before_item_level_request',
              'no_login_performed',
              'no_ill_request_submitted',
              'no_remote_copy_request_submitted',
              'no_article_location_investigation_submitted',
              'no_fee_or_purchase_incurred',
              'no_page_interpolation',
          ):
              assert fw[key] is True

          t=e['target_status_after_batch']
          assert t['target_article_page_range']=='121-129'
          assert t['target_1950_01_29_exact_journal_page']=='UNRESOLVED'
          assert t['target_1950_01_29_primary_journal_text']=='NOT_REVIEWED'
          assert t['target_1950_01_29_exact_facsimile_page']=='UNRESOLVED'
          assert t['target_1950_01_29_facsimile_text']=='NOT_REVIEWED'

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          state_schema_version=tuple(int(part) for part in state['schema_version'].split('.'))
          assert state_schema_version >= (1, 191, 0)
          assert bid in state['historical_audit']['completed_batches']

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ndl=next(x for x in reg['sources'] if x.get('source_id')=='EXT-NDL-ZHONGGUO-DIANJI-YU-WENHUA-Z21-AC41')
          ci=next(x for x in reg['sources'] if x.get('source_id')=='EXT-CINII-AA1225301X-ZHONGGUO-DIANJI-YU-WENHUA-JAPAN-HOLDINGS')
          ga=next(x for x in reg['sources'] if x.get('source_id')=='EXT-GAKUSHUIN-OPAC-AA1225301X-ILL-ACTION-SURFACE')
          assert ndl['batch_12ge']['target_pages_121_129_reviewed'] is False
          assert ndl['batch_12ge']['remote_copy_request_submitted'] is False
          assert ci['batch_12ge']['holding_routes_covering_2008_count']==6
          assert ci['batch_12ge']['target_pages_121_129_reviewed'] is False
          assert ga['batch_12ge']['request_submitted'] is False

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_row_count_change'] is False
          PY
