name: probe-batch-12ip-nlcpress-ji15-booktext-public-postback

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12ip-nlcpress-ji15-booktext-public-postback.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public Booktext postback response metadata only
        run: |
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          import requests

          URL = "https://www.nlcpress.com/ProductView.aspx?Id=4660"
          TARGET_TITLE = "冀淑英古籍善本十五讲"
          UA = "Mozilla/5.0 (Tianwen provenance audit; public Booktext metadata-only inspection)"

          class HiddenInputParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.fields = {}
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "input":
                      return
                  d = {str(k): ("" if v is None else str(v)) for k, v in attrs}
                  if d.get("type", "").lower() != "hidden":
                      return
                  name = d.get("name")
                  if name:
                      self.fields[name] = d.get("value", "")

          def hidden_fields(body):
              parser = HiddenInputParser()
              parser.feed(body)
              return parser.fields

          def safe_headers(headers):
              keep = {}
              allowed = {
                  "content-type": "Content-Type",
                  "content-disposition": "Content-Disposition",
                  "content-length": "Content-Length",
                  "location": "Location",
                  "cache-control": "Cache-Control",
                  "last-modified": "Last-Modified",
                  "etag": "ETag",
              }
              for k, v in headers.items():
                  canonical = allowed.get(k.lower())
                  if canonical:
                      keep[canonical] = v
              return keep

          s = requests.Session()
          s.headers.update({"User-Agent": UA})
          g = s.get(URL, timeout=45)
          g.raise_for_status()

          visible = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", g.text)))
          form = hidden_fields(g.text)
          form.update({
              "__EVENTTARGET": "Booktext",
              "__EVENTARGUMENT": "",
          })

          # Metadata-only probe: do not consume POST response body and do not follow redirects.
          p = s.post(
              URL,
              data=form,
              timeout=45,
              stream=True,
              allow_redirects=False,
              headers={"Referer": URL, "User-Agent": UA},
          )

          result = {
              "product_url": URL,
              "get_status": g.status_code,
              "get_body_sha256": hashlib.sha256(g.content).hexdigest(),
              "get_has_target_title": TARGET_TITLE in visible,
              "get_has_booktext_postback": "__doPostBack('Booktext','')" in g.text,
              "hidden_field_count": len(form) - 2,
              "post_event_target": "Booktext",
              "post_status": p.status_code,
              "post_reason": p.reason,
              "post_headers": safe_headers(p.headers),
              "post_is_redirect": bool(p.is_redirect or p.is_permanent_redirect),
              "response_body_read": False,
              "redirect_followed": False,
              "download_bytes_read": 0,
              "tls_verified": True,
              "login_used": False,
              "purchase_invoked": False,
              "captcha_bypass_used": False,
              "permission_bypass_used": False,
              "full_book_text_fetched": False,
          }

          p.close()

          Path("nlcpress-ji15-booktext-postback-metadata.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ip-nlcpress-ji15-booktext-postback-metadata
          path: nlcpress-ji15-booktext-postback-metadata.json
