name: research-leibian-bi-finalize

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-leibian-bi-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize Batch 12BI research artifacts
        run: |
          python .github/scripts/finalize-leibian-bi.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python scripts/verify-project-continuity-state-r1.py
          git diff --check
      - name: Commit Batch 12BI
        run: |
          rm -f .github/scripts/finalize-leibian-bi.py
          rm -f .github/workflows/research-leibian-nightzi-physical-probe.yml
          rm -f .github/workflows/research-leibian-bi-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts .github
          git status --short
          git commit -m "close Batch 12BI Leibian upper-four-ke physical collation"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
