name: probe-mei-commons-original-13qn
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-mei-commons-original-13qn.py
      - .github/workflows/probe-mei-commons-original-13qn.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install existing faithful original DjVu decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install 'Pillow>=10,<12'
      - name: Fetch exact catalog-listed Commons original only if imageinfo and hash match
        run: python scripts/probe-mei-commons-original-13qn.py
      - name: Preserve exact source bytes and no-OCR page contact atlas, when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-v5-v6-13qn-commons-original-and-atlas
          path: research-13qn-mei-commons/
          retention-days: 20
          if-no-files-found: warn
