name: tianwen-13qz-jiaoshi-folio-landmark-atlas
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/tianwen-13qz-jiaoshi-folio-landmark-atlas.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  provider-folio-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --silent puppeteer-core@24.16.0
      - run: python -m pip install --quiet "Pillow>=10,<12"
      - name: Acquire fourteen sparse source-native anchor leaves and contact sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/13qz /tmp/tianwen-13qz
          cat >audit/13qz/acquire.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const book='GK00067_00',root='/tmp/tianwen-13qz';
          const folios=['011a','018a','025a','032a','039a','046a','053a','060a','067a','074a','081a','088a','095a','102a'];
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.BROWSER,args:['--no-sandbox','--disable-setuid-sandbox']});
          const page=await browser.newPage();
          await page.goto('https://kyudb.snu.ac.kr/book/list.do?book_cate=SIC04&mid=GDS',{waitUntil:'networkidle2',timeout:90000});
          const bound=await page.evaluate(book=>!!document.querySelector('tr input[value="'+book+'"]')&&document.body.innerText.includes('交食推步法'),book);
          if(!bound)throw Error('Provider catalog source identity not validated in this session');
          const rows=[];
          for(const p of folios){
            const fn=`${book}IH_0001_${p}.jpg`,fpath=`/data01/stream/SIC/IMG/${book}/${book}_0001/${fn}`;
            const url=`https://kyudb.snu.ac.kr/ImageServlet.do?imgFileNm=${encodeURIComponent(fn)}&path=${encodeURIComponent(fpath)}`;
            const tab=await browser.newPage();
            let buf=null,status=null,error=null;
            for(let attempt=1;attempt<=2;attempt++){
              try{const resp=await tab.goto(url,{waitUntil:'domcontentloaded',timeout:23000});
                status=resp?.status()??null;
                if(resp?.ok()){let x=await resp.buffer();if(x.length>50000&&x[0]===255&&x[1]===216){buf=x;break;}}
              }catch(e){error=String(e)}
            }
            await tab.close();
            const row={p,bytes:buf?.length||0,sha256:buf?crypto.createHash('sha256').update(buf).digest('hex'):null,status,error,source_url:url};
            if(buf)fs.writeFileSync(root+'/'+p+'.jpg',buf);
            rows.push(row);
            console.log('JIAOSHI_SOURCE_FOLIO_RECEIPT '+JSON.stringify({p,bytes:row.bytes,sha256:row.sha256,status,error}));
          }
          fs.writeFileSync(root+'/receipt.json',JSON.stringify({schema:'TIANWEN-13QZ-GK00067-ORIGINAL-SPARSE-FOLIO-ATLAS',provider:'SNU Kyujanggak',book_cd:book,folio_selection:'14 a-side spaced 7 folios across 105-leaf original, section LOCATION ONLY',rows,source_original_visual_review_required:true,ocr_used:false},null,2)+'\n');
          await browser.close();
          if(rows.filter(x=>x.sha256).length<10)process.exitCode=2;
          JS
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          BROWSER="$BROWSER" node audit/13qz/acquire.mjs
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          from pathlib import Path
          import base64,hashlib
          root=Path('/tmp/tianwen-13qz')
          ps=['011a','018a','025a','032a','039a','046a','053a','060a','067a','074a','081a','088a','095a','102a']
          for batchnum,offset in enumerate((0,7),1):
              selected=ps[offset:offset+7]
              montage=Image.new('RGB',(3*510,3*875),'white')
              for i,p in enumerate(selected):
                  path=root/(p+'.jpg')
                  if not path.exists():continue
                  im=Image.open(path).convert('RGB')
                  im.thumbnail((490,815))
                  xy=((i%3)*510+(510-im.width)//2,(i//3)*875+28)
                  montage.paste(im,xy)
                  ImageDraw.Draw(montage).text(((i%3)*510+16,(i//3)*875+7),p,fill='black')
              out=root/f'contact-{batchnum:02d}.jpg'
              montage.save(out,quality=75,optimize=True)
              blob=out.read_bytes()
              print('JIAOSHI_CONTACT_SHA',out.name,len(blob),hashlib.sha256(blob).hexdigest())
              enc=base64.b64encode(blob).decode()
              print('JIAOSHI_CONTACT_BEGIN',out.name)
              for k in range(0,len(enc),3000):print('JIAOSHI_CONTACT_B64',out.name,enc[k:k+3000])
              print('JIAOSHI_CONTACT_END',out.name)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13qz-official-jiaoshi-landmark-folios
          path: /tmp/tianwen-13qz/
          if-no-files-found: warn
          retention-days: 14
