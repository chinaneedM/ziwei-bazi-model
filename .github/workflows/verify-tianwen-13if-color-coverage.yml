name: verify-tianwen-13if-color-coverage
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13IF-*'
      - 'docs/research/evidence/13if/**'
      - 'scripts/verify-tianwen-13if-color-coverage.py'
      - 'tests/test_tianwen_13if_*.py'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - '.github/workflows/verify-tianwen-13if-color-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/verify-tianwen-13if-color-coverage.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13if_*.py' -v
