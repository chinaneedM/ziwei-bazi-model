name: research-ziwei-zhangguo-aw-r8-nijl-vol8-window

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-zhangguo-aw-r8-nijl-vol8-window.yml

permissions:
  contents: write

jobs:
  fetch-window:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
      - name: Fetch NIJL scan pages 326-346 without OCR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/research/media/batch-12aw-nijl-vol8-window
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          root=pathlib.Path('docs/research/media/batch-12aw-nijl-vol8-window')
          rows=[]
          for i in range(326,347):
              svc=f'https://kokusho.nijl.ac.jp/api/iiif/100238879/v4/THKW/THKW-04306/THKW-04306-{i:05d}.tif'
              url=svc+'/full/1400,/0/default.jpg'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Batch12AW-R8 research'})
              with urllib.request.urlopen(req,timeout=120) as r:
                  data=r.read()
                  ctype=r.headers.get('Content-Type','')
              p=root/f'page-{i:03d}.jpg'
              p.write_bytes(data)
              rows.append({'index':i,'url':url,'content_type':ctype,'size':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          meta={
              'schema':'ZIWEI-ZHANGGUO-NIJL-VOL8-CANDIDATE-WINDOW-R1',
              'batch':'BATCH-12AW',
              'bid':'100238879',
              'range':[326,346],
              'method':'DIRECT_IIIF_IMAGE_FETCH_NO_OCR',
              'purpose':'Locate Zhangguo Xingzong 8 passage around 人命多有生時不定 / 以子為亥亥為子 / 七政曆夜子上四刻下四刻.',
              'rows':rows,
          }
          (root/'manifest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit candidate scan window
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/media/batch-12aw-nijl-vol8-window
          git commit -m 'record Batch 12AW NIJL vol8 candidate scan window'
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
