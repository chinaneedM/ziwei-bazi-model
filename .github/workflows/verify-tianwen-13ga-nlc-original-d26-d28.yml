name: verify-tianwen-13ga-nlc-original-d26-d28
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
  workflow_dispatch:
jobs:
  verify-native-day-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original NLC D26-D28 field and D30 null boundary
        run: python scripts/verify-tianwen-13ga-nlc-p76-d26-d28.py
      - name: Mutation tests
        run: python -m unittest discover -s tests -p 'test_verify_tianwen_13ga_nlc_p76_d26_d28.py' -v
