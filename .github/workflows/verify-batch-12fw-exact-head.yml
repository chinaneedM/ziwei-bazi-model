name: verify-batch-12fw-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fw-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FW exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-DENG-ZHICHENG-DIARY-1950-0129-FACSIMILE-VOLUME5-JAPAN-HOLDING-BOUNDARY-FW'
          e=json.loads(Path('docs/research/ZIWEI-DENG-ZHICHENG-DIARY-1950-0129-FACSIMILE-VOLUME5-JAPAN-HOLDING-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          p=e['first_party_facsimile_control']
          assert p['isbn']=='9787501334773'
          assert p['publication_date']=='2007-07-11'
          assert p['volume_count']==8
          assert p['target_date']=='1950-01-29'
          assert p['target_date_in_volume5_notebook14'] is True
          assert p['target_volume_toc']['volume']==5
          assert p['target_volume_toc']['notebook_14_start']=='1949-01-29'
          assert p['target_volume_toc']['notebook_14_end']=='1950-02-16'
          assert p['exact_target_page_number']=='UNRESOLVED'
          assert p['target_facsimile_page_directly_reviewed_by_project'] is False

          c=e['cinii_bibliographic_and_holding_control']
          assert c['ncid']=='BA83843361'
          assert c['note']=='影印本'
          assert c['target_volume']==5
          assert c['volume5_japan_holding_routes_closed'] is True
          assert c['remote_copy_eligibility_closed'] is False
          assert {x['item_identifier'] for x in c['volume5_holdings']}=={'16200370985','200003056595','505909','370054578'}

          s=e['secondary_or_derived_text_controls']
          assert s['direct_facsimile_text_status']=='NOT_REVIEWED'
          assert s['reported_wording_status']=='PUBLICATION_MEDIATED_QUOTATION_PENDING_DIRECT_FACSIMILE_COLLATION'
          assert s['2012_derived_work']['role']=='SELECTED_SIMPLIFIED_HORIZONTAL_DERIVATIVE_FROM_DENG_DIARY_NOT_PRIMARY_FACSIMILE'

          a=e['adjudication']
          assert a['target_1950_01_29_volume']=='CLOSED_AS_VOLUME_5_NOTEBOOK_14'
          assert a['target_1950_01_29_exact_page_number']=='UNRESOLVED'
          assert a['target_1950_01_29_facsimile_text']=='NOT_REVIEWED'
          assert a['reported_forty_million_purchase']=='PUBLICATION_MEDIATED_PENDING_DIRECT_COLLATION'
          assert a['reported_twelve_boxes']=='PUBLICATION_MEDIATED_PENDING_DIRECT_COLLATION'
          assert a['reported_public_custody']=='PUBLICATION_MEDIATED_PENDING_DIRECT_COLLATION'
          assert a['target_specific_purchase_route_selected'] is False
          assert a['target_specific_donation_route_selected'] is False
          assert a['final_nlc_acquisition_transfer_path']=='UNRESOLVED'

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['schema_version']=='1.183.0'
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc'].endswith('ZIWEI-DENG-ZHICHENG-DIARY-1950-0129-FACSIMILE-VOLUME5-JAPAN-HOLDING-BOUNDARY-FW.md')
          assert state['historical_audit']['row_count']==198
          assert state['historical_audit']['audited_row_count']==166
          assert state['historical_audit']['current_missing_from_product_row_count']==10
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==13
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==13
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {'EXT-NLCPRESS-DENG-ZHICHENG-DIARY-FACSIMILE-2007','EXT-CINII-DENG-ZHICHENG-DIARY-FACSIMILE-2007','EXT-SOHU-2019-ZHAO-WANLI-GU-DENG-TIEQIN-PURCHASE-DIARY-CONTROLS'}.issubset(ids)

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          PY
