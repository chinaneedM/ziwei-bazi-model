name: probe-tianwen-13vz-nlc08938-juan45-original
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-tianwen-13vz-nlc08938-juan45-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve source-native public-domain PDF and make page navigation atlas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m pip install -q pymupdf pillow
          python - <<'PYCODE'
          import base64, hashlib, io, json, pathlib, urllib.request
          import fitz
          from PIL import Image,ImageDraw,ImageFont
          filename = "NLC892-411999015732-116218_古今律曆考_第19冊.pdf"
          url = "https://upload.wikimedia.org/wikipedia/commons/c/c4/" + urllib.parse.quote(filename)
          record = {
            "status":"NOT_ACQUIRED", "source_url":url,
            "provider":"Wikimedia Commons, NLC892 411999015732 116218",
            "expected_pdf_pages":59,"expected_metadata_bytes":18385517,
            "file":"第19冊 卷四十五至四十七"
          }
          try:
            request=urllib.request.Request(url,headers={"User-Agent":"TianwenHistoricalSourceCollation/1.0 (public domain academic verification)"})
            with urllib.request.urlopen(request,timeout=100) as r:
              data=r.read(32000001)
              record.update({"http_status":r.status,"final_url":r.url,
                             "content_type":r.headers.get("Content-Type"),
                             "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
            if len(data)>32000000 or not data.startswith(b"%PDF-"):
              raise ValueError("Source is not an expected PDF within 32 MB")
            if not record["final_url"].startswith("https://upload.wikimedia.org/"):
              raise ValueError("Unexpected domain redirect")
            pathlib.Path("evidence/source.pdf").write_bytes(data)
            document=fitz.open(stream=data,filetype="pdf")
            record["pdf_pages"]=len(document)
            if len(document)!=59:
              raise ValueError("Unexpected page count; do not build atlas")
            width,height,gap,cols=200,290,8,7
            rows=(len(document)+cols-1)//cols
            sheet=Image.new("RGB",(cols*(width+gap)+gap,rows*(height+gap)+gap),(246,246,246))
            draw=ImageDraw.Draw(sheet)
            page_meta=[]
            for idx,page in enumerate(document):
              rect=page.rect
              pix=page.get_pixmap(matrix=fitz.Matrix(190/rect.width,190/rect.width),alpha=False)
              im=Image.frombytes("RGB",(pix.width,pix.height),pix.samples)
              im.thumbnail((width,height-22))
              x=gap+(idx%cols)*(width+gap)
              y=gap+(idx//cols)*(height+gap)
              sheet.paste(im,(x+(width-im.width)//2,y+21))
              draw.text((x+4,y+3),f"PDF p{idx+1:02d}",fill=(0,0,0))
              page_meta.append({"pdf_page":idx+1,"page_rect_points":[round(rect.width,2),round(rect.height,2)],"image_count":len(page.get_images(full=True))})
            buf=io.BytesIO()
            sheet.save(buf,format="JPEG",quality=75,optimize=True)
            atlas=buf.getvalue()
            record.update({"status":"SOURCE_BYTES_ACQUIRED_AND_59_PAGE_NAVIGATION_ATLAS","atlas_jpeg_sha256":hashlib.sha256(atlas).hexdigest(),"atlas_size":len(atlas),"first_page":page_meta[0],"last_page":page_meta[-1],"page_rect_info":page_meta})
            pathlib.Path("evidence/atlas.jpg").write_bytes(atlas)
            pathlib.Path("evidence/page-manifest.json").write_text(json.dumps(page_meta,ensure_ascii=False,indent=2))
            print("ATLAS_BEGIN","base64 JPEG; chunks=5000; sha256="+record["atlas_jpeg_sha256"])
            s=base64.b64encode(atlas).decode("ascii")
            for n in range(0,len(s),5000):print(f"ATLAS_PART {n//5000:04d} {s[n:n+5000]}")
            print("ATLAS_END")
            for pdf_number in (22,24,25,40,43):
              p=document[pdf_number-1]
              scale=4200/p.rect.width
              px=p.get_pixmap(matrix=fitz.Matrix(scale,scale),alpha=False)
              frame=Image.frombytes("RGB",(px.width,px.height),px.samples)
              framebuf=io.BytesIO()
              frame.save(framebuf,format="JPEG",quality=78,optimize=True)
              detail=framebuf.getvalue()
              digest=hashlib.sha256(detail).hexdigest()
              print(f"DETAIL_BEGIN {pdf_number} {len(detail)} {digest} {frame.width}x{frame.height}")
              payload=base64.b64encode(detail).decode("ascii")
              for off in range(0,len(payload),5000):
                print(f"DETAIL_PART {pdf_number:02d} {off//5000:04d} {payload[off:off+5000]}")
              print(f"DETAIL_END {pdf_number}")

          except Exception as ex:
            record["error"]=str(ex)[:350]
          pathlib.Path("evidence/result.json").write_text(json.dumps(record,ensure_ascii=False,indent=2)+"\n")
          print("SOURCE_RESULT",json.dumps({k:v for k,v in record.items() if k!="page_rect_info"},ensure_ascii=False))
          PYCODE
          rm -f evidence/source.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13vz-nlc08938-juan45-source-manifest-and-atlas
          path: |
            evidence/result.json
            evidence/page-manifest.json
            evidence/atlas.jpg
          if-no-files-found: warn
