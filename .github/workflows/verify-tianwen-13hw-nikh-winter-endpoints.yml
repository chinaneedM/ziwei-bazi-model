name: verify-tianwen-13hw-nikh-winter-endpoints
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/research/TIANWEN-13HW-NIKH-GORYEOSA-WINTER-87-DAY-ENDPOINT-ARITHMETIC-R1.json
      - docs/research/TIANWEN-13HW-NIKH-GORYEOSA-WINTER-87-DAY-ENDPOINT-ARITHMETIC-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - scripts/verify-tianwen-13hw-winter-endpoint.py
      - tests/test_tianwen_13hw_winter_endpoint.py
      - .github/workflows/verify-tianwen-13hw-nikh-winter-endpoints.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/verify-tianwen-13hw-winter-endpoint.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13hw_winter_endpoint.py' -v
