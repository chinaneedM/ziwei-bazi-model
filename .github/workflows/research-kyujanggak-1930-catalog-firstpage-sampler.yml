name: research-kyujanggak-1930-catalog-firstpage-sampler

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1930-catalog-firstpage-sampler.yml"
      - "scripts/research_kyujanggak_1930_catalog_firstpage_sampler.py"

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi pillow
      - name: Fetch one no-OCR first content page per volume
        run: |
          python scripts/research_kyujanggak_1930_catalog_firstpage_sampler.py \
            --output artifacts/kyujanggak-1930-catalog-firstpages
      - name: Upload first-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1930-catalog-firstpages-${{ github.sha }}
          path: artifacts/kyujanggak-1930-catalog-firstpages/
          if-no-files-found: warn
          retention-days: 7
