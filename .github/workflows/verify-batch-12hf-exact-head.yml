name: verify-batch-12hf-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hf-exact-head.yml
      - .github/workflows/verify-batch-12he-exact-head.yml
      - docs/research/ZIWEI-ZHAO-WANLI-1951-DING-HUIKANG-SIX-TITLES-TWO-NAMED-CONTEMPORARY-PUBLICATION-BRIDGE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-ZHAO-WANLI-1951-DING-HUIKANG-SIX-TITLES-TWO-NAMED-CONTEMPORARY-PUBLICATION-BRIDGE-HF.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HF exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-ZHAO-WANLI-1951-DING-HUIKANG-SIX-TITLES-TWO-NAMED-CONTEMPORARY-PUBLICATION-BRIDGE-HF'
          e=json.loads(Path('docs/research/ZIWEI-ZHAO-WANLI-1951-DING-HUIKANG-SIX-TITLES-TWO-NAMED-CONTEMPORARY-PUBLICATION-BRIDGE-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          p=e['original_publication_bibliographic_control']
          assert p['target_periodical']=='文物参考资料' and p['target_year']==1951 and p['target_issue']==9 and p['target_pages']=='221–233'
          q=e['quotation_bridge_control']
          assert q['quoted_ding_attribution']=='丁惠康先生捐赠' and q['quoted_total_title_count']==6
          assert [x['title'] for x in q['explicitly_named_members']]==['东家杂记','太平乐府']
          rel=e['relation_to_hc_and_hd']
          assert rel['hf_six_equals_hc_six']=='STRONGLY_COMPATIBLE_NOT_PROVED'
          assert rel['may_merge_wangyou_qingleji_into_hf_six'] is False
          assert rel['may_use_hf_six_to_fill_hd_ruganzhong'] is False
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,218,0)
          assert bid in state['historical_audit']['completed_batches']
          latest=state['historical_audit']['latest_batch_doc']
          assert isinstance(latest,str) and latest.startswith('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-') and latest.endswith('.md')
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-NLC-LIUPENG-YONGLE-REVIEW-ZHAO1951-BIBLIOGRAPHIC-CONTROL']['batch_12hf']['target_pages']=='221–233'
          assert src['EXT-XIAO-LING-2026-ZHAO-WANLI-DING-HUIKANG-SIX-TITLE-QUOTE']['batch_12hf']['explicitly_named_titles']==['东家杂记','太平乐府']
          assert e['transmission_impact']['nodes_added']==[] and e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['accounting']['matrix_rows']==198 and e['accounting']['audited_rows']==166 and e['accounting']['current_missing_from_product_rows']==10
          PY
