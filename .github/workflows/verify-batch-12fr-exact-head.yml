name: verify-batch-12fr-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fr-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FR exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          fq='BATCH-12-ZIWEI-TOKYO-JI-SHUYING-CH9-REMOTE-COPY-ELIGIBILITY-AND-PAGE-RANGE-BOUNDARY-FQ'
          fr='BATCH-12-ZIWEI-BEITU-HISTORY-MATERIALS-PP446-449-DIRECT-ACCESS-BOUNDARY-FR'
          fq_e=json.loads(Path('docs/research/ZIWEI-TOKYO-JI-SHUYING-CH9-REMOTE-COPY-ELIGIBILITY-AND-PAGE-RANGE-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          fr_e=json.loads(Path('docs/research/ZIWEI-BEITU-HISTORY-MATERIALS-1949-1966-PP446-449-DIRECT-ACCESS-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert fq_e['batch_id']==fq
          assert fr_e['batch_id']==fr

          fq_a=fq_e['adjudication']
          assert fq_a['chapter_9_page_range']=='UNRESOLVED'
          assert fq_a['reference_service_is_correct_page_range_resolution_route']=='CLOSED'
          assert fq_a['this_exact_book_definitively_eligible_for_outside_tokyo_remote_copy']=='NOT_PREJUDGED'
          fq_u=fq_e['user_action_firewall']
          assert fq_u['no_paid_copy_request_submitted'] is True
          assert fq_u['no_identity_document_submitted'] is True
          assert fq_u['no_payment_authorized'] is True

          ndl=fr_e['source_chain']['ndl_exact_upper_volume']
          assert ndl['ndl_bibliographic_id']=='a0000036720'
          assert ndl['ndl_call_number']=='UL215-C3'
          assert ndl['pages']==866
          assert ndl['pp446_449_within_upper_volume'] is True
          assert ndl['page_content_reviewed_by_project'] is False
          tok=fr_e['source_chain']['tokyo_metropolitan_exact_upper_volume']
          assert tok['call_number']=='C/0161/1/2-1'
          assert tok['material_code']=='4000017284'
          assert tok['availability']=='利用可'

          a=fr_e['adjudication']
          assert a['pp446_449_direct_text']=='NOT_REVIEWED'
          assert a['target_3482_3483_batch_membership']=='UNRESOLVED'
          assert a['target_specific_purchase_route_selected'] is False
          assert a['target_specific_donation_route_selected'] is False
          assert a['final_nlc_acquisition_transfer_path']=='UNRESOLVED'

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['schema_version']=='1.178.0'
          assert fq in state['historical_audit']['completed_batches']
          assert fr in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc'].endswith('ZIWEI-BEITU-HISTORY-MATERIALS-PP446-449-DIRECT-ACCESS-BOUNDARY-FR.md')
          assert state['historical_audit']['row_count']==198
          assert state['historical_audit']['audited_row_count']==166
          assert state['historical_audit']['current_missing_from_product_row_count']==10
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==13
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==13
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={s.get('source_id') for s in reg['sources']}
          assert 'EXT-NDL-BEITU-HISTORY-MATERIALS-2-UPPER-1997' in ids
          assert 'EXT-TOKYO-METRO-LIB-BEITU-HISTORY-MATERIALS-2-UPPER-1997' in ids
          nlc=next(s for s in reg['sources'] if s.get('source_id')=='EXT-NLC-PCAB-ZHENG-ZHENDUO-QU-DONATION-AND-PRICED-ACQUISITION-2024')
          assert nlc['batch_12fr']['cited_pages']=='446—449'
          assert nlc['batch_12fr']['direct_pp446_449_text_exposed'] is False

          assert fr_e['transmission_impact']['nodes_added']==[]
          assert fr_e['transmission_impact']['edges_added']==[]
          assert fr_e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert fr_e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert fr_e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert fr_e['chronology_and_rule_firewall']['matrix_count_change'] is False
          PY
