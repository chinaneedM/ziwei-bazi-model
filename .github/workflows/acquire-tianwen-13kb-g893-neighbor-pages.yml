name: acquire-tianwen-13kb-g893-neighbor-pages
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13kb-g893-neighbor-pages.py
      - tests/test_tianwen_13kb_g893_neighbors.py
      - .github/workflows/acquire-tianwen-13kb-g893-neighbor-pages.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python -m unittest discover -s tests -p 'test_tianwen_13kb_g893_neighbors.py' -v
      - run: python scripts/acquire-tianwen-13kb-g893-neighbor-pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13kb-source-issued-neighbor-pages-uncollated
          path: /tmp/tianwen-13kb/
          retention-days: 30
          if-no-files-found: warn
