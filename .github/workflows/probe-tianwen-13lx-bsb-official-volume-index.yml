name: probe-tianwen-13lx-bsb-official-volume-index
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-tianwen-13lx-bsb-mingshi-volume-index.py
      - tests/test_tianwen_13lx_bsb_index.py
      - .github/workflows/probe-tianwen-13lx-bsb-official-volume-index.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install beautifulsoup4
      - run: python -m unittest discover -s tests -p 'test_tianwen_13lx_bsb_index.py' -v
      - run: python scripts/probe-tianwen-13lx-bsb-mingshi-volume-index.py --out /tmp/tianwen-13lx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13lx-bsb-official-volume-index-source
          path: /tmp/tianwen-13lx/
          if-no-files-found: warn
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
