name: research-ndl-exact-child-request-contract-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-ndl-exact-child-request-contract-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect source-emitted request/copy frontend contracts
        run: |
          set -euo pipefail
          mkdir -p research-out
          python - <<'PY'
          import hashlib, json, re, urllib.parse, urllib.request
          from pathlib import Path

          target="https://ndlsearch.ndl.go.jp/books/R100000002-Ia0000052718-i25264793"
          ua={"User-Agent":"Mozilla/5.0 TianwenHistoricalAudit/1.0"}
          keywords=[
              "request/rcopy","requestApiResponse","requestItemFromTml","requestItemFromKsk",
              "requestItemFromIlcl","checkedCartItems","giinreq","cloan","rloan","sloan",
              "sbrowse","remote copy","遠隔複写","複写","cart","requestCount"
          ]
          def get(url):
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read()
                  return b,getattr(r,"status",200),r.geturl(),r.headers.get("Content-Type")

          html,status,final,ctype=get(target)
          text=html.decode("utf-8","replace")
          Path("research-out/target-child.html").write_bytes(html)
          modules=[]
          for src in re.findall(r'<script[^>]+type=["\']module["\'][^>]+src=["\']([^"\']+)["\']',text,re.I):
              u=urllib.parse.urljoin(target,src)
              if u not in modules: modules.append(u)
          out={
              "target":target,
              "target_status":status,
              "target_sha256":hashlib.sha256(html).hexdigest(),
              "source_emitted_module_urls":modules,
              "modules":[],
              "keyword_summary":{},
              "api_like_literals":[]
          }

          fetched={}
          queue=list(modules)
          # Source-emitted main module + finite first-level module imports only.
          max_modules=80
          while queue and len(fetched)<max_modules:
              u=queue.pop(0)
              if u in fetched: continue
              try:
                  b,st,fu,ct=get(u)
              except Exception as ex:
                  fetched[u]={"error":repr(ex)}
                  continue
              js=b.decode("utf-8","replace")
              fetched[u]={"status":st,"final_url":fu,"content_type":ct,"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b),"text":js}
              if len(fetched)==1:
                  # Only expand imports emitted by the entry module; no guessed chunks.
                  for rel in re.findall(r'(?:from\s*|import\s*\()["\'](\.?/?[^"\']+\.js)["\']',js):
                      iu=urllib.parse.urljoin(u,rel)
                      if iu not in fetched and iu not in queue: queue.append(iu)

          api_literals=set()
          for u,rec in fetched.items():
              if "text" not in rec:
                  out["modules"].append({"url":u,**rec})
                  continue
              js=rec.pop("text")
              hits={}
              for kw in keywords:
                  poss=[m.start() for m in re.finditer(re.escape(kw),js,re.I)]
                  if poss:
                      hits[kw]=[]
                      for pos in poss[:6]:
                          hits[kw].append(re.sub(r"\s+"," ",js[max(0,pos-500):min(len(js),pos+900)]))
              for lit in re.findall(r'["\'](\/[^"\']{2,160})["\']',js):
                  if re.search(r'(request|copy|rcopy|loan|cart|holding|item|giinreq|sbrowse)',lit,re.I):
                      api_literals.add(lit)
              out["modules"].append({
                  "url":u,
                  "status":rec.get("status"),
                  "content_type":rec.get("content_type"),
                  "sha256":rec.get("sha256"),
                  "bytes":rec.get("bytes"),
                  "keyword_hits":hits
              })
          for kw in keywords:
              out["keyword_summary"][kw]=sum(len(m.get("keyword_hits",{}).get(kw,[])) for m in out["modules"])
          out["api_like_literals"]=sorted(api_literals)
          out["modules_fetched_count"]=len(fetched)
          out["contract_execution_performed"]=False
          out["login_performed"]=False
          out["request_submission_performed"]=False
          Path("research-out/result.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ndl-exact-child-request-contract-probe
          path: research-out
          if-no-files-found: error
