name: probe-batch-12je-rmrb-official-archive-search-contract
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12je-rmrb-official-archive-search-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official People Daily archive search contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, urllib.request
          from pathlib import Path
          from urllib.parse import urlencode, urljoin, urlparse

          UA='Mozilla/5.0 (compatible; TianwenHistoricalAudit/1.0; +https://github.com/chinaneedM/ziwei-bazi-model)'
          entry='https://data.people.com.cn/rmrb'

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  body=resp.read(2_000_000)
                  ctype=resp.headers.get('Content-Type','')
                  enc='utf-8'
                  m=re.search(r'charset=([A-Za-z0-9._-]+)',ctype,re.I)
                  if m: enc=m.group(1)
                  try: text=body.decode(enc,errors='replace')
                  except LookupError: text=body.decode('utf-8',errors='replace')
                  return resp.status,resp.geturl(),ctype,text

          def forms(base,body):
              out=[]
              for m in re.finditer(r'<form\b([^>]*)>(.*?)</form>',body,re.I|re.S):
                  attrs,inner=m.group(1),m.group(2)
                  am=re.search(r'action=["\']([^"\']*)["\']',attrs,re.I)
                  mm=re.search(r'method=["\']([^"\']*)["\']',attrs,re.I)
                  action=urljoin(base,html.unescape(am.group(1))) if am else base
                  method=(mm.group(1).upper() if mm else 'GET')
                  fields=[]
                  for tag in re.findall(r'<(?:input|select|textarea)\b[^>]*>',inner,re.I):
                      nm=re.search(r'name=["\']([^"\']+)["\']',tag,re.I)
                      typ=re.search(r'type=["\']([^"\']+)["\']',tag,re.I)
                      vm=re.search(r'value=["\']([^"\']*)["\']',tag,re.I)
                      if nm:
                          fields.append({
                              'name':html.unescape(nm.group(1)),
                              'type':typ.group(1).lower() if typ else None,
                              'value':html.unescape(vm.group(1)) if vm else None,
                              'checked':bool(re.search(r'\bchecked(?:\s*=|\s|>)',tag,re.I)),
                          })
                  selects=[]
                  for sm in re.finditer(r'<select\b([^>]*)>(.*?)</select>',inner,re.I|re.S):
                      sa,si=sm.group(1),sm.group(2)
                      nm=re.search(r'name=["\']([^"\']+)["\']',sa,re.I)
                      if not nm: continue
                      opts=[]
                      for om in re.finditer(r'<option\b([^>]*)>(.*?)</option>',si,re.I|re.S):
                          oa,label=om.group(1),re.sub(r'<[^>]+>',' ',om.group(2))
                          vm=re.search(r'value=["\']([^"\']*)["\']',oa,re.I)
                          opts.append({'value':html.unescape(vm.group(1)) if vm else re.sub(r'\s+',' ',html.unescape(label)).strip(),'selected':bool(re.search(r'\bselected(?:\s*=|\s|>)',oa,re.I))})
                      selects.append({'name':html.unescape(nm.group(1)),'options':opts[:200]})
                  out.append({'action':action,'method':method,'same_host':urlparse(action).hostname=='data.people.com.cn','fields':fields,'selects':selects})
              return out

          s,u,ct,b=get(entry)
          entry_forms=forms(u,b)
          links=[]
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',b,re.I|re.S):
              href,label=m.group(1),re.sub(r'<[^>]+>',' ',m.group(2))
              label=re.sub(r'\s+',' ',html.unescape(label)).strip()
              full=urljoin(u,html.unescape(href))
              if urlparse(full).hostname=='data.people.com.cn':
                  links.append({'url':full,'label':label})
          search_links=[x for x in links if ('搜索' in x['label'] or '/sc?' in x['url'] or 'search' in x['url'].lower())]
          source_search=search_links[0]['url'] if search_links else None

          search=None
          if source_search:
              ss,su,sct,sb=get(source_search)
              search={'status':ss,'final_url':su,'body_bytes_utf8':len(sb.encode('utf-8')),'forms':forms(su,sb),'login_literal_present':'未登录' in sb or '登录' in sb}

          # Submit one target query using only the first source-emitted public form contract.
          target_query=None
          if entry_forms and entry_forms[0].get('method')=='GET' and entry_forms[0].get('same_host'):
              form=entry_forms[0]
              params={}
              for fld in form.get('fields',[]):
                  name=fld.get('name')
                  if not name:
                      continue
                  typ=fld.get('type')
                  if typ=='hidden' and fld.get('value') is not None:
                      params[name]=fld.get('value')
                  elif typ=='radio' and fld.get('checked') and fld.get('value') is not None:
                      params[name]=fld.get('value')
              params['queryStr']='关于《永乐大典》'
              target_url=form['action']+'?'+urlencode(params)
              qs,qu,qct,qb=get(target_url)
              qtext=html.unescape(re.sub(r'<[^>]+>',' ',qb))
              qtext=re.sub(r'\\s+',' ',qtext)
              target_links=[]
              for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',qb,re.I|re.S):
                  href,label=m.group(1),re.sub(r'<[^>]+>',' ',m.group(2))
                  label=re.sub(r'\\s+',' ',html.unescape(label)).strip()
                  full=urljoin(qu,html.unescape(href))
                  if urlparse(full).hostname=='data.people.com.cn' and '关于' in label and '永乐大典' in label:
                      target_links.append({'url':full,'label':label})
              dedup=[]
              seen=set()
              for x in target_links:
                  if x['url'] not in seen:
                      seen.add(x['url']); dedup.append(x)
              followed=[]
              for x in dedup[:3]:
                  fs,fu,fct,fb=get(x['url'])
                  ftxt=html.unescape(re.sub(r'<[^>]+>',' ',fb))
                  ftxt=re.sub(r'\\s+',' ',ftxt)
                  followed.append({
                      'url':x['url'],
                      'status':fs,
                      'final_url':fu,
                      'label':x['label'],
                      'body_bytes_utf8':len(fb.encode('utf-8')),
                      'date_1951_08_13_present':'1951年8月13日' in ftxt or '1951-08-13' in ftxt,
                      'date_1951_08_31_present':'1951年8月31日' in ftxt or '1951-08-31' in ftxt,
                      'page3_present':'第3版' in ftxt or '第03版' in ftxt,
                      'login_literal_present':'未登录' in ftxt,
                  })
              target_query={
                  'source_emitted_action':form['action'],
                  'method':'GET',
                  'submitted_params':params,
                  'requested_url':target_url,
                  'status':qs,
                  'final_url':qu,
                  'body_bytes_utf8':len(qb.encode('utf-8')),
                  'login_literal_present':'未登录' in qtext,
                  'target_title_literal_present':'关于《永乐大典》' in qtext,
                  'date_1951_08_13_present':'1951年8月13日' in qtext or '1951-08-13' in qtext,
                  'date_1951_08_31_present':'1951年8月31日' in qtext or '1951-08-31' in qtext,
                  'source_emitted_target_links':dedup[:20],
                  'followed_target_links':followed,
              }

          result={
              'probe':'BATCH-12JE-RMRB-OFFICIAL-ARCHIVE-SEARCH-CONTRACT',
              'entry':{'requested_url':entry,'status':s,'final_url':u,'body_bytes_utf8':len(b.encode('utf-8')),'forms':entry_forms},
              'source_emitted_search_links':search_links[:20],
              'source_emitted_search_surface':search,
              'target_query_submitted':target_query is not None,
              'target_query':target_query,
              'historical_date_url_guessed':False,
              'login_used':False,
              'account_action_used':False,
              'subscription_bypass_used':False,
              'followup_rule':'If the source-emitted target result is public, use its own metadata/link only; never synthesize historical-date URLs or bypass login/subscription controls.'
          }
          out=Path('artifacts/batch-12je'); out.mkdir(parents=True,exist_ok=True)
          (out/'probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12je-rmrb-official-archive-search-contract
          path: artifacts/batch-12je
          if-no-files-found: error
