name: probe-batch-12je-rmrb-official-archive-search-contract
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12je-rmrb-official-archive-search-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official People Daily archive search contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, urllib.request
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          UA='Mozilla/5.0 (compatible; TianwenHistoricalAudit/1.0; +https://github.com/chinaneedM/ziwei-bazi-model)'
          entry='https://data.people.com.cn/rmrb'

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  body=resp.read(2_000_000)
                  ctype=resp.headers.get('Content-Type','')
                  enc='utf-8'
                  m=re.search(r'charset=([A-Za-z0-9._-]+)',ctype,re.I)
                  if m: enc=m.group(1)
                  try: text=body.decode(enc,errors='replace')
                  except LookupError: text=body.decode('utf-8',errors='replace')
                  return resp.status,resp.geturl(),ctype,text

          def forms(base,body):
              out=[]
              for m in re.finditer(r'<form\b([^>]*)>(.*?)</form>',body,re.I|re.S):
                  attrs,inner=m.group(1),m.group(2)
                  am=re.search(r'action=["\']([^"\']*)["\']',attrs,re.I)
                  mm=re.search(r'method=["\']([^"\']*)["\']',attrs,re.I)
                  action=urljoin(base,html.unescape(am.group(1))) if am else base
                  method=(mm.group(1).upper() if mm else 'GET')
                  fields=[]
                  for tag in re.findall(r'<(?:input|select|textarea)\b[^>]*>',inner,re.I):
                      nm=re.search(r'name=["\']([^"\']+)["\']',tag,re.I)
                      typ=re.search(r'type=["\']([^"\']+)["\']',tag,re.I)
                      if nm:
                          fields.append({'name':html.unescape(nm.group(1)),'type':typ.group(1).lower() if typ else None})
                  out.append({'action':action,'method':method,'same_host':urlparse(action).hostname=='data.people.com.cn','fields':fields})
              return out

          s,u,ct,b=get(entry)
          links=[]
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',b,re.I|re.S):
              href,label=m.group(1),re.sub(r'<[^>]+>',' ',m.group(2))
              label=re.sub(r'\s+',' ',html.unescape(label)).strip()
              full=urljoin(u,html.unescape(href))
              if urlparse(full).hostname=='data.people.com.cn':
                  links.append({'url':full,'label':label})
          search_links=[x for x in links if ('搜索' in x['label'] or '/sc?' in x['url'] or 'search' in x['url'].lower())]
          source_search=search_links[0]['url'] if search_links else None

          search=None
          if source_search:
              ss,su,sct,sb=get(source_search)
              search={'status':ss,'final_url':su,'body_bytes_utf8':len(sb.encode('utf-8')),'forms':forms(su,sb),'login_literal_present':'未登录' in sb or '登录' in sb}

          result={
              'probe':'BATCH-12JE-RMRB-OFFICIAL-ARCHIVE-SEARCH-CONTRACT',
              'entry':{'requested_url':entry,'status':s,'final_url':u,'body_bytes_utf8':len(b.encode('utf-8')),'forms':forms(u,b)},
              'source_emitted_search_links':search_links[:20],
              'source_emitted_search_surface':search,
              'target_query_submitted':False,
              'historical_date_url_guessed':False,
              'login_used':False,
              'account_action_used':False,
              'subscription_bypass_used':False,
              'followup_rule':'Submit a 1951 target query only if the anonymous official source emits a concrete same-host search form/action contract usable without login.'
          }
          out=Path('artifacts/batch-12je'); out.mkdir(parents=True,exist_ok=True)
          (out/'probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12je-rmrb-official-archive-search-contract
          path: artifacts/batch-12je
          if-no-files-found: error
