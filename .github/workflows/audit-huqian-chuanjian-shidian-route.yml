name: audit-huqian-chuanjian-shidian-route

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-huqian-chuanjian-shidian-route.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bind Huqian juan-7 physical pages through Shidian browser SDK
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/huqian-chuanjian-shidian'
          mkdir -p "$ROOT/physical"
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          npm install --no-save --silent puppeteer-core@24.16.0
          cat > "$ROOT/probe.mjs" <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root='audit/huqian-chuanjian-shidian';
          const bookId='NGJ8921188204889';
          const source=`https://www.shidianguji.com/zh/book/${bookId}/chapter/1lule4i9rsz6x`;
          const payloadBase={bookId,pageSize:40,startPageNum:137,endPageNum:159,version:4,pageIndex:1,needCheckVersion:true,isWebpSupported:true};
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.BROWSER,args:['--no-sandbox','--disable-setuid-sandbox']});
          const page=await browser.newPage();
          await page.setUserAgent('Mozilla/5.0 Tianwen-Provenance-Audit/1.0');
          const attempts=[];
          let result=null;
          for(let attempt=1; attempt<=4; attempt++){
            await page.goto(source,{waitUntil:'networkidle2',timeout:90000});
            await page.waitForFunction(()=>window.byted_psdk && typeof window.byted_psdk.getPtokenStatus==='function',{timeout:60000});
            const one=await page.evaluate(async({payloadBase})=>{
              const ptoken=await window.byted_psdk.getPtokenStatus();
              const payload={...payloadBase,ptoken};
              const r=await fetch('/api/ancientlib/read/book/pages/v3/',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
              const j=await r.json();
              const pages=(j?.data?.pages || j?.pages || []);
              return {ptoken,errorCode:j?.errorCode,errorMsg:j?.errorMsg||'',pages};
            },{payloadBase});
            attempts.push({attempt,errorCode:one.errorCode,errorMsg:one.errorMsg,page_count:one.pages.length,page_nums:one.pages.map(x=>Number(x.pageNum))});
            if(one.errorCode===0 && one.pages.length>=20){result=one;break;}
            await new Promise(r=>setTimeout(r,2500*attempt));
          }
          const physical=[];
          if(result){
            for(const row of result.pages){
              const decrypted=await page.evaluate(async({picUrl,ptoken,urlEncryptType})=>{
                const d=await window.byted_psdk.decrypt(picUrl||'',ptoken,urlEncryptType);
                return d?.decrypt ? d.data : picUrl;
              },{picUrl:row.picUrl,ptoken:result.ptoken,urlEncryptType:row.urlEncryptType});
              const r=await fetch(decrypted,{headers:{referer:'https://www.shidianguji.com/','user-agent':'Mozilla/5.0 Tianwen-Provenance-Audit/1.0'}});
              const b=Buffer.from(await r.arrayBuffer());
              const ext=(r.headers.get('content-type')||'').includes('webp')?'webp':'png';
              const file=`${root}/physical/page-${String(row.pageNum).padStart(4,'0')}.${ext}`;
              fs.writeFileSync(file,b);
              physical.push({page_id:String(row.pageId),page_num:Number(row.pageNum),uri:row.uri,status:r.status,bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex'),content_type:r.headers.get('content-type'),file});
            }
          }
          const report={schema:'HUQIAN-CHUANJIAN-SHIDIAN-PHYSICAL-COLLATION-PROBE-R2',source,bookId,reader_binding:payloadBase,attempts,physical_pages:physical,adjudication_rule:'Only direct visual review of these source-bound physical page images may support edition glyph/number claims; OCR/transcription is locator-only.'};
          fs.writeFileSync(`${root}/report.json`,JSON.stringify(report,null,2));
          console.log(JSON.stringify({source,attempts,physical_count:physical.length,physical_pages:physical.map(x=>({page_num:x.page_num,bytes:x.bytes,sha256:x.sha256}))},null,2));
          await browser.close();
          if(physical.length<20) process.exitCode=2;
          JS
          BROWSER="$BROWSER" node "$ROOT/probe.mjs"
      - name: Upload physical-collation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huqian-chuanjian-shidian-physical
          path: audit/huqian-chuanjian-shidian
          if-no-files-found: error
          retention-days: 30
