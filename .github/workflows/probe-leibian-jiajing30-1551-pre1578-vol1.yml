name: probe-leibian-jiajing30-1551-pre1578-vol1

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-leibian-jiajing30-1551-pre1578-vol1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF render tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils imagemagick

      - name: Acquire and render Jiajing-30 candidate volume 1
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/leibian-jiajing30-1551-pre1578-vol1'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages" "$ROOT/contact"

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-411999026677-72517_%E9%A1%9E%E7%B7%A8%E6%9B%86%E6%B3%95%E9%80%9A%E6%9B%B8%E5%A4%A7%E5%85%A8_%E7%AC%AC1%E5%86%8A.pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"

          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source.sha256"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"

          pdftoppm -jpeg -jpegopt quality=88 -r 120 "$ROOT/source.pdf" "$ROOT/pages/page"
          mapfile -t pages < <(find "$ROOT/pages" -maxdepth 1 -name 'page-*.jpg' | sort -V)
          n=${#pages[@]}
          echo "RENDERED_PAGE_COUNT=$n" | tee "$ROOT/render-count.txt"
          test "$n" -eq 70
          sha256sum "${pages[@]}" | sort -V > "$ROOT/pages.sha256"

          for offset in 0 20 40 60; do
            start=$((offset+1))
            [ "$start" -gt "$n" ] && break
            end=$((offset+20)); [ "$end" -gt "$n" ] && end=$n
            chunk=("${pages[@]:offset:20}")
            montage "${chunk[@]}" -thumbnail 260x390 -tile 5x -geometry +4+4 "$ROOT/contact/contact-${start}-${end}.jpg"
          done
          sha256sum "$ROOT/contact"/*.jpg | sort -V > "$ROOT/contact.sha256"

          printf '%s\n'             'SOURCE=NLC892-411999026677-72517 類編曆法通書大全 第1冊'             'PUBLIC_DISCOVERY_CONTEXT=Wikimedia Commons groups the 411999026677 set under 1551 books from China; NLC backup list attributes the set to 元宋魯珍通書 / 明蔡彬撰'             'DATE_ROLE=DISCOVERY_CONTROL_ONLY_UNTIL_PHYSICAL_OR_BIBLIOGRAPHIC_BINDING_IS_ADJUDICATED'             'TARGETS=24QI copper-pot day/night-ke table; 四時加減晝夜節氣 table; title/edition/colophon evidence'             'QUESTION=Does this publicly dated pre-1578 candidate physically preserve the same table branches already observed in the undated Ming copy, and does either carry the exact Sanming/Yueling Dahan/Yushui fingerprint?'             'OCR_USED_FOR_FINAL_GLYPH_CLAIMS=false'             'CONTACT_RENDER_DPI=120'             > "$ROOT/manifest.txt"

          rm "$ROOT/source.pdf"

      - name: Upload locator evidence
        uses: actions/upload-artifact@v4
        with:
          name: leibian-jiajing30-1551-pre1578-vol1-locator
          path: audit/leibian-jiajing30-1551-pre1578-vol1/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
