name: verify-yehuobian-12ui-acquisition-gates-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12ui-acquisition-gates-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-SOURCE-REGISTRY-EXTENSIONS-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UI-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UJ-*.json
      - tests/test_yehuobian_national_library_acquisition_gates_12ui.py
      - tests/test_yehuobian_item_digital_crosswalk_12uj.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registries and continuity
        run: |
          set -euo pipefail
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-project-continuity-state-r1.py
      - name: No fake original-leaf votes and no unapproved copying
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_yehuobian_national_library_acquisition_gates_12ui.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_item_digital_crosswalk_12uj.py' -v
