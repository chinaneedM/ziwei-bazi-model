name: probe-nikh-goryeosa-original-download-13fd
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/probe-nikh-goryeosa-download-13fd.py
      - tests/test_probe_nikh_goryeosa_download_13fd.py
      - .github/workflows/probe-nikh-goryeosa-original-download-13fd.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-source-attested-image:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-contract negative tests
        run: |
          python -m py_compile scripts/probe-nikh-goryeosa-download-13fd.py
          python -m unittest discover -s tests -p 'test_probe_nikh_goryeosa_download_13fd.py' -v
      - name: Fetch at most one publisher-script-derived image
        run: python scripts/probe-nikh-goryeosa-download-13fd.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13fd-one-publisher-download
          path: /tmp/tianwen-13fd-probe/
          if-no-files-found: warn
          retention-days: 30
