name: probe-batch-12ic-guoxue-jikan11-public-routes

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - '.github/workflows/probe-batch-12ic-guoxue-jikan11-public-routes.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Probe public bibliographic and preview routes
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/batch-12ic-guoxue-jikan11-public-routes'
          rm -rf "$ROOT"; mkdir -p "$ROOT/raw"

          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlencode, quote
          from urllib.request import Request, urlopen
          import json,time

          root=Path('audit/batch-12ic-guoxue-jikan11-public-routes')
          ua='Tianwen-Provenance-Audit/1.0'
          fetch=[]

          def get(key,url,timeout=35):
              req=Request(url,headers={'User-Agent':ua,'Accept':'application/json,text/plain,*/*'})
              try:
                  with urlopen(req,timeout=timeout) as r:
                      b=r.read()
                      ct=r.headers.get('content-type','')
                  (root/'raw'/f'{key}.bin').write_bytes(b)
                  fetch.append({'key':key,'url':url,'ok':True,'bytes':len(b),'content_type':ct})
                  return b
              except Exception as e:
                  fetch.append({'key':key,'url':url,'ok':False,'error':repr(e)})
                  return b''

          gb_queries=[
              ('gb-title','"国学季刊" "第十一期"'),
              ('gb-title11','intitle:国学季刊 第十一期'),
              ('gb-isbn','isbn:9787209115018'),
              ('gb-article','"国图藏元刻十行本"'),
          ]
          gb_items={}
          for key,q in gb_queries:
              url='https://www.googleapis.com/books/v1/volumes?'+urlencode({'q':q,'maxResults':40,'printType':'books'})
              b=get(key,url)
              if b:
                  try:
                      o=json.loads(b)
                      for it in o.get('items') or []:
                          gb_items[it.get('id')]=it
                  except Exception:
                      pass
              time.sleep(.5)

          gb_rows=[]
          for vid,it in gb_items.items():
              v=it.get('volumeInfo') or {}
              a=it.get('accessInfo') or {}
              gb_rows.append({
                  'id':vid,'title':v.get('title'),'subtitle':v.get('subtitle'),
                  'authors':v.get('authors'),'publisher':v.get('publisher'),
                  'publishedDate':v.get('publishedDate'),'pageCount':v.get('pageCount'),
                  'industryIdentifiers':v.get('industryIdentifiers'),
                  'previewLink':v.get('previewLink'),'infoLink':v.get('infoLink'),
                  'viewability':a.get('viewability'),'embeddable':a.get('embeddable'),
                  'publicDomain':a.get('publicDomain'),'pdf':a.get('pdf')
              })
          (root/'google-books-matches.json').write_text(json.dumps(gb_rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # If Google Books returns a candidate volume, query only its public within-volume index.
          gb_search=[]
          for r in gb_rows:
              title=r.get('title') or ''
              ids=json.dumps(r.get('industryIdentifiers') or [],ensure_ascii=False)
              if '国学季刊' not in title and '國學季刊' not in title and '9787209115018' not in ids:
                  continue
              for q in ('国图藏元刻十行本','附释音春秋左传注疏','张丽娟'):
                  url='https://books.google.com/books?jscmd=SearchWithinVolume2&'+urlencode({'q':q,'vid':r['id']})
                  b=get('gb-within-'+r['id']+'-'+str(len(gb_search)),url)
                  row={'volume_id':r['id'],'query':q,'bytes':len(b)}
                  if b:
                      txt=b.decode('utf-8','replace')
                      row['response_prefix']=txt[:12000]
                  gb_search.append(row)
                  time.sleep(.4)
          (root/'google-books-within-volume.json').write_text(json.dumps(gb_search,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Open Library.
          ol=[]
          for key,url in [
              ('ol-isbn','https://openlibrary.org/isbn/9787209115018.json'),
              ('ol-search','https://openlibrary.org/search.json?'+urlencode({'title':'国学季刊','q':'第十一期 张丽娟','limit':50})),
          ]:
              b=get(key,url)
              if b:
                  try: ol.append({'key':key,'json':json.loads(b)})
                  except Exception: pass
              time.sleep(.5)
          (root/'openlibrary.json').write_text(json.dumps(ol,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Internet Archive public metadata search only.
          ia_queries=[
              'identifier:9787209115018',
              'isbn:9787209115018',
              'title:"国学季刊"',
              '"国图藏元刻十行本"',
          ]
          ia=[]
          for i,q in enumerate(ia_queries):
              url='https://archive.org/advancedsearch.php?'+urlencode({
                  'q':q,'fl[]':['identifier','title','date','year','creator','description'],
                  'rows':50,'page':1,'output':'json'
              },doseq=True)
              b=get('ia-'+str(i),url)
              if b:
                  try:
                      o=json.loads(b); ia.append({'query':q,'numFound':o.get('response',{}).get('numFound'),'docs':o.get('response',{}).get('docs',[])})
                  except Exception: pass
              time.sleep(.5)
          (root/'internet-archive.json').write_text(json.dumps(ia,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          summary={
              'target_article':'国图藏元刻十行本《附释音春秋左传注疏》',
              'author':'张丽娟',
              'claimed_container':'国学季刊 第十一期',
              'official_project_report_date_claim':'2018-09',
              'public_retail_issue11_date_claim':'2018-12',
              'tested_isbn_hypothesis':'9787209115018',
              'isbn_identity_authorized':False,
              'google_books_matches':gb_rows,
              'google_within_volume_probe_count':len(gb_search),
              'openlibrary_result_count':len(ol),
              'internet_archive_queries':[{'query':x['query'],'numFound':x['numFound']} for x in ia],
              'fulltext_retrieved':False,
              'negative_absence_inference_authorized':False,
              'note':'Route discovery only. Commercial metadata conflicts must not overwrite the official project-report citation without stronger edition-level evidence.'
          }
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'fetch-manifest.json').write_text(json.dumps(fetch,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

          find "$ROOT" -type f -size +0c -print0 | xargs -0 -r sha256sum | sort -V > "$ROOT/files.sha256"
          printf '%s\n' \
            'ROLE=public route discovery only' \
            'TARGET=Zhang Lijuan 2018 article and Guoxue Jikan issue 11 container' \
            'NO_PAYWALL_BYPASS=true' \
            'NO_LOGIN_BYPASS=true' \
            'NEGATIVE_ABSENCE_INFERENCE_AUTHORIZED=false' \
            > "$ROOT/manifest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ic-guoxue-jikan11-public-routes
          path: audit/batch-12ic-guoxue-jikan11-public-routes/
          if-no-files-found: error
          retention-days: 30

      - name: Publish probe status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,
              state:'success',context:'tianwen/batch-12ic-probe',
              description:'Guoxue Jikan 11 public route probe complete; inspect artifact'
            })
