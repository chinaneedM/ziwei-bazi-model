name: research-weifang-zhangguo-az-probe

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - '.github/workflows/research-weifang-zhangguo-az-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe Shandong/Weifang 1594 public object
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pymupdf
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re
          from pathlib import Path
          from urllib.parse import quote
          import requests
          import fitz

          OUT = Path('az-artifact')
          OUT.mkdir(exist_ok=True)
          rid = '151613020240003'
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 provenance-research/1.0'})

          api_urls = [
              f'http://guji.sdlib.com/dev-api/ancientbooks/front/getFileContentPage/3/{rid}',
              f'https://guji.sdlib.com/dev-api/ancientbooks/front/getFileContentPage/3/{rid}',
          ]
          report = {
              'schema': 'ZIWEI-ZHANGGUO-WEIFANG-1594-PUBLIC-OBJECT-PROBE-R1',
              'resource_id': rid,
              'catalog_locator_claim': {
                  'title': '新編評註通玄先生張果星宗大全',
                  'extent': '十卷',
                  'edition_claim': '明萬曆二十二年唐謙刻本',
                  'holding_claim': '濰坊市圖書館藏',
                  'role': 'LOCATOR_ONLY_PENDING_OFFICIAL_OBJECT_BINDING',
              },
              'api_attempts': [],
              'discovered_pdf_strings': [],
              'template_probes': [],
              'downloaded_samples': [],
          }

          json_payload = None
          for url in api_urls:
              item = {'url': url}
              try:
                  r = session.get(url, timeout=30, allow_redirects=True)
                  item.update({
                      'status': r.status_code,
                      'final_url': r.url,
                      'content_type': r.headers.get('content-type'),
                      'bytes': len(r.content),
                      'sha256': hashlib.sha256(r.content).hexdigest(),
                      'prefix_hex': r.content[:16].hex(),
                  })
                  if r.ok:
                      try:
                          payload = r.json()
                          item['json'] = True
                          json_payload = payload
                          (OUT / 'official-api-response.json').write_text(
                              json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
                      except Exception:
                          item['json'] = False
                          (OUT / 'official-api-response.bin').write_bytes(r.content)
                  report['api_attempts'].append(item)
              except Exception as exc:
                  item['error'] = repr(exc)
                  report['api_attempts'].append(item)

          strings = []
          def walk(obj):
              if isinstance(obj, dict):
                  for v in obj.values(): walk(v)
              elif isinstance(obj, list):
                  for v in obj: walk(v)
              elif isinstance(obj, str):
                  strings.append(obj)
          if json_payload is not None:
              walk(json_payload)
          pdf_like = []
          for s in strings:
              if '.pdf' in s.lower() or '/PDF/' in s or '/pdf/' in s:
                  pdf_like.append(s)
          report['discovered_pdf_strings'] = sorted(set(pdf_like))[:2000]

          # Verify a conservative sample of URLs returned by the official API itself.
          candidate_urls = []
          for s in report['discovered_pdf_strings']:
              if s.startswith('http://') or s.startswith('https://'):
                  candidate_urls.append(s)
          for i, url in enumerate(candidate_urls[:24]):
              try:
                  r = session.get(url, timeout=30, allow_redirects=True)
                  rec = {
                      'source': 'OFFICIAL_API_RETURNED_STRING', 'url': url,
                      'status': r.status_code, 'final_url': r.url,
                      'content_type': r.headers.get('content-type'), 'bytes': len(r.content),
                      'sha256': hashlib.sha256(r.content).hexdigest(),
                      'pdf_magic': r.content.startswith(b'%PDF'),
                  }
                  report['template_probes'].append(rec)
                  if rec['pdf_magic']:
                      p = OUT / f'api-sample-{i:02d}.pdf'
                      p.write_bytes(r.content)
                      report['downloaded_samples'].append(str(p))
              except Exception as exc:
                  report['template_probes'].append({'source':'OFFICIAL_API_RETURNED_STRING','url':url,'error':repr(exc)})

          # Secondary locator-derived route probe. This is not source authority; it only tests
          # whether the Shandong-hosted object bytes are publicly reachable.
          collection = quote('潍坊市图书馆12种36册2818拍')
          base = f'http://124.133.52.174:9009/res-book/wsok/{collection}/{rid}/object/PDF'
          if not report['downloaded_samples']:
              for vol in range(1, 11):
                  for page in ('0001.pdf', '0001A.pdf', '0001B.pdf'):
                      url = f'{base}/{vol:04d}/{page}'
                      try:
                          r = session.get(url, timeout=20, allow_redirects=True)
                          rec = {
                              'source': 'LOCATOR_DERIVED_SHANDONG_HOST_ROUTE', 'url': url,
                              'status': r.status_code, 'final_url': r.url,
                              'content_type': r.headers.get('content-type'), 'bytes': len(r.content),
                              'sha256': hashlib.sha256(r.content).hexdigest(),
                              'pdf_magic': r.content.startswith(b'%PDF'),
                          }
                          report['template_probes'].append(rec)
                          if rec['pdf_magic']:
                              p = OUT / f'template-v{vol:02d}-{page}'
                              p.write_bytes(r.content)
                              report['downloaded_samples'].append(str(p))
                              break
                      except Exception as exc:
                          report['template_probes'].append({'source':'LOCATOR_DERIVED_SHANDONG_HOST_ROUTE','url':url,'error':repr(exc)})
                  if len(report['downloaded_samples']) >= 3:
                      break

          # Render first pages of any successfully retrieved PDF samples for direct visual review.
          renders = []
          for sample in report['downloaded_samples'][:6]:
              try:
                  doc = fitz.open(sample)
                  if doc.page_count:
                      pix = doc[0].get_pixmap(matrix=fitz.Matrix(1.5,1.5), alpha=False)
                      out = OUT / (Path(sample).stem + '.png')
                      pix.save(out)
                      renders.append({'pdf': sample, 'page_count': doc.page_count, 'png': str(out),
                                      'png_sha256': hashlib.sha256(out.read_bytes()).hexdigest()})
              except Exception as exc:
                  renders.append({'pdf': sample, 'error': repr(exc)})
          report['renders'] = renders

          (OUT / 'probe-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: weifang-zhangguo-az-public-object-probe
          path: az-artifact
          if-no-files-found: error
