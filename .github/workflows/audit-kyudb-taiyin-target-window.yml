name: audit-kyudb-taiyin-target-window

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-kyudb-taiyin-target-window.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --silent puppeteer-core@24.16.0
          python -m pip install --quiet pillow

      - name: Acquire official Kyudb target window 044a-059b
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/kyudb-taiyin-target-window'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/physical"
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          cat > "$ROOT/acquire.mjs" <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const root='audit/kyudb-taiyin-target-window';
          const book='GK12436_00', vol='0001';
          const pages=[];
          for(let n=44;n<=59;n++) for(const ab of ['a','b']) pages.push(String(n).padStart(3,'0')+ab);

          const browser=await puppeteer.launch({
            headless:true,
            executablePath:process.env.BROWSER,
            args:['--no-sandbox','--disable-setuid-sandbox']
          });
          const page=await browser.newPage();
          await page.setUserAgent('Mozilla/5.0 Tianwen-Provenance-Audit/1.0');

          await page.goto('https://kyudb.snu.ac.kr/book/list.do?book_cate=SIC04&mid=GDS',{waitUntil:'networkidle2',timeout:90000});
          await Promise.all([
            page.waitForNavigation({waitUntil:'networkidle2',timeout:90000}),
            page.evaluate((book)=>{
              const f=document.getElementById('frmBookSearchInf');
              f.querySelector('#book_cd').value=book;
              f.querySelector('#target').value='master';
              f.action='/book/view.do'; f.method='post'; f.submit();
            },book)
          ]);

          const before=new Set(browser.targets().map(t=>t._targetId));
          await page.evaluate((book)=>window.fn_originalImg('SIC',book,'',''),book);
          let viewer=null;
          for(let i=0;i<40 && !viewer;i++){
            await new Promise(r=>setTimeout(r,500));
            for(const t of browser.targets()){
              if(t.type()==='page' && !before.has(t._targetId) && t.url().includes('/pf01/rendererImg.do')){
                viewer=await t.page(); break;
              }
            }
          }
          if(!viewer) throw new Error('viewer target not resolved');
          await viewer.waitForNetworkIdle({idleTime:800,timeout:20000}).catch(()=>{});

          const physical=[];
          for(const p of pages){
            const fn=`${book}IH_${vol}_${p}.jpg`;
            const path=`/data01/stream/SIC/IMG/${book}/${book}_${vol}/${fn}`;
            const one=await viewer.evaluate(async({fn,path})=>{
              const u='/ImageServlet.do?imgFileNm='+encodeURIComponent(fn)+'&path='+encodeURIComponent(path);
              let last=null;
              for(let attempt=1;attempt<=3;attempt++){
                try{
                  const ctl=new AbortController();
                  const timer=setTimeout(()=>ctl.abort(),15000);
                  const r=await fetch(u,{credentials:'include',signal:ctl.signal});
                  const b=await r.arrayBuffer();
                  clearTimeout(timer);
                  last={status:r.status,contentType:r.headers.get('content-type'),bytes:b.byteLength,data:Array.from(new Uint8Array(b))};
                  if(r.ok && b.byteLength>5000) return last;
                }catch(e){last={error:String(e)}}
                await new Promise(r=>setTimeout(r,500*attempt));
              }
              return last;
            },{fn,path});
            if(one?.data && one.bytes>5000){
              const b=Buffer.from(one.data);
              fs.writeFileSync(`${root}/physical/${p}.jpg`,b);
              physical.push({
                page:p,download_ok:true,status:one.status,content_type:one.contentType,
                bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')
              });
            }else{
              physical.push({page:p,download_ok:false,...one});
            }
          }

          const report={
            schema:'KYUDB-TAIYIN-TONGGUI-TARGET-WINDOW-PHYSICAL-R2',
            provider:'Kyujanggak Institute for Korean Studies, Seoul National University',
            book_cd:book,
            call_number:'奎貴12436',
            title:'太陰通軌',
            pages_requested:pages,
            physical_pages:physical,
            shidian_mapping_hypothesis:{
              '111':'053b','112':'054a','113':'054b','114':'055a','115':'055b',
              basis:'If Shidian pageNum 4 corresponds to Kyudb 000a, sequential recto/verso mapping yields these labels; must be verified by image content.'
            },
            authority:'OFFICIAL_KYUDB_SOURCE_BOUND_FACSIMILE',
            ocr_used_for_glyph_or_numeric_claims:false,
            numeric_claim_authorized_by_machine_step:false
          };
          fs.writeFileSync(root+'/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({
            ok:physical.filter(x=>x.download_ok).length,
            failed:physical.filter(x=>!x.download_ok),
            mapping:report.shidian_mapping_hypothesis
          },null,2));
          await browser.close();
          if(physical.filter(x=>x.download_ok).length!==pages.length) process.exitCode=2;
          JS
          BROWSER="$BROWSER" node "$ROOT/acquire.mjs"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json
          root=Path('audit/kyudb-taiyin-target-window')
          r=json.loads((root/'report.json').read_text())
          imgs=[x for x in r['physical_pages'] if x.get('download_ok')]
          thumbs=[]
          for row in imgs:
              im=Image.open(root/'physical'/f"{row['page']}.jpg").convert('RGB')
              row['width'],row['height']=im.size
              im.thumbnail((360,520))
              c=Image.new('RGB',(380,560),'white')
              c.paste(im,((380-im.width)//2,20))
              ImageDraw.Draw(c).text((10,535),row['page'],fill='black')
              thumbs.append(c)
          if thumbs:
              cols=4; rows=(len(thumbs)+cols-1)//cols
              sh=Image.new('RGB',(cols*380,rows*560),'white')
              for i,im in enumerate(thumbs):
                  sh.paste(im,((i%cols)*380,(i//cols)*560))
              sh.save(root/'contact.jpg',quality=90)
          (root/'report.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload target-window artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyudb-taiyin-target-window-r2
          path: audit/kyudb-taiyin-target-window
          if-no-files-found: error
          retention-days: 30
