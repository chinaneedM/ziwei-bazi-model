name: research-tianwen-13ij-official-wei-chen-pdf
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - '.github/workflows/research-tianwen-13ij-official-wei-chen-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_pdf_source_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch exact institution-issued PDF and inspect bounded target-page text
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          import re
          import subprocess
          import unicodedata
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = "https://sir.sysu.edu.cn/sites/sysusir.prod.dpcms8.sysu.edu.cn/files/download/upload/_%E9%AB%98%E4%B8%BD%E5%8F%B2_%E7%89%88%E6%9C%AC%E6%BA%90%E6%B5%81%E4%B8%8E%E7%BC%96%E7%BA%82%E4%BD%93%E4%BE%8B%E8%80%83_%E9%AD%8F%E5%BF%97%E6%B1%9F.pdf"
          print("SOURCE_URL", url, flush=True)
          try:
              request = Request(url, headers={"User-Agent":"Mozilla/5.0 (compatible; TianwenResearch/13IJ; source-review)", "Accept":"application/pdf,*/*"})
              with urlopen(request, timeout=35) as response:
                  content = response.read(16000000)
                  print("HTTP_STATUS", response.status, "FINAL_URL", response.geturl(), "CONTENT_TYPE", response.headers.get("Content-Type"), flush=True)
          except Exception as e:
              print("RETRIEVAL_STATUS=SOURCE_UNAVAILABLE")
              print("RETRIEVAL_ERROR", type(e).__name__, str(e)[:350])
              raise SystemExit(0)
          if not content.startswith(b"%PDF"):
              print("RETRIEVAL_STATUS=NOT_PDF", "BYTES", len(content), "PREFIX_HEX", content[:20].hex())
              raise SystemExit(0)
          print("RETRIEVAL_STATUS=PDF_BYTES_OBTAINED", "BYTES",len(content),"SHA256",hashlib.sha256(content).hexdigest(),flush=True)
          work = Path("/tmp/tianwen13ij")
          work.mkdir(exist_ok=True)
          pdf = work/"original-journal.pdf"
          pdf.write_bytes(content)
          meta = subprocess.run(["pdfinfo",str(pdf)],capture_output=True,text=True)
          print("PDFINFO_RETURN",meta.returncode)
          for line in meta.stdout.splitlines():
              if line.startswith(("Pages:","Page size:","Encrypted:","PDF version:")): print("PDFINFO",line)
          pdftotext = subprocess.run(["pdftotext","-layout",str(pdf),"-"],capture_output=True)
          if pdftotext.returncode != 0:
              print("PDF_TEXT_STATUS=UNAVAILABLE",pdftotext.stderr[:200])
              raise SystemExit(0)
          raw = pdftotext.stdout.decode("utf-8","replace")
          pages = raw.split("\f")
          print("TEXT_PAGE_COUNT",len(pages),"EXTRACTION_BYTES",len(pdftotext.stdout))
          hits=[]
          for idx,page in enumerate(pages,1):
              normalized=unicodedata.normalize("NFKC",page)
              tokens=("3467","5553","5554","脱落","脫落","卷52","卷 52","缺页")
              for term in tokens:
                  pos=normalized.find(term)
                  if pos>=0:
                      excerpt=normalized[max(0,pos-270):pos+380].replace("\n"," ")
                      print("ORIGINAL_PDF_TEXT_HIT","PAGE",idx,"TERM",term,"EXCERPT",repr(excerpt)[:780])
                      hits.append(idx)
                      break
          print("ORIGINAL_PDF_TEXT_TARGET_PAGES",sorted(set(hits)))
          if not hits:
              print("TARGET_PAGE_GRADE=TEXT_NOT_LOCATED_NO_ABSENCE_PROOF")
              raise SystemExit(0)
          target=next((i for i in hits if "3467" in unicodedata.normalize("NFKC",pages[i-1])),hits[0])
          raster=work/("original-page-%02d"%target)
          cmd=["pdftoppm","-f",str(target),"-l",str(target),"-scale-to","1300","-jpeg","-jpegopt","quality=64","-singlefile",str(pdf),str(raster)]
          result=subprocess.run(cmd,capture_output=True)
          print("RENDER_RESULT",result.returncode,"TARGET_PDF_PAGE",target)
          if result.returncode == 0:
              photo=raster.with_suffix(".jpg").read_bytes()
              print("TARGET_RENDER_JPEG_BYTES",len(photo),"SHA256",hashlib.sha256(photo).hexdigest())
              print("PAGE_JPEG_B64_BEGIN")
              print(base64.b64encode(photo).decode("ascii"))
              print("PAGE_JPEG_B64_END")
              print("TARGET_PAGE_GRADE=PDF_ORIGINAL_PAGE_RENDER_AVAILABLE_FOR_MANUAL_VISUAL_REVIEW")
          else:
              print("TARGET_PAGE_GRADE=TEXT_INDEX_ONLY_RENDER_FAILED",result.stderr[:180])
          PY
