name: research-ndl-ogawa-shoushi-licheng-target-pages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-ndl-ogawa-shoushi-licheng-target-pages.yml"
      - "scripts/research_ndl_ogawa_shoushi_licheng_target_pages.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch five localized NDL target pages at high resolution
        run: |
          python scripts/research_ndl_ogawa_shoushi_licheng_target_pages.py \
            --output artifacts/ndl-ogawa-target-pages \
            --width 3000
      - name: Upload no-OCR localized target pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndl-ogawa-target-pages-${{ github.sha }}
          path: artifacts/ndl-ogawa-target-pages/
          if-no-files-found: warn
          retention-days: 7
