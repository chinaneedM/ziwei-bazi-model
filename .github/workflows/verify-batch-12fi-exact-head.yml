name: verify-batch-12fi-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fi-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FI continuity and genealogy
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path('docs/research/ZIWEI-NLC-CURRENT-TONGHU-COMPOSITE-HOLDINGS-LOCATOR-R1.json').read_text(encoding='utf-8'))
          assert evidence['batch_id'] == 'BATCH-12-ZIWEI-NLC-CURRENT-TONGHU-COMPOSITE-HOLDINGS-LOCATOR-FI'
          assert evidence['original_tonghu_record']['sys'] == '001775082'
          assert evidence['original_tonghu_record']['uid'] == 'UCS01003828992'
          assert evidence['local_holdings_locator']['adjudicated_locator'] == 'NLC:SBYL:03482'
          assert evidence['local_holdings_locator']['field_905s'] == '03482'
          assert evidence['local_holdings_locator']['public_barcode_proved'] is False
          assert evidence['current_composite_locator_pair']['pair_closed'] is True
          assert evidence['current_composite_locator_pair']['zhunzhai']['local_holdings_locator'] == 'NLC:SBYL:03483'
          assert evidence['tonghu_microfilm_controls']['linked_original_record_control_id'] == '411999008600'
          assert evidence['symmetric_microfilm_pair']['tonghu_microfilm']['companion_separate_photo_reference'] == '00O003571'
          assert evidence['symmetric_microfilm_pair']['zhunzhai_microfilm']['companion_separate_photo_reference'] == '00O003570'
          assert evidence['symmetric_microfilm_pair']['separate_photo_reference_identifier_class'] == 'SEPARATE_PHOTOGRAPH_REFERENCE_ONLY'
          assert evidence['transmission_impact']['same_object_edge_authorized'] is False
          assert evidence['chronology_and_rule_firewall']['direct_sanming_parent_vote_increment'] == 0

          state = json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['historical_audit']['latest_batch_doc'].endswith('NLC-CURRENT-TONGHU-COMPOSITE-HOLDINGS-LOCATOR-FI.md')
          assert state['invariants']['deterministic_fusion_chart_product_r1'] == 'CLOSED'

          graph = json.loads(Path('docs/TRANSMISSION-GENEALOGY-GRAPH-R1.json').read_text(encoding='utf-8'))
          assert any(n.get('node_id') == 'CATALOG-NLC-CURRENT-TONGHU-SYS001775082-UIDUCS01003828992' for n in graph['nodes'])
          assert any(e.get('edge_id') == 'TG-E0112' and e.get('status') == 'HIGH_CONFIDENCE' for e in graph['edges'])
          PY
