name: audit-gexiang-1520-zhengde-timekeeping-witness

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-gexiang-1520-zhengde-timekeeping-witness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install document tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pillow

      - name: Acquire 1520 Zhengde Gexiang Xinshu public scans
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/gexiang-1520-zhengde'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/render" "$ROOT/contact"
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-1253-204870%20%E9%87%8D%E5%88%8A%E9%9D%A9%E8%B1%A1%E6%96%B0%E6%9B%B8%20%E7%AC%AC1%E5%86%8A.pdf' -o "$ROOT/vol1.pdf"
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' 'https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-1253-204871%20%E9%87%8D%E5%88%8A%E9%9D%A9%E8%B1%A1%E6%96%B0%E6%9B%B8%20%E7%AC%AC2%E5%86%8A.pdf' -o "$ROOT/vol2.pdf"

          sha256sum "$ROOT"/vol*.pdf | tee "$ROOT/source.sha256"
          pdfinfo "$ROOT/vol1.pdf" | tee "$ROOT/vol1-pdfinfo.txt"
          pdfinfo "$ROOT/vol2.pdf" | tee "$ROOT/vol2-pdfinfo.txt"
          pdftotext -layout "$ROOT/vol1.pdf" "$ROOT/vol1-text.txt" || true
          pdftotext -layout "$ROOT/vol2.pdf" "$ROOT/vol2-text.txt" || true

          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('audit/gexiang-1520-zhengde')
          terms=[
              '正德十五年','宣威公署','重刊革象新書','時分百刻',
              '晝夜十二時','若子時則上半時','屬昨日','屬今日',
              '子時之上一半','晝夜短長'
          ]
          out={}
          for v in ('vol1','vol2'):
              txt=(root/f'{v}-text.txt').read_text(encoding='utf-8',errors='ignore')
              out[v]={t:len(list(re.finditer(re.escape(t),txt))) for t in terms}
          (root/'text-layer-hits.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY

          for v in 1 2; do
            PAGES=$(pdfinfo "$ROOT/vol${v}.pdf" | awk '/^Pages:/ {print $2}')
            pdftoppm -jpeg -jpegopt quality=90 -r 120 "$ROOT/vol${v}.pdf" "$ROOT/render/v${v}-page" >/dev/null 2>&1
            COUNT=$(find "$ROOT/render" -maxdepth 1 -name "v${v}-page-*.jpg" | wc -l)
            test "$COUNT" -eq "$PAGES"
          done
          sha256sum "$ROOT"/render/*.jpg | sort -V > "$ROOT/render.sha256"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path('audit/gexiang-1520-zhengde')
          for prefix in ('v1','v2'):
              pages=sorted((root/'render').glob(f'{prefix}-page-*.jpg'),key=lambda p:int(p.stem.split('-')[-1]))
              for i in range(0,len(pages),30):
                  batch=pages[i:i+30]
                  thumbs=[]
                  for p in batch:
                      im=Image.open(p).convert('RGB')
                      im.thumbnail((260,360))
                      c=Image.new('RGB',(280,390),'white')
                      c.paste(im,((280-im.width)//2,24))
                      ImageDraw.Draw(c).text((8,6),p.name,fill='black')
                      thumbs.append(c)
                  cols=5; rows=(len(thumbs)+cols-1)//cols
                  sh=Image.new('RGB',(cols*280,rows*390),'white')
                  for j,im in enumerate(thumbs):
                      sh.paste(im,((j%cols)*280,(j//cols)*390))
                  sh.save(root/'contact'/f'{prefix}-contact-{i+1:04d}-{i+len(batch):04d}.jpg',quality=92)
          PY
          sha256sum "$ROOT"/contact/*.jpg | sort -V > "$ROOT/contact.sha256"

          cat > "$ROOT/manifest.txt" <<'EOF'
          SOURCE=NLC892-1253-204870/204871 重刊革象新書
          WORK=趙友欽撰 / 王禕刪定
          CATALOG_IDENTITY=平圖011907-011908
          CATALOG_EDITION=明正德庚辰十五年(1520)宣威公署刊本
          TARGET=physical edition binding + 時分百刻 + 若子時則上半時 wording
          TEXT_LAYER_ROLE=LOCATOR_ONLY_NOT_GLYPH_AUTHORITY
          OCR_USED_FOR_FINAL_GLYPH_CLAIMS=false
          PRE1578_TARGET=true
          EOF

          SMALL='audit/gexiang-1520-zhengde-compact'
          mkdir -p "$SMALL"
          cp -r "$ROOT/contact" "$SMALL/contact"
          cp "$ROOT/source.sha256" "$SMALL/source.sha256"
          cp "$ROOT/vol1-pdfinfo.txt" "$SMALL/vol1-pdfinfo.txt"
          cp "$ROOT/vol2-pdfinfo.txt" "$SMALL/vol2-pdfinfo.txt"
          cp "$ROOT/text-layer-hits.json" "$SMALL/text-layer-hits.json"
          cp "$ROOT/render.sha256" "$SMALL/render.sha256"
          cp "$ROOT/contact.sha256" "$SMALL/contact.sha256"
          cp "$ROOT/manifest.txt" "$SMALL/manifest.txt"

      - name: Upload compact visual locator
        uses: actions/upload-artifact@v4
        with:
          name: gexiang-1520-zhengde-compact-locator
          path: audit/gexiang-1520-zhengde-compact
          if-no-files-found: error
          retention-days: 30
