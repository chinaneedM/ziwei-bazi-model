name: probe-nlc-opac-tongshu-leiju-1551

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-nlc-opac-tongshu-leiju-1551.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe NLC OPAC for title and physical/microform holdings
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/nlc-opac-tongshu-leiju-1551'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/raw" "$ROOT/text"
          UA='Tianwen-Provenance-Audit/1.0'
          BASE='http://opac.nlc.cn/F/'

          set +e
          timeout 35s curl -L -sS --connect-timeout 8 --max-time 25             -A "$UA" "$BASE?func=find-b-0&local_base=NLC01"             -o "$ROOT/raw/search-form.html"
          form_rc=$?
          set -e
          printf 'search-form\t%s\t%s\n' "$form_rc" "$(wc -c < "$ROOT/raw/search-form.html" 2>/dev/null || echo 0)" > "$ROOT/status.tsv"

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          p=Path('audit/nlc-opac-tongshu-leiju-1551/raw/search-form.html')
          html=p.read_text('utf-8',errors='replace') if p.exists() else ''
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.select=None; self.options=[]; self.forms=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='form': self.forms.append(d)
                  if tag=='select': self.select=d.get('name')
                  if tag=='option': self.options.append((self.select,d.get('value',''),d.get('selected')))
              def handle_endtag(self,tag):
                  if tag=='select': self.select=None
          q=P(); q.feed(html)
          out=['FORMS']+[repr(x) for x in q.forms]+['OPTIONS']+[repr(x) for x in q.options]
          Path('audit/nlc-opac-tongshu-leiju-1551/form-contract.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

          cat > "$ROOT/queries.tsv" <<'EOF'
          wti-trad	WTI	通書類聚尅擇大全
          wti-alt	WTI	通書類聚抉擇大全
          wrd-trad	WRD	通書類聚尅擇大全
          wrd-short	WRD	通書類聚
          wrd-call	WRD	14202
          EOF

          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote_plus
          root=Path('audit/nlc-opac-tongshu-leiju-1551')
          out=[]
          for line in (root/'queries.tsv').read_text('utf-8').splitlines():
              if not line.strip(): continue
              key,code,q=line.split('\t',2)
              url='http://opac.nlc.cn/F/?func=find-b&find_code='+code+'&request='+quote_plus(q)+'&local_base=NLC01'
              out.append((key,code,q,url))
          (root/'query-urls.tsv').write_text(''.join('\t'.join(x)+'\n' for x in out),encoding='utf-8')
          PY

          while IFS=$'\t' read -r key code query url; do
            out="$ROOT/raw/$key.html"
            set +e
            timeout 40s curl -L -sS --connect-timeout 8 --max-time 30               -A "$UA" "$url" -o "$out"
            rc=$?
            set -e
            size=0; [ -f "$out" ] && size=$(wc -c < "$out")
            printf '%s\t%s\t%s\t%s\t%s\n' "$key" "$code" "$rc" "$size" "$query" >> "$ROOT/status.tsv"
          done < "$ROOT/query-urls.tsv"

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          import re
          root=Path('audit/nlc-opac-tongshu-leiju-1551')
          base='http://opac.nlc.cn/F/'
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.text=[]; self.links=[]
              def handle_data(self,d):
                  s=' '.join(d.split())
                  if s: self.text.append(s)
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and a.get('href'):
                      self.links.append((urljoin(base,a['href']),a.get('title','')))
          links=[]; docs=set()
          for p in sorted((root/'raw').glob('*.html')):
              q=P(); q.feed(p.read_text('utf-8',errors='replace'))
              (root/'text'/f'{p.stem}.txt').write_text('\n'.join(q.text)+'\n',encoding='utf-8')
              for href,title in q.links:
                  links.append((p.stem,href,title))
                  m=re.search(r'(?:doc_number|doc_num)=([0-9]{1,12})',href)
                  if m: docs.add(m.group(1))
          (root/'all-links.tsv').write_text(''.join(f'{s}\t{h}\t{t}\n' for s,h,t in links),encoding='utf-8')
          (root/'doc-numbers.txt').write_text('\n'.join(sorted(docs))+'\n',encoding='utf-8')
          PY

          while IFS= read -r doc; do
            [ -z "$doc" ] && continue
            for func in direct item-global; do
              url="$BASE?func=$func&local_base=NLC01&doc_number=$doc"
              out="$ROOT/raw/doc-$doc-$func.html"
              set +e
              timeout 35s curl -L -sS --connect-timeout 8 --max-time 25 -A "$UA" "$url" -o "$out"
              rc=$?
              set -e
              printf 'doc-%s-%s\t%s\t%s\n' "$doc" "$func" "$rc" "$(wc -c < "$out" 2>/dev/null || echo 0)" >> "$ROOT/status.tsv"
            done
          done < "$ROOT/doc-numbers.txt"

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          root=Path('audit/nlc-opac-tongshu-leiju-1551')
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.text=[]
              def handle_data(self,d):
                  s=' '.join(d.split())
                  if s: self.text.append(s)
          for p in sorted((root/'raw').glob('doc-*.html')):
              q=P(); q.feed(p.read_text('utf-8',errors='replace'))
              (root/'text'/f'{p.stem}.txt').write_text('\n'.join(q.text)+'\n',encoding='utf-8')
          PY

          grep -RniE             '通書類聚|通书类聚|尅擇大全|抉擇大全|芝城|嘉靖三十|1551|14202|縮微|缩微|膠卷|胶卷|micro|載體|载体|館藏|馆藏|索書號|索书号|善本|G220|G219|可借|在館|在馆'             "$ROOT/text" "$ROOT/raw" > "$ROOT/target-hits.txt" || true

          grep -Ei             'doc_number=|item-global|func=direct|hold|item|micro|copy|request'             "$ROOT/all-links.tsv" | sort -u > "$ROOT/record-links.tsv" || true

          find "$ROOT/raw" -type f -size +0c -print0 | xargs -0 -r sha256sum | sort -V > "$ROOT/raw.sha256"

          printf '%s\n'             'SOURCE=National Library of China OPAC'             'TARGET_TITLE=通書類聚尅擇大全□□卷'             'CENSUS_ID=110000-0101-0013797'             'CALL_NUMBER=14202'             'PURPOSE=resolve OPAC system record and any explicit microfilm/reproduction/holding carrier for the census-bound 1551 copy'             'NEGATIVE_POLICY=no OPAC hit does not negate the first-party census holding; no microfilm label does not prove no off-OPAC microfilm exists'             'OCR_USED=false'             > "$ROOT/manifest.txt"

      - name: Upload NLC OPAC probe
        uses: actions/upload-artifact@v4
        with:
          name: nlc-opac-tongshu-leiju-1551-probe
          path: audit/nlc-opac-tongshu-leiju-1551/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
