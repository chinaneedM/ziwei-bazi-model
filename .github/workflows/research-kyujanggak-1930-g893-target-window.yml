name: research-kyujanggak-1930-g893-target-window

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1930-g893-target-window.yml"
      - "scripts/research_kyujanggak_1930_g893_target_window.py"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi pillow
      - name: Fetch direct no-OCR target window
        run: |
          python scripts/research_kyujanggak_1930_g893_target_window.py \
            --output artifacts/kyujanggak-1930-g893-window
      - name: Upload target-window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1930-g893-window-${{ github.sha }}
          path: artifacts/kyujanggak-1930-g893-window/
          if-no-files-found: warn
          retention-days: 7
