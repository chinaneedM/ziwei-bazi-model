name: verify-batch-12hi-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hi-exact-head.yml
      - .github/workflows/verify-batch-12hh-exact-head.yml
      - docs/research/ZIWEI-WENWU-CANKAO-NDL-1951-H2-AND-RYUKOKU-1986-FACSIMILE-ACCESS-REDUNDANCY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-WENWU-CANKAO-NDL-1951-H2-AND-RYUKOKU-1986-FACSIMILE-ACCESS-REDUNDANCY-HI.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HI exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-WENWU-CANKAO-NDL-1951-H2-AND-RYUKOKU-1986-FACSIMILE-ACCESS-REDUNDANCY-HI'
          e=json.loads(Path('docs/research/ZIWEI-WENWU-CANKAO-NDL-1951-H2-AND-RYUKOKU-1986-FACSIMILE-ACCESS-REDUNDANCY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          n=e['ndl_original_bundle']
          assert n['call_number']=='Z8-AC150'
          assert n['held_range']=='2(7)-2(12) 1951'
          assert n['target_issue']==9
          assert n['target_issue_explicitly_contained'] is True
          assert n['item_specific_digital_surrogate_exposed_on_reviewed_record'] is False
          r=e['ryukoku_facsimile']
          assert r['edition_statement']=='影印本'
          assert r['publication_date_display']=='[1986]'
          assert r['ncid']=='AN10296217'
          assert r['call_number']=='054/638'
          assert r['target_1951_volume2_covered'] is True
          assert r['direct_target_pages_reviewed'] is False
          a=e['access_firewall']
          assert a['digital_scan_bytes_recovered'] is False
          assert a['copy_request_sent'] is False
          assert a['interlibrary_loan_request_sent'] is False
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,221,0)
          assert bid in state['historical_audit']['completed_batches']
          latest=state['historical_audit']['latest_batch_doc']
          assert isinstance(latest,str) and latest.startswith('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-') and latest.endswith('.md')
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-NDL-WENWU-CANKAO-1951-V2-7-12-Z8-AC150']['batch_12hi']['target_issue_explicitly_contained'] is True
          assert src['EXT-RYUKOKU-WENWU-CANKAO-1986-FACSIMILE-AN10296217']['batch_12hi']['target_1951_volume2_covered'] is True
          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          PY
