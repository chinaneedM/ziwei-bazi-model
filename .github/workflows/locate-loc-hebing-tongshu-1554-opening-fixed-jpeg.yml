name: locate-loc-hebing-tongshu-1554-opening-fixed-jpeg

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/locate-loc-hebing-tongshu-1554-opening-fixed-jpeg.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install montage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Download fixed 25-percent Juan-17 opening images
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/loc-hebing-tongshu-1554-opening-fixed-jpeg'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages"

          ids=(00000a 00001a 01b02a 02b03a 03b04a 04b05a 05b06a 06b07a 07b08a 08b09a 09b10a 10b11a)
          : > "$ROOT/routes.tsv"
          for i in "${!ids[@]}"; do
            n=$((i+1))
            id="${ids[$i]}"
            url="https://tile.loc.gov/image-services/iiif/service:asian:lcnclscd:2012402919:1A017:${id}/full/pct:25/0/default.jpg"
            out="$ROOT/pages/page-$(printf '%03d' "$n")-${id}.jpg"
            printf '%03d\t%s\t%s\n' "$n" "$id" "$url" >> "$ROOT/routes.tsv"
            curl -L --fail --retry 5 --retry-all-errors --retry-delay 2               -A 'Tianwen-Provenance-Audit/1.0' "$url" -o "$out"
          done

          mapfile -t pages < <(find "$ROOT/pages" -name '*.jpg' | sort -V)
          test "${#pages[@]}" -eq 12
          sha256sum "${pages[@]}" | sort -V > "$ROOT/pages.sha256"
          montage "${pages[@]}" -thumbnail 480x700 -tile 4x -geometry +8+8 "$ROOT/contact-001-012.jpg"
          sha256sum "$ROOT/contact-001-012.jpg" > "$ROOT/contact.sha256"

          printf '%s\n'             'LOC_ITEM=2012402919'             'RESOURCE_GROUP=Juan 17 / 1A017'             'SOURCE_DATE=明嘉靖33年[1554]'             'ROUTE_SOURCE=run 35361144052 artifact 10553899912 fixed resource ids'             'TARGET=選時寶鏡局 / 銅壺晝夜百刻圖式'             'LOCATOR_SCOPE=resource images 1-12 only'             'RESOLUTION=IIIF pct:25 locator only'             'OCR_USED_FOR_CONTENT_CLAIMS=false'             > "$ROOT/manifest.txt"

      - name: Upload fixed lightweight locator
        uses: actions/upload-artifact@v4
        with:
          name: loc-hebing-tongshu-1554-opening-fixed-jpeg
          path: audit/loc-hebing-tongshu-1554-opening-fixed-jpeg/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
