name: research-quark-snu-v4-public-share

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-quark-snu-v4-public-share.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe source-published Quark share without authentication
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          SOURCE = "https://www.xinghunw.com/2056.html"
          SHARE = "https://pan.quark.cn/s/3b7b731e41f2"
          TARGET = "〖飛星策天紫微斗數全集〗一簑古523.5-J562b-v.1-6 陳博(宋) 著 羊城[同治9年(1870)]明經閣 木版本（4）.pdf"
          UA = "Mozilla/5.0 provenance-research normal-public-share-probe"

          def fetch(url, limit=8_000_000):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml,application/json,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read(limit)
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "bytes": 0, "data": b""}

          result = {
              "schema": "QUARK-SNU-MINGJINGGE-V4-PUBLIC-SHARE-PROBE-R1",
              "source_page": SOURCE,
              "source_published_share_url": SHARE,
              "target_filename": TARGET,
              "authentication_attempted": False,
              "save_to_cloud_attempted": False,
              "download_request_attempted": False,
              "api_endpoint_guessing_attempted": False,
              "access_control_bypass_attempted": False,
              "routes": [],
          }

          for label, url in [("xinghun_source", SOURCE), ("quark_public_share", SHARE)]:
              row = fetch(url)
              data = row.pop("data")
              rec = {"route": label, "url": url, **row}
              if data:
                  text = data.decode("utf-8", "replace")
                  rec["target_filename_present"] = TARGET in text
                  rec["target_basename_fragment_present"] = "飛星策天紫微斗數全集" in text and "木版本（4）" in text
                  rec["share_token_present"] = "3b7b731e41f2" in text
                  rec["login_words_present"] = any(x in text for x in ("登录", "登入", "login", "sign in"))
                  rec["html_prefix"] = text[:4000]
                  hrefs = []
                  for m in re.finditer(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', text, re.I):
                      u = urllib.parse.urljoin(rec.get("final_url") or url, html.unescape(m.group(1)))
                      if u not in hrefs:
                          hrefs.append(u)
                  rec["source_emitted_url_count"] = len(hrefs)
                  rec["source_emitted_urls"] = hrefs[:300]
                  (OUT / f"{label}.html").write_bytes(data)
              result["routes"].append(rec)

          result["adjudication"] = {
              "scope": "NORMAL_PUBLIC_SOURCE_PUBLISHED_SHARE_URL_ONLY",
              "target_file_static_html_exposed": any(
                  r.get("route") == "quark_public_share" and r.get("target_filename_present")
                  for r in result["routes"]
              ),
              "browser_render_required_if_static_shell_only": True,
              "same_snu_physical_digitization_lineage": True,
              "independent_physical_witness_increment": 0,
              "algorithm_effect": "NONE",
          }

          (OUT / "quark-snu-v4-public-share-probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "routes": [
                  {k:v for k,v in r.items() if k not in ("html_prefix","source_emitted_urls")}
                  for r in result["routes"]
              ],
              "adjudication": result["adjudication"],
          }, ensure_ascii=False, indent=2))

      - name: Render public share through normal Selenium browser session
        shell: bash
        run: |
          set -e
          python -m pip install --quiet selenium
          python - <<'PY'
          import hashlib
          import json
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException, WebDriverException
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          OUT = Path("probe")
          SHARE = "https://pan.quark.cn/s/3b7b731e41f2"
          TARGET = "〖飛星策天紫微斗數全集〗一簑古523.5-J562b-v.1-6 陳博(宋) 著 羊城[同治9年(1870)]明經閣 木版本（4）.pdf"

          result = {
              "schema": "QUARK-SNU-MINGJINGGE-V4-SELENIUM-PUBLIC-RENDER-R1",
              "share_url": SHARE,
              "authentication_attempted": False,
              "save_to_cloud_attempted": False,
              "download_attempted": False,
              "api_endpoint_guessing_attempted": False,
              "access_control_bypass_attempted": False,
              "normal_target_click_attempted": False,
              "normal_target_click_succeeded": False,
          }

          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--disable-background-networking")
          opts.add_argument("--disable-component-update")
          opts.add_argument("--disable-default-apps")
          opts.add_argument("--disable-sync")
          opts.add_argument("--no-first-run")
          opts.add_argument("--window-size=1440,1600")
          opts.page_load_strategy = "eager"

          driver = None
          try:
              driver = webdriver.Chrome(options=opts)
              driver.set_page_load_timeout(20)
              try:
                  driver.get(SHARE)
                  result["initial_get"] = "RETURNED"
              except TimeoutException:
                  result["initial_get"] = "PAGE_LOAD_TIMEOUT_PARTIAL_DOM_RETAINED"
              time.sleep(12)

              initial_html = driver.page_source or ""
              initial_body = ""
              try:
                  initial_body = driver.find_element(By.TAG_NAME, "body").text or ""
              except Exception:
                  pass
              (OUT / "quark-selenium-initial.html").write_text(initial_html, encoding="utf-8")
              (OUT / "quark-selenium-initial.txt").write_text(initial_body, encoding="utf-8")
              try:
                  driver.save_screenshot(str(OUT / "quark-selenium-initial.png"))
              except Exception as exc:
                  result["initial_screenshot_error"] = repr(exc)

              result.update({
                  "browser_title": driver.title,
                  "current_url": driver.current_url,
                  "initial_dom_bytes": len(initial_html.encode("utf-8")),
                  "initial_dom_sha256": hashlib.sha256(initial_html.encode("utf-8")).hexdigest(),
                  "initial_visible_text_bytes": len(initial_body.encode("utf-8")),
                  "target_filename_present_initial": TARGET in initial_html or TARGET in initial_body,
                  "target_fragment_present_initial": "飛星策天紫微斗數全集" in initial_html or "飛星策天紫微斗數全集" in initial_body,
                  "target_size_31_47_present_initial": "31.47" in initial_html or "31.47" in initial_body,
                  "login_or_app_terms_initial": [x for x in ("登录", "扫码", "打开夸克", "APP", "客户端") if x in initial_body],
                  "file_action_terms_initial": [x for x in ("保存到网盘", "保存", "下载", "在线预览", "预览") if x in initial_body],
              })

              # Only perform a normal UI click if the exact target is already visibly
              # exposed by the public share. No download/save button is clicked.
              exact = driver.find_elements(By.XPATH, "//*[contains(normalize-space(.), '木版本（4）.pdf')]")
              visible_exact = [e for e in exact if e.is_displayed()]
              result["visible_target_element_count"] = len(visible_exact)
              if visible_exact:
                  result["normal_target_click_attempted"] = True
                  try:
                      driver.execute_script("arguments[0].scrollIntoView({block:'center'});", visible_exact[-1])
                      visible_exact[-1].click()
                      result["normal_target_click_succeeded"] = True
                      time.sleep(10)
                  except Exception as exc:
                      result["normal_target_click_error"] = repr(exc)

                  preview_html = driver.page_source or ""
                  preview_body = ""
                  try:
                      preview_body = driver.find_element(By.TAG_NAME, "body").text or ""
                  except Exception:
                      pass
                  (OUT / "quark-selenium-preview.html").write_text(preview_html, encoding="utf-8")
                  (OUT / "quark-selenium-preview.txt").write_text(preview_body, encoding="utf-8")
                  try:
                      driver.save_screenshot(str(OUT / "quark-selenium-preview.png"))
                  except Exception as exc:
                      result["preview_screenshot_error"] = repr(exc)
                  result.update({
                      "preview_url": driver.current_url,
                      "preview_title": driver.title,
                      "preview_dom_bytes": len(preview_html.encode("utf-8")),
                      "preview_visible_text_bytes": len(preview_body.encode("utf-8")),
                      "preview_terms": [x for x in ("PDF", "页", "上一页", "下一页", "预览", "打开夸克", "登录", "扫码") if x in preview_body],
                      "five_xiong_shen_text_visible_in_preview": "五凶神" in preview_html or "五凶神" in preview_body,
                      "late_zi_received_text_visible_in_preview": "上五刻" in preview_html or "上五刻" in preview_body,
                  })
          except WebDriverException as exc:
              result["webdriver_error"] = repr(exc)
          finally:
              if driver is not None:
                  try:
                      driver.quit()
                  except Exception:
                      pass

          result["same_snu_physical_digitization_lineage"] = True
          result["independent_physical_witness_increment"] = 0
          result["algorithm_effect"] = "NONE"
          (OUT / "quark-snu-v4-selenium-render.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Summarize public-share evidence package
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          OUT = Path("probe")
          static = json.loads((OUT / "quark-snu-v4-public-share-probe.json").read_text(encoding="utf-8"))
          sp = OUT / "quark-snu-v4-selenium-render.json"
          selenium = json.loads(sp.read_text(encoding="utf-8")) if sp.exists() else {}
          result = {
              "schema": "QUARK-SNU-MINGJINGGE-V4-PUBLIC-ROUTE-CONTROL-R1",
              "static_probe": {
                  "quark_http_200": any(r.get("route") == "quark_public_share" and r.get("status") == 200 for r in static.get("routes", [])),
                  "static_target_exposed": static.get("adjudication", {}).get("target_file_static_html_exposed"),
              },
              "selenium_probe": selenium,
              "route_adjudication": "PUBLIC_BROWSER_TARGET_LIST_OBSERVED" if selenium.get("target_filename_present_initial")
                  else ("PUBLIC_BROWSER_PARTIAL_RENDER_NO_TARGET_OBSERVED" if selenium.get("initial_dom_bytes", 0) else "PUBLIC_BROWSER_RENDER_UNAVAILABLE"),
              "target_physical_page_observed": False,
              "five_xiong_shen_target_page_observed": False,
              "same_snu_physical_digitization_lineage": True,
              "independent_physical_witness_increment": 0,
              "new_candidate_authorized": False,
              "algorithm_reopen_authorized": False,
          }
          (OUT / "quark-snu-v4-public-route-control.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "route_adjudication": result["route_adjudication"],
              "target_filename_present_initial": selenium.get("target_filename_present_initial"),
              "target_fragment_present_initial": selenium.get("target_fragment_present_initial"),
              "visible_target_element_count": selenium.get("visible_target_element_count"),
              "normal_target_click_attempted": selenium.get("normal_target_click_attempted"),
              "normal_target_click_succeeded": selenium.get("normal_target_click_succeeded"),
              "preview_terms": selenium.get("preview_terms"),
              "five_xiong_shen_text_visible_in_preview": selenium.get("five_xiong_shen_text_visible_in_preview"),
              "late_zi_received_text_visible_in_preview": selenium.get("late_zi_received_text_visible_in_preview"),
              "webdriver_error": selenium.get("webdriver_error"),
          }, ensure_ascii=False, indent=2))

      - name: Upload public-share evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quark-snu-v4-public-share-probe
          path: probe/
          if-no-files-found: warn
          retention-days: 14
