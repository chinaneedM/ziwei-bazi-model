name: research-kyujanggak-1912-catalog-candidates

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1912-catalog-candidates.yml"
      - "scripts/research_kyujanggak_1912_catalog_candidates.py"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Discover 1912 catalog candidates from live provider list
        run: |
          python scripts/research_kyujanggak_1912_catalog_candidates.py \
            --output artifacts/kyujanggak-1912-catalog-candidates
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1912-catalog-candidates-${{ github.sha }}
          path: artifacts/kyujanggak-1912-catalog-candidates/
          if-no-files-found: warn
          retention-days: 7
