name: probe-goryeosa-waseda-folio-seam-13bu
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-goryeosa-waseda-folio-seam-13bu.py
      - .github/workflows/probe-goryeosa-waseda-folio-seam-13bu.yml
      - docs/research/TIANWEN-13BU-GORYEOSA-WASEDA-D16-FOLIO-SEAM-AND-PRECEDING-SOURCE-R1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-prior-folios:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded source JPEG/PDF handlers
        run: python -m pip install 'Pillow>=10,<12' 'PyMuPDF>=1.24,<2'
      - name: Gate day16 folio seam and frozen old evidence before source fetch
        run: |
          python scripts/verify-goryeosa-waseda-folio-seam-13bu.py
          python -m unittest discover -s tests -p 'test_goryeosa_waseda_folio_seam_13bu.py' -v
      - name: Acquire Waseda page20-22 original embedded images and check p23 original
        run: python scripts/probe-goryeosa-waseda-folio-seam-13bu.py
      - name: Preserve source-image receipts even when source unavailable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goryeosa-13bu-waseda-original-folios-p20-p22
          path: goryeosa-13bu-waseda-original-neighbor/
          retention-days: 30
          if-no-files-found: warn
