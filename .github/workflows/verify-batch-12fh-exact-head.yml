name: verify-batch-12fh-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fh-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FH continuity and genealogy
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path('docs/research/ZIWEI-NLC-CURRENT-SYS-ITEM-HOLDINGS-LOCATOR-R1.json').read_text(encoding='utf-8'))
          assert evidence['batch_id'] == 'BATCH-12-ZIWEI-NLC-CURRENT-SYS-ITEM-HOLDINGS-LOCATOR-FH'
          assert evidence['original_record']['sys'] == '001775083'
          assert evidence['original_record']['uid'] == 'UCS01003828993'
          assert evidence['local_holdings_locator']['adjudicated_locator'] == 'NLC:SBYL:03483'
          assert evidence['local_holdings_locator']['field_905s'] == '03483'
          assert evidence['local_holdings_locator']['public_barcode_proved'] is False
          assert evidence['microfilm_record']['linked_original_record_control_id'] == '411999008601'
          assert evidence['separate_photo_reference']['classification'] == 'SEPARATE_PHOTOGRAPH_REFERENCE_ONLY'
          assert evidence['object_binding_adjudication']['same_object_edge_authorized'] is False
          assert evidence['chronology_and_rule_firewall']['direct_sanming_parent_vote_increment'] == 0

          state = json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['historical_audit']['latest_batch_doc'].endswith('NLC-CURRENT-SYS-ITEM-HOLDINGS-LOCATOR-FH.md')
          assert state['invariants']['deterministic_fusion_chart_product_r1'] == 'CLOSED'

          graph = json.loads(Path('docs/TRANSMISSION-GENEALOGY-GRAPH-R1.json').read_text(encoding='utf-8'))
          assert any(n.get('node_id') == 'CATALOG-NLC-CURRENT-ZHUNZHAI-SYS001775083-UIDUCS01003828993' for n in graph['nodes'])
          assert any(e.get('edge_id') == 'TG-E0111' and e.get('status') == 'HIGH_CONFIDENCE' for e in graph['edges'])
          PY
