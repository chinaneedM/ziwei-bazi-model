name: probe-nikh-goryeosa-viewer-js-13fc
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/probe-nikh-goryeosa-viewer-js-13fc.py
      - tests/test_probe_nikh_goryeosa_viewer_js_13fc.py
      - .github/workflows/probe-nikh-goryeosa-viewer-js-13fc.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed source binding tests
        run: |
          python -m py_compile scripts/probe-nikh-goryeosa-viewer-js-13fc.py
          python -m unittest discover -s tests -p 'test_probe_nikh_goryeosa_viewer_js_13fc.py' -v
      - name: Read only source-emitted viewer scripts
        run: python scripts/probe-nikh-goryeosa-viewer-js-13fc.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13fc-official-viewer-js-access
          path: /tmp/tianwen-13fc-probe/
          if-no-files-found: warn
          retention-days: 30
