name: audit-leibian-ming-fine-table-dahan-yushui

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-leibian-ming-fine-table-dahan-yushui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Lock Leibian fine-table target pages
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/leibian-ming-fine-table-dahan-yushui'
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-411999018604-67969_%E9%A1%9E%E7%B7%A8%E6%9B%86%E6%B3%95%E9%80%9A%E6%9B%B8%E5%A4%A7%E5%85%A8_%E7%AC%AC1%E5%86%8A.pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"

          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source.sha256"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"

          for p in 23 24 25 26; do
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 360 "$ROOT/source.pdf" "$ROOT/page-$p"
          done
          sha256sum "$ROOT"/page-*.png | sort -V | tee "$ROOT/pages.sha256"

          printf '%s\n' \
            'SOURCE=NLC892-411999018604-67969 類編曆法通書大全 第1冊' \
            'CATALOG_SCOPE=明刻本; exact impression year unresolved' \
            'TARGET=四時加減晝夜節氣 fine table around winter/spring transitions' \
            'QUESTION=What exact day-range/change-point wording governs 大寒 and 雨水, and does either match Sanming/Yueling 十三後 / 後四日?' \
            'PAGES=23,24,25,26' \
            'RENDER_DPI=360' \
            'OCR_USED_FOR_FINAL_GLYPH_CLAIMS=false' \
            'TEXT_LAYER_ROLE=NONE_FOR_FINAL_GLYPH_CLAIMS' \
            > "$ROOT/manifest.txt"

          rm "$ROOT/source.pdf"

      - name: Upload decisive target pages
        uses: actions/upload-artifact@v4
        with:
          name: leibian-ming-fine-table-dahan-yushui
          path: audit/leibian-ming-fine-table-dahan-yushui
          if-no-files-found: error
          retention-days: 30
