name: verify-batch-12fy-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fy-exact-head.yml
      - docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI-2008-ISSUE03-PAGINATION-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI-2008-ISSUE03-PKU-CQVIP-PAGINATION-BOUNDARY-FY.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FY exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI-2008-ISSUE03-PKU-CQVIP-PAGINATION-BOUNDARY-FY'
          ep=Path('docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI-2008-ISSUE03-PAGINATION-BOUNDARY-R1.json')
          dp=Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI-2008-ISSUE03-PKU-CQVIP-PAGINATION-BOUNDARY-FY.md')
          assert ep.is_file() and dp.is_file()
          e=json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          p=e['pku_first_party_issue_container']
          assert p['jid']=='94408'
          assert p['viid']=='12482306'
          assert p['issue_year']==2008
          assert p['issue_no']=='03'
          assert p['issn']=='1004-3241'
          assert p['cn']=='11-2992/G2'
          assert p['first_party_issue_container_closed'] is True
          assert p['target_article_row_source_emitted_on_reviewed_static_surface'] is False
          assert p['target_article_page_range_source_emitted_on_reviewed_static_surface'] is False
          assert p['target_article_text_source_emitted_on_reviewed_static_surface'] is False
          assert p['fulltext_bridge_presence_is_not_target_article_retrieval'] is True

          q=e['cqvip_current_toc_control']
          assert q['selected_issue']=='2008年3期'
          assert q['displayed_article_count']==31
          assert q['first_static_toc_page_last_visible_article_page_range']=='92-95'
          assert q['first_static_toc_page_max_visible_end_page']==95
          assert q['toc_pagination_control_pages_observed']==[1,2]
          assert q['second_toc_page_directly_retrieved_by_project'] is False
          assert q['target_article_row_observed'] is False
          assert q['target_article_page_range']=='UNRESOLVED'

          a=e['secondary_journal_page_anchors']
          assert a['anchor_1949_09_30']['cited_journal_page']==120
          assert a['anchor_1949_09_30']['primary_journal_page_directly_reviewed_by_project'] is False
          assert a['anchor_1950_01_01']['cited_journal_page']==124
          assert a['anchor_1950_01_01']['registry_promotion_authorized'] is False

          access=e['search_and_access_boundary']
          assert access['target_primary_article_record_found'] is False
          assert access['target_primary_article_page_range_found'] is False
          assert access['target_primary_fulltext_or_scan_found'] is False
          assert access['login_bypass_attempted'] is False
          assert access['paywall_bypass_attempted'] is False

          adj=e['adjudication']
          assert adj['target_1950_01_29_journal_page']=='UNRESOLVED'
          assert adj['target_1950_01_29_journal_text']=='NOT_REVIEWED_FROM_PRIMARY_JOURNAL'
          assert adj['target_1950_01_29_facsimile_page']=='UNRESOLVED'
          assert adj['target_1950_01_29_facsimile_text']=='NOT_REVIEWED'
          assert adj['target_1950_01_29_handwriting_directly_collated'] is False
          assert adj['target_specific_purchase_route_selected'] is False
          assert adj['target_specific_donation_route_selected'] is False
          assert adj['final_nlc_acquisition_transfer_path']=='UNRESOLVED'

          fw=e['inference_firewall']
          for key in (
              'first_party_issue_container_does_not_equal_target_article_row',
              'first_party_issue_container_does_not_equal_target_article_page',
              'cqvip_article_count_and_first_toc_page_do_not_locate_target_article',
              'nearby_date_page_anchors_must_not_be_linearly_interpolated',
              'secondary_page_citation_does_not_equal_primary_journal_page_review',
              'journal_page_number_must_not_be_mapped_to_2007_facsimile_page_without_direct_crosswalk',
              'target_jan29_derivative_quote_does_not_equal_primary_journal_or_facsimile_text',
              'collection_level_twelve_box_purchase_does_not_bind_target_volume',
              'target_route_requires_item_level_or_stable_identifier_level_transaction_evidence',
          ):
              assert fw[key] is True

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          state_schema_version=tuple(int(part) for part in state['schema_version'].split('.'))
          assert state_schema_version >= (1, 185, 0)
          assert bid in state['historical_audit']['completed_batches']

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {
              'EXT-PKU-CCJ-ZGDJYWH-2008-03-VIID12482306',
              'EXT-CQVIP-ZGDJYWH-2008-03-TOC',
              'EXT-AISIXIANG-QUJUN-WUSHIZHAI-1949-0930-P120-CITATION',
          }.issubset(ids)

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_provenance_metadata_defect_count']==13
          assert e['accounting']['repaired_provenance_metadata_defect_count']==13
          PY
