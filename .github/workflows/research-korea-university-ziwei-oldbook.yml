name: research-korea-university-ziwei-oldbook

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-korea-university-ziwei-oldbook.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Search only Korea University public rare-old-book UI
        shell: python
        run: |
          import json
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys

          OUT=Path('probe'); OUT.mkdir()
          URL='https://library.korea.ac.kr/datause/archiving/rarebook-oldbook/'
          QUERIES=['新刻合併十八飛星策天紫微斗數全集','紫微斗數全集','飛星策天紫微斗數','紫微斗數','陳搏']

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1800,2600')
          opts.add_argument('--lang=ko-KR')

          result={
            'schema':'ZIWEI-KOREA-UNIVERSITY-OLDBOOK-PUBLIC-SEARCH-R1',
            'source_url':URL,
            'scope':'PUBLIC_RARE_OLD_BOOK_ARCHIVE_UI_ONLY',
            'authentication_attempted':False,
            'form_submission_is_public_search_only':True,
            'route_guessing_attempted':False,
            'results':[]
          }

          driver=webdriver.Chrome(options=opts)
          try:
            driver.set_page_load_timeout(90)
            for qi,q in enumerate(QUERIES,1):
              driver.get(URL); time.sleep(6)
              row={'query':q,'before_url':driver.current_url}
              # Bind the visible search input by placeholder first, then fallback to visible text inputs near the search button.
              inputs=[]
              for el in driver.find_elements(By.CSS_SELECTOR,"input[placeholder*='검색어']"):
                try:
                  if el.is_displayed(): inputs.append(el)
                except Exception: pass
              if not inputs:
                for el in driver.find_elements(By.CSS_SELECTOR,"input[type='text']"):
                  try:
                    if el.is_displayed(): inputs.append(el)
                  except Exception: pass
              row['visible_search_input_count']=len(inputs)
              if not inputs:
                row['status']='NO_VISIBLE_SEARCH_INPUT'
                result['results'].append(row); continue
              inp=inputs[-1]
              inp.clear(); inp.send_keys(q); inp.send_keys(Keys.ENTER)
              time.sleep(7)
              row['after_url']=driver.current_url
              body=driver.find_element(By.TAG_NAME,'body').text
              row['body_text']=body[:60000]
              row['no_result_language']=any(x in body for x in ('검색 결과가 없습니다','검색결과가 없습니다','0 건','총 0 건'))
              links=[]
              for a in driver.find_elements(By.CSS_SELECTOR,'a[href]'):
                try:
                  if not a.is_displayed(): continue
                  txt=' '.join((a.text or '').split())
                  href=a.get_attribute('href') or ''
                  hay=txt+' '+href
                  if any(k in hay for k in ('紫微','飛星','陳搏','斗數')):
                    links.append({'text':txt[:1200],'href':href})
                except Exception: pass
              seen=set(); dedup=[]
              for x in links:
                key=(x['text'],x['href'])
                if key not in seen:
                  seen.add(key); dedup.append(x)
              row['relevant_links']=dedup[:100]
              driver.save_screenshot(str(OUT/f'query-{qi:02d}.png'))
              (OUT/f'query-{qi:02d}.html').write_text(driver.page_source,encoding='utf-8')
              result['results'].append(row)
          finally:
            driver.quit()

          result['adjudication']={
            'goal':'BIND_KOREA_UNIVERSITY_THIRD_PHYSICAL_COPY_AND_ANY_PUBLIC_DIGITAL_OBJECT',
            'independent_physical_copy_status':'PENDING_FIRST_PARTY_RECORD',
            'target_page_status':'PENDING_DIRECT_PAGE',
            'algorithm_effect':'NONE'
          }
          (OUT/'korea-university-oldbook-search.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({
            'results':[{
              'query':r.get('query'),'after_url':r.get('after_url'),'no_result_language':r.get('no_result_language'),
              'relevant_links':r.get('relevant_links'),'status':r.get('status')
            } for r in result['results']],
            'adjudication':result['adjudication']
          },ensure_ascii=False,indent=2))

      - name: Upload Korea University old-book evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-korea-university-oldbook-public-search
          path: probe/
          if-no-files-found: warn
          retention-days: 14
