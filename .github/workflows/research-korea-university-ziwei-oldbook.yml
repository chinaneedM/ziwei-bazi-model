name: research-korea-university-ziwei-oldbook

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-korea-university-ziwei-oldbook.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Recheck public rare-old-book archive using exact first-party catalog glyphs
        shell: python
        run: |
          import json,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys

          OUT=Path('probe'); OUT.mkdir()
          URL='https://library.korea.ac.kr/datause/archiving/rarebook-oldbook/'
          QUERIES=['新刻合倂十八飛星策天紫微斗數全集','江左書林','대학원 C10 B8','CAT000000737166']
          TERMS=('新刻合倂','紫微','飛星','斗數','江左書林','C10 B8','CAT000000737166')
          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--disable-gpu'); opts.add_argument('--window-size=1800,2600'); opts.add_argument('--lang=ko-KR')
          result={'schema':'ZIWEI-KOREA-UNIVERSITY-OLDBOOK-PUBLIC-SEARCH-R2','source_url':URL,'catalog_control':'CAT000000737166','authentication_attempted':False,'route_guessing_attempted':False,'results':[]}
          d=webdriver.Chrome(options=opts)
          try:
            d.set_page_load_timeout(90)
            for i,q in enumerate(QUERIES,1):
              d.get(URL); time.sleep(6)
              row={'query':q}
              inputs=[e for e in d.find_elements(By.CSS_SELECTOR,"input[placeholder*='검색어'],input[type='text']") if e.is_displayed()]
              row['visible_search_input_count']=len(inputs)
              if not inputs:
                row['status']='NO_VISIBLE_SEARCH_INPUT'; result['results'].append(row); continue
              inp=inputs[-1]; inp.clear(); inp.send_keys(q); inp.send_keys(Keys.ENTER); time.sleep(7)
              row['after_url']=d.current_url
              body=d.find_element(By.TAG_NAME,'body').text
              row['body_text']=body[:70000]
              row['matching_lines']=[line for line in body.splitlines() if any(t.lower() in line.lower() for t in TERMS)][:300]
              links=[]
              for a in d.find_elements(By.CSS_SELECTOR,'a[href]'):
                try:
                  if not a.is_displayed(): continue
                  txt=' '.join((a.text or '').split()); href=a.get_attribute('href') or ''
                  hay=txt+' '+href
                  if any(t.lower() in hay.lower() for t in TERMS): links.append({'text':txt[:1500],'href':href})
                except Exception: pass
              seen=set(); rr=[]
              for x in links:
                k=(x['text'],x['href'])
                if k not in seen: seen.add(k); rr.append(x)
              row['relevant_links']=rr[:100]
              d.save_screenshot(str(OUT/f'query-{i}.png'))
              (OUT/f'query-{i}.html').write_text(d.page_source,encoding='utf-8')
              result['results'].append(row)
          finally:
            d.quit()
          result['adjudication']={'physical_copy':'BOUND_BY_CAT000000737166','digital_archive_object':'PENDING_THIS_RECHECK','independent_late_zi_glyph_vote_added':0,'target_page_status':'PENDING_DIRECT_PAGE','algorithm_effect':'NONE'}
          (OUT/'korea-university-oldbook-search.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'results':[{'query':r.get('query'),'after_url':r.get('after_url'),'matching_lines':r.get('matching_lines'),'relevant_links':r.get('relevant_links'),'status':r.get('status')} for r in result['results']],'adjudication':result['adjudication']},ensure_ascii=False,indent=2))

      - name: Upload Korea University old-book evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-korea-university-oldbook-public-search
          path: probe/
          if-no-files-found: warn
          retention-days: 14
