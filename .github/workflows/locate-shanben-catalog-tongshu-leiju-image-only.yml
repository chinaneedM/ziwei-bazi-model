name: locate-shanben-catalog-tongshu-leiju-image-only

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/locate-shanben-catalog-tongshu-leiju-image-only.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install render tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils imagemagick

      - name: Render complete image-only catalog locator
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/shanben-catalog-tongshu-leiju-image-only'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages" "$ROOT/contact"

          URL='https://upload.wikimedia.org/wikipedia/commons/d/db/SSID-13990657_%E4%B8%AD%E5%9C%8B%E5%8F%A4%E7%B1%8D%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_%E5%AD%90%E9%83%A8_3.pdf'
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2             -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"

          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source.sha256"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"
          pages=$(pdfinfo "$ROOT/source.pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" -eq 160

          pdftoppm -jpeg -jpegopt quality=82 -r 72 "$ROOT/source.pdf" "$ROOT/pages/page"
          mapfile -t imgs < <(find "$ROOT/pages" -name 'page-*.jpg' | sort -V)
          test "${#imgs[@]}" -eq 160
          sha256sum "${imgs[@]}" | sort -V > "$ROOT/pages.sha256"

          for offset in 0 20 40 60 80 100 120 140; do
            start=$((offset+1))
            end=$((offset+20))
            chunk=("${imgs[@]:offset:20}")
            montage "${chunk[@]}"               -thumbnail 230x440               -label '%f'               -tile 5x4 -geometry +8+28               "$ROOT/contact/contact-$(printf '%03d' "$start")-$(printf '%03d' "$end").jpg"
          done
          sha256sum "$ROOT/contact"/*.jpg | sort -V > "$ROOT/contact.sha256"

          printf '%s\n'             'SOURCE=中國古籍善本書目 子部 三'             'SOURCE_SHA256=e562a7af9c9aac5daf641172110133f8f203cebeb1ebcd1bad4fd515979cf2ab'             'PDF_PAGES=160'             'TARGET=通書類聚尅擇大全 / 通書類聚抉擇大全 / 明嘉靖三十年芝城銅活字印本'             'METHOD=complete 160-page image-only locator at 72dpi; page filenames labeled on contact sheets'             'TEXT_LAYER=ABSENT_OR_UNUSABLE_CONFIRMED_BY_PRIOR_RUN_35364226068'             'OCR_USED=false'             'CONTENT_NEGATIVE_AUTHORITY=false'             > "$ROOT/manifest.txt"

          rm "$ROOT/source.pdf" "$ROOT"/pages/*.jpg
          rmdir "$ROOT/pages"

      - name: Upload image-only catalog locator
        uses: actions/upload-artifact@v4
        with:
          name: shanben-catalog-tongshu-leiju-image-only-locator
          path: audit/shanben-catalog-tongshu-leiju-image-only/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
