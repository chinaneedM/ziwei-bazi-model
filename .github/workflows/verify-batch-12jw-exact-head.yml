name: verify-batch-12jw-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12jw-exact-head.yml
      - .github/workflows/probe-batch-12jw-nlc-opac-public-search-contract.yml
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-OPAC-PUBLIC-SEARCH-CONTRACT-TRANSPORT-BOUNDARY-JW.md
      - docs/research/ZIWEI-NLC-OPAC-PUBLIC-SEARCH-CONTRACT-TRANSPORT-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 12JW
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-NLC-OPAC-PUBLIC-SEARCH-CONTRACT-TRANSPORT-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-NLC-OPAC-PUBLIC-SEARCH-CONTRACT-TRANSPORT-BOUNDARY-JW'
          assert e['routes']['opac_root']['http_status']==200
          assert e['routes']['source_emitted_login_session']['reached'] is False
          assert e['adjudication']['public_search_contract']=='NOT_OBSERVED'
          assert e['adjudication']['nlc_opac_nonholding']=='NOT_PROVED'
          PY
      - name: Publish success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'success', context: 'tianwen/batch-12jw-exact-head', description: 'Batch 12JW exact-head verification passed'})
      - name: Publish failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'failure', context: 'tianwen/batch-12jw-exact-head', description: 'Batch 12JW exact-head verification failed'})
