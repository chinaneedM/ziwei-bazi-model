name: acquire-najda-goryeosa-13au
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/acquire-najda-goryeosa-13au.py
      - .github/workflows/acquire-najda-goryeosa-13au.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-content-image-sampling:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch three provider-emitted IIIF JPEGs
        run: python scripts/acquire-najda-goryeosa-13au.py
      - name: Save bounded firstparty sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: najda-goryeosa-13au-content-sample
          path: najda-goryeosa-13au-evidence/
          retention-days: 30
          if-no-files-found: warn
