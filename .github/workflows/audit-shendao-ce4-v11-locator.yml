name: audit-shendao-ce4-v11-locator

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-shendao-ce4-v11-locator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install document tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pillow

      - name: Acquire fourth physical fascicle and build visual locator
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/shendao-ce4-v11-locator'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/render" "$ROOT/contact"
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/FPSLRBO%20B17672971%20%E7%A5%9E%E9%81%93%E5%A4%A7%E7%B7%A8%E6%9B%86%E5%AE%97%E9%80%9A%E8%AD%B0.%E5%8D%81%E5%85%AB%E5%8D%B7%20%E5%86%8C0004.pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"
          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source.sha256"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"
          pdftotext -layout "$ROOT/source.pdf" "$ROOT/text.txt" || true

          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('audit/shendao-ce4-v11-locator')
          txt=(root/'text.txt').read_text(encoding='utf-8',errors='ignore')
          terms=['卷之十一','卷十一','趙緣督十八篇論','論晝夜長短','論地域遠近','論晝夜百刻','晝夜十二時','子時']
          hits={t:len(list(re.finditer(re.escape(t),txt))) for t in terms}
          (root/'text-layer-hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(hits,ensure_ascii=False))
          PY

          PAGES=$(pdfinfo "$ROOT/source.pdf" | awk '/^Pages:/ {print $2}')
          pdftoppm -jpeg -jpegopt quality=90 -r 115 "$ROOT/source.pdf" "$ROOT/render/page" >/dev/null 2>&1
          COUNT=$(find "$ROOT/render" -maxdepth 1 -name 'page-*.jpg' | wc -l)
          test "$COUNT" -eq "$PAGES"
          sha256sum "$ROOT"/render/page-*.jpg | sort -V > "$ROOT/render.sha256"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path('audit/shendao-ce4-v11-locator')
          pages=sorted((root/'render').glob('page-*.jpg'),key=lambda p:int(p.stem.split('-')[-1]))
          for i in range(0,len(pages),30):
              batch=pages[i:i+30]
              thumbs=[]
              for p in batch:
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((260,360))
                  c=Image.new('RGB',(280,390),'white')
                  c.paste(im,((280-im.width)//2,24))
                  ImageDraw.Draw(c).text((8,6),p.name,fill='black')
                  thumbs.append(c)
              cols=5; rows=(len(thumbs)+cols-1)//cols
              sh=Image.new('RGB',(cols*280,rows*390),'white')
              for j,im in enumerate(thumbs): sh.paste(im,((j%cols)*280,(j//cols)*390))
              sh.save(root/'contact'/f'contact-{i+1:04d}-{i+len(batch):04d}.jpg',quality=92)
          PY
          sha256sum "$ROOT"/contact/*.jpg | sort -V > "$ROOT/contact.sha256"

          cat > "$ROOT/manifest.txt" <<'EOF'
          SOURCE=FPSLRBO B17672971 神道大編曆宗通議十八卷 册0004
          AUTHOR=周述學
          EDITION_SCOPE=抄本; catalogued 明嘉靖萬曆間 [1522-1619]
          TARGET=卷十一 趙緣督十八篇論 / 論晝夜長短 / 論地域遠近 / 論晝夜百刻
          PRIOR_CE1_CE2_SCOPE=LOCATOR_MISS_ONLY_FOR_VOLUME11; NO_CONTENT_NEGATIVE_AUTHORITY
          TEXT_LAYER_ROLE=LOCATOR_ONLY_NOT_GLYPH_AUTHORITY
          OCR_USED_FOR_FINAL_GLYPH_CLAIMS=false
          PHYSICAL_COPY_PRE1578_STATUS=UNRESOLVED
          EOF

          SMALL='audit/shendao-ce4-v11-compact'
          mkdir -p "$SMALL"
          cp -r "$ROOT/contact" "$SMALL/contact"
          cp "$ROOT/source.sha256" "$SMALL/source.sha256"
          cp "$ROOT/pdfinfo.txt" "$SMALL/pdfinfo.txt"
          cp "$ROOT/text-layer-hits.json" "$SMALL/text-layer-hits.json"
          cp "$ROOT/render.sha256" "$SMALL/render.sha256"
          cp "$ROOT/contact.sha256" "$SMALL/contact.sha256"
          cp "$ROOT/manifest.txt" "$SMALL/manifest.txt"

      - name: Upload compact visual locator
        uses: actions/upload-artifact@v4
        with:
          name: shendao-ce4-v11-compact-locator
          path: audit/shendao-ce4-v11-compact
          if-no-files-found: error
          retention-days: 30
