name: probe-yehuobian-shanghai-gj2312912-dense-12qb
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-shanghai-gj2312912-dense-12qb.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shanghai-contiguous-physical-page-index:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        part: [2, 3]
    steps:
      - name: Install reproducible no-OCR PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install -q pillow
      - name: Render bounded contiguous page windows and source-page contacts
        shell: bash
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          mkdir -p dense-12qb/contacts dense-12qb/pages
          python - <<'PY'
          import os,pathlib,json,subprocess,hashlib,urllib.parse
          from PIL import Image,ImageDraw,ImageStat
          part=int(os.environ["PART"])
          root=pathlib.Path("dense-12qb")
          label=f"Shanghai 萬曆野獲編三十卷 part {part}.pdf"
          url="https://commons.wikimedia.org/wiki/Special:Redirect/file/"+urllib.parse.quote(label)
          p=root/f"part{part}.pdf"
          d=subprocess.run(["curl","-L","--fail","--retry","3","--retry-all-errors","--retry-delay","3","--connect-timeout","25","--max-time","450","-A","Tianwen-Source-Collation-R1/1.0",url,"-o",str(p)],capture_output=True,text=True,timeout=470)
          if d.returncode: raise RuntimeError(f"cannot fetch PDF: {d.returncode} {d.stderr[-220:]}")
          assert p.open("rb").read(4)==b"%PDF"
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          expected={2:("7ea8fe57f5baebd8f2841771d87ec5e3ed34c271e0fe89596a28d2521c9165a6",550,350,550),
                    3:("7fa233a835c30f1a3fc8c2a1b83896c9f1821af87ed50a84a313d69b9fc2f940",357,1,110)}
          h,required,start,stop=expected[part]
          assert digest==h, "source file changed; refuse uncontrolled source swap"
          info=subprocess.run(["pdfinfo",str(p)],capture_output=True,text=True,check=True).stdout
          count=int(next(v.split(":",1)[1] for v in info.splitlines() if v.startswith("Pages:")))
          assert count==required
          out={"part":part,"source_url":url,"source_pdf_sha256":digest,"source_pdf_pages":count,"range_pdf":[start,stop],
               "range_global":[(part-1)*550+start,(part-1)*550+stop],
               "no_ocr":True,"scope":"DENSE_PAGE_RENDER_ONLY_NOT_TEXT_OR_GLYPH_NEGATIVE_SEARCH","pages":[],"contact_sheets":[]}
          group=[]
          for i in range(start,stop+1):
            dest=root/"pages"/f"part{part}-p{i:04d}.jpg"
            command=["pdftoppm","-f",str(i),"-l",str(i),"-r","52","-jpeg","-jpegopt","quality=62","-singlefile",str(p),str(dest.with_suffix(""))]
            subprocess.run(command,capture_output=True,check=True,timeout=50)
            raw=dest.read_bytes()
            pic=Image.open(dest).convert("RGB");pic.thumbnail((520,410))
            grey=ImageStat.Stat(pic.convert("L"))
            out["pages"].append({"pdf_page":i,"global_page":(part-1)*550+i,"sha256":hashlib.sha256(raw).hexdigest(),
                                 "byte_count":len(raw),"mean_gray":round(grey.mean[0],3)})
            group.append((i,pic.copy()))
            if len(group)==12 or i==stop:
              number=len(out["contact_sheets"])+1
              page=Image.new("RGB",(4*560,3*450),(248,248,248));draw=ImageDraw.Draw(page)
              for k,(src_num,im) in enumerate(group):
                x=(k%4)*560;y=(k//4)*450
                draw.text((x+5,y+6),f"GJ2312912 PART{part} PDF-{src_num} GLOBAL-{(part-1)*550+src_num}",fill=(0,0,0))
                page.paste(im,(x+6,y+31))
              name=f"part{part}-dense-{number:03d}.jpg"
              outpath=root/"contacts"/name
              page.save(outpath,quality=74,optimize=True)
              out["contact_sheets"].append({"file":name,"from_pdf":group[0][0],"through_pdf":group[-1][0],"sha256":hashlib.sha256(outpath.read_bytes()).hexdigest()})
              print("CONTACT",name,"PDF",group[0][0],group[-1][0],flush=True)
              group=[]
          (root/"dense-source-page-index.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("BOUNDED_DENSE_RENDER",json.dumps({"part":part,"source":h,"images":len(out["pages"]),"sheets":len(out["contact_sheets"])},ensure_ascii=False),flush=True)
          p.unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shanghai-gj2312912-dense-part${{ matrix.part }}-12qb
          path: dense-12qb/
          retention-days: 30
          if-no-files-found: warn
