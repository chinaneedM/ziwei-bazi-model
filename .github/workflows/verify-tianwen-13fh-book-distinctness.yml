name: verify-tianwen-13fh-book-distinctness
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - docs/research/TIANWEN-13FH-GK5553-FORTYSIX-VS-DONGA-SEVENTYFIVE-BOOK-SCOPE-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - scripts/verify-tianwen-13fh-book-distinctness.py
      - tests/test_verify_tianwen_13fh_book_distinctness.py
      - .github/workflows/verify-tianwen-13fh-book-distinctness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bounded historic book scope and false-closure tests
        run: |
          python -m py_compile scripts/verify-tianwen-13fh-book-distinctness.py tests/test_verify_tianwen_13fh_book_distinctness.py
          python scripts/verify-tianwen-13fh-book-distinctness.py
          python -m unittest discover -s tests -p 'test_verify_tianwen_13fh_book_distinctness.py' -v
