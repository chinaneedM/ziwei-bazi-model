name: verify-batch-12fz-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fz-exact-head.yml
      - docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI-2008-ISSUE03-PKU-ARTICLE-RANGE-P120-REPAIR-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI-2008-ISSUE03-PKU-ARTICLE-RANGE-AND-P120-CITATION-REPAIR-FZ.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FZ exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid = 'BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI-2008-ISSUE03-PKU-ARTICLE-RANGE-AND-P120-CITATION-REPAIR-FZ'
          ep = Path('docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI-2008-ISSUE03-PKU-ARTICLE-RANGE-P120-REPAIR-R1.json')
          dp = Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI-2008-ISSUE03-PKU-ARTICLE-RANGE-AND-P120-CITATION-REPAIR-FZ.md')
          assert ep.is_file() and dp.is_file()
          e = json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id'] == bid

          m = e['first_party_article_metadata']
          assert m['indexed_article_title'] == '《五石斋文史札记》(二十八)'
          assert m['authors'] == ['邓之诚', '邓瑞']
          assert m['journal'] == '中国典籍与文化'
          assert m['year'] == 2008 and m['issue'] == '03'
          assert (m['start_page'], m['end_page'], m['page_range']) == (121, 129, '121-129')
          assert m['article_page_range_status'] == 'CLOSED_AT_FIRST_PARTY_PLATFORM_INDEX_METADATA_LAYER'
          assert m['direct_primary_page_images_reviewed'] is False
          assert m['direct_primary_article_text_reviewed'] is False

          repair = e['fy_p120_forward_only_repair']
          assert repair['provenance_defect_id'] == 'PROV-DEFECT-014'
          assert repair['prior_claimed_page'] == 120
          assert repair['first_party_article_page_range'] == '121-129'
          assert repair['conflict'] == 'P120_OUTSIDE_FIRST_PARTY_ARTICLE_RANGE'
          assert repair['p120_anchor_authority_after_repair'] == 'WITHDRAWN_PENDING_PRIMARY_PAGE_OR_EXPLICIT_ERRATUM'
          assert repair['prior_fy_artifact_rewritten'] is False
          assert repair['defect_found_increment'] == 1
          assert repair['defect_repaired_increment'] == 1

          p124 = e['p124_control']
          assert p124['claimed_page'] == 124
          assert p124['within_first_party_article_range'] is True
          assert p124['promoted_to_primary_page_authority'] is False

          n = e['target_narrowing']
          assert n['article_page_range'] == '121-129'
          assert n['target_1950_01_29_possible_article_range_if_present'] == '121-129'
          assert n['target_1950_01_29_exact_journal_page'] == 'UNRESOLVED'
          assert n['target_1950_01_29_primary_journal_text'] == 'NOT_REVIEWED'
          assert n['target_1950_01_29_facsimile_page'] == 'UNRESOLVED'
          assert n['target_1950_01_29_handwriting_directly_collated'] is False

          state = json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['schema_version'] == '1.186.0'
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc'].endswith('PKU-ARTICLE-RANGE-AND-P120-CITATION-REPAIR-FZ.md')
          assert state['historical_audit']['row_count'] == 198
          assert state['historical_audit']['audited_row_count'] == 166
          assert state['historical_audit']['current_missing_from_product_row_count'] == 10
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count'] == 14
          assert state['historical_audit']['repaired_provenance_metadata_defect_count'] == 14
          assert state['invariants']['deterministic_fusion_chart_product_r1'] == 'CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count'] == 0
          assert state['invariants']['algorithm_reopen_count'] == 0
          assert state['invariants']['candidate_collapse_count'] == 0

          matrix = json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json').read_text(encoding='utf-8'))
          assert matrix['audit_summary']['confirmed_provenance_metadata_defect_count'] == 14
          assert matrix['audit_summary']['repaired_provenance_metadata_defect_count'] == 14

          reg = json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          by_id = {x.get('source_id'): x for x in reg['sources']}
          pku = by_id['EXT-PKU-CCJ-WUSHIZHAI28-2008-03-PP121-129-INDEX']
          assert pku['batch_12fz']['page_range'] == '121-129'
          assert pku['batch_12fz']['direct_primary_article_text_reviewed'] is False
          p120 = by_id['EXT-AISIXIANG-QUJUN-WUSHIZHAI-1949-0930-P120-CITATION']
          assert p120['source_role'] == 'SCHOLARLY_SECONDARY_CITATION_WITH_PAGE_CONFLICT_NOT_ACCEPTED_AS_ARTICLE_PAGE_ANCHOR'
          assert p120['batch_12fz']['provenance_defect_id'] == 'PROV-DEFECT-014'
          assert p120['batch_12fz']['defect_repaired'] is True

          assert e['transmission_impact']['nodes_added'] == []
          assert e['transmission_impact']['edges_added'] == []
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_row_count_change'] is False
          assert e['accounting']['matrix_rows'] == 198
          assert e['accounting']['audited_rows'] == 166
          assert e['accounting']['current_missing_from_product_rows'] == 10
          assert e['accounting']['confirmed_provenance_metadata_defect_count'] == 14
          assert e['accounting']['repaired_provenance_metadata_defect_count'] == 14
          PY
