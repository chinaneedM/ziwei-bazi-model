name: research-ziwei-quanshu-physical-copy-locators

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-quanshu-physical-copy-locators.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture public facsimile samples and physical-copy locator boundaries
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          UA = "Mozilla/5.0 research-only public historical-edition locator probe"

          XINYI_PRODUCT = "https://www.xinyi.hk/goods-7800.html"
          XINYI_IMAGES = [
              "https://www.xinyi.hk/images/202103/goods_img/7800_P_1615763065048.jpg",
              "https://www.xinyi.hk/images/202103/goods_img/7800_P_1615763065533.jpg",
              "https://www.xinyi.hk/images/202103/goods_img/7800_P_1615763066211.jpg",
              "https://www.xinyi.hk/images/202103/goods_img/7800_P_1615763066130.jpg",
              "https://www.xinyi.hk/images/202103/goods_img/7800_P_1615763066964.jpg",
              "https://www.xinyi.hk/images/202103/goods_img/7800_P_1615763066512.jpg",
              "https://www.xinyi.hk/images/202103/goods_img/7800_P_1615763066440.jpg",
          ]
          LOCATORS = {
              "kongfz_dunhuatang_54804686": "https://www.kongfz.cn/54804686/pic/",
              "kongfz_fullbook_70370885": "https://www.kongfz.cn/70370885/pic/",
              "artron_fullbook_lot_0064192036": "https://auction.artron.net/paimai-art0064192036/",
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          no_redirect = urllib.request.build_opener(NoRedirect)

          def request(url, *, redirect=True, max_bytes=8_000_000, accept="*/*", referer=None):
              headers = {
                  "User-Agent": UA,
                  "Accept": accept,
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
              }
              if referer:
                  headers["Referer"] = referer
              req = urllib.request.Request(url, headers=headers)
              opener = urllib.request.urlopen if redirect else no_redirect.open
              try:
                  with opener(req, timeout=45) as resp:
                      data = resp.read(max_bytes + 1)
                      if len(data) > max_bytes:
                          raise RuntimeError(f"response exceeded {max_bytes} byte guard")
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "location": resp.headers.get("location"),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except urllib.error.HTTPError as exc:
                  body = exc.read(max_bytes)
                  return {
                      "ok": False,
                      "status": exc.code,
                      "final_url": url,
                      "location": exc.headers.get("location"),
                      "content_type": exc.headers.get("content-type"),
                      "error": repr(exc),
                      "data": body,
                  }
              except Exception as exc:
                  return {"ok": False, "final_url": url, "error": repr(exc), "data": b""}

          def digest_meta(row):
              data = row.get("data", b"")
              return {
                  k: v for k, v in row.items() if k != "data"
              } | {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest() if data else None,
              }

          result = {
              "schema": "ZIWEI-QUANSHU-PHYSICAL-COPY-LOCATOR-PROBE-R1",
              "target_section": "論人生時要審的確",
              "target_glyph_question": "上五刻屬昨夜亥時 / 亥 glyph cross-edition stability",
              "ocr_used": False,
              "authentication_or_paywall_bypass_attempted": False,
              "identifier_bruteforce_attempted": False,
              "xinyi_product": {},
              "xinyi_public_sample_images": [],
              "physical_copy_locators": {},
          }

          product = request(XINYI_PRODUCT, accept="text/html,*/*;q=0.8")
          result["xinyi_product"] = digest_meta(product)
          if product.get("data"):
              (OUT / "xinyi-goods-7800.html").write_bytes(product["data"])

          for index, url in enumerate(XINYI_IMAGES):
              row = request(
                  url,
                  accept="image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
                  referer=XINYI_PRODUCT,
                  max_bytes=6_000_000,
              )
              meta = digest_meta(row)
              meta["url"] = url
              data = row.get("data", b"")
              meta["jpeg_magic"] = data.startswith(b"\xff\xd8")
              meta["png_magic"] = data.startswith(b"\x89PNG")
              if row.get("ok") and (meta["jpeg_magic"] or meta["png_magic"]):
                  suffix = ".jpg" if meta["jpeg_magic"] else ".png"
                  name = f"xinyi-sample-{index:02d}{suffix}"
                  (OUT / name).write_bytes(data)
                  meta["saved_file"] = name
              result["xinyi_public_sample_images"].append(meta)

          for key, url in LOCATORS.items():
              row = request(url, redirect=False, accept="text/html,*/*;q=0.8")
              meta = digest_meta(row)
              meta["url"] = url
              body = row.get("data", b"")
              if body:
                  name = f"{key}.html"
                  (OUT / name).write_bytes(body)
                  meta["saved_file"] = name
                  text = body.decode("utf-8", "replace")
                  meta["image_url_candidates"] = list(dict.fromkeys(re.findall(
                      r'https?://[^"\'<> ]+?\.(?:jpg|jpeg|png|webp)(?:\?[^"\'<> ]*)?',
                      text,
                      flags=re.I,
                  )))[:100]
              result["physical_copy_locators"][key] = meta

          saved_samples = [
              row["saved_file"]
              for row in result["xinyi_public_sample_images"]
              if row.get("saved_file")
          ]
          result["adjudication"] = {
              "xinyi_public_sample_image_count": len(saved_samples),
              "xinyi_sample_target_page_status":
                  "REQUIRES_DIRECT_HUMAN_VISUAL_REVIEW_OF_SAVED_IMAGES"
                  if saved_samples
                  else "NO_SAMPLE_IMAGE_RETRIEVED",
              "kongfz_access_policy":
                  "RECORD_REDIRECT_OR_PUBLIC_RESPONSE_ONLY_NO_LOGIN_OR_AUTHENTICATION",
              "physical_locator_target_page_status":
                  "NO_TARGET_PAGE_CLAIM_UNTIL_SAVED_PUBLIC_IMAGE_IS_DIRECTLY_REVIEWED",
              "hai_glyph_cross_edition_effect": "NONE_UNTIL_DIRECT_TARGET_PAGE",
              "algorithm_effect": "NONE",
          }
          (OUT / "physical-copy-locator-probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              "xinyi_product": {
                  k: result["xinyi_product"].get(k)
                  for k in ("ok", "status", "bytes", "sha256")
              },
              "sample_images": [
                  {
                      "index": i,
                      "status": row.get("status"),
                      "bytes": row.get("bytes"),
                      "saved_file": row.get("saved_file"),
                  }
                  for i, row in enumerate(result["xinyi_public_sample_images"])
              ],
              "locators": {
                  k: {
                      "status": v.get("status"),
                      "location": v.get("location"),
                      "bytes": v.get("bytes"),
                      "image_url_candidate_count": len(v.get("image_url_candidates", [])),
                  }
                  for k, v in result["physical_copy_locators"].items()
              },
          }, ensure_ascii=False, indent=2))

      - name: Upload physical-copy locator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-quanshu-physical-copy-locators
          path: probe/
          if-no-files-found: warn
          retention-days: 14
