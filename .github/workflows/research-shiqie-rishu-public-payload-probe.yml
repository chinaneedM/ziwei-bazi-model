name: research-shiqie-rishu-public-payload-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-rishu-public-payload-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve target binding from public HTML only
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.request
          from pathlib import Path
          url='https://www.shidianguji.com/zh/book/NA06425/chapter/1m44zy4jwa4ab'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ziwei-bazi-model historical-provenance-research/1.4','Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=30) as r: b=r.read(20_000_000)
          s=html.unescape(b.decode('utf-8','replace').replace('\\u002F','/').replace('\\u0026','&'))
          target='巳上是上四亥'
          positions=[m.start() for m in re.finditer(target,s)]
          rows=[]
          for i in positions:
              # Keep a deliberately tight window so nearest IDs refer to the target paragraph/page neighborhood.
              left=s[max(0,i-1800):i]
              right=s[i:min(len(s),i+2200)]
              ctx=left+right
              rows.append({
                  'target_index':i,
                  'page_ids_before':re.findall(r'(?:startPageId|endPageId|PageId)\\?"?\s*[:=]\s*\\?"(\d+)',left)[-6:],
                  'page_ids_after':re.findall(r'(?:startPageId|endPageId|PageId)\\?"?\s*[:=]\s*\\?"(\d+)',right)[:6],
                  'paragraph_ids_before':re.findall(r'paragraphId\\?"?\s*[:=]\s*\\?"(\d+)',left)[-4:],
                  'paragraph_ids_after':re.findall(r'paragraphId\\?"?\s*[:=]\s*\\?"(\d+)',right)[:4],
                  'context':ctx,
              })
          # Literal URLs in a tight union around target occurrences only.
          tight='\n'.join(r['context'] for r in rows)
          urls=[]
          for m in re.finditer(r'https?://[^"<>\\ ]{1,1800}',tight):
              u=m.group(0).replace('\\u0026','&').replace('&amp;','&').split('\\n')[0]
              if '/read/NA06425/' in u and u not in urls: urls.append(u)
          out={'schema':'SHIQIE-LISHU-RISHU-TARGET-BINDING-R2','source_url':url,'source_sha256':hashlib.sha256(b).hexdigest(),'target':target,'occurrences':rows,'tight_literal_urls':urls,'policy':'PUBLIC_HTML_ONLY; NO DOWNLOAD GUESSING; NO LOGIN; NO PRIVATE API; NO ACCESS BYPASS'}
          Path('shiqie-binding-r2.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'source_sha256':out['source_sha256'],'occurrence_count':len(rows),'bindings':[{k:v for k,v in r.items() if k!='context'} for r in rows],'tight_literal_urls':urls,'policy':out['policy']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-rishu-target-binding-r2
          path: shiqie-binding-r2.json
          if-no-files-found: error
