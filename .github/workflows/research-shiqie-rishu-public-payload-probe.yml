name: research-shiqie-rishu-public-payload-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-rishu-public-payload-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover literal catalog links around Shiqie title
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path
          url='https://guji99.com/blog/1083/6/'
          ua='Mozilla/5.0 ziwei-bazi-model historical-provenance-research/1.7'
          req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=25) as r:
              b=r.read(8_000_000); final=r.geturl(); status=r.status; ctype=r.headers.get('content-type')
          s=html.unescape(b.decode('utf-8','replace'))
          targets=['筮篋理数日抄','筮篋理數日抄','筮箧理数日抄']
          positions=[]
          for t in targets:
              positions += [(t,m.start()) for m in re.finditer(re.escape(t),s)]
          rows=[]
          all_links=[]
          for term,i in positions:
              ctx=s[max(0,i-5000):min(len(s),i+12000)]
              links=[]
              for lm in re.finditer(r'<a\b([^>]*)href=["\']([^"\']+)["\']([^>]*)>(.*?)</a>',ctx,re.I|re.S):
                  txt=re.sub(r'<[^>]+>',' ',lm.group(4)); txt=re.sub(r'\s+',' ',txt).strip()
                  u=urllib.parse.urljoin(final,lm.group(2))
                  rec={'text':txt[:400],'url':u}
                  if rec not in links: links.append(rec)
                  if rec not in all_links: all_links.append(rec)
              rows.append({'term':term,'index':i,'context_text':re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',ctx)).strip()[:8000],'links':links})
          relevant=[]
          for rec in all_links:
              if ('筮篋' in rec['text'] or '筮箧' in rec['text'] or 'digital.archives.go.jp' in rec['url'] or 'archives.go.jp' in rec['url']):
                  relevant.append(rec)
          out={'schema':'SHIQIE-CABINET-LIBRARY-CATALOG-LINK-DISCOVERY-R1','source_url':url,'status':status,'final_url':final,'content_type':ctype,'body_len':len(b),'sha256':hashlib.sha256(b).hexdigest(),'target_occurrences':rows,'relevant_literal_links':relevant,'policy':'ONLY PUBLIC CATALOG HTML AND LITERAL HREFS; NO ID/URL GUESSING; NO LOGIN; NO ACCESS BYPASS'}
          Path('shiqie-cabinet-catalog-links.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':status,'final_url':final,'body_len':len(b),'sha256':out['sha256'],'occurrence_count':len(rows),'relevant_literal_links':relevant,'policy':out['policy']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-cabinet-catalog-links
          path: shiqie-cabinet-catalog-links.json
          if-no-files-found: error
