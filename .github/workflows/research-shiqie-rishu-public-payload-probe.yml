name: research-shiqie-rishu-public-payload-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-rishu-public-payload-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public Shidian HTML payload only
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.request
          from pathlib import Path

          url='https://www.shidianguji.com/zh/book/NA06425/chapter/1m44zy4jwa4ab'
          ua='Mozilla/5.0 ziwei-bazi-model historical-provenance-research/1.2'
          req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=30) as r:
              b=r.read(20_000_000)
              meta={'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('content-type'),'body_len':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          s=b.decode('utf-8','replace')
          decoded=html.unescape(s.replace('\\u002F','/'))
          terms=['巳上是上四亥','以上是上四亥','巳上是上四刻','以上是上四刻','上四刻屬本日管','論子時隔界','夜子時初二刻']
          snippets={}
          for term in terms:
              arr=[]; start=0
              while True:
                  i=decoded.find(term,start)
                  if i<0: break
                  arr.append(decoded[max(0,i-4000):min(len(decoded),i+6000)])
                  start=i+len(term)
                  if len(arr)>=8: break
              snippets[term]=arr
          # Extract only IDs and URLs literally present around target terms in delivered public HTML.
          target_context='\n'.join(x for arr in snippets.values() for x in arr)
          page_ids=sorted(set(re.findall(r'(?:startPageId|endPageId|PageId)\\?"?\s*[:=]\s*\\?"(\d+)',target_context)))
          paragraph_ids=sorted(set(re.findall(r'paragraphId\\?"?\s*[:=]\s*\\?"(\d+)',target_context)))
          urls=[]
          for m in re.finditer(r'https?://[^"<>\\ ]{1,2000}',target_context):
              u=m.group(0).replace('\\u0026','&').replace('&amp;','&')
              if any(k in u.lower() for k in ['ancientlib','byteimg','cadal','page','image','img','scan']):
                  urls.append(u)
          book_meta={}
          for key in ['bookId','bookName','edition','editionDynastyName','totalPage','imageSource','imageSourceUrl']:
              vals=re.findall(r'\\?"'+re.escape(key)+r'\\?"\s*:\s*(?:\\?"([^"\\]*)\\?"|(\d+))',decoded)
              if vals:
                  book_meta[key]=vals[:10]
          out={
              'schema':'SHIQIE-LISHU-RISHU-SHIDIAN-PUBLIC-PAYLOAD-PROBE-R1',
              'url':url,
              'response':meta,
              'terms':{k:{'hit_count':len(v),'snippets':v[:3]} for k,v in snippets.items()},
              'target_context_page_ids':page_ids,
              'target_context_paragraph_ids':paragraph_ids,
              'target_context_literal_candidate_urls':sorted(set(urls))[:200],
              'book_meta_literal_matches':book_meta,
              'policy':'PUBLIC_HTML_PAYLOAD_ONLY; NO LOGIN; NO PRIVATE API GUESSING; NO CREDENTIALS; NO ACCESS BYPASS; TRANSCRIPTION IS NOT FINAL GLYPH AUTHORITY'
          }
          Path('shiqie-rishu-public-payload-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
              'schema':out['schema'],
              'response':meta,
              'hit_counts':{k:len(v) for k,v in snippets.items()},
              'page_ids':page_ids,
              'paragraph_ids':paragraph_ids,
              'candidate_urls':out['target_context_literal_candidate_urls'][:20],
              'book_meta':book_meta,
              'policy':out['policy']
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-rishu-public-payload-probe
          path: shiqie-rishu-public-payload-probe.json
          if-no-files-found: error
