name: research-shiqie-rishu-public-payload-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-rishu-public-payload-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact target page ID and fetch only literal images
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.request
          from pathlib import Path
          source='https://www.shidianguji.com/zh/book/NA06425/chapter/1m44zy4jwa4ab'
          ua='Mozilla/5.0 ziwei-bazi-model historical-provenance-research/1.5'
          def fetch(u,timeout=20):
              req=urllib.request.Request(u,headers={'User-Agent':ua,'Accept':'text/html,image/*,*/*'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(12_000_000), {'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('content-type')}
          b,_=fetch(source)
          s=html.unescape(b.decode('utf-8','replace').replace('\\u002F','/').replace('\\u0026','&'))
          page_ids=['7640563520069681192','7640563520069697576']
          rows=[]
          literal=[]
          for pid in page_ids:
              positions=[m.start() for m in re.finditer(pid,s)]
              entries=[]
              for i in positions:
                  ctx=s[max(0,i-3500):min(len(s),i+5000)]
                  urls=[]
                  for m in re.finditer(r'https?://[^"<>\\ ]{1,1800}',ctx):
                      u=m.group(0).replace('\\u0026','&').replace('&amp;','&').split('\\n')[0]
                      if '/read/NA06425/' in u and u not in urls: urls.append(u)
                      if '/read/NA06425/' in u and u not in literal: literal.append(u)
                  entries.append({'index':i,'urls':urls,'context':ctx})
              rows.append({'page_id':pid,'occurrence_count':len(positions),'entries':entries})
          Path('shiqie-exact-pages').mkdir(exist_ok=True)
          downloads=[]
          # Download only URLs literally co-located with one of the two public target-neighborhood page IDs.
          for n,u in enumerate(literal[:8]):
              try:
                  d,meta=fetch(u,12)
                  ctype=meta.get('content_type') or ''
                  if not ctype.startswith('image/'):
                      downloads.append({'url':u,'non_image':True,'bytes':len(d),**meta}); continue
                  ext='.png' if 'png' in ctype else '.webp'
                  p=Path('shiqie-exact-pages')/f'exact-{n:02d}{ext}'
                  p.write_bytes(d)
                  downloads.append({'url':u,'file':str(p),'bytes':len(d),'sha256':hashlib.sha256(d).hexdigest(),**meta})
              except Exception as e:
                  downloads.append({'url':u,'error':type(e).__name__+': '+str(e)})
          out={'schema':'SHIQIE-LISHU-RISHU-EXACT-TARGET-PAGE-PROBE-R1','source_url':source,'source_sha256':hashlib.sha256(b).hexdigest(),'page_id_rows':rows,'literal_urls':literal,'downloads':downloads,'policy':'PAGE IDS DERIVED FROM PUBLIC HTML TARGET BINDING; ONLY COLOCATED LITERAL URLS FETCHED; NO URL/ID GUESSING; NO LOGIN; NO PRIVATE API; NO ACCESS BYPASS'}
          Path('shiqie-exact-target-page.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'source_sha256':out['source_sha256'],'page_ids':[{'id':r['page_id'],'occurrences':r['occurrence_count'],'entry_urls':[e['urls'] for e in r['entries']]} for r in rows],'literal_urls':literal,'downloads':downloads,'policy':out['policy']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-rishu-exact-target-page
          path: |
            shiqie-exact-target-page.json
            shiqie-exact-pages/
          if-no-files-found: error
