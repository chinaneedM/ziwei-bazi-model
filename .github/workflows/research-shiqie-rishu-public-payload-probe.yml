name: research-shiqie-rishu-public-payload-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-rishu-public-payload-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover National Archives public search form
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path
          roots=['https://www.digital.archives.go.jp/','https://www.digital.archives.go.jp/index.html']
          ua='Mozilla/5.0 ziwei-bazi-model historical-provenance-research/1.6'
          results=[]
          for url in roots:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      b=r.read(5_000_000); final=r.geturl(); status=r.status; ctype=r.headers.get('content-type')
                  s=html.unescape(b.decode('utf-8','replace'))
                  forms=[]
                  for m in re.finditer(r'<form\b([^>]*)>(.*?)</form>',s,re.I|re.S):
                      attrs=m.group(1); body=m.group(2)
                      action_m=re.search(r'\baction=["\']([^"\']*)',attrs,re.I)
                      method_m=re.search(r'\bmethod=["\']([^"\']*)',attrs,re.I)
                      action=urllib.parse.urljoin(final,action_m.group(1) if action_m else final)
                      method=(method_m.group(1) if method_m else 'GET').upper()
                      inputs=[]
                      for im in re.finditer(r'<(?:input|select|textarea)\b([^>]*)>',body,re.I|re.S):
                          a=im.group(1)
                          def attr(n):
                              x=re.search(r'\b'+n+r'=["\']([^"\']*)',a,re.I); return x.group(1) if x else None
                          inputs.append({'name':attr('name'),'type':attr('type'),'value':attr('value'),'id':attr('id'),'placeholder':attr('placeholder')})
                      text=re.sub(r'<[^>]+>',' ',body)
                      text=re.sub(r'\s+',' ',text).strip()[:1500]
                      forms.append({'action':action,'method':method,'inputs':inputs,'visible_text':text})
                  links=[]
                  for lm in re.finditer(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',s,re.I|re.S):
                      text=re.sub(r'<[^>]+>',' ',lm.group(2)); text=re.sub(r'\s+',' ',text).strip()
                      if any(k in text.lower() for k in ['検索','search','横断','資料を探','キーワード']):
                          links.append({'text':text[:300],'url':urllib.parse.urljoin(final,lm.group(1))})
                  results.append({'requested_url':url,'status':status,'final_url':final,'content_type':ctype,'body_len':len(b),'sha256':hashlib.sha256(b).hexdigest(),'forms':forms,'search_like_links':links[:100]})
              except Exception as e:
                  results.append({'requested_url':url,'error':type(e).__name__+': '+str(e)})
          out={'schema':'NAJDA-PUBLIC-SEARCH-CONTRACT-DISCOVERY-R1','results':results,'policy':'ONLY PUBLIC ROOT PAGES FETCHED; SEARCH ENDPOINT/INPUTS MUST BE DISCOVERED FROM RETURNED HTML; NO ENDPOINT GUESSING; NO LOGIN; NO ACCESS BYPASS'}
          Path('najda-search-contract.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: najda-public-search-contract
          path: najda-search-contract.json
          if-no-files-found: error
