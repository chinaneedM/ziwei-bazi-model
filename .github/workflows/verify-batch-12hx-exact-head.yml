name: verify-batch-12hx-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hx-exact-head.yml
      - docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-SECOND-17CHAR-LINE-GBT-FORMAT-DEFECT-CLOSURE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-SECOND-17CHAR-LINE-GBT-FORMAT-DEFECT-CLOSURE-HX.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending HX status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tianwen/batch-12hx-exact-head',
              description: 'Batch 12HX exact-head verification running'
            })

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12HX exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-SECOND-17CHAR-LINE-GBT-FORMAT-DEFECT-CLOSURE-HX'
          e=json.loads(Path('docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-SECOND-17CHAR-LINE-GBT-FORMAT-DEFECT-CLOSURE-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          p=e['direct_physical_full_line_controls']
          assert p['direct_full_line_sample_count']==2
          assert p['distinct_pdf_pages']==[12,16]
          assert [x['count'] for x in p['independent_page_samples']]==[17,17]
          assert [x['direct_reading'] for x in p['independent_page_samples']]==['周禮有史官掌邦國四方之事達四方之志','策書成文考其真偽而志其典禮上以遵周']
          s=e['cataloging_standard_control']
          assert s['standard']=='GB/T 3792.7—2008'
          assert s['section']=='8.7.1.4(b)'
          assert s['direct_rule']=='每半叶行数按满半叶行数计算；每行字数按满行字数计算。'
          d=e['provenance_defect_repair']
          assert d['provenance_defect_id']=='PROV-DEFECT-016'
          assert d['defect_found_increment']==1
          assert d['defect_repaired_increment']==1
          assert d['provider_record_mutated'] is False
          assert d['raw_provider_value_preserved_for_audit'] is True
          assert d['adjudicated_full_line_value']=='10行17字，小字雙行23字，白口，左右雙邊。'

          matrix=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json').read_text(encoding='utf-8'))
          assert matrix['audit_summary']['confirmed_provenance_metadata_defect_count'] >= 16
          assert matrix['audit_summary']['repaired_provenance_metadata_defect_count'] >= 16
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,236,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count'] >= 16
          assert state['historical_audit']['repaired_provenance_metadata_defect_count'] >= 16

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-GBT3792-7-2008-GUJI-FULL-LINE-COUNT-RULE']['batch_12hx']['supports_full_line_semantics'] is True
          cur=src['EXT-NLC-META-ZUOZHUAN-UCS01003868188-CURRENT-SEARCH-20260927']['batch_12hx']
          assert cur['provenance_defect_id']=='PROV-DEFECT-016'
          assert cur['raw_provider_value_preserved'] is True
          assert cur['adjudicated_format_note']=='10行17字，小字雙行23字，白口，左右雙邊。'

          ac=e['accounting']
          assert ac['matrix_rows']==198
          assert ac['audited_rows']==166
          assert ac['current_missing_from_product_rows']==10
          assert ac['confirmed_provenance_metadata_defect_count']==16
          assert ac['repaired_provenance_metadata_defect_count']==16
          assert ac['confirmed_chart_algorithm_defect_count']==0
          assert ac['algorithm_reopen_count']==0
          assert ac['candidate_collapse_count']==0
          PY

      - name: Publish successful HX status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'tianwen/batch-12hx-exact-head',
              description: 'Batch 12HX PROV-DEFECT-016 gates PASS'
            })

      - name: Publish failed HX status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'tianwen/batch-12hx-exact-head',
              description: 'Batch 12HX exact-head verification FAILED'
            })

# exact-head refresh: HX
