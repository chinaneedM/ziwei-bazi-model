name: locate-airijinglu-cadal-1827-v1-v8

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/locate-airijinglu-cadal-1827-v1-v8.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Bind CADAL volumes and locate edition/target pages
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/airijinglu-cadal-v1-v8'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/v1/locator" "$ROOT/v1/hires" "$ROOT/v8/locator" "$ROOT/v8/hires"
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin poppler-utils tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-chi-tra-vert >/dev/null
          python -m pip install --quiet pillow

          V1='CADAL02091326 愛日精廬藏書志（一）.djvu'
          V8='CADAL02091333 愛日精廬藏書志（八）.djvu'
          U1='https://commons.wikimedia.org/wiki/Special:Redirect/file/CADAL02091326%20%E6%84%9B%E6%97%A5%E7%B2%BE%E5%BB%AC%E8%97%8F%E6%9B%B8%E5%BF%97%EF%BC%88%E4%B8%80%EF%BC%89.djvu'
          U8='https://commons.wikimedia.org/wiki/Special:Redirect/file/CADAL02091333%20%E6%84%9B%E6%97%A5%E7%B2%BE%E5%BB%AC%E8%97%8F%E6%9B%B8%E5%BF%97%EF%BC%88%E5%85%AB%EF%BC%89.djvu'

          curl -fL --retry 4 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$U1" -o "$ROOT/v1/source.djvu"
          curl -fL --retry 4 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$U8" -o "$ROOT/v8/source.djvu"
          sha256sum "$ROOT/v1/source.djvu" "$ROOT/v8/source.djvu" | tee "$ROOT/source-sha256.txt"
          djvused "$ROOT/v1/source.djvu" -e n | tee "$ROOT/v1/page-count.txt"
          djvused "$ROOT/v8/source.djvu" -e n | tee "$ROOT/v8/page-count.txt"

          ddjvu -format=pdf "$ROOT/v1/source.djvu" "$ROOT/v1/source.pdf"
          ddjvu -format=pdf "$ROOT/v8/source.djvu" "$ROOT/v8/source.pdf"
          pdfinfo "$ROOT/v1/source.pdf" > "$ROOT/v1/pdfinfo.txt"
          pdfinfo "$ROOT/v8/source.pdf" > "$ROOT/v8/pdfinfo.txt"

          pdftoppm -jpeg -r 125 "$ROOT/v1/source.pdf" "$ROOT/v1/locator/page" >/dev/null 2>&1
          pdftoppm -jpeg -r 125 "$ROOT/v8/source.pdf" "$ROOT/v8/locator/page" >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageEnhance
          import subprocess,re,json,hashlib
          root=Path('audit/airijinglu-cadal-v1-v8')

          def locate(tag, terms):
              d=root/tag
              hits=[]
              for p in sorted((d/'locator').glob('page-*.jpg'),key=lambda x:int(re.search(r'-(\d+)\.jpg$',x.name).group(1))):
                  n=int(re.search(r'-(\d+)\.jpg$',p.name).group(1))
                  im=Image.open(p).convert('L')
                  im=ImageOps.autocontrast(im)
                  im=ImageEnhance.Contrast(im).enhance(1.35)
                  tmp=d/'_ocr.png'; im.save(tmp)
                  proc=subprocess.run(['tesseract',str(tmp),'stdout','-l','chi_tra_vert','--psm','5'],
                                      stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
                  txt=proc.stdout.decode('utf-8','ignore')
                  compact=''.join(txt.split())
                  found=[t for t in terms if t in compact]
                  if found:
                      hits.append({'pdf_page':n,'found':found,'context':' '.join(txt.split())[:1800]})
              if (d/'_ocr.png').exists(): (d/'_ocr.png').unlink()
              return hits

          v1terms=['道光七年','丁亥','道光七年丁亥','愛日精廬藏書志序','張氏','昭文','藏書志序']
          v8terms=['準齋','准齋','几漏','九漏','孫逢古','孫逢吉','二十五箭','二十有五箭','黃氏','蕘翁']
          h1=locate('v1',v1terms)
          h8=locate('v8',v8terms)

          def render(tag,hits):
              d=root/tag
              pdf=d/'source.pdf'
              count=int((d/'page-count.txt').read_text().strip())
              cand=sorted(set(x['pdf_page'] for x in hits))
              # Preserve direct high-res page evidence for all hits and one neighbor each side.
              pages=set()
              for n in cand:
                  pages.update(range(max(1,n-1),min(count,n+1)+1))
              manifest=[]
              for n in sorted(pages):
                  subprocess.run(['pdftoppm','-f',str(n),'-l',str(n),'-singlefile','-png','-r','300',
                                  str(pdf),str(d/'hires'/f'page-{n}')],check=True,
                                 stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  p=d/'hires'/f'page-{n}.png'
                  im=Image.open(p)
                  manifest.append({'pdf_page':n,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                                   'width':im.width,'height':im.height,'file':str(p.relative_to(root))})
              return cand,manifest

          c1,m1=render('v1',h1)
          c8,m8=render('v8',h8)
          report={
            'schema':'AIRIJINGLU-CADAL-V1-V8-EDITION-TARGET-LOCATOR-R1',
            'source_set':'Peking University Library / CADAL scan mirrored on Wikimedia Commons',
            'v1':{
              'id':'CADAL02091326','source_file':'愛日精廬藏書志（一）.djvu',
              'source_sha256':hashlib.sha256((root/'v1/source.djvu').read_bytes()).hexdigest(),
              'page_count':int((root/'v1/page-count.txt').read_text().strip()),
              'ocr_hits':h1,'candidate_pages':c1,'hires_manifest':m1
            },
            'v8':{
              'id':'CADAL02091333','source_file':'愛日精廬藏書志（八）.djvu',
              'source_sha256':hashlib.sha256((root/'v8/source.djvu').read_bytes()).hexdigest(),
              'page_count':int((root/'v8/page-count.txt').read_text().strip()),
              'ocr_hits':h8,'candidate_pages':c8,'hires_manifest':m8
            },
            'ocr_role':'LOCATOR_ONLY_NOT_FINAL_GLYPH_AUTHORITY',
            'final_authority':'DIRECT_300DPI_SOURCE_BOUND_PAGE_IMAGES'
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          PY

          rm "$ROOT/v1/source.djvu" "$ROOT/v1/source.pdf" "$ROOT/v8/source.djvu" "$ROOT/v8/source.pdf"
          rm -f "$ROOT"/v1/locator/*.jpg "$ROOT"/v8/locator/*.jpg

      - name: Upload edition and target locator
        uses: actions/upload-artifact@v4
        with:
          name: airijinglu-cadal-v1-v8-r1
          path: audit/airijinglu-cadal-v1-v8
          if-no-files-found: error
          retention-days: 30
