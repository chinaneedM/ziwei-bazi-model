name: research-zhangguo-fudan-bb-general-catalog-contract-probe

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-zhangguo-fudan-bb-general-catalog-contract-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enumerate source-emitted Fudan catalog chunks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          ROOT = 'https://guji.fudan.edu.cn/'
          OUT = Path('docs/research/ZIWEI-ZHANGGUO-FUDAN-GENERAL-CATALOG-CONTRACT-PROBE-R1.json')
          TOKENS = [
              '線裝', '线装', '館藏', '馆藏', '古籍書目', '古籍书目',
              '古籍目錄', '古籍目录', '再造善本', '善本', 'guancang',
              'xianzhuang', 'catalog', 'gujishumu', 'guji', 'search',
          ]
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 provenance-research/1.0'})

          def get(url, timeout=25, cap=8_000_000):
              rec = {'url': url}
              try:
                  r = session.get(url, timeout=timeout, allow_redirects=True)
                  body = r.content[:cap]
                  rec.update({
                      'status': r.status_code,
                      'final_url': r.url,
                      'content_type': r.headers.get('content-type'),
                      'bytes_captured': len(body),
                      'sha256_captured': hashlib.sha256(body).hexdigest(),
                  })
                  return rec, body, r.encoding or 'utf-8'
              except Exception as exc:
                  rec.update({'error_type': type(exc).__name__, 'error': repr(exc)})
                  return rec, b'', 'utf-8'

          def text_of(body, enc):
              try:
                  return body.decode(enc or 'utf-8', errors='replace')
              except LookupError:
                  return body.decode('utf-8', errors='replace')

          def add_contexts(out, text, surface, token, radius=700, limit=20):
              low = text.lower()
              needle = token.lower()
              start = 0
              count = 0
              while count < limit:
                  i = low.find(needle, start)
                  if i < 0:
                      break
                  out.append({
                      'surface': surface,
                      'token': token,
                      'offset': i,
                      'context': text[max(0, i-radius):min(len(text), i+len(token)+radius)],
                  })
                  start = i + max(1, len(token))
                  count += 1

          root_meta, root_body, root_enc = get(ROOT)
          root_text = text_of(root_body, root_enc)
          soup = BeautifulSoup(root_text, 'html.parser')
          seeds = []
          for tag in soup.find_all('script'):
              src = tag.get('src')
              if src:
                  seeds.append(urljoin(root_meta.get('final_url') or ROOT, src))
          seeds = list(dict.fromkeys(seeds))

          fetched = {}
          queue = list(seeds)
          contexts = []
          endpoint_literals = []
          external_links = []
          max_scripts = 80

          # Breadth-first fetch of JS resources that are literally emitted by already fetched
          # first-party JS. This follows the public SPA dependency graph; it never guesses chunk IDs.
          while queue and len(fetched) < max_scripts:
              url = queue.pop(0)
              if url in fetched:
                  continue
              if urlparse(url).hostname != 'guji.fudan.edu.cn':
                  continue
              meta, body, enc = get(url, timeout=20, cap=8_000_000)
              fetched[url] = meta
              if not body or meta.get('status') != 200:
                  continue
              text = text_of(body, enc)
              for tok in TOKENS:
                  if tok.lower() in text.lower():
                      add_contexts(contexts, text, url, tok)

              # Endpoint and public-link literals already embedded in site code.
              for m in re.finditer(r'''[\"']([^\"'\\]{1,600})[\"']''', text):
                  lit = m.group(1)
                  low = lit.lower()
                  if '/guji/' in low or 'gujisearch' in low or 'guji' in low and '/' in lit:
                      endpoint_literals.append({'surface': url, 'literal': lit})
                  if lit.startswith('http://') or lit.startswith('https://'):
                      external_links.append({'surface': url, 'url': lit})

              # Vite dependency strings can occur either as ./chunk.js, assets/chunk.js,
              # or bare chunk filenames inside __vite__mapDeps arrays.
              candidates = set()
              for pat in [
                  r'''[\"'](\./[^\"']+\.js)[\"']''',
                  r'''[\"'](/assets/[^\"']+\.js)[\"']''',
                  r'''[\"'](assets/[^\"']+\.js)[\"']''',
                  r'''[\"']([A-Za-z0-9_.-]+-[A-Za-z0-9_-]+\.js)[\"']''',
              ]:
                  candidates.update(re.findall(pat, text))
              for c in sorted(candidates):
                  if c.startswith('./'):
                      u = urljoin(url, c)
                  elif c.startswith('/'):
                      u = urljoin(ROOT, c)
                  elif c.startswith('assets/'):
                      u = urljoin(ROOT, c)
                  else:
                      u = urljoin(ROOT, 'assets/' + c)
                  if urlparse(u).hostname == 'guji.fudan.edu.cn' and u not in fetched and u not in queue:
                      queue.append(u)

          # Deduplicate compactly while preserving first source attribution.
          def uniq(records, key):
              seen = set(); out = []
              for rec in records:
                  k = rec[key]
                  if k in seen: continue
                  seen.add(k); out.append(rec)
              return out

          endpoint_literals = uniq(endpoint_literals, 'literal')
          external_links = uniq(external_links, 'url')

          report = {
              'schema': 'ZIWEI-ZHANGGUO-FUDAN-GENERAL-CATALOG-CONTRACT-PROBE-R1',
              'batch_intent': 'BATCH-12BB-GENERAL-CATALOG-DISCOVERY',
              'root': root_meta,
              'policy': {
                  'source_emitted_dependency_graph_only': True,
                  'hidden_chunk_or_object_id_guessing': False,
                  'endpoint_invocation_in_this_probe': False,
                  'authentication_attempted': False,
                  'negative_holding_claim_authorized': False,
              },
              'seed_scripts': seeds,
              'fetched_scripts': list(fetched.values()),
              'scope_contexts': contexts,
              'endpoint_literals': endpoint_literals,
              'public_external_links': external_links,
              'adjudication': {
                  'scripts_fetched': len(fetched),
                  'scope_context_count': len(contexts),
                  'endpoint_literal_count': len(endpoint_literals),
                  'general_linebound_catalog_contract_bound': False,
                  'target_item_bound': False,
                  'witness_increment': 0,
              },
          }
          OUT.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({
              'scripts_fetched': len(fetched),
              'contexts': len(contexts),
              'endpoint_literals': [x['literal'] for x in endpoint_literals[:80]],
              'external_links': [x['url'] for x in external_links[:40]],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Commit general catalog contract evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/ZIWEI-ZHANGGUO-FUDAN-GENERAL-CATALOG-CONTRACT-PROBE-R1.json
          git commit -m "record Batch 12BB Fudan general catalog contract"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
