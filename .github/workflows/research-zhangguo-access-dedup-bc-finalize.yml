name: research-zhangguo-access-dedup-bc-finalize

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-zhangguo-access-dedup-bc-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Batch 12BC semantic closure
        run: python .github/scripts/finalize-zhangguo-access-dedup-bc.py
      - name: Register Batch 12BC in continuity verifier
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/verify-project-continuity-state-r1.py')
          text = p.read_text(encoding='utf-8')
          bb = '    "BATCH-12-ZIWEI-ZHANGGUO-FUDAN-MING-WANLI-HOLDING-RECONCILIATION-BB",\n]'
          bc = '    "BATCH-12-ZIWEI-ZHANGGUO-FUDAN-MING-WANLI-HOLDING-RECONCILIATION-BB",\n    "BATCH-12-ZIWEI-ZHANGGUO-TOHOKU-NACSIS-FUDAN-ACCESS-DEDUP-BC",\n]'
          if bb not in text:
              raise SystemExit('supplemental batch tail anchor missing')
          text = text.replace(bb, bc, 1)
          old_doc = 'LATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-ZHANGGUO-FUDAN-MING-WANLI-HOLDING-RECONCILIATION-BB.md"'
          new_doc = 'LATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-ZHANGGUO-TOHOKU-NACSIS-FUDAN-ACCESS-DEDUP-BC.md"'
          if old_doc not in text:
              raise SystemExit('latest batch doc anchor missing')
          text = text.replace(old_doc, new_doc, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify prepared state
        run: |
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python scripts/verify-project-continuity-state-r1.py
          git diff --check
      - name: Remove one-shot Batch 12BC machinery
        run: |
          git rm -f \
            .github/workflows/research-zhangguo-access-dedup-bc-finalize.yml \
            .github/scripts/finalize-zhangguo-access-dedup-bc.py
      - name: Verify and commit semantic closure
        run: |
          set -euo pipefail
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python scripts/verify-project-continuity-state-r1.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "close Batch 12BC Tohoku NACSIS and Fudan access dedup"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
