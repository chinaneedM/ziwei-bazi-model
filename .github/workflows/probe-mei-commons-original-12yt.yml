name: probe-mei-commons-original-12yt
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-mei-commons-original-12yt.py
      - .github/workflows/probe-mei-commons-original-12yt.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install unmodified DjVu decoding and image contact sheet library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install 'Pillow>=10,<12'
      - name: Check exact Commons metadata and fetch original only if bytes match
        run: python scripts/probe-mei-commons-original-12yt.py
      - name: Preserve bytes metadata and native-image atlas, if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-v3-v4-12yt-commons-original-and-atlas
          path: research-12yt-mei-commons/
          retention-days: 20
          if-no-files-found: warn
