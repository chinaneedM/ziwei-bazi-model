name: research-zjlib-1783-tieqin-direct-pdf

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-zjlib-1783-tieqin-direct-pdf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe Zhejiang Library official article PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/render
          landing='https://bjb.zjlib.cn/CN/Y2024/V0/I7/46'
          lexeme='https://bjb.zjlib.cn/CN/lexeme/showArticleByLexeme.do?articleID=1783'
          article='https://bjb.zjlib.cn/CN/article/downloadArticleFile.do?attachType=PDF&id=1783'
          article_alt='https://bjb.zjlib.cn/CN/article/downloadArticleFile.do?attachType=PDF&articleID=1783'
          article_cn_pdf='https://bjb.zjlib.cn/CN/PDF/1783'
          fullissue='https://bjb.zjlib.cn/CN/article/downloadArticleFile.do?attachType=PDF&id=1785'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36'

          set +e
          curl -L --compressed --retry 1 -A "$ua" -c out/cookies.txt -b out/cookies.txt -D out/landing.headers -o out/landing.html -w 'http_code=%{http_code}\\ncontent_type=%{content_type}\\nurl_effective=%{url_effective}\\nsize_download=%{size_download}\\n' "$landing" > out/landing.meta
          echo "curl_rc=$?" >> out/landing.meta
          curl -L --compressed --retry 1 -A "$ua" -c out/cookies.txt -b out/cookies.txt -D out/lexeme.headers -o out/lexeme.html -w 'http_code=%{http_code}\\ncontent_type=%{content_type}\\nurl_effective=%{url_effective}\\nsize_download=%{size_download}\\n' "$lexeme" > out/lexeme.meta
          echo "curl_rc=$?" >> out/lexeme.meta
          set -e
          set +e
          curl -L --compressed -A "$ua" -c out/cookies.txt -b out/cookies.txt -D out/download_cn.headers -o out/download_cn.js -w 'http_code=%{http_code}\\ncontent_type=%{content_type}\\nurl_effective=%{url_effective}\\nsize_download=%{size_download}\\n' 'https://bjb.zjlib.cn/develop/static/common/js/download_cn.js' > out/download_cn.meta
          echo "curl_rc=$?" >> out/download_cn.meta
          set -e
          {
            echo "landing=$landing"
            echo "lexeme=$lexeme"
            echo "article_candidate=$article"
            echo "article_alt_candidate=$article_alt"
            echo "article_cn_pdf_candidate=$article_cn_pdf"
            echo "fullissue_candidate=$fullissue"
            echo "--- landing emitted PDF/download fragments ---"
            grep -Eo 'href="[^"]*(PDF|pdf|downloadArticleFile)[^"]*"' out/landing.html | head -100 || true
            echo "--- lexeme emitted PDF/download fragments ---"
            grep -Eo 'href="[^"]*(PDF|pdf|downloadArticleFile)[^"]*"' out/lexeme.html | head -100 || true
            echo "--- lexeme all route/token clues ---"
            grep -niE 'pdf|download|attach|1783|csrf|token|file|fulltext|articleID|onclick' out/lexeme.html | head -300 || true
            echo "--- download_cn.js route clues ---"
            grep -niE 'pdf|download|attach|article|file|href|location|ajax|post|get|csrf|token' out/download_cn.js | head -400 || true
          } > out/routes.txt

          fetch_pdf () {
            local name="$1" url="$2"
            local headers="out/${name}.headers"
            local body="out/${name}.bin"
            local meta="out/${name}.meta"
            set +e
            curl -L --compressed -A "$ua" -e "$lexeme" -c out/cookies.txt -b out/cookies.txt -D "$headers" -o "$body" \
              -w 'http_code=%{http_code}\ncontent_type=%{content_type}\nurl_effective=%{url_effective}\nsize_download=%{size_download}\n' \
              "$url" > "$meta"
            local rc=$?
            set -e
            echo "curl_rc=$rc" >> "$meta"
            echo "bytes=$(wc -c < "$body" 2>/dev/null || echo 0)" >> "$meta"
            echo "sha256=$(sha256sum "$body" 2>/dev/null | awk '{print $1}' || true)" >> "$meta"
            echo "magic=$(xxd -l 8 -p "$body" 2>/dev/null || true)" >> "$meta"
          }

          # Official front-end preflight. Query only; never invoke shopping/payment endpoints.
          for attach in PDF_CN PDF PDF_Mobile; do
            safe=$(echo "$attach" | tr '[:upper:]' '[:lower:]')
            ts=$(date +%s%3N)
            set +e
            curl -L --compressed -A "$ua" -e "$lexeme" -c out/cookies.txt -b out/cookies.txt \
              -D "out/show_${safe}.headers" -o "out/show_${safe}.txt" \
              -w 'http_code=%{http_code}\\ncontent_type=%{content_type}\\nurl_effective=%{url_effective}\\nsize_download=%{size_download}\\n' \
              -X POST --data-urlencode "attachType=$attach" --data-urlencode 'id=1783' --data-urlencode 'json=true' \
              "https://bjb.zjlib.cn/CN/article/showArticleFile.do?$ts" > "out/show_${safe}.meta"
            echo "curl_rc=$?" >> "out/show_${safe}.meta"
            set -e
          done

          preflight_status=$(sed -n 's/.*"status":\([0-9][0-9]*\).*/\1/p' out/show_pdf_cn.txt | head -1)
          token_pdf_cn_url=$(sed -n 's/.*"pdfCnUrl":"\([^"]*\)".*/\1/p' out/show_pdf_cn.txt | head -1)
          {
            echo "preflight_pdf_cn_status=$preflight_status"
            if [ -n "$token_pdf_cn_url" ]; then
              echo "token_pdf_cn_route_present=true"
            else
              echo "token_pdf_cn_route_present=false"
            fi
          } > out/token-route.meta
          if [ "$preflight_status" = "1" ] && [ -n "$token_pdf_cn_url" ]; then
            fetch_pdf token_pdf_cn "$token_pdf_cn_url"
            set +e
            curl -L --compressed -A "$ua" -e "$lexeme" -c out/cookies.txt -b out/cookies.txt \
              -X POST -D out/token_pdf_cn_post.headers -o out/token_pdf_cn_post.bin \
              -w 'http_code=%{http_code}\ncontent_type=%{content_type}\nurl_effective=%{url_effective}\nsize_download=%{size_download}\n' \
              "$token_pdf_cn_url" > out/token_pdf_cn_post.meta
            post_rc=$?
            set -e
            echo "curl_rc=$post_rc" >> out/token_pdf_cn_post.meta
            echo "bytes=$(wc -c < out/token_pdf_cn_post.bin 2>/dev/null || echo 0)" >> out/token_pdf_cn_post.meta
            echo "sha256=$(sha256sum out/token_pdf_cn_post.bin 2>/dev/null | awk '{print $1}' || true)" >> out/token_pdf_cn_post.meta
            echo "magic=$(xxd -l 8 -p out/token_pdf_cn_post.bin 2>/dev/null || true)" >> out/token_pdf_cn_post.meta
          else
            echo "tokenized PDF fetch skipped: preflight status is not 1 or route missing" >> out/token-route.meta
          fi

          fetch_pdf article "$article"
          fetch_pdf article_alt "$article_alt"
          fetch_pdf article_cn_pdf "$article_cn_pdf"
          fetch_pdf fullissue "$fullissue"

          selected=''
          for candidate in token_pdf_cn_post token_pdf_cn article article_alt article_cn_pdf fullissue; do
            if [ -f "out/${candidate}.bin" ] && head -c 5 "out/${candidate}.bin" | grep -q '%PDF-'; then
              selected="out/${candidate}.bin"
              break
            fi
          done
          echo "selected_pdf=$selected" >> out/routes.txt

          if [ -n "$selected" ]; then
            cp "$selected" /tmp/source.pdf
            pdfinfo /tmp/source.pdf > out/pdfinfo.txt || true
            pdftotext -layout /tmp/source.pdf out/source.txt
            {
              echo "=== target lines ==="
              grep -nE '铁琴铜剑楼|鄭振鐸|郑振铎|瞿濟蒼|瞿济苍|瞿鳳起|瞿凤起|瞿旭初|趙萬里|赵万里|北京图书馆馆史资料汇编|446|449|春秋左傳|春秋左传|銅壺漏箭|铜壶漏箭|準齋|准斋|3482|3483|03482|03483|半卖半送|捐献|捐贈|捐赠|1950|1953' out/source.txt || true
              echo "=== bibliography-ish lines ==="
              grep -nE '\[[0-9]+\]|参考文献|參考文獻|北京图书馆出版社|冀淑英|年谱|年譜|馆史|館史' out/source.txt || true
            } > out/target-lines.txt

            pages=$(pdfinfo /tmp/source.pdf | awk '/^Pages:/ {print $2}')
            if [ -n "$pages" ] && [ "$pages" -le 15 ]; then
              pdftoppm -png -r 140 /tmp/source.pdf out/render/page >/dev/null 2>&1
            else
              # For a whole-issue PDF, article begins at printed p46; render a broad likely window after using text page mapping.
              python - <<'PY'
          from pathlib import Path
          text=Path('out/source.txt').read_text(encoding='utf-8',errors='replace')
          pages=text.split('\f')
          hits=[]
          for i,p in enumerate(pages,1):
              if '郑振铎与铁琴铜剑楼藏书捐献' in p or '鄭振鐸與鐵琴銅劍樓藏書捐獻' in p:
                  hits.append(i)
          Path('out/text-page-hits.txt').write_text('\n'.join(map(str,hits))+'\n',encoding='utf-8')
          print('text_page_hits',hits)
          PY
              first=$(head -1 out/text-page-hits.txt 2>/dev/null || true)
              if [ -n "$first" ]; then
                last=$((first+8))
                if [ "$last" -gt "$pages" ]; then last="$pages"; fi
                pdftoppm -png -r 140 -f "$first" -l "$last" /tmp/source.pdf out/render/page >/dev/null 2>&1
              fi
            fi
          fi

      - name: Summarize probe
        run: |
          for f in out/landing.meta out/lexeme.meta out/download_cn.meta out/token-route.meta out/token_pdf_cn.meta out/token_pdf_cn_post.meta out/article.meta out/article_alt.meta out/article_cn_pdf.meta out/fullissue.meta; do
            echo "--- $f ---"
            cat "$f" || true
          done
          echo '--- showArticleFile responses ---'
          for f in out/show_*.meta out/show_*.txt; do
            echo "--- $f ---"
            cat "$f" || true
          done
          echo '--- routes ---'
          cat out/routes.txt || true
          echo '--- download_cn.js ---'
          sed -n '1,360p' out/download_cn.js || true
          echo '--- article HTML response preview ---'
          if [ -f out/article.bin ]; then sed -n '1,160p' out/article.bin || true; fi
          echo '--- /CN/PDF/1783 response preview ---'
          if [ -f out/article_cn_pdf.bin ]; then sed -n '1,160p' out/article_cn_pdf.bin || true; fi
          echo '--- pdfinfo ---'
          cat out/pdfinfo.txt || true
          echo '--- target lines ---'
          cat out/target-lines.txt || true

      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: zjlib-1783-tieqin-direct-pdf-probe
          path: |
            out/*.meta
            out/*.headers
            out/download_cn.js
            out/show_*.txt
            out/routes.txt
            out/pdfinfo.txt
            out/source.txt
            out/target-lines.txt
            out/text-page-hits.txt
            out/render/*.png
          if-no-files-found: warn
          retention-days: 30
