name: research-toyo-vii3-157-detail-route

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-toyo-vii3-157-detail-route.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Probe exact first-party detail controls
        shell: python
        run: |
          import hashlib, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          OUT = Path("toyo-vii3-157")
          OUT.mkdir(exist_ok=True)
          search_url = (
              "https://www.toyo-bunko.org/open/KansekiQueryResult10.php"
              "?ORDERBY1=&UNIT=200&andor=&iPage=375&iTotal=80868"
              "&navizonestart=38&searchtype=&sw1="
          )
          sess = requests.Session()
          sess.headers.update({"User-Agent": "Mozilla/5.0 provenance-research/1.0"})
          r = sess.get(search_url, timeout=30)
          r.raise_for_status()
          raw = r.content
          (OUT / "search.html").write_bytes(raw)
          html = r.text
          soup = BeautifulSoup(html, "html.parser")

          targets = []
          for tr in soup.find_all("tr"):
              text = " ".join(tr.stripped_strings)
              if "VII-3-157" not in text or "紫微斗數全集" not in text:
                  continue
              target = {
                  "row_text": text,
                  "forms": [],
                  "links": [],
                  "buttons": [],
              }
              for a in tr.find_all("a"):
                  target["links"].append({
                      "text": " ".join(a.stripped_strings),
                      "href": a.get("href"),
                      "onclick": a.get("onclick"),
                  })
              for b in tr.find_all(["input", "button"]):
                  target["buttons"].append({
                      "tag": b.name,
                      "type": b.get("type"),
                      "name": b.get("name"),
                      "value": b.get("value"),
                      "onclick": b.get("onclick"),
                  })
              for form in tr.find_all("form"):
                  fields = []
                  for x in form.find_all(["input", "button", "select"]):
                      fields.append({
                          "tag": x.name,
                          "type": x.get("type"),
                          "name": x.get("name"),
                          "value": x.get("value"),
                          "onclick": x.get("onclick"),
                      })
                  target["forms"].append({
                      "action": form.get("action"),
                      "method": form.get("method", "get"),
                      "fields": fields,
                  })
              targets.append(target)

          # Capture target-title neighborhoods and relevant script functions without
          # synthesizing any URL.
          neighborhoods = []
          for needle in [
              "新刊希夷陳先生紫微斗數全集不分卷",
              "新刊希夷陳先生紫微斗數全集",
              "VII-3-157",
          ]:
              for m in re.finditer(re.escape(needle), html):
                  neighborhoods.append({
                      "needle": needle,
                      "start": max(0, m.start() - 3500),
                      "end": min(len(html), m.end() + 3500),
                      "html": html[max(0, m.start() - 3500):min(len(html), m.end() + 3500)],
                  })

          scripts = []
          for s in soup.find_all("script"):
              t = s.get_text("\n", strip=False)
              if any(k in t for k in ["Kanseki", "Detail", "detail", "window.open", "submit"]):
                  scripts.append(t)

          result = {
              "search_url": search_url,
              "status": r.status_code,
              "final_url": r.url,
              "search_sha256": hashlib.sha256(raw).hexdigest(),
              "target_rows": targets,
              "target_neighborhoods": neighborhoods,
              "relevant_scripts": scripts,
              "followed_routes": [],
              "guardrails": {
                  "login_attempted": False,
                  "captcha_bypass_attempted": False,
                  "guessed_detail_url": False,
                  "enumerated_object_ids": False,
              },
          }

          # Follow only literal public URLs emitted by the target row or literal
          # window.open/location URLs in that row. No parameter guessing.
          literal_routes = []
          for t in targets:
              for a in t["links"]:
                  for value in (a.get("href"), a.get("onclick")):
                      if not value:
                          continue
                      if value.startswith(("http://", "https://", "/", "./", "../")):
                          literal_routes.append(value)
                      for pat in [
                          r"""window\.open\(['\"]([^'\"]+)""",
                          r"""location(?:\.href)?\s*=\s*['\"]([^'\"]+)""",
                      ]:
                          mm = re.search(pat, value)
                          if mm:
                              literal_routes.append(mm.group(1))
              for b in t["buttons"]:
                  value = b.get("onclick")
                  if not value:
                      continue
                  for pat in [
                      r"""window\.open\(['\"]([^'\"]+)""",
                      r"""location(?:\.href)?\s*=\s*['\"]([^'\"]+)""",
                  ]:
                      mm = re.search(pat, value)
                      if mm:
                          literal_routes.append(mm.group(1))

          seen = set()
          for route in literal_routes:
              if route in ("#", "javascript:void(0)") or route.lower().startswith("javascript:"):
                  continue
              u = urljoin(r.url, route)
              if u in seen or not u.startswith(("https://www.toyo-bunko.org/", "http://www.toyo-bunko.org/")):
                  continue
              seen.add(u)
              try:
                  rr = sess.get(u, timeout=30, allow_redirects=True)
                  body = rr.content
                  idx = len(result["followed_routes"])
                  (OUT / f"route-{idx:02d}.html").write_bytes(body)
                  result["followed_routes"].append({
                      "requested_url": u,
                      "status": rr.status_code,
                      "final_url": rr.url,
                      "content_type": rr.headers.get("content-type"),
                      "bytes": len(body),
                      "sha256": hashlib.sha256(body).hexdigest(),
                      "title": BeautifulSoup(rr.text, "html.parser").title.string.strip()
                          if BeautifulSoup(rr.text, "html.parser").title and BeautifulSoup(rr.text, "html.parser").title.string
                          else None,
                      "contains_target_title": "紫微斗數全集" in rr.text,
                      "contains_five_xiong_shen": "五凶神" in rr.text,
                  })
              except Exception as e:
                  result["followed_routes"].append({
                      "requested_url": u,
                      "error": type(e).__name__ + ": " + str(e),
                  })

          # Submit only the exact POST forms emitted by the two target rows.
          # targetid values and action are copied from current first-party HTML,
          # never guessed or enumerated.
          detail_responses = []
          for row_index, t in enumerate(targets):
              for form_index, form in enumerate(t["forms"]):
                  action = form.get("action")
                  method = (form.get("method") or "get").lower()
                  if not action or method != "post":
                      continue
                  payload = {}
                  for fld in form.get("fields", []):
                      if fld.get("name") and fld.get("value") is not None:
                          payload[fld["name"]] = fld["value"]
                  if "targetid" not in payload:
                      continue
                  u = urljoin(r.url, action)
                  if not u.startswith(("https://www.toyo-bunko.org/", "http://www.toyo-bunko.org/")):
                      continue
                  try:
                      rr = sess.post(u, data=payload, timeout=30, allow_redirects=True,
                                     headers={"Referer": r.url})
                      body = rr.content
                      fn = OUT / f"detail-row{row_index:02d}-target{payload['targetid']}.html"
                      fn.write_bytes(body)
                      ds = BeautifulSoup(rr.text, "html.parser")
                      detail = {
                          "row_index": row_index,
                          "form_index": form_index,
                          "action_emitted_by_source": action,
                          "method": method,
                          "payload": payload,
                          "requested_url": u,
                          "status": rr.status_code,
                          "final_url": rr.url,
                          "content_type": rr.headers.get("content-type"),
                          "bytes": len(body),
                          "sha256": hashlib.sha256(body).hexdigest(),
                          "title": ds.title.string.strip() if ds.title and ds.title.string else None,
                          "text": " ".join(ds.stripped_strings),
                          "links": [
                              {
                                  "text": " ".join(a.stripped_strings),
                                  "href": a.get("href"),
                                  "onclick": a.get("onclick"),
                              }
                              for a in ds.find_all("a")
                          ],
                          "forms": [
                              {
                                  "action": fm.get("action"),
                                  "method": fm.get("method", "get"),
                                  "fields": [
                                      {
                                          "tag": x.name,
                                          "type": x.get("type"),
                                          "name": x.get("name"),
                                          "value": x.get("value"),
                                          "onclick": x.get("onclick"),
                                      }
                                      for x in fm.find_all(["input", "button", "select"])
                                  ],
                              }
                              for fm in ds.find_all("form")
                          ],
                          "contains_five_xiong_shen": "五凶神" in rr.text,
                          "contains_hai": "亥" in rr.text,
                          "contains_rare_marker": ("貴重書" in rr.text or "貴" in " ".join(ds.stripped_strings)),
                          "contains_jinling_yixuan": "金陵益軒" in rr.text,
                          "contains_1942": ("1942" in rr.text or "昭和17" in rr.text),
                      }
                      detail_responses.append(detail)
                  except Exception as e:
                      detail_responses.append({
                          "row_index": row_index,
                          "form_index": form_index,
                          "action_emitted_by_source": action,
                          "method": method,
                          "payload": payload,
                          "error": type(e).__name__ + ": " + str(e),
                      })
          result["detail_responses"] = detail_responses

          # Snapshot current first-party access rules and the directly cited
          # NCKU scholarly PDF so the Batch 12R provenance tension is reproducible.
          policy_urls = {
              "current_all_reading_reservation_notice": "https://toyo-bunko.or.jp/information/2388/",
              "reservation_form": "https://toyo-bunko.or.jp/library/guidelines/reservation/",
              "rare_book_scope": "https://toyo-bunko.or.jp/library/guidelines/kichousho/",
              "current_suspended_materials": "https://toyo-bunko.or.jp/library/guidelines/prohibition/",
          }
          policy_snapshots = {}
          for key, u in policy_urls.items():
              try:
                  pr = sess.get(u, timeout=30, allow_redirects=True)
                  body = pr.content
                  (OUT / f"policy-{key}.html").write_bytes(body)
                  ps = BeautifulSoup(pr.text, "html.parser")
                  txt = " ".join(ps.stripped_strings)
                  policy_snapshots[key] = {
                      "url": u,
                      "status": pr.status_code,
                      "final_url": pr.url,
                      "bytes": len(body),
                      "sha256": hashlib.sha256(body).hexdigest(),
                      "text": txt,
                      "contains_vii_3_157": ("VII-3-157" in txt or "Ⅶ-3-157" in txt),
                  }
              except Exception as e:
                  policy_snapshots[key] = {"url": u, "error": type(e).__name__ + ": " + str(e)}
          result["policy_snapshots"] = policy_snapshots

          ncku_url = "https://chinese.ncku.edu.tw/var/file/142/1142/img/4253/7502.pdf"
          ncku = {"url": ncku_url, "ocr_used": False}
          try:
              nr = sess.get(ncku_url, timeout=60, allow_redirects=True)
              pdf = nr.content
              (OUT / "ncku-chen-2021.pdf").write_bytes(pdf)
              ncku.update({
                  "status": nr.status_code,
                  "final_url": nr.url,
                  "content_type": nr.headers.get("content-type"),
                  "bytes": len(pdf),
                  "sha256": hashlib.sha256(pdf).hexdigest(),
              })
              from pypdf import PdfReader
              reader = PdfReader(str(OUT / "ncku-chen-2021.pdf"))
              ncku["page_count"] = len(reader.pages)
              hits = []
              needles = ["新刊希夷陳先生紫微斗數全集", "金陵益軒唐謙梓", "昭和17年", "東洋文庫"]
              for i, page in enumerate(reader.pages):
                  txt = page.extract_text() or ""
                  if any(x in txt for x in needles):
                      hits.append({
                          "pdf_page_1_based": i + 1,
                          "contains": {x: (x in txt) for x in needles},
                          "text": txt,
                      })
              ncku["text_layer_hits"] = hits
          except Exception as e:
              ncku["error"] = type(e).__name__ + ": " + str(e)
          result["ncku_scholarly_pdf"] = ncku

          (OUT / "probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "status": result["status"],
              "search_sha256": result["search_sha256"],
              "target_row_count": len(targets),
              "target_rows": targets,
              "followed_routes": result["followed_routes"],
              "detail_responses": result.get("detail_responses", []),
              "policy_snapshot_summary": {
                  k: {
                      "url": v.get("url"),
                      "status": v.get("status"),
                      "final_url": v.get("final_url"),
                      "bytes": v.get("bytes"),
                      "sha256": v.get("sha256"),
                      "all_reading_reservation_phrase": "現在、閲覧は全て予約制" in v.get("text", ""),
                      "two_business_days_deadline_phrase": "2営業日前" in v.get("text", "") or "２営業日前" in v.get("text", ""),
                      "rare_db_marker_phrase": "貴" in v.get("text", ""),
                      "contains_vii_3_157": v.get("contains_vii_3_157"),
                  }
                  for k, v in result.get("policy_snapshots", {}).items()
              },
              "ncku_snapshot_summary": {
                  "url": result.get("ncku_scholarly_pdf", {}).get("url"),
                  "status": result.get("ncku_scholarly_pdf", {}).get("status"),
                  "bytes": result.get("ncku_scholarly_pdf", {}).get("bytes"),
                  "sha256": result.get("ncku_scholarly_pdf", {}).get("sha256"),
                  "page_count": result.get("ncku_scholarly_pdf", {}).get("page_count"),
                  "ocr_used": result.get("ncku_scholarly_pdf", {}).get("ocr_used"),
                  "hit_pages": [
                      {
                          "pdf_page_1_based": h.get("pdf_page_1_based"),
                          "contains": h.get("contains"),
                      }
                      for h in result.get("ncku_scholarly_pdf", {}).get("text_layer_hits", [])
                  ],
              },
          }, ensure_ascii=False, indent=2))

      - uses: actions/upload-artifact@v4
        with:
          name: toyo-vii3-157-detail-route
          path: toyo-vii3-157/
