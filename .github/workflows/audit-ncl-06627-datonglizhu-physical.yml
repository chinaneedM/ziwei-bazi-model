name: audit-ncl-06627-datonglizhu-physical

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-ncl-06627-datonglizhu-physical.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install physical-collation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra
          python -m pip install --quiet pillow
      - name: Acquire and fingerprint NCL-06627
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/ncl06627/pages audit/ncl06627/contact
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NCL-06627%20%E5%A4%A7%E7%B5%B1%E6%9B%86%E8%A8%BB.pdf'
          curl -fL --retry 4 --retry-delay 2 -A 'Mozilla/5.0 Tianwen-Provenance-Audit/1.0' "$URL" -o audit/ncl06627/NCL-06627-datonglizhu.pdf
          file audit/ncl06627/NCL-06627-datonglizhu.pdf
          sha256sum audit/ncl06627/NCL-06627-datonglizhu.pdf | tee audit/ncl06627/sha256.txt
          pdfinfo audit/ncl06627/NCL-06627-datonglizhu.pdf | tee audit/ncl06627/pdfinfo.txt
          pdftoppm -jpeg -r 110 -jpegopt quality=86 audit/ncl06627/NCL-06627-datonglizhu.pdf audit/ncl06627/pages/page >/dev/null
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import hashlib, json, re

          root = Path('audit/ncl06627')
          pdf = root / 'NCL-06627-datonglizhu.pdf'
          images = sorted((root/'pages').glob('page-*.jpg'), key=lambda p: int(re.search(r'(\d+)$', p.stem).group(1)))
          manifest = {
              'source_id': 'NCL-06627',
              'title': '大統曆註',
              'acquisition_url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/NCL-06627%20%E5%A4%A7%E7%B5%B1%E6%9B%86%E8%A8%BB.pdf',
              'pdf_sha256': hashlib.sha256(pdf.read_bytes()).hexdigest(),
              'pdf_bytes': pdf.stat().st_size,
              'rendered_page_count': len(images),
              'ocr_used_for_final_glyph_claims': False,
              'pages': [],
          }
          for i,p in enumerate(images, 1):
              b=p.read_bytes()
              im=Image.open(p)
              manifest['pages'].append({'page_1_based':i,'file':p.name,'sha256':hashlib.sha256(b).hexdigest(),'width':im.width,'height':im.height})

          cols, rows = 4, 3
          cell_w, cell_h = 700, 520
          for start in range(0, len(images), cols*rows):
              chunk=images[start:start+cols*rows]
              sheet=Image.new('RGB',(cols*cell_w, rows*cell_h),'white')
              draw=ImageDraw.Draw(sheet)
              for idx,p in enumerate(chunk):
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((cell_w-20,cell_h-45))
                  x=(idx%cols)*cell_w+(cell_w-im.width)//2
                  y=(idx//cols)*cell_h+30
                  sheet.paste(im,(x,y))
                  draw.text(((idx%cols)*cell_w+10,(idx//cols)*cell_h+8), f'PDF page {start+idx+1}', fill='black')
              out=root/'contact'/f'contact-{start+1:04d}-{start+len(chunk):04d}.jpg'
              sheet.save(out,quality=88)
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:manifest[k] for k in ('source_id','title','pdf_sha256','pdf_bytes','rendered_page_count','ocr_used_for_final_glyph_claims')},ensure_ascii=False))
          PY
      - name: OCR only for target-page localization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/ncl06627/ocr
          find audit/ncl06627/pages -name 'page-*.jpg' -print0 \
            | xargs -0 -n1 -P4 bash -c '
                img="$0"
                base="$(basename "${img%.jpg}")"
                tesseract "$img" "audit/ncl06627/ocr/$base" -l chi_tra --psm 6 2>/dev/null || true
              '
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('audit/ncl06627')
          manifest = json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          anchors = ['夏至','冬至','小暑','大暑','日出','日入','晝','夜','五十九','四十一','五十八','四十二','五十七','四十三']
          strong = {'夏至':8,'冬至':8,'小暑':8,'大暑':8,'日出':3,'日入':3,'晝':2,'夜':2,'五十九':4,'四十一':4,'五十八':4,'四十二':4,'五十七':4,'四十三':4}
          candidates=[]
          for txt in sorted((root/'ocr').glob('page-*.txt'), key=lambda p:int(re.search(r'(\d+)$',p.stem).group(1))):
              page=int(re.search(r'(\d+)$',txt.stem).group(1))
              raw=txt.read_text(encoding='utf-8',errors='replace')
              compact=re.sub(r'\s+','',raw)
              hits=[a for a in anchors if a in compact]
              score=sum(strong[a] for a in hits)
              if score:
                  snippets=[]
                  for a in hits:
                      pos=compact.find(a)
                      snippets.append(compact[max(0,pos-28):pos+len(a)+52])
                  page_meta=manifest['pages'][page-1]
                  candidates.append({
                      'page_1_based':page,
                      'page_render_sha256':page_meta['sha256'],
                      'score':score,
                      'hits':hits,
                      'ocr_snippets':snippets[:8],
                  })
          candidates.sort(key=lambda x:(-x['score'],x['page_1_based']))
          report={
              'schema_version':'1.0.0',
              'source_id':'NCL-06627',
              'title':'大統曆註',
              'acquisition_url':manifest['acquisition_url'],
              'pdf_sha256':manifest['pdf_sha256'],
              'pdf_bytes':manifest['pdf_bytes'],
              'rendered_page_count':manifest['rendered_page_count'],
              'locator_method':'Tesseract chi_tra OCR over 110dpi rendered pages; candidate localization only',
              'ocr_used_for_final_glyph_claims':False,
              'adjudication_rule':'OCR output may identify pages to inspect but MUST NOT establish final glyph readings or historical claims.',
              'anchors':anchors,
              'candidate_count':len(candidates),
              'top_candidates':candidates[:120],
          }
          out=Path('docs/research/NCL-06627-DATONGLIZHU-PAGE-LOCATOR-R1.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:report[k] for k in ('pdf_sha256','rendered_page_count','candidate_count')},ensure_ascii=False))
          for row in candidates[:30]:
              print(json.dumps(row,ensure_ascii=False))
          PY
      - name: Persist reproducible page-locator report
        shell: bash
        run: |
          set -euo pipefail
          REPORT='docs/research/NCL-06627-DATONGLIZHU-PAGE-LOCATOR-R1.json'
          git add "$REPORT"
          if git diff --cached --quiet; then
            echo 'locator report unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'record NCL-06627 reproducible page locator'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload physical-collation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncl-06627-datonglizhu-physical
          path: audit/ncl06627
          if-no-files-found: error
          retention-days: 30
