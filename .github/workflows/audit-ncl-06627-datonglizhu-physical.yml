name: audit-ncl-06627-datonglizhu-physical

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-ncl-06627-datonglizhu-physical.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install physical-collation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-chi-tra \
            tesseract-ocr-chi-tra-vert
          python -m pip install --quiet pillow

      - name: Acquire and fingerprint NCL-06627
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/ncl06627'
          mkdir -p "$ROOT/coarse" "$ROOT/ocr" "$ROOT/physical" "$ROOT/contact"
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NCL-06627%20%E5%A4%A7%E7%B5%B1%E6%9B%86%E8%A8%BB.pdf'
          PDF="$ROOT/NCL-06627-datonglizhu.pdf"
          curl -fL --retry 4 --retry-delay 2 -A 'Mozilla/5.0 Tianwen-Provenance-Audit/1.0' "$URL" -o "$PDF"
          file "$PDF"
          sha256sum "$PDF" | tee "$ROOT/sha256.txt"
          pdfinfo "$PDF" | tee "$ROOT/pdfinfo.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          root = Path('audit/ncl06627')
          pdf = root / 'NCL-06627-datonglizhu.pdf'
          info = (root / 'pdfinfo.txt').read_text(encoding='utf-8', errors='replace')
          m = re.search(r'^Pages:\s*(\d+)\s*$', info, flags=re.M)
          if not m:
              raise SystemExit('pdfinfo did not expose page count')
          manifest = {
              'schema_version': '2.0.0',
              'source_id': 'NCL-06627',
              'title': '大統曆註',
              'acquisition_url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/NCL-06627%20%E5%A4%A7%E7%B5%B1%E6%9B%86%E8%A8%BB.pdf',
              'pdf_sha256': hashlib.sha256(pdf.read_bytes()).hexdigest(),
              'pdf_bytes': pdf.stat().st_size,
              'pdf_page_count': int(m.group(1)),
              'ocr_used_for_final_glyph_claims': False,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False))
          PY

      - name: Coarse OCR for target-page localization only
        shell: bash
        env:
          OMP_THREAD_LIMIT: '1'
        run: |
          set -euo pipefail
          ROOT='audit/ncl06627'
          PDF="$ROOT/NCL-06627-datonglizhu.pdf"
          # The coarse pass is intentionally low-resolution. It is a locator, never
          # evidence for final glyph readings. Traditional-Chinese vertical OCR is
          # used because the received object is vertically typeset/manuscript-like.
          pdftoppm -jpeg -gray -r 80 -jpegopt quality=60 "$PDF" "$ROOT/coarse/page" >/dev/null
          find "$ROOT/coarse" -name 'page-*.jpg' -print0 \
            | xargs -0 -n1 -P8 bash -c '
                img="$0"
                base="$(basename "${img%.jpg}")"
                timeout 15s tesseract "$img" "audit/ncl06627/ocr/$base" -l chi_tra_vert --psm 5 2>/dev/null || true
              '
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('audit/ncl06627')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          anchors = [
              '夏至', '冬至', '小暑', '大暑', '芒種', '立秋',
              '日出', '日入', '晝', '夜', '刻',
              '五十九', '四十一', '五十八', '四十二', '五十七', '四十三'
          ]
          weight = {
              '夏至': 18, '冬至': 18, '小暑': 18, '大暑': 18, '芒種': 12, '立秋': 12,
              '日出': 5, '日入': 5, '晝': 2, '夜': 2, '刻': 1,
              '五十九': 8, '四十一': 8, '五十八': 8, '四十二': 8, '五十七': 8, '四十三': 8,
          }
          rows = []
          for txt in sorted((root / 'ocr').glob('page-*.txt'), key=lambda p: int(re.search(r'(\d+)$', p.stem).group(1))):
              page = int(re.search(r'(\d+)$', txt.stem).group(1))
              raw = txt.read_text(encoding='utf-8', errors='replace')
              compact = re.sub(r'\s+', '', raw)
              hits = [a for a in anchors if a in compact]
              score = sum(weight[a] for a in hits)
              if not score:
                  continue
              snippets = []
              for a in hits:
                  pos = compact.find(a)
                  snippets.append(compact[max(0, pos - 36):pos + len(a) + 72])
              rows.append({
                  'page_1_based': page,
                  'score': score,
                  'hits': hits,
                  'ocr_snippets': snippets[:10],
              })
          rows.sort(key=lambda x: (-x['score'], x['page_1_based']))

          seasonal = {'夏至', '冬至', '小暑', '大暑', '芒種', '立秋'}
          seeds = [r['page_1_based'] for r in rows if seasonal.intersection(r['hits'])]
          if not seeds:
              seeds = [r['page_1_based'] for r in rows[:40] if r['score'] >= 5]
          if not seeds:
              # Keep the workflow auditable rather than silently claiming a miss.
              # A sparse deterministic fallback gives physical pages for manual
              # inspection without pretending OCR located the target.
              n = manifest['pdf_page_count']
              stride = max(1, n // 24)
              seeds = list(range(1, n + 1, stride))[:24]
              fallback = 'SPARSE_DETERMINISTIC_SAMPLE_NO_OCR_SEED'
          else:
              fallback = None

          expanded = set()
          n = manifest['pdf_page_count']
          for p in seeds:
              for q in range(max(1, p - 2), min(n, p + 2) + 1):
                  expanded.add(q)
          pages = sorted(expanded)
          (root / 'candidate-pages.txt').write_text('\n'.join(map(str, pages)) + '\n', encoding='utf-8')
          coarse = {
              'locator_method': '80dpi grayscale + Tesseract chi_tra_vert psm5; candidate localization only',
              'ocr_used_for_final_glyph_claims': False,
              'fallback': fallback,
              'anchors': anchors,
              'ocr_hit_page_count': len(rows),
              'seed_pages': seeds,
              'expanded_physical_pages': pages,
              'top_candidates': rows[:120],
          }
          (root / 'coarse-locator.json').write_text(json.dumps(coarse, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'pdf_page_count': n,
              'ocr_hit_page_count': len(rows),
              'seed_count': len(seeds),
              'expanded_physical_page_count': len(pages),
              'fallback': fallback,
              'top': rows[:20],
          }, ensure_ascii=False))
          PY

      - name: Render candidate pages for physical adjudication
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/ncl06627'
          PDF="$ROOT/NCL-06627-datonglizhu.pdf"
          while IFS= read -r page; do
            [ -n "$page" ] || continue
            printf -v p4 '%04d' "$page"
            pdftoppm -f "$page" -l "$page" -singlefile -png -r 200 "$PDF" "$ROOT/physical/page-$p4" >/dev/null
          done < "$ROOT/candidate-pages.txt"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import hashlib, json, re

          root = Path('audit/ncl06627')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          coarse = json.loads((root / 'coarse-locator.json').read_text(encoding='utf-8'))
          images = sorted((root / 'physical').glob('page-*.png'), key=lambda p: int(re.search(r'(\d+)$', p.stem).group(1)))
          physical = []
          for p in images:
              page = int(re.search(r'(\d+)$', p.stem).group(1))
              im = Image.open(p)
              physical.append({
                  'page_1_based': page,
                  'file': p.name,
                  'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                  'width': im.width,
                  'height': im.height,
                  'render_dpi': 200,
              })

          cols, rows = 4, 3
          cell_w, cell_h = 760, 620
          for start in range(0, len(images), cols * rows):
              chunk = images[start:start + cols * rows]
              sheet = Image.new('RGB', (cols * cell_w, rows * cell_h), 'white')
              draw = ImageDraw.Draw(sheet)
              for idx, p in enumerate(chunk):
                  im = Image.open(p).convert('RGB')
                  im.thumbnail((cell_w - 20, cell_h - 50))
                  x = (idx % cols) * cell_w + (cell_w - im.width) // 2
                  y = (idx // cols) * cell_h + 36
                  sheet.paste(im, (x, y))
                  page = int(re.search(r'(\d+)$', p.stem).group(1))
                  draw.text(((idx % cols) * cell_w + 12, (idx // cols) * cell_h + 10), f'PDF page {page}', fill='black')
              out = root / 'contact' / f'physical-{start + 1:04d}-{start + len(chunk):04d}.jpg'
              sheet.save(out, quality=90)

          report = {
              'schema_version': '2.0.0',
              'source_id': manifest['source_id'],
              'title': manifest['title'],
              'acquisition_url': manifest['acquisition_url'],
              'pdf_sha256': manifest['pdf_sha256'],
              'pdf_bytes': manifest['pdf_bytes'],
              'pdf_page_count': manifest['pdf_page_count'],
              'locator_method': coarse['locator_method'],
              'ocr_used_for_final_glyph_claims': False,
              'adjudication_rule': 'OCR may identify candidate pages only. Final glyph readings and historical claims require direct inspection of the 200dpi physical renders keyed here by page number and SHA-256.',
              'fallback': coarse['fallback'],
              'anchors': coarse['anchors'],
              'ocr_hit_page_count': coarse['ocr_hit_page_count'],
              'seed_pages': coarse['seed_pages'],
              'candidate_physical_page_count': len(physical),
              'physical_pages': physical,
              'top_ocr_candidates': coarse['top_candidates'],
          }
          out = Path('docs/research/NCL-06627-DATONGLIZHU-PAGE-LOCATOR-R1.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'pdf_sha256': report['pdf_sha256'],
              'pdf_page_count': report['pdf_page_count'],
              'candidate_physical_page_count': report['candidate_physical_page_count'],
              'seed_pages': report['seed_pages'],
              'fallback': report['fallback'],
          }, ensure_ascii=False))
          PY

      - name: Persist reproducible page-locator report
        shell: bash
        run: |
          set -euo pipefail
          REPORT='docs/research/NCL-06627-DATONGLIZHU-PAGE-LOCATOR-R1.json'
          git add "$REPORT"
          if git diff --cached --quiet; then
            echo 'locator report unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'record NCL-06627 reproducible page locator'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Trim coarse OCR intermediates
        if: always()
        shell: bash
        run: |
          rm -rf audit/ncl06627/coarse audit/ncl06627/ocr

      - name: Upload physical-collation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncl-06627-datonglizhu-physical
          path: audit/ncl06627
          if-no-files-found: error
          retention-days: 30
