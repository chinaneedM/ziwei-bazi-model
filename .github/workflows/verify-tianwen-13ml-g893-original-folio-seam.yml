    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13ml-g893-folio-seam.py
      - run: python scripts/verify-goryeosa-waseda-d18-d20-13bj.py
