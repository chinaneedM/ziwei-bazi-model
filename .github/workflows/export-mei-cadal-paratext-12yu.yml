name: export-mei-cadal06054965-paratext-12yu
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/export-mei-cadal-paratext-12yu.py
      - .github/workflows/export-mei-cadal-paratext-12yu.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install unmodified DjVu decoder and image support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install 'Pillow>=10,<12'
      - name: Export high-resolution original paratext folios, no OCR
        run: python scripts/export-mei-cadal-paratext-12yu.py
      - name: Preserve artifact with source SHA, images and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-cadal06054965-12yu-paratext-native-atlas
          path: research-12yu-mei-paratext/
          retention-days: 20
          if-no-files-found: warn
