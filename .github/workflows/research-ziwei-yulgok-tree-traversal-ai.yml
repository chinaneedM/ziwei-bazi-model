name: research-ziwei-yulgok-tree-traversal-ai

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-yulgok-tree-traversal-ai.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Traverse only source-emitted Yulgok treeAjax URLs
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from collections import deque
          from pathlib import Path

          OUT=Path("probe"); OUT.mkdir()
          base="https://db.yulgok.or.kr"
          viewer=base+"/viewer/view?dataId=B005_01_B00320_001"
          root=base+"/viewer/treeAjax?itemId=PD&cate=organImg&depth=1&upPath=%EA%B0%9C%EC%9D%B8&treeType=pubSvc&dataId="
          ua="Mozilla/5.0 provenance-research yulgok-source-tree"

          def fetch(url, referer=None, limit=3000000):
              h={"User-Agent":ua,"Accept":"text/html,application/json,*/*;q=0.8","Accept-Language":"ko,en;q=0.7,zh;q=0.6"}
              if referer: h["Referer"]=referer
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=35) as r:
                      d=r.read(limit)
                      return {"ok":True,"status":r.status,"final_url":r.geturl(),"content_type":r.headers.get("content-type"),"bytes":len(d),"sha256":hashlib.sha256(d).hexdigest(),"data":d}
              except Exception as e:
                  return {"ok":False,"error":repr(e),"bytes":0,"data":b""}

          # Start from the exact root URL emitted by the public viewer HTML.
          q=deque([(root,0)])
          seen=set()
          records=[]
          target_contexts=[]
          exact_data_ids=set()
          max_depth=8
          max_nodes=400

          def emitted_urls(txt, current):
              vals=[]
              # vctree responses encode nested fetches as {url:...}; data-url may point to viewer entries.
              for pat in [
                  r'''\{url:([^}\s]+)\}''',
                  r'''data-url=["']([^"']+)["']''',
                  r'''(?:href|url)=["']([^"']+)["']'''
              ]:
                  for m in re.finditer(pat,txt,re.I):
                      v=html.unescape(m.group(1)).replace("\\/","/").strip().strip("'\"")
                      u=urllib.parse.urljoin(current,v)
                      if u.startswith(base) and u not in vals:
                          vals.append(u)
              return vals

          while q and len(seen)<max_nodes:
              url,depth=q.popleft()
              if url in seen or depth>max_depth: continue
              seen.add(url)
              row=fetch(url,referer=viewer); data=row.pop("data")
              txt=data.decode("utf-8","replace") if data else ""
              urls=emitted_urls(txt,row.get("final_url") or url)
              rec={"url":url,"depth":depth,**row,"emitted_urls":urls}
              records.append(rec)
              if any(n in txt for n in ("B00320","자미","紫薇","斗數","두수","천보당")):
                  for needle in ("B00320","자미","紫薇","斗數","두수","천보당"):
                      start=0
                      while True:
                          k=txt.find(needle,start)
                          if k<0: break
                          target_contexts.append({"source_url":url,"depth":depth,"needle":needle,"text":txt[max(0,k-1200):min(len(txt),k+3000)]})
                          start=k+len(needle)
              for m in re.finditer(r'''dataId=([A-Za-z0-9_\-]+)''',txt):
                  did=m.group(1)
                  if "B00320" in did:
                      exact_data_ids.add(did)
              for u in urls:
                  # Follow only source-returned treeAjax URLs; record viewer/data URLs but do not synthesize them.
                  if "/viewer/treeAjax?" in u and u not in seen:
                      q.append((u,depth+1))
                  qm=urllib.parse.parse_qs(urllib.parse.urlparse(u).query)
                  for did in qm.get("dataId",[]):
                      if "B00320" in did:
                          exact_data_ids.add(did)

          result={
              "schema":"ZIWEI-YULGOK-SOURCE-TREE-TRAVERSAL-AI-R1",
              "access_date":"2026-09-09",
              "root_url":root,
              "root_provenance":"EXACT_TREEAJAX_URL_EMITTED_BY_PUBLIC_VIEWER_HTML",
              "records":records,
              "target_contexts":target_contexts,
              "exact_source_observed_data_ids":sorted(exact_data_ids),
              "authentication_attempted":False,
              "identifier_guessing_attempted":False,
              "access_control_bypass_attempted":False,
              "adjudication":{"tree_traversal":"SOURCE_EMITTED_URLS_ONLY","related_volume_ids":"OBSERVED_ONLY_NOT_INFERRED","target_leaf_status":"PENDING","algorithm_effect":"NONE"}
          }
          (OUT/"ziwei-yulgok-source-tree-traversal-ai.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
              "fetched_nodes":len(records),
              "max_depth_seen":max([x["depth"] for x in records],default=0),
              "exact_source_observed_data_ids":sorted(exact_data_ids),
              "context_count":len(target_contexts),
              "sample_contexts":target_contexts[:20],
              "adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-yulgok-tree-traversal-ai
          path: probe/
          retention-days: 14
