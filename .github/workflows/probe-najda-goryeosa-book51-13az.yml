name: probe-najda-goryeosa-book51-13az
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-najda-goryeosa-13az.py
      - .github/workflows/probe-najda-goryeosa-book51-13az.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source-emitted-item-and-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source emitter and manifest scope offline tests
        run: python -m unittest discover -s tests -p 'test_najda_goryeosa_13az.py' -v
      - name: Download exact original-source book51 first and last eight images
        run: python scripts/probe-najda-goryeosa-13az.py
      - name: Store provenance probe and JPEG byte hashes even when access fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: najda-goryeosa-13az-book51-original-samples
          path: najda-goryeosa-13az-evidence/
          retention-days: 30
          if-no-files-found: error
