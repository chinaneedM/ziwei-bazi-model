name: research-ziwei-tushubian-juan28-v38-as-r4

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-tushubian-juan28-v38-as-r4.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Fetch corrected Harvard physical volume for internal Juan 28
        shell: python
        run: |
          import hashlib, io, json, urllib.parse, urllib.request
          from pathlib import Path
          import fitz
          from PIL import Image, ImageDraw

          out=Path("batch12as-r4"); out.mkdir(exist_ok=True)

          def get(url,name,timeout=180):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      data=r.read(); status=r.status; final=r.geturl(); ctype=r.headers.get("Content-Type")
              except Exception as e:
                  return {"url":url,"error":repr(e)}
              (out/name).write_bytes(data)
              return {"url":url,"final_url":final,"http_status":status,"content_type":ctype,
                      "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}

          def commons_search(q,label):
              url=("https://commons.wikimedia.org/w/api.php?action=query&format=json&list=search&srnamespace=6"
                   "&srlimit=50&srsearch="+urllib.parse.quote(q))
              rec=get(url,label+"-search.json",60)
              titles=[]
              if rec.get("http_status")==200:
                  obj=json.loads((out/(label+"-search.json")).read_text("utf-8"))
                  titles=[x.get("title") for x in obj.get("query",{}).get("search",[])]
              return rec,titles

          def commons_file(title,label):
              url=("https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo"
                   "&iiprop=url%7Csize%7Csha1&titles="+urllib.parse.quote(title))
              rec=get(url,label+"-api.json",60)
              if rec.get("http_status")!=200: return rec,None
              obj=json.loads((out/(label+"-api.json")).read_text("utf-8"))
              page=next(iter(obj.get("query",{}).get("pages",{}).values()),{})
              return rec,(page.get("imageinfo") or [None])[0]

          def render_page(doc,p1,label,scale=1.4):
              pix=doc[p1-1].get_pixmap(matrix=fitz.Matrix(scale,scale),alpha=False)
              fn=f"{label}-p{p1}.png"; pix.save(str(out/fn))
              return {"page_1_based":p1,"filename":fn,
                      "sha256":hashlib.sha256((out/fn).read_bytes()).hexdigest(),
                      "width":pix.width,"height":pix.height}

          def contacts(doc,label,cols=2,rows=3):
              thumbs=[]
              for j,page in enumerate(doc):
                  pix=page.get_pixmap(matrix=fitz.Matrix(0.50,0.50),alpha=False)
                  im=Image.open(io.BytesIO(pix.tobytes("jpeg"))).convert("RGB")
                  c=Image.new("RGB",(im.width,im.height+28),"white")
                  c.paste(im,(0,28)); ImageDraw.Draw(c).text((5,5),f"PDF p{j+1}",fill="black")
                  thumbs.append(c)
              results=[]; per=cols*rows
              for k in range(0,len(thumbs),per):
                  batch=thumbs[k:k+per]
                  w=max(x.width for x in batch); h=max(x.height for x in batch)
                  sh=Image.new("RGB",(cols*w,rows*h),"white")
                  for idx,im in enumerate(batch):
                      sh.paste(im,((idx%cols)*w,(idx//cols)*h))
                  fn=f"{label}-contact-{k//per+1}.jpg"; sh.save(out/fn,quality=90)
                  results.append({"pages":[k+1,k+len(batch)],"filename":fn,
                                  "sha256":hashlib.sha256((out/fn).read_bytes()).hexdigest()})
              return results

          receipt={
              "scope":"BATCH12AS_R4_CORRECT_PHYSICAL_VOLUME_FOR_TUSHUBIAN_INTERNAL_JUAN28",
              "parent_runs":[34355663757,34356902176,34358247747],
              "mapping_evidence":{
                  "observed_v29_internal_juan":19,
                  "observed_v30_internal_juan":20,
                  "inferred_target_physical_volume":38,
                  "target_internal_juan":28,
                  "mapping_claim_scope":"LOCAL_SEQUENCE_HYPOTHESIS_TO_BE_CONFIRMED_BY_DIRECT_V38_TITLE_PAGE"
              },
              "ocr_generated_by_probe":False,
              "authentication_attempted":False,
              "direct_internal_juan28_claimed_before_manual_review":False,
              "target":{}
          }

          label="tushubian-v38"
          srec,titles=commons_search('intitle:"圖書編 v.38.pdf"',label)
          selected=next((t for t in titles if "Harvard" in t and "圖書編" in t and "v.38.pdf" in t),None)
          receipt["target"]={"search_request":srec,"titles":titles,"selected_title":selected}

          if selected:
              arec,info=commons_file(selected,label)
              receipt["target"]["api_request"]=arec
              receipt["target"]["imageinfo"]=info
              if info and info.get("url"):
                  frec=get(info["url"],label+".pdf",180)
                  receipt["target"]["pdf_request"]=frec
                  p=out/(label+".pdf")
                  if p.exists():
                      doc=fitz.open(str(p))
                      receipt["target"]["page_count"]=len(doc)
                      receipt["target"]["text_layer_nonempty_pages"]=sum(
                          1 for pg in doc if (pg.get_text("text") or "").strip())
                      identity_pages=[]
                      for p1 in [1,2,3,4,5]:
                          if p1 <= len(doc):
                              identity_pages.append(render_page(doc,p1,label))
                      receipt["target"]["identity_pages"]=identity_pages
                      receipt["target"]["contact_sheets"]=contacts(doc,label)

          receipt["adjudication"]={
              "manual_visual_review_required":True,
              "fullbook_authorial_inheritance_claimed":False,
              "runtime_standard_selected":False,
              "algorithm_reopen_authorized":False
          }
          (out/"receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n","utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-tushubian-juan28-v38-as-r4
          path: batch12as-r4
          retention-days: 90
