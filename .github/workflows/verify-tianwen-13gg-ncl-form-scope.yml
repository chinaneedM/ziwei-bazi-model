name: verify-tianwen-13gg-ncl-form-scope
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
  workflow_dispatch:
jobs:
  verify-official-form-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify-tianwen-13gg-ncl-form-scope.py
      - run: python -m unittest discover -s tests -p 'test_verify_tianwen_13gg_ncl_form_scope.py' -v
