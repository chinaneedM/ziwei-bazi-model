name: research-sillok-chiljeongsan-native-pages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-sillok-chiljeongsan-native-pages.yml"
      - "scripts/research_sillok_chiljeongsan_native_pages.py"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch official Sillok native pages through viewer imgArr and imageProxy
        run: |
          python scripts/research_sillok_chiljeongsan_native_pages.py \
            --output artifacts/sillok-chiljeongsan-native-pages
      - name: Upload no-OCR native-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sillok-chiljeongsan-native-pages-${{ github.sha }}
          path: artifacts/sillok-chiljeongsan-native-pages/
          if-no-files-found: warn
          retention-days: 7
