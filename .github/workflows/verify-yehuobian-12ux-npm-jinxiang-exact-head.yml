name: verify-yehuobian-12ux-npm-jinxiang-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12ux-npm-jinxiang-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/TRANSMISSION-GENEALOGY-GRAPH-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-SOURCE-REGISTRY-EXTENSIONS-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UX-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UX-*.md
      - scripts/verify-yehuobian-npm-jinxiang-12ux.py
      - tests/test_yehuobian_npm_jinxiang_12ux.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continuity source shards and transmission graph
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: NPM Qing miniature physical copy and 18 negative controls
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-npm-jinxiang-12ux.py
          python -m unittest discover -s tests -p 'test_yehuobian_npm_jinxiang_12ux.py' -v
