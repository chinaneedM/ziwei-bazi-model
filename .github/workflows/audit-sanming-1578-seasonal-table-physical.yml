name: audit-sanming-1578-seasonal-table-physical

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-sanming-1578-seasonal-table-physical.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install physical-render tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pillow

      - name: Acquire exact 1578 Sanming physical source
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/sanming1578-seasonal'
          mkdir -p "$ROOT/physical" "$ROOT/contact"
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NCL-06589%201%20%E4%B8%89%E5%91%BD%E9%80%9A%E6%9C%83.pdf'
          PDF="$ROOT/NCL-06589-1-sanming-tonghui-1578.pdf"
          EXPECTED='3de5c45efb1919965afae00a3c97121054aaabd0f38f9fd5ab8f0a28bb8e36dd'
          curl -fL --retry 4 --retry-delay 2 -A 'Mozilla/5.0 Tianwen-Provenance-Audit/1.0' "$URL" -o "$PDF"
          ACTUAL="$(sha256sum "$PDF" | awk '{print $1}')"
          printf '%s  %s\n' "$ACTUAL" "$(basename "$PDF")" | tee "$ROOT/sha256.txt"
          test "$ACTUAL" = "$EXPECTED"
          pdfinfo "$PDF" | tee "$ROOT/pdfinfo.txt"

      - name: Render exact seasonal-table leaves without OCR
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/sanming1578-seasonal'
          PDF="$ROOT/NCL-06589-1-sanming-tonghui-1578.pdf"
          for page in 134 135 136; do
            printf -v p4 '%04d' "$page"
            pdftoppm -f "$page" -l "$page" -singlefile -png -r 220 "$PDF" "$ROOT/physical/page-$p4" >/dev/null
          done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import hashlib, json, re

          root = Path('audit/sanming1578-seasonal')
          imgs = sorted(root.joinpath('physical').glob('page-*.png'))
          rows = []
          for path in imgs:
              page = int(re.search(r'(\d+)$', path.stem).group(1))
              image = Image.open(path)
              rows.append({
                  'page_1_based': page,
                  'file': path.name,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'width': image.width,
                  'height': image.height,
                  'render_dpi': 220,
              })

          sheet = Image.new('RGB', (2100, 650), 'white')
          draw = ImageDraw.Draw(sheet)
          for index, path in enumerate(imgs):
              image = Image.open(path).convert('RGB')
              image.thumbnail((680, 600))
              x = index * 700 + (700 - image.width) // 2
              y = 40 + (600 - image.height) // 2
              sheet.paste(image, (x, y))
              page = int(re.search(r'(\d+)$', path.stem).group(1))
              draw.text((index * 700 + 12, 12), f'PDF page {page}', fill='black')
          sheet.save(root/'contact'/'sanming-1578-seasonal-p134-p136.jpg', quality=92)

          report = {
              'schema': 'SANMING-TONGHUI-1578-SEASONAL-TABLE-PHYSICAL-LOCATOR-R1',
              'schema_version': '1.0.0',
              'source_id': 'NCL-06589-1',
              'title': '三命通會',
              'edition': '明萬曆戊寅（六年，1578）刊本',
              'acquisition_url': 'https://commons.wikimedia.org/wiki/Special:Redirect/file/NCL-06589%201%20%E4%B8%89%E5%91%BD%E9%80%9A%E6%9C%83.pdf',
              'pdf_sha256': '3de5c45efb1919965afae00a3c97121054aaabd0f38f9fd5ab8f0a28bb8e36dd',
              'target_scope': 'PDF pages 134-136: direct physical leaves carrying the seasonal day/night-ke ladder surrounding winter-solstice through early-winter entries',
              'ocr_used_for_final_glyph_claims': False,
              'ocr_used_for_localization_in_this_gate': False,
              'rendering': 'pdftoppm 220dpi PNG; exact pages selected from prior locator and direct physical inspection',
              'adjudication_rule': 'This report binds the physical leaves and hashes only. Any glyph, number, change-day, or recension claim requires direct visual inspection of these renders; no OCR text may substitute for the physical image.',
              'physical_pages': rows,
          }
          out = Path('docs/research/SANMING-TONGHUI-1578-SEASONAL-TABLE-PHYSICAL-LOCATOR-R1.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Persist exact physical locator
        shell: bash
        run: |
          set -euo pipefail
          REPORT='docs/research/SANMING-TONGHUI-1578-SEASONAL-TABLE-PHYSICAL-LOCATOR-R1.json'
          git add "$REPORT"
          if git diff --cached --quiet; then echo 'seasonal-table locator unchanged'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'record 1578 Sanming seasonal table physical locator'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Drop source PDF before artifact upload
        if: always()
        shell: bash
        run: rm -f audit/sanming1578-seasonal/NCL-06589-1-sanming-tonghui-1578.pdf

      - name: Upload exact physical leaves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanming-1578-seasonal-table-physical
          path: audit/sanming1578-seasonal
          if-no-files-found: error
          retention-days: 30
