name: research-naaj-ziwei-quanshu-facsimile-route

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-naaj-ziwei-quanshu-facsimile-route.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve NAAJ public facsimile route
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          BASE = "https://www.digital.archives.go.jp"
          TITLE = "新鋟希夷陳先生紫微斗数全書"
          CALL = "子０６０－０００１"
          PARENT_ID = "1078787"
          KNOWN_ITEM1 = "4468520"
          UA = "Mozilla/5.0 research-only public historical-facsimile route probe"

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8",
                      "Accept-Language": "ja,en;q=0.8",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read()
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "headers": {
                              k: v for k, v in resp.headers.items()
                              if k.lower() in {
                                  "content-type", "content-length", "location",
                                  "content-disposition", "last-modified", "etag",
                              }
                          },
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "data": b""}

          def save(key, result):
              data = result.get("data", b"")
              suffix = ".json" if "json" in str(result.get("content_type", "")).lower() else ".html"
              (OUT / f"{key}{suffix}").write_bytes(data)
              return {
                  k: v for k, v in result.items() if k != "data"
              } | {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest() if data else None,
              }

          def decode(data):
              return data.decode("utf-8", "replace")

          def extract(html_text, base_url):
              hrefs = [
                  html.unescape(x)
                  for x in re.findall(r"""(?:href|src|action)\s*=\s*["']([^"']+)["']""", html_text, re.I)
              ]
              absolute = sorted(set(urllib.parse.urljoin(base_url, x) for x in hrefs))
              relevant = [
                  x for x in absolute
                  if (
                      "digital.archives.go.jp" in x
                      and any(token in x.lower() for token in (
                          "/item/", "/img/", "/file/", "download", "image", "viewer",
                          "content", ".jp2", ".jpg", ".jpeg", ".png", ".pdf", ".json",
                          ".js", "/api/", "ajax",
                      ))
                  )
              ]
              item_ids = sorted(set(re.findall(r"/item/(\d+)", html_text)))
              img_ids = sorted(set(re.findall(r"/img/(\d+)", html_text)))
              file_ids = sorted(set(re.findall(r"/file/(\d+)", html_text)))
              content_ids = sorted(set(re.findall(r"\bC\d{6,}\b", html_text)))
              jp2_names = sorted(set(re.findall(r"[A-Za-z0-9_\-]+\.jp2", html_text, re.I)))
              return {
                  "relevant_urls": relevant[:1000],
                  "item_ids": item_ids,
                  "img_ids": img_ids,
                  "file_ids": file_ids,
                  "content_ids": content_ids,
                  "jp2_names": jp2_names,
              }

          summary = {
              "schema": "NAAJ-ZIWEI-QUANSHU-FACSIMILE-ROUTE-PROBE-R1",
              "official_provider": "National Archives of Japan Digital Archive",
              "base_url": BASE,
              "title": TITLE,
              "call_number": CALL,
              "parent_file_id": PARENT_ID,
              "known_volume1_item_id": KNOWN_ITEM1,
              "known_bibliography": {
                  "old_collection": "紅葉山文庫",
                  "publication": "刊本:明",
                  "volume_count": 2,
              },
              "ocr_used": False,
              "authentication_or_paywall_bypass_attempted": False,
              "identifier_bruteforce_attempted": False,
              "targets": {},
              "extractions": {},
              "script_probes": [],
              "discovered_child_items": [],
          }

          seed_urls = {
              "parent_file": f"{BASE}/file/{PARENT_ID}",
              "parent_viewer": f"{BASE}/img/{PARENT_ID}",
              "volume1_item": f"{BASE}/item/{KNOWN_ITEM1}",
              "volume1_viewer": f"{BASE}/img/{KNOWN_ITEM1}",
              "search_query": f"{BASE}/search?" + urllib.parse.urlencode({"query": TITLE}),
              "search_keyword": f"{BASE}/search?" + urllib.parse.urlencode({"keyword": TITLE}),
          }

          page_texts = {}
          for key, url in seed_urls.items():
              r = get(url)
              summary["targets"][key] = {"url": url, **save(key, r)}
              text = decode(r.get("data", b""))
              page_texts[key] = text
              summary["extractions"][key] = extract(text, url)

          child_item_ids = set()
          for e in summary["extractions"].values():
              child_item_ids.update(e["item_ids"])
          child_item_ids.discard(KNOWN_ITEM1)

          # Only follow identifiers directly exposed by official seed pages.
          for item_id in sorted(child_item_ids)[:20]:
              url = f"{BASE}/item/{item_id}"
              r = get(url)
              key = f"child-item-{item_id}"
              meta = save(key, r)
              text = decode(r.get("data", b""))
              ex = extract(text, url)
              is_title_match = TITLE in text
              is_volume2 = (
                  ("冊次" in text and "0002" in text)
                  or ("件名番号" in text and "0002" in text)
                  or (TITLE + "２" in text)
                  or (TITLE + "2" in text)
              )
              summary["discovered_child_items"].append({
                  "item_id": item_id,
                  "url": url,
                  "transport": meta,
                  "title_match": is_title_match,
                  "volume2_signal": is_volume2,
                  "extraction": ex,
              })

          # Probe only JS files directly referenced by official pages.
          scripts = []
          for e in summary["extractions"].values():
              for url in e["relevant_urls"]:
                  if url.lower().split("?", 1)[0].endswith(".js") and url not in scripts:
                      scripts.append(url)
          for index, url in enumerate(scripts[:30], 1):
              r = get(url)
              data = r.get("data", b"")
              text = decode(data)
              endpoints = sorted(set(
                  html.unescape(x)
                  for x in re.findall(
                      r"""["']([^"']*(?:download|image|viewer|content|ajax|api|jp2)[^"']*)["']""",
                      text,
                      re.I,
                  )
                  if 0 < len(x) < 500
              ))
              rec = {
                  "index": index,
                  "url": url,
                  "transport": save(f"script-{index:02d}", r),
                  "endpoint_literals": endpoints[:500],
              }
              summary["script_probes"].append(rec)

          aggregate_item_ids = set()
          aggregate_content_ids = set()
          aggregate_jp2 = set()
          aggregate_urls = set()
          for e in summary["extractions"].values():
              aggregate_item_ids.update(e["item_ids"])
              aggregate_content_ids.update(e["content_ids"])
              aggregate_jp2.update(e["jp2_names"])
              aggregate_urls.update(e["relevant_urls"])
          for child in summary["discovered_child_items"]:
              e = child["extraction"]
              aggregate_item_ids.update(e["item_ids"])
              aggregate_content_ids.update(e["content_ids"])
              aggregate_jp2.update(e["jp2_names"])
              aggregate_urls.update(e["relevant_urls"])

          volume2 = [
              x for x in summary["discovered_child_items"]
              if x["title_match"] and x["volume2_signal"]
          ]
          summary["conclusion"] = {
              "official_parent_transport_ok": summary["targets"]["parent_file"].get("ok", False),
              "official_volume1_transport_ok": summary["targets"]["volume1_item"].get("ok", False),
              "directly_exposed_item_ids": sorted(aggregate_item_ids),
              "directly_exposed_content_ids": sorted(aggregate_content_ids),
              "directly_exposed_jp2_names": sorted(aggregate_jp2),
              "directly_exposed_relevant_url_count": len(aggregate_urls),
              "volume2_candidate_count": len(volume2),
              "volume2_candidates": [
                  {"item_id": x["item_id"], "url": x["url"]}
                  for x in volume2
              ],
              "target_chapter_page_bound": False,
              "target_glyphs_read": False,
              "late_zi_algorithm_effect": "NONE",
              "next_action": (
                  "FOLLOW_DIRECTLY_EXPOSED_VOLUME2_AND_IMAGE_ROUTE"
                  if volume2
                  else "RESOLVE_VOLUME2_FROM_OFFICIAL_FRONTEND_ROUTE_WITHOUT_IDENTIFIER_GUESSING"
              ),
          }
          (OUT / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(summary["conclusion"], ensure_ascii=False, indent=2))

      - name: Probe Shidian volume-five scan metadata
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir(exist_ok=True)
          URL = "https://www.shidianguji.com/zh/book/SDZJ0170/chapter/1jvzop58rvdbm"
          BASE = "https://www.shidianguji.com"
          UA = "Mozilla/5.0 research-only historical-facsimile metadata probe"
          TARGETS = (
              "論人生時要審的確",
              "如人生子亥二時",
              "如子時有十刻",
              "上五刻屬昨夜亥時",
              "下五刻屬今日子時",
          )

          req = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
              },
          )
          result = {
              "schema": "SHIDIAN-ZIWEI-QUANSHU-VOL5-SCAN-METADATA-PROBE-R1",
              "url": URL,
              "book_id": "SDZJ0170",
              "chapter_id": "1jvzop58rvdbm",
              "target_heading": "論人生時要審的確",
              "ocr_used": False,
              "authentication_or_paywall_bypass_attempted": False,
              "identifier_bruteforce_attempted": False,
          }
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = resp.read()
                  result["transport"] = {
                      "ok": True,
                      "status": getattr(resp, "status", None),
                      "final_url": resp.geturl(),
                      "content_type": resp.headers.get("content-type"),
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  }
          except Exception as exc:
              data = b""
              result["transport"] = {"ok": False, "error": repr(exc), "bytes": 0, "sha256": None}

          (OUT / "shidian-volume5.html").write_bytes(data)
          text = data.decode("utf-8", "replace")

          target_contexts = []
          for term in TARGETS:
              start = 0
              while True:
                  i = text.find(term, start)
                  if i < 0:
                      break
                  block = text[max(0, i - 2500): i + 5000]
                  target_contexts.append({
                      "term": term,
                      "context": re.sub(r"\s+", " ", block)[:9000],
                      "numeric_ids_nearby": sorted(set(re.findall(r"\b\d{12,22}\b", block))),
                  })
                  start = i + len(term)
                  if sum(x["term"] == term for x in target_contexts) >= 10:
                      break
          result["target_contexts"] = target_contexts

          next_data = None
          m = re.search(
              r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>',
              text,
              re.I | re.S,
          )
          if m:
              raw = html.unescape(m.group(1))
              try:
                  next_data = json.loads(raw)
                  (OUT / "shidian-next-data.json").write_text(
                      json.dumps(next_data, ensure_ascii=False, indent=2),
                      encoding="utf-8",
                  )
              except Exception as exc:
                  result["next_data_parse_error"] = repr(exc)
          result["next_data_present"] = next_data is not None

          urls = [
              urllib.parse.urljoin(URL, html.unescape(x))
              for x in re.findall(r'''(?:href|src|action)\s*=\s*["']([^"']+)["']''', text, re.I)
          ]
          urls += [
              urllib.parse.urljoin(URL, html.unescape(x))
              for x in re.findall(r'''["'](https?://[^"']+)["']''', text, re.I)
          ]
          urls = sorted(set(urls))
          relevant_urls = [
              u for u in urls
              if any(token in u.lower() for token in (
                  "scan", "image", "img", "page", "original", "book", "chapter",
                  "api", "static", "_next", ".jpg", ".jpeg", ".png", ".webp", ".json",
              ))
          ]
          result["relevant_urls"] = relevant_urls[:1500]

          patterns = {
              "long_numeric_ids": r"\b\d{12,22}\b",
              "page_id_assignments": r'''(?:pageId|page_id|pageID|page-id)["'\s:=]+([A-Za-z0-9_-]{6,40})''',
              "image_id_assignments": r'''(?:imageId|image_id|imgId|img_id)["'\s:=]+([A-Za-z0-9_-]{6,50})''',
              "scan_id_assignments": r'''(?:scanId|scan_id)["'\s:=]+([A-Za-z0-9_-]{6,50})''',
          }
          result["identifier_candidates"] = {
              key: sorted(set(re.findall(pattern, text, re.I)))
              for key, pattern in patterns.items()
          }

          scripts = [
              u for u in relevant_urls
              if u.lower().split("?", 1)[0].endswith(".js")
          ]
          script_records = []
          endpoint_literals = set()
          for idx, script_url in enumerate(scripts[:40], 1):
              sreq = urllib.request.Request(script_url, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(sreq, timeout=30) as resp:
                      sdata = resp.read()
                      stext = sdata.decode("utf-8", "replace")
                      (OUT / f"shidian-script-{idx:02d}.js").write_bytes(sdata)
                      literals = sorted(set(
                          html.unescape(x)
                          for x in re.findall(
                              r'''["']([^"']*(?:scan|image|img|page|original|book|chapter|api)[^"']*)["']''',
                              stext,
                              re.I,
                          )
                          if 0 < len(x) < 500
                      ))
                      endpoint_literals.update(literals)
                      script_records.append({
                          "url": script_url,
                          "status": getattr(resp, "status", None),
                          "bytes": len(sdata),
                          "sha256": hashlib.sha256(sdata).hexdigest(),
                          "endpoint_literals": literals[:500],
                      })
              except Exception as exc:
                  script_records.append({"url": script_url, "error": repr(exc)})
          result["script_records"] = script_records
          result["endpoint_literals"] = sorted(endpoint_literals)[:3000]

          result["conclusion"] = {
              "transport_ok": result.get("transport", {}).get("ok", False),
              "target_text_present_in_raw_html": any(x["term"] == TARGETS[0] for x in target_contexts),
              "exact_up_five_text_present": TARGETS[3] in text,
              "exact_down_five_text_present": TARGETS[4] in text,
              "direct_scan_page_id_bound": False,
              "target_glyphs_read_from_scan": False,
              "late_zi_algorithm_effect": "NONE",
              "next_action": "REVIEW_EXPOSED_PAGE_SCAN_METADATA_AND_FRONTEND_ENDPOINTS",
          }
          (OUT / "shidian-summary.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(result["conclusion"], ensure_ascii=False, indent=2))

      - name: Resolve Shidian Reader-Image lazy assets
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          PAGE = OUT / "shidian-volume5.html"
          text = PAGE.read_text(encoding="utf-8", errors="replace")
          UA = "Mozilla/5.0 research-only historical-facsimile reader-protocol probe"
          TARGET_PAGE_ID = "7330179103183667235"

          # Asset base comes only from script URLs directly exposed in the same HTML.
          direct_script_urls = [
              html.unescape(x).replace("\\u002F", "/")
              for x in re.findall(
                  r'''<script[^>]+src=["']([^"']+)["']''',
                  text,
                  re.I,
              )
          ]
          shidian_bases = []
          for u in direct_script_urls:
              marker = "/guji/shidian/"
              if marker in u:
                  base = u.split(marker, 1)[0] + marker
                  if base.startswith("//"):
                      base = "https:" + base
                  if base not in shidian_bases:
                      shidian_bases.append(base)

          # Lazy reader asset paths are taken from the asset manifest serialized in raw HTML.
          reader_block_match = re.search(
              r'''"Reader-Image":\{"chunkIds":\[(.*?)\],"assets":\[(.*?)\],"referenceCssAssets"''',
              text,
              re.S,
          )
          if not reader_block_match:
              raise SystemExit("Reader-Image asset manifest not found in raw HTML")
          asset_field = reader_block_match.group(2)
          asset_paths = [
              html.unescape(x).replace("\\u002F", "/")
              for x in re.findall(r'"([^"]+\.js)"', asset_field)
          ]
          if not shidian_bases:
              raise SystemExit("direct Shidian asset base not found")
          base = shidian_bases[0]
          asset_urls = [urllib.parse.urljoin(base, p) for p in asset_paths]

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read()
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "data": b""}

          records = []
          combined = []
          for i, url in enumerate(asset_urls, 1):
              r = get(url)
              data = r.pop("data")
              (OUT / f"reader-image-{i:02d}.js").write_bytes(data)
              js = data.decode("utf-8", "replace")
              combined.append(js)
              # Preserve only direct literals / local contexts, not guessed endpoints.
              literals = sorted(set(
                  html.unescape(x)
                  for x in re.findall(
                      r'''["']([^"']*(?:pageId|page_id|picUrl|thumbUrl|uri|image|img|original|ancientlib|read)[^"']*)["']''',
                      js,
                      re.I,
                  )
                  if 0 < len(x) < 800
              ))
              contexts = []
              for term in ("pageId", "picUrl", "thumbUrl", "urlEncryptType", "ancientlib", "read"):
                  for m in list(re.finditer(term, js, re.I))[:20]:
                      block = js[max(0, m.start()-900):m.start()+2600]
                      if any(k in block for k in ("pageId", "picUrl", "thumbUrl", "ancientlib", "read")):
                          contexts.append({
                              "term": term,
                              "context": block,
                          })
              records.append({
                  "url": url,
                  **r,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest() if data else None,
                  "literals": literals[:1000],
                  "contexts": contexts[:100],
              })

          all_js = "\n".join(combined)
          # Extract request-like URL/path literals directly present in reader code.
          endpoint_literals = sorted(set(
              html.unescape(x)
              for x in re.findall(
                  r'''["']([^"']*(?:/api/|ancientlib|page|image|img|read)[^"']*)["']''',
                  all_js,
                  re.I,
              )
              if 0 < len(x) < 1000
          ))
          key_literals = sorted(set(re.findall(
              r'''\b(?:pageId|page_id|bookId|book_id|volumeId|volume_id|urlEncryptType|picUrl|thumbUrl|uri)\b''',
              all_js,
              re.I,
          )))

          result = {
              "schema": "SHIDIAN-ZIWEI-QUANSHU-READER-IMAGE-PROTOCOL-R1",
              "target_page_id": TARGET_PAGE_ID,
              "asset_base_from_direct_html_script": base,
              "reader_asset_paths_from_direct_manifest": asset_paths,
              "reader_asset_urls": asset_urls,
              "records": records,
              "endpoint_literals": endpoint_literals[:4000],
              "request_key_literals": key_literals,
              "ocr_used": False,
              "authentication_or_paywall_bypass_attempted": False,
              "identifier_bruteforce_attempted": False,
              "target_image_requested": False,
              "target_glyphs_read": False,
              "late_zi_algorithm_effect": "NONE",
          }
          (OUT / "shidian-reader-protocol.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              "asset_count": len(asset_urls),
              "successful_asset_count": sum(bool(x.get("ok")) for x in records),
              "endpoint_literal_count": len(endpoint_literals),
              "request_keys": key_literals,
          }, ensure_ascii=False, indent=2))

      - name: Resolve Shidian image-list provider
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          PAGE = OUT / "shidian-volume5.html"
          text = PAGE.read_text(encoding="utf-8", errors="replace")
          UA = "Mozilla/5.0 research-only historical-facsimile image-list provider probe"

          direct_script_urls = [
              html.unescape(x).replace("\\u002F", "/")
              for x in re.findall(
                  r'''<script[^>]+src=["']([^"']+)["']''',
                  text,
                  re.I,
              )
          ]
          bases = []
          for u in direct_script_urls:
              marker = "/guji/shidian/"
              if marker in u:
                  base = u.split(marker, 1)[0] + marker
                  if base.startswith("//"):
                      base = "https:" + base
                  if base not in bases:
                      bases.append(base)
          if not bases:
              raise SystemExit("Shidian asset base not exposed")
          base = bases[0]

          manifest_keys = (
              "__session/(lang$)/book/$",
              "read/page",
              "Reader-Image",
          )
          asset_paths = []
          manifest_records = []
          for key in manifest_keys:
              marker = '"' + re.escape(key) + r'":\{"chunkIds":\[(.*?)\],"assets":\[(.*?)\],"referenceCssAssets"'
              m = re.search(marker, text, re.S)
              if not m:
                  manifest_records.append({"key": key, "found": False, "assets": []})
                  continue
              paths = [
                  html.unescape(x).replace("\\u002F", "/")
                  for x in re.findall(r'"([^"]+\.js)"', m.group(2))
              ]
              manifest_records.append({"key": key, "found": True, "assets": paths})
              for p in paths:
                  if p not in asset_paths:
                      asset_paths.append(p)

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read()
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "data": b""}

          records = []
          combined = []
          for i, p in enumerate(asset_paths, 1):
              url = urllib.parse.urljoin(base, p)
              r = get(url)
              data = r.pop("data")
              js = data.decode("utf-8", "replace")
              combined.append(js)
              (OUT / f"image-provider-{i:02d}.js").write_bytes(data)

              contexts = []
              for term in (
                  "imageList", "picUrl", "previewPages", "pageId", "volumeId",
                  "bookId", "ancientlib", "/api/", "urlEncryptType",
              ):
                  for m in list(re.finditer(term, js, re.I))[:60]:
                      block = js[max(0, m.start()-1600):m.start()+5000]
                      if any(k in block for k in (
                          "imageList", "picUrl", "previewPages", "pageId",
                          "ancientlib", "/api/",
                      )):
                          contexts.append({"term": term, "context": block})
              records.append({
                  "asset_path": p,
                  "url": url,
                  **r,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest() if data else None,
                  "contexts": contexts[:250],
              })

          all_js = "\n".join(combined)
          direct_literals = sorted(set(
              html.unescape(x)
              for x in re.findall(
                  r'''["']([^"']*(?:ancientlib|/api/|imageList|picUrl|previewPages|pageId|volumeId|bookId|urlEncryptType)[^"']*)["']''',
                  all_js,
                  re.I,
              )
              if 0 < len(x) < 1500
          ))
          module_candidates = sorted(set(re.findall(
              r'''(\d{3,6}):function\([^)]*\)\{(?=.{0,5000}(?:imageList|picUrl|previewPages|ancientlib))''',
              all_js,
              re.I | re.S,
          )))

          result = {
              "schema": "SHIDIAN-ZIWEI-QUANSHU-IMAGE-LIST-PROVIDER-R1",
              "asset_base": base,
              "manifest_records": manifest_records,
              "records": records,
              "direct_literals": direct_literals[:6000],
              "module_candidates": module_candidates,
              "ocr_used": False,
              "authentication_or_paywall_bypass_attempted": False,
              "identifier_bruteforce_attempted": False,
              "target_page_id": "7330179103183667235",
              "target_image_requested": False,
              "target_glyphs_read": False,
              "late_zi_algorithm_effect": "NONE",
          }
          (OUT / "shidian-image-list-provider.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              "manifest_records": manifest_records,
              "asset_count": len(asset_paths),
              "successful_assets": sum(bool(x.get("ok")) for x in records),
              "direct_literal_count": len(direct_literals),
              "module_candidates": module_candidates,
          }, ensure_ascii=False, indent=2))

      - name: Resolve target scan through public browser client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check selenium
          python <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          OUT = Path("probe")
          OUT.mkdir(exist_ok=True)

          URL = "https://www.shidianguji.com/zh/book/SDZJ0170/chapter/1jvzop58rvpyq"
          BOOK_ID = "SDZJ0170"
          VERSION = 49
          START_PAGE = 313
          CHAPTER_END_PAGE = 382
          FETCH_END_PAGE = 383
          TARGET_PAGE_ID = "7330179103183667235"

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1440,1200")
          options.add_argument("--lang=zh-CN")
          options.set_capability("goog:loggingPrefs", {"performance": "ALL"})

          result = {
              "schema": "SHIDIAN-ZIWEI-QUANSHU-TARGET-SCAN-BROWSER-ROUTE-R1",
              "chapter_url": URL,
              "book_id": BOOK_ID,
              "version": VERSION,
              "version_source": "frontend bookInfo.version -> U5.current",
              "chapter_page_range": [START_PAGE, CHAPTER_END_PAGE],
              "frontend_fetch_page_range": [START_PAGE, FETCH_END_PAGE],
              "frontend_fetch_end_rule": "endPageNumWithoutSubchapter + 1",
              "target_page_id": TARGET_PAGE_ID,
              "ocr_used": False,
              "authentication_or_paywall_bypass_attempted": False,
              "identifier_bruteforce_attempted": False,
              "browser_public_anonymous_session": True,
              "page_api_route_from_frontend_source": "POST /api/ancientlib/read/book/pages/v3/",
              "frontend_global_headers_replayed": [
                  "Client-Type: web",
                  "x-scm-version: 1.0.1.2162",
              ],
          }

          driver = webdriver.Chrome(options=options)
          try:
              driver.execute_cdp_cmd("Network.enable", {})
              driver.set_page_load_timeout(90)
              driver.get(URL)
              deadline = time.time() + 60
              sdk_ready = False
              while time.time() < deadline:
                  sdk_ready = bool(driver.execute_script(
                      "return !!(window.byted_psdk && window.byted_psdk.getPtokenStatus && window.byted_psdk.decrypt);"
                  ))
                  if sdk_ready:
                      break
                  time.sleep(1)
              result["sdk_ready"] = sdk_ready
              result["loaded_url"] = driver.current_url
              result["title"] = driver.title
              if not sdk_ready:
                  result["conclusion"] = {
                      "target_page_record_found": False,
                      "target_scan_downloaded": False,
                      "target_glyphs_read": False,
                      "late_zi_algorithm_effect": "NONE",
                      "status": "PUBLIC_BROWSER_SDK_NOT_READY",
                  }
                  (OUT / "shidian-target-scan-browser.json").write_text(
                      json.dumps(result, ensure_ascii=False, indent=2),
                      encoding="utf-8",
                  )
                  raise SystemExit(0)

              ptoken = driver.execute_async_script("""
                  const done = arguments[0];
                  Promise.resolve(window.byted_psdk.getPtokenStatus())
                    .then(v => done({ok:true, value:v}))
                    .catch(e => done({ok:false, error:String(e)}));
              """)
              result["ptoken_observation"] = {
                  "ok": bool(ptoken.get("ok")),
                  "value_type": type(ptoken.get("value")).__name__ if ptoken.get("ok") else None,
                  "value_present": bool(ptoken.get("value")) if ptoken.get("ok") else False,
                  "error": ptoken.get("error"),
                  "value_not_persisted": True,
              }
              if not ptoken.get("ok") or not ptoken.get("value"):
                  result["conclusion"] = {
                      "target_page_record_found": False,
                      "target_scan_downloaded": False,
                      "target_glyphs_read": False,
                      "late_zi_algorithm_effect": "NONE",
                      "status": "PUBLIC_BROWSER_PTOKEN_UNAVAILABLE",
                  }
                  (OUT / "shidian-target-scan-browser.json").write_text(
                      json.dumps(result, ensure_ascii=False, indent=2),
                      encoding="utf-8",
                  )
                  raise SystemExit(0)

              # Observe the site's own Reader request before issuing any research replay.
              # Persist only structural metadata; anonymous ptoken/cookie values are redacted.
              time.sleep(4)
              native_events = []
              try:
                  native_events = driver.get_log("performance")
              except Exception as exc:
                  result["native_page_api_log_error"] = repr(exc)

              native_requests = {}
              native_responses = {}
              for entry in native_events:
                  try:
                      message = json.loads(entry["message"])["message"]
                  except Exception:
                      continue
                  method = message.get("method")
                  params = message.get("params", {})
                  request_id = params.get("requestId")
                  if method == "Network.requestWillBeSent":
                      request = params.get("request", {})
                      if "/api/ancientlib/read/book/pages/v3/" not in request.get("url", ""):
                          continue
                      body = request.get("postData")
                      safe_body = None
                      if body:
                          try:
                              safe_body = json.loads(body)
                              if "ptoken" in safe_body:
                                  safe_body["ptoken"] = "__REDACTED_PRESENT__" if safe_body.get("ptoken") else ""
                          except Exception:
                              safe_body = {"parse_error": True, "bytes": len(body)}
                      headers = request.get("headers", {})
                      native_requests[request_id] = {
                          "url": request.get("url"),
                          "method": request.get("method"),
                          "post_data": safe_body,
                          "header_names": sorted(str(k) for k in headers.keys()),
                          "known_safe_headers": {
                              k: headers.get(k)
                              for k in (
                                  "Content-Type",
                                  "content-type",
                                  "Client-Type",
                                  "client-type",
                                  "x-scm-version",
                                  "Origin",
                                  "Referer",
                                  "Sec-Fetch-Mode",
                                  "Sec-Fetch-Site",
                              )
                              if k in headers
                          },
                      }
                  elif method == "Network.responseReceived" and request_id in native_requests:
                      response = params.get("response", {})
                      native_responses[request_id] = {
                          "http_status": response.get("status"),
                          "mime_type": response.get("mimeType"),
                      }

              native_target = None
              native_observations = []
              for request_id, request_meta in native_requests.items():
                  observation = {
                      "request": request_meta,
                      "response": native_responses.get(request_id, {}),
                  }
                  try:
                      body_result = driver.execute_cdp_cmd(
                          "Network.getResponseBody",
                          {"requestId": request_id},
                      )
                      raw_body = body_result.get("body", "")
                      payload = json.loads(raw_body)
                      observation["response"]["top_keys"] = (
                          sorted(payload.keys()) if isinstance(payload, dict) else []
                      )
                      if isinstance(payload, dict):
                          observation["response"]["errorCode"] = payload.get("errorCode")
                          observation["response"]["errorMsg"] = payload.get("errorMsg")
                      page_records = []
                      def walk_pages(value, depth=0):
                          if depth > 8:
                              return
                          if isinstance(value, dict):
                              if "pageId" in value or "page_id" in value:
                                  page_records.append(value)
                              for child in value.values():
                                  walk_pages(child, depth + 1)
                          elif isinstance(value, list):
                              for child in value:
                                  walk_pages(child, depth + 1)
                      walk_pages(payload)
                      observation["response"]["page_record_count"] = len(page_records)
                      for row in page_records:
                          if str(row.get("pageId", row.get("page_id", ""))) == TARGET_PAGE_ID:
                              native_target = row
                              break
                  except Exception as exc:
                      observation["response_body_error"] = repr(exc)
                  native_observations.append(observation)

              result["native_page_api_observations"] = native_observations
              result["native_target_page_record_found"] = bool(native_target)

              # Do not persist the ptoken. Use it only inside the browser page context.
              api_result = driver.execute_async_script("""
                  const done = arguments[0];
                  (async () => {
                    try {
                      const ptoken = await window.byted_psdk.getPtokenStatus();
                      const all = [];
                      for (let pageIndex = 1; 40 * (pageIndex - 1) < (383 - 313 + 1); pageIndex++) {
                        const body = {
                          bookId: "SDZJ0170",
                          pageIndex,
                          pageSize: 40,
                          startPageNum: 313,
                          endPageNum: 383,
                          version: 49,
                          needCheckVersion: true,
                          ptoken,
                          isWebpSupported: true
                        };
                        const resp = await fetch("/api/ancientlib/read/book/pages/v3/", {
                          method: "POST",
                          credentials: "include",
                          headers: {
                            "content-type": "application/json",
                            "Client-Type": "web",
                            "x-scm-version": "1.0.1.2162"
                          },
                          body: JSON.stringify(body)
                        });
                        const raw = await resp.text();
                        if (!resp.ok) {
                          done({ok:false, stage:"api", status:resp.status, body:raw.slice(0,2000)});
                          return;
                        }
                        let data;
                        try { data = JSON.parse(raw); }
                        catch (e) {
                          done({ok:false, stage:"json", status:resp.status, body:raw.slice(0,2000), error:String(e)});
                          return;
                        }
                        const pageArrays = [];
                        const walk = (value, path, depth) => {
                          if (depth > 8 || value === null || value === undefined) return;
                          if (Array.isArray(value)) {
                            const pageLike = value.filter(v =>
                              v && typeof v === "object" &&
                              ("pageId" in v || "page_id" in v)
                            );
                            if (pageLike.length) {
                              pageArrays.push({path, pages: pageLike});
                            }
                            value.forEach((v, idx) => walk(v, path + "[" + idx + "]", depth + 1));
                            return;
                          }
                          if (typeof value === "object") {
                            Object.entries(value).forEach(([k, v]) => walk(v, path + "." + k, depth + 1));
                          }
                        };
                        walk(data, "root", 0);
                        const pages = [];
                        const seen = new Set();
                        for (const group of pageArrays) {
                          for (const p of group.pages) {
                            const pid = String(p.pageId ?? p.page_id ?? "");
                            const key = pid + ":" + String(p.pageNum ?? p.page_num ?? "");
                            if (!seen.has(key)) {
                              seen.add(key);
                              pages.push(p);
                            }
                          }
                        }
                        all.push(...pages);
                        if (pageIndex === 1) {
                          window.__ZIWEI_PAGE_API_DEBUG__ = {
                            topKeys: data && typeof data === "object" ? Object.keys(data) : [],
                            pageArrayPaths: pageArrays.map(x => x.path).slice(0, 100),
                            rawExcerpt: JSON.stringify(data).slice(0, 12000)
                          };
                        }
                      }
                      const target = all.find(p =>
                        String(p.pageId ?? p.page_id ?? "") === "7330179103183667235"
                      );
                      if (!target) {
                        done({
                          ok:true,
                          pageCount:all.length,
                          debug: window.__ZIWEI_PAGE_API_DEBUG__ || null,
                          pageIds:all.map(p => String(p.pageId ?? p.page_id ?? "")).slice(0,500),
                          target:null
                        });
                        return;
                      }
                      const dec = await window.byted_psdk.decrypt(
                        target.picUrl || target.pic_url || "",
                        ptoken,
                        target.urlEncryptType ?? target.url_encrypt_type
                      );
                      done({
                        ok:true,
                        pageCount:all.length,
                        debug: window.__ZIWEI_PAGE_API_DEBUG__ || null,
                        target:{
                          pageId:String(target.pageId ?? target.page_id ?? ""),
                          pageNum:target.pageNum ?? target.page_num,
                          volumeId:String(target.volumeId ?? target.volume_id ?? ""),
                          uri:target.uri || "",
                          urlEncryptType:target.urlEncryptType ?? target.url_encrypt_type,
                          thumbUrlPresent:!!(target.thumbUrl || target.thumb_url),
                          picUrlPresent:!!(target.picUrl || target.pic_url),
                          decryptedPicUrl:(dec && dec.decrypt)
                            ? dec.data
                            : (target.picUrl || target.pic_url || ""),
                          decryptApplied:!!(dec && dec.decrypt)
                        }
                      });
                    } catch (e) {
                      done({ok:false, stage:"exception", error:String(e), stack:e && e.stack ? String(e.stack).slice(0,5000) : null});
                    }
                  })();
              """)
              result["api_result"] = {
                  "ok": api_result.get("ok"),
                  "stage": api_result.get("stage"),
                  "status": api_result.get("status"),
                  "page_count": api_result.get("pageCount"),
                  "error": api_result.get("error"),
                  "response_excerpt": api_result.get("body"),
                  "debug": api_result.get("debug"),
              }
              target = native_target
              if target:
                  decrypt_result = driver.execute_async_script("""
                      const target = arguments[0];
                      const done = arguments[arguments.length - 1];
                      (async () => {
                        try {
                          const ptoken = await window.byted_psdk.getPtokenStatus();
                          const picUrl = target.picUrl || target.pic_url || "";
                          const encType = target.urlEncryptType ?? target.url_encrypt_type;
                          const dec = await window.byted_psdk.decrypt(picUrl, ptoken, encType);
                          done({
                            ok: true,
                            decryptedPicUrl: (dec && dec.decrypt) ? dec.data : picUrl,
                            decryptApplied: !!(dec && dec.decrypt)
                          });
                        } catch (e) {
                          done({ok:false, error:String(e)});
                        }
                      })();
                  """, target)
                  target = dict(target)
                  target["decryptedPicUrl"] = decrypt_result.get("decryptedPicUrl")
                  target["decryptApplied"] = decrypt_result.get("decryptApplied")
                  result["native_target_decrypt"] = {
                      "ok": decrypt_result.get("ok"),
                      "decrypt_applied": decrypt_result.get("decryptApplied"),
                      "error": decrypt_result.get("error"),
                  }
              elif api_result.get("ok"):
                  target = api_result.get("target")
              if target:
                  scan_url = target.pop("decryptedPicUrl", None)
                  result["target_page_record"] = target
                  result["target_page_record"]["decrypted_pic_url_observed"] = bool(scan_url)
                  if scan_url:
                      # Persist provider URL only in evidence JSON; it is a public signed scan route.
                      result["target_page_record"]["scan_url"] = scan_url
                      req = urllib.request.Request(
                          scan_url,
                          headers={"User-Agent": "Mozilla/5.0 research-only historical-facsimile scan fetch"},
                      )
                      try:
                          with urllib.request.urlopen(req, timeout=60) as resp:
                              image = resp.read()
                              ctype = resp.headers.get("content-type")
                              final_url = resp.geturl()
                          suffix = ".webp"
                          if ctype and "png" in ctype.lower():
                              suffix = ".png"
                          elif ctype and ("jpeg" in ctype.lower() or "jpg" in ctype.lower()):
                              suffix = ".jpg"
                          img_path = OUT / ("shidian-target-page-" + TARGET_PAGE_ID + suffix)
                          img_path.write_bytes(image)
                          result["target_scan"] = {
                              "downloaded": True,
                              "path": str(img_path),
                              "bytes": len(image),
                              "sha256": hashlib.sha256(image).hexdigest(),
                              "content_type": ctype,
                              "final_url": final_url,
                          }
                      except Exception as exc:
                          result["target_scan"] = {
                              "downloaded": False,
                              "error": repr(exc),
                          }

              result["conclusion"] = {
                  "target_page_record_found": bool(result.get("target_page_record")),
                  "target_scan_downloaded": bool(result.get("target_scan", {}).get("downloaded")),
                  "target_glyphs_read": False,
                  "late_zi_algorithm_effect": "NONE",
                  "status": (
                      "TARGET_SCAN_DOWNLOADED_PENDING_NO_OCR_VISUAL_REVIEW"
                      if result.get("target_scan", {}).get("downloaded")
                      else "TARGET_SCAN_NOT_DOWNLOADED"
                  ),
              }
              (OUT / "shidian-target-scan-browser.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              print(json.dumps(result["conclusion"], ensure_ascii=False, indent=2))
          finally:
              driver.quit()
          PY

      - name: Upload route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naaj-ziwei-quanshu-facsimile-route-${{ github.sha }}
          path: probe/
          if-no-files-found: error
          retention-days: 30
