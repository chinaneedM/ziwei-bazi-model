name: research-yehuobian-nlc-old20-wave1-12qi
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/research/MING-DATONG-YEHUOBIAN-12QI-NLC-OLD20-FASC1-3-ATLAS-STAGING-R1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-atlas:
    strategy:
      fail-fast: false
      matrix:
        fascicle: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded no-OCR page renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --disable-pip-version-check Pillow
      - name: Download and hash original PDF and reproduce every page image
        run: python scripts/probe-yehuobian-nlc-old20-fascicles-wave1-12qi.py --fascicle ${{ matrix.fascicle }}
      - name: Archive hash manifest and source page images separately per fascicle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nlc-old20-wave1-fascicle-${{ matrix.fascicle }}-12qi
          path: artifacts/yehuobian-nlc-old20-wave1-12qi/fascicle-${{ matrix.fascicle }}/
          retention-days: 14
          if-no-files-found: warn
