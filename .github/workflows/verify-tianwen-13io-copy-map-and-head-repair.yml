name: verify-tianwen-13io-copy-map-and-head-repair
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13IO-*'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - 'docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json'
      - 'scripts/verify-tianwen-13io-copy-map-and-head-repair.py'
      - 'tests/test_tianwen_13io_copy_map_and_head_repair.py'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify-tianwen-13io-copy-map-and-head-repair.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13io_copy_map_and_head_repair.py' -v
