name: probe-tianyige-huqianjing-ming-independent-copy

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-tianyige-huqianjing-ming-independent-copy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Acquire independent Tianyi Ming Huqianjing copy and inspect edition markers
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/tianyige-huqianjing-ming-0004676'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages" "$ROOT/ocr-low"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra >/dev/null
          python -m pip install --quiet pillow
          python - <<'PY'
          import hashlib, json, pathlib, re, subprocess, tempfile, urllib.parse, urllib.request
          from PIL import Image, ImageDraw

          root=pathlib.Path("audit/tianyige-huqianjing-ming-0004676")
          title="File:Tianyige-330000-1705-0004676 虎鈐經二十卷 宋許洞撰 明刻本.pdf"
          api="https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({
              "action":"query","format":"json","formatversion":"2",
              "prop":"imageinfo","iiprop":"url|size|sha1|extmetadata","titles":title
          })
          headers={"User-Agent":"Tianwen-Provenance-Audit/1.0"}
          with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=60) as r:
              meta=json.load(r)
          page=meta["query"]["pages"][0]
          ii=page["imageinfo"][0]
          url=ii["url"]
          (root/"commons-metadata.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=240) as r:
              data=r.read()
          pdf=root/"tianyige-huqianjing-0004676.pdf"
          pdf.write_bytes(data)
          pdf_sha=hashlib.sha256(data).hexdigest()
          info=subprocess.run(["pdfinfo",str(pdf)],stdout=subprocess.PIPE,check=True).stdout.decode("utf-8",errors="replace")
          (root/"pdfinfo.txt").write_text(info,encoding="utf-8")
          m=re.search(r"^Pages:\s+(\d+)",info,re.M)
          pages=int(m.group(1)) if m else 99

          # Low-resolution full-volume OCR is locator-only. It is discarded after selecting pages.
          terms=["范欽","范钦","校刊","嘉靖","萬曆","万历","虎鈐經卷七","虎钤经卷七","傳箭","传箭","漏法","刊本","重刊","天一閣"]
          hits=[]
          tmp=pathlib.Path(tempfile.mkdtemp(prefix="huqian-low-"))
          for n in range(1,pages+1):
              prefix=tmp/f"p{n:03d}"
              subprocess.run(["pdftoppm","-f",str(n),"-singlefile","-jpeg","-r","85",str(pdf),str(prefix)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              jpg=pathlib.Path(str(prefix)+".jpg")
              proc=subprocess.run(["tesseract",str(jpg),"stdout","-l","chi_tra","--psm","6"],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False)
              txt=proc.stdout.decode("utf-8",errors="replace")
              (root/"ocr-low"/f"p{n:03d}.txt").write_text(txt,encoding="utf-8")
              compact="".join(txt.split())
              found=[t for t in terms if t in compact]
              if found:
                  hits.append({"page":n,"terms":found,"context":" ".join(txt.split())[:1800]})
              jpg.unlink(missing_ok=True)

          selected=set(range(1,min(12,pages)+1))
          selected.update(range(max(1,pages-11),pages+1))
          for h in hits:
              n=h["page"]
              selected.update(range(max(1,n-1),min(pages,n+1)+1))
          selected=sorted(selected)

          manifest=[]
          for n in selected:
              prefix=root/"pages"/f"p{n:03d}"
              subprocess.run(["pdftoppm","-f",str(n),"-singlefile","-jpeg","-r","170",str(pdf),str(prefix)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              p=pathlib.Path(str(prefix)+".jpg")
              b=p.read_bytes()
              manifest.append({"page":n,"file":p.name,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})

          # Compact contact sheets for direct human review; source page JPEGs remain primary.
          paths=sorted((root/"pages").glob("p*.jpg"))
          cols=4; per=16
          for start in range(0,len(paths),per):
              chunk=paths[start:start+per]; thumbs=[]
              for p in chunk:
                  n=int(p.stem[1:])
                  im=Image.open(p).convert("RGB")
                  tw=330; ratio=tw/im.width
                  im=im.resize((tw,max(1,int(im.height*ratio))))
                  c=Image.new("RGB",(tw,im.height+28),"white"); c.paste(im,(0,28))
                  ImageDraw.Draw(c).text((6,6),f"PDF p{n}",fill="black"); thumbs.append(c)
              cw=max(x.width for x in thumbs); ch=max(x.height for x in thumbs)
              rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new("RGB",(cols*cw,rows*ch),"white")
              for k,im in enumerate(thumbs): sheet.paste(im,((k%cols)*cw,(k//cols)*ch))
              sheet.save(root/f"contact-{start+1:03d}-{start+len(chunk):03d}.jpg",quality=90,optimize=True)

          ext=ii.get("extmetadata") or {}
          report={
              "schema":"TIANYIGE-HUQIANJING-MING-0004676-INDEPENDENT-COPY-PROBE-R1",
              "schema_version":"1.0.0",
              "commons_file_title":title,
              "source_url":url,
              "commons_sha1":ii.get("sha1"),
              "pdf_sha256":pdf_sha,
              "pdf_pages":pages,
              "catalog_control":{
                  "source_institution":"Tianyi Pavilion Museum",
                  "census_number":"330000-1705-0004676",
                  "call_number":"善2313",
                  "book_source_annotation":"朱鼎煦舊藏",
                  "edition":"明刻本 / exact Ming year unresolved from public Commons/Tianyi metadata",
                  "volumes":"1冊"
              },
              "publication_date_metadata":(ext.get("Date") or {}).get("value"),
              "low_res_ocr_hits":hits,
              "ocr_authority":"LOCATOR_ONLY_NOT_FINAL_GLYPH_OR_EDITION_DATE_AUTHORITY",
              "selected_direct_review_pages":selected,
              "page_manifest":manifest,
              "research_question":"Can this second independent Tianyi Ming-print object expose an object-specific Fan Qin/Jiajing imprint or collation marker, and does it contain the Huqian Chuanjian section?",
              "chronology_firewall":"A Jiajing Fan-Qin/Fanshi-Qishu edition family is bibliographically known, but this object remains only Ming-print dated unless object-specific title/imprint/collation evidence binds it to that edition family.",
              "product_boundary":"Probe only; no runtime rule, algorithm reopen, candidate collapse, or Sanming-parent promotion."
          }
          (root/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"pdf_sha256":pdf_sha,"pages":pages,"ocr_hits":hits,"selected":selected},ensure_ascii=False,indent=2))
          PY

      - name: Upload independent Tianyi Huqianjing probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianyige-huqianjing-ming-0004676
          path: audit/tianyige-huqianjing-ming-0004676
          if-no-files-found: error
          retention-days: 30
