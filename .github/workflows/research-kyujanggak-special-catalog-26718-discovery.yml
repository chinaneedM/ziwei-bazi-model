name: research-kyujanggak-special-catalog-26718-discovery

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-special-catalog-26718-discovery.yml"
      - "scripts/research_kyujanggak_special_catalog_26718_discovery.py"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Discover special catalog through observed official pagination links
        run: |
          python scripts/research_kyujanggak_special_catalog_26718_discovery.py \
            --output artifacts/kyujanggak-special-catalog-26718-discovery
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-special-catalog-26718-discovery-${{ github.sha }}
          path: artifacts/kyujanggak-special-catalog-26718-discovery/
          if-no-files-found: warn
          retention-days: 7
