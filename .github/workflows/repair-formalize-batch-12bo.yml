name: repair-formalize-batch-12bo

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/repair-formalize-batch-12bo.yml

permissions:
  contents: write

jobs:
  repair-and-formalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Atomically sync verifier contract and formalize Batch 12BO
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          batch_id = "BATCH-12-ZIWEI-SUNZI-HUIZHENG-KANGXI-TIMEKEEPING-PHYSICAL-COLLATION-BO"
          batch_doc = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-SUNZI-HUIZHENG-KANGXI-TIMEKEEPING-PHYSICAL-COLLATION-BO.md"

          verifier_path = Path("scripts/verify-project-continuity-state-r1.py")
          verifier = verifier_path.read_text(encoding="utf-8")
          bn_id = "BATCH-12-ZIWEI-SHIQIE-TONGSHU-ZHENGZONG-HOMOLOGOUS-PHYSICAL-COLLATION-BN"
          if batch_id not in verifier:
              needle = f'    "{bn_id}",\n]'
              replacement = f'    "{bn_id}",\n    "{batch_id}",\n]'
              if needle not in verifier:
                  raise SystemExit("cannot locate BN supplemental batch tail in continuity verifier")
              verifier = verifier.replace(needle, replacement, 1)

          old_latest = 'LATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-SHIQIE-TONGSHU-ZHENGZONG-HOMOLOGOUS-PHYSICAL-COLLATION-BN.md"'
          new_latest = f'LATEST_BATCH_DOC = "{batch_doc}"'
          if new_latest not in verifier:
              if old_latest not in verifier:
                  raise SystemExit("cannot locate BN latest-batch doc in continuity verifier")
              verifier = verifier.replace(old_latest, new_latest, 1)
          verifier_path.write_text(verifier, encoding="utf-8")

          source_workflow = Path(".github/workflows/formalize-batch-12bo-sunzi-huizheng.yml").read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source_workflow.find(start_marker)
          if start < 0:
              raise SystemExit("cannot locate Batch 12BO formalizer Python start marker")
          start += len(start_marker)
          end = source_workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit("cannot locate Batch 12BO formalizer Python end marker")
          program = dedent(source_workflow[start:end])
          exec(compile(program, ".github/workflows/formalize-batch-12bo-sunzi-huizheng.yml::<embedded-python>", "exec"), {})
          PY

          python scripts/verify-project-continuity-state-r1.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/verify-project-continuity-state-r1.py \
            docs/PROJECT-CURRENT-STATE-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-SUNZI-HUIZHENG-KANGXI-TIMEKEEPING-PHYSICAL-COLLATION-BO.md \
            docs/research/ZIWEI-SUNZI-HUIZHENG-KANGXI-TIMEKEEPING-PHYSICAL-COLLATION-R1.json
          if git diff --cached --quiet; then
            echo "Batch 12BO already atomically formalized"
            exit 0
          fi
          git commit -m "formalize Batch 12BO Sunzi Huizheng timekeeping collation"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
