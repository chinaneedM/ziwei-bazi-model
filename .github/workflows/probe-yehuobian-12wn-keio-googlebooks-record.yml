name: probe-yehuobian-12wn-keio-googlebooks-record
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-12wn-keio-googlebooks-record.yml
      - scripts/probe-yehuobian-12wn-keio-googlebooks-volume-metadata.py
      - tests/test_yehuobian_keio_googlebooks_volume_12wn.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed exact Google volume ID and historical print scope
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_yehuobian_keio_googlebooks_volume_12wn.py' -v
  capture:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve only source-issued public exact-ID Google Books Volume JSON
        run: python scripts/probe-yehuobian-12wn-keio-googlebooks-volume-metadata.py --output-dir keio-googlebooks-12wn-output
      - name: Preserve exact source metadata or access-boundary error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keio-googlebooks-firstparty-volume-12wn
          path: keio-googlebooks-12wn-output/
          retention-days: 30
          if-no-files-found: warn
