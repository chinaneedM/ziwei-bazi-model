name: research-ziwei-wanxiaolu-router-pagemap-an

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-wanxiaolu-router-pagemap-an.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bind Shidian router target-page map
        shell: python
        run: |
          import hashlib
          import html
          import json
          import pathlib
          import re
          import urllib.request

          out = pathlib.Path("wanxiaolu-router-an")
          out.mkdir(exist_ok=True)
          url = "https://www.shidianguji.com/zh/book/NGJ892411999007380140073/chapter/1lr8vrbiuyale"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 historical-provenance-research/1.0"})
          with urllib.request.urlopen(req, timeout=45) as resp:
              body = resp.read()
              status = resp.status
              final_url = resp.geturl()
              ctype = resp.headers.get("content-type")
          raw = body.decode("utf-8", errors="replace")
          (out / "page.html").write_bytes(body)

          marker = re.search(r"window\._ROUTER_DATA\s*=\s*", raw)
          if not marker:
              raise SystemExit("ROUTER_DATA not emitted")
          end = raw.find("</script>", marker.end())
          payload_text = raw[marker.end():end].strip().rstrip(";")
          payload = json.loads(payload_text)
          book = payload["loaderData"]["__session/(lang$)/book/$"]
          info = book["bookInfo"]
          target_chapter = next(c for c in info["catalog"]["chapters"] if c.get("chapterId") == "1lr8vrbiuyale")

          ordered = []
          target_lines = []
          for para in book["paragraphList"]:
              for pid in (para.get("startPageId"),):
                  if pid and pid not in ordered:
                      ordered.append(pid)
              content = json.loads(para["content"])
              for line in content.get("lines", []):
                  pp = line.get("pagePass") or {}
                  pid = pp.get("PageId")
                  if pid and pid not in ordered:
                      ordered.append(pid)
                  txt = line.get("content") or ""
                  if any(term in txt for term in ("四十四山", "二十四時", "山每每相應", "逐時逐刻考", "太陽到處", "查時", "星躔", "右第四十二章論定時")):
                      target_lines.append({
                          "lineId": line.get("lineId"),
                          "content": txt,
                          "paragraphId": para.get("paragraphId"),
                          "startPageId": para.get("startPageId"),
                          "endPageId": para.get("endPageId"),
                      })
              pid = para.get("endPageId")
              if pid and pid not in ordered:
                  ordered.append(pid)

          start_page = target_chapter["startPageNum"]
          page_map = {pid: start_page + idx for idx, pid in enumerate(ordered)}
          target_page_ids = sorted({x["startPageId"] for x in target_lines if x.get("startPageId")} | {x["endPageId"] for x in target_lines if x.get("endPageId")}, key=lambda p: page_map.get(p, 10**9))

          # Capture all explicit page-pass IDs in the target two paragraphs.
          target_paras = []
          for para in book["paragraphList"]:
              content = json.loads(para["content"])
              joined = "".join(line.get("content") or "" for line in content.get("lines", []))
              if "山每每相應" in joined or "陽到處" in joined or "右第四十二章論定時" in joined:
                  passes = [
                      (line.get("pagePass") or {}).get("PageId")
                      for line in content.get("lines", [])
                      if (line.get("pagePass") or {}).get("PageId")
                  ]
                  target_paras.append({
                      "paragraphId": para.get("paragraphId"),
                      "startPageId": para.get("startPageId"),
                      "endPageId": para.get("endPageId"),
                      "pagePassIds": passes,
                      "mapped_start_page_num": page_map.get(para.get("startPageId")),
                      "mapped_end_page_num": page_map.get(para.get("endPageId")),
                      "joined_content": joined,
                  })

          receipt = {
              "schema":"ZIWEI-WANXIAOLU-SHIDIAN-ROUTER-PAGEMAP-AN-R1",
              "requested_url":url,
              "status":status,
              "final_url":final_url,
              "content_type":ctype,
              "html_bytes":len(body),
              "html_sha256":hashlib.sha256(body).hexdigest(),
              "router_json_sha256":hashlib.sha256(payload_text.encode("utf-8")).hexdigest(),
              "source_metadata":{
                  "bookId":info.get("bookId"),
                  "bookName":info.get("bookName"),
                  "imageSource":info.get("imageSource"),
                  "library":info.get("library"),
                  "edition":info.get("edition"),
                  "totalPage":info.get("totalPage"),
                  "checkType":info.get("checkType"),
              },
              "target_chapter":target_chapter,
              "source_emitted_page_sequence_count":len(ordered),
              "source_emitted_target_paragraphs":target_paras,
              "target_line_fragments":target_lines,
              "target_page_id_to_global_page_num":{pid:page_map[pid] for pid in target_page_ids if pid in page_map},
              "page_number_mapping_method":"TARGET_CHAPTER_SOURCE_EMITTED_START_PAGE_NUM_PLUS_SOURCE_EMITTED_ORDERED_PAGE_ID_SEQUENCE",
              "page_ids_guessed":False,
              "page_numbers_guessed":False,
              "direct_physical_image_bytes_observed":False,
              "glyph_authority_claimed":False,
              "ocr_or_transcription_semantic_authority_only":True,
              "authentication_attempted":False,
              "captcha_bypass_attempted":False,
          }
          (out / "receipt.json").write_text(json.dumps(receipt, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-wanxiaolu-router-pagemap-an
          path: wanxiaolu-router-an/
