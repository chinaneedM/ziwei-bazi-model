name: verify-yehuobian-12ut-tokyo-yuran-damaged-copy-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12ut-tokyo-yuran-damaged-copy-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UT-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UT-*.md
      - scripts/verify-yehuobian-tokyo-yuran-damaged-copy-gate-12ut.py
      - tests/test_yehuobian_tokyo_yuran_damaged_copy_gate_12ut.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check continuity and source/genealogy invariants
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Check damaged physical-copy intake scope
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-tokyo-yuran-damaged-copy-gate-12ut.py
          python -m unittest discover -s tests -p 'test_yehuobian_tokyo_yuran_damaged_copy_gate_12ut.py' -v
