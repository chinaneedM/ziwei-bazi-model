name: verify-batch-12hu-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hu-exact-head.yml
      - docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-16-17-FORMAT-AUTHORITY-TRIANGULATION-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-16-17-FORMAT-AUTHORITY-TRIANGULATION-HU.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending HU status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tianwen/batch-12hu-exact-head',
              description: 'Batch 12HU exact-head verification running'
            })

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12HU exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-16-17-FORMAT-AUTHORITY-TRIANGULATION-HU'
          e=json.loads(Path('docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-16-17-FORMAT-AUTHORITY-TRIANGULATION-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          assert e['object_identity_control']['fid']=='412004000070'
          assert e['object_identity_control']['current_uid']=='UCS01003868188'
          assert e['historical_tieqin_catalog_control']['main_chars_per_line']==17
          assert e['historical_tieqin_catalog_control']['commentary_double_line_chars']==23
          assert e['historical_tieqin_catalog_control']['direct_physical_catalog_leaf_recollated_in_this_batch'] is False
          assert e['beitu1987_direct_catalog_control']['main_chars_per_line']==17
          assert e['beitu1987_direct_catalog_control']['commentary_double_line_chars']==23
          assert e['current_nlc_control']['main_chars_per_line']==16
          assert e['current_nlc_control']['commentary_double_line_chars']==23
          assert e['zhang_lijuan_physical_research_control']['no_ming_repair_trace_reported'] is True
          assert e['zhang_lijuan_physical_research_control']['full_article_retrieved'] is False
          assert e['format_tension']['current_16_metadata_defect_proved'] is False
          assert e['format_tension']['historical_17_exact_physical_count_proved'] is False
          a=e['adjudication']
          assert a['controlling_status']=='UNRESOLVED_HIGH_PRIORITY_METADATA_TENSION'
          assert a['evidence_direction']=='LEAN_17_PENDING_DIRECT_PHYSICAL_LINE_COUNT_OR_ZHANG_2018_FULLTEXT'
          assert a['additional_provenance_defect_increment_authorized'] is False
          assert a['defect_016_created'] is False
          assert a['format_normalization_authorized'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,233,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count'] >= 15
          assert state['historical_audit']['repaired_provenance_metadata_defect_count'] >= 15

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-TIEQIN-CATALOG-ZUOZHUAN-60-BAISONG-FINGERPRINT-SHIDIAN']['batch_12hu']['main_chars_per_line']==17
          assert src['EXT-BEITU-1987-GUJISHANBEN-JINGBU-ZUOZHUAN-BOOKNO3288-CORRECTED']['batch_12hu']['main_chars_per_line']==17
          assert src['EXT-NLC-META-ZUOZHUAN-UCS01003868188-CURRENT-SEARCH-20260927']['batch_12hu']['main_chars_per_line']==16
          assert src['EXT-NOPSS-ZHANG-LIJUAN-NLC-TIEQIN-YUAN-ZUOZHUAN']['batch_12hu']['full_2018_article_retrieved'] is False

          ac=e['accounting']
          assert ac['matrix_rows']==198
          assert ac['audited_rows']==166
          assert ac['current_missing_from_product_rows']==10
          assert ac['confirmed_provenance_metadata_defect_count']==15
          assert ac['repaired_provenance_metadata_defect_count']==15
          assert ac['confirmed_chart_algorithm_defect_count']==0
          assert ac['algorithm_reopen_count']==0
          assert ac['candidate_collapse_count']==0
          PY

      - name: Publish successful HU status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'tianwen/batch-12hu-exact-head',
              description: 'Batch 12HU 16-vs-17 authority gates PASS'
            })

      - name: Publish failed HU status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'tianwen/batch-12hu-exact-head',
              description: 'Batch 12HU exact-head verification FAILED'
            })

# exact-head refresh: HU
