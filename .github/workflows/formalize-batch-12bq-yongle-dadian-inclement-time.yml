          ```text
          Yongle-Dadian 四字經序: 天陰雨露時難定，便是神仙也有差
          1581 Jielan:             天陰雨下時難定，便是神仙也有差
          ```

          This is strong phrase-level and semantic continuity. It establishes an **early shared inclement-birth-time formula/motif**, but not direct copying, author identity, or a single school lineage. `雨露` versus `雨下` is preserved as a textual variant rather than silently normalized.

          ## 6. Later received-text control

          A modern 2010 edition, 《男命女命前定數》, states that its base text came from a manuscript supplied by 梁湘潤 and reproduces the same `四字經序` passage. This is useful received-text continuity control only. It is not an independent early witness and receives zero early-physical or school votes.

          Control URL: `{NCC_URL}`.

