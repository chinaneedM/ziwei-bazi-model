name: verify-yehuobian-12xb-registry-snapshot-growth
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12xb-registry-snapshot-growth.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12XB-*
      - scripts/verify-yehuobian-four-era-paratext-12wk.py
      - scripts/verify-yehuobian-cadal-first-fascicle-dual-original-12wm.py
      - scripts/verify-yehuobian-keio-googlebooks-access-boundary-12wo.py
      - scripts/verify-yehuobian-12ws-tokyo-shanben-scope.py
      - tests/test_yehuobian_registry_snapshot_growth_12xb.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate live 706 manifest and historical 705 snapshot without glyph promotion
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python -m unittest discover -s tests -p 'test_yehuobian_registry_snapshot_growth_12xb.py' -v
