name: verify-yehuobian-12xf-utokyo-digital-access
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12xf-utokyo-digital-access.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12XF-*
      - scripts/verify-yehuobian-utokyo-digital-access-12xf.py
      - tests/test_yehuobian_utokyo_digital_access_12xf.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-utokyo-digital-access-12xf.py
          python -m unittest discover -s tests -p 'test_yehuobian_utokyo_digital_access_12xf.py' -v
