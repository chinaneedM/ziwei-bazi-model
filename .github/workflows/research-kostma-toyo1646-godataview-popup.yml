name: research-kostma-toyo1646-godataview-popup

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-kostma-toyo1646-godataview-popup.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Capture official goDataViewOrg and any emitted popup
        shell: python
        run: |
          import json,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          OUT=Path("probe"); OUT.mkdir()
          URL="https://kostma.aks.ac.kr/dataSearch/dataSearchList.aspx?cateQ=aksBook&curPage=72&fq=com_%ED%98%84%EC%86%8C%EC%9E%A5%EC%B2%98_fct:%EC%9D%BC%EB%B3%B8+%EB%8F%99%EC%96%91%EB%AC%B8%EA%B3%A0&pageSize=20&query=&sType=&sort="
          UCI="RIKS+CRMA+KSM-WZ.0000.0000-20140423.TOYO_1646"
          result={"schema":"ZIWEI-KOSTMA-TOYO1646-GODATAVIEW-POPUP-R1","source_url":URL,"uci":UCI,
                  "action_origin":"EXACT_CURRENT_KOSTMA_GODATAVIEW_BINDING",
                  "route_guessing_attempted":False,"page_enumeration_attempted":False,"authentication_attempted":False}
          opts=Options(); opts.add_argument("--headless=new"); opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage"); opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1800,3200"); opts.add_argument("--lang=ko-KR")
          opts.add_argument("--disable-popup-blocking")
          opts.set_capability("goog:loggingPrefs",{"performance":"ALL","browser":"ALL"})
          d=webdriver.Chrome(options=opts)
          try:
            d.set_page_load_timeout(90); d.get(URL); time.sleep(8)
            result["goDataView_source"]=d.execute_script("return goDataView.toString();")
            result["goDataViewOrg_type"]=d.execute_script("return typeof goDataViewOrg;")
            result["goDataViewOrg_source"]=d.execute_script("return (typeof goDataViewOrg==='function') ? goDataViewOrg.toString() : null;")
            result["handles_before"]=d.window_handles
            result["current_before"]=d.current_window_handle
            result["url_before"]=d.current_url
            d.execute_script("goDataView(arguments[0], '');",UCI)
            time.sleep(12)
            result["handles_after"]=d.window_handles
            result["current_after"]=d.current_window_handle
            windows=[]
            for n,h in enumerate(d.window_handles):
              try:
                d.switch_to.window(h); time.sleep(2)
                rec={"index":n,"handle":h,"url":d.current_url,"title":d.title}
                try:
                  rec["body"]=d.find_element(By.TAG_NAME,"body").text[:120000]
                  (OUT/f"window-{n}.html").write_text(d.page_source,encoding="utf-8")
                  d.save_screenshot(str(OUT/f"window-{n}.png"))
                except Exception: pass
                windows.append(rec)
              except Exception as e:
                windows.append({"index":n,"handle":h,"error":type(e).__name__+": "+str(e)})
            result["windows"]=windows

            net=[]
            for entry in d.get_log("performance"):
              try:
                m=json.loads(entry["message"])["message"]
                if m.get("method")!="Network.responseReceived": continue
                p=m.get("params",{}); resp=p.get("response",{}); u=resp.get("url","")
                if "kostma.aks.ac.kr" in u:
                  net.append({"url":u,"status":resp.get("status"),"mimeType":resp.get("mimeType"),"type":p.get("type")})
              except Exception: pass
            seen=set(); ded=[]
            for x in net:
              k=(x["url"],x.get("status"),x.get("mimeType"))
              if k not in seen: seen.add(k); ded.append(x)
            result["observed_network"]=ded[:4000]
            result["browser_logs"]=d.get_log("browser")[:500]
          except Exception as e:
            result["error"]=type(e).__name__+": "+str(e)
          finally:
            d.quit()
          result["adjudication"]={"popup_or_detail_route":"BOUND_IF_NEW_WINDOW_OR_FUNCTION_SOURCE_EXPOSES_IT",
                                  "target_page_observed":False,"independent_hai_glyph_vote_added":0,"algorithm_effect":"NONE"}
          (OUT/"probe.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
            "goDataViewOrg_type":result.get("goDataViewOrg_type"),
            "goDataViewOrg_source":result.get("goDataViewOrg_source"),
            "handles_before":result.get("handles_before"),"handles_after":result.get("handles_after"),
            "windows":result.get("windows"),
            "observed_network":result.get("observed_network",[])[:700],
            "error":result.get("error"),"adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))

      - name: Upload KOSTMA popup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-kostma-toyo1646-godataview-popup
          path: probe/
          if-no-files-found: warn
          retention-days: 14
