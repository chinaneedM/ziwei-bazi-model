name: Tianwen G893 two-folio original discriminator

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/tianwen-13ti-g893-two-folio-direct.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-two-folio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install existing archive browser dependency
        run: |
          npm install --no-save --silent puppeteer-core@24.16.0
          python -m pip install --quiet pillow
      - name: Fetch public original 023b and 036b with existing provider viewer flow
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const book='GK00893_00', vol='0001';
          const expected={
            '023b':'f5f732a4db9636ab563af47a5c8332e1f00eed1e587cc138d150da53f557d94f',
            '036b':'8acb0c32bcdd0be8827bc2851f089bf5d73a2378c3b7ffcfa80eeaf725d1dd84'
          };
          const executablePath=process.env.CHROME || '/usr/bin/google-chrome';
          const browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-setuid-sandbox']});
          try {
            const p=await browser.newPage();
            await p.setUserAgent('Mozilla/5.0 Tianwen-Provenance-Audit/1.0');
            await p.goto('https://kyudb.snu.ac.kr/book/list.do?book_cate=SIC04&mid=GDS',{waitUntil:'networkidle2',timeout:90000});
            await Promise.all([
              p.waitForNavigation({waitUntil:'networkidle2',timeout:90000}),
              p.evaluate(book=>{
                const f=document.getElementById('frmBookSearchInf');
                f.querySelector('#book_cd').value=book;
                f.querySelector('#target').value='master';
                f.action='/book/view.do'; f.method='post'; f.submit();
              },book)
            ]);
            const before=new Set(browser.targets().map(t=>t._targetId));
            await p.evaluate(book=>window.fn_originalImg('SIC',book,'',''),book);
            let viewer=null;
            for(let i=0;i<40 && !viewer;i++){
              await new Promise(r=>setTimeout(r,500));
              for(const t of browser.targets()){
                if(t.type()==='page' && !before.has(t._targetId) && t.url().includes('/pf01/rendererImg.do')){
                  viewer=await t.page(); break;
                }
              }
            }
            if(!viewer)throw Error('First-party original image viewer not resolved');
            for(const [folio,sha] of Object.entries(expected)){
              const fn=book+'IH_'+vol+'_'+folio+'.jpg';
              const sourcePath='/data01/stream/SIC/IMG/'+book+'/'+book+'_'+vol+'/'+fn;
              const url='https://kyudb.snu.ac.kr/ImageServlet.do?imgFileNm='+encodeURIComponent(fn)+'&path='+encodeURIComponent(sourcePath);
              let buf=null,status=null;
              const imgPage=await browser.newPage();
              await imgPage.setUserAgent('Mozilla/5.0 Tianwen-Provenance-Audit/1.0');
              for(let attempt=1;attempt<=3;attempt++){
                try{
                  const resp=await imgPage.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                  status=resp?.status();
                  if(resp?.ok()){
                    const candidate=await resp.buffer();
                    if(candidate.length>5000){buf=candidate;break;}
                  }
                }catch(e){console.log('FETCH_RETRY',folio,attempt,String(e).slice(0,120));}
                await new Promise(r=>setTimeout(r,500*attempt));
              }
              await imgPage.close();
              if(!buf)throw Error('No JPEG from original provider '+folio+' status '+status);
              const hash=crypto.createHash('sha256').update(buf).digest('hex');
              console.log('ORIGINAL_JPEG',folio,'bytes',buf.length,'sha256',hash,'match_previously_archived',hash===sha);
              if(hash!==sha)throw Error('Source image hash mismatch: '+folio);
              fs.writeFileSync('/tmp/tianwen-original-'+folio+'.jpg',buf);
            }
          }finally{await browser.close();}
          JS
      - name: Emit two minimal target-column research crops for direct human glyph check
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from io import BytesIO
          import hashlib,base64
          for folio,rect in [('023b',(690,210,1150,1780)),('036b',(290,210,800,1780))]:
              im=Image.open('/tmp/tianwen-original-'+folio+'.jpg').convert('RGB')
              assert im.size==(1150,2000),(folio,im.size)
              raw=im.crop(rect)
              pixel_sha=hashlib.sha256(raw.tobytes()).hexdigest()
              buf=BytesIO();raw.save(buf,format='JPEG',quality=91,subsampling=0)
              out=buf.getvalue()
              print('SOURCE_CROP',folio,'rect',rect,'rgb_sha256',pixel_sha,'crop_jpeg_sha256',hashlib.sha256(out).hexdigest(),'bytes',len(out),flush=True)
              b64=base64.b64encode(out).decode()
              for i in range(0,len(b64),1600):
                  print(f'TIANWEN_G893_CROP_{folio}_{i//1600:04d}={b64[i:i+1600]}',flush=True)
          PY
