name: extract-tieqin-qing-ms-v15-target-window

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/extract-tieqin-qing-ms-v15-target-window.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export volume 15 source-bound target window
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/tieqin-qing-ms-v15-target-window'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python -m pip install --quiet pillow

          URL='https://upload.wikimedia.org/wikipedia/commons/1/1c/Tianyige-330000-1705-0004561_%E9%90%B5%E7%90%B4%E9%8A%85%E5%8A%8D%E6%A8%93%E8%97%8F%E6%9B%B8%E7%9B%AE%E9%8C%84_%E6%B8%85%E7%9E%BF%E9%8F%9E%E7%B7%A8_%E6%B8%85%E6%8A%84%E6%9C%AC.pdf'
          curl -fL --retry 4 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"
          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source-sha256.txt"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"
          pdftoppm -f 386 -l 405 -png -r 300 "$ROOT/source.pdf" "$ROOT/pages/page" >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import hashlib,json,re
          root=Path('audit/tieqin-qing-ms-v15-target-window')
          pages=sorted((root/'pages').glob('page-*.png'),key=lambda p:int(re.search(r'-(\d+)\.png$',p.name).group(1)))
          manifest=[]; thumbs=[]
          for p in pages:
              n=int(re.search(r'-(\d+)\.png$',p.name).group(1))
              im=Image.open(p).convert('RGB')
              manifest.append({'pdf_page':n,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'width':im.width,'height':im.height,'file':p.name})
              tw=720; t=im.resize((tw,max(1,int(im.height*tw/im.width))))
              c=Image.new('RGB',(tw,t.height+42),'white'); c.paste(t,(0,42))
              ImageDraw.Draw(c).text((10,10),f'PDF p{n}',fill='black'); thumbs.append(c)
          cols=2; cw=max(x.width for x in thumbs); ch=max(x.height for x in thumbs); rows=(len(thumbs)+1)//2
          sheet=Image.new('RGB',(cols*cw,rows*ch),'white')
          for i,t in enumerate(thumbs): sheet.paste(t,((i%2)*cw,(i//2)*ch))
          sheet.save(root/'contact-p386-p405.jpg',quality=96)
          report={'schema':'TIEQIN-QING-MS-V15-TARGET-WINDOW-R1',
                  'source_pdf_sha256':hashlib.sha256((root/'source.pdf').read_bytes()).hexdigest(),
                  'volume15_start_page':386,'window':'PDF p386-p405',
                  'authority':'DIRECT_300DPI_PAGE_IMAGES_NO_OCR_FINAL_AUTHORITY','manifest':manifest}
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          rm "$ROOT/source.pdf"

      - name: Upload target window
        uses: actions/upload-artifact@v4
        with:
          name: tieqin-qing-ms-v15-target-window-r1
          path: audit/tieqin-qing-ms-v15-target-window
          if-no-files-found: error
          retention-days: 30
