name: verify-yehuobian-12vj-yujideng-attribution-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12vj-yujideng-attribution-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VJ-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VJ-*.md
      - scripts/verify-yehuobian-yujideng-correction-12vj.py
      - tests/test_yehuobian_yujideng_correction_12vj.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify continuity source registry and transmission genealogy
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Check 12VJ scoped correction and nineteen regressions
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-yujideng-correction-12vj.py
          python -m unittest discover -s tests -p 'test_yehuobian_yujideng_correction_12vj.py' -v
