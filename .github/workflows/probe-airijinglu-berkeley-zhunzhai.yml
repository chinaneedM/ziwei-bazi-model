name: probe-airijinglu-berkeley-zhunzhai

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-airijinglu-berkeley-zhunzhai.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe Berkeley record and source-bound PDF route
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/airijinglu-berkeley-zhunzhai'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python -m pip install --quiet pillow

          REC='https://digicoll.lib.berkeley.edu/record/73427'
          PDF='https://digicoll.lib.berkeley.edu/record/73427/files/0000000096282690c2_1A023.pdf'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36'

          : > "$ROOT/probe.txt"
          for URL in "$REC?of=xm" "$REC?of=xm&ot=" "$PDF" "$PDF?download=1"; do
            echo "URL=$URL" | tee -a "$ROOT/probe.txt"
            curl -sSIL --max-time 30 -A "$UA" -e "$REC" "$URL" | tee -a "$ROOT/probe.txt" || true
            echo '---' | tee -a "$ROOT/probe.txt"
          done

          ok=0
          for URL in "$PDF" "$PDF?download=1"; do
            rm -f "$ROOT/source.pdf"
            if curl -fL --retry 2 --retry-delay 2 --max-time 90 -A "$UA" -e "$REC" "$URL" -o "$ROOT/source.pdf"; then
              if head -c 5 "$ROOT/source.pdf" | grep -q '%PDF-'; then
                ok=1
                echo "PDF_OK=$URL" | tee -a "$ROOT/probe.txt"
                break
              fi
            fi
          done

          if [ "$ok" -ne 1 ]; then
            rm -f "$ROOT/source.pdf"
            printf '{"schema":"AIRIJINGLU-BERKELEY-PROBE-R1","record":"73427","pdf_obtained":false,"final_glyph_authority":"NONE","search_index_locator_only":true}\n' > "$ROOT/report.json"
            exit 0
          fi

          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source-sha256.txt"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"

          python - <<'PY'
          from pathlib import Path
          import subprocess, json, re, hashlib
          root=Path('audit/airijinglu-berkeley-zhunzhai')
          info=(root/'pdfinfo.txt').read_text(errors='ignore')
          m=re.search(r'^Pages:\s+(\d+)',info,re.M)
          pages=int(m.group(1)) if m else 0
          terms=['準齋','准齋','孫逢古','孙逢古','分界定數二十有五','二十五箭','冬至後自第一','夏至後自二十五']
          hits=[]
          for p in range(1,pages+1):
              proc=subprocess.run(['pdftotext','-f',str(p),'-l',str(p),'-layout',str(root/'source.pdf'),'-'],
                                  stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              txt=proc.stdout.decode('utf-8','ignore')
              found=[t for t in terms if t in txt]
              if found:
                  hits.append({'pdf_page':p,'terms':found,'text':' '.join(txt.split())[:1600]})
          (root/'locator.json').write_text(json.dumps({'terms':terms,'hits':hits},ensure_ascii=False,indent=2)+'\n')
          cand=sorted(set(x['pdf_page'] for x in hits))
          if cand:
              lo=max(1,min(cand)-1); hi=min(pages,max(cand)+1)
              subprocess.run(['pdftoppm','-f',str(lo),'-l',str(hi),'-png','-r','300',
                              str(root/'source.pdf'),str(root/'pages/page')],check=True,
                             stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          report={
            'schema':'AIRIJINGLU-BERKELEY-PROBE-R1',
            'record':'73427',
            'pdf_obtained':True,
            'source_pdf_sha256':hashlib.sha256((root/'source.pdf').read_bytes()).hexdigest(),
            'page_count':pages,
            'embedded_text_locator_hits':hits,
            'rendered_candidate_pages':cand,
            'embedded_text_authority':'LOCATOR_ONLY_NOT_FINAL_GLYPH_AUTHORITY',
            'final_glyph_authority':'DIRECT_RENDER_REQUIRED'
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY

          rm -f "$ROOT/source.pdf"

      - name: Upload Berkeley probe
        uses: actions/upload-artifact@v4
        with:
          name: airijinglu-berkeley-zhunzhai-probe-r1
          path: audit/airijinglu-berkeley-zhunzhai
          if-no-files-found: error
          retention-days: 30
