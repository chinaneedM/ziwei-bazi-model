name: acquire-goryeosa-1909-summer-original-13dc
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - ".github/workflows/acquire-goryeosa-1909-summer-13dc.yml"
      - "scripts/acquire-goryeosa-1909-summer-13dc.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF image extraction and JPG support
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<1.28" "Pillow>=10,<12" requests
      - name: Source SHA-verified original 1909 Goryeosa summer page atlas
        run: python scripts/acquire-goryeosa-1909-summer-13dc.py
      - name: Archive immutable source-native images and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goryeosa-nlc416-1909-summer-13dc-original
          path: goryeosa-13dc-summer-original/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
