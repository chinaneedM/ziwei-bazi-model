name: render-sishi-qihou-cadal02090387-jingtai6

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-sishi-qihou-cadal02090387-jingtai6.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install DJVU and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y djvulibre-bin poppler-utils
          python -m pip install pillow

      - name: Download CADAL02090387 Sishi Qihou Jijie
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/pages evidence/contact
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/CADAL02090387%20%E5%9B%9B%E6%99%82%E6%B0%A3%E5%80%99%E9%9B%86%E8%A7%A3.djvu'
          curl -L --fail --retry 3 --retry-delay 2 "$url" -o evidence/sishi_qihou_cadal02090387.djvu
          sha256sum evidence/sishi_qihou_cadal02090387.djvu | tee evidence/source.sha256
          djvused evidence/sishi_qihou_cadal02090387.djvu -e n | tee evidence/djvu-page-count.txt

      - name: Convert and render every physical page without OCR
        shell: bash
        run: |
          set -euo pipefail
          ddjvu -format=pdf evidence/sishi_qihou_cadal02090387.djvu evidence/sishi_qihou_cadal02090387.pdf
          pdfinfo evidence/sishi_qihou_cadal02090387.pdf | tee evidence/pdfinfo.txt
          pdftoppm -jpeg -jpegopt quality=94 -r 170 evidence/sishi_qihou_cadal02090387.pdf evidence/pages/page
          n=$(find evidence/pages -maxdepth 1 -name 'page-*.jpg' | wc -l)
          echo "RENDERED_PAGE_COUNT=$n" | tee evidence/render-count.txt
          test "$n" -gt 0
          sha256sum evidence/pages/*.jpg | sort -V > evidence/pages.sha256
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          pages=sorted(Path('evidence/pages').glob('page-*.jpg'), key=lambda p:int(p.stem.split('-')[-1]))
          for i in range(0,len(pages),8):
              batch=pages[i:i+8]
              thumbs=[]
              for p in batch:
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((420,680))
                  canvas=Image.new('RGB',(440,720),'white')
                  canvas.paste(im,((440-im.width)//2,26))
                  ImageDraw.Draw(canvas).text((8,6),p.name,fill='black')
                  thumbs.append(canvas)
              rows=(len(thumbs)+3)//4
              sheet=Image.new('RGB',(4*440,rows*720),'white')
              for j,im in enumerate(thumbs):
                  sheet.paste(im,((j%4)*440,(j//4)*720))
              a=i+1;b=i+len(batch)
              sheet.save(f'evidence/contact/contact-{a:03d}-{b:03d}.jpg',quality=92)
          PY
          sha256sum evidence/contact/*.jpg | sort -V > evidence/contact.sha256
          cat > evidence/manifest.txt <<'EOF'
          NO_OCR_USED=true
          SOURCE=CADAL02090387 四時氣候集解
          SOURCE_ROLE=DIRECT_PHYSICAL_COLLATION_TARGET
          EDITION_BINDING=明景泰六年胡廷璨刻本（上海圖書館藏；續修四庫全書第885冊與公開書目綁定）
          TARGET=PRE1578_TONGSHU_DAY_NIGHT_KE_TABLE_AND_SANMING_CHANGE_FINGERPRINT_CONTROL
          NOTE=NCL03164_IS_OLD_MANUSCRIPT_AND_MUST_NOT_BE_DATED_PRE1578_FROM_INTERNAL_PREFACE_POSTFACE_ALONE
          EOF

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: sishi-qihou-cadal02090387-jingtai6-physical-facsimile
          path: evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
