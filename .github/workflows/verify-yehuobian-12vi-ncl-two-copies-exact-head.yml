name: verify-yehuobian-12vi-ncl-two-copies-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12vi-ncl-two-copies-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VI-*.json
      - scripts/verify-yehuobian-ncl-copies-12vi.py
      - tests/test_yehuobian_ncl_copies_12vi.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify continuity source registry and genealogy
        run: |
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: 12VI exact copy IDs and 15 negative guards
        run: |
          python scripts/verify-yehuobian-ncl-copies-12vi.py
          python -m unittest discover -s tests -p 'test_yehuobian_ncl_copies_12vi.py' -v
