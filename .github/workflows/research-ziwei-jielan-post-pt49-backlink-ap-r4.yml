name: research-ziwei-jielan-post-pt49-backlink-ap-r4

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-jielan-post-pt49-backlink-ap-r4.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Search known post-PT49 headings and follow only source-emitted page routes
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          out=Path("batch12ap-r4"); out.mkdir(exist_ok=True)
          vid="rZRcCwAAQBAJ"

          def get(url,name):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read(); status=r.status; final=r.geturl(); ctype=r.headers.get("Content-Type")
              except Exception as e:
                  return {"url":url,"error":repr(e)}
              (out/name).write_bytes(data)
              return {"url":url,"final_url":final,"http_status":status,"content_type":ctype,
                      "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}

          receipt={"scope":"KNOWN_POST_PT49_HEADINGS_TO_SOURCE_EMITTED_BACKLINKS_ONLY",
                   "access_control_bypass_attempted":False,
                   "pt49_url_constructed_by_probe":False,
                   "queries":{}, "candidate_pages":[]}

          terms=["限行得數例","限行得数例","限行反背例","限行吉凶訣","限行吉凶诀","紫微諸星廟陷歌"]
          candidate_urls=[]
          for i,term in enumerate(terms):
              u="https://books.google.com/books?jscmd=SearchWithinVolume2&q="+urllib.parse.quote(term)+"&vid="+vid
              rec=get(u,f"search-{i}.json")
              p=out/f"search-{i}.json"
              obj=json.loads(p.read_text("utf-8")) if p.exists() else {}
              results=obj.get("search_results",[])
              receipt["queries"][term]={
                  "request":rec,
                  "results":[{"page_id":x.get("page_id"),"snippet_text":x.get("snippet_text"),
                              "page_url":x.get("page_url")} for x in results]
              }
              for x in results:
                  if x.get("page_url") and x.get("page_url") not in candidate_urls:
                      candidate_urls.append(x.get("page_url"))

          # Follow only page URLs explicitly emitted by SearchWithinVolume2.
          for j,u in enumerate(candidate_urls):
              pg=urllib.parse.parse_qs(urllib.parse.urlparse(u).query).get("pg",[None])[0]
              rec=get(u,f"page-{j}-{pg or 'unknown'}.html")
              p=out/f"page-{j}-{pg or 'unknown'}.html"
              emitted=[]
              if p.exists():
                  txt=p.read_text("utf-8",errors="ignore")
                  raw=re.findall(r'https?://books\.google\.com/books/publisher/content\?[^"<> ]+',txt)
                  for x in raw:
                      x=html.unescape(x).replace("\\u0026","&")
                      if x not in emitted: emitted.append(x)
              mapped=[]
              for x in emitted:
                  q=urllib.parse.parse_qs(urllib.parse.urlparse(x).query)
                  mapped.append({"url":x,"pg":q.get("pg",[None])[0],"img":q.get("img",[None])[0],
                                 "zoom":q.get("zoom",[None])[0],"has_sig":bool(q.get("sig"))})
              item={"source_emitted_page_url":u,"page_id":pg,"request":rec,"emitted_page_map":mapped}
              receipt["candidate_pages"].append(item)

          # Follow PT49 image only if one of those source-emitted page HTML responses itself emits it.
          pt49_urls=[]
          for item in receipt["candidate_pages"]:
              for x in item["emitted_page_map"]:
                  if x.get("pg")=="PT49" and x.get("img")=="1" and x.get("url") not in pt49_urls:
                      pt49_urls.append(x["url"])
          receipt["pt49_image_urls_emitted_by_post_pages"]=pt49_urls
          fetched=[]
          for i,u in enumerate(pt49_urls):
              rec=get(u,f"PT49-{i}.bin")
              rec["source_emitted_by_post_pt49_page"]=True
              fetched.append(rec)
          receipt["pt49_images_fetched"]=fetched
          receipt["pt49_image_fetched"]=any(x.get("http_status")==200 and str(x.get("content_type","")).startswith("image/") for x in fetched)

          (out/"receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n","utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-jielan-post-pt49-backlink-ap-r4
          path: batch12ap-r4
          retention-days: 90
