name: verify-batch-12gb-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gb-exact-head.yml
      - docs/research/ZIWEI-DENG-ZHICHENG-DIARY-2007-NLCPRESS-ITEM-DOWNLOAD-SURFACE-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-DIARY-2007-NLCPRESS-ITEM-DOWNLOAD-SURFACE-BOUNDARY-GB.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GB exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-DENG-ZHICHENG-DIARY-2007-NLCPRESS-ITEM-DOWNLOAD-SURFACE-BOUNDARY-GB'
          ep=Path('docs/research/ZIWEI-DENG-ZHICHENG-DIARY-2007-NLCPRESS-ITEM-DOWNLOAD-SURFACE-BOUNDARY-R1.json')
          dp=Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-DIARY-2007-NLCPRESS-ITEM-DOWNLOAD-SURFACE-BOUNDARY-GB.md')
          assert ep.is_file() and dp.is_file()
          e=json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          i=e['first_party_item_control']
          assert i['isbn']=='978-7-5013-3477-3/K·1509'
          assert i['target_volume']==5 and i['target_notebook']==14
          assert i['target_notebook_start']=='1949-01-29'
          assert i['target_notebook_end']=='1950-02-16'
          assert i['source_emitted_related_download_labels']==['图书文件下载（TXT）','目录附件下载']
          assert i['item_specific_download_url_source_emitted_in_reviewed_parsed_surface'] is False
          assert i['target_facsimile_object_obtained'] is False
          assert i['target_text_object_obtained'] is False

          lists=e['publisher_resource_list_controls']
          assert len(lists)==2
          assert all(x['target_title_listed'] is False for x in lists)
          assert all(x['target_file_obtained'] is False for x in lists)
          assert all(x['publisher_file_absence_proved'] is False for x in lists)

          fw=e['access_and_authority_firewall']
          for key in (
              'related_download_label_presence_does_not_equal_target_file_retrieval',
              'generic_download_list_nonappearance_does_not_equal_file_absence',
              'txt_label_does_not_equal_facsimile_image_or_handwriting_authority',
              'toc_attachment_label_does_not_equal_target_page_number',
              'no_resource_id_enumeration_or_guessing',
              'no_authentication_bypass_attempted',
              'no_paywall_bypass_attempted',
              'no_provider_account_action_taken',
              'no_purchase_or_fee_incurred',
              'no_date_to_page_interpolation',
              'journal_pagination_does_not_map_to_2007_facsimile_pagination_without_direct_crosswalk',
          ):
              assert fw[key] is True

          t=e['target_status_after_batch']
          assert t['target_1950_01_29_volume']=='CLOSED_AS_VOLUME_5_NOTEBOOK_14'
          assert t['target_1950_01_29_exact_facsimile_page']=='UNRESOLVED'
          assert t['target_1950_01_29_facsimile_text']=='NOT_REVIEWED'
          assert t['target_1950_01_29_handwriting_directly_collated'] is False
          assert t['target_1950_01_29_exact_journal_page']=='UNRESOLVED'
          assert t['target_1950_01_29_primary_journal_text']=='NOT_REVIEWED'

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['schema_version']=='1.188.0'
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc'].endswith('NLCPRESS-ITEM-DOWNLOAD-SURFACE-BOUNDARY-GB.md')
          assert state['historical_audit']['row_count']==198
          assert state['historical_audit']['audited_row_count']==166
          assert state['historical_audit']['current_missing_from_product_row_count']==10
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==14
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==14
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          s=next(x for x in reg['sources'] if x.get('source_id')=='EXT-NLCPRESS-DENG-ZHICHENG-DIARY-FACSIMILE-2007')
          b=s['batch_12gb']
          assert b['related_download_labels']==['图书文件下载（TXT）','目录附件下载']
          assert b['item_specific_download_url_source_emitted_in_reviewed_parsed_surface'] is False
          assert b['target_file_obtained'] is False
          assert b['target_facsimile_page_reviewed'] is False
          assert b['generic_list_nonappearance_proves_file_absence'] is False
          assert b['no_resource_id_enumeration_or_guessing'] is True

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_row_count_change'] is False
          PY
