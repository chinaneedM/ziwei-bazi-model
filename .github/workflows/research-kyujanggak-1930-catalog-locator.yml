name: research-kyujanggak-1930-catalog-locator

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1930-catalog-locator.yml"
      - "scripts/research_kyujanggak_1930_numeric_catalog_locator.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Probe 1930 Kyujanggak numeric-order catalog object IDs
        run: |
          python scripts/research_kyujanggak_1930_numeric_catalog_locator.py \
            --output artifacts/kyujanggak-1930-catalog-locator
      - name: Upload read-only locator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1930-catalog-locator-${{ github.sha }}
          path: artifacts/kyujanggak-1930-catalog-locator/
          if-no-files-found: warn
          retention-days: 7
