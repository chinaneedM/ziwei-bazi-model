name: verify-tianwen-13lo-naaj-harvard-crosswalk
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - docs/research/TIANWEN-13LO-*
      - scripts/verify-tianwen-13lo-naaj-harvard-crosswalk.py
      - scripts/replay-tianwen-13lo-harvard-naaj-p7-p8.py
      - tests/test_tianwen_13lo_naaj_harvard_crosswalk.py
      - .github/workflows/verify-tianwen-13lo-naaj-harvard-crosswalk.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13lo-naaj-harvard-crosswalk.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13lo_naaj_harvard_crosswalk.py' -v
      - run: python -m py_compile scripts/replay-tianwen-13lo-harvard-naaj-p7-p8.py
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
