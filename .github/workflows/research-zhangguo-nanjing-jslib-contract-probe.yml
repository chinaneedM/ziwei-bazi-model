name: research-zhangguo-nanjing-jslib-contract-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-zhangguo-nanjing-jslib-contract-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe source-emitted public contract only
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          roots = ['http://zggj.jslib.org.cn/', 'https://zggj.jslib.org.cn/']
          target_title = '新編評註通玄先生張果星宗大全'
          target_title_s = '新编评注通玄先生张果星宗大全'
          ua = 'Mozilla/5.0 research-contract-probe/1.0'

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept': '*/*'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read(8_000_000)
                      return {'requested_url': url, 'status': r.status, 'final_url': r.geturl(),
                              'content_type': r.headers.get('content-type'), 'body_len': len(body),
                              'sha256': hashlib.sha256(body).hexdigest(), 'body': body}
              except Exception as e:
                  return {'requested_url': url, 'error': f'{type(e).__name__}: {e}', 'body': b''}

          out = {'schema':'JIANGSU-ANCIENT-BOOK-PLATFORM-PUBLIC-CONTRACT-PROBE-R1',
                 'roots':[], 'assets':[], 'candidate_literals':[], 'target_literal_hits':[]}
          asset_urls=[]
          base_success=None
          for root in roots:
              r=fetch(root); body=r.pop('body',b''); text=body.decode('utf-8','replace')
              r['target_literal_present'] = target_title in text or target_title_s in text
              r['html_prefix']=text[:1600]
              out['roots'].append(r)
              if body and base_success is None: base_success=r.get('final_url') or root
              for raw in re.findall(r'''(?:src|href)=["']([^"']+)["']''', text, re.I):
                  u=urllib.parse.urljoin(r.get('final_url') or root, html.unescape(raw))
                  p=urllib.parse.urlparse(u)
                  if p.hostname and p.hostname.endswith('jslib.org.cn') and (p.path.endswith('.js') or '.js?' in u):
                      asset_urls.append(u)

          for u in list(dict.fromkeys(asset_urls))[:40]:
              r=fetch(u); body=r.pop('body',b''); text=body.decode('utf-8','replace')
              r['target_literal_present']=target_title in text or target_title_s in text
              out['assets'].append(r)
              if r['target_literal_present']:
                  out['target_literal_hits'].append({'asset':u})
              c=set()
              for m in re.findall(r'''https?://[^"'\\\s<>]{4,400}''', text):
                  lo=m.lower()
                  if any(k in lo for k in ('api','book','search','catalog','resource','guji','ancient','detail','query')):
                      c.add(m[:400])
              for m in re.findall(r'''["'](/[^"'\\]{2,300})["']''', text):
                  lo=m.lower()
                  if any(k in lo for k in ('api','book','search','catalog','resource','guji','ancient','detail','query','union')):
                      c.add(m)
              for x in sorted(c): out['candidate_literals'].append({'asset':u,'literal':x})

          # Deduplicate exact asset/literal pairs.
          ded=[]; seen=set()
          for x in out['candidate_literals']:
              key=(x['asset'],x['literal'])
              if key not in seen:
                  seen.add(key); ded.append(x)
          out['candidate_literals']=ded[:1500]
          out['summary']={
              'root_success_count':sum(x.get('status')==200 for x in out['roots']),
              'js_asset_count':len(out['assets']),
              'candidate_literal_count':len(out['candidate_literals']),
              'target_literal_hit_count':len(out['target_literal_hits']),
              'policy':'CONTRACT_DISCOVERY_ONLY_SOURCE_EMITTED_ASSETS_NO_GUESSED_API_CALLS_NO_LOGIN_NO_AUTH_BYPASS'
          }
          Path('jslib-contract-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jslib-public-contract-probe
          path: jslib-contract-probe.json
          if-no-files-found: error
