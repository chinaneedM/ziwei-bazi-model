name: extract-shiliju-tiba-zhunzhai-huang-pilie

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/extract-shiliju-tiba-zhunzhai-huang-pilie.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Locate Huang Pilie Zhunzhai paratext and render direct pages
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/shiliju-tiba-zhunzhai-huang-pilie'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/locator" "$ROOT/hires"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-chi-tra-vert >/dev/null
          python -m pip install --quiet pillow

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-001926727-315344%20%E5%A3%AB%E7%A6%AE%E5%B1%85%E8%97%8F%E6%9B%B8%E9%A1%8C%E8%B7%8B%E8%A8%98%20%E5%85%AD%E5%8D%B7%20%E7%AC%AC1%E5%86%8A.pdf'
          curl -fL --retry 4 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"
          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source-sha256.txt"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"
          pdftoppm -jpeg -r 130 "$ROOT/source.pdf" "$ROOT/locator/page" >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageEnhance
          import subprocess,json,hashlib,re
          root=Path('audit/shiliju-tiba-zhunzhai-huang-pilie')
          pages=sorted((root/'locator').glob('page-*.jpg'), key=lambda p:int(p.stem.rsplit('-',1)[1]))
          terms=['銅壺漏箭','銅壼漏箭','準齋','准齋','几漏','幾漏','文淵閣','癸未','蕘夫','影宋','錄副','流傳未廣']
          hits=[]
          for p in pages:
              n=int(p.stem.rsplit('-',1)[1])
              im=Image.open(p).convert('L')
              im=ImageOps.autocontrast(im)
              im=ImageEnhance.Contrast(im).enhance(1.4)
              tmp=root/'_ocr.png'; im.save(tmp)
              proc=subprocess.run(['tesseract',str(tmp),'stdout','-l','chi_tra_vert','--psm','5'],
                                  stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              txt=proc.stdout.decode('utf-8','ignore')
              compact=''.join(txt.split())
              found=[t for t in terms if t in compact]
              if found:
                  hits.append({'pdf_page':n,'found':found,'context':' '.join(txt.split())[:2200]})
          if (root/'_ocr.png').exists(): (root/'_ocr.png').unlink()

          cand=sorted(set(x['pdf_page'] for x in hits))
          preserve=set()
          for n in cand:
              preserve.update(range(max(1,n-2), min(len(pages),n+2)+1))
          manifest=[]
          for n in sorted(preserve):
              base=root/'hires'/f'page-{n}'
              subprocess.run(['pdftoppm','-f',str(n),'-l',str(n),'-singlefile','-png','-r','300',
                              str(root/'source.pdf'),str(base)],check=True,
                             stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              p=Path(str(base)+'.png'); im=Image.open(p)
              manifest.append({'pdf_page':n,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                               'width':im.width,'height':im.height,'file':str(p.relative_to(root))})
          report={
            'schema':'SHILIJU-TIBA-ZHUNZHAI-HUANG-PILIE-R1',
            'source_id':'NLC892-001926727-315344',
            'source_sha256':hashlib.sha256((root/'source.pdf').read_bytes()).hexdigest(),
            'page_count':len(pages),
            'ocr_hits':hits,
            'candidate_pages':cand,
            'hires_manifest':manifest,
            'ocr_role':'LOCATOR_ONLY_NOT_FINAL_GLYPH_AUTHORITY',
            'final_authority':'DIRECT_300DPI_SOURCE_BOUND_PAGE_IMAGES'
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          PY

          rm "$ROOT/source.pdf"
          rm -f "$ROOT"/locator/*.jpg

      - name: Upload source-bound target evidence
        uses: actions/upload-artifact@v4
        with:
          name: shiliju-tiba-zhunzhai-huang-pilie-r1
          path: audit/shiliju-tiba-zhunzhai-huang-pilie
          if-no-files-found: error
          retention-days: 30
