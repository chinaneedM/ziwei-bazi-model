name: audit-gexiang-1520-zhengde-target-pages

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-gexiang-1520-zhengde-target-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Acquire and render decisive 1520 Gexiang pages
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/gexiang-1520-zhengde-target-pages'
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-1253-204870%20%E9%87%8D%E5%88%8A%E9%9D%A9%E8%B1%A1%E6%96%B0%E6%9B%B8%20%E7%AC%AC1%E5%86%8A.pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/vol1.pdf"

          sha256sum "$ROOT/vol1.pdf" | tee "$ROOT/source.sha256"
          pdfinfo "$ROOT/vol1.pdf" | tee "$ROOT/pdfinfo.txt"

          for p in 5 35 36; do
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 360 "$ROOT/vol1.pdf" "$ROOT/page-$p"
          done
          sha256sum "$ROOT"/page-*.png | sort -V | tee "$ROOT/pages.sha256"

          cat > "$ROOT/manifest.txt" <<'EOF'
SOURCE=NLC892-1253-204870 重刊革象新書 第1冊
CATALOG_IDENTITY=平圖011907
CATALOG_EDITION=明正德庚辰十五年(1520)宣威公署刊本
PAGE_5_ROLE=edition/preface date locator observed in compact scan
PAGE_35_ROLE=時分百刻 section opening
PAGE_36_ROLE=時分百刻 continuation and volume ending
RENDER_DPI=360
OCR_USED_FOR_FINAL_GLYPH_CLAIMS=false
TEXT_LAYER_ROLE=NONE_FOR_FINAL_GLYPH_CLAIMS
EOF

          rm "$ROOT/vol1.pdf"

      - name: Upload decisive target pages
        uses: actions/upload-artifact@v4
        with:
          name: gexiang-1520-zhengde-target-pages
          path: audit/gexiang-1520-zhengde-target-pages
          if-no-files-found: error
          retention-days: 30
