name: probe-batch-12is-ndl-digital-wenwu195109

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12is-ndl-digital-wenwu195109.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Query NDL Search public SRU for digital objects
        run: |
          python - <<'PY'
          import hashlib, json, re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import quote
          import requests

          BASE="https://ndlsearch.ndl.go.jp/api/sru"
          UA={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; bounded NDL public SRU object discovery)"}

          # Small, exact query set only. No harvesting, pagination crawl, account action, or copy request.
          queries=[
              ("ndl_dl_title_trad_1951",'title="文物参考資料" AND from="1951" AND until="1951" AND dpid="ndl-dl"'),
              ("ndl_dl_title_simp_1951",'title="文物参考资料" AND from="1951" AND until="1951" AND dpid="ndl-dl"'),
              ("ndl_dl_open_title_trad_1951",'title="文物参考資料" AND from="1951" AND until="1951" AND dpid="ndl-dl-open"'),
              ("ndl_dl_open_title_simp_1951",'title="文物参考资料" AND from="1951" AND until="1951" AND dpid="ndl-dl-open"'),
              ("ndl_dl_article_trad",'title="永楽大典展覧の意義" AND dpid="ndl-dl"'),
              ("ndl_dl_article_cn",'title="永乐大典展览的意义" AND dpid="ndl-dl"'),
              ("ndl_dl_article_cn_trad",'title="永樂大典展覽的意義" AND dpid="ndl-dl"'),
          ]

          ns={
              "srw":"http://www.loc.gov/zing/srw/",
              "dc":"http://purl.org/dc/elements/1.1/",
              "dcterms":"http://purl.org/dc/terms/",
              "rdf":"http://www.w3.org/1999/02/22-rdf-syntax-ns#",
              "rdfs":"http://www.w3.org/2000/01/rdf-schema#",
          }

          def texts(root, local):
              out=[]
              for e in root.iter():
                  if e.tag.rsplit("}",1)[-1]==local and (e.text or "").strip():
                      out.append((e.text or "").strip())
              return out

          def attrs_with_value(root):
              out=[]
              for e in root.iter():
                  for k,v in e.attrib.items():
                      if v:
                          out.append(v)
              return out

          results={}
          session=requests.Session()
          session.headers.update(UA)

          for key,cql in queries:
              url=f"{BASE}?operation=searchRetrieve&maximumRecords=20&recordSchema=dcndl_v3&query={quote(cql,safe='')}"
              row={"cql":cql,"url":url}
              try:
                  r=session.get(url,timeout=45)
                  body=r.content
                  row.update({
                      "status":r.status_code,
                      "content_type":r.headers.get("Content-Type"),
                      "bytes":len(body),
                      "sha256":hashlib.sha256(body).hexdigest(),
                      "xml_parsed":False,
                      "raw_xml_saved":False,
                      "raw_xml_logged":False,
                  })
                  root=ET.fromstring(body)
                  row["xml_parsed"]=True
                  nums=texts(root,"numberOfRecords")
                  row["number_of_records"]=int(nums[0]) if nums and nums[0].isdigit() else (nums[0] if nums else None)

                  recs=[]
                  # Inspect each SRU record independently, retaining only compact bibliographic/object identifiers.
                  for rec in root.iter():
                      if rec.tag.rsplit("}",1)[-1]!="record":
                          continue
                      alltxt=" ".join((x.text or "").strip() for x in rec.iter() if (x.text or "").strip())
                      vals=attrs_with_value(rec)
                      identifiers=[
                          x for x in (texts(rec,"identifier")+vals)
                          if any(tok in x for tok in ("ndljp","ndl.go.jp","ndlsearch","R100000039","pid/"))
                      ]
                      titles=texts(rec,"title")
                      dates=texts(rec,"date")
                      creators=texts(rec,"creator")
                      rights=texts(rec,"rights")
                      recs.append({
                          "titles":titles[:8],
                          "dates":dates[:8],
                          "creators":creators[:8],
                          "rights":rights[:8],
                          "identifiers":sorted(set(identifiers))[:30],
                          "has_target_serial":("文物参考資料" in alltxt or "文物参考资料" in alltxt),
                          "has_target_article":any(x in alltxt for x in ("永乐大典展览的意义","永樂大典展覽的意義","永楽大典展覧の意義")),
                          "has_1951":("1951" in alltxt),
                          "has_issue9":bool(re.search(r'(?<!\d)(?:9|09)(?!\d)',alltxt)),
                      })
                  row["records"]=recs[:20]
              except Exception as e:
                  row["error"]=f"{type(e).__name__}: {e}"
              results[key]=row

          out={
              "endpoint":BASE,
              "query_count":len(queries),
              "results":results,
              "login_used":False,
              "account_action_used":False,
              "copy_request_used":False,
              "payment_used":False,
              "captcha_bypass_used":False,
              "tls_verification_disabled":False,
              "harvest_or_bulk_enumeration_used":False,
          }
          Path("ndl-digital-wenwu195109-sru.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: batch-12is-ndl-digital-wenwu195109-sru
          path: ndl-digital-wenwu195109-sru.json
