name: probe-batch-12is-ndl-digital-wenwu195109

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12is-ndl-digital-wenwu195109.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Calibrate NDL OpenSearch digital-provider result counts
        run: |
          python - <<'PY'
          import hashlib, json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlencode
          import requests

          BASE="https://ndlsearch.ndl.go.jp/api/opensearch"
          UA={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; bounded NDL OpenSearch calibration)"}
          queries=[
              ("positive_ndl_dl",{"cnt":"5","title":"吾輩は猫である","dpid":"ndl-dl"}),
              ("target_serial_ndl_dl",{"cnt":"20","title":"文物参考資料","from":"1951","until":"1951","dpid":"ndl-dl"}),
              ("target_serial_ndl_dl_simp",{"cnt":"20","title":"文物参考资料","from":"1951","until":"1951","dpid":"ndl-dl"}),
              ("target_serial_ndl_dl_open",{"cnt":"20","title":"文物参考資料","from":"1951","until":"1951","dpid":"ndl-dl-open"}),
              ("target_article_ndl_dl",{"cnt":"20","title":"永樂大典展覽的意義","dpid":"ndl-dl"}),
              ("target_article_ndl_dl_simp",{"cnt":"20","title":"永乐大典展览的意义","dpid":"ndl-dl"}),
              ("target_serial_all_providers",{"cnt":"20","title":"文物参考資料","from":"1951","until":"1951"}),
          ]

          def local(tag): return tag.rsplit("}",1)[-1]
          def alltext(e,name):
              return [(x.text or "").strip() for x in e.iter() if local(x.tag)==name and (x.text or "").strip()]

          s=requests.Session(); s.headers.update(UA)
          out={}
          for key,params in queries:
              url=BASE+"?"+urlencode(params)
              row={"url":url,"params":params}
              try:
                  r=s.get(url,timeout=45); body=r.content
                  root=ET.fromstring(body)
                  totals=alltext(root,"totalResults")
                  items=[x for x in root.iter() if local(x.tag)=="item"]
                  recs=[]
                  for item in items[:20]:
                      titles=alltext(item,"title")
                      links=alltext(item,"link")
                      ids=alltext(item,"identifier")
                      desc=alltext(item,"description")
                      dates=alltext(item,"date")
                      rights=alltext(item,"rights")
                      attrs=[]
                      for e in item.iter():
                          attrs.extend(v for v in e.attrib.values() if v)
                      vals=links+ids+attrs
                      recs.append({
                          "titles":titles[:5],"dates":dates[:5],"rights":rights[:5],
                          "links":links[:10],
                          "ndl_object_refs":sorted(set(v for v in vals if any(t in v for t in ("ndljp","ndl.go.jp","pid/","R100000039"))))[:30],
                          "has_target_serial":any("文物参考" in t for t in titles+desc),
                          "has_target_article":any(("永乐大典" in t or "永樂大典" in t) and ("意义" in t or "意義" in t) for t in titles+desc),
                      })
                  row.update({
                      "status":r.status_code,"content_type":r.headers.get("Content-Type"),
                      "bytes":len(body),"sha256":hashlib.sha256(body).hexdigest(),
                      "total_results":int(totals[0]) if totals and totals[0].isdigit() else (totals[0] if totals else None),
                      "item_count_returned":len(items),"items":recs,
                      "raw_xml_saved":False,"raw_xml_logged":False,
                  })
              except Exception as e:
                  row["error"]=f"{type(e).__name__}: {e}"
              out[key]=row

          final={
              "endpoint":BASE,"queries":out,
              "security":{
                  "login_used":False,"account_action_used":False,"copy_request_used":False,
                  "payment_used":False,"captcha_bypass_used":False,"tls_verification_disabled":False,
                  "harvest_or_bulk_enumeration_used":False
              }
          }
          Path("ndl-digital-wenwu195109-opensearch-counts.json").write_text(
              json.dumps(final,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(final,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12is-ndl-digital-wenwu195109-opensearch-counts
          path: ndl-digital-wenwu195109-opensearch-counts.json
