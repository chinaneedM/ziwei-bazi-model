name: probe-yonezawa-shilin-1492-likou-pages

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yonezawa-shilin-1492-likou-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Acquire first-party Yonezawa volumes 1-2 and locate 前集卷二曆候
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/yonezawa-shilin-1492-likou'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/images" "$ROOT/ocr"
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-tra >/dev/null
          python -m pip install --quiet pillow
          python - <<'PY'
          import hashlib
          import html
          import json
          import pathlib
          import re
          import subprocess
          import urllib.request

          from PIL import Image, ImageDraw, ImageOps

          root=pathlib.Path("audit/yonezawa-shilin-1492-likou")
          base="https://www.library.yonezawa.yamagata.jp/dg/"
          viewer=base+"AA060_view.html"
          headers={"User-Agent":"Mozilla/5.0 Tianwen-Provenance-Audit/1.0"}

          def fetch(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:
                  return r.read(), r.geturl(), r.headers.get("content-type")

          raw,final,ctype=fetch(viewer)
          (root/"AA060_view.html").write_bytes(raw)
          text=raw.decode("utf-8",errors="replace")

          vols=[]
          for book,pages in re.findall(r'<option\s+value=["\'](AA060\d{3}),(\d{3})["\']',text,re.I):
              idx=book[-3:]
              vols.append({"book":book,"dir":idx,"pages":int(pages)})
          if len(vols)!=12:
              raise SystemExit(f"expected 12 viewer volumes, got {vols!r}")

          target=[v for v in vols if v["dir"] in {"001","002"}]
          manifests=[]
          ocr_hits=[]
          locator_terms=["刻漏","蓮漏","莲漏","寅時","寅时","晝夜","昼夜","長短","长短","曆候","历候"]
          for v in target:
              imgs=[]
              for n in range(1,v["pages"]+1):
                  leaf=f'{n:03d}'
                  url=f'{base}data/AA060/{v["dir"]}/{v["book"]}_{leaf}.jpg'
                  data,fu,ct=fetch(url)
                  if not data.startswith(b"\xff\xd8"):
                      raise SystemExit(f"not JPEG: {url} {ct} {data[:16]!r}")
                  path=root/"images"/f'{v["book"]}_{leaf}.jpg'
                  path.write_bytes(data)
                  rec={
                      "book":v["book"],"viewer_volume":int(v["dir"]),"page":n,
                      "url":url,"final_url":fu,"content_type":ct,
                      "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()
                  }
                  imgs.append(rec)

                  # OCR is a locator only. It never supplies final glyph/numeric authority.
                  p=subprocess.run(
                      ["tesseract",str(path),"stdout","-l","chi_tra","--psm","6"],
                      stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False
                  )
                  o=p.stdout.decode("utf-8",errors="replace")
                  (root/"ocr"/f'{v["book"]}_{leaf}.txt').write_text(o,encoding="utf-8")
                  hits=[t for t in locator_terms if t in o]
                  if hits:
                      ocr_hits.append({
                          "book":v["book"],"page":n,"hits":hits,
                          "ocr_context":" ".join(o.split())[:1800],
                          "authority":"LOCATOR_ONLY_NOT_FINAL_TEXT_AUTHORITY"
                      })

              manifests.extend(imgs)

              # Reproducible visual contact sheet for direct human review.
              thumb_w=360
              cells=[]
              for rec in imgs:
                  p=root/"images"/f'{rec["book"]}_{rec["page"]:03d}.jpg'
                  im=Image.open(p).convert("RGB")
                  ratio=thumb_w/im.width
                  im=im.resize((thumb_w,max(1,int(im.height*ratio))))
                  canvas=Image.new("RGB",(thumb_w,im.height+28),"white")
                  canvas.paste(im,(0,28))
                  ImageDraw.Draw(canvas).text((6,6),f'{rec["book"]} p{rec["page"]:03d}',fill="black")
                  cells.append(canvas)
              cols=4
              rows=(len(cells)+cols-1)//cols
              cw=max(x.width for x in cells)
              ch=max(x.height for x in cells)
              sheet=Image.new("RGB",(cols*cw,rows*ch),"white")
              for i,im in enumerate(cells):
                  sheet.paste(im,((i%cols)*cw,(i//cols)*ch))
              sheet.save(root/f'{v["book"]}-contact.jpg',quality=88,optimize=True)

          report={
              "schema":"YONEZAWA-SHILIN-1492-LIKOU-PHYSICAL-PAGES-PROBE-R1",
              "schema_version":"1.0.0",
              "viewer_url":viewer,
              "viewer_sha256":hashlib.sha256(raw).hexdigest(),
              "viewer_content_type":ctype,
              "viewer_volumes":vols,
              "acquired_volumes":[v["book"] for v in target],
              "acquired_page_count":len(manifests),
              "images":manifests,
              "ocr_locator_hits":ocr_hits,
              "ocr_authority":"LOCATOR_ONLY; direct source-bound image review required for final glyph/mechanism/numeric claims.",
              "research_target":"1492 Yonezawa physical copy: 前集卷二 曆候類, especially 刻漏器度 / 古制蓮漏圖 / 今制蓮漏圖 / 定寅時訣 / 晝夜長短圖.",
              "chronology_boundary":"Yonezawa first-party catalog identifies the physical print as 弘治5年(1492)刊. The separate question here is whether the target mechanism/text is visibly present in this exact copy.",
              "product_boundary":"Probe only; no candidate promotion, runtime change, algorithm reopen, or chart behavior change."
          }
          (root/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({
              "viewer_volumes":vols,
              "acquired_page_count":len(manifests),
              "ocr_locator_hits":ocr_hits
          },ensure_ascii=False,indent=2))
          PY

      - name: Upload Yonezawa 1492 target pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yonezawa-shilin-1492-likou
          path: audit/yonezawa-shilin-1492-likou
          if-no-files-found: error
          retention-days: 30
