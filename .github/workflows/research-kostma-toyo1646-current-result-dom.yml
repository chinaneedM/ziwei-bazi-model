name: research-kostma-toyo1646-current-result-dom

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-kostma-toyo1646-current-result-dom.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium requests beautifulsoup4

      - name: Inspect current KOSTMA result DOM and follow only emitted target controls
        shell: python
        run: |
          import hashlib,json,time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.common.exceptions import TimeoutException

          OUT=Path("probe"); OUT.mkdir()
          URL="https://kostma.aks.ac.kr/dataSearch/dataSearchList.aspx?cateQ=aksBook&curPage=72&fq=com_%ED%98%84%EC%86%8C%EC%9E%A5%EC%B2%98_fct:%EC%9D%BC%EB%B3%B8+%EB%8F%99%EC%96%91%EB%AC%B8%EA%B3%A0&pageSize=20&query=&sType=&sort="
          TITLE="신간희이진선생자미두수전집"
          UCI="RIKS+CRMA+KSM-WZ.0000.0000-20140423.TOYO_1646"
          result={
            "schema":"ZIWEI-KOSTMA-TOYO1646-CURRENT-RESULT-DOM-R1",
            "source_url":URL,"uci":UCI,
            "authentication_attempted":False,"captcha_bypass_attempted":False,
            "route_guessing_attempted":False,"sequential_page_enumeration_attempted":False
          }

          # Plain HTTP snapshot of the exact current search result.
          s=requests.Session(); s.headers.update({"User-Agent":"Mozilla/5.0 (compatible; provenance-research/1.0)"})
          try:
            r=s.get(URL,timeout=45,allow_redirects=True)
            result["http"]={"status":r.status_code,"final_url":r.url,"bytes":len(r.content),"sha256":hashlib.sha256(r.content).hexdigest(),"content_type":r.headers.get("content-type","")}
            (OUT/"search-result.html").write_bytes(r.content)
            txt=r.text
            result["http_contains"]={"title":TITLE in txt,"uci":UCI in txt,"TOYO_1646":"TOYO_1646" in txt,"VII-3-157":"Ⅶ-3-157" in txt}
            # Context snippets around title/UCI directly from current HTML.
            snippets=[]
            for term in (TITLE,"TOYO_1646","Ⅶ-3-157","getImageData.aspx","imageViewer","원문"):
              start=0
              while True:
                i=txt.find(term,start)
                if i<0: break
                snippets.append({"term":term,"offset":i,"context":txt[max(0,i-2500):i+4500]})
                start=i+len(term)
                if len(snippets)>=80: break
            result["http_snippets"]=snippets
          except Exception as e:
            result["http_error"]=type(e).__name__+": "+str(e)

          opts=Options()
          opts.add_argument("--headless=new"); opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage"); opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1800,3200"); opts.add_argument("--lang=ko-KR")
          opts.set_capability("goog:loggingPrefs",{"performance":"ALL","browser":"ALL"})
          d=webdriver.Chrome(options=opts)
          try:
            d.set_page_load_timeout(90); d.get(URL); time.sleep(10)
            result["browser_final_url"]=d.current_url; result["browser_title"]=d.title
            body=d.find_element(By.TAG_NAME,"body").text
            result["browser_target_text_present"]=TITLE in body
            # Find the exact title text node/ancestor and serialize only a bounded target block.
            targets=[]
            els=d.find_elements(By.XPATH,"//*[contains(normalize-space(.), '신간희이진선생자미두수전집')]")
            for el in els:
              try:
                if not el.is_displayed(): continue
                node=el
                candidates=[]
                for depth in range(7):
                  txt=" ".join((node.text or "").split())
                  html=node.get_attribute("outerHTML") or ""
                  if TITLE in txt and len(html)<180000:
                    candidates.append({"depth":depth,"tag":node.tag_name,"text":txt[:12000],"outerHTML":html[:180000]})
                  node=node.find_element(By.XPATH,"..")
                if candidates:
                  candidates.sort(key=lambda x:(len(x["outerHTML"]),x["depth"]))
                  targets.append(candidates[0])
              except Exception:
                pass
            # Deduplicate by HTML.
            ded=[]; seen=set()
            for x in targets:
              k=x["outerHTML"]
              if k not in seen: seen.add(k); ded.append(x)
            result["target_blocks"]=ded[:12]

            # Gather only controls/links whose closest bounded ancestor contains the target title or UCI.
            controls=[]
            for css,kind in (("a[href]","a"),("img[src]","img"),("button","button"),("input","input")):
              for el in d.find_elements(By.CSS_SELECTOR,css):
                try:
                  anc=el.find_element(By.XPATH,"ancestor::*[contains(normalize-space(.), '신간희이진선생자미두수전집')][1]")
                  if not anc: continue
                  rec={"kind":kind,"text":" ".join((el.text or "").split())[:1500]}
                  for attr in ("href","src","onclick","id","name","value","class","data-uci","datauci","data-page","data-url","target"):
                    v=el.get_attribute(attr)
                    if v: rec[attr]=v
                  controls.append(rec)
                except Exception:
                  pass
            result["target_controls"]=controls[:500]

            # Follow only exact publicly emitted anchors/onclick controls that explicitly mention the target UCI,
            # getImageData, imageViewer, 원문, or TOYO_1646. No guessed parameters.
            follow=[]
            for c in controls:
              hay=" ".join(str(v) for v in c.values())
              if any(k.lower() in hay.lower() for k in ("TOYO_1646","getimagedata","imageviewer","원문")):
                follow.append(c)
            result["candidate_follow_controls"]=follow[:100]

            d.save_screenshot(str(OUT/"search.png"))
            (OUT/"browser.html").write_text(d.page_source,encoding="utf-8")

            # Click the first visible target control only if it is actually present in current DOM.
            clicked=False
            for el in d.find_elements(By.CSS_SELECTOR,"a[href],button,input,img"):
              try:
                hay=" ".join(filter(None,[el.get_attribute("href") or "",el.get_attribute("src") or "",el.get_attribute("onclick") or "",el.get_attribute("value") or "",el.text or ""]))
                if not any(k.lower() in hay.lower() for k in ("TOYO_1646","getimagedata","imageviewer","원문")):
                  continue
                try:
                  el.find_element(By.XPATH,"ancestor::*[contains(normalize-space(.), '신간희이진선생자미두수전집')][1]")
                except Exception:
                  continue
                result["clicked_control"]={"tag":el.tag_name,"hay":hay[:6000]}
                before=d.current_url
                try:
                  d.execute_script("arguments[0].scrollIntoView({block:'center'});",el); time.sleep(1)
                  el.click(); time.sleep(10)
                except Exception as e:
                  result["click_error"]=type(e).__name__+": "+str(e)
                result["post_click"]={"before_url":before,"after_url":d.current_url,"title":d.title}
                try:
                  result["post_click_body"]=d.find_element(By.TAG_NAME,"body").text[:80000]
                  (OUT/"post-click.html").write_text(d.page_source,encoding="utf-8")
                  d.save_screenshot(str(OUT/"post-click.png"))
                except Exception: pass
                clicked=True
                break
            result["clicked"]=clicked

            # Capture only network URLs actually observed by browser.
            net=[]
            for entry in d.get_log("performance"):
              try:
                m=json.loads(entry["message"])["message"]
                if m.get("method")!="Network.responseReceived": continue
                p=m.get("params",{}); resp=p.get("response",{}); u=resp.get("url","")
                if not u: continue
                if "kostma.aks.ac.kr" in u or "aks.ac.kr" in u:
                  net.append({"url":u,"status":resp.get("status"),"mimeType":resp.get("mimeType"),"type":p.get("type")})
              except Exception: pass
            seen=set(); dedup=[]
            for x in net:
              k=(x["url"],x.get("status"),x.get("mimeType"))
              if k not in seen: seen.add(k); dedup.append(x)
            result["observed_network"]=dedup[:3000]
            result["browser_logs"]=d.get_log("browser")[:500]
          except Exception as e:
            result["browser_error"]=type(e).__name__+": "+str(e)
          finally:
            d.quit()

          result["adjudication"]={
            "current_kostma_catalog_object":"BOUND_IF_TARGET_BLOCK_PRESENT",
            "image_or_viewer_route":"ONLY_IF_EXACT_CONTROL_OR_NETWORK_EMITTED",
            "target_page_observed":False,
            "independent_hai_glyph_vote_added":0,
            "algorithm_effect":"NONE"
          }
          (OUT/"probe.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
            "http":result.get("http"),"http_contains":result.get("http_contains"),
            "browser_final_url":result.get("browser_final_url"),"browser_title":result.get("browser_title"),
            "browser_target_text_present":result.get("browser_target_text_present"),
            "target_blocks":[{"depth":x["depth"],"tag":x["tag"],"text":x["text"]} for x in result.get("target_blocks",[])],
            "target_controls":result.get("target_controls"),
            "candidate_follow_controls":result.get("candidate_follow_controls"),
            "clicked_control":result.get("clicked_control"),"post_click":result.get("post_click"),
            "observed_network":result.get("observed_network",[])[:400],
            "browser_error":result.get("browser_error"),"click_error":result.get("click_error"),
            "adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))

      - name: Upload current KOSTMA target DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-kostma-toyo1646-current-result-dom
          path: probe/
          if-no-files-found: warn
          retention-days: 14
