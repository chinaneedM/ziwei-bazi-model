name: research-kyujanggak-1912-1920-precious-catalog-sparse-pages

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1912-1920-precious-catalog-sparse-pages.yml"
      - "scripts/research_kyujanggak_1912_1920_precious_catalog_page.py"

permissions:
  contents: read

jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        page: ["0001","0006","0011","0016","0021","0026","0031","0036","0041","0046","0051","0056","0061","0066","0071","0075"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi pillow
      - name: Fetch one no-OCR provider page
        run: |
          python scripts/research_kyujanggak_1912_1920_precious_catalog_page.py \
            --page "${{ matrix.page }}" \
            --output "artifacts/page-${{ matrix.page }}"
      - name: Upload sparse-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1912-1920-page-${{ matrix.page }}-${{ github.sha }}
          path: artifacts/page-${{ matrix.page }}/
          if-no-files-found: warn
          retention-days: 7
