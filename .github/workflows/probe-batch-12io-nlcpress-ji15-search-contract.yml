name: probe-batch-12io-nlcpress-ji15-search-contract

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12io-nlcpress-ji15-search-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Ji Shuying catalog-download binding
        run: |
          python - <<'PY'
          import html, json, re
          from pathlib import Path
          import requests

          URL="https://www.nlcpress.com/ProductView.aspx?Id=4660"
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; catalog binding inspection)"})
          r=s.get(URL,timeout=45)
          r.raise_for_status()
          raw=r.text

          keys=["CatalogPrecisFile","Booktext","目录附件下载","Precis","Download","download","File"]
          occurrences={}
          for key in keys:
              rows=[]
              start=0
              while True:
                  i=raw.find(key,start)
                  if i<0 or len(rows)>=30: break
                  rows.append(raw[max(0,i-900):min(len(raw),i+1800)])
                  start=i+len(key)
              occurrences[key]=rows

          scripts=[]
          for m in re.finditer(r'<script\b[^>]*>(.*?)</script>',raw,re.I|re.S):
              body=html.unescape(m.group(1))
              if any(k in body for k in ["CatalogPrecisFile","Booktext","Precis"]):
                  scripts.append(body[:30000])

          hidden=[]
          for m in re.finditer(r'<input\b[^>]*>',raw,re.I):
              tag=html.unescape(m.group(0))
              if any(k.lower() in tag.lower() for k in ["catalog","precis","file","booktext"]):
                  hidden.append(tag[:3000])

          result={
              "url":URL,
              "status":r.status_code,
              "body_bytes":len(r.content),
              "occurrence_counts":{k:len(v) for k,v in occurrences.items()},
              "occurrences":occurrences,
              "matching_scripts":scripts,
              "matching_hidden_inputs":hidden,
              "tls_verified":True,
              "login_used":False,
              "purchase_invoked":False,
              "download_invoked":False,
              "full_book_txt_followed":False
          }
          Path("nlcpress-ji15-catalog-binding.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12io-nlcpress-ji15-catalog-binding
          path: nlcpress-ji15-catalog-binding.json
