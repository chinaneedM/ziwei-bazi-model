name: probe-batch-12io-nlcpress-ji15-search-contract

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12io-nlcpress-ji15-search-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Narrow NLC Press 2009-2010 product-list window
        run: |
          python - <<'PY'
          import html, json, re
          from pathlib import Path
          import requests

          URL="https://www.nlcpress.com/ProductList.aspx"
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; public pager window probe)"})

          def hidden_fields(body):
              out={}
              for m in re.finditer(r'<input\b[^>]*>',body,re.I):
                  tag=m.group(0)
                  if not re.search(r'type=["\']hidden["\']',tag,re.I):
                      continue
                  nm=re.search(r'name=["\']([^"\']+)["\']',tag,re.I)
                  vm=re.search(r'value=["\']([^"\']*)["\']',tag,re.I)
                  if nm:
                      out[html.unescape(nm.group(1))]=html.unescape(vm.group(1) if vm else "")
              return out

          def jump(body,target):
              data=hidden_fields(body)
              data.update({
                  "__EVENTTARGET":"PageNavigator1$LinkButton_Go",
                  "__EVENTARGUMENT":"",
                  "PageNavigator1$txt_PageGo":str(target),
              })
              return s.post(URL,data=data,timeout=30)

          def page_now(body):
              m=re.search(r'id=["\']PageNavigator1_txt_PageNow["\'][^>]*>(\d+)<',body,re.I)
              return int(m.group(1)) if m else None

          def summarize(body):
              ids=[]
              for x in re.findall(r'ProductView\.aspx\?Id=(\d+)',body,re.I):
                  n=int(x)
                  if n not in ids: ids.append(n)
              text=re.sub(r'<[^>]+>',' ',body)
              text=re.sub(r'\s+',' ',html.unescape(text))
              dates=sorted(set(re.findall(r'20\d\d[-./年]\d{1,2}(?:[-./月]\d{1,2}日?)?',text)))
              years=sorted(set(re.findall(r'20\d\d', " ".join(dates))))
              return {
                  "ids":ids,
                  "id_min":min(ids) if ids else None,
                  "id_max":max(ids) if ids else None,
                  "years":years,
                  "dates":dates[:80],
                  "has_control_id_4939":"ProductView.aspx?Id=4939" in body,
                  "has_control_title":"史记十五讲" in text,
                  "has_target_title":"冀淑英古籍善本十五讲" in text,
                  "has_target_author":"冀淑英" in text,
                  "has_target_isbn":"9787501340637" in text.replace("-","").replace(" ",""),
              }

          first=s.get(URL,timeout=30)
          first.raise_for_status()
          current=first
          pages=[310,320,330,340,350,360,370,380,390,400]
          rows=[]
          for target in pages:
              r=jump(current.text,target)
              row={"requested_page":target,"status":r.status_code,"page_now":page_now(r.text),
                   "body_bytes":len(r.content),**summarize(r.text)}
              rows.append(row)
              if r.status_code!=200 or row["page_now"]!=target:
                  break
              current=r

          result={
              "url":URL,
              "pages_requested":pages,
              "rows":rows,
              "all_page_jumps_exact":len(rows)==len(pages) and all(x["page_now"]==x["requested_page"] for x in rows),
              "control_product_id":4939,
              "control_title":"史记十五讲（中国典籍与文化第六辑）",
              "target_title":"冀淑英古籍善本十五讲",
              "target_isbn":"9787501340637",
              "tls_verified":True,
              "login_used":False,
              "purchase_invoked":False,
              "download_invoked":False,
              "id_guessing_used":False,
              "only_source_emitted_product_ids_recorded":True,
          }
          Path("nlcpress-2009-2010-window.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12io-nlcpress-2009-2010-window
          path: nlcpress-2009-2010-window.json
