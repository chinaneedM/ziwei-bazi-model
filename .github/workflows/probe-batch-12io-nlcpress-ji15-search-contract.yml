name: probe-batch-12io-nlcpress-ji15-search-contract

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12io-nlcpress-ji15-search-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect NLC Press public product-list pager contract
        run: |
          python - <<'PY'
          import json, re, html
          from pathlib import Path
          import requests

          URL="https://www.nlcpress.com/ProductList.aspx"
          r=requests.get(URL,headers={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; public pager probe)"},timeout=30)
          body=r.text

          def frag(marker, radius=1800):
              i=body.find(marker)
              return body[max(0,i-radius):i+radius] if i>=0 else None

          # Raw anchors/buttons near the custom pager. Keep the exact source
          # contract; do not guess hidden postback semantics yet.
          anchors=[]
          for m in re.finditer(r'<a\b[^>]*href=["\']([^"\']*)["\'][^>]*>(.*?)</a>',body,re.I|re.S):
              href=html.unescape(m.group(1))
              text=re.sub(r'<[^>]+>',' ',m.group(2))
              text=re.sub(r'\s+',' ',html.unescape(text)).strip()
              full=m.group(0)
              if ("PageNavigator1" in full or "PageNavigator1" in href or
                  text in {"首页","上页","下页","尾页"} or
                  re.fullmatch(r'\d+',text or "")):
                  anchors.append({"href":href,"text":text,"html":full[:1200]})

          inputs=[]
          for m in re.finditer(r'<input\b[^>]*>',body,re.I):
              tag=m.group(0)
              if "PageNavigator1" in tag:
                  attrs={}
                  for k,v in re.findall(r'(\w+)\s*=\s*["\']([^"\']*)["\']',tag):
                      attrs[k.lower()]=html.unescape(v)
                  inputs.append(attrs)

          labels={}
          for key in [
              "PageNavigator1_txt_PageNow","PageNavigator1_txt_PageCount",
              "PageNavigator1_PageNowLable","PageNavigator1_PageCountLable",
              "PageNavigator1_Link_PageHome","PageNavigator1_Link_PageUp",
              "PageNavigator1_Link_PageDown","PageNavigator1_Link_PageEnd",
              "PageNavigator1_LinkNumbers","PageNavigator1_GoLable"
          ]:
              labels[key]=frag(key)

          # Also extract source-emitted product links with visible text/date
          products=[]
          for m in re.finditer(r'href=["\'](ProductView\.aspx\?Id=\d+)["\']',body,re.I):
              lo=max(0,m.start()-1200); hi=min(len(body),m.end()+2200)
              snippet=body[lo:hi]
              txt=re.sub(r'<[^>]+>',' ',snippet)
              txt=re.sub(r'\s+',' ',html.unescape(txt)).strip()
              products.append({"href":m.group(1),"context":txt[:2000]})

          result={
              "url":URL,"status":r.status_code,"body_bytes":len(r.content),
              "anchors":anchors[:100],
              "inputs":inputs,
              "labels":labels,
              "product_count":len(set(x["href"] for x in products)),
              "product_sample":products[:30],
              "tls_verified":True,
              "login_used":False,
              "purchase_invoked":False,
              "download_invoked":False,
          }
          Path("nlcpress-productlist-pager-contract.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12io-nlcpress-productlist-pager-contract
          path: nlcpress-productlist-pager-contract.json
