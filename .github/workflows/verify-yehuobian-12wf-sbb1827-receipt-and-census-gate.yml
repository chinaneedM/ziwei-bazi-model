name: verify-yehuobian-12wf-sbb1827-receipt-and-census-gate
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12wf-sbb1827-receipt-and-census-gate.yml
      - docs/research/MING-DATONG-YEHUOBIAN-12WF-*
      - scripts/verify-yehuobian-sbb1827-original-boundary-12wf.py
      - tests/test_yehuobian_sbb1827_original_boundary_12wf.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source receipt and cannot-upgrade-to-historical-original bounds
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-yehuobian-sbb1827-original-boundary-12wf.py
          python -m unittest discover -s tests -p 'test_yehuobian_sbb1827_original_boundary_12wf.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_sbb1827_metadata_12we.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_cadal_parallel_source_12vz.py' -v
