name: verify-batch-12iq-exact-head
# Durable exact-head gate: Japan OPAC/openBD content-enhancement routes remain scope-limited and non-page-authoritative.

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12iq-exact-head.yml
      - docs/research/ZIWEI-JI-SHUYING-2009-JAPAN-OPAC-OPENBD-BOOKDATA-PUBLIC-CONTENT-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-JI-SHUYING-2009-JAPAN-OPAC-OPENBD-BOOKDATA-PUBLIC-CONTENT-BOUNDARY-IQ.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
      - .github/workflows/probe-batch-12iq-japan-opac-ji15-public-metadata.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IQ status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'tianwen/batch-12iq-exact-head',
              description: 'Batch 12IQ Japan OPAC/openBD boundary verification running'
            })
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12IQ exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-JI-SHUYING-2009-JAPAN-OPAC-OPENBD-BOOKDATA-PUBLIC-CONTENT-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-JI-SHUYING-2009-JAPAN-OPAC-OPENBD-BOOKDATA-PUBLIC-CONTENT-BOUNDARY-IQ'
          k=e['anonymous_opac_routes']['kyoto_u']
          assert k['rendered_openbd_text']=='目次・あらすじの電子情報はありません。'
          assert k['rendered_bookplus_text']=='あらすじ・目次の情報はありません。'
          assert e['anonymous_opac_routes']['ritsumeikan']['rendered_bookplus_text']=='あらすじ・目次の情報はありません。'
          o=e['openbd_public_control']
          assert o['http_status']==200 and o['response_bytes']==6 and o['first_record_is_null'] is True
          assert o['response_sha256']=='1d8fc6ceb1f94c6326d6d5483d258fcb2e179e9869325b245d105c2219bf69fd'
          p=e['pagination_adjudication']
          assert p['exact_chapter_9_page_range']=='UNRESOLVED'
          assert p['direct_chapter_9_text']=='NOT_REVIEWED'
          assert p['exact_chapter_10_11_pagination']=='UNRESOLVED'
          assert e['project_consequence']['product_change'] is False
          PY
      - name: Publish success IQ status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12iq-exact-head',
              description: 'Batch 12IQ exact-head verification passed'
            })
      - name: Publish failure IQ status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12iq-exact-head',
              description: 'Batch 12IQ exact-head verification failed'
            })
