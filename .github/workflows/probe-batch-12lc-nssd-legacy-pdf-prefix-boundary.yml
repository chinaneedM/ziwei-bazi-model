name: probe-batch-12lc-nssd-legacy-pdf-prefix-boundary

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12lc-nssd-legacy-pdf-prefix-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read at most 4096 bytes from the exact source-emitted legacy URL
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import requests

          URL="http://www.nssd.org/articles/article_down.aspx?id=1002462903"
          headers={
              "User-Agent":"Mozilla/5.0 (Tianwen provenance audit; source-emitted legacy PDF prefix boundary)",
              "Range":"bytes=0-4095",
          }
          r=requests.get(URL,headers=headers,timeout=45,allow_redirects=False,stream=True)
          prefix=b""
          for chunk in r.iter_content(chunk_size=4096):
              prefix=chunk[:4096]
              break
          r.close()

          low=prefix.lower()
          text_prefix=prefix.decode("utf-8","replace")
          out={
              "source_contract":{
                  "parent_batch":"12LB",
                  "url":URL,
                  "request_method":"GET",
                  "range_header":"bytes=0-4095",
                  "streaming":True,
                  "maximum_body_bytes_read":4096
              },
              "response":{
                  "http_status":r.status_code,
                  "content_type":r.headers.get("content-type"),
                  "content_length":r.headers.get("content-length"),
                  "content_range":r.headers.get("content-range"),
                  "location":r.headers.get("location"),
                  "bytes_read":len(prefix),
                  "prefix_sha256":hashlib.sha256(prefix).hexdigest(),
                  "starts_pdf_signature":prefix.startswith(b"%PDF-"),
                  "starts_html_like":low.lstrip().startswith((b"<!doctype html",b"<html",b"<?xml")),
              },
              "text_boundary":{
                  "contains_login_token":any(x in text_prefix.lower() for x in ("login","signin","登录","登陆","用户登录")),
                  "contains_error_token":any(x in text_prefix.lower() for x in ("error","错误","不存在","not found","无法访问")),
                  "text_prefix":text_prefix[:1500] if not prefix.startswith(b"%PDF-") else None
              },
              "adjudication":{
                  "full_body_downloaded":False,
                  "bytes_read_le_4096":len(prefix)<=4096,
                  "public_pdf_signature_observed":prefix.startswith(b"%PDF-"),
                  "html_boundary_observed":low.lstrip().startswith((b"<!doctype html",b"<html",b"<?xml")),
                  "redirect_observed":r.status_code in (301,302,303,307,308),
                  "url_followed_beyond_source_emitted_target":False
              },
              "security":{
                  "anonymous_range_get_only":True,
                  "reader_account_used":False,
                  "registration_used":False,
                  "full_body_downloaded":False,
                  "login_used":False,
                  "redirect_followed":False,
                  "captcha_bypass_used":False,
                  "tls_verification_disabled":False
              }
          }
          Path("batch-12lc-nssd-legacy-pdf-prefix-boundary.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12lc-nssd-legacy-pdf-prefix-boundary
          path: batch-12lc-nssd-legacy-pdf-prefix-boundary.json
