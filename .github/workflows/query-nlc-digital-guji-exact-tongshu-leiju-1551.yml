name: query-nlc-digital-guji-exact-tongshu-leiju-1551

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/query-nlc-digital-guji-exact-tongshu-leiju-1551.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Query NLC digital ancient-books index by exact title
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/nlc-digital-guji-exact-tongshu-leiju-1551'
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          UA='Tianwen-Provenance-Audit/1.0'
          ENDPOINT='http://read.nlc.cn/advanceSearch/gujiSearch/data'

          cat > "$ROOT/queries.tsv" <<'EOF'
          exact-core	must	通書類聚尅擇大全
          exact-catalog	must	通書類聚尅擇大全□□卷
          exact-simp	must	通书类聚克择大全
          fuzzy-core	like	通書類聚尅擇大全
          fuzzy-short	like	通書類聚
          EOF

          : > "$ROOT/status.tsv"
          while IFS=$'\t' read -r key match query; do
            SEARCH_JSON=$(QUERY="$query" MATCH="$match" python - <<'PY'
          import json, os
          print(json.dumps([{
              "fldName":"title",
              "content":os.environ["QUERY"],
              "match":os.environ["MATCH"]
          }], ensure_ascii=False, separators=(',',':')))
          PY
            )
            set +e
            timeout 35s curl -L -sS               --connect-timeout 8 --max-time 25               -A "$UA"               -D "$ROOT/$key.headers"               -X POST               --data-urlencode 'index=0003,'               --data-urlencode "searchJson=$SEARCH_JSON"               --data-urlencode 'pageNo=1'               "$ENDPOINT" -o "$ROOT/$key.json"
            rc=$?
            set -e
            size=0
            [ -f "$ROOT/$key.json" ] && size=$(wc -c < "$ROOT/$key.json")
            printf '%s\t%s\t%s\t%s\t%s\n' "$key" "$match" "$rc" "$size" "$query" >> "$ROOT/status.tsv"
          done < "$ROOT/queries.tsv"

          # Capture source-declared searchable fields for resId=24 alongside the results.
          set +e
          timeout 35s curl -L -sS             --connect-timeout 8 --max-time 25             -A "$UA" -X POST             'http://read.nlc.cn/DBM/getIsSearchFld?resId=24'             -o "$ROOT/search-fields.json"
          set -e

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('audit/nlc-digital-guji-exact-tongshu-leiju-1551')
          lines=[]
          for p in sorted(root.glob('*.json')):
              if p.name=='search-fields.json':
                  continue
              try:
                  data=json.loads(p.read_text('utf-8'))
              except Exception as e:
                  lines.append(f'{p.name}\tPARSE_ERROR\t{e}')
                  continue
              lines.append(f'{p.name}\ttotal={data.get("total")}\trows={len(data.get("rows") or [])}')
              for row in data.get('rows') or []:
                  lines.append(
                      p.name+'\t'+json.dumps({
                          k:row.get(k) for k in (
                              'title','author','publish_unit','publish_time',
                              'identifier','index_name','res_name','cover'
                          )
                      },ensure_ascii=False,separators=(',',':'))
                  )
          (root/'parsed-results.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

          grep -RniE             '通書類聚|通书类聚|尅擇大全|克择大全|芝城|嘉靖三十|1551|110000-0101-0013797|14202|identifier|index_name|cover|SBGJ'             "$ROOT" > "$ROOT/target-hits.txt" || true

          sha256sum "$ROOT"/*.json > "$ROOT/json.sha256" || true

          printf '%s\n'             'SOURCE=中國國家圖書館 中華古籍資源庫 高級檢索'             'ENDPOINT=/advanceSearch/gujiSearch/data'             'RESOURCE_INDEX=0003 (數字古籍; source form mapping)'             'FIELD=title'             'TARGET=通書類聚尅擇大全□□卷 / 明嘉靖三十年（1551）芝城銅活字印本'             'CENSUS_ID=110000-0101-0013797'             'CALL_NUMBER=14202'             'PURPOSE=resolve whether the known NLC physical copy is publicly digitized and obtain its record identifier/cover/read route if present'             'NEGATIVE_RESULT_POLICY=exact-title no hit plus controlled fuzzy checks closes only the current public Digital Ancient Books index route'             'OCR_USED=false'             > "$ROOT/manifest.txt"

      - name: Upload exact NLC digital-index query
        uses: actions/upload-artifact@v4
        with:
          name: nlc-digital-guji-exact-tongshu-leiju-1551-query
          path: audit/nlc-digital-guji-exact-tongshu-leiju-1551/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
