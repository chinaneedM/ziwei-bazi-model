name: render-datong-richu-ncl-06267

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-datong-richu-ncl-06267.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install pillow
      - name: Download NCL-06267 Datong richu fen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/pages evidence/contact
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/NCL-06267%20%E5%A4%A7%E7%B5%B1%E6%97%A5%E5%87%BA%E5%88%86.pdf'
          curl -L --fail --retry 3 --retry-delay 2 "$url" -o evidence/datong_richu_ncl_06267.pdf
          sha256sum evidence/datong_richu_ncl_06267.pdf | tee evidence/source.sha256
          pdfinfo evidence/datong_richu_ncl_06267.pdf | tee evidence/pdfinfo.txt
      - name: Render every physical page without OCR
        shell: bash
        run: |
          set -euo pipefail
          pdftoppm -jpeg -jpegopt quality=92 -r 150 evidence/datong_richu_ncl_06267.pdf evidence/pages/page
          n=$(find evidence/pages -maxdepth 1 -name 'page-*.jpg' | wc -l)
          echo "RENDERED_PAGE_COUNT=$n" | tee evidence/render-count.txt
          test "$n" -gt 0
          sha256sum evidence/pages/*.jpg | sort -V > evidence/pages.sha256
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          pages=sorted(Path('evidence/pages').glob('page-*.jpg'), key=lambda p:int(p.stem.split('-')[-1]))
          for i in range(0,len(pages),12):
              batch=pages[i:i+12]
              thumbs=[]
              for p in batch:
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((320,520))
                  canvas=Image.new('RGB',(340,560),'white')
                  canvas.paste(im,((340-im.width)//2,24))
                  ImageDraw.Draw(canvas).text((8,6),p.name,fill='black')
                  thumbs.append(canvas)
              rows=(len(thumbs)+3)//4
              sheet=Image.new('RGB',(4*340,rows*560),'white')
              for j,im in enumerate(thumbs):
                  sheet.paste(im,((j%4)*340,(j//4)*560))
              a=i+1;b=i+len(batch)
              sheet.save(f'evidence/contact/contact-{a:03d}-{b:03d}.jpg',quality=90)
          PY
          sha256sum evidence/contact/*.jpg | sort -V > evidence/contact.sha256
          printf 'NO_OCR_USED=true\nSOURCE=NCL-06267 大統日出分\nSOURCE_ROLE=DIRECT_MING_MANUSCRIPT_PHYSICAL_TABLE_COLLATION\nTARGET=FULL_DAILY_NANJING_DATONG_SUNRISE_SUNSET_TABLE\n' > evidence/manifest.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: datong-richu-ncl-06267-physical-facsimile
          path: evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
