name: verify-tianwen-13kw-mingshi-source-attribution-erratum
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - docs/research/TIANWEN-13KW-*
      - scripts/verify-tianwen-13kw-mingshi-source-attribution-erratum.py
      - tests/test_tianwen_13kw_mingshi_source_attribution_erratum.py
      - .github/workflows/verify-tianwen-13kw-mingshi-source-attribution-erratum.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13kw-mingshi-source-attribution-erratum.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13kw_mingshi_source_attribution_erratum.py' -v
      - run: python scripts/verify-tianwen-13kv-mingshi-synodic-remainder-variants.py
      - run: python scripts/verify-tianwen-13ku-mingshi-four-phase-return.py
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
