name: verify-batch-12hv-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hv-exact-head.yml
      - docs/research/ZIWEI-SHANGGU2017-ZUOZHUAN-17CHAR-PUBLICATION-PREVIEW-CONTROL-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-SHANGGU2017-ZUOZHUAN-17CHAR-PUBLICATION-PREVIEW-CONTROL-HV.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending HV status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tianwen/batch-12hv-exact-head',
              description: 'Batch 12HV exact-head verification running'
            })

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12HV exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-SHANGGU2017-ZUOZHUAN-17CHAR-PUBLICATION-PREVIEW-CONTROL-HV'
          e=json.loads(Path('docs/research/ZIWEI-SHANGGU2017-ZUOZHUAN-17CHAR-PUBLICATION-PREVIEW-CONTROL-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          p=e['public_publication_preview']
          assert p['isbn13']=='9787532584055'
          assert p['publisher']=='上海古籍出版社'
          assert p['publication_date']=='2017-05-01'
          t=p['target_record']
          assert t['lines_per_half_leaf']==10
          assert t['main_chars_per_line']==17
          assert t['commentary_double_line_chars']==23
          assert t['original_extent']=='三十二冊'
          assert p['physical_printed_page_directly_reviewed'] is False
          f=e['independence_and_identity_firewall']
          assert f['exact_same_object_as_fid070_proved'] is False
          assert f['same_object_collapse_authorized'] is False
          assert f['independent_description_control_increment']==1
          assert f['independent_physical_witness_increment']==0
          assert e['format_evidence_stack']['convergent_17_description_layers']==3
          assert e['format_evidence_stack']['exact_physical_main_line_count_layers']==0
          scan=e['fid070_public_scan_boundary']
          assert scan['body_start_observed_page']==7
          assert scan['body_preview_pages_reviewed']==[7,8,9]
          assert scan['reproducible_multi_line_main_text_count_completed'] is False
          a=e['adjudication']
          assert a['current_nlc_16_metadata_defect_proved'] is False
          assert a['defect_016_created'] is False
          assert a['additional_provenance_defect_increment_authorized'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,234,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count'] >= 15
          assert state['historical_audit']['repaired_provenance_metadata_defect_count'] >= 15

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          r=src['EXT-SHANGGU2017-GUBEN13JING-ZUOZHUAN-PUBLICATION-PREVIEW-17CHAR']['batch_12hv']
          assert r['isbn13']=='9787532584055'
          assert r['main_chars_per_line']==17
          assert r['commentary_double_line_chars']==23
          assert r['exact_fid070_source_copy_proved'] is False
          assert r['current_nlc_16_metadata_defect_proved'] is False

          ac=e['accounting']
          assert ac['matrix_rows']==198
          assert ac['audited_rows']==166
          assert ac['current_missing_from_product_rows']==10
          assert ac['confirmed_provenance_metadata_defect_count']==15
          assert ac['repaired_provenance_metadata_defect_count']==15
          assert ac['confirmed_chart_algorithm_defect_count']==0
          assert ac['algorithm_reopen_count']==0
          assert ac['candidate_collapse_count']==0
          PY

      - name: Publish successful HV status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'tianwen/batch-12hv-exact-head',
              description: 'Batch 12HV publication-preview gates PASS'
            })

      - name: Publish failed HV status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'tianwen/batch-12hv-exact-head',
              description: 'Batch 12HV exact-head verification FAILED'
            })

# exact-head refresh: HV
