name: research-tianwen-13nv-nlc-source-folio
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths: [.github/workflows/research-tianwen-13nv-nlc-source-folio.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Install PDF source parser
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Acquire source PDF and extract two original folios
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, pathlib, urllib.parse, urllib.request, fitz
          out=pathlib.Path('docs/research/evidence/13nv')
          out.mkdir(parents=True,exist_ok=True)
          filename='NLC892-CBM1408-371938_古今律曆考_七十二卷_第19冊.pdf'
          url='https://upload.wikimedia.org/wikipedia/commons/f/f1/'+urllib.parse.quote(filename)
          req=urllib.request.Request(url,headers={'User-Agent':'TianwenSourceCollation/1.0 (github.com/chinaneedM/ziwei-bazi-model)'})
          with urllib.request.urlopen(req,timeout=120) as rsp:
              pdfbytes=rsp.read(24_000_000)
          assert pdfbytes.startswith(b'%PDF-'), 'No PDF magic'
          assert len(pdfbytes)==16674606, f'Unexpected PDF length: {len(pdfbytes)}'
          pdf=pathlib.Path('/tmp/tianwen-13nv-source.pdf')
          pdf.write_bytes(pdfbytes)
          doc=fitz.open(stream=pdfbytes,filetype='pdf')
          assert doc.page_count==65, f'Unexpected pages: {doc.page_count}'
          for pno in (16,17):
              page=doc[pno-1]
              page.get_pixmap(matrix=fitz.Matrix(2.5,2.5),alpha=False).save(str(out/f'render-{pno}.png'))
              for j,x in enumerate(page.get_images(full=True)):
                  obj=doc.extract_image(x[0])
                  (out/f'embedded-{pno}-{j+1}-xref{x[0]}.{obj["ext"]}').write_bytes(obj['image'])
          for pno in (16,17):
              pix=doc[pno-1].get_pixmap(matrix=fitz.Matrix(2,2),alpha=False)
              preview=pix.tobytes('jpg',jpg_quality=90)
              (out/f'review-{pno}.jpg.b64.txt').write_text(base64.b64encode(preview).decode('ascii')+'\n',encoding='ascii')
          (out/'manifest.json').unlink(missing_ok=True)
          files=[{'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.iterdir()) if p.is_file()]
          manifest={'schema':'TIANWEN-13NV-NLC-CBM1408-V19-SOURCE-PAGE-INTAKE-R1',
                    'source_url':url,'source_pdf_bytes':len(pdfbytes),
                    'source_pdf_sha256':hashlib.sha256(pdfbytes).hexdigest(),
                    'source_pdf_pages':65,'acquired_pdf_pages_one_based':[16,17],
                    'files':files,'method':'pdftoppm PNG plus pdfimages unmodified embedded objects; NO OCR',
                    'grade':'SOURCE_IMAGE_ACQUIRED_UNREVIEWED',
                    'limit':'Not a new independent physical witness, printed-glyph ruling, G893 unit conclusion or algorithm reopen.'}
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Publish immutable page-image evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add docs/research/evidence/13nv/
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(13NV): acquire NLC v19 original p16-17 and PDF SHA'
          git push origin HEAD:refs/heads/agent/fusion-chart-core-r1-20260822
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13nv-nlc-source-pages
          path: docs/research/evidence/13nv/
          if-no-files-found: warn
          retention-days: 30
