name: verify-tianwen-13ia-source-day-label
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13IA-*'
      - 'scripts/verify-tianwen-13ia-source-day-label.py'
      - 'tests/test_tianwen_13ia_source_day_label.py'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - '.github/workflows/verify-tianwen-13ia-source-day-label.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify-tianwen-13ia-source-day-label.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13ia_source_day_label.py' -v
