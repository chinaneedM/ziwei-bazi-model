name: probe-yehuobian-12wy-tokyo-kanseki-four-details
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-12wy-tokyo-kanseki-four-details.yml
      - scripts/probe-yehuobian-12wy-tokyo-kanseki-four-details.py
      - tests/test_yehuobian_12wy_tokyo_kanseki_four_details.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Four source-emitted only HTML detail and original print-glyph firewall
        run: python -m unittest discover -s tests -p 'test_yehuobian_12wy_tokyo_kanseki_four_details.py' -v
  capture:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded four provider original detail pages from seven verified source results
        run: python scripts/probe-yehuobian-12wy-tokyo-kanseki-four-details.py --output-dir 12wy-tokyo-details
      - name: Archive originals and per-item access boundary records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-kanseki-12wy-four-source-detail-originals
          path: 12wy-tokyo-details/
          retention-days: 30
          if-no-files-found: warn
