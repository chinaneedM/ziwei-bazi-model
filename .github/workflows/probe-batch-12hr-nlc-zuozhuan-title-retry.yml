name: probe-batch-12hr-nlc-zuozhuan-title-retry

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - '.github/workflows/probe-batch-12hr-nlc-zuozhuan-title-retry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Probe NLC current Zuozhuan title with retries
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/batch-12hr-nlc-zuozhuan-title-retry'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/raw" "$ROOT/detail"
          UA='Tianwen-Provenance-Audit/1.0'

          cat > "$ROOT/queries.tsv" <<'EOF'
          tit-trad-long	附釋音春秋左傳註疏	TIT	false
          tit-simp-long	附释音春秋左传注疏	TIT	false
          tit-trad-short	春秋左傳註疏	TIT	false
          tit-simp-short	春秋左传注疏	TIT	false
          tit-trad-long-exact	附釋音春秋左傳註疏	TIT	true
          tit-simp-long-exact	附释音春秋左传注疏	TIT	true
          any-trad-author	附釋音春秋左傳註疏 杜預	ANY	false
          any-simp-author	附释音春秋左传注疏 杜预	ANY	false
          any-yuanrepair	附釋音春秋左傳註疏 元刻明修	ANY	false
          any-yuanprint	附釋音春秋左傳註疏 元刻元印	ANY	false
          EOF

          : > "$ROOT/status.tsv"
          while IFS=$'\t' read -r key q way exact; do
            body=$(Q="$q" WAY="$way" EXACT="$exact" python - <<'PY'
          import json,os
          q=os.environ['Q']; way=os.environ['WAY']; exact=os.environ['EXACT'].lower()=='true'
          print(json.dumps({
            "q":q,
            "searchWay":way,
            "page_num":"1",
            "query":q if way=="ANY" else way+"="+q,
            "sort":[{"_score":"DESC"}],
            "size":20,
            "facetVal":[],
            "exactMatch":exact
          },ensure_ascii=False,separators=(',',':')))
          PY
            )
            ok=0
            for attempt in 1 2 3 4; do
              out="$ROOT/raw/$key-attempt-$attempt.json"
              set +e
              code=$(curl -L -sS --connect-timeout 8 --max-time 55                 --retry 1 --retry-delay 2 --retry-all-errors                 -A "$UA"                 -H 'Accept: application/json, text/javascript, */*; q=0.01'                 -H 'X-Requested-With: XMLHttpRequest'                 -H 'Referer: https://meta.nlc.cn/v2/search'                 -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8'                 --data-binary "$body"                 -o "$out" -w '%{http_code}'                 'https://meta.nlc.cn/v2/doSearch?hight=false')
              rc=$?
              set -e
              bytes=0; [ -f "$out" ] && bytes=$(wc -c < "$out")
              printf '%s\tattempt=%s\trc=%s\thttp=%s\tbytes=%s\tq=%s\tway=%s\texact=%s\n'                 "$key" "$attempt" "$rc" "$code" "$bytes" "$q" "$way" "$exact" >> "$ROOT/status.tsv"
              if [ "$rc" -eq 0 ] && [ "$code" = "200" ] && [ "$bytes" -gt 20 ]; then
                cp "$out" "$ROOT/raw/$key.json"
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -eq 0 ]; then
              printf '%s\tFINAL=NO_SUCCESSFUL_HTTP_200\n' "$key" >> "$ROOT/status.tsv"
            fi
          done < "$ROOT/queries.tsv"

          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('audit/batch-12hr-nlc-zuozhuan-title-retry')
          out=[]; cand={}
          title_terms=('附釋音春秋左傳註疏','附釋音春秋左傳注疏','附释音春秋左传注疏','春秋左傳註疏','春秋左傳注疏','春秋左传注疏')
          for p in sorted((root/'raw').glob('*.json')):
              if '-attempt-' in p.name:
                  continue
              out.append('### '+p.name)
              try:o=json.loads(p.read_text('utf-8'))
              except Exception as e:
                  out.append('PARSE_ERROR '+repr(e)); continue
              out.append('status='+repr(o.get('status'))+' total='+repr(o.get('total'))+' message='+repr(o.get('message')))
              for i,row in enumerate(o.get('result') or [],1):
                  src=row.get('_source') or {}
                  titles=src.get('TIT') or []
                  if isinstance(titles,str): titles=[titles]
                  t=' | '.join(map(str,titles))
                  blob=json.dumps(src,ensure_ascii=False,separators=(',',':'))
                  hit=any(x in t for x in title_terms)
                  if hit or i<=5:
                      out.append(('TARGET ' if hit else 'TOP ')+str(i)+' '+json.dumps(row,ensure_ascii=False,separators=(',',':')))
                  if hit:
                      uid=str(src.get('UID') or row.get('_id') or '')
                      if uid: cand[uid]=row
          (root/'search-summary.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          (root/'candidates.json').write_text(json.dumps(cand,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'uids.txt').write_text('\n'.join(cand)+'\n',encoding='utf-8')
          print('===== STATUS =====')
          print((root/'status.tsv').read_text('utf-8'))
          print('===== SEARCH =====')
          print((root/'search-summary.txt').read_text('utf-8')[:160000])
          print('UIDS',list(cand))
          PY

          : > "$ROOT/detail-status.tsv"
          while IFS= read -r uid; do
            [ -z "$uid" ] && continue
            ok=0
            for attempt in 1 2 3 4; do
              out="$ROOT/detail/$uid-attempt-$attempt.json"
              set +e
              code=$(curl -L -sS --connect-timeout 8 --max-time 45                 --retry 1 --retry-delay 2 --retry-all-errors                 -A "$UA"                 -H 'Accept: application/json, text/javascript, */*; q=0.01'                 -H 'X-Requested-With: XMLHttpRequest'                 -H "Referer: https://meta.nlc.cn/v2/detail/$uid"                 -X POST -o "$out" -w '%{http_code}'                 "https://meta.nlc.cn/api/v1/item/$uid/1/999")
              rc=$?
              set -e
              bytes=0; [ -f "$out" ] && bytes=$(wc -c < "$out")
              printf '%s\tattempt=%s\trc=%s\thttp=%s\tbytes=%s\n' "$uid" "$attempt" "$rc" "$code" "$bytes" >> "$ROOT/detail-status.tsv"
              if [ "$rc" -eq 0 ] && [ "$code" = "200" ] && [ "$bytes" -gt 100 ]; then
                cp "$out" "$ROOT/detail/$uid.json"
                ok=1
                break
              fi
              sleep 2
            done
            [ "$ok" -eq 1 ] || printf '%s\tFINAL=NO_SUCCESSFUL_DETAIL\n' "$uid" >> "$ROOT/detail-status.tsv"
          done < "$ROOT/uids.txt"

          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('audit/batch-12hr-nlc-zuozhuan-title-retry')
          keys=('001','035a','049b','049c','200a','200b','200f','205a','210a','210c','210d','215a',
                '300a','305a','307a','316a','3165','317a','318a','321a','423a','4231','455a','4551',
                '610a','690a','701a','702a','711a','712a','801a','801b','801c','852a',
                '905a','905b','905q','905s','910n','910l')
          out=[]
          for p in sorted((root/'detail').glob('UCS*.json')):
              if '-attempt-' in p.name:
                  continue
              out.append('### '+p.name)
              try:o=json.loads(p.read_text('utf-8'))
              except Exception as e:
                  out.append('PARSE_ERROR '+repr(e)); continue
              r=o.get('result') or {}; b=r.get('biblio') or {}; e=r.get('esBook') or {}
              out.append('ES '+json.dumps({k:e.get(k) for k in ('SYS','UID','WDT','YEA','PUB','PAG','TIT','AUT','holdings')},ensure_ascii=False,separators=(',',':')))
              out.append('BIB '+json.dumps({k:b.get(k) for k in keys if k in b},ensure_ascii=False,separators=(',',':')))
              out.append('HOLD '+json.dumps(r.get('holding'),ensure_ascii=False,separators=(',',':')))
              raw=json.dumps(r,ensure_ascii=False)
              out.append('FLAGS '+json.dumps({t:(t in raw) for t in ['铁琴','鐵琴','铜剑','銅劍','瞿','元刻明修','元刻元印','三十二册','三十二冊','32册','32冊','3388','03388','412004000070']},ensure_ascii=False))
          (root/'detail-summary.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('===== DETAIL STATUS =====')
          print((root/'detail-status.tsv').read_text('utf-8'))
          print('===== DETAILS =====')
          print((root/'detail-summary.txt').read_text('utf-8')[:160000])
          PY

          find "$ROOT" -type f -size +0c -print0 | xargs -0 -r sha256sum | sort -V > "$ROOT/files.sha256"
          printf '%s\n'             'SOURCE=National Library of China current meta.nlc.cn search/detail APIs'             'PURPOSE=retry current title discovery for the FID070/Tieqin Yuan-impression Zuozhuan witness after prior title queries timed out'             'NO_NUMERIC_GUESSING=true'             'NEGATIVE_POLICY=timeouts and no-result responses remain route/index observations only'             'OCR_USED=false' > "$ROOT/manifest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: batch-12hr-nlc-zuozhuan-title-retry
          path: audit/batch-12hr-nlc-zuozhuan-title-retry/
          if-no-files-found: error
          retention-days: 30
