name: audit-gexiang-pingtu-ncl06265-crosscopy

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-gexiang-pingtu-ncl06265-crosscopy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install document tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pillow

      - name: Acquire original-Pingtu microfilm surrogate and build locator
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/gexiang-pingtu-ncl06265'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/render" "$ROOT/contact"

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NCL-06265%20%E9%87%8D%E5%88%8A%E9%9D%A9%E8%B1%A1%E6%96%B0%E6%9B%B8.pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"

          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source.sha256"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"
          pdftotext -layout "$ROOT/source.pdf" "$ROOT/text.txt" || true

          PAGES=$(pdfinfo "$ROOT/source.pdf" | awk '/^Pages:/ {print $2}')
          pdftoppm -jpeg -jpegopt quality=90 -r 120 "$ROOT/source.pdf" "$ROOT/render/page" >/dev/null 2>&1
          COUNT=$(find "$ROOT/render" -maxdepth 1 -name 'page-*.jpg' | wc -l)
          test "$COUNT" -eq "$PAGES"
          sha256sum "$ROOT"/render/*.jpg | sort -V > "$ROOT/render.sha256"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('audit/gexiang-pingtu-ncl06265')
          pages=sorted((root/'render').glob('page-*.jpg'),key=lambda p:int(p.stem.split('-')[-1]))
          for i in range(0,len(pages),30):
              batch=pages[i:i+30]
              thumbs=[]
              for p in batch:
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((260,360))
                  c=Image.new('RGB',(280,390),'white')
                  c.paste(im,((280-im.width)//2,24))
                  ImageDraw.Draw(c).text((8,6),p.name,fill='black')
                  thumbs.append(c)
              cols=5; rows=(len(thumbs)+cols-1)//cols
              sh=Image.new('RGB',(cols*280,rows*390),'white')
              for j,im in enumerate(thumbs):
                  sh.paste(im,((j%cols)*280,(j//cols)*390))
              sh.save(root/'contact'/f'contact-{i+1:04d}-{i+len(batch):04d}.jpg',quality=92)
          PY
          sha256sum "$ROOT"/contact/*.jpg | sort -V > "$ROOT/contact.sha256"

          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('audit/gexiang-pingtu-ncl06265')
          txt=(root/'text.txt').read_text(encoding='utf-8',errors='ignore')
          terms=['正德十五年','宣威公署','重刊革象新書','時分百刻','若子時則上半時','屬昨日','屬今日']
          (root/'text-layer-hits.json').write_text(
              json.dumps({t:len(list(re.finditer(re.escape(t),txt))) for t in terms},ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8')
          PY

          printf '%s\n' \
            'SOURCE=NCL-06265 重刊革象新書' \
            'PROVIDER_LINEAGE=Rare Books & Special Collections, National Central Library / 國圖代管原平圖古籍微片 via Wikimedia Commons' \
            'PURPOSE=bind or separate original-Pingtu witness from NLC892-1253 China-NLC surrogate' \
            'CATALOG_IDENTITY=NOT_ASSUMED_FROM_FILENAME_ALONE' \
            'TEXT_LAYER_ROLE=LOCATOR_ONLY_NOT_GLYPH_AUTHORITY' \
            'OCR_USED_FOR_FINAL_GLYPH_CLAIMS=false' \
            > "$ROOT/manifest.txt"

          rm "$ROOT/source.pdf"

      - name: Upload Pingtu cross-copy locator
        uses: actions/upload-artifact@v4
        with:
          name: gexiang-pingtu-ncl06265-crosscopy-locator
          path: audit/gexiang-pingtu-ncl06265
          if-no-files-found: error
          retention-days: 30
