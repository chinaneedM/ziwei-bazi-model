name: verify-batch-12ie-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ie-exact-head.yml
      - docs/research/ZIWEI-GUOXUEJIKAN11-CORRECTED-ISBN-PUBLIC-ROUTE-RECHECK-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-GUOXUEJIKAN11-CORRECTED-ISBN-PUBLIC-ROUTE-RECHECK-IE.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IE status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'tianwen/batch-12ie-exact-head',
              description: 'Batch 12IE corrected-route verification running'
            })

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12IE exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-GUOXUEJIKAN11-CORRECTED-ISBN-PUBLIC-ROUTE-RECHECK-IE'
          e=json.loads(Path('docs/research/ZIWEI-GUOXUEJIKAN11-CORRECTED-ISBN-PUBLIC-ROUTE-RECHECK-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          assert e['corrected_identity_control']['isbn']=='9787209115001'
          p=e['probe']
          assert p['google_books']['adjudication']=='RATE_LIMITED_UNRESOLVED'
          assert p['openlibrary']['isbn_search']['numFound']==0
          assert p['openlibrary']['title_search']['numFound']==0
          assert p['internet_archive']['isbn_field_query']['numFound']==0
          assert p['internet_archive']['quoted_isbn_query']['numFound']==0
          assert p['internet_archive']['exact_issue_title_query']['numFound']==0
          assert p['internet_archive']['exact_article_title_query']['identifier']=='3_20260926_202609'
          assert e['adjudication']['target_article_public_fulltext_retrieved'] is False
          assert e['adjudication']['corrected_google_books_current_statement']=='RATE_LIMITED_UNRESOLVED_NOT_NEGATIVE_EVIDENCE'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,243,0)
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count'] >= 17
          assert state['historical_audit']['repaired_provenance_metadata_defect_count'] >= 17
          assert bid in state['historical_audit']['completed_batches']
          PY

      - name: Publish successful IE status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12ie-exact-head',
              description: 'Batch 12IE corrected-route gates PASS'
            })

      - name: Publish failed IE status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12ie-exact-head',
              description: 'Batch 12IE exact-head verification FAILED'
            })
