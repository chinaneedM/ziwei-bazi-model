name: probe-yehuobian-12vy-cadal-v16-dual-originals
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-12vy-cadal-v16-dual-originals.yml
      - scripts/probe-yehuobian-cadal-v16-dual-images-12vy.py
      - tests/test_yehuobian_cadal_v16_dual_12vy.py
      - docs/research/MING-DATONG-YEHUOBIAN-12VY-*
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/verify-project-continuity-state-r1.py
          python -m unittest discover -s tests -p 'test_yehuobian_cadal_v16_dual_12vy.py' -v
      - name: Install public-format image readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install pillow
      - name: Source SHA and scoped original page capture
        id: capture
        continue-on-error: true
        run: |
          python scripts/probe-yehuobian-cadal-v16-dual-images-12vy.py --output-dir cadal-v16-evidence
      - name: Upload captured source objects and exact image atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadal-v16-dual-source-12vy
          path: cadal-v16-evidence/
          if-no-files-found: warn
