```

## 6. Philological adjudication

The evidence now supports a conservative recension statement:

```text
1594 physical witness:
  target 子/亥 uncertainty wording = directly attested
  night-Zi upper/lower four-ke annotation = directly attested

Hirayama 光緒7序 volume 7-8:
  female-destiny boundary = directly located
  immediate preceding reviewed leaf = target passage not observed
```

This is evidence of **recensional difference/omission at the reviewed boundary**. It does not, by itself, prove which layer authored or removed the passage, and it does not authorize an interpolation theory.

The project therefore preserves the stronger chronological conclusion from AW while adding a transmission warning: the 1594 wording is not mechanically safe to assume across later 《張果星宗大全》 recensions.

## 7. Effect on HPA-ZDATE-006

