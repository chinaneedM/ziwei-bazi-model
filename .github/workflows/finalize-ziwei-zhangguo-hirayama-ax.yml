name: finalize-ziwei-zhangguo-hirayama-ax

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - '.github/workflows/finalize-ziwei-zhangguo-hirayama-ax.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Batch 12AX structured updates
        run: python scripts/finalize-ziwei-zhangguo-hirayama-ax.py

      - name: Verify continuity state
        run: |
          python scripts/verify-project-continuity-state-r1.py
          git diff --check

      - name: Commit Batch 12AX closure
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/PROJECT-CURRENT-STATE-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json \
            docs/research/ZIWEI-TOHOKU-HIRAYAMA-MA591-V5-6-LOCATOR-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-ZHANGGUO-HIRAYAMA-GUANGXU7-RECENSION-COLLATION-AX.md \
            docs/research/ZIWEI-ZHANGGUO-HIRAYAMA-GUANGXU7-RECENSION-COLLATION-R1.json \
            scripts/verify-project-continuity-state-r1.py
          if git diff --cached --quiet; then
            echo 'No Batch 12AX closure changes to commit'
            exit 0
          fi
          git commit -m 'close Batch 12AX Zhangguo Hirayama recension control'
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
