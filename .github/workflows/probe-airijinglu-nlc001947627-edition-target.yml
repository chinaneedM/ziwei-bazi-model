name: probe-airijinglu-nlc001947627-edition-target

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-airijinglu-nlc001947627-edition-target.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Bind NLC alternate edition and locate volume 23 target
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/airijinglu-nlc001947627'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/v1/locator" "$ROOT/v1/hires" "$ROOT/v6/locator" "$ROOT/v6/hires"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-chi-tra-vert >/dev/null
          python -m pip install --quiet pillow

          F1='NLC892-001947627-317255 愛日精廬藏書志 三十六卷續志四卷 第1冊.pdf'
          F6='NLC892-001947627-317261 愛日精廬藏書志 三十六卷續志四卷 第6冊.pdf'
          U1='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-001947627-317255%20%E6%84%9B%E6%97%A5%E7%B2%BE%E5%BB%AC%E8%97%8F%E6%9B%B8%E5%BF%97%20%E4%B8%89%E5%8D%81%E5%85%AD%E5%8D%B7%E7%BA%8C%E5%BF%97%E5%9B%9B%E5%8D%B7%20%E7%AC%AC1%E5%86%8A.pdf'
          U6='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-001947627-317261%20%E6%84%9B%E6%97%A5%E7%B2%BE%E5%BB%AC%E8%97%8F%E6%9B%B8%E5%BF%97%20%E4%B8%89%E5%8D%81%E5%85%AD%E5%8D%B7%E7%BA%8C%E5%BF%97%E5%9B%9B%E5%8D%B7%20%E7%AC%AC6%E5%86%8A.pdf'

          curl -fL --retry 4 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$U1" -o "$ROOT/v1/source.pdf"
          curl -fL --retry 4 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$U6" -o "$ROOT/v6/source.pdf"
          sha256sum "$ROOT/v1/source.pdf" "$ROOT/v6/source.pdf" | tee "$ROOT/source-sha256.txt"
          pdfinfo "$ROOT/v1/source.pdf" > "$ROOT/v1/pdfinfo.txt"
          pdfinfo "$ROOT/v6/source.pdf" > "$ROOT/v6/pdfinfo.txt"

          pdftoppm -jpeg -r 125 "$ROOT/v1/source.pdf" "$ROOT/v1/locator/page" >/dev/null 2>&1
          pdftoppm -jpeg -r 125 "$ROOT/v6/source.pdf" "$ROOT/v6/locator/page" >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageEnhance
          import subprocess,re,json,hashlib
          root=Path('audit/airijinglu-nlc001947627')

          def page_count(tag):
              s=(root/tag/'pdfinfo.txt').read_text(errors='ignore')
              m=re.search(r'^Pages:\s+(\d+)',s,re.M)
              return int(m.group(1))

          def locate(tag,terms):
              d=root/tag; hits=[]
              for p in sorted((d/'locator').glob('page-*.jpg'),key=lambda x:int(re.search(r'-(\d+)\.jpg$',x.name).group(1))):
                  n=int(re.search(r'-(\d+)\.jpg$',p.name).group(1))
                  im=Image.open(p).convert('L')
                  im=ImageOps.autocontrast(im)
                  im=ImageEnhance.Contrast(im).enhance(1.35)
                  tmp=d/'_ocr.png'; im.save(tmp)
                  proc=subprocess.run(['tesseract',str(tmp),'stdout','-l','chi_tra_vert','--psm','5'],
                                      stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
                  txt=proc.stdout.decode('utf-8','ignore'); compact=''.join(txt.split())
                  found=[t for t in terms if t in compact]
                  if found:
                      hits.append({'pdf_page':n,'found':found,'context':' '.join(txt.split())[:2000]})
              if (d/'_ocr.png').exists(): (d/'_ocr.png').unlink()
              return hits

          h1=locate('v1',['道光七年','丁亥','昭文','張氏','光緒十三','靈芬閣','徐氏','校印','重刻','藏書志序'])
          h6=locate('v6',['卷二十三','準齋','准齋','几漏','九漏','孫逢古','孫逢吉','二十五箭','二十有五箭','黃氏','蕘翁'])

          def render(tag,hits,extra_pages):
              d=root/tag; count=page_count(tag)
              pages=set(extra_pages)
              for h in hits:
                  n=h['pdf_page']; pages.update(range(max(1,n-1),min(count,n+1)+1))
              manifest=[]
              for n in sorted(x for x in pages if 1<=x<=count):
                  base=d/'hires'/f'page-{n}'
                  subprocess.run(['pdftoppm','-f',str(n),'-l',str(n),'-singlefile','-png','-r','300',
                                  str(d/'source.pdf'),str(base)],check=True,
                                 stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  p=Path(str(base)+'.png'); im=Image.open(p)
                  manifest.append({'pdf_page':n,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                                   'width':im.width,'height':im.height,'file':str(p.relative_to(root))})
              return manifest

          # Always preserve front/back physical controls for edition identification.
          m1=render('v1',h1,[1,2,3,4,5,page_count('v1')-2,page_count('v1')-1,page_count('v1')])
          m6=render('v6',h6,[1,2,3])

          report={
            'schema':'AIRIJINGLU-NLC001947627-EDITION-TARGET-PROBE-R1',
            'set_id':'NLC892-001947627',
            'v1':{
              'file':'317255 第1冊','source_sha256':hashlib.sha256((root/'v1/source.pdf').read_bytes()).hexdigest(),
              'page_count':page_count('v1'),'ocr_hits':h1,'hires_manifest':m1
            },
            'v6':{
              'file':'317261 第6冊','source_sha256':hashlib.sha256((root/'v6/source.pdf').read_bytes()).hexdigest(),
              'page_count':page_count('v6'),'ocr_hits':h6,'hires_manifest':m6
            },
            'ocr_role':'LOCATOR_ONLY_NOT_FINAL_GLYPH_AUTHORITY',
            'final_authority':'DIRECT_300DPI_SOURCE_BOUND_PAGE_IMAGES'
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          PY

          rm "$ROOT/v1/source.pdf" "$ROOT/v6/source.pdf"
          rm -f "$ROOT"/v1/locator/*.jpg "$ROOT"/v6/locator/*.jpg

      - name: Upload alternate-edition evidence
        uses: actions/upload-artifact@v4
        with:
          name: airijinglu-nlc001947627-r1
          path: audit/airijinglu-nlc001947627
          if-no-files-found: error
          retention-days: 30
