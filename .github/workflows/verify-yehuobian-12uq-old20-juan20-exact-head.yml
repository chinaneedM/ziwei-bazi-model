name: verify-yehuobian-12uq-old20-juan20-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12uq-old20-juan20-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UQ-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UQ-*.md
      - scripts/verify-yehuobian-old20-juan20-bounded-review-r1.py
      - tests/test_yehuobian_old20_juan20_bounded_review_12uq.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify continuity, external registry and genealogy
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Verify 12UQ nine-page scope and regression
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-old20-juan20-bounded-review-r1.py
          python -m unittest discover -s tests -p 'test_yehuobian_old20_juan20_bounded_review_12uq.py' -v
