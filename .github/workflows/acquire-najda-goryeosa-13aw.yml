name: acquire-najda-goryeosa-13aw
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/acquire-najda-goryeosa-13aw.py
      - .github/workflows/acquire-najda-goryeosa-13aw.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-list-bound-internal-table-locator:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source index and URL safety test
        run: python -m unittest discover -s tests -p 'test_najda_goryeosa_13aw_sampling.py' -v
      - name: Fetch bounded internal table transition pages
        run: python scripts/acquire-najda-goryeosa-13aw.py
      - name: Retain page original bytes and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: najda-goryeosa-13aw-table-transition-originals
          path: najda-goryeosa-13aw-evidence/
          retention-days: 30
          if-no-files-found: warn
