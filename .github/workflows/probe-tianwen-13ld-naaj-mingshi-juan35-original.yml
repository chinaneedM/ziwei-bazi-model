name: probe-tianwen-13ld-naaj-mingshi-juan35-original
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-tianwen-13ld-naaj-mingshi-juan35-original.py
      - .github/workflows/probe-tianwen-13ld-naaj-mingshi-juan35-original.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  no-ocr-source-image:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pymupdf pillow
      - run: python scripts/probe-tianwen-13ld-naaj-mingshi-juan35-original.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13ld-naaj-2810038-juan35-native
          path: 13ld-naaj-original-output/
          retention-days: 7
