name: research-kostma-toyo1646-godataview

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-kostma-toyo1646-godataview.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium requests

      - name: Invoke exact current KOSTMA goDataView binding and capture emitted routes
        shell: python
        run: |
          import json,time,hashlib
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          OUT=Path("probe"); OUT.mkdir()
          URL="https://kostma.aks.ac.kr/dataSearch/dataSearchList.aspx?cateQ=aksBook&curPage=72&fq=com_%ED%98%84%EC%86%8C%EC%9E%A5%EC%B2%98_fct:%EC%9D%BC%EB%B3%B8+%EB%8F%99%EC%96%91%EB%AC%B8%EA%B3%A0&pageSize=20&query=&sType=&sort="
          UCI="RIKS+CRMA+KSM-WZ.0000.0000-20140423.TOYO_1646"
          result={
            "schema":"ZIWEI-KOSTMA-TOYO1646-GODATAVIEW-R1",
            "source_url":URL,"uci":UCI,
            "action_origin":"EXACT_JAVASCRIPT_GODATAVIEW_BINDING_EMITTED_BY_CURRENT_KOSTMA_RESULT_HTML",
            "authentication_attempted":False,"route_guessing_attempted":False,
            "page_enumeration_attempted":False
          }
          opts=Options(); opts.add_argument("--headless=new"); opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage"); opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1800,3200"); opts.add_argument("--lang=ko-KR")
          opts.set_capability("goog:loggingPrefs",{"performance":"ALL","browser":"ALL"})
          d=webdriver.Chrome(options=opts)
          try:
            d.set_page_load_timeout(90); d.get(URL); time.sleep(8)
            result["initial_url"]=d.current_url; result["initial_title"]=d.title
            result["goDataView_type"]=d.execute_script("return typeof goDataView;")
            result["goDataView_source"]=d.execute_script("return (typeof goDataView==='function') ? goDataView.toString() : null;")
            exact=d.find_elements(By.CSS_SELECTOR,'a.dSearch[data-href-key="RIKS+CRMA+KSM-WZ.0000.0000-20140423.TOYO_1646"]')
            result["exact_anchor_count"]=len(exact)
            if exact:
              a=exact[0]
              result["exact_anchor"]={
                "href":a.get_attribute("href"),"data_href_key":a.get_attribute("data-href-key"),
                "outerHTML":(a.get_attribute("outerHTML") or "")[:12000]
              }
            # Invoke precisely the function/arguments emitted by target anchor.
            if result["goDataView_type"]=="function" and exact:
              d.execute_script("goDataView(arguments[0], '');",UCI)
              time.sleep(10)
              result["post_action_url"]=d.current_url
              result["post_action_title"]=d.title
              try:
                result["post_action_body"]=d.find_element(By.TAG_NAME,"body").text[:120000]
                (OUT/"post-action.html").write_text(d.page_source,encoding="utf-8")
                d.save_screenshot(str(OUT/"post-action.png"))
              except Exception: pass
            net=[]
            for entry in d.get_log("performance"):
              try:
                m=json.loads(entry["message"])["message"]
                if m.get("method")!="Network.responseReceived": continue
                p=m.get("params",{}); resp=p.get("response",{}); u=resp.get("url","")
                if "kostma.aks.ac.kr" in u:
                  net.append({"url":u,"status":resp.get("status"),"mimeType":resp.get("mimeType"),"type":p.get("type")})
              except Exception: pass
            seen=set(); ded=[]
            for x in net:
              k=(x["url"],x.get("status"),x.get("mimeType"))
              if k not in seen: seen.add(k); ded.append(x)
            result["observed_network"]=ded[:3000]
            result["browser_logs"]=d.get_log("browser")[:500]
          except Exception as e:
            result["error"]=type(e).__name__+": "+str(e)
          finally:
            d.quit()
          result["adjudication"]={
            "exact_target_action_bound":bool(result.get("exact_anchor_count")),
            "detail_or_viewer_route":"PENDING_REVIEW_OF_POST_ACTION_URL_AND_OBSERVED_NETWORK",
            "target_page_observed":False,
            "independent_hai_glyph_vote_added":0,
            "algorithm_effect":"NONE"
          }
          (OUT/"probe.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
            "initial_url":result.get("initial_url"),"initial_title":result.get("initial_title"),
            "goDataView_type":result.get("goDataView_type"),"goDataView_source":result.get("goDataView_source"),
            "exact_anchor_count":result.get("exact_anchor_count"),"exact_anchor":result.get("exact_anchor"),
            "post_action_url":result.get("post_action_url"),"post_action_title":result.get("post_action_title"),
            "post_action_body":result.get("post_action_body"),
            "observed_network":result.get("observed_network",[])[:500],
            "error":result.get("error"),"adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))

      - name: Upload KOSTMA goDataView evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-kostma-toyo1646-godataview
          path: probe/
          if-no-files-found: warn
          retention-days: 14
