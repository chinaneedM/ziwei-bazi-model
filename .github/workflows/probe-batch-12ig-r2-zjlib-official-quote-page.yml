name: probe-batch-12ig-r2-zjlib-official-quote-page

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - '.github/workflows/probe-batch-12ig-r2-zjlib-official-quote-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Bind official PDF quote to exact PDF page
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/batch-12ig-r2-zjlib-quote-page'
          TMP="$RUNNER_TEMP/ig2"
          rm -rf "$ROOT" "$TMP"; mkdir -p "$ROOT" "$TMP"
          URL='https://bjb.zjlib.cn/CN/PDF/1737'
          EXPECTED='2e0b9c1d59ccc95523b48144964cb8f528161c3b9201cb28da0cee41de9cd776'
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils > /dev/null
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 120 \
            -A 'Mozilla/5.0 Tianwen-Provenance-Audit/1.0' -o "$TMP/issue.pdf" "$URL"
          GOT=$(sha256sum "$TMP/issue.pdf" | awk '{print $1}')
          [ "$GOT" = "$EXPECTED" ] || { echo "sha256 mismatch $GOT"; exit 1; }
          pdfinfo "$TMP/issue.pdf" > "$ROOT/pdfinfo.txt"
          PAGES=$(pdfinfo "$TMP/issue.pdf" | awk '/^Pages:/ {print $2}')
          python - "$TMP/issue.pdf" "$PAGES" <<'PY'
          import subprocess,sys,re,json
          from pathlib import Path
          pdf=Path(sys.argv[1]); pages=int(sys.argv[2])
          root=Path('audit/batch-12ig-r2-zjlib-quote-page')
          target='瞿济苍、凤起、旭初三先生捐赠的宋刻《春秋左传注疏》等六十二种'
          hits=[]
          for p in range(1,pages+1):
              raw=subprocess.check_output(['pdftotext','-f',str(p),'-l',str(p),'-layout',str(pdf),'-'],text=True,errors='replace')
              norm=re.sub(r'\s+','',raw)
              tokens={
                'qu_jicang':'瞿济苍' in norm,
                'fengqi':'凤起' in norm,
                'xuchu':'旭初' in norm,
                'song_print':'宋刻' in norm,
                'zuozhuan_contiguous':'春秋左传注疏' in norm,
                'zuozhuan_left_fragment':'春秋左' in norm,
                'zuozhuan_right_fragment':'传注疏' in norm,
                'sixty_two':'六十二种' in norm,
                'ref_2_197':('［2］197' in norm or '[2]197' in norm),
              }
              zuo_ok=tokens['zuozhuan_contiguous'] or (tokens['zuozhuan_left_fragment'] and tokens['zuozhuan_right_fragment'])
              if all(tokens[k] for k in ('qu_jicang','fengqi','xuchu','song_print','sixty_two')) and zuo_ok:
                  i=norm.find('瞿济苍')
                  # Preserve a bounded direct-text excerpt around the hit for machine audit.
                  raw_i=raw.find('瞿济苍')
                  excerpt=raw[max(0,raw_i-350):raw_i+1400] if raw_i>=0 else raw[:1800]
                  hits.append({
                    'pdf_page':p,'tokens':tokens,
                    'normalized_exact_target':target in norm,
                  'zuozhuan_fragment_fallback_used':not tokens['zuozhuan_contiguous'],
                    'normalized_context':norm[max(0,i-120):i+500] if i>=0 else '',
                    'raw_excerpt':excerpt
                  })
          summary={
            'provider':'浙江图书馆《图书馆研究与工作》编辑部',
            'official_issue_page':'https://bjb.zjlib.cn/CN/Y2026/V0/I4/2',
            'official_pdf_url':'https://bjb.zjlib.cn/CN/PDF/1737',
            'pdf_sha256':'2e0b9c1d59ccc95523b48144964cb8f528161c3b9201cb28da0cee41de9cd776',
            'pdf_pages':pages,
            'article':'肖玲《赵万里与古籍保护》',
            'issue':'2026年第4期',
            'article_start_printed_page':89,
            'quote_page_hits':hits,
            'quote_page_count':len(hits),
            'target_quote_tokens_closed_from_official_pdf':len(hits)>0,
            'direct_2011_page197_reviewed':False,
            'direct_1951_original_page_reviewed':False,
            'ocr_used':False,
            'fid070_same_object_with_quoted_song_print_authorized':False,
            'negative_absence_inference_authorized':False
          }
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if not hits:
              raise SystemExit('official PDF quote tokens not co-located on any page')
          PY
          printf '%s\n' \
            "PDF_SHA256=$EXPECTED" \
            'OCR_USED=false' \
            'SOURCE_ROLE=OFFICIAL_JOURNAL_DIRECT_ARTICLE_TEXT_QUOTING_2011_P197' \
            'DIRECT_2011_P197_REVIEWED=false' \
            'DIRECT_1951_ORIGINAL_REVIEWED=false' \
            'FID070_SAME_OBJECT_COLLAPSE_AUTHORIZED=false' \
            > "$ROOT/manifest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ig-r2-zjlib-official-quote-page
          path: audit/batch-12ig-r2-zjlib-quote-page/
          if-no-files-found: error
          retention-days: 30
      - name: Publish status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); let ok=false
            try {
              const s=JSON.parse(fs.readFileSync('audit/batch-12ig-r2-zjlib-quote-page/summary.json','utf8'))
              ok=s.target_quote_tokens_closed_from_official_pdf===true
            } catch(e) {}
            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,
              state:ok?'success':'failure',context:'tianwen/batch-12ig-r2-probe',
              description:ok?'official journal quote page bound':'official quote page not closed'
            })
