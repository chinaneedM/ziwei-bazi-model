name: probe-tianwen-13hm-ndl991069-iiif
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/probe-tianwen-13hm-ndl991069-iiif.py
      - .github/workflows/probe-tianwen-13hm-ndl991069-iiif.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Parse IIIF schema in offline regression tests
        run: python -m unittest discover -s tests -p 'test_tianwen_13hm_ndl991069_iiif.py' -v
      - name: Probe published NDL991069 manifest without image guesses
        run: python scripts/probe-tianwen-13hm-ndl991069-iiif.py
      - name: Preserve exact-HEAD scoped probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13hm-ndl991069-iiif
          path: artifacts/13hm-ndl991069-manifest.json
          if-no-files-found: error
