name: verify-tianwen-13fz-nlc-original-fen-carry
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
  workflow_dispatch:
jobs:
  verify-original-carry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source-scoped original D32-D36 carry, preserve D30 null
        run: python scripts/verify-tianwen-13fz-nlc-p76-fen-carry.py
      - name: Negative mutation tests
        run: python -m unittest discover -s tests -p 'test_verify_tianwen_13fz_nlc_p76_fen_carry.py' -v
