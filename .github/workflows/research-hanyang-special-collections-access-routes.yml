name: research-hanyang-special-collections-access-routes

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-hanyang-special-collections-access-routes.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Render only explicit public Hanyang access pages and record visible routes
        shell: python
        run: |
          import json
          import re
          import time
          import urllib.parse
          from pathlib import Path

          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          OUT = Path("probe")
          OUT.mkdir()
          PAGES = [
              "https://lib.hanyang.ac.kr/library-guide/outer",
              "https://lib.hanyang.ac.kr/",
          ]
          KEYWORDS = (
              "고전자료실", "고서", "희귀", "열람", "복사", "원문", "상호대차",
              "외부이용", "외부", "이용", "copy", "document", "rare", "special"
          )

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-gpu")
          options.add_argument("--window-size=1800,2200")
          options.add_argument("--lang=ko-KR")
          options.set_capability("goog:loggingPrefs", {"performance": "ALL"})

          result = {
              "schema": "ZIWEI-HANYANG-SPECIAL-COLLECTIONS-ACCESS-ROUTES-R2",
              "target_biblio_id": 484926,
              "target_accession": "HOM000001861",
              "scope": "PUBLIC_RENDERED_UI_ONLY",
              "authentication_attempted": False,
              "form_submission_attempted": False,
              "hidden_api_guessing_attempted": False,
              "route_guessing_attempted": False,
              "pages": [],
          }

          driver = webdriver.Chrome(options=options)
          try:
              driver.set_page_load_timeout(90)
              for idx, url in enumerate(PAGES, start=1):
                  driver.get(url)
                  time.sleep(8)
                  body = driver.find_element(By.TAG_NAME, "body").text
                  driver.save_screenshot(str(OUT / f"page-{idx:02d}.png"))
                  (OUT / f"page-{idx:02d}.html").write_text(driver.page_source, encoding="utf-8")

                  keyword_contexts = []
                  for kw in KEYWORDS:
                      for m in re.finditer(re.escape(kw), body, flags=re.I):
                          a=max(0,m.start()-220); b=min(len(body),m.end()+420)
                          keyword_contexts.append({"keyword":kw,"context":body[a:b]})
                          if len(keyword_contexts) >= 150:
                              break
                      if len(keyword_contexts) >= 150:
                          break

                  relevant_links = []
                  for a in driver.find_elements(By.CSS_SELECTOR, "a[href]"):
                      try:
                          if not a.is_displayed():
                              continue
                          txt = " ".join((a.text or "").split())
                          href = a.get_attribute("href") or ""
                          hay = (txt + " " + href).lower()
                          if any(k.lower() in hay for k in KEYWORDS):
                              relevant_links.append({"text":txt[:500],"href":href})
                      except Exception:
                          pass
                  dedup=[]; seen=set()
                  for row in relevant_links:
                      key=(row["text"],row["href"])
                      if key not in seen:
                          seen.add(key); dedup.append(row)

                  result["pages"].append({
                      "requested_url": url,
                      "final_url": driver.current_url,
                      "title": driver.title,
                      "body_text": body[:40000],
                      "keyword_contexts": keyword_contexts,
                      "rendered_relevant_links": dedup[:300],
                  })

              network=[]
              for entry in driver.get_log("performance"):
                  try:
                      msg=json.loads(entry["message"])["message"]
                  except Exception:
                      continue
                  if msg.get("method") not in ("Network.requestWillBeSent","Network.responseReceived"):
                      continue
                  params=msg.get("params",{})
                  if msg["method"]=="Network.requestWillBeSent":
                      req=params.get("request",{}); url=req.get("url",""); method=req.get("method"); status=None
                  else:
                      resp=params.get("response",{}); url=resp.get("url",""); method=None; status=resp.get("status")
                  if "lib.hanyang.ac.kr" not in url:
                      continue
                  parsed=urllib.parse.urlsplit(url)
                  safe_q={}
                  for k,v in urllib.parse.parse_qsl(parsed.query,keep_blank_values=True):
                      safe_q[k]="__REDACTED__" if any(s in k.lower() for s in ("token","auth","password","session")) else v[:500]
                  network.append({
                      "event":msg["method"],"method":method,"status":status,
                      "url":urllib.parse.urlunsplit((parsed.scheme,parsed.netloc,parsed.path,"","")),
                      "safe_query":safe_q,
                  })
              result["public_ui_network_observations"]=network[-1200:]
          finally:
              driver.quit()

          all_text="\n".join(p["body_text"] for p in result["pages"])
          result["adjudication"]={
              "rare_book_specific_service_language_observed": any(k in all_text for k in ("고전자료실","고서","희귀")),
              "copy_or_document_service_language_observed": any(k in all_text for k in ("복사","원문","상호대차")),
              "next_action":"FOLLOW_ONLY_RENDERED_RELEVANT_PUBLIC_LINKS_OR_NATURALLY_EMITTED_PUBLIC_ROUTES",
              "target_page_status":"PENDING_DIRECT_PAGE",
              "algorithm_effect":"NONE",
          }
          (OUT/"hanyang-special-collections-access-routes.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          print(json.dumps({
              "pages":[{
                  "requested_url":p["requested_url"],
                  "final_url":p["final_url"],
                  "title":p["title"],
                  "keyword_contexts":p["keyword_contexts"],
                  "rendered_relevant_links":p["rendered_relevant_links"],
              } for p in result["pages"]],
              "adjudication":result["adjudication"],
          },ensure_ascii=False,indent=2))

      - name: Upload Hanyang access-route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-hanyang-special-collections-access-routes
          path: probe/
          if-no-files-found: warn
          retention-days: 14
