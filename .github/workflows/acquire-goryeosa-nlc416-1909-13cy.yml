name: acquire-goryeosa-nlc416-1909-13cy
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/acquire-goryeosa-nlc416-1909-13cy.yml"
      - "scripts/acquire-goryeosa-nlc416-1909-13cy.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nlc416-original:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF image renderer without OCR
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<1.28" "Pillow>=10,<12" requests
      - name: Acquire exact original public PDF and build bounded page atlas
        run: python scripts/acquire-goryeosa-nlc416-1909-13cy.py --emit-preview-base64
      - name: Archive source PDF SHA-bound page atlas and access diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goryeosa-nlc416-1909-13cy-original-pdf-atlas
          path: goryeosa-13cy-original/
          retention-days: 45
          compression-level: 0
          if-no-files-found: warn
