name: acquire-najda-goryeosa-13as
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/acquire-najda-goryeosa-13as.py
      - .github/workflows/acquire-najda-goryeosa-13as.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-native-firstparty-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact official manifest and at most three source-listed native pages
        run: python scripts/acquire-najda-goryeosa-13as.py
      - name: Save source-native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: najda-goryeosa-13as-native-evidence
          path: najda-goryeosa-13as-evidence/
          retention-days: 30
          if-no-files-found: warn
