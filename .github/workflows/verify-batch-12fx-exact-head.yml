name: verify-batch-12fx-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fx-exact-head.yml
      - docs/research/ZIWEI-DENG-ZHICHENG-DIARY-1950-0129-EDITOR-CHECKED-SERIAL-ROUTE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-DIARY-1950-0129-EDITOR-CHECKED-SERIAL-ROUTE-AND-VOL5-P222-CITATION-BOUNDARY-FX.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FX exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-DENG-ZHICHENG-DIARY-1950-0129-EDITOR-CHECKED-SERIAL-ROUTE-AND-VOL5-P222-CITATION-BOUNDARY-FX'
          ep=Path('docs/research/ZIWEI-DENG-ZHICHENG-DIARY-1950-0129-EDITOR-CHECKED-SERIAL-ROUTE-R1.json')
          dp=Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-DIARY-1950-0129-EDITOR-CHECKED-SERIAL-ROUTE-AND-VOL5-P222-CITATION-BOUNDARY-FX.md')
          assert ep.is_file() and dp.is_file()
          e=json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          ed=e['first_person_editorial_control']
          assert ed['provider']=='南京大学'
          assert ed['author']=='邓瑞'
          assert ed['every_proof_checked_against_original'] is True
          assert ed['direct_facsimile_equivalent'] is False
          assert ed['exact_1950_01_29_serial_page']=='UNRESOLVED'
          assert ed['target_facsimile_page_directly_reviewed_by_project'] is False

          tq=e['institutional_target_quote_control']
          assert tq['provider']=='清华校友总会'
          assert tq['attributed_diary_date']=='1950-01-29'
          assert tq['exact_wording_promoted_to_direct_handwriting'] is False
          assert tq['target_facsimile_page_resolved'] is False

          p=e['non_target_volume5_page_citation_control']
          assert p['cited_2007_facsimile_location']=='《邓之诚日记》第五册第222页'
          assert p['editorial_note']=='《札记》录文有删略'
          assert p['target_1950_01_29_same_passage'] is False
          assert p['direct_facsimile_page_222_reviewed_by_project'] is False
          assert p['target_1950_01_29_page_inferred_from_p222'] is False

          s=e['serial_issue_discovery_control']
          assert s['authority_status']=='DISCOVERY_ONLY_PENDING_PRIMARY_JOURNAL_ISSUE_REVIEW'
          assert s['target_1950_01_29_inclusion']=='UNRESOLVED'
          assert s['target_1950_01_29_journal_page']=='UNRESOLVED'
          assert s['journal_page_domain_is_not_facsimile_page_domain'] is True

          a=e['adjudication']
          assert a['editor_checked_serial_route']=='CLOSED'
          assert a['target_1950_01_29_serial_page']=='UNRESOLVED'
          assert a['target_1950_01_29_facsimile_page']=='UNRESOLVED'
          assert a['target_1950_01_29_facsimile_text']=='NOT_REVIEWED'
          assert a['target_1950_01_29_handwriting_directly_collated'] is False
          assert a['target_specific_purchase_route_selected'] is False
          assert a['target_specific_donation_route_selected'] is False
          assert a['final_nlc_acquisition_transfer_path']=='UNRESOLVED'

          fw=e['inference_firewall']
          for key in (
              'editor_checked_serial_transcription_does_not_equal_facsimile_handwriting',
              'institutional_secondary_quote_does_not_equal_original_diary_page',
              'non_target_volume5_page222_does_not_locate_target_jan29_page',
              'journal_pagination_must_not_be_mapped_to_facsimile_pagination_without_direct_crosswalk',
              'derivative_abbreviation_warning_requires_direct_facsimile_collation_before_exact_wording_promotion',
              'collection_level_twelve_box_purchase_does_not_bind_target_volume',
              'target_route_requires_item_level_or_stable_identifier_level_transaction_evidence',
          ):
              assert fw[key] is True

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          state_schema_version=tuple(int(part) for part in state['schema_version'].split('.'))
          assert state_schema_version >= (1, 184, 0)
          assert bid in state['historical_audit']['completed_batches']

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {
              'EXT-NJU-DENG-RUI-WUSHIZHAI-SERIAL-PROOF-COLLATION',
              'EXT-TSINGHUA-ALUMNI-ZHAO-WANLI-DENG-1950-0129',
              'EXT-HUWENHUI-DENG-DIARY-VOL5-P222-ABRIDGEMENT-CONTROL',
          }.issubset(ids)

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_provenance_metadata_defect_count']==13
          assert e['accounting']['repaired_provenance_metadata_defect_count']==13
          PY
