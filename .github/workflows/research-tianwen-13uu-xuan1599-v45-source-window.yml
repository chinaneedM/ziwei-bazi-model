name: research-tianwen-13uu-xuan1599-v45-source-window
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths: [.github/workflows/research-tianwen-13uu-xuan1599-v45-source-window.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  capture-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install original-image reader
        run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2' 'pillow>=10,<13'
      - name: Verify the distinct catalogued Xu An original and save bounded native window
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,pathlib,urllib.request
          import fitz
          from PIL import Image,ImageDraw
          out=pathlib.Path('original');out.mkdir(exist_ok=True)
          url='https://upload.wikimedia.org/wikipedia/commons/c/c4/NLC892-411999015732-116218_%E5%8F%A4%E4%BB%8A%E5%BE%8B%E6%9B%86%E8%80%83_%E7%AC%AC19%E5%86%8A.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'TianwenSourceResearch/1.0 (https://github.com/chinaneedM/ziwei-bazi-model; public-domain original scan)'})
          with urllib.request.urlopen(req,timeout=140) as r:
              pdf_data=r.read(25_000_000)
              assert r.status==200
          assert pdf_data.startswith(b'%PDF-') and 15000000<len(pdf_data)<25000000
          pdf=fitz.open(stream=pdf_data,filetype='pdf')
          assert len(pdf)==59,len(pdf)
          meta={'catalogued_object':'NLC892-411999015732, no.08938, vol19 (古今律曆考 juan45-47)','catalogued_label':'徐安明萬曆27年[1599]','independence_from_NCL06270_and_NCL06273':'UNPROVEN','source_url':url,'pdf_pages':len(pdf),'pdf_bytes':len(pdf_data),'pdf_sha256':hashlib.sha256(pdf_data).hexdigest(),'no_ocr':True,'conclusion':'SOURCE_ACQUIRED_NOT_GLYPH_COLLATED'}
          print('SOURCE_METADATA='+json.dumps(meta,ensure_ascii=False))
          (out/'metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          # First 30 PDF pages only: source volume begins with v45; no whole-book negative assertions.
          pages=list(range(1,31))
          thumbs=[]
          for n in pages:
              pix=pdf[n-1].get_pixmap(matrix=fitz.Matrix(.30,.30),alpha=False)
              im=Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB')
              im.thumbnail((370,285))
              thumbs.append((n,im))
          for off in (0,15):
              canvas=Image.new('RGB',(5*390,3*315),'white')
              pen=ImageDraw.Draw(canvas)
              for i,(n,im) in enumerate(thumbs[off:off+15]):
                  x=(i%5)*390;y=(i//5)*315
                  pen.text((x+8,y+5),'PDF '+str(n),fill='black')
                  canvas.paste(im,(x+4,y+23))
              b=io.BytesIO();canvas.save(b,format='JPEG',quality=77,optimize=True)
              raw=b.getvalue();name='atlas-'+str(off//15+1)+'.jpg'
              (out/name).write_bytes(raw)
              print('ATLAS='+json.dumps({'name':name,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}))
              print('ATLAS_B64_'+str(off//15+1)+'='+base64.b64encode(raw).decode('ascii'))
          # Preserve source-native image bytes for only the probable v45 coefficient-window pages.
          for n in range(1,23):
              pg=pdf[n-1]
              for i,rec in enumerate(pg.get_images(full=True)[:2]):
                  image=pdf.extract_image(rec[0]);raw=image['image']
                  name='p%02d-image%d.%s'%(n,i,image['ext'])
                  (out/name).write_bytes(raw)
                  print('ORIGINAL_IMAGE='+json.dumps({'pdf_page':n,'i':i,'name':name,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'ext':image['ext']}))
          PY
      - name: Retain finite original page window
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13uu-xuan1599-v45-source-window
          path: original/
          retention-days: 30
