name: finalize-batch-12bn-shiqie-tongshu-homolog

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-tongshu-zhengzong-physical-collation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize Batch 12BN
        run: |
          python .github/finalize-shiqie-bn.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python scripts/verify-project-continuity-state-r1.py
          git diff --check
      - name: Commit Batch 12BN
        run: |
          rm -f .github/finalize-shiqie-bn.py
          rm -f .github/workflows/research-shiqie-tongshu-zhengzong-physical-collation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts .github
          git status --short
          git commit -m "close Batch 12BN Shiqie homologous physical collation"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
