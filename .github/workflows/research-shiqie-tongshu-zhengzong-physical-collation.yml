name: research-shiqie-tongshu-zhengzong-physical-collation

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-tongshu-zhengzong-physical-collation.yml

permissions:
  contents: read

jobs:
  collate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install DjVu tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq djvulibre-bin imagemagick
      - name: Acquire exact public Commons CADAL scan and render hundred-ke neighborhood
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tongshu-collation/pages tongshu-collation/text tongshu-collation/tmp
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/%E6%96%B0%E5%88%8A%E7%90%86%E6%B0%A3%E8%A9%B3%E8%BE%AF%E7%BA%82%E8%A6%81%E4%B8%89%E5%8F%B0%E4%BE%BF%E8%A6%BD%E9%80%9A%E6%9B%B8%E6%AD%A3%E5%AE%97%28%E4%B8%80%29.djvu'
          curl -L --fail --retry 3 --user-agent 'ziwei-bazi-model historical provenance audit/1.0' "$URL" -o tongshu-collation/book.djvu
          sha256sum tongshu-collation/book.djvu | tee tongshu-collation/book.sha256
          stat -c '%s' tongshu-collation/book.djvu | tee tongshu-collation/book.size
          pages=$(djvused tongshu-collation/book.djvu -e n)
          echo "$pages" | tee tongshu-collation/page-count.txt
          : > tongshu-collation/hits.tsv
          for i in $(seq 1 "$pages"); do
            txt="tongshu-collation/text/page-${i}.txt"
            djvutxt --page="$i" tongshu-collation/book.djvu "$txt" 2>/dev/null || true
            if grep -Eq '選時寶鏡局|选时宝镜局|子時隔界|子时隔界|成化十八|上四刻|下四刻|百刻' "$txt"; then
              printf '%s\t' "$i" >> tongshu-collation/hits.tsv
              tr '\n' ' ' < "$txt" | head -c 1000 >> tongshu-collation/hits.tsv || true
              printf '\n' >> tongshu-collation/hits.tsv
            fi
          done
          cat tongshu-collation/hits.tsv
          # Sparse embedded text identifies p68 with 百刻. Use it only as locator.
          # Final reading is from the native-resolution physical scan images below.
          seq 58 78 > tongshu-collation/render-pages.txt
          while read -r p; do
            ppm="tongshu-collation/tmp/page-${p}.ppm"
            ddjvu -page="$p" -format=ppm tongshu-collation/book.djvu "$ppm"
            convert "$ppm" "tongshu-collation/pages/page-${p}.png"
            rm -f "$ppm"
          done < tongshu-collation/render-pages.txt
          montage tongshu-collation/pages/page-*.png -thumbnail 240x -tile 4x -geometry +4+4 tongshu-collation/contact-sheet.png
          rm -rf tongshu-collation/tmp tongshu-collation/book.djvu
          find tongshu-collation -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-tongshu-zhengzong-hundred-ke-neighborhood
          path: tongshu-collation/
          if-no-files-found: error
