name: research-shiqie-tongshu-zhengzong-physical-collation

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-tongshu-zhengzong-physical-collation.yml

permissions:
  contents: read

jobs:
  collate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install DjVu tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq djvulibre-bin
      - name: Acquire exact public Commons CADAL scan and locate target parallel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tongshu-collation/pages tongshu-collation/text
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/%E6%96%B0%E5%88%8A%E7%90%86%E6%B0%A3%E8%A9%B3%E8%BE%AF%E7%BA%82%E8%A6%81%E4%B8%89%E5%8F%B0%E4%BE%BF%E8%A6%BD%E9%80%9A%E6%9B%B8%E6%AD%A3%E5%AE%97%28%E4%B8%80%29.djvu'
          curl -L --fail --retry 3 --user-agent 'ziwei-bazi-model historical provenance audit/1.0' "$URL" -o tongshu-collation/book.djvu
          sha256sum tongshu-collation/book.djvu | tee tongshu-collation/book.sha256
          stat -c '%s' tongshu-collation/book.djvu | tee tongshu-collation/book.size
          pages=$(djvused tongshu-collation/book.djvu -e n)
          echo "$pages" | tee tongshu-collation/page-count.txt
          : > tongshu-collation/hits.tsv
          for i in $(seq 1 "$pages"); do
            txt="tongshu-collation/text/page-${i}.txt"
            djvutxt --page="$i" tongshu-collation/book.djvu "$txt" 2>/dev/null || true
            if grep -Eq '選時寶鏡局|选时宝镜局|子時隔界|子时隔界|成化十八|上四刻|下四刻' "$txt"; then
              printf '%s\t' "$i" >> tongshu-collation/hits.tsv
              grep -Eo '.{0,40}(選時寶鏡局|选时宝镜局|子時隔界|子时隔界|成化十八|上四刻|下四刻).{0,80}' "$txt" | tr '\n' ' ' >> tongshu-collation/hits.tsv || true
              printf '\n' >> tongshu-collation/hits.tsv
            fi
          done
          cat tongshu-collation/hits.tsv
          python - <<'PY'
          from pathlib import Path
          hits=[]
          for line in Path('tongshu-collation/hits.tsv').read_text(errors='ignore').splitlines():
              if not line.strip(): continue
              try: hits.append(int(line.split('\t',1)[0]))
              except: pass
          pages=int(Path('tongshu-collation/page-count.txt').read_text().strip())
          targets=set()
          for p in hits:
              for q in range(max(1,p-2), min(pages,p+2)+1): targets.add(q)
          Path('tongshu-collation/render-pages.txt').write_text('\n'.join(map(str,sorted(targets)))+'\n')
          PY
          while read -r p; do
            [ -n "$p" ] || continue
            ddjvu -page="$p" -format=png -dpi=220 tongshu-collation/book.djvu "tongshu-collation/pages/page-${p}.png"
          done < tongshu-collation/render-pages.txt
          rm -f tongshu-collation/book.djvu
          find tongshu-collation -maxdepth 2 -type f -printf '%P %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-tongshu-zhengzong-physical-collation
          path: tongshu-collation/
          if-no-files-found: error
