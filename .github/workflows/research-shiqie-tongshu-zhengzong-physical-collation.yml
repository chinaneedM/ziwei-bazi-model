## 1. Scope

Batch 12BH quarantined the Shidian transcription of 《筮篋理數日抄》卷三 `巳上是上四亥。` because the paired next clause reads `巳上是下四刻。`, and the surrounding mechanics discuss upper/lower four-ke divisions. Batch 12BI then obtained a physical parallel reading `係上四刻，屬本日管；係下四刻，屬第二日管`.

Batch 12BN advances one level further: it directly collates a substantially closer homolog under the same heading `選時寶鏡局`, with the same hundred-ke/twelve-hour framework and the same paired `巳上是上四□ / 巳上是下四刻` clause architecture.

## 2. Physical witness identity

The directly reviewed scan is:

- title: 《新刊理氣詳辯纂要三臺便覽通書正宗》卷八
- public scan identifier: `CADAL02094425`
- route: Wikimedia Commons public CADAL DJVU mirror
- physical scan pages: `116`
- file size: `3,764,355` bytes
- DJVU SHA-256: `bd34f6347c9fc14910ba38f03e06d8185718f8d16df65bea9c702255fca74e85`

Public bibliographic controls identify the work as Ming and attribute compilation to 林紹周; the CText library record reports the original source as Peking University Library and the scanner as CADAL. Shidian additionally labels 林維松 as recompiler. These controls support work/copy identity; the exact print date of this particular scanned copy is not asserted by this batch.

## 3. Direct physical reading

Native-resolution scan page 3 visibly carries the heading:

`選時寶鏡局`

The same page contains the hundred-ke/twelve-hour calculation frame and the paired clauses. Direct visual reading, without OCR as glyph authority, gives:

`巳上是上四刻`

and later:

`巳上是下四刻`

The final glyph of both clauses is visibly `刻`.

The unusual `巳上` form is preserved as printed/transcribed rather than silently normalised to `以上`; the adjudication at issue is the final glyph `刻/亥`.

## 4. Exact comparison with the Shiqie transcription

The reviewed Shidian 《筮篋理數日抄》卷三 transcription gives:

```text
巳上是上四亥。
巳上是下四刻。
```

The direct physical homolog gives:

```text
巳上是上四刻
巳上是下四刻
```

This is not merely a generic statement that a day has upper/lower four-ke divisions. It is a near line-for-line homolog under the same `選時寶鏡局` heading. The discrepancy is isolated to the final token of the upper clause: `亥` in the Shidian Shiqie transcription versus physical `刻` in the homolog.

Together with Batch 12BI and the already observed digital `刻→亥` confusion pattern in related almanac transcription surfaces, this strongly strengthens the diagnosis that the Shidian `上四亥` token is a transcription-layer anomaly rather than affirmative evidence for a four-Hai mechanical rule.

## 5. What this does *not* prove

The exact 1565 《筮篋理數日抄》 target physical leaf remains unread from the currently accessible National Archives/Japan Search routes. Therefore Batch 12BN does **not** claim:

- that the physical Shiqie glyph has now been directly observed;
- that every Shiqie recension must read `刻`;
- that the homolog is genealogically identical to the Shiqie copy;
- that HPA-ZDATE-006 may be selected or collapsed from this evidence.

The correct philological statement is narrower: a highly homologous physical Ming almanac witness reads `刻` in both paired clauses, materially undermining the evidentiary value of the isolated Shidian Shiqie `亥` token.

## 6. Effect on HPA-ZDATE-006

- `HPA-ZDATE-006 = MISSING_FROM_PRODUCT`
- new physical Hai-glyph witness increment: `0`
- new homologous physical `刻` witness increment: `1`
- count Shidian `上四亥` as physical Hai witness: `false`
- runtime winner selected: `false`
- candidate collapse: `false`
- algorithm reopen: `false`

No deterministic runtime code changes are authorized by this batch.

