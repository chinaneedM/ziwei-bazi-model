name: verify-yehuobian-12un-multicopy-backlog-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12un-multicopy-backlog-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UN-*.json
      - scripts/verify-yehuobian-1827-multicopy-backlog-r1.py
      - tests/test_yehuobian_1827_multicopy_backlog_12un.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify continuity, external source registry and original intake
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-original-leaf-intake-r1.py
          python scripts/verify-yehuobian-1827-multicopy-backlog-r1.py
      - name: Validate 12UN incremental catalog candidates and status
        run: python -m unittest discover -s tests -p 'test_yehuobian_1827_multicopy_backlog_12un.py' -v
