name: verify-batch-12fs-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fs-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FS exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-NLC-2024-QU-CITATION-SCOPE-23-24-DISAMBIGUATION-FS'
          e=json.loads(Path('docs/research/ZIWEI-NLC-2024-QU-CITATION-SCOPE-23-24-DISAMBIGUATION-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          seq={x['reference_number']:x for x in e['citation_sequence']}
          assert seq[23]['future_priced_acquisition_intention_source_in_this_article'] is False
          assert seq[24]['priced_acquisition_intention_source_in_this_article'] is True
          s=e['scope_adjudication']
          assert s['ref23_pp446_449_is_article_source_for_future_priced_acquisition_intention'] is False
          assert s['ref24_is_article_source_for_future_priced_acquisition_intention'] is True
          assert s['ref22_is_article_source_for_partial_rare_books_transfer_to_government'] is True
          assert s['article_itself_proves_target_3482_3483_in_any_specific_batch'] is False
          assert s['article_itself_proves_target_purchase'] is False
          assert s['article_itself_proves_target_donation'] is False
          assert s['article_itself_proves_target_exact_acquisition_date'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['schema_version']=='1.179.0'
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc'].endswith('ZIWEI-NLC-2024-QU-CITATION-SCOPE-23-24-DISAMBIGUATION-FS.md')
          assert state['historical_audit']['row_count']==198
          assert state['historical_audit']['audited_row_count']==166
          assert state['historical_audit']['current_missing_from_product_row_count']==10
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==13
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==13
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src=next(x for x in reg['sources'] if x.get('source_id')=='EXT-NLC-PCAB-ZHENG-ZHENDUO-QU-DONATION-AND-PRICED-ACQUISITION-2024')
          b=src['batch_12fs']
          assert b['ref23_is_source_for_future_priced_acquisition_intention'] is False
          assert b['ref24_is_source_for_future_priced_acquisition_intention'] is True
          assert b['underlying_ref22_pages_directly_reviewed'] is False
          assert b['underlying_ref23_pages_directly_reviewed'] is False
          assert b['underlying_ref24_pages_or_letter_directly_reviewed'] is False
          assert b['target_3482_3483_bound'] is False

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          PY
