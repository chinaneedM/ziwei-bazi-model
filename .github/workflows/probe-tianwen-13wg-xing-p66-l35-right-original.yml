name: probe-tianwen-13wg-xing-p66-l35-right-original
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-tianwen-13wg-xing-p66-l35-right-original.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-page:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check known SHA and render right target only
        shell: bash
        run: |
          python -m pip install --quiet pymupdf pillow
          python - <<'PY'
          import urllib.request,hashlib,base64,io,json
          import fitz
          from PIL import Image
          url='https://upload.wikimedia.org/wikipedia/commons/5/5a/NLC892-CBM1408-371933_%E5%8F%A4%E4%BB%8A%E5%BE%8B%E6%9B%86%E8%80%83_%E4%B8%83%E5%8D%81%E4%BA%8C%E5%8D%B7_%E7%AC%AC14%E5%86%8A.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'TianwenResearch/1.0 (source-bound anonymous scholarly collation)'})
          with urllib.request.urlopen(req,timeout=120) as response: raw=response.read()
          d=hashlib.sha256(raw).hexdigest()
          assert d=='95b264e0447fb612a4b389b4b44e8f9871f9d0417b6893699fd37fe589cb23f3',d
          doc=fitz.open(stream=raw,filetype='pdf')
          assert len(doc)==74
          pg=doc[65]
          px=pg.get_pixmap(matrix=fitz.Matrix(6,6),alpha=False)
          im=Image.frombytes('RGB',(px.width,px.height),px.samples)
          # p66 original-source right half, where L35 falls; prior 13WF left crop omitted target.
          bb=(int(im.width*.44),0,im.width,im.height)
          c=im.crop(bb)
          dst=io.BytesIO();c.save(dst,'JPEG',quality=79,optimize=True)
          data=dst.getvalue()
          print('SOURCE_BIND',json.dumps({'pdf_sha256':d,'pdf_bytes':len(raw),'pdf_pages':len(doc),'page':66,'crop_bbox_px':bb,'render_px':list(im.size),'source_not_extra_native_pixels':True},sort_keys=True))
          print('CROP_BEGIN',json.dumps({'jpeg_sha256':hashlib.sha256(data).hexdigest(),'jpeg_bytes':len(data),'crop_width':c.width,'crop_height':c.height,'limit':'L35'},sort_keys=True))
          b64=base64.b64encode(data).decode('ascii')
          for i in range(0,len(b64),6000):
              print('CROP_PART',i//6000,b64[i:i+6000])
          print('CROP_END')
          PY
