name: probe-goryeosa-original-columns-13bd
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-goryeosa-original-columns-13bd.py
      - .github/workflows/probe-goryeosa-original-columns-13bd.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-firstparty-original-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded direct-image handling libraries
        run: python -m pip install 'Pillow>=10,<12' 'PyMuPDF>=1.24,<2'
      - name: Fetch only exact manifest-listed canvas17 and exact Waseda page23 original
        run: python scripts/probe-goryeosa-original-columns-13bd.py
      - name: Preserve raw original images and replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goryeosa-13bd-two-original-columns-images
          path: goryeosa-13bd-source-capture/
          retention-days: 30
          if-no-files-found: warn
