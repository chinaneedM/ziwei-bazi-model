name: verify-yehuobian-12vc-quote-locator-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12vc-quote-locator-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VC-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VC-*.md
      - scripts/verify-yehuobian-jingzhiju-quote-locator-12vc.py
      - tests/test_yehuobian_jingzhiju_quote_locator_12vc.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continuity, registry and genealogy
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Zhu quotation locator scope and 12 regressions
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-jingzhiju-quote-locator-12vc.py
          python -m unittest discover -s tests -p 'test_yehuobian_jingzhiju_quote_locator_12vc.py' -v
