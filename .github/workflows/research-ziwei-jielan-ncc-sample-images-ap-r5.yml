name: research-ziwei-jielan-ncc-sample-images-ap-r5

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-jielan-ncc-sample-images-ap-r5.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Follow only NCC product-page emitted sample image URLs
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          out=Path("batch12ap-r5"); out.mkdir(exist_ok=True)
          page_url="https://www.ncc.com.tw/books/goods.php?act=view_img&id=12865&ismobile=0"

          def get(url,name):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read(); status=r.status; final=r.geturl(); ctype=r.headers.get("Content-Type")
              except Exception as e:
                  return {"url":url,"error":repr(e)}
              (out/name).write_bytes(data)
              return {"url":url,"final_url":final,"http_status":status,"content_type":ctype,
                      "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}

          receipt={"scope":"NCC_PRODUCT_PAGE_SOURCE_EMITTED_SAMPLE_IMAGES_ONLY",
                   "access_control_bypass_attempted":False,
                   "large_image_url_constructed_by_probe":False}
          receipt["product_page"]=get(page_url,"product.html")
          txt=(out/"product.html").read_text("utf-8",errors="ignore")

          # Collect URL-like values exactly as emitted by HTML/JS attributes or string literals.
          vals=[]
          patterns=[
              r'(?:src|href|data-src|data-original|data-zoom-image)\s*=\s*["\']([^"\']+)["\']',
              r'["\']([^"\']*12865_P_[^"\']*\.(?:jpg|jpeg|png|webp)[^"\']*)["\']'
          ]
          for pat in patterns:
              for x in re.findall(pat,txt,re.I):
                  x=html.unescape(x).replace("\\u0026","&")
                  if "12865_P_" not in x:
                      continue
                  u=urllib.parse.urljoin(page_url,x)
                  if u not in vals: vals.append(u)
          receipt["source_emitted_sample_urls"]=vals

          fetched=[]
          for i,u in enumerate(vals):
              rec=get(u,f"sample-{i}.bin")
              rec["source_emitted_by_ncc_product_page"]=True
              fetched.append(rec)
          receipt["fetched_samples"]=fetched
          receipt["max_sample_bytes"]=max([x.get("bytes",0) for x in fetched] or [0])
          receipt["distinct_source_emitted_url_count"]=len(vals)

          # Record every occurrence context so thumbnail/full-size semantics can be audited.
          ctx=[]
          for m in re.finditer(r'.{0,180}12865_P_.{0,260}',txt,re.I|re.S):
              ctx.append(re.sub(r'\s+',' ',m.group(0))[:500])
          receipt["html_contexts"]=ctx[:50]

          (out/"receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n","utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-jielan-ncc-sample-images-ap-r5
          path: batch12ap-r5
          retention-days: 90
