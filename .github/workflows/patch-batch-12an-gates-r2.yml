name: patch-batch-12an-gates-r2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/patch-batch-12an-gates-r2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch 12AN gates against actual 12AM source
        shell: python
        run: |
          from pathlib import Path
          def once(s,a,b,label):
              if a not in s: raise SystemExit("missing patch marker: "+label)
              return s.replace(a,b,1)

          # continuity
          p=Path("scripts/verify-project-continuity-state-r1.py"); s=p.read_text(encoding="utf-8")
          s=once(s,'ZIWEI_RENZI_XUZHI_AM_EVIDENCE = ROOT / "docs/research/ZIWEI-RENZI-XUZHI-LUOJING-GNOMON-BRIDGE-R1.json"','ZIWEI_RENZI_XUZHI_AM_EVIDENCE = ROOT / "docs/research/ZIWEI-RENZI-XUZHI-LUOJING-GNOMON-BRIDGE-R1.json"\nZIWEI_WANXIAOLU_AN_BATCH = ROOT / "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-WANXIAOLU-TIME-MOUNTAIN-BRIDGE-AN.md"\nZIWEI_WANXIAOLU_AN_EVIDENCE = ROOT / "docs/research/ZIWEI-WANXIAOLU-TIME-MOUNTAIN-BRIDGE-R1.json"','continuity constants')
          s=once(s,'    "BATCH-12-ZIWEI-RENZI-XUZHI-LUOJING-GNOMON-BRIDGE-AM",\n]','    "BATCH-12-ZIWEI-RENZI-XUZHI-LUOJING-GNOMON-BRIDGE-AM",\n    "BATCH-12-ZIWEI-WANXIAOLU-TIME-MOUNTAIN-BRIDGE-AN",\n]','continuity batch list')
          s=once(s,'LATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-RENZI-XUZHI-LUOJING-GNOMON-BRIDGE-AM.md"','LATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-WANXIAOLU-TIME-MOUNTAIN-BRIDGE-AN.md"','continuity latest')
          s=once(s,'def main() -> int:\n    for path in (ZIWEI_RENZI_XUZHI_AM_BATCH, ZIWEI_RENZI_XUZHI_AM_EVIDENCE):','def main() -> int:\n    for path in (ZIWEI_WANXIAOLU_AN_BATCH, ZIWEI_WANXIAOLU_AN_EVIDENCE):\n        if not path.is_file():\n            fail(f"Batch 12AN continuity artifact missing: {path.relative_to(ROOT)}")\n\n    for path in (ZIWEI_RENZI_XUZHI_AM_BATCH, ZIWEI_RENZI_XUZHI_AM_EVIDENCE):','continuity existence')
          s=once(s,'    ziwei_renzi_xuzhi_am_evidence = json.loads(ZIWEI_RENZI_XUZHI_AM_EVIDENCE.read_text(encoding="utf-8"))','    ziwei_renzi_xuzhi_am_evidence = json.loads(ZIWEI_RENZI_XUZHI_AM_EVIDENCE.read_text(encoding="utf-8"))\n    ziwei_wanxiaolu_an_evidence = json.loads(ZIWEI_WANXIAOLU_AN_EVIDENCE.read_text(encoding="utf-8"))','continuity load')
          s=once(s,'        "EXT-CTEXT-RENZI-XUZHI-ZHENGZHEN-FENGZHEN",\n    )','        "EXT-CTEXT-RENZI-XUZHI-ZHENGZHEN-FENGZHEN",\n        "EXT-CTEXT-WANXIAOLU-DINGSHI-RESOURCE437415",\n        "EXT-SHIDIAN-WANLIXUDAOZANG-WANXIAOLU-DINGSHI",\n    )','continuity sources')
          s=once(s,'    if row12am.get("runtime_time_standard_binding_status") != expected12am:\n        fail("Batch 12AM Matrix current runtime state regressed")','    if row12am.get("runtime_time_standard_binding_status_batch_12am") != expected12am:\n        fail("Batch 12AM Matrix historical runtime snapshot regressed")','continuity AM snapshot')
          block='''    # Batch 12AN Ming shushu time-mountain bridge.\n    if ziwei_wanxiaolu_an_evidence.get("batch_id") != "BATCH-12-ZIWEI-WANXIAOLU-TIME-MOUNTAIN-BRIDGE-AN":\n        fail("Batch 12AN evidence identity mismatch")\n    router12an = ziwei_wanxiaolu_an_evidence.get("controlling_probes", {}).get("shidian_router_page_map", {})\n    if router12an.get("workflow_run_id") != 34339848620 or router12an.get("artifact_id") != 10099257417 or router12an.get("artifact_zip_sha256") != "aed5ca502e3c41f14f0e4304cf60bf0816d77c54504dcec67d9c35455271466b":\n        fail("Batch 12AN router probe binding regressed")\n    ctext12an=ziwei_wanxiaolu_an_evidence.get("ctext_source", {})\n    if ctext12an.get("source_emitted_target_page_url") != "https://ctext.org/library.pl?if=gb&file=100720&page=144" or ctext12an.get("target_page_number_guessed") is not False or ctext12an.get("glyph_authority_claimed") is not False:\n        fail("Batch 12AN CText locator/glyph firewall regressed")\n    shidian12an=ziwei_wanxiaolu_an_evidence.get("shidian_source", {})\n    if shidian12an.get("source_metadata", {}).get("edition") != "內府明萬曆35年刻本" or shidian12an.get("source_metadata", {}).get("image_source") != "國家圖書館":\n        fail("Batch 12AN Shidian edition binding regressed")\n    if shidian12an.get("target_source_emitted_global_page_span") != [5607, 5611] or shidian12an.get("direct_target_image_bytes_observed") is not False or shidian12an.get("glyph_authority_claimed") is not False:\n        fail("Batch 12AN page-map/evidence firewall regressed")\n    adj12an=ziwei_wanxiaolu_an_evidence.get("adjudication", {})\n    if adj12an.get("twenty_four_mountain_ring_can_encode_time_sector_coordinates") is not True or adj12an.get("actual_time_determination_is_solar_or_astronomical_reference_anchored_in_this_witness") is not True:\n        fail("Batch 12AN semantic bridge regressed")\n    if adj12an.get("magnetic_needle_is_standalone_clock") is not False or adj12an.get("fullbook_cloudy_rainy_time_generation_chain_closed") is not False:\n        fail("Batch 12AN clock/inclement firewall regressed")\n    row12an=next((r for r in matrix.get("rows", ()) if r.get("rule_id") == "HPA-ZDATE-006"), None)\n    expected12an="MING_SHUSHU_24_MOUNTAIN_TIME_SECTOR_MAPPING_CONFIRMED_SOLAR_ASTRONOMICAL_ANCHOR_REMAINS_REQUIRED_FULLBOOK_INCLEMENT_CHAIN_AND_RUNTIME_BINDING_STILL_OPEN"\n    if not row12an or row12an.get("runtime_time_standard_binding_status") != expected12an or row12an.get("audit_status") != "MISSING_FROM_PRODUCT":\n        fail("Batch 12AN current Matrix state regressed")\n    if row12an.get("batch_12an_direct_target_glyph_authority") is not False or row12an.get("batch_12an_fullbook_inclement_time_generation_chain_closed") is not False:\n        fail("Batch 12AN Matrix evidence firewall regressed")\n    if row12an.get("candidate_selected_batch_12an") is not False or row12an.get("candidate_collapsed_batch_12an") is not False or row12an.get("algorithm_reopen_authorized") is not False:\n        fail("Batch 12AN candidate/algorithm firewall regressed")\n\n'''
          s=once(s,'    invariants = state.get("invariants", {})',block+'    invariants = state.get("invariants", {})','continuity AN block'); p.write_text(s,encoding="utf-8")

          # historical verifier (12AM is already a historical snapshot in current source)
          p=Path("scripts/verify-fusion-chart-historical-provenance-audit-r1.py"); s=p.read_text(encoding="utf-8")
          s=once(s,'ZIWEI_RENZI_XUZHI_AM = ROOT / "docs" / "research" / "ZIWEI-RENZI-XUZHI-LUOJING-GNOMON-BRIDGE-R1.json"','ZIWEI_RENZI_XUZHI_AM = ROOT / "docs" / "research" / "ZIWEI-RENZI-XUZHI-LUOJING-GNOMON-BRIDGE-R1.json"\nZIWEI_WANXIAOLU_AN = ROOT / "docs" / "research" / "ZIWEI-WANXIAOLU-TIME-MOUNTAIN-BRIDGE-R1.json"','audit constant')
          an='''    # Batch 12AN time-mountain semantic bridge.\n    wan12an=by_source_id.get("EXT-SHIDIAN-WANLIXUDAOZANG-WANXIAOLU-DINGSHI")\n    ct12an=by_source_id.get("EXT-CTEXT-WANXIAOLU-DINGSHI-RESOURCE437415")\n    if wan12an is None or ct12an is None:\n        raise SystemExit("Batch 12AN source pair missing")\n    if wan12an.get("edition") != "內府明萬曆35年刻本" or wan12an.get("target_image_bytes_observed") is not False or wan12an.get("glyph_authority") is not False:\n        raise SystemExit("Batch 12AN Shidian evidence boundary regressed")\n    if ct12an.get("source_emitted_target_page") != {"file":"100720","page":144,"guessed":False} or ct12an.get("glyph_authority") is not False:\n        raise SystemExit("Batch 12AN CText locator boundary regressed")\n    if not ZIWEI_WANXIAOLU_AN.is_file():\n        raise SystemExit("Batch 12AN evidence missing")\n    ev12an=json.loads(ZIWEI_WANXIAOLU_AN.read_text(encoding="utf-8"))\n    adj12an=ev12an.get("adjudication", {})\n    if ev12an.get("batch_id") != "BATCH-12-ZIWEI-WANXIAOLU-TIME-MOUNTAIN-BRIDGE-AN" or adj12an.get("twenty_four_mountain_ring_can_encode_time_sector_coordinates") is not True or adj12an.get("actual_time_determination_is_solar_or_astronomical_reference_anchored_in_this_witness") is not True:\n        raise SystemExit("Batch 12AN evidence/semantic state regressed")\n    if adj12an.get("magnetic_needle_is_standalone_clock") is not False or adj12an.get("fullbook_cloudy_rainy_time_generation_chain_closed") is not False:\n        raise SystemExit("Batch 12AN clock/inclement firewall regressed")\n    row12an=next((r for r in data.get("rows", ()) if r.get("rule_id") == "HPA-ZDATE-006"), None)\n    expected12an="MING_SHUSHU_24_MOUNTAIN_TIME_SECTOR_MAPPING_CONFIRMED_SOLAR_ASTRONOMICAL_ANCHOR_REMAINS_REQUIRED_FULLBOOK_INCLEMENT_CHAIN_AND_RUNTIME_BINDING_STILL_OPEN"\n    if row12an is None or row12an.get("runtime_time_standard_binding_status_batch_12an") != expected12an:\n        raise SystemExit("Batch 12AN Matrix runtime snapshot regressed")\n    if row12an.get("candidate_selected_batch_12an") is not False or row12an.get("candidate_collapsed_batch_12an") is not False or row12an.get("algorithm_reopen_authorized") is not False:\n        raise SystemExit("Batch 12AN candidate/algorithm firewall regressed")\n\n'''
          s=once(s,'    if by_source_id.get("EXT-ZIWEI-QVXIAN-TRUE-SOLAR-2022") is None:',an+'    if by_source_id.get("EXT-ZIWEI-QVXIAN-TRUE-SOLAR-2022") is None:','audit AN block'); p.write_text(s,encoding="utf-8")

          # focused tests
          p=Path("tests/test_fusion_chart_historical_provenance_audit_matrix_r1.py"); s=p.read_text(encoding="utf-8")
          s=once(s,'            row["runtime_time_standard_binding_status"],\n            "EARLY_MING_SHUSHU_GNOMON_NEEDLE_SEMANTIC_SEPARATION_CONFIRMED_FULLBOOK_INCLEMENT_TIME_REALIZATION_AND_RUNTIME_BINDING_STILL_OPEN",','            row["runtime_time_standard_binding_status_batch_12am"],\n            "EARLY_MING_SHUSHU_GNOMON_NEEDLE_SEMANTIC_SEPARATION_CONFIRMED_FULLBOOK_INCLEMENT_TIME_REALIZATION_AND_RUNTIME_BINDING_STILL_OPEN",','test AM snapshot')
          test='''    def test_batch_12an_wanxiaolu_time_sector_bridge_stays_fail_closed(self) -> None:\n        row = next(row for row in self.rows if row["rule_id"] == "HPA-ZDATE-006")\n        self.assertEqual(row["batch_12an_wanxiaolu_time_mountain_bridge_artifact"], "docs/research/ZIWEI-WANXIAOLU-TIME-MOUNTAIN-BRIDGE-R1.json")\n        self.assertEqual(row["batch_12an_ctext_source_emitted_target_page"], {"file":"100720","page":144,"guessed":False})\n        self.assertEqual(row["batch_12an_shidian_edition"], "內府明萬曆35年刻本")\n        self.assertEqual(row["batch_12an_source_emitted_target_global_page_span"], [5607,5611])\n        self.assertFalse(row["batch_12an_direct_target_glyph_authority"])\n        self.assertTrue(row["batch_12an_twenty_four_mountain_time_sector_semantics_confirmed"])\n        self.assertTrue(row["batch_12an_solar_astronomical_anchor_required_in_witness"])\n        self.assertFalse(row["batch_12an_luojing_standalone_clock_equivalence"])\n        self.assertFalse(row["batch_12an_fullbook_inclement_time_generation_chain_closed"])\n        self.assertFalse(row["candidate_selected_batch_12an"])\n        self.assertFalse(row["candidate_collapsed_batch_12an"])\n        self.assertEqual(row["runtime_time_standard_binding_status"], "MING_SHUSHU_24_MOUNTAIN_TIME_SECTOR_MAPPING_CONFIRMED_SOLAR_ASTRONOMICAL_ANCHOR_REMAINS_REQUIRED_FULLBOOK_INCLEMENT_CHAIN_AND_RUNTIME_BINDING_STILL_OPEN")\n        self.assertEqual(row["audit_status"], "MISSING_FROM_PRODUCT")\n        self.assertFalse(row["algorithm_reopen_authorized"])\n\n\n'''
          s=once(s,'    def test_readme_and_ci_bind_the_audit_stage(self) -> None:',test+'    def test_readme_and_ci_bind_the_audit_stage(self) -> None:','AN test'); p.write_text(s,encoding="utf-8")
      - name: Commit patched gates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-project-continuity-state-r1.py scripts/verify-fusion-chart-historical-provenance-audit-r1.py tests/test_fusion_chart_historical_provenance_audit_matrix_r1.py
          git commit -m "gate Batch 12AN time-mountain bridge"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
