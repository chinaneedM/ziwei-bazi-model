name: probe-batch-12ib-r6-beitu1959-known-positive-calibration

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - '.github/workflows/probe-batch-12ib-r6-beitu1959-known-positive-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Calibrate locator against direct positive pages 55-56
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/batch-12ib-r6'
          TMP="$RUNNER_TEMP/ib6"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/variants" "$TMP"

          URL='https://upload.wikimedia.org/wikipedia/commons/2/28/SSID-12335507_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_1.pdf'
          EXPECTED_SHA1='3ff9c94a69a5b5b799d65fba4a6d00fc2daecc97'
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra python3-pil > /dev/null
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 240 \
            -A 'Tianwen-Provenance-Audit/1.0' -o "$TMP/source.pdf" "$URL"
          GOT=$(sha1sum "$TMP/source.pdf" | awk '{print $1}')
          [ "$GOT" = "$EXPECTED_SHA1" ] || { echo sha1-mismatch; exit 1; }
          sha256sum "$TMP/source.pdf" > "$ROOT/source.sha256"

          for dpi in 160 220 300; do
            pdftoppm -f 55 -l 56 -png -r "$dpi" "$TMP/source.pdf" "$TMP/p$dpi" >/dev/null 2>&1
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageEnhance
          import subprocess,json,re,os

          root=Path('audit/batch-12ib-r6')
          tmp=Path(os.environ['RUNNER_TEMP'])/'ib6'
          expected={
            55:['七二八三','八六四三','7283','8643','10010'],
            56:['三三六八','3368','10010']
          }
          variants=[]
          positives=[]

          def norm(s):
              return re.sub(r'\s+','',s)

          for dpi in (160,220,300):
            files=sorted(tmp.glob(f'p{dpi}-*.png'))
            assert len(files)==2, (dpi,files)
            for idx,path in enumerate(files):
              page=55+idx
              base=Image.open(path).convert('L')
              w,h=base.size
              crop_defs={
                'full':(0,0,w,h),
                'lower55':(0,int(h*.45),w,int(h*.995)),
                'lower45':(0,int(h*.55),w,int(h*.995)),
                'lower35':(0,int(h*.65),w,int(h*.995)),
              }
              for crop_name,box in crop_defs.items():
                crop=base.crop(box)
                for rot in (0,90,270):
                  im=crop.rotate(rot,expand=True,fillcolor=255) if rot else crop
                  for prep in ('plain','autocontrast','threshold'):
                    x=im.copy()
                    if prep in ('autocontrast','threshold'):
                      x=ImageOps.autocontrast(x)
                      x=ImageEnhance.Contrast(x).enhance(1.8)
                    if prep=='threshold':
                      x=x.point(lambda p: 255 if p>185 else 0)
                    if max(x.size)>5200:
                      scale=5200/max(x.size)
                      x=x.resize((int(x.width*scale),int(x.height*scale)))
                    for psm in (5,6,11,12):
                      key=f'p{page}-d{dpi}-{crop_name}-r{rot}-{prep}-m{psm}'
                      if dpi==220 and crop_name in ('lower55','lower45') and rot in (90,270) and prep=='autocontrast' and psm in (5,6):
                        x.save(root/'variants'/f'{key}.png')
                      tmpp=tmp/f'{key}.png'
                      x.save(tmpp)
                      try:
                        txt=subprocess.check_output([
                          'tesseract',str(tmpp),'stdout','-l','chi_tra+eng','--psm',str(psm),
                          '-c','preserve_interword_spaces=1'
                        ],stderr=subprocess.DEVNULL,text=True,errors='replace',timeout=28)
                      except Exception:
                        txt=''
                      tmpp.unlink(missing_ok=True)
                      n=norm(txt)
                      hits=[t for t in expected[page] if t in n]
                      rec={
                        'key':key,'page':page,'dpi':dpi,'crop':crop_name,'rotation':rot,
                        'preprocess':prep,'psm':psm,'hits':hits,'raw_text':txt[:5000]
                      }
                      variants.append(rec)
                      if hits: positives.append(rec)

          positives.sort(key=lambda r:(-len(r['hits']),r['page'],r['key']))
          summary={
            'source_ssid':'12335507',
            'source_sha1':'3ff9c94a69a5b5b799d65fba4a6d00fc2daecc97',
            'pages':[55,56],
            'known_positive_authority':'DIRECT_NO_OCR_VISUAL_COLLATION_FROM_BATCH_12HZ',
            'ocr_role':'CALIBRATION_LOCATOR_ONLY',
            'ocr_is_textual_authority':False,
            'negative_inference_authorized':False,
            'variant_count':len(variants),
            'positive_variant_count':len(positives),
            'top_positive_variants':[
              {k:r[k] for k in ('key','page','dpi','crop','rotation','preprocess','psm','hits')}
              for r in positives[:30]
            ],
            'calibration_pass':any(any(x in r['hits'] for x in ('三三六八','3368')) for r in positives if r['page']==56),
            'calibration_pass_55':any(len(r['hits'])>0 for r in positives if r['page']==55),
          }
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'positive-variants.json').write_text(json.dumps(positives,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

          printf '%s\n' \
            'PURPOSE=calibrate machine navigation only against already manually closed positive catalog pages' \
            'OCR_AUTHORITY=false' \
            'NEGATIVE_ABSENCE_INFERENCE_AUTHORIZED=false' \
            'R6_MUST_NOT_BE_USED_TO_INFER_CATALOG_ABSENCE=true' \
            > "$ROOT/manifest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ib-r6-calibration
          path: audit/batch-12ib-r6/
          if-no-files-found: error
          retention-days: 30

      - name: Publish calibration status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs')
            let ok=false
            try {
              const s=JSON.parse(fs.readFileSync('audit/batch-12ib-r6/summary.json','utf8'))
              ok=!!s.calibration_pass
            } catch(e) {}
            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,
              state: ok ? 'success' : 'failure',
              context:'tianwen/batch-12ib-r6-calibration',
              description: ok
                ? 'known-positive 3368 calibration passed; select best locator variant'
                : 'known-positive calibration failed; no negative inference'
            })
