name: verify-batch-12hy-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hy-exact-head.yml
      - docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-QUDONATION-CHRONOLOGY-FIREWALL-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-QUDONATION-CHRONOLOGY-FIREWALL-HY.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending HY status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tianwen/batch-12hy-exact-head',
              description: 'Batch 12HY chronology firewall verification running'
            })

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12HY exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-QUDONATION-CHRONOLOGY-FIREWALL-HY'
          e=json.loads(Path('docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-QUDONATION-CHRONOLOGY-FIREWALL-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          assert e['target_identity']['fid']=='412004000070'
          assert e['target_identity']['beitu1959_book_number']=='3368'
          assert e['target_identity']['beitu1987_book_number']=='3288'
          d=e['direct_target_donation_control']
          assert d['direct_donor_notation']=='瞿捐'
          assert d['direct_target_donation_provenance_closed'] is True
          assert d['exact_donation_batch_printed'] is False
          assert d['exact_donation_date_printed'] is False
          c=e['collection_level_chronology_controls']
          assert c['nlc_2024']['donation_activity_years']==[1950,1953,1954]
          assert c['nlc_2024']['target_year_selection_authorized'] is False
          assert [x['date'] for x in c['ji_derived_secondary']['reported_events']]==['1950-01-07','1950-03','1953-03']
          z=e['zhao_1951_named_member_candidate_bridge']
          assert z['named_member']['edition_display']=='宋刻'
          assert z['exact_identity_with_fid070']=='UNRESOLVED'
          assert z['same_object_collapse_authorized'] is False
          g=e['catalog_number_gate']
          assert g['exact_3368_to_3288_mechanism']=='UNRESOLVED'
          assert g['negative_search_is_absence_evidence'] is False
          a=e['adjudication']
          assert a['target_exact_donation_year']=='UNRESOLVED'
          assert a['target_exact_donation_batch']=='UNRESOLVED'
          assert a['target_exact_donation_date']=='UNRESOLVED'
          assert a['zhao_1951_song_printed_member_equals_fid070']=='UNRESOLVED'
          assert a['3368_to_3288_mechanism']=='UNRESOLVED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,237,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc']=='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-QUDONATION-CHRONOLOGY-FIREWALL-HY.md'
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==16
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==16
          PY

      - name: Publish successful HY status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'tianwen/batch-12hy-exact-head',
              description: 'Batch 12HY donation chronology firewall gates PASS'
            })

      - name: Publish failed HY status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'tianwen/batch-12hy-exact-head',
              description: 'Batch 12HY exact-head verification FAILED'
            })

# exact-head refresh: HY
