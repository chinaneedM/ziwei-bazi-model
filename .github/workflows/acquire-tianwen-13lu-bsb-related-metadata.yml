name: acquire-tianwen-13lu-bsb-related-metadata
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-tianwen-13lu-bsb-related-metadata.py
      - .github/workflows/acquire-tianwen-13lu-bsb-related-metadata.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/probe-tianwen-13lu-bsb-related-metadata.py --out /tmp/tianwen-13lu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13lu-bsb-manifest-official-relations
          path: /tmp/tianwen-13lu/
          if-no-files-found: warn
      - run: python scripts/verify-tianwen-13lt-bsb-36-folios.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13l*.py' -v
