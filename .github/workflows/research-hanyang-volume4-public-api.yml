name: research-hanyang-volume4-public-api

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-hanyang-volume4-public-api.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Replay only public API requests naturally emitted by Hanyang volume-4 detail
        shell: python
        run: |
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          BASE = "https://lib.hanyang.ac.kr"
          ROUTES = {
              "biblio": "/pyxis-api/1/biblios/484926",
              "items": "/pyxis-api/1/biblios/484926/items",
              "resources": "/pyxis-api/1/biblios/484926/resources?isForPyxis3=true",
          }

          def fetch(route):
              url = BASE + route
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 research-only exact observed public request replay",
                  "Accept": "application/json,text/plain,*/*;q=0.8",
                  "Referer": "https://lib.hanyang.ac.kr/search/i-discovery/484926?type=biblios-list-view",
                  "Accept-Language": "ko,zh;q=0.8,en;q=0.7",
              })
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      raw = resp.read(8_000_001)
                      if len(raw) > 8_000_000:
                          raise RuntimeError("response exceeded guard")
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "bytes": len(raw),
                          "sha256": hashlib.sha256(raw).hexdigest(),
                          "raw": raw,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "raw": b""}

          result = {
              "schema": "ZIWEI-HANYANG-VOLUME4-PUBLIC-API-R1",
              "source_detail_workflow_run_id": 34178157398,
              "source_detail_artifact_id": 10037969864,
              "biblio_id": 484926,
              "accession_from_public_detail": "HOM000001861",
              "routes": {},
              "authentication_attempted": False,
              "route_guessing_attempted": False,
              "parameter_expansion_attempted": False,
          }

          for key, route in ROUTES.items():
              row = fetch(route)
              raw = row.pop("raw", b"")
              payload = None
              if raw:
                  (OUT / f"{key}.json").write_bytes(raw)
                  try:
                      payload = json.loads(raw.decode("utf-8"))
                  except Exception as exc:
                      row["parse_error"] = repr(exc)
              row["json_type"] = type(payload).__name__ if payload is not None else None
              row["json_payload"] = payload
              result["routes"][key] = row

          resources = result["routes"].get("resources", {}).get("json_payload")
          items = result["routes"].get("items", {}).get("json_payload")
          biblio = result["routes"].get("biblio", {}).get("json_payload")
          result["adjudication"] = {
              "official_hanyang_volume4_record": "BOUND_TO_BIBLIO_484926",
              "resources_payload_type": type(resources).__name__,
              "resources_payload_empty": resources in (None, [], {}, ""),
              "public_catalog_current_digital_resource_status": (
                  "NO_PUBLIC_DIGITAL_RESOURCE_OBJECT_RETURNED_BY_OBSERVED_RESOURCES_ROUTE"
                  if resources in (None, [], {}, "")
                  else "PUBLIC_RESOURCE_OBJECT_PRESENT_REQUIRES_REVIEW"
              ),
              "items_payload_present": items is not None,
              "biblio_payload_present": biblio is not None,
              "target_page_status": "NOT_EXPOSED_BY_CURRENT_PUBLIC_CATALOG_SURFACE",
              "negative_target_text_absence_claim_authorized": False,
              "algorithm_effect": "NONE",
          }
          (OUT / "hanyang-volume4-public-api.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))

      - name: Upload Hanyang volume-4 public API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-hanyang-volume4-public-api
          path: probe/
          if-no-files-found: warn
          retention-days: 14
