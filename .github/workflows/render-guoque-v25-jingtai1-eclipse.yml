name: render-guoque-v25-jingtai1-eclipse

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-guoque-v25-jingtai1-eclipse.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick

      - name: Download Guoque volume 25
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/pages evidence/contact evidence/text
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/ZJLib-65e6fe7f969db848e322aa5a-25%20%E5%9C%8B%E6%A6%B7%E4%B8%8D%E5%88%86%E5%8D%B7%20%E7%AC%AC25%E5%86%8A.pdf'
          curl -L --fail --retry 5 --retry-delay 3 "$url" -o evidence/guoque-v25.pdf
          sha256sum evidence/guoque-v25.pdf | tee evidence/source.sha256
          pdfinfo evidence/guoque-v25.pdf | tee evidence/pdfinfo.txt
          pdftotext -layout evidence/guoque-v25.pdf evidence/text/full.txt || true
          grep -nE '景泰元年|庚午|正月|辛卯|月食|卯正|辰初|許惇|許敦|救護|欽天監' evidence/text/full.txt > evidence/text-layer-target-hits.txt || true

      - name: Render all pages without OCR
        shell: bash
        run: |
          set -euo pipefail
          pdftoppm -jpeg -jpegopt quality=90 -r 140 evidence/guoque-v25.pdf evidence/pages/page
          mapfile -t pages < <(find evidence/pages -maxdepth 1 -name 'page-*.jpg' | sort -V)
          n=${#pages[@]}
          echo "RENDERED_PAGE_COUNT=$n" | tee evidence/render-count.txt
          test "$n" -gt 0
          sha256sum "${pages[@]}" | sort -V > evidence/pages.sha256
          offset=0
          while [ "$offset" -lt "$n" ]; do
            start=$((offset+1))
            end=$((offset+12))
            [ "$end" -gt "$n" ] && end=$n
            chunk=("${pages[@]:offset:12}")
            out="evidence/contact/contact-$(printf '%03d' "$start")-$(printf '%03d' "$end").jpg"
            montage "${chunk[@]}" -thumbnail 300x420 -tile 4x -geometry +4+18 "$out"
            offset=$((offset+12))
          done
          sha256sum evidence/contact/*.jpg | sort -V > evidence/contact.sha256
          printf '%s\n'             'NO_OCR_USED_FOR_FINAL_GLYPH_CLAIMS=true'             'SOURCE=Wikimedia Commons / Zhejiang Library 國榷 第25冊'             'INVENTORY_TARGET=卷二十九 庚午景泰元年 正月'             'RESEARCH_TARGET=景泰元年正月辛卯月食'             'TEXT_LAYER_POLICY=pdftotext is locator aid only; final wording claims require direct rendered-page review'             'SOURCE_ROLE=PHYSICAL_PAGE_COLLATION_CONTROL_FOR_BATCH_12PQ'             > evidence/manifest.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: guoque-v25-jingtai1-eclipse-physical
          path: evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
