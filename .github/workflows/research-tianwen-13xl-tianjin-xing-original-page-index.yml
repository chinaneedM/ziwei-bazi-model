name: research-tianwen-13xl-tianjin-xing-original-page-index
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths: [.github/workflows/research-tianwen-13xl-tianjin-xing-original-page-index.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-index:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and PDF support
        run: python -m pip install --disable-pip-version-check PyMuPDF Pillow
      - name: Read public Commons source volumes without OCR
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, urllib.parse, urllib.request
          from pathlib import Path
          import fitz
          from PIL import Image, ImageDraw
          out = Path('public-source-index')
          out.mkdir(exist_ok=True)
          records = []
          volumes = {18: ('260873', '7/76'), 19: ('260932', '3/33'), 20: ('260933', 'a/a2')}
          for vol, (identifier, digest_path) in volumes.items():
              filename = f'NLC892-GBZX0301013346-{identifier} 古今律曆考 七十二卷 第{vol}冊.pdf'
              if digest_path:
                  url = 'https://upload.wikimedia.org/wikipedia/commons/' + digest_path + '/' + urllib.parse.quote(filename.replace(' ', '_'))
              else:
                  url = 'https://commons.wikimedia.org/wiki/Special:Redirect/file/' + urllib.parse.quote(filename.replace(' ', '_'))
              row = {'source_volume': vol, 'filename': filename, 'url': url}
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Tianwen-public-domain-bibliography/1.0'})
                  with urllib.request.urlopen(req, timeout=90) as response:
                      raw = response.read(43_000_001)
                      row.update({'http': response.status, 'content_type': response.headers.get('content-type')})
                  assert raw[:5] == b'%PDF-' and len(raw) < 43_000_000, 'No bounded original PDF received'
                  doc = fitz.open(stream=raw, filetype='pdf')
                  row.update({'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'pdf_pages': len(doc)})
                  thumbs = []
                  text_lens = []
                  for n, page in enumerate(doc):
                      text_lens.append(len(page.get_text().strip()))
                      pix = page.get_pixmap(matrix=fitz.Matrix(0.65, 0.65), alpha=False)
                      im = Image.frombytes('RGB', [pix.width, pix.height], pix.samples)
                      im.thumbnail((165, 235))
                      thumbs.append(im)
                  row['text_layer_nonempty_pages'] = sum(k > 0 for k in text_lens)
                  cell_w, cell_h, cols = 184, 258, 5
                  sheet = Image.new('RGB', (cols*cell_w, ((len(thumbs)+cols-1)//cols)*cell_h), 'white')
                  d = ImageDraw.Draw(sheet)
                  for i, thumb in enumerate(thumbs):
                      x, y = i%cols*cell_w, i//cols*cell_h
                      sheet.paste(thumb, (x+8, y+18))
                      d.text((x+8, y+2), f'v{vol} p{i+1}', fill='black')
                  buf = io.BytesIO()
                  sheet.save(buf, format='JPEG', quality=74, optimize=True)
                  sheet_bytes=buf.getvalue()
                  (out / f'volume{vol}-all-pages-contact.jpg').write_bytes(sheet_bytes)
                  row['contact_sha256'] = hashlib.sha256(sheet_bytes).hexdigest()
                  row['contact_bytes'] = len(sheet_bytes)
                  if vol == 19:
                      for page_no in [20, 21, 22, 23, 24, 30, 32, 35, 38, 39, 40, 41, 42, 43, 44]:
                          page = doc[page_no-1]
                          images = page.get_images(full=True)
                          if images:
                              raw_img = doc.extract_image(images[0][0])['image']
                              native = Image.open(io.BytesIO(raw_img)).convert('RGB')
                              input_hash = hashlib.sha256(raw_img).hexdigest()
                              image_kind = 'embedded'
                          else:
                              pix = page.get_pixmap(matrix=fitz.Matrix(2, 2), alpha=False)
                              native = Image.frombytes('RGB', (pix.width, pix.height), pix.samples)
                              input_hash = None
                              image_kind = 'page_render_fallback'
                          original_dims = native.size
                          native.thumbnail((2200, 2200))
                          buf2=io.BytesIO()
                          native.save(buf2, format='JPEG', quality=80, optimize=True)
                          data2=buf2.getvalue()
                          (out / f'volume19-page{page_no}-native.jpg').write_bytes(data2)
                          print('NATIVE_IMAGE_INFO', json.dumps({'volume':vol,'pdf_page':page_no,'kind':image_kind,'embedded_sha256':input_hash,'original_dims':original_dims,'export_dims':native.size,'export_jpeg_sha256':hashlib.sha256(data2).hexdigest(),'bytes':len(data2)}, ensure_ascii=False))
                          encoded2 = base64.b64encode(data2).decode('ascii')
                          for offset in range(0, len(encoded2), 2500):
                              print(f'NATIVE19_{page_no}|{offset//2500:04d}|{encoded2[offset:offset+2500]}')
                  print('VOLUME_SOURCE', json.dumps(row, ensure_ascii=False))
                  encoded = base64.b64encode(sheet_bytes).decode('ascii')
                  for i in range(0, len(encoded), 2500):
                      print(f'CONTACT_{vol}|{i//2500:04d}|{encoded[i:i+2500]}')
              except Exception as e:
                  row['error'] = type(e).__name__ + ': ' + str(e)
                  print('VOLUME_SOURCE_ERROR', json.dumps(row, ensure_ascii=False))
              records.append(row)
          (out / 'source-index.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          assert any('sha256' in r for r in records), 'No source volume retrieved'
          PY
      - name: Preserve derived page index only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13xl-tianjin-public-page-index
          path: public-source-index/
          retention-days: 60
