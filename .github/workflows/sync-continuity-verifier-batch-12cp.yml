name: sync-continuity-verifier-batch-12cp

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/sync-continuity-verifier-batch-12cp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Advance continuity verifier through Batch 12CP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-project-continuity-state-r1.py')
          text = path.read_text(encoding='utf-8')

          old_tail = '''    "BATCH-12-ZIWEI-DATONG-RITONGGUI-KYUJANGGAK-DAYNIGHT-BRIDGE-CN",\n    "BATCH-12-ZIWEI-DATONG-RITONGGUI-KOSTMA-ATTRIBUTION-REPAIR-CO",\n]'''
          new_tail = '''    "BATCH-12-ZIWEI-DATONG-RITONGGUI-KYUJANGGAK-DAYNIGHT-BRIDGE-CN",\n    "BATCH-12-ZIWEI-DATONG-RITONGGUI-KOSTMA-ATTRIBUTION-REPAIR-CO",\n    "BATCH-12-ZIWEI-SANMING-1578-SEASONAL-TABLE-DIRECT-PHYSICAL-COLLATION-CP",\n]'''
          if text.count(old_tail) != 1:
              raise SystemExit(f'unexpected supplemental-tail match count: {text.count(old_tail)}')
          text = text.replace(old_tail, new_tail, 1)

          old_doc = 'LATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DATONG-RITONGGUI-KOSTMA-ATTRIBUTION-REPAIR-CO.md"'
          new_doc = 'LATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-SANMING-1578-SEASONAL-TABLE-DIRECT-PHYSICAL-COLLATION-CP.md"'
          if text.count(old_doc) != 1:
              raise SystemExit(f'unexpected latest-doc match count: {text.count(old_doc)}')
          text = text.replace(old_doc, new_doc, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/sync-continuity-verifier-batch-12cp.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-project-continuity-state-r1.py .github/workflows/sync-continuity-verifier-batch-12cp.yml
          git commit -m 'sync continuity verifier through batch 12CP'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
