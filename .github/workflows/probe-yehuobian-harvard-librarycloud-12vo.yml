name: probe-yehuobian-harvard-librarycloud-12vo
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths: [.github/workflows/probe-yehuobian-harvard-librarycloud-12vo.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Documented public title search only
        run: |
          mkdir -p harvard-12vo
          python - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,pathlib,time
          queries={'chinese_title':'野獲編','romanized_title':'Ye huo bian'}
          out={'documentation':'https://harvardwiki.atlassian.net/wiki/spaces/LibraryStaffDoc/pages/43287734','scope':'DOCUMENTED_PUBLIC_ITEM_API_TITLE_SEARCH_NO_AUTH_NO_GUESSED_ITEM_IDS','requests':[]}
          for key,title in queries.items():
              url='https://api.lib.harvard.edu/v2/items.json?'+urllib.parse.urlencode({'title':title,'limit':50})
              x={'query':key,'url':url,'status':None}
              try:
                  with urllib.request.urlopen(url,timeout=30) as resp:
                      raw=resp.read(3000001);x.update(status=resp.status,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),complete=len(raw)<=3000000)
                      pathlib.Path('harvard-12vo/'+key+'.json').write_bytes(raw)
                      if x['complete']:
                          d=json.loads(raw);x['pagination']=d.get('pagination');mods=d.get('items',{}).get('mods',[])
                          if isinstance(mods,dict):mods=[mods]
                          x['records']=[{k:m.get(k) for k in ['recordInfo','titleInfo','originInfo','identifier','location','note','physicalDescription','extension']} for m in mods]
              except Exception as e:x['error']=type(e).__name__+': '+str(e)[:200]
              out['requests'].append(x);print(json.dumps(x,ensure_ascii=False));time.sleep(1.1)
          pathlib.Path('harvard-12vo/summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yehuobian-harvard-librarycloud-title-metadata-12vo
          path: harvard-12vo
          retention-days: 30
