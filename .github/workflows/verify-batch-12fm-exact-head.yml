name: verify-batch-12fm-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fm-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FM exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-GAO-XIZENG-ANNOTATED-TIEQIN-CATALOG-HOLDING-AND-ACCESS-BOUNDARY-FM'
          e=json.loads(Path('docs/research/ZIWEI-GAO-XIZENG-ANNOTATED-TIEQIN-CATALOG-HOLDING-AND-ACCESS-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          a=e['adjudication']
          assert a['gao_annotated_tieqin_catalog_existence']=='ATTESTED_BY_2026_BIBLIOGRAPHIC_SURVEY_DISCUSSION'
          assert a['broader_gao_manuscript_survival']=='CLOSED_AT_MODERN_EDITORIAL_CHAIN_LEVEL'
          assert a['gao_bibliographical_manuscript_research_chain']=='CLOSED_FOR_OTHER_VERSION_NOTES_MANUSCRIPT_PUBLICATION'
          assert a['target_annotated_tieqin_catalog_current_holding']=='UNRESOLVED'
          assert a['target_annotated_tieqin_catalog_shelfmark']=='UNRESOLVED'
          assert a['target_annotated_tieqin_catalog_public_surrogate']=='UNRESOLVED'
          assert a['target_3482_3483_annotation']=='NOT_REVIEWED'
          assert a['target_transaction_mode']=='UNRESOLVED'
          for key in ('family_custody_selected','hebei_university_custody_selected','nlc_custody_selected','other_custody_selected'):
              assert a[key] is False

          sb=e['search_boundary']
          assert sb['public_exact_holding_record_located'] is False
          assert sb['public_exact_shelfmark_located'] is False
          assert sb['public_exact_digital_surrogate_located'] is False

          fw=e['target_transaction_firewall']
          for key in (
              'missing_current_holding_record_implies_lost',
              'surviving_other_gao_manuscripts_implies_same_custody',
              'hebei_university_editorial_connection_implies_hebei_university_holding',
              'nlc_employment_history_implies_nlc_holding',
              'target_sale_or_donation_route_selected',
          ):
              assert fw[key] is False

          t=e['transmission_impact']
          assert t['nodes_added']==[] and t['edges_added']==[]
          assert t['acquisition_edge_authorized'] is False
          assert t['same_object_edge_authorized'] is False
          r=e['chronology_and_rule_firewall']
          assert r['direct_sanming_parent_vote_increment']==0
          assert r['pre1578_zhunzhai_rule_witness_increment']==0
          assert r['runtime_rule_change'] is False
          assert r['algorithm_reopen_authorized'] is False
          assert r['candidate_collapse_authorized'] is False
          assert r['matrix_count_change'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['historical_audit']['latest_batch_doc'].endswith('ZIWEI-GAO-XIZENG-ANNOTATED-TIEQIN-CATALOG-HOLDING-AND-ACCESS-BOUNDARY-FM.md')
          assert bid in state['historical_audit']['completed_batches']
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0
          assert state['historical_audit']['row_count']==198
          assert state['historical_audit']['audited_row_count']==166
          assert state['historical_audit']['current_missing_from_product_row_count']==10

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {
              'EXT-TANG-ZHAO-2026-QU-TRANSFER-CATALOG-SEMANTICS-GAO-ANNOTATED-CATALOG-LEAD',
              'EXT-GAO-XIZENG-XUESHU-WENCUN-ZHAO-LINTAO-2022-MANUSCRIPT-CHAIN',
              'EXT-YANZHAO-CULTURE-3-QIN-JUNZE-GAO-BANBEN-SUOJI-2020',
              'EXT-HEBEI-UNIVERSITY-ZHAO-LINTAO-CURRENT-INSTITUTIONAL-TRACE-2026',
          }.issubset(ids)

          graph=json.loads(Path('docs/TRANSMISSION-GENEALOGY-GRAPH-R1.json').read_text(encoding='utf-8'))
          assert not any(x.get('latest_scope_update_batch')==bid for x in graph.get('nodes', []))
          assert not any(x.get('latest_scope_update_batch')==bid for x in graph.get('edges', []))
          PY
