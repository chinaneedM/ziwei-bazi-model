name: research-kamo-4174-03-04-public-samples

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-kamo-4174-03-04-public-samples.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Kamo source-emitted Jiwen and Dayuan sample images
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path('probe'); IMG=OUT/'images'; OUT.mkdir(); IMG.mkdir()
          UA='Mozilla/5.0 provenance-research kamo-public-sample-probe'
          routes=[
            ('kamo_4174_03_jiwen','https://www.kamo-books.co.jp/4174-03.htm'),
            ('kamo_4174_04_dayuan','https://www.kamo-books.co.jp/4174-04.htm'),
            ('kamo_catalog','https://www.kamo-books.co.jp/taiwan-sibi.htm'),
          ]

          def fetch(url,limit=10_000_000):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,image/jpeg,image/png,image/webp,*/*;q=0.8','Accept-Language':'ja,zh-TW;q=0.9,zh;q=0.8,en;q=0.6'})
            try:
              with urllib.request.urlopen(req,timeout=30) as resp:
                data=resp.read(limit)
                return {'ok':True,'status':getattr(resp,'status',None),'final_url':resp.geturl(),'content_type':resp.headers.get('content-type'),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'data':data}
            except Exception as exc:
              return {'ok':False,'error':repr(exc),'bytes':0,'data':b''}

          result={'schema':'ZIWEI-KAMO-4174-03-04-PUBLIC-SAMPLES-R1','access_date':'2026-09-08','authentication_attempted':False,'purchase_attempted':False,'identifier_guessing_attempted':False,'access_control_bypass_attempted':False,'routes':[],'images':[]}
          emitted=[]
          for label,url in routes:
            row=fetch(url); data=row.pop('data'); rec={'route':label,'url':url,**row}
            if data:
              text=data.decode('utf-8','replace'); (OUT/f'{label}.html').write_text(text,encoding='utf-8')
              rec['catalog_identity_terms']={t:(t in text) for t in ['台4174-03','台4174-04','集文書局','大元','影印','十八飛星策天紫微斗数全集','精鈔本']}
              urls=[]
              for m in re.finditer(r'''(?:href|src)\s*=\s*["']([^"']+)["']''',text,re.I):
                u=urllib.parse.urljoin(row.get('final_url') or url,html.unescape(m.group(1)))
                if re.search(r'4174-0[34]',u,re.I) and re.search(r'\.(?:jpe?g|png|webp)(?:\?|$)',u,re.I) and u not in urls:
                  urls.append(u)
              rec['source_emitted_relevant_urls']=urls
              rec['source_emitted_relevant_url_count']=len(urls)
              for u in urls: emitted.append((label,u))
            result['routes'].append(rec)

          seen=set()
          for label,u in emitted:
            if u in seen: continue
            seen.add(u)
            row=fetch(u,8_000_000); raw=row.pop('data'); item={'source_route':label,'url':u,**row}
            c=(row.get('content_type') or '').lower()
            if raw and row.get('ok') and ('image' in c or raw[:3]==b'\xff\xd8\xff' or raw[:8]==b'\x89PNG\r\n\x1a\n'):
              ext='.png' if ('png' in c or raw[:8]==b'\x89PNG\r\n\x1a\n') else '.webp' if 'webp' in c else '.jpg'
              p=IMG/f'img-{len(result["images"])+1:02d}{ext}'; p.write_bytes(raw); item['saved_file']=str(p)
            result['images'].append(item)

          result['adjudication']={'source_emitted_only':True,'target_page_status':'PENDING_DIRECT_VISUAL_REVIEW','independent_textual_witness_increment':0,'algorithm_effect':'NONE'}
          (OUT/'ziwei-kamo-4174-03-04-public-samples.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'routes':[{k:v for k,v in r.items() if k!='source_emitted_relevant_urls'} for r in result['routes']],'images':[{'source_route':x['source_route'],'url':x['url'],'status':x.get('status'),'bytes':x.get('bytes'),'sha256':x.get('sha256'),'saved_file':x.get('saved_file')} for x in result['images']],'adjudication':result['adjudication']},ensure_ascii=False,indent=2))

      - name: Upload Kamo samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-kamo-4174-03-04-public-samples
          path: probe/
          if-no-files-found: warn
          retention-days: 14
