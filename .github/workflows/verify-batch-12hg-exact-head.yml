name: verify-batch-12hg-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hg-exact-head.yml
      - .github/workflows/verify-batch-12hf-exact-head.yml
      - docs/research/ZIWEI-NDL-ZHAO-WANLI-WENJI-P197-NIANPU-PP309-310-PHYSICAL-ACCESS-ROUTES-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NDL-ZHAO-WANLI-WENJI-P197-NIANPU-PP309-310-PHYSICAL-ACCESS-ROUTES-HG.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HG exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-NDL-ZHAO-WANLI-WENJI-P197-NIANPU-PP309-310-PHYSICAL-ACCESS-ROUTES-HG'
          e=json.loads(Path('docs/research/ZIWEI-NDL-ZHAO-WANLI-WENJI-P197-NIANPU-PP309-310-PHYSICAL-ACCESS-ROUTES-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          n=e['ndl_nianpu_2018']
          assert n['call_number']=='GK391-C34' and n['ndl_bib_id']=='029360342' and n['target_pages']=='309–310'
          assert n['direct_target_pages_reviewed'] is False and n['copy_requested'] is False
          w=e['ndl_wenji_2011']
          assert w['call_number']=='UM11-C247' and w['ndl_bib_id']=='023434359' and w['target_page']==197
          assert w['direct_target_page_reviewed'] is False and w['copy_requested'] is False
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,219,0)
          assert bid in state['historical_audit']['completed_batches']
          latest=state['historical_audit']['latest_batch_doc']
          assert isinstance(latest,str) and latest.startswith('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-') and latest.endswith('.md')
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-NDL-ZHAO-WANLI-NIANPU-2018-GK391-C34']['batch_12hg']['call_number']=='GK391-C34'
          assert src['EXT-NDL-ZHAO-WANLI-WENJI-V1-2011-UM11-C247']['batch_12hg']['call_number']=='UM11-C247'
          assert e['transmission_impact']['nodes_added']==[] and e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['accounting']['matrix_rows']==198 and e['accounting']['audited_rows']==166 and e['accounting']['current_missing_from_product_rows']==10
          PY
