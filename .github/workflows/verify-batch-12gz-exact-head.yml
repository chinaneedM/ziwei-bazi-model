name: verify-batch-12gz-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gz-exact-head.yml
      - .github/workflows/verify-batch-12gy-exact-head.yml
      - docs/research/ZIWEI-WENJIN-XUEZHI-V3-NLCPRESS-GENERIC-RELATED-DOWNLOAD-TEMPLATE-CORRECTION-R1.json
      - docs/research/ZIWEI-WENJIN-XUEZHI-V3-NLCPRESS-OFFICIAL-DOWNLOAD-SURFACE-BOUNDARY-R1.json
      - docs/research/ZIWEI-WENJIN-XUEZHI-V3-NLCPRESS-PUBLIC-RESOURCE-CENTER-CROSSCHECK-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-WENJIN-XUEZHI-V3-NLCPRESS-GENERIC-RELATED-DOWNLOAD-TEMPLATE-CORRECTION-GZ.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GZ exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-WENJIN-XUEZHI-V3-NLCPRESS-GENERIC-RELATED-DOWNLOAD-TEMPLATE-CORRECTION-GZ'
          e=json.loads(Path('docs/research/ZIWEI-WENJIN-XUEZHI-V3-NLCPRESS-GENERIC-RELATED-DOWNLOAD-TEMPLATE-CORRECTION-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          assert [x['product_id'] for x in e['first_party_template_comparators']]==[9992,11285,12345,12455]
          assert all(x['related_download_labels']==['图书文件下载（TXT）','目录附件下载'] for x in e['first_party_template_comparators'])
          r=e['evidence_strength_revision']
          assert r['labels_are_generic_template_like_controls']=='HIGH_CONFIDENCE'
          assert r['label_presence_alone_proves_product_specific_attachment_object'] is False
          assert r['product_4396_product_specific_txt_attachment_object_existence']=='UNRESOLVED'
          assert r['product_4396_product_specific_toc_attachment_object_existence']=='UNRESOLVED'
          assert r['product_4396_direct_attachment_urls']=='UNRESOLVED'
          assert r['product_4396_attachment_bytes']=='NOT_RECOVERED'
          gx=json.loads(Path('docs/research/ZIWEI-WENJIN-XUEZHI-V3-NLCPRESS-OFFICIAL-DOWNLOAD-SURFACE-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          gy=json.loads(Path('docs/research/ZIWEI-WENJIN-XUEZHI-V3-NLCPRESS-PUBLIC-RESOURCE-CENTER-CROSSCHECK-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert gx['forward_revision_by_batch_12gz']['product_specific_attachment_object_existence']=='UNRESOLVED'
          assert gy['forward_revision_by_batch_12gz']['product_local_labels_remain_valid_means']=='LITERAL_LABEL_OBSERVATION_ONLY_NOT_ATTACHMENT_OBJECT_PROOF'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,212,0)
          assert bid in state['historical_audit']['completed_batches']
          latest=state['historical_audit']['latest_batch_doc']
          assert isinstance(latest,str) and latest.startswith('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-') and latest.endswith('.md')
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-NLCPRESS-WENJIN-XUEZHI-V3-PRODUCT-DOWNLOAD-SURFACE']['revision_by_batch_12gz']['product_specific_attachment_object_existence']=='UNRESOLVED'
          assert src['EXT-NLCPRESS-RELATED-DOWNLOAD-LABEL-TEMPLATE-COMPARATORS']['batch_12gz']['generic_template_like_control']=='HIGH_CONFIDENCE'
          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          PY
