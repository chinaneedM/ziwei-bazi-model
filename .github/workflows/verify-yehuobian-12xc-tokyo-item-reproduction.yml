name: verify-yehuobian-12xc-tokyo-item-reproduction
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12xc-tokyo-item-reproduction.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12XC-*
      - scripts/verify-yehuobian-tokyo-reproduction-dossier-12xc.py
      - tests/test_yehuobian_tokyo_reproduction_dossier_12xc.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify item-bound inquiry evidence and no claimed external application
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-tokyo-reproduction-dossier-12xc.py
          python -m unittest discover -s tests -p 'test_yehuobian_tokyo_reproduction_dossier_12xc.py' -v
