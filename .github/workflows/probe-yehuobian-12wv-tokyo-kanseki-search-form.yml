name: probe-yehuobian-12wv-tokyo-kanseki-search-form
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-12wv-tokyo-kanseki-search-form.yml
      - scripts/probe-yehuobian-12wv-tokyo-kanseki-exact-search-form.py
      - tests/test_yehuobian_12wv_tokyo_kanseki_exact_search_form.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact official advanced search GET and no invented item leaf
        run: python -m unittest discover -s tests -p 'test_yehuobian_12wv_tokyo_kanseki_exact_search_form.py' -v
  capture:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture source-issued advanced form fields and action, no fabricated search endpoint
        run: python scripts/probe-yehuobian-12wv-tokyo-kanseki-exact-search-form.py --output-dir 12wv-tokyo-advanced-form-output
      - name: Preserve institution original form and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 12wv-tokyo-official-kanseki-advanced-form
          path: 12wv-tokyo-advanced-form-output/
          retention-days: 30
          if-no-files-found: warn
