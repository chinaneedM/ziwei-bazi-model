name: verify-batch-12ht-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ht-exact-head.yml
      - docs/research/ZIWEI-BEITU1959-1987-ZUOZHUAN-BOOKNO3368-3288-RECOMPILATION-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-BEITU1959-1987-BOOKNO-3368-3288-RECOMPILATION-BOUNDARY-HT.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending HT status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tianwen/batch-12ht-exact-head',
              description: 'Batch 12HT exact-head verification running'
            })

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12HT exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-BEITU1959-1987-BOOKNO-3368-3288-RECOMPILATION-BOUNDARY-HT'
          e=json.loads(Path('docs/research/ZIWEI-BEITU1959-1987-ZUOZHUAN-BOOKNO3368-3288-RECOMPILATION-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          a=e['direct_1959_catalog_semantics']
          assert a['source_pdf_sha256']=='3f7eb1d2ab0057f4524eee2fb3dd3ca08561257302ffed32fe1960188184452f'
          assert a['book_number_rule_pdf_page']==8
          assert a['direct_book_number_rule']=='书名下方均著书号，以便检索。'
          assert a['target_book_number']=='3368'
          assert a['target_3368_semantics']=='DIRECT_1959_BOOK_NUMBER'
          assert a['target_donor_notation']=='瞿捐'
          assert a['ocr_used'] is False

          b=e['direct_1987_catalog_semantics_and_recompilation_context']
          assert b['source_pdf_sha256']=='9cb2ab3ff5d00fda316a9f0430096ca2a5e68fcd53609a878c0ed9d08a26d3ab'
          assert b['book_number_rule_pdf_page']==10
          assert b['direct_book_number_rule']=='书号：各书名下方，均注明书号。'
          assert b['target_book_number']=='3288'
          assert b['target_3288_semantics']=='DIRECT_1987_BOOK_NUMBER'
          f=b['foreword_controls']
          assert f['new_catalog_compilation_started']=='1986'
          assert f['direct_correction_phrase']=='纠正了一些以往著录的失误'
          assert f['corrected_prior_cataloging_errors'] is True
          assert f['recompilation_or_revision_environment_closed'] is True

          s=e['cross_catalog_sequence_control']
          assert s['target_1959_book_number']=='3368'
          assert s['target_1987_book_number']=='3288'
          assert s['adjacent_1959_book_number']=='10010'
          assert s['adjacent_1987_book_number']=='10010'
          assert s['blanket_global_or_local_arithmetic_offset']=='DISPROVEN'
          assert s['exact_target_specific_change_record_recovered'] is False

          j=e['adjudication']
          assert j['both_historical_values_are_book_numbers'] is True
          assert j['current_905s']=='03288'
          assert j['current_sys']=='002838237'
          assert j['current_uid']=='UCS01003868188'
          assert j['fid']=='412004000070'
          assert j['1987_recompilation_and_prior_error_correction_environment']=='CLOSED_BY_DIRECT_FOREWORD_AND_COMPILATION_RULES'
          assert j['exact_3368_to_3288_change_mechanism']=='UNRESOLVED'
          assert j['target_specific_1987_correction_proved'] is False
          assert j['1959_target_number_error_proved'] is False
          assert j['target_specific_reassignment_proved'] is False
          assert j['candidates_ranked_or_winner_selected'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,232,0)
          assert bid in state['historical_audit']['completed_batches']

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-BEITU-1959-SHANBEN-V1-ZUOZHUAN-QU-DONATION']['batch_12ht']['target_book_number']=='3368'
          assert src['EXT-BEITU-1987-GUJISHANBEN-JINGBU-ZUOZHUAN-BOOKNO3288-CORRECTED']['batch_12ht']['corrected_target_book_number']=='3288'

          ac=e['accounting']
          assert ac['matrix_rows']==198
          assert ac['audited_rows']==166
          assert ac['current_missing_from_product_rows']==10
          assert ac['confirmed_provenance_metadata_defect_count']==15
          assert ac['repaired_provenance_metadata_defect_count']==15
          assert ac['confirmed_chart_algorithm_defect_count']==0
          assert ac['algorithm_reopen_count']==0
          assert ac['candidate_collapse_count']==0
          PY

      - name: Publish successful HT status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'tianwen/batch-12ht-exact-head',
              description: 'Batch 12HT book-number recompilation gates PASS'
            })

      - name: Publish failed HT status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'tianwen/batch-12ht-exact-head',
              description: 'Batch 12HT exact-head verification FAILED'
            })
