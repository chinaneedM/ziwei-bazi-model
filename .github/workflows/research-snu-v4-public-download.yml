name: research-snu-v4-public-download

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-snu-v4-public-download.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Click only the target row's publicly rendered download control
        shell: python
        run: |
          import hashlib
          import json
          import os
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.action_chains import ActionChains
          from selenium.webdriver.common.by import By

          OUT=Path("probe"); OUT.mkdir()
          DL=OUT/"downloads"; DL.mkdir()
          URL="https://pan.quark.cn/s/3b7b731e41f2"
          FOLDER="紫微斗数"
          STEM="523.5-J562b-v.1-6"
          SUFFIX="木版本（4）.pdf"

          opts=Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1800,2600")
          opts.add_argument("--lang=zh-CN")
          opts.add_experimental_option("prefs",{
            "download.default_directory":str(DL.resolve()),
            "download.prompt_for_download":False,
            "download.directory_upgrade":True,
            "plugins.always_open_pdf_externally":True,
          })

          result={
            "schema":"ZIWEI-SNU-V4-PUBLIC-DOWNLOAD-R1",
            "share_url":URL,
            "target_stem":STEM,
            "target_suffix":SUFFIX,
            "authentication_attempted":False,
            "login_attempted":False,
            "hidden_api_guessing_attempted":False,
            "token_reuse_attempted":False,
            "public_download_control_clicked":False,
          }

          driver=webdriver.Chrome(options=opts)
          try:
            driver.set_page_load_timeout(90)
            driver.get(URL); time.sleep(10)

            # Close only the auto-opened login modal if present.
            closes=[x for x in driver.find_elements(By.CSS_SELECTOR,"button.ant-modal-close") if x.is_displayed()]
            if closes:
              closes[0].click(); time.sleep(1)

            # Enter the visibly rendered public folder.
            labels=[x for x in driver.find_elements(By.XPATH,f"//*[normalize-space(text())='{FOLDER}']") if x.is_displayed()]
            if labels:
              wrap=labels[-1].find_element(By.XPATH,"ancestor::div[contains(@class,'file-click-wrap')][1]")
              ActionChains(driver).double_click(wrap).perform()
              time.sleep(8)

            result["folder_url"]=driver.current_url
            # Bind exact target row by the visible title attribute.
            labels=[x for x in driver.find_elements(By.XPATH,
              "//*[@title and contains(@title,'523.5-J562b-v.1-6') and contains(@title,'木版本（4）.pdf')]"
            ) if x.is_displayed()]
            result["target_label_count"]=len(labels)
            if labels:
              label=labels[0]
              result["target_title"]=label.get_attribute("title")
              row=label.find_element(By.XPATH,"ancestor::tr[1]")
              result["target_row_key"]=row.get_attribute("data-row-key")
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});",row)
              time.sleep(1)
              # Public row hover renders its own download icon; bind that exact target-row control.
              filename_cell=label.find_element(By.XPATH,"ancestor::td[1]")
              ActionChains(driver).move_to_element(filename_cell).perform()
              time.sleep(1)
              icons=row.find_elements(By.CSS_SELECTOR,'.hover-oper-item.hoitem-down[title="下载"]')
              result["target_row_download_dom_count"]=len(icons)
              if icons:
                icon=icons[0]
                result["target_row_download_displayed"]=icon.is_displayed()
                result["target_row_download_computed_style"]=driver.execute_script(
                  "var s=getComputedStyle(arguments[0]); return {display:s.display,visibility:s.visibility,opacity:s.opacity,pointerEvents:s.pointerEvents};",
                  icon
                )
                # This is the exact publicly rendered target-row download control. JS click is only
                # a fallback for CSS hover visibility in headless Chrome; it does not construct any API call.
                try:
                  icon.click()
                except Exception:
                  driver.execute_script("arguments[0].click();",icon)
                result["public_download_control_clicked"]=True
                time.sleep(5)

            # Only a visible login modal appearing after the click counts as an auth wall.
            visible_modals=[m for m in driver.find_elements(By.CSS_SELECTOR,".ant-modal") if m.is_displayed()]
            result["visible_login_modal_after_click"]=False
            result["visible_modal_texts"]=[]
            for m in visible_modals:
              txt=" ".join((m.text or "").split())
              result["visible_modal_texts"].append(txt[:3000])
              if any(k in txt for k in ("登录账号","扫码登录","手机号登录","请登录")):
                result["visible_login_modal_after_click"]=True
            body=driver.find_element(By.TAG_NAME,"body").text
            result["post_click_login_language_visible"]=any(k in body for k in ("登录账号","扫码登录","手机号登录","请登录"))
            result["post_click_body"]=body[:50000]
            driver.save_screenshot(str(OUT/"post-click.png"))
            (OUT/"post-click.html").write_text(driver.page_source,encoding="utf-8")

            # Wait only for an ordinary browser download if no login wall appeared.
            if result["public_download_control_clicked"] and not result["visible_login_modal_after_click"]:
              deadline=time.time()+90
              while time.time()<deadline:
                files=[p for p in DL.iterdir() if p.is_file() and not p.name.endswith((".crdownload",".tmp"))]
                partial=[p for p in DL.iterdir() if p.is_file() and p.name.endswith((".crdownload",".tmp"))]
                if files and not partial:
                  break
                time.sleep(2)
            files=[]
            for p in DL.iterdir():
              if not p.is_file(): continue
              data=p.read_bytes()
              files.append({
                "name":p.name,
                "bytes":len(data),
                "sha256":hashlib.sha256(data).hexdigest(),
                "starts_pdf":data[:5]==b"%PDF-",
              })
            result["downloaded_files"]=files
            result["direct_public_pdf_download_established"]=any(x["starts_pdf"] for x in files)
          finally:
            driver.quit()

          result["adjudication"]={
            "access_boundary":"STOP_IF_VISIBLE_LOGIN_MODAL_APPEARS_AFTER_PUBLIC_DOWNLOAD_CLICK",
            "same_snu_lineage_independent_vote_added":0,
            "target_page_status":"READY_FOR_DIRECT_PAGE_REVIEW" if result.get("direct_public_pdf_download_established") else "PENDING_DIRECT_PAGE",
            "algorithm_effect":"NONE",
          }
          (OUT/"snu-v4-public-download.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))

      - name: Upload public-download evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-snu-v4-public-download
          path: probe/
          if-no-files-found: warn
          retention-days: 14
