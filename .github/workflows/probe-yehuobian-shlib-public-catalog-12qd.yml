name: probe-yehuobian-shlib-public-catalog-12qd
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-shlib-public-catalog-12qd.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-official-catalog-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe only documented public catalog entry points without login
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, html.parser, json, pathlib, re, urllib.request, urllib.error, urllib.parse, time
          out=pathlib.Path("shlib-catalog-12qd")
          out.mkdir(exist_ok=True)
          probes=[
           ("shlib_organization_index","https://gj.library.sh.cn/org/shl"),
           ("shlib_gjxz_landing","https://gj.library.sh.cn/gjxz/index"),
           ("shlib_digital_humanities_service","https://www.library.sh.cn/service/service/11"),
           ("shlib_dhblog_official_help","https://dhblog.library.sh.cn/zh-hant/node/3"),
           ("shlib_opendata_home","https://opendata.library.sh.cn/"),
          ]
          class PublicParser(html.parser.HTMLParser):
            def __init__(self): super().__init__();self.links=[];self.forms=[];self.title="";self.in_title=False
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=="a" and d.get("href") and len(self.links)<150:
                self.links.append({"href":d["href"],"title":d.get("title","")})
              elif tag=="form": self.forms.append({"action":d.get("action"),"method":d.get("method","GET"),"fields":[]})
              elif tag=="input" and self.forms:
                self.forms[-1]["fields"].append({"name":d.get("name"),"type":d.get("type")})
              elif tag=="title":self.in_title=True
            def handle_endtag(self,tag):
              if tag=="title":self.in_title=False
            def handle_data(self,s):
              if self.in_title:self.title+=s
          report={"schema":"SHLIB-FIRSTPARTY-PUBLIC-ROUTE-12QD-PROBE","date":"2026-10-10",
                  "scope":"DOCUMENTED_PUBLIC_ENTRY_POINTS_ONLY_NO_LOGIN_NO_GUESSING_ITEM_IDS_NO_OCR",
                  "urls":[], "target_identity_resolved":False, "source_item_id":"UNBOUND"}
          for label,url in probes:
            item={"label":label,"requested_url":url}
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Tianwen-Bibliography-Public-Source-Audit/1.0"})
              with urllib.request.urlopen(req,timeout=17) as f:
                data=f.read(1400000)
                ct=f.headers.get("Content-Type","")
                item.update({"status":f.status,"final_url":f.url,"content_type":ct,
                             "captured_bytes":len(data),"sha256_truncated_capture":hashlib.sha256(data).hexdigest()})
              if "html" in ct.lower() or data.lstrip()[:20].lower().startswith(b"<!doctype"):
                txt=data.decode("utf-8","replace")
                p=PublicParser();p.feed(txt)
                item["html_title"]=p.title[:120]
                item["public_forms"]=p.forms[:8]
                item["visible_link_count"]=len(p.links)
                item["relevant_links"]=[x for x in p.links if any(z in (x["href"]+" "+x["title"]).lower() for z in ["gj","search","catalog","book","古籍","检索","查询"])][:28]
                item["direct_target_name_literal_in_page"]=("萬曆野獲編" in txt or "万历野获编" in txt or "GJ2312912" in txt)
                (out/(label+".html")).write_text(txt[:140000],encoding="utf-8")
            except Exception as exc:
              item["error_type"]=type(exc).__name__
              item["error"]=str(exc)[:220]
            report["urls"].append(item)
            print(label,json.dumps({k:v for k,v in item.items() if k not in ("public_forms","relevant_links")},ensure_ascii=False),flush=True)
          (out/"public-route-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload bounded route evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shlib-gj2312912-public-catalog-12qd
          path: shlib-catalog-12qd/
          retention-days: 30
          if-no-files-found: warn
