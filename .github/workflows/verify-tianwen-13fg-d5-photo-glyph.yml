name: verify-tianwen-13fg-d5-photo-glyph
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - docs/research/TIANWEN-13FG-NIKH-JUAN52-PHOTO-D5-FIVE-VS-NCL-CIRCLE-BOUNDED-COLLATION-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - scripts/verify-tianwen-13fg-d5-source-photo-glyph.py
      - tests/test_verify_tianwen_13fg_d5_source_photo_glyph.py
      - .github/workflows/verify-tianwen-13fg-d5-photo-glyph.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-provenance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-image truth and false-closure negative tests
        run: |
          python -m py_compile scripts/verify-tianwen-13fg-d5-source-photo-glyph.py tests/test_verify_tianwen_13fg_d5_source_photo_glyph.py
          python scripts/verify-tianwen-13fg-d5-source-photo-glyph.py
          python -m unittest discover -s tests -p 'test_verify_tianwen_13fg_d5_source_photo_glyph.py' -v
