name: verify-tianwen-13mj-zhouxiang-solar-print
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/verify-tianwen-13mj-zhouxiang-solar-print-gate.py
      - docs/research/TIANWEN-13MJ-ZHOUXIANG-1569-D15-D17-PRINTED-SOURCE-VS-G893-GATE-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - .github/workflows/verify-tianwen-13mj-zhouxiang-solar-print.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13mj-zhouxiang-solar-print-gate.py
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
