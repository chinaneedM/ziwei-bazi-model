name: finalize-batch-12cu

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/finalize-batch-12cu.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Batch 12CU continuity state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          batch_id = 'BATCH-12-ZIWEI-MING-DATONG-ANNUAL-PRE1578-PHYSICAL-SCOPE-CLOSURE-CU'
          batch_doc = 'docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-MING-DATONG-ANNUAL-PRE1578-PHYSICAL-SCOPE-CLOSURE-CU.md'

          state_path = Path('docs/PROJECT-CURRENT-STATE-R1.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['schema_version'] = '1.107.0'
          hist = state['historical_audit']
          if batch_id not in hist['completed_batches']:
              hist['completed_batches'].append(batch_id)
          hist['latest_batch_doc'] = batch_doc
          notes = [
              'Batch 12CU reuses successful workflow run 35101414335 / artifact 10448114363 and visually closes 120 rendered physical pages across four securely dated Ming Qintianjian Datong annual calendars: 1417 NCL-06283, 1452 NCL-06284, 1506 NCL-06289 and 1543 NCL-06302.',
              'The complete page-layout review plus enlarged review of structurally unusual endmatter found no independently identifiable 晨昏分 / 日出入 / 晝夜刻 numerical table and no direct 59/41 + Sanming intermediate/change-day table on these four physical surfaces. This is strictly a four-object nonattestation, not a whole Datong annual-tradition absence claim; numeric and transmission vote increments are zero.',
              'After 12CU, the highest-value Sanming ancestry gate shifts to the original 大統曆法通軌 computational carrier: obtain a directly readable Kyujanggak Joseon movable-type or NLC Ming-manuscript witness, locate 晨昏立成/晨昏分 at page level, and only then test 59/41, intermediate anchors, change days and historical quantization against the 1578 physical target. Keep this route distinct from Batch 12CO DIC_A3_000150 / 大統曆日通軌 unless an explicit bridge is proved.'
          ]
          for note in notes:
              if note not in hist['current_focus']:
                  hist['current_focus'].append(note)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          verifier_path = Path('scripts/verify-project-continuity-state-r1.py')
          verifier = verifier_path.read_text(encoding='utf-8')
          entry = f'    "{batch_id}",'
          if entry not in verifier:
              anchor = '    "BATCH-12-ZIWEI-DATONG-RICHU-NCL06267-DIGITAL-SURROGATE-DEDUP-CT",\n]'
              repl = '    "BATCH-12-ZIWEI-DATONG-RICHU-NCL06267-DIGITAL-SURROGATE-DEDUP-CT",\n' + entry + '\n]'
              if anchor not in verifier:
                  raise SystemExit('continuity verifier CT-tail anchor missing')
              verifier = verifier.replace(anchor, repl, 1)
          old_prefix = 'LATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-'
          lines = verifier.splitlines()
          changed = False
          for i, line in enumerate(lines):
              if line.startswith(old_prefix):
                  lines[i] = f'LATEST_BATCH_DOC = "{batch_doc}"'
                  changed = True
                  break
          if not changed and f'LATEST_BATCH_DOC = "{batch_doc}"' not in verifier:
              raise SystemExit('continuity verifier latest-doc line missing')
          verifier_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT-CURRENT-STATE-R1.json scripts/verify-project-continuity-state-r1.py
          if ! git diff --cached --quiet; then
            git commit -m 'sync Batch 12CU continuity state'
            git push origin HEAD:agent/fusion-chart-core-r1-20260822
          fi
