name: research-ziwei-republic-edition-image-surfaces-ae

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-republic-edition-image-surfaces-ae.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Capture source-emitted public edition-study images only
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path('probe'); IMG=OUT/'images'; OUT.mkdir(); IMG.mkdir()
          UA='Mozilla/5.0 provenance-research public-edition-image-surfaces'
          pages=[
            ('fengshui168_versions','https://fengshui-168.net/thread-114827-1-1.html'),
            ('kongfz_huiwentang','https://book.kongfz.com/520108/4153377684/'),
          ]

          def fetch(url, referer=None, limit=16_000_000):
            headers={'User-Agent':UA,'Accept':'text/html,image/avif,image/webp,image/apng,image/*,*/*;q=0.8','Accept-Language':'zh-CN,zh-TW;q=0.9,en;q=0.5'}
            if referer: headers['Referer']=referer
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40) as r:
                data=r.read(limit)
                return {'ok':True,'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('content-type'),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'data':data}
            except Exception as e:
              return {'ok':False,'error':repr(e),'bytes':0,'data':b''}

          result={'schema':'ZIWEI-REPUBLIC-EDITION-IMAGE-SURFACES-AE-R1','access_date':'2026-09-09','authentication_attempted':False,'purchase_attempted':False,'identifier_guessing_attempted':False,'access_control_bypass_attempted':False,'pages':[],'images':[]}
          emitted=[]
          for label,url in pages:
            row=fetch(url); raw=row.pop('data')
            rec={'label':label,'url':url,**row,'source_emitted_image_urls':[],'edition_contexts':[]}
            if raw:
              txt=None
              for enc in ('utf-8','gb18030','big5','latin1'):
                try: txt=raw.decode(enc); break
                except Exception: pass
              txt=txt or raw.decode('utf-8','replace')
              (OUT/f'{label}.html').write_text(txt,encoding='utf-8')
              for needle in ('上海校經山房','上海校经山房','上海會文堂','上海会文堂','上海廣益書局','上海广益书局','上海錦章','上海锦章','紫微斗數全書','紫微斗数全书'):
                start=0
                while True:
                  i=txt.find(needle,start)
                  if i<0: break
                  rec['edition_contexts'].append(txt[max(0,i-900):min(len(txt),i+1800)])
                  start=i+len(needle)
              urls=[]
              patterns=[
                r'''(?:src|href|data-src|data-original|data-lazy-src|data-actualsrc|content)\s*=\s*["']([^"']+)["']''',
                r'''["'](https?:\\?/\\?/[^"']+\.(?:jpe?g|png|webp|gif)(?:\?[^"']*)?)["']'''
              ]
              for pat in patterns:
                for m in re.finditer(pat,txt,re.I):
                  v=html.unescape(m.group(1)).replace('\\/','/').strip()
                  u=urllib.parse.urljoin(row.get('final_url') or url,v)
                  if u.startswith(('http://','https://')) and re.search(r'\.(?:jpe?g|png|webp|gif)(?:\?|#|$)',u,re.I) and u not in urls:
                    urls.append(u)
              keep=[]
              for u in urls:
                ul=u.lower()
                if any(x in ul for x in ('logo','icon','avatar','qrcode','qr_code','banner','smiley','common/')): continue
                if label=='fengshui168_versions' and any(x in ul for x in ('attachment','forum','data/attachment','static/image')): keep.append(u)
                elif label=='kongfz_huiwentang' and ('kfzimg' in ul or 'kongfz' in ul): keep.append(u)
              rec['source_emitted_image_urls']=keep[:180]
              for u in keep[:180]: emitted.append((label,url,u))
            result['pages'].append(rec)

          seen=set()
          for label,page,u in emitted:
            if u in seen: continue
            seen.add(u)
            row=fetch(u,referer=page,limit=12_000_000); raw=row.pop('data')
            item={'source_page':label,'page_url':page,'url':u,**row}
            ct=(row.get('content_type') or '').lower()
            magic=(raw[:3]==b'\xff\xd8\xff' or raw[:8]==b'\x89PNG\r\n\x1a\n' or raw[:4]==b'RIFF' or raw[:6] in (b'GIF87a',b'GIF89a'))
            if raw and row.get('ok') and (magic or 'image/' in ct) and len(raw)>20_000:
              ext='.png' if raw[:8]==b'\x89PNG\r\n\x1a\n' else '.webp' if raw[:4]==b'RIFF' else '.gif' if raw[:6] in (b'GIF87a',b'GIF89a') else '.jpg'
              p=IMG/f'{label}-{len(result["images"])+1:03d}{ext}'
              p.write_bytes(raw); item['saved_file']=str(p)
            result['images'].append(item)

          result['adjudication']={'source_emitted_only':True,'visual_review_status':'PENDING_DIRECT_NO_OCR_REVIEW','target_page_status':'PENDING_DIRECT_NO_OCR_REVIEW','edition_identity_status':'PAGE_LEVEL_LABELS_REQUIRE_IMAGE_CONTEXT_REVIEW','independent_textual_witness_increment':0,'algorithm_effect':'NONE'}
          (OUT/'ziwei-republic-edition-image-surfaces-ae.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'pages':[{'label':p['label'],'ok':p.get('ok'),'status':p.get('status'),'bytes':p.get('bytes'),'image_url_count':len(p.get('source_emitted_image_urls',[])),'context_count':len(p.get('edition_contexts',[]))} for p in result['pages']],'saved':[{'source_page':x['source_page'],'bytes':x.get('bytes'),'sha256':x.get('sha256'),'saved_file':x.get('saved_file'),'url':x['url']} for x in result['images'] if x.get('saved_file')],'adjudication':result['adjudication']},ensure_ascii=False,indent=2))

      - name: Upload public edition-image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-republic-edition-image-surfaces-ae
          path: probe/
          if-no-files-found: warn
          retention-days: 14
