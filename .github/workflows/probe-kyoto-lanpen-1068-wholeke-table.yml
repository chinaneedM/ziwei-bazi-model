name: probe-kyoto-lanpen-1068-wholeke-table

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-kyoto-lanpen-1068-wholeke-table.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Acquire Kyoto RB00017646 IIIF manuscript and locate seasonal whole-ke table
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/kyoto-lanpen-rb00017646'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/images" "$ROOT/ocr"
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-tra >/dev/null
          python -m pip install --quiet pillow
          python - <<'PY'
          import hashlib, json, pathlib, re, subprocess, urllib.request
          from PIL import Image, ImageDraw

          root=pathlib.Path("audit/kyoto-lanpen-rb00017646")
          item_url="https://rmda.kulib.kyoto-u.ac.jp/item/rb00017646"
          manifest_url="https://rmda.kulib.kyoto-u.ac.jp/iiif/metadata_manifest/RB00017646/manifest.json"
          headers={"User-Agent":"Mozilla/5.0 Tianwen-Provenance-Audit/1.0"}

          def fetch(url, timeout=90):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return r.read(), r.geturl(), r.headers.get("content-type","")

          raw, final, ctype=fetch(manifest_url)
          (root/"manifest.json").write_bytes(raw)
          manifest=json.loads(raw)

          canvases=[]
          if manifest.get("sequences"):
              canvases=manifest["sequences"][0].get("canvases",[])
          elif manifest.get("items"):
              canvases=manifest["items"]
          if not canvases:
              raise SystemExit("no IIIF canvases found")

          def image_url(canvas):
              # IIIF Presentation 2
              try:
                  res=canvas["images"][0]["resource"]
                  service=res.get("service")
                  if isinstance(service,list):
                      service=service[0] if service else None
                  if isinstance(service,dict):
                      base=service.get("@id") or service.get("id")
                      if base:
                          return base.rstrip("/")+"/full/1600,/0/default.jpg"
                  return res.get("@id") or res.get("id")
              except Exception:
                  pass
              # IIIF Presentation 3
              try:
                  annopage=canvas["items"][0]
                  anno=annopage["items"][0]
                  body=anno["body"]
                  service=body.get("service")
                  if isinstance(service,list):
                      service=service[0] if service else None
                  if isinstance(service,dict):
                      base=service.get("id") or service.get("@id")
                      if base:
                          return base.rstrip("/")+"/full/1600,/0/default.jpg"
                  return body.get("id") or body.get("@id")
              except Exception:
                  return None

          manifest_rows=[]
          ocr_hits=[]
          terms=["節氣加減","刻漏規式","景福殿","秤漏","春秋二分","雨水後四日","小滿前一日","六十刻","五十九刻","享保元","宋刻古本","秀慶","熙寧元年"]
          for idx,canvas in enumerate(canvases,1):
              url=image_url(canvas)
              if not url:
                  manifest_rows.append({"canvas":idx,"image_url":None,"error":"NO_IMAGE_URL"})
                  continue
              try:
                  data,fu,ct=fetch(url,120)
              except Exception as e:
                  manifest_rows.append({"canvas":idx,"image_url":url,"error":repr(e)})
                  continue
              ext=".jpg"
              p=root/"images"/f"canvas-{idx:03d}{ext}"
              p.write_bytes(data)
              rec={
                  "canvas":idx,
                  "canvas_id":canvas.get("@id") or canvas.get("id"),
                  "label":canvas.get("label"),
                  "image_url":url,
                  "final_url":fu,
                  "content_type":ct,
                  "bytes":len(data),
                  "sha256":hashlib.sha256(data).hexdigest()
              }
              manifest_rows.append(rec)

              proc=subprocess.run(
                  ["tesseract",str(p),"stdout","-l","chi_tra","--psm","6"],
                  stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False
              )
              txt=proc.stdout.decode("utf-8",errors="replace")
              (root/"ocr"/f"canvas-{idx:03d}.txt").write_text(txt,encoding="utf-8")
              compact="".join(txt.split())
              found=[t for t in terms if t in compact]
              diag=sum(ch in compact for ch in ["刻","漏","雨","水","享","保","宋","秀"])
              if found or diag>=5:
                  ocr_hits.append({"canvas":idx,"terms":found,"diagnostic_score":diag,"context":" ".join(txt.split())[:2600]})

          image_paths=sorted((root/"images").glob("canvas-*.jpg"))
          # Contact sheets for direct visual review.
          cols=4
          per_sheet=16
          for start in range(0,len(image_paths),per_sheet):
              chunk=image_paths[start:start+per_sheet]
              thumbs=[]
              for p in chunk:
                  idx=int(p.stem.split("-")[1])
                  im=Image.open(p).convert("RGB")
                  tw=340
                  ratio=tw/im.width
                  im=im.resize((tw,max(1,int(im.height*ratio))))
                  canvas=Image.new("RGB",(tw,im.height+28),"white")
                  canvas.paste(im,(0,28))
                  ImageDraw.Draw(canvas).text((6,6),f"canvas {idx}",fill="black")
                  thumbs.append(canvas)
              if not thumbs:
                  continue
              cw=max(x.width for x in thumbs); ch=max(x.height for x in thumbs)
              rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new("RGB",(cols*cw,rows*ch),"white")
              for k,im in enumerate(thumbs):
                  sheet.paste(im,((k%cols)*cw,(k//cols)*ch))
              sheet.save(root/f"contact-{start+1:03d}-{start+len(chunk):03d}.jpg",quality=90,optimize=True)

          report={
              "schema":"KYOTO-LANPEN-RB00017646-WHOLEKE-TABLE-PROBE-R1",
              "schema_version":"1.0.0",
              "item_url":item_url,
              "manifest_url":manifest_url,
              "manifest_final_url":final,
              "manifest_content_type":ctype,
              "manifest_sha256":hashlib.sha256(raw).hexdigest(),
              "catalog_control":{
                  "record_id":"RB00017646",
                  "title":"蘭盆疏鈔餘義",
                  "author":"(宋僧)日新録",
                  "copy_type":"写",
                  "shelfmark":"藏||14||ラ||2",
                  "collection":"蔵経書院文庫 / 蔵経書院本",
                  "digitization_year":2023,
                  "copy_date_from_public_catalog":"UNRESOLVED"
              },
              "canvas_count":len(canvases),
              "downloaded_image_count":len(image_paths),
              "images":manifest_rows,
              "ocr_locator_hits":ocr_hits,
              "ocr_authority":"LOCATOR_ONLY_NOT_FINAL_GLYPH_OR_DATE_AUTHORITY",
              "target_received_text":[
                  "時熙寧元年歲次戊申...因而再刊又為之序云",
                  "節氣加減刻漏規式",
                  "今依本朝定景福殿秤漏春秋二分各五十刻",
                  "40/60 through 60/40 piecewise whole-ke seasonal ladder",
                  "雨水後四日至後九日 = 46/54 in this family",
                  "享保元丙申...以宋刻古本校正訖 / 日本國南京沙門秀慶識"
              ],
              "apparatus_firewall":{
                  "cbeta_note_26_anchor":"裁省 around line/page 0567 context",
                  "cbeta_note_26_text":"裁下卅一行古本闕脫書寫補入",
                  "seasonal_table_location":"0570b/c context",
                  "table_inside_note_26_31_line_supplement":False,
                  "basis":"CBETA page/line separation; direct Kyoto manuscript still required for physical table confirmation."
              },
              "chronology_firewall":"The Kyoto catalog calls the surviving object a manuscript (写) and gives no pre-1578 copy date. Even if the object carries the 1716 Xiuke colophon saying it was collated against a Song printed old book, that does not make the surviving Kyoto manuscript a pre-1578 physical witness.",
              "product_boundary":"Probe only; no runtime rule, algorithm reopen, candidate collapse or Sanming-parent promotion."
          }
          (root/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({
              "manifest_sha256":report["manifest_sha256"],
              "canvas_count":len(canvases),
              "downloaded_image_count":len(image_paths),
              "ocr_locator_hits":ocr_hits
          },ensure_ascii=False,indent=2))
          PY

      - name: Upload Kyoto Lanpen IIIF probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-lanpen-rb00017646
          path: audit/kyoto-lanpen-rb00017646
          if-no-files-found: error
          retention-days: 30
