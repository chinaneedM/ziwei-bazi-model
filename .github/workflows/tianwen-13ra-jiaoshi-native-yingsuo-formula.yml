name: tianwen-13ra-jiaoshi-native-yingsuo-formula
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/tianwen-13ra-jiaoshi-native-yingsuo-formula.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-native-formula:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --silent puppeteer-core@24.16.0
      - run: python -m pip install --quiet "Pillow>=10,<12"
      - name: Collate bounded official original leaves adjacent to 067a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/13ra /tmp/tianwen-13ra
          cat >audit/13ra/source.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const book='GK00067_00',root='/tmp/tianwen-13ra';
          const leaves=['065a','065b','066a','066b','067a','067b','068a','068b'];
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.BROWSER,args:['--no-sandbox','--disable-setuid-sandbox']});
          const page=await browser.newPage();
          await page.goto('https://kyudb.snu.ac.kr/book/list.do?book_cate=SIC04&mid=GDS',{waitUntil:'networkidle2',timeout:90000});
          const row=await page.evaluate(book=>{
             const t=[...document.querySelectorAll('tr')].find(x=>x.innerText?.includes('交食推步法')&&x.querySelector('input[value="'+book+'"]'));
             return t?{title:'交食推步法',call_number:'奎貴67',source_original_control:t.querySelector('a[onclick*="fn_originalImg"]')?.getAttribute('onclick')}:null;
          },book);
          if(!row?.source_original_control?.includes(book))throw Error('No provider-issued exact item ID');
          const acquisitions=[];
          for(const p of leaves){
            const fn=`${book}IH_0001_${p}.jpg`;
            const sourcePath=`/data01/stream/SIC/IMG/${book}/${book}_0001/${fn}`;
            const u=`https://kyudb.snu.ac.kr/ImageServlet.do?imgFileNm=${encodeURIComponent(fn)}&path=${encodeURIComponent(sourcePath)}`;
            const tab=await browser.newPage();
            let buf=null,status=null,error=null;
            for(let i=1;i<=2;i++){
              try{
                const res=await tab.goto(u,{waitUntil:'domcontentloaded',timeout:23000});
                status=res?.status()??null;
                if(res?.ok()){
                  const candidate=await res.buffer();
                  if(candidate.length>50000&&candidate[0]===255&&candidate[1]===216){buf=candidate;break;}
                }
              }catch(e){error=String(e)}
            }
            await tab.close();
            const x={page:p,bytes:buf?.length||0,sha256:buf?crypto.createHash('sha256').update(buf).digest('hex'):null,http_status:status,error,provider_url:u};
            if(buf)fs.writeFileSync(root+'/'+p+'.jpg',buf);
            acquisitions.push(x);
            console.log('JIAOSHI_13RA_ORIGINAL_PAGE '+JSON.stringify({page:p,bytes:x.bytes,sha256:x.sha256,http_status:status,error}));
          }
          fs.writeFileSync(root+'/receipt.json',JSON.stringify({schema:'TIANWEN-13RA-SNU-JIAOSHI-ORIGINAL-FORMULA-EIGHT-LEAF-SCOPE',provider:'SNU Kyujanggak',source_item:row,acquisitions,ocr_used:false,
            source_text_authority:'NONE_UNTIL_HUMAN_IMAGE_COLLATION',target_hypothesis:'Prior atlas 067a appears to contain 九十三微 coefficient; locate exact original title/quantity on adjoining native folios'},null,2)+'\n');
          await browser.close();
          if(acquisitions.filter(x=>x.sha256).length!==leaves.length)process.exitCode=2;
          JS
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          BROWSER="$BROWSER" node audit/13ra/source.mjs
          python - <<'PY'
          from PIL import Image,ImageDraw
          import base64,hashlib
          from pathlib import Path
          root=Path('/tmp/tianwen-13ra')
          pages=['065a','065b','066a','066b','067a','067b','068a','068b']
          sh=Image.new('RGB',(4*500,2*900),'white')
          for i,p in enumerate(pages):
              f=root/(p+'.jpg')
              if not f.exists():continue
              im=Image.open(f).convert('RGB')
              print('JIAOSHI_13RA_RGB_SOURCE',p,im.size,hashlib.sha256(im.tobytes()).hexdigest())
              im.thumbnail((475,850))
              xy=((i%4)*500+(500-im.width)//2,(i//4)*900+32)
              sh.paste(im,xy)
              ImageDraw.Draw(sh).text(((i%4)*500+8,(i//4)*900+8),p,fill='black')
          sh.save(root/'contact.jpg',quality=80,optimize=True)
          for f in [root/'contact.jpg']+[root/(p+'.jpg') for p in ('066a','066b','067a','067b')]:
              if not f.exists():continue
              b=f.read_bytes();s=base64.b64encode(b).decode()
              print('JIAOSHI_13RA_IMAGE',f.name,'sha256',hashlib.sha256(b).hexdigest(),'bytes',len(b))
              print('JIAOSHI_13RA_IMAGE_BEGIN',f.name)
              for k in range(0,len(s),3000):print('JIAOSHI_13RA_B64',f.name,s[k:k+3000])
              print('JIAOSHI_13RA_IMAGE_END',f.name)
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13ra-jiaoshi-yingsuo-source-original-images
          path: /tmp/tianwen-13ra/
          if-no-files-found: warn
          retention-days: 14
