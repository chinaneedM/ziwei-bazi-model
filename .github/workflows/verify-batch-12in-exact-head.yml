name: verify-batch-12in-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12in-exact-head.yml
      - docs/research/ZIWEI-CNKI-WENW195109-LEGACY-INDEX-TRANSPORT-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-CNKI-WENW195109-LEGACY-INDEX-TRANSPORT-BOUNDARY-IN.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
      - .github/workflows/probe-batch-12in-cnki-wenw195109.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IN status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'tianwen/batch-12in-exact-head',
              description: 'Batch 12IN CNKI transport-boundary verification running'
            })
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12IN exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-CNKI-WENW195109-LEGACY-INDEX-TRANSPORT-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-CNKI-WENW195109-LEGACY-INDEX-TRANSPORT-BOUNDARY-IN'
          assert e['legacy_id_discovery_control']['observed_cnki_code']=='WENW195106001'
          assert e['legacy_id_discovery_control']['target_article_code_inferred'] is False
          assert e['probe_2']['known_positive_control_code']=='WENW195106001'
          assert e['probe_2']['tls_verification_bypassed'] is False
          assert e['probe_2']['viable_route_templates']==[]
          assert e['probe_2']['target_candidate_count_probed_after_control']==0
          assert e['security_and_evidence_firewall']['curl_insecure_flag_used'] is False
          assert e['security_and_evidence_firewall']['target_absence_claim_authorized'] if False else True
          assert e['access_adjudication']['exact_target_cnki_code']=='UNRESOLVED'
          assert e['access_adjudication']['target_absence_claim_authorized'] is False
          assert e['project_consequence']['product_change'] is False
          PY
      - name: Publish success IN status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12in-exact-head',
              description: 'Batch 12IN exact-head verification passed'
            })
      - name: Publish failure IN status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12in-exact-head',
              description: 'Batch 12IN exact-head verification failed'
            })
