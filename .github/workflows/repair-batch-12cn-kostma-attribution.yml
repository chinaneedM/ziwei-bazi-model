name: verify-batch-12co-kostma-attribution-repair

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/repair-batch-12cn-kostma-attribution.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Batch 12CO provenance state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          git diff --exit-code
