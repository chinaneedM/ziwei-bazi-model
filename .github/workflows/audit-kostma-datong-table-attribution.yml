name: audit-kostma-datong-table-attribution

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-kostma-datong-table-attribution.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit KOSTMA record ownership for Datong table labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html as htmlmod
          import re
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          HEADERS={'User-Agent':'Mozilla/5.0'}
          RECORDS=('DIC_A3_000150','DIC_A3_000151')
          TERMS=(
              '日出入晨刻表','晝夜刻分表','昼夜刻分表','四方每時初昏去中星度數表',
              '太陽冬至前後','太陽夏至前後','太陰遲疾',
              '대통력일통궤','대통력주','大統曆日通軌','大統曆註'
          )

          def get(url):
              req=urllib.request.Request(url,headers=HEADERS)
              return urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')

          def compact(s):
              return re.sub(r'\s+',' ',htmlmod.unescape(s)).strip()

          for uid in RECORDS:
              print('\n===== RECORD',uid,'=====')
              api='https://kostma.aks.ac.kr/api/API_dicView.aspx?searchid='+urllib.parse.quote(uid)
              print('API',api)
              try:
                  x=get(api)
              except Exception as exc:
                  print('API_ERROR',type(exc).__name__,str(exc)); x=''
              if x:
                  try:
                      root=ET.fromstring(x)
                      print('--- XML FIELD HITS ---')
                      for elem in root.iter():
                          raw=''.join(elem.itertext()) if list(elem) else (elem.text or '')
                          val=compact(raw)
                          if val and any(t in val for t in TERMS):
                              attrs=' '.join(f'{k}={v}' for k,v in elem.attrib.items())
                              print('XML_FIELD',elem.tag,attrs,'=>',val[:12000])
                      print('--- XML IDENTIFIERS ---')
                      alltext=compact(' '.join(root.itertext()))
                      for token in sorted(set(re.findall(r'(?:DIC_A3_\d{6}|GR\d+_\d+)',alltext))):
                          print('XML_ID',token)
                  except Exception as exc:
                      print('XML_PARSE_ERROR',type(exc).__name__,str(exc))

              view='https://kostma.aks.ac.kr/dic/dicView.aspx?searchid='+urllib.parse.quote(uid)
              print('VIEW',view)
              try:
                  h=get(view)
              except Exception as exc:
                  print('VIEW_ERROR',type(exc).__name__,str(exc)); h=''
              if not h:
                  continue
              print('--- HTML TITLE ---')
              mt=re.search(r'<title[^>]*>(.*?)</title>',h,re.I|re.S)
              print(compact(mt.group(1)) if mt else '')
              print('--- TERM CONTEXTS WITH CONTAINER ---')
              for term in TERMS:
                  start=0; count=0
                  while True:
                      pos=h.find(term,start)
                      if pos<0: break
                      count+=1
                      left=max(0,pos-1800); right=min(len(h),pos+len(term)+3500)
                      frag=h[left:right]
                      print('TERM',term,'HIT',count)
                      print('CTX',compact(frag)[:9000])
                      # nearest enclosing row/list/div/table-ish start marker before hit
                      pre=h[max(0,pos-6000):pos]
                      candidates=[]
                      for pat in (r'<tr\b[^>]*>',r'<li\b[^>]*>',r'<div\b[^>]*>',r'<table\b[^>]*>',r'<td\b[^>]*>'):
                          ms=list(re.finditer(pat,pre,re.I))
                          if ms: candidates.append((ms[-1].start(),compact(ms[-1].group(0))))
                      if candidates:
                          print('NEAREST_CONTAINER',max(candidates,key=lambda z:z[0])[1])
                      start=pos+len(term)
                      if count>=8: break
                  if count==0:
                      print('TERM',term,'HIT 0')
              print('--- RECORD IDS / SOURCE BINDINGS ---')
              decoded=htmlmod.unescape(h)
              for tok in sorted(set(re.findall(r'(?:DIC_A3_\d{6}|GR\d+_\d+)',decoded))):
                  print('HTML_ID',tok)
              for m in re.finditer(r'(?:href|src|onclick)\s*=\s*["\']([^"\']+)["\']',decoded,re.I):
                  val=compact(m.group(1))
                  if any(k in val for k in ('GR35954','DIC_A3_000150','DIC_A3_000151','kyuj','MOK','CONVIEW')):
                      print('BINDING',val[:5000])
          PY
