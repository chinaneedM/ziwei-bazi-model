name: verify-batch-12hp-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ho-exact-head.yml
      - .github/workflows/verify-batch-12hp-exact-head.yml
      - docs/research/ZIWEI-BEITU1959-ZUOZHUAN-QU-DONATION-FID070-TIEQIN-IDENTITY-CLOSURE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-BEITU1959-ZUOZHUAN-QU-DONATION-FID070-TIEQIN-IDENTITY-CLOSURE-HP.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HP exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-BEITU1959-ZUOZHUAN-QU-DONATION-FID070-TIEQIN-IDENTITY-CLOSURE-HP'
          e=json.loads(Path('docs/research/ZIWEI-BEITU1959-ZUOZHUAN-QU-DONATION-FID070-TIEQIN-IDENTITY-CLOSURE-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          t=e['beitu1959_direct_target']
          assert t['pdf_page']==56
          assert t['title']=='附釋音春秋左傳註疏六十卷'
          assert t['version']=='元刻明修本'
          assert t['extent']=='三十二冊'
          assert t['donor_notation']=='瞿捐'
          assert t['printed_bottom_number_arabic']=='3368'
          i=e['identity_adjudication']
          assert i['historical_1959_qu_donation_bridge']=='CLOSED_DIRECT_VISUAL'
          assert i['fid070_equals_zhang_tieqin_yuan_copy']=='HIGH_CONFIDENCE_CLOSED_AT_MULTILAYER_HISTORICAL_CATALOG_DONOR_PROVENANCE_AND_FORMAT_LEVEL'
          assert i['same_physical_object_identity_authorized'] is True
          assert i['direct_modern_machine_identifier_closed'] is False
          ids=e['cross_catalog_identifier_firewall']
          assert ids['beitu1959_printed_bottom_number']=='3368'
          assert ids['beitu1987_book_number']=='3388'
          assert ids['renumbering_or_catalog_succession_mechanism']=='UNRESOLVED'
          assert ids['current_905s']=='UNRESOLVED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,228,0)
          assert bid in state['historical_audit']['completed_batches']
          assert Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-BEITU1959-ZUOZHUAN-QU-DONATION-FID070-TIEQIN-IDENTITY-CLOSURE-HP.md').is_file()
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-BEITU-1959-SHANBEN-V1-ZUOZHUAN-QU-DONATION']['batch_12hp']['donor_notation']=='瞿捐'
          assert src['EXT-NLC-PCAB-2019-BEITU1959-DONOR-SURNAME-CATALOG-METHOD']['batch_12hp']['donor_surname_annotation_after_each_book'] is True
          assert src['EXT-NLC-DIGITAL-ZUOZHUAN-412004000070-COMMONS-BACKUP']['batch_12hp']['tieqin_physical_identity_status']=='HIGH_CONFIDENCE_CLOSED_AT_MULTILAYER_HISTORICAL_CATALOG_DONOR_PROVENANCE_AND_FORMAT_LEVEL'
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_chart_algorithm_defect_count']==0
          PY
