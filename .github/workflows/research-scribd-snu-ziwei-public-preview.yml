name: research-scribd-snu-ziwei-public-preview

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-scribd-snu-ziwei-public-preview.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture public Scribd preview surface only
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          UA = "Mozilla/5.0 research-only public preview probe"
          PAGES = {
              "doc36": "https://www.scribd.com/document/843784721/",
          }

          def fetch(url, max_bytes=12_000_000, accept="*/*"):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": accept,
                      "Accept-Language": "en,ko;q=0.9,zh;q=0.8",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=35) as resp:
                      data = resp.read(max_bytes + 1)
                      if len(data) > max_bytes:
                          raise RuntimeError("response exceeded guard")
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "url": url, "error": repr(exc), "data": b""}

          result = {
              "schema": "SCRIBD-SNU-ZIWEI-PUBLIC-PREVIEW-SURFACE-R1",
              "target": "SNU_KYUJANGGAK_FEIXING_CETIAN_ZIWEI_DOUSHU_QUANJI",
              "authentication_attempted": False,
              "paywall_bypass_attempted": False,
              "download_action_attempted": False,
              "identifier_guessing_attempted": False,
              "documents": {},
          }

          for key, url in PAGES.items():
              row = fetch(url, accept="text/html,*/*;q=0.8")
              raw = row.get("data", b"")
              meta = {k:v for k,v in row.items() if k != "data"} | {
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest() if raw else None,
              }
              if raw:
                  (OUT / f"{key}.html").write_bytes(raw)
              text = raw.decode("utf-8", "replace")

              # Record only assets/IDs explicitly present in the public HTML.
              absolute_urls = []
              for m in re.finditer(r'https?://[^"\'<>\s\\]+', text):
                  value = html.unescape(m.group(0)).rstrip("),;")
                  if any(token in value for token in ("scribdassets.com","scribd.com/embeds","html.scribdassets.com")):
                      absolute_urls.append(value)
              explicit = []
              seen = set()
              for value in absolute_urls:
                  if value not in seen:
                      seen.add(value)
                      explicit.append(value)

              page_markers = sorted(set(re.findall(r'00(?:0[1-9]|[1-2][0-9]|3[0-9])\s*쪽', text)))
              asset_fragments = []
              for i, line in enumerate(text.splitlines()):
                  low = line.lower()
                  if any(token in low for token in (
                      "pageNum", "page_num", "asset", "scribdassets",
                      "image_uri", "imageurl", "page_data", "pageNum"
                  )):
                      asset_fragments.append("\n".join(text.splitlines()[max(0,i-1):i+2])[:4000])
                  if len(asset_fragments) >= 100:
                      break

              meta.update({
                  "public_page_markers": page_markers,
                  "explicit_scribd_asset_url_count": len(explicit),
                  "explicit_scribd_asset_urls": explicit[:500],
                  "asset_fragments": asset_fragments,
                  "snu_label_present": "서울대학교 규장각" in text,
                  "title_present": "飛星策天紫微斗數全集" in text,
                  "declared_36_pages_present": "36 pages" in text,
              })
              result["documents"][key] = meta

          (OUT / "scribd-snu-public-preview.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              key: {
                  "status": value.get("status"),
                  "bytes": value.get("bytes"),
                  "snu_label_present": value.get("snu_label_present"),
                  "title_present": value.get("title_present"),
                  "declared_36_pages_present": value.get("declared_36_pages_present"),
                  "page_marker_count": len(value.get("public_page_markers", [])),
                  "asset_url_count": value.get("explicit_scribd_asset_url_count"),
                  "asset_fragments": value.get("asset_fragments", [])[:20],
              }
              for key, value in result["documents"].items()
          }, ensure_ascii=False, indent=2))

      - name: Upload Scribd public-preview surface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scribd-snu-ziwei-public-preview
          path: probe/
          if-no-files-found: warn
          retention-days: 14
