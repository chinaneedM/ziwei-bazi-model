name: acquire-tianwen-13mi-g893-vs-ming1569-original
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13mi-g893-solar-header-ming1569-original.py
      - scripts/verify-tianwen-13mi-acquisition-gate.py
      - docs/research/TIANWEN-13MI-G893-1569-ORIGINAL-IMAGE-FIELD-GATE-R1.json
      - .github/workflows/acquire-tianwen-13mi-g893-vs-ming1569-original.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - run: python scripts/verify-tianwen-13mi-acquisition-gate.py
      - run: python scripts/acquire-tianwen-13mi-g893-solar-header-ming1569-original.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13mi-g893-original-solar-ming1569-vol6-source-gate
          path: /tmp/tianwen-13mi/
          retention-days: 30
          if-no-files-found: warn
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
