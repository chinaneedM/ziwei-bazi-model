name: research-ziwei-fullbook-physical-sample-routes-aa

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-fullbook-physical-sample-routes-aa.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe source-emitted public Fullbook sample images
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path('probe'); IMG=OUT/'images'; OUT.mkdir(); IMG.mkdir()
          UA='Mozilla/5.0 provenance-research public-source-emitted-samples'
          pages=[
            ('sunyata_973','https://publish.sunyata.hk/product/973.html'),
            ('ncc_14701','https://www.ncc.com.tw/books/goods.php?id=14701'),
            ('kumyo_29397','https://kumyo.co.kr/web/auction/auction_view/29397/001001000000'),
            ('skylight_201704','https://superskylightfy.blogspot.com/2017/04/blog-post.html'),
            ('khosachquy_fullbook','https://khosachquy.com/%E7%B4%AB%E5%BE%AE%E6%96%97%E6%95%B8%E5%85%A8%E6%9B%B8%28%E6%98%8E%E6%9C%AA%E6%B8%85%E5%88%9D%E6%9C%A8%E5%88%BB%E7%9C%9F%E6%9C%AC%29%E3%80%90%E5%8E%9F%28%E5%BD%A9%29%E8%89%B2%E6%9C%AC%E3%80%91--tu-vi-dau-so-toan-thu%28minh-vi-thanh-so-moc-khac-chan-ban%29%E3%80%90-nguyen%28thai%29-sac-ban%E3%80%91'),
          ]

          def fetch(url, referer=None, limit=12_000_000):
            headers={'User-Agent':UA,'Accept':'text/html,image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8','Accept-Language':'zh-CN,zh-TW;q=0.9,ko;q=0.8,en;q=0.5'}
            if referer: headers['Referer']=referer
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=35) as resp:
                data=resp.read(limit)
                return {'ok':True,'status':getattr(resp,'status',None),'final_url':resp.geturl(),'content_type':resp.headers.get('content-type'),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'data':data}
            except Exception as exc:
              return {'ok':False,'error':repr(exc),'bytes':0,'data':b''}

          result={'schema':'ZIWEI-FULLBOOK-PHYSICAL-SAMPLE-ROUTES-AA-R1','access_date':'2026-09-09','authentication_attempted':False,'purchase_attempted':False,'identifier_guessing_attempted':False,'access_control_bypass_attempted':False,'pages':[],'images':[]}
          emitted=[]
          for label,url in pages:
            row=fetch(url); raw=row.pop('data')
            rec={'label':label,'url':url,**row,'source_emitted_image_urls':[]}
            if raw:
              txt=None
              for enc in ('utf-8','big5','euc-kr','gb18030','latin1'):
                try: txt=raw.decode(enc); break
                except Exception: pass
              txt=txt or raw.decode('utf-8','replace')
              (OUT/f'{label}.html').write_text(txt,encoding='utf-8')
              urls=[]
              for m in re.finditer(r'''(?:src|href|data-src|data-original|data-lazy-src|content)\s*=\s*["']([^"']+)["']''',txt,re.I):
                u=urllib.parse.urljoin(row.get('final_url') or url,html.unescape(m.group(1)))
                if re.search(r'\.(?:jpe?g|png|webp|gif)(?:\?|#|$)',u,re.I) and u not in urls:
                  urls.append(u)
              keep=[]
              for u in urls:
                ul=u.lower()
                if label=='sunyata_973' and ('wp-content/uploads' in ul): keep.append(u)
                elif label=='ncc_14701' and ('ncc.com.tw' in ul or 'book' in ul) and not any(x in ul for x in ('logo','icon','rank','banner')): keep.append(u)
                elif label=='kumyo_29397' and ('kumyo' in ul or 'auction' in ul) and not any(x in ul for x in ('logo','icon','banner','btn_')): keep.append(u)
                elif label=='skylight_201704' and ('blogspot' in ul or 'googleusercontent' in ul or 'bp.blogspot' in ul): keep.append(u)
                elif label=='khosachquy_fullbook' and not any(x in ul for x in ('logo','icon','banner','avatar')): keep.append(u)
              rec['source_emitted_image_urls']=keep
              for u in keep: emitted.append((label,url,u))
            result['pages'].append(rec)

          seen=set()
          for label,page,u in emitted:
            if u in seen: continue
            seen.add(u)
            row=fetch(u,referer=page,limit=10_000_000); raw=row.pop('data')
            item={'source_page':label,'page_url':page,'url':u,**row}
            ct=(row.get('content_type') or '').lower()
            magic=(raw[:3]==b'\xff\xd8\xff' or raw[:8]==b'\x89PNG\r\n\x1a\n' or raw[:4]==b'RIFF' or raw[:6] in (b'GIF87a',b'GIF89a'))
            if raw and row.get('ok') and (magic or 'image/' in ct) and len(raw)>12_000:
              if raw[:8]==b'\x89PNG\r\n\x1a\n': ext='.png'
              elif raw[:4]==b'RIFF': ext='.webp'
              elif raw[:6] in (b'GIF87a',b'GIF89a'): ext='.gif'
              else: ext='.jpg'
              p=IMG/f'{label}-{len(result["images"])+1:03d}{ext}'
              p.write_bytes(raw); item['saved_file']=str(p)
            result['images'].append(item)

          result['adjudication']={'source_emitted_only':True,'visual_review_status':'PENDING_DIRECT_NO_OCR_REVIEW','target_page_status':'PENDING_DIRECT_NO_OCR_REVIEW','independent_textual_witness_increment':0,'algorithm_effect':'NONE'}
          (OUT/'ziwei-fullbook-physical-sample-routes-aa.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'pages':[{'label':p['label'],'ok':p.get('ok'),'status':p.get('status'),'bytes':p.get('bytes'),'image_url_count':len(p.get('source_emitted_image_urls',[]))} for p in result['pages']], 'saved':[{'source_page':x['source_page'],'status':x.get('status'),'bytes':x.get('bytes'),'sha256':x.get('sha256'),'saved_file':x.get('saved_file'),'url':x['url']} for x in result['images']], 'adjudication':result['adjudication']},ensure_ascii=False,indent=2))

      - name: Upload public Fullbook sample routes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-fullbook-physical-sample-routes-aa
          path: probe/
          if-no-files-found: warn
          retention-days: 14
