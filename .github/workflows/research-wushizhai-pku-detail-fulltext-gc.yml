name: research-wushizhai-pku-detail-fulltext-gc

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-wushizhai-pku-detail-fulltext-gc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe only source-emitted target detail/fulltext routes
        run: |
          set -euo pipefail
          mkdir -p artifacts/pku-detail-gc
          python - <<'PY'
          from __future__ import annotations
          import http.cookiejar, hashlib, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path("artifacts/pku-detail-gc")
          ORIGIN="https://ccj.pku.edu.cn"
          DETAIL=ORIGIN+"/article/info?aid=286663046"
          UA="Mozilla/5.0 TianwenResearch/1.0"
          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

          def fetch(url, referer=None):
              h={"User-Agent":UA}
              if referer: h["Referer"]=referer
              req=urllib.request.Request(url,headers=h)
              try:
                  with opener.open(req,timeout=30) as r:
                      b=r.read()
                      return r.status,r.geturl(),dict(r.headers),b
              except Exception as e:
                  code=getattr(e,"code",None); body=b""
                  try: body=e.read()
                  except Exception: body=repr(e).encode()
                  return code,getattr(e,"url",url),dict(getattr(e,"headers",{}) or {}),body

          st,final,headers,body=fetch(DETAIL)
          (OUT/"detail.html").write_bytes(body)
          text=body.decode("utf-8","replace")

          # Extract only routes/IDs source-emitted by this exact target page.
          script_m=re.search(r'<script[^>]+src="([^"]*showArticle_cn\.js[^"]*)"',text,re.I)
          script_url=urllib.parse.urljoin(final,script_m.group(1)) if script_m else None
          dl_m=re.search(r'var\s+downloadLink\s*=\s*"([^"]+)"',text)
          download_url=urllib.parse.urljoin(final,dl_m.group(1)) if dl_m else None
          mag_ids=sorted(set(re.findall(r'mag-articleid="([^"]+)"',text)))

          script_rec=None
          if script_url:
              sst,sfinal,sh,sb=fetch(script_url,DETAIL)
              (OUT/"showArticle_cn.js").write_bytes(sb)
              stext=sb.decode("utf-8","replace")
              route_strings=[]
              patterns=[
                  r'["\']([^"\']*(?:article|Article|content|Content|body|Body|fulltext|Fulltext|download|Download|ajax|Ajax)[^"\']*)["\']',
                  r'url\s*:\s*["\']([^"\']+)["\']',
              ]
              for pat in patterns:
                  for m in re.finditer(pat,stext):
                      v=m.group(1)
                      if 0<len(v)<500 and v not in route_strings: route_strings.append(v)
              script_rec={
                  "url":script_url,"status":sst,"final_url":sfinal,
                  "sha256":hashlib.sha256(sb).hexdigest(),"bytes":len(sb),
                  "route_like_strings":route_strings[:500],
              }

          download_rec=None
          if download_url:
              dst,dfinal,dh,db=fetch(download_url,DETAIL)
              (OUT/"articlefile_response.bin").write_bytes(db)
              ctype=dh.get("Content-Type") or dh.get("content-type")
              dispo=dh.get("Content-Disposition") or dh.get("content-disposition")
              sample=db[:400].decode("utf-8","replace")
              download_rec={
                  "url":download_url,"status":dst,"final_url":dfinal,
                  "sha256":hashlib.sha256(db).hexdigest(),"bytes":len(db),
                  "content_type":ctype,"content_disposition":dispo,
                  "starts_pdf":db.startswith(b"%PDF-"),
                  "starts_zip":db.startswith(b"PK\x03\x04"),
                  "looks_html":b"<html" in db[:1000].lower() or b"<!doctype" in db[:1000].lower(),
                  "sample":sample,
              }

          manifest={
              "policy":{
                  "authentication_used":False,
                  "paywall_bypass_attempted":False,
                  "id_enumeration_or_guessing":False,
                  "target_id_source":"OFFICIAL_PKU_SEARCH_BACKEND_EXACT_INSTALLMENT_28_MATCH",
                  "only_exact_target_detail_source_emitted_routes_followed":True,
              },
              "detail":{
                  "url":DETAIL,"status":st,"final_url":final,
                  "sha256":hashlib.sha256(body).hexdigest(),"bytes":len(body),
                  "contains_target_title":"五石斋文史札记" in text and "二十八" in text,
                  "contains_page_range":("121-129" in text or "121–129" in text),
                  "source_emitted_showarticle_script":script_url,
                  "source_emitted_articlefile_url":download_url,
                  "source_emitted_mag_articleids":mag_ids,
              },
              "showarticle_script":script_rec,
              "articlefile_response":download_rec,
          }
          (OUT/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wushizhai-pku-detail-fulltext-gc
          path: artifacts/pku-detail-gc
          if-no-files-found: error
