name: probe-tianwen-13tk-xing-v45-original
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths: [.github/workflows/tianwen-13tk-xing-v45-original-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-party-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check PyMuPDF Pillow
      - name: Fetch registered Ming scan and generate source page controls
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, urllib.request
          from pathlib import Path
          import fitz
          from PIL import Image, ImageOps, ImageDraw
          url = "https://upload.wikimedia.org/wikipedia/commons/5/5a/NLC892-CBM1408-371933_%E5%8F%A4%E4%BB%8A%E5%BE%8B%E6%9B%86%E8%80%83_%E4%B8%83%E5%8D%81%E4%BA%8C%E5%8D%B7_%E7%AC%AC14%E5%86%8A.pdf"
          req = urllib.request.Request(url, headers={"User-Agent": "Tianwen-Historical-Research/1.0 (public-domain source verification)"})
          with urllib.request.urlopen(req, timeout=65) as resp:
              data = resp.read(30000000)
              print("HTTP", resp.status, "type", resp.headers.get("Content-Type"), "bytes", len(data))
          assert data[:5] == b"%PDF-" and 1000000 < len(data) < 30000000, "Unexpected PDF payload"
          # 13TS: retain the complete registered source once, so subsequent
          # same-copy page inspections do not require another acquisition run.
          assert hashlib.sha256(data).hexdigest() == "95b264e0447fb612a4b389b4b44e8f9871f9d0417b6893699fd37fe589cb23f3", "Registered original PDF changed"
          Path("native-evidence").mkdir(exist_ok=True)
          Path("native-evidence/source.pdf").write_bytes(data)
          doc = fitz.open(stream=data, filetype="pdf")
          assert 55 <= len(doc) <= 90, "Expected historical scan fascicle length"
          print("SOURCE", json.dumps({"catalog_work": "邢雲路《古今律曆考》", "public_page_id": "NLC892-CBM1408-371933", "book": 14, "bibliographic_volumes": [43,44,45], "pdf_pages": len(doc), "byte_sha256": hashlib.sha256(data).hexdigest(), "source": url}, ensure_ascii=False))
          # 13TQ: inspect actual embedded-image resolution, avoiding another
          # low-resolution JPEG render as evidence for the last-place glyphs.
          for page_no in [63,65,70,72]:
              page=doc[page_no]
              infos=page.get_images(full=True)
              print("NATIVE_PAGE_IMAGES",json.dumps({"page_one_based":page_no+1,"images":[list(x[:9]) for x in infos]}))
              for image_index, info in enumerate(infos):
                  xref=info[0]
                  extracted=doc.extract_image(xref)
                  raw=extracted["image"]
                  native=Image.open(io.BytesIO(raw)).convert("L")
                  print("NATIVE_IMAGE",json.dumps({"page_one_based":page_no+1,"image_index":image_index,"xref":xref,"width":native.width,"height":native.height,"ext":extracted["ext"],"bytes":len(raw),"raw_sha256":hashlib.sha256(raw).hexdigest(),"gray_pixel_sha256":hashlib.sha256(native.tobytes()).hexdigest()}))
                  # Keep native full pages in an artifact; log only narrow
                  # original-pixel target columns to avoid oversized responses.
                  Path("native-evidence").mkdir(exist_ok=True)
                  native.save(f"native-evidence/p{page_no+1}-image{image_index}.png")
                  if page_no not in (65,70): continue
                  # Source column positions are mapped from the archived 1002x854
                  # whole-spread render; full native pages permit independent replay.
                  ref=(650,110,705,805) if page_no==65 else (270,110,327,805)
                  rect=tuple(round(v*native.width/1002) if k%2==0 else round(v*native.height/854) for k,v in enumerate(ref))
                  crop=native.crop(rect)
                  print("NATIVE_CROP",json.dumps({"page_one_based":page_no+1,"xref":xref,"rect_px":rect,"gray_pixel_sha256":hashlib.sha256(crop.tobytes()).hexdigest()}))
                  out=io.BytesIO();crop.save(out,format="PNG")
                  payload=out.getvalue()
                  print("NATIVE_PNG",json.dumps({"page_one_based":page_no+1,"image_index":image_index,"png_sha256":hashlib.sha256(payload).hexdigest(),"png_bytes":len(payload)}))
                  b64=base64.b64encode(payload).decode("ascii")
                  for i in range(0,len(b64),3000): print(f"NATIVE_{page_no}_{image_index}|{i//3000:04d}|{b64[i:i+3000]}")
          PY
      - name: Preserve native source evidence
        uses: actions/upload-artifact@v4
        with:
          name: xing-13tq-native-source-pages
          path: native-evidence/
          retention-days: 90
