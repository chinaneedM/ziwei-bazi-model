name: probe-tianwen-13wf-xing-j45-original-native
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-tianwen-13wf-xing-j45-original-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-image:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source hash, embedded-pixel geometry, focused no-OCR original crops
        shell: bash
        run: |
          python -m pip install --quiet pymupdf pillow
          python - <<'PY'
          import urllib.request,hashlib,base64,io,json
          import fitz
          from PIL import Image
          url='https://upload.wikimedia.org/wikipedia/commons/5/5a/NLC892-CBM1408-371933_%E5%8F%A4%E4%BB%8A%E5%BE%8B%E6%9B%86%E8%80%83_%E4%B8%83%E5%8D%81%E4%BA%8C%E5%8D%B7_%E7%AC%AC14%E5%86%8A.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'TianwenResearch/1.0 (public historical source, no authentication)'})
          with urllib.request.urlopen(req,timeout=120) as res:
              data=res.read()
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='95b264e0447fb612a4b389b4b44e8f9871f9d0417b6893699fd37fe589cb23f3',digest
          doc=fitz.open(stream=data,filetype='pdf')
          assert len(doc)==74,len(doc)
          print('SOURCE_BIND',json.dumps({'sha256':digest,'bytes':len(data),'pages':len(doc),'accession':'NLC-CBM1408-371933'},sort_keys=True))
          for pno,target in [(66,'LIMIT35'),(71,'LIMIT132')]:
              pg=doc[pno-1]
              embedded=[]
              for xx in pg.get_images(full=True):
                  xref=xx[0]
                  im=doc.extract_image(xref)
                  embedded.append({'xref':xref,'width':im['width'],'height':im['height'],'ext':im['ext'],'sha256':hashlib.sha256(im['image']).hexdigest()})
              print('SOURCE_PAGE_IMAGES',json.dumps({'pdf_page':pno,'target':target,'page_rect':list(pg.rect),'embedded':embedded},sort_keys=True))
              matrix=fitz.Matrix(6,6)
              pix=pg.get_pixmap(matrix=matrix,alpha=False)
              im=Image.frombytes('RGB',(pix.width,pix.height),pix.samples)
              crop=im.crop((0,0,int(im.width*.56),im.height))
              out=io.BytesIO();crop.save(out,'JPEG',quality=83,optimize=True)
              bits=out.getvalue()
              print('CROP_BEGIN',json.dumps({'pdf_page':pno,'target':target,'render_full_px':list(im.size),'crop_bbox_px':[0,0,crop.width,crop.height],'jpeg_sha256':hashlib.sha256(bits).hexdigest(),'jpeg_bytes':len(bits),'method':'SOURCE_PDF_RASTERIZED_6X_NOT_NEW_NATIVE_PIXELS'},sort_keys=True))
              b64=base64.b64encode(bits).decode('ascii')
              for pos in range(0,len(b64),6000):
                  print('CROP_PART',pno,pos//6000,b64[pos:pos+6000])
              print('CROP_END',pno)
          PY
