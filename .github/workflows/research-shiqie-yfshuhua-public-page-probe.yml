name: research-shiqie-yfshuhua-public-page-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-yfshuhua-public-page-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire only the three literal public sample images
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          urls=[
            'https://www.yfshuhua.com/wp-content/uploads/2025/02/00724-筮箧理数日抄_0124142020_1.jpg',
            'https://www.yfshuhua.com/wp-content/uploads/2025/02/00724-筮箧理数日抄_0124142024_4.jpg',
            'https://www.yfshuhua.com/wp-content/uploads/2025/02/00724-筮箧理数日抄_0124142025_5.jpg',
          ]
          ua='Mozilla/5.0 ziwei-bazi-model historical-provenance-research/2.0'
          out=[]
          Path('samples').mkdir()
          for i,url in enumerate(urls,1):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'image/*,*/*'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read(20_000_000); status=r.status; final=r.geturl(); ctype=r.headers.get('content-type')
              path=Path('samples')/f'sample{i}.jpg'; path.write_bytes(b)
              out.append({'index':i,'source_url':url,'final_url':final,'status':status,'content_type':ctype,'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          result={'schema':'SHIQIE-YFSHUHUA-PUBLIC-SAMPLE-IMAGES-R1','post_id':864433,'samples':out,'policy':'ONLY THREE LITERAL PUBLIC IMAGE URLS ALREADY EMITTED BY PUBLIC HTML; NO LOGIN; NO PAYMENT; NO MEMBER DOWNLOAD AJAX; NO PDF/DOWNLOAD TARGET ACCESS; NO URL OR ID GUESSING'}
          Path('sample-manifest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-yfshuhua-public-samples
          path: |
            sample-manifest.json
            samples/*.jpg
          if-no-files-found: error
