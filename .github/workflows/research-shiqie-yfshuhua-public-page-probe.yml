name: research-shiqie-yfshuhua-public-page-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-yfshuhua-public-page-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect only public HTML and literal public resource contracts
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path
          url='https://www.yfshuhua.com/864433.html'
          ua='Mozilla/5.0 ziwei-bazi-model historical-provenance-research/1.9'
          req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read(8_000_000); final=r.geturl(); status=r.status; headers=dict(r.headers.items())
          text=body.decode('utf-8','replace')
          decoded=html.unescape(text)
          title_terms=['筮箧理数日抄','筮篋理数日抄','筮篋理數日抄']
          positions=[]
          for term in title_terms:
              positions += [(term,m.start()) for m in re.finditer(re.escape(term),decoded)]
          attrs=[]
          for m in re.finditer(r'''(?:href|src|data-src|data-original|data-lazy-src)\s*=\s*["']([^"']+)["']''',decoded,re.I):
              raw=m.group(1).strip()
              if not raw or raw.startswith(('javascript:','#','data:')): continue
              full=urllib.parse.urljoin(final,raw)
              rec={'raw':raw,'url':full}
              if rec not in attrs: attrs.append(rec)
          public_candidates=[]
          for rec in attrs:
              u=rec['url'].lower()
              if any(x in u for x in ['.jpg','.jpeg','.png','.webp','.gif','.pdf','archives.go.jp','digital.archives','wp-content/uploads','baidu','pan.']):
                  public_candidates.append(rec)
          contexts=[]
          for term,pos in positions[:10]:
              frag=decoded[max(0,pos-5000):min(len(decoded),pos+15000)]
              contexts.append({'term':term,'index':pos,'text':re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',frag)).strip()[:12000]})
          result={
              'schema':'SHIQIE-YFSHUHUA-PUBLIC-PAGE-PROBE-R1',
              'source_url':url,'status':status,'final_url':final,
              'body_len':len(body),'sha256':hashlib.sha256(body).hexdigest(),
              'content_type':headers.get('Content-Type'),'title_occurrence_count':len(positions),
              'contexts':contexts,'literal_public_resource_candidates':public_candidates,
              'policy':'PUBLIC HTML ONLY; LITERAL RESOURCE URL EXTRACTION ONLY; DO NOT LOGIN; DO NOT PAY; DO NOT ACCESS MEMBER/PAYWALLED DOWNLOAD TARGETS; DO NOT GUESS IDS OR PRIVATE ENDPOINTS'
          }
          Path('shiqie-yfshuhua-public-page.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:result[k] for k in ['status','final_url','body_len','sha256','title_occurrence_count']},ensure_ascii=False,indent=2))
          print('CANDIDATES')
          print(json.dumps(public_candidates[:100],ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-yfshuhua-public-page
          path: shiqie-yfshuhua-public-page.json
          if-no-files-found: error
