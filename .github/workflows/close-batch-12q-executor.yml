name: close-batch-12q-executor

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/close-batch-12q-executor.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0
      - name: Refuse stale trigger
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/fusion-chart-core-r1-20260822
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/fusion-chart-core-r1-20260822)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply Batch 12Q
        run: python .github/scripts/close_batch_12q.py
      - name: Run gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python -m unittest discover -s tests -p 'test_fusion_chart_historical_provenance_audit*.py'
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Research Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "close KOSTMA Scribd Fozhu provenance batch 12Q"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
