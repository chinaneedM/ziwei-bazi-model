name: verify-yehuobian-12vw-columbia-marc-shard-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12vw-columbia-marc-shard-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-SOURCE-REGISTRY-EXTENSIONS-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VW-*
      - scripts/probe-yehuobian-columbia-marc-12vw.py
      - scripts/verify-yehuobian-columbia-marc-scope-12vw.py
      - tests/test_yehuobian_columbia_marc_12vw.py
  workflow_dispatch:
    inputs:
      shard:
        description: 'One official MARCXML shard (001–111), not an exhaustive negative search'
        required: false
        default: '111'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Forward-only research and offline parser tests
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-columbia-marc-scope-12vw.py
          python -m unittest discover -s tests -p 'test_yehuobian_columbia_marc_12vw.py' -v
      - name: One bounded official Columbia MARC shard probe (non-authoritative)
        id: probe
        continue-on-error: true
        env:
          SHARD: ${{ github.event.inputs.shard || '111' }}
        run: |
          set -euo pipefail
          mkdir -p clio-evidence
          python scripts/probe-yehuobian-columbia-marc-12vw.py --download-shard "$SHARD" --output clio-evidence/one-shard-result.json
      - name: Record failed public download as access-boundary only
        if: steps.probe.outcome == 'failure'
        run: |
          mkdir -p clio-evidence
          echo '{"schema":"TIANWEN-12VW-MARC-ONE-SHARD-PROBE-RESULT-R1","status":"ACCESS_OR_PARSE_BOUNDARY","whole_catalog_searched":false,"catalog_absence_inference_allowed":false,"ancient_glyph_votes":0}' > clio-evidence/one-shard-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: columbia-clio-one-shard-12vw
          path: clio-evidence/one-shard-result.json
          if-no-files-found: warn
