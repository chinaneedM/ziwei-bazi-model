name: research-ndl-zhongguodianji-2008-03-child-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-ndl-zhongguodianji-2008-03-child-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe finite source-emitted NDL volume-list pages
        run: |
          set -euo pipefail
          mkdir -p research-out
          python - <<'PY'
          import hashlib, html, json, re, urllib.request
          from pathlib import Path

          base="https://ndlsearch.ndl.go.jp/search?collapse=none&cs=bib&f-tid=R100000002-Ia0000052718&from={offset}&size=20&sort=published%3Adesc"
          offsets=[0,20,40,60]
          out={"target":"中國典籍與文化 2008(3)=66:2008","requests":[],"matches":[]}
          ua={"User-Agent":"Mozilla/5.0 TianwenHistoricalAudit/1.0"}
          for offset in offsets:
              url=base.format(offset=offset)
              req=urllib.request.Request(url,headers=ua)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read()
                      status=getattr(r,"status",200)
                      final=r.geturl()
                      ctype=r.headers.get("Content-Type")
              except Exception as ex:
                  out["requests"].append({"offset":offset,"url":url,"error":repr(ex)})
                  continue
              text=b.decode("utf-8","replace")
              Path(f"research-out/ndl-{offset}.html").write_bytes(b)
              rec={"offset":offset,"url":url,"final_url":final,"status":status,"content_type":ctype,"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b)}
              target_positions=[m.start() for m in re.finditer(r"2008\s*\(3\)\s*=\s*66\s*:\s*2008",text)]
              rec["target_occurrences"]=len(target_positions)
              out["requests"].append(rec)

              link_re=re.compile(r'href=["\']([^"\']*?/books/R100000002-Ia0000052718-i\d+[^"\']*)["\'][^>]*>(.*?)</a>',re.I|re.S)
              for href,label_html in link_re.findall(text):
                  label=html.unescape(re.sub(r"<[^>]+>"," ",label_html))
                  label=" ".join(label.split())
                  if "2008" in label or "中國典籍與文化" in label:
                      out["matches"].append({"offset":offset,"href":html.unescape(href),"label":label})
              for pos in target_positions:
                  lo=max(0,pos-1800); hi=min(len(text),pos+1800)
                  context=text[lo:hi]
                  hrefs=re.findall(r'href=["\']([^"\']+)["\']',context,re.I)
                  out.setdefault("target_contexts",[]).append({"offset":offset,"context":context,"hrefs":hrefs})

          Path("research-out/result.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ndl-zhongguodianji-2008-03-child-probe
          path: research-out
          if-no-files-found: error
