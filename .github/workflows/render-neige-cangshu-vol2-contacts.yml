name: render-neige-cangshu-vol2-contacts

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-neige-cangshu-vol2-contacts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Render compact contact sheets for correct Neige Cangshu Mulu volume 2
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/neige-cangshu-vol2-contacts'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages" "$ROOT/contacts"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python -m pip install --quiet pillow
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-1084-204844%20%E5%85%A7%E9%96%A3%E8%97%8F%E6%9B%B8%E7%9B%AE%E9%8C%84%20%E7%AC%AC2%E5%86%8A.pdf'
          curl -fL --retry 4 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"
          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source-sha256.txt"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"
          pdftoppm -jpeg -r 92 "$ROOT/source.pdf" "$ROOT/pages/page" >/dev/null 2>&1
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json,hashlib
          root=Path('audit/neige-cangshu-vol2-contacts')
          pages=sorted(root.joinpath('pages').glob('page-*.jpg'))
          cols=5; per=20; contacts=[]; manifest=[]
          for i,p in enumerate(pages,1):
              b=p.read_bytes(); im=Image.open(p)
              manifest.append({'pdf_page':i,'file':p.name,'sha256':hashlib.sha256(b).hexdigest(),'width':im.width,'height':im.height})
          for start in range(0,len(pages),per):
              chunk=pages[start:start+per]; thumbs=[]
              for j,p in enumerate(chunk,start+1):
                  im=Image.open(p).convert('RGB'); tw=390
                  im=im.resize((tw,max(1,int(im.height*tw/im.width))))
                  c=Image.new('RGB',(tw,im.height+32),'white'); c.paste(im,(0,32))
                  ImageDraw.Draw(c).text((8,7),f'PDF p{j}',fill='black'); thumbs.append(c)
              cw=max(t.width for t in thumbs); ch=max(t.height for t in thumbs)
              rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new('RGB',(cols*cw,rows*ch),'white')
              for k,t in enumerate(thumbs): sheet.paste(t,((k%cols)*cw,(k//cols)*ch))
              out=root/'contacts'/f'contact-{start+1:03d}-{start+len(chunk):03d}.jpg'
              sheet.save(out,quality=94); contacts.append(out.name)
          report={
            'schema':'NEIGE-CANGSHU-VOL2-CONTACTS-R1',
            'source_file':'NLC892-1084-204844 內閣藏書目錄 第2冊.pdf',
            'source_pdf_sha256':hashlib.sha256((root/'source.pdf').read_bytes()).hexdigest(),
            'page_count':len(pages),
            'contacts':contacts,
            'target_locator_context':'技藝部; after 永樂七政 material; 準齋几漏新式一冊 / 孫逢吉著 / 莫詳時代; before 皇極經世衍數',
            'authority':'VISUAL_LOCATOR_ONLY'
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          rm -rf "$ROOT/pages" "$ROOT/source.pdf"
      - name: Upload contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: neige-cangshu-vol2-contacts-r1
          path: audit/neige-cangshu-vol2-contacts
          if-no-files-found: error
          retention-days: 30
