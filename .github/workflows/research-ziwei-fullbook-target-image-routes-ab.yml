name: research-ziwei-fullbook-target-image-routes-ab

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-fullbook-target-image-routes-ab.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe exact public pages and source-emitted image objects
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path("probe"); IMG=OUT/"images"; OUT.mkdir(); IMG.mkdir()
          UA="Mozilla/5.0 provenance-research exact-public-page-source-emitted-images"
          pages=[
            ("kongfz_dunhuatang_54804686","https://www.kongfz.cn/54804686/pic/"),
            ("artron_2017_lot2036","https://auction.artron.net/paimai-art0064192036/"),
            ("zhihu_threebooks","https://zhuanlan.zhihu.com/p/1897623079770890824"),
            ("doc360_fullbook","https://www.360doc.com/content/21/0112/15/52920_956498900.shtml"),
            ("gudaishuji_volume3","https://www.gudaishuji.com/shuji/1739354733323.html"),
          ]

          def fetch(url, referer=None, limit=16_000_000):
            headers={
              "User-Agent":UA,
              "Accept":"text/html,application/xhtml+xml,image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8",
              "Accept-Language":"zh-CN,zh-TW;q=0.9,en;q=0.5"
            }
            if referer: headers["Referer"]=referer
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=40) as resp:
                data=resp.read(limit)
                return {
                  "ok":True, "status":getattr(resp,"status",None),
                  "final_url":resp.geturl(), "content_type":resp.headers.get("content-type"),
                  "bytes":len(data), "sha256":hashlib.sha256(data).hexdigest(), "data":data
                }
            except Exception as exc:
              return {"ok":False,"error":repr(exc),"bytes":0,"data":b""}

          result={
            "schema":"ZIWEI-FULLBOOK-TARGET-IMAGE-ROUTES-AB-R1",
            "access_date":"2026-09-09",
            "authentication_attempted":False,
            "purchase_attempted":False,
            "identifier_guessing_attempted":False,
            "access_control_bypass_attempted":False,
            "pages":[],
            "images":[]
          }

          emitted=[]
          for label,url in pages:
            row=fetch(url); raw=row.pop("data")
            rec={"label":label,"url":url,**row,"source_emitted_image_urls":[]}
            if raw:
              txt=None
              for enc in ("utf-8","gb18030","big5","latin1"):
                try:
                  txt=raw.decode(enc); break
                except Exception:
                  pass
              txt=txt or raw.decode("utf-8","replace")
              (OUT/f"{label}.html").write_text(txt,encoding="utf-8")
              urls=[]
              # HTML attributes.
              for m in re.finditer(r'''(?:src|href|data-src|data-original|data-lazy-src|data-actualsrc|content)\s*=\s*["']([^"']+)["']''',txt,re.I):
                v=html.unescape(m.group(1)).replace("\\/","/")
                u=urllib.parse.urljoin(row.get("final_url") or url,v)
                if u.startswith(("http://","https://")) and u not in urls:
                  urls.append(u)
              # JSON/script escaped absolute image URLs.
              for m in re.finditer(r'''https?:\\?/\\?/[^"'<>\s]+''',txt,re.I):
                v=html.unescape(m.group(0)).replace("\\/","/").replace("\u002F","/")
                if re.search(r'''(?:jpg|jpeg|png|webp|avif|gif)(?:[?&#]|$)''',v,re.I) and v not in urls:
                  urls.append(v)
              keep=[]
              for u in urls:
                ul=u.lower()
                if any(x in ul for x in ("logo","favicon","sprite","avatar","iconfont","qrcode","qr_code","banner")):
                  continue
                if re.search(r'''\.(?:jpe?g|png|webp|avif|gif)(?:[?&#]|$)''',ul,re.I) or any(h in ul for h in ("image","img","pic","photo","upload")):
                  keep.append(u)
              rec["source_emitted_image_urls"]=keep[:240]
              for u in keep[:240]:
                emitted.append((label,url,u))
            result["pages"].append(rec)

          seen=set()
          for label,page,u in emitted:
            if u in seen: continue
            seen.add(u)
            row=fetch(u,referer=page,limit=12_000_000); raw=row.pop("data")
            item={"source_page":label,"page_url":page,"url":u,**row}
            ct=(row.get("content_type") or "").lower()
            magic=(
              raw[:3]==b"\xff\xd8\xff" or
              raw[:8]==b"\x89PNG\r\n\x1a\n" or
              raw[:4]==b"RIFF" or
              raw[:12].find(b"ftypavif")>=0 or
              raw[:6] in (b"GIF87a",b"GIF89a")
            )
            if raw and row.get("ok") and (magic or "image/" in ct) and len(raw)>25_000:
              if raw[:8]==b"\x89PNG\r\n\x1a\n": ext=".png"
              elif raw[:4]==b"RIFF": ext=".webp"
              elif raw[:12].find(b"ftypavif")>=0: ext=".avif"
              elif raw[:6] in (b"GIF87a",b"GIF89a"): ext=".gif"
              else: ext=".jpg"
              p=IMG/f"{label}-{len(result['images'])+1:03d}{ext}"
              p.write_bytes(raw); item["saved_file"]=str(p)
            result["images"].append(item)

          result["adjudication"]={
            "source_emitted_only":True,
            "visual_review_status":"PENDING_DIRECT_NO_OCR_REVIEW",
            "target_page_status":"PENDING_DIRECT_NO_OCR_REVIEW",
            "independent_textual_witness_increment":0,
            "algorithm_effect":"NONE"
          }
          (OUT/"ziwei-fullbook-target-image-routes-ab.json").write_text(
            json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          print(json.dumps({
            "pages":[
              {"label":p["label"],"ok":p.get("ok"),"status":p.get("status"),
               "final_url":p.get("final_url"),"bytes":p.get("bytes"),
               "image_url_count":len(p.get("source_emitted_image_urls",[]))}
              for p in result["pages"]
            ],
            "saved":[
              {"source_page":x["source_page"],"status":x.get("status"),"bytes":x.get("bytes"),
               "sha256":x.get("sha256"),"saved_file":x.get("saved_file"),"url":x["url"]}
              for x in result["images"] if x.get("saved_file")
            ],
            "adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))

      - name: Upload exact public target-image routes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-fullbook-target-image-routes-ab
          path: probe/
          if-no-files-found: warn
          retention-days: 14
