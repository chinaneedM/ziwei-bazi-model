name: verify-yehuobian-12vf-received-source-gates-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12vf-received-source-gates-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VF-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VF-*.md
      - scripts/verify-yehuobian-12vf-received-and-leads.py
      - tests/test_yehuobian_12vf_received_and_leads.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continuity and independent-source gates
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: 12VF new variant and 17 negative controls
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-12vf-received-and-leads.py
          python -m unittest discover -s tests -p 'test_yehuobian_12vf_received_and_leads.py' -v
