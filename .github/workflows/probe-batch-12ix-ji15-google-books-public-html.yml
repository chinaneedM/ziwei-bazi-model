name: probe-batch-12ix-ji15-google-books-public-html

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12ix-ji15-google-books-public-html.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Ji15 Google Books public HTML surfaces
        run: |
          python - <<'PY'
          import hashlib, html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests

          ISBN="9787501340637"
          TITLE=("冀淑英古籍善本十五讲","冀淑英古籍善本十五講","Ji Shuying gu ji shan ben shi wu jiang")
          QUERIES={
            "isbn_vid":f"https://books.google.com/books?vid=ISBN{ISBN}",
            "isbn_search":f"https://books.google.com/books?q=isbn%3A{ISBN}",
            "chapter9_search":"https://books.google.com/books?q=%22%E9%93%81%E7%90%B4%E9%93%9C%E5%89%91%E6%A5%BC%E8%97%8F%E4%B9%A6%E7%9A%84%E6%94%B6%E8%B4%AD%E5%85%A5%E8%97%8F%22+%22%E5%86%80%E6%B7%91%E8%8B%B1%22",
            "chapter10_search":"https://books.google.com/books?q=%22%E5%90%B4%E6%A2%85%E3%80%81%E6%9C%B1%E5%81%B0%E3%80%81%E8%B5%B5%E5%85%83%E6%96%B9%E7%9A%84%E6%8D%90%E8%B5%A0%22",
            "chapter11_search":"https://books.google.com/books?q=%22%E6%B6%B5%E8%8A%AC%E6%A5%BC%E8%97%8F%E4%B9%A6%22+%22%E5%86%80%E6%B7%91%E8%8B%B1%22"
          }
          TARGETS=("第九讲","第九講","第十讲","第十講","第十一讲","第十一講",
                   "铁琴铜剑楼藏书的收购入藏","鐵琴銅劍樓藏書的收購入藏",
                   "吴梅、朱偰、赵元方的捐赠","吳梅、朱偰、趙元方的捐贈",
                   "涵芬楼藏书","涵芬樓藏書","目录","目次","Contents")
          UA="Mozilla/5.0 (Tianwen provenance audit; anonymous Google Books public HTML probe)"
          MAX_BYTES=2*1024*1024

          def visible(raw):
              raw=re.sub(r'<script\b.*?</script>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<style\b.*?</style>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<[^>]+>',' ',raw)
              return re.sub(r'\s+',' ',html.unescape(raw)).strip()

          def contexts(text,term,radius=220,limit=6):
              out=[]; p=0
              while len(out)<limit:
                  i=text.find(term,p)
                  if i<0: break
                  out.append(text[max(0,i-radius):min(len(text),i+len(term)+radius)])
                  p=i+len(term)
              return out

          s=requests.Session()
          s.headers.update({"User-Agent":UA,"Accept-Language":"zh-CN,zh;q=0.9,en;q=0.7"})
          out={
            "target":{"title":"冀淑英古籍善本十五讲","isbn":ISBN},
            "routes":{},
            "security":{"login_used":False,"account_action_used":False,"copy_request_used":False,
                        "payment_used":False,"captcha_bypass_used":False,"tls_verification_disabled":False}
          }

          for key,url in QUERIES.items():
              row={"url":url}
              try:
                  r=s.get(url,timeout=45,allow_redirects=True,stream=True)
                  data=bytearray(); truncated=False
                  for chunk in r.iter_content(65536):
                      if not chunk: continue
                      if len(data)+len(chunk)>MAX_BYTES:
                          take=MAX_BYTES-len(data)
                          if take>0: data.extend(chunk[:take])
                          truncated=True; break
                      data.extend(chunk)
                  b=bytes(data)
                  raw=b.decode(r.encoding or "utf-8","replace")
                  text=visible(raw)
                  hrefs=[]
                  for m in re.finditer(r'href=[\"\']([^\"\']+)[\"\']',raw,re.I):
                      u=urljoin(r.url,html.unescape(m.group(1)))
                      if urlparse(u).scheme in ("http","https"):
                          hrefs.append(u)
                  hrefs=list(dict.fromkeys(hrefs))
                  book_links=[u for u in hrefs if "books.google." in u and ("/books?id=" in u or "vid=" in u)][:30]
                  normalized=text.replace("-","").replace(" ","")
                  row.update({
                    "status":r.status_code,"final_url":r.url,"redirect_count":len(r.history),
                    "content_type":r.headers.get("Content-Type",""),
                    "bytes_read":len(b),"truncated_at_2mib":truncated,
                    "body_sha256":hashlib.sha256(b).hexdigest(),
                    "target_title_present":any(t in text for t in TITLE),
                    "isbn_present":ISBN in normalized,
                    "target_flags":{t:(t in text) for t in TARGETS},
                    "target_contexts":{t:contexts(text,t) for t in TARGETS if t in text},
                    "page_number_like_contexts":contexts(text,"页")[:8]+contexts(text,"頁")[:8],
                    "ebook_unavailable_wording":("未提供电子书" in text or "No eBook available" in text),
                    "preview_markers":{t:(t.lower() in text.lower()) for t in
                        ("preview","full view","read online","snippet","电子书","電子書","目录","目次")},
                    "source_emitted_book_links":book_links,
                    "raw_html_saved":False,"raw_html_logged":False
                  })
              except Exception as e:
                  row["error"]=f"{type(e).__name__}: {e}"
              out["routes"][key]=row
              time.sleep(0.4)

          Path("ji15-google-books-public-html.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ix-ji15-google-books-public-html
          path: ji15-google-books-public-html.json

      - name: Follow only source-emitted Google Books object/search links
        run: |
          python - <<'PY'
          import hashlib, html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs, unquote
          import requests

          START="https://books.google.com/books?vid=ISBN9787501340637"
          ISBN="9787501340637"
          UA="Mozilla/5.0 (Tianwen provenance audit; source-emitted Google Books link follow-up)"
          MAX_BYTES=2*1024*1024
          TARGETS=("铁琴铜剑楼","鐵琴銅劍樓","瞿济苍","瞿濟蒼","瞿凤起","瞿鳳起","瞿旭初",
                   "第九讲","第九講","第十讲","第十講","第十一讲","第十一講",
                   "吴梅","吳梅","朱偰","赵元方","趙元方","涵芬楼","涵芬樓",
                   "捐赠","捐贈","常熟","永乐大典","永樂大典")

          def visible(raw):
              raw=re.sub(r'<script\b.*?</script>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<style\b.*?</style>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<[^>]+>',' ',raw)
              return re.sub(r'\s+',' ',html.unescape(raw)).strip()

          def fetch(s,url):
              r=s.get(url,timeout=45,allow_redirects=True,stream=True)
              data=bytearray(); trunc=False
              for chunk in r.iter_content(65536):
                  if not chunk: continue
                  if len(data)+len(chunk)>MAX_BYTES:
                      take=MAX_BYTES-len(data)
                      if take>0: data.extend(chunk[:take])
                      trunc=True; break
                  data.extend(chunk)
              b=bytes(data)
              raw=b.decode(r.encoding or "utf-8","replace")
              return r,b,raw,trunc

          def contexts(text,term,radius=220,limit=6):
              out=[]; p=0
              while len(out)<limit:
                  i=text.find(term,p)
                  if i<0: break
                  out.append(text[max(0,i-radius):min(len(text),i+len(term)+radius)])
                  p=i+len(term)
              return out

          s=requests.Session()
          s.headers.update({"User-Agent":UA,"Accept-Language":"zh-CN,zh;q=0.9,en;q=0.7"})
          out={"start":START,"discovered":[],"followed":[],"security":{
              "login_used":False,"account_action_used":False,"copy_request_used":False,
              "payment_used":False,"captcha_bypass_used":False,"tls_verification_disabled":False,
              "guessed_object_id_used":False,"guessed_search_endpoint_used":False}}

          r,b,raw,tr=fetch(s,START)
          links=[]
          for m in re.finditer(r'href=[\"\']([^\"\']+)[\"\']',raw,re.I):
              u=urljoin(r.url,html.unescape(m.group(1)))
              if urlparse(u).scheme not in ("http","https") or "books.google." not in u:
                  continue
              if "/books?" not in u:
                  continue
              if u not in links: links.append(u)

          selected=[]
          for u in links:
              q=parse_qs(urlparse(u).query)
              reason=None
              if q.get("output")==["html_text"]:
                  reason="SOURCE_EMITTED_HTML_TEXT"
              elif "id" in q and "sitesec" not in q:
                  if "q" not in q:
                      reason="SOURCE_EMITTED_BOOK_OBJECT"
                  else:
                      term=unquote(q["q"][0])
                      if term in ("捐赠","捐贈","常熟","永乐大典","永樂大典","藏书家","藏書家"):
                          reason="SOURCE_EMITTED_WORD_CLOUD_TARGET_ADJACENT"
              if reason:
                  selected.append({"url":u,"reason":reason})
          # Deduplicate and cap.
          seen=set(); chosen=[]
          for x in selected:
              if x["url"] in seen: continue
              seen.add(x["url"]); chosen.append(x)
              if len(chosen)>=16: break
          out["discovered"]=chosen

          for x in chosen:
              row=dict(x)
              try:
                  rr,bb,rrraw,rrtr=fetch(s,x["url"])
                  text=visible(rrraw)
                  row.update({
                    "status":rr.status_code,"final_url":rr.url,"redirect_count":len(rr.history),
                    "content_type":rr.headers.get("Content-Type",""),"bytes_read":len(bb),
                    "truncated_at_2mib":rrtr,"body_sha256":hashlib.sha256(bb).hexdigest(),
                    "isbn_present":ISBN in text.replace("-","").replace(" ",""),
                    "target_flags":{t:(t in text) for t in TARGETS},
                    "target_contexts":{t:contexts(text,t) for t in TARGETS if t in text},
                    "page_tokens":re.findall(r'(?<!\d)(?:1[0-9]{2}|2[0-4][0-9])(?!\d)',text)[:120],
                    "page_marker_contexts":contexts(text,"页")[:10]+contexts(text,"頁")[:10],
                    "preview_markers":{t:(t.lower() in text.lower()) for t in
                       ("preview","full view","read online","snippet","页面","頁面","Page")},
                    "raw_body_saved":False,"raw_body_logged":False
                  })
              except Exception as e:
                  row["error"]=f"{type(e).__name__}: {e}"
              out["followed"].append(row)
              time.sleep(0.35)

          Path("ji15-google-books-source-emitted-followup.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ix-ji15-google-books-source-emitted-followup
          path: ji15-google-books-source-emitted-followup.json

      - name: Use source-emitted in-book search contract for exact chapter boundary terms
        run: |
          python - <<'PY'
          import hashlib, html, json, re, time
          from pathlib import Path
          from urllib.parse import urlencode
          import requests

          BOOK_ID="k4MzlCiOPIcC"
          BASE="https://books.google.com/books"
          TERMS=[
            "瞿凤起","瞿济苍","瞿旭初","铁琴铜剑楼",
            "赵元方","吴梅","朱偰","涵芬楼",
            "铁琴铜剑楼藏书的收购入藏",
            "吴梅、朱偰、赵元方的捐赠",
            "涵芬楼藏书"
          ]
          UA="Mozilla/5.0 (Tianwen provenance audit; Google Books source-emitted in-book search contract)"
          MAX_BYTES=2*1024*1024

          def visible(raw):
              raw=re.sub(r'<script\b.*?</script>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<style\b.*?</style>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<[^>]+>',' ',raw)
              return re.sub(r'\s+',' ',html.unescape(raw)).strip()

          def contexts(text,term,radius=260,limit=10):
              out=[]; p=0
              while len(out)<limit:
                  i=text.find(term,p)
                  if i<0: break
                  out.append(text[max(0,i-radius):min(len(text),i+len(term)+radius)])
                  p=i+len(term)
              return out

          s=requests.Session()
          s.headers.update({"User-Agent":UA,"Accept-Language":"zh-CN,zh;q=0.9,en;q=0.7"})
          out={
            "book_id":BOOK_ID,
            "search_contract_basis":"Source-emitted q= word-cloud links on exact ISBN record; this step changes only the user-visible search term.",
            "queries":[],
            "security":{"login_used":False,"account_action_used":False,"copy_request_used":False,
                        "payment_used":False,"captcha_bypass_used":False,"tls_verification_disabled":False,
                        "guessed_object_id_used":False,"guessed_endpoint_used":False}
          }
          for term in TERMS:
              url=BASE+"?"+urlencode({"id":BOOK_ID,"q":term,"hl":"zh-CN"})
              row={"term":term,"url":url}
              try:
                  r=s.get(url,timeout=45,allow_redirects=True,stream=True)
                  data=bytearray(); trunc=False
                  for chunk in r.iter_content(65536):
                      if not chunk: continue
                      if len(data)+len(chunk)>MAX_BYTES:
                          take=MAX_BYTES-len(data)
                          if take>0: data.extend(chunk[:take])
                          trunc=True; break
                      data.extend(chunk)
                  b=bytes(data)
                  raw=b.decode(r.encoding or "utf-8","replace")
                  text=visible(raw)
                  page_hits=[]
                  for m in re.finditer(r'第\s*(\d{1,3})\s*页',text):
                      n=int(m.group(1))
                      if n not in page_hits: page_hits.append(n)
                  row.update({
                    "status":r.status_code,"final_url":r.url,"content_type":r.headers.get("Content-Type",""),
                    "bytes_read":len(b),"truncated_at_2mib":trunc,"body_sha256":hashlib.sha256(b).hexdigest(),
                    "term_visible":term in text,
                    "result_count_text":re.findall(r'共有\s*\d+\s*个结果',text)[:4],
                    "page_hits":page_hits[:30],
                    "term_contexts":contexts(text,term),
                    "all_page_contexts":contexts(text,"第")[:18],
                    "rest_of_book_marker":("此书的其余部分在哪里" in text),
                    "raw_body_saved":False,"raw_body_logged":False
                  })
              except Exception as e:
                  row["error"]=f"{type(e).__name__}: {e}"
              out["queries"].append(row)
              time.sleep(0.35)

          Path("ji15-google-books-targeted-inbook-search.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ix-ji15-google-books-targeted-inbook-search
          path: ji15-google-books-targeted-inbook-search.json
