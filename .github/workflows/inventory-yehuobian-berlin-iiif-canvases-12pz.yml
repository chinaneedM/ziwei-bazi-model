name: inventory-yehuobian-berlin-iiif-canvases-12pz

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/inventory-yehuobian-berlin-iiif-canvases-12pz.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-iiif-sample-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install bounded image preview dependencies
        run: python -m pip install --quiet pillow
      - name: Fetch source-explicit public IIIF metadata and bounded thumbnails
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 12pz-berlin/canvases 12pz-berlin/contact-sheets
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, urllib.parse, urllib.request, urllib.error
          from PIL import Image, ImageDraw, ImageOps
          root=pathlib.Path("12pz-berlin")
          ppn="PPN334378186X"
          manifest_url=f"https://content.staatsbibliothek-berlin.de/dc/{ppn}/manifest"
          headers={"User-Agent":"Tianwen-Historical-Provenance-R1/1.0 (public read-only IIIF sample audit)","Accept":"application/ld+json,application/json,image/jpeg"}
          def fetch(url,limit=2000000):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=40) as r:
                  b=r.read(limit+1)
                  if len(b)>limit:raise ValueError("bounded_download_exceeded")
                  return b,r.status,r.headers.get("Content-Type","")
          body,status,ct=fetch(manifest_url,1000000)
          assert status==200, status
          manifest=json.loads(body.decode("utf-8"))
          assert manifest.get("sequences"),"expected IIIF Presentation v2"
          canvases=manifest["sequences"][0].get("canvases",[])
          assert len(canvases)==38,("unexpected canvas count",len(canvases))
          (root/"manifest-sha256.txt").write_text(hashlib.sha256(body).hexdigest()+"  manifest\n")
          summary={"ppn":ppn,"manifest_url":manifest_url,"http_status":status,"manifest_sha256":hashlib.sha256(body).hexdigest(),"manifest_bytes":len(body),"canvas_count":len(canvases),"scope":"SAMPLE_CANVAS_METADATA_AND_BOUNDED_PREVIEW_ONLY_NOT_1827_TARGET_GLYPH_AUTHORITY","no_ocr":True,"source_explicit_image_services_only":True,"target_leaf_adjudication":"NOT_ATTEMPTED","pages":[]}
          for i,canvas in enumerate(canvases,1):
              label=canvas.get("label")
              if isinstance(label,dict):label=label.get("en") or next(iter(label.values()),"")
              label=str(label)[:180]
              entry={"index":i,"label":label,"canvas_id":canvas.get("@id"),"image_service":None,"preview_request":None,"image_sha256":None,"image_bytes":0,"preview_status":"NOT_REQUESTED"}
              images=canvas.get("images") or []
              resource=(images[0].get("resource") or {}) if images else {}
              service=resource.get("service") or {}
              if isinstance(service,list):service=service[0] if service else {}
              base=service.get("@id") or service.get("id")
              if base:
                  host=urllib.parse.urlparse(base).hostname
                  if host=="content.staatsbibliothek-berlin.de" and base.startswith("https://"):
                      url=base.rstrip("/")+"/full/340,/0/default.jpg"
                      entry["image_service"]=base
                      entry["preview_request"]=url
                      try:
                          b,code,ctype=fetch(url,2100000)
                          img=Image.open(io.BytesIO(b)).convert("RGB")
                          if img.width<40 or img.height<40:raise ValueError("invalid_tiny_image")
                          entry["image_sha256"]=hashlib.sha256(b).hexdigest()
                          entry["image_bytes"]=len(b)
                          entry["preview_status"]="FETCHED_SOURCE_IIIF_THUMBNAIL"
                          img.thumbnail((315,445))
                          dest=root/"canvases"/f"sample-{i:02}.jpg"
                          img.save(dest,format="JPEG",quality=83)
                      except Exception as exc:
                          entry["preview_status"]="ERROR_"+type(exc).__name__
                  else:entry["preview_status"]="SERVICE_HOST_NOT_ALLOWED"
              else:entry["preview_status"]="NO_EXPLICIT_IMAGE_SERVICE"
              summary["pages"].append(entry)
              print("CANVAS",json.dumps(entry,ensure_ascii=False))
          # This is a navigation contact sheet, not a glyph-collation image.
          sheets=[]
          for start in range(0,len(canvases),8):
              sheet=Image.new("RGB",(4*342,2*495),(244,244,244))
              dr=ImageDraw.Draw(sheet)
              for k in range(start,min(start+8,len(canvases))):
                  idx=k+1
                  row=(k-start)//4;col=(k-start)%4
                  x,y=col*342,row*495
                  name=root/"canvases"/f"sample-{idx:02}.jpg"
                  dr.text((x+8,y+8),f"sample {idx:02}",fill=(0,0,0))
                  if name.exists():
                      img=Image.open(name)
                      sheet.paste(img,(x+8,y+35))
                  dr.text((x+8,y+468),summary["pages"][k]["label"][:43],fill=(0,0,0))
              outfile=root/"contact-sheets"/f"sample-{start+1:02}-{min(start+8,len(canvases)):02}.jpg"
              sheet.save(outfile,format="JPEG",quality=65,optimize=True)
              sheets.append({"name":outfile.name,"sha256":hashlib.sha256(outfile.read_bytes()).hexdigest(),"size_bytes":outfile.stat().st_size})
          summary["contact_sheets"]=sheets
          summary["thumbnails_acquired_count"]=sum(p["preview_status"]=="FETCHED_SOURCE_IIIF_THUMBNAIL" for p in summary["pages"])
          summary["ancient_target_witnesses_added"]=0
          (root/"canvas-inventory.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("SUMMARY",json.dumps({"canvas_count":len(canvases),"thumbnails_acquired":summary["thumbnails_acquired_count"],"contact_sheets":sheets},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: berlin-1827-public-38-sample-canvas-inventory-12pz
          path: |
            12pz-berlin/canvas-inventory.json
            12pz-berlin/manifest-sha256.txt
            12pz-berlin/contact-sheets/
            12pz-berlin/canvases/
          if-no-files-found: error
          retention-days: 30
