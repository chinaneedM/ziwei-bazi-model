name: audit-kyudb-datong-tonggui-route

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-kyudb-datong-tonggui-route.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Probe exact Kyudb holdings and image route
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/kyudb-datong-tonggui-route'
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          python - <<'PY'
          from pathlib import Path
          import html as htmlmod
          import json, re, urllib.parse, urllib.request

          root=Path('audit/kyudb-datong-tonggui-route')
          UA='Mozilla/5.0 Tianwen-Provenance-Audit/1.0'
          TITLES=[
            ('rili','大統曆日通軌','대통력일통궤'),
            ('taiyang','太陽通軌','태양통궤'),
            ('taiyin','太陰通軌','태음통궤'),
            ('jiaoshi','交食通軌','교식통궤'),
            ('wuxing','五星通軌','오성통궤'),
            ('siyu','四餘纏度通軌','사여전도통궤'),
          ]

          def request(url, data=None):
              body=urllib.parse.urlencode(data).encode() if data is not None else None
              req=urllib.request.Request(url,data=body,headers={
                  'User-Agent':UA,
                  'Accept-Language':'ko,en;q=0.8',
                  'Content-Type':'application/x-www-form-urlencoded',
                  'Referer':'https://kyudb.snu.ac.kr/book/list.do?book_cate=SIC04&mid=GDS',
              })
              with urllib.request.urlopen(req,timeout=35) as r:
                  return r.geturl(), r.read().decode('utf-8','replace')

          def compact(s):
              return re.sub(r'\s+',' ',htmlmod.unescape(s)).strip()

          def save(name,text):
              (root/name).write_text(text,encoding='utf-8')

          # External JS owns fn_originalImg; retain exact current script as route evidence.
          for name,url in [
              ('bookSearch.js','https://kyudb.snu.ac.kr/js/book/bookSearch.js'),
              ('bookView.js','https://kyudb.snu.ac.kr/js/book/bookView.js'),
          ]:
              try:
                  _,txt=request(url)
                  save(name,txt)
              except Exception as e:
                  save(name+'.error.txt',type(e).__name__+': '+str(e))

          holdings=[]
          for key,cn,ko in TITLES:
              data={
                  'prevSearchString':'',
                  'bookCateRebrowsing':'Y',
                  'dbBookCdRebrowsing':'N',
                  'hasImgFilter':'N',
                  'hasTxtFilter':'N',
                  'searchArea':'-1',
                  'viewType':'1',
                  'pageIndex':'1',
                  'recordIndex':'0',
                  'mid':'GDS',
                  'book_cate':'SIC04',
                  'focus':'',
                  'book_cd':'',
                  'target':'',
                  'heje_seq':'0',
                  'toponym':'',
                  'selSortInfo':'sortAlphabetical',
                  'selCallNum':'ALL',
                  'selSearchArea':'okTitle',
                  'totalSearchString':cn,
                  'pageUnit':'100',
              }
              row={'key':key,'title':cn,'korean_title':ko}
              try:
                  final,h=request('https://kyudb.snu.ac.kr/book/list.do',data)
                  save(f'list-{key}.html',h)
                  row['list_final_url']=final
                  # Parse each result list item containing exact title.
                  blocks=[]
                  for m in re.finditer(re.escape(cn),h):
                      start=h.rfind('<li',0,m.start())
                      end=h.find('</li>',m.end())
                      frag=h[start:end+5] if start>=0 and end>=0 else h[max(0,m.start()-3000):m.start()+6000]
                      ids=re.findall(r'(G[A-Z]\d{5}_00)',frag)
                      calls=[compact(x) for x in re.findall(r'청구기호\s*:\s*([^<]+)',frag)]
                      authors=[compact(x) for x in re.findall(r'편저자\s*:\s*([^<]+)',frag)]
                      editions=[compact(x) for x in re.findall(r'판본사항\s*:\s*([^<]+)',frag)]
                      years=[compact(x) for x in re.findall(r'발행년도\s*:\s*([^<]+)',frag)]
                      if ids:
                          blocks.append({
                              'book_cd':ids[-1],
                              'call_number':calls[-1] if calls else None,
                              'author_editor':authors[-1] if authors else None,
                              'edition':editions[-1] if editions else None,
                              'catalog_year':years[-1] if years else None,
                              'fragment':compact(frag)[:12000],
                          })
                  # Dedup book_cd
                  uniq={}
                  for b in blocks: uniq[b['book_cd']]=b
                  row['matches']=list(uniq.values())
                  # Fetch direct detail via the same POST contract for every exact-title match.
                  details=[]
                  for n,b in enumerate(row['matches']):
                      post=dict(data)
                      post.update({'recordIndex':str(n+1),'book_cd':b['book_cd'],'target':'master'})
                      try:
                          f2,d=request('https://kyudb.snu.ac.kr/book/view.do',post)
                          save(f'view-{key}-{b["book_cd"]}.html',d)
                          # Retain contexts around call number, edition, original-image handlers, and any item/image ids.
                          contexts=[]
                          for pat in (cn, b['book_cd'], '원문이미지','fn_originalImg','viewer','imgviewer','item_cd','청구기호','판본사항','발행년도'):
                              for mm in list(re.finditer(re.escape(pat),d,re.I))[:5]:
                                  contexts.append({'pattern':pat,'context':compact(d[max(0,mm.start()-1500):min(len(d),mm.end()+3500)])[:6500]})
                          details.append({'book_cd':b['book_cd'],'final_url':f2,'contexts':contexts})
                      except Exception as e:
                          details.append({'book_cd':b['book_cd'],'error':type(e).__name__+': '+str(e)})
                  row['details']=details
              except Exception as e:
                  row['error']=type(e).__name__+': '+str(e)
              holdings.append(row)

          # Extract image-route function bodies from retained JS.
          funcs=[]
          for p in root.glob('*.js'):
              t=p.read_text(encoding='utf-8',errors='replace')
              for fname in ('fn_originalImg','fn_bookSearchResultView','fn_img','fn_viewer'):
                  for m in list(re.finditer(r'function\s+'+re.escape(fname)+r'\s*\(',t,re.I))[:5]:
                      # simple bounded function context
                      funcs.append({'file':p.name,'function':fname,'context':t[m.start():m.start()+8000]})

          # All likely ids / endpoints from list, view, and JS snapshots.
          corpus='\n'.join(p.read_text(encoding='utf-8',errors='replace') for p in root.iterdir() if p.suffix in ('.html','.js'))
          identifiers=sorted(set(re.findall(r'(?:GK|GR|GC|GG)\d+_\d+(?:_\d+)?|奎貴\s*\d+|DIC_A3_\d{6}',corpus)))
          route_literals=sorted(set(htmlmod.unescape(x) for x in re.findall(r'["\']([^"\']*(?:imgviewer|viewer|original|image|Img|img)[^"\']*)["\']',corpus,re.I) if len(x)<1000))

          report={
              'schema':'KYUDB-DATONG-TONGGUI-ROUTE-PROBE-R2',
              'schema_version':'2.0.0',
              'purpose':'Exact current Kyudb title/call-number/recension and image-route binding for six Joseon Datong Tonggui components. Locator only; no glyph or numeric adjudication.',
              'holdings':holdings,
              'function_contexts':funcs,
              'identifiers':identifiers,
              'route_literals':route_literals[:500],
              'ocr_used_for_final_glyph_claims':False,
              'numeric_claim_authorized':False,
              'recension_identity_caution':'Kyudb catalog fields describe the Korean held objects. They do not by themselves prove identity with a Ming/Nanjing parent recension.',
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
              'holdings':[{'title':r['title'],'matches':[{k:b.get(k) for k in ('book_cd','call_number','author_editor','edition','catalog_year')} for b in r.get('matches',[])]} for r in holdings],
              'function_names':[(x['file'],x['function']) for x in funcs],
              'route_literals':route_literals[:80],
          },ensure_ascii=False,indent=2))
          PY

      - name: Upload route probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyudb-datong-tonggui-route-r2
          path: audit/kyudb-datong-tonggui-route
          if-no-files-found: error
          retention-days: 30
