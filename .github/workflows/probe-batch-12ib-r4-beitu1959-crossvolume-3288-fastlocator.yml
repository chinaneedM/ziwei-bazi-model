name: probe-batch-12ib-r4-beitu1959-crossvolume-3288-fastlocator

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - '.github/workflows/probe-batch-12ib-r4-beitu1959-crossvolume-3288-fastlocator.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  locate:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {vol: 1, ssid: 12335507, sha1: 3ff9c94a69a5b5b799d65fba4a6d00fc2daecc97, url: "https://upload.wikimedia.org/wikipedia/commons/2/28/SSID-12335507_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_1.pdf"}
          - {vol: 2, ssid: 12335508, sha1: 0aa66bca2fa78068712d28361d53dbe8a52d5590, url: "https://upload.wikimedia.org/wikipedia/commons/8/89/SSID-12335508_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_2.pdf"}
          - {vol: 3, ssid: 12335509, sha1: 92f14b7818d4b8d01ca01d1d659fdfaf0a89b4a6, url: "https://upload.wikimedia.org/wikipedia/commons/a/ae/SSID-12335509_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_3.pdf"}
          - {vol: 4, ssid: 12335510, sha1: d400c10df649f2ff2ca85cedcc87c18128531c90, url: "https://upload.wikimedia.org/wikipedia/commons/7/75/SSID-12335510_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_4.pdf"}
          - {vol: 5, ssid: 12335511, sha1: 1e4a7f26eb4d825a73e0cdc746adba71faab3579, url: "https://upload.wikimedia.org/wikipedia/commons/0/0a/SSID-12335511_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_5.pdf"}
          - {vol: 6, ssid: 12335512, sha1: f981a9257737fa3dc136a5eb36b3616c60cdeefc, url: "https://upload.wikimedia.org/wikipedia/commons/a/a4/SSID-12335512_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_6.pdf"}
          - {vol: 7, ssid: 12335513, sha1: 64edc5f16e1a24f610b52306b4f607124cbbe97a, url: "https://upload.wikimedia.org/wikipedia/commons/2/23/SSID-12335513_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_7.pdf"}
          - {vol: 8, ssid: 12335514, sha1: e34d425ab6794e197d0ddf84b13e5a1b57d0912a, url: "https://upload.wikimedia.org/wikipedia/commons/0/08/SSID-12335514_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_8.pdf"}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Fast locator volume ${{ matrix.vol }}
        shell: bash
        env:
          VOL: ${{ matrix.vol }}
          SSID: ${{ matrix.ssid }}
          EXPECTED_SHA1: ${{ matrix.sha1 }}
          URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          ROOT="audit/batch-12ib-r4/v$VOL"
          TMP="$RUNNER_TEMP/ib4-v$VOL"
          rm -rf "$ROOT" "$TMP"
          mkdir -p "$ROOT/candidates" "$TMP/render" "$TMP/crops"

          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra python3-pil > /dev/null

          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 240 \
            -A 'Tianwen-Provenance-Audit/1.0' -o "$TMP/source.pdf" "$URL"

          GOT_SHA1=$(sha1sum "$TMP/source.pdf" | awk '{print $1}')
          [ "$GOT_SHA1" = "$EXPECTED_SHA1" ] || { echo "sha1 mismatch"; exit 1; }
          sha256sum "$TMP/source.pdf" > "$ROOT/source.sha256"
          pdfinfo "$TMP/source.pdf" > "$ROOT/pdfinfo.txt"

          pdftoppm -jpeg -gray -r 95 -jpegopt quality=58 "$TMP/source.pdf" "$TMP/render/page" \
            >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          import os,re,json,subprocess,concurrent.futures
          from PIL import Image,ImageOps,ImageEnhance

          vol=int(os.environ['VOL'])
          root=Path(f'audit/batch-12ib-r4/v{vol}')
          tmp=Path(os.environ['RUNNER_TEMP'])/f'ib4-v{vol}'
          imgs=sorted((tmp/'render').glob('page-*.jpg'))
          target=('三二八八','八八二三','3288')
          controls={
              55:('七二八三','八六四三','10010'),
              56:('三三六八','10010'),
          } if vol==1 else {}

          def pageno(path):
              m=re.search(r'-(\d+)\.jpg$',path.name)
              return int(m.group(1))

          def one(path):
              p=pageno(path)
              im=Image.open(path).convert('L')
              w,h=im.size
              band=im.crop((0,int(h*0.60),w,int(h*0.985)))
              band=band.rotate(270,expand=True,fillcolor=255)
              band=ImageOps.autocontrast(band)
              band=ImageEnhance.Contrast(band).enhance(1.65)
              band=band.resize((int(band.width*1.25),int(band.height*1.25)))
              crop=tmp/'crops'/f'p{p}.jpg'
              band.save(crop,quality=72,optimize=False)
              try:
                  txt=subprocess.check_output([
                      'tesseract',str(crop),'stdout','-l','chi_tra+eng','--psm','11',
                      '-c','tessedit_char_whitelist=三二八0123456789',
                      '-c','preserve_interword_spaces=1'
                  ],stderr=subprocess.DEVNULL,text=True,errors='replace',timeout=18)
              except Exception:
                  txt=''
              crop.unlink(missing_ok=True)
              norm=re.sub(r'\s+','',txt)
              hits=[x for x in target if x in norm]
              ctl=[x for x in controls.get(p,()) if x in norm]
              return {'page':p,'hits':hits,'controls':ctl,'raw_text':txt[:2500]}

          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
              futs=[ex.submit(one,p) for p in imgs]
              for f in concurrent.futures.as_completed(futs):
                  rows.append(f.result())
          rows.sort(key=lambda x:x['page'])

          candidates=[r['page'] for r in rows if r['hits']]
          calibration=[
              {'page':p,'expected':list(controls[p]),
               'recognized':next((r['controls'] for r in rows if r['page']==p),[])}
              for p in sorted(controls)
          ]

          for p in candidates:
              out=root/'candidates'/f'p{p}'
              subprocess.run([
                  'pdftoppm','-f',str(p),'-l',str(p),'-jpeg','-jpegopt','quality=94',
                  '-r','240','-singlefile',str(tmp/'source.pdf'),str(out)
              ],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          positives=[r for r in rows if r['hits'] or r['controls']]
          (root/'locator-positive-ocr.json').write_text(
              json.dumps(positives,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          summary={
              'volume':vol,
              'page_count':len(imgs),
              'source_ssid':os.environ['SSID'],
              'method':'ONE_PASS_95DPI_BOTTOM_BAND_SINGLE_ORIENTATION_TESSERACT_LOCATOR',
              'locator_only':True,
              'ocr_authority':False,
              'negative_absence_inference_authorized':False,
              'candidate_pages':candidates,
              'candidate_count':len(candidates),
              'calibration':calibration,
              'human_review_required_for_every_candidate':True
          }
          (root/'summary.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

          rm -rf "$TMP/render" "$TMP/crops" "$TMP/source.pdf"
          printf '%s\n' \
            "SSID=$SSID" \
            "COMMONS_SHA1=$EXPECTED_SHA1" \
            'OCR_ROLE=locator_only' \
            'OCR_AUTHORITY=false' \
            'HUMAN_REVIEW_REQUIRED=true' \
            'NEGATIVE_ABSENCE_INFERENCE_AUTHORIZED=false' \
            'SCOPE=possible printed 三二八八/3288 locator across the complete 1959 catalog volume only' \
            > "$ROOT/manifest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ib-r4-v${{ matrix.vol }}
          path: audit/batch-12ib-r4/v${{ matrix.vol }}/
          if-no-files-found: error
          retention-days: 30

  finalize:
    if: always()
    needs: locate
    runs-on: ubuntu-latest
    steps:
      - name: Publish aggregate status
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ needs.locate.result }}' === 'success'
            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,
              state: ok ? 'success' : 'failure',
              context:'tianwen/batch-12ib-r4-probe',
              description: ok
                ? '8-volume fast 3288 locator complete; all candidates require human review'
                : 'fast 3288 locator incomplete; no negative inference authorized'
            })
