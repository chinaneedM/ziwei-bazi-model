name: verify-tianwen-13ix-khs-juan81-82-scope
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13IX-*'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - 'scripts/verify-tianwen-13ix-khs-juan81-82-scope.py'
      - 'tests/test_tianwen_13ix_khs_juan81_82_scope.py'
      - '.github/workflows/verify-tianwen-13ix-khs-juan81-82-scope.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  heritage-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13ix-khs-juan81-82-scope.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13ix_khs_juan81_82_scope.py' -v
