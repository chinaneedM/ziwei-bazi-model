name: prediction-contamination-relay

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: fortune-training-issue-relay
  cancel-in-progress: false

jobs:
  quarantine-owner-reported-case:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[PREDICTION CONTAMINATION]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install controller
        run: python -m pip install -e .

      - name: Save issue body without shell evaluation
        run: python -c 'import os, pathlib; pathlib.Path("/tmp/issue-body.md").write_text(os.environ["ISSUE_BODY"], encoding="utf-8")'

      - name: Quarantine current case and verify
        run: >-
          python -m fortune_training.contamination_relay
          --root .
          --issue-body-file /tmp/issue-body.md
          --result-file /tmp/contamination-result.json

      - name: Run full tests
        run: python -m unittest discover -s tests -v

      - name: Commit only quarantine outputs
        run: |
          git config user.name "fortune-training-relay[bot]"
          git config user.email "fortune-training-relay[bot]@users.noreply.github.com"
          git add case-bank/partitions/development.json training/formal-development-group.json training/state.json chat-input/current.json
          git diff --cached --quiet && { echo "No quarantine changes produced"; exit 1; }
          git commit -m "Quarantine contaminated prediction case #${{ github.event.issue.number }}"
          git push origin HEAD:main

      - name: Publish sanitized result and close issue
        run: |
          {
            echo '冻结前污染已隔离；未冻结、未评分、未读取答案。'
            echo
            echo '```json'
            cat /tmp/contamination-result.json
            echo '```'
          } > /tmp/success-comment.md
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/success-comment.md
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Report failure
        if: failure()
        run: >-
          gh issue comment "${{ github.event.issue.number }}"
          --repo "${{ github.repository }}"
          --body "污染隔离失败，仓库未提交状态变更。请检查本次 Actions：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
