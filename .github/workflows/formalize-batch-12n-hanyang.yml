name: formalize-batch-12n-hanyang

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/formalize-batch-12n-hanyang.yml

permissions:
  contents: write

jobs:
  formalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0
          persist-credentials: true

      - name: Formalize Batch 12N from current remote state
        run: python scripts/formalize-batch-12n-hanyang.py

      - name: Validate formalized state
        run: |
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python -m json.tool docs/PROJECT-CURRENT-STATE-R1.json >/dev/null
          python -m json.tool docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json >/dev/null
          python -m json.tool docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json >/dev/null
          python -m json.tool docs/research/ZIWEI-MINGJINGGE-HANYANG-OFFICIAL-PHYSICAL-COPY-PROVENANCE-R1.json >/dev/null

      - name: Commit Batch 12N forward-only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            docs/PROJECT-CURRENT-STATE-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-MINGJINGGE-HANYANG-OFFICIAL-PHYSICAL-COPY-PROVENANCE-N.md \
            docs/research/ZIWEI-MINGJINGGE-HANYANG-OFFICIAL-PHYSICAL-COPY-PROVENANCE-R1.json \
            scripts/verify-project-continuity-state-r1.py
          git diff --cached --check
          git commit -m "close Mingjingge Hanyang provenance batch 12N"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
