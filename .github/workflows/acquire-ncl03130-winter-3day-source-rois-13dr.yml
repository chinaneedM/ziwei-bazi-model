name: acquire-ncl03130-winter-3day-original-rois-13dr
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - "scripts/acquire-ncl03130-winter-3day-source-rois-13dr.py"
      - ".github/workflows/acquire-ncl03130-winter-3day-source-rois-13dr.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-rois:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original image decoder, no OCR
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<1.28" "Pillow>=10,<13" requests
      - name: Capture SHA-verified native D15 D16 D17 original column pixels
        run: python scripts/acquire-ncl03130-winter-3day-source-rois-13dr.py
      - name: Archive source crop files and SHA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncl03130-winter-d15-d17-original-rois-13dr
          path: ncl03130-13dr-day15-17-native-rois/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
