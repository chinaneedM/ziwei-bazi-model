name: research-ziwei-jiwen-1982-1999-dayuan-2012-copy-routes

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-jiwen-1982-1999-dayuan-2012-copy-routes.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public Jiwen and Dayuan copy routes
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          IMG = OUT / "images"
          OUT.mkdir()
          IMG.mkdir()
          UA = "Mozilla/5.0 provenance-research public-copy-route-probe"

          routes = [
              ("jiwen_1999_ncc", "https://www.ncc.com.tw/books/goods.php?id=995"),
              ("jiwen_used_copy_klbook", "https://klbook.com.hk/products/%E5%8D%81%E5%85%AB%E9%A3%9B%E6%98%9F%E7%AD%96%E5%A4%A9%E7%B4%AB%E5%BE%AE%E6%96%97%E6%95%B8%E5%85%A8%E9%9B%86.html"),
              ("dayuan_2012_ncc", "https://www.ncc.com.tw/books/goods.php?id=7346"),
              ("dayuan_2012_xinyi", "https://www.xinyi.hk/goods-5237.html?from=rss"),
              ("ncl_2012_acquisition", "https://nclfile.ncl.edu.tw/nclhistory/public/Data/32410483771.pdf"),
              ("google_books_jiwen_1982", "https://books.google.com/books?id=YOwLlQEACAAJ"),
          ]
          target_terms = [
              "五凶神", "五神", "子有十刻", "上五刻", "下五刻",
              "清同治九年木刻再版", "珍藏", "六卷", "鈔本四三四頁", "434頁",
              "9579789800", "9789579789806", "9789866171680",
          ]

          def fetch(url, limit=12_000_000):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml,application/json,image/avif,image/webp,image/jpeg,image/png,application/pdf,*/*;q=0.8",
                  "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.7",
              })
              try:
                  with urllib.request.urlopen(req, timeout=35) as resp:
                      data = resp.read(limit)
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "bytes": 0, "data": b""}

          result = {
              "schema": "ZIWEI-JIWEN-1982-1999-DAYUAN-2012-COPY-ROUTES-PROBE-R1",
              "access_date": "2026-09-08",
              "hpa_rule_id": "HPA-ZDATE-006",
              "authentication_attempted": False,
              "purchase_attempted": False,
              "paid_content_attempted": False,
              "access_control_bypass_attempted": False,
              "target_terms": target_terms,
              "routes": [],
              "downloaded_source_emitted_images": [],
          }

          emitted = []
          for label, url in routes:
              row = fetch(url)
              data = row.pop("data")
              rec = {"route": label, "url": url, **row}
              if data:
                  ctype = (row.get("content_type") or "").lower()
                  suffix = ".pdf" if "pdf" in ctype else ".html"
                  (OUT / f"{label}{suffix}").write_bytes(data)
                  text = data.decode("utf-8", "replace") if "html" in ctype or "json" in ctype or ctype.startswith("text/") else ""
                  rec["term_presence"] = {term: (term in text) for term in target_terms}
                  rec["term_contexts"] = {}
                  for term in target_terms:
                      i = text.find(term)
                      if i >= 0:
                          rec["term_contexts"][term] = re.sub(r"\s+", " ", text[max(0, i-350):i+700])
                  urls = []
                  if text:
                      for m in re.finditer(r'''(?:src|href)\s*=\s*["']([^"']+)["']''', text, re.I):
                          u = urllib.parse.urljoin(rec.get("final_url") or url, html.unescape(m.group(1)))
                          if u not in urls:
                              urls.append(u)
                      rec["source_emitted_url_count"] = len(urls)
                      rec["source_emitted_image_urls"] = [u for u in urls if re.search(r'\.(?:jpe?g|png|webp|avif)(?:\?|$)', u, re.I)][:120]
                      for u in rec["source_emitted_image_urls"]:
                          emitted.append((label, u))
              result["routes"].append(rec)

          # Fetch only image URLs directly emitted by the reviewed public HTML.
          seen = set()
          for label, url in emitted:
              if url in seen:
                  continue
              seen.add(url)
              row = fetch(url, limit=8_000_000)
              data = row.pop("data")
              rec = {"source_route": label, "url": url, **row}
              ctype = (row.get("content_type") or "").lower()
              if data and row.get("ok") and ("image" in ctype or data[:3] == b"\xff\xd8\xff" or data[:8] == b"\x89PNG\r\n\x1a\n"):
                  ext = ".jpg"
                  if "png" in ctype or data[:8] == b"\x89PNG\r\n\x1a\n": ext = ".png"
                  elif "webp" in ctype: ext = ".webp"
                  elif "avif" in ctype: ext = ".avif"
                  p = IMG / f"img-{len(result['downloaded_source_emitted_images'])+1:03d}{ext}"
                  p.write_bytes(data)
                  rec["saved_file"] = str(p)
                  result["downloaded_source_emitted_images"].append(rec)

          # Google Books public metadata control for the known 1982 record.
          gb = fetch("https://www.googleapis.com/books/v1/volumes/YOwLlQEACAAJ")
          gbdata = gb.pop("data")
          gbc = {"route": "google_books_api_jiwen_1982", **gb}
          if gbdata:
              try:
                  payload = json.loads(gbdata.decode("utf-8"))
                  info = payload.get("volumeInfo", {})
                  gbc["volumeInfo"] = {
                      k: info.get(k) for k in (
                          "title", "subtitle", "authors", "publisher", "publishedDate",
                          "pageCount", "printType", "language", "industryIdentifiers"
                      ) if k in info
                  }
                  access = payload.get("accessInfo", {})
                  gbc["accessInfo"] = {k: access.get(k) for k in ("viewability", "embeddable", "publicDomain", "textToSpeechPermission")}
              except Exception as exc:
                  gbc["json_error"] = repr(exc)
          result["routes"].append(gbc)

          result["adjudication"] = {
              "jiwen_1982_1999_copy_route_role": "COPY_LEVEL_CANDIDATE_ROUTE_PENDING_DIRECT_TARGET_PAGE_AND_COPY_PROVENANCE",
              "dayuan_2012_manuscript_route_role": "MODERN_FACSIMILE_OR_MANUSCRIPT_COPY_TEXT_ROUTE_PENDING_TARGET_PAGE_AND_STEMMATIC_BINDING",
              "public_target_five_xiong_shen_page_observed": False,
              "independent_textual_witness_increment": 0,
              "same_as_snu_physical_copy_proven": False,
              "different_from_snu_physical_copy_proven": False,
              "algorithm_effect": "NONE",
              "next_gate": "DIRECT_VOLUME4_FIVE_XIONG_SHEN_PAGE_FROM_JIWEN_REPRODUCTION_OR_DAYUAN_MANUSCRIPT_WITH_COPY_LEVEL_PROVENANCE",
          }

          (OUT / "ziwei-jiwen-1982-1999-dayuan-2012-copy-routes-probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "routes": [
                  {k:v for k,v in r.items() if k not in ("term_contexts", "source_emitted_image_urls")}
                  for r in result["routes"]
              ],
              "downloaded_source_emitted_image_count": len(result["downloaded_source_emitted_images"]),
              "adjudication": result["adjudication"],
          }, ensure_ascii=False, indent=2))

      - name: Upload copy-route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-jiwen-1982-1999-dayuan-2012-copy-routes
          path: probe/
          if-no-files-found: warn
          retention-days: 14
