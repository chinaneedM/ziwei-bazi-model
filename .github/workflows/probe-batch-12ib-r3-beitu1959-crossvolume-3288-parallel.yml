name: probe-batch-12ib-r3-beitu1959-crossvolume-3288-parallel

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - '.github/workflows/probe-batch-12ib-r3-beitu1959-crossvolume-3288-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  locate:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {vol: 1, ssid: 12335507, sha1: 3ff9c94a69a5b5b799d65fba4a6d00fc2daecc97, url: "https://upload.wikimedia.org/wikipedia/commons/2/28/SSID-12335507_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_1.pdf"}
          - {vol: 2, ssid: 12335508, sha1: 0aa66bca2fa78068712d28361d53dbe8a52d5590, url: "https://upload.wikimedia.org/wikipedia/commons/8/89/SSID-12335508_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_2.pdf"}
          - {vol: 3, ssid: 12335509, sha1: 92f14b7818d4b8d01ca01d1d659fdfaf0a89b4a6, url: "https://upload.wikimedia.org/wikipedia/commons/a/ae/SSID-12335509_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_3.pdf"}
          - {vol: 4, ssid: 12335510, sha1: d400c10df649f2ff2ca85cedcc87c18128531c90, url: "https://upload.wikimedia.org/wikipedia/commons/7/75/SSID-12335510_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_4.pdf"}
          - {vol: 5, ssid: 12335511, sha1: 1e4a7f26eb4d825a73e0cdc746adba71faab3579, url: "https://upload.wikimedia.org/wikipedia/commons/0/0a/SSID-12335511_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_5.pdf"}
          - {vol: 6, ssid: 12335512, sha1: f981a9257737fa3dc136a5eb36b3616c60cdeefc, url: "https://upload.wikimedia.org/wikipedia/commons/a/a4/SSID-12335512_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_6.pdf"}
          - {vol: 7, ssid: 12335513, sha1: 64edc5f16e1a24f610b52306b4f607124cbbe97a, url: "https://upload.wikimedia.org/wikipedia/commons/2/23/SSID-12335513_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_7.pdf"}
          - {vol: 8, ssid: 12335514, sha1: e34d425ab6794e197d0ddf84b13e5a1b57d0912a, url: "https://upload.wikimedia.org/wikipedia/commons/0/08/SSID-12335514_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_8.pdf"}

    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Locate volume ${{ matrix.vol }}
        shell: bash
        env:
          VOL: ${{ matrix.vol }}
          SSID: ${{ matrix.ssid }}
          EXPECTED_SHA1: ${{ matrix.sha1 }}
          URL: ${{ matrix.url }}
        run: |
          set -euo pipefail
          ROOT="audit/batch-12ib-r3/v$VOL"
          mkdir -p "$ROOT/candidates"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra python3-pil > /dev/null
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 240 -A 'Tianwen-Provenance-Audit/1.0' -o "$ROOT/source.pdf" "$URL"
          GOT_SHA1=$(sha1sum "$ROOT/source.pdf" | awk '{print $1}')
          [ "$GOT_SHA1" = "$EXPECTED_SHA1" ] || { echo "sha1 mismatch"; exit 1; }
          sha256sum "$ROOT/source.pdf" > "$ROOT/source.sha256"
          pdfinfo "$ROOT/source.pdf" > "$ROOT/pdfinfo.txt"

          python - <<'PY'
          from pathlib import Path
          import os,re,json,subprocess,tempfile,shutil,concurrent.futures
          from PIL import Image,ImageOps,ImageEnhance

          vol=int(os.environ['VOL'])
          root=Path(f'audit/batch-12ib-r3/v{vol}')
          pdf=root/'source.pdf'
          info=(root/'pdfinfo.txt').read_text(errors='replace')
          n=int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))
          target=('三二八八','八八二三','3288')
          controls={(1,55):('七二八三','八六四三','10010'),(1,56):('三三六八','10010')}
          tmp=Path(tempfile.mkdtemp(prefix=f'ib3-v{vol}-'))

          def one(p):
              base=tmp/f'p{p}'
              png=base.with_suffix('.png')
              subprocess.run(['pdftoppm','-f',str(p),'-l',str(p),'-png','-r','120','-singlefile',str(pdf),str(base)],
                             check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              im=Image.open(png).convert('L')
              w,h=im.size
              band=im.crop((0,int(h*0.60),w,int(h*0.99)))
              texts=[]
              for rot,psm in ((90,6),(270,6),(90,11),(270,11)):
                  rr=ImageOps.autocontrast(band.rotate(rot,expand=True,fillcolor=255))
                  rr=ImageEnhance.Contrast(rr).enhance(1.8)
                  rp=tmp/f'p{p}-r{rot}-m{psm}.png'; rr.save(rp)
                  try:
                      txt=subprocess.check_output(['tesseract',str(rp),'stdout','-l','chi_tra+eng','--psm',str(psm)],
                                                  stderr=subprocess.DEVNULL,text=True,errors='replace',timeout=20)
                  except Exception:
                      txt=''
                  texts.append(txt)
                  rp.unlink(missing_ok=True)
              png.unlink(missing_ok=True)
              joined='\n'.join(texts)
              norm=re.sub(r'\s+','',joined)
              hits=[x for x in target if x in norm]
              expected=controls.get((vol,p),())
              ctl=[x for x in expected if x in norm]
              return p,hits,ctl,joined[:4000]

          rows=[]; candidates=[]; calibration=[]
          try:
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
                  futs=[ex.submit(one,p) for p in range(1,n+1)]
                  for f in concurrent.futures.as_completed(futs):
                      p,hits,ctl,raw=f.result()
                      if hits:
                          candidates.append(p)
                          rows.append({'page':p,'hits':hits,'raw_text':raw})
                      if (vol,p) in controls:
                          calibration.append({'page':p,'expected':list(controls[(vol,p)]),'recognized':ctl,'raw_text':raw})
          finally:
              shutil.rmtree(tmp,ignore_errors=True)

          candidates=sorted(set(candidates))
          rows=sorted(rows,key=lambda x:x['page'])
          calibration=sorted(calibration,key=lambda x:x['page'])
          for p in candidates:
              out=root/'candidates'/f'p{p}'
              subprocess.run(['pdftoppm','-f',str(p),'-l',str(p),'-jpeg','-jpegopt','quality=94','-r','220','-singlefile',str(pdf),str(out)],
                             check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          summary={
              'volume':vol,'pages':n,'locator_only':True,'ocr_authority':False,
              'negative_absence_inference_authorized':False,
              'candidate_pages':candidates,'candidate_count':len(candidates),
              'calibration':calibration
          }
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'candidate-ocr.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

          rm -f "$ROOT/source.pdf"
          printf '%s\n'             "SSID=$SSID"             "COMMONS_SHA1=$EXPECTED_SHA1"             'OCR_ROLE=locator_only'             'HUMAN_REVIEW_REQUIRED=true'             'NEGATIVE_ABSENCE_INFERENCE_AUTHORIZED=false' > "$ROOT/manifest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ib-r3-v${{ matrix.vol }}
          path: audit/batch-12ib-r3/v${{ matrix.vol }}/
          if-no-files-found: error
          retention-days: 30

  finalize:
    if: always()
    needs: locate
    runs-on: ubuntu-latest
    steps:
      - name: Publish aggregate status
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ needs.locate.result }}' === 'success'
            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,
              state: ok ? 'success' : 'failure',
              context:'tianwen/batch-12ib-r3-probe',
              description: ok ? '8-volume parallel 3288 locator complete; human review required' : 'parallel 3288 locator incomplete; no inference'
            })
