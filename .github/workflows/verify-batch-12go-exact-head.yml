name: verify-batch-12go-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12go-exact-head.yml
      - docs/research/ZIWEI-BEITU-HISTORY-1997-1949-1966-BIBLIOGRAPHIC-RANGE-REPAIR-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-BEITU-HISTORY-1997-1949-1966-BIBLIOGRAPHIC-RANGE-REPAIR-GO.md
      - docs/research/ZIWEI-NLC-PP446-449-TIEQIN-CITATION-BRIDGE-AND-TOKYO-HOLDING-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GO exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-BEITU-HISTORY-1997-1949-1966-BIBLIOGRAPHIC-RANGE-REPAIR-GO'
          ep=Path('docs/research/ZIWEI-BEITU-HISTORY-1997-1949-1966-BIBLIOGRAPHIC-RANGE-REPAIR-R1.json')
          assert ep.is_file()
          e=json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          g=e['google_books_bibliographic_control']
          assert g['volume_id']=='BZ0M0gEACAAJ'
          assert g['title']=='北京图书馆馆史资料汇编: 1949-1966, Volume 2'
          assert g['isbn_10']=='7501314195'
          assert g['isbn_13']=='9787501314195'
          assert g['publication_year']==1997
          assert g['page_count']==1811

          n=e['nlc_wenjin_2023_control']
          assert n['provider']=='国家图书馆'
          assert n['canonical_range_observed']=='1949—1966'
          assert n['printed_page']==22
          assert '1949—1966' in n['visible_citation']

          c=e['cai_li_2024_variant_control']
          assert c['reference_number']==23
          assert c['observed_literal_title']=='北京图书馆馆史资料汇编二：1946—1966'
          assert c['observed_pages']=='446—449'
          assert c['classification']=='BIBLIOGRAPHIC_DATE_RANGE_VARIANT_HIGH_CONFIDENCE_TYPO_NOT_CANONICAL_TITLE'
          assert c['pp446_449_citation_bridge_invalidated'] is False

          a=e['conflict_adjudication']
          assert a['canonical_1997_range']=='1949—1966'
          assert a['cai_li_2024_observed_range']=='1946—1966'
          assert a['citation_bridge_to_pp446_449_preserved'] is True
          assert a['direct_pp446_449_collation_still_pending'] is True

          gn=json.loads(Path('docs/research/ZIWEI-NLC-PP446-449-TIEQIN-CITATION-BRIDGE-AND-TOKYO-HOLDING-R1.json').read_text(encoding='utf-8'))
          corr=gn['bibliographic_range_correction_by_batch_12go']
          assert corr['canonical_1997_range']=='1949—1966'
          assert corr['original_cai_li_2024_literal_range']=='1946—1966'
          assert corr['pp446_449_citation_bridge_preserved'] is True

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,201,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc']=='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-BEITU-HISTORY-1997-1949-1966-BIBLIOGRAPHIC-RANGE-REPAIR-GO.md'

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {
            'EXT-GOOGLE-BOOKS-BEITU-HISTORY-1997-1949-1966-ISBN7501314195',
            'EXT-NLC-WENJIN-2023-BEITU-HISTORY-1949-1966-BIBLIOGRAPHIC-CONTROL',
          }.issubset(ids)

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_provenance_metadata_defect_count']==14
          assert e['accounting']['repaired_provenance_metadata_defect_count']==14
          PY
