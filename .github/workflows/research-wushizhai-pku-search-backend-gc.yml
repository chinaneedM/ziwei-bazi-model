name: research-wushizhai-pku-search-backend-gc

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-wushizhai-pku-search-backend-gc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query source-emitted PKU search backend
        run: |
          set -euo pipefail
          mkdir -p artifacts/pku-search-gc
          python - <<'PY'
          from __future__ import annotations
          import http.cookiejar, hashlib, html, json, re, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          OUT=Path("artifacts/pku-search-gc")
          ORIGIN="https://ccj.pku.edu.cn"
          SEARCH_PAGE=ORIGIN+"/Search/search?fd0=0&kw0="+urllib.parse.quote("五石斋文史札记")
          API=ORIGIN+"/Search/SearchArticleByElasticsearch"
          UA="Mozilla/5.0 TianwenResearch/1.0"

          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

          def fetch(req):
              try:
                  with opener.open(req,timeout=30) as r:
                      b=r.read()
                      return r.status,r.geturl(),dict(r.headers),b
              except Exception as e:
                  code=getattr(e,"code",None)
                  body=b""
                  try: body=e.read()
                  except Exception: body=repr(e).encode()
                  return code,getattr(e,"url",req.full_url),{},body

          get_req=urllib.request.Request(SEARCH_PAGE,headers={"User-Agent":UA})
          st,final,headers,page=fetch(get_req)
          (OUT/"search_page.html").write_bytes(page)
          text=page.decode("utf-8","replace")
          m=re.search(r'name="__RequestVerificationToken"[^>]*value="([^"]+)"',text)
          token=html.unescape(m.group(1)) if m else None

          # Exact jQuery.param-style serialization of the source-emitted data object:
          # queryItem[0][Field], queryItem[0][Desc], ...
          pairs=[
              ("key","*"),
              ("size","20"),
              ("page","1"),
              ("sortType","desc"),
              ("sortField","_score"),
              ("queryItem[0][Field]","0"),
              ("queryItem[0][Desc]","All fields"),
              ("queryItem[0][Type]","0"),
              ("queryItem[0][IsAccurate]","false"),
              ("queryItem[0][IsExactValue]","false"),
              ("queryItem[0][Value]","五石斋文史札记"),
          ]
          if token:
              pairs.append(("__RequestVerificationToken",token))
          body=urllib.parse.urlencode(pairs).encode("utf-8")
          api_req=urllib.request.Request(
              API,data=body,method="POST",
              headers={
                  "User-Agent":UA,
                  "Content-Type":"application/x-www-form-urlencoded; charset=UTF-8",
                  "Referer":SEARCH_PAGE,
                  "X-Requested-With":"XMLHttpRequest",
                  "Accept":"application/json, text/javascript, */*; q=0.01",
              }
          )
          ast,afinal,aheaders,abody=fetch(api_req)
          (OUT/"search_response.bin").write_bytes(abody)

          parsed=None
          parse_error=None
          try: parsed=json.loads(abody.decode("utf-8"))
          except Exception as e: parse_error=repr(e)

          def norm(s):
              s=html.unescape(str(s or ""))
              return (s.replace("《","").replace("》","")
                       .replace("（","(").replace("）",")")
                       .replace(" ","").replace("\u3000",""))

          rows=[]
          if isinstance(parsed,dict):
              for key in ("list","data","items","rows"):
                  if isinstance(parsed.get(key),list):
                      rows=parsed[key]; break
              if not rows and isinstance(parsed.get("data"),dict):
                  for key in ("list","items","rows"):
                      if isinstance(parsed["data"].get(key),list):
                          rows=parsed["data"][key]; break

          # Only follow IDs returned by the official endpoint for source-returned
          # Wushizhai installment 28 rows.
          exact=[]
          for row in rows:
              if not isinstance(row,dict): continue
              title=row.get("title") or row.get("Title") or row.get("articleTitle") or ""
              nt=norm(title)
              if "五石斋文史札记" in nt and ("二十八" in nt or "(28)" in nt):
                  exact.append(row)

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs=[]; self.scripts=[]; self.text=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag in ("a","link") and d.get("href"): self.hrefs.append(d["href"])
                  if tag=="script" and d.get("src"): self.scripts.append(d["src"])
              def handle_data(self,data):
                  if data.strip(): self.text.append(data.strip())

          details=[]
          for idx,row in enumerate(exact[:10]):
              rid=row.get("id") or row.get("Id") or row.get("articleId") or row.get("ArticleId")
              if rid is None: continue
              detail_url=ORIGIN+"/article/info?aid="+urllib.parse.quote(str(rid),safe="")
              req=urllib.request.Request(detail_url,headers={"User-Agent":UA,"Referer":SEARCH_PAGE})
              dst,dfinal,dh,db=fetch(req)
              (OUT/f"detail_{idx:02d}.html").write_bytes(db)
              dt=db.decode("utf-8","replace")
              p=P()
              try: p.feed(dt)
              except Exception: pass
              details.append({
                  "source_returned_id":rid,
                  "source_row":row,
                  "requested_url":detail_url,
                  "status":dst,
                  "final_url":dfinal,
                  "sha256":hashlib.sha256(db).hexdigest(),
                  "bytes":len(db),
                  "contains_target_title":"五石斋文史札记" in dt,
                  "contains_121_129":("121-129" in dt or "121–129" in dt),
                  "contains_download":("download" in dt.lower() or "下载" in dt),
                  "hrefs":p.hrefs[:500],
                  "scripts":p.scripts[:100],
                  "text_sample":p.text[:350],
              })

          manifest={
              "policy":{
                  "authentication_used":False,
                  "paywall_bypass_attempted":False,
                  "id_enumeration_or_guessing":False,
                  "only_source_emitted_search_contract_used":True,
                  "detail_ids_followed_only_if_returned_by_official_search_endpoint":True,
              },
              "source_contract":{
                  "search_page":SEARCH_PAGE,
                  "backend":API,
                  "method":"POST",
                  "content_type":"application/x-www-form-urlencoded",
                  "csrf_token_source_emitted":bool(token),
                  "jquery_param_shape":"queryItem[0][Field] etc.",
                  "query_value":"五石斋文史札记",
              },
              "search_page":{"status":st,"final_url":final,"sha256":hashlib.sha256(page).hexdigest(),"bytes":len(page)},
              "backend_response":{"status":ast,"final_url":afinal,"sha256":hashlib.sha256(abody).hexdigest(),"bytes":len(abody),"json_parsed":parsed is not None,"parse_error":parse_error},
              "result_row_count":len(rows),
              "result_rows":rows,
              "installment_28_match_count":len(exact),
              "installment_28_matches":exact,
              "details":details,
          }
          (OUT/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wushizhai-pku-search-backend-gc
          path: artifacts/pku-search-gc
          if-no-files-found: error
