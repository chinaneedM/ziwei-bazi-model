name: tianwen-13qy-jiaoshi-official-original-viewer
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/tianwen-13qy-jiaoshi-official-original-viewer.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  official-original-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --silent puppeteer-core@24.16.0
      - name: Open catalog-issued book and inspect original text/image boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/13qy /tmp/tianwen-13qy
          cat >audit/13qy/probe.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root='/tmp/tianwen-13qy';
          const book='GK00067_00'; // firstparty list row as evidenced by 13QX; NOT inferred from call number
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.BROWSER,args:['--no-sandbox','--disable-setuid-sandbox']});
          const page=await browser.newPage();
          await page.setUserAgent('Mozilla/5.0 Tianwen-Original-Source-Collation/1.0');
          await page.goto('https://kyudb.snu.ac.kr/book/list.do?book_cate=SIC04&mid=GDS',{waitUntil:'networkidle2',timeout:90000});
          const row=await page.evaluate(book=>{
            const t=[...document.querySelectorAll('tr')].find(x=>x.textContent.includes('交食推步法')&&x.querySelector('input[value="'+book+'"]'));
            return t?{record_title:'交食推步法',row_text:t.innerText,source_original_control:t.querySelector('a[onclick*="fn_originalImg"]')?.getAttribute('onclick'),source_text_control:t.querySelector('a[onclick*="fn_bookSearchResultText"]')?.getAttribute('onclick')}:null;
          },book);
          if(!row||!row.source_original_control.includes(book))throw new Error('Provider ID not bound by current firstparty catalog');
          await Promise.all([
            page.waitForNavigation({waitUntil:'networkidle2',timeout:90000}),
            page.evaluate(book=>{
              const f=document.getElementById('frmBookSearchInf');
              if(!f)throw new Error('Official form missing');
              f.querySelector('#book_cd').value=book;
              f.querySelector('#target').value='master';
              f.action='/book/view.do';f.method='post';f.submit();
            },book)
          ]);
          const detail={url:page.url(),title:await page.title(),body:(await page.evaluate(()=>document.body.innerText)).slice(0,8500)};
          const before=new Set(browser.targets().map(t=>t._targetId));
          await page.evaluate(book=>window.fn_originalImg('SIC',book,'',''),book);
          let viewer=null;
          for(let i=0;i<30&&!viewer;i++){
            await new Promise(r=>setTimeout(r,500));
            for(const t of browser.targets()){
              if(t.type()==='page'&&!before.has(t._targetId)&&t.url().includes('/pf01/rendererImg.do')){viewer=await t.page();break;}
            }
          }
          if(!viewer)throw new Error('Official catalog image viewer did not open');
          await viewer.waitForNetworkIdle({idleTime:1000,timeout:15000}).catch(()=>{});
          const viewerInfo=await viewer.evaluate(()=>({
            location:location.href,title:document.title,body:document.body.innerText.slice(0,11000),
            forms:[...document.forms].map(x=>({id:x.id,action:x.action,method:x.method})).slice(0,20),
            inputs:[...document.querySelectorAll('input')].filter(x=>/book|page|vol|item|source|search/i.test(x.name+' '+x.id)).slice(0,32).map(x=>({id:x.id,name:x.name,value:x.value})),
            imageUrls:[...document.querySelectorAll('img')].map(x=>x.src).filter(x=>/GK00067|ImageServlet|renderer/.test(x)).slice(0,18),
            linkedPageUrls:[...document.querySelectorAll('a')].map(x=>({text:x.innerText.slice(0,70),href:x.href,onclick:x.getAttribute('onclick')})).filter(x=>/page|목차|원문|목록|index|text|book|GK00067/i.test(x.text+' '+x.href+' '+x.onclick)).slice(0,35)
          }));
          const textProbe=[];
          const samples=['000a','001a','005a','010a','015a','020a','030a','040a','050a','060a','070a'];
          for(const p of samples){
            let x=null;
            try{x=await viewer.evaluate(async({book,p})=>{
              const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),6000);
              try{
                const r=await fetch('/pf01/pageText.do',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded; charset=UTF-8'},body:new URLSearchParams({item_cd:'SIC',book_cd:book,vol_no:'0001',page_no:p}),signal:ctl.signal});
                const raw=await r.text();let obj={};try{obj=JSON.parse(raw)}catch{};
                const div=document.createElement('div');div.innerHTML=obj?.ORG?.list||'';
                return {status:r.status,length:raw.length,text:(div.innerText||div.textContent||'').replace(/\s+/g,' ').slice(0,1100),jsonKeys:Object.keys(obj).slice(0,10)};
              }finally{clearTimeout(tm);}
            },{book,p});}catch(e){x={error:String(e)}}
            textProbe.push({p,...x});
          }
          const candidates=['000a','001a','010a'];
          const originalPages=[];
          for(const p of candidates){
            const fn=`${book}IH_0001_${p}.jpg`;
            const path=`/data01/stream/SIC/IMG/${book}/${book}_0001/${fn}`;
            const url=`https://kyudb.snu.ac.kr/ImageServlet.do?imgFileNm=${encodeURIComponent(fn)}&path=${encodeURIComponent(path)}`;
            let status=null,error=null,bytes=null;
            const tab=await browser.newPage();
            for(let n=1;n<=2;n++){
              try{let res=await tab.goto(url,{waitUntil:'domcontentloaded',timeout:20000});
                status=res?.status()??null;
                if(res?.ok()){let x=await res.buffer();if(x.length>7000&&x[0]===255&&x[1]===216){bytes=x;break;}}
              }catch(e){error=String(e)}
            }
            await tab.close();
            const rec={page:p,source_url:url,status,error,bytes:bytes?.length||0,sha256:bytes?crypto.createHash('sha256').update(bytes).digest('hex'):null};
            if(bytes)fs.writeFileSync(root+'/'+p+'.jpg',bytes);
            originalPages.push(rec);
            console.log('JIAOSHI_ORIGINAL_PAGE_RECEIPT '+JSON.stringify(rec));
          }
          const receipt={schema:'TIANWEN-13QY-SNU-GK00067-ORIGINAL-BOOK-VIEWER-AND-TEXT-BOUNDARY',provider:'SNU Kyujanggak',catalog_issued_book_cd:book,
            firstparty_catalog_row:row,detail,viewer:viewerInfo,text_layer_sample:textProbe,source_original_image_receipts:originalPages,
            original_盈縮加分_target_glyph_collated:false,
            interpretation_gate:'SOURCE_NATIVE_IMAGE_ONLY; PAGE_TEXT_AND_THUMBNAIL_ARE_LOCATORS_NOT_GLYPH_AUTHORITY'};
          fs.writeFileSync(root+'/receipt.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('JIAOSHI_ORIGINAL_VIEWER_RECEIPT '+JSON.stringify({detail:detail.body.slice(0,2300),viewer:viewerInfo,textProbe,originalPages}).slice(0,18000));
          await browser.close();
          if(!originalPages.some(x=>x.sha256))process.exitCode=4;
          JS
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          BROWSER="$BROWSER" node audit/13qy/probe.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13qy-snu-jiaoshi-firstparty-viewer-samples
          path: /tmp/tianwen-13qy/
          retention-days: 14
          if-no-files-found: warn
