name: acquire-goryeosa-original-target-rois-13br
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-goryeosa-original-target-rois-13br.py
      - docs/research/TIANWEN-13BR-GORYEOSA-WASEDA-D16-NAJ-D18-D19-BOUNDED-SOURCE-ACQUISITION-R1.json
      - .github/workflows/acquire-goryeosa-original-target-rois-13br.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-target-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        source: [waseda, naj]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded image/PDF readers
        run: python -m pip install 'Pillow>=10,<12' 'PyMuPDF>=1.24,<2'
      - name: Validate acquisition rules and forward-only ledger before network
        run: |
          python scripts/verify-goryeosa-original-target-rois-13br.py
          python -m unittest discover -s tests -p 'test_goryeosa_original_target_rois_13br.py' -v
      - name: Fetch exact source and render limited candidate ROIs (no OCR)
        run: python scripts/acquire-goryeosa-original-target-rois-13br.py --source ${{ matrix.source }}
      - name: Preserve receipt and source-original slices even if acquisition is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goryeosa-13br-${{ matrix.source }}-original-candidate-rois
          path: goryeosa-13br-original-${{ matrix.source }}/
          retention-days: 30
          if-no-files-found: warn
