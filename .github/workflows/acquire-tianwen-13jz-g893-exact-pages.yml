name: acquire-tianwen-13jz-g893-exact-pages
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13jz-g893-exact-pages.py
      - .github/workflows/acquire-tianwen-13jz-g893-exact-pages.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/acquire-tianwen-13jz-g893-exact-pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13jz-g893-four-exact-original-pages
          path: /tmp/tianwen-13jz/
          retention-days: 30
          if-no-files-found: error
