name: acquire-najda-goryeosa-13av
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/acquire-najda-goryeosa-13av.py
      - .github/workflows/acquire-najda-goryeosa-13av.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-folio-target-locator:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused offline allowlist and source-ordinal test
        run: python -m unittest discover -s tests -p 'test_najda_goryeosa_13av_sampling.py' -v
      - name: Sample three source-emitted full-JPEG candidate folios
        run: python scripts/acquire-najda-goryeosa-13av.py
      - name: Keep original provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: najda-goryeosa-13av-folio-locator
          path: najda-goryeosa-13av-evidence/
          retention-days: 30
          if-no-files-found: warn
