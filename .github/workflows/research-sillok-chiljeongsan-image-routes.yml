name: research-sillok-chiljeongsan-image-routes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-sillok-chiljeongsan-image-routes.yml"
      - "scripts/research_sillok_chiljeongsan_image_routes.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official Sillok article and image-viewer routes
        run: |
          python scripts/research_sillok_chiljeongsan_image_routes.py \
            --output artifacts/sillok-chiljeongsan-image-routes
      - name: Upload no-OCR route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sillok-chiljeongsan-image-routes-${{ github.sha }}
          path: artifacts/sillok-chiljeongsan-image-routes/
          if-no-files-found: warn
          retention-days: 7
