name: verify-batch-12hh-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hh-exact-head.yml
      - .github/workflows/verify-batch-12hg-exact-head.yml
      - docs/research/ZIWEI-WENWU-CANKAO-1951-V2N9-ZHAO-WANLI-ORIGINAL-ISSUE-PHYSICAL-HOLDINGS-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-WENWU-CANKAO-1951-V2N9-ZHAO-WANLI-ORIGINAL-ISSUE-PHYSICAL-HOLDINGS-HH.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HH exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-WENWU-CANKAO-1951-V2N9-ZHAO-WANLI-ORIGINAL-ISSUE-PHYSICAL-HOLDINGS-HH'
          e=json.loads(Path('docs/research/ZIWEI-WENWU-CANKAO-1951-V2N9-ZHAO-WANLI-ORIGINAL-ISSUE-PHYSICAL-HOLDINGS-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          c=e['cinii_serial_control']
          assert c['ncid']=='AA11467834'
          assert c['target_volume']==2 and c['target_issue']==9
          h=e['exact_issue_physical_holdings']
          assert len(h)==5
          assert all(x['target_issue_9_explicitly_included'] is True for x in h)
          omu=next(x for x in h if x['institution']=='大阪公立大学 杉本図書館')
          assert omu['evidence_level']=='FIRST_PARTY_LIBRARY_OPAC'
          assert '1951(1-7, 9-12)' in omu['holdings_display']
          a=e['access_adjudication']
          assert a['original_1951_v2n9_physical_access_route_closed'] is True
          assert a['original_article_pages_221_233_directly_reviewed'] is False
          assert a['copy_request_sent'] is False
          assert a['interlibrary_loan_request_sent'] is False
          r=e['relation_to_hf_hg']
          assert r['hf_remaining_four_titles']=='UNRESOLVED'
          assert r['hc_hf_six_identity']=='STRONGLY_COMPATIBLE_NOT_PROVED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,220,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc']=='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-WENWU-CANKAO-1951-V2N9-ZHAO-WANLI-ORIGINAL-ISSUE-PHYSICAL-HOLDINGS-HH.md'
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-CINII-WENWU-CANKAO-AA11467834-1951-V2N9-HOLDINGS']['batch_12hh']['target_issue']==9
          assert src['EXT-OMU-WENWU-CANKAO-1951-V2N9-SUGIMOTO']['batch_12hh']['target_issue_9_explicitly_included'] is True
          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          PY
