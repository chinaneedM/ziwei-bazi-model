name: research-kyujanggak-g893-cross-platform

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-kyujanggak-g893-cross-platform.yml

permissions:
  contents: read

jobs:
  probe:
    name: Probe G893 from ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi pillow
      - name: Probe Kyujanggak G893 read-only viewer
        continue-on-error: true
        run: >-
          python scripts/research_kyujanggak_g893_probe.py
          --output "artifacts/g893-probe-${{ runner.os }}"
          --stride 8
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-g893-cross-platform-${{ runner.os }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
