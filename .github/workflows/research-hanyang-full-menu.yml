name: research-hanyang-full-menu

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-hanyang-full-menu.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Open only the public 전체메뉴 control and capture rendered navigation
        shell: python
        run: |
          import json
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          OUT=Path("probe"); OUT.mkdir()
          URL="https://lib.hanyang.ac.kr/"
          opts=Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1800,2600")
          opts.add_argument("--lang=ko-KR")

          result={
            "schema":"ZIWEI-HANYANG-FULL-PUBLIC-MENU-R1",
            "source_url":URL,
            "target_biblio_id":484926,
            "authentication_attempted":False,
            "form_submission_attempted":False,
            "route_guessing_attempted":False,
          }
          driver=webdriver.Chrome(options=opts)
          try:
            driver.set_page_load_timeout(90)
            driver.get(URL); time.sleep(8)
            buttons=driver.find_elements(By.CSS_SELECTOR,'button[title="전체메뉴"]')
            visible=[b for b in buttons if b.is_displayed()]
            result["visible_full_menu_button_count"]=len(visible)
            if visible:
              visible[0].click(); time.sleep(4)
            links=[]
            for a in driver.find_elements(By.CSS_SELECTOR,"a"):
              try:
                if not a.is_displayed(): continue
                txt=" ".join((a.text or "").split())
                href=a.get_attribute("href") or ""
                if txt:
                  links.append({"text":txt[:500],"href":href})
              except Exception:
                pass
            seen=set(); dedup=[]
            for x in links:
              k=(x["text"],x["href"])
              if k not in seen:
                seen.add(k); dedup.append(x)
            result["visible_links_after_full_menu_open"]=dedup[:1500]
            result["body_text"]=driver.find_element(By.TAG_NAME,"body").text[:100000]
            result["final_url"]=driver.current_url
            driver.save_screenshot(str(OUT/"full-menu.png"))
            (OUT/"full-menu.html").write_text(driver.page_source,encoding="utf-8")
          finally:
            driver.quit()
          result["adjudication"]={
            "target_page_status":"PENDING_DIRECT_PAGE",
            "algorithm_effect":"NONE",
            "followup":"ONLY_EXPLICIT_RENDERED_MENU_ROUTES"
          }
          (OUT/"hanyang-full-menu.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
            "visible_full_menu_button_count":result.get("visible_full_menu_button_count"),
            "visible_links_after_full_menu_open":result.get("visible_links_after_full_menu_open"),
            "adjudication":result["adjudication"],
          },ensure_ascii=False,indent=2))

      - name: Upload full-menu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-hanyang-full-menu
          path: probe/
          if-no-files-found: warn
          retention-days: 14
