name: verify-batch-12hl-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hk-exact-head.yml
      - .github/workflows/verify-batch-12hl-exact-head.yml
      - docs/research/ZIWEI-NLC-ZUOZHUAN-412004000069-NPM-SPLIT-SONG-COPY-PHYSICAL-DISTINCTNESS-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-412004000069-NPM-SPLIT-SONG-COPY-PHYSICAL-DISTINCTNESS-HL.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HL exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-NLC-ZUOZHUAN-412004000069-NPM-SPLIT-SONG-COPY-PHYSICAL-DISTINCTNESS-HL'
          e=json.loads(Path('docs/research/ZIWEI-NLC-ZUOZHUAN-412004000069-NPM-SPLIT-SONG-COPY-PHYSICAL-DISTINCTNESS-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          assert e['nlc_fid_control']['nlc_fid']=='412004000069'
          assert e['nlc_fid_control']['public_backup_book_count_display']==15
          assert e['nlc_fid_control']['observed_last_book']==['卷第二十八','卷第二十九']
          n=e['npm_official_split_copy_control']
          assert n['unified_id']=='故善001224-001238'
          assert n['explicit_split_statement']=='今由本院與中國國圖各存其半'
          assert n['split_between_npm_and_nlc'] is True
          m=e['npm_institutional_metadata_control']
          assert m['npm_missing_range_normalized']=='卷一－二十九'
          assert m['npm_total_books']==15
          i=e['cross_object_adjudication']
          assert i['physical_distinctness_from_zhang_tieqin_yuan_copy']=='RESOLVED_DISTINCT'
          assert i['fid_412004000069_equals_zhang_tieqin_yuan_copy']=='RESOLVED_FALSE'
          assert i['same_physical_object_collapse_authorized'] is False
          assert e['relation_to_hj']['hj_named_song_member_equals_fid_412004000069']=='UNRESOLVED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,224,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc']=='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-412004000069-NPM-SPLIT-SONG-COPY-PHYSICAL-DISTINCTNESS-HL.md'
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-NPM-TWOHUNDRED-ZUOZHUAN-SONG-LIU-SPLIT-HALF']['batch_12hl']['npm_nlc_each_hold_half'] is True
          assert src['EXT-NPM-DIGITALARCHIVES-ZUOZHUAN-GUSHAN001224-001238']['batch_12hl']['total_books']==15
          assert src['EXT-NLC-DIGITAL-ZUOZHUAN-412004000069-COMMONS-BACKUP']['batch_12hl']['physical_distinctness_from_tieqin_yuan_copy']=='RESOLVED_DISTINCT'
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_chart_algorithm_defect_count']==0
          PY
