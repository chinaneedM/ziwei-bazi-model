name: probe-tianwen-13hp-ndl991069-canvas73-provider-full
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/probe-tianwen-13hp-ndl991069-canvas73-full.py
      - tests/test_tianwen_13hp_ndl991069_canvas73_full.py
      - .github/workflows/probe-tianwen-13hp-ndl991069-canvas73-provider-full.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ndl-one-source-page:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image validation dependency
        run: python -m pip install Pillow
      - name: Assert source-scoped acquisition guards
        run: python -m unittest discover -s tests -p 'test_tianwen_13hp_ndl991069_canvas73_full.py' -v
      - name: Acquire one NDL source page and record any access boundary
        run: python scripts/probe-tianwen-13hp-ndl991069-canvas73-full.py
      - name: Preserve hash-bound source JPEG and cropped evidence or bounded failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13hp-ndl991069-canvas73-provider-full
          path: artifacts/13hp-ndl991069-canvas73-provider-full/**
          if-no-files-found: error
