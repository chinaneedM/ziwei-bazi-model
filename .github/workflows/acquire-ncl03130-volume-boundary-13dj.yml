name: acquire-ncl03130-09-volume-boundary-13dj
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - "scripts/acquire-ncl03130-volume-boundary-13dj.py"
      - ".github/workflows/acquire-ncl03130-volume-boundary-13dj.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-render support, no OCR
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<1.28" "Pillow>=10,<12" requests
      - name: Acquire SHA-fenced NCL mirror part09 p013–044 native
        run: python scripts/acquire-ncl03130-volume-boundary-13dj.py
      - name: Preserve source-page images or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncl03130-13dj-part09-p110-141-native
          path: ncl03130-13dj-volume6-probe/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
