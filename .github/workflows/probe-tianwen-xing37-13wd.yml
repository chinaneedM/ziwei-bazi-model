name: tianwen-13wd-xing-juan37-original-source-probe
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths: [.github/workflows/probe-tianwen-xing37-13wd.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve public original NLC volume 12 and render source-bounded atlas
        run: |
          python -m pip install -q pymupdf pillow
          python - <<'PY'
          import urllib.request, urllib.parse, hashlib, io, base64, json, math
          import fitz
          from PIL import Image, ImageOps, ImageDraw
          fn="NLC892-CBM1408-371931_古今律曆考_七十二卷_第12冊.pdf"
          url="https://upload.wikimedia.org/wikipedia/commons/3/31/"+urllib.parse.quote(fn)
          req=urllib.request.Request(url,headers={"User-Agent":"Tianwen-Source-Provenance-Audit/1.0 (public scholarly verification)"})
          try:
              with urllib.request.urlopen(req,timeout=100) as response:
                  src=response.read()
          except Exception as e:
              print("SOURCE_ACCESS_FAILURE",repr(e))
              raise
          sha1=hashlib.sha1(src).hexdigest()
          sha256=hashlib.sha256(src).hexdigest()
          assert sha1=="7588241dc26f32c93765bfa9717e689b14525460",("sha1 mismatch",sha1)
          assert len(src)==21651216,("source bytes mismatch",len(src))
          doc=fitz.open(stream=src,filetype="pdf")
          assert len(doc)==86,("page count mismatch",len(doc))
          print("SOURCE_VERIFIED",json.dumps({"source_url":url,"original_sha1":sha1,"original_sha256":sha256,"bytes":len(src),"pages":len(doc),"scope":"Original PDF bytes and contact sheets only; no OCR/no numeric adjudication"},ensure_ascii=False))
          for p in [25,34,59,64,65,69,73,77,79,81,83,84,85,86]:
              pix=doc[p-1].get_pixmap(matrix=fitz.Matrix(2.6,2.6),alpha=False)
              im=Image.frombytes("RGB",[pix.width,pix.height],pix.samples)
              out=io.BytesIO()
              im.save(out,format="JPEG",quality=74,optimize=True)
              data=out.getvalue()
              print("TARGET_BEGIN",json.dumps({"pdf_page":p,"jpeg_sha256":hashlib.sha256(data).hexdigest(),"pixel_shape":[im.width,im.height],"bytes":len(data)}))
              b=base64.b64encode(data).decode()
              for ix in range(0,len(b),3000):
                  print(f"TARGET_PART_{p}|{ix//3000:04d}|{b[ix:ix+3000]}")
              print("TARGET_END",p)
          PY
