name: probe-tianwen-13je-snu-source-emitted-viewer-post
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'scripts/probe-tianwen-13je-snu-source-emitted-viewer-post.py'
      - 'tests/test_tianwen_13je_snu_viewer_post.py'
      - '.github/workflows/probe-tianwen-13je-snu-source-emitted-viewer-post.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  firstparty-viewer-post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -p 'test_tianwen_13je_snu_viewer_post.py' -v
      - run: python scripts/probe-tianwen-13je-snu-source-emitted-viewer-post.py
        env: {TIANWEN_13JE_OUT: /tmp/tianwen-13je}
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13je-snu-source-emitted-viewer-post
          path: /tmp/tianwen-13je/
          if-no-files-found: error
