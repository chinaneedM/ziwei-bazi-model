name: research-ziwei-jielan-pt49-new-books-accessible-ar-r5

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-jielan-pt49-new-books-accessible-ar-r5.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Follow AR1 source-emitted English accessible and new-books PT49 routes
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          out=Path("batch12ar-r5"); out.mkdir(exist_ok=True)
          vid="rZRcCwAAQBAJ"

          # Both URLs were literally emitted by the AR1 public PT49 HTML and are bound
          # by run 34351724023 / artifact 10104042912.
          routes={
              "accessible_en":"https://books.google.com/books?id=rZRcCwAAQBAJ&pg=PT49&hl=en&output=html_text",
              "new_books_en":"https://www.google.com/books/edition/%E7%B4%AB%E5%BE%AE%E6%96%97%E6%95%B8%E6%8D%B7%E8%A6%BD_%E6%98%8E%E5%88%8A%E5%AD%A4%E6%9C%AC_%E5%8E%9F_%E5%BD%A9/rZRcCwAAQBAJ?hl=en&newbks=1&gbpv=1&pg=PT49&printsec=frontcover"
          }

          def get(url,name,timeout=40):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"en-US,en;q=0.9"})
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      data=r.read(); status=r.status; final=r.geturl(); ctype=r.headers.get("Content-Type")
              except Exception as e:
                  return {"url":url,"error":repr(e)}
              (out/name).write_bytes(data)
              return {"url":url,"final_url":final,"http_status":status,"content_type":ctype,
                      "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}

          def normalize(x):
              return (html.unescape(x)
                      .replace("\\u003d","=")
                      .replace("\\u0026","&")
                      .replace("\u003d","=")
                      .replace("\u0026","&")
                      .replace("\/","/"))

          def emitted_urls(text,base):
              vals=[]
              pats=[
                  r'(?:href|src|data-src|data-url)\s*=\s*["\']([^"\']+)["\']',
                  r'https?://[^"\'<> ]+'
              ]
              for pat in pats:
                  for x in re.findall(pat,text,re.I):
                      if isinstance(x,tuple): x=x[0]
                      x=normalize(x)
                      if x.startswith("//"): x="https:"+x
                      elif x.startswith("/"): x=urllib.parse.urljoin(base,x)
                      if x.startswith(("http://","https://")) and x not in vals:
                          vals.append(x)
              return vals

          receipt={
              "scope":"AR1_LITERAL_SOURCE_EMITTED_PT49_ENGLISH_ROUTES_ONLY",
              "controlling_source_emission":{"workflow_run_id":34351724023,"artifact_id":10104042912},
              "authentication_attempted":False,
              "drm_bypass_attempted":False,
              "hidden_endpoint_guessing_attempted":False,
              "signature_constructed_forged_or_reused":False,
              "routes":{},
              "pt49_candidate_objects":[]
          }

          for label,url in routes.items():
              rec=get(url,label+".html")
              p=out/(label+".html")
              body=p.read_text("utf-8",errors="ignore") if p.exists() else ""
              eus=emitted_urls(body,url)
              contexts=[]
              for term in ["PT49","陰雨","天陰雨下時難定","論十二生時難定訣","publisher/content","pageImage","page_image"]:
                  for m in list(re.finditer(re.escape(term),body,re.I))[:12]:
                      contexts.append({"term":term,"context":re.sub(r"\s+"," ",body[max(0,m.start()-400):m.end()+1000])[:1800]})
              item={
                  "source_emitted_url":url,
                  "request":rec,
                  "page_tokens":sorted(set(re.findall(r'\bPT\d+\b',body)))[:600],
                  "contexts":contexts,
                  "emitted_url_count":len(eus)
              }
              for u in eus:
                  low=u.lower()
                  q=urllib.parse.parse_qs(urllib.parse.urlparse(u).query)
                  pg=(q.get("pg") or q.get("page") or [None])[0]
                  if pg!="PT49":
                      continue
                  if not (
                      "publisher/content" in low or
                      "googleusercontent.com" in low or
                      low.endswith((".jpg",".jpeg",".png",".webp",".pdf"))
                  ):
                      continue
                  if u not in [x["url"] for x in receipt["pt49_candidate_objects"]]:
                      receipt["pt49_candidate_objects"].append({"url":u,"emitted_by_route":label,"page_id":"PT49"})
              receipt["routes"][label]=item

          downloaded=[]
          for i,obj in enumerate(receipt["pt49_candidate_objects"][:20]):
              downloaded.append({**obj,"request":get(obj["url"],f"pt49-object-{i}.bin")})
          receipt["downloaded_pt49_objects"]=downloaded
          receipt["adjudication"]={
              "accessible_en_http_200":(receipt["routes"]["accessible_en"]["request"] or {}).get("http_status")==200,
              "new_books_en_http_200":(receipt["routes"]["new_books_en"]["request"] or {}).get("http_status")==200,
              "pt49_candidate_object_source_emitted":bool(receipt["pt49_candidate_objects"]),
              "pt49_real_image_obtained":any(
                  x.get("request",{}).get("http_status")==200 and
                  str(x.get("request",{}).get("content_type","")).startswith("image/") and
                  x.get("request",{}).get("sha256")!="3efa8c43e5b4348f303a528c81adf435f0111ea752fe9f0f6241478b60987fa6"
                  for x in downloaded
              ),
              "placeholder_sha256_known_from_r4":"3efa8c43e5b4348f303a528c81adf435f0111ea752fe9f0f6241478b60987fa6",
              "physical_glyph_authority_claimed_before_manual_review":False
          }
          (out/"receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n","utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-jielan-pt49-new-books-accessible-ar-r5
          path: batch12ar-r5
          retention-days: 90
