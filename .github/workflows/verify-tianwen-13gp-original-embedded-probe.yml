name: verify-tianwen-13gp-original-embedded-probe
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/verify-tianwen-13gp-original-embedded-probe.yml
      - scripts/acquire-tianwen-13gp-original-embedded-probe.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-embedded-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated source inspection dependencies
        run: python -m pip install 'PyMuPDF>=1.24,<1.28' 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Verify historical original-source digest and acquire expanded native ROIs
        env:
          TIANWEN_LOG_IMAGE_BASE64: "1"
        run: python scripts/acquire-tianwen-13gp-original-embedded-probe.py
      - name: Archive original native image source-crop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13gp-original-embedded-probe
          path: ncl-13gp-source-probe/
          if-no-files-found: warn
          retention-days: 30
