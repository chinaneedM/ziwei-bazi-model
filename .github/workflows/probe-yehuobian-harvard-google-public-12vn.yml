name: probe-yehuobian-harvard-google-public-12vn
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths: [.github/workflows/probe-yehuobian-harvard-google-public-12vn.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Exact public search and source-issued Google book metadata
        shell: bash
        run: |
          mkdir -p public-12vn
          python - <<'PY'
          import json, pathlib, urllib.request, hashlib
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and a.get('href'):self.links.append(a['href'])
          routes={
            'harvard_search':'https://curiosity.lib.harvard.edu/chinese-rare-books/catalog?search_field=all_fields&q=%E9%87%8E%E7%8D%B2%E7%B7%A8',
            'google_catalog':'https://books.google.com/books?id=amSwWglNYgcC',
            'google_api':'https://www.googleapis.com/books/v1/volumes/amSwWglNYgcC',
          }
          out={'scope':'PUBLIC_READ_ONLY_SEARCH_AND_METADATA; NO_LOGIN; NO_GLYPH_ATTESTATION','requests':[]}
          for key,url in routes.items():
              x={'route':key,'url':url,'status':None,'target_image_obtained':False}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Tianwen historical source research (public read-only)'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read(2000001);x.update(status=r.status,final_url=r.url,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),complete=len(raw)<=2000000)
                      pathlib.Path('public-12vn/'+key+'.response').write_bytes(raw)
                      if key=='google_api':x['metadata']=json.loads(raw)
                      else:
                          p=Links();p.feed(raw.decode('utf-8','replace'));x['source_emitted_links']=p.links
                          text=raw.decode('utf-8','replace');x['title_contexts']=[text[max(0,i-100):i+500] for i in [text.find('野獲編'),text.find('amSwWglNYgcC'),text.find('Ye huo') ] if i>=0]
              except Exception as e:x['error']=type(e).__name__+': '+str(e)[:200]
              out['requests'].append(x)
              print(json.dumps(x,ensure_ascii=False))
          pathlib.Path('public-12vn/summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yehuobian-harvard-google-public-metadata-12vn
          path: public-12vn
          retention-days: 30
