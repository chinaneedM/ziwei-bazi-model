name: research-yehuobian-cadal-12qe-bounded
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - docs/research/MING-DATONG-YEHUOBIAN-12QE-CADAL-IMAGE-PROBE-TRIGGER-R1.json
permissions:
  contents: read
jobs:
  bounded-image-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install Pillow
      - name: Verify and rasterize bounded public DJVU without OCR
        run: python scripts/probe-yehuobian-cadal-12qe.py
      - name: Preserve machine receipt and page atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yehuobian-cadal02096919-12qe
          path: artifacts/yehuobian-cadal-12qe/
          if-no-files-found: warn
          retention-days: 7
