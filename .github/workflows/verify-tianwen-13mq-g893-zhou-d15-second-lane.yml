name: verify-tianwen-13mq-g893-zhou-d15-second-lane
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/research/TIANWEN-13MQ-G893-ZHOU1569-D15-SECOND-LANE-ORIGINAL-PRINT-SCOPE-R1.json
      - docs/research/TIANWEN-13MQ-G893-ZHOU1569-D15-SECOND-LANE-ORIGINAL-PRINT-SCOPE-R1.md
      - scripts/verify-tianwen-13mq-g893-zhou-d15-second-lane.py
      - tests/test_tianwen_13mq_g893_zhou_d15_second_lane.py
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - .github/workflows/verify-tianwen-13mq-g893-zhou-d15-second-lane.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13mq-g893-zhou-d15-second-lane.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13mq_g893_zhou_d15_second_lane.py' -v
      - run: python scripts/verify-tianwen-13mp-g893-archive-pixel-replay.py
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
