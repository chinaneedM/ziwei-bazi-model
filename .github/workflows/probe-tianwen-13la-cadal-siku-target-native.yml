name: probe-tianwen-13la-cadal-siku-target-native
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-tianwen-13la-cadal-siku-target-native.py
      - .github/workflows/probe-tianwen-13la-cadal-siku-target-native.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-native-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq djvulibre-bin
      - run: python -m pip install pillow
      - run: python scripts/probe-tianwen-13la-cadal-siku-target-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13la-cadal06056956-native-targets
          path: 13la-target-native-output/
          retention-days: 7
