name: verify-tianwen-13fk-ncl-fourfen-p74-crossphoto
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - docs/research/TIANWEN-13FK-NCL-P74-D7D8D10-CROSS-PHOTO-FOURFEN-BOUNDED-COLLATION-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - scripts/verify-tianwen-13fk-ncl-fourfen-p74-crossphoto.py
      - tests/test_verify_tianwen_13fk_ncl_fourfen_p74_crossphoto.py
      - .github/workflows/verify-tianwen-13fk-ncl-fourfen-p74-crossphoto.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo-bounded-truth-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bounded native-photo bytes and negative original-witness tests
        run: |
          python -m py_compile scripts/verify-tianwen-13fk-ncl-fourfen-p74-crossphoto.py tests/test_verify_tianwen_13fk_ncl_fourfen_p74_crossphoto.py
          python scripts/verify-tianwen-13fk-ncl-fourfen-p74-crossphoto.py
          python -m unittest discover -s tests -p 'test_verify_tianwen_13fk_ncl_fourfen_p74_crossphoto.py' -v
