name: research-kyujanggak-g893-detail-metadata

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-g893-detail-metadata.yml"
      - "scripts/research_kyujanggak_g893_detail_metadata.py"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Capture direct G893 detail metadata
        run: |
          python scripts/research_kyujanggak_g893_detail_metadata.py \
            --output artifacts/g893-detail-metadata
      - name: Upload detail metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g893-detail-metadata-${{ github.sha }}
          path: artifacts/g893-detail-metadata/
          if-no-files-found: warn
          retention-days: 7
