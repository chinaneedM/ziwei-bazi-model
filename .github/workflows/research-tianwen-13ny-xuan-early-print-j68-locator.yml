name: research-tianwen-13ny-xuan-early-print-j68-locator
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths: [.github/workflows/research-tianwen-13ny-xuan-early-print-j68-locator.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF renderer
        run: python -m pip install 'pymupdf>=1.24,<2' 'pillow>=10,<13'
      - name: Locate exact Xu An early printing j68 originals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, urllib.parse, urllib.request
          import fitz
          from PIL import Image, ImageDraw
          output=pathlib.Path('docs/research/evidence/13ny')
          output.mkdir(parents=True,exist_ok=True)
          # Reuse the already acquired immutable PDF page atlas; split its existing evidence into readable bounded rows.
          if (output/'vol26-page-atlas.json').exists() and not (output/'vol26-row-01-03.jpg.b64.txt').exists():
              for part in range(1,5):
                  source=output/f'vol26-atlas-{part}.jpg.b64.txt'
                  payload=source.read_text(encoding='ascii').strip().removesuffix(chr(92)+'n')
                  sheet=Image.open(io.BytesIO(base64.b64decode(payload))).convert('RGB')
                  for row in range(3):
                      first=(part-1)*9+row*3+1
                      cropped=sheet.crop((0,row*590,1860,(row+1)*590))
                      o=io.BytesIO()
                      cropped.save(o,format='JPEG',quality=83)
                      fn=output/f'vol26-row-{first:02d}-{first+2:02d}.jpg.b64.txt'
                      fn.write_text(base64.b64encode(o.getvalue()).decode('ascii')+chr(10),encoding='ascii')
              manifest=output/'vol26-page-atlas.json'
              current=manifest.read_text(encoding='utf-8').removesuffix(chr(92)+'n')
              json.loads(current)
              manifest.write_text(current.rstrip()+chr(10),encoding='utf-8')
              print('Reused 1599 PDF atlas; saved 12 GitHub-readable rows and repaired trailing literal newline, no new source fetch')
              raise SystemExit(0)

          ua={'User-Agent':'TianwenHistoricalCollation/1.0 (https://github.com/chinaneedM/ziwei-bazi-model; historical original comparison)'}
          names={26:'NLC892-411999015732-116313 古今律曆考 第26冊.pdf',
                 27:'NLC892-411999015732-116314 古今律曆考 第27冊.pdf',
                 28:'NLC892-411999015732-116359 古今律曆考 第28冊.pdf'}
          params=urllib.parse.urlencode({'action':'query','format':'json','prop':'imageinfo','iiprop':'url|size|sha1','titles':'|'.join('File:'+n for n in names.values())})
          req=urllib.request.Request('https://commons.wikimedia.org/w/api.php?'+params,headers=ua)
          with urllib.request.urlopen(req,timeout=75) as resp: catalog=json.load(resp)
          by_title={x['title'].removeprefix('File:'):x for x in catalog.get('query',{}).get('pages',{}).values()}
          entries=[]
          for volume,title in names.items():
              src=by_title.get(title,{})
              item={'volume':volume,'commons_file_title':title,'exists':'missing' not in src and bool(src.get('imageinfo'))}
              if not item['exists']:
                  entries.append(item);continue
              info=src['imageinfo'][0]
              item.update({'original_pdf_url':info['url'],'commons_sha1':info.get('sha1'),'declared_bytes':info['size']})
              request=urllib.request.Request(info['url'],headers=ua)
              with urllib.request.urlopen(request,timeout=160) as response: pdf=response.read(85_000_000)
              assert pdf.startswith(b'%PDF-') and len(pdf)==info['size'],(volume,len(pdf),info['size'])
              doc=fitz.open(stream=pdf,filetype='pdf')
              item['original_pdf_sha256']=hashlib.sha256(pdf).hexdigest()
              item['pages']=doc.page_count
              indices=sorted(set([0,1,doc.page_count//4,doc.page_count//2,(doc.page_count*3)//4,doc.page_count-2,doc.page_count-1]))
              item['sample_pages_1based']=[x+1 for x in indices]
              sheet=Image.new('RGB',(4*380,2*350),(240,240,240))
              draw=ImageDraw.Draw(sheet)
              samples=[]
              for j,i in enumerate(indices):
                  pg=doc[i]
                  scale=min(1.2,950/pg.rect.width)
                  raw=pg.get_pixmap(matrix=fitz.Matrix(scale,scale),alpha=False).tobytes('jpg',jpg_quality=84)
                  im=Image.open(io.BytesIO(raw)).convert('RGB')
                  im.thumbnail((370,320))
                  x=(j%4)*380; y=(j//4)*350
                  sheet.paste(im,(x,y+23))
                  draw.text((x+4,y+3),f'volume {volume}, PDF p{i+1}',fill=(0,0,0))
                  samples.append({'page':i+1,'source_page_preview_sha256':hashlib.sha256(raw).hexdigest()})
              buf=io.BytesIO()
              sheet.save(buf,format='JPEG',quality=86)
              out=output/f'locator-vol{volume}.jpg.b64.txt'
              out.write_text(base64.b64encode(buf.getvalue()).decode('ascii')+'\n',encoding='ascii')
              item['contact_sha256']=hashlib.sha256(buf.getvalue()).hexdigest()
              item['sampled_images']=samples
              # Follow-on bounded full-chapter page atlas for 1599 printed juan 68, without altering initial PDF evidence.
              if volume==26:
                  atlas=[]
                  for start in range(0,doc.page_count,9):
                      sh=Image.new('RGB',(3*620,3*590),(245,245,245))
                      d=ImageDraw.Draw(sh)
                      for j,k in enumerate(range(start,min(start+9,doc.page_count))):
                          page=doc[k]
                          factor=min(1.5,570/page.rect.width)
                          pix=page.get_pixmap(matrix=fitz.Matrix(factor,factor),alpha=False)
                          raw=pix.tobytes('jpg',jpg_quality=84)
                          im=Image.open(io.BytesIO(raw)).convert('RGB')
                          im.thumbnail((600,550))
                          x=j%3*620;y=j//3*590
                          sh.paste(im,(x,y+22))
                          d.text((x+5,y+3),f'1599 j68 PDF p{k+1}',fill=(0,0,0))
                      outbuf=io.BytesIO()
                      sh.save(outbuf,format='JPEG',quality=85)
                      filename=f'vol26-atlas-{start//9+1}.jpg.b64.txt'
                      (output/filename).write_text(base64.b64encode(outbuf.getvalue()).decode('ascii')+'\\n',encoding='ascii')
                      atlas.append({'name':filename,'start_pdf_page':start+1,'end_pdf_page':min(start+9,doc.page_count),'sheet_sha256':hashlib.sha256(outbuf.getvalue()).hexdigest()})
                  (output/'vol26-page-atlas.json').write_text(json.dumps({'schema':'TIANWEN-13NY-NLC1599-V26-ALL-PAGE-ATLAS-R1','original_source_pdf_sha256':item['original_pdf_sha256'],'original_pdf_pages':doc.page_count,'grade':'ALL_SOURCE_PAGES_RASTER_CONTACT_SCREEN_NOT_FULL_NATIVE_LINEWISE_COLLATION','ocr_used':False,'sheets':atlas,'source_absence_proven':False},ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
              item['original_pdf_archived_in_git']=False
              entries.append(item)
          # Source-API filename-prefix census, NOT a proof the historical physical holding is inaccessible.
          req=urllib.request.Request('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode({'action':'query','format':'json','list':'allimages','aiprefix':'NCL-06270','ailimit':50}),headers=ua)
          try:
              with urllib.request.urlopen(req,timeout=55) as response: listing=json.load(response)
              exact_prefix_census={'status':'API_SUCCESS','matches':[v.get('name') for v in listing.get('query',{}).get('allimages',[])],'continuation':listing.get('continue')}
          except Exception as e:
              exact_prefix_census={'status':'ACCESS_ERROR_NO_NEGATIVE_PROOF','error':str(e)[:250]}
          report={'schema':'TIANWEN-13NY-XUAN-EARLY-PRINT-SOURCE-LOCATOR-R1','date':'2026-11-01',
                  'search_target':'早于1608年的徐安刊《古今律曆考》卷68原页',
                  'ncl_06270_catalog':'Taiwan NCL first-party catalog: 1600 Xu An 72 juan / 40 volumes, actual full target original PDF not yet verified',
                  'nlc_1599_source':'Commons National Library of China 411999015732 28-volume digitization, catalogued Xu An Ming Wanli 27/1599 (catalog year not identical-copy proof)',
                  'volumes':entries,'ncl_06270_commons_prefix_census':exact_prefix_census,
                  'source_grade':'PDF_BYTES_HASHED_SOURCE_PAGES_LOCATOR_ONLY_NOT_TARGET_GLYPH_COLLATION',
                  'ocr_used':False,'j68_original_target_passage_collated':False,
                  'independent_edition_vote_awarded':0,'g893_six_final':'0/6','algorithm_reopens':0}
          (output/'manifest.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit bounded source evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/evidence/13ny/
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(13NY): hash Xu An 1599 original volumes and pinpoint j68 locus'
          git push origin HEAD:refs/heads/agent/fusion-chart-core-r1-20260822
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13ny-xuan-1599-original-locator
          path: docs/research/evidence/13ny/
          if-no-files-found: warn
          retention-days: 14
