name: verify-batch-12gq-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gq-exact-head.yml
      - docs/research/ZIWEI-JI-SHUYING-WENJI-2010-SUPPLEMENT-ARTICLE-DISCOVERY-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-JI-SHUYING-WENJI-2010-SUPPLEMENT-ARTICLE-DISCOVERY-BOUNDARY-GQ.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GQ exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-JI-SHUYING-WENJI-2010-SUPPLEMENT-ARTICLE-DISCOVERY-BOUNDARY-GQ'
          e=json.loads(Path('docs/research/ZIWEI-JI-SHUYING-WENJI-2010-SUPPLEMENT-ARTICLE-DISCOVERY-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          s=e['sanmin_toc_control']
          assert s['isbn_13']=='9787501340859'
          assert s['volume_title']=='文津學志 第三輯'
          assert s['page_count']==343
          assert s['toc_section']=='文献整理与版本研究'
          assert s['normalized_article_title']=='《冀淑英文集》补遣'
          assert s['article_author_exposed'] is False
          assert s['article_page_range_exposed'] is False
          assert s['article_body_exposed'] is False

          c=e['cinii_serial_control']
          assert c['provider']=='CiNii Books / NII'
          assert c['ncid']=='BA65589403'
          assert c['target_volume_number']==3
          assert c['target_isbn_13']=='9787501340859'
          assert c['article_page_range_exposed'] is False

          a=e['adjudication']
          assert a['wenjin_xuezhi_v3_object']=='CLOSED_BY_ISBN_AND_SERIAL_CONTROLS'
          assert a['supplement_article_formal_existence']=='CLOSED_AT_PUBLISHED_TOC_LEVEL'
          assert a['supplement_article_author']=='UNRESOLVED'
          assert a['supplement_article_page_range']=='UNRESOLVED'
          assert a['supplement_article_body']=='NOT_REVIEWED'
          assert a['affects_2009_derivation_adjudication'] is False
          assert a['target_specific_purchase_route_selected'] is False
          assert a['target_specific_donation_route_selected'] is False

          r=e['relation_to_batch_12gp']
          assert r['derivation_status_remains']=='SECONDARY_REPORTED_NOT_DIRECTLY_CLOSED'
          assert r['direct_2004_editor_note_still_not_reviewed'] is True
          assert r['direct_2009_postscript_still_not_reviewed'] is True

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,203,0)
          completed=state['historical_audit']['completed_batches']
          assert bid in completed
          latest=state['historical_audit']['latest_batch_doc']
          assert isinstance(latest,str) and latest.startswith('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-') and latest.endswith('.md')

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {
            'EXT-SANMIN-WENJIN-XUEZHI-V3-2010-JI-WENJI-SUPPLEMENT-TOC',
            'EXT-CINII-WENJIN-XUEZHI-SERIAL-V3-ISBN9787501340859',
          }.issubset(ids)

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['transmission_impact']['direct_copy_edge_authorized'] is False
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_provenance_metadata_defect_count']==14
          assert e['accounting']['repaired_provenance_metadata_defect_count']==14
          PY
