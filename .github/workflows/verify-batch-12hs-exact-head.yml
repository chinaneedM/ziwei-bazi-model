name: verify-batch-12hs-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hs-exact-head.yml
      - docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-905S03288-BOOKNO3288-FORWARD-CORRECTION-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-905S03288-BOOKNO3288-FORWARD-CORRECTION-HS.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending HS status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tianwen/batch-12hs-exact-head',
              description: 'Batch 12HS exact-head verification running'
            })

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12HS exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-905S03288-BOOKNO3288-FORWARD-CORRECTION-HS'
          e=json.loads(Path('docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-905S03288-BOOKNO3288-FORWARD-CORRECTION-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          p=e['controlling_current_nlc_probe']
          assert p['workflow_run_id']==36319489516
          assert p['workflow_job_id']==108620434290
          assert p['artifact_id']==10932075967
          assert p['artifact_zip_digest']=='sha256:7fffceaac4ab10128ca638bfb79924649056663520c8bef217f332ff3d2b757d'
          assert p['workflow_head_sha']=='15ebf1c8769d8a096c673cbbecbd70336ca30d49'
          assert p['workflow_head_tree']=='88062838265b4b6efcffcb23b7a7513cd223e699'

          t=e['current_nlc_target_record']
          assert t['uid']=='UCS01003868188'
          assert t['sys']=='002838237'
          assert t['field_905a']==['NLC']
          assert t['field_905q']==['SBYL']
          assert t['field_905s']==['03288']
          assert t['normalized_locator_display']=='NLC:SBYL:03288'
          assert t['current_local_holdings_locator_closed'] is True

          c=e['current_nlc_adjacent_control']
          assert c['uid']=='UCS01003868187'
          assert c['sys']=='002838236'
          assert c['field_905s']==['08643']
          assert c['field_3165']==['NLC:SBYL:08643']

          v=e['beitu1987_direct_visual_forward_correction']
          assert v['source_pdf_page']==104
          assert v['rendered_page_sha256']=='04c1c3a8a33aaa3b401db2fd6ddcc77455a94098f01cc178a284ea8b2f42b6ce'
          assert v['ocr_used'] is False
          assert v['target']['corrected_book_number_chinese']=='三二八八'
          assert v['target']['corrected_book_number_arabic']=='3288'
          assert v['target']['prior_internal_misreading_arabic']=='3388'
          assert v['adjacent_liu_shugang_control']['historical_book_number_arabic']=='8643'
          assert v['adjacent_liu_shugang_control']['current_905s']=='08643'

          s=e['beitu1959_to_1987_local_sequence_control']
          assert s['target_1959_number']=='3368'
          assert s['target_1987_corrected_number']=='3288'
          assert s['adjacent_1959_number']=='10010'
          assert s['adjacent_1987_number']=='10010'
          assert s['uniform_local_arithmetic_offset_hypothesis']=='DISPROVEN'

          x=e['crosswalk_adjudication']
          assert x['beitu1987_3288_to_current_03288']=='CLOSED_AT_DIRECT_1987_VISUAL_PLUS_CURRENT_905_FIELD_LEVEL'
          assert x['old_3388_value_status']=='SUPERSEDED_INTERNAL_MISREADING_DO_NOT_USE'
          assert x['old_03388_search_hypothesis_status']=='REJECTED_BY_DIRECT_TARGET_905S_03288'
          assert x['exact_1959_3368_to_1987_3288_change_mechanism']=='UNRESOLVED'

          r=e['provenance_defect_repair']
          assert r['provenance_defect_id']=='PROV-DEFECT-015'
          assert r['prior_value']=='3388'
          assert r['corrected_value']=='3288'
          assert r['prior_batch_artifacts_rewritten'] is False
          assert r['defect_found_increment']==1
          assert r['defect_repaired_increment']==1

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,231,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc']=='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-905S03288-BOOKNO3288-FORWARD-CORRECTION-HS.md'
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==15
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==15

          matrix=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json').read_text(encoding='utf-8'))
          assert matrix['audit_summary']['confirmed_provenance_metadata_defect_count']==15
          assert matrix['audit_summary']['repaired_provenance_metadata_defect_count']==15

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-BEITU-1987-GUJISHANBEN-JINGBU-ZUOZHUAN-BOOKNO3288-CORRECTED']['batch_12hs']['corrected_book_number']=='3288'
          assert src['EXT-BEITU-1987-GUJISHANBEN-JINGBU-ZUOZHUAN-BOOKNO3388']['batch_12hs_forward_correction']['prior_batch_12hn_value_superseded'] is True
          assert src['EXT-NLC-META-ZUOZHUAN-UCS01003868188-CURRENT-SEARCH-20260927']['batch_12hs']['target_905s']=='03288'

          a=e['accounting']
          assert a['matrix_rows']==198
          assert a['audited_rows']==166
          assert a['current_missing_from_product_rows']==10
          assert a['confirmed_provenance_metadata_defect_count']==15
          assert a['repaired_provenance_metadata_defect_count']==15
          assert a['confirmed_chart_algorithm_defect_count']==0
          assert a['algorithm_reopen_count']==0
          assert a['candidate_collapse_count']==0
          PY

      - name: Publish successful HS status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'tianwen/batch-12hs-exact-head',
              description: 'Batch 12HS 3288/03288 correction gates PASS'
            })

      - name: Publish failed HS status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'tianwen/batch-12hs-exact-head',
              description: 'Batch 12HS exact-head verification FAILED'
            })
