name: probe-yehuobian-12wr-tokyo-shanben-search
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-12wr-tokyo-shanben-search.yml
      - scripts/probe-yehuobian-12wr-tokyo-shanben-form-search.py
      - tests/test_yehuobian_12wr_tokyo_shanben_form_search.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact public form contract and no printed-page promotion
        run: python -m unittest discover -s tests -p 'test_yehuobian_12wr_tokyo_shanben_form_search.py' -v
  capture:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One official source-emitted title form POST, no guessed IDs or images
        run: python scripts/probe-yehuobian-12wr-tokyo-shanben-form-search.py --output-dir 12wr-source-form-output
      - name: Archive exact source search body and its digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-shanben-12wr-one-title-form-response
          path: 12wr-source-form-output/
          retention-days: 30
          if-no-files-found: warn
