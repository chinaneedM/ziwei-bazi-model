name: probe-goryeosa-waseda-adjacent-folio-13bl
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-goryeosa-waseda-adjacent-13bl.py
      - .github/workflows/probe-goryeosa-waseda-adjacent-13bl.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-original-waseda-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original image extraction dependencies
        run: python -m pip install 'Pillow>=10,<12' 'PyMuPDF>=1.24,<2'
      - name: Acquire source-pinned Waseda PDF adjacent original image pages
        run: python scripts/probe-goryeosa-waseda-adjacent-13bl.py
      - name: Archive source image bytes previews and SHA-bound receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goryeosa-13bl-waseda-adjacent-original-images
          path: goryeosa-13bl-original-capture/
          retention-days: 30
          if-no-files-found: warn
