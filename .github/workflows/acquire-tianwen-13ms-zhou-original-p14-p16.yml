name: acquire-tianwen-13ms-zhou-original-p14-p16
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13ms-zhou-original-atlas.py
      - tests/test_tianwen_13ms_zhou_original_atlas.py
      - .github/workflows/acquire-tianwen-13ms-zhou-original-p14-p16.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-native-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - run: python -m unittest discover -s tests -p 'test_tianwen_13ms_zhou_original_atlas.py' -v
      - run: python scripts/acquire-tianwen-13ms-zhou-original-atlas.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13ms-zhou-original-p14-p16-native-atlas
          path: /tmp/tianwen-13ms/
          retention-days: 30
          if-no-files-found: warn
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
