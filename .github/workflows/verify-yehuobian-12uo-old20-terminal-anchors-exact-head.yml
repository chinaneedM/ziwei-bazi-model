name: verify-yehuobian-12uo-old20-terminal-anchors-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12uo-old20-terminal-anchors-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UO-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UO-*.md
      - tests/test_yehuobian_nlc_old20_terminal_image_anchors_12uo.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify project continuity and genealogy
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Guard image anchors and no invented folio evidence
        run: python -m unittest discover -s tests -p 'test_yehuobian_nlc_old20_terminal_image_anchors_12uo.py' -v
