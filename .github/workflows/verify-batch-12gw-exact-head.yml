name: verify-batch-12gw-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gw-exact-head.yml
      - docs/research/ZIWEI-JI-SHUYING-WENJI-2004-CHEN-HONGYAN-EDITORIAL-RESPONSIBILITY-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-JI-SHUYING-WENJI-2004-CHEN-HONGYAN-EDITORIAL-RESPONSIBILITY-BOUNDARY-GW.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GW exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-JI-SHUYING-WENJI-2004-CHEN-HONGYAN-EDITORIAL-RESPONSIBILITY-BOUNDARY-GW'
          e=json.loads(Path('docs/research/ZIWEI-JI-SHUYING-WENJI-2004-CHEN-HONGYAN-EDITORIAL-RESPONSIBILITY-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          assert e['public_bio_control']['speaker']=='陈红彦'
          assert e['public_bio_control']['ji_wenji_editorial_responsibility_directly_named'] is True
          assert e['nlc_project_context']['series']=='芸香阁丛书'
          assert '陈红彦' in e['nlc_project_context']['named_participants_in_relevant_project_passage']
          a=e['adjudication']
          assert a['chen_hongyan_editorial_responsibility_for_yunxiangge_ji_wenji']=='CLOSED_AT_EXPLICIT_PUBLIC_BIO_PLUS_FIRST_PARTY_NLC_PROJECT_CONTEXT'
          assert a['final_bianhouji_author']=='UNRESOLVED'
          assert a['final_bianhouji_text']=='NOT_REVIEWED'
          assert a['supplement_2010_author']=='UNRESOLVED'
          assert a['chen_hongyan_authored_2010_supplement']=='NOT_PROVED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,209,0)
          assert bid in state['historical_audit']['completed_batches']
          latest=state['historical_audit']['latest_batch_doc']
          assert isinstance(latest,str) and latest.startswith('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-') and latest.endswith('.md')
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert 'EXT-CHINANEWS-CHEN-HONGYAN-2009-JI-WENJI-EDITOR-BIO' in ids and 'EXT-NLC-PCAB-YUNXIANGGE-PROJECT-CONTEXT-2017' in ids
          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          PY
