name: verify-tianwen-13hu-three-source-winter-heading
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/research/TIANWEN-13HU-THREE-SOURCE-WINTER-HEADING-PROVENANCE-RECONCILIATION-R1.json
      - docs/research/TIANWEN-13HU-THREE-SOURCE-WINTER-HEADING-PROVENANCE-RECONCILIATION-R1.md
