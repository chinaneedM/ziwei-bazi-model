name: verify-mingshi-cadal-12ym-public-original-acquisition

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/verify-mingshi-cadal-12ym-public-original-acquisition.yml
      - scripts/probe-mingshi-cadal-12ym.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  obtain-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DjVu decoder and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install 'Pillow>=10,<12'
      - name: Authorized Wikimedia public-domain original byte/digest and image atlas probe
        run: python scripts/probe-mingshi-cadal-12ym.py
      - name: Preserve source plus non-OCR page atlas for direct inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mingshi-cadal-12ym-public-original-image-atlas
          path: source-mingshi-cadal-12ym/
          if-no-files-found: warn
          retention-days: 15
