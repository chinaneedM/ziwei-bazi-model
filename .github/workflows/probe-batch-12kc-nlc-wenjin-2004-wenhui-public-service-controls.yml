name: probe-batch-12kc-nlc-wenjin-2004-wenhui-public-service-controls

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12kc-nlc-wenjin-2004-wenhui-public-service-controls.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only source-emitted public service controls for the 2004 Wenhui DVD item
        run: |
          python - <<'PY'
          import hashlib, html, json, re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests

          UA={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; NLC public service-control calibration)"}
          DETAIL="http://find.nlc.cn/search/showDocDetails?docId=-7686431772105481921&dataSource=ucs01&query=%E6%96%87%E6%B1%87%E6%8A%A5"

          def sha(b): return hashlib.sha256(b).hexdigest()
          def decode(raw):
              for enc in ("utf-8","utf-8-sig","gb18030","gbk","big5"):
                  try: return raw.decode(enc),enc
                  except UnicodeDecodeError: pass
              return raw.decode("utf-8","replace"),"utf-8-replacement"

          class Scan(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.forms=[]; self.inputs=[]; self.anchors=[]; self.scripts=[]; self.controls=[]
              def handle_starttag(self,tag,attrs):
                  d={k:v for k,v in attrs}; raw=self.get_starttag_text()
                  if tag=="form": self.forms.append({"attrs":d,"raw":raw})
                  if tag=="input": self.inputs.append({"attrs":d,"raw":raw})
                  if tag=="a": self.anchors.append({"attrs":d,"raw":raw})
                  if tag=="script" and d.get("src"): self.scripts.append(d["src"])
                  if any(k in d for k in ("onclick","href","action","hrefSrc","hrefSrcd","data-url","data-href")):
                      blob=html.unescape(raw)
                      if re.search(r"在线阅读|文献传递|馆藏|location|lib|read|delivery|request|hrefSrc|showLibMap|submit|login",blob,re.I):
                          self.controls.append({"tag":tag,"attrs":d,"raw":raw[:2400]})

          s=requests.Session(); s.headers.update(UA)
          r=s.get(DETAIL,timeout=45,allow_redirects=True); raw=r.content; txt,enc=decode(raw)
          scan=Scan(); scan.feed(txt)

          visible=re.sub(r"\s+"," ",html.unescape(re.sub(r"<[^>]+>"," ",txt))).strip()
          called=set()
          for item in scan.controls+scan.anchors:
              for v in item.get("attrs",{}).values():
                  if not isinstance(v,str): continue
                  for m in re.finditer(r"\b([A-Za-z_$][\w$]*)\s*\(",v):
                      called.add(m.group(1))

          # Bind hidden form fields by name, but redact values that look session/account-like.
          input_rows=[]
          for x in scan.inputs:
              a=x["attrs"]; name=a.get("name"); typ=(a.get("type") or "").lower(); val=a.get("value")
              if not name: continue
              sensitive=bool(re.search(r"token|session|sid|cookie|user|reader|card|password|auth",name,re.I))
              input_rows.append({"name":name,"type":typ,"value":None if sensitive else val,"value_redacted":sensitive})

          scripts=[]
          for src in scan.scripts:
              u=urljoin(r.url,html.unescape(src))
              if urlparse(u).hostname and urlparse(u).hostname.endswith("nlc.cn") and u not in scripts:
                  scripts.append(u)

          script_rows=[]; function_defs=[]
          for u in scripts[:30]:
              row={"url":u}
              try:
                  sr=s.get(u,timeout=30,allow_redirects=True); stxt,senc=decode(sr.content)
                  row.update({"http_status":sr.status_code,"final_url":sr.url,"bytes":len(sr.content),"sha256":sha(sr.content),"decode_used":senc})
                  for fn in sorted(called):
                      for pat in (rf"function\s+{re.escape(fn)}\s*\(",rf"{re.escape(fn)}\s*=\s*function\s*\("):
                          m=re.search(pat,stxt)
                          if m:
                              a=max(0,m.start()-800); b=min(len(stxt),m.start()+5000); frag=stxt[a:b]
                              function_defs.append({"name":fn,"script_url":sr.url,"script_sha256":sha(sr.content),"excerpt_sha256":sha(frag.encode("utf-8")),"raw_excerpt":frag})
                              break
              except Exception as e:
                  row.update({"error_class":type(e).__name__,"error":str(e)[:400]})
              script_rows.append(row)

          # Extract literal external/service URLs already emitted in the detail HTML; do not follow them.
          emitted_urls=sorted(set(html.unescape(x) for x in re.findall(r"https?://[^\"'<>\s]+",txt)))
          service_urls=[u for u in emitted_urls if re.search(r"read|request|gateway|delivery|nlc|wxtg",u,re.I)]

          out={
            "source_item":{"batch":"12KB","detail_url":DETAIL,"detail_sha256":"a76daf5e6c6867d2a9b9ff01c5dce914cf4513702a22c22014f01d8945c1afdf"},
            "detail_response":{"http_status":r.status_code,"final_url":r.url,"bytes":len(raw),"sha256":sha(raw),"decode_used":enc},
            "visible_markers":{
              "online_reading":("在线阅读" in visible),
              "document_delivery":("文献传递" in visible),
              "holdings_information":("馆藏信息" in visible),
              "nlc_location":("国家图书馆" in visible),
              "login_required_marker":("未登录情况下不能使用在线阅读功能" in visible)
            },
            "forms":scan.forms,
            "input_fields":input_rows,
            "relevant_controls":scan.controls,
            "called_function_names":sorted(called),
            "source_emitted_script_urls":scripts,
            "source_emitted_script_probes":script_rows,
            "source_emitted_function_definitions":function_defs,
            "source_emitted_service_urls_not_followed":service_urls,
            "adjudication":{
              "form_submitted":False,
              "online_reading_executed":False,
              "document_delivery_executed":False,
              "login_executed":False,
              "service_url_followed":False,
              "only_source_emitted_html_and_scripts_inspected":True
            },
            "security":{
              "login_used":False,"reader_account_used":False,"registration_used":False,
              "post_request_used":False,"state_changing_request_used":False,
              "private_endpoint_guessed":False,"record_identifier_guessed":False,
              "captcha_bypass_used":False,"tls_verification_disabled":False
            }
          }
          Path("batch-12kc-nlc-wenjin-2004-wenhui-public-service-controls.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12kc-nlc-wenjin-2004-wenhui-public-service-controls
          path: batch-12kc-nlc-wenjin-2004-wenhui-public-service-controls.json
