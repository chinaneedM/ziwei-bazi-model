name: verify-batch-12hm-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hl-exact-head.yml
      - .github/workflows/verify-batch-12hm-exact-head.yml
      - docs/research/ZIWEI-NLC-ZUOZHUAN-FID412004000070-MICROFILM-OLD-CATALOG-CROSSWALK-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID412004000070-MICROFILM-OLD-CATALOG-CROSSWALK-HM.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HM exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID412004000070-MICROFILM-OLD-CATALOG-CROSSWALK-HM'
          e=json.loads(Path('docs/research/ZIWEI-NLC-ZUOZHUAN-FID412004000070-MICROFILM-OLD-CATALOG-CROSSWALK-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          m=e['nlc_microfilm_old_catalog_crosswalk']
          assert m['original_embedded_control_id']=='412004000070'
          assert m['work_record']['sys']=='003416361'
          assert m['work_record']['uid']=='UCS01003624709'
          assert m['work_record']['field_4551'][0]=='001412004000070'
          assert m['work_record']['field_455a']==['附释音春秋左传注疏','刻本','32册']
          assert m['work_record']['field_455d']==['元[1271-1368]','明[1368-1644]重修','28cm']
          d=e['fid070_public_backup_control']
          assert d['fid']=='412004000070'
          assert d['file_count']==32
          assert d['covers_juan_1_through_60'] is True
          i=e['identity_adjudication']
          assert i['fid070_equals_1985_microfilm_original_control']=='CLOSED'
          assert i['fid070_equals_zhang_tieqin_yuan_copy']=='STRONGLY_COMPATIBLE_NOT_PROVED'
          assert i['same_object_edge_authorized'] is False
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,225,0)
          assert bid in state['historical_audit']['completed_batches']
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-NLC-MICROFILM-ZUOZHUAN-FID412004000070-OLD-CATALOG']['batch_12hm']['embedded_original_control']=='412004000070'
          assert src['EXT-NLC-DIGITAL-ZUOZHUAN-412004000070-COMMONS-BACKUP']['batch_12hm']['file_count']==32
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_chart_algorithm_defect_count']==0
          PY
