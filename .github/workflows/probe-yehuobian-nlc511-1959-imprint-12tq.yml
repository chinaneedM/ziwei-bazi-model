name: probe-yehuobian-nlc511-1959-imprint-12tq
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-nlc511-1959-imprint-12tq.yml
      - docs/research/MING-DATONG-YEHUOBIAN-12TQ-NLC511-1959-PHYSICAL-IMPRINT-IMAGE-ATLAS-GATE-R1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-imprint-image-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install no-OCR PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install -q Pillow
      - name: Validate exact Commons PDF and render source leaves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nlc511-1959-12tq/pages nlc511-1959-12tq/contacts
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,urllib.parse
          from PIL import Image,ImageDraw
          root=pathlib.Path("nlc511-1959-12tq")
          title="NLC511-023031404016561-25336 萬曆野獲編 上冊.pdf"
          url="https://commons.wikimedia.org/wiki/Special:Redirect/file/"+urllib.parse.quote(title)
          expected={"bytes":13756274,"sha1":"6b1b516ccbc6bc9423fb9f31d6d1de2ab8ae0f9f","pages":366}
          pdf=root/"source.pdf"
          out={"schema":"TIANWEN-12TQ-NLC511-MODERN1959-IMPRINT-ATLAS",
            "source_title":title,"public_source_url":url,"expected":expected,
            "page_windows":[[1,32],[350,366]],
            "ocr_used":False,"source_is_1959_modern_print":True,
            "original_1827_impression_proven":False,
            "original_1869_repair_impression_proven":False,
            "publishing_colophon_manually_read":False,
            "1958_1959_year_dispute_adjudicated":False,
            "ancient_glyph_votes_added":0,"algorithm_reopens":0,
            "source_pages":[],"contact_sheets":[],"status":"STARTED"}
          def sha(buf):return hashlib.sha256(buf).hexdigest()
          try:
            cmd=["curl","-L","--fail","--retry","3","--retry-all-errors",
              "--retry-delay","4","--connect-timeout","25","--max-time","480",
              "-A","TIANWEN-Historical-Bibliography-Audit/1.0",url,"-o",str(pdf)]
            x=subprocess.run(cmd,capture_output=True,text=True,timeout=510)
            if x.returncode: raise RuntimeError("SOURCE_FETCH_BOUNDARY "+x.stderr[-280:])
            raw=pdf.read_bytes()
            observed={"bytes":len(raw),"sha1":hashlib.sha1(raw).hexdigest(),"sha256":sha(raw)}
            if not raw.startswith(b"%PDF"):raise RuntimeError("RESPONSE_NOT_PDF")
            metadata=subprocess.check_output(["pdfinfo",str(pdf)],text=True,timeout=50)
            observed["pages"]=int(next(v.split(":",1)[1] for v in metadata.splitlines() if v.startswith("Pages:")))
            out["observed"]=observed
            if any(observed[k]!=v for k,v in expected.items()):
              raise RuntimeError("FULL_SOURCE_IDENTITY_OR_PAGE_COUNT_MISMATCH")
            cards=[]; pages=list(range(1,33))+list(range(350,367))
            for page in pages:
              stem=root/"pages"/f"p{page:03d}"
              subprocess.run(["pdftoppm","-f",str(page),"-l",str(page),
                "-scale-to","1100","-jpeg","-jpegopt","quality=83",
                "-singlefile",str(pdf),str(stem)],check=True,capture_output=True,timeout=75)
              jpeg=stem.with_suffix(".jpg"); buf=jpeg.read_bytes()
              out["source_pages"].append({"pdf_page_1based":page,"sha256":sha(buf),"bytes":len(buf)})
              with Image.open(jpeg) as z:
                thumb=z.convert("RGB");thumb.thumbnail((520,710));cards.append((page,thumb.copy()))
              if len(cards)==8 or page==pages[-1]:
                sheet=Image.new("RGB",(4*550,2*770),"white");draw=ImageDraw.Draw(sheet)
                for index,(p,im) in enumerate(cards):
                  xx=(index%4)*550;yy=(index//4)*770
                  draw.text((xx+10,yy+8),f"NLC511 1959 upper PDF p{p:03d}",fill="black")
                  sheet.paste(im,(xx+10,yy+36))
                dest=root/"contacts"/f"sheet-{len(out['contact_sheets'])+1:02d}.jpg"
                sheet.save(dest,quality=83)
                out["contact_sheets"].append({"file":dest.name,"pages":[n for n,_ in cards],"sha256":sha(dest.read_bytes())})
                cards=[]
            out["status"]="EXACT_SOURCE_VERIFIED_49_PAGES_RENDERED_MANUAL_COLLATION_PENDING"
          except Exception as err:
            out["status"]="FAIL_CLOSED_ACCESS_OR_IDENTITY_OR_RENDER"
            out["error"]=type(err).__name__+": "+str(err)[:450]
          finally:
            pdf.unlink(missing_ok=True)
            (root/"status.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"status":out["status"],"observed":out.get("observed"),
             "rendered_pages":len(out["source_pages"]),"error":out.get("error")}))
          if out["status"]!="EXACT_SOURCE_VERIFIED_49_PAGES_RENDERED_MANUAL_COLLATION_PENDING":
            raise SystemExit(1)
          PY
      - name: Upload hash-bound page atlas for human collation (no source PDF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yehuobian-nlc511-modern1959-frontback-atlas-12tq
          path: nlc511-1959-12tq/
          retention-days: 14
          if-no-files-found: warn
