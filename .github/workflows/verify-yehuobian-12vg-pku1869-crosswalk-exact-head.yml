name: verify-yehuobian-12vg-pku1869-crosswalk-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12vg-pku1869-crosswalk-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VG-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VG-*.md
      - scripts/verify-yehuobian-pku1869-crosswalk-12vg.py
      - tests/test_yehuobian_pku1869_crosswalk_12vg.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify project, source registry and genealogy
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: 12VG first-party item firewall and 18 tests
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-pku1869-crosswalk-12vg.py
          python -m unittest discover -s tests -p 'test_yehuobian_pku1869_crosswalk_12vg.py' -v
