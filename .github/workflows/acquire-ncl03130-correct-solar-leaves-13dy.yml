name: acquire-ncl03130-correct-solar-leaves-13dy
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - "scripts/acquire-ncl03130-correct-solar-leaves-13dy.py"
      - ".github/workflows/acquire-ncl03130-correct-solar-leaves-13dy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-correct-solar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF native renderer (no OCR)
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<1.28" requests
      - name: SHA-bound original p73-80 acquire after lunar-table erratum
        run: python scripts/acquire-ncl03130-correct-solar-leaves-13dy.py
      - name: Archive all acquired original pixels and access manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncl03130-13dy-correct-solar-original-p73-p80
          path: ncl03130-13dy-correct-solar-original-pages/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
