name: verify-tianwen-13hz-nikh-d18
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/research/TIANWEN-13HZ-NIKH-WINTER-D18-TWO-SIDED-R1.json
      - docs/research/TIANWEN-13HZ-NIKH-WINTER-D18-TWO-SIDED-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - scripts/verify-tianwen-13hz-nikh-d18.py
      - tests/test_tianwen_13hz_nikh_d18.py
      - .github/workflows/verify-tianwen-13hz-nikh-d18.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  literal-not-math:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/verify-tianwen-13hz-nikh-d18.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13hz_nikh_d18.py' -v
