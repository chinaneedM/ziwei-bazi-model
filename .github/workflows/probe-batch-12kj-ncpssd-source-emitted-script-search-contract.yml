name: probe-batch-12kj-ncpssd-source-emitted-script-search-contract

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12kj-ncpssd-source-emitted-script-search-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inventory all source-emitted scripts and locate NCPSsd search functions
        run: |
          python - <<'PY'
          import hashlib, html, json, re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests

          URL="https://www.ncpssd.cn/"
          UA={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; NCPSsd source-emitted script inventory)"}
          NAMES=["Basicsearch","AdvancedSearch","Search_text","qkSearchCondition","Search_GJ","waiwen_search"]

          def sha(b): return hashlib.sha256(b).hexdigest()
          def decode(raw):
              for enc in ("utf-8","utf-8-sig","gb18030","gbk","big5"):
                  try:return raw.decode(enc),enc
                  except UnicodeDecodeError:pass
              return raw.decode("utf-8","replace"),"utf-8-replacement"

          def extract_function(src,name):
              pats=[rf"function\s+{re.escape(name)}\s*\([^)]*\)\s*\{{",rf"(?:var|let|const)\s+{re.escape(name)}\s*=\s*function\s*\([^)]*\)\s*\{{",rf"{re.escape(name)}\s*[:=]\s*function\s*\([^)]*\)\s*\{{"]
              for pat in pats:
                  m=re.search(pat,src)
                  if not m: continue
                  brace=src.find("{",m.start()); depth=0; quote=None; esc=False
                  for i in range(brace,len(src)):
                      c=src[i]
                      if quote:
                          if esc: esc=False
                          elif c=="\\": esc=True
                          elif c==quote: quote=None
                          continue
                      if c in ("'","\""): quote=c; continue
                      if c=="{": depth+=1
                      elif c=="}":
                          depth-=1
                          if depth==0:return src[m.start():i+1],m.start(),i+1
              return None,None,None

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False); self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script":
                      d={k:v for k,v in attrs}
                      if d.get("src"): self.scripts.append(d["src"])

          s=requests.Session(); s.headers.update(UA)
          r=s.get(URL,timeout=45,allow_redirects=True)
          raw=r.content; txt,enc=decode(raw)
          p=P(); p.feed(txt)

          emitted=[]
          for src in p.scripts:
              u=urljoin(r.url,html.unescape(src))
              if u not in emitted: emitted.append(u)

          html_name_contexts={}
          for name in NAMES:
              arr=[]
              for m in re.finditer(re.escape(name),txt):
                  arr.append(txt[max(0,m.start()-1200):min(len(txt),m.end()+2500)])
                  if len(arr)>=10: break
              html_name_contexts[name]=arr

          script_rows=[]; defs=[]
          for u in emitted[:100]:
              row={"url":u,"host":urlparse(u).hostname}
              try:
                  sr=s.get(u,timeout=30,allow_redirects=True)
                  sraw=sr.content; stxt,senc=decode(sraw)
                  row.update({"http_status":sr.status_code,"final_url":sr.url,"bytes":len(sraw),"sha256":sha(sraw),"decode_used":senc})
                  found=[]
                  for name in NAMES:
                      if name in stxt:
                          body,start,end=extract_function(stxt,name)
                          found.append(name)
                          defs.append({"name":name,"script_url":sr.url,"script_sha256":sha(sraw),"definition_found":body is not None,"start":start,"end":end,"body_sha256":sha(body.encode("utf-8")) if body else None,"body":body,"contexts":[stxt[max(0,m.start()-1200):min(len(stxt),m.end()+3500)] for m in list(re.finditer(re.escape(name),stxt))[:8]]})
                  row["target_names_present"]=found
              except Exception as e:
                  row.update({"error_class":type(e).__name__,"error":str(e)[:500]})
              script_rows.append(row)

          out={
            "source_contract":{"parent_batch":"12KI","home_url":URL,"query_submitted":False,"search_endpoint_guessed":False,"search_parameter_guessed":False},
            "home_response":{"http_status":r.status_code,"final_url":r.url,"bytes":len(raw),"sha256":sha(raw),"decode_used":enc},
            "source_emitted_script_urls":emitted,
            "home_target_name_contexts":html_name_contexts,
            "script_probes":script_rows,
            "target_function_hits":defs,
            "adjudication":{"query_submitted":False,"form_submitted":False,"login_used":False,"only_source_emitted_scripts_fetched":True},
            "security":{"anonymous_get_only":True,"reader_account_used":False,"registration_used":False,"post_request_used":False,"state_changing_request_used":False,"private_endpoint_guessed":False,"search_endpoint_guessed":False,"search_parameter_guessed":False,"captcha_bypass_used":False,"tls_verification_disabled":False}
          }
          Path("batch-12kj-ncpssd-source-emitted-script-search-contract.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12kj-ncpssd-source-emitted-script-search-contract
          path: batch-12kj-ncpssd-source-emitted-script-search-contract.json
