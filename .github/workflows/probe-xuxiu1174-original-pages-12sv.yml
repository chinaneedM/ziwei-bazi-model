name: probe-xuxiu1174-original-pages-12sv
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-xuxiu1174-original-pages-12sv.yml
      - docs/research/MING-DATONG-YEHUOBIAN-12SV-XUXIU1174-BONDED-SOURCE-ATLAS-TRIGGER-R1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicly-hosted-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install no-OCR PDF raster dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install -q Pillow
      - name: Fetch exactly identified public Commons object and sample source leaves
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xuxiu1174-12sv/pages xuxiu1174-12sv/contacts
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, urllib.parse
          from PIL import Image, ImageDraw

          ROOT=pathlib.Path("xuxiu1174-12sv")
          name="續修四庫全書第1174冊.pdf"
          url="https://commons.wikimedia.org/wiki/Special:Redirect/file/"+urllib.parse.quote(name)
          expected_sha1="fc6a98b070c11372c557e22bb05cdc9859541715"
          expected_bytes=68649578
          expected_pages=810
          pdf=ROOT/"source.pdf"
          result={
             "schema":"TIANWEN-12SV-XUXIU1174-BOUNDED-PUBLIC-PDF-PAGE-ATLAS",
             "source_file_title":name, "source_file_page":"https://commons.wikimedia.org/wiki/File:"+urllib.parse.quote(name),
             "download_route":url, "expected_bytes":expected_bytes,
             "expected_sha1":expected_sha1,"expected_pdf_pages":expected_pages,
             "source_is_modern_2002_facsimile":True,"underlying_original_copy_identity_verified":False,
             "sampling_not_exhaustive_review":True,"ocr_used":False,
             "target_article_page_verified":False,"four_loci_manually_collated":False,
             "source_glyph_votes_added":0,"algorithm_reopens":0,
             "sample_pages":[],"contact_sheets":[],"status":"STARTED"}
          def digest(buf):return hashlib.sha256(buf).hexdigest()
          try:
             cmd=["curl","-L","--fail","--retry","3","--retry-delay","4",
                "--retry-all-errors","--connect-timeout","25","--max-time","480",
                "-A","Tianwen-Research-Source-Page-Inspection/1.0",
                url,"-o",str(pdf)]
             c=subprocess.run(cmd,capture_output=True,text=True,timeout=510)
             if c.returncode:raise RuntimeError("PUBLIC_SOURCE_FETCH_BOUNDARY: "+c.stderr[-250:])
             data=pdf.read_bytes()
             result["observed_bytes"]=len(data)
             result["observed_sha1"]=hashlib.sha1(data).hexdigest()
             result["observed_sha256"]=digest(data)
             if not data.startswith(b"%PDF"):raise RuntimeError("NOT_A_PDF_SOURCE")
             if len(data)!=expected_bytes or result["observed_sha1"]!=expected_sha1:
                raise RuntimeError("SOURCE_IDENTITY_MISMATCH_FAIL_CLOSED")
             info=subprocess.check_output(["pdfinfo",str(pdf)],text=True,timeout=50)
             pages=int(next(row.split(":",1)[1] for row in info.splitlines() if row.startswith("Pages:")))
             result["observed_pages"]=pages
             if pages!=expected_pages:raise RuntimeError("SOURCE_PAGINATION_MISMATCH_FAIL_CLOSED")
             samples=sorted(set([1,2,115,116,117,118,119,810]+list(range(130,810,12))))
             cards=[]
             for number in samples:
                output=ROOT/"pages"/f"page-{number:03d}"
                subprocess.run(["pdftoppm","-f",str(number),"-l",str(number),
                   "-scale-to","1000","-jpeg","-jpegopt","quality=82","-singlefile",
                   str(pdf),str(output)],check=True,capture_output=True,timeout=75)
                file=output.with_suffix(".jpg")
                raw=file.read_bytes()
                result["sample_pages"].append({"pdf_page_1based":number,"sha256":digest(raw),"bytes":len(raw)})
                with Image.open(file) as src:
                   thumb=src.convert("RGB")
                   thumb.thumbnail((530,690))
                   cards.append((number,thumb.copy()))
                if len(cards)==8 or number==samples[-1]:
                   image=Image.new("RGB",(4*580,2*760),"white")
                   draw=ImageDraw.Draw(image)
                   for i,(p,thumb) in enumerate(cards):
                      x=(i%4)*580;y=(i//4)*760
                      draw.text((x+8,y+8),f"XUXIU 1174 PDF page {p:03d} (1-based)",fill="black")
                      image.paste(thumb,(x+14,y+34))
                   sheet=ROOT/"contacts"/f"sample-sheet-{len(result['contact_sheets'])+1:02d}.jpg"
                   image.save(sheet,quality=83)
                   result["contact_sheets"].append({"name":sheet.name,"pages":[p for p,_ in cards],
                      "sha256":digest(sheet.read_bytes())})
                   cards=[]
             result["status"]="SOURCE_IDENTITY_MATCHED_SAMPLE_IMAGES_ONLY_NOT_MANUALLY_COLLATED"
          except Exception as exc:
             result["status"]="FAIL_CLOSED_ACCESS_OR_IDENTITY_OR_RENDER"
             result["error"]=type(exc).__name__+": "+str(exc)[:500]
          finally:
             pdf.unlink(missing_ok=True)
             (ROOT/"status.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"status":result["status"],"sha256":result.get("observed_sha256"),
             "sample_pages":len(result["sample_pages"]),"error":result.get("error")}))
          if result["status"]!="SOURCE_IDENTITY_MATCHED_SAMPLE_IMAGES_ONLY_NOT_MANUALLY_COLLATED":
             raise SystemExit(1)
          PY
      - name: Upload checked source-image atlas, not full original PDF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xuxiu1174-bounded-source-atlas-12sv
          path: xuxiu1174-12sv/
          retention-days: 14
          if-no-files-found: warn
