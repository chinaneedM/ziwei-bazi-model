name: acquire-goryeosa-waseda-next-folios-13bw
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-goryeosa-waseda-next-folios-13bw.py
      - .github/workflows/acquire-goryeosa-waseda-next-folios-13bw.yml
      - docs/research/TIANWEN-13BW-GORYEOSA-WASEDA-P24-P25-ORIGINAL-D21-D38-AND-P26-P27-BOUNDARY-R1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-original-next-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original source readers
        run: python -m pip install 'Pillow>=10,<12' 'PyMuPDF>=1.24,<2'
      - name: Exact source boundary and regression check
        run: |
          python scripts/verify-goryeosa-waseda-p24-p25-boundary-13bw.py
          python -m unittest discover -s tests -p 'test_goryeosa_waseda_p24_p25_boundary_13bw.py' -v
      - name: Acquire source PDF p26 and p27 original image bytes
        run: python scripts/acquire-goryeosa-waseda-next-folios-13bw.py
      - name: Preserve original JPEGs and receipt including bounded source access failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goryeosa-13bw-waseda-p26-p27-original-sources
          path: goryeosa-waseda-13bw-p26-p27/
          retention-days: 30
          if-no-files-found: warn
