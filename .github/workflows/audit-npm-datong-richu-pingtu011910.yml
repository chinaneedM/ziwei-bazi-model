name: audit-npm-datong-richu-pingtu011910

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-npm-datong-richu-pingtu011910.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Repair continuity verifier for completed Batch 12CR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-project-continuity-state-r1.py')
          s = p.read_text(encoding='utf-8')
          old_tail = '    "BATCH-12-ZIWEI-YANGZAN-XIANZHONGLU-BEIJING-PRECISION-CQ",\n]'
          new_tail = '    "BATCH-12-ZIWEI-YANGZAN-XIANZHONGLU-BEIJING-PRECISION-CQ",\n    "BATCH-12-ZIWEI-HUQIANJING-SHIDIAN-TIANYIGE-DIGITAL-SURROGATE-DEDUP-CR",\n]'
          old_doc = 'LATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-YANGZAN-XIANZHONGLU-BEIJING-PRECISION-CQ.md"'
          new_doc = 'LATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-HUQIANJING-SHIDIAN-TIANYIGE-DIGITAL-SURROGATE-DEDUP-CR.md"'
          if old_tail not in s:
              raise SystemExit('expected CQ supplemental tail not found')
          if old_doc not in s:
              raise SystemExit('expected CQ latest-batch doc not found')
          s = s.replace(old_tail, new_tail, 1).replace(old_doc, new_doc, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python scripts/verify-project-continuity-state-r1.py
          if ! git diff --quiet -- scripts/verify-project-continuity-state-r1.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/verify-project-continuity-state-r1.py
            git commit -m 'sync continuity verifier through Batch 12CR'
            git push origin HEAD:agent/fusion-chart-core-r1-20260822
          fi
      - name: Probe NPM Pingtu 011910 public rare-book route
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/npm-datong-richu-pingtu011910'
          mkdir -p "$ROOT"
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          npm install --no-save --silent puppeteer-core@24.16.0
          cat > "$ROOT/probe.mjs" <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const root='audit/npm-datong-richu-pingtu011910';
          const base='https://rarebooks-maps.npm.edu.tw/index.php';
          const queryObj={pageing:'1-20',search:[{field:'CmnNumber',value:'平圖011910'}],pqfilter:[],tpfilter:{}};
          const token=Buffer.from(JSON.stringify(queryObj),'utf8').toString('base64');
          const searchUrl=`${base}?act=Archive%2Fsearch%2F1-20%2F${encodeURIComponent(token)}`;

          const browser=await puppeteer.launch({headless:true,executablePath:process.env.BROWSER,args:['--no-sandbox','--disable-setuid-sandbox']});
          const page=await browser.newPage();
          await page.setViewport({width:1600,height:1200,deviceScaleFactor:1});
          await page.setUserAgent('Mozilla/5.0 Tianwen-Provenance-Audit/1.0');

          const network=[];
          page.on('response',res=>{
            const u=res.url();
            const ct=res.headers()['content-type']||'';
            if(u.includes('rarebooks-maps.npm.edu.tw') || ct.startsWith('image/')){
              network.push({status:res.status(),url:u,content_type:ct});
            }
          });

          const saveSurface=async(name)=>{
            const s=await page.evaluate(()=>({
              title:document.title,
              url:location.href,
              body:document.body?.innerText||'',
              links:[...document.querySelectorAll('a')].map(a=>({text:(a.innerText||a.textContent||'').trim(),href:a.href||'',className:a.className||'',acckey:a.getAttribute('acckey')})),
              images:[...document.querySelectorAll('img')].map(img=>({alt:img.alt||'',src:img.currentSrc||img.src||''}))
            }));
            fs.writeFileSync(`${root}/${name}.json`,JSON.stringify(s,null,2));
            await page.screenshot({path:`${root}/${name}.png`,fullPage:true});
            return s;
          };

          await page.goto(searchUrl,{waitUntil:'networkidle2',timeout:90000});
          const search=await saveSurface('search');
          const row=await page.evaluate(()=>{
            const content=document.querySelector('a.act_content_display');
            const book=document.querySelector('a.act_book_display');
            const union=document.querySelector('a.act_similar_display');
            const body=document.body?.innerText||'';
            return {
              content_acckey:content?.getAttribute('acckey')||null,
              book_acckey:book?.getAttribute('acckey')||null,
              content_text:(content?.textContent||'').trim(),
              book_text:(book?.textContent||'').trim(),
              union_catalog_url:union?.href||null,
              union_catalog_text:(union?.textContent||'').trim(),
              undigitized:/未數位化/.test(body),
              ming_wusilan:/明烏絲欄鈔本/.test(body),
              title_attested:/大統日出分/.test(body),
              identifier_attested:/平圖011910/.test(body),
              ncl_number_6267:/(?:國家圖書館[\s\S]{0,80}6267|6267[\s\S]{0,80}國家圖書館)/.test(body)
            };
          });

          let detail=null;
          if(row.content_acckey){
            try{
              await page.evaluate(()=>document.querySelector('a.act_content_display')?.click());
              await new Promise(r=>setTimeout(r,3000));
              detail=await saveSurface('detail-layer');
            }catch(err){
              fs.writeFileSync(`${root}/detail-error.txt`,String(err));
            }
          }

          const interesting=[...new Set(network.filter(x=>x.status===200 && (x.content_type.startsWith('image/') || /iiif|image|archive|display|meta/i.test(x.url))).map(x=>x.url))];
          const report={
            schema:'NPM-DATONG-RICHU-PINGTU011910-PUBLIC-CATALOG-CLOSURE-R3',
            search_url:searchUrl,
            query:queryObj,
            row,
            detail_obtained:!!detail,
            detail_body_contains_title:detail?/大統日出分/.test(detail.body):false,
            detail_body_contains_identifier:detail?/平圖011910/.test(detail.body):false,
            detail_body_contains_ming_wusilan:detail?/明烏絲欄鈔本/.test(detail.body):false,
            interesting_network_urls:interesting.slice(0,300),
            network_count:network.length,
            adjudication:'OFFICIAL_NPM_CATALOG_BINDS_TITLE_IDENTIFIER_MING_WUSILAN_MANUSCRIPT_AND_UNDIGITIZED_STATUS; NO_PHYSICAL_PAGE_OR_NUMERIC_CLAIM_AUTHORIZED',
            next_gate:'Use the NCL union-catalog route and other institutional copies to seek a digitized or directly readable physical witness before any 59/41 or Sanming-fingerprint comparison.'
          };
          fs.writeFileSync(`${root}/report.json`,JSON.stringify(report,null,2));
          fs.writeFileSync(`${root}/network.json`,JSON.stringify(network,null,2));
          fs.writeFileSync(`${root}/report.sha256`,crypto.createHash('sha256').update(JSON.stringify(report)).digest('hex')+'\n');
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(!row.title_attested || !row.identifier_attested || !row.ming_wusilan || !row.undigitized) process.exitCode=2;
          JS
          BROWSER="$BROWSER" node "$ROOT/probe.mjs"
      - name: Upload NPM route artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-datong-richu-pingtu011910-catalog-closure-r3
          path: audit/npm-datong-richu-pingtu011910
          if-no-files-found: error
          retention-days: 30
