name: research-sillok-chiljeongsan-embedded-tables

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-sillok-chiljeongsan-embedded-tables.yml"
      - "scripts/research_sillok_chiljeongsan_embedded_tables.py"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch official embedded solar/lunar table images
        run: python scripts/research_sillok_chiljeongsan_embedded_tables.py
      - name: Upload no-OCR table evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sillok-chiljeongsan-embedded-tables-${{ github.sha }}
          path: artifacts/sillok-chiljeongsan-embedded-tables/
          if-no-files-found: warn
          retention-days: 7
