name: fast-locate-neige-cangshu-vol5-target-window

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/fast-locate-neige-cangshu-vol5-target-window.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: OCR only the early volume-five target window
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/neige-cangshu-vol5-target-window'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages" "$ROOT/candidates"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra-vert >/dev/null
          python -m pip install --quiet pillow

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-1084-204844%20%E5%85%A7%E9%96%A3%E8%97%8F%E6%9B%B8%E7%9B%AE%E9%8C%84%20%E7%AC%AC2%E5%86%8A.pdf'
          curl -fL --retry 4 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"
          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source-sha256.txt"

          # p2 begins volume five. Restrict to p2-p35; p36 is already visually
          # in later local-gazetteer material. OCR is locator-only.
          pdftoppm -f 2 -l 35 -jpeg -r 125 "$ROOT/source.pdf" "$ROOT/pages/page" >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageEnhance
          import subprocess, json, hashlib, re

          root=Path('audit/neige-cangshu-vol5-target-window')
          pages=sorted(root.joinpath('pages').glob('page-*.jpg'))
          exact_terms=['百夷傳','技藝部','大統歷','參校歷法','七政','天文分野','陰陽氣運',
                       '銅板經','考驗星辰','準齋','准齋','几漏','幾漏','孫逢吉','皇極經世']
          rare_chars=list('百夷技藝統歷七政天文陰陽銅板準齋几漏孫逢吉皇極經世')
          out=[]

          for p in pages:
              # pdftoppm preserves actual PDF page number in suffix.
              m=re.search(r'-(\d+)\.jpg$',p.name)
              pdf_page=int(m.group(1)) if m else None
              im=Image.open(p).convert('L')
              im=ImageOps.autocontrast(im)
              im=ImageEnhance.Contrast(im).enhance(1.45)
              im=im.resize((im.width*2,im.height*2))
              tmp=root/'_one.png'; im.save(tmp)
              proc=subprocess.run(
                ['tesseract',str(tmp),'stdout','-l','chi_tra_vert','--psm','5'],
                stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False)
              txt=proc.stdout.decode('utf-8',errors='replace')
              compact=''.join(txt.split())
              found=[t for t in exact_terms if t in compact]
              score=sum(ch in compact for ch in rare_chars)
              # strongly reward target/neighbor clusters
              for grp in [('百','夷'),('技','藝'),('大','統','歷'),('七','政'),
                          ('準','齋'),('几','漏'),('孫','逢','吉'),('皇','極','經','世')]:
                  if sum(ch in compact for ch in grp) >= max(2,len(grp)-1):
                      score += 6
              if found or score>=10:
                  q=root/'candidates'/f'pdf-{pdf_page:03d}.jpg'
                  q.write_bytes(p.read_bytes())
                  out.append({
                    'pdf_page':pdf_page,'terms':found,'score':score,
                    'context':' '.join(txt.split())[:2200],
                    'page_sha256':hashlib.sha256(p.read_bytes()).hexdigest()
                  })

          report={
            'schema':'NEIGE-CANGSHU-VOL5-TARGET-WINDOW-LOCATOR-R1',
            'source_file':'NLC892-1084-204844 內閣藏書目錄 第2冊.pdf',
            'source_pdf_sha256':hashlib.sha256((root/'source.pdf').read_bytes()).hexdigest(),
            'window':'PDF p2-p35 only',
            'received_transcription_locator_sequence':['百夷傳','技藝部','大統歷','七政','準齋几漏新式','孫逢吉','皇極經世衍數'],
            'ocr_authority':'LOCATOR_ONLY_NOT_FINAL_GLYPH_AUTHORITY',
            'candidate_pages':out,
            'negative_claim_authorized':False,
            'final_adjudication':'PENDING_DIRECT_IMAGE_REVIEW'
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          tmp.unlink(missing_ok=True)
          PY

          rm -rf "$ROOT/pages" "$ROOT/source.pdf"

      - name: Upload target-window locator
        uses: actions/upload-artifact@v4
        with:
          name: neige-cangshu-vol5-target-window-r1
          path: audit/neige-cangshu-vol5-target-window
          if-no-files-found: error
          retention-days: 30
