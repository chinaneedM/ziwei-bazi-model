name: verify-tianwen-13iy-firstparty-2114-1-copy-scope
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13IY-KHS-2114-1*'
      - 'docs/FUSION-CHART-HISTORICAL-PROVENANCE-SOURCE-REGISTRY-EXTENSIONS-R1.json'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - 'scripts/verify-tianwen-13iy-official-2114-1-manuscript-conflict.py'
      - 'tests/test_tianwen_13iy_official_2114_1_manuscript_conflict.py'
      - '.github/workflows/verify-tianwen-13iy-firstparty-2114-1-copy-scope.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  scope-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13iy-official-2114-1-manuscript-conflict.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13iy_official_2114_1_manuscript_conflict.py' -v
      - run: python scripts/verify-historical-source-registry-extensions-r1.py
