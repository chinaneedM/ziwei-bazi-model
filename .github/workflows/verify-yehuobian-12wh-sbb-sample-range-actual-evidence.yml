name: verify-yehuobian-12wh-sbb-sample-range-actual-evidence
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12wh-sbb-sample-range-actual-evidence.yml
      - docs/research/MING-DATONG-YEHUOBIAN-12WH-*
      - scripts/verify-yehuobian-sbb1827-range-scope-12wh.py
      - tests/test_yehuobian_sbb1827_range_scope_12wh.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SBB firstparty source range/folio firewall
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-yehuobian-sbb1827-range-scope-12wh.py
          python -m unittest discover -s tests -p 'test_yehuobian_sbb1827_range_scope_12wh.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_sbb1827_coverage_and_nlc_12wg.py' -v
