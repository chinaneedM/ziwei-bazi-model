name: verify-yehuobian-12wj-cadal-original-paratext-image
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12wj-cadal-original-paratext-image.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-SOURCE-REGISTRY-EXTENSIONS-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12WJ-*
      - scripts/verify-yehuobian-cadal-first-fascicle-direct-paratext-12wj.py
      - tests/test_yehuobian_cadal_first_fascicle_direct_paratext_12wj.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed original DJVU/page SHA and physical copy identity
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-cadal-first-fascicle-direct-paratext-12wj.py
          python -m unittest discover -s tests -p 'test_yehuobian_cadal_first_fascicle_direct_paratext_12wj.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_cadal_parallel_source_12vz.py' -v
