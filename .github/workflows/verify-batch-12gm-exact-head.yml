name: verify-batch-12gm-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gm-exact-head.yml
      - docs/research/ZIWEI-LIN-ZHENYUE-2024-TONGJI-TIEQIN-SALE-NEW-MATERIALS-REPORT-SOURCE-BASIS-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-LIN-ZHENYUE-2024-TONGJI-TIEQIN-SALE-NEW-MATERIALS-REPORT-SOURCE-BASIS-BOUNDARY-GM.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GM exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-LIN-ZHENYUE-2024-TONGJI-TIEQIN-SALE-NEW-MATERIALS-REPORT-SOURCE-BASIS-BOUNDARY-GM'
          ep=Path('docs/research/ZIWEI-LIN-ZHENYUE-2024-TONGJI-TIEQIN-SALE-NEW-MATERIALS-REPORT-SOURCE-BASIS-BOUNDARY-R1.json')
          dp=Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-LIN-ZHENYUE-2024-TONGJI-TIEQIN-SALE-NEW-MATERIALS-REPORT-SOURCE-BASIS-BOUNDARY-GM.md')
          assert ep.is_file() and dp.is_file()
          e=json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          c=e['conference_handbook_control']
          assert c['stated_organizer']=='同济大学中文系'
          assert c['meeting_start']=='2024-10-25'
          assert c['meeting_end']=='2024-10-27'
          assert c['session_date']=='2024-10-26'
          assert c['session_room']=='云通楼221'
          assert c['speaker']=='林振岳'
          assert c['report_start']=='09:50'
          assert c['report_end']=='10:05'
          assert c['report_title']=='铁琴铜剑楼藏书售归北京图书馆新史料'
          assert c['report_existential_binding']=='CLOSED_AT_PUBLIC_HANDBOOK_LEVEL'
          assert c['report_body_directly_reviewed'] is False

          i=e['independent_meeting_identity_control']
          assert i['provider']=='中国科学院自然科学史研究所'
          assert i['observed_date']=='2024-10-26'
          assert i['observed_place']=='同济大学人文学院，上海'
          assert i['lin_report_title_exposed_on_this_source'] is False

          r=e['relation_to_lin_2025_preface']
          assert r['conference_report_precedes_preface'] is True
          assert r['preface_attests_gao_xizeng_annotated_tieqin_catalog'] is True
          assert r['same_new_materials_basis_as_preface_gao_statement']=='UNRESOLVED'
          assert r['conference_report_used_gao_annotated_catalog']=='UNRESOLVED'
          assert r['conference_report_target_3482_3483_discussed']=='UNRESOLVED'

          a=e['adjudication']
          assert a['lin_2024_report_existence']=='CLOSED'
          assert a['report_full_text']=='NOT_REVIEWED_NOT_PUBLICLY_RECOVERED'
          assert a['underlying_new_material_identity']=='UNRESOLVED'
          assert a['target_3482_3483_batch_membership']=='UNRESOLVED'
          assert a['target_specific_sale_or_purchase_route_selected'] is False
          assert a['target_specific_donation_route_selected'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          state_schema_version=tuple(int(part) for part in state['schema_version'].split('.'))
          assert state_schema_version >= (1, 199, 0)
          assert bid in state['historical_audit']['completed_batches']

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {
            'EXT-TONGJI-18TH-ANCIENT-BOOK-SALON-2024-LIN-TIEQIN-SALE-REPORT-HANDBOOK',
            'EXT-IHNS-ZHENG-CHENG-2024-TONGJI-18TH-ANCIENT-BOOK-SALON',
          }.issubset(ids)

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['transmission_impact']['acquisition_edge_authorized'] is False
          assert e['transmission_impact']['same_object_edge_authorized'] is False
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_provenance_metadata_defect_count']==14
          assert e['accounting']['repaired_provenance_metadata_defect_count']==14
          PY
