name: probe-batch-12jx-nlc-wenjin-client-search-contract

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12jx-nlc-wenjin-client-search-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bind NLC DOM targets to source-emitted searchFn script
        run: |
          python - <<'PY'
          import hashlib, json, re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests

          UA={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; NLC public client contract)"}
          PAGE_URLS=[
              "https://www.nlc.cn/web/",
              "https://www.nlc.cn/web/ziyuansousuo/index.shtml",
          ]
          def sha(b): return hashlib.sha256(b).hexdigest()
          def dec(raw):
              for enc in ("utf-8","utf-8-sig","gb18030","gbk"):
                  try: return raw.decode(enc),enc
                  except UnicodeDecodeError: pass
              return raw.decode("utf-8","replace"),"utf-8-replacement"
          class Scan(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="script" and d.get("src"): self.scripts.append(d["src"])

          pages=[]; emitted_scripts=[]
          for url in PAGE_URLS:
              r=requests.get(url,headers=UA,timeout=45,allow_redirects=True); r.raise_for_status()
              txt,enc=dec(r.content); sc=Scan(); sc.feed(txt)
              targets={}
              # Accept either data-id before data-href or the reverse order.
              for m in re.finditer(r'<(?:a|span)\b[^>]*>',txt,re.I):
                  tag=m.group(0)
                  mid=re.search(r'data-id=["\'](5001[789]|50020)["\']',tag,re.I)
                  mhref=re.search(r'data-href=["\']([^"\']+)["\']',tag,re.I)
                  if mid and mhref: targets[mid.group(1)]=mhref.group(1)
              scripts=[]
              for src in sc.scripts:
                  u=urljoin(r.url,src)
                  host=urlparse(u).hostname or ""
                  if host.endswith("nlc.cn") and "index.main.js" in u and u not in scripts:
                      scripts.append(u)
                  if host.endswith("nlc.cn") and "index.main.js" in u and u not in emitted_scripts:
                      emitted_scripts.append(u)
              pages.append({
                  "url":url,"http_status":r.status_code,"bytes":len(r.content),"sha256":sha(r.content),
                  "decode_used":enc,"search_target_map":targets,"source_emitted_index_scripts":scripts
              })

          script_rows=[]
          for u in emitted_scripts:
              row={"url":u}
              try:
                  r=requests.get(u,headers=UA,timeout=20,allow_redirects=True)
                  txt,enc=dec(r.content)
                  wenjin_tokens=["id == '50018'","?query=","&secQuery=","&actualQuery=","&searchType=2","&docType=","&isGroup=isGroup","&targetFieldLog=","&fromHome=true"]
                  opac_tokens=["id == '50019'","?request=","&func=find-m","&find_code=WRD","&FIND_BASE=NLC01","&FIND_BASE=NLC09"]
                  row.update({
                      "http_status":r.status_code,"bytes":len(r.content),"sha256":sha(r.content),"decode_used":enc,
                      "searchFn_present":"function searchFn" in txt,
                      "wenjin_branch_direct":all(x in txt for x in wenjin_tokens),
                      "opac_branch_direct":all(x in txt for x in opac_tokens)
                  })
                  if row["wenjin_branch_direct"] and row["opac_branch_direct"]:
                      i=txt.find("function searchFn")
                      row["searchFn_context"]=re.sub(r"\s+"," ",txt[i:i+2600]) if i>=0 else ""
              except Exception as e:
                  row["error_class"]=type(e).__name__; row["error"]=str(e)[:300]
              script_rows.append(row)

          maps=[p["search_target_map"] for p in pages]
          wenjin_route=next((m.get("50018") for m in maps if m.get("50018")),None)
          opac_route=next((m.get("50019") for m in maps if m.get("50019")),None)
          contract_script=next((s for s in script_rows if s.get("wenjin_branch_direct") and s.get("opac_branch_direct")),None)
          closed=bool(wenjin_route and opac_route and contract_script)

          result={
              "pages":pages,
              "source_emitted_index_scripts":script_rows,
              "adjudication":{
                  "named_query_contract_directly_observed":closed,
                  "query_submitted":False,
                  "target_title_query_submitted":False,
                  "target_person_query_submitted":False,
                  "target_date_query_submitted":False
              },
              "contracts":{
                  "wenjin":({
                      "data_id":"50018","route":wenjin_route,"method":"GET",
                      "user_value_parameters":["query","actualQuery"],
                      "fixed_parameters":{"secQuery":"","searchType":"2","docType":"全部","isGroup":"isGroup","targetFieldLog":"全部字段","fromHome":"true"},
                      "script":{"url":contract_script["url"],"bytes":contract_script["bytes"],"sha256":contract_script["sha256"]}
                  } if closed else None),
                  "opac":({
                      "data_id":"50019","route":opac_route,"method":"GET",
                      "user_value_parameters":["request"],
                      "fixed_parameters":{"func":"find-m","find_code":"WRD","FIND_BASE":["NLC01","NLC09"]},
                      "script":{"url":contract_script["url"],"bytes":contract_script["bytes"],"sha256":contract_script["sha256"]}
                  } if closed else None)
              },
              "security":{
                  "login_used":False,"reader_account_used":False,"registration_used":False,
                  "target_query_submitted":False,"private_endpoint_guessed":False,
                  "search_parameter_guessed":False,"captcha_bypass_used":False,"tls_verification_disabled":False
              }
          }
          Path("batch-12jx-nlc-wenjin-client-search-contract.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12jx-nlc-wenjin-client-search-contract
          path: batch-12jx-nlc-wenjin-client-search-contract.json
