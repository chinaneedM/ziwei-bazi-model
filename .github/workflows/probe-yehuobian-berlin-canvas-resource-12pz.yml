name: probe-yehuobian-berlin-canvas-resource-12pz

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-berlin-canvas-resource-12pz.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-resource-access-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Inspect metadata-provided resource URL / IIIF info for five canvases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p berlin-12pz
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.parse,urllib.error
          manifest_url="https://content.staatsbibliothek-berlin.de/dc/PPN334378186X/manifest"
          hdr={"User-Agent":"Tianwen-Historical-Provenance-R1 (read-only metadata/access diagnostics)","Accept":"application/json,image/jpeg,*/*"}
          with urllib.request.urlopen(urllib.request.Request(manifest_url,headers=hdr),timeout=35) as r:
              m=json.load(r)
          canvases=m["sequences"][0]["canvases"]
          assert len(canvases)==38
          out={"source":manifest_url,"scope":"BOUNDARY_ACCESS_PROBE_NO_OCR_NO_GLYPH_READ","data":[]}
          for i in [1,11,17,29,38]:
              c=canvases[i-1]; resource=c["images"][0]["resource"]
              service=resource.get("service") or {}
              if isinstance(service,list):service=service[0] if service else {}
              rid=resource.get("@id") or resource.get("id")
              sid=service.get("@id") or service.get("id")
              entry={"index":i,"label":c.get("label"),"resource_id":rid,"service_id":sid,"resource_format":resource.get("format"),"image_info":None,"probes":[]}
              for typ,url in [("iiif_info",(sid or "")+"/info.json"),("manifest_exact_resource",rid),("service_thumbnail",(sid or "")+"/full/340,/0/default.jpg")]:
                  if not url:continue
                  parsed=urllib.parse.urlparse(url)
                  if parsed.scheme!="https" or parsed.hostname!="content.staatsbibliothek-berlin.de":
                      entry["probes"].append({"type":typ,"url":url,"status":"DISALLOWED_HOST"});continue
                  rec={"type":typ,"url":url}
                  try:
                      req=urllib.request.Request(url,headers=hdr,method="HEAD")
                      with urllib.request.urlopen(req,timeout=20) as r:
                          rec.update(http_status=r.status,content_type=r.headers.get("Content-Type"),content_length=r.headers.get("Content-Length"),final_url=r.geturl())
                  except urllib.error.HTTPError as ex:
                      rec.update(http_status=ex.code,error="HTTPError")
                  except Exception as ex:
                      rec.update(error=type(ex).__name__+":"+str(ex)[:180])
                  entry["probes"].append(rec)
              print("RESOURCE",json.dumps(entry,ensure_ascii=False))
              out["data"].append(entry)
          pathlib.Path("berlin-12pz/source-explicit-image-access-probe.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: berlin-1827-sample-canvas-image-resource-probe-12pz
          path: berlin-12pz/source-explicit-image-access-probe.json
          if-no-files-found: error
          retention-days: 30
