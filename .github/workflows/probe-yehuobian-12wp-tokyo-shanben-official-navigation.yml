name: probe-yehuobian-12wp-tokyo-shanben-official-navigation
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-12wp-tokyo-shanben-official-navigation.yml
      - scripts/probe-yehuobian-12wp-tokyo-shanben-official-navigation.py
      - tests/test_yehuobian_12wp_tokyo_shanben_official_navigation.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict six URL source-only and no printed glyph votes
        run: python -m unittest discover -s tests -p 'test_yehuobian_12wp_tokyo_shanben_official_navigation.py' -v
  capture:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-issued bounded six official bibliographic HTML pages (no OCR/no images)
        run: python scripts/probe-yehuobian-12wp-tokyo-shanben-official-navigation.py --output-dir 12wp-ioc-shanben-official-output
      - name: Preserve original provider metadata pages and access boundary receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 12wp-tokyo-ioc-six-provider-metadata-routes
          path: 12wp-ioc-shanben-official-output/
          retention-days: 30
          if-no-files-found: warn
