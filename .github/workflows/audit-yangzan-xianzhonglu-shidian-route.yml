name: audit-yangzan-xianzhonglu-shidian-route

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-yangzan-xianzhonglu-shidian-route.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Shidian reader page API and bind target physical page
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/yangzan-xianzhonglu-shidian'
          mkdir -p "$ROOT/api" "$ROOT/physical"
          BASE='https://www.shidianguji.com/api/ancientlib/read/book/pages/v2/'
          BOOK='NGJ89241199901864074070'
          REF='https://www.shidianguji.com/book/NGJ89241199901864074070/chapter/1lmbc0ddu2g4r'
          UA='Mozilla/5.0 Tianwen-Provenance-Audit/1.0'
          urls=(
            "$BASE?bookId=$BOOK&startPageNum=115&endPageNum=115&version=1&needCheckVersion=true&isWebpSupported=false"
            "$BASE?bookId=$BOOK&pageIndex=109&pageSize=1&version=1&needCheckVersion=true&isWebpSupported=false"
            "$BASE?bookId=$BOOK&pageIndex=0&pageSize=123&startPageNum=115&endPageNum=115&version=1&needCheckVersion=true&isWebpSupported=false"
            "$BASE?bookId=$BOOK&startPageNum=110&endPageNum=120&version=1&needCheckVersion=true&isWebpSupported=false"
          )
          i=0
          for url in "${urls[@]}"; do
            curl -L --retry 2 --connect-timeout 15 --max-time 60 -A "$UA" -e "$REF" \
              -D "$ROOT/api/$i.headers.txt" -o "$ROOT/api/$i.body" \
              -w '%{http_code}\n%{url_effective}\n%{content_type}\n%{size_download}\n' "$url" \
              | tee "$ROOT/api/$i.curl-result.txt"
            i=$((i+1))
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re, urllib.request
          root=Path('audit/yangzan-xianzhonglu-shidian')
          target_id='7575481384166735924'; target_num=115
          reports=[]; candidates=[]
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          for i in range(4):
              body=(root/'api'/f'{i}.body').read_bytes()
              curl=(root/'api'/f'{i}.curl-result.txt').read_text().splitlines()
              rec={'variant':i,'http_code':curl[0] if curl else None,'content_type':curl[2] if len(curl)>2 else None,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
              try:
                  data=json.loads(body.decode('utf-8'))
                  rec['json']=True
                  for d in walk(data):
                      pid=str(d.get('pageId') or d.get('page_id') or '')
                      try: pnum=int(d.get('pageNum') or d.get('page_num') or -1)
                      except: pnum=-1
                      pic=d.get('picUrl') or d.get('pic_url') or d.get('imageUrl') or d.get('image_url')
                      if pic and (pid==target_id or pnum==target_num):
                          candidates.append({'variant':i,'page_id':pid,'page_num':pnum,'pic_url':pic,'raw':d})
                  rec['target_candidates']=len([x for x in candidates if x['variant']==i])
                  rec['top_keys']=list(data)[:30] if isinstance(data,dict) else []
              except Exception as e:
                  rec['json']=False; rec['parse_error']=repr(e); rec['prefix']=body[:1000].decode('utf-8','replace')
              reports.append(rec)
          # fallback: find signed image URL near target identifiers in raw JSON text
          for i in range(4):
              txt=(root/'api'/f'{i}.body').read_text(encoding='utf-8',errors='replace')
              if target_id in txt or '"pageNum":115' in txt or '"pageNum": 115' in txt:
                  for m in re.finditer(r'https?:\\?/\\?/[^"\\]+(?:png|webp)[^"\\]*',txt):
                      u=m.group(0).replace('\\/','/')
                      if 'ancientlib' in u and not any(x['pic_url']==u for x in candidates):
                          candidates.append({'variant':i,'page_id':'','page_num':target_num,'pic_url':u,'raw':{}})
          opener=urllib.request.build_opener(); opener.addheaders=[('User-Agent','Mozilla/5.0 Tianwen-Provenance-Audit/1.0'),('Referer','https://www.shidianguji.com/')]
          physical=[]
          seen=set()
          for j,c in enumerate(candidates):
              u=c['pic_url']
              if u in seen: continue
              seen.add(u)
              try:
                  with opener.open(u,timeout=60) as r: b=r.read()
                  out=root/'physical'/f'page-115-target-{j}.png'; out.write_bytes(b)
                  physical.append({'file':str(out),'url':u,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'downloaded':True,'source':c})
              except Exception as e:
                  physical.append({'url':u,'downloaded':False,'error':repr(e),'source':c})
          report={'schema':'YANGZAN-XIANZHONGLU-SHIDIAN-PAGE-API-PROBE-R4','target_page_id':target_id,'target_page_num':target_num,'api_reports':reports,'candidates':candidates,'physical_pages':physical,'adjudication_rule':'API response and machine text are locators only; manuscript glyph and number claims require direct visual review of the downloaded target image.'}
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Upload target-page artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yangzan-xianzhonglu-shidian-route
          path: audit/yangzan-xianzhonglu-shidian
          if-no-files-found: error
          retention-days: 30
