name: verify-batch-12ii-exact-head
# Durable exact-head gate; the research probe commit/run is hash-bound in the Batch 12II evidence record.

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ii-exact-head.yml
      - docs/research/ZIWEI-ZJLIB-TIEQIN-2024-OFFICIAL-PDF-TOKEN-ROUTE-ACCESS-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-ZJLIB-TIEQIN-2024-OFFICIAL-PDF-TOKEN-ROUTE-ACCESS-BOUNDARY-II.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending II status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'tianwen/batch-12ii-exact-head',
              description: 'Batch 12II ZJLIB token-route verification running'
            })
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12II exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-ZJLIB-TIEQIN-2024-OFFICIAL-PDF-TOKEN-ROUTE-ACCESS-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-ZJLIB-TIEQIN-2024-OFFICIAL-PDF-TOKEN-ROUTE-ACCESS-BOUNDARY-II'
          assert e['official_public_article']['article_id']==1783
          assert e['official_frontend_contract']['preflight_status_by_attach_type']=={'PDF':1,'PDF_CN':1,'PDF_Mobile':1}
          assert {x['attach_type'] for x in e['exact_head_probe']['route_results']}=={'PDF','PDF_CN','PDF_Mobile'}
          assert all(x['bytes']==3241 and x['sha256']=='9c47ea7957afef955da0248c47be6a49c274287abcbe061a7710d7bcbb9ca999' and x['content_class']=='SERVER_HTTP404_WRAPPER_HTML' and x['pdf_magic'] is False for x in e['exact_head_probe']['route_results'])
          assert e['exact_head_probe']['selected_pdf'] is None
          assert e['access_boundary']['public_direct_pdf_recovered'] is False
          assert e['access_boundary']['direct_article_fulltext_reviewed'] is False
          assert e['object_identity_firewall']['same_object_collapse_authorized'] is False
          assert e['adjudication']['chart_rule_change'] is False
          PY
      - name: Publish success II status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12ii-exact-head',
              description: 'Batch 12II exact-head verification passed'
            })
      - name: Publish failure II status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12ii-exact-head',
              description: 'Batch 12II exact-head verification failed'
            })
