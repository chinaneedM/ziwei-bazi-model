name: research-hanyang-material-use-menu

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-hanyang-material-use-menu.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Expand only the public rendered 자료이용 menu
        shell: python
        run: |
          import json
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          OUT=Path("probe"); OUT.mkdir()
          URL="https://lib.hanyang.ac.kr/"
          LABEL="자료이용"

          opts=Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1800,2400")
          opts.add_argument("--lang=ko-KR")

          result={
            "schema":"ZIWEI-HANYANG-MATERIAL-USE-MENU-R1",
            "source_url":URL,
            "target_biblio_id":484926,
            "authentication_attempted":False,
            "form_submission_attempted":False,
            "route_guessing_attempted":False,
          }

          driver=webdriver.Chrome(options=opts)
          try:
            driver.set_page_load_timeout(90)
            driver.get(URL); time.sleep(8)
            matches=driver.find_elements(By.XPATH,f"//*[normalize-space(text())='{LABEL}']")
            visible=[e for e in matches if e.is_displayed()]
            result["visible_exact_label_count"]=len(visible)
            if visible:
              el=visible[0]
              result["tag"]=el.tag_name
              result["href_before_interaction"]=el.get_attribute("href")
              driver.execute_script("arguments[0].scrollIntoView({block:'center'});",el)
              try:
                webdriver.ActionChains(driver).move_to_element(el).perform()
                time.sleep(2)
              except Exception as exc:
                result["hover_error"]=repr(exc)
              try:
                el.click()
                time.sleep(2)
              except Exception as exc:
                result["click_error"]=repr(exc)

            visible_links=[]
            for a in driver.find_elements(By.CSS_SELECTOR,"a"):
              try:
                if not a.is_displayed(): continue
                txt=" ".join((a.text or "").split())
                href=a.get_attribute("href") or ""
                if txt:
                  visible_links.append({"text":txt[:500],"href":href})
              except Exception:
                pass
            dedup=[]; seen=set()
            for x in visible_links:
              key=(x["text"],x["href"])
              if key not in seen:
                seen.add(key); dedup.append(x)
            result["visible_links_after_interaction"]=dedup[:800]
            result["final_url"]=driver.current_url
            result["title"]=driver.title
            body=driver.find_element(By.TAG_NAME,"body").text
            result["body_text"]=body[:50000]
            driver.save_screenshot(str(OUT/"material-use-menu.png"))
            (OUT/"material-use-menu.html").write_text(driver.page_source,encoding="utf-8")
          finally:
            driver.quit()

          result["adjudication"]={
            "followup_policy":"ONLY_FOLLOW_LINKS_RENDERED_BY_THIS_PUBLIC_MENU",
            "target_page_status":"PENDING_DIRECT_PAGE",
            "algorithm_effect":"NONE"
          }
          (OUT/"hanyang-material-use-menu.json").write_text(
            json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
            "visible_exact_label_count":result.get("visible_exact_label_count"),
            "tag":result.get("tag"),
            "href_before_interaction":result.get("href_before_interaction"),
            "final_url":result.get("final_url"),
            "visible_links_after_interaction":result.get("visible_links_after_interaction"),
            "adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))

      - name: Upload material-use menu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-hanyang-material-use-menu
          path: probe/
          if-no-files-found: warn
          retention-days: 14
