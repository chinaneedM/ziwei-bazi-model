name: verify-tianwen-13ma-bsb-volume1-atlas
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/research/TIANWEN-13MA-BSB-MINGSHI-V1-1910-CANVAS-40-DIRECT-PREVIEW-R1.json
      - scripts/verify-tianwen-13ma-bsb-volume1-atlas.py
      - .github/workflows/verify-tianwen-13ma-bsb-volume1-atlas.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13ma-bsb-volume1-atlas.py
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
