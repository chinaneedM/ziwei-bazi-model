name: research-leibian-nightzi-physical-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-leibian-nightzi-physical-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Acquire public-domain CADAL DJVU and render remaining leaves
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin imagemagick python3-pil
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/CADAL02094403%20%E9%A1%9E%E7%B7%A8%E6%9B%86%E6%B3%95%E9%80%9A%E6%9B%B8%E5%A4%A7%E5%85%A8%EF%BC%88%E4%B8%80%EF%BC%89.djvu'
          curl -L --fail --retry 3 -A 'ziwei-bazi-model historical provenance research/1.8' "$URL" -o leibian.djvu
          sha256sum leibian.djvu | tee sha256.txt
          djvused leibian.djvu -e 'n' | tee page-count.txt
          mkdir -p rendered tmp
          for p in $(seq 36 89); do
            ddjvu -format=tiff -page="$p" -scale=45 leibian.djvu "tmp/p${p}.tif"
            convert "tmp/p${p}.tif" "rendered/p${p}.png"
          done
          python - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          files=sorted(Path('rendered').glob('p*.png'), key=lambda p:int(p.stem[1:]))
          thumbs=[]
          for f in files:
              im=Image.open(f).convert('RGB')
              im.thumbnail((300,460))
              canvas=Image.new('RGB',(320,500),'white')
              canvas.paste(im,((320-im.width)//2,20))
              ImageDraw.Draw(canvas).text((8,480),f.stem,fill='black')
              thumbs.append(canvas)
          cols=5; rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new('RGB',(cols*320,rows*500),'white')
          for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*320,(i//cols)*500))
          sheet.save('contact-sheet-p36-89.jpg',quality=90)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: leibian-nightzi-physical-probe-p36-89
          path: |
            sha256.txt
            page-count.txt
            contact-sheet-p36-89.jpg
            rendered/*.png
          if-no-files-found: error
