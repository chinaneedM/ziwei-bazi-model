name: research-leibian-nightzi-physical-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-leibian-nightzi-physical-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Acquire public-domain CADAL DJVU and locate night-Zi leaf
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/CADAL02094403%20%E9%A1%9E%E7%B7%A8%E6%9B%86%E6%B3%95%E9%80%9A%E6%9B%B8%E5%A4%A7%E5%85%A8%EF%BC%88%E4%B8%80%EF%BC%89.djvu'
          curl -L --fail --retry 3 -A 'ziwei-bazi-model historical provenance research/1.8' "$URL" -o leibian.djvu
          sha256sum leibian.djvu
          djvused leibian.djvu -e 'n' | tee page-count.txt
          (djvutxt leibian.djvu > leibian.txt) || true
          python - <<'PY'
          from pathlib import Path
          t=Path('leibian.txt').read_text(encoding='utf-8',errors='replace') if Path('leibian.txt').exists() else ''
          keys=['半夜子時隔界','上四刻','下四刻','屬本日管','第二日管','授時曆']
          print('TEXT_LEN',len(t))
          for k in keys:
              print('\nKEY',k,'COUNT',t.count(k))
              p=t.find(k)
              if p>=0: print(t[max(0,p-500):p+1200])
          PY
          mkdir -p rendered
          # Render first 35 pages at moderate size; target section is in 卷一 and textually near the opening timekeeping section.
          for p in $(seq 1 35); do ddjvu -format=png -page="$p" -scale=45 leibian.djvu "rendered/p${p}.png"; done
      - uses: actions/upload-artifact@v4
        with:
          name: leibian-nightzi-physical-probe
          path: |
            page-count.txt
            leibian.txt
            rendered/*.png
          if-no-files-found: error
