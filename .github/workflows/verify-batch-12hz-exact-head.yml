name: verify-batch-12hz-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hz-exact-head.yml
      - docs/research/ZIWEI-BEITU1959-1987-ZUOZHUAN-LOCAL-NEIGHBOR-SEQUENCE-CROSSWALK-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-BEITU1959-1987-ZUOZHUAN-LOCAL-NEIGHBOR-SEQUENCE-CROSSWALK-HZ.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending HZ status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tianwen/batch-12hz-exact-head',
              description: 'Batch 12HZ local sequence verification running'
            })

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12HZ exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-BEITU1959-1987-ZUOZHUAN-LOCAL-NEIGHBOR-SEQUENCE-CROSSWALK-HZ'
          e=json.loads(Path('docs/research/ZIWEI-BEITU1959-1987-ZUOZHUAN-LOCAL-NEIGHBOR-SEQUENCE-CROSSWALK-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          s=e['shared_local_sequence']
          assert s['beitu1959_shared_sequence']==['7283','8643','3368','10010']
          assert s['beitu1987_shared_sequence']==['7283','8643','3288','10010']
          assert s['flanking_control_count']==3
          assert s['flanking_numbers_unchanged'] is True
          assert s['shared_relative_order_preserved'] is True
          assert s['target_only_number_difference_within_shared_core'] is True
          a=e['scope_adjudication']
          assert a['blanket_local_arithmetic_offset']=='DISPROVEN'
          assert a['wholesale_local_resequencing_for_shared_four_record_core']=='DISPROVEN'
          assert a['observed_change_scope']=='TARGET_SPECIFIC_WITHIN_SHARED_LOCAL_NEIGHBORHOOD'
          assert a['exact_causal_mechanism']=='UNRESOLVED'
          assert a['candidates_ranked_or_winner_selected'] is False
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,238,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count'] >= 16
          assert state['historical_audit']['repaired_provenance_metadata_defect_count'] >= 16
          PY

      - name: Publish successful HZ status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'tianwen/batch-12hz-exact-head',
              description: 'Batch 12HZ local sequence gates PASS'
            })

      - name: Publish failed HZ status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'tianwen/batch-12hz-exact-head',
              description: 'Batch 12HZ exact-head verification FAILED'
            })

# exact-head refresh: HZ
