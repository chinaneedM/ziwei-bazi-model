name: verify-batch-12ib-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ib-exact-head.yml
      - docs/research/ZIWEI-BEITU1959-CROSSVOLUME-3288-LOCATOR-CALIBRATION-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-BEITU1959-CROSSVOLUME-3288-LOCATOR-CALIBRATION-BOUNDARY-IB.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IB status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tianwen/batch-12ib-exact-head',
              description: 'Batch 12IB locator-calibration boundary verification running'
            })

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12IB exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-BEITU1959-CROSSVOLUME-3288-LOCATOR-CALIBRATION-BOUNDARY-IB'
          e=json.loads(Path('docs/research/ZIWEI-BEITU1959-CROSSVOLUME-3288-LOCATOR-CALIBRATION-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          assert len(e['public_scan_set']['volumes'])==8
          r5=e['probe_history']['r5_eight_volume']
          assert [x['candidate_count'] for x in r5['per_volume']]==[0]*8
          assert r5['known_positive_calibration']['calibration_pass'] is False
          assert r5['zero_candidate_result_usable_as_absence_evidence'] is False
          assert e['probe_history']['r6_r3_embedded_text_calibration']['known_positive_text_layer_pass'] is False
          assert e['probe_history']['r6_r2_conventional_calibration']['positive_variant_count']==0
          assert e['probe_history']['r6_r4_r3_vertical_calibration']['positive_variant_count']==0
          a=e['method_adjudication']
          assert a['whole_catalog_3288_absence_proved'] is False
          assert a['exact_3368_to_3288_causal_mechanism']=='UNRESOLVED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,240,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc']=='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-BEITU1959-CROSSVOLUME-3288-LOCATOR-CALIBRATION-BOUNDARY-IB.md'
          PY

      - name: Publish successful IB status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12ib-exact-head',
              description: 'Batch 12IB locator-calibration boundary gates PASS'
            })

      - name: Publish failed IB status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12ib-exact-head',
              description: 'Batch 12IB exact-head verification FAILED'
            })
