name: verify-batch-12gn-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gn-exact-head.yml
      - docs/research/ZIWEI-NLC-PP446-449-TIEQIN-CITATION-BRIDGE-AND-TOKYO-HOLDING-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-PP446-449-TIEQIN-CITATION-BRIDGE-AND-TOKYO-HOLDING-GN.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GN exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-NLC-PP446-449-TIEQIN-CITATION-BRIDGE-AND-TOKYO-HOLDING-GN'
          ep=Path('docs/research/ZIWEI-NLC-PP446-449-TIEQIN-CITATION-BRIDGE-AND-TOKYO-HOLDING-R1.json')
          dp=Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-PP446-449-TIEQIN-CITATION-BRIDGE-AND-TOKYO-HOLDING-GN.md')
          assert ep.is_file() and dp.is_file()
          e=json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          n=e['nlc_2024_citation_bridge']
          assert n['provider']=='国家图书馆 / 中国古籍保护网'
          assert n['quote_reference_number']==23
          assert n['reference_23']['pages']=='446—449'
          assert n['beijing_library_intake_quote']=='这些善本入藏本馆，本馆中文书藏地位将益形重要，可为全国之冠'
          assert n['preceding_sentence_about_qu_books_made_over_to_government_reference_number']==22
          assert n['preceding_sentence_reference_is_not_1997_pp446_449'] is True
          assert n['direct_1997_page_images_reviewed'] is False
          assert n['direct_1997_page_text_reviewed'] is False

          t=e['tokyo_metropolitan_holding_control']
          assert t['provider']=='東京都立図書館'
          assert t['title']=='北京图书馆馆史资料汇编(二) : 上册'
          assert t['displayed_shelf_sequence']==['0161','1','2-1']
          assert t['page_446_449_images_exposed_on_reviewed_public_surface'] is False
          assert t['project_submitted_copy_request'] is False

          a=e['adjudication']
          assert a['pp446_449_tieqin_context_citation_bridge']=='CLOSED_AT_NLC_HOSTED_MODERN_SCHOLARLY_LAYER'
          assert a['pp446_449_direct_page_collation']=='NOT_REVIEWED'
          assert a['target_specific_sale_or_purchase_route_selected'] is False
          assert a['target_specific_donation_route_selected'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,200,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc']=='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-PP446-449-TIEQIN-CITATION-BRIDGE-AND-TOKYO-HOLDING-GN.md'

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {
            'EXT-NLC-CAI-LI-2024-QU-TIEQIN-BEITU-PP446-449-CITATION-BRIDGE',
            'EXT-TOKYO-METROPOLITAN-1997-BEITU-HISTORY-V2-UPPER-HOLDING',
          }.issubset(ids)

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['transmission_impact']['acquisition_edge_authorized'] is False
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_provenance_metadata_defect_count']==14
          assert e['accounting']['repaired_provenance_metadata_defect_count']==14
          PY
