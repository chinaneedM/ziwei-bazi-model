name: probe-yehuobian-12wt-tokyo-kanseki-search-entry
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-12wt-tokyo-kanseki-search-entry.yml
      - scripts/probe-yehuobian-12wt-tokyo-kanseki-official-search-entry.py
      - tests/test_yehuobian_12wt_tokyo_kanseki_search_entry.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify strictly bounded source route and paper glyph vote firewall
        run: python -m unittest discover -s tests -p 'test_yehuobian_12wt_tokyo_kanseki_search_entry.py' -v
  capture:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture single institution-issued general Hanji catalogue home and form
        run: python scripts/probe-yehuobian-12wt-tokyo-kanseki-official-search-entry.py --output-dir 12wt-kanseki-original
      - name: Preserve original HTML or access-boundary receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-general-kanseki-source-home-12wt
          path: 12wt-kanseki-original/
          retention-days: 30
          if-no-files-found: warn
