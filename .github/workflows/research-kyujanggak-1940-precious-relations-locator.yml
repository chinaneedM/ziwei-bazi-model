name: research-kyujanggak-1940-precious-relations-locator
# locator-fix-rerun-1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1940-precious-relations-locator.yml"
      - "scripts/research_kyujanggak_1940_precious_relations_locator.py"

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Bind 1940 precious-book-relations object
        run: |
          python scripts/research_kyujanggak_1940_precious_relations_locator.py \
            --output artifacts/kyujanggak-1940-precious-relations-locator
      - name: Upload read-only locator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1940-precious-relations-locator-${{ github.sha }}
          path: artifacts/kyujanggak-1940-precious-relations-locator/
          if-no-files-found: warn
          retention-days: 7
