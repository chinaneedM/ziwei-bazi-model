name: verify-tianwen-13ib-field-index
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13IB-*'
      - 'scripts/verify-tianwen-13ib-field-index.py'
      - 'tests/test_tianwen_13ib_field_index.py'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - '.github/workflows/verify-tianwen-13ib-field-index.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/verify-tianwen-13ib-field-index.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13ib_field_index.py' -v
