name: probe-batch-12jj-zhao-wenhui-1951-sass-holding

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12jj-zhao-wenhui-1951-sass-holding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe publication lead, institutional corroboration and SASS holding
        run: |
          python - <<'PY'
          import hashlib, html, json, re, time
          from pathlib import Path
          import requests

          UA={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; public Zhao Wanli Wenhui/SASS holding probe)"}
          SASS="https://lib.sass.org.cn/2577/list.htm"
          TSINGHUA="https://www.tsinghua.org.cn/info/1952/16563.htm"
          MASTERS_HTTPS="https://www.mastersart.org/index.php?a=show&c=index&catid=194&id=3436&m=content"
          MASTERS_HTTP="http://www.mastersart.org/index.php?a=show&c=index&catid=194&id=3436&m=content"

          def clean(raw):
              raw=re.sub(r'<script\b.*?</script>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<style\b.*?</style>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<[^>]+>',' ',raw)
              return re.sub(r'\s+',' ',html.unescape(raw)).strip()

          def decode_response(r):
              candidates=[]
              encs=[]
              ct=r.headers.get("Content-Type","")
              m=re.search(r'charset=([A-Za-z0-9._-]+)',ct,re.I)
              if m:
                  encs.append(m.group(1))
              encs += ["utf-8","gb18030","gbk","big5"]
              seen=set()
              for enc in encs:
                  if not enc or enc.lower() in seen:
                      continue
                  seen.add(enc.lower())
                  try:
                      txt=r.content.decode(enc)
                  except Exception:
                      continue
                  han=sum(1 for ch in txt if '\u4e00' <= ch <= '\u9fff')
                  replacement=txt.count("\ufffd")
                  candidates.append((han,-replacement,enc,txt))
              if not candidates:
                  return r.content.decode("utf-8","replace"),"utf-8-replacement"
              candidates.sort(reverse=True,key=lambda x:(x[0],x[1]))
              return candidates[0][3],candidates[0][2]

          def context(text,needle,radius=260):
              i=text.find(needle)
              if i<0:
                  return None
              return text[max(0,i-radius):min(len(text),i+len(needle)+radius)]

          def fetch(session,url,attempts=3):
              last=None
              for n in range(attempts):
                  try:
                      r=session.get(url,timeout=45,allow_redirects=True)
                      r.raise_for_status()
                      return {"ok":True,"response":r,"error":None,"attempt":n+1}
                  except Exception as e:
                      last=f"{type(e).__name__}: {e}"
                      time.sleep(1+n)
              return {"ok":False,"response":None,"error":last,"attempt":attempts}

          s=requests.Session(); s.headers.update(UA)

          # First-party SASS route is the controlling physical-holding gate.
          fs=fetch(s,SASS)
          if not fs["ok"]:
              raise RuntimeError("SASS first-party holding route failed: "+str(fs["error"]))
          r2=fs["response"]; raw2,enc2=decode_response(r2); t2=clean(raw2)
          sass={
              "decoded_encoding":enc2,
              "url":SASS,
              "status":r2.status_code,
              "bytes":len(r2.content),
              "sha256":hashlib.sha256(r2.content).hexdigest(),
              "paper_directory_marker":"分部1号楼地下室旧报纸" in t2,
              "shanghai_wenhui_1951_full_year":bool(re.search(r'文汇报\s*\|.*?1951年1[－-]12月',t2,re.S)),
              "hongkong_wenhui_marker":"文汇报(香港)" in t2 or "文汇报（香港）" in t2,
              "hongkong_wenhui_1951_only_q1":bool(re.search(r'文汇报\s*[（(]香港[）)]\s*\|.*?1951年1[－-]3月',t2,re.S)),
              "shanghai_context":context(t2,"文汇报"),
              "public_page_specific_19510818_object_observed":False,
              "direct_article_text_observed":False,
              "classification":"FIRST_PARTY_PHYSICAL_NEWSPAPER_HOLDING_ROUTE_ONLY"
          }

          # Tsinghua alumni article corroborates the 1951 article/exhibition identity,
          # but does not close an outlet/date.
          ft=fetch(s,TSINGHUA)
          tsinghua={
              "url":TSINGHUA,
              "fetch_ok":ft["ok"],
              "error":ft["error"],
              "classification":"INSTITUTIONAL_MODERN_RETROSPECTIVE_CORROBORATION_ONLY"
          }
          if ft["ok"]:
              rt=ft["response"]; rawt,enct=decode_response(rt); tt=clean(rawt)
              tsinghua.update({
                  "decoded_encoding":enct,
                  "status":rt.status_code,
                  "bytes":len(rt.content),
                  "sha256":hashlib.sha256(rt.content).hexdigest(),
                  "zhao_wanli_present":"赵万里" in tt,
                  "year_1951_present":"1951" in tt,
                  "article_title_present":"永乐大典" in tt and "展览的意义" in tt,
                  "exhibition_context_present":"展览" in tt,
                  "aug18_present":"8月18日" in tt,
                  "wenhui_present":"文汇报" in tt,
                  "context":context(tt,"展览的意义")
              })

          # Secondary chronology lead: keep transport failure as a route boundary;
          # try both public HTTPS and HTTP forms, never disable TLS verification.
          fm=fetch(s,MASTERS_HTTPS,attempts=2)
          used=MASTERS_HTTPS
          if not fm["ok"]:
              fm=fetch(s,MASTERS_HTTP,attempts=2)
              used=MASTERS_HTTP
          secondary={
              "requested_https_url":MASTERS_HTTPS,
              "final_attempt_url":used,
              "fetch_ok":fm["ok"],
              "error":fm["error"],
              "classification":"SECONDARY_CHRONOLOGY_LEAD_ONLY"
          }
          if fm["ok"]:
              r1=fm["response"]; raw1,enc1=decode_response(r1); t1=clean(raw1)
              secondary.update({
                  "decoded_encoding":enc1,
                  "status":r1.status_code,
                  "final_url":r1.url,
                  "bytes":len(r1.content),
                  "sha256":hashlib.sha256(r1.content).hexdigest(),
                  "page_title_marker":"赵万里先生传略" in t1,
                  "article_title_present":"永乐大典" in t1 and "展览的意义" in t1,
                  "aug18_present":"8月18日" in t1,
                  "shanghai_wenhui_present":"上海《文汇报》" in t1 or "上海《文匯報》" in t1,
                  "context":context(t1,"8月18日")
              })

          out={
              "sass_first_party_holding":sass,
              "tsinghua_retrospective_control":tsinghua,
              "secondary_publication_lead":secondary,
              "adjudication":{
                  "1951_article_identity_institutionally_corrobated":bool(tsinghua.get("article_title_present") and tsinghua.get("year_1951_present")),
                  "1951_08_18_wenhui_publication_directly_proved":False,
                  "1951_08_18_wenhui_publication_secondary_lead_runner_closed":bool(secondary.get("fetch_ok") and secondary.get("aug18_present") and secondary.get("shanghai_wenhui_present")),
                  "sass_1951_shanghai_wenhui_full_year_holding_closed":sass["shanghai_wenhui_1951_full_year"],
                  "shanghai_vs_hongkong_wenhui_disambiguation_closed":sass["hongkong_wenhui_marker"] and sass["hongkong_wenhui_1951_only_q1"],
                  "target_1951_08_18_issue_directly_reviewed":False,
                  "target_article_directly_reviewed":False,
                  "relationship_to_wenwu_cankao_issue9":"UNRESOLVED"
              },
              "security":{
                  "login_used":False,
                  "payment_used":False,
                  "captcha_bypass_used":False,
                  "private_endpoint_guessed":False,
                  "search_endpoint_guessed":False,
                  "tls_verification_disabled":False
              }
          }
          Path("batch-12jj-zhao-wenhui-1951-sass-holding.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12jj-zhao-wenhui-1951-sass-holding
          path: batch-12jj-zhao-wenhui-1951-sass-holding.json
