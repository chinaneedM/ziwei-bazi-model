name: capture-yehuobian-12wi-cadal02096900-first-fascicle-original-paratext
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/capture-yehuobian-12wi-cadal02096900-first-fascicle-original-paratext.yml
      - scripts/probe-yehuobian-cadal-fasc1-paratext-12wi.py
      - tests/test_yehuobian_cadal_fasc1_paratext_12wi.py
      - docs/research/MING-DATONG-YEHUOBIAN-12WI-*
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source boundaries and continuity
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python -m unittest discover -s tests -p 'test_yehuobian_cadal_fasc1_paratext_12wi.py' -v
  capture:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DjVu public original page renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install pillow
      - name: Capture source issued original binary and early/late facsimile pages without OCR
        run: python scripts/probe-yehuobian-cadal-fasc1-paratext-12wi.py --output-dir cadal-12wi-first-fascicle
      - name: Store source file, page atlas and human-inspectable page contacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadal02096900-fasc1-original-page-atlas-12wi
          path: cadal-12wi-first-fascicle/
          if-no-files-found: warn
