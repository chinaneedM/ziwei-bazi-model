name: probe-tianwen-13kz-cadal-siku-original
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-tianwen-13kz-cadal-siku-original.py
      - .github/workflows/probe-tianwen-13kz-cadal-siku-original.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-original-contact-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq djvulibre-bin
      - run: python -m pip install pillow
      - run: python scripts/probe-tianwen-13kz-cadal-siku-original.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13kz-cadal06056956-original-contacts
          path: 13kz-output/
          if-no-files-found: warn
