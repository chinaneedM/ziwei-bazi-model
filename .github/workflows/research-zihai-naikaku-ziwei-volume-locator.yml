name: research-zihai-naikaku-ziwei-volume-locator

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-zihai-naikaku-ziwei-volume-locator.yml

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public Google Books index of Wenguang comparison monograph
        shell: python
        run: |
          import hashlib
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          UA = "Mozilla/5.0 research-only public-book-index locator"
          VOLUME_ID = "RISpDgAAQBAJ"
          PUBLIC_BIB_URL = "https://books.google.com/books?id=RISpDgAAQBAJ"
          TERMS = [
              "論人生時要審的確",
              "论人生时要审的确",
              "上五刻",
              "下五刻",
              "亥時",
              "子時有十刻",
              "文光堂",
              "敦化堂",
              "繼述堂",
              "民國石印本",
              "南陽堂",
          ]

          def fetch(url, max_bytes=4_000_000):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "application/json,text/html,*/*;q=0.8",
                  "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.7",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read(max_bytes)
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "data": b""}

          result = {
              "schema": "ZIWEI-WENGUANG-COMPARISON-BOOK-LATE-ZI-INDEX-LOCATOR-R1",
              "volume_id": VOLUME_ID,
              "title": "紫微斗數全書古訣辨正",
              "author": "潘國森",
              "publication_year": 2017,
              "source_role": "MODERN_SECONDARY_COMPARISON_USING_WENGUANGTANG_WOODBLOCK_FACSIMILE; LOCATOR_ONLY",
              "search_index_is_physical_glyph_authority": False,
              "authentication_or_paywall_bypass_attempted": False,
              "bibliographic_surface": {},
              "queries": [],
          }

          bib = fetch(PUBLIC_BIB_URL)
          data = bib.pop("data")
          text = data.decode("utf-8", "replace") if data else ""
          result["bibliographic_surface"] = {
              **bib,
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest() if data else None,
              "title_present": "紫微斗數全書古訣辨正" in text,
              "author_present": "潘國森" in text,
              "wenguang_present": "文光堂" in text,
          }
          if data:
              (OUT / "wenguang-comparison-book.html").write_bytes(data)

          templates = [
              "https://books.google.com/books?jscmd=SearchWithinVolume2&q={q}&vid={vid}",
              "https://books.google.com/books?id={vid}&jscmd=SearchWithinVolume2&q={q}",
              "https://books.google.com/books?vid={vid}&jscmd=SearchWithinVolume2&q={q}",
          ]
          for term in TERMS:
              attempts = []
              q = urllib.parse.quote(term)
              for template in templates:
                  url = template.format(q=q, vid=VOLUME_ID)
                  row = fetch(url, max_bytes=2_000_000)
                  payload_bytes = row.pop("data")
                  rec = {
                      "url": url,
                      **row,
                      "bytes": len(payload_bytes),
                      "sha256": hashlib.sha256(payload_bytes).hexdigest() if payload_bytes else None,
                  }
                  if payload_bytes:
                      try:
                          payload = json.loads(payload_bytes.decode("utf-8", "replace"))
                          rec["number_of_results"] = payload.get("number_of_results")
                          rec["searchable"] = payload.get("searchable")
                          rec["search_results"] = payload.get("search_results", [])
                      except Exception as exc:
                          rec["parse_error"] = repr(exc)
                  attempts.append(rec)
                  time.sleep(0.1)
              result["queries"].append({"term": term, "attempts": attempts})

          positives = []
          for row in result["queries"]:
              for attempt in row["attempts"]:
                  n = attempt.get("number_of_results")
                  if isinstance(n, int) and n > 0:
                      positives.append({
                          "term": row["term"],
                          "number_of_results": n,
                          "page_ids": [x.get("page_id") for x in attempt.get("search_results", [])],
                          "snippets": [x.get("snippet_text") for x in attempt.get("search_results", [])],
                      })
                      break
          result["positive_index_hits"] = positives
          result["adjudication"] = {
              "late_zi_comparison_locator": "DETERMINE_FROM_POSITIVE_HITS_ONLY",
              "authority_ceiling": "MODERN_SECONDARY_COMPARISON_OR_SEARCH_INDEX_ONLY_NOT_WENGUANG_PHYSICAL_GLYPH",
              "zero_result_as_negative_textual_proof": "FORBIDDEN",
              "hpa_zdate_006_effect": "NONE_UNLESS_FUTURE_DIRECT_PHYSICAL_TARGET_PAGE_IS_BOUND",
              "algorithm_effect": "NONE",
          }
          (OUT / "wenguang-comparison-book-late-zi-index-locator.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "bibliographic_surface": result["bibliographic_surface"],
              "positive_index_hits": positives,
              "term_controls": [
                  {
                      "term": row["term"],
                      "statuses": [a.get("status") for a in row["attempts"]],
                      "searchable": [a.get("searchable") for a in row["attempts"]],
                      "result_counts": [a.get("number_of_results") for a in row["attempts"]],
                      "page_ids": [[x.get("page_id") for x in a.get("search_results", [])] for a in row["attempts"]],
                      "snippets": [[x.get("snippet_text") for x in a.get("search_results", [])] for a in row["attempts"]],
                  }
                  for row in result["queries"]
              ],
          }, ensure_ascii=False, indent=2))

      - name: Upload Wenguang comparison locator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-wenguang-comparison-book-late-zi-index-locator
          path: probe/
          if-no-files-found: warn
          retention-days: 14
