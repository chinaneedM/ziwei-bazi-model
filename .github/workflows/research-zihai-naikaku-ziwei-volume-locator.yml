name: research-zihai-naikaku-ziwei-volume-locator

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-zihai-naikaku-ziwei-volume-locator.yml

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public standalone Google Books Fullbook object
        shell: python
        run: |
          import hashlib
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          UA = "Mozilla/5.0 research-only public-book-index locator"
          VOLUME_ID = "kxdy0QEACAAJ"
          PUBLIC_BIB_URL = "https://books.google.com/books?id=kxdy0QEACAAJ"
          TARGET_TITLE = "新鋟希夷陳先生紫微斗數全書"
          TARGET_TERMS = [
              "新鋟希夷陳先生紫微斗數全書",
              "新鋟希夷陳先生紫微斗数全書",
              "紫微斗數全書",
              "紫微斗数全书",
              "論人生時要審的確",
              "论人生时要审的确",
              "上五刻",
              "下五刻",
              "亥時",
              "子時有十刻",
              "南陽堂較梓",
              "紅葉山文庫",
              "陳摶",
              "潘希尹",
          ]

          def fetch(url, max_bytes=5_000_000):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "application/json,text/html,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read(max_bytes)
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "data": b""}

          result = {
              "schema": "ZIHAI-NAIKAKU-ZIWEI-GOOGLE-BOOKS-STANDALONE-FULLBOOK-PROBE-R1",
              "volume_id": VOLUME_ID,
              "volume_id_origin": "PUBLIC_GOOGLE_BOOKS_SEARCH_RESULT_WITH_EXACT_FULLBOOK_TITLE_AND_2016_PUBLICATION_YEAR",
              "public_bibliographic_url": PUBLIC_BIB_URL,
              "identifier_guessing_attempted": False,
              "authentication_or_paywall_bypass_attempted": False,
              "bibliographic_surface": {},
              "search_within_volume": [],
              "embedded_viewer_tokens": {},
          }

          bib = fetch(PUBLIC_BIB_URL)
          data = bib.pop("data")
          text = data.decode("utf-8", "replace") if data else ""
          result["bibliographic_surface"] = {
              **bib,
              "bytes": len(data),
              "sha256": hashlib.sha256(data).hexdigest() if data else None,
              "target_title_present": TARGET_TITLE in text,
              "seven_juan_present": "七卷" in text,
              "published_2016_present": "2016" in text,
          }
          for key, pattern in {
              "page_ids": r'page[_-]?id[^A-Za-z0-9]+([A-Za-z0-9_-]+)',
              "viewer_urls": r'https?://[^\"\'<> ]+(?:jscmd|books.google|books.googleusercontent)[^\"\'<> ]*',
          }.items():
              matches = []
              for match in re.findall(pattern, text, flags=re.I):
                  value = match if isinstance(match, str) else match[0]
                  if value not in matches:
                      matches.append(value)
              result["embedded_viewer_tokens"][key] = matches[:100]
          if data:
              (OUT / "google-books-standalone-fullbook.html").write_bytes(data)

          templates = [
              "https://books.google.com/books?jscmd=SearchWithinVolume2&q={q}&vid={vid}",
              "https://books.google.com/books?id={vid}&jscmd=SearchWithinVolume2&q={q}",
              "https://books.google.com/books?vid={vid}&jscmd=SearchWithinVolume2&q={q}",
          ]
          for term in TARGET_TERMS:
              attempts = []
              q = urllib.parse.quote(term)
              for template in templates:
                  url = template.format(q=q, vid=VOLUME_ID)
                  row = fetch(url, max_bytes=2_000_000)
                  payload_bytes = row.pop("data")
                  rec = {
                      "url": url,
                      **row,
                      "bytes": len(payload_bytes),
                      "sha256": hashlib.sha256(payload_bytes).hexdigest() if payload_bytes else None,
                  }
                  if payload_bytes:
                      try:
                          payload = json.loads(payload_bytes.decode("utf-8", "replace"))
                          rec["number_of_results"] = payload.get("number_of_results")
                          rec["searchable"] = payload.get("searchable")
                          rec["search_results"] = payload.get("search_results", [])
                      except Exception as exc:
                          rec["parse_error"] = repr(exc)
                  attempts.append(rec)
                  time.sleep(0.1)
              result["search_within_volume"].append({"term": term, "attempts": attempts})

          positives = []
          for row in result["search_within_volume"]:
              for attempt in row["attempts"]:
                  n = attempt.get("number_of_results")
                  if isinstance(n, int) and n > 0:
                      positives.append({
                          "term": row["term"],
                          "number_of_results": n,
                          "page_ids": [x.get("page_id") for x in attempt.get("search_results", [])],
                          "snippets": [x.get("snippet_text") for x in attempt.get("search_results", [])],
                      })
                      break

          result["positive_index_hits"] = positives
          result["adjudication"] = {
              "standalone_record_role": "DIRECT_2016_BIBLIOGRAPHIC_OBJECT_FOR_TARGET_FULLBOOK_TITLE",
              "relationship_to_zihai_naikaku_set": "SUPPORTED_BY_EXTERNAL_OFFICIAL_SDU_FACSIMILE_CATALOG_BUT_NOT_INFERRED_FROM_GOOGLE_OBJECT_ALONE",
              "positive_index_hit_role": "TARGET_PASSAGE_LOCATOR_ONLY_NOT_GLYPH_AUTHORITY",
              "zero_result_as_negative_textual_proof": "FORBIDDEN",
              "target_physical_page_status": "NOT_OBSERVED_UNLESS_FUTURE_DIRECT_FACSIMILE_PAGE_IS_BOUND",
              "algorithm_effect": "NONE",
          }

          (OUT / "zihai-naikaku-ziwei-standalone-fullbook-probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "bibliographic_surface": result["bibliographic_surface"],
              "embedded_viewer_tokens": result["embedded_viewer_tokens"],
              "positive_index_hits": positives,
              "term_controls": [
                  {
                      "term": row["term"],
                      "statuses": [a.get("status") for a in row["attempts"]],
                      "searchable": [a.get("searchable") for a in row["attempts"]],
                      "result_counts": [a.get("number_of_results") for a in row["attempts"]],
                      "page_ids": [[x.get("page_id") for x in a.get("search_results", [])] for a in row["attempts"]],
                  }
                  for row in result["search_within_volume"]
              ],
          }, ensure_ascii=False, indent=2))

      - name: Upload standalone Fullbook probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zihai-naikaku-ziwei-google-books-standalone-fullbook-probe
          path: probe/
          if-no-files-found: warn
          retention-days: 14
