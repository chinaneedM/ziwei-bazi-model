name: research-zihai-naikaku-ziwei-volume-locator

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-zihai-naikaku-ziwei-volume-locator.yml

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover Google Books volume objects and search only discovered IDs
        shell: python
        run: |
          import hashlib
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          UA = "Mozilla/5.0 research-only public-book-index locator"
          ISBN = "9787550624016"
          TARGET_TERMS = [
              "新鋟希夷陳先生紫微斗數全書",
              "新鋟希夷陳先生紫微斗数全書",
              "紫微斗數全書",
              "紫微斗数全书",
              "陳摶 潘希尹",
              "陈抟 潘希尹",
          ]
          DISCOVERY_QUERIES = [
              f"isbn:{ISBN}",
              "intitle:子海珍本编 海外卷 日本 内阁文库",
              "intitle:子海珍本編 海外卷 日本 內閣文庫",
              "子海珍本编 凤凰出版社 西山尚志 王震",
          ]

          def fetch(url, max_bytes=5_000_000):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "application/json,text/html,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read(max_bytes)
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "data": b""}

          result = {
              "schema": "ZIHAI-NAIKAKU-ZIWEI-GOOGLE-BOOKS-VOLUME-LOCATOR-R1",
              "isbn": ISBN,
              "identifier_guessing_attempted": False,
              "authentication_or_paywall_bypass_attempted": False,
              "discovery_queries": [],
              "discovered_volume_ids": [],
              "discovered_volume_metadata": [],
              "search_within_discovered_volumes": [],
          }

          seen = {}
          for q in DISCOVERY_QUERIES:
              url = "https://www.googleapis.com/books/v1/volumes?" + urllib.parse.urlencode({
                  "q": q,
                  "maxResults": 40,
                  "printType": "books",
              })
              row = fetch(url)
              data = row.pop("data")
              rec = {
                  "query": q,
                  "url": url,
                  **row,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest() if data else None,
              }
              if data:
                  try:
                      payload = json.loads(data.decode("utf-8", "replace"))
                      rec["totalItems"] = payload.get("totalItems")
                      items = payload.get("items", [])
                      rec["item_ids"] = [x.get("id") for x in items]
                      for item in items:
                          vid = item.get("id")
                          info = item.get("volumeInfo", {})
                          if not vid:
                              continue
                          title = str(info.get("title", ""))
                          publisher = str(info.get("publisher", ""))
                          published = str(info.get("publishedDate", ""))
                          identifiers = info.get("industryIdentifiers", [])
                          idvals = {str(x.get("identifier","")) for x in identifiers if isinstance(x, dict)}
                          relevant = (
                              "子海珍本" in title
                              or ISBN in idvals
                              or ("凤凰出版社" in publisher and published.startswith("2016"))
                          )
                          if relevant:
                              seen[vid] = {
                                  "id": vid,
                                  "title": title,
                                  "subtitle": info.get("subtitle"),
                                  "authors": info.get("authors"),
                                  "publisher": info.get("publisher"),
                                  "publishedDate": info.get("publishedDate"),
                                  "pageCount": info.get("pageCount"),
                                  "industryIdentifiers": identifiers,
                                  "previewLink": info.get("previewLink"),
                                  "infoLink": info.get("infoLink"),
                              }
                  except Exception as exc:
                      rec["parse_error"] = repr(exc)
              result["discovery_queries"].append(rec)
              time.sleep(0.2)

          result["discovered_volume_ids"] = sorted(seen)
          result["discovered_volume_metadata"] = [seen[k] for k in sorted(seen)]

          templates = [
              "https://books.google.com/books?jscmd=SearchWithinVolume2&q={q}&vid={vid}",
              "https://books.google.com/books?id={vid}&jscmd=SearchWithinVolume2&q={q}",
          ]
          for vid in result["discovered_volume_ids"]:
              for term in TARGET_TERMS:
                  attempts = []
                  q = urllib.parse.quote(term)
                  for template in templates:
                      url = template.format(q=q, vid=vid)
                      row = fetch(url, max_bytes=2_000_000)
                      data = row.pop("data")
                      rec = {
                          "url": url,
                          **row,
                          "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest() if data else None,
                      }
                      if data:
                          try:
                              payload = json.loads(data.decode("utf-8", "replace"))
                              rec["number_of_results"] = payload.get("number_of_results")
                              rec["searchable"] = payload.get("searchable")
                              rec["search_results"] = payload.get("search_results", [])
                          except Exception as exc:
                              rec["parse_error"] = repr(exc)
                      attempts.append(rec)
                      time.sleep(0.1)
                  result["search_within_discovered_volumes"].append({
                      "volume_id": vid,
                      "term": term,
                      "attempts": attempts,
                  })

          positives = []
          for row in result["search_within_discovered_volumes"]:
              for attempt in row["attempts"]:
                  n = attempt.get("number_of_results")
                  if isinstance(n, int) and n > 0:
                      positives.append({
                          "volume_id": row["volume_id"],
                          "term": row["term"],
                          "number_of_results": n,
                          "page_ids": [
                              x.get("page_id") for x in attempt.get("search_results", [])
                          ],
                          "snippets": [
                              x.get("snippet_text") for x in attempt.get("search_results", [])
                          ],
                      })
                      break

          result["positive_target_index_hits"] = positives
          result["adjudication"] = {
              "volume_ids_origin": "GOOGLE_BOOKS_API_DISCOVERY_ONLY_NO_ID_GUESSING",
              "positive_index_hit_role": "SUBVOLUME_LOCATOR_ONLY_NOT_GLYPH_AUTHORITY",
              "zero_result_as_negative_textual_proof": "FORBIDDEN",
              "target_physical_page_status": "NOT_OBSERVED_UNLESS_FUTURE_DIRECT_FACSIMILE_PAGE_IS_BOUND",
              "algorithm_effect": "NONE",
          }

          (OUT / "zihai-naikaku-ziwei-volume-locator.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              "discovered_volume_ids": result["discovered_volume_ids"],
              "discovered_volume_metadata": result["discovered_volume_metadata"],
              "positive_target_index_hits": positives,
              "discovery_query_controls": [
                  {
                      "query": x.get("query"),
                      "status": x.get("status"),
                      "totalItems": x.get("totalItems"),
                      "item_ids": x.get("item_ids"),
                  }
                  for x in result["discovery_queries"]
              ],
          }, ensure_ascii=False, indent=2))

      - name: Upload Zihai volume locator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zihai-naikaku-ziwei-google-books-volume-locator
          path: probe/
          if-no-files-found: warn
          retention-days: 14
