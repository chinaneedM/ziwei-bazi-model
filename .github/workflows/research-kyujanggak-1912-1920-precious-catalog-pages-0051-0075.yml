name: research-kyujanggak-1912-1920-precious-catalog-pages-0051-0075

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1912-1920-precious-catalog-pages-0051-0075.yml"

permissions:
  contents: read

jobs:
  page:
    strategy:
      fail-fast: false
      matrix:
        page: ["0051","0052","0053","0054","0055","0056","0057","0058","0059","0060","0061","0062","0063","0064","0065","0066","0067","0068","0069","0070","0071","0072","0073","0074","0075"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi pillow
      - name: Fetch one no-OCR provider page
        run: |
          python scripts/research_kyujanggak_1912_1920_precious_catalog_page.py \
            --page "${{ matrix.page }}" \
            --output "artifacts/page-${{ matrix.page }}"
      - name: Upload provider page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1912-1920-full-page-${{ matrix.page }}-${{ github.sha }}
          path: artifacts/page-${{ matrix.page }}/
          if-no-files-found: warn
          retention-days: 7
