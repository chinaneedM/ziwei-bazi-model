name: render-yongle-dadian-18764-target-page

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-yongle-dadian-18764-target-page.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Download exact public facsimile and render target neighborhood without OCR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pages
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/%E6%B0%B8%E6%A8%82%E5%A4%A7%E5%85%B818764.pdf'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          curl -L --fail --retry 3 -A "$UA" -o out/yongle-dadian-18764.pdf "$URL"
          file out/yongle-dadian-18764.pdf | tee out/file.txt
          pdfinfo out/yongle-dadian-18764.pdf | tee out/pdfinfo.txt
          sha256sum out/yongle-dadian-18764.pdf | tee out/source-sha256.txt
          # Wikisource Page:永樂大典18764.pdf/3 binds the target to PDF page 3.
          for p in 2 3 4; do
            pdftoppm -f "$p" -singlefile -r 300 -jpeg -jpegopt quality=95 out/yongle-dadian-18764.pdf "out/pages/p${p}"
          done
          sha256sum out/pages/* | tee out/page-sha256.txt
      - name: Upload no-OCR physical-scan evidence
        uses: actions/upload-artifact@v4
        with:
          name: yongle-dadian-18764-target-page
          path: out/
          retention-days: 30
