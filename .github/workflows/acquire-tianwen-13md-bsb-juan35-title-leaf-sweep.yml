name: acquire-tianwen-13md-bsb-juan35-title-leaf-sweep
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13md-bsb-juan35-title-leaf-sweep.py
      - docs/research/TIANWEN-13MD-BSB-V1-JUAN35-TITLE-LEAF-BOUNDED-SWEEP-STAGING-R1.json
      - scripts/verify-tianwen-13md-bsb-juan35-sweep-gate.py
      - .github/workflows/acquire-tianwen-13md-bsb-juan35-title-leaf-sweep.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - run: python scripts/verify-tianwen-13md-bsb-juan35-sweep-gate.py
      - run: python scripts/acquire-tianwen-13md-bsb-juan35-title-leaf-sweep.py --out /tmp/tianwen-13md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13md-bsb-v1-juan35-bounded-firstparty-sweep
          path: /tmp/tianwen-13md/
          if-no-files-found: warn
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
