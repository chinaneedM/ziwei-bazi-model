name: probe-shidian-jintai-leibian-edition

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-shidian-jintai-leibian-edition.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Shidian NA09048 Jintai Leibian edition metadata
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/shidian-jintai-leibian-edition'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/responses"
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          npm install --no-save --silent puppeteer-core@24.16.0
          cat > "$ROOT/probe.mjs" <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const root='audit/shidian-jintai-leibian-edition';
          const bookId='NA09048';
          const chapterId='1m6x1jucqj31l';
          const urls=[
            `https://www.shidianguji.com/zh/book/${bookId}`,
            `https://www.shidianguji.com/zh/book/${bookId}/chapter/${chapterId}`
          ];
          const browser=await puppeteer.launch({
            headless:true,
            executablePath:process.env.BROWSER,
            args:['--no-sandbox','--disable-setuid-sandbox']
          });
          const page=await browser.newPage();
          await page.setUserAgent('Mozilla/5.0 Tianwen-Provenance-Audit/1.0');

          const reqs=[], resps=[];
          page.on('request',r=>{
            const u=r.url();
            if(/api\/(ancientlib|book|search)|book\/detail|ancientlib/i.test(u)){
              reqs.push({method:r.method(),url:u,postData:r.postData()||null});
            }
          });
          page.on('response',async r=>{
            const u=r.url();
            if(!/api\/(ancientlib|book|search)|book\/detail|ancientlib/i.test(u)) return;
            let body=null;
            try{ body=(await r.text()).slice(0,2000000); }catch{}
            resps.push({status:r.status(),url:u,body});
          });

          const pages=[];
          for(const u of urls){
            await page.goto(u,{waitUntil:'networkidle2',timeout:90000}).catch(()=>{});
            await new Promise(r=>setTimeout(r,2500));
            const snap=await page.evaluate(()=>({
              href:location.href,
              title:document.title,
              meta:[...document.querySelectorAll('meta')].map(m=>({
                name:m.getAttribute('name'),
                property:m.getAttribute('property'),
                content:m.getAttribute('content')
              })).filter(x=>x.content),
              body:document.body?.innerText?.slice(0,180000)||'',
              scripts:[...document.scripts].map(s=>({
                src:s.src,
                text:!s.src ? (s.textContent||'').slice(0,400000):''
              })),
              locals:Object.fromEntries(Object.keys(localStorage).map(k=>[k,localStorage.getItem(k)?.slice(0,250000)])),
              sessions:Object.fromEntries(Object.keys(sessionStorage).map(k=>[k,sessionStorage.getItem(k)?.slice(0,250000)]))
            }));
            pages.push(snap);
          }

          const parsed=[];
          for(const x of resps){
            if(!x.body) continue;
            try{ parsed.push({url:x.url,status:x.status,json:JSON.parse(x.body)}); }catch{}
          }
          const corpus=JSON.stringify({pages,reqs,resps,parsed});
          const terms=[
            '金臺類編曆法通書大全','金台類編曆法通書大全','熊宗立',
            '萬曆','万历','隆慶','隆庆','嘉靖','正德','弘治','成化',
            '明刻','明刊','刻本','刊本','抄本','寫本','版本','底本',
            '內閣文庫','内阁文库','國立公文書館','国立公文书馆',
            '日本','藏','收藏','來源','来源','NA09048'
          ];
          const hits={};
          for(const t of terms){
            const arr=[];
            let from=0;
            while(true){
              const p=corpus.indexOf(t,from);
              if(p<0) break;
              arr.push(corpus.slice(Math.max(0,p-900),Math.min(corpus.length,p+1800)));
              from=p+t.length;
              if(arr.length>=16) break;
            }
            if(arr.length) hits[t]=arr;
          }

          const report={
            schema:'SHIDIAN-JINTAI-LEIBIAN-NA09048-EDITION-PROBE-R1',
            schema_version:'1.0.0',
            book_id:bookId,
            chapter_id:chapterId,
            source_urls:urls,
            page_snapshots:pages.map(x=>({href:x.href,title:x.title,meta:x.meta,body:x.body})),
            api_requests:reqs,
            api_json_responses:parsed,
            metadata_term_contexts:hits,
            decision_question:'Can this exact source-bound NA09048 physical/digital object be securely dated before the 1578 Sanming witness, or is it a Wanli/later object?',
            evidence_boundary:'Author/work chronology is not physical-copy chronology. Only source-emitted edition/copy metadata may decide the physical witness date. Text transcription may locate table families but may not backdate the witness.',
            ocr_used_for_final_glyph_or_numeric_claims:false
          };
          fs.writeFileSync(root+'/report.json',JSON.stringify(report,null,2));
          for(let i=0;i<resps.length;i++){
            if(resps[i].body) fs.writeFileSync(`${root}/responses/resp-${String(i).padStart(3,'0')}.txt`,resps[i].body);
          }
          console.log(JSON.stringify({
            pages:pages.map(x=>({href:x.href,title:x.title,body_head:x.body.slice(0,1600)})),
            requests:reqs,
            parsed_response_urls:parsed.map(x=>x.url),
            hit_terms:Object.keys(hits)
          },null,2));
          await browser.close();
          JS
          BROWSER="$BROWSER" node "$ROOT/probe.mjs"

      - name: Upload Jintai Leibian edition probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shidian-jintai-leibian-edition
          path: audit/shidian-jintai-leibian-edition
          if-no-files-found: error
          retention-days: 30
