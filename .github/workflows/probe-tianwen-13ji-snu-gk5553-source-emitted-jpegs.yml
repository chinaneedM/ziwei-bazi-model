name: probe-tianwen-13ji-snu-gk5553-source-emitted-jpegs
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'scripts/probe-tianwen-13ji-snu-gk5553-exact-jpegs.py'
      - 'tests/test_tianwen_13ji_snu_gk5553_exact_jpegs.py'
      - '.github/workflows/probe-tianwen-13ji-snu-gk5553-source-emitted-jpegs.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  exact-source-jpegs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -p 'test_tianwen_13ji_snu_gk5553_exact_jpegs.py' -v
      - run: python scripts/probe-tianwen-13ji-snu-gk5553-exact-jpegs.py
        env: {TIANWEN_13JI_OUT: /tmp/tianwen-13ji}
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13ji-snu-gk5553-five-source-emitted-jpegs
          path: /tmp/tianwen-13ji/
          if-no-files-found: error
