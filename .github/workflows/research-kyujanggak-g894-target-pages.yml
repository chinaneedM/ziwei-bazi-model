name: research-kyujanggak-g894-target-pages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-kyujanggak-g894-target-pages.yml"
      - "scripts/research_kyujanggak_g894_target_pages.py"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install transport and image dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi pillow
      - name: Fetch renderer-bound G894 target pages
        run: |
          python scripts/research_kyujanggak_g894_target_pages.py \
            --output artifacts/g894-target-pages
      - name: Upload no-OCR target-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-g894-target-pages-${{ github.sha }}
          path: artifacts/g894-target-pages/
          if-no-files-found: warn
          retention-days: 7
