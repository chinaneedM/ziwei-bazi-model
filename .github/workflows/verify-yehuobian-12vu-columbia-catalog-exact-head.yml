name: verify-yehuobian-12vu-columbia-catalog-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12vu-columbia-catalog-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-SOURCE-REGISTRY-EXTENSIONS-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VU-*
      - scripts/verify-yehuobian-columbia-catalog-gate-12vu.py
      - tests/test_yehuobian_columbia_catalog_gate_12vu.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source scope, registry and continuity
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-yehuobian-columbia-catalog-gate-12vu.py
          python -m unittest discover -s tests -p 'test_yehuobian_columbia_catalog_gate_12vu.py' -v
