name: acquire-nlc-taiyin-tonggui-commons-physical

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/acquire-nlc-taiyin-tonggui-commons-physical.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Acquire NLC Taiyin Tonggui public physical surrogates
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/nlc-taiyin-tonggui-commons-physical'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pdf" "$ROOT/text" "$ROOT/renders"

          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          root=Path('audit/nlc-taiyin-tonggui-commons-physical')
          files=[
            ('vol1','NLC892-411999012050-103144 太陰通軌 第1冊.pdf'),
            ('vol2','NLC892-411999012050-103188 太陰通軌 第2冊.pdf'),
          ]
          rows=[]
          for key,name in files:
              url='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+quote(name)
              rows.append((key,name,url))
          (root/'sources.tsv').write_text(''.join('\t'.join(x)+'\n' for x in rows),encoding='utf-8')
          PY

          while IFS=$'\t' read -r key name url; do
            out="$ROOT/pdf/$key.pdf"
            curl -L --fail --retry 5 --retry-delay 3 --connect-timeout 15 --max-time 240 \
              -A 'Tianwen-Provenance-Audit/1.0' "$url" -o "$out"
            printf '%s\t%s\t%s\n' "$key" "$(wc -c < "$out")" "$name" >> "$ROOT/download-status.tsv"
          done < "$ROOT/sources.tsv"

          sha256sum "$ROOT"/pdf/*.pdf | sort > "$ROOT/pdf.sha256"
          {
            for f in "$ROOT"/pdf/*.pdf; do
              echo "### $f"
              pdfinfo "$f" || true
            done
          } > "$ROOT/pdfinfo.txt"

          for f in "$ROOT"/pdf/*.pdf; do
            key=$(basename "$f" .pdf)
            pdftotext -layout "$f" "$ROOT/text/$key.txt" || true
            pages=$(pdfinfo "$f" | awk -F: '/^Pages:/ {gsub(/ /,"",$2); print $2}')
            printf '%s\t%s\n' "$key" "$pages" >> "$ROOT/page-counts.tsv"
            # Low-resolution page renders for direct visual locator review if text layer is absent/noisy.
            pdftoppm -jpeg -r 72 "$f" "$ROOT/renders/$key" >/dev/null 2>&1 || true
          done

          grep -RniE '冬夏二至|晨昏分立成|晨昏.*立成|日出|半晝|半昼|洪武十七|抱拙子|元統|元统|太陰通軌|太阴通轨' "$ROOT/text" > "$ROOT/text-layer-target-hits.txt" || true

          python - <<'PY'
          from pathlib import Path
          root=Path('audit/nlc-taiyin-tonggui-commons-physical')
          terms=['冬夏二至','晨昏分立成','日出','半晝','半昼','洪武十七','抱拙子','元統','元统']
          out=[]
          for pdf in sorted((root/'pdf').glob('*.pdf')):
              key=pdf.stem
              # Per-page pdftotext allows page locator even when the aggregate text is noisy.
              import subprocess
              info=subprocess.run(['pdfinfo',str(pdf)],capture_output=True,text=True,check=False).stdout
              pages=0
              for line in info.splitlines():
                  if line.startswith('Pages:'):
                      pages=int(line.split(':',1)[1].strip())
              for p in range(1,pages+1):
                  cp=subprocess.run(['pdftotext','-f',str(p),'-l',str(p),'-layout',str(pdf),'-'],
                                    capture_output=True,text=True,check=False)
                  txt=cp.stdout
                  hits=[t for t in terms if t in txt]
                  if hits:
                      out.append(f'{key}\tpage={p}\tterms={";".join(hits)}')
          (root/'page-locator-hits.tsv').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

          printf '%s\n' \
            'SOURCE=Wikimedia Commons NLC Library back up project' \
            'NLC_OBJECT=411999012050' \
            'VOL1=NLC892-411999012050-103144 太陰通軌 第1冊.pdf' \
            'VOL2=NLC892-411999012050-103188 太陰通軌 第2冊.pdf' \
            'LISTING_TITLE=太陰通軌 題抱拙子編' \
            'SCHOLARLY_CONTROL=IHNS 2019 明大統曆法彙編 identifies NLC 元統 太陰通軌 as a Ming Chenghua manuscript' \
            'TRANSCRIPTION_LOCATOR=Shidian book id NGJ892411999012050103144 indexes 太陰通軌 [明]元統編 and the heading 冬夏二至日晨昏分立成鈐' \
            'FINAL_GLYPH_POLICY=pdftotext/Shidian are locator aids only; numerical/glyph claims require direct rendered-page review' \
            'OCR_USED_FOR_FINAL_GLYPH_CLAIMS=false' \
            > "$ROOT/manifest.txt"

      - name: Upload NLC Taiyin physical evidence
        uses: actions/upload-artifact@v4
        with:
          name: nlc-taiyin-tonggui-commons-physical
          path: audit/nlc-taiyin-tonggui-commons-physical/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
