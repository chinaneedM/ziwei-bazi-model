name: acquire-ncl03130-part09-native-book-boundary-13dm
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - "scripts/acquire-ncl03130-part09-native-book-boundary-13dm.py"
      - ".github/workflows/acquire-ncl03130-part09-native-book-boundary-13dm.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-book-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install explicit image dependencies without OCR
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<1.28" "Pillow>=10,<13" requests
      - name: Collate SHA-bound photographed cover and new-book recto
        run: python scripts/acquire-ncl03130-part09-native-book-boundary-13dm.py
      - name: Preserve native PNG and replay manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncl03130-part09-native-book-boundary-13dm
          path: ncl03130-13dm-source-native-book-boundary/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
