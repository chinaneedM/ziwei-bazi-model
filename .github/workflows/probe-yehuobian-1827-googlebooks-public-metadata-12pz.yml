name: probe-yehuobian-1827-googlebooks-public-metadata-12pz

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-1827-googlebooks-public-metadata-12pz.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe exact public catalog and API metadata; never infer target glyphs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 12pz-public-metadata
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.error, urllib.request
          out = pathlib.Path("12pz-public-metadata")
          cases = [
              ("google_books_volume", "https://www.googleapis.com/books/v1/volumes/WHDSi5eMvswC"),
              ("google_books_exact_public_html", "https://books.google.com/books?id=WHDSi5eMvswC"),
              ("google_play_volume", "https://play.google.com/store/books/details?id=WHDSi5eMvswC"),
              ("ndl_18465_catalog", "https://ndlsearch.ndl.go.jp/books/R100000002-I000007607208"),
              ("ndl_1959_edition_catalog", "https://ndlsearch.ndl.go.jp/books/R100000002-I000001008336"),
          ]
          results = []
          for name, url in cases:
              req = urllib.request.Request(url, headers={"User-Agent": "Tianwen-Historical-Provenance-Research/1.0", "Accept": "application/json,text/html"})
              rec = {"name":name,"url":url,"status":"UNVERIFIED","content_type":None,
                     "public_metadata_only":True, "target_leaf_physical_glyphs":"NOT_ATTESTED"}
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      data = resp.read(2_000_001)
                      rec.update(http_status=resp.status,content_type=resp.headers.get("Content-Type"),
                                 truncated=len(data)>2_000_000, sha256=hashlib.sha256(data).hexdigest(),
                                 captured_bytes=min(len(data),2_000_000))
                      if len(data)>2_000_000:
                          rec["status"]="OVERSIZE_TRUNCATED_NOT_PARSED"
                      elif name=="google_books_volume":
                          try:
                              obj=json.loads(data.decode("utf-8"))
                              info=obj.get("volumeInfo") or {}
                              access=obj.get("accessInfo") or {}
                              rec.update(status="JSON_METADATA_RETRIEVED",id=obj.get("id"),
                                  title=info.get("title"),authors=info.get("authors"),
                                  publisher=info.get("publisher"),publishedDate=info.get("publishedDate"),
                                  pageCount=info.get("pageCount"), printType=info.get("printType"),
                                  canonicalVolumeLink=info.get("canonicalVolumeLink"),
                                  infoLink=info.get("infoLink"), previewLink=info.get("previewLink"),
                                  viewability=access.get("viewability"),accessView=access.get("accessViewStatus"),
                                  publicDomain=access.get("publicDomain"))
                          except (ValueError, UnicodeDecodeError) as exc:
                              rec.update(status="JSON_PARSE_FAILED",parse_error=repr(exc))
                      else:
                          rec["status"]="HTTP_RESPONSE_ONLY_HTML_NOT_PHYSICAL_LEAF"
              except urllib.error.HTTPError as e:
                  rec.update(status="HTTP_ERROR",http_status=e.code)
              except Exception as e:
                  rec.update(status="NETWORK_OR_TLS_ERROR",error=f"{type(e).__name__}:{str(e)[:160]}")
              results.append(rec)
          result = {
            "schema":"MING-DATONG-YEHUOBIAN-12PZ-PUBLIC-METADATA-PROBE-R1",
            "scope":"PUBLIC_ANONYMOUS_METADATA_ONLY_NO_LOGIN_NO_OCR_NO_BOOK_PAGE_DERIVATION",
            "queries":results,
            "google_books_id":"WHDSi5eMvswC",
            "version_identity_from_marketing_title":"NOT_SUFFICIENT",
            "target_section_volume_or_page":"UNVERIFIED",
            "physical_1827_copy_identity":"UNVERIFIED",
            "direct_target_glyph_witnesses":0,
            "algorithm_change_authorized":False
          }
          (out/"probe.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"statuses":{x["name"]:x["status"] for x in results}},ensure_ascii=False))
          PY
      - name: Upload bounded public metadata probe report
        uses: actions/upload-artifact@v4
        with:
          name: yehuobian-1827-public-metadata-probe-12pz
          path: 12pz-public-metadata/probe.json
          retention-days: 30
          if-no-files-found: error
