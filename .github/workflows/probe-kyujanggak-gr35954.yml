name: probe-kyujanggak-gr35954

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-kyujanggak-gr35954.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract exact KOSTMA source bindings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html as htmlmod
          import re, urllib.parse, urllib.request
          headers={'User-Agent':'Mozilla/5.0'}
          for uid in ('DIC_A3_000150','DIC_A3_000151'):
              url='https://kostma.aks.ac.kr/dic/dicView.aspx?searchid='+uid
              print('===',uid,'===')
              try:
                  text=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30).read().decode('utf-8','replace')
              except Exception as exc:
                  print('FETCH_ERROR',type(exc).__name__,str(exc))
                  continue
              for m in re.finditer(r'new_window\s*\(\s*["\']([^"\']+)["\']',htmlmod.unescape(text),re.I):
                  print('SOURCE_BINDING',m.group(1))
              for m in re.finditer(r'(?:cn|searchid|bookid|book_id|id)=([A-Za-z0-9_\-]+)',htmlmod.unescape(text),re.I):
                  if any(k in m.group(1).upper() for k in ('GR','DIC')):
                      print('IDENTIFIER',m.group(0))
          PY
      - name: Probe Kyujanggak GR35954 physical route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html as htmlmod
          import re, ssl, urllib.error, urllib.request
          urls=[
            'http://e-kyujanggak.snu.ac.kr/MOK/CONVIEW.jsp?ptype=list&subtype=oo&lclass=01&mclass=B124&sclass=G&ntype=oo&cn=GR35954_00',
            'https://e-kyujanggak.snu.ac.kr/MOK/CONVIEW.jsp?ptype=list&subtype=oo&lclass=01&mclass=B124&sclass=G&ntype=oo&cn=GR35954_00'
          ]
          headers={'User-Agent':'Mozilla/5.0'}
          for url in urls:
              print('=== ROUTE',url,'===')
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as r:
                      raw=r.read()
                      final=r.geturl()
                      status=getattr(r,'status',None)
                      ctype=r.headers.get('Content-Type','')
                  print('STATUS',status)
                  print('FINAL_URL',final)
                  print('CONTENT_TYPE',ctype)
                  print('BYTES',len(raw))
                  text=raw.decode('utf-8','replace')
                  print('TITLE',next(iter(re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)),''))
                  clean=htmlmod.unescape(re.sub(r'<[^>]+>',' ',text))
                  clean=re.sub(r'\s+',' ',clean)
                  for key in ('大統曆日通軌','대통력일통궤','GR35954','청구기호','請求記號','소장','刊寫地','版種','刊年','세종','甲寅字','갑인자'):
                      pos=clean.find(key)
                      if pos>=0:
                          print('TEXT',key,clean[max(0,pos-1200):pos+5000])
                  for tag in re.findall(r'<(?:a|img|iframe|frame|script|input|form|button)\b[^>]*>',text,re.I):
                      norm=htmlmod.unescape(re.sub(r'\s+',' ',tag))
                      if any(k in norm.lower() for k in ('gr35954','image','img','viewer','view','mok','kyuj','book','page','cn=')):
                          print('TAG',norm[:6000])
                  for u in re.findall(r'https?://[^\s<>"\']+',htmlmod.unescape(text),re.I):
                      if any(k in u.lower() for k in ('kyuj','image','viewer','mok','gr35954')):
                          print('URL',u[:6000])
              except Exception as exc:
                  print('ROUTE_ERROR',type(exc).__name__,str(exc))
          PY
