name: verify-yehuobian-12uv-kyoto-letters-inquiry-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12uv-kyoto-letters-inquiry-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UV-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UV-*.md
      - scripts/verify-yehuobian-kyoto-letters-inquiry-12uv.py
      - tests/test_yehuobian_kyoto_letters_inquiry_12uv.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continuity, provenance, genealogy
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Kyoto item-specific preflight and 12 regression tests
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-kyoto-letters-inquiry-12uv.py
          python -m unittest discover -s tests -p 'test_yehuobian_kyoto_letters_inquiry_12uv.py' -v
