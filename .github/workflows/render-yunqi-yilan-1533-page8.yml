name: render-yunqi-yilan-1533-page8

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-yunqi-yilan-1533-page8.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Download and render physical target without OCR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/%E7%BA%8C%E4%BF%AE%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E7%AC%AC0983%E5%86%8A.pdf'
          curl -L --fail --retry 3 --retry-delay 2 "$url" -o evidence/xuxiu_siku_0983.pdf
          sha256sum evidence/xuxiu_siku_0983.pdf | tee evidence/source.sha256
          pdfinfo evidence/xuxiu_siku_0983.pdf | tee evidence/pdfinfo.txt
          pdftoppm -f 8 -l 8 -png -r 180 -singlefile evidence/xuxiu_siku_0983.pdf evidence/yunqi-yilan-p8
          sha256sum evidence/yunqi-yilan-p8.png | tee evidence/page.sha256
          printf 'NO_OCR_USED=true\nSOURCE_ROLE=1533_CHENGQIAO_PRINT_FACSIMILE_SEASONAL_EXTREMA_PHYSICAL_CONTROL\nPDF_PAGE=8\nTARGET_HEADING=論四時氣候\n' > evidence/manifest.txt
      - name: Upload page evidence
        uses: actions/upload-artifact@v4
        with:
          name: yunqi-yilan-1533-page8-seasonal-extrema
          path: |
            evidence/source.sha256
            evidence/pdfinfo.txt
            evidence/yunqi-yilan-p8.png
            evidence/page.sha256
            evidence/manifest.txt
          if-no-files-found: error
          retention-days: 30
