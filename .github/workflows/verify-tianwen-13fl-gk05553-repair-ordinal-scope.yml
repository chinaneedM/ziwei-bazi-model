name: verify-tianwen-13fl-gk05553-repair-ordinal-scope
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - docs/research/TIANWEN-13FL-GK05553-REPLACEMENT-BOOK-ORDINAL-28-29-SOURCE-SCOPE-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - scripts/verify-tianwen-13fl-gk05553-repair-ordinal-scope.py
      - scripts/verify-tianwen-13fk-ncl-fourfen-p74-crossphoto.py
      - tests/test_verify_tianwen_13fl_gk05553_repair_ordinal_scope.py
      - .github/workflows/verify-tianwen-13fl-gk05553-repair-ordinal-scope.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-scope-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record exact head and tree
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Preserve first-party vs secondary book ordinal boundaries
        run: |
          python -m py_compile scripts/verify-tianwen-13fl-gk05553-repair-ordinal-scope.py tests/test_verify_tianwen_13fl_gk05553_repair_ordinal_scope.py
          python scripts/verify-tianwen-13fl-gk05553-repair-ordinal-scope.py
          python -m unittest discover -s tests -p 'test_verify_tianwen_13fl_gk05553_repair_ordinal_scope.py' -v
      - name: Preserve archived 13FK source-original photo replay
        run: |
          python scripts/verify-tianwen-13fk-ncl-fourfen-p74-crossphoto.py
          python -m unittest discover -s tests -p 'test_verify_tianwen_13fk_ncl_fourfen_p74_crossphoto.py' -v
