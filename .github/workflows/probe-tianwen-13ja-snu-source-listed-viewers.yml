name: probe-tianwen-13ja-snu-source-listed-viewers
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'scripts/probe-tianwen-13ja-snu-source-listed-viewers.py'
      - 'tests/test_tianwen_13ja_snu_source_listed_viewers.py'
      - '.github/workflows/probe-tianwen-13ja-snu-source-listed-viewers.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-viewer-route:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -p 'test_tianwen_13ja_snu_source_listed_viewers.py' -v
      - run: python scripts/probe-tianwen-13ja-snu-source-listed-viewers.py
        env: {TIANWEN_13JA_OUT: /tmp/tianwen-13ja-snu}
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13ja-snu-gk5554-source-listed-vol17-vol18-viewer
          path: /tmp/tianwen-13ja-snu/
          if-no-files-found: error
