name: research-g893-lee-jing-1998-journal

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-g893-lee-jing-1998-journal.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve 1998-02 issue and specialist article
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          BASE = "https://zgks.cbpt.cnki.net"
          YEAR = "1998"
          ISSUE = "02"
          YEAR_ID = "adaf0591-da7f-47b1-a26b-f97893bc2011"
          ISSUE_ID = "081bfc10-b643-4702-9389-346193d8815e"
          UA = "Mozilla/5.0 research-only historical bibliography probe"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read()
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "data": b""}

          urls = {
              "index": BASE + "/portal/journal/portal/client/index",
              "guokan_list": BASE + "/portal/journal/portal/client/guokan_list?" + urllib.parse.urlencode({
                  "year": YEAR, "issue": ISSUE, "yearId": YEAR_ID, "issueId": ISSUE_ID,
              }),
              "paperback_list": BASE + "/portal/journal/portal/client/paperback_list?" + urllib.parse.urlencode({
                  "year": YEAR, "issue": ISSUE, "yearId": YEAR_ID, "issueId": ISSUE_ID, "pageNum": "1",
              }),
          }

          summary = {
              "schema": "G893-LEE-JING-1998-JOURNAL-ISSUE-RESOLUTION-R2",
              "official_archive": BASE,
              "year": YEAR,
              "issue": ISSUE,
              "year_id": YEAR_ID,
              "issue_id": ISSUE_ID,
              "ocr_used": False,
              "paywall_or_auth_bypass_attempted": False,
              "targets": {},
              "article_candidates": [],
          }
          pages = {}
          for key, url in urls.items():
              r = get(url)
              data = r.pop("data")
              summary["targets"][key] = {
                  **r,
                  "url": url,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest() if data else None,
              }
              text = data.decode("utf-8", "replace")
              pages[key] = text
              (OUT / f"{key}.html").write_text(text, encoding="utf-8")

          index = pages.get("index", "")
          expected_call = "guokanTurnPageList('1998', '02', 'adaf0591-da7f-47b1-a26b-f97893bc2011','081bfc10-b643-4702-9389-346193d8815e')"
          summary["issue_binding"] = {
              "expected_inline_call_present": expected_call in index,
              "year_id": YEAR_ID,
              "issue_id": ISSUE_ID,
          }

          combined_issue = "\n".join([pages.get("guokan_list", ""), pages.get("paperback_list", "")])
          paper_pattern = re.compile(r'/portal/journal/portal/client/paper/([0-9a-f]{32})', re.I)
          ids = []
          for m in paper_pattern.finditer(combined_issue):
              if m.group(1) not in ids:
                  ids.append(m.group(1))

          title_terms = [
              "朝鮮奎章閣本的〈授時曆立成〉",
              "朝鮮奎章閣本的《授時曆立成》",
              "朝鲜奎章阁本的〈授时历立成〉",
              "朝鲜奎章阁本的《授时历立成》",
              "授時曆立成",
              "授时历立成",
          ]
          author_terms = ["李銀姬", "李银姬", "景冰"]

          issue_contexts = []
          for term in title_terms + author_terms:
              start = 0
              while True:
                  i = combined_issue.find(term, start)
                  if i < 0:
                      break
                  issue_contexts.append({
                      "term": term,
                      "context": re.sub(r"\s+", " ", combined_issue[max(0, i-500):i+900]),
                  })
                  start = i + len(term)
                  if sum(x["term"] == term for x in issue_contexts) >= 10:
                      break
          summary["issue_term_contexts"] = issue_contexts

          for paper_id in ids:
              url = BASE + "/portal/journal/portal/client/paper/" + paper_id
              r = get(url)
              data = r.pop("data")
              text = data.decode("utf-8", "replace")
              (OUT / f"paper-{paper_id}.html").write_text(text, encoding="utf-8")
              normalized = html.unescape(re.sub(r"<[^>]+>", " ", text))
              normalized = re.sub(r"\s+", " ", normalized)
              title_hits = [t for t in title_terms if t in normalized]
              author_hits = [t for t in author_terms if t in normalized]
              cnki_links = sorted(set(html.unescape(x) for x in re.findall(r'https?://[^"\'<>\s]+', text, re.I) if "cnki" in x.lower()))
              image_links = sorted(set(
                  urllib.parse.urljoin(BASE + "/", html.unescape(x))
                  for x in re.findall(r'<img[^>]+src=["\']([^"\']+)["\']', text, re.I)
              ))
              cand = {
                  "paper_id": paper_id,
                  "url": url,
                  "transport": {**r, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest() if data else None},
                  "title_hits": title_hits,
                  "author_hits": author_hits,
                  "is_target_candidate": bool(title_hits and author_hits),
                  "cnki_links": cnki_links[:50],
                  "image_links": image_links[:100],
              }
              summary["article_candidates"].append(cand)

          target_candidates = [x for x in summary["article_candidates"] if x["is_target_candidate"]]
          if not target_candidates:
              # Fallback: issue pages can carry titles without rendering every paper into a direct link.
              # Record candidate links adjacent to target strings without guessing a paper UUID.
              contexts = []
              for term in title_terms + author_terms:
                  for m in re.finditer(re.escape(term), combined_issue):
                      block = combined_issue[max(0, m.start()-1200):m.end()+1800]
                      links = sorted(set(paper_pattern.findall(block)))
                      contexts.append({"term": term, "paper_ids_nearby": links, "context": re.sub(r"\s+", " ", block)[:5000]})
              summary["fallback_target_contexts"] = contexts

          summary["conclusion"] = {
              "official_1998_02_issue_resolved": summary["issue_binding"]["expected_inline_call_present"],
              "issue_paper_id_count": len(ids),
              "target_candidate_count": len(target_candidates),
              "target_paper_ids": [x["paper_id"] for x in target_candidates],
              "direct_fulltext_authorized": False,
              "g893_target_page_effect": "NONE_UNLESS_TARGET_ARTICLE_PUBLICLY_EXPOSES_REVIEWABLE_G893_FIGURE_OR_PAGE",
              "numeric_target_effect": "NONE",
          }
          (OUT / "summary.json").write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(summary["conclusion"], ensure_ascii=False, indent=2))

      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: g893-lee-jing-1998-journal-issue-probe
          path: probe/
          if-no-files-found: error
          retention-days: 30
