name: research-zhangguo-fudan-bb-contract-probe

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-zhangguo-fudan-bb-contract-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract source-emitted Fudan search contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          import requests

          url = 'https://guji.fudan.edu.cn/assets/index-DkZo_2Ya.js'
          s = requests.Session()
          s.headers['User-Agent'] = 'Mozilla/5.0 provenance-research/1.0'
          r = s.get(url, timeout=30)
          r.raise_for_status()
          text = r.text
          needles = [
              '/guji/gujisearch/mingGuji',
              '/guji/gujisearch/qingGuji',
              '/guji/gujisearch/sikuGuji',
              'baseURL',
              'mingGuji',
          ]
          contexts = []
          for needle in needles:
              start = 0
              while True:
                  i = text.find(needle, start)
                  if i < 0:
                      break
                  contexts.append({
                      'needle': needle,
                      'offset': i,
                      'context': text[max(0, i-1800): min(len(text), i+len(needle)+1800)]
                  })
                  start = i + len(needle)
                  if sum(1 for x in contexts if x['needle'] == needle) >= 12:
                      break

          # Collect endpoint-adjacent literal strings and obvious axios/fetch call fragments.
          interesting = []
          for c in contexts:
              ctx = c['context']
              lits = re.findall(r'''[\"']([^\"'\\]{1,500})[\"']''', ctx)
              interesting.append({
                  'needle': c['needle'],
                  'offset': c['offset'],
                  'literals': lits[:120],
                  'method_tokens': sorted(set(re.findall(r'\b(?:get|post|put|delete|patch|request|params|data|headers|method|baseURL)\b', ctx, flags=re.I))),
              })

          out = {
              'schema': 'ZIWEI-ZHANGGUO-FUDAN-1594-PUBLIC-SEARCH-CONTRACT-PROBE-R1',
              'source_url': url,
              'source_status': r.status_code,
              'source_bytes': len(r.content),
              'source_sha256': hashlib.sha256(r.content).hexdigest(),
              'policy': {
                  'source_emitted_contract_only': True,
                  'endpoint_invocation_in_this_probe': False,
                  'hidden_id_guessing': False,
              },
              'contexts': contexts,
              'context_literature': interesting,
          }
          p = Path('docs/research/ZIWEI-ZHANGGUO-FUDAN-1594-PUBLIC-SEARCH-CONTRACT-PROBE-R1.json')
          p.write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'contexts': len(contexts), 'sha256': out['source_sha256']}, ensure_ascii=False))
          PY
      - name: Commit contract evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/ZIWEI-ZHANGGUO-FUDAN-1594-PUBLIC-SEARCH-CONTRACT-PROBE-R1.json
          git commit -m "record Batch 12BB Fudan public search contract"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
