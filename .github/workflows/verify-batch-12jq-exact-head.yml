name: verify-batch-12jq-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12jq-exact-head.yml
      - .github/workflows/probe-batch-12jq-cnbksy-2020-public-api-sample-bundle.yml
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-CNBKSY-2020-PUBLIC-API-SAMPLE-BUNDLE-JQ.md
      - docs/research/ZIWEI-CNBKSY-2020-PUBLIC-API-SAMPLE-BUNDLE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending JQ status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'tianwen/batch-12jq-exact-head', description: 'Batch 12JQ exact-head verification running'})
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify 12JQ
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-CNBKSY-2020-PUBLIC-API-SAMPLE-BUNDLE-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-CNBKSY-2020-PUBLIC-API-SAMPLE-BUNDLE-JQ'
          assert e['controlling_probe']['workflow_run_id']==36836265483
          assert e['public_bundle']['http_status']==200
          assert e['public_bundle']['response_sha256']=='202429192ac1eb96193595099efb585e3221cea1d89726758f521c50f3013d79'
          assert e['public_bundle']['entry_count']==3
          assert e['inspection_scope']['pdf_body_text_reviewed'] is False
          assert e['inspection_scope']['credential_values_used'] is False
          assert e['adjudication']['current_2026_api_key_boundary_remains_controlling'] is True
          assert e['adjudication']['target_query_submitted'] is False
          assert e['project_consequence']['product_change'] is False
          PY
      - name: Publish success JQ status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'success', context: 'tianwen/batch-12jq-exact-head', description: 'Batch 12JQ exact-head verification passed'})
      - name: Publish failure JQ status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'failure', context: 'tianwen/batch-12jq-exact-head', description: 'Batch 12JQ exact-head verification failed'})
