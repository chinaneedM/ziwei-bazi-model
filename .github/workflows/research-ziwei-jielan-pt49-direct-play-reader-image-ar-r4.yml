name: research-ziwei-jielan-pt49-direct-play-reader-image-ar-r4

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-jielan-pt49-direct-play-reader-image-ar-r4.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch only Play reader source-emitted PT48 PT49 PT50 signed images
        shell: python
        run: |
          import hashlib, json, re, urllib.request
          from pathlib import Path

          out=Path("batch12ar-r4"); out.mkdir(exist_ok=True)
          vid="rZRcCwAAQBAJ"
          reader_url="https://play.google.com/books/reader?id="+vid+"&hl=zh-TW&source=gbs_vpt_read"

          def get(url,name,timeout=40):
              req=urllib.request.Request(url,headers={
                  "User-Agent":"Mozilla/5.0",
                  "Accept-Language":"zh-TW,zh;q=0.9,en;q=0.8"
              })
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      data=r.read(); status=r.status; final=r.geturl(); ctype=r.headers.get("Content-Type")
              except Exception as e:
                  return {"url":url,"error":repr(e)}
              (out/name).write_bytes(data)
              return {"url":url,"final_url":final,"http_status":status,"content_type":ctype,
                      "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}

          receipt={
              "scope":"PUBLIC_PLAY_READER_LITERAL_SOURCE_EMITTED_SIGNED_PAGE_IMAGES_PT48_PT49_PT50_ONLY",
              "volume_id":vid,
              "reader_url":reader_url,
              "authentication_attempted":False,
              "drm_bypass_attempted":False,
              "hidden_endpoint_guessing_attempted":False,
              "signature_constructed_forged_or_reused":False,
              "reader_request":{},
              "page_records":{},
              "adjudication":{}
          }

          receipt["reader_request"]=get(reader_url,"play-reader.html")
          p=out/"play-reader.html"
          txt=p.read_text("utf-8",errors="ignore") if p.exists() else ""

          def decode_source_literal(value):
              # Decode only JSON/HTML escape sequences already present in the public reader HTML.
              return (value
                      .replace("\\u003d","=")
                      .replace("\\u0026","&")
                      .replace("\\u0025","%")
                      .replace("\\/","/"))

          for pid in ["PT48","PT49","PT50"]:
              # Bind pid and src from the same public bootstrap object. No URL is synthesized.
              pat=r'"pid":"'+re.escape(pid)+r'","src":"([^"]+)"'
              m=re.search(pat,txt)
              rec={
                  "pid":pid,
                  "source_emitted_record_found":bool(m),
                  "raw_source_literal":m.group(1) if m else None,
                  "decoded_source_emitted_url":decode_source_literal(m.group(1)) if m else None,
                  "request":None
              }
              if m:
                  url=rec["decoded_source_emitted_url"]
                  # Safety/authority gate: the URL must itself contain the same emitted pid.
                  if "pg="+pid not in url or "sig=" not in url or "img=1" not in url:
                      raise SystemExit("source-emitted page-image contract mismatch for "+pid)
                  rec["request"]=get(url,pid+".bin")
              receipt["page_records"][pid]=rec

          pt49=receipt["page_records"]["PT49"]
          req49=pt49.get("request") or {}
          receipt["adjudication"]={
              "public_reader_reachable":receipt["reader_request"].get("http_status")==200,
              "pt48_source_emitted":receipt["page_records"]["PT48"]["source_emitted_record_found"],
              "pt49_source_emitted":pt49["source_emitted_record_found"],
              "pt50_source_emitted":receipt["page_records"]["PT50"]["source_emitted_record_found"],
              "pt49_signed_image_url_source_emitted":bool(pt49.get("decoded_source_emitted_url")),
              "pt49_image_http_200":req49.get("http_status")==200,
              "pt49_image_content_type":req49.get("content_type"),
              "pt49_physical_image_obtained":req49.get("http_status")==200 and str(req49.get("content_type","")).startswith("image/"),
              "pt49_physical_glyph_authority_claimed_before_manual_visual_review":False,
              "signature_constructed_forged_or_reused":False,
              "account_or_drm_boundary_crossed":False
          }

          (out/"receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n","utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-jielan-pt49-direct-play-reader-image-ar-r4
          path: batch12ar-r4
          retention-days: 90
