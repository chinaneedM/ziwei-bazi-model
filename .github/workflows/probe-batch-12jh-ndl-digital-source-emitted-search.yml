name: probe-batch-12jh-ndl-digital-source-emitted-search

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12jh-ndl-digital-source-emitted-search.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe NDL Digital source-emitted search contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, html, json, re, urllib.error, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse, parse_qsl, urlencode, urlunparse, urljoin

          UA='Mozilla/5.0 (compatible; TianwenHistoricalAudit/1.0; +https://github.com/chinaneedM/ziwei-bazi-model)'
          REF_URL='https://crd.ndl.go.jp/reference/entry/reference/show?asc=desc&dtltbs=1&fi=2_3+6_0&id=1000137237&ldtl=1&mcmd=25&ndc1=222&ndc_lk=1&page=ref_view&pg=1&st=update'
          TARGETS=[
            ('positive_control','蒋介石'),
            ('serial_simplified','文物参考资料'),
            ('serial_variant','文物参攷資料'),
            ('article_simplified','永乐大典展览的意义'),
            ('article_traditional','永樂大典展覽的意義'),
            ('wenji_simplified','赵万里文集'),
            ('wenji_traditional','趙萬里文集'),
            ('isbn','9787501346653'),
          ]

          def fetch(url, referer=None):
              headers={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8'}
              if referer: headers['Referer']=referer
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=25) as resp:
                      raw=resp.read(4_000_000)
                      ctype=resp.headers.get('Content-Type','')
                      enc='utf-8'
                      m=re.search(r'charset=([A-Za-z0-9._-]+)',ctype,re.I)
                      if m: enc=m.group(1)
                      try: body=raw.decode(enc,errors='replace')
                      except Exception: body=raw.decode('utf-8',errors='replace')
                      return {'status':resp.status,'final_url':resp.geturl(),'headers':dict(resp.headers.items()),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'body':body}
              except urllib.error.HTTPError as e:
                  raw=e.read(1_000_000)
                  try: body=raw.decode('utf-8',errors='replace')
                  except Exception: body=''
                  return {'status':e.code,'final_url':e.geturl(),'headers':dict(e.headers.items()),'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'body':body,'http_error':str(e)}

          ref=fetch(REF_URL)
          ref_body=ref['body']
          urls=re.findall(r'https?://dl\.ndl\.go\.jp/search/searchResult\?[^\s<>"\']+', ref_body)
          urls=[html.unescape(u) for u in urls]
          source_url=None
          for u in urls:
              if 'keyword=' in u and ('蒋介石' in urllib.parse.unquote(u) if False else True):
                  source_url=u
                  break
          if source_url is None:
              # also scan encoded URL fragments in visible HTML
              m=re.search(r'https?://dl\.ndl\.go\.jp/search/searchResult\?[^\s<>"\']*keyword(?:Fulltext)?=[^\s<>"\']+',ref_body)
              if m: source_url=html.unescape(m.group(0))
          if source_url is None:
              raise SystemExit('No source-emitted NDL Digital search URL recovered from official reference page')

          p=urlparse(source_url)
          pairs=parse_qsl(p.query,keep_blank_values=True)
          key_names=[k for k,v in pairs]
          keyword_keys=[k for k in key_names if k.lower() in ('keyword','keywordfulltext')]
          if 'keyword' not in key_names:
              raise SystemExit(f'Expected source-emitted keyword parameter missing: {key_names}')

          # Preserve every first-party source-emitted parameter; only replace the literal keyword values.
          def build(q):
              out=[]
              for k,v in pairs:
                  if k=='keyword':
                      out.append((k,q))
                  elif k=='keywordFulltext':
                      out.append((k,q))
                  else:
                      out.append((k,v))
              return urlunparse((p.scheme,p.netloc,p.path,p.params,urlencode(out,doseq=True),p.fragment))

          def visible_text(body):
              t=re.sub(r'<script\b.*?</script>',' ',body,flags=re.I|re.S)
              t=re.sub(r'<style\b.*?</style>',' ',t,flags=re.I|re.S)
              t=re.sub(r'<[^>]+>',' ',t)
              return re.sub(r'\s+',' ',html.unescape(t)).strip()

          result_rows=[]
          for key,q in TARGETS:
              u=build(q)
              r=fetch(u,referer=REF_URL)
              body=r['body']; vis=visible_text(body)
              links=[]
              for href in re.findall(r'href=["\']([^"\']+)["\']',body,re.I):
                  full=urljoin(r['final_url'],html.unescape(href))
                  if 'dl.ndl.go.jp' in (urlparse(full).hostname or ''):
                      if re.search(r'/pid/\d+|info:ndljp/pid/\d+|/info:ndljp/pid/\d+',full):
                          links.append(full)
              ids=sorted(set(re.findall(r'(?:/pid/|pid/)(\d+)', ' '.join(links))))
              count_patterns=[]
              for pat in [r'検索結果\s*([0-9,]+)\s*件',r'([0-9,]+)\s*件中',r'全\s*([0-9,]+)\s*件']:
                  m=re.search(pat,vis)
                  if m: count_patterns.append(m.group(1))
              row={
                'key':key,'query':q,'requested_url':u,
                'status':r['status'],'final_url':r['final_url'],'bytes':r['bytes'],'sha256':r['sha256'],
                'content_type':r['headers'].get('Content-Type'),
                'query_literal_visible':q in vis,
                'search_result_count_strings':count_patterns[:10],
                'pid_ids':ids[:100],
                'pid_count':len(ids),
                'login_literal':bool(re.search(r'ログイン|login',vis,re.I)),
                'error_literal':bool(re.search(r'エラー|error|アクセスできません|ただいま利用できません',vis,re.I)),
                'visible_prefix':vis[:1000]
              }
              result_rows.append(row)

          # Follow only scripts source-emitted by the calibrated positive-control shell.
          pos_url=build('蒋介石')
          pos=fetch(pos_url,referer=REF_URL)
          script_srcs=[]
          for src in re.findall(r'<script\\b[^>]*src=["\\\']([^"\\\']+)["\\\']',pos['body'],re.I):
              full=urljoin(pos['final_url'],html.unescape(src))
              host=urlparse(full).hostname or ''
              if host.endswith('ndl.go.jp') and full not in script_srcs:
                  script_srcs.append(full)

          script_contracts=[]
          for surl in script_srcs[:15]:
              row={'url':surl}
              try:
                  sr=fetch(surl,referer=pos['final_url'])
                  body=sr['body']
                  row.update({'status':sr['status'],'bytes':sr['bytes'],'sha256':sr['sha256']})
                  contexts=[]
                  candidates=[]
                  for m in re.finditer(r'https?://[^\\s"\\\'<>]+',body,re.I):
                      s=m.group(0)
                      if any(k in s.lower() for k in ('search','api','keyword','result','fulltext','pid','metadata','content')):
                          candidates.append(s[:800])
                  for m in re.finditer(r'/(?:api|search|result|content|contents|item|items|metadata|fulltext)[A-Za-z0-9_./?=&%:\\-]*',body,re.I):
                      s=m.group(0)
                      if any(k in s.lower() for k in ('search','api','keyword','result','fulltext','pid','metadata','content')):
                          candidates.append(s[:800])
                  for needle in ('keywordFulltext','keyword','searchResult','/api/','fetch(','axios','XMLHttpRequest','pid'):
                      start=0
                      while len(contexts)<80:
                          i=body.find(needle,start)
                          if i<0: break
                          contexts.append({'needle':needle,'context':re.sub(r'\\s+',' ',body[max(0,i-500):i+len(needle)+900])[:1600]})
                          start=i+len(needle)
                  row['candidate_contract_strings']=sorted(set(candidates))[:120]
                  row['contexts']=contexts
              except Exception as e:
                  row['error']=f'{type(e).__name__}: {e}'
              script_contracts.append(row)
          result={
            'probe':'BATCH-12JH-NDL-DIGITAL-SOURCE-EMITTED-SEARCH',
            'official_reference_source':{
              'url':REF_URL,'status':ref['status'],'bytes':ref['bytes'],'sha256':ref['sha256'],
              'source_emitted_search_url':source_url,
              'source_emitted_host':p.hostname,
              'source_emitted_path':p.path,
              'source_emitted_parameter_names':key_names,
              'source_emitted_keyword_keys':keyword_keys
            },
            'queries':result_rows,
            'source_emitted_shell_scripts':script_srcs,
            'source_emitted_script_contracts':script_contracts,
            'security':{
              'login_used':False,'account_action_used':False,'payment_used':False,'captcha_bypass_used':False,
              'private_endpoint_guessed':False,'search_endpoint_guessed':False,'search_parameter_guessed':False,
              'source_emitted_contract_only':True,'tls_verification_disabled':False
            },
            'adjudication_rule':'Target zero-result authority requires a calibrated positive-control result surface. HTTP/access errors or an uncalibrated app shell have zero target-absence authority. A bibliographic/digital-object hit still does not equal direct target-page text until the object and page are reviewed.'
          }
          out=Path('artifacts/batch-12jh'); out.mkdir(parents=True,exist_ok=True)
          (out/'probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12jh-ndl-digital-source-emitted-search
          path: artifacts/batch-12jh
          if-no-files-found: error
