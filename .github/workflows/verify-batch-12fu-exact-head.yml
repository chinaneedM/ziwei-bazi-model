name: verify-batch-12fu-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fu-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FU exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-ZHENG-ZHENDUO-NIANPU-REF24-2017-EDITION-AND-JAN10-SECONDARY-DATE-BOUNDARY-FU'
          e=json.loads(Path('docs/research/ZIWEI-ZHENG-ZHENDUO-NIANPU-REF24-2017-EDITION-AND-JAN10-SECONDARY-DATE-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          ref=e['nlc_reference_24_control']
          assert ref['reference_number']==24
          assert ref['article_time_scope']=='1950-01'
          assert ref['article_exposes_exact_day'] is False
          assert ref['pages_1397_1398_directly_reviewed_by_project'] is False

          off=e['official_2017_edition_control']
          assert off['publisher']=='上海外语教育出版社'
          assert off['publication_date']=='2017-11-01'
          assert off['volumes']==['上','中','下']
          assert off['page_1397_1398_volume_assignment']=='UNRESOLVED'

          tok=e['tokyo_metropolitan_holding']
          assert tok['call_number_base']=='920.27/Z11'
          assert [x['call_suffix'] for x in tok['volumes']]==['10-1','10-2','10-3']
          assert tok['three_volume_holding_listing_closed'] is True
          assert tok['exact_material_codes_closed'] is False
          assert tok['current_item_availability_closed'] is False
          assert tok['page_1397_1398_volume_assignment_closed'] is False

          sec=e['secondary_exact_date_recounting']
          assert sec['reported_date']=='1950-01-10'
          assert sec['status']=='SECONDARY_RECOUNTING_PENDING_DIRECT_NIANPU_OR_LETTER_COLLATION'
          assert sec['independent_source_family_count_claimed']==1
          assert sec['exact_day_promoted_to_direct_fact'] is False
          assert sec['exact_day_promoted_to_nlc_2024_article_fact'] is False

          a=e['adjudication']
          assert a['january_1950_letter_month']=='CLOSED_AT_NLC_ARTICLE_LEVEL'
          assert a['january_10_1950_letter_date']=='SECONDARY_RECOUNTING_PENDING_DIRECT_COLLATION'
          assert a['ref24_pages_1397_1398_direct_text']=='NOT_REVIEWED'
          assert a['underlying_letter_source_identity']=='UNRESOLVED'
          assert a['target_specific_purchase_route_selected'] is False
          assert a['target_specific_donation_route_selected'] is False
          assert a['final_nlc_acquisition_transfer_path']=='UNRESOLVED'

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['schema_version']=='1.181.0'
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc'].endswith('ZIWEI-ZHENG-ZHENDUO-NIANPU-REF24-2017-EDITION-AND-JAN10-SECONDARY-DATE-BOUNDARY-FU.md')
          assert state['historical_audit']['row_count']==198
          assert state['historical_audit']['audited_row_count']==166
          assert state['historical_audit']['current_missing_from_product_row_count']==10
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==13
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==13
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {'EXT-SHISU-CHEN-FUKANG-ZHENG-ZHENDUO-NIANPU-2017','EXT-SFLEP-DISTRIBUTION-ZHENG-ZHENDUO-NIANPU-2017','EXT-TOKYO-METRO-LIB-ZHENG-ZHENDUO-NIANPU-2017'}.issubset(ids)

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          PY
