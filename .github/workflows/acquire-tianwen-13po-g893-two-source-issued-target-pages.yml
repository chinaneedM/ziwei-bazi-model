name: acquire-tianwen-13po-g893-two-original-target-pages
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/acquire-tianwen-13po-g893-two-source-issued-target-pages.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  exact-two-source-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Require source-issued links and exact historical JPEG digests
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, json, urllib.request, urllib.parse, urllib.error, re
          from pathlib import Path
          from PIL import Image
          root = Path("docs/research")
          targets = {
              "032b": (root / "TIANWEN-12XZ-G893-L101-DIRECT-FULL-GLYPH-R1.json", "source_page"),
              "034a": (root / "TIANWEN-12XR-G893-L114-DAYRATE-FULL-FIELD-SEPARATION-R1.json", "source_page"),
          }
          dest = Path("/tmp/tianwen-13po")
          dest.mkdir(parents=True, exist_ok=True)
          base = "https://kyudb.snu.ac.kr"
          renderer = base + "/pf01/rendererImg.do"
          prefix = "/data01/stream/SIC/IMG/GK00893_00/GK00893_00_0001/"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise urllib.error.HTTPError(newurl, code, "redirect refused", headers, fp)
          opener = urllib.request.build_opener(NoRedirect())
          def fetch(req, cap):
              with opener.open(req, timeout=24) as response:
                  if response.status != 200:
                      raise ValueError("non-200 status")
                  data = response.read(cap+1)
                  if not data or len(data)>cap:
                      raise ValueError("empty or oversized")
                  return data
          report = {"schema": "TIANWEN-13PO-TWO-SOURCE-ORIGINAL-RECOVERY",
                    "holding": "GK00893_00", "same_physical_copy": True,
                    "new_glyph_readings": 0, "historical_numeric_winners": 0, "pages": []}
          for page, (doc, key) in targets.items():
              item = json.loads(doc.read_text(encoding="utf-8"))[key]
              expected_sha = item["source_original_sha256"]
              original_url = item["source_issued_original_image_url"]
              filename = "GK00893_00IH_0001_" + page + ".jpg"
              original_path = prefix + filename
              expected_url = base + "/ImageServlet.do?" + urllib.parse.urlencode({"imgFileNm": filename, "path": original_path})
              if original_url != expected_url:
                  raise ValueError("registered original URL mismatch for " + page)
              rec = {"page": page, "registered_source_file": str(doc),
                     "registered_source_jpeg_sha256": expected_sha,
                     "status": "NOT_ACQUIRED", "attempts": []}
              for attempt in (1,2,3):
                  try:
                      payload = urllib.parse.urlencode({"item_cd":"SIC", "book_cd":"GK00893_00",
                             "vol_no":"0001", "page_no":page, "tool":"1"}).encode()
                      html = fetch(urllib.request.Request(renderer, data=payload, method="POST",
                            headers={"User-Agent":"Mozilla/5.0 Tianwen-13PO-Source-Original",
                                     "Content-Type":"application/x-www-form-urlencoded",
                                     "Referer":base+"/book/view.do?book_cd=GK00893_00"}), 1000000)
                      names = re.findall(r"""(?:var\s+)?imgFileNm\s*=\s*["']([^"']+)["']""",
                                         html.decode("utf-8", "replace"))
                      if original_path not in names:
                          raise ValueError("source renderer did not emit registered image path")
                      raw = fetch(urllib.request.Request(original_url,
                            headers={"User-Agent":"Mozilla/5.0 Tianwen-13PO-Source-Original",
                                     "Accept":"image/jpeg", "Referer":renderer}), 3000000)
                      observed = hashlib.sha256(raw).hexdigest()
                      if observed != expected_sha:
                          raise ValueError("source JPEG digest mismatch: " + observed)
                      im = Image.open(io.BytesIO(raw))
                      im.load()
                      if im.format != "JPEG" or im.size != (1150,2000):
                          raise ValueError("source format/dimensions mismatch")
                      rgb_sha = hashlib.sha256(im.convert("RGB").tobytes()).hexdigest()
                      (dest / filename).write_bytes(raw)
                      rec.update(status="EXACT_SOURCE_ISSUED_ORIGINAL_REACQUIRED",
                                 source_url=original_url, sha256=observed, rgb_sha256=rgb_sha,
                                 bytes=len(raw), pixels=[1150,2000], file=filename)
                      rec["attempts"].append({"attempt":attempt, "result":"PASS"})
                      break
                  except Exception as exc:
                      rec["attempts"].append({"attempt":attempt, "error":type(exc).__name__,
                                              "details":str(exc)[:180]})
              report["pages"].append(rec)
              print(json.dumps({"page":page, "status":rec["status"], "attempts":rec["attempts"]}, ensure_ascii=False))
          (dest/"receipt.json").write_text(json.dumps(report, indent=2, ensure_ascii=False)+"\n", encoding="utf-8")
          print(json.dumps({"exact_recovered":sum(x["status"].startswith("EXACT") for x in report["pages"]),
                            "requested":2, "glyphs_collated":0, "historic_winners":0}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13po-g893-two-exact-target-source-pages
          path: /tmp/tianwen-13po/
          retention-days: 7
          if-no-files-found: warn
