name: probe-tianwen-13kt-harvard-mingshi-v11-original
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-tianwen-13kt-harvard-mingshi-v11-original.py
      - .github/workflows/probe-tianwen-13kt-harvard-mingshi-v11-original.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pymupdf pillow requests
      - run: python scripts/probe-tianwen-13kt-harvard-mingshi-v11-original.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13kt-harvard-mingshi-v11-evidence
          path: 13kt-evidence/
          retention-days: 14
