name: audit-shendao-v11-target-pages-highres

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-shendao-v11-target-pages-highres.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install document tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Acquire fascicle 4 and render target pages only
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/shendao-v11-target-pages-highres'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages"
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/FPSLRBO%20B17672971%20%E7%A5%9E%E9%81%93%E5%A4%A7%E7%B7%A8%E6%9B%86%E5%AE%97%E9%80%9A%E8%AD%B0.%E5%8D%81%E5%85%AB%E5%8D%B7%20%E5%86%8C0004.pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"
          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source.sha256"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"

          for p in 115 143 144 145 146 147 148 149 150 151 152 153 154 155; do
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 300 "$ROOT/source.pdf" "$ROOT/pages/page-$(printf '%03d' "$p")" >/dev/null 2>&1
          done
          sha256sum "$ROOT"/pages/*.png | sort -V > "$ROOT/pages.sha256"

          cat > "$ROOT/manifest.txt" <<'EOF'
          SOURCE=FPSLRBO B17672971 神道大編曆宗通議十八卷 册0004
          TARGET=卷十一 / 趙緣督十八篇論 / 論晝夜長短 / 論晝夜百刻 / 論地域遠近
          LOCATOR_CONTROL_RUN=35339641540
          LOCATOR_CONTROL_ARTIFACT=10543984573
          OCR_USED_FOR_FINAL_GLYPH_CLAIMS=false
          PAGE_SET=115,143-155
          PHYSICAL_COPY_PRE1578_STATUS=UNRESOLVED
          EOF

      - name: Upload high-resolution target pages
        uses: actions/upload-artifact@v4
        with:
          name: shendao-v11-target-pages-highres
          path: audit/shendao-v11-target-pages-highres
          if-no-files-found: error
          retention-days: 30
