name: acquire-tianwen-13if-gk3467-listed-color
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'scripts/acquire-gk3467-listed-color-pages-13if.py'
      - '.github/workflows/acquire-tianwen-13if-gk3467-listed-color.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/acquire-gk3467-listed-color-pages-13if.py --output audit/tianwen-13if-gk3467-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13if-gk3467-source-listed-color
          path: audit/tianwen-13if-gk3467-color
          if-no-files-found: error
          retention-days: 30
