name: verify-batch-12ft-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ft-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FT exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-QIUSHUZHAI-DIARY16-PP321-322-1949-NOVEMBER-CHRONOLOGY-BOUNDARY-FT'
          e=json.loads(Path('docs/research/ZIWEI-QIUSHUZHAI-DIARY16-PP321-322-1949-NOVEMBER-CHRONOLOGY-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          p=e['first_party_publisher_control']
          assert p['url']=='https://www.nlcpress.com/ProductView.aspx?Id=9969'
          assert p['isbn']=='9787501358762'
          assert p['volume_count']==18
          assert p['total_pages']==9008

          toc=e['volume16_table_of_contents']
          starts={x['period']:x['start_page'] for x in toc['page_chronology']}
          assert starts['1949-11']==321
          assert starts['1949-12']==335
          assert starts['1950-01']==355
          assert toc['target_cited_pages']=='321—322'
          assert toc['target_pages_period']=='1949-11'
          assert toc['page_to_month_binding']=='CLOSED'
          assert toc['exact_day_within_november_1949']=='UNRESOLVED'
          assert toc['target_page_images_directly_reviewed_by_project'] is False
          assert toc['target_page_text_directly_collated_by_project'] is False

          a=e['adjudication']
          assert a['volume16_target_page_month']=='CLOSED_AS_1949_NOVEMBER'
          assert a['pp321_322_are_not_1950_january'] is True
          assert a['exact_diary_wording']=='NOT_REVIEWED'
          assert a['transaction_mode_from_diary_pages']=='UNRESOLVED'
          assert a['target_specific_purchase_route_selected'] is False
          assert a['target_specific_donation_route_selected'] is False
          assert a['final_nlc_acquisition_transfer_path']=='UNRESOLVED'

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['schema_version']=='1.180.0'
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc'].endswith('ZIWEI-QIUSHUZHAI-DIARY16-PP321-322-1949-NOVEMBER-CHRONOLOGY-BOUNDARY-FT.md')
          assert state['historical_audit']['row_count']==198
          assert state['historical_audit']['audited_row_count']==166
          assert state['historical_audit']['current_missing_from_product_row_count']==10
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==13
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==13
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src=next(x for x in reg['sources'] if x.get('source_id')=='EXT-NLCPRESS-QIUSHUZHAI-DIARY-18V-2016')
          b=src['batch_12ft']
          assert b['volume16_1949_november_start_page']==321
          assert b['volume16_1949_december_start_page']==335
          assert b['volume16_1950_january_start_page']==355
          assert b['target_page_images_reviewed'] is False
          assert b['target_3482_3483_bound'] is False

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          PY
