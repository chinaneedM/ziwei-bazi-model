name: acquire-ncl03130-09-source-original-13dk
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - "scripts/acquire-ncl03130-source-pdf-13dk.py"
      - ".github/workflows/acquire-ncl03130-source-pdf-13dk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF signature and digest dependency
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<1.28" requests
      - name: Preserve previously SHA-pinned mirror PDF source for original reading
        run: python scripts/acquire-ncl03130-source-pdf-13dk.py
      - name: Archive source PDF or access boundary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncl03130-13dk-part09-source-pdf
          path: ncl03130-13dk-part09-source/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
