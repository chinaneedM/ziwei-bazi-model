name: probe-guoshi-jingjizhi-v3-corrected-zhunzhai-author

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-guoshi-jingjizhi-v3-corrected-zhunzhai-author.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Acquire correct NLC Guoshi Jingjizhi volume 3 and locate Zhunzhai author entry
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/guoshi-jingjizhi-v3-corrected-zhunzhai-author'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages" "$ROOT/ocr"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-chi-tra-vert >/dev/null
          python -m pip install --quiet pillow

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-1081-207390%20%E5%9C%8B%E5%8F%B2%E7%B6%93%E7%B1%8D%E5%BF%97%20%E7%AC%AC2%E5%86%8A.pdf'
          curl -fL --retry 4 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/guoshi-jingjizhi-v3.pdf"
          sha256sum "$ROOT/guoshi-jingjizhi-v3.pdf" | tee "$ROOT/source-sha256.txt"
          pdfinfo "$ROOT/guoshi-jingjizhi-v3.pdf" | tee "$ROOT/pdfinfo.txt"
          pdftotext -layout "$ROOT/guoshi-jingjizhi-v3.pdf" "$ROOT/embedded-text.txt" || true
          pdftoppm -jpeg -r 170 "$ROOT/guoshi-jingjizhi-v3.pdf" "$ROOT/pages/page" >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import hashlib, json, subprocess

          root=Path('audit/guoshi-jingjizhi-v3-corrected-zhunzhai-author')
          pages=sorted(root.joinpath('pages').glob('page-*.jpg'))
          targets=['食貨','貨寶','魯史','欹器','燕几','器準','準齋','准齋','几漏','幾漏','孫逢吉','逢吉','墨苑','器用']
          hits=[]; manifest=[]
          for i,p in enumerate(pages,1):
              b=p.read_bytes(); im=Image.open(p).convert('RGB')
              manifest.append({'pdf_page':i,'file':p.name,'sha256':hashlib.sha256(b).hexdigest(),'width':im.width,'height':im.height})
              texts=[]
              for lang,psm in [('chi_tra_vert','5'),('chi_tra','6')]:
                  proc=subprocess.run(['tesseract',str(p),'stdout','-l',lang,'--psm',psm],
                                      stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False)
                  texts.append(proc.stdout.decode('utf-8',errors='replace'))
              txt='\n'.join(texts)
              root.joinpath('ocr',f'page-{i:03d}.txt').write_text(txt,encoding='utf-8')
              compact=''.join(txt.split())
              found=[t for t in targets if t in compact]
              diag=sum(ch in compact for ch in ['食','貨','器','準','齋','漏','孫','逢','吉','墨'])
              if found or diag>=5:
                  hits.append({'pdf_page':i,'terms':found,'diagnostic_score':diag,'context':' '.join(txt.split())[:3500]})

          cols=4; per=16
          for start in range(0,len(pages),per):
              chunk=pages[start:start+per]; thumbs=[]
              for j,p in enumerate(chunk,start+1):
                  im=Image.open(p).convert('RGB'); tw=430
                  im=im.resize((tw,max(1,int(im.height*tw/im.width))))
                  c=Image.new('RGB',(tw,im.height+34),'white'); c.paste(im,(0,34))
                  ImageDraw.Draw(c).text((7,7),f'PDF p{j}',fill='black'); thumbs.append(c)
              cw=max(t.width for t in thumbs); ch=max(t.height for t in thumbs)
              rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new('RGB',(cols*cw,rows*ch),'white')
              for k,t in enumerate(thumbs): sheet.paste(t,((k%cols)*cw,(k//cols)*ch))
              sheet.save(root/f'contact-{start+1:03d}-{start+len(chunk):03d}.jpg',quality=93)

          report={
            'schema':'GUOSHI-JINGJIZHI-V3-CORRECTED-ZHUNZHAI-AUTHOR-LOCATOR-R1',
            'source_file':'NLC892-1081-207390 國史經籍志 第2冊.pdf',
            'bibliographic_scope':'Wikimedia/NLC metadata explicitly describes this second physical fascicle as 卷三; prior 207424 probe is 卷四上 and has no negative authority for this target.',
            'rendered_page_count':len(pages),
            'ocr_locator_hits':hits,
            'ocr_authority':'LOCATOR_ONLY_NOT_FINAL_GLYPH_AUTHORITY',
            'target_claim_to_test':'右貨寶 neighborhood: 準齋几漏圖式一卷 / 孫逢吉',
            'final_adjudication':'PENDING_DIRECT_CONTACT_AND_SOURCE_PAGE_REVIEW'
          }
          root.joinpath('manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          root.joinpath('report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'pages':len(pages),'hits':hits},ensure_ascii=False,indent=2))
          PY

      - name: Upload corrected volume-3 locator corpus
        uses: actions/upload-artifact@v4
        with:
          name: guoshi-jingjizhi-v3-corrected-zhunzhai-author-r1
          path: audit/guoshi-jingjizhi-v3-corrected-zhunzhai-author
          if-no-files-found: error
          retention-days: 30
