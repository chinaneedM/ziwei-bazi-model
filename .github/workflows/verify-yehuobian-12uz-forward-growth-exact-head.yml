name: verify-yehuobian-12uz-forward-growth-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12uz-forward-growth-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-yehuobian-npm-jinxiang-12ux.py
      - tests/test_yehuobian_old20_snapshot_growth_12uy.py
      - tests/test_yehuobian_1827_multicopy_backlog_12un.py
      - tests/test_yehuobian_ctext_scanned_page_probe_12ur.py
      - tests/test_yehuobian_forward_growth_12uz.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continuity source registry and transmission checks
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Forward growth without rewriting old historical records
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-npm-jinxiang-12ux.py
          python -m unittest discover -s tests -p 'test_yehuobian_forward_growth_12uz.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_old20_snapshot_growth_12uy.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_1827_multicopy_backlog_12un.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_ctext_scanned_page_probe_12ur.py' -v
