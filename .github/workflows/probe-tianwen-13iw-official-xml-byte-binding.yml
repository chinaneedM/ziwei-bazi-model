name: probe-tianwen-13iw-official-xml-byte-binding
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13IW-*'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - 'scripts/probe-tianwen-13iw-official-2114-2-target-contexts.py'
      - 'scripts/verify-tianwen-13iw-official-xml-byte-binding.py'
      - 'tests/test_tianwen_13iw_official_xml_byte_binding.py'
      - '.github/workflows/probe-tianwen-13iw-official-xml-byte-binding.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  copy-scoped-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13iw-official-xml-byte-binding.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13iw_official_xml_byte_binding.py' -v
      - run: python scripts/probe-tianwen-13iw-official-2114-2-target-contexts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13iw-hashbound-official-juan-contexts
          path: /tmp/tianwen-13iw-khs/official-contexts.json
          if-no-files-found: warn
