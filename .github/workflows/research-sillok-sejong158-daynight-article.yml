name: research-sillok-sejong158-daynight-article

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-sillok-sejong158-daynight-article.yml
      - scripts/research_sillok_sejong158_daynight_article.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install transport dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Locate exact official article by body match
        run: |
          python scripts/research_sillok_sejong158_daynight_article.py \
            --output artifacts/sillok-sejong158-daynight-article \
            --max-article 20 \
            --workers 8
      - name: Upload article-locator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sillok-sejong158-daynight-article
          path: artifacts/sillok-sejong158-daynight-article/
          if-no-files-found: error
          retention-days: 30
