name: research-ziwei-yulgok-four-volume-images-al

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-yulgok-four-volume-images-al.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch four exact source-observed Yulgok volumes and embedded image manifests
        shell: python
        run: |
          import ast, hashlib, json, re, urllib.request
          from pathlib import Path

          OUT=Path("probe"); IMG=OUT/"images"; OUT.mkdir(); IMG.mkdir()
          base="https://db.yulgok.or.kr"
          ids=[
              "B005_01_B00320_001",
              "B005_01_B00320_002",
              "B005_01_B00320_003",
              "B005_01_B00320_004",
          ]
          ua="Mozilla/5.0 provenance-research yulgok-four-volume-images"

          def fetch(url, referer=None, limit=16000000):
              h={"User-Agent":ua,"Accept":"text/html,image/jpeg,image/*,*/*;q=0.8","Accept-Language":"ko,en;q=0.7,zh;q=0.6"}
              if referer: h["Referer"]=referer
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=40) as r:
                      d=r.read(limit)
                      return {"ok":True,"status":r.status,"final_url":r.geturl(),"content_type":r.headers.get("content-type"),"bytes":len(d),"sha256":hashlib.sha256(d).hexdigest(),"data":d}
              except Exception as e:
                  return {"ok":False,"error":repr(e),"bytes":0,"data":b""}

          volumes=[]
          all_images=[]
          for did in ids:
              viewer=base+"/viewer/view?dataId="+did
              row=fetch(viewer); data=row.pop("data")
              txt=data.decode("utf-8","replace") if data else ""
              (OUT/f"{did}-viewer.html").write_text(txt,encoding="utf-8")
              title=None
              mt=re.search(r"""dataTitle:'([^']*)'""",txt)
              if mt: title=mt.group(1)
              mi=re.search(r"""imgItems:\s*(\[[^;]*?\]),\s*\n""",txt,re.S)
              items=[]
              if mi:
                  try: items=json.loads(mi.group(1))
                  except Exception: pass
              # Fallback: only parse imgIds literally embedded in imgItems block.
              if not items:
                  seen=[]
                  for x in re.findall(r'''"imgId":"([^"]+)"''',txt):
                      if x not in seen: seen.append(x)
                  items=[{"imgId":x} for x in seen]
              vol={"dataId":did,"title":title,"viewer_url":viewer,**row,"imgItems":items}
              volumes.append(vol)

              # Path rule is not inferred: public viewer source explicitly defines
              # '/data/image/'+dataId[0]+'/'+dataId+'/preview/'+imgId+'.jpg'
              for idx,item in enumerate(items,1):
                  imgid=item["imgId"]
                  u=base+f"/data/image/{did[0]}/{did}/preview/{imgid}.jpg"
                  x=fetch(u,referer=viewer,limit=20000000); b=x.pop("data")
                  rec={"dataId":did,"index":idx,"imgId":imgid,"url":u,**x}
                  if b and x.get("ok") and len(b)>8000 and b[:3]==b"\xff\xd8\xff":
                      p=IMG/f"{did}-{idx:03d}-{imgid}.jpg"; p.write_bytes(b); rec["saved_file"]=str(p)
                  all_images.append(rec)

          result={
              "schema":"ZIWEI-YULGOK-FOUR-VOLUME-IMAGES-AL-R1",
              "access_date":"2026-09-09",
              "data_ids_source":"EXACT_IDS_EMITTED_BY_YULGOK_SHUSHU_TREE_NODE_RUN_34315414878",
              "image_path_contract_source":"PUBLIC_VIEWER_SOURCE_RUN_34315091401",
              "volumes":volumes,
              "images":all_images,
              "authentication_attempted":False,
              "identifier_guessing_attempted":False,
              "access_control_bypass_attempted":False,
              "adjudication":{"manifest":"DIRECT_VIEWER_EMBEDDED","image_fetch":"SOURCE_CONTRACT_ONLY","visual_review_status":"PENDING_DIRECT_NO_OCR_REVIEW","target_leaf_status":"PENDING_DIRECT_NO_OCR_REVIEW","textual_witness_increment":0,"algorithm_effect":"NONE"}
          }
          (OUT/"ziwei-yulgok-four-volume-images-al.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
              "volumes":[{"dataId":v["dataId"],"title":v["title"],"viewer_status":v.get("status"),"img_count":len(v["imgItems"]),"img_ids":[x["imgId"] for x in v["imgItems"]]} for v in volumes],
              "saved_images":[{"dataId":x["dataId"],"index":x["index"],"imgId":x["imgId"],"bytes":x.get("bytes"),"sha256":x.get("sha256"),"file":x.get("saved_file")} for x in all_images if x.get("saved_file")],
              "adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-yulgok-four-volume-images-al
          path: probe/
          retention-days: 14
