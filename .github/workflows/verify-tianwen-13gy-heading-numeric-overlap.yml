name: verify-tianwen-13gy-heading-numeric-overlap
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-preserving-overlap-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify-tianwen-13gy-header-numeric-overlap.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13gy*' -v
