name: verify-tianwen-13lg-naaj-book10-native
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - docs/research/TIANWEN-13LG-*
      - scripts/verify-tianwen-13lg-naaj-book10-native.py
      - tests/test_tianwen_13lg_naaj_book10_native.py
      - .github/workflows/verify-tianwen-13lg-naaj-book10-native.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13lg-naaj-book10-native.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13lg_naaj_book10_native.py' -v
      - run: python scripts/verify-tianwen-13lf-naaj-2810037-scope.py
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
