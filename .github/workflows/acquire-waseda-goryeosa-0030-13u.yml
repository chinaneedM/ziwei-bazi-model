name: acquire-waseda-goryeosa-0030-13u
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - docs/research/TIANWEN-13U-WASEDA-GORYEOSA-0030-ORIGINAL-FASCICLE-ATLAS-ROUTE-R1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image rasterization dependencies
        run: python -m pip install 'PyMuPDF>=1.24,<1.28' 'Pillow>=10,<12'
      - name: Download exact first-party Waseda original PDF and document 16-page fascicle index
        run: python scripts/acquire-waseda-goryeosa-0030-13u.py --output waseda-goryeosa-0030-13u-evidence
      - name: Retain complete source PDF, thumbnails, contact sheets, SHA receipt
        uses: actions/upload-artifact@v4
        with:
          name: waseda-goryeosa-0030-original-and-atlas-13u
          path: waseda-goryeosa-0030-13u-evidence/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
