name: research-ziwei-buybook-disclosed-books-images-ac

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-buybook-disclosed-books-images-ac.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch only underlying image URLs explicitly disclosed by Buybook page
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path
          OUT=Path('probe'); IMG=OUT/'images'; OUT.mkdir(); IMG.mkdir()
          page='https://www.buybook.tw/book-0010746528.htm'
          ua='Mozilla/5.0 provenance-research public-preview'
          def get(url,referer=None):
            h={'User-Agent':ua,'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8','Accept-Language':'zh-TW,zh;q=0.9,en;q=0.5'}
            if referer: h['Referer']=referer
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=35) as r:
                data=r.read(12_000_000)
                return r.status,r.geturl(),r.headers.get('content-type'),data,None
            except Exception as e: return None,url,None,b'',repr(e)
          # Re-read the public Buybook page; extract only URLs already present inside books.com.tw getImage query parameter i.
          req=urllib.request.Request(page,headers={'User-Agent':ua,'Accept-Language':'zh-TW,zh;q=0.9,en;q=0.5'})
          with urllib.request.urlopen(req,timeout=35) as r: raw=r.read(); final=r.geturl()
          txt=raw.decode('utf-8','replace')
          disclosed=[]
          for m in re.finditer(r'''(?:src|href|data-src|data-original|data-lazy-src|content)\s*=\s*["']([^"']+)["']''',txt,re.I):
            wrapper=urllib.parse.urljoin(final,html.unescape(m.group(1)))
            p=urllib.parse.urlparse(wrapper)
            if p.netloc.endswith('books.com.tw') and p.path.endswith('/image/getImage'):
              vals=urllib.parse.parse_qs(p.query).get('i',[])
              for u in vals:
                if u.startswith('http://www.books.com.tw/img/') or u.startswith('https://www.books.com.tw/img/'):
                  if u not in disclosed: disclosed.append(u)
          rows=[]
          for i,u in enumerate(disclosed,1):
            # try the exact disclosed URL first, then scheme-upgrade only (same host/path, no identifier mutation)
            attempts=[u]
            if u.startswith('http://'): attempts.append('https://'+u[len('http://'):])
            done=None
            for cand in attempts:
              st,fu,ct,data,e=get(cand,referer='https://www.books.com.tw/')
              rec={'disclosed_url':u,'attempt_url':cand,'status':st,'final_url':fu,'content_type':ct,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest() if data else None,'error':e}
              magic=data[:3]==b'\xff\xd8\xff' or data[:8]==b'\x89PNG\r\n\x1a\n' or data[:4]==b'RIFF'
              if data and st==200 and magic:
                ext='.png' if data[:8]==b'\x89PNG\r\n\x1a\n' else '.webp' if data[:4]==b'RIFF' else '.jpg'
                pth=IMG/f'disclosed-{i:02d}{ext}'; pth.write_bytes(data); rec['saved_file']=str(pth); done=rec; break
              done=rec
            rows.append(done)
          result={'schema':'ZIWEI-BUYBOOK-DISCLOSED-BOOKS-IMAGES-AC-R1','access_date':'2026-09-09','source_page':page,'source_page_sha256':hashlib.sha256(raw).hexdigest(),'disclosed_underlying_url_count':len(disclosed),'disclosed_underlying_urls':disclosed,'results':rows,'identifier_guessing_attempted':False,'identifier_mutation_attempted':False,'authentication_attempted':False,'purchase_attempted':False,'access_control_bypass_attempted':False,'adjudication':{'visual_review_status':'PENDING_DIRECT_NO_OCR_REVIEW','target_page_status':'PENDING_DIRECT_NO_OCR_REVIEW','algorithm_effect':'NONE'}}
          (OUT/'buybook-disclosed-books-images-ac.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'disclosed_count':len(disclosed),'results':rows},ensure_ascii=False,indent=2))
      - name: Upload disclosed-image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-buybook-disclosed-books-images-ac
          path: probe/
          if-no-files-found: warn
          retention-days: 14
