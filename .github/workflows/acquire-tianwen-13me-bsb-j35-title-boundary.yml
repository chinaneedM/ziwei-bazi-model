name: acquire-tianwen-13me-bsb-j35-title-boundary
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13me-bsb-v1-j35-title-boundary.py
      - docs/research/TIANWEN-13ME-BSB-V1-J35-ORIGINAL-C511-END-AND-TITLE-RECHECK-R1.json
      - scripts/verify-tianwen-13me-bsb-j35-anchor.py
      - .github/workflows/acquire-tianwen-13me-bsb-j35-title-boundary.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - run: python scripts/verify-tianwen-13me-bsb-j35-anchor.py
      - run: python scripts/acquire-tianwen-13me-bsb-v1-j35-title-boundary.py --out /tmp/tianwen-13me
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13me-bsb-v1-j35-title-boundary
          path: /tmp/tianwen-13me/
          if-no-files-found: warn
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
