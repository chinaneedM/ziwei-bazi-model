name: research-shiqie-shidian-target-browser-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-shidian-target-browser-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Capture source-emitted reading responses
        run: |
          python - <<'PY'
          import json, re, hashlib
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url='https://www.shidianguji.com/zh/book/NA06425/chapter/1m44zy4jwa4ab'
          target='巳上是上四亥'
          target_page_id='7640563520069697576'
          out=Path('shidian-target-browser'); out.mkdir()
          api_out=out/'api'; api_out.mkdir()
          result={
            'schema':'SHIQIE-SHIDIAN-SOURCE-EMITTED-READING-RESPONSES-R1',
            'url':url,
            'target_text':target,
            'target_page_id':target_page_id,
            'policy':'ORDINARY PUBLIC BROWSER NAVIGATION AND PASSIVE CAPTURE OF REQUESTS/RESPONSES THAT THE PUBLIC PAGE ITSELF EMITS. DO NOT MANUALLY REPLAY OR CONSTRUCT API/IMAGE URLS; DO NOT ENUMERATE IDS; DO NOT LOGIN; DO NOT INJECT COOKIES/TOKENS; DO NOT CLICK HIDDEN CONTROLS.',
            'navigation':{}, 'api_responses':[], 'network':[], 'image_network':[], 'rendered_target_presence':{}
          }
          selected_paths=(
            '/api/ancientlib/read/book/paragraphs/v3/',
            '/api/ancientlib/read/book/pages/v3/',
            '/api/ancientlib/read/review/chapter-list/',
            '/api/ancientlib/read/book/dynamic-info/get',
          )
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            context=browser.new_context(viewport={'width':1440,'height':1200}, locale='zh-CN')
            page=context.new_page()
            network=[]; selected=[]
            def on_response(resp):
              try:
                ct=resp.headers.get('content-type','')
                u=resp.url
                req=resp.request
                if ('shidianguji' in u or 'byte' in u or 'tos-' in u or ct.lower().startswith('image/')):
                  network.append({'url':u,'status':resp.status,'content_type':ct,'method':req.method})
                if any(path in u for path in selected_paths):
                  rec={
                    'url':u,
                    'status':resp.status,
                    'content_type':ct,
                    'method':req.method,
                    'post_data':req.post_data,
                  }
                  try:
                    body=resp.body()
                    rec['body_len']=len(body)
                    rec['body_sha256']=hashlib.sha256(body).hexdigest()
                    rec['contains_target_text']=target.encode('utf-8') in body
                    rec['contains_target_page_id']=target_page_id.encode('ascii') in body
                    name=f"response-{len(selected)+1:02d}.bin"
                    (api_out/name).write_bytes(body)
                    rec['artifact_file']='shidian-target-browser/api/'+name
                    if len(body)<=2000000 and ('json' in ct.lower() or 'text' in ct.lower()):
                      try:
                        rec['json']=json.loads(body.decode('utf-8'))
                      except Exception:
                        rec['text_preview']=body.decode('utf-8','replace')[:12000]
                  except Exception as exc:
                    rec['body_error']=repr(exc)
                  selected.append(rec)
              except Exception as exc:
                selected.append({'callback_error':repr(exc)})
            page.on('response',on_response)
            nav=None; err=None
            try:
              nav=page.goto(url,wait_until='domcontentloaded',timeout=60000)
              page.wait_for_timeout(10000)
            except Exception as exc:
              err=repr(exc)
            result['navigation']={'status':nav.status if nav else None,'final_url':page.url,'title':page.title(),'error':err}
            html=page.content()
            result['rendered_target_presence']={
              'contains_target_text':target in html,
              'contains_target_page_id':target_page_id in html,
              'target_text_index':html.find(target),
              'target_page_id_index':html.find(target_page_id),
            }
            (out/'rendered.html').write_text(html,encoding='utf-8')
            page.screenshot(path=str(out/'rendered-view.png'),full_page=False)
            browser.close()

          result['api_responses']=selected
          seen=set(); compact=[]
          for r in network:
            key=(r['url'],r['status'],r['content_type'],r['method'])
            if key not in seen:
              seen.add(key); compact.append(r)
          result['network']=compact
          result['image_network']=[r for r in compact if r['content_type'].lower().startswith('image/')]
          result['target_bearing_api_responses']=[
            {'url':r.get('url'),'artifact_file':r.get('artifact_file'),'contains_target_text':r.get('contains_target_text'),'contains_target_page_id':r.get('contains_target_page_id')}
            for r in selected if r.get('contains_target_text') or r.get('contains_target_page_id')
          ]
          Path('shidian-source-emitted-reading-responses.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
            'navigation_status':result['navigation'].get('status'),
            'captured_api_responses':len(selected),
            'target_bearing_api_responses':result['target_bearing_api_responses'],
            'image_network_responses':len(result['image_network']),
            'rendered_target_presence':result['rendered_target_presence'],
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-shidian-source-emitted-reading-responses
          path: |
            shidian-source-emitted-reading-responses.json
            shidian-target-browser/*
          if-no-files-found: error
