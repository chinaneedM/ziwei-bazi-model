name: acquire-tianwen-13nq-harvard-mingshigao-v8
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13nq-mingshigao-v8.py
      - .github/workflows/acquire-tianwen-13nq-harvard-mingshigao-v8.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'requests>=2.32,<3' 'Pillow>=10,<12' 'pymupdf>=1.24,<1.27'
      - run: python -m py_compile scripts/acquire-tianwen-13nq-mingshigao-v8.py
      - run: python scripts/acquire-tianwen-13nq-mingshigao-v8.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13nq-harvard-mingshigao-v8-atlas
          path: /tmp/tianwen-13nq/
          retention-days: 14
          if-no-files-found: warn
