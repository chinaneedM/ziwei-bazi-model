name: verify-batch-12ia-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ia-exact-head.yml
      - docs/research/ZIWEI-NLC-BEITU1959-3368-3288-SEARCH-INDEX-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-BEITU1959-3368-3288-SEARCH-INDEX-BOUNDARY-IA.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IA status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tianwen/batch-12ia-exact-head',
              description: 'Batch 12IA search-index boundary verification running'
            })

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12IA exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-NLC-BEITU1959-3368-3288-SEARCH-INDEX-BOUNDARY-IA'
          e=json.loads(Path('docs/research/ZIWEI-NLC-BEITU1959-3368-3288-SEARCH-INDEX-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          r2=e['probe_ia_r2_known_positive_905s_index_control']
          assert [x['current_905s'] for x in r2['known_positive_controls']]==['03288','08643']
          assert all(x['same_endpoint_result']=='NO_MATCHING_RESULT' for x in r2['known_positive_controls'])
          assert r2['03368_nonexistence_inference_authorized'] is False
          r3=e['probe_ia_r3_google_books_number_locator']
          assert r3['returned_page_tokens']['chinese_3288']==['PP34','PP36','PP60']
          assert [x['direct_scan_pdf_page'] for x in r3['projected_chinese_3288_candidates']]==[26,28,52]
          assert all(x['exact_3288_seen'] is False for x in r3['projected_chinese_3288_candidates'])
          assert r3['all_three_3288_locator_candidates_false_positive'] is True
          assert r3['3288_absent_from_entire_1959_catalog_proved'] is False
          a=e['combined_adjudication']
          assert a['exact_3368_to_3288_causal_mechanism']=='UNRESOLVED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,239,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc']=='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-BEITU1959-3368-3288-SEARCH-INDEX-BOUNDARY-IA.md'
          PY

      - name: Publish successful IA status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12ia-exact-head',
              description: 'Batch 12IA search-index boundary gates PASS'
            })

      - name: Publish failed IA status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12ia-exact-head',
              description: 'Batch 12IA exact-head verification FAILED'
            })
