name: probe-batch-12fj-zhunzhai-microfilm-registration

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12fj-zhunzhai-microfilm-registration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe Zhunzhai current microfilm registration
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/batch-12fj-zhunzhai-microfilm-registration'
          rm -rf "$ROOT"; mkdir -p "$ROOT/raw" "$ROOT/detail"
          UA='Tianwen-Provenance-Audit/1.0'
          cat > "$ROOT/queries.tsv" <<'EOF'
          simp-exact	准斋心制几漏图式	TIT	true
          trad-exact	準齋心製几漏圖式	TIT	true
          simp-loose	准斋心制几漏图式	TIT	false
          trad-loose	準齋心製几漏圖式	TIT	false
          simp-short	准斋心制几漏	TIT	false
          trad-short	準齋心製几漏	TIT	false
          EOF
          : > "$ROOT/status.tsv"
          while IFS=$'\t' read -r key q way exact; do
            body=$(Q="$q" WAY="$way" EXACT="$exact" python - <<'PY'
          import json,os
          q=os.environ['Q']; way=os.environ['WAY']; exact=os.environ['EXACT'].lower()=='true'
          print(json.dumps({"q":q,"searchWay":way,"page_num":"1",
            "query":q if way=="ANY" else way+"="+q,
            "sort":[{"_score":"DESC"}],"size":50,"facetVal":[],"exactMatch":exact},
            ensure_ascii=False,separators=(',',':')))
          PY
            )
            out="$ROOT/raw/$key.json"
            set +e
            code=$(curl -L -sS --connect-timeout 8 --max-time 30 -A "$UA" \
              -H 'Accept: application/json, text/javascript, */*; q=0.01' \
              -H 'X-Requested-With: XMLHttpRequest' \
              -H 'Referer: https://meta.nlc.cn/v2/search?q=%E5%87%86%E6%96%8B%E5%BF%83%E5%88%B6%E5%87%A0%E6%BC%8F%E5%9B%BE%E5%BC%8F&searchWay=TIT' \
              -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
              --data-binary "$body" -o "$out" -w '%{http_code}' \
              'https://meta.nlc.cn/v2/doSearch?hight=false')
            rc=$?; set -e
            printf '%s\trc=%s\thttp=%s\tbytes=%s\n' "$key" "$rc" "$code" "$(wc -c < "$out" 2>/dev/null || echo 0)" >> "$ROOT/status.tsv"
          done < "$ROOT/queries.tsv"

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('audit/batch-12fj-zhunzhai-microfilm-registration')
          candidates={}; out=[]
          terms=('准斋心制几漏','準齋心製几漏','准齋心製幾漏','准斋心制幾漏')
          for p in sorted((root/'raw').glob('*.json')):
              out.append('### '+p.name)
              try: obj=json.loads(p.read_text('utf-8'))
              except Exception as e: out.append('PARSE_ERROR '+repr(e)); continue
              out.append('status='+repr(obj.get('status'))+' total='+repr(obj.get('total'))+' message='+repr(obj.get('message')))
              for i,row in enumerate(obj.get('result') or [],1):
                  src=row.get('_source') or {}
                  text=' | '.join(map(str,src.get('TIT') or []))
                  if any(t in text for t in terms):
                      uid=src.get('UID') or row.get('_id')
                      if uid: candidates[str(uid)]=row
                      out.append('TARGET_ROW '+str(i)+' '+json.dumps(row,ensure_ascii=False,separators=(',',':')))
          root.joinpath('summary.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          root.joinpath('candidate-uids.txt').write_text('\n'.join(candidates)+'\n',encoding='utf-8')
          PY

          : > "$ROOT/detail-status.tsv"
          while IFS= read -r uid; do
            [ -z "$uid" ] && continue
            out="$ROOT/detail/$uid.json"
            set +e
            code=$(curl -L -sS --connect-timeout 8 --max-time 30 -A "$UA" \
              -H 'Accept: application/json, text/javascript, */*; q=0.01' \
              -H 'X-Requested-With: XMLHttpRequest' \
              -H "Referer: https://meta.nlc.cn/v2/detail/$uid" \
              -X POST -o "$out" -w '%{http_code}' \
              "https://meta.nlc.cn/api/v1/item/$uid/1/999")
            rc=$?; set -e
            printf '%s\trc=%s\thttp=%s\tbytes=%s\n' "$uid" "$rc" "$code" "$(wc -c < "$out" 2>/dev/null || echo 0)" >> "$ROOT/detail-status.tsv"
          done < "$ROOT/candidate-uids.txt"

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('audit/batch-12fj-zhunzhai-microfilm-registration')
          out=[]
          keys=('200a','200b','205a','210c','210d','215a','455a','4551','905a','905b','905q','905s','3165','035a','049b','049c','910n','001')
          for p in sorted((root/'detail').glob('*.json')):
              obj=json.loads(p.read_text('utf-8')); r=obj.get('result') or {}; b=r.get('biblio') or {}; es=r.get('esBook') or {}
              out.append('### '+p.name)
              out.append('ESBOOK '+json.dumps({k:es.get(k) for k in ('SYS','UID','WDT','YEA','PUB','PAG','TIT','AUT','holdings')},ensure_ascii=False,separators=(',',':')))
              out.append('BIBLIO '+json.dumps({k:b.get(k) for k in keys if k in b},ensure_ascii=False,separators=(',',':')))
          root.joinpath('detail-summary.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

          find "$ROOT" -type f -size +0c -print0 | xargs -0 -r sha256sum | sort -V > "$ROOT/all-files.sha256"
          printf '%s\n' \
            'SOURCE=National Library of China current meta.nlc.cn search + item API' \
            'PURPOSE=find all current Zhunzhai microfilm records and test structured 905b against paired separate-photograph reference 00O003571' \
            'SEMANTIC_FIREWALL=905b classification requires external CNMARC technical control; value alone is not barcode/call-number proof' \
            'NEGATIVE_POLICY=failed routes are access boundaries only' \
            'OCR_USED=false' > "$ROOT/manifest.txt"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: batch-12fj-zhunzhai-microfilm-registration
          path: audit/batch-12fj-zhunzhai-microfilm-registration/
          if-no-files-found: error
          retention-days: 30
