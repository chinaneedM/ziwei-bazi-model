name: verify-batch-12fj-exact-head
# rerun-after-registry-https-normalization

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fj-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FJ exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          e=json.loads(Path('docs/research/ZIWEI-NLC-DIGITAL-FID-AND-MICROFILM-REGISTRATION-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-NLC-DIGITAL-FID-AND-MICROFILM-REGISTRATION-FJ'
          assert e['digital_ancient_book_resources']['tonghu']['fid_identifier']=='411999008600'
          assert e['digital_ancient_book_resources']['tonghu']['bid_numeric']=='113028'
          assert e['digital_ancient_book_resources']['zhunzhai']['fid_identifier']=='411999008601'
          assert e['digital_ancient_book_resources']['zhunzhai']['bid_numeric']=='113029'
          assert e['microfilm_work_records']['tonghu']['field_905b']=='00O003570'
          assert e['microfilm_work_records']['zhunzhai']['field_905b']=='00O003571'
          assert e['field_905b_semantic_controls']['target_specific_adjudication']['classification']=='MICROFILM_REGISTRATION_LOGIN_NUMBER'
          assert e['identifier_layer_firewall']['semantic_layer_collapse_forbidden'] is True
          assert e['identifier_layer_firewall']['public_barcode_proved'] is False
          assert e['acquisition_provenance_adjudication']['final_nlc_acquisition_transfer_path']=='UNRESOLVED'
          assert e['chronology_and_rule_firewall']['direct_sanming_parent_vote_increment']==0

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['historical_audit']['latest_batch_doc'].endswith('NLC-DIGITAL-FID-AND-MICROFILM-REGISTRATION-FJ.md')
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'

          graph=json.loads(Path('docs/TRANSMISSION-GENEALOGY-GRAPH-R1.json').read_text(encoding='utf-8'))
          for nid in (
            'DIGITAL-NLC-DATA892-TONGHU-FID411999008600-BID113028',
            'DIGITAL-NLC-DATA892-ZHUNZHAI-FID411999008601-BID113029',
            'MICROFILM-NLC-TONGHU-SYS002146415-LOGIN00O003570',
            'MICROFILM-NLC-ZHUNZHAI-SYS002146416-LOGIN00O003571',
          ):
              assert any(n.get('node_id')==nid for n in graph['nodes'])
          for eid in ('TG-E0113','TG-E0114','TG-E0115','TG-E0116'):
              assert any(x.get('edge_id')==eid and x.get('status')=='HIGH_CONFIDENCE' for x in graph['edges'])
          PY
