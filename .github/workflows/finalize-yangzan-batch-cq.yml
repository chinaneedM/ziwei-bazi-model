name: finalize-yangzan-batch-cq

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/finalize-yangzan-batch-cq.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0
      - name: Patch durable state and graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re
          BATCH='BATCH-12-ZIWEI-YANGZAN-XIANZHONGLU-BEIJING-PRECISION-CQ'
          DOC='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-YANGZAN-XIANZHONGLU-BEIJING-PRECISION-CQ.md'
          RESEARCH='docs/research/ZIWEI-YANGZAN-XIANZHONGLU-BEIJING-PRECISION-PHYSICAL-COLLATION-R1.json'
          SOURCE_ID='EXT-SHIDIAN-YANGZAN-XIANZHONGLU-MING-MS'
          PHYSICAL_NODE='PHYSICAL-COPY-YANGZAN-XIANZHONGLU-SHIDIAN-MING-MS'
          RULE_NODE='RULE-YANGZAN-BEIJING-PRECISION-DAYNIGHT'
          SANMING_NODE='TABLE-SANMING-1578-DAYNIGHT-KE'
          assert Path(DOC).is_file() and Path(RESEARCH).is_file()

          state_path=Path('docs/PROJECT-CURRENT-STATE-R1.json')
          state=json.loads(state_path.read_text(encoding='utf-8'))
          state['schema_version']='1.103.0'
          ha=state['historical_audit']
          if BATCH not in ha['completed_batches']:
              ha['completed_batches'].append(BATCH)
          ha['latest_batch_doc']=DOC
          focus=ha.setdefault('current_focus',[])
          additions=[
              'Batch 12CQ directly binds Shidian/National Library of China Yang Zan 《閑中錄前集》 Ming-manuscript physical pages 115-117: 步中星 is explicitly Beijing-local, p115 gives day/night total difference 592.04 fen, p116 gives 3815.92/6184.08 fen and dawn/dusk 250 fen, and p117 gives the exact half-values 1907.96/3092.04 plus cumulative daily recurrence.',
              'Batch 12CQ mechanically replays 5000±2×592.04 -> 3815.92/6184.08, equivalent to about 38.1592/61.8408 ke under a 100-ke day. This directly mismatches the 1578 Sanming 41/59 target and rejects the shortcut that Yang Zan Beijing precision values are Sanming direct numeric parentage; broader technical relationship remains uncollapsed.',
              'Batch 12CQ preserves the date firewall: Shidian identifies a Ming manuscript but exact work-composition and manuscript-copy dates are unresolved, so no securely pre-1578 surviving-copy claim is made. The next Sanming ancestry gate returns to direct Datong Tonggui/Ritonggui 晨昏 cells and pre-1578 Nanjing/Datong witnesses reproducing both 59/41 and the Sanming change-day fingerprint.'
          ]
          for item in additions:
              if item not in focus:
                  focus.append(item)
          state_path.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          reg_path=Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json')
          reg=json.loads(reg_path.read_text(encoding='utf-8'))
          if not any(x.get('source_id')==SOURCE_ID for x in reg['sources']):
              reg['sources'].append({
                  'source_id':SOURCE_ID,
                  'title':'《閑中錄前集》',
                  'author':'楊瓚',
                  'historical_period':'明',
                  'edition':'明抄本（provider metadata; exact physical copying date unresolved）',
                  'provider':'识典古籍；图像源/馆藏标注为国家图书馆',
                  'url':'https://www.shidianguji.com/book/NGJ89241199901864074070/chapter/1lmbc0ddu2g4r',
                  'source_role':'DIRECT_PHYSICAL_MANUSCRIPT_WITNESS_FOR_BEIJING_PRECISION_DAYNIGHT_COMPUTATION',
                  'quality_notes':'Batch 12CQ directly visually collates physical pages 115-117 and uses p118 as a passage-boundary control. Machine text is locator-only and OCR is not glyph authority. The provider label 明抄本 does not by itself establish an exact copying date or a securely pre-1578 surviving copy.',
                  'book_id':'NGJ89241199901864074070',
                  'image_source':'國家圖書館',
                  'batch_12cq':{
                      'workflow_run_id':35088687110,
                      'artifact_id':10442714003,
                      'artifact_digest':'sha256:d09d3327fc14d5453f9819e292b8ea610271015bcadf7d407d37a4c15ed75289',
                      'research_artifact':RESEARCH
                  }
              })
          reg_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          graph_path=Path('docs/TRANSMISSION-GENEALOGY-GRAPH-R1.json')
          graph=json.loads(graph_path.read_text(encoding='utf-8'))
          nodes=graph.setdefault('nodes',[])
          if not any(n.get('node_id')==PHYSICAL_NODE for n in nodes):
              nodes.append({
                  'node_id':PHYSICAL_NODE,
                  'node_type':'PHYSICAL_COPY',
                  'label':'识典/国家图书馆《閑中錄前集》明抄本图像见证',
                  'system_scope':'MING_CALENDRICAL_TIMEKEEPING',
                  'work_composition_date':'UNRESOLVED_IN_THIS_BATCH',
                  'edition_impression_date':None,
                  'physical_copy_date':'MING_MANUSCRIPT_PER_PROVIDER_METADATA; EXACT_COPY_DATE_UNRESOLVED',
                  'digital_surrogate_date':'MODERN_SHIDIAN_SURROGATE_OF_NATIONAL_LIBRARY_OF_CHINA_IMAGES',
                  'date_scope_note':'Provider metadata binds a Ming manuscript witness but does not authorize a securely pre-1578 physical-copy date or author-biography identification by name alone.',
                  'evidence':[RESEARCH,DOC],
                  'first_explicit_graph_batch':BATCH
              })
          if not any(n.get('node_id')==RULE_NODE for n in nodes):
              nodes.append({
                  'node_id':RULE_NODE,
                  'node_type':'MECHANICAL_RULE',
                  'label':'楊瓚《閑中錄·步中星》北京晝夜精密計算層',
                  'system_scope':'MING_CALENDRICAL_TIMEKEEPING',
                  'mechanical_identity':'Beijing north-pole altitude 40 degrees; day/night total difference 592.04 fen; winter-day/summer-night 3815.92 fen; summer-day/winter-night 6184.08 fen; dawn/dusk constant 250 fen; daily values generated by cumulative internal/external and day/night differences.',
                  'physical_numeric_extreme_ke_under_10000fen_100ke':{'short':38.1592,'long':61.8408},
                  'evidence':[RESEARCH,DOC],
                  'first_explicit_graph_batch':BATCH
              })
          edges=graph.setdefault('edges',[])
          numeric_ids=[]
          for edge in edges:
              m=re.fullmatch(r'TG-E(\d+)',str(edge.get('edge_id','')))
              if m:
                  numeric_ids.append(int(m.group(1)))
          next_id=[max(numeric_ids,default=0)+1]
          def add_edge(frm,rel,to,status,confidence,evidence_class,reason=None):
              if any(e.get('from')==frm and e.get('relation')==rel and e.get('to')==to for e in edges):
                  return
              row={
                  'edge_id':f'TG-E{next_id[0]:04d}',
                  'from':frm,
                  'relation':rel,
                  'to':to,
                  'status':status,
                  'confidence':confidence,
                  'evidence_class':evidence_class,
                  'evidence':[RESEARCH,DOC],
                  'first_explicit_graph_batch':BATCH
              }
              next_id[0]+=1
              if reason:
                  row['reason']=reason
              edges.append(row)
          add_edge(PHYSICAL_NODE,'ATTESTS',RULE_NODE,'CONFIRMED','HIGH','DIRECT_VISUAL_PHYSICAL_COLLATION')
          add_edge(RULE_NODE,'DISPROVES_LINEAGE_SHORTCUT',SANMING_NODE,'CONFIRMED','HIGH','DIRECT_PHYSICAL_SOLSTITIAL_NUMERIC_ANCHOR_MISMATCH','Yang Zan Beijing precision extreme is approximately 61.8408/38.1592 ke, whereas the exact 1578 Sanming physical target is 59/41; direct numeric-parent identity is rejected without denying broader calendrical relationship.')
          nonedges=graph.setdefault('explicit_non_edges',[])
          if not any(x.get('from')==RULE_NODE and x.get('relation')=='DIRECT_NUMERIC_PARENT_OF' and x.get('to')==SANMING_NODE for x in nonedges):
              nonedges.append({
                  'from':RULE_NODE,
                  'relation':'DIRECT_NUMERIC_PARENT_OF',
                  'to':SANMING_NODE,
                  'status':'DISPROVED',
                  'reason':'Direct physical numerical fingerprint mismatch: Yang Zan Beijing precision layer yields 61.8408/38.1592 ke while Sanming 1578 prints 59/41.',
                  'evidence':[RESEARCH,DOC]
              })
          graph_path.write_text(json.dumps(graph,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python scripts/verify-project-continuity-state-r1.py
          git config user.name 'Tianwen Research Bot'
          git config user.email 'tianwen-research-bot@users.noreply.github.com'
          git add docs/PROJECT-CURRENT-STATE-R1.json docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json docs/TRANSMISSION-GENEALOGY-GRAPH-R1.json
          git rm .github/workflows/finalize-yangzan-batch-cq.yml
          git commit -m 'close Yang Zan Beijing precision provenance batch 12CQ'
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
