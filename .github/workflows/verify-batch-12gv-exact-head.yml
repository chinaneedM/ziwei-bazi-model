name: verify-batch-12gv-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gv-exact-head.yml
      - docs/research/ZIWEI-JI-SHUYING-BAICHUAN-P335-CROSS-PUBLICATION-CITATION-BRIDGE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-JI-SHUYING-BAICHUAN-P335-CROSS-PUBLICATION-CITATION-BRIDGE-GV.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GV exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-JI-SHUYING-BAICHUAN-P335-CROSS-PUBLICATION-CITATION-BRIDGE-GV'
          e=json.loads(Path('docs/research/ZIWEI-JI-SHUYING-BAICHUAN-P335-CROSS-PUBLICATION-CITATION-BRIDGE-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          d=e['dpm_2010_page335_control']
          assert d['printed_page']==60 and d['wenji_cited_page']==335 and d['directly_reviewed_page_image'] is True
          t=e['taiwan_ncl_2015_article_binding']
          assert t['printed_statement_page']==96
          assert t['statement_attribution']=='冀淑英（2004）'
          assert t['printed_bibliography_page']==102
          assert t['bibliography_entry_title']=='百川歸海，蔚為大觀'
          a=e['cross_publication_adjudication']
          assert a['baichuan_contains_wenji_page_335']=='HIGH_CONFIDENCE_CROSS_PUBLICATION_CITATION_BRIDGE'
          assert a['direct_2004_page_335_reviewed'] is False
          assert a['baichuan_exact_page_range']=='UNRESOLVED'
          assert a['page_interpolation_from_p335']=='NOT_AUTHORIZED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,208,0)
          assert bid in state['historical_audit']['completed_batches']
          latest=state['historical_audit']['latest_batch_doc']
          assert isinstance(latest,str) and latest.startswith('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-') and latest.endswith('.md')
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-TAIWAN-NCL-2015-BAICHUAN-WENJI-BIBLIOGRAPHIC-CONTROL']['batch_12gv']['printed_bibliography_page']==102
          assert src['EXT-DPM-LIU-QIANG-2010-TIANLU-PP62-63-JI383-385-CONTEXT']['batch_12gv']['wenji_cited_page']==335
          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          PY
