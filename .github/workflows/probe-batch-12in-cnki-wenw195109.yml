name: probe-batch-12in-cnki-wenw195109

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12in-cnki-wenw195109.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe safe public CNKI host variants and candidate family
        run: |
          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          control_code="WENW195106001"
          target_prefix="WENW195109"
          bases=[
              "https://www.cnki.com.cn/Article/CJFDTotal-{code}.htm",
              "https://cnki.com.cn/Article/CJFDTotal-{code}.htm",
              "http://www.cnki.com.cn/Article/CJFDTotal-{code}.htm",
              "http://cnki.com.cn/Article/CJFDTotal-{code}.htm",
          ]

          def curl_probe(template, code):
              url=template.format(code=code)
              cmd=[
                  "curl","-L","--max-time","20","--connect-timeout","8",
                  "--silent","--show-error",
                  "-A","Mozilla/5.0 (Tianwen provenance audit; public index probe)",
                  "-w","\\n__CURL_META__%{http_code}|%{url_effective}|%{content_type}|%{size_download}",
                  url
              ]
              p=subprocess.run(cmd,capture_output=True,text=True)
              out=p.stdout
              meta=None
              body=out
              if "\n__CURL_META__" in out:
                  body,meta=out.rsplit("\n__CURL_META__",1)
              row={
                  "url":url,
                  "code":code,
                  "curl_exit":p.returncode,
                  "stderr":p.stderr.strip()[:600],
              }
              if meta:
                  parts=meta.strip().split("|",3)
                  if len(parts)==4:
                      row.update({"http_code":parts[0],"final_url":parts[1],"content_type":parts[2],"size_download":parts[3]})
              row.update({
                  "body_chars":len(body),
                  "has_zhao":"赵万里" in body,
                  "has_yongle":"永乐大典" in body,
                  "has_target_title":"永乐大典展览的意义" in body,
                  "has_wenwu":"文物参考资料" in body,
                  "has_control_title":"禁止珍贵文物图书出口暂行办法" in body,
              })
              m=re.search(r"<title[^>]*>(.*?)</title>",body,re.I|re.S)
              row["html_title"]=re.sub(r"\s+"," ",m.group(1)).strip()[:300] if m else None
              return row

          controls=[]
          viable=[]
          for base in bases:
              r=curl_probe(base,control_code)
              r["route_template"]=base
              controls.append(r)
              print("CONTROL="+json.dumps(r,ensure_ascii=False))
              if r.get("curl_exit")==0 and r.get("http_code") not in (None,"000") and r.get("body_chars",0)>0:
                  viable.append(base)

          # Enumerate the target issue only through routes that passed transport on
          # the known-positive control. No certificate verification is disabled.
          target_rows=[]
          for base in viable:
              for n in range(1,41):
                  code=f"{target_prefix}{n:03d}"
                  r=curl_probe(base,code)
                  r["route_template"]=base
                  target_rows.append(r)
                  print("TARGET="+json.dumps(r,ensure_ascii=False))

          positives=[r for r in target_rows if r.get("has_zhao") or r.get("has_yongle") or r.get("has_target_title")]
          result={
              "tls_verification_bypassed":False,
              "known_positive_control_code":control_code,
              "control_routes":controls,
              "viable_route_templates":viable,
              "target_candidate_count_probed":len(target_rows),
              "target_positives":positives,
              "target_rows":target_rows,
          }
          Path("cnki-wenw195109-safe-host-probe.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print("VIABLE="+json.dumps(viable,ensure_ascii=False))
          print("POSITIVES="+json.dumps(positives,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12in-cnki-wenw195109-safe-host-probe
          path: cnki-wenw195109-safe-host-probe.json
