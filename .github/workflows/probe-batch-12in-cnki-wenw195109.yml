name: probe-batch-12in-cnki-wenw195109

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12in-cnki-wenw195109.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe public CNKI static article index candidates
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error
          from pathlib import Path

          rows=[]
          headers={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; public index probe)"}
          for n in range(1, 41):
              code=f"WENW195109{n:03d}"
              url=f"https://www.cnki.com.cn/Article/CJFDTotal-{code}.htm"
              req=urllib.request.Request(url, headers=headers)
              row={"code":code,"url":url}
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body=r.read(800000).decode("utf-8","ignore")
                      row.update({
                          "status":r.status,
                          "final_url":r.geturl(),
                          "bytes_read":len(body.encode("utf-8")),
                          "has_zhao":"赵万里" in body,
                          "has_yongle":"永乐大典" in body,
                          "has_target_title":"永乐大典展览的意义" in body,
                          "has_wenwu":"文物参考资料" in body,
                      })
                      m=re.search(r"<title[^>]*>(.*?)</title>", body, re.I|re.S)
                      row["html_title"]=re.sub(r"\s+"," ",m.group(1)).strip()[:300] if m else None
              except urllib.error.HTTPError as e:
                  row.update({"status":e.code,"error":"HTTPError"})
                  try:
                      b=e.read(200000).decode("utf-8","ignore")
                      row["body_prefix"]=re.sub(r"\s+"," ",b)[:300]
                  except Exception:
                      pass
              except Exception as e:
                  row.update({"status":None,"error":type(e).__name__+":"+str(e)[:200]})
              print(json.dumps(row,ensure_ascii=False))
              rows.append(row)
          Path("cnki-wenw195109-probe.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
          positives=[r for r in rows if r.get("has_zhao") or r.get("has_yongle") or r.get("has_target_title")]
          print("POSITIVES="+json.dumps(positives,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12in-cnki-wenw195109-probe
          path: cnki-wenw195109-probe.json
