name: verify-batch-12io-exact-head
# Durable exact-head gate: publisher identity may close; TOC object/pagination must remain evidence-scoped.

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12io-exact-head.yml
      - docs/research/ZIWEI-NLCPRESS-JI15-FIRST-PARTY-PRODUCT-IDENTITY-AND-TOC-ATTACHMENT-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLCPRESS-JI15-FIRST-PARTY-PRODUCT-IDENTITY-AND-TOC-ATTACHMENT-BOUNDARY-IO.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
      - .github/workflows/probe-batch-12io-nlcpress-ji15-search-contract.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IO status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'tianwen/batch-12io-exact-head',
              description: 'Batch 12IO publisher identity / TOC boundary verification running'
            })
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12IO exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-NLCPRESS-JI15-FIRST-PARTY-PRODUCT-IDENTITY-AND-TOC-ATTACHMENT-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-NLCPRESS-JI15-FIRST-PARTY-PRODUCT-IDENTITY-AND-TOC-ATTACHMENT-BOUNDARY-IO'
          assert e['official_product_discovery']['target_list_page']==361
          assert e['official_product_discovery']['source_emitted_product_href']=='ProductView.aspx?Id=4660'
          assert e['official_product_discovery']['id_guessing_used'] is False
          assert e['first_party_product_identity']['product_id']==4660
          assert e['first_party_product_identity']['isbn_13']=='9787501340637'
          assert e['first_party_product_identity']['publication_date']=='2009-07-29'
          assert e['related_download_template_boundary']['literal_catalog_anchor']['href'] is None
          assert e['related_download_template_boundary']['product_specific_catalog_attachment_url']=='UNRESOLVED'
          assert e['related_download_template_boundary']['full_book_txt_postback_invoked'] is False
          assert e['public_resource_center_crosscheck']['page_count']==1
          assert e['public_resource_center_crosscheck']['target_attachment_absence_claim_authorized'] is False
          assert e['pagination_adjudication']['exact_chapter_9_page_range']=='UNRESOLVED'
          assert e['pagination_adjudication']['direct_chapter_9_text']=='NOT_REVIEWED'
          assert e['pagination_adjudication']['interpolation_to_chapter_9_authorized'] is False
          assert e['project_consequence']['product_change'] is False
          PY
      - name: Publish success IO status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12io-exact-head',
              description: 'Batch 12IO exact-head verification passed'
            })
      - name: Publish failure IO status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12io-exact-head',
              description: 'Batch 12IO exact-head verification failed'
            })
