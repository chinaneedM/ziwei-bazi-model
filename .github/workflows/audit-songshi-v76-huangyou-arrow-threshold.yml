name: audit-songshi-v76-huangyou-arrow-threshold

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-songshi-v76-huangyou-arrow-threshold.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install DjVu/image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install --quiet pillow

      - name: Acquire Songshi vols 76-77 and render Huangyou clepsydra locus
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/songshi-v76-huangyou-arrow-threshold'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/render"
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/CADAL06060932%20%E5%AE%8B%E5%8F%B2%C2%B7%E5%8D%B7%E4%B8%83%E5%8D%81%E5%85%AD~%E5%8D%B7%E4%B8%83%E5%8D%81%E4%B8%83.djvu'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.djvu"
          sha256sum "$ROOT/source.djvu" | tee "$ROOT/source.sha256"
          djvused "$ROOT/source.djvu" -e n | tee "$ROOT/page-count.txt"
          djvutxt "$ROOT/source.djvu" > "$ROOT/text.txt" || true

          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('audit/songshi-v76-huangyou-arrow-threshold')
          text=(root/'text.txt').read_text(encoding='utf-8',errors='ignore')
          terms=['皇祐漏刻','皇祐','黃道升降','黄道升降','二度四十分','改箭','四十一箭','每差一刻']
          hits={t:[m.start() for m in re.finditer(re.escape(t),text)] for t in terms}
          (root/'text-hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:len(v) for k,v in hits.items()},ensure_ascii=False))
          PY

          PAGES="$(cat "$ROOT/page-count.txt")"
          test "$PAGES" -eq 152
          for i in $(seq 1 "$PAGES"); do
            TMP="$ROOT/render/$(printf '%03d' "$i").tif"
            OUT="$ROOT/render/$(printf '%03d' "$i").jpg"
            ddjvu -format=tiff -page="$i" -scale=170 "$ROOT/source.djvu" "$TMP" >/dev/null 2>&1
            python -c "from PIL import Image; import sys; Image.open(sys.argv[1]).convert('RGB').save(sys.argv[2],quality=91)" "$TMP" "$OUT"
            rm -f "$TMP"
          done
          sha256sum "$ROOT"/render/*.jpg > "$ROOT/render.sha256"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json
          root=Path('audit/songshi-v76-huangyou-arrow-threshold')
          imgs=sorted((root/'render').glob('*.jpg'))
          sheets=[]
          for start in range(0,len(imgs),20):
              batch=imgs[start:start+20]
              thumbs=[]
              for p in batch:
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((300,430))
                  c=Image.new('RGB',(320,470),'white')
                  c.paste(im,((320-im.width)//2,20))
                  ImageDraw.Draw(c).text((10,445),p.stem,fill='black')
                  thumbs.append(c)
              cols=5; rows=(len(thumbs)+cols-1)//cols
              sh=Image.new('RGB',(cols*320,rows*470),'white')
              for j,im in enumerate(thumbs):
                  sh.paste(im,((j%cols)*320,(j//cols)*470))
              out=root/f'contact-{start//20+1:02d}.jpg'
              sh.save(out,quality=90); sheets.append(out.name)
          report={
            'schema':'SONGSHI-V76-HUANGYOU-ARROW-THRESHOLD-PHYSICAL-LOCATOR-R1',
            'source':'CADAL06060932 宋史·卷七十六~卷七十七',
            'provider_route':'Wikimedia Commons public CADAL surrogate',
            'page_count':len(imgs),
            'contact_sheets':sheets,
            'text_layer_authority':'LOCATOR_ONLY_NOT_GLYPH_AUTHORITY',
            'physical_image_authority':'DIRECT_FACSIMILE_REVIEW_REQUIRED_FOR_FINAL_GLYPH_CLAIMS',
            'ocr_used_for_final_glyph_claims':False,
            'research_question':'Does the received Songshi physical witness directly preserve Huangyou clepsydra rules that discretize continuous ecliptic-rise/fall differences into one-ke arrow changes, establishing a historical post-computation binning family distinct from the exact Sanming 1578 fingerprint?'
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Upload Songshi physical locator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songshi-v76-huangyou-arrow-threshold
          path: audit/songshi-v76-huangyou-arrow-threshold
          if-no-files-found: error
          retention-days: 30
