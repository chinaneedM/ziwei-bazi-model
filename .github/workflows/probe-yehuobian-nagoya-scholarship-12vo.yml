name: probe-yehuobian-nagoya-scholarship-12vo
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths: [.github/workflows/probe-yehuobian-nagoya-scholarship-12vo.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Source-bound scholarly PDF capture and embedded-text locator search
        run: |
          mkdir -p nagoya-12vo
          python - <<'PY'
          import pathlib,urllib.request,json,hashlib,subprocess,shutil,time
          urls={
           'inoue2019':'https://nagoya.repo.nii.ac.jp/record/2010546/files/toykhj_43_51.pdf',
           'inoue2020':'https://nagoya.repo.nii.ac.jp/record/2010538/files/toykhj_44_81.pdf',
           'inoue2021':'https://nagoya.repo.nii.ac.jp/record/2010528/files/toykhj_45_99.pdf'}
          out={'scope':'OPEN_INSTITUTIONAL_SCHOLARSHIP_NOT_ANCIENT_GLYPH; EMBEDDED_TEXT_ONLY_NO_OCR','requests':[]}
          for key,url in urls.items():
              x={'id':key,'url':url,'status':None,'pdf_obtained':False}
              try:
                  with urllib.request.urlopen(url,timeout=25) as resp:
                      raw=resp.read(10000001);x.update(status=resp.status,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),complete=len(raw)<=10000000)
                      if raw.startswith(b'%PDF') and x['complete']:
                          p=pathlib.Path('nagoya-12vo/'+key+'.pdf');p.write_bytes(raw);x['pdf_obtained']=True
                          if shutil.which('pdftotext'):
                              subprocess.run(['pdftotext','-layout',str(p),str(p.with_suffix('.txt'))],check=True)
                              t=p.with_suffix('.txt').read_text();x['embedded_text_chars']=len(t)
                              terms=['改造漏刻','改造','漏刻','哈佛','ハーバード','慶應','扶荔','扶茘','巻二十','卷二十']
                              x['locator_hits']={term:[t[max(0,i-90):i+200] for i in [t.find(term)] if i>=0] for term in terms}
              except Exception as e:x['error']=type(e).__name__+': '+str(e)[:200]
              out['requests'].append(x);print(json.dumps(x,ensure_ascii=False));time.sleep(1.1)
          pathlib.Path('nagoya-12vo/summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yehuobian-nagoya-scholarship-locators-12vo
          path: nagoya-12vo
          retention-days: 30
