name: render-yimen26-sizijing-navigation

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-yimen26-sizijing-navigation.yml

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install DjVu tools and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install --quiet pillow
      - name: Download exact public-domain Yimen volume 26 scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pages
          curl -L --fail --retry 3 'https://commons.wikimedia.org/wiki/Special:Redirect/file/%E6%98%8E%E5%88%BB%E6%9C%AC%E5%A4%B7%E9%96%80%E5%BB%A3%E7%89%9826.djvu' -o out/yimen26.djvu
          sha256sum out/yimen26.djvu > out/sha256.txt
          djvused out/yimen26.djvu -e 'n' > out/page-count.txt
      - name: Render all navigation pages without OCR
        shell: bash
        run: |
          set -euo pipefail
          pages=$(cat out/page-count.txt)
          for i in $(seq 1 "$pages"); do
            ddjvu -format=ppm -page="$i" -scale=18 out/yimen26.djvu out/pages/p$(printf '%03d' "$i").ppm >/dev/null 2>&1
          done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math
          files=sorted(Path('out/pages').glob('p*.ppm'))
          for start in range(0,len(files),36):
              subset=files[start:start+36]
              cells=[]
              for p in subset:
                  num=int(p.stem[1:])
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((180,250))
                  c=Image.new('RGB',(200,285),'white')
                  c.paste(im,((200-im.width)//2,5))
                  ImageDraw.Draw(c).text((8,265),f'p{num}',fill='black')
                  cells.append(c)
              cols=6; rows=math.ceil(len(cells)/cols)
              sheet=Image.new('RGB',(cols*200,rows*285),'white')
              for j,c in enumerate(cells): sheet.paste(c,((j%cols)*200,(j//cols)*285))
              a=start+1; b=start+len(subset)
              sheet.save(f'out/contact-{a:03d}-{b:03d}.jpg',quality=90)
          PY
          rm out/pages/*.ppm
      - name: Upload navigation
        uses: actions/upload-artifact@v4
        with:
          name: yimen26-sizijing-navigation
          path: |
            out/contact-*.jpg
            out/*.txt
          retention-days: 30
