name: research-bnu-jishutang-catalog-route-ae

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-bnu-jishutang-catalog-route-ae.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect published BNU ancient-book catalog entry routes
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT = Path("probe"); OUT.mkdir()
          UA = "Mozilla/5.0 provenance-research public-institutional-catalog"
          seeds = [
              ("bnu_digi_search_http", "http://digi2.lib.bnu.edu.cn:8080/digilib/search"),
              ("bnu_digi_search_https", "https://digi2.lib.bnu.edu.cn:8080/digilib/search"),
              ("bnu_digi_channel_published", "http://digi2.lib.bnu.edu.cn:8080/digilib/search?channelid=26966"),
          ]

          def fetch(url, limit=8_000_000):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml,application/json,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.5",
              })
              try:
                  with urllib.request.urlopen(req, timeout=35) as resp:
                      data = resp.read(limit)
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "bytes": 0, "data": b""}

          result = {
              "schema": "ZIWEI-BNU-JISHUTANG-PUBLIC-CATALOG-ROUTE-AE-R1",
              "access_date": "2026-09-09",
              "target_title": "新鋟希夷陳先生紫微斗數全書四卷",
              "target_imprint": "繼述堂",
              "authentication_attempted": False,
              "identifier_guessing_attempted": False,
              "access_control_bypass_attempted": False,
              "form_submission_attempted": False,
              "routes": [],
          }

          for label, url in seeds:
              row = fetch(url); raw = row.pop("data")
              rec = {"label": label, "url": url, **row, "forms": [], "links": []}
              if raw:
                  text = None
                  for enc in ("utf-8", "gb18030", "big5", "latin1"):
                      try:
                          text = raw.decode(enc); break
                      except Exception:
                          pass
                  text = text or raw.decode("utf-8", "replace")
                  (OUT / f"{label}.html").write_text(text, encoding="utf-8")
                  rec["title_literals"] = {
                      "ziwei_title": ("紫微斗數" in text or "紫微斗数" in text),
                      "jishutang": ("繼述堂" in text or "继述堂" in text),
                  }
                  for i, m in enumerate(re.finditer(r"<form\b[^>]*>(.*?)</form\s*>", text, re.I | re.S), 1):
                      block = m.group(0)
                      open_tag = block.split(">", 1)[0] + ">"
                      action_m = re.search(r'''action\s*=\s*["']([^"']*)["']''', open_tag, re.I)
                      method_m = re.search(r'''method\s*=\s*["']([^"']*)["']''', open_tag, re.I)
                      form = {
                          "index": i,
                          "action_raw": html.unescape(action_m.group(1)) if action_m else "",
                          "action_url": urllib.parse.urljoin(row.get("final_url") or url, html.unescape(action_m.group(1))) if action_m else (row.get("final_url") or url),
                          "method": (method_m.group(1).upper() if method_m else "GET"),
                          "controls": [],
                      }
                      for tag in re.findall(r"<(?:input|select|textarea)\b[^>]*>", block, re.I):
                          name_m = re.search(r'''name\s*=\s*["']([^"']+)["']''', tag, re.I)
                          type_m = re.search(r'''type\s*=\s*["']([^"']+)["']''', tag, re.I)
                          value_m = re.search(r'''value\s*=\s*["']([^"']*)["']''', tag, re.I)
                          if name_m:
                              form["controls"].append({
                                  "name": html.unescape(name_m.group(1)),
                                  "type": type_m.group(1).lower() if type_m else None,
                                  "value": html.unescape(value_m.group(1)) if value_m else None,
                              })
                      rec["forms"].append(form)

                  links = []
                  for m in re.finditer(r'''href\s*=\s*["']([^"']+)["']''', text, re.I):
                      u = urllib.parse.urljoin(row.get("final_url") or url, html.unescape(m.group(1)))
                      if u.startswith(("http://", "https://")) and u not in links:
                          links.append(u)
                  rec["links"] = links[:200]
                  rec["catalog_context_snippets"] = []
                  for needle in ("检索", "搜索", "书名", "題名", "题名", "古籍", "channelid"):
                      pos = 0
                      while True:
                          j = text.find(needle, pos)
                          if j < 0: break
                          rec["catalog_context_snippets"].append(text[max(0,j-250):min(len(text),j+500)])
                          pos = j + len(needle)
                          if len(rec["catalog_context_snippets"]) >= 20: break
                      if len(rec["catalog_context_snippets"]) >= 20: break
              result["routes"].append(rec)

          result["adjudication"] = {
              "public_catalog_root_reached": any(r.get("ok") and r.get("status") == 200 for r in result["routes"]),
              "published_search_form_observed": any(r.get("forms") for r in result["routes"]),
              "target_bnu_item_bound": False,
              "target_page_bound": False,
              "next_action": "REVIEW_SOURCE_EMITTED_FORM_BEFORE_ANY_QUERY_SUBMISSION",
              "independent_textual_witness_increment": 0,
              "algorithm_effect": "NONE",
          }
          (OUT / "bnu-jishutang-catalog-route-ae.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "routes": [
                  {
                      "label": r["label"], "ok": r.get("ok"), "status": r.get("status"),
                      "final_url": r.get("final_url"), "bytes": r.get("bytes"),
                      "error": r.get("error"), "forms": r.get("forms"),
                  }
                  for r in result["routes"]
              ],
              "adjudication": result["adjudication"],
          }, ensure_ascii=False, indent=2))

      - name: Upload BNU catalog route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-bnu-jishutang-catalog-route-ae
          path: probe/
          if-no-files-found: warn
          retention-days: 14
