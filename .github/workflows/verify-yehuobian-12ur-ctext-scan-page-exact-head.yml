name: verify-yehuobian-12ur-ctext-scan-page-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12ur-ctext-scan-page-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UR-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UR-*.md
      - scripts/probe-yehuobian-ctext-scanned-book-12ur.py
      - tests/test_yehuobian_ctext_scanned_page_probe_12ur.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source integrity and continuity
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Verify strict metadata-only OCR scan boundaries
        run: |
          set -euo pipefail
          python scripts/probe-yehuobian-ctext-scanned-book-12ur.py
          python -m unittest discover -s tests -p 'test_yehuobian_ctext_scanned_page_probe_12ur.py' -v
      - name: Probe source-published CText public endpoints without ID guessing or image fetch
        run: |
          python scripts/probe-yehuobian-ctext-scanned-book-12ur.py --live --output source-probe-12ur.json
      - name: Archive reproducible probe metadata
        uses: actions/upload-artifact@v4
        with:
          name: yehuobian-12ur-ctext-public-image-crosswalk
          path: source-probe-12ur.json
          retention-days: 30
