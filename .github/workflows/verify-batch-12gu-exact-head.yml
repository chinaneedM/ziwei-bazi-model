name: verify-batch-12gu-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gu-exact-head.yml
      - docs/research/ZIWEI-WENJIN-XUEZHI-V3-JAPAN-PHYSICAL-HOLDINGS-AND-OPAC-ACCESS-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-WENJIN-XUEZHI-V3-JAPAN-PHYSICAL-HOLDINGS-AND-OPAC-ACCESS-BOUNDARY-GU.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GU exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-WENJIN-XUEZHI-V3-JAPAN-PHYSICAL-HOLDINGS-AND-OPAC-ACCESS-BOUNDARY-GU'
          e=json.loads(Path('docs/research/ZIWEI-WENJIN-XUEZHI-V3-JAPAN-PHYSICAL-HOLDINGS-AND-OPAC-ACCESS-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          c=e['cinii_serial_control']
          assert c['ncid']=='BA65589403'
          assert c['target_volume_number']==3
          assert c['target_isbn_13']=='9787501340859'
          hs=e['exact_volume3_holdings']
          assert len(hs)==3
          assert {(x['institution'],x['call_number'],x['holding_or_item_identifier']) for x in hs}=={
            ('京都大学 人文科学研究所 図書室','020.22||Ko/43||3','200035254509'),
            ('京都大学 文学研究科 図書館','FXIIb||B||7','200019220216'),
            ('東京大学 大学院人文社会系研究科・文学部 図書室','3号館B37:Guo:3','4818863757'),
          }
          a=e['access_adjudication']
          assert a['supplement_article_author']=='UNRESOLVED'
          assert a['supplement_article_page_range']=='UNRESOLVED'
          assert a['supplement_article_body']=='NOT_REVIEWED'
          assert a['opac_403_means_library_human_access_denied'] is False
          assert a['project_submitted_reference_request'] is False
          assert a['project_submitted_copy_request'] is False
          assert a['project_transmitted_user_identity'] is False
          assert a['project_incurred_fee'] is False
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,207,0)
          assert bid in state['historical_audit']['completed_batches']
          latest=state['historical_audit']['latest_batch_doc']
          assert isinstance(latest,str) and latest.startswith('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-') and latest.endswith('.md')
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-CINII-WENJIN-XUEZHI-SERIAL-V3-ISBN9787501340859']['batch_12gu']['exact_physical_holding_route_count']==3
          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          PY
