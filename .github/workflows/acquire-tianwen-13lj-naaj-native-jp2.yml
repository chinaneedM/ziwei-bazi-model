name: acquire-tianwen-13lj-naaj-native-jp2
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13lj-naaj-native-jp2.py
      - .github/workflows/acquire-tianwen-13lj-naaj-native-jp2.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  public-source-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - run: python scripts/acquire-tianwen-13lj-naaj-native-jp2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13lj-naaj-native-jp2-six-pages
          path: 13lj-naaj-jp2-output/
          retention-days: 7
