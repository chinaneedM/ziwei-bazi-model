name: research-ziwei-fullbook-volume4-dynamic-route-ae

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-fullbook-volume4-dynamic-route-ae.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decode public index pages and inspect source-emitted dynamic routes
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path('probe'); OUT.mkdir()
          UA='Mozilla/5.0 provenance-research public-dynamic-route'
          pages=[
            ('sanfenge','https://www.sanfenge.com/col.jsp?id=112&m485pageno=2'),
            ('xinghun','https://www.xinghunw.com/2056.html'),
            ('fengba','https://www.fengba.net/resource/detail/HQV5MC5RFLKMTCQH7RG3I44B3M'),
          ]
          needles=['紫薇斗数全书卷4.pdf','紫薇斗数全书卷四.pdf','紫微斗数全书卷4.pdf','紫微斗数全书卷四.pdf']

          def get(url, referer=None, limit=8_000_000):
            headers={'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.5','Accept-Encoding':'identity'}
            if referer: headers['Referer']=referer
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=35) as r:
                data=r.read(limit)
                return {'ok':True,'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('content-type'),'content_encoding':r.headers.get('content-encoding'),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'data':data}
            except Exception as e:
              return {'ok':False,'error':repr(e),'bytes':0,'data':b''}

          def decode(raw):
            for enc in ('utf-8','gb18030','big5','latin1'):
              try: return raw.decode(enc), enc
              except Exception: pass
            return raw.decode('utf-8','replace'), 'utf-8-replace'

          result={'schema':'ZIWEI-FULLBOOK-VOLUME4-DYNAMIC-ROUTE-AE-R1','access_date':'2026-09-09','authentication_attempted':False,'purchase_attempted':False,'identifier_guessing_attempted':False,'access_control_bypass_attempted':False,'pages':[],'candidate_routes':[]}
          for label,url in pages:
            row=get(url); raw=row.pop('data')
            rec={'label':label,'url':url,**row,'decode_encoding':None,'needle_hits':[],'contexts':[],'source_emitted_routes':[],'script_sources':[]}
            if raw:
              (OUT/f'{label}.raw').write_bytes(raw)
              txt,enc=decode(raw); rec['decode_encoding']=enc
              (OUT/f'{label}.html').write_text(txt,encoding='utf-8')
              low=txt.lower()
              for needle in needles:
                for m in re.finditer(re.escape(needle),txt,re.I):
                  rec['needle_hits'].append(needle)
                  rec['contexts'].append(txt[max(0,m.start()-1800):min(len(txt),m.end()+3200)])
              routes=[]
              for m in re.finditer(r'''(?:href|src|action|data-url|data-href|data-link|content)\s*=\s*["']([^"']+)["']''',txt,re.I):
                v=html.unescape(m.group(1)).replace('\\/','/').strip()
                if not v or v.startswith(('javascript:','#','data:')): continue
                u=urllib.parse.urljoin(row.get('final_url') or url,v)
                if u not in routes: routes.append(u)
              # Also retain API-like literal routes from scripts without guessing parameters.
              for m in re.finditer(r'''["']((?:https?:)?//[^"']+|/[A-Za-z0-9_./?=&%-]{4,})["']''',txt):
                v=html.unescape(m.group(1)).replace('\\/','/')
                u=urllib.parse.urljoin(row.get('final_url') or url,v)
                if u not in routes: routes.append(u)
              for u in routes:
                ul=u.lower()
                if ul.endswith('.js') or '.js?' in ul: rec['script_sources'].append(u)
                if any(k in ul for k in ('ajax','api','load','list','module','col.jsp','quark','pan.baidu','aliyundrive','download','file','resource','pdf')):
                  rec['source_emitted_routes'].append(u)
                  result['candidate_routes'].append({'source_page':label,'url':u})
            result['pages'].append(rec)

          # Fetch source-emitted scripts only, then search them for API route literals and the visible module id m485.
          script_rows=[]
          seen=set()
          for p in result['pages']:
            for u in p['script_sources'][:80]:
              if u in seen: continue
              seen.add(u)
              row=get(u,referer=p['url'],limit=4_000_000); raw=row.pop('data')
              sr={'source_page':p['label'],'url':u,**row,'contains_m485':False,'api_like_literals':[]}
              if raw:
                txt,enc=decode(raw); sr['decode_encoding']=enc
                sr['contains_m485']='m485' in txt
                lits=[]
                for m in re.finditer(r'''["']((?:https?:)?//[^"']+|/[A-Za-z0-9_./?=&%-]{4,})["']''',txt):
                  v=html.unescape(m.group(1)).replace('\\/','/')
                  if any(k in v.lower() for k in ('ajax','api','module','col.jsp','load','list')) and v not in lits: lits.append(v)
                sr['api_like_literals']=lits[:80]
              script_rows.append(sr)
          result['scripts']=script_rows
          result['adjudication']={'search_index_filename_observed_externally':True,'provider_source_filename_observed':any(p['needle_hits'] for p in result['pages']),'direct_pdf_observed':False,'edition_identity':'UNRESOLVED','target_page_status':'NOT_CLAIMED','algorithm_effect':'NONE'}
          (OUT/'ziwei-fullbook-volume4-dynamic-route-ae.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'pages':[{'label':p['label'],'ok':p.get('ok'),'status':p.get('status'),'bytes':p.get('bytes'),'content_encoding':p.get('content_encoding'),'decode_encoding':p.get('decode_encoding'),'needle_hits':p['needle_hits'],'routes':p['source_emitted_routes'][:40],'scripts':p['script_sources'][:30]} for p in result['pages']],'script_findings':[{'source_page':s['source_page'],'url':s['url'],'ok':s.get('ok'),'status':s.get('status'),'contains_m485':s.get('contains_m485'),'api_like_literals':s.get('api_like_literals')} for s in script_rows if s.get('contains_m485') or s.get('api_like_literals')],'adjudication':result['adjudication']},ensure_ascii=False,indent=2))

      - name: Upload decoded dynamic-route artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-fullbook-volume4-dynamic-route-ae
          path: probe/
          if-no-files-found: warn
          retention-days: 14
