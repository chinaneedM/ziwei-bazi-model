name: research-ziwei-yulgok-shushu-node-ak

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-yulgok-shushu-node-ak.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact source-emitted Yulgok shushu node
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path("probe"); OUT.mkdir()
          base="https://db.yulgok.or.kr"
          viewer=base+"/viewer/view?dataId=B005_01_B00320_001"
          url=base+"/viewer/treeAjax?itemId=PD&cate=organImg&depth=5&upPath=%EA%B0%9C%EC%9D%B8%5EB005%5E%EA%B3%A0%EC%A0%84%EC%A0%81%5E%EC%9E%90%EB%B6%80%5E%EC%88%A0%EC%88%98%EB%A5%98%28%E8%A1%93%E6%95%B8%E9%A1%9E%29&dataId="
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 provenance-research yulgok-shushu-node","Referer":viewer,"Accept-Language":"ko,en;q=0.7"})
          try:
              with urllib.request.urlopen(req,timeout=35) as r:
                  data=r.read(2500000); status=r.status; final=r.geturl(); ct=r.headers.get("content-type")
          except Exception as e:
              data=b""; status=None; final=url; ct=None; err=repr(e)
          txt=data.decode("utf-8","replace")
          (OUT/"shushu-node.html").write_text(txt,encoding="utf-8")
          ids=[]
          for pat in [
              r'''data-code=['"]([^'"]+)['"]''',
              r'''dataId=([A-Za-z0-9_\-]+)''',
              r'''B005_01_B00320_[A-Za-z0-9_\-]+'''
          ]:
              for m in re.finditer(pat,txt):
                  v=m.group(1) if m.lastindex else m.group(0)
                  if v and v not in ids: ids.append(v)
          contexts=[]
          for needle in ("B00320","紫薇","斗數","자미","두수","新鑴希夷","校正"):
              start=0
              while True:
                  k=txt.find(needle,start)
                  if k<0: break
                  contexts.append({"needle":needle,"text":txt[max(0,k-1000):min(len(txt),k+2600)]})
                  start=k+len(needle)
          result={"schema":"ZIWEI-YULGOK-SHUSHU-NODE-AK-R1","access_date":"2026-09-09","url":url,"url_provenance":"EXACT_URL_EMITTED_BY_B005_TREE_RESPONSE","status":status,"final_url":final,"content_type":ct,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest() if data else None,"observed_ids":ids,"contexts":contexts,"authentication_attempted":False,"identifier_guessing_attempted":False,"access_control_bypass_attempted":False}
          if status is None: result["error"]=err
          (OUT/"ziwei-yulgok-shushu-node-ak.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"status":status,"bytes":len(data),"observed_ids":ids,"contexts":contexts[:30]},ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-yulgok-shushu-node-ak
          path: probe/
          retention-days: 14
