name: verify-tianwen-13mb-forward-history-action
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/_tianwen_historical_action_r1.py
      - tests/test_tianwen_historical_action_view_r1.py
      - .github/workflows/verify-tianwen-13mb-forward-history-action.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -p 'test_tianwen_historical_action_view_r1.py' -v
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
