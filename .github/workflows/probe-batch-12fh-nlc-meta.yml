name: probe-batch-12fh-nlc-meta

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - '.github/workflows/probe-batch-12fh-nlc-meta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Probe current NLC holdings and legacy OPAC
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/batch-12fh-nlc-meta'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/meta/raw" "$ROOT/meta/text" "$ROOT/meta/detail" "$ROOT/opac"
          UA='Tianwen-Provenance-Audit/1.0'

          cat > "$ROOT/queries.tsv" <<'EOF'
          zhunzhai-simp	准斋心制几漏图式	TIT	true
          zhunzhai-trad	準齋心製几漏圖式	TIT	true
          zhunzhai-short-simp	准斋几漏图式	TIT	false
          tonghu-simp	铜壶漏箭制度	TIT	true
          tonghu-trad	銅壺漏箭制度	TIT	true
          doc-001775083	001775083	ANY	true
          control-001411999008601	001411999008601	ANY	true
          catalog-03482	03482	ANY	true
          catalog-03483	03483	ANY	true
          photo-00O003570	00O003570	ANY	true
          EOF

          : > "$ROOT/meta/status.tsv"
          while IFS=$'\t' read -r key q way exact; do
            out="$ROOT/meta/raw/$key.html"
            hdr="$ROOT/meta/raw/$key.headers"
            set +e
            code=$(curl -L -sS --connect-timeout 10 --max-time 45 -A "$UA" \
              -D "$hdr" -o "$out" -w '%{http_code}' -G 'https://meta.nlc.cn/v2/search' \
              --data-urlencode "q=$q" --data-urlencode "searchWay=$way" --data-urlencode "exactMatch=$exact")
            rc=$?
            set -e
            size=0; [ -f "$out" ] && size=$(wc -c < "$out")
            printf '%s\trc=%s\thttp=%s\tbytes=%s\tq=%s\tway=%s\texact=%s\n' "$key" "$rc" "$code" "$size" "$q" "$way" "$exact" >> "$ROOT/meta/status.tsv"
          done < "$ROOT/queries.tsv"

          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import re

          root=Path('audit/batch-12fh-nlc-meta/meta')
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.text=[]; self.links=[]; self.forms=[]; self.inputs=[]
              def handle_data(self,d):
                  s=' '.join(d.split())
                  if s:self.text.append(s)
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and a.get('href'):
                      self.links.append(a['href'])
                  if tag=='form': self.forms.append(a)
                  if tag=='input': self.inputs.append(a)
          links=[]
          report=[]
          targets=re.compile(r'准斋|準齋|几漏|漏箭|黄丕烈|黃丕烈|士礼居|士禮居|001775083|001411999008601|03482|03483|00O003570|索书号|索書號|条码|條碼|馆藏|館藏|善本|南区善本|南區善本',re.I)
          for p in sorted((root/'raw').glob('*.html')):
              q=P(); q.feed(p.read_text('utf-8',errors='replace'))
              text='\n'.join(q.text)+'\n'
              (root/'text'/f'{p.stem}.txt').write_text(text,encoding='utf-8')
              report.append(f'### {p.name}')
              for line in q.text:
                  if targets.search(line): report.append(line)
              for href in q.links:
                  u=urljoin('https://meta.nlc.cn/v2/search',href)
                  links.append(u)
                  if any(x in u.lower() for x in ('detail','book','record','show','item','holding')):
                      report.append('LINK\t'+u)
              for f in q.forms: report.append('FORM\t'+repr(f))
          (root/'target-hits.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          uniq=[]
          for u in links:
              if u not in uniq and urlparse(u).netloc=='meta.nlc.cn' and not re.search(r'\.(css|js|png|jpg|jpeg|gif|svg)(?:\?|$)',u,re.I):
                  uniq.append(u)
          (root/'candidate-links.txt').write_text('\n'.join(uniq[:120])+'\n',encoding='utf-8')
          PY

          : > "$ROOT/meta/detail-status.tsv"
          n=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            n=$((n+1)); [ "$n" -gt 80 ] && break
            out="$ROOT/meta/detail/$n.html"
            set +e
            code=$(curl -L -sS --connect-timeout 10 --max-time 35 -A "$UA" -o "$out" -w '%{http_code}' "$url")
            rc=$?
            set -e
            size=0; [ -f "$out" ] && size=$(wc -c < "$out")
            printf '%s\trc=%s\thttp=%s\tbytes=%s\t%s\n' "$n" "$rc" "$code" "$size" "$url" >> "$ROOT/meta/detail-status.tsv"
          done < "$ROOT/meta/candidate-links.txt"

          grep -RniE '准斋|準齋|几漏|漏箭|黄丕烈|黃丕烈|士礼居|士禮居|001775083|001411999008601|03482|03483|00O003570|索书号|索書號|条码|條碼|馆藏|館藏|南区善本|南區善本|call.?number|barcode|shelf' "$ROOT/meta/detail" > "$ROOT/meta/detail-target-hits.txt" || true

          : > "$ROOT/opac/status.tsv"
          for doc in 001775083 002597934; do
            for scheme in http https; do
              for func in direct item-global; do
                url="$scheme://opac.nlc.cn/F/?func=$func&local_base=NLC01&doc_number=$doc"
                out="$ROOT/opac/${scheme}-${doc}-${func}.html"
                set +e
                code=$(curl -L -sS --connect-timeout 8 --max-time 25 -A "$UA" -o "$out" -w '%{http_code}' "$url")
                rc=$?
                set -e
                size=0; [ -f "$out" ] && size=$(wc -c < "$out")
                printf '%s\t%s\t%s\trc=%s\thttp=%s\tbytes=%s\n' "$scheme" "$doc" "$func" "$rc" "$code" "$size" >> "$ROOT/opac/status.tsv"
              done
            done
          done
          grep -RniE '准斋|準齋|几漏|漏箭|黄丕烈|黃丕烈|士礼居|士禮居|001775083|001411999008601|03482|03483|00O003570|索书号|索書號|条码|條碼|馆藏|館藏|南区善本|南區善本' "$ROOT/opac" > "$ROOT/opac/target-hits.txt" || true

          find "$ROOT" -type f -size +0c -print0 | xargs -0 -r sha256sum | sort -V > "$ROOT/all-files.sha256"
          printf '%s\n' \
            'SOURCE=National Library of China current meta.nlc.cn holdings platform + legacy OPAC' \
            'PURPOSE=resolve original source doc 001775083 current call/barcode/item identifier and classify 001411999008601 / 00O003570' \
            'IDENTIFIER_FIREWALL=record id != historical catalog number != current call number != barcode != acquisition/donation number' \
            'NEGATIVE_POLICY=failed or empty public routes are access/index boundaries only, not proof of nonexistence' \
            'OCR_USED=false' > "$ROOT/manifest.txt"

      - name: Upload evidence probe
        uses: actions/upload-artifact@v4
        with:
          name: batch-12fh-nlc-meta-probe
          path: audit/batch-12fh-nlc-meta/
          if-no-files-found: error
          retention-days: 30
