name: research-dllibrary-ziwei-guangyi-route

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-dllibrary-ziwei-guangyi-route.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Dalian Library official Ziwei catalog object and public image routes
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          UA = "Mozilla/5.0 research-only public-library catalog probe"
          ITEM = "https://www.dl-library.net.cn/book/520/-xin-xiyi-xiansheng-ziwei--quan--519299.html"
          OLD_BOOK_LIST = "https://www.dl-library.net.cn/book/list.php?id=7"
          RARE_BOOK_LIST = "https://www.dl-library.net.cn/book/list.php?id=14"
          TARGET_TITLE = "(新鐫希夷陳先生)紫微鬥數全書"

          def fetch(url, *, max_bytes=8_000_000, redirect=True, referer=None):
              headers = {
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml,image/avif,image/webp,image/*,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
              }
              if referer:
                  headers["Referer"] = referer
              req = urllib.request.Request(url, headers=headers)
              opener = urllib.request.build_opener()
              if not redirect:
                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, req, fp, code, msg, headers, newurl):
                          return None
                  opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(req, timeout=45) as resp:
                      data = resp.read(max_bytes + 1)
                      if len(data) > max_bytes:
                          raise RuntimeError("response exceeded byte guard")
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "location": resp.headers.get("location"),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except urllib.error.HTTPError as exc:
                  data = exc.read(max_bytes)
                  return {
                      "ok": False,
                      "status": exc.code,
                      "final_url": url,
                      "location": exc.headers.get("location"),
                      "content_type": exc.headers.get("content-type"),
                      "error": repr(exc),
                      "data": data,
                  }
              except Exception as exc:
                  return {"ok": False, "final_url": url, "error": repr(exc), "data": b""}

          def meta(row):
              data = row.get("data", b"")
              return {
                  k: v for k, v in row.items() if k != "data"
              } | {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest() if data else None,
              }

          def anchors(base, data):
              text = data.decode("utf-8", "replace")
              out = []
              for href, label in re.findall(
                  r'''<a[^>]+href\s*=\s*["']([^"']+)["'][^>]*>(.*?)</a>''',
                  text,
                  flags=re.I | re.S,
              ):
                  label = re.sub(r"<[^>]+>", " ", label)
                  label = re.sub(r"\s+", " ", html.unescape(label)).strip()
                  out.append({"label": label, "url": urllib.parse.urljoin(base, html.unescape(href))})
              return out

          def forms(base, data):
              text = data.decode("utf-8", "replace")
              out = []
              for match in re.finditer(r"<form\b([^>]*)>(.*?)</form>", text, re.I | re.S):
                  attrs = match.group(1)
                  body = match.group(2)
                  action_m = re.search(r'''action\s*=\s*["']([^"']*)["']''', attrs, re.I)
                  method_m = re.search(r'''method\s*=\s*["']([^"']*)["']''', attrs, re.I)
                  inputs = []
                  for tag in re.findall(r"<input\b[^>]*>", body, re.I):
                      name_m = re.search(r'''name\s*=\s*["']([^"']+)["']''', tag, re.I)
                      type_m = re.search(r'''type\s*=\s*["']([^"']+)["']''', tag, re.I)
                      value_m = re.search(r'''value\s*=\s*["']([^"']*)["']''', tag, re.I)
                      if name_m:
                          inputs.append({
                              "name": name_m.group(1),
                              "type": type_m.group(1) if type_m else None,
                              "value": value_m.group(1) if value_m else None,
                          })
                  out.append({
                      "action": urllib.parse.urljoin(base, action_m.group(1) if action_m else ""),
                      "method": (method_m.group(1) if method_m else "GET").upper(),
                      "inputs": inputs,
                  })
              return out

          result = {
              "schema": "DALIEN-LIBRARY-ZIWEI-GUANGYI-PUBLIC-ROUTE-PROBE-R1",
              "target_title": TARGET_TITLE,
              "expected_identity": {
                  "volume_count": "四卷",
                  "edition": "石印本",
                  "publication_place": "上海",
                  "publisher_period": "廣益書局 民國",
                  "physical_form": "四冊一函",
              },
              "authentication_or_paywall_bypass_attempted": False,
              "identifier_bruteforce_attempted": False,
              "catalog_parameter_guessing_attempted": False,
              "official_surfaces": {},
              "item_anchors": [],
              "image_candidates": [],
              "image_fetches": [],
          }

          for key, url in {
              "item": ITEM,
              "old_book_catalog": OLD_BOOK_LIST,
              "rare_book_catalog": RARE_BOOK_LIST,
          }.items():
              row = fetch(url)
              record = meta(row)
              if row.get("data"):
                  record["forms"] = forms(row.get("final_url") or url, row["data"])
                  record["anchor_count"] = len(anchors(row.get("final_url") or url, row["data"]))
                  (OUT / f"dalian-{key}.html").write_bytes(row["data"])
              result["official_surfaces"][key] = record

          item = fetch(ITEM)
          item_data = item.get("data", b"")
          if item_data:
              text = item_data.decode("utf-8", "replace")
              result["item_anchors"] = anchors(ITEM, item_data)
              result["identity_text_controls"] = {
                  "title_present": "紫微" in text and ("斗數" in text or "鬥數" in text),
                  "four_juan_present": "四卷" in text,
                  "lithograph_present": "石印本" in text,
                  "shanghai_present": "上海" in text,
                  "guangyi_present": "廣益書局" in text or "广益书局" in text,
                  "four_volume_case_present": "四冊一函" in text or "四册一函" in text,
              }
              candidates = []
              for value in re.findall(
                  r'''(?:src|href)\s*=\s*["']([^"']+\.(?:jpg|jpeg|png|webp)(?:\?[^"']*)?)["']''',
                  text,
                  flags=re.I,
              ):
                  url = urllib.parse.urljoin(ITEM, html.unescape(value))
                  if url not in candidates:
                      candidates.append(url)
              result["image_candidates"] = candidates[:120]
              for idx, url in enumerate(candidates[:80]):
                  row = fetch(url, max_bytes=6_000_000, referer=ITEM)
                  rec = {"url": url, **meta(row)}
                  data = row.get("data", b"")
                  if row.get("ok") and (
                      data.startswith(b"\xff\xd8")
                      or data.startswith(b"\x89PNG")
                      or str(row.get("content_type", "")).lower().startswith("image/")
                  ):
                      suffix = ".png" if data.startswith(b"\x89PNG") else ".jpg"
                      name = f"dalian-item-image-{idx:02d}{suffix}"
                      (OUT / name).write_bytes(data)
                      rec["saved_file"] = name
                  result["image_fetches"].append(rec)

          saved = [row for row in result["image_fetches"] if row.get("saved_file")]
          result["adjudication"] = {
              "official_catalog_identity": "DIRECT_DALIAN_LIBRARY_RECORD_BOUND",
              "edition_scope": "REPUBLIC_GUANGYI_LITHOGRAPH_FOUR_JUAN_FOUR_VOLUMES_ONE_CASE",
              "saved_public_item_image_count": len(saved),
              "target_page_status": "REQUIRES_DIRECT_VISUAL_REVIEW" if saved else "NOT_OBSERVED",
              "hai_glyph_cross_edition_effect": "NONE_UNTIL_DIRECT_TARGET_PAGE",
              "algorithm_effect": "NONE",
          }

          (OUT / "dalian-ziwei-guangyi-route-probe.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps({
              "official_surfaces": {
                  key: {
                      "status": value.get("status"),
                      "bytes": value.get("bytes"),
                      "sha256": value.get("sha256"),
                      "form_count": len(value.get("forms", [])),
                  }
                  for key, value in result["official_surfaces"].items()
              },
              "identity_text_controls": result.get("identity_text_controls"),
              "item_anchor_count": len(result["item_anchors"]),
              "image_candidate_count": len(result["image_candidates"]),
              "saved_public_item_image_count": len(saved),
          }, ensure_ascii=False, indent=2))

      - name: Upload Dalian Library route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dallibrary-ziwei-guangyi-public-route
          path: probe/
          if-no-files-found: warn
          retention-days: 14
