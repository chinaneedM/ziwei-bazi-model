name: probe-nlc-gjpc-tongshu-leiju-1551

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-nlc-gjpc-tongshu-leiju-1551.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Probe National Ancient Books Census public search frontend
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/nlc-gjpc-tongshu-leiju-1551'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/js"

          BASE='https://gjpc.nlc.cn'
          LANDING="$BASE/xlsworkbench/publish"
          UA='Tianwen-Provenance-Audit/1.0'

          curl -L --fail --retry 5 --retry-all-errors --retry-delay 2             --connect-timeout 20 --max-time 90 -A "$UA"             -D "$ROOT/landing.headers" "$LANDING" -o "$ROOT/landing.html"

          sha256sum "$ROOT/landing.html" > "$ROOT/landing.sha256"

          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from pathlib import Path

          base = 'https://gjpc.nlc.cn/xlsworkbench/publish'
          html = Path('audit/nlc-gjpc-tongshu-leiju-1551/landing.html').read_text('utf-8', errors='replace')

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag == 'script' and d.get('src'):
                      self.urls.append(urljoin(base, d['src']))
          p = P()
          p.feed(html)
          Path('audit/nlc-gjpc-tongshu-leiju-1551/script-urls.txt').write_text(
              '\n'.join(dict.fromkeys(p.urls)) + '\n', encoding='utf-8')
          PY

          i=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            i=$((i+1))
            out="$ROOT/js/$(printf '%03d' "$i").js"
            curl -L --fail --retry 3 --retry-all-errors --retry-delay 2               --connect-timeout 15 --max-time 90 -A "$UA" "$url" -o "$out" || true
            printf '%s\t%s\n' "$out" "$url" >> "$ROOT/js-map.tsv"
          done < "$ROOT/script-urls.txt"

          find "$ROOT/js" -type f -size +0c -print0 | xargs -0 sha256sum | sort -V > "$ROOT/js.sha256" || true

          # Discovery only: record likely API/search routes and field names from the public frontend.
          {
            grep -RaoE --binary-files=text               'https?://[^"'"'"'[:space:]<>]+|/[A-Za-z0-9_./?=&%-]{4,}'               "$ROOT/landing.html" "$ROOT/js" 2>/dev/null || true
          } | grep -Ei               'search|query|publish|book|title|version|collect|library|xls|workbench|api|古籍|題名|题名|版本|收藏|館藏|馆藏'               | sort -u > "$ROOT/route-candidates.txt" || true

          {
            grep -RaniE --binary-files=text               'search|query|title|version|collect|library|題名|题名|版本|收藏|館藏|馆藏|普查|索書號|索书号'               "$ROOT/landing.html" "$ROOT/js" 2>/dev/null || true
          } | head -n 4000 > "$ROOT/keyword-context.txt" || true

          printf '%s\n'             'SOURCE=National Library of China / National Center for Preservation & Conservation of Ancient Books'             'DATABASE=全國古籍普查登記基本數據庫'             'LANDING=https://gjpc.nlc.cn/xlsworkbench/publish'             'TARGET_TITLE=通書類聚尅擇大全 / 通書類聚克擇大全 / 通書類聚剋擇大全'             'TARGET_EDITION=明嘉靖三十年芝城銅活字印本'             'KNOWN_SURVIVING_SCOPE=存四卷 十六至十九'             'PURPOSE=discover the public query endpoint/parameters needed to resolve holding institution and call number; do not infer a holder from secondary authorship or snippets'             'OCR_USED=false'             > "$ROOT/manifest.txt"

      - name: Upload NLC census endpoint probe
        uses: actions/upload-artifact@v4
        with:
          name: nlc-gjpc-tongshu-leiju-1551-probe
          path: audit/nlc-gjpc-tongshu-leiju-1551/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
