name: verify-yehuobian-12uy-snapshot-growth-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12uy-snapshot-growth-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-yehuobian-old20-juan20-bounded-review-r1.py
      - tests/test_yehuobian_nlc_old20_terminal_image_anchors_12uo.py
      - tests/test_yehuobian_old20_volume_seams_12up.py
      - tests/test_yehuobian_kyoto_two_item_acquisition_12um.py
      - tests/test_yehuobian_old20_juan20_bounded_review_12uq.py
      - tests/test_yehuobian_old20_snapshot_growth_12uy.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continuity and source genealogy invariants
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Old source snapshot regression and current growth
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-old20-juan20-bounded-review-r1.py
          python -m unittest discover -s tests -p 'test_yehuobian_old20_snapshot_growth_12uy.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_nlc_old20_terminal_image_anchors_12uo.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_old20_volume_seams_12up.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_kyoto_two_item_acquisition_12um.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_old20_juan20_bounded_review_12uq.py' -v
