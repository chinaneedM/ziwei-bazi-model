name: verify-yehuobian-12uh-catalog-scope-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12uh-catalog-scope-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-SOURCE-REGISTRY-EXTENSIONS-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UH-*.json
      - tests/test_yehuobian_early_print_catalog_scope_12uh.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate forward-only source and project state
        run: |
          set -euo pipefail
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-project-continuity-state-r1.py
      - name: Check catalog scope and independent witness gates
        run: python -m unittest discover -s tests -p 'test_yehuobian_early_print_catalog_scope_12uh.py' -v
