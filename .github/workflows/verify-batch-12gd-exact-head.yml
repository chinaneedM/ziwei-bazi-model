name: verify-batch-12gd-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gd-exact-head.yml
      - docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-PKU-TITLE-PHRASE-INDEX-NONMATCH-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-PKU-TITLE-PHRASE-INDEX-NONMATCH-BOUNDARY-GD.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GD exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-PKU-TITLE-PHRASE-INDEX-NONMATCH-BOUNDARY-GD'
          ep=Path('docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-PKU-TITLE-PHRASE-INDEX-NONMATCH-BOUNDARY-R1.json')
          dp=Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-PKU-TITLE-PHRASE-INDEX-NONMATCH-BOUNDARY-GD.md')
          assert ep.is_file() and dp.is_file()
          e=json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          c=e['source_contract']
          assert c['backend']=='https://ccj.pku.edu.cn/Search/SearchArticleByElasticsearch'
          assert c['target_article_id']=='286663046'
          assert c['title_scope']=='五石斋文史札记'
          assert c['boolean_operator']=='AND'
          assert c['executed_page_size']==100
          assert c['authentication_used'] is False
          assert c['id_enumeration_or_guessing'] is False

          s=e['scoped_probe']
          p=s['positive_control']
          assert p['success'] is True
          assert p['backend_total']=='37'
          assert p['result_count']==37
          assert p['target_match_count']==1
          assert p['target_id']=='286663046'
          assert p['target_pages']=='121-129'

          expected={
              '四千万人民券':(0,0),
              '十二箱':(9,0),
              '以归公':(4,0),
              '一月二十九日':(20,0),
              '铁琴铜剑楼':(1,0),
          }
          tests=s['phrase_tests']
          assert len(tests)==5
          for x in tests:
              er,et=expected[x['phrase']]
              assert x['result_count']==er
              assert x['target_match_count']==et
              assert x['target_current_index_match'] is False

          i=e['interpretation']
          assert i['validated_two_condition_query_mechanism'] is True
          assert i['tested_phrase_count']==5
          assert i['tested_phrase_target_match_count']==0
          assert i['classification']=='CURRENT_SEARCH_INDEX_NONMATCH_UNDER_TESTED_QUERY'
          assert i['whole_article_negative_attestation'] is False
          assert i['primary_text_negative_attestation'] is False
          assert i['page_glyph_negative_attestation'] is False

          fw=e['access_and_authority_firewall']
          for key in (
              'positive_control_required_before_interpreting_phrase_nonmatch',
              'broad_top100_nonmatch_not_negative_evidence',
              'scoped_index_nonmatch_does_not_equal_article_text_absence',
              'search_index_highlight_or_match_does_not_equal_primary_page_glyph',
              'empty_abstract_does_not_equal_empty_article',
              'no_authentication_bypass_attempted',
              'no_paywall_bypass_attempted',
              'no_article_id_enumeration_or_guessing',
              'no_provider_account_action_taken',
              'no_purchase_or_fee_incurred',
              'no_date_to_page_interpolation',
              'journal_pagination_does_not_map_to_2007_facsimile_pagination_without_direct_crosswalk',
          ):
              assert fw[key] is True

          t=e['target_status_after_batch']
          assert t['article_id']=='286663046'
          assert t['article_page_range']=='121-129'
          assert t['known_derivative_phrase_index_status']=='CURRENT_SEARCH_INDEX_NONMATCH_UNDER_TESTED_TITLE_SCOPED_QUERY'
          assert t['target_1950_01_29_exact_journal_page']=='UNRESOLVED'
          assert t['target_1950_01_29_primary_journal_text']=='NOT_REVIEWED'
          assert t['target_1950_01_29_exact_facsimile_page']=='UNRESOLVED'
          assert t['target_1950_01_29_handwriting_directly_collated'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          state_schema_version=tuple(int(part) for part in state['schema_version'].split('.'))
          assert state_schema_version >= (1, 190, 0)
          assert bid in state['historical_audit']['completed_batches']

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src=next(x for x in reg['sources'] if x.get('source_id')=='EXT-PKU-CCJ-WUSHIZHAI28-2008-03-PP121-129-INDEX')
          b=src['batch_12gd']
          assert b['target_article_id']=='286663046'
          assert b['positive_control_success'] is True
          assert b['classification']=='CURRENT_SEARCH_INDEX_NONMATCH_UNDER_TESTED_TITLE_SCOPED_QUERY'
          assert b['whole_article_negative_attestation'] is False
          assert b['primary_text_negative_attestation'] is False
          assert b['page_glyph_negative_attestation'] is False
          assert b['no_article_id_enumeration_or_guessing'] is True

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_row_count_change'] is False
          PY
