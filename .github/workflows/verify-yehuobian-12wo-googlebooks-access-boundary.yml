name: verify-yehuobian-12wo-googlebooks-access-boundary
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12wo-googlebooks-access-boundary.yml
      - .github/workflows/probe-yehuobian-12wn-keio-googlebooks-record.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12WO-*
      - scripts/verify-yehuobian-keio-googlebooks-access-boundary-12wo.py
      - tests/test_yehuobian_keio_googlebooks_access_boundary_12wo.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provider 429 access scope and negative promotion gates
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-keio-googlebooks-access-boundary-12wo.py
          python -m unittest discover -s tests -p 'test_yehuobian_keio_googlebooks_access_boundary_12wo.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_keio_googlebooks_volume_12wn.py' -v
