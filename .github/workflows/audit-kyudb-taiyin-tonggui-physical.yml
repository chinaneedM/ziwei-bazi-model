name: audit-kyudb-taiyin-tonggui-physical

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-kyudb-taiyin-tonggui-physical.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR locator dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-tra imagemagick
      - name: Acquire official Kyudb image list and thumbnails
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/kyudb-taiyin-tonggui-physical'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/thumbs" "$ROOT/ocr" "$ROOT/physical"
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          npm install --no-save --silent puppeteer-core@24.16.0
          cat > "$ROOT/acquire.mjs" <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root='audit/kyudb-taiyin-tonggui-physical';
          const bookCd='GK12436_00', itemCd='SIC', volNo='0001';
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.BROWSER,args:['--no-sandbox','--disable-setuid-sandbox']});
          const page=await browser.newPage();
          await page.setUserAgent('Mozilla/5.0 Tianwen-Provenance-Audit/1.0');
          await page.goto('https://kyudb.snu.ac.kr/book/list.do?book_cate=SIC04&mid=GDS',{waitUntil:'networkidle2',timeout:90000});
          await Promise.all([
            page.waitForNavigation({waitUntil:'networkidle2',timeout:90000}),
            page.evaluate((bookCd)=>{
              const f=document.getElementById('frmBookSearchInf');
              f.querySelector('#book_cd').value=bookCd; f.querySelector('#target').value='master';
              f.action='/book/view.do'; f.method='post'; f.submit();
            },bookCd)
          ]);
          await page.evaluate((bookCd)=>window.fn_originalImg('SIC',bookCd,'',''),bookCd);
          await new Promise(r=>setTimeout(r,2500));
          let vp=null;
          for(const t of browser.targets()) if(t.type()==='page' && t.url().includes('/pf01/rendererImg.do')) { vp=await t.page(); break; }
          if(!vp) throw new Error('viewer unresolved');
          await vp.waitForNetworkIdle({idleTime:1000,timeout:30000}).catch(()=>{});
          const route=await vp.evaluate(()=>({
            min:typeof min_page_no!=='undefined'?min_page_no:null,
            max:typeof max_page_no!=='undefined'?max_page_no:null,
            pathId:document.forms.frmOriText2?.pathId?.value||null
          }));
          const imageList=await vp.evaluate(async({itemCd,bookCd,volNo})=>{
            const body=new URLSearchParams({item_cd:itemCd,book_cd:bookCd,vol_no:volNo});
            const r=await fetch('/pf01/viewImgList.do',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded; charset=UTF-8'},body});
            return await r.json();
          },{itemCd,bookCd,volNo});
          const list=imageList?.list||[];
          fs.writeFileSync(root+'/image-list.json',JSON.stringify({route,list},null,2));

          function pid(row){
            for(const s0 of [row.ORG_CD,row.DISP_PAGE,row.FILE_NM].filter(Boolean)){
              const s=String(s0);
              const m=s.match(/([0-9]{3}[ab])(?:_[0-9]{2})?(?:\.jpg)?$/i)||s.match(/_([0-9]{3}[ab])(?:_[0-9]{2})?\.jpg$/i);
              if(m) return m[1];
            }
            return null;
          }
          const manifest=[];
          for(let start=0; start<list.length; start+=12){
            const batch=list.slice(start,start+12);
            const rows=await Promise.all(batch.map(async(row,off)=>{
              const pageId=pid(row), file=String(row.FILE_NM||'');
              if(!pageId||!file) return {index:start+off,page_id:pageId,file_nm:file,error:'missing-page-or-file'};
              const u='/ThumbServlet.do?item_cd=SIC&book_cd='+encodeURIComponent(bookCd)+'&vol_no=&img='+encodeURIComponent(file)+'&cover=';
              try{
                const got=await vp.evaluate(async(u)=>{
                  const r=await fetch(u,{credentials:'include'}); const b=new Uint8Array(await r.arrayBuffer());
                  return {status:r.status,type:r.headers.get('content-type'),bytes:[...b]};
                },u);
                const buf=Buffer.from(got.bytes);
                const local=`${root}/thumbs/page-${pageId}.jpg`;
                fs.writeFileSync(local,buf);
                return {index:start+off,page_id:pageId,file_nm:file,status:got.status,content_type:got.type,bytes:buf.length,sha256:crypto.createHash('sha256').update(buf).digest('hex'),local_file:`thumbs/page-${pageId}.jpg`};
              }catch(e){return {index:start+off,page_id:pageId,file_nm:file,error:String(e)}}
            }));
            manifest.push(...rows);
          }
          fs.writeFileSync(root+'/thumbnail-manifest.json',JSON.stringify(manifest,null,2));
          console.log(JSON.stringify({image_count:list.length,downloaded:manifest.filter(x=>x.status===200).length,route},null,2));
          await browser.close();
          if(list.length<150 || manifest.filter(x=>x.status===200).length<150) process.exitCode=2;
          JS
          BROWSER="$BROWSER" node "$ROOT/acquire.mjs"

      - name: OCR locator only
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/kyudb-taiyin-tonggui-physical'
          for f in "$ROOT"/thumbs/*.jpg; do
            b="$(basename "$f" .jpg)"
            tesseract "$f" "$ROOT/ocr/$b-v" -l chi_tra --psm 5 >/dev/null 2>&1 || true
            tesseract "$f" "$ROOT/ocr/$b-h" -l chi_tra --psm 6 >/dev/null 2>&1 || true
          done
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('audit/kyudb-taiyin-tonggui-physical')
          terms=['晨昏','冬夏二至','冬至','夏至','立成','昏分','晨分','日出','日入','盈日','縮日','缩日','日晷']
          pages={}
          for p in root.joinpath('ocr').glob('page-*.txt'):
              m=re.search(r'page-([0-9]{3}[ab])-',p.name)
              if not m: continue
              pid=m.group(1)
              txt=p.read_text(encoding='utf-8',errors='replace').replace(' ','').replace('\n','')
              pages.setdefault(pid,[]).append(txt)
          scored=[]
          for pid,arr in pages.items():
              txt=' '.join(arr)
              hits=[t for t in terms if t in txt]
              score=sum(12 if t=='晨昏' else 10 if t=='冬夏二至' else 6 if t=='立成' else 3 for t in hits)
              if hits:
                  scored.append({'page_id':pid,'hits':hits,'score':score,'ocr_locator_only':txt[:3000]})
          scored.sort(key=lambda x:(-x['score'],x['page_id']))
          (root/'ocr-locators.json').write_text(json.dumps(scored,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(scored[:50],ensure_ascii=False,indent=2))
          PY

      - name: Build contact sheets for visual locator fallback
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/kyudb-taiyin-tonggui-physical'
          mkdir -p "$ROOT/contact"
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          from pathlib import Path
          import math
          root=Path('audit/kyudb-taiyin-tonggui-physical')
          files=sorted(root.joinpath('thumbs').glob('page-*.jpg'))
          for chunk_no in range((len(files)+19)//20):
              chunk=files[chunk_no*20:(chunk_no+1)*20]
              cells=[]
              for f in chunk:
                  im=Image.open(f).convert('RGB')
                  im.thumbnail((320,420))
                  canvas=Image.new('RGB',(340,460),'white')
                  canvas.paste(im,((340-im.width)//2,5))
                  d=ImageDraw.Draw(canvas); d.text((8,435),f.stem,fill='black')
                  cells.append(canvas)
              sheet=Image.new('RGB',(340*5,460*4),'white')
              for i,c in enumerate(cells): sheet.paste(c,((i%5)*340,(i//5)*460))
              sheet.save(root/'contact'/f'contact-{chunk_no+1:02d}.jpg',quality=90)
          PY

      - name: Fetch official full-resolution originals for OCR positives
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/kyudb-taiyin-tonggui-physical'
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          cat > "$ROOT/fetch-originals.mjs" <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const root='audit/kyudb-taiyin-tonggui-physical';
          const loc=JSON.parse(fs.readFileSync(root+'/ocr-locators.json','utf8'));
          const meta=JSON.parse(fs.readFileSync(root+'/thumbnail-manifest.json','utf8'));
          const list=JSON.parse(fs.readFileSync(root+'/image-list.json','utf8'));
          const wanted=new Set();
          const pos=new Map(meta.map(x=>[x.page_id,x.index]));
          for(const x of loc.slice(0,30)){
            const i=pos.get(x.page_id); if(i===undefined) continue;
            for(let d=-2;d<=2;d++){ const j=i+d; if(j>=0&&j<meta.length) wanted.add(j); }
          }
          if(wanted.size===0){ fs.writeFileSync(root+'/physical-manifest.json','[]\n'); process.exit(0); }
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.BROWSER,args:['--no-sandbox','--disable-setuid-sandbox']});
          const p=await browser.newPage(); await p.setUserAgent('Mozilla/5.0 Tianwen-Provenance-Audit/1.0');
          await p.goto('https://kyudb.snu.ac.kr/',{waitUntil:'domcontentloaded',timeout:60000});
          const out=[];
          for(const i of [...wanted].sort((a,b)=>a-b)){
            const row=meta[i]; if(!row?.file_nm||!row?.page_id) continue;
            const path=(list.route.pathId||'/data01/stream/SIC/IMG/GK12436_00/GK12436_00_0001/')+row.file_nm;
            const u='https://kyudb.snu.ac.kr/ImageServlet.do?imgFileNm='+encodeURIComponent(row.file_nm)+'&path='+encodeURIComponent(path);
            const got=await p.evaluate(async(u)=>{const r=await fetch(u,{credentials:'include'}); return {status:r.status,type:r.headers.get('content-type'),bytes:[...new Uint8Array(await r.arrayBuffer())]};},u);
            const b=Buffer.from(got.bytes), file=`${root}/physical/page-${row.page_id}.jpg`;
            fs.writeFileSync(file,b);
            out.push({index:i,page_id:row.page_id,file_nm:row.file_nm,url:u,status:got.status,content_type:got.type,bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex'),local_file:`physical/page-${row.page_id}.jpg`});
          }
          fs.writeFileSync(root+'/physical-manifest.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out.map(x=>({page_id:x.page_id,bytes:x.bytes,sha256:x.sha256})),null,2));
          await browser.close();
          JS
          BROWSER="$BROWSER" node "$ROOT/fetch-originals.mjs"

      - name: Write locator report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('audit/kyudb-taiyin-tonggui-physical')
          image=json.loads((root/'image-list.json').read_text())
          thumbs=json.loads((root/'thumbnail-manifest.json').read_text())
          loc=json.loads((root/'ocr-locators.json').read_text())
          phy=json.loads((root/'physical-manifest.json').read_text())
          report={
            'schema':'KYUDB-TAIYIN-TONGGUI-PHYSICAL-LOCATOR-R3',
            'schema_version':'3.0.0',
            'provider':'Seoul National University Kyujanggak Institute for Korean Studies',
            'title':'太陰通軌','book_cd':'GK12436_00','call_number':'奎貴12436',
            'edition_scope':'Kyudb-held Joseon corrected Jiayin-type recension; not assumed identical to Ming/Nanjing parent recension.',
            'image_count':len(image.get('list',[])),
            'route':image.get('route',{}),
            'thumbnail_count':sum(1 for x in thumbs if x.get('status')==200),
            'ocr_locator_positive_count':len(loc),
            'ocr_locator_positives':loc,
            'physical_pages':phy,
            'contact_sheets':[str(p.relative_to(root)) for p in sorted(root.joinpath('contact').glob('*.jpg'))],
            'ocr_used_for_final_glyph_claims':False,
            'page_text_used_for_final_glyph_claims':False,
            'adjudication_rule':'OCR and contact sheets are locator surfaces only. Exact glyphs, numerical cells, table layout, and transmission claims require direct visual inspection of official Kyudb ImageServlet originals bound by page ID and SHA-256.'
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Upload physical locator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyudb-taiyin-tonggui-physical-r3
          path: audit/kyudb-taiyin-tonggui-physical
          if-no-files-found: error
          retention-days: 30
