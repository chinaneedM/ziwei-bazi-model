name: audit-kyudb-taiyin-tonggui-physical

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-kyudb-taiyin-tonggui-physical.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow requests

      - name: Locate Morning-evening table in Kyudb Taiyin Tonggui and acquire physical pages
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/kyudb-taiyin-tonggui-physical'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/text" "$ROOT/physical"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import hashlib, html as htmlmod, io, json, re, requests, time

          root=Path('audit/kyudb-taiyin-tonggui-physical')
          base='https://kyudb.snu.ac.kr'
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 Tianwen-Provenance-Audit/1.0',
              'Referer':base+'/pf01/rendererImg.do',
              'Accept-Language':'ko,en;q=0.8',
          })

          book='GK12436_00'
          vol='0001'
          terms=['晨昏分','晨昏','冬夏二至','冬夏','冬至','夏至','立成','晨分','昏分','日出分','日入分','半晝','半昼']
          pages=[f'{n:03d}{ab}' for n in range(78) for ab in 'ab']

          def compact_markup(x):
              x=htmlmod.unescape(x or '')
              x=re.sub(r'<br\s*/?>','\n',x,flags=re.I)
              x=re.sub(r'<[^>]+>',' ',x)
              return re.sub(r'\s+',' ',x).strip()

          loc=[]
          all_text=[]
          for i,p in enumerate(pages):
              r=s.post(base+'/pf01/pageText.do',data={'item_cd':'SIC','book_cd':book,'vol_no':vol,'page_no':p},timeout=30)
              row={'page':p,'status':r.status_code,'bytes':len(r.content)}
              txt=''
              if r.ok:
                  try:
                      j=r.json()
                      raw=((j.get('ORG') or {}).get('list') or '')
                      txt=compact_markup(raw)
                      row['text']=txt
                      hits=[t for t in terms if t in txt]
                      if hits:
                          row['hits']=hits
                          loc.append(row.copy())
                  except Exception as e:
                      row['parse_error']=type(e).__name__+': '+str(e)
              all_text.append(row)
              (root/'text'/f'{p}.txt').write_text(txt,encoding='utf-8')
              if i % 25 == 0: time.sleep(0.2)

          # Expand every locator hit by two folios on either side.
          index={p:i for i,p in enumerate(pages)}
          wanted=set()
          for row in loc:
              i=index[row['page']]
              for j in range(max(0,i-4),min(len(pages),i+5)):
                  wanted.add(pages[j])

          # If text layer has no direct hit, keep a broad fallback window around the
          # middle third for later visual review, but do not authorize a negative.
          fallback=False
          if not wanted:
              fallback=True
              for j in range(40,112):
                  wanted.add(pages[j])

          physical=[]
          for p in sorted(wanted,key=lambda x:index[x]):
              fn=f'{book}IH_{vol}_{p}.jpg'
              path=f'/data01/stream/SIC/IMG/{book}/{book}_{vol}/{fn}'
              urls=[
                  base+'/ImageDown.do?imgFileNm='+fn+'&path='+path,
                  base+'/ImageServlet.do?imgFileNm='+fn+'&path='+path,
              ]
              b=None; used=None; status=None; ctype=None
              for u in urls:
                  rr=s.get(u,timeout=60)
                  status=rr.status_code; ctype=rr.headers.get('content-type')
                  if rr.ok and len(rr.content)>5000:
                      try:
                          with Image.open(io.BytesIO(rr.content)) as im:
                              im.verify()
                          b=rr.content; used=u; break
                      except Exception:
                          pass
              if b is None:
                  physical.append({'page':p,'download_ok':False,'status':status,'content_type':ctype})
                  continue
              out=root/'physical'/f'{p}.jpg'
              out.write_bytes(b)
              with Image.open(out) as im:
                  physical.append({
                      'page':p,'download_ok':True,'bytes':len(b),
                      'sha256':hashlib.sha256(b).hexdigest(),
                      'width':im.width,'height':im.height,'mode':im.mode,
                      'url':used,
                  })

          # Contact sheets, visual locator only.
          imgs=[x for x in physical if x.get('download_ok')]
          sheets=[]
          if imgs:
              for batch_start in range(0,len(imgs),24):
                  batch=imgs[batch_start:batch_start+24]
                  thumbs=[]
                  for row in batch:
                      im=Image.open(root/'physical'/f"{row['page']}.jpg").convert('RGB')
                      im.thumbnail((360,520))
                      canvas=Image.new('RGB',(380,560),'white')
                      canvas.paste(im,((380-im.width)//2,25))
                      d=ImageDraw.Draw(canvas)
                      d.text((10,535),row['page'],fill='black')
                      thumbs.append(canvas)
                  cols=4; rows=(len(thumbs)+cols-1)//cols
                  sheet=Image.new('RGB',(cols*380,rows*560),'white')
                  for k,im in enumerate(thumbs):
                      sheet.paste(im,((k%cols)*380,(k//cols)*560))
                  sp=root/f'contact-{batch_start//24+1:02d}.jpg'
                  sheet.save(sp,quality=88)
                  sheets.append(sp.name)

          report={
              'schema':'KYUDB-TAIYIN-TONGGUI-MORNING-EVENING-PHYSICAL-LOCATOR-R1',
              'schema_version':'1.0.0',
              'provider':'Kyujanggak Institute for Korean Studies, Seoul National University',
              'book_cd':book,
              'call_number':'奎貴12436',
              'title':'太陰通軌',
              'volume':vol,
              'viewer_page_range':'000a-077b',
              'page_count_probed':len(pages),
              'locator_terms':terms,
              'text_locator_hits':loc,
              'physical_pages_requested':sorted(wanted,key=lambda x:index[x]),
              'physical_pages':physical,
              'contact_sheets':sheets,
              'fallback_window_used':fallback,
              'text_layer_authority':'LOCATOR_ONLY_NOT_GLYPH_OR_NUMERIC_AUTHORITY',
              'physical_image_authority':'DIRECT_SOURCE_BOUND_FACSIMILE_REQUIRED_FOR_FINAL_GLYPH_AND_NUMERIC_CLAIMS',
              'ocr_used_for_final_glyph_claims':False,
              'numeric_claim_authorized_by_this_machine_step':False,
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
              'locator_hits':loc,
              'physical_count':sum(1 for x in physical if x.get('download_ok')),
              'requested_count':len(wanted),
              'fallback_window_used':fallback,
              'contact_sheets':sheets,
          },ensure_ascii=False,indent=2))
          PY

      - name: Upload Taiyin Tonggui physical locator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyudb-taiyin-tonggui-morning-evening-physical
          path: audit/kyudb-taiyin-tonggui-physical
          if-no-files-found: error
          retention-days: 30
