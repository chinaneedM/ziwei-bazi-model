name: research-korea-university-ziwei-detail

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-korea-university-ziwei-detail.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Read exact public Korea University catalog detail linked by integrated search
        shell: python
        run: |
          import json,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          OUT=Path('probe'); OUT.mkdir()
          URL='https://library.korea.ac.kr/detail/?cid=CAT000000737166&ctype=o'
          TERMS=('新刻合','紫微','飛星','斗數','陳搏','徐良弼','陳道','唐謙','江左書林','明經閣','木板','卷','冊','청구기호','소장','고서','자료실','발행','出版','刊','판본','형태','四周','魚尾','行','字','원문','URL')
          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--disable-gpu'); opts.add_argument('--window-size=1800,2800'); opts.add_argument('--lang=ko-KR')
          result={'schema':'ZIWEI-KOREA-UNIVERSITY-CAT000000737166-R1','source_url':URL,'source_origin':'EXACT_HREF_RENDERED_BY_PUBLIC_INTEGRATED_SEARCH','authentication_attempted':False,'route_guessing_attempted':False}
          d=webdriver.Chrome(options=opts)
          try:
            d.set_page_load_timeout(90); d.get(URL); time.sleep(8)
            result['final_url']=d.current_url; result['title']=d.title
            body=d.find_element(By.TAG_NAME,'body').text
            result['body_text']=body[:140000]
            result['matching_lines']=[line for line in body.splitlines() if any(t.lower() in line.lower() for t in TERMS)][:1000]
            links=[]
            for a in d.find_elements(By.CSS_SELECTOR,'a[href]'):
              try:
                if not a.is_displayed(): continue
                txt=' '.join((a.text or '').split()); href=a.get_attribute('href') or ''
                hay=(txt+' '+href).lower()
                if any(k.lower() in hay for k in ('원문','original','full text','image','viewer','digital','고서','url','pdf')):
                  links.append({'text':txt[:1000],'href':href})
              except Exception: pass
            seen=set(); dedup=[]
            for x in links:
              k=(x['text'],x['href'])
              if k not in seen: seen.add(k); dedup.append(x)
            result['relevant_links']=dedup[:300]
            # Capture visible tables/definition lists without OCR.
            blocks=[]
            for el in d.find_elements(By.CSS_SELECTOR,'table,dl,.item-info,.detail-info,.holding-info,.bibliographic-info'):
              try:
                if not el.is_displayed(): continue
                txt='\n'.join(x.strip() for x in (el.text or '').splitlines() if x.strip())
                if txt and len(txt)<30000: blocks.append(txt)
              except Exception: pass
            result['detail_blocks']=list(dict.fromkeys(blocks))[:200]
            d.save_screenshot(str(OUT/'detail.png'))
            (OUT/'detail.html').write_text(d.page_source,encoding='utf-8')
          finally:
            d.quit()
          result['adjudication']={
            'korea_university_physical_copy_bound':True,
            'exact_edition_identity':'TO_BE_ADJUDICATED_FROM_FIRST_PARTY_DETAIL',
            'independent_late_zi_glyph_vote_added':0,
            'target_page_status':'PENDING_DIRECT_PAGE',
            'algorithm_effect':'NONE'
          }
          (OUT/'korea-university-ziwei-detail.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'final_url':result.get('final_url'),'title':result.get('title'),'matching_lines':result.get('matching_lines'),'relevant_links':result.get('relevant_links'),'detail_blocks':result.get('detail_blocks'),'adjudication':result['adjudication']},ensure_ascii=False,indent=2))

      - name: Upload Korea University detail evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-korea-university-detail
          path: probe/
          if-no-files-found: warn
          retention-days: 14
