name: verify-batch-12iz-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12iz-exact-head.yml
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-BEITU1997-GOOGLE-BOOKS-ALTERNATE-INBOOK-SEARCH-BOUNDARY-IZ.md
      - docs/research/ZIWEI-BEITU1997-GOOGLE-BOOKS-ALTERNATE-INBOOK-SEARCH-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
      - .github/workflows/probe-batch-12iz-beitu1997-google-books-target-pages.yml
      - .github/workflows/probe-batch-12iz-beitu1997-google-books-alternate-object.yml
      - .github/workflows/probe-batch-12iz-beitu1997-google-books-quote-snippets.yml
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IZ status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'tianwen/batch-12iz-exact-head', description: 'Batch 12IZ verification running'})
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12IZ exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-BEITU1997-GOOGLE-BOOKS-ALTERNATE-INBOOK-SEARCH-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-BEITU1997-GOOGLE-BOOKS-ALTERNATE-INBOOK-SEARCH-BOUNDARY-IZ'
          o=e['google_books_objects']
          assert o['primary']['object_id']=='BZ0M0gEACAAJ'
          assert o['primary']['source_emitted_inbook_q_contract_observed'] is False
          assert o['primary']['source_emitted_other_version']=='RuGEAAAAIAAJ'
          assert o['alternate']['source_emitted_inbook_q_contract_observed'] is True
          assert o['alternate']['usable_page_numbers_for_target_queries'] is False
          f=e['targeted_query_adjudication']['false_positive_controls']
          assert f['瞿氏']['classification']=='SURNAME_COLLISION_FALSE_POSITIVE'
          assert f['这些善本入藏本馆']['classification']=='TOKENIZED_QUERY_FALSE_POSITIVE'
          assert e['targeted_query_adjudication']['zero_result_has_fulltext_absence_authority'] is False
          assert e['pp446_449_adjudication']['direct_page_text_reviewed'] is False
          assert e['target_item_firewall']['target_3482_3483_batch_membership']=='UNRESOLVED'
          PY
      - name: Publish success IZ status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'success', context: 'tianwen/batch-12iz-exact-head', description: 'Batch 12IZ exact-head verification passed'})
      - name: Publish failure IZ status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'failure', context: 'tianwen/batch-12iz-exact-head', description: 'Batch 12IZ exact-head verification failed'})
