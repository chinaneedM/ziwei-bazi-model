name: acquire-tianwen-13ll-naaj-zero-controls
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13ll-naaj-zero-controls.py
      - .github/workflows/acquire-tianwen-13ll-naaj-zero-controls.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-control:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/acquire-tianwen-13ll-naaj-zero-controls.py
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13ll-naaj-second-zero-color-controls
          path: 13ll-naaj-zero-controls-output/
          retention-days: 7
