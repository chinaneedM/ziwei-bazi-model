name: verify-batch-12he-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12he-exact-head.yml
      - .github/workflows/verify-batch-12hd-exact-head.yml
      - docs/research/ZIWEI-TSINGHUA-DING-HUIKANG-TIEQIN-1100PLUS-VOLUMES-FINANCING-SCOPE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-TSINGHUA-DING-HUIKANG-TIEQIN-1100PLUS-VOLUMES-FINANCING-SCOPE-HE.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HE exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-TSINGHUA-DING-HUIKANG-TIEQIN-1100PLUS-VOLUMES-FINANCING-SCOPE-HE'
          e=json.loads(Path('docs/research/ZIWEI-TSINGHUA-DING-HUIKANG-TIEQIN-1100PLUS-VOLUMES-FINANCING-SCOPE-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          s=e['source_control']
          assert s['provider']=='清华校友总会'
          assert s['page_date']=='2009-01-16'
          assert s['republication_source_display']=='摘自 中华读书报 2009年1月14日'
          d=e['ding_huikang_control']
          assert d['financing_involvement_supported'] is True
          assert d['quantity_display']=='1100+'
          assert d['quantity_unit']=='册'
          h=e['relation_to_hc']
          assert h['hc_retrospective_title_count']==6
          assert h['hc_unit']=='种'
          assert h['six_titles_equals_1100plus_volumes'] is False
          assert h['unit_conversion_authorized'] is False
          assert h['same_transaction_scope']=='UNRESOLVED'
          t=e['target_volume_firewall']
          assert t['target_in_1100plus_volumes']=='UNRESOLVED'
          assert t['target_specific_ding_intermediary_selected'] is False
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,217,0)
          assert bid in state['historical_audit']['completed_batches']
          latest=state['historical_audit']['latest_batch_doc']
          assert isinstance(latest,str) and latest.startswith('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-') and latest.endswith('.md')
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-TSINGHUA-ALUMNI-DING-HUIKANG-TIEQIN-1100PLUS-VOLUMES']['batch_12he']['tieqin_quantity']=='1100+'
          assert src['EXT-TSINGHUA-ALUMNI-DING-HUIKANG-TIEQIN-1100PLUS-VOLUMES']['batch_12he']['tieqin_quantity_unit']=='册'
          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          PY
