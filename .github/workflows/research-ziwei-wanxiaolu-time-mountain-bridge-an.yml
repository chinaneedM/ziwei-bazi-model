name: research-ziwei-wanxiaolu-time-mountain-bridge-an

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-wanxiaolu-time-mountain-bridge-an.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe Wanxiaolu time-mountain physical routes
        shell: python
        run: |
          import hashlib
          import html
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          out = pathlib.Path("wanxiaolu-an")
          out.mkdir(exist_ok=True)

          targets = [
              {
                  "key": "kanripo_ztdz_v2",
                  "url": "https://www.kanripo.org/ed/KR5h0040/ZTDZ/002",
                  "terms": [
                      "第四十二章論定時",
                      "地理分四十四山",
                      "曆書亦分二十四時",
                      "時與山每每相應",
                      "每日皆從太陽到處數",
                      "此是查時刻以考星躔之要法",
                  ],
                  "role": "KANRIPO_ZTDZ_TRANSCRIPTION_PLUS_SOURCE_EMITTED_IMAGE_ROUTE_DISCOVERY",
              },
              {
                  "key": "kanripo_krx_ztdz_v2",
                  "url": "https://krx.kanripo.org/ed/KR5h0040/ZTDZ/002",
                  "terms": [
                      "第四十二章論定時",
                      "地理分四十四山",
                      "曆書亦分二十四時",
                      "時與山每每相應",
                      "每日皆從太陽到處數",
                      "查時刻以考星躔",
                  ],
                  "role": "KANRIPO_KRX_PUBLIC_MIRROR_TARGET_VOLUME_AND_SOURCE_EMITTED_IMAGE_ROUTE",
              },
              {
                  "key": "ctext_target_chapter",
                  "url": "https://ctext.org/wiki.pl?chapter=835051&if=gb",
                  "terms": [
                      "第四十二章論定時",
                      "地理分四十四山",
                      "曆書亦分二十四時",
                      "時與山每每相應",
                      "每日皆從太陽到處數",
                      "七政氣孛",
                      "查時刻以考星躔",
                  ],
                  "role": "OCR_OR_TRANSCRIPTION_NAVIGATION_CONTROL_NOT_GLYPH_AUTHORITY",
              },
              {
                  "key": "ctext_library",
                  "url": "https://ctext.org/library.pl?if=gb&res=85145",
                  "terms": [
                      "正統道藏",
                      "1089",
                      "1092",
                      "續道藏",
                      "八卷",
                  ],
                  "role": "CTEXT_LIBRARY_BASE_EDITION_AND_IMAGE_ROUTE_CONTROL",
              },
              {
                  "key": "daoinfo_bibliography",
                  "url": "https://zh.daoinfo.org/index.php?title=%E5%84%92%E9%96%80%E5%B4%87%E7%90%86%E6%8A%98%E8%A1%B7%E5%A0%AA%E8%BC%BF%E5%AE%8C%E5%AD%9D%E9%8C%84",
                  "terms": [
                      "約成書於明朝中葉",
                      "萬曆續道藏",
                      "八卷",
                      "七政",
                      "判斷星宿時辰",
                  ],
                  "role": "MODERN_BIBLIOGRAPHIC_CONTEXT_ONLY",
              },
          ]

          def normalize(s):
              s = html.unescape(s)
              s = re.sub(r"<[^>]+>", "", s)
              return re.sub(r"[，、。；：？！,.!?;:「」『』（）()\[\]【】<>/\\=_\-\s]+", "", s)

          receipt = {
              "schema": "ZIWEI-WANXIAOLU-TIME-MOUNTAIN-BRIDGE-AN-PROBE-R1",
              "targets": [],
              "authentication_attempted": False,
              "captcha_bypass_attempted": False,
              "ocr_generated_by_probe": False,
          }

          for target in targets:
              req = urllib.request.Request(
                  target["url"],
                  headers={"User-Agent": "Mozilla/5.0 historical-provenance-research/1.0"},
              )
              item = {"key": target["key"], "requested_url": target["url"], "role": target["role"]}
              try:
                  with urllib.request.urlopen(req, timeout=40) as resp:
                      body = resp.read()
                      item.update({
                          "status": resp.status,
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "bytes": len(body),
                          "sha256": hashlib.sha256(body).hexdigest(),
                      })
              except Exception as exc:
                  body = b""
                  item.update({"status": None, "error": repr(exc), "bytes": 0, "sha256": None})

              (out / f'{target["key"]}.html').write_bytes(body)
              raw = body.decode("utf-8", errors="replace")
              compact = normalize(raw)
              item["term_hits"] = {term: normalize(term) in compact for term in target["terms"]}

              # Preserve only source-emitted candidate image/viewer/download links.
              hrefs = re.findall(r'href=["\']([^"\']+)["\']', raw, flags=re.I)
              srcs = re.findall(r'src=["\']([^"\']+)["\']', raw, flags=re.I)
              links = []
              for link in dict.fromkeys(hrefs + srcs):
                  low = link.lower()
                  if any(token in low for token in ("image", ".jpg", ".jpeg", ".png", ".pdf", "library.pl", "showimage", "scan", "ztdz")):
                      links.append(urllib.parse.urljoin(item.get("final_url") or target["url"], link))
              item["source_emitted_candidate_links"] = links[:500]

              # Target-local HTML context is diagnostic only, not evidence authority.
              target_positions = []
              for term in target["terms"]:
                  pos = raw.find(term)
                  if pos >= 0:
                      target_positions.append({"term": term, "html_offset": pos})
              item["literal_target_positions"] = target_positions
              receipt["targets"].append(item)

          # Follow only Kanripo links emitted by the target page and fetch public
          # image-like objects. No ID guessing or enumeration beyond emitted links.
          kan = next(x for x in receipt["targets"] if x["key"] == "kanripo_ztdz_v2")
          fetched = []
          for idx, url in enumerate(kan.get("source_emitted_candidate_links", [])):
              if idx >= 120:
                  break
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 historical-provenance-research/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      ctype = (resp.headers.get("content-type") or "").lower()
                      rec = {
                          "url": url,
                          "status": resp.status,
                          "final_url": resp.geturl(),
                          "content_type": ctype,
                          "bytes": len(body),
                          "sha256": hashlib.sha256(body).hexdigest(),
                      }
                      if ctype.startswith("image/") and len(body) > 10000:
                          ext = ".jpg"
                          if "png" in ctype:
                              ext = ".png"
                          fn = f"kanripo-emitted-{len(fetched):03d}{ext}"
                          (out / fn).write_bytes(body)
                          rec["saved_as"] = fn
                      fetched.append(rec)
              except Exception as exc:
                  fetched.append({"url": url, "status": None, "error": repr(exc)})
          receipt["kanripo_emitted_link_fetches"] = fetched

          # Follow only the four page URLs explicitly emitted by the CText library
          # landing page. Fetch page HTML only (not page images) to learn the normal
          # source navigation/mapping without guessing or bulk image download.
          lib = next(x for x in receipt["targets"] if x["key"] == "ctext_library")
          emitted_pages = []
          for url in lib.get("source_emitted_candidate_links", []):
              parsed = urllib.parse.urlparse(html.unescape(url))
              q = urllib.parse.parse_qs(parsed.query)
              if q.get("file") == ["100720"] and q.get("page", [""])[0] in {"1", "2", "3", "4"}:
                  emitted_pages.append(html.unescape(url))
          emitted_pages = list(dict.fromkeys(emitted_pages))
          page_html_receipts = []
          for url in emitted_pages:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 historical-provenance-research/1.0"})
              rec = {"requested_url": url}
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      rec.update({
                          "status": resp.status,
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "bytes": len(body),
                          "sha256": hashlib.sha256(body).hexdigest(),
                      })
              except Exception as exc:
                  body = b""
                  rec.update({"status": None, "error": repr(exc), "bytes": 0, "sha256": None})
              raw = body.decode("utf-8", errors="replace")
              page_num = urllib.parse.parse_qs(urllib.parse.urlparse(url).query).get("page", ["x"])[0]
              (out / f"ctext-file100720-page{page_num}.html").write_bytes(body)
              hrefs = [urllib.parse.urljoin(rec.get("final_url") or url, html.unescape(x)) for x in re.findall(r"href=[\\\"']([^\\\"']+)[\\\"']", raw, flags=re.I)]
              srcs = [urllib.parse.urljoin(rec.get("final_url") or url, html.unescape(x)) for x in re.findall(r"src=[\\\"']([^\\\"']+)[\\\"']", raw, flags=re.I)]
              rec["emitted_file100720_page_links"] = [
                  x for x in dict.fromkeys(hrefs)
                  if "library.pl" in x and "file=100720" in x
              ]
              rec["emitted_s2351089_image_links"] = [
                  x for x in dict.fromkeys(srcs)
                  if "library.ctext.org/s2351089/" in x
              ]
              rec["visible_title_terms"] = {
                  term: normalize(term) in normalize(raw)
                  for term in ("儒門崇理折衷堪輿完孝錄", "卷一", "卷二", "第四十二章論定時")
              }
              page_html_receipts.append(rec)
          receipt["ctext_emitted_page_html_probe"] = {
              "scope": "ONLY_LIBRARY_LANDING_PAGE_EMITTED_FILE100720_PAGES_1_TO_4_HTML_NO_IMAGE_DOWNLOAD",
              "pages": page_html_receipts,
          }

          # The emitted page HTML exposes CText's normal full-text-search form
          # target as wiki resource 437415. Use that explicit resource ID to locate
          # the target chapter; no page-number enumeration is needed.
          search_receipts = []
          for query in ("第四十二章論定時", "每日皆從太陽到處數", "查時刻以考星躔"):
              search_url = "https://ctext.org/wiki.pl?" + urllib.parse.urlencode({
                  "if": "gb",
                  "res": "437415",
                  "searchu": query,
              })
              req = urllib.request.Request(search_url, headers={"User-Agent": "Mozilla/5.0 historical-provenance-research/1.0"})
              rec = {"query": query, "requested_url": search_url}
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      rec.update({
                          "status": resp.status,
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "bytes": len(body),
                          "sha256": hashlib.sha256(body).hexdigest(),
                      })
              except Exception as exc:
                  body = b""
                  rec.update({"status": None, "error": repr(exc), "bytes": 0, "sha256": None})
              raw = body.decode("utf-8", errors="replace")
              safe = re.sub(r"[^0-9A-Za-z]+", "-", query.encode("unicode_escape").decode("ascii")).strip("-")[:80]
              (out / f"ctext-resource437415-search-{safe}.html").write_bytes(body)
              hrefs = [urllib.parse.urljoin(rec.get("final_url") or search_url, html.unescape(x)) for x in re.findall(r"href=[\\\"']([^\\\"']+)[\\\"']", raw, flags=re.I)]
              rec["emitted_chapter_or_library_links"] = [
                  x for x in dict.fromkeys(hrefs)
                  if ("chapter=" in x or "library.pl" in x or "#lib1007" in x)
              ][:300]
              rec["query_visible"] = normalize(query) in normalize(raw)
              rec["lib_anchor_tokens"] = sorted(set(re.findall(r"lib10072[0-2]\\.\\d+", raw)))[:300]
              search_receipts.append(rec)
          receipt["ctext_resource437415_search_probe"] = {
              "resource_id_source": "EXPLICIT_SEARCH_FORM_VALUE_ON_SOURCE_EMITTED_LIBRARY_PAGE",
              "searches": search_receipts,
          }

          # Follow the exact physical page URL emitted by the source's own search
          # result for 每日皆從太陽到處數. Fetch that one HTML page and the one
          # scan image URL emitted by it; no neighboring-page enumeration.
          target_page_url = None
          for rec in search_receipts:
              if rec.get("query") == "每日皆從太陽到處數":
                  for link in rec.get("emitted_chapter_or_library_links", []):
                      if "library.pl" in link and "file=100720" in link and "page=144" in link:
                          target_page_url = link.split("#", 1)[0]
                          break
          physical_target = {
              "locator_query": "每日皆從太陽到處數",
              "source_emitted_target_page_url": target_page_url,
              "page_number_guessed": False,
          }
          if target_page_url:
              req = urllib.request.Request(target_page_url, headers={"User-Agent": "Mozilla/5.0 historical-provenance-research/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      physical_target.update({
                          "page_status": resp.status,
                          "page_final_url": resp.geturl(),
                          "page_content_type": resp.headers.get("content-type"),
                          "page_bytes": len(body),
                          "page_sha256": hashlib.sha256(body).hexdigest(),
                      })
              except Exception as exc:
                  body = b""
                  physical_target.update({"page_status": None, "page_error": repr(exc)})
              (out / "ctext-file100720-page144.html").write_bytes(body)
              raw = body.decode("utf-8", errors="replace")
              srcs = [
                  urllib.parse.urljoin(physical_target.get("page_final_url") or target_page_url, html.unescape(x))
                  for x in re.findall(r"src=[\\\"']([^\\\"']+)[\\\"']", raw, flags=re.I)
              ]
              target_images = [
                  x for x in dict.fromkeys(srcs)
                  if "library.ctext.org/s2351089/" in x
              ]
              physical_target["source_emitted_scan_image_urls"] = target_images
              physical_target["page_html_target_terms"] = {
                  term: normalize(term) in normalize(raw)
                  for term in ("第四十二章論定時", "每日皆從太陽到處數", "查時刻以考星躔")
              }
              if len(target_images) == 1:
                  image_url = target_images[0]
                  img_req = urllib.request.Request(image_url, headers={"User-Agent": "Mozilla/5.0 historical-provenance-research/1.0"})
                  try:
                      with urllib.request.urlopen(img_req, timeout=45) as resp:
                          image_body = resp.read()
                          physical_target.update({
                              "image_status": resp.status,
                              "image_final_url": resp.geturl(),
                              "image_content_type": resp.headers.get("content-type"),
                              "image_bytes": len(image_body),
                              "image_sha256": hashlib.sha256(image_body).hexdigest(),
                          })
                      ext = ".png" if "png" in (physical_target.get("image_content_type") or "").lower() else ".jpg"
                      image_name = "ctext-file100720-page144-scan" + ext
                      (out / image_name).write_bytes(image_body)
                      physical_target["saved_image"] = image_name
                  except Exception as exc:
                      physical_target["image_status"] = None
                      physical_target["image_error"] = repr(exc)
          receipt["ctext_direct_physical_target"] = physical_target

          # If the public krx mirror exposes the target volume, preserve only
          # source-emitted Image links located in the target chapter context.
          krx = next(x for x in receipt["targets"] if x["key"] == "kanripo_krx_ztdz_v2")
          krx_target = {
              "requested_url": krx.get("requested_url"),
              "status": krx.get("status"),
              "response_sha256": krx.get("sha256"),
              "target_terms": krx.get("term_hits"),
              "image_links_guessed": False,
          }
          krx_html_path = out / "kanripo_krx_ztdz_v2.html"
          if krx_html_path.exists() and krx_html_path.stat().st_size:
              raw = krx_html_path.read_text(encoding="utf-8", errors="replace")
              normalized = normalize(raw)
              target_positions = [
                  raw.find(term) for term in ("第四十二章論定時", "每日皆從太陽到處數", "查時刻以考星躔")
                  if raw.find(term) >= 0
              ]
              if target_positions:
                  lo = max(0, min(target_positions) - 12000)
                  hi = min(len(raw), max(target_positions) + 16000)
                  context = raw[lo:hi]
              else:
                  context = ""
              hrefs = [
                  urllib.parse.urljoin(krx.get("final_url") or krx.get("requested_url"), html.unescape(x))
                  for x in re.findall(r"href=[\\\"']([^\\\"']+)[\\\"']", context, flags=re.I)
              ]
              srcs = [
                  urllib.parse.urljoin(krx.get("final_url") or krx.get("requested_url"), html.unescape(x))
                  for x in re.findall(r"src=[\\\"']([^\\\"']+)[\\\"']", context, flags=re.I)
              ]
              candidates = [
                  x for x in dict.fromkeys(hrefs + srcs)
                  if any(token in x.lower() for token in ("image", ".jpg", ".jpeg", ".png"))
              ]
              krx_target["source_emitted_target_context_image_links"] = candidates[:100]
              fetched_images = []
              for idx, url in enumerate(candidates[:12]):
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 historical-provenance-research/1.0"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          body = resp.read()
                          ctype = (resp.headers.get("content-type") or "").lower()
                          rec = {
                              "url": url,
                              "status": resp.status,
                              "final_url": resp.geturl(),
                              "content_type": ctype,
                              "bytes": len(body),
                              "sha256": hashlib.sha256(body).hexdigest(),
                          }
                          if ctype.startswith("image/") and len(body) > 10000:
                              ext = ".png" if "png" in ctype else ".jpg"
                              fn = f"kanripo-krx-target-{idx:02d}{ext}"
                              (out / fn).write_bytes(body)
                              rec["saved_as"] = fn
                          fetched_images.append(rec)
                  except Exception as exc:
                      fetched_images.append({"url": url, "status": None, "error": repr(exc)})
              krx_target["source_emitted_target_image_fetches"] = fetched_images
          receipt["kanripo_krx_direct_target_probe"] = krx_target

          (out / "receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-wanxiaolu-time-mountain-bridge-an
          path: wanxiaolu-an/
