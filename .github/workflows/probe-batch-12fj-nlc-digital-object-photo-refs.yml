name: probe-batch-12fj-nlc-digital-object-photo-refs

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - '.github/workflows/probe-batch-12fj-nlc-digital-object-photo-refs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe NLC digital-object routes and separate-photo references
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/batch-12fj-nlc-digital-object-photo-refs'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/locator" "$ROOT/read-nlc" "$ROOT/meta" "$ROOT/opac"
          UA='Tianwen-Provenance-Audit/1.0'

          # Secondary locator only: public NLC-backup index preserving original read.nlc.cn links.
          LOCATOR='https://commons.wikimedia.org/wiki/Commons:Library_back_up_project/file_list/NLC/%E6%95%B8%E5%AD%97%E5%8F%A4%E7%B1%8D/04'
          curl -L -sS --connect-timeout 10 --max-time 45 -A "$UA" "$LOCATOR" -o "$ROOT/locator/index.html"

          python - <<'PY'
          from pathlib import Path
          from html import unescape
          from urllib.parse import urljoin
          import re, json

          root=Path('audit/batch-12fj-nlc-digital-object-photo-refs')
          html=(root/'locator/index.html').read_text('utf-8',errors='replace')
          targets={
            'tonghu':'411999008600',
            'zhunzhai':'411999008601',
          }
          report={}
          for key,target in targets.items():
              positions=[m.start() for m in re.finditer(re.escape(target),html)]
              rows=[]
              for pos in positions:
                  lo=max(0,pos-3500); hi=min(len(html),pos+2500)
                  snippet=html[lo:hi]
                  hrefs=re.findall(r'href=["\']([^"\']*read\.nlc\.cn[^"\']*)["\']',snippet,re.I)
                  normalized=[]
                  for h in hrefs:
                      h=unescape(h)
                      if h.startswith('//'): h='https:'+h
                      elif h.startswith('/'): h=urljoin('https://read.nlc.cn/',h)
                      if h not in normalized: normalized.append(h)
                  rows.append({'position':pos,'read_nlc_hrefs':normalized,'snippet':snippet})
              report[key]={'target':target,'occurrences':len(positions),'rows':rows}
          (root/'locator/extracted.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          urls=[]
          for key,data in report.items():
              for row in data['rows']:
                  for u in row['read_nlc_hrefs']:
                      if u not in urls: urls.append(u)
          (root/'locator/read-nlc-urls.txt').write_text('\n'.join(urls)+'\n',encoding='utf-8')
          PY

          : > "$ROOT/read-nlc/status.tsv"
          n=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            n=$((n+1))
            out="$ROOT/read-nlc/$n.html"
            hdr="$ROOT/read-nlc/$n.headers"
            set +e
            final=$(curl -L -sS --connect-timeout 10 --max-time 45 -A "$UA" \
              -D "$hdr" -o "$out" -w '%{url_effective}' "$url")
            rc=$?
            set -e
            size=0; [ -f "$out" ] && size=$(wc -c < "$out")
            code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}' "$hdr" 2>/dev/null || true)
            printf '%s\trc=%s\thttp=%s\tbytes=%s\trequested=%s\tfinal=%s\n' "$n" "$rc" "$code" "$size" "$url" "$final" >> "$ROOT/read-nlc/status.tsv"
          done < "$ROOT/locator/read-nlc-urls.txt"

          grep -RniE '411999008600|411999008601|銅壺|铜壶|準齋|准齋|准斋|幾漏|几漏|113028|113029|book|bid|aid|object|古籍|全文|影像|image|pdf' "$ROOT/read-nlc" > "$ROOT/read-nlc/target-hits.txt" || true

          # Current meta: bounded addressability checks only.
          cat > "$ROOT/meta/targets.tsv" <<'EOF'
          photo-tonghu	00O003570
          photo-zhunzhai	00O003571
          digital-tonghu	411999008600
          digital-zhunzhai	411999008601
          raw455-tonghu	001411999008600
          raw455-zhunzhai	001411999008601
          positive-tonghu	001775082
          positive-zhunzhai	001775083
          EOF
          : > "$ROOT/meta/status.tsv"
          while IFS=$'\t' read -r key q; do
            for way in SYS ANY; do
              body=$(Q="$q" WAY="$way" python - <<'PY'
          import json,os
          q=os.environ['Q']; way=os.environ['WAY']
          print(json.dumps({
            "q":q,
            "searchWay":way,
            "page_num":"1",
            "query":way+"="+q if way!="ANY" else q,
            "sort":[{"_score":"DESC"}],
            "size":20,
            "facetVal":[],
            "exactMatch":True
          },ensure_ascii=False,separators=(',',':')))
          PY
              )
              out="$ROOT/meta/$key-$way.json"
              set +e
              code=$(curl -L -sS --connect-timeout 7 --max-time 20 -A "$UA" \
                -H 'Accept: application/json, text/javascript, */*; q=0.01' \
                -H 'X-Requested-With: XMLHttpRequest' \
                -H 'Referer: https://meta.nlc.cn/v2/search' \
                -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
                --data-binary "$body" -o "$out" -w '%{http_code}' \
                'https://meta.nlc.cn/v2/doSearch?hight=false')
              rc=$?
              set -e
              size=0; [ -f "$out" ] && size=$(wc -c < "$out")
              printf '%s\t%s\trc=%s\thttp=%s\tbytes=%s\tq=%s\n' "$key" "$way" "$rc" "$code" "$size" "$q" >> "$ROOT/meta/status.tsv"
            done
          done < "$ROOT/meta/targets.tsv"

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('audit/batch-12fj-nlc-digital-object-photo-refs/meta')
          out=[]
          for p in sorted(root.glob('*.json')):
              try: obj=json.loads(p.read_text('utf-8'))
              except Exception as e:
                  out.append(p.name+' PARSE_ERROR '+repr(e)); continue
              rows=obj.get('result') or []
              out.append('### '+p.name+' status='+repr(obj.get('status'))+' total='+repr(obj.get('total'))+' message='+repr(obj.get('message')))
              for row in rows[:20]:
                  src=row.get('_source') or {}
                  out.append(json.dumps({
                    '_id':row.get('_id'),
                    'SYS':src.get('SYS'),'UID':src.get('UID'),'TIT':src.get('TIT'),
                    'WDT':src.get('WDT'),'YEA':src.get('YEA'),'PUB':src.get('PUB'),
                    'holdings':src.get('holdings')
                  },ensure_ascii=False,separators=(',',':')))
          root.joinpath('summary.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

          # Legacy OPAC search route: exact strings as words, with no negative authority on timeout.
          cat > "$ROOT/opac/targets.tsv" <<'EOF'
          photo-tonghu	00O003570
          photo-zhunzhai	00O003571
          digital-tonghu	411999008600
          digital-zhunzhai	411999008601
          EOF
          : > "$ROOT/opac/status.tsv"
          while IFS=$'\t' read -r key q; do
            url=$(Q="$q" python - <<'PY'
          import os
          from urllib.parse import quote_plus
          print('http://opac.nlc.cn/F/?func=find-b&find_code=WRD&request='+quote_plus(os.environ['Q'])+'&local_base=NLC01')
          PY
            )
            out="$ROOT/opac/$key.html"
            set +e
            code=$(curl -L -sS --connect-timeout 7 --max-time 18 -A "$UA" -o "$out" -w '%{http_code}' "$url")
            rc=$?
            set -e
            size=0; [ -f "$out" ] && size=$(wc -c < "$out")
            printf '%s\trc=%s\thttp=%s\tbytes=%s\tq=%s\n' "$key" "$rc" "$code" "$size" "$q" >> "$ROOT/opac/status.tsv"
          done < "$ROOT/opac/targets.tsv"
          grep -RniE '00O003570|00O003571|411999008600|411999008601|銅壺|铜壶|準齋|准齋|准斋|幾漏|几漏|doc_number' "$ROOT/opac" > "$ROOT/opac/target-hits.txt" || true

          find "$ROOT" -type f -size +0c -print0 | xargs -0 -r sha256sum | sort -V > "$ROOT/all-files.sha256"
          printf '%s\n' \
            'SOURCE=first-party NLC read.nlc.cn routes localized via Wikimedia NLC backup index + current meta.nlc.cn + legacy OPAC' \
            'LOCATOR_POLICY=Wikimedia is locator-only; final NLC digital-object claim requires preserved first-party read.nlc.cn route/response' \
            'PURPOSE=classify 411999008600/601 digital-object routing and test 00O003570/571 first-party addressability' \
            'KNOWN_MARC_ROLE=455 embedded 001 record-control values already source-bound in FI/FH' \
            'PHOTO_ROLE=00O003570/571 already closed only as reciprocal title-specific 另拍在 references' \
            'IDENTIFIER_FIREWALL=digital-object route id != current SYS/UID != local call number != barcode != acquisition/donation number' \
            'NEGATIVE_POLICY=timeout/no-result is bounded route/index observation only' \
            'OCR_USED=false' > "$ROOT/manifest.txt"

      - name: Upload FJ identifier-route evidence
        uses: actions/upload-artifact@v4
        with:
          name: batch-12fj-nlc-digital-object-photo-refs-probe
          path: audit/batch-12fj-nlc-digital-object-photo-refs/
          if-no-files-found: error
          retention-days: 30
