name: research-dllibrary-ziwei-catalog-search

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-dllibrary-ziwei-catalog-search.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query Dalian Library through its published GET catalog form
        shell: python
        run: |
          import hashlib
          import html
          import json
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          UA = "Mozilla/5.0 research-only published catalog-form query"
          BASE = "https://www.dl-library.net.cn/book/list.php"
          TERMS = [
              "紫微",
              "紫微斗數",
              "紫微鬥數",
              "陳希夷",
              "陈希夷",
              "新鐫希夷陳先生紫微鬥數全書",
              "新镌希夷陈先生紫微斗数全书",
          ]
          CATALOG_IDS = [7, 14]

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/xhtml+xml,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.7",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read(5_000_000)
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "data": b""}

          def clean_text(raw):
              raw = re.sub(r"(?is)<script.*?</script>|<style.*?</style>", " ", raw)
              raw = re.sub(r"(?s)<[^>]+>", " ", raw)
              return re.sub(r"\s+", " ", html.unescape(raw)).strip()

          def item_links(base, raw):
              out = []
              for href, label in re.findall(
                  r'''<a[^>]+href\s*=\s*["']([^"']+)["'][^>]*>(.*?)</a>''',
                  raw,
                  flags=re.I | re.S,
              ):
                  url = urllib.parse.urljoin(base, html.unescape(href))
                  if "/book/" not in url or url.endswith("/book/"):
                      continue
                  label = re.sub(r"<[^>]+>", " ", label)
                  label = re.sub(r"\s+", " ", html.unescape(label)).strip()
                  row = {"label": label, "url": url}
                  if row not in out:
                      out.append(row)
              return out

          result = {
              "schema": "DALIEN-LIBRARY-ZIWEI-NORMAL-CATALOG-SEARCH-R1",
              "published_form": {
                  "method": "GET",
                  "action": BASE,
                  "fields": ["id", "keyword", "author"],
              },
              "catalog_parameter_guessing_attempted": False,
              "identifier_bruteforce_attempted": False,
              "authentication_or_paywall_bypass_attempted": False,
              "queries": [],
          }

          unique_items = {}
          for catalog_id in CATALOG_IDS:
              for term in TERMS:
                  url = BASE + "?" + urllib.parse.urlencode({
                      "id": str(catalog_id),
                      "keyword": term,
                      "author": "",
                  })
                  row = fetch(url)
                  data = row.pop("data")
                  record = {
                      "catalog_id": catalog_id,
                      "term": term,
                      "url": url,
                      **row,
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest() if data else None,
                  }
                  if data:
                      raw = data.decode("utf-8", "replace")
                      text = clean_text(raw)
                      record["term_present"] = term in text
                      record["ziwei_present"] = "紫微" in text
                      record["item_links"] = item_links(url, raw)
                      for item in record["item_links"]:
                          unique_items[item["url"]] = item["label"]
                  result["queries"].append(record)

          item_records = []
          for url, label in sorted(unique_items.items()):
              row = fetch(url)
              data = row.pop("data")
              raw = data.decode("utf-8", "replace") if data else ""
              text = clean_text(raw) if raw else ""
              item_records.append({
                  "url": url,
                  "search_label": label,
                  **row,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest() if data else None,
                  "title_or_text_contains_ziwei": "紫微" in text,
                  "four_juan_present": "四卷" in text,
                  "guangyi_present": "廣益書局" in text or "广益书局" in text,
                  "lithograph_present": "石印本" in text,
              })
          result["unique_item_records"] = item_records
          result["adjudication"] = {
              "query_method": "NORMAL_PUBLISHED_GET_FORM_ONLY",
              "unique_item_count": len(item_records),
              "cross_edition_target_page_effect": "NONE_UNTIL_ITEM_WITH_PUBLIC_TARGET_PAGE_IS_FOUND",
              "algorithm_effect": "NONE",
          }

          (OUT / "dalian-ziwei-catalog-search.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "query_count": len(result["queries"]),
              "unique_item_count": len(item_records),
              "items": item_records,
          }, ensure_ascii=False, indent=2))

      - name: Upload Dalian catalog-search evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dallibrary-ziwei-normal-catalog-search
          path: probe/
          if-no-files-found: warn
          retention-days: 14
