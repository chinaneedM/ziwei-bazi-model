name: verify-batch-12fl-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fl-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FL exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          e=json.loads(Path('docs/research/ZIWEI-QU-NLC-MIXED-TRANSFER-AND-TARGET-ACQUISITION-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-QU-NLC-MIXED-TRANSFER-AND-TARGET-ACQUISITION-BOUNDARY-FL'
          a=e['adjudication']
          assert a['qu_to_beijing_library_collection_level_transfer_program']=='CLOSED_AS_MIXED_DONATION_AND_PRICED_ACQUISITION_OR_SALE'
          assert a['target_1959_qu_donation_mark']=='ABSENT_ON_DIRECT_TARGET_ENTRIES'
          assert a['target_specific_donation_route_selected'] is False
          assert a['target_specific_sale_or_purchase_route_selected'] is False
          assert a['target_specific_other_transfer_route_selected'] is False
          assert a['final_nlc_acquisition_transfer_path']=='UNRESOLVED'
          assert a['missing_qu_donation_mark_implies_sale'] is False
          assert a['wang_donation_list_nonlocation_implies_sale'] is False

          g=e['sources']['gao_xizeng_annotated_catalog_discovery_lead']
          assert g['annotated_copy_directly_reviewed_by_project'] is False
          assert g['current_holding_or_digital_surrogate_closed'] is False
          assert g['target_3482_3483_annotation_reviewed'] is False
          assert g['target_transaction_mode_closed'] is False

          t=e['transmission_impact']
          assert t['nodes_added']==[] and t['edges_added']==[]
          assert t['same_object_edge_authorized'] is False
          assert t['acquisition_edge_authorized'] is False
          r=e['chronology_and_rule_firewall']
          assert r['direct_sanming_parent_vote_increment']==0
          assert r['runtime_rule_change'] is False
          assert r['algorithm_reopen_authorized'] is False
          assert r['candidate_collapse_authorized'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['historical_audit']['latest_batch_doc'].endswith('ZIWEI-QU-NLC-MIXED-TRANSFER-AND-TARGET-ACQUISITION-BOUNDARY-FL.md')
          assert 'BATCH-12-ZIWEI-QU-NLC-MIXED-TRANSFER-AND-TARGET-ACQUISITION-BOUNDARY-FL' in state['historical_audit']['completed_batches']
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {
              'EXT-NLC-PCAB-ZHAO-WANLI-QU-TIEQIN-MIXED-TRANSFER-RETROSPECTIVE-2018',
              'EXT-NLC-PCAB-ZHENG-ZHENDUO-QU-DONATION-AND-PRICED-ACQUISITION-2024',
              'EXT-TANG-ZHAO-2026-QU-TRANSFER-CATALOG-SEMANTICS-GAO-ANNOTATED-CATALOG-LEAD',
              'EXT-WANG-XIAOHU-2014-ZHUNZHAI-YUAN-COMPOSITION-STUDY',
          }.issubset(ids)

          graph=json.loads(Path('docs/TRANSMISSION-GENEALOGY-GRAPH-R1.json').read_text(encoding='utf-8'))
          assert not any(x.get('latest_scope_update_batch')=='BATCH-12-ZIWEI-QU-NLC-MIXED-TRANSFER-AND-TARGET-ACQUISITION-BOUNDARY-FL' for x in graph.get('edges', []))
          PY
