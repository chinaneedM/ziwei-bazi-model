name: probe-gyeongjin1580-inryeokja-comparator

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-gyeongjin1580-inryeokja-comparator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        shell: bash
        run: python -m pip install --quiet pillow

      - name: Probe public Gyeongjin 1580 image routes
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/gyeongjin1580-inryeokja-comparator'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/html" "$ROOT/images"
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.parse import urljoin
          from PIL import Image, ImageDraw
          import hashlib, html, io, json, re

          root=Path('audit/gyeongjin1580-inryeokja-comparator')
          UA='Mozilla/5.0 Tianwen-Provenance-Audit/1.0'
          opener=build_opener(HTTPRedirectHandler())
          pages=[
            ('gongu','https://gongu.copyright.or.kr/gongu/wrt/wrt/view.do?menuNo=200018&wrtSn=12189510'),
            ('heritage_legacy','https://www.heritage.go.kr/korea/heritage/search/Culresult_Db_View.jsp?mc=NS_04_03_01&VdkVgwKey=12,13190000,11&flag=Y'),
            ('heritage_detail','https://www.heritage.go.kr/heri/cul/culSelectDetail.do?VdkVgwKey=12,13190000,11&pageNo=1_1_1_1'),
            ('nfm_designated','https://www.nfm.go.kr/home/subIndex/104.do'),
            ('nfm_webzine','https://webzine.nfm.go.kr/2017/11/11/%EB%B0%95%EB%AC%BC%EA%B4%80%EC%97%90-%EB%8B%B4%EA%B8%B4-%EC%82%B6%EC%9D%98-%EC%9D%B4%EC%95%BC%EA%B8%B0%EB%A5%BC-%EB%93%A4%EC%96%B4%EB%B3%B4%EC%8B%A4%EB%9E%98%EC%9A%94/'),
          ]

          def get(url, referer=None, timeout=12):
              headers={'User-Agent':UA,'Accept':'text/html,application/xhtml+xml,image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'}
              if referer: headers['Referer']=referer
              req=Request(url,headers=headers)
              with opener.open(req,timeout=timeout) as r:
                  return getattr(r,'status',200),r.geturl(),r.headers.get('content-type',''),r.read()

          def page_fetch(row):
              name,url=row
              try:
                  status,final,ctype,b=get(url)
                  return {'name':name,'url':url,'ok':True,'status':status,'final_url':final,'content_type':ctype,'body':b}
              except Exception as e:
                  return {'name':name,'url':url,'ok':False,'error':type(e).__name__+': '+str(e)}

          page_rows=[]
          with ThreadPoolExecutor(max_workers=5) as ex:
              for r in ex.map(page_fetch,pages): page_rows.append(r)

          candidates=[]
          page_report=[]
          for r in page_rows:
              rr={k:v for k,v in r.items() if k!='body'}
              if r.get('ok'):
                  b=r['body']
                  rr['bytes']=len(b); rr['sha256']=hashlib.sha256(b).hexdigest()
                  (root/'html'/f"{r['name']}.html").write_bytes(b)
                  t=b.decode('utf-8','ignore')
                  attrs=[]
                  for m in re.finditer(r'''(?:src|href|data-src|data-original|content)\s*=\s*["']([^"']+)["']''',t,re.I):
                      attrs.append(html.unescape(m.group(1)))
                  attrs += re.findall(r'''https?://[^"'<>\s]+''',t)
                  for raw in attrs:
                      u=urljoin(r['final_url'],raw).replace('&amp;','&')
                      lu=u.lower()
                      if any(x in lu for x in ('.jpg','.jpeg','.png','.webp','.gif','image','img','photo','thumb','13190000','12189510')):
                          candidates.append({'source_page':r['name'],'referer':r['final_url'],'url':u})
              page_report.append(rr)

          # Follow the Shared Madang explicit outbound route as a provenance control.
          outbound='https://gongu.copyright.or.kr/gongu/wrt/cmmn/WritingFileLinkUrl.do?fileSn=1&wrtSn=12189510'
          try:
              status,final,ctype,b=get(outbound,'https://gongu.copyright.or.kr/')
              page_report.append({'name':'gongu_outbound','url':outbound,'ok':True,'status':status,'final_url':final,'content_type':ctype,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
              if 'text/html' in ctype:
                  (root/'html'/'gongu_outbound.html').write_bytes(b)
          except Exception as e:
              page_report.append({'name':'gongu_outbound','url':outbound,'ok':False,'error':type(e).__name__+': '+str(e)})

          # Deduplicate. Prefer URLs emitted by the two most target-specific pages, then cap.
          seen=set(); uniq=[]
          rank={'gongu':0,'heritage_legacy':1,'heritage_detail':2,'nfm_designated':3,'nfm_webzine':4}
          for c in sorted(candidates,key=lambda x:rank.get(x['source_page'],9)):
              if c['url'] in seen: continue
              seen.add(c['url']); uniq.append(c)
          uniq=uniq[:100]

          def dl(item):
              i,c=item
              try:
                  status,final,ctype,b=get(c['url'],c['referer'],timeout=10)
                  is_image=(ctype or '').startswith('image/') or b[:2]==b'\xff\xd8' or b[:8]==b'\x89PNG\r\n\x1a\n'
                  row={'i':i,'source_page':c['source_page'],'url':c['url'],'final_url':final,'status':status,'content_type':ctype,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'is_image':is_image}
                  if is_image and len(b)>8000:
                      try:
                          im=Image.open(io.BytesIO(b)); row['size']=list(im.size)
                          # Keep large-ish content images; tiny UI icons are excluded.
                          if im.width>=500 and im.height>=500:
                              ext='.png' if ('png' in ctype or b[:8]==b'\x89PNG\r\n\x1a\n') else '.webp' if 'webp' in ctype else '.jpg'
                              out=root/'images'/f'{i:03d}{ext}'; out.write_bytes(b)
                              row['saved']=str(out.relative_to(root))
                      except Exception as e:
                          row['image_parse_error']=type(e).__name__+': '+str(e)
                  return row
              except Exception as e:
                  return {'i':i,'source_page':c['source_page'],'url':c['url'],'error':type(e).__name__+': '+str(e)}

          downloads=[None]*len(uniq)
          with ThreadPoolExecutor(max_workers=20) as ex:
              fut={ex.submit(dl,(i,c)):i for i,c in enumerate(uniq)}
              for q in as_completed(fut): downloads[fut[q]]=q.result()

          saved=[x for x in downloads if x and x.get('saved')]
          # Make contact sheets for direct visual review.
          sheets=[]
          for start in range(0,len(saved),12):
              batch=saved[start:start+12]
              thumbs=[]
              for row in batch:
                  im=Image.open(root/row['saved']).convert('RGB')
                  im.thumbnail((430,560))
                  c=Image.new('RGB',(450,610),'white')
                  c.paste(im,((450-im.width)//2,15))
                  ImageDraw.Draw(c).text((8,585),f"{row['i']:03d} {row['source_page']} {row.get('size')}",fill='black')
                  thumbs.append(c)
              cols=3; nr=(len(thumbs)+cols-1)//cols
              sheet=Image.new('RGB',(cols*450,nr*610),'white')
              for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*450,(i//cols)*610))
              out=root/f'contact-{start//12+1:02d}.jpg'; sheet.save(out,quality=92); sheets.append(out.name)

          report={
              'schema':'GYEONGJIN1580-INRYEOKJA-COMPARATOR-PROBE-R1',
              'schema_version':'1.1.0',
              'target':'庚辰年大統曆 / 1580 use-year / likely 1579 impression / earliest securely identified surviving pre-Imjin Gwansanggam 印曆字 almanac',
              'authority_firewall':'Discovery/access probe only. No typographic identity or GK02538 dating claim may be made until source-bound comparator images are directly reviewed.',
              'page_fetches':page_report,
              'candidate_count_before_cap':len(seen),
              'candidate_count_probed':len(uniq),
              'downloads':downloads,
              'saved_image_count':len(saved),
              'contact_sheets':sheets,
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
              'page_fetches':page_report,
              'candidate_count_before_cap':len(seen),
              'candidate_count_probed':len(uniq),
              'saved_image_count':len(saved),
              'saved':saved,
              'contact_sheets':sheets,
              'errors':[x for x in downloads if x and x.get('error')][:20]
          },ensure_ascii=False,indent=2))
          PY

      - name: Upload comparator probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gyeongjin1580-inryeokja-comparator-r1
          path: audit/gyeongjin1580-inryeokja-comparator
          if-no-files-found: error
          retention-days: 30
