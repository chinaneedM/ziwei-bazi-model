name: probe-tianwen-13ly-bsb-volume1-manifest
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/probe-tianwen-13ly-bsb-volume1-manifest.py
      - scripts/verify-tianwen-13ly-bsb-eight-volume-index.py
      - tests/test_tianwen_13ly_bsb_volume1_manifest.py
      - .github/workflows/probe-tianwen-13ly-bsb-volume1-manifest.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - run: python scripts/verify-tianwen-13ly-bsb-eight-volume-index.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13ly_bsb_volume1_manifest.py' -v
      - run: python scripts/probe-tianwen-13ly-bsb-volume1-manifest.py --out /tmp/tianwen-13ly
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13ly-bsb-volume1-firstparty-canvas-atlas
          path: /tmp/tianwen-13ly/
          if-no-files-found: warn
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
