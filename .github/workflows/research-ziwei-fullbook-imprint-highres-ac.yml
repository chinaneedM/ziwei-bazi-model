name: research-ziwei-fullbook-imprint-highres-ac

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-fullbook-imprint-highres-ac.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture exact source-emitted Artron image and Kongfz access boundaries
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path("probe"); IMG=OUT/"images"; OUT.mkdir(); IMG.mkdir()
          UA="Mozilla/5.0 provenance-research exact-source-emitted-highres"

          def fetch(url, referer=None, limit=20_000_000):
            headers={
              "User-Agent":UA,
              "Accept":"text/html,application/xhtml+xml,image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
              "Accept-Language":"zh-CN,zh-TW;q=0.9,en;q=0.5"
            }
            if referer: headers["Referer"]=referer
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=40) as r:
                data=r.read(limit)
                return {"ok":True,"status":getattr(r,"status",None),"final_url":r.geturl(),
                        "content_type":r.headers.get("content-type"),"bytes":len(data),
                        "sha256":hashlib.sha256(data).hexdigest(),"data":data}
            except Exception as exc:
              return {"ok":False,"error":repr(exc),"bytes":0,"data":b""}

          result={
            "schema":"ZIWEI-FULLBOOK-IMPRINT-HIGHRES-AC-R1",
            "access_date":"2026-09-09",
            "authentication_attempted":False,
            "purchase_attempted":False,
            "identifier_guessing_attempted":False,
            "access_control_bypass_attempted":False,
            "artron":{},
            "kongfz":[]
          }

          artron="https://auction.artron.net/paimai-art0064192036/"
          row=fetch(artron); raw=row.pop("data")
          rec={"page_url":artron,**row,"source_emitted_bigpic_urls":[]}
          if raw:
            txt=raw.decode("utf-8","replace")
            (OUT/"artron-lot2036.html").write_text(txt,encoding="utf-8")
            urls=[]
            for pat in [
              r'''["']bigPic["']\s*:\s*["']([^"']+)["']''',
              r'''["']bigPicArray["']\s*:\s*\[([^\]]+)\]''',
              r'''https?:\\?/\\?/[^"'<>\s]+(?:jpg|jpeg|png|webp)(?:[^"'<>\s]*)'''
            ]:
              for m in re.finditer(pat,txt,re.I):
                vals=[m.group(1)] if m.lastindex else [m.group(0)]
                for v in vals:
                  for q in re.findall(r'''https?:\\?/\\?/[^"'<>\s,\]]+''',v):
                    u=html.unescape(q).replace("\\/","/").replace("\u002F","/")
                    if u not in urls: urls.append(u)
                  if m.lastindex and str(v).startswith(("http://","https://")):
                    u=html.unescape(v).replace("\\/","/")
                    if u not in urls: urls.append(u)
            # Prefer exact source image URL embedded inside Artron's page-emitted thumbnail URL.
            expanded=[]
            for u in urls:
              expanded.append(u)
              p=urllib.parse.urlparse(u)
              qs=urllib.parse.parse_qs(p.query)
              for src in qs.get("src",[]):
                su=urllib.parse.unquote(src)
                if su.startswith(("http://","https://")) and su not in expanded:
                  expanded.append(su)
            rec["source_emitted_bigpic_urls"]=expanded
            for i,u in enumerate(expanded,1):
              ir=fetch(u,referer=artron,limit=20_000_000); data=ir.pop("data")
              item={"url":u,**ir}
              ct=(ir.get("content_type") or "").lower()
              magic=data[:3]==b"\xff\xd8\xff" or data[:8]==b"\x89PNG\r\n\x1a\n" or data[:4]==b"RIFF"
              if data and ir.get("ok") and (magic or "image/" in ct) and len(data)>20_000:
                ext=".png" if data[:8]==b"\x89PNG\r\n\x1a\n" else ".webp" if data[:4]==b"RIFF" else ".jpg"
                pth=IMG/f"artron-lot2036-{i:02d}{ext}"
                pth.write_bytes(data); item["saved_file"]=str(pth)
              rec.setdefault("images",[]).append(item)
          result["artron"]=rec

          for object_id in ("78170971","70370885","54804686"):
            url=f"https://www.kongfz.cn/{object_id}/pic/"
            kr=fetch(url); data=kr.pop("data")
            k={"object_id":object_id,"url":url,**kr}
            if data:
              txt=data.decode("utf-8","replace")
              (OUT/f"kongfz-{object_id}.html").write_text(txt,encoding="utf-8")
              k["login_surface_observed"]="login.kongfz.com" in (kr.get("final_url") or "") or "登录" in txt[:6000]
            result["kongfz"].append(k)

          result["adjudication"]={
            "artron_imprint_visual_review":"PENDING_DIRECT_NO_OCR_REVIEW",
            "artron_target_page_status":"NOT_CLAIMED",
            "kongfz_target_page_status":"NOT_CLAIMED",
            "independent_textual_witness_increment":0,
            "algorithm_effect":"NONE"
          }
          (OUT/"ziwei-fullbook-imprint-highres-ac.json").write_text(
            json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          print(json.dumps({
            "artron":{"page_status":rec.get("status"),"page_bytes":rec.get("bytes"),
                      "urls":rec.get("source_emitted_bigpic_urls",[]),
                      "images":[{k:v for k,v in x.items() if k in ("url","status","bytes","sha256","saved_file","error")}
                                for x in rec.get("images",[])]},
            "kongfz":result["kongfz"],
            "adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))

      - name: Upload high-resolution imprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-fullbook-imprint-highres-ac
          path: probe/
          if-no-files-found: warn
          retention-days: 14
