name: verify-tianwen-13le-naaj-original-p6
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - docs/research/TIANWEN-13LE-*
      - scripts/verify-tianwen-13le-naaj-original-p6.py
      - tests/test_tianwen_13le_naaj_original_p6.py
      - .github/workflows/verify-tianwen-13le-naaj-original-p6.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13le-naaj-original-p6.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13le_naaj_original_p6.py' -v
      - run: python scripts/verify-tianwen-13ld-naaj-mingshi-juan35-source-route.py
      - run: python scripts/verify-tianwen-13lc-siku-chronology.py
      - run: python scripts/verify-tianwen-13lb-cadal-siku-native.py
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
