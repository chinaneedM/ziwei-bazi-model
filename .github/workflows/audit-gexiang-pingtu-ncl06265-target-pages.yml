name: audit-gexiang-pingtu-ncl06265-target-pages

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-gexiang-pingtu-ncl06265-target-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF renderer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Lock Pingtu target leaves at high resolution
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/gexiang-pingtu-ncl06265-target-pages'
          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NCL-06265%20%E9%87%8D%E5%88%8A%E9%9D%A9%E8%B1%A1%E6%96%B0%E6%9B%B8.pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"

          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source.sha256"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"
          for p in 5 36 37; do
            pdftoppm -f "$p" -l "$p" -singlefile -png -r 360 "$ROOT/source.pdf" "$ROOT/page-$p"
          done
          sha256sum "$ROOT"/page-*.png | sort -V | tee "$ROOT/pages.sha256"

          printf '%s\n' \
            'SOURCE=NCL-06265 重刊革象新書' \
            'PROVIDER_LINEAGE=Rare Books & Special Collections, National Central Library / 國圖代管原平圖古籍微片 via Wikimedia Commons' \
            'PAGE_5_ROLE=internal Zhengde-15 dated prefatory leaf control' \
            'PAGE_36_ROLE=時分百刻 opening and hundred-ke arithmetic' \
            'PAGE_37_ROLE=half-zi yesterday/today wording and volume-one ending' \
            'RENDER_DPI=360' \
            'OCR_USED_FOR_FINAL_GLYPH_CLAIMS=false' \
            'TEXT_LAYER_ROLE=NONE_FOR_FINAL_GLYPH_CLAIMS' \
            > "$ROOT/manifest.txt"

          rm "$ROOT/source.pdf"

      - name: Upload Pingtu decisive target pages
        uses: actions/upload-artifact@v4
        with:
          name: gexiang-pingtu-ncl06265-target-pages
          path: audit/gexiang-pingtu-ncl06265-target-pages
          if-no-files-found: error
          retention-days: 30
