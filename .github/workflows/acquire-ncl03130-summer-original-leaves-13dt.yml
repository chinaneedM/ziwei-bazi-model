name: acquire-ncl03130-summer-original-leaves-13dt
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - "scripts/acquire-ncl03130-summer-original-leaves-13dt.py"
      - ".github/workflows/acquire-ncl03130-summer-original-leaves-13dt.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summer-source-original:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image-only PDF renderer (no OCR)
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<1.28" "Pillow>=10,<13" requests
      - name: Acquire SHA-bound original summer source pages 81-90
        run: python scripts/acquire-ncl03130-summer-original-leaves-13dt.py
      - name: Preserve original pixels, hashes and source-access failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncl03130-13dt-part09-summer-original-pages
          path: ncl03130-13dt-original-summer-source/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
