name: verify-tianwen-13jb-gk5554-digital-vol18-toc
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13JB-*'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - 'scripts/verify-tianwen-13jb-gk5554-digital-vol18-toc.py'
      - 'tests/test_tianwen_13jb_gk5554_digital_vol18_toc.py'
      - '.github/workflows/verify-tianwen-13jb-gk5554-digital-vol18-toc.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  exact-source-bound-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13jb-gk5554-digital-vol18-toc.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13jb_gk5554_digital_vol18_toc.py' -v
