name: research-ziwei-tohoku-hirayama-v56-ax-visual-r1

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - '.github/workflows/research-ziwei-tohoku-hirayama-v56-ax-visual-r1.yml'

permissions:
  contents: read

jobs:
  package-selected-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Tohoku comparison pages and NIJL 1594 anchor leaves
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import hashlib
          import json
          import time
          from pathlib import Path
          import requests

          out = Path('ax-visual-pages')
          out.mkdir(parents=True, exist_ok=True)
          s = requests.Session()
          s.headers.update({'User-Agent': 'ziwei-bazi-model direct visual collation/1.0'})
          manifest = []

          def fetch(url, path, label):
              last = None
              for attempt in range(1, 6):
                  try:
                      r = s.get(url, timeout=60)
                      if r.status_code == 200:
                          path.write_bytes(r.content)
                          manifest.append({
                              'label': label,
                              'image_url': url,
                              'sha256': hashlib.sha256(r.content).hexdigest(),
                              'bytes': len(r.content),
                          })
                          return
                      last = f'HTTP {r.status_code}'
                  except Exception as exc:
                      last = f'{type(exc).__name__}: {exc}'
                  if attempt < 5:
                      time.sleep(min(2 ** (attempt - 1), 8))
              raise SystemExit(f'{label} acquisition failed: {last}')

          tohoku_pages = [36, 37, 38, 39, 41, 42, 43, 82, 83, 84]
          tohoku_root = 'https://touda.tohoku.ac.jp/iiif/2/public%2Flibrary%2Fwasan%2Fportal%2Fq%2Fq065%2F04'
          for page in tohoku_pages:
              name = f'q065040{page:03d}l.tif'
              service = f'{tohoku_root}%2F{name}'
              url = service + '/full/1200,/0/default.jpg'
              fetch(url, out / f'tohoku-page-{page:03d}.jpg', f'TOHOKU_MA591_V5-6_PAGE_{page:03d}')
              time.sleep(0.2)

          nijl_root = 'https://kokusho.nijl.ac.jp/api/iiif/100238879/v4/THKW/THKW-04306'
          for canvas in range(193, 198):
              service = f'{nijl_root}/THKW-04306-{canvas:05d}.tif'
              url = service + '/full/2400,/0/default.jpg'
              fetch(url, out / f'nijl-canvas-{canvas:03d}.jpg', f'NIJL_1594_CANVAS_{canvas:03d}')
              time.sleep(0.2)

          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'count': len(manifest), 'labels': [x['label'] for x in manifest]}, ensure_ascii=False))
          PY
      - name: Upload comparison images
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-zhangguo-ax-visual-comparison
          path: ax-visual-pages
          if-no-files-found: error
          retention-days: 7
