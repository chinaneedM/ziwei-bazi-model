name: research-ziwei-tohoku-hirayama-v56-ax-visual-r1

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - '.github/workflows/research-ziwei-tohoku-hirayama-v56-ax-visual-r1.yml'

permissions:
  contents: read

jobs:
  package-selected-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Tohoku Hirayama volume 7-8 back-half pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import hashlib, json, time
          from pathlib import Path
          import requests

          out = Path('ax-visual-pages')
          out.mkdir(parents=True, exist_ok=True)
          s = requests.Session()
          s.headers.update({'User-Agent': 'ziwei-bazi-model direct visual collation/1.0'})
          manifest = []

          def fetch(url, path, label):
              last = None
              for attempt in range(1, 6):
                  try:
                      r = s.get(url, timeout=60)
                      if r.status_code == 200:
                          path.write_bytes(r.content)
                          manifest.append({
                              'label': label,
                              'image_url': url,
                              'sha256': hashlib.sha256(r.content).hexdigest(),
                              'bytes': len(r.content),
                          })
                          return
                      last = f'HTTP {r.status_code}'
                  except Exception as exc:
                      last = f'{type(exc).__name__}: {exc}'
                  if attempt < 5:
                      time.sleep(min(2 ** (attempt - 1), 8))
              raise SystemExit(f'{label} acquisition failed: {last}')

          root = 'https://touda.tohoku.ac.jp/iiif/2/public%2Flibrary%2Fwasan%2Fportal%2Fq%2Fq065%2F05'
          for page in range(40, 90):
              name = f'q065050{page:03d}l.tif'
              service = f'{root}%2F{name}'
              url = service + '/full/1200,/0/default.jpg'
              fetch(url, out / f'v78-page-{page:03d}.jpg', f'TOHOKU_MA591_V7-8_PAGE_{page:03d}')
              time.sleep(0.1)

          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'count': len(manifest), 'first': manifest[0]['label'], 'last': manifest[-1]['label']}, ensure_ascii=False))
          PY
      - name: Upload volume 7-8 direct visual pages
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-tohoku-hirayama-v78-backhalf-visual
          path: ax-visual-pages
          if-no-files-found: error
          retention-days: 7
