name: research-ziwei-sancai-1697-luming-nightzi-av-r2

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-sancai-1697-luming-nightzi-av-r2.yml

permissions:
  contents: read

jobs:
  lock-target-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Render exact 1697 人部卷一祿命 target pages without OCR
        shell: python
        run: |
          import hashlib
          import json
          import subprocess
          import urllib.parse
          import urllib.request
          from pathlib import Path

          out = Path('out')
          renders = out / 'renders'
          renders.mkdir(parents=True)
          title = 'File:Harvard drs 52822721 三才發秘天部二卷 v.8.pdf'
          params = {
              'action': 'query', 'format': 'json', 'prop': 'imageinfo',
              'iiprop': 'url|sha1|size', 'titles': title,
          }
          api = 'https://commons.wikimedia.org/w/api.php?' + urllib.parse.urlencode(params)
          req = urllib.request.Request(api, headers={'User-Agent': 'ziwei-bazi-model-research/1.0'})
          data = json.load(urllib.request.urlopen(req, timeout=60))
          info = next(iter(data['query']['pages'].values()))['imageinfo'][0]
          pdf = out / 'sancai-v8.pdf'
          req = urllib.request.Request(info['url'], headers={'User-Agent': 'ziwei-bazi-model-research/1.0'})
          with urllib.request.urlopen(req, timeout=180) as src, pdf.open('wb') as dst:
              while True:
                  chunk = src.read(1024 * 1024)
                  if not chunk:
                      break
                  dst.write(chunk)

          pdf_sha = hashlib.sha256(pdf.read_bytes()).hexdigest()
          targets = [8, 9, 10]
          for p in targets:
              subprocess.run([
                  'pdftoppm', '-f', str(p), '-singlefile', '-jpeg', '-r', '400',
                  str(pdf), str(renders / f'page-{p:04d}')
              ], check=True)

          page_files = []
          for path in sorted(renders.glob('*.jpg')):
              page_files.append({
                  'file': path.name,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'bytes': path.stat().st_size,
              })

          manifest = {
              'schema': 'ZIWEI-SANCAI-1697-LUMING-NIGHTZI-AV-R2-TARGET-LOCK',
              'source_title': title,
              'resolved_original_url': info['url'],
              'commons_sha1': info.get('sha1'),
              'commons_size': info.get('size'),
              'pdf_sha256': pdf_sha,
              'target_pdf_pages': targets,
              'render_dpi': 400,
              'ocr_used': False,
              'visual_review_targets': {
                  'p8': '三才發秘人部卷一; 新安陳雯耕山氏著述; 祿命 heading',
                  'p9': '祿命總論 opening; time as 太陽所停之方位 and calendrical/stem-branch setup',
                  'p10': '夜半前之四刻乃是子時並非亥時; 若立支幹當立明日子時枝幹; 半夜之前卻有半個子時; 時人亦不知又作為亥論; 故在夜生者所生八字多有差謬'
              },
              'interpretive_firewall': [
                  'This is a second internal-context witness within the same 1697 work, not an independent textual lineage vote.',
                  'The passage is directly inside the 祿命 chapter and explicitly links treating the pre-midnight half-Zi as Hai to natal-eight-character error.',
                  'The author rejects 作亥論; historical attestation is not endorsement.',
                  'No runtime winner, candidate collapse or algorithm reopen follows from this collation.'
              ],
              'page_files': page_files,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', 'utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-sancai-1697-luming-nightzi-av-r2-target-lock
          path: out/
          retention-days: 90
