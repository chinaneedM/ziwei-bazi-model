name: verify-batch-12jn-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12jn-exact-head.yml
      - .github/workflows/probe-batch-12jn-shu-current-wenhui-locator-digital-access.yml
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-WENHUIBAO-SHU-2025-CURRENT-LOCATOR-AND-DIGITAL-ACCESS-BOUNDARY-JN.md
      - docs/research/ZIWEI-WENHUIBAO-SHU-2025-CURRENT-LOCATOR-AND-DIGITAL-ACCESS-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending JN status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'tianwen/batch-12jn-exact-head', description: 'Batch 12JN exact-head verification running'})
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12JN exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-WENHUIBAO-SHU-2025-CURRENT-LOCATOR-AND-DIGITAL-ACCESS-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-WENHUIBAO-SHU-2025-CURRENT-LOCATOR-AND-DIGITAL-ACCESS-BOUNDARY-JN'
          assert e['controlling_probe']['workflow_run_id']==36833087275
          assert e['controlling_probe']['artifact_id']==11147354008
          assert e['current_directory']['response_sha256']=='f421d3fbfdf3b508f50f8e4298e0d34f7649e8e3206e8da129c5841b65816a9c'
          assert e['current_directory']['current_row']['rack']=='A7-1'
          assert e['current_directory']['current_row']['coverage']=='1951(5-8)'
          assert e['legacy_locator_reconciliation']['batch_12jm_legacy_shelf_literal']=='6--10'
          assert e['adjudication']['current_directory_supersedes_legacy_locator_for_present_access_planning'] is True
          assert e['adjudication']['target_holding_coverage_changed_from_12jm'] is False
          assert e['digital_platform']['target_binding_status']=='NOT_OBSERVED'
          assert e['digital_platform']['public_remote_view_contract_observed'] is False
          assert e['security']['email_sent'] is False
          assert e['security']['appointment_requested'] is False
          assert e['transmission_impact']['status']=='NONE'
          assert e['project_consequence']['product_change'] is False
          PY
      - name: Publish success JN status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'success', context: 'tianwen/batch-12jn-exact-head', description: 'Batch 12JN exact-head verification passed'})
      - name: Publish failure JN status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'failure', context: 'tianwen/batch-12jn-exact-head', description: 'Batch 12JN exact-head verification failed'})
