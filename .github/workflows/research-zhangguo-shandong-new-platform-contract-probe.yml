name: research-zhangguo-shandong-new-platform-contract-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-zhangguo-shandong-new-platform-contract-probe.yml

permissions:
  contents: read

jobs:
  egress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cross-egress DNS TCP TLS HTTP probe
        shell: bash
        run: |
          python - <<'PY'
          import json, socket, ssl, urllib.request
          from pathlib import Path

          host='guji.sdlib.cn'
          urls=['https://guji.sdlib.cn/','https://guji.sdlib.cn/gujih5/','http://guji.sdlib.cn/']
          out={'schema':'SHANDONG-NEW-PLATFORM-CROSS-EGRESS-R1','host':host,'dns':[],'tcp':[],'tls':[],'http':[]}
          try:
              infos=socket.getaddrinfo(host,None)
              vals=[]
              for fam,typ,proto,canon,addr in infos:
                  row={'family':fam,'address':addr[0]}
                  if row not in vals: vals.append(row)
              out['dns']=vals
          except Exception as e:
              out['dns_error']=f'{type(e).__name__}: {e}'

          for port in (443,80):
              ips=[]
              try:
                  infos=socket.getaddrinfo(host,port,type=socket.SOCK_STREAM)
                  ips=[]
                  for fam,typ,proto,canon,addr in infos:
                      key=(fam,addr[0])
                      if key not in ips: ips.append(key)
              except Exception as e:
                  out['tcp'].append({'port':port,'resolve_error':f'{type(e).__name__}: {e}'})
              for fam,ip in ips[:6]:
                  row={'port':port,'family':fam,'ip':ip}
                  s=socket.socket(fam,socket.SOCK_STREAM); s.settimeout(7)
                  try:
                      s.connect((ip,port)); row['connected']=True
                      if port==443:
                          ctx=ssl.create_default_context()
                          with ctx.wrap_socket(s,server_hostname=host) as ss:
                              row['tls_version']=ss.version(); row['tls_cipher']=ss.cipher()[0]
                              cert=ss.getpeercert(); row['cert_subject']=cert.get('subject'); row['cert_not_after']=cert.get('notAfter')
                          s=None
                  except Exception as e:
                      row['connected']=False; row['error']=f'{type(e).__name__}: {e}'
                  finally:
                      if s:
                          try:s.close()
                          except:pass
                  out['tcp'].append(row)

          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 cross-egress-probe/1.0'})
              row={'url':url}
              try:
                  with urllib.request.urlopen(req,timeout=10) as r:
                      body=r.read(512)
                      row.update(status=r.status,final_url=r.geturl(),content_type=r.headers.get('content-type'),prefix=body.decode('utf-8','replace'))
              except Exception as e:
                  row['error']=f'{type(e).__name__}: {e}'
              out['http'].append(row)
          p=Path('sdlib-egress.json'); p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sdlib-new-platform-egress-${{ runner.os }}
          path: sdlib-egress.json
          if-no-files-found: error
