name: acquire-tianwen-13ki-shanghai-huang-original
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13ki-shanghai-huang.py
      - tests/test_tianwen_13ki_shanghai_huang.py
      - .github/workflows/acquire-tianwen-13ki-shanghai-huang.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'requests>=2.32,<3' 'Pillow>=10,<12' 'pymupdf>=1.24,<1.27'
      - run: python -m unittest discover -s tests -p 'test_tianwen_13ki_shanghai_huang.py' -v
      - run: python scripts/acquire-tianwen-13ki-shanghai-huang.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13ki-shanghai-huang-original-pdf-and-atlas
          path: /tmp/tianwen-13ki/
          retention-days: 30
          if-no-files-found: error
