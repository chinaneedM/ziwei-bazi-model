name: verify-tianwen-13kc-g893-five-row
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - docs/research/TIANWEN-13KC-*
      - scripts/verify-tianwen-13kc-g893-five-row.py
      - tests/test_tianwen_13kc_g893_five_row.py
      - .github/workflows/verify-tianwen-13kc-g893-five-row.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Evidence arithmetic, immutable upstream and scope gates
        run: |
          python scripts/verify-tianwen-13kc-g893-five-row.py
          python -m unittest discover -s tests -p 'test_tianwen_13kc_g893_five_row.py' -v
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
