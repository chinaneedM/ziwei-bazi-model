name: research-tianwen-13rw-djvu-reader
on:
  push:
    branches: [agent/tianwen-13rw-mei-qian-original-probe]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Acquire Ubuntu DjVu decoder packages and vertical locator model
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          mkdir viewer-debs
          cd viewer-debs
          apt-get download djvulibre-bin libdjvulibre21 tesseract-ocr-chi-tra-vert
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13rw-djvu-reader
          path: viewer-debs/
          retention-days: 7
