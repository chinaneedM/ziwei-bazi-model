name: verify-tianwen-13gc-nlc-p75-original-d17-d20
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
  workflow_dispatch:
jobs:
  verify-direct-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify NLC source-original p75 D17-D20 and keep D30 NULL
        run: python scripts/verify-tianwen-13gc-nlc-p75-d17-d20.py
      - name: Run negative mutation tests
        run: python -m unittest discover -s tests -p 'test_verify_tianwen_13gc_nlc_p75_d17_d20.py' -v
