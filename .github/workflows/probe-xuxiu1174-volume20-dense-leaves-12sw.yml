name: probe-xuxiu1174-volume20-dense-leaves-12sw
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-xuxiu1174-volume20-dense-leaves-12sw.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-vol20-dense-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PDF image renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install -q Pillow
      - name: Verify source object and render every PDF page 486 through 518
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p xuxiu1174-12sw/pages xuxiu1174-12sw/contacts
          python - <<'PY'
          import hashlib,json,pathlib,subprocess,urllib.parse
          from PIL import Image,ImageDraw
          base=pathlib.Path("xuxiu1174-12sw")
          name="續修四庫全書第1174冊.pdf"
          url="https://commons.wikimedia.org/wiki/Special:Redirect/file/"+urllib.parse.quote(name)
          expected={"bytes":68649578,"sha1":"fc6a98b070c11372c557e22bb05cdc9859541715",
            "sha256":"bee08d95d6b141a978f4d7fb068b97b74cf8ee25b46c6273110b2891a0faf953","pages":810}
          pdf=base/"source.pdf"
          obj={"schema":"TIANWEN-12SW-XUXIU1174-DENSE-PDF486-518-ORIGINAL-PAGE-ATLAS",
            "source_file":name,"source_route":url,"expected":expected,
            "pdf_range":[486,518],"selection_reason":"12SV observed vol19 p490 vol20 p502 vol21 p514 at 1000px",
            "evidence_scope":"2002 facsimile of 1827 print repaired in 1869 per catalog, not proof of original imprint",
            "ocr_used":False,"target_article_manually_identified":False,
            "four_loci_manually_verified":False,"source_glyph_votes":0,
            "page_images":[],"contact_sheets":[],"status":"STARTED"}
          def sha(b):return hashlib.sha256(b).hexdigest()
          try:
            cmd=["curl","-L","--fail","--retry","3","--retry-all-errors",
              "--retry-delay","4","--connect-timeout","25","--max-time","480",
              "-A","Tianwen-Research-Source-Page-Inspection/1.0",url,"-o",str(pdf)]
            p=subprocess.run(cmd,capture_output=True,text=True,timeout=510)
            if p.returncode:raise RuntimeError("SOURCE_FETCH_BOUNDARY: "+p.stderr[-220:])
            raw=pdf.read_bytes()
            identity={"bytes":len(raw),"sha1":hashlib.sha1(raw).hexdigest(),"sha256":sha(raw)}
            info=subprocess.check_output(["pdfinfo",str(pdf)],text=True,timeout=50)
            identity["pages"]=int(next(row.split(":",1)[1] for row in info.splitlines() if row.startswith("Pages:")))
            obj["observed"]=identity
            if not raw.startswith(b"%PDF") or any(identity[k]!=v for k,v in expected.items()):
              raise RuntimeError("SOURCE_IDENTITY_OR_PAGE_COUNT_MISMATCH_FAIL_CLOSED")
            cards=[]
            for n in range(486,519):
              o=base/"pages"/f"page-{n:03d}"
              subprocess.run(["pdftoppm","-f",str(n),"-l",str(n),"-scale-to","2300",
                 "-jpeg","-jpegopt","quality=86","-singlefile",str(pdf),str(o)],
                 check=True,capture_output=True,timeout=85)
              f=o.with_suffix(".jpg");dat=f.read_bytes()
              obj["page_images"].append({"pdf_page_1based":n,"sha256":sha(dat),"bytes":len(dat)})
              with Image.open(f) as x:
                thumb=x.convert("RGB");thumb.thumbnail((760,1000));cards.append((n,thumb.copy()))
              if len(cards)==6 or n==518:
                sheet=Image.new("RGB",(3*790,2*1070),"white")
                d=ImageDraw.Draw(sheet)
                for i,(pn,im) in enumerate(cards):
                  x=(i%3)*790;y=(i//3)*1070
                  d.text((x+10,y+8),f"1174 PDF {pn} (1-based) - visual review required",fill="black")
                  sheet.paste(im,(x+10,y+40))
                sf=base/"contacts"/f"dense-{len(obj['contact_sheets'])+1:02d}.jpg"
                sheet.save(sf,quality=86)
                obj["contact_sheets"].append({"file":sf.name,"pages":[a for a,_ in cards],"sha256":sha(sf.read_bytes())})
                cards=[]
            obj["status"]="SOURCE_MATCHED_DENSE_IMAGES_GENERATED_UNCOLLATED"
          except Exception as e:
            obj["status"]="FAIL_CLOSED_ACCESS_IDENTITY_OR_RENDER"
            obj["error"]=type(e).__name__+": "+str(e)[:500]
          finally:
            pdf.unlink(missing_ok=True)
            (base/"status.json").write_text(json.dumps(obj,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          print(json.dumps({"status":obj["status"],"images":len(obj["page_images"]),
             "sha256":obj.get("observed",{}).get("sha256"),"error":obj.get("error")}))
          if obj["status"]!="SOURCE_MATCHED_DENSE_IMAGES_GENERATED_UNCOLLATED":raise SystemExit(1)
          PY
      - name: Preserve page-byte hashes and original-leaf sampling
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xuxiu1174-volume20-dense-original-leaves-12sw
          path: xuxiu1174-12sw/
          retention-days: 14
          if-no-files-found: warn
