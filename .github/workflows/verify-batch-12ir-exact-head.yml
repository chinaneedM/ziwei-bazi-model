name: verify-batch-12ir-exact-head
# Durable exact-head gate: publisher/Open Library identity may close; direct p.197 remains evidence-gated.

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ir-exact-head.yml
      - docs/research/ZIWEI-ZHAO-WANLI-WENJI-V1-NLCPRESS-OPENLIBRARY-PUBLIC-PREVIEW-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-ZHAO-WANLI-WENJI-V1-NLCPRESS-OPENLIBRARY-PUBLIC-PREVIEW-BOUNDARY-IR.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
      - .github/workflows/probe-batch-12ir-zhao-wanli-wenji-public-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IR status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'tianwen/batch-12ir-exact-head',
              description: 'Batch 12IR Zhao Wenji preview boundary verification running'
            })
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12IR exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-ZHAO-WANLI-WENJI-V1-NLCPRESS-OPENLIBRARY-PUBLIC-PREVIEW-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-ZHAO-WANLI-WENJI-V1-NLCPRESS-OPENLIBRARY-PUBLIC-PREVIEW-BOUNDARY-IR'
          assert e['publisher_discovery']['source_list_page']==315
          assert e['publisher_discovery']['product_id']==5325
          b=e['product5325_public_boundary']['booktext']
          assert b['content_length']==464 and b['bytes_read']==464
          assert b['body_sha256']=='6cc2f2aecebdbb31294bad9149075dba0aa0aa2bb2a9e778474fb44e9b43529e'
          assert b['p197_literal'] is False and b['raw_text_saved'] is False
          assert e['publisher_ebook_resource_center']['target_title_listed'] is False
          ol=e['openlibrary_control']
          assert ol['edition_key']=='/books/OL30454631M'
          assert ol['work_key']=='/works/OL22369963W'
          assert ol['ocaid'] is None
          assert e['p197_adjudication']['direct_2011_p197']=='NOT_REVIEWED'
          assert e['project_consequence']['product_change'] is False
          PY
      - name: Publish success IR status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12ir-exact-head',
              description: 'Batch 12IR exact-head verification passed'
            })
      - name: Publish failure IR status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12ir-exact-head',
              description: 'Batch 12IR exact-head verification failed'
            })
