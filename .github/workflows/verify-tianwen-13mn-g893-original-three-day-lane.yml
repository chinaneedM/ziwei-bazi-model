name: verify-tianwen-13mn-g893-original-three-day-lane
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/verify-tianwen-13mn-g893-original-three-day-lane.py
      - tests/test_tianwen_13mn_g893_original_three_day_lane.py
      - docs/research/TIANWEN-13MN-G893-D15-D17-DIRECT-ORIGINAL-NUMERIC-LANE-R1.json
      - docs/research/TIANWEN-13MN-G893-D15-D17-DIRECT-ORIGINAL-NUMERIC-LANE-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - .github/workflows/verify-tianwen-13mn-g893-original-three-day-lane.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13mn-g893-original-three-day-lane.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13mn_g893_original_three_day_lane.py' -v
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
