name: audit-xuxiu1061-taiyi-daily-sunrise-mechanism

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-xuxiu1061-taiyi-daily-sunrise-mechanism.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install locator tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pillow

      - name: Render Taiyi Tongzong Baojian opening range from Xuxiu 1061
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/xuxiu1061-taiyi-daily-sunrise-mechanism'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/render" "$ROOT/contact"

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/%E7%BA%8C%E4%BF%AE%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E7%AC%AC1061%E5%86%8A.pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/1061.pdf"
          ACTUAL=$(sha256sum "$ROOT/1061.pdf" | awk '{print $1}')
          EXPECTED='618a31924e05cbb8e8c5b49bfc0da2d7c7fb64526c6719175d685088cef29d83'
          printf '%s  %s\n' "$ACTUAL" "$ROOT/1061.pdf" | tee "$ROOT/source.sha256"
          test "$ACTUAL" = "$EXPECTED"
          pdfinfo "$ROOT/1061.pdf" | tee "$ROOT/pdfinfo.txt"

          # Printed/indexed Taiyi begins near p373; use a deliberately wider physical-PDF window.
          pdftotext -f 360 -l 440 -layout "$ROOT/1061.pdf" "$ROOT/text-layer-p360-440.txt" || true
          pdftoppm -f 365 -l 430 -jpeg -jpegopt quality=90 -r 200 "$ROOT/1061.pdf" "$ROOT/render/page" >/dev/null 2>&1
          sha256sum "$ROOT"/render/*.jpg | sort -V > "$ROOT/render.sha256"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('audit/xuxiu1061-taiyi-daily-sunrise-mechanism')
          pages=sorted((root/'render').glob('page-*.jpg'), key=lambda p:int(p.stem.split('-')[-1]))
          for start in range(0,len(pages),12):
              batch=pages[start:start+12]
              thumbs=[]
              for p in batch:
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((360,500))
                  canvas=Image.new('RGB',(380,535),'white')
                  canvas.paste(im,((380-im.width)//2,25))
                  ImageDraw.Draw(canvas).text((8,6),p.name,fill='black')
                  thumbs.append(canvas)
              cols=4
              rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new('RGB',(cols*380,rows*535),'white')
              for i,im in enumerate(thumbs):
                  sheet.paste(im,((i%cols)*380,(i//cols)*535))
              first=int(batch[0].stem.split('-')[-1])
              last=int(batch[-1].stem.split('-')[-1])
              sheet.save(root/'contact'/f'contact-{first:03d}-{last:03d}.jpg',quality=92)
          PY
          sha256sum "$ROOT"/contact/*.jpg | sort -V > "$ROOT/contact.sha256"

          grep -n -E '太乙|統宗|二十四氣|日出分|求每日日出|差分|半晝|大統|南京|夏至|冬至' "$ROOT/text-layer-p360-440.txt"             > "$ROOT/text-layer-locator-hits.txt" || true

          printf '%s\n'             'SOURCE=續修四庫全書第1061冊'             'SOURCE_SHA256_EXPECTED=618a31924e05cbb8e8c5b49bfc0da2d7c7fb64526c6719175d685088cef29d83'             'TARGET=太乙統宗寶鑒 opening / juan-1 calendrical daily sunrise mechanism'             'LOCATOR_RANGE=PDF pages 365-430 at 200dpi'             'TEXT_LAYER_RANGE=PDF pages 360-440'             'OCR_RUN=false'             'TEXT_LAYER_ROLE=LOCATOR_ONLY_NOT_GLYPH_DATE_OR_NEGATIVE_AUTHORITY'             'FINAL_GLYPH_CLAIMS_REQUIRE_DIRECT_IMAGE_REVIEW=true'             'DATE_FIREWALL=1303 work preface does not date every calendrical layer; Xuxiu copy is only catalogued as Ming manuscript until independently narrowed'             > "$ROOT/manifest.txt"

          rm "$ROOT/1061.pdf"

      - name: Upload Taiyi mechanism locator
        uses: actions/upload-artifact@v4
        with:
          name: xuxiu1061-taiyi-daily-sunrise-mechanism
          path: audit/xuxiu1061-taiyi-daily-sunrise-mechanism
          if-no-files-found: error
          retention-days: 30
