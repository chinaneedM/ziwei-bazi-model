name: verify-batch-12gi-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gi-exact-head.yml
      - docs/research/ZIWEI-DENG-ZHICHENG-DIARY-VOL5-TOYO-BUNKO-FIRST-PARTY-HOLDING-AND-COPY-SERVICE-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-DIARY-VOL5-TOYO-BUNKO-FIRST-PARTY-HOLDING-AND-COPY-SERVICE-BOUNDARY-GI.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GI exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-DENG-ZHICHENG-DIARY-VOL5-TOYO-BUNKO-FIRST-PARTY-HOLDING-AND-COPY-SERVICE-BOUNDARY-GI'
          ep=Path('docs/research/ZIWEI-DENG-ZHICHENG-DIARY-VOL5-TOYO-BUNKO-FIRST-PARTY-HOLDING-AND-COPY-SERVICE-BOUNDARY-R1.json')
          dp=Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-DIARY-VOL5-TOYO-BUNKO-FIRST-PARTY-HOLDING-AND-COPY-SERVICE-BOUNDARY-GI.md')
          assert ep.is_file() and dp.is_file()
          e=json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          h=e['toyo_first_party_holding']
          assert h['bibliography_id']=='1000018751'
          assert h['request_number']=='II/10-D/1059'
          assert h['document_id']=='505909'
          assert h['volume']=='5'
          assert h['material_class_display']=='普通書'
          assert h['exact_volume5_first_party_holding_closed'] is True
          assert h['target_1950_01_29_page_located'] is False
          assert h['target_1950_01_29_page_directly_reviewed'] is False
          assert h['target_handwriting_directly_collated'] is False

          s=e['current_copy_service_control']
          assert s['special_copy_permission_required_for_1971_plus_general_books'] is False
          assert s['preservation_surcharge_required_for_1971_plus_general_books'] is False
          assert s['ordinary_copy_application_still_required'] is True
          assert s['request_submitted'] is False
          assert s['fee_incurred'] is False
          assert s['user_identity_or_contact_data_submitted'] is False

          a=e['access_adjudication']
          assert a['exact_volume5_first_party_physical_route']=='CLOSED_TOYO_BUNKO_DOCUMENT_505909'
          assert a['current_copy_service_route']=='CLOSED_AT_PUBLIC_INSTITUTIONAL_RULE_LEVEL'
          assert a['exact_1950_01_29_facsimile_page']=='UNRESOLVED'
          assert a['target_facsimile_text']=='NOT_REVIEWED'
          assert a['target_handwriting_directly_collated'] is False
          assert a['copy_request_acceptance']=='UNTESTED_NO_REQUEST_SUBMITTED'

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          state_schema_version=tuple(int(part) for part in state['schema_version'].split('.'))
          assert state_schema_version >= (1, 195, 0)
          assert bid in state['historical_audit']['completed_batches']

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          hold=next(x for x in reg['sources'] if x.get('source_id')=='EXT-TOYO-BUNKO-DENG-ZHICHENG-DIARY-2007-V5-505909')
          svc=next(x for x in reg['sources'] if x.get('source_id')=='EXT-TOYO-BUNKO-LIBRARY-COPY-GUIDELINES-2026')
          old=next(x for x in reg['sources'] if x.get('source_id')=='EXT-CINII-DENG-ZHICHENG-DIARY-FACSIMILE-2007')
          assert hold['batch_12gi']['document_id']=='505909'
          assert hold['batch_12gi']['target_page_directly_reviewed'] is False
          assert svc['batch_12gi']['ordinary_copy_application_still_required'] is True
          assert svc['batch_12gi']['target_request_submitted'] is False
          assert old['batch_12gi']['toyo_first_party_holding_closed'] is True
          assert old['batch_12gi']['exact_target_page']=='UNRESOLVED'

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['transmission_impact']['acquisition_edge_authorized'] is False
          assert e['transmission_impact']['same_object_edge_authorized'] is False
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_row_count_change'] is False
          PY
