name: probe-batch-12me-sslibrary-public-search-contract

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12me-sslibrary-public-search-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inventory only SSLibrary source-emitted public search contract without submitting a query
        run: |
          python - <<'PY'
          import hashlib, html, json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import requests

          root="https://www.sslibrary.com/"
          UA={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; SSLibrary public search contract)"}
          s=requests.Session()
          s.headers.update(UA)

          def get(url):
              try:
                  r=s.get(url,timeout=45,allow_redirects=False)
                  return r,None
              except Exception as e:
                  return None,f"{type(e).__name__}: {e}"

          def rec(r,e,url):
              out={"url":url,"fetch_error":e}
              if r is not None:
                  out.update({
                      "status":r.status_code,
                      "location":r.headers.get("location"),
                      "content_type":r.headers.get("content-type"),
                      "server":r.headers.get("server"),
                      "bytes":len(r.content),
                      "sha256":hashlib.sha256(r.content).hexdigest()
                  })
              return out

          def attrs(tag):
              out={}
              for m in re.finditer(r'''(?is)([a-zA-Z_:][-a-zA-Z0-9_:.]*)\s*=\s*(["'])(.*?)\2''',tag):
                  out[m.group(1).lower()]=html.unescape(m.group(3))
              return out

          def anchors(base,text):
              out=[]
              for m in re.finditer(r'''(?is)<a\b([^>]*)>(.*?)</a>''',text):
                  a=attrs(m.group(1))
                  if "href" not in a: continue
                  label=html.unescape(re.sub(r"<[^>]+>"," ",m.group(2)))
                  label=re.sub(r"\s+"," ",label).strip()
                  out.append({"label":label,"href":a["href"],"absolute_href":urljoin(base,a["href"])})
              return out

          def forms(base,text):
              out=[]
              for m in re.finditer(r'''(?is)<form\b([^>]*)>(.*?)</form>''',text):
                  a=attrs(m.group(1)); body=m.group(2)
                  fields=[]
                  for im in re.finditer(r'''(?is)<(?:input|select|textarea)\b([^>]*)>''',body):
                      ia=attrs(im.group(1))
                      fields.append({k:ia.get(k) for k in ("name","type","value","placeholder","id") if ia.get(k) is not None})
                  out.append({
                      "method":(a.get("method") or "GET").upper(),
                      "action":a.get("action"),
                      "absolute_action":urljoin(base,a.get("action") or ""),
                      "id":a.get("id"),
                      "class":a.get("class"),
                      "fields":fields[:100]
                  })
              return out

          def scripts(base,text):
              out=[]
              for m in re.finditer(r'''(?is)<script\b([^>]*)>''',text):
                  a=attrs(m.group(1))
                  if a.get("src"):
                      out.append({"src":a["src"],"absolute_src":urljoin(base,a["src"])})
              return out

          root_r,root_e=get(root)
          root_rec=rec(root_r,root_e,root)
          page_url=None
          page_binding=None

          if root_r is not None:
              if root_r.status_code in (301,302,303,307,308) and root_r.headers.get("location"):
                  candidate=urljoin(root,root_r.headers["location"])
                  if urlparse(candidate).hostname=="www.sslibrary.com":
                      page_url=candidate
                      page_binding={"kind":"http_redirect","absolute_href":candidate}
              elif root_r.status_code==200:
                  text=root_r.content.decode("utf-8","replace")
                  aa=anchors(root_r.url,text)
                  home=[a for a in aa if urlparse(a["absolute_href"]).hostname=="www.sslibrary.com" and urlparse(a["absolute_href"]).path.rstrip("/")=="/dzs"]
                  if home:
                      page_url=home[0]["absolute_href"]
                      page_binding={"kind":"source_emitted_anchor",**home[0]}
                  else:
                      page_url=root_r.url
                      page_binding={"kind":"root_200_self","absolute_href":root_r.url}

          page_r=page_e=None
          page_rec=None
          page_forms=[]; page_scripts=[]; page_anchors=[]
          script_records=[]
          if page_url:
              page_r,page_e=get(page_url)
              page_rec=rec(page_r,page_e,page_url)
              if page_r is not None and page_r.status_code==200:
                  text=page_r.content.decode("utf-8","replace")
                  page_forms=forms(page_r.url,text)
                  page_scripts=scripts(page_r.url,text)
                  page_anchors=anchors(page_r.url,text)
                  same=[]
                  for x in page_scripts:
                      u=x["absolute_src"]
                      if urlparse(u).hostname=="www.sslibrary.com" and u not in same:
                          same.append(u)
                  for u in same[:30]:
                      sr,se=get(u)
                      rr=rec(sr,se,u)
                      if sr is not None and sr.status_code==200:
                          st=sr.content.decode("utf-8","replace")
                          needles=("search","keyword","query","engine2","/dzs","ajax","isbn","book")
                          hits=[]
                          for line in st.splitlines():
                              lo=line.lower()
                              if any(n in lo for n in needles):
                                  hits.append(line.strip()[:1200])
                                  if len(hits)>=100: break
                          rr["contract_hint_lines"]=hits
                      script_records.append(rr)

          out={
              "source_contract":{
                  "parent_batch":"12MD",
                  "root_url":root,
                  "anonymous_get_only":True,
                  "query_submitted":False,
                  "login_attempted":False,
                  "credential_used":False,
                  "captcha_bypass_used":False,
                  "private_endpoint_guessed":False,
                  "only_root_redirect_or_source_emitted_same_host_resources_followed":True
              },
              "root_response":root_rec,
              "public_page_binding":page_binding,
              "public_page_response":page_rec,
              "forms":page_forms,
              "source_emitted_scripts":page_scripts,
              "source_emitted_anchor_sample":page_anchors[:200],
              "same_host_script_responses":script_records,
              "adjudication":{
                  "public_search_contract_inventory_only":True,
                  "target_title_or_isbn_query_submitted":False,
                  "target_book_object_claimed_bound":False,
                  "wenji_p197_direct_page_claimed_reviewed":False,
                  "primary_text_upgrade_authorized":False
              }
          }
          Path("batch-12me-sslibrary-public-search-contract.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8"
          )
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12me-sslibrary-public-search-contract
          path: batch-12me-sslibrary-public-search-contract.json
