name: research-korea-cnts-ziweidoushufangshu-contact-sheets

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-korea-cnts-ziweidoushufangshu-contact-sheets.yml

permissions:
  contents: read

jobs:
  acquire-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire public-domain Commons mirror and render contact sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/pages probe/contact
          URL='https://upload.wikimedia.org/wikipedia/commons/9/98/CNTS-00047996572_%E7%B4%AB%E5%BE%AE%E6%96%97%E6%95%B8%E6%96%B9%E6%9B%B8.pdf'
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          url='https://upload.wikimedia.org/wikipedia/commons/9/98/CNTS-00047996572_%E7%B4%AB%E5%BE%AE%E6%96%97%E6%95%B8%E6%96%B9%E6%9B%B8.pdf'
          out=Path('probe/CNTS-00047996572.pdf')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 provenance-research public-domain-scan'})
          with urllib.request.urlopen(req,timeout=90) as r:
              data=r.read()
          out.write_bytes(data)
          meta={
            'schema':'ZIWEI-KOREA-CNTS-00047996572-PUBLIC-DOMAIN-ACQUISITION-R1',
            'access_date':'2026-09-08',
            'source_url':url,
            'bytes':len(data),
            'sha256':hashlib.sha256(data).hexdigest(),
            'authentication_attempted':False,
            'purchase_attempted':False,
            'identifier_guessing_attempted':False,
            'access_control_bypass_attempted':False,
            'source_identity':'National Digital Library of Korea object CNTS-00047996572 mirrored on Wikimedia Commons as public-domain mechanical scan',
          }
          Path('probe/acquisition.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False))
          PY
          pdfinfo probe/CNTS-00047996572.pdf | tee probe/pdfinfo.txt
          pdftoppm -jpeg -r 72 -jpegopt quality=70 probe/CNTS-00047996572.pdf probe/pages/p >/dev/null 2>&1
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          import math, re, json
          files=sorted(Path('probe/pages').glob('p-*.jpg'),key=lambda p:int(re.search(r'(\d+)$',p.stem).group(1)))
          font=ImageFont.load_default()
          summary=[]
          for batch in range(0,len(files),20):
              chunk=files[batch:batch+20]
              thumbs=[]
              for i,p in enumerate(chunk,batch+1):
                  im=Image.open(p).convert('RGB')
                  im.thumbnail((230,360))
                  tile=Image.new('RGB',(250,390),'white')
                  x=(250-im.width)//2; y=18
                  tile.paste(im,(x,y))
                  d=ImageDraw.Draw(tile); d.text((8,3),f'PDF page {i}',fill='black',font=font)
                  thumbs.append(tile)
              cols=4; rows=math.ceil(len(thumbs)/cols)
              sheet=Image.new('RGB',(cols*250,rows*390),'white')
              for j,t in enumerate(thumbs): sheet.paste(t,((j%cols)*250,(j//cols)*390))
              out=Path('probe/contact')/f'contact-{batch+1:03d}-{batch+len(chunk):03d}.jpg'
              sheet.save(out,quality=82)
              summary.append(str(out))
          Path('probe/contact-sheets.json').write_text(json.dumps({'page_count':len(files),'sheets':summary},indent=2),encoding='utf-8')
          print('rendered pages',len(files),'contact sheets',len(summary))
          PY
          # Keep original PDF for exact page-level follow-up; artifact is public-domain scan.
      - name: Upload CNTS scan and contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-korea-cnts-00047996572-scan-and-contact-sheets
          path: probe/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
