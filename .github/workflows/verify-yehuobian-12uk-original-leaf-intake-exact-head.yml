name: verify-yehuobian-12uk-original-leaf-intake-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12uk-original-leaf-intake-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UK-ORIGINAL-LEAF-INTAKE-QUEUE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UF-SOURCE-READING-CONTROL-AND-IMPRESSION-GATES-R1.json
      - scripts/verify-yehuobian-original-leaf-intake-r1.py
      - tests/test_yehuobian_original_leaf_intake_12uk.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify continuity, genealogy and source registry
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Verify witness intake is not an ancient print vote
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-original-leaf-intake-r1.py
          python -m unittest discover -s tests -p 'test_yehuobian_original_leaf_intake_12uk.py' -v
