name: verify-tianwen-13gq-original-context
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13gq-original-context-panel.py
      - .github/workflows/verify-tianwen-13gq-original-context.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-image inspection dependencies
        run: python -m pip install 'PyMuPDF>=1.24,<1.28' 'Pillow>=10,<12' 'requests>=2.31,<3'
      - name: Reacquire hash-sealed original PDF and inspect source-native context panels
        env:
          TIANWEN_LOG_CONTEXT_B64: "1"
        run: python scripts/acquire-tianwen-13gq-original-context-panel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncl13gq-original-context-panels
          path: ncl-13gq-original-context/
          retention-days: 30
          if-no-files-found: warn
