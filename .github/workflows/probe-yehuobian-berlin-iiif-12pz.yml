name: probe-yehuobian-berlin-iiif-12pz

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-berlin-iiif-12pz.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  berlin-iiif-public-object-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe exact Berlin PPN manifest without OCR, auth, or page enumeration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p berlin-12pz
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error
          base="https://content.staatsbibliothek-berlin.de/dc/"
          routes={
              "manifest":base+"PPN334378186X/manifest",
              "mets":base+"PPN334378186X.mets.xml",
              "reader":"https://digital.staatsbibliothek-berlin.de/werkansicht/?PPN=PPN334378186X",
          }
          result={"recorded_at":"2026-10-10","ppn":"PPN334378186X","source":"Berlin Staatsbibliothek digital SBB record","scope":"READ_ONLY_PUBLIC_METADATA_ONLY; NO_OCR; NO_TARGET_PAGE_CLAIM","requests":[]}
          for label,url in routes.items():
              x={"route":label,"url":url,"http_status":None,"response_content_type":None,"bytes_read":0,"body_complete":False,"manifest_canvases":None,"target_leaf_inspected":False}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Tianwen-Source-Scope-Audit/1.0 (public read-only bibliographic metadata)","Accept":"application/json,application/xml,text/html;q=0.8"})
                  with urllib.request.urlopen(req,timeout=40) as resp:
                      x["http_status"]=resp.status
                      x["response_content_type"]=resp.headers.get("Content-Type")
                      raw=resp.read(4194304+1)
                      x["bytes_read"]=len(raw)
                      x["body_complete"]=len(raw)<=4194304
                      if label=="manifest" and x["body_complete"] and b"json" in (x["response_content_type"] or "").encode():
                          m=json.loads(raw.decode("utf-8"))
                          seq=m.get("sequences",[])
                          x["manifest_canvases"]=len(seq[0].get("canvases",[])) if seq else len(m.get("items",[]))
                          x["manifest_top_label"]=str(m.get("label"))[:200]
              except urllib.error.HTTPError as ex:
                  x["http_status"]=ex.code
                  x["error"]="HTTP_ERROR"
              except Exception as ex:
                  x["error"]=type(ex).__name__+": "+str(ex)[:160]
              result["requests"].append(x)
              print(label,json.dumps(x,ensure_ascii=False))
          p=pathlib.Path("berlin-12pz/public-object-route-summary.json")
          p.write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: berlin-1827-ppn334378186x-public-route-summary-12pz
          path: berlin-12pz/public-object-route-summary.json
          if-no-files-found: error
          retention-days: 30
