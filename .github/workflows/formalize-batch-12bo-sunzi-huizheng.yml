          batch_doc = dedent(f'''\
          # Fusion Chart Historical Provenance Audit R1 — Batch 12BO

          ## 《孫子彙徵》康熙中鈔本「百刻／子時夜半」實體校勘

          Status: **DIRECT QING KANGXI-MANUSCRIPT PHYSICAL COLLATION / PDF P44 / HUNDRED-KE ZI-MIDNIGHT PREVIOUS-CURRENT-DAY RULE CONFIRMED / PHYSICAL GLYPHS READ 「屬昨日／為今日」 / PUBLIC TRANSCRIPTION NORMALIZES SECOND VERB TO 「屬今日」 / DIFFERENT WORDING SAME MECHANICAL RULE / CROSS-DISCIPLINARY TIMEKEEPING WITNESS ONLY / NO UPPER-ZI→HAI REASSIGNMENT / HPA-ZDATE-006 STILL MISSING_FROM_PRODUCT / HAI PHYSICAL VOTE +0 / NO RUNTIME WINNER / NO CANDIDATE COLLAPSE / NO ALGORITHM REOPEN**

          ## 1. Scope

          Batch 12BN strengthened the diagnosis that the Shidian 《筮篋理數日抄》 token `上四亥` is unsafe by obtaining a close physical homolog that reads `上四刻`. The next research question was whether additional physical timekeeping witnesses could clarify the generic upper/lower-Zi semantics without importing cross-system authority.

          This batch closes a separate Qing physical witness in 鄭端《孫子彙徵》. It is deliberately classified as cross-disciplinary timekeeping evidence, not as a Ziwei or Bazi doctrinal lineage vote.

          ## 2. Bibliographic identity

          Wikimedia Commons / 《故宮珍本叢刊》 volume 360 identifies the scanned work as:

          - 《孫子彙徵》八卷;
          - 清 鄭端撰;
          - 康熙中鈔本;
          - provider scan: `{SOURCE_URL}`.

          The combined public PDF contains 389 pages. Direct navigation establishes that 《孫子彙徵》 ends at PDF p281; the target timekeeping passage is in 卷一 and is physically located at PDF p44.

          ## 3. Machine capture

          Exact-head research workflow run: `{workflow_run_id}`.

          - artifact: `{artifact_id}`;
          - artifact digest: `{artifact_digest}`;
          - full provider PDF SHA-256: `{source_pdf_sha256}`;
          - extracted one-page PDF p44 SHA-256: `{target_page_pdf_sha256}`;
          - 300-dpi p44 render SHA-256: `{target_render_sha256}`.

          The workflow preserves source page objects for p43–p45 and renders them at 300 dpi. OCR is not used as glyph authority.

          ## 4. Direct physical reading

          PDF p44 physically carries the transition heading `日百刻配十二時之數天行之固` and the hundred-ke allocation discussion. Direct visual collation of the target sentence reads:

          `{physical_reading}`

          The decisive mechanical semantics are therefore:

          - upper half of Zi is before midnight and belongs to the previous day;
          - lower half is after midnight and is the current day;
          - the passage does **not** reassign the upper half of Zi to the Hai branch.

          ## 5. Philology / transcription control

          The current Shidian public transcription renders the same sentence as:

          `{public_transcription}`

          The direct Kangxi-manuscript physical witness therefore preserves `屬昨日／為今日`, whereas the public transcription regularizes the second relation verb to `屬今日`.

          This is not a mechanical divergence. It is classified as:

          `DIFFERENT_WORDING_SAME_MECHANICAL_RULE`

          The result is especially important because Batch 12AT directly collated the 1578 NCL 《三命通會》 physical witness with the opposite lexical asymmetry `為昨日／屬今日`, while received digital transcriptions commonly normalize both sides to `屬`. The three surfaces demonstrate that `為/屬` must be handled philologically rather than used as a false candidate split.

          Strong phrase-level similarity to 《革象新書》 and 《三命通會·論時刻》 makes historical transmission/source reuse plausible, but this batch does **not** adjudicate textual genealogy or claim direct dependence.

          ## 6. Evidentiary boundary

          《孫子彙徵》 is a Qing military/technical compilation witness. It is not counted as an independent Ziwei or Bazi school vote and cannot authorize an astrological runtime choice.

          In particular:

          - no `亥` branch reassignment occurs in the target physical sentence;
          - generic previous/current-day orientation is corroborated;
          - HPA-ZDATE-006 still requires source-scoped Fullbook mechanical/runtime closure before productization;
          - the exact 1565 Shiqie target physical leaf remains unread, so its online `上四亥` token remains quarantined.

          ## 7. Effect on HPA-ZDATE-006

          - `HPA-ZDATE-006 = MISSING_FROM_PRODUCT`
          - physical Hai-branch witness increment: `0`
          - generic midnight previous/current-day physical corroboration: `+1 cross-disciplinary witness`
          - new chart-rule candidate: `false`
          - runtime winner: `false`
          - candidate collapse: `false`
          - algorithm reopen: `false`

          Matrix counts remain `198 rows / 166 audited / 10 MISSING_FROM_PRODUCT / 14 cumulative missing candidate families`; provenance defects remain `11 confirmed / 11 repaired`; chart algorithm defect/reopen/collapse remain `0/0/0`.

          ## 8. Durable evidence

          Research record: `{RESEARCH_ARTIFACT}`.

          Public transcription comparison only: `{SHIDIAN_URL}`. It is not glyph authority.

          ## 9. Next gate

          Generic midnight previous/current-day semantics are now overdetermined and should not consume priority merely by adding more parallel late witnesses. Higher-value gates remain:

          1. direct acquisition of the exact 《筮篋理數日抄》卷三 target leaf or an independently bound Shiqie facsimile;
          2. an earlier or textually independent physical witness that explicitly states upper/night Zi → Hai if such a rule is historically present;
          3. the separate Fullbook-line cloudy/rainy current-time acquisition chain required before any HPA-ZDATE-006 runtime selection.
          ''')
          Path(BATCH_DOC).write_text(batch_doc, encoding="utf-8")

