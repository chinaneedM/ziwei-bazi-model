          additions = [
              "Batch 12BO directly collates the Qing Kangxi-manuscript 《孫子彙徵》 physical target at PDF p44: 若子時則上半時在夜半前屬昨日下半時在夜半後為今日. The witness confirms generic previous/current-day midnight semantics but does not reassign upper Zi to Hai and is cross-disciplinary timekeeping evidence only, not a Ziwei/Bazi lineage vote.",
              "Batch 12BO exposes a philological normalization boundary: the physical manuscript reads 屬昨日/為今日, Shidian regularizes to 屬昨日/屬今日, while Batch 12AT NCL 1578 《三命通會》 physically preserves 為昨日/屬今日. Treat these as DIFFERENT_WORDING_SAME_MECHANICAL_RULE; do not create false candidates from 為/屬 alternation.",
              "Batch 12BO changes no rule accounting: HPA-ZDATE-006 remains MISSING_FROM_PRODUCT; Hai physical vote increment 0; counts remain 198/166/10/14, provenance defects 11/11, and chart algorithm defect/reopen/collapse remain 0. Priority returns to the exact Shiqie target leaf, any genuinely independent explicit upper/night-Zi→Hai bridge, and the Fullbook cloudy/rain current-time acquisition chain."
          ]
