              "mechanical_scope": "DIRECT_QING_CROSS_DISCIPLINARY_PHYSICAL_CORROBORATION_OF_UPPER_ZI_BEFORE_MIDNIGHT_PREVIOUS_DAY_AND_LOWER_ZI_AFTER_MIDNIGHT_CURRENT_DAY; NO_EXPLICIT_UPPER_ZI_TO_HAI_BRANCH_REASSIGNMENT; NOT_A_ZIWEI_OR_BAZI_LINEAGE_VOTE",
