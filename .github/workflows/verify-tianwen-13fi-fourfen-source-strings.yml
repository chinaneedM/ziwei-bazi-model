name: verify-tianwen-13fi-fourfen-source-strings
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - docs/research/TIANWEN-13FI-GORYEOSA-NIKH-D4D5D6-FOURFEN-PHOTO-STRING-STEPS-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - scripts/verify-tianwen-13fi-fourfen-local-strings.py
      - tests/test_verify_tianwen_13fi_fourfen_local_strings.py
      - .github/workflows/verify-tianwen-13fi-fourfen-source-strings.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeatable-three-day-source-glyphs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-native conditional arithmetic truth table
        run: |
          python -m py_compile scripts/verify-tianwen-13fi-fourfen-local-strings.py tests/test_verify_tianwen_13fi_fourfen_local_strings.py
          python scripts/verify-tianwen-13fi-fourfen-local-strings.py
          python -m unittest discover -s tests -p 'test_verify_tianwen_13fi_fourfen_local_strings.py' -v
