name: probe-tianwen-13jk-snu-gk5553-neighbor-controls
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'scripts/probe-tianwen-13jk-snu-gk5553-neighbor-controls.py'
      - 'tests/test_tianwen_13jk_snu_gk5553_neighborhood.py'
      - '.github/workflows/probe-tianwen-13jk-snu-gk5553-neighbor-controls.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check-neighbor-digital-volumes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest discover -s tests -p 'test_tianwen_13jk_snu_gk5553_neighborhood.py' -v
      - run: python scripts/probe-tianwen-13jk-snu-gk5553-neighbor-controls.py
        env: {TIANWEN_13JK_OUT: /tmp/tianwen-13jk}
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13jk-snu-gk5553-neighbor-source-html
          path: /tmp/tianwen-13jk/
          if-no-files-found: error
