name: research-zhangguo-fudan-bb-opac-title-query

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-zhangguo-fudan-bb-opac-title-query.yml

permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query first-party Fudan ancient-book OPAC
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          import requests

          API = 'https://fdulspgw.fudan.edu.cn/urdh/open-api/opac/search/advanced'
          OUT = Path('docs/research/ZIWEI-ZHANGGUO-FUDAN-OPAC-TITLE-QUERY-R1.json')
          TERMS = [
              '新編評註通玄先生張果星宗大全',
              '新编评注通玄先生张果星宗大全',
              '張果星宗',
              '张果星宗',
          ]
          NEEDLES = ['張果', '张果', '星宗']

          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 provenance-research/1.0',
              'Accept': 'application/json, text/plain, */*',
              'Content-Type': 'application/json;charset=UTF-8',
              'Origin': 'https://opac.fudan.edu.cn',
              'Referer': 'https://opac.fudan.edu.cn/#/resultGj',
          })

          def make_payload(term: str):
              return {
                  'resourceType': '10',
                  'pageSize': 50,
                  'pageNum': 1,
                  'searchConditions': [
                      {
                          'field': 'resource_ztm',
                          'matchType': 'contains',
                          'value': term,
                          'operator': 'AND',
                          'noTransaction': False,
                      }
                  ],
                  'orderByField': 'similarity',
                  'orderByType': 'desc',
              }

          def walk_find_list(obj):
              candidates = []
              def walk(x, path='$'):
                  if isinstance(x, dict):
                      for k, v in x.items():
                          if k in ('list', 'records', 'items', 'model') and isinstance(v, list):
                              candidates.append((path + '.' + k, v))
                          walk(v, path + '.' + str(k))
                  elif isinstance(x, list):
                      for i, v in enumerate(x[:5]):
                          walk(v, f'{path}[{i}]')
              walk(obj)
              candidates.sort(key=lambda kv: len(kv[1]), reverse=True)
              return candidates[0] if candidates else (None, [])

          def find_totals(obj):
              out = []
              def walk(x, path='$'):
                  if isinstance(x, dict):
                      for k, v in x.items():
                          if k.lower() in ('total', 'datacount', 'totalcount', 'count') and isinstance(v, (int, float, str)):
                              out.append({'path': path + '.' + k, 'value': v})
                          walk(v, path + '.' + str(k))
                  elif isinstance(x, list):
                      for i, v in enumerate(x[:5]):
                          walk(v, f'{path}[{i}]')
              walk(obj)
              return out[:20]

          queries = []
          all_matching_records = []
          for term in TERMS:
              payload = make_payload(term)
              q = {'term': term, 'payload': payload}
              try:
                  r = s.post(API, json=payload, timeout=30, allow_redirects=True)
                  raw = r.content
                  q['response'] = {
                      'status': r.status_code,
                      'final_url': r.url,
                      'content_type': r.headers.get('content-type'),
                      'bytes': len(raw),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                  }
                  try:
                      data = r.json()
                      q['json_top_level_type'] = type(data).__name__
                      q['json_top_level_keys'] = list(data.keys())[:50] if isinstance(data, dict) else None
                      q['total_candidates'] = find_totals(data)
                      list_path, records = walk_find_list(data)
                      q['record_list_path'] = list_path
                      q['record_count_on_page'] = len(records)
                      matching = []
                      for rec in records:
                          packed = json.dumps(rec, ensure_ascii=False, sort_keys=True)
                          if any(n in packed for n in NEEDLES):
                              matching.append(rec)
                              all_matching_records.append({'query_term': term, 'record': rec})
                      q['matching_record_count'] = len(matching)
                      q['matching_records'] = matching[:20]
                      if not matching:
                          # Preserve only a tiny response sample for schema debugging, never a bulk unrelated result dump.
                          q['response_shape_sample'] = data if len(raw) <= 12000 else None
                  except Exception as exc:
                      q['json_error'] = repr(exc)
                      q['text_prefix'] = raw[:4000].decode('utf-8', errors='replace')
              except Exception as exc:
                  q['request_error_type'] = type(exc).__name__
                  q['request_error'] = repr(exc)
              queries.append(q)

          # Deduplicate matching records across title variants by stable serialized value.
          seen = set(); unique = []
          for item in all_matching_records:
              key = json.dumps(item['record'], ensure_ascii=False, sort_keys=True)
              if key in seen:
                  continue
              seen.add(key); unique.append(item)

          report = {
              'schema': 'ZIWEI-ZHANGGUO-FUDAN-OPAC-TITLE-QUERY-R1',
              'batch_intent': 'BATCH-12BB-FIRST_PARTY-FUDAN-1594-HOLDING-BINDING',
              'authority_chain': {
                  'ancient_book_portal': 'https://guji.fudan.edu.cn/',
                  'source_emitted_general_catalog_entry': 'https://opac.fudan.edu.cn/#/gjRedirect',
                  'source_emitted_result_route': '/resultGj',
                  'source_emitted_api': API,
                  'resource_type': {'label': '古籍', 'value': '10'},
                  'title_field': {'label': '题名关键词', 'field': 'resource_ztm', 'match_type': 'contains'},
              },
              'policy': {
                  'public_open_api_only': True,
                  'source_emitted_contract_only': True,
                  'authentication_attempted': False,
                  'hidden_id_guessing': False,
                  'negative_holding_claim_authorized_from_zero_match': False,
                  'target_leaf_or_glyph_authority': False,
              },
              'queries': queries,
              'unique_matching_records': unique[:30],
              'adjudication': {
                  'successful_http_200_query_count': sum(1 for q in queries if q.get('response', {}).get('status') == 200),
                  'query_variant_count': len(queries),
                  'unique_target_matching_record_count': len(unique),
                  'first_party_catalog_item_bound': len(unique) > 0,
                  'independent_1594_material_witness_increment': 0,
                  'independent_target_text_witness_increment': 0,
                  'independent_hai_glyph_witness_increment': 0,
                  'note': 'A positive catalog record still requires edition/holding-field adjudication before any 1594 material-witness increment. A zero result means only no match under tested public queries, not no Fudan holding.',
              },
          }
          OUT.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({
              'queries': [
                  {
                      'term': q['term'],
                      'status': q.get('response', {}).get('status'),
                      'content_type': q.get('response', {}).get('content_type'),
                      'record_count_on_page': q.get('record_count_on_page'),
                      'matching_record_count': q.get('matching_record_count'),
                      'total_candidates': q.get('total_candidates'),
                      'error': q.get('request_error') or q.get('json_error'),
                  }
                  for q in queries
              ],
              'unique_matching_record_count': len(unique),
          }, ensure_ascii=False, indent=2))
          PY
      - name: Commit query evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/ZIWEI-ZHANGGUO-FUDAN-OPAC-TITLE-QUERY-R1.json
          git commit -m "record Batch 12BB Fudan OPAC title query"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
