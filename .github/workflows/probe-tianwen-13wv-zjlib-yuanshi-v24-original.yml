name: probe-tianwen-13wv-zjlib-yuanshi-v24-original
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-tianwen-13wv-zjlib-yuanshi-v24-original.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  public-original-v24:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler PDF inspection and rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Acquire publicly indexed Zhejiang Library YuanShi fascicle 24 with byte integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original atlas
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/ZJLib-631aa101504e722bfaf23b12-24_%E5%85%83%E5%8F%B2%E4%BA%8C%E7%99%BE%E5%8D%81%E5%8D%B7%E7%9B%AE%E9%8C%84%E5%8D%81%E5%8D%B7_%E7%AC%AC24%E5%86%8A.pdf'
          echo "SOURCE_INDEX=ZJLib-631aa101504e722bfaf23b12 volume24 / 元史志卷第五、志卷第六"
          curl -fLsS --retry 4 --retry-all-errors --retry-delay 4 --max-time 950 -A 'Tianwen-Historical-Source-Study/1.0' "$url" -o original/v24.pdf
          test "$(head -c 4 original/v24.pdf)" = '%PDF'
          test "$(stat -c%s original/v24.pdf)" -gt 40000000
          sha256sum original/v24.pdf | tee original/pdf-sha256.txt
          sha1sum original/v24.pdf | tee original/pdf-sha1.txt
          pdfinfo original/v24.pdf | tee original/pdfinfo.txt
          pdftotext -layout original/v24.pdf original/pdf-text.txt || true
          grep -n -E '求遲疾差|定差|求迟疾差' original/pdf-text.txt | head -40 > original/text-matches.txt || true
          echo 'MACHINE_TEXT_MATCHES_ARE_NOT_PHYSICAL_GLYPH_AUTHORITY'
          cat original/text-matches.txt
      - name: Prepare bounded no-OCR visual first-pass atlas
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q 'Pillow>=10,<12'
          pages=$(pdfinfo original/v24.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" -gt 40 && test "$pages" -lt 300
          mkdir -p atlas/sheets atlas/thumbs
          pdftoppm -f 1 -l "$pages" -scale-to 420 -jpeg -jpegopt quality=73 original/v24.pdf atlas/thumbs/p >/dev/null 2>&1
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          from PIL import Image, ImageOps, ImageDraw
          out=pathlib.Path('atlas'); files=sorted((out/'thumbs').glob('p-*.jpg'),key=lambda p:int(p.stem.rsplit('-',1)[1]))
          assert files
          manifest={'source':'ZJLib-631aa101504e722bfaf23b12-24','pdf_sha256':pathlib.Path('original/pdf-sha256.txt').read_text().split()[0],
                    'pdf_pages':len(files),'atlas_grade':'BOUNDED_PAGE_OVERVIEW_ONLY_NOT_TARGET_GLYPH','pages':[]}
          width,height,cols,rows=260,375,4,5
          for st in range(0,len(files),20):
              sheet=Image.new('RGB',(width*cols,height*rows),'#eeeeee')
              draw=ImageDraw.Draw(sheet)
              for j,p in enumerate(files[st:st+20]):
                  n=int(p.stem.rsplit('-',1)[1]); im=Image.open(p).convert('RGB')
                  im.thumbnail((245,335))
                  x=(j%cols)*width+(width-im.width)//2
                  y=(j//cols)*height+30
                  sheet.paste(im,(x,y))
                  draw.text(((j%cols)*width+8,(j//cols)*height+5),f'PDF page {n}',fill='#111111')
                  manifest['pages'].append({'pdf_page':n,'thumb_sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
              sheet.save(out/'sheets'/f'atlas-{st//20+1:02d}.jpg',quality=76,optimize=True)
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('SOURCE_PDF_SHA256='+manifest['pdf_sha256'])
          print('SOURCE_PDF_PAGES='+str(manifest['pdf_pages']))
          print('ATLAS_SHEETS='+str((len(files)+19)//20))
          print('OCR_USED=false; PAGE_PRESENCE_DOES_NOT_PROVE_TARGET_GLYPH')
          PY
          sha256sum atlas/sheets/*.jpg > atlas/sheet-sha256.txt
      - name: Emit compact atlas previews for research review
        shell: bash
        run: |
          set -euo pipefail
          for f in atlas/sheets/*.jpg; do
            printf 'TW13WV_ATLAS_START %s\n' "$(basename "$f")"
            base64 -w 3200 "$f"
            printf '\nTW13WV_ATLAS_END\n'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13wv-zjlib-yuanshi-v24-overview-original-hash
          path: |
            original/pdf-sha256.txt
            original/pdf-sha1.txt
            original/pdfinfo.txt
            original/text-matches.txt
            atlas/manifest.json
            atlas/sheet-sha256.txt
            atlas/sheets/
          if-no-files-found: error
          retention-days: 30
