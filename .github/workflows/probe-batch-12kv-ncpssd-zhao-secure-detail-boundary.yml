name: probe-batch-12kv-ncpssd-zhao-secure-detail-boundary

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12kv-ncpssd-zhao-secure-detail-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Follow only the exact source-derived Zhao secure-detail GET without redirects
        run: |
          python - <<'PY'
          import base64, hashlib, html, json, re
          from pathlib import Path
          from urllib.parse import quote, urlencode
          import requests

          BASE="https://www.ncpssd.cn"
          TERM="永樂大典展覽的意義"
          SEARCH='(IKTE="'+TERM+'" OR IKPYTE="'+TERM+'"  OR IKST="'+TERM+'" OR IKET="'+TERM+'" OR IKSE="'+TERM+'")'
          SEARCHNAME='题名/关键词="'+TERM+'"'
          ORDER="synUpdateType|DESC,date|DESC,ik_subject|DESC,id|DESC"

          def jq_quote(v):
              return quote(str(v),safe="~()*!.'").replace("%20","+")
          def b64(s):
              return base64.b64encode(s.encode("utf-8")).decode("ascii")
          def sha(b):
              return hashlib.sha256(b).hexdigest()
          def decode_text(raw):
              for enc in ("utf-8","utf-8-sig","gb18030","gbk","big5"):
                  try: return raw.decode(enc),enc
                  except UnicodeDecodeError: pass
              return raw.decode("utf-8","replace"),"utf-8-replacement"

          # Reproduce the established target result POST solely to recover the current
          # first-party encryptedUrl token. No log/facet/download endpoint is touched.
          fields=[
              ("search",SEARCH),("pageNum","1"),("pageSize","10"),("sort",ORDER),
              ("sType","0"),("ajaxKeys",""),("customShowCondition",SEARCHNAME),
          ]
          body="&".join(jq_quote(k)+"="+jq_quote(v) for k,v in fields)
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; NCPSsd Zhao secure-detail boundary)"})
          rr=s.post(
              BASE+"/searchHandler/search",
              data=body.encode("utf-8"),
              headers={
                  "Content-Type":"application/x-www-form-urlencoded; charset=UTF-8",
                  "X-Requested-With":"XMLHttpRequest",
                  "Referer":BASE+"/Literature/articlelist",
                  "Origin":BASE,
              },
              timeout=45,allow_redirects=False
          )
          parsed=rr.json()
          payload=parsed.get("data") if isinstance(parsed,dict) else None
          rows=payload.get("rows") if isinstance(payload,dict) else []
          if not isinstance(rows,list): rows=[]
          match=None
          for row in rows:
              if isinstance(row,dict) and TERM in str(row.get("title","")) and "趙萬里" in str(row.get("creator","")):
                  match=row; break
          if match is None: raise SystemExit("exact target row missing")
          token=match.get("encryptedUrl")
          if not isinstance(token,str) or not token: raise SystemExit("encryptedUrl missing")

          # Reconstruct the articlelist page URL only from the already closed KM grammar.
          article_params=[
              ("sType","0"),
              ("search",b64(SEARCH)),
              ("searchname",b64(SEARCHNAME)),
              ("nav","0"),("nav","0"),("showBack","true"),
          ]
          page_url=BASE+"/Literature/articlelist?"+urlencode(article_params)
          detail_url=BASE+"/Literature/secure/articleinfo?params="+quote(token,safe="")+"&pageUrl="+quote(page_url,safe="")

          # Boundary probe: no automatic redirect following.
          dr=s.get(detail_url,headers={"Referer":page_url},timeout=45,allow_redirects=False)
          raw=dr.content
          txt,enc=decode_text(raw)
          tokens=[
              "永樂大典展覽的意義","永乐大典展览的意义",
              "趙萬里","赵万里","1951","文物",
              "登录","登錄","login","captcha","验证码","驗證碼"
          ]
          counts={t:len(re.findall(re.escape(t),txt,re.I)) for t in tokens}
          title_match=re.search(r"(?is)<title[^>]*>(.*?)</title>",txt)
          title_text=html.unescape(re.sub(r"<[^>]+>"," ",title_match.group(1))).strip() if title_match else None

          meta=[]
          for m in re.finditer(r"""(?is)<meta\b[^>]*(?:name|property)\s*=\s*["']([^"']+)["'][^>]*content\s*=\s*["']([^"']*)["'][^>]*>""",txt):
              meta.append({"name":html.unescape(m.group(1)),"content":html.unescape(m.group(2))[:1000]})
              if len(meta)>=80: break

          scripts=[]
          for m in re.finditer(r"""(?is)<script\b[^>]*src\s*=\s*["']([^"']+)["']""",txt):
              u=html.unescape(m.group(1))
              if u not in scripts: scripts.append(u)

          out={
              "source_contract":{
                  "parent_batch":"12KU",
                  "target_title_root":TERM,
                  "detail_builder_source":"first-party articlelist.js hrefinfo()",
                  "detail_route":"/Literature/secure/articleinfo",
                  "params_source":"exact target row encryptedUrl",
                  "pageUrl_source":"KM-closed articlelist URL grammar",
                  "automatic_redirect_following":False,
                  "only_result_search_and_one_detail_get_executed":True
              },
              "result_replay":{
                  "http_status":rr.status_code,
                  "bytes":len(rr.content),
                  "sha256":sha(rr.content),
                  "target_total":payload.get("total") if isinstance(payload,dict) else None
              },
              "detail_response":{
                  "http_status":dr.status_code,
                  "content_type":dr.headers.get("content-type",""),
                  "location":dr.headers.get("location"),
                  "bytes":len(raw),
                  "sha256":sha(raw),
                  "decode_used":enc,
                  "title":title_text
              },
              "detail_token_counts":counts,
              "meta_tags":meta,
              "source_emitted_script_srcs":scripts,
              "adjudication":{
                  "detail_request_executed":True,
                  "detail_http_200":dr.status_code==200,
                  "redirect_boundary_observed":300<=dr.status_code<400,
                  "login_or_captcha_token_observed":any(counts[t]>0 for t in ("登录","登錄","login","captcha","验证码","驗證碼")),
                  "target_title_or_author_observed":any(counts[t]>0 for t in ("永樂大典展覽的意義","永乐大典展览的意义","趙萬里","赵万里")),
                  "automatic_redirect_followed":False,
                  "download_or_read_endpoint_executed":False
              },
              "security":{
                  "anonymous_get_only_for_detail":True,
                  "reader_account_used":False,
                  "registration_used":False,
                  "search_log_endpoint_used":False,
                  "facet_endpoint_used":False,
                  "download_read_endpoint_used":False,
                  "private_endpoint_guessed":False,
                  "captcha_bypass_used":False,
                  "tls_verification_disabled":False
              }
          }
          Path("batch-12kv-ncpssd-zhao-secure-detail-boundary.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12kv-ncpssd-zhao-secure-detail-boundary
          path: batch-12kv-ncpssd-zhao-secure-detail-boundary.json
