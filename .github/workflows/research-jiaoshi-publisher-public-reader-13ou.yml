name: research-jiaoshi-publisher-public-reader-13ou

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-jiaoshi-publisher-public-reader-13ou.yml

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install browser driver
        run: python -m pip install --disable-pip-version-check selenium
      - name: Observe source-issued public next-page navigation
        shell: python
        run: |
          import hashlib
          import json
          import time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          out = Path("evidence")
          out.mkdir(exist_ok=True)
          url = "https://m.sejongkorea.org/core/mobile/webzine/view.html?webzineCode=381"
          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1480,1820")
          opts.add_argument("--lang=ko")
          d = webdriver.Chrome(options=opts)
          data = {"source_url": url, "public_unauthenticated_only": True,
                  "no_hidden_api_or_guessed_page_urls": True,
                  "no_bulk_image_download": True, "observations": []}
          try:
              d.set_page_load_timeout(65)
              d.get(url)
              time.sleep(5)
              data["initial_url"] = d.current_url
              data["initial_title"] = d.title
              for page in range(13):
                  state = d.execute_script("""
                    return {
                      title: document.title,
                      body: document.body.innerText.slice(0,2000),
                      images: [...document.images].map(x => ({
                        alt:x.alt, src:x.currentSrc || x.src,
                        width:x.naturalWidth, height:x.naturalHeight
                      })).filter(x => x.width >= 250 || /다음|이전/.test(x.alt)).slice(0,24),
                      clickable: [...document.querySelectorAll('a,button,input')].filter(
                        x => /다음|next|이전|prev/.test((x.textContent||'')+' '+(x.title||'')+' '+(x.alt||''))
                      ).map(x => x.outerHTML.slice(0,600)).slice(0,16)
                    };""")
                  state["step"] = page
                  data["observations"].append(state)
                  if page in (0,1,2,5,10,12):
                      d.save_screenshot(str(out / ("reader-step-%02d.png" % page)))
                  if page == 12:
                      break
                  buttons = d.find_elements(By.XPATH,
                      "//img[contains(@alt,'다음')]|//input[contains(@alt,'다음')]|"
                      "//a[contains(@title,'다음')]|//button[contains(.,'다음')]")
                  if not buttons:
                      data["stop_reason"] = "No source-visible next control detected"
                      break
                  try:
                      buttons[0].click()
                  except Exception:
                      d.execute_script("arguments[0].click();", buttons[0])
                  time.sleep(0.8)
              data["final_url"] = d.current_url
          finally:
              d.quit()
          (out / "public-reader-observation.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({
              "initial_url":data.get("initial_url"),
              "steps":len(data["observations"]),
              "stop_reason":data.get("stop_reason"),
              "samples":[{"step":i["step"], "body":i["body"][:140],
                "large_images":i["images"][:8],"controls":i["clickable"][:3]}
                for i in data["observations"] if i["step"] in (0,1,2,5,10,12)]
              },ensure_ascii=False,indent=2))

      - name: Preserve limited public-viewer observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jiaoshi-2017-publisher-public-reader-13ou
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
