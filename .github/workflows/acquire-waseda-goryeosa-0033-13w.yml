name: acquire-waseda-goryeosa-0033-13w
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - docs/research/TIANWEN-13W-WASEDA-GORYEOSA-BOOK34-WORK53-TO-BOOK33-R1.json
      - scripts/acquire-waseda-goryeosa-0033-13w.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source atlas libraries
        run: python -m pip install 'PyMuPDF>=1.24,<1.28' 'Pillow>=10,<12'
      - name: Obtain bounded firstparty Waseda book0033 PDF and image atlas
        run: python scripts/acquire-waseda-goryeosa-0033-13w.py --output waseda-goryeosa-0033-13w-artifact
      - name: Archive source PDF and sample folio contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: waseda-book0033-original-pdf-and-atlas-13w
          path: waseda-goryeosa-0033-13w-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
