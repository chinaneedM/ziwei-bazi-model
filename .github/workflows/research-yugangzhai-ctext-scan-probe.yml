name: research-yugangzhai-shidian-public-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-yugangzhai-ctext-scan-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public Shidian Yugangzhai payload only
        run: |
          python - <<'PY'
          import hashlib, json, re, urllib.request
          from pathlib import Path

          UA='Mozilla/5.0 ziwei-bazi-model historical-provenance-research/1.1'
          url='https://www.shidianguji.com/zh/book/CADAL02038284/chapter/1l7mkadqnliiy'
          req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=30) as r:
            b=r.read(20_000_000)
            meta={'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('content-type'),'body_len':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          s=b.decode('utf-8','replace')
          snippets={}
          for term in ['夜子時','子之前四刻','CADAL02038284','1l7mkadqnliiy']:
            hits=[]; start=0
            while True:
              i=s.find(term,start)
              if i<0: break
              hits.append(s[max(0,i-2500):min(len(s),i+5000)])
              start=i+len(term)
              if len(hits)>=10: break
            snippets[term]=hits
          # Only record URLs literally present in the delivered HTML; do not infer API endpoints.
          urls=[]
          for m in re.finditer(r'https?(?:\\u002F|/)[^"<> ]{1,1000}',s):
            u=m.group(0).replace('\\u002F','/')
            if any(k in u.lower() for k in ['image','img','scan','cadal','source','reader','chapter']):
              urls.append(u)
          keys=sorted(set(re.findall(r'"([A-Za-z_][A-Za-z0-9_]{1,80}(?:image|img|scan|page|source|chapter)[A-Za-z0-9_]*)"\s*:',s,re.I)))
          out={'schema':'YUGANGZHAI-SHIDIAN-PUBLIC-PAYLOAD-PROBE-R1','url':url,'response':meta,'snippets':snippets,'literal_candidate_urls':urls[:500],'candidate_keys':keys[:500],'policy':'PUBLIC_HTML_PAYLOAD_ONLY; NO LOGIN; NO PRIVATE API GUESSING; NO CREDENTIALS; NO ACCESS BYPASS'}
          Path('yugangzhai-shidian-public-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yugangzhai-shidian-public-probe
          path: yugangzhai-shidian-public-probe.json
          if-no-files-found: error
