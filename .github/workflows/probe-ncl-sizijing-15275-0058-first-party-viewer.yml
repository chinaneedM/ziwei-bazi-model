name: probe-ncl-sizijing-15275-0058-first-party-viewer

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-ncl-sizijing-15275-0058-first-party-viewer.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact first-party Taiwan NCL item and image-view surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/html out/assets
          BASE='https://rbook.ncl.edu.tw/NCLSearch/Search/SearchDetail'
          ITEM='4f498ed65b97408aaf74cfcc1bec50abfDU0NDQ40.ug9YiJNB_UJXAc_XtEgviCIhdiQ0ZG3qjeyuaPAXm5Q_'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          : > out/status.tsv
          for mode in catalog image_s1 image_blank; do
            case "$mode" in
              catalog) QS="item=${ITEM}&page=&SourceID=1&HasImage=" ;;
              image_s1) QS="item=${ITEM}&image=1&page=1&whereString=&sourceWhereString=&SourceID=1&HasImage=" ;;
              image_blank) QS="item=${ITEM}&image=1&page=1&whereString=&sourceWhereString=&SourceID=&HasImage=" ;;
            esac
            url="${BASE}?${QS}"
            code=$(curl -L --fail-with-body --retry 2 -A "$UA" -c out/cookies.txt -b out/cookies.txt \
              -D "out/html/${mode}.headers" -o "out/html/${mode}.html" -w '%{http_code}' "$url" || true)
            printf '%s\t%s\t%s\n' "$mode" "$code" "$url" >> out/status.tsv
          done
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          import json, re

          base='https://rbook.ncl.edu.tw'
          report={}
          assets=set()
          for p in sorted(Path('out/html').glob('*.html')):
              text=p.read_text(encoding='utf-8', errors='replace')
              soup=BeautifulSoup(text,'html.parser')
              refs=[]
              for tag in soup.find_all(True):
                  for attr in ('href','src','action','data-src','data-url'):
                      v=tag.get(attr)
                      if v:
                          u=urljoin(base,v)
                          refs.append({'tag':tag.name,'attr':attr,'value':u})
                          if u.startswith(base) and any(x in u.lower() for x in ('.js','.css')):
                              assets.add(u)
              keywords=[]
              for m in re.finditer(r'.{0,120}(?:影像|image|viewer|media|download|ajax|api|page).{0,180}',text,re.I|re.S):
                  s=' '.join(m.group(0).split())
                  if s not in keywords:
                      keywords.append(s)
                  if len(keywords)>=100:
                      break
              report[p.name]={
                  'bytes':len(text.encode('utf-8')),
                  'title':soup.title.get_text(' ',strip=True) if soup.title else None,
                  'forms':[{'action':urljoin(base,f.get('action','')),'method':f.get('method')} for f in soup.find_all('form')],
                  'refs':refs,
                  'keyword_contexts':keywords,
              }
          Path('out/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/asset-urls.txt').write_text('\n'.join(sorted(assets))+'\n',encoding='utf-8')
          PY
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            name=$(printf '%s' "$url" | sha256sum | cut -c1-16)
            curl -L --retry 2 -A "$UA" -b out/cookies.txt -o "out/assets/${name}.txt" "$url" || true
            printf '%s\t%s\n' "$name" "$url" >> out/asset-map.tsv
          done < out/asset-urls.txt
          grep -RniE '影像|image|viewer|media|download|ajax|api|page|jpg|jpeg|tif|tile' out/assets out/html > out/route-grep.txt || true
          sha256sum out/html/* out/assets/* 2>/dev/null > out/probe-sha256.txt || true
      - name: Upload first-party route probe
        uses: actions/upload-artifact@v4
        with:
          name: ncl-sizijing-15275-0058-first-party-probe
          path: out/
          retention-days: 30