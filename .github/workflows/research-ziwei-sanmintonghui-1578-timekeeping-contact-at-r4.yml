name: research-ziwei-sanmintonghui-1578-timekeeping-contact-at-r4

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-sanmintonghui-1578-timekeeping-contact-at-r4.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Render corrected NCL 1578 juan-2 physical-book contacts at readable scale
        shell: python
        run: |
          import hashlib, io, json, urllib.parse, urllib.request
          from pathlib import Path
          import fitz
          from PIL import Image, ImageDraw

          out=Path('batch12at-r4'); out.mkdir(exist_ok=True)
          title='File:NCL-06589 1 三命通會.pdf'
          api=('https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo'
               '&iiprop=url%7Csize%7Csha1&titles='+urllib.parse.quote(title))
          req=urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              obj=json.loads(r.read().decode('utf-8'))
          page=next(iter(obj.get('query',{}).get('pages',{}).values()))
          info=(page.get('imageinfo') or [None])[0]
          if not info or not info.get('url'): raise SystemExit('No source-emitted NCL PDF URL')
          pdf=out/'sanming-1578-main.pdf'
          req=urllib.request.Request(info['url'],headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=240) as r: pdf.write_bytes(r.read())
          doc=fitz.open(str(pdf))

          # R3 direct contact review maps the second physical book to approximately
          # p101-p188; render the whole bounded object at a larger scale. No OCR.
          first,last=101,188
          pages=[]
          for p1 in range(first,last+1):
              pix=doc[p1-1].get_pixmap(matrix=fitz.Matrix(0.72,0.72),alpha=False)
              im=Image.open(io.BytesIO(pix.tobytes('jpeg'))).convert('RGB')
              pages.append((p1,im))

          sheets=[]; cols=3; rows=2; per=6
          for start in range(0,len(pages),per):
              batch=pages[start:start+per]
              w=max(x[1].width for x in batch); h=max(x[1].height for x in batch)+30
              sh=Image.new('RGB',(cols*w,rows*h),'white')
              d=ImageDraw.Draw(sh)
              for j,(p1,im) in enumerate(batch):
                  x=(j%cols)*w; y=(j//cols)*h
                  d.text((x+5,y+5),f'PDF p{p1}',fill='black')
                  sh.paste(im,(x,y+30))
              lo,hi=batch[0][0],batch[-1][0]
              fn=f'contact-{lo:04d}-{hi:04d}.jpg'; sh.save(out/fn,quality=95)
              sheets.append({'pages':[lo,hi],'file':fn,'sha256':hashlib.sha256((out/fn).read_bytes()).hexdigest()})

          receipt={
            'scope':'BATCH12AT_R4_SANMING_TONGHUI_1578_DIRECT_JUAN2_SECTION_LOCATOR',
            'commons_file_title':title,
            'pdf_sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),
            'page_count':len(doc),
            'physical_book_pages':[first,last],
            'contact_sheets':sheets,
            'target_headings':['論日刻','論時刻'],
            'ocr_generated':False,
            'manual_visual_review_required':True,
            'content_negative_authorized':False,
            'textual_independence_from_tushubian_assumed':False,
            'borrowing_direction_assumed':False,
            'runtime_standard_selected':False,
            'algorithm_reopen_authorized':False
          }
          (out/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n','utf-8')
          pdf.unlink()
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-sanmintonghui-1578-juan2-readable-contact-at-r4
          path: batch12at-r4
          retention-days: 90
