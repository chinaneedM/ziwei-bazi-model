name: probe-batch-12is-ndl-wenwu195109-bound-volume-access

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12is-ndl-wenwu195109-bound-volume-access.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact NDL bound-volume public record and access markers
        run: |
          python - <<'PY'
          import hashlib, html, json, re
          from pathlib import Path
          import requests

          URL="https://ndlsearch.ndl.go.jp/books/R100000002-Ia0000051292-i25241426"
          PARENT="R100000002-Ia0000051292"
          ITEM="R100000002-Ia0000051292-i25241426"
          UA={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; exact NDL bound-volume access metadata)"}

          def clean(raw):
              raw=re.sub(r'<script\b.*?</script>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<style\b.*?</style>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<[^>]+>',' ',raw)
              return re.sub(r'\s+',' ',html.unescape(raw)).strip()

          r=requests.get(URL,timeout=45,headers=UA,allow_redirects=True)
          body=r.content
          raw=body.decode(r.encoding or "utf-8","replace")
          visible=clean(raw)

          terms=[
              "文物参考资料",
              "2(7)-2(12)",
              "1951",
              "Z069.2-B1",
              "デジタルデータなし",
              "インターネットで読める",
              "国立国会図書館内限定",
              "送信サービスで閲覧可能",
              "遠隔複写",
              "東京本館",
              "関西館",
              "資料種別",
              "雑誌",
              PARENT,
              ITEM,
          ]
          contexts={}
          for term in terms:
              pos=[]
              start=0
              while len(pos)<5:
                  i=visible.find(term,start)
                  if i<0: break
                  pos.append(visible[max(0,i-140):min(len(visible),i+len(term)+180)])
                  start=i+len(term)
              contexts[term]=pos

          hrefs=[]
          for m in re.finditer(r'href=["\']([^"\']+)["\']',raw,re.I):
              h=html.unescape(m.group(1))
              if any(k in h for k in ("Ia0000051292","dl.ndl.go.jp","pid/","copy","request","digital")):
                  hrefs.append(h)
          out={
              "requested_url":URL,
              "status":r.status_code,
              "final_url":r.url,
              "content_type":r.headers.get("Content-Type"),
              "bytes":len(body),
              "sha256":hashlib.sha256(body).hexdigest(),
              "visible_char_count":len(visible),
              "term_flags":{t:(t in visible) for t in terms},
              "contexts":contexts,
              "selected_hrefs":sorted(set(hrefs))[:100],
              "has_dl_ndl_link":"dl.ndl.go.jp" in raw,
              "has_pid_link":"/pid/" in raw,
              "has_parent_record_reference":PARENT in raw or PARENT in visible,
              "has_exact_item_reference":ITEM in raw or ITEM in visible,
              "raw_html_saved":False,
              "raw_html_logged":False,
              "login_used":False,
              "account_action_used":False,
              "copy_request_used":False,
              "payment_used":False,
              "captcha_bypass_used":False,
              "tls_verification_disabled":False
          }
          Path("ndl-wenwu195109-bound-volume-access.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12is-ndl-wenwu195109-bound-volume-access
          path: ndl-wenwu195109-bound-volume-access.json
