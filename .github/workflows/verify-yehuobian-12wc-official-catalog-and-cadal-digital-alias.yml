name: verify-yehuobian-12wc-official-catalog-and-cadal-digital-alias
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12wc-official-catalog-and-cadal-digital-alias.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-SOURCE-REGISTRY-EXTENSIONS-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12WC-*
      - scripts/verify-yehuobian-wenzhou-cadal-series-12wc.py
      - scripts/probe-yehuobian-cadal-duplicate-alias-12wc.py
      - tests/test_yehuobian_cadal_catalog_12wc.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Forward-only catalogue/registry/dedup scope verification
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-wenzhou-cadal-series-12wc.py
          python -m unittest discover -s tests -p 'test_yehuobian_cadal_catalog_12wc.py' -v
  capture:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public DjVu reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install pillow
      - name: Retrieve Commons-issued old/new source bytes and compare scoped page pixels (no OCR)
        run: python scripts/probe-yehuobian-cadal-duplicate-alias-12wc.py --output-dir cadal-alias-12wc-output
      - name: Archive original source objects and atlas or access error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadal-original-alias-comparison-12wc
          path: cadal-alias-12wc-output/
          if-no-files-found: warn
