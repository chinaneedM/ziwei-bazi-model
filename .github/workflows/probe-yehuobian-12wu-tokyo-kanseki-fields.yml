name: probe-yehuobian-12wu-tokyo-kanseki-fields
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-yehuobian-12wu-tokyo-kanseki-fields.yml
      - scripts/probe-yehuobian-12wu-tokyo-kanseki-official-fields.py
      - tests/test_yehuobian_12wu_tokyo_kanseki_official_fields.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict first-party docs and two independent image fields
        run: python -m unittest discover -s tests -p 'test_yehuobian_12wu_tokyo_kanseki_official_fields.py' -v
  capture:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-bound 2007 catalogue/field descriptions only
        run: python scripts/probe-yehuobian-12wu-tokyo-kanseki-official-fields.py --output-dir 12wu-tokyo-kanseki-fields-output
      - name: Archive original official documentation or access boundary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 12wu-tokyo-kanseki-exact-linked-field-docs
          path: 12wu-tokyo-kanseki-fields-output/
          retention-days: 30
          if-no-files-found: warn
