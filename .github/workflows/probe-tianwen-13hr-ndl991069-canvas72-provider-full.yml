      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/probe-tianwen-13hr-ndl991069-canvas72-full.py
      - tests/test_tianwen_13hr_ndl991069_canvas72_full.py
      - .github/workflows/probe-tianwen-13hr-ndl991069-canvas72-provider-full.yml
  workflow_dispatch:
permissions:
