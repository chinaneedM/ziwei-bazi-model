        run: python -m unittest discover -s tests -p 'test_tianwen_13hr_ndl991069_canvas72_full.py' -v
      - name: Acquire source-issued full image without text or numeric adjudication
        run: python scripts/probe-tianwen-13hr-ndl991069-canvas72-full.py
      - name: Preserve original JPEG source bytes and hash-bound report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13hr-ndl991069-canvas72-full
          path: artifacts/13hr-ndl991069-canvas72-provider-full/**
          if-no-files-found: error
