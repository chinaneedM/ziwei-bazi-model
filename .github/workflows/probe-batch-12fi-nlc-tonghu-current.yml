name: probe-batch-12fi-nlc-tonghu-current

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - '.github/workflows/probe-batch-12fi-nlc-tonghu-current.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Probe current NLC Tonghu record with browser-native request semantics
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/batch-12fi-nlc-tonghu-current'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/raw" "$ROOT/detail"
          UA='Tianwen-Provenance-Audit/1.0'

          cat > "$ROOT/queries.tsv" <<'EOF'
          tit-simp-exact	铜壶漏箭制度	TIT	true
          tit-trad-exact	銅壺漏箭制度	TIT	true
          tit-simp-loose	铜壶漏箭制度	TIT	false
          tit-trad-loose	銅壺漏箭制度	TIT	false
          tit-simp-short	铜壶漏箭	TIT	false
          tit-trad-short	銅壺漏箭	TIT	false
          any-simp	铜壶漏箭制度	ANY	false
          any-trad	銅壺漏箭制度	ANY	false
          any-03482	03482	ANY	false
          any-3482	3482	ANY	false
          EOF

          : > "$ROOT/status.tsv"
          while IFS=$'\t' read -r key q way exact; do
            body=$(Q="$q" WAY="$way" EXACT="$exact" python - <<'PY'
          import json,os
          q=os.environ['Q']; way=os.environ['WAY']; exact=os.environ['EXACT'].lower()=='true'
          print(json.dumps({
            "q":q,
            "searchWay":way,
            "page_num":"1",
            "query":q if way=="ANY" else way+"="+q,
            "sort":[{"_score":"DESC"}],
            "size":50,
            "facetVal":[],
            "exactMatch":exact
          },ensure_ascii=False,separators=(',',':')))
          PY
            )
            out="$ROOT/raw/$key.json"
            set +e
            code=$(curl -L -sS --connect-timeout 8 --max-time 35 \
              -A "$UA" \
              -H 'Accept: application/json, text/javascript, */*; q=0.01' \
              -H 'X-Requested-With: XMLHttpRequest' \
              -H 'Referer: https://meta.nlc.cn/v2/search?q=%E9%93%9C%E5%A3%B6%E6%BC%8F%E7%AE%AD%E5%88%B6%E5%BA%A6&searchWay=TIT' \
              -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' \
              --data-binary "$body" \
              -o "$out" -w '%{http_code}' \
              'https://meta.nlc.cn/v2/doSearch?hight=false')
            rc=$?
            set -e
            size=0; [ -f "$out" ] && size=$(wc -c < "$out")
            printf '%s\trc=%s\thttp=%s\tbytes=%s\tq=%s\tway=%s\texact=%s\n' "$key" "$rc" "$code" "$size" "$q" "$way" "$exact" >> "$ROOT/status.tsv"
          done < "$ROOT/queries.tsv"

          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('audit/batch-12fi-nlc-tonghu-current')
          summary=[]; candidates={}
          target_title=re.compile(r'[銅铜].*壺|[銅铜]壺')
          target_terms=('铜壶漏箭','銅壺漏箭','漏箭制度')
          for p in sorted((root/'raw').glob('*.json')):
              summary.append('### '+p.name)
              try:
                  obj=json.loads(p.read_text('utf-8'))
              except Exception as e:
                  summary.append('PARSE_ERROR '+repr(e)); continue
              summary.append('status='+repr(obj.get('status'))+' total='+repr(obj.get('total'))+' message='+repr(obj.get('message')))
              rows=obj.get('result') or []
              for i,row in enumerate(rows,1):
                  src=row.get('_source') or {}
                  titles=src.get('TIT') or []
                  if isinstance(titles,str): titles=[titles]
                  text=' | '.join(map(str,titles))
                  is_target=any(t in text for t in target_terms)
                  if is_target:
                      uid=src.get('UID') or row.get('_id')
                      if uid: candidates[str(uid)]={"row":row,"query_file":p.name}
                      summary.append('TARGET_ROW '+str(i)+' '+json.dumps(row,ensure_ascii=False,separators=(',',':')))
                  elif i<=5:
                      summary.append('TOP_ROW '+str(i)+' '+json.dumps(row,ensure_ascii=False,separators=(',',':')))
          root.joinpath('summary.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          root.joinpath('candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          root.joinpath('candidate-uids.txt').write_text('\n'.join(candidates)+'\n',encoding='utf-8')
          PY

          : > "$ROOT/detail-status.tsv"
          while IFS= read -r uid; do
            [ -z "$uid" ] && continue
            out="$ROOT/detail/$uid.json"
            set +e
            code=$(curl -L -sS --connect-timeout 8 --max-time 35 \
              -A "$UA" \
              -H 'Accept: application/json, text/javascript, */*; q=0.01' \
              -H 'X-Requested-With: XMLHttpRequest' \
              -H "Referer: https://meta.nlc.cn/v2/detail/$uid" \
              -X POST -o "$out" -w '%{http_code}' \
              "https://meta.nlc.cn/api/v1/item/$uid/1/999")
            rc=$?
            set -e
            size=0; [ -f "$out" ] && size=$(wc -c < "$out")
            printf '%s\trc=%s\thttp=%s\tbytes=%s\n' "$uid" "$rc" "$code" "$size" >> "$ROOT/detail-status.tsv"
          done < "$ROOT/candidate-uids.txt"

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('audit/batch-12fi-nlc-tonghu-current')
          out=[]
          for p in sorted((root/'detail').glob('*.json')):
              out.append('### '+p.name)
              try: obj=json.loads(p.read_text('utf-8'))
              except Exception as e: out.append('PARSE_ERROR '+repr(e)); continue
              res=obj.get('result') or {}
              bib=res.get('biblio') or {}
              es=res.get('esBook') or {}
              keys=['200a','200b','200f','205a','210c','210d','215a','316a','3165','423a','4231','455a','4551','852a','905a','905q','905s','910n','910l','035a','049b','049c','001']
              out.append('ESBOOK '+json.dumps({k:es.get(k) for k in ('SYS','UID','WDT','YEA','PUB','PAG','TIT','AUT','holdings')},ensure_ascii=False,separators=(',',':')))
              out.append('BIBLIO '+json.dumps({k:bib.get(k) for k in keys if k in bib},ensure_ascii=False,separators=(',',':')))
              out.append('HOLDING '+json.dumps(res.get('holding'),ensure_ascii=False,separators=(',',':')))
          root.joinpath('detail-summary.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

          find "$ROOT" -type f -size +0c -print0 | xargs -0 -r sha256sum | sort -V > "$ROOT/all-files.sha256"
          printf '%s\n' \
            'SOURCE=National Library of China current meta.nlc.cn browser-native /v2/doSearch semantics plus item detail API' \
            'PURPOSE=locate current 铜壶漏箭制度 record and test whether current local holdings locator carries NLC:SBYL:03482' \
            'REQUEST_SEMANTICS=JSON string body with jQuery-default application/x-www-form-urlencoded content type, matching current frontend doSearch()' \
            'TARGET_FILTER=returned row title must visibly contain 铜/銅壶漏箭; unrelated fuzzy rows have zero target authority' \
            'IDENTIFIER_FIREWALL=historical 3482 != current SYS/UID != local call-number component != barcode != acquisition/donation number unless explicitly field-bound' \
            'NEGATIVE_POLICY=zero result or timeout is a bounded current-index/access observation only' \
            'OCR_USED=false' > "$ROOT/manifest.txt"

      - name: Upload Tonghu current-record evidence
        uses: actions/upload-artifact@v4
        with:
          name: batch-12fi-nlc-tonghu-current-probe
          path: audit/batch-12fi-nlc-tonghu-current/
          if-no-files-found: error
          retention-days: 30
