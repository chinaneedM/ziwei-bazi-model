name: probe-batch-12ir-zhao-wanli-wenji-public-preview

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12ir-zhao-wanli-wenji-public-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Locate exact Zhao Wanli Wenji vol.1 from source-emitted NLC Press list
        run: |
          python - <<'PY'
          import hashlib, html, json, re, time
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          LIST_URL="https://www.nlcpress.com/ProductList.aspx"
          ISBN="9787501346653"
          SERIES="赵万里文集"
          EXACT_HINTS=("第一卷","第1卷","第一冊","第1冊")
          START_PAGE=302
          END_PAGE=370
          UA="Mozilla/5.0 (Tianwen provenance audit; exact Zhao Wanli Wenji vol1 publisher discovery)"

          class HiddenParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.fields={}
              def handle_starttag(self,tag,attrs):
                  if tag.lower()!="input":
                      return
                  d={str(k):("" if v is None else str(v)) for k,v in attrs}
                  if d.get("type","").lower()=="hidden" and d.get("name"):
                      self.fields[d["name"]]=d.get("value","")

          def hidden_fields(body):
              p=HiddenParser(); p.feed(body); return p.fields

          def clean(raw):
              raw=re.sub(r'<script\b.*?</script>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<style\b.*?</style>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<[^>]+>',' ',raw)
              return re.sub(r'\s+',' ',html.unescape(raw)).strip()

          def links(raw):
              out=[]
              for m in re.finditer(r'<a\b[^>]*href=["\'](ProductView\.aspx\?Id=\d+)["\'][^>]*>(.*?)</a>',raw,re.I|re.S):
                  out.append({"href":html.unescape(m.group(1)),"text":clean(m.group(2))})
              return out

          def page_now(raw):
              m=re.search(r'id=["\']PageNavigator1_txt_PageNow["\'][^>]*>(\d+)<',raw,re.I)
              return int(m.group(1)) if m else None

          s=requests.Session()
          s.headers.update({"User-Agent":UA})
          g=s.get(LIST_URL,timeout=45); g.raise_for_status()
          current=g.text
          samples={}
          series_hits=[]
          target=None

          for page in range(START_PAGE,END_PAGE+1):
              form=hidden_fields(current)
              form.update({
                  "__EVENTTARGET":"PageNavigator1$LinkButton_Go",
                  "__EVENTARGUMENT":"",
                  "PageNavigator1$txt_PageGo":str(page),
              })
              r=s.post(LIST_URL,data=form,timeout=45); r.raise_for_status()
              current=r.text
              text=clean(current)
              ds=re.findall(r'出版时间[:：]?\s*(20\d{2}-\d{2}-\d{2})',text)
              if page in (302,310,320,330,340,350,360,370):
                  samples[str(page)]={"page_now":page_now(current),"dates":ds[:12]}
              for item in links(current):
                  if SERIES in item["text"]:
                      rec={"page":page,**item}
                      if rec not in series_hits:
                          series_hits.append(rec)
                      if any(h in item["text"] for h in EXACT_HINTS):
                          target=rec
              if target:
                  break
              time.sleep(0.08)

          detail=None
          if target:
              url=urljoin(LIST_URL,target["href"])
              r=s.get(url,timeout=45); r.raise_for_status()
              raw=r.text; vis=clean(raw)
              norm=re.sub(r'[-\s]','',vis)
              anchors=[]
              for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',raw,re.I|re.S):
                  attrs=html.unescape(m.group(1)); label=clean(m.group(2))
                  if any(k in label for k in ("图书文件下载","目录附件下载","电子书下载")):
                      hm=re.search(r'href\s*=\s*["\']([^"\']*)["\']',attrs,re.I)
                      anchors.append({"label":label,"href":html.unescape(hm.group(1)) if hm else None})
              detail={
                  "source_emitted_href":target["href"],
                  "source_list_page":target["page"],
                  "title_link_text":target["text"],
                  "url":url,
                  "status":r.status_code,
                  "body_sha256":hashlib.sha256(r.content).hexdigest(),
                  "has_series_title":SERIES in vis,
                  "has_target_isbn":ISBN in norm,
                  "has_first_volume_marker":any(h in vis for h in EXACT_HINTS),
                  "has_p197_literal":bool(re.search(r'(?<!\d)197(?!\d)',vis)),
                  "has_yongle_article":"永乐大典" in vis and ("展览" in vis or "展覽" in vis),
                  "download_anchors":anchors,
                  "catalog_anchor_has_href":any(a["label"].startswith("目录附件下载") and a.get("href") for a in anchors),
                  "booktext_postback_present":"__doPostBack('Booktext','')" in raw,
              }

          out={
              "list_url":LIST_URL,
              "page_range":[START_PAGE,END_PAGE],
              "sampled_dates":samples,
              "series_hits":series_hits,
              "exact_first_volume_target":target,
              "detail":detail,
              "target_isbn":ISBN,
              "product_id_guessing_used":False,
              "only_source_emitted_product_links_followed":True,
              "login_used":False,
              "purchase_used":False,
              "payment_used":False,
              "captcha_bypass_used":False,
              "tls_verification_disabled":False,
          }
          Path("zhao-wanli-wenji-vol1-nlcpress-discovery.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ir-zhao-wanli-wenji-vol1-nlcpress-discovery
          path: zhao-wanli-wenji-vol1-nlcpress-discovery.json

      - name: Inspect Open Library exact edition/work/preview metadata
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import requests

          ISBN="9787501346653"
          UA={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; Open Library exact-edition preview control)"}
          urls={
              "isbn":f"https://openlibrary.org/isbn/{ISBN}.json",
              "search":f"https://openlibrary.org/search.json?isbn={ISBN}",
              "books_api":f"https://openlibrary.org/api/books?bibkeys=ISBN:{ISBN}&jscmd=data&format=json",
          }

          out={}
          parsed={}
          for key,url in urls.items():
              r=requests.get(url,timeout=45,headers=UA)
              body=r.content
              row={
                  "url":url,
                  "status":r.status_code,
                  "content_type":r.headers.get("Content-Type"),
                  "bytes":len(body),
                  "sha256":hashlib.sha256(body).hexdigest(),
                  "json_parsed":False,
                  "raw_body_saved":False,
                  "raw_body_logged":False,
              }
              try:
                  data=r.json(); parsed[key]=data; row["json_parsed"]=True
                  if key=="isbn" and isinstance(data,dict):
                      row.update({
                          "key":data.get("key"),
                          "title":data.get("title"),
                          "subtitle":data.get("subtitle"),
                          "pagination":data.get("pagination"),
                          "publish_date":data.get("publish_date"),
                          "publishers":data.get("publishers"),
                          "edition_name":data.get("edition_name"),
                          "isbn_13":data.get("isbn_13"),
                          "oclc_numbers":data.get("oclc_numbers"),
                          "lccn":data.get("lccn"),
                          "source_records":data.get("source_records"),
                          "works":data.get("works"),
                          "ocaid":data.get("ocaid"),
                          "covers":data.get("covers"),
                      })
                  elif key=="search":
                      row["numFound"]=data.get("numFound") if isinstance(data,dict) else None
                      row["docs"]=[
                          {
                              "key":x.get("key"),
                              "title":x.get("title"),
                              "edition_key":x.get("edition_key"),
                              "isbn":x.get("isbn"),
                              "publish_year":x.get("publish_year"),
                          } for x in (data.get("docs",[])[:5] if isinstance(data,dict) else [])
                      ]
                  elif key=="books_api" and isinstance(data,dict):
                      rec=data.get(f"ISBN:{ISBN}")
                      row["record_present"]=isinstance(rec,dict)
                      if isinstance(rec,dict):
                          row.update({
                              "title":rec.get("title"),
                              "publish_date":rec.get("publish_date"),
                              "publishers":rec.get("publishers"),
                              "number_of_pages":rec.get("number_of_pages"),
                              "preview":rec.get("preview"),
                              "preview_url":rec.get("preview_url"),
                              "info_url":rec.get("info_url"),
                              "thumbnail_url":rec.get("thumbnail_url"),
                              "ebooks":rec.get("ebooks"),
                          })
              except Exception as e:
                  row["json_error"]=f"{type(e).__name__}: {e}"
              out[key]=row

          work_key=None
          isbn_data=parsed.get("isbn")
          if isinstance(isbn_data,dict):
              works=isbn_data.get("works") or []
              if works and isinstance(works[0],dict):
                  work_key=works[0].get("key")
          if not work_key:
              s=parsed.get("search")
              docs=s.get("docs",[]) if isinstance(s,dict) else []
              if docs:
                  work_key=docs[0].get("key")

          if work_key:
              for key,url in {
                  "work":f"https://openlibrary.org{work_key}.json",
                  "editions":f"https://openlibrary.org{work_key}/editions.json?limit=50",
              }.items():
                  r=requests.get(url,timeout=45,headers=UA); body=r.content
                  row={
                      "url":url,"status":r.status_code,"content_type":r.headers.get("Content-Type"),
                      "bytes":len(body),"sha256":hashlib.sha256(body).hexdigest(),
                      "json_parsed":False,"raw_body_saved":False,"raw_body_logged":False,
                  }
                  try:
                      data=r.json(); row["json_parsed"]=True
                      if key=="work" and isinstance(data,dict):
                          row.update({
                              "key":data.get("key"),"title":data.get("title"),
                              "covers":data.get("covers"),"subjects":data.get("subjects"),
                              "description_present":bool(data.get("description")),
                          })
                      elif key=="editions" and isinstance(data,dict):
                          row["size"]=data.get("size")
                          row["entries"]=[
                              {
                                  "key":e.get("key"),"title":e.get("title"),
                                  "publish_date":e.get("publish_date"),
                                  "pagination":e.get("pagination"),
                                  "isbn_13":e.get("isbn_13"),
                                  "ocaid":e.get("ocaid"),
                                  "covers":e.get("covers"),
                                  "source_records":e.get("source_records"),
                              } for e in data.get("entries",[])[:50]
                          ]
                  except Exception as e:
                      row["json_error"]=f"{type(e).__name__}: {e}"
                  out[key]=row

          out["work_key"]=work_key
          Path("zhao-wanli-wenji-openlibrary-preview-control.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ir-zhao-wanli-wenji-openlibrary-preview-control
          path: zhao-wanli-wenji-openlibrary-preview-control.json
