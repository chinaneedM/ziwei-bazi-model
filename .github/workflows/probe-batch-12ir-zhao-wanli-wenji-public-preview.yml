name: probe-batch-12ir-zhao-wanli-wenji-public-preview

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12ir-zhao-wanli-wenji-public-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact NLC Press Product 5325 Booktext/Catalog attachment boundary
        run: |
          python - <<'PY'
          import hashlib, html, json, re
          from html.parser import HTMLParser
          from pathlib import Path
          import requests

          URL="https://www.nlcpress.com/ProductView.aspx?Id=5325"
          TITLE="赵万里文集·第一卷"
          ISBN="9787501346653"
          UA="Mozilla/5.0 (Tianwen provenance audit; exact Zhao Wanli Wenji vol1 Booktext boundary)"
          MAX_BYTES=4096

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.hidden={}
                  self.anchors=[]
              def handle_starttag(self,tag,attrs):
                  d={str(k):("" if v is None else str(v)) for k,v in attrs}
                  if tag.lower()=="input" and d.get("type","").lower()=="hidden" and d.get("name"):
                      self.hidden[d["name"]]=d.get("value","")
                  if tag.lower()=="a":
                      self.anchors.append(d)

          def clean(raw):
              raw=re.sub(r'<script\b.*?</script>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<style\b.*?</style>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<[^>]+>',' ',raw)
              return re.sub(r'\s+',' ',html.unescape(raw)).strip()

          s=requests.Session(); s.headers.update({"User-Agent":UA})
          g=s.get(URL,timeout=45); g.raise_for_status()
          raw=g.text; vis=clean(raw); norm=re.sub(r'[-\s]','',vis)
          p=Parser(); p.feed(raw)

          # Source-emitted controls by id, parsed with HTMLParser so nested quotes in javascript href are preserved.
          book_anchor=next((a for a in p.anchors if a.get("id")=="Booktext"),None)
          cat_anchor=next((a for a in p.anchors if a.get("id")=="CatalogPrecisFile"),None)

          result={
              "product_url":URL,
              "get_status":g.status_code,
              "get_body_sha256":hashlib.sha256(g.content).hexdigest(),
              "target_title_present":TITLE in vis or "赵万里文集" in vis,
              "target_isbn_present":ISBN in norm,
              "p197_literal_present":bool(re.search(r'(?<!\d)197(?!\d)',vis)),
              "yongle_article_term_present":"永乐大典" in vis and ("展览" in vis or "展覽" in vis),
              "booktext_anchor":book_anchor,
              "catalog_anchor":cat_anchor,
              "booktext_source_emitted":bool(book_anchor and "Booktext" in (book_anchor.get("href") or "")),
              "catalog_href":cat_anchor.get("href") if cat_anchor else None,
              "postback":None,
              "raw_product_html_saved":False,
              "raw_product_html_logged":False,
          }

          if result["booktext_source_emitted"]:
              form=dict(p.hidden)
              form.update({"__EVENTTARGET":"Booktext","__EVENTARGUMENT":""})
              r=s.post(URL,data=form,timeout=45,stream=True,allow_redirects=False,
                       headers={"User-Agent":UA,"Referer":URL})
              clen=None
              try: clen=int(r.headers.get("Content-Length",""))
              except Exception: pass
              row={
                  "status":r.status_code,
                  "reason":r.reason,
                  "content_type":r.headers.get("Content-Type"),
                  "content_length":clen,
                  "content_disposition":r.headers.get("Content-Disposition"),
                  "is_redirect":bool(r.is_redirect or r.is_permanent_redirect),
                  "bounded_read_performed":False,
                  "bytes_read":0,
                  "body_sha256":None,
                  "decoded_encoding":None,
                  "decoded_char_count":None,
                  "p197_literal":False,
                  "yongle_article_term":False,
                  "qu_donation_terms":False,
                  "raw_text_logged":False,
                  "raw_text_saved":False,
              }
              if clen is not None and clen<=MAX_BYTES:
                  chunks=[]; total=0
                  for chunk in r.iter_content(1024):
                      if not chunk: continue
                      total+=len(chunk)
                      if total>MAX_BYTES:
                          raise RuntimeError("bounded payload exceeded 4 KiB")
                      chunks.append(chunk)
                  body=b"".join(chunks)
                  row["bounded_read_performed"]=True
                  row["bytes_read"]=len(body)
                  row["body_sha256"]=hashlib.sha256(body).hexdigest()
                  txt=""
                  for enc in ("utf-8","gb18030","gbk"):
                      try:
                          txt=body.decode(enc); row["decoded_encoding"]=enc; break
                      except Exception: pass
                  if not txt:
                      txt=body.decode("utf-8","replace"); row["decoded_encoding"]="utf-8-replacement"
                  normtxt=re.sub(r'\s+',' ',txt)
                  row["decoded_char_count"]=len(normtxt)
                  row["p197_literal"]=bool(re.search(r'(?<!\d)197(?!\d)',normtxt))
                  row["yongle_article_term"]="永乐大典" in normtxt and ("展览" in normtxt or "展覽" in normtxt)
                  row["qu_donation_terms"]=all(x in normtxt for x in ("瞿","捐","六十二"))
              r.close()
              result["postback"]=row

          Path("zhao-wanli-wenji-vol1-product5325-boundary.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ir-zhao-wanli-wenji-vol1-product5325-boundary
          path: zhao-wanli-wenji-vol1-product5325-boundary.json


      - name: Inspect NLC Press public ebook resource list Rid 3
        run: |
          python - <<'PY'
          import hashlib, html, json, re
          from pathlib import Path
          import requests

          URL="https://www.nlcpress.com/DownLoadList.aspx?Rid=3"
          TITLE="赵万里文集"
          ISBN="9787501346653"
          UA={"User-Agent":"Mozilla/5.0 (Tianwen provenance audit; public ebook resource-list inspection)"}

          def clean(raw):
              raw=re.sub(r'<script\b.*?</script>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<style\b.*?</style>',' ',raw,flags=re.I|re.S)
              raw=re.sub(r'<[^>]+>',' ',raw)
              return re.sub(r'\s+',' ',html.unescape(raw)).strip()

          r=requests.get(URL,timeout=45,headers=UA)
          r.raise_for_status()
          raw=r.text
          visible=clean(raw)
          anchors=[]
          for m in re.finditer(r'<a\b([^>]*)>(.*?)</a>',raw,re.I|re.S):
              attrs=html.unescape(m.group(1))
              txt=clean(m.group(2))
              hm=re.search(r'href\s*=\s*["\']([^"\']*)["\']',attrs,re.I)
              href=html.unescape(hm.group(1)) if hm else None
              if txt or href:
                  anchors.append({"text":txt[:500],"href":href})
          target=[a for a in anchors if TITLE in a["text"] or ISBN in a["text"].replace("-","").replace(" ","")]
          page_count=None
          m=re.search(r'(?:总页数|共)\s*[:：]?\s*(\d+)\s*页',visible)
          if m: page_count=int(m.group(1))
          out={
              "url":URL,
              "status":r.status_code,
              "body_bytes":len(r.content),
              "body_sha256":hashlib.sha256(r.content).hexdigest(),
              "page_count_text":page_count,
              "target_title_present":TITLE in visible,
              "target_isbn_present":ISBN in visible.replace("-","").replace(" ",""),
              "target_anchors":target[:30],
              "downloadview_hrefs":sorted(set(
                  a["href"] for a in anchors if a.get("href") and "DownloadView.aspx" in a["href"]
              ))[:200],
              "downloadview_count":len(set(
                  a["href"] for a in anchors if a.get("href") and "DownloadView.aspx" in a["href"]
              )),
              "download_invoked":False,
              "login_used":False,
              "payment_used":False,
              "raw_html_saved":False,
              "raw_html_logged":False,
          }
          Path("zhao-wanli-wenji-rid3-ebook-list.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ir-zhao-wanli-wenji-rid3-ebook-list
          path: zhao-wanli-wenji-rid3-ebook-list.json
