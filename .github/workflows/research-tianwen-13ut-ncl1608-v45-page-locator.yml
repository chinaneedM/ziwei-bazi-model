name: research-tianwen-13ut-ncl1608-v45-page-locator
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths: [.github/workflows/research-tianwen-13ut-ncl1608-v45-page-locator.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  page-locator:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Install image reader
        run: python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2' 'pillow>=10,<13'
      - name: Verify catalogued 1608 part-one source and emit bounded page atlas
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, urllib.request
          import fitz
          from PIL import Image, ImageDraw
          out=pathlib.Path('source-window');out.mkdir(exist_ok=True)
          # This is an existing 13NW-registered *physical copy* (NCL 06273),
          # but a different PDF part. Do not count another witness.
          url='https://upload.wikimedia.org/wikipedia/commons/2/25/NCL-06273_1_%E5%8F%A4%E4%BB%8A%E5%BE%8B%E6%9B%86%E8%80%83.pdf'
          req=urllib.request.Request(url,headers={'User-Agent':'TianwenHistoricalCollation/1.0 (https://github.com/chinaneedM/ziwei-bazi-model; public domain scan)'})
          with urllib.request.urlopen(req,timeout=150) as response:
              data=response.read(110_000_000)
              assert response.status==200
          assert data[:5]==b'%PDF-' and 60_000_000<len(data)<110_000_000
          pdf=fitz.open(stream=data,filetype='pdf')
          assert len(pdf)==1000,('Unexpected number of scanned pages',len(pdf))
          detail={'source':'NCL-06273 1 古今律曆考.pdf','catalogued_edition':'1608 孫瑋保定刊','source_url':url,'bytes':len(data),'pdf_pages':len(pdf),'pdf_sha256':hashlib.sha256(data).hexdigest(),'existing_same_copy_reference':'13NW second part; one NCL 06273 catalogued holding only','purpose':'Find exact juan45 L35 original source page in part1; numeric inference forbidden before visual verification','no_ocr':True}
          print('ORIGINAL_SOURCE',json.dumps(detail,ensure_ascii=False))
          # Sample late part-one folios (each page may contain two printed leaves).
          sample=[650,700,750,800,840,860,880,900,920,930,940,950,960,970,980,990,995,998,1000]
          records=[]; thumb=[]
          for one in sample:
              pg=pdf[one-1]
              pix=pg.get_pixmap(matrix=fitz.Matrix(1.0,1.0),alpha=False)
              im=Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB')
              im.thumbnail((400,350))
              thumb.append((one,im))
              records.append({'pdf_page':one,'page_rect':list(pg.rect),'thumb_image_sha256':hashlib.sha256(pix.samples).hexdigest()})
          detail['sampled_pages']=records
          for start in range(0,len(thumb),12):
              block=thumb[start:start+12]
              canvas=Image.new('RGB',(4*420,3*375),'white')
              draw=ImageDraw.Draw(canvas)
              for idx,(number,im) in enumerate(block):
                  x=(idx%4)*420;y=(idx//4)*375
                  draw.text((x+10,y+7),'PDF '+str(number),fill='black')
                  canvas.paste(im,(x+5,y+26))
              buf=io.BytesIO();canvas.save(buf,format='JPEG',quality=74,optimize=True)
              raw=buf.getvalue()
              fn='atlas-'+str(start//12+1)+'.jpg'
              (out/fn).write_bytes(raw)
              print('ATLAS_METADATA',json.dumps({'name':fn,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}))
              print('ATLAS_BASE64_'+str(start//12+1)+'='+base64.b64encode(raw).decode('ascii'))
          # Preserve native embedded bytes for the terminal 20-page window,
          # without permanently adding large copyrighted scan derivatives to Git.
          for one in range(981,1001):
              for idx,record in enumerate(pdf[one-1].get_images(full=True)):
                  xref=record[0]
                  original=pdf.extract_image(xref)
                  raw=original['image']
                  name='p'+str(one)+'-image'+str(idx)+'-xref'+str(xref)+'.'+original['ext']
                  (out/name).write_bytes(raw)
                  print('ORIGINAL_EMBEDDED',json.dumps({'pdf_page':one,'xref':xref,'file':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}))
          # Original-pixel bounded human collation probes only. Reuse source
          # bytes and do NOT OCR, sharpen or infer words from the previews.
          for one in [940,960,980,990,1000]:
              pg=pdf[one-1]
              images=pg.get_images(full=True)
              assert images,('no native image',one)
              original=pdf.extract_image(images[0][0])
              raw=original['image']
              print('DIRECT_NATIVE_SOURCE',json.dumps({'pdf_page':one,'xref':images[0][0],'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'format':original['ext']}))
              print('DIRECT_NATIVE_B64_'+str(one)+'='+base64.b64encode(raw).decode('ascii'))
          # 13UT scope refinement: part-one p990 is around the juan41/42
          # seam; the specific v45 table should be sought in the SAME
          # accession's registered part-two, not in another invented copy.
          url2='https://upload.wikimedia.org/wikipedia/commons/0/05/NCL-06273_2_%E5%8F%A4%E4%BB%8A%E5%BE%8B%E6%9B%86%E8%80%83.pdf'
          request2=urllib.request.Request(url2,headers={'User-Agent':'TianwenHistoricalCollation/1.0 (https://github.com/chinaneedM/ziwei-bazi-model; public domain scan)'})
          with urllib.request.urlopen(request2,timeout=150) as response:
              bytes2=response.read(80_000_000)
              assert response.status==200
          assert hashlib.sha256(bytes2).hexdigest()=='4c6ec588e2fa7a13db0187b7ce8630fbfa7ec86ac47f2c8120e0f9a6b3dcce78','13NW original part2 hash mismatch'
          book2=fitz.open(stream=bytes2,filetype='pdf')
          assert len(book2)==625
          print('PART2_REGISTERED_SOURCE',json.dumps({'url':url2,'bytes':len(bytes2),'sha256':hashlib.sha256(bytes2).hexdigest(),'pdf_pages':len(book2),'catalogued_holding':'NCL06273 already 13NW','independent_witness_increment':0}))
          sample2=[1,20,40,60,80,100,120,140,160,180,200,220,240]
          thumbnails=[]
          for one in sample2:
              px=book2[one-1].get_pixmap(matrix=fitz.Matrix(.85,.85),alpha=False)
              im=Image.open(io.BytesIO(px.tobytes('png'))).convert('RGB')
              im.thumbnail((380,335))
              thumbnails.append((one,im))
          for k in range(0,len(thumbnails),12):
              block=thumbnails[k:k+12]
              canvas=Image.new('RGB',(4*400,3*360),'white');paint=ImageDraw.Draw(canvas)
              for idx,(one,im) in enumerate(block):
                  x=(idx%4)*400;y=(idx//4)*360
                  paint.text((x+5,y+5),'PART2 PDF '+str(one),fill='black')
                  canvas.paste(im,(x,y+22))
              buf=io.BytesIO();canvas.save(buf,format='JPEG',quality=75,optimize=True)
              raw=buf.getvalue()
              name='part2-atlas-'+str(k//12+1)+'.jpg'
              (out/name).write_bytes(raw)
              print('PART2_ATLAS',json.dumps({'file':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}))
              print('PART2_ATLAS_B64_'+str(k//12+1)+'='+base64.b64encode(raw).decode('ascii'))
          # Native original no-OCR page probes for the likely 45th-juan window.
          for one in [76,77,78,79,80,100]:
              pg=book2[one-1]
              imginfo=pg.get_images(full=True)
              assert imginfo
              raw=book2.extract_image(imginfo[0][0])['image']
              name='part2-p'+str(one)+'.jpg'
              (out/name).write_bytes(raw)
              print('PART2_DIRECT_NATIVE',json.dumps({'pdf_page':one,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}))
              print('PART2_NATIVE_B64_'+str(one)+'='+base64.b64encode(raw).decode('ascii'))
          (out/'source-manifest.json').write_text(json.dumps(detail,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Save original source window for direct visual follow-up
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13ut-ncl1608-v45-source-page-window
          path: source-window/
          retention-days: 30
