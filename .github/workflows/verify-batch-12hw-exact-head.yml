name: verify-batch-12hw-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hw-exact-head.yml
      - docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-DIRECT-17CHAR-LINE-PHYSICAL-CONTROL-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-DIRECT-17CHAR-LINE-PHYSICAL-CONTROL-HW.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending HW status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'tianwen/batch-12hw-exact-head',
              description: 'Batch 12HW exact-head verification running'
            })

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12HW exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-NLC-ZUOZHUAN-FID070-DIRECT-17CHAR-LINE-PHYSICAL-CONTROL-HW'
          e=json.loads(Path('docs/research/ZIWEI-NLC-ZUOZHUAN-FID070-DIRECT-17CHAR-LINE-PHYSICAL-CONTROL-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          d=e['direct_physical_control']
          assert d['pdf_page']==12
          assert d['direct_reading']=='周禮有史官掌邦國四方之事達四方之志'
          assert d['direct_large_character_count']==17
          assert len(d['counted_han_characters'])==17
          assert d['line_is_main_text_not_commentary'] is True
          assert d['double_line_commentary_inside_counted_line'] is False
          assert d['ocr_used'] is False
          a=e['adjudication']
          assert a['at_least_one_17_large_char_main_text_line_on_fid070']=='CLOSED_DIRECT_PHYSICAL'
          assert a['literal_uniform_maximum_16_only_interpretation']=='DISPROVED_BY_DIRECT_17_CHAR_LINE'
          assert a['current_nlc_16_metadata_defect_proved'] is False
          assert a['defect_016_created'] is False
          assert a['multi_line_reproducible_count_completed'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,235,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count'] >= 15
          assert state['historical_audit']['repaired_provenance_metadata_defect_count'] >= 15

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-NLC-DIGITAL-ZUOZHUAN-412004000070-COMMONS-BACKUP']['batch_12hw']['direct_large_character_count']==17
          assert src['EXT-NLC-META-ZUOZHUAN-UCS01003868188-CURRENT-SEARCH-20260927']['batch_12hw']['current_16_metadata_defect_proved'] is False

          ac=e['accounting']
          assert ac['matrix_rows']==198
          assert ac['audited_rows']==166
          assert ac['current_missing_from_product_rows']==10
          assert ac['confirmed_provenance_metadata_defect_count']==15
          assert ac['repaired_provenance_metadata_defect_count']==15
          assert ac['confirmed_chart_algorithm_defect_count']==0
          assert ac['algorithm_reopen_count']==0
          assert ac['candidate_collapse_count']==0
          PY

      - name: Publish successful HW status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'tianwen/batch-12hw-exact-head',
              description: 'Batch 12HW direct 17-char physical gate PASS'
            })

      - name: Publish failed HW status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'tianwen/batch-12hw-exact-head',
              description: 'Batch 12HW exact-head verification FAILED'
            })

# exact-head refresh: HW
