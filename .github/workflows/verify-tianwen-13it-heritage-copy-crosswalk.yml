name: verify-tianwen-13it-heritage-copy-crosswalk
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13IT-*'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - 'scripts/verify-tianwen-13it-heritage-copy-crosswalk.py'
      - 'tests/test_tianwen_13it_heritage_copy_crosswalk.py'
      - '.github/workflows/verify-tianwen-13it-heritage-copy-crosswalk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-tianwen-13it-heritage-copy-crosswalk.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13it_heritage_copy_crosswalk.py' -v
      - run: python scripts/verify-tianwen-13ir-active-field-control.py
