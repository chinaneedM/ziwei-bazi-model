name: verify-batch-12gr-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gr-exact-head.yml
      - docs/research/ZIWEI-JI-SHUYING-WENJI-PP383-385-CHEN-QINGHUA-PURCHASE-CONTEXT-FIREWALL-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-JI-SHUYING-WENJI-PP383-385-CHEN-QINGHUA-PURCHASE-CONTEXT-FALSE-LEAD-FIREWALL-GR.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GR exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-JI-SHUYING-WENJI-PP383-385-CHEN-QINGHUA-PURCHASE-CONTEXT-FALSE-LEAD-FIREWALL-GR'
          e=json.loads(Path('docs/research/ZIWEI-JI-SHUYING-WENJI-PP383-385-CHEN-QINGHUA-PURCHASE-CONTEXT-FIREWALL-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          d=e['dpm_article_identity']
          assert d['provider']=='故宫博物院'
          assert d['author']=='刘蔷'
          assert d['title']=='清宫“天禄琳琅”书存世状况总述'
          assert d['printed_page_range']=='53—70'
          assert d['first_page_directly_reviewed'] is True

          p62=e['printed_page_62_control']
          assert p62['printed_page']==62
          assert p62['directly_reviewed_page_image'] is True
          assert p62['footnote_2_contains_ji_wenji_pages']=='383—385'
          assert p62['sentence_continues_to_next_page'] is True

          p63=e['printed_page_63_control']
          assert p63['printed_page']==63
          assert p63['collector']=='陈清华'
          assert p63['state_acquisition_years']==[1956,1965]
          assert p63['context_identity']=='CHEN_QINGHUA_BULK_PURCHASE_DISCUSSION'

          a=e['adjudication']
          assert a['liu_2010_use_of_ji_pp383_385']=='CHEN_QINGHUA_BULK_PURCHASE_CONTEXT'
          assert a['direct_ji_pp383_385_text']=='NOT_REVIEWED'
          assert a['ji_pp383_385_as_baichuan_page_locator']=='NOT_AUTHORIZED'
          assert a['ji_pp383_385_as_tieqin_chapter_page_locator']=='NOT_AUTHORIZED'
          assert a['ji_pp383_385_proven_absent_of_tieqin_material'] is False
          assert a['target_specific_purchase_route_selected'] is False
          assert a['target_specific_donation_route_selected'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,204,0)
          completed=state['historical_audit']['completed_batches']
          assert bid in completed
          latest=state['historical_audit']['latest_batch_doc']
          assert isinstance(latest,str) and latest.startswith('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-') and latest.endswith('.md')

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert 'EXT-DPM-LIU-QIANG-2010-TIANLU-PP62-63-JI383-385-CONTEXT' in ids

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['transmission_impact']['direct_copy_edge_authorized'] is False
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_provenance_metadata_defect_count']==14
          assert e['accounting']['repaired_provenance_metadata_defect_count']==14
          PY
