name: verify-batch-12jm-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12jm-exact-head.yml
      - .github/workflows/probe-batch-12jm-shu-wenhui-1951-bound-volume-holding.yml
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-WENHUIBAO-1951-0818-SHU-BOUND-VOLUME-HOLDING-ROUTE-JM.md
      - docs/research/ZIWEI-WENHUIBAO-1951-0818-SHU-BOUND-VOLUME-HOLDING-ROUTE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending JM status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'tianwen/batch-12jm-exact-head', description: 'Batch 12JM exact-head verification running'})
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12JM exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-WENHUIBAO-1951-0818-SHU-BOUND-VOLUME-HOLDING-ROUTE-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-WENHUIBAO-1951-0818-SHU-BOUND-VOLUME-HOLDING-ROUTE-JM'
          assert e['controlling_probe']['workflow_run_id']==36831993406
          assert e['controlling_probe']['artifact_id']==11148225440
          assert e['first_party_page']['response_sha256']=='a3a9b77e4eb0ab5b53d0c35ea7c9fc0de9bd6401eabf585a13da52c0f8734198'
          assert e['shanghai_wenhui_row']['target_1951_coverage']=='1951(5-8)'
          assert e['shanghai_wenhui_row']['target_calendar_date_1951_08_18_inside_coverage'] is True
          assert e['shanghai_wenhui_row']['specific_target_issue_reviewed'] is False
          assert e['hong_kong_wenhui_control']['separately_named_on_same_first_party_page'] is True
          assert e['hong_kong_wenhui_control']['collapse_with_shanghai_row_forbidden'] is True
          assert e['adjudication']['direct_wenhui_1951_08_18_page']=='NOT_REVIEWED'
          assert e['adjudication']['secondary_1951_08_18_publication_claim_upgraded_to_primary_text'] is False
          assert e['adjudication']['holding_route_is_textual_evidence'] is False
          assert e['transmission_impact']['status']=='NONE'
          assert e['project_consequence']['product_change'] is False
          PY
      - name: Publish success JM status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'success', context: 'tianwen/batch-12jm-exact-head', description: 'Batch 12JM exact-head verification passed'})
      - name: Publish failure JM status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'failure', context: 'tianwen/batch-12jm-exact-head', description: 'Batch 12JM exact-head verification failed'})
