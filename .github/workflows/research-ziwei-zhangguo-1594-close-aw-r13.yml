name: research-ziwei-zhangguo-1594-close-aw-r13

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - '.github/workflows/research-ziwei-zhangguo-1594-close-aw-r13.yml'

permissions:
  contents: write

jobs:
  close-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0

      - name: Sync Batch 12AW durable state
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin agent/fusion-chart-core-r1-20260822
          python - <<'PY'
          import json
          from pathlib import Path

          batch = 'BATCH-12-ZIWEI-ZHANGGUO-1594-NIGHT-ZI-FOUR-KE-PHYSICAL-COLLATION-AW'
          batch_doc = 'docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-ZHANGGUO-1594-NIGHT-ZI-FOUR-KE-PHYSICAL-COLLATION-AW.md'
          artifact = 'docs/research/ZIWEI-ZHANGGUO-1594-NIGHT-ZI-PHYSICAL-COLLATION-R1.json'

          # 1) External source registry: add the directly collated NIJL/Tohoku 1594 witness.
          p = Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json')
          reg = json.loads(p.read_text(encoding='utf-8'))
          sid = 'EXT-ZIWEI-ZHANGGUO-NIJL-1594'
          if not any(x.get('source_id') == sid for x in reg['sources']):
              reg['sources'].append({
                  'source_id': sid,
                  'title': '《新編評註通玄先生張果星宗大全》',
                  'author': '陸位',
                  'historical_period': '明',
                  'edition': '萬曆22（1594）本',
                  'provider': 'National Institute of Japanese Literature / Tohoku University Library',
                  'url': 'https://kokusho.nijl.ac.jp/biblio/100238879?ln=ja',
                  'source_role': 'DIRECT_PHYSICAL_WITNESS_FOR_EARLY_NIGHT_ZI_FOUR_KE_AND_BIRTH_TIME_ZI_HAI_CONFUSION_GENEALOGY',
                  'quality_notes': 'NIJL BID 100238879 official IIIF manifest directly binds title, 陸位 and 万暦22. Canvas 195 was directly visually collated; OCR was locator-only. Main text attests 人命多有生時不定，以子為亥，亥為子… as a birth-time uncertainty/error context; upper annotation securely attests 七政曆所載，有夜子時之分，有上四刻下四刻之法；上四刻正陰，下四刻正陽. This page does not by itself securely prove upper four ke -> Hai branch and does not select a modern clock/time-standard mapping.',
                  'physical_locator': {
                      'bid': '100238879',
                      'canvas_index': 195,
                      'iiif_service_id': 'https://kokusho.nijl.ac.jp/api/iiif/100238879/v4/THKW/THKW-04306/THKW-04306-00195.tif',
                      'review_image_sha256_2400': '39c22d31e99d950f4cfd81680fb12b537c55fa2425503a9b6f6c844a3f4fbfb6',
                      'research_artifact': artifact
                  },
                  'batch_12aw_conclusion': 'EARLIER_INDEPENDENT_GENEALOGY_STRENGTHENED; EXPLICIT_UPPER_ZI_TO_HAI_VOTE_INCREMENT=0; NO_RUNTIME_WINNER'
              })
          p.write_text(json.dumps(reg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2) Matrix JSON: add a scoped Batch 12AW evidence block to HPA-ZDATE-006 only.
          p = Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json')
          matrix = json.loads(p.read_text(encoding='utf-8'))
          row = next(x for x in matrix['rows'] if x.get('rule_id') == 'HPA-ZDATE-006')
          row['batch_12aw_zhangguo_1594'] = {
              'source_id': sid,
              'physical_witness': 'NIJL/TOHOKU BID 100238879, 萬曆22/1594, canvas 195',
              'main_text_secure_reading': '人命多有生時不定，以子為亥，亥為子，以初為末，末為初，則坐度不同……',
              'annotation_secure_reading': '七政曆所載，有夜子時之分，有上四刻下四刻之法；上四刻正陰，下四刻正陽。',
              'mechanical_scope': 'EARLY_INDEPENDENT_ATTESTATION_OF_NIGHT_ZI_INTERNAL_SPLIT_AND_BIRTH_TIME_ZI_HAI_CONFUSION; NOT_DIRECT_PROOF_OF_UPPER_ZI_TO_HAI_BRANCH',
              'candidate_status_effect': 'NONE; HPA-ZDATE-006 REMAINS MISSING_FROM_PRODUCT',
              'runtime_winner_selected': False,
              'algorithm_reopen_authorized': False,
              'research_artifact': artifact
          }
          p.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 3) Matrix Markdown: append a durable scoped note without changing row/accounting counts.
          p = Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md')
          md = p.read_text(encoding='utf-8')
          marker = '## Batch 12AW — Zhangguo 1594 night-Zi physical witness'
          if marker not in md:
              md += f'''\n\n{marker}\n\n- `HPA-ZDATE-006` remains `MISSING_FROM_PRODUCT`; Matrix counts are unchanged.\n- NIJL/Tohoku BID `100238879`, 《新編評註通玄先生張果星宗大全》, 陸位, 萬曆22/1594, canvas 195 was directly visually collated.\n- Main text securely attests `人命多有生時不定，以子為亥，亥為子，以初為末，末為初，則坐度不同……` in a birth-time uncertainty/error context.\n- The upper annotation securely attests `七政曆所載，有夜子時之分，有上四刻下四刻之法；上四刻正陰，下四刻正陽。`\n- This strengthens the pre-1697 genealogy of the night-Zi split and Zi/Hai confusion, but does **not** itself prove `upper four ke -> Hai branch`, does not select a modern time coordinate, and adds no runtime winner or algorithm reopen.\n- Durable collation: `{artifact}`; batch decision: `{batch_doc}`.\n'''
          p.write_text(md, encoding='utf-8')

          # 4) Project continuity state.
          p = Path('docs/PROJECT-CURRENT-STATE-R1.json')
          state = json.loads(p.read_text(encoding='utf-8'))
          state['schema_version'] = '1.56.0'
          hist = state['historical_audit']
          if batch not in hist['completed_batches']:
              hist['completed_batches'].append(batch)
          hist['latest_batch_doc'] = batch_doc
          focus = hist['current_focus']
          additions = [
              'Batch 12AW directly binds NIJL/Tohoku BID 100238879 to 《新編評註通玄先生張果星宗大全》 / 陸位 / 萬曆22(1594) and directly collates canvas 195 without using OCR as glyph authority.',
              'The 1594 main text directly attests birth-time 子/亥 mutual misidentification as a problem, while the upper annotation directly attests a 七政曆 night-Zi upper/lower four-ke division. This is earlier independent genealogy, but the reviewed wording does not itself securely state upper four ke -> Hai branch.',
              'HPA-ZDATE-006 therefore remains MISSING_FROM_PRODUCT with counts unchanged; no new candidate family, runtime winner, candidate collapse, chart algorithm defect or algorithm reopen is authorized. Next high-value late-Zi targets are an independent readable 1594 target leaf (including Jangseogak if obtainable), an explicit earlier upper-Zi->Hai bridge, and the separate Fullbook cloudy/rain current-time acquisition chain.'
          ]
          for item in additions:
              if item not in focus:
                  focus.append(item)
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md \
            docs/PROJECT-CURRENT-STATE-R1.json
          if git diff --cached --quiet; then
            echo 'No durable state changes required.'
            exit 0
          fi
          git commit -m 'sync Batch 12AW Zhangguo 1594 evidence state'
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
