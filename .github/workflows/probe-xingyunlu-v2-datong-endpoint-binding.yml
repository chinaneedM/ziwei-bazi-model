name: probe-xingyunlu-v2-datong-endpoint-binding

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-xingyunlu-v2-datong-endpoint-binding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Acquire NLC Xingyunlu volume 1 and locate Datong endpoint binding
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/xingyunlu-v2-datong-endpoint-binding'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages" "$ROOT/ocr-low" "$ROOT/contact"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra >/dev/null
          python -m pip install --quiet pillow
          python - <<'PY'
          import hashlib, json, pathlib, re, subprocess, tempfile, urllib.parse, urllib.request
          from PIL import Image, ImageDraw

          root=pathlib.Path("audit/xingyunlu-v2-datong-endpoint-binding")
          title="File:NLC892-CBM1408-371920 古今律曆考 七十二卷 第1冊.pdf"
          api="https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({
              "action":"query","format":"json","formatversion":"2",
              "prop":"imageinfo","iiprop":"url|size|sha1|extmetadata","titles":title
          })
          headers={"User-Agent":"Tianwen-Provenance-Audit/1.0"}
          with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=60) as r:
              meta=json.load(r)
          page=meta["query"]["pages"][0]
          if "missing" in page:
              raise SystemExit(f"Commons file missing: {title}")
          ii=page["imageinfo"][0]
          url=ii["url"]
          (root/"commons-metadata.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=300) as r:
              data=r.read()
          pdf=root/"xingyunlu-nlc-volume1.pdf"
          pdf.write_bytes(data)
          pdf_sha=hashlib.sha256(data).hexdigest()
          info=subprocess.run(["pdfinfo",str(pdf)],stdout=subprocess.PIPE,check=True).stdout.decode("utf-8",errors="replace")
          (root/"pdfinfo.txt").write_text(info,encoding="utf-8")
          m=re.search(r"^Pages:\s+(\d+)",info,re.M)
          pages=int(m.group(1)) if m else 79

          terms=[
              "古今律曆考卷二","古今律历考卷二","大統曆","大统历",
              "二千六十八","二千九百三十一","五十九刻","四十一刻",
              "夏至日出","冬至日出","南京"
          ]
          hits=[]
          tmp=pathlib.Path(tempfile.mkdtemp(prefix="xingyun-low-"))
          for n in range(1,pages+1):
              prefix=tmp/f"p{n:03d}"
              subprocess.run(["pdftoppm","-f",str(n),"-singlefile","-jpeg","-r","105",str(pdf),str(prefix)],
                             check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              jpg=pathlib.Path(str(prefix)+".jpg")
              proc=subprocess.run(["tesseract",str(jpg),"stdout","-l","chi_tra","--psm","6"],
                                  stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False)
              txt=proc.stdout.decode("utf-8",errors="replace")
              (root/"ocr-low"/f"p{n:03d}.txt").write_text(txt,encoding="utf-8")
              compact="".join(txt.split())
              found=[t for t in terms if t in compact]
              if found:
                  hits.append({"page":n,"terms":found,"context":" ".join(txt.split())[:2500]})
              jpg.unlink(missing_ok=True)

          selected=set(range(1,min(8,pages)+1))
          selected.update(range(max(1,pages-7),pages+1))
          for h in hits:
              n=h["page"]
              selected.update(range(max(1,n-4),min(pages,n+4)+1))
          selected=sorted(selected)
          manifest=[]
          for n in selected:
              prefix=root/"pages"/f"p{n:03d}"
              subprocess.run(["pdftoppm","-f",str(n),"-singlefile","-jpeg","-r","260",str(pdf),str(prefix)],
                             check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              p=pathlib.Path(str(prefix)+".jpg")
              b=p.read_bytes()
              manifest.append({"page":n,"file":p.name,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})

          # Full-volume low-resolution contact sheets provide a deterministic fallback if OCR misses.
          thumbs=[]
          tmp2=pathlib.Path(tempfile.mkdtemp(prefix="xingyun-contact-"))
          for n in range(1,pages+1):
              prefix=tmp2/f"p{n:03d}"
              subprocess.run(["pdftoppm","-f",str(n),"-singlefile","-jpeg","-r","70",str(pdf),str(prefix)],
                             check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              p=pathlib.Path(str(prefix)+".jpg")
              im=Image.open(p).convert("RGB")
              tw=260; ratio=tw/im.width
              im=im.resize((tw,max(1,int(im.height*ratio))))
              c=Image.new("RGB",(tw,im.height+24),"white"); c.paste(im,(0,24))
              ImageDraw.Draw(c).text((5,5),f"PDF p{n}",fill="black")
              thumbs.append(c)
              p.unlink(missing_ok=True)
          cols=5; per=20
          for start in range(0,len(thumbs),per):
              chunk=thumbs[start:start+per]
              cw=max(x.width for x in chunk); ch=max(x.height for x in chunk)
              rows=(len(chunk)+cols-1)//cols
              sheet=Image.new("RGB",(cols*cw,rows*ch),"white")
              for k,im in enumerate(chunk): sheet.paste(im,((k%cols)*cw,(k//cols)*ch))
              sheet.save(root/"contact"/f"contact-{start+1:03d}-{start+len(chunk):03d}.jpg",quality=88,optimize=True)

          ext=ii.get("extmetadata") or {}
          report={
              "schema":"XINGYUNLU-V2-DATONG-ENDPOINT-BINDING-PROBE-R1",
              "schema_version":"1.0.0",
              "commons_file_title":title,
              "source_url":url,
              "commons_sha1":ii.get("sha1"),
              "pdf_sha256":pdf_sha,
              "pdf_pages":pages,
              "catalog_control":{
                  "work":"古今律曆考",
                  "author":"邢雲路",
                  "target_juan":"卷二",
                  "provider":"National Library of China surrogate via Wikimedia Commons",
                  "provider_volume_description":"卷首 / 目錄 / 卷一 / 卷二",
                  "provider_publication_date":"明萬曆[1573-1620]",
                  "exact_impression_year":"UNRESOLVED_FOR_THIS_NLC_OBJECT"
              },
              "publication_date_metadata":(ext.get("Date") or {}).get("value"),
              "image_description_metadata":(ext.get("ImageDescription") or {}).get("value"),
              "low_res_ocr_hits":hits,
              "ocr_authority":"LOCATOR_ONLY_NOT_FINAL_GLYPH_NUMERIC_OR_LINEAGE_AUTHORITY",
              "selected_direct_review_pages":selected,
              "page_manifest":manifest,
              "received_text_target_control":[
                  "大統曆推夏至日出分二千六十八分三十秒",
                  "冬至日出分二千九百三十一分七十秒",
                  "夏至…晝五十九刻夜四十一刻",
                  "冬至…晝四十一刻夜五十九刻"
              ],
              "research_question":"Does this source-bound Ming NLC physical edition directly place the exact Datong/C-II-N solstitial sunrise-fen values and the 59/41 whole-ke display in one mechanical passage, and what chronology/lineage limits follow?",
              "product_boundary":"Probe only; later-Ming explanatory witness cannot be promoted into a pre-1578 Sanming parent. No runtime change or algorithm reopen."
          }
          (root/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"pdf_sha256":pdf_sha,"pages":pages,"hits":hits,"selected":selected},ensure_ascii=False,indent=2))
          PY

      - name: Upload Xingyunlu endpoint-binding probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xingyunlu-v2-datong-endpoint-binding
          path: audit/xingyunlu-v2-datong-endpoint-binding
          if-no-files-found: error
          retention-days: 30
