name: probe-tianwen-13wb-nlc08938-juan45-folio
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-tianwen-13wb-nlc08938-juan45-folio.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-folio-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Original source cropped target page high-resolution rendering (no OCR)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pymupdf pillow
          mkdir -p evidence
          python - <<'PYCODE'
          import base64,hashlib,io,json,pathlib,urllib.parse,urllib.request
          import fitz
          from PIL import Image
          fn="NLC892-411999015732-116218_古今律曆考_第19冊.pdf"
          url="https://upload.wikimedia.org/wikipedia/commons/c/c4/"+urllib.parse.quote(fn)
          req=urllib.request.Request(url,headers={"User-Agent":"TianwenHistoricalSourceCollation/1.0 (public academic verification)"})
          with urllib.request.urlopen(req,timeout=120) as response:
              data=response.read(25000000)
          sha=hashlib.sha256(data).hexdigest()
          if sha!="b5b11ebcb4a7922898ff5f68eae3d31ed8317d92d55f3990fcb4ab7414664520":
              raise ValueError("Source PDF mismatch")
          doc=fitz.open(stream=data,filetype="pdf")
          if len(doc)!=59:raise ValueError("Page-count mismatch")
          records=[]
          selected=[(2,"left","heading"),(4,"left","tableA_L35"),(10,"right","tableA_L132"),(12,"both","two_tables_seam"),(14,"right","tableB_L35"),(19,"left","tableB_L132"),(21,"both","second_table_end")]
          for p,side,target in selected:
              pg=doc[p-1]
              pix=pg.get_pixmap(matrix=fitz.Matrix(4600/pg.rect.width,4600/pg.rect.width),alpha=False)
              image=Image.frombytes("RGB",(pix.width,pix.height),pix.samples)
              w,h=image.size
              if side=="left":crop=(0,0,round(w*0.55),h)
              elif side=="right":crop=(round(w*0.45),0,w,h)
              else:crop=(0,0,w,h)
              image=image.crop(crop)
              stream=io.BytesIO();image.save(stream,"JPEG",quality=82,optimize=True)
              data_image=stream.getvalue()
              rec={"pdf_page":p,"side":side,"target":target,"full_render_px":[w,h],"crop_bbox_px":crop,"cropped_px":[image.width,image.height],"jpeg_sha256":hashlib.sha256(data_image).hexdigest(),"jpeg_bytes":len(data_image)}
              records.append(rec)
              encoded=base64.b64encode(data_image).decode("ascii")
              print("DETAIL_BEGIN",json.dumps(rec,ensure_ascii=False))
              for offset in range(0,len(encoded),6000):print("DETAIL_PART",p,offset//6000,encoded[offset:offset+6000])
              print("DETAIL_END",p)
          info={"source_pdf_sha256":sha,"source_pdf_pages":59,"selected_views":records,"scope":"Source-native crops for human visual review, NO_OCR, NO_NUMERIC_AWARD"}
          pathlib.Path("evidence/manifest.json").write_text(json.dumps(info,ensure_ascii=False,indent=2)+"\n")
          print("SOURCE_RESULT",json.dumps({k:v for k,v in info.items() if k!="selected_views"},ensure_ascii=False))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13wb-original-juan45-target-crop-manifest
          path: evidence/manifest.json
          if-no-files-found: warn
