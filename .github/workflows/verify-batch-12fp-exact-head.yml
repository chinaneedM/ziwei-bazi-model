name: verify-batch-12fp-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fp-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FP exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-JI-SHUYING-TIEQIN-ACQUISITION-PROGRAM-CHRONOLOGY-AND-DIRECT-TEXT-BOUNDARY-FP'
          e=json.loads(Path('docs/research/ZIWEI-JI-SHUYING-TIEQIN-ACQUISITION-PROGRAM-CHRONOLOGY-AND-DIRECT-TEXT-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          b=e['book_identity']
          assert b['title']=='冀淑英古籍善本十五讲'
          assert b['author']=='冀淑英'
          assert b['isbn']=='9787501340637'
          assert b['chapter_9']['title']=='铁琴铜剑楼藏书的收购入藏'
          assert b['chapter_9']['identity_closed'] is True
          assert b['chapter_9']['full_direct_page_scan_reviewed_by_project'] is False
          assert b['chapter_9']['full_direct_text_reviewed_by_project'] is False

          route=e['lawful_direct_access_route']
          assert route['status']=='PHYSICAL_HOLDING_AND_LIBRARY_COPY_REQUEST_ROUTE_LOCATED'
          assert route['adjudication']=='LAWFUL_ACCESS_ROUTE_CLOSED_BUT_DIRECT_CHAPTER_COLLATION_PENDING'
          tky=route['tokyo_metropolitan_central_library']
          assert tky['call_number']=='C/022.3/6011/2009'
          assert tky['material_code']=='4001029913'
          assert tky['availability_status']=='利用可'
          assert tky['cooperative_lending']=='可能'
          assert tky['project_has_obtained_chapter_9_copy'] is False
          assert tky['project_has_directly_collated_chapter_9'] is False

          a=e['adjudication']
          assert a['ji_book_identity']=='CLOSED'
          assert a['ji_chapter_9_identity']=='CLOSED_AS_铁琴铜剑楼藏书的收购入藏'
          assert a['ji_chapter_9_lawful_access_route']=='CLOSED_VIA_TOKYO_METROPOLITAN_CENTRAL_LIBRARY'
          assert a['ji_chapter_9_full_direct_text']=='NOT_REVIEWED'
          assert a['qu_to_beijing_library_purchase_component']=='CLOSED_AT_COLLECTION_PROGRAM_LEVEL'
          assert a['qu_to_beijing_library_donation_component']=='CLOSED_AT_COLLECTION_PROGRAM_LEVEL'
          assert a['mixed_transfer_program']=='CLOSED'
          assert a['reported_1950_1953_batch_counts']=='SECONDARY_RECOUNTING_PENDING_DIRECT_CHAPTER_OR_ACCESSION_LEDGER_COLLATION'
          assert a['target_3482_3483_batch_membership']=='UNRESOLVED'
          assert a['target_specific_purchase_route_selected'] is False
          assert a['target_specific_donation_route_selected'] is False
          assert a['target_specific_other_transfer_route_selected'] is False
          assert a['target_exact_acquisition_date']=='UNRESOLVED'
          assert a['final_nlc_acquisition_transfer_path']=='UNRESOLVED'

          fw=e['inference_firewall']
          assert fw['chapter_title_contains_收购_does_not_mean_every_qu_item_was_purchased'] is True
          assert fw['collection_level_purchase_evidence_does_not_assign_target_purchase'] is True
          assert fw['secondary_batch_counts_may_not_be_promoted_to_direct_ji_text'] is True
          assert fw['diary_purchase_controls_may_not_bind_unlisted_target_titles'] is True
          assert fw['missing_瞿捐_mark_still_does_not_imply_sale'] is True
          assert fw['target_route_requires_title_catalog_number_or_bound_volume_level_transaction_evidence'] is True

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['historical_audit']['latest_batch_doc'].endswith('ZIWEI-JI-SHUYING-TIEQIN-ACQUISITION-PROGRAM-CHRONOLOGY-AND-DIRECT-TEXT-BOUNDARY-FP.md')
          assert bid in state['historical_audit']['completed_batches']
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['historical_audit']['row_count']==198
          assert state['historical_audit']['audited_row_count']==166
          assert state['historical_audit']['current_missing_from_product_row_count']==10
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==13
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==13
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {
              'EXT-NDL-JI-SHUYING-GUJI-SHANBEN-15LECTURES-2009',
              'EXT-TOKYO-METRO-LIB-JI-SHUYING-15LECTURES-HOLDING-2009',
              'EXT-KKNEWS-JI-SHUYING-15LECTURES-CH9-PUBLIC-SUMMARY',
              'EXT-SHEN-JIN-2014-QU-FENGQI-JI-CH9-MIXED-TRANSFER-CONTROL',
              'EXT-SOHU-2019-ZHAO-WANLI-GU-DENG-TIEQIN-PURCHASE-DIARY-CONTROLS',
              'EXT-SECONDARY-JI-CH9-TIEQIN-BATCH-CHRONOLOGY-1950-1953',
              'EXT-NLC-PCAB-ZHENG-ZHENDUO-QU-DONATION-AND-PRICED-ACQUISITION-2024',
          }.issubset(ids)

          t=e['transmission_impact']
          assert t['nodes_added']==[] and t['edges_added']==[]
          assert t['acquisition_edge_authorized'] is False
          assert t['same_object_edge_authorized'] is False
          r=e['chronology_and_rule_firewall']
          assert r['direct_sanming_parent_vote_increment']==0
          assert r['pre1578_zhunzhai_rule_witness_increment']==0
          assert r['runtime_rule_change'] is False
          assert r['algorithm_reopen_authorized'] is False
          assert r['candidate_collapse_authorized'] is False
          assert r['matrix_count_change'] is False

          graph=json.loads(Path('docs/TRANSMISSION-GENEALOGY-GRAPH-R1.json').read_text(encoding='utf-8'))
          assert not any(x.get('latest_scope_update_batch')==bid for x in graph.get('nodes', []))
          assert not any(x.get('latest_scope_update_batch')==bid for x in graph.get('edges', []))
          PY
