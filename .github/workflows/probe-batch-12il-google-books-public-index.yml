name: probe-batch-12il-google-books-public-index

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12il-google-books-public-index.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe public Google Books volume and in-book index surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.parse, urllib.request, urllib.error

          def fetch(url):
              req=urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 TianwenResearch/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data=r.read()
                      return r.status, dict(r.headers), data
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()
              except Exception as e:
                  return None, {}, (repr(e)).encode()

          def emit(label,url):
              status,headers,data=fetch(url)
              print("===BEGIN",label,"===")
              print("URL",url)
              print("STATUS",status)
              print("CONTENT_TYPE",headers.get("Content-Type"))
              print("BYTES",len(data))
              print("SHA256",hashlib.sha256(data).hexdigest())
              txt=data.decode("utf-8","replace")
              print("BODY",txt[:12000].replace("\x00",""))
              print("===END",label,"===")
              return status,txt

          api_queries={
            "JI_ISBN":"isbn:9787501340637",
            "JI_TITLE":"intitle:冀淑英古籍善本十五讲",
            "ZHAO_ISBN":"isbn:9787501346653",
            "ZHAO_TITLE":"intitle:赵万里文集 第一卷",
          }
          ids=set(["bAnzzgEACAAJ"])
          for label,q in api_queries.items():
              url="https://www.googleapis.com/books/v1/volumes?"+urllib.parse.urlencode({"q":q,"maxResults":10})
              status,txt=emit("API_"+label,url)
              try:
                  obj=json.loads(txt)
                  found=[x.get("id") for x in obj.get("items",[]) if x.get("id")]
                  print("VOLUME_IDS_"+label,json.dumps(found,ensure_ascii=False))
                  ids.update(found)
              except Exception as e:
                  print("PARSE_ERROR_"+label,repr(e))

          tests={
            "bAnzzgEACAAJ":[
              "铁琴铜剑楼","收购入藏","瞿凤起","吴梅","涵芬楼","周叔弢","三百零四","五十二种"
            ]
          }
          # Search every discovered ID using both Ji and Zhao high-information terms.
          zhao_terms=["单就图书而论","瞿济苍","丁惠康","东家杂记","六十二种","太平乐府"]
          for vid in sorted(ids):
              terms=tests.get(vid,[])+zhao_terms
              seen=set()
              for term in terms:
                  if term in seen: continue
                  seen.add(term)
                  qs=urllib.parse.urlencode({"jscmd":"SearchWithinVolume2","q":term,"vid":vid})
                  emit("SEARCH_"+vid+"_"+term,"https://books.google.com/books?"+qs)
          PY
