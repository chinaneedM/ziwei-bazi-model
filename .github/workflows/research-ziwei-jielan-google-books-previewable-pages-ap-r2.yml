name: research-ziwei-jielan-google-books-previewable-pages-ap-r2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-jielan-google-books-previewable-pages-ap-r2.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Follow only source-emitted previewable page routes
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          out=Path("batch12ap-r2")
          out.mkdir(exist_ok=True)
          vid="rZRcCwAAQBAJ"

          def get(url, name):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read(); status=r.status; final=r.geturl(); ctype=r.headers.get("Content-Type")
              except Exception as e:
                  return {"url":url,"error":repr(e)}
              (out/name).write_bytes(data)
              return {"url":url,"final_url":final,"http_status":status,"content_type":ctype,
                      "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}

          receipt={"scope":"SOURCE_EMITTED_PREVIEWABLE_PAGES_ONLY","access_control_bypass_attempted":False,"volume_id":vid}

          # Re-obtain source-emitted search response; PT16 has page_url, PT49 does not.
          def search(term,name):
              url="https://books.google.com/books?jscmd=SearchWithinVolume2&q="+urllib.parse.quote(term)+"&vid="+vid
              rec=get(url,name)
              p=out/name
              obj=json.loads(p.read_text("utf-8")) if p.exists() else {}
              return rec,obj

          srec,sobj=search("生時","search-birth.json")
          irec,iobj=search("陰雨","search-inclement.json")
          receipt["birth_search"]=srec
          receipt["inclement_search"]=irec

          birth_results=sobj.get("search_results",[])
          inc_results=iobj.get("search_results",[])
          receipt["search_route_adjudication"]={
              "birth_source_emitted_page_ids":[x.get("page_id") for x in birth_results],
              "birth_source_emitted_page_urls":[x.get("page_url") for x in birth_results if x.get("page_url")],
              "inclement_source_emitted_page_ids":[x.get("page_id") for x in inc_results],
              "inclement_source_emitted_page_urls":[x.get("page_url") for x in inc_results if x.get("page_url")],
              "pt49_page_url_emitted":any(x.get("page_id")=="PT49" and bool(x.get("page_url")) for x in inc_results),
              "pt49_url_constructed_by_probe":False
          }

          # Follow PT16 only because Google itself emits the URL in SearchWithinVolume2.
          pt16=next((x for x in birth_results if x.get("page_id")=="PT16" and x.get("page_url")),None)
          if pt16:
              receipt["pt16_page"]=get(pt16["page_url"],"pt16.html")
              txt=(out/"pt16.html").read_text("utf-8",errors="ignore")
              links=[html.unescape(x) for x in re.findall(r'https?://books\.google\.com/books/publisher/content\?[^"<> ]+',txt)]
              # Only exact image URLs emitted by the PT16 response are followed.
              receipt["pt16_source_emitted_publisher_content_urls"]=links[:20]
              imgs=[]
              for idx,url in enumerate(links[:5]):
                  rec=get(url,f"pt16-image-{idx}.bin")
                  rec["source_emitted"]=True
                  imgs.append(rec)
              receipt["pt16_source_emitted_images"]=imgs

          # Also fetch selected-page images explicitly emitted by the public landing.
          landing=get("https://books.google.com/books?id="+vid,"landing.html")
          receipt["landing"]=landing
          txt=(out/"landing.html").read_text("utf-8",errors="ignore")
          links=[html.unescape(x) for x in re.findall(r'https?://books\.google\.com/books/publisher/content\?[^"<> ]+',txt)]
          receipt["landing_source_emitted_publisher_content_urls"]=links[:20]
          imgs=[]
          for idx,url in enumerate(links[:5]):
              rec=get(url,f"landing-image-{idx}.bin")
              rec["source_emitted"]=True
              imgs.append(rec)
          receipt["landing_source_emitted_images"]=imgs

          (out/"receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n","utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-jielan-google-books-previewable-pages-ap-r2
          path: batch12ap-r2
          retention-days: 90
