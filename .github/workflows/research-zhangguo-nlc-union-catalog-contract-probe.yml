name: research-zhangguo-nlc-union-catalog-contract-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-zhangguo-nlc-union-catalog-contract-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract NLC source-emitted search form contract
        run: |
          python - <<'PY'
          import hashlib, json, re, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          ROOT='http://read.nlc.cn/allSearch/searchList?searchType=62&showType=1&pageNo=1'
          UA='Mozilla/5.0 research-contract-probe/1.1'

          req=urllib.request.Request(ROOT,headers={'User-Agent':UA,'Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=25) as r:
              body=r.read(5_000_000)
              final_url=r.geturl(); status=r.status; ctype=r.headers.get('content-type')
          text=body.decode('utf-8','replace')

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.forms=[]; self.inputs=[]; self.selects=[]; self.buttons=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  rec={'tag':tag, **{k:v for k,v in d.items() if k in ('id','name','type','value','action','method','onclick','class','placeholder')}}
                  if tag=='form': self.forms.append(rec)
                  elif tag=='input': self.inputs.append(rec)
                  elif tag=='select': self.selects.append(rec)
                  elif tag in ('button','a') and any(k in d for k in ('onclick','href','id','name')): self.buttons.append(rec | ({'href':d.get('href')} if 'href' in d else {}))
          p=Parser(); p.feed(text)

          terms=['searchWord','searchList','searchType','showType','pageNo','search','query','keyword','submit','simpleSearch','advanced']
          contexts={}
          for term in terms:
              arr=[]; pos=0
              while len(arr)<20:
                  i=text.lower().find(term.lower(),pos)
                  if i<0: break
                  arr.append(text[max(0,i-450):min(len(text),i+900)])
                  pos=i+len(term)
              if arr: contexts[term]=arr

          # Capture inline JS function headers/bodies only around search-related names.
          functions=[]
          for m in re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\([^)]*\)\s*\{',text):
              name=m.group(1)
              if any(k in name.lower() for k in ('search','query','submit','page')):
                  functions.append(text[m.start():min(len(text),m.start()+2500)])

          out={
            'schema':'NLC-RARE-BOOK-UNION-CATALOG-FORM-CONTRACT-R1',
            'status':status,'final_url':final_url,'content_type':ctype,'body_len':len(body),
            'sha256':hashlib.sha256(body).hexdigest(),
            'forms':p.forms,'inputs':p.inputs,'selects':p.selects,'buttons':p.buttons[:200],
            'contexts':contexts,'search_functions':functions[:50],
            'policy':'DIRECT_FIRST_PARTY_HTML_CONTRACT_EXTRACTION_NO_GUESSED_ENDPOINTS_NO_LOGIN_NO_AUTH_BYPASS'
          }
          Path('nlc-form-contract.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nlc-union-catalog-form-contract
          path: nlc-form-contract.json
          if-no-files-found: error
