name: research-zhangguo-nlc-union-catalog-contract-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-zhangguo-nlc-union-catalog-contract-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query NLC source-emitted search URL by GET after observed POST 405
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          BASE='http://read.nlc.cn'
          UA='Mozilla/5.0 research-contract-probe/1.3'
          variants=[
            ('long_trad','新編評註通玄先生張果星宗大全'),
            ('long_simp','新编评注通玄先生张果星宗大全'),
            ('short_trad','張果星宗'),
            ('short_simp','张果星宗'),
          ]
          terms=['新編評註通玄先生張果星宗大全','新编评注通玄先生张果星宗大全','張果星宗','张果星宗',
                 '萬曆','万历','二十二','1594','癸巳','唐謙','唐谦','南京','湖南','安徽','河南','重慶','重庆','山東','山东','復旦','复旦']

          class AParser(HTMLParser):
              def __init__(self): super().__init__(); self.cur=None; self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a': self.cur={'href':dict(attrs).get('href'),'text':''}
              def handle_data(self,data):
                  if self.cur is not None: self.cur['text']+=data
              def handle_endtag(self,tag):
                  if tag=='a' and self.cur is not None: self.links.append(self.cur); self.cur=None

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(12_000_000)
                      return {'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('content-type'),
                              'body_len':len(b),'sha256':hashlib.sha256(b).hexdigest(),'body':b}
              except Exception as e:
                  return {'error':f'{type(e).__name__}: {e}','body':b''}

          out={'schema':'NLC-RARE-BOOK-UNION-CATALOG-TITLE-GET-QUERY-R1','queries':{},
               'contract_basis':{
                  'landing_get_200':True,
                  'inline_js_action_pattern':'/allSearch/searchList?searchType=<type>&showType=<n>&searchWord=<encoded>',
                  'source_form_method':'POST','observed_post_result':'HTTP_405_ALL_FOUR_VARIANTS'
               },
               'policy':'SAME_FIRST_PARTY_SOURCE_EMITTED_SEARCH_URL_ONLY_AFTER_POST_405_NO_GUESSED_ENDPOINTS_NO_LOGIN_NO_AUTH_BYPASS'}

          for name,q in variants:
              url=BASE+'/allSearch/searchList?'+urllib.parse.urlencode({'searchType':'62','showType':'1','searchWord':q})
              r=get(url); raw=r.pop('body',b''); text=raw.decode('utf-8','replace')
              p=AParser(); p.feed(text)
              r['term_hits']={t:text.count(t) for t in terms if t in text}
              contexts=[]
              for t in terms:
                  pos=0
                  while len(contexts)<50:
                      i=text.find(t,pos)
                      if i<0: break
                      contexts.append({'term':t,'context':html.unescape(re.sub(r'\s+',' ',text[max(0,i-1000):min(len(text),i+2600)]))})
                      pos=i+len(t)
              r['contexts']=contexts
              links=[]
              for a in p.links:
                  txt=re.sub(r'\s+',' ',html.unescape(a.get('text') or '')).strip(); href=a.get('href')
                  if any(k in txt for k in ('張果','张果','星宗')):
                      links.append({'text':txt[:700],'href':href})
              ded=[]; seen=set()
              for x in links:
                  key=(x['text'],x['href'])
                  if key not in seen: seen.add(key); ded.append(x)
              r['matching_links']=ded[:100]
              # Detect common result-state language without interpreting it as a whole-catalog negative.
              state_terms=['检索结果','搜索结果','共','条记录','没有找到','暂无数据','无相关','中华古籍资源库']
              r['state_term_hits']={x:text.count(x) for x in state_terms if x in text}
              r['html_prefix']=text[:1200]; r['html_suffix']=text[-1000:] if text else ''
              out['queries'][name]=r

          Path('nlc-title-get-query.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nlc-union-catalog-title-get-query
          path: nlc-title-get-query.json
          if-no-files-found: error
