name: research-zhangguo-nlc-union-catalog-contract-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-zhangguo-nlc-union-catalog-contract-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Follow exact NLC emitted large-image route and inspect emitted viewer contract
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          BASE='http://read.nlc.cn'
          DETAIL=BASE+'/allSearch/searchDetail?searchType=62&showType=3&indexName=data_467&fid=NJPX95-B1857'
          VIEW=BASE+'/OutOpenBook/OpenObjectPic?aid=467&bid=3244.0&lid=905349&did=NJPX95-B1857'
          UA='Mozilla/5.0 research-contract-probe/1.5'

          def fetch(url, accept='*/*'):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept,'Referer':DETAIL})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(20_000_000)
                      return {'requested_url':url,'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('content-type'),
                              'body_len':len(b),'sha256':hashlib.sha256(b).hexdigest(),'body':b}
              except Exception as e:
                  return {'requested_url':url,'error':f'{type(e).__name__}: {e}','body':b''}

          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]; self.images=[]; self.scripts=[]; self.forms=[]; self.inputs=[]; self.cur=None
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='a': self.cur={'href':d.get('href'),'text':''}
                  elif tag=='img': self.images.append(d)
                  elif tag=='script' and d.get('src'): self.scripts.append(d.get('src'))
                  elif tag=='form': self.forms.append(d)
                  elif tag in ('input','button','select','option'): self.inputs.append({'tag':tag,**d})
              def handle_data(self,data):
                  if self.cur is not None: self.cur['text']+=data
              def handle_endtag(self,tag):
                  if tag=='a' and self.cur is not None:
                      self.cur['text']=re.sub(r'\s+',' ',html.unescape(self.cur['text'])).strip(); self.links.append(self.cur); self.cur=None

          r=fetch(VIEW,'text/html,*/*'); body=r.pop('body',b''); text=body.decode('utf-8','replace')
          p=P(); p.feed(text)
          base=r.get('final_url') or VIEW

          # Only collect routes literally emitted by this first-party viewer HTML.
          raw_urls=[]
          for a in p.links:
              if a.get('href'): raw_urls.append(('anchor',a['href']))
          for x in p.images:
              if x.get('src'): raw_urls.append(('img',x['src']))
          for s in p.scripts: raw_urls.append(('script',s))
          for m in re.findall(r'''["']([^"']{1,800})["']''',text):
              lo=m.lower()
              if any(k in lo for k in ('jpg','jpeg','png','tif','tiff','jp2','image','pic','book','page','object','viewer','catalog')) and ('/' in m or m.startswith('http')):
                  raw_urls.append(('literal',m))
          emitted=[]; seen=set()
          for kind,raw in raw_urls:
              try: u=urllib.parse.urljoin(base,html.unescape(raw))
              except Exception: continue
              if urllib.parse.urlparse(u).hostname and urllib.parse.urlparse(u).hostname.endswith('nlc.cn'):
                  key=(kind,u)
                  if key not in seen: seen.add(key); emitted.append({'kind':kind,'url':u})

          # Fetch only literal image src values and first-party JS assets actually emitted by viewer.
          fetched=[]
          for x in emitted:
              if x['kind'] not in ('img','script'): continue
              fr=fetch(x['url']); b=fr.pop('body',b'')
              item={**x,**fr}
              if x['kind']=='script' and b:
                  st=b.decode('utf-8','replace')
                  literals=[]
                  for m in re.findall(r'''["']([^"']{1,800})["']''',st):
                      lo=m.lower()
                      if any(k in lo for k in ('jpg','jpeg','png','tif','tiff','jp2','image','pic','book','page','object','viewer')) and ('/' in m or m.startswith('http')):
                          literals.append(m)
                  item['relevant_literals']=literals[:500]
              fetched.append(item)

          terms=['NJPX95-B1857','905349','3244','data_467','page','Page','页','頁','总页','總頁','图片','圖片','图像','圖像','目录','目錄','上一页','下一页','上一頁','下一頁','filePath','filepath','picPath','imgPath','imagePath','bookPic']
          contexts=[]
          for t in terms:
              pos=0
              while len(contexts)<120:
                  i=text.find(t,pos)
                  if i<0: break
                  contexts.append({'term':t,'context':html.unescape(re.sub(r'\s+',' ',text[max(0,i-1000):min(len(text),i+2600)]))})
                  pos=i+len(t)

          out={'schema':'NLC-PRINCETON-NJPX95-B1857-EMITTED-VIEWER-CONTRACT-R1','viewer_request':VIEW,'viewer_response':r,
               'links':p.links[:500],'images':p.images[:500],'scripts':p.scripts[:200],'forms':p.forms[:100],'inputs':p.inputs[:500],
               'emitted_first_party_routes':emitted[:1500],'fetched_emitted_assets':fetched[:300],
               'term_hits':{t:text.count(t) for t in terms if t in text},'contexts':contexts,
               'html_prefix':text[:2500],'html_suffix':text[-1800:] if text else '',
               'policy':'FOLLOW_EXACT_DETAIL_EMITTED_VIEWER_ROUTE_AND_VIEWER_EMITTED_ASSETS_ONLY_NO_GUESSED_PAGE_IDS_NO_LOGIN_NO_AUTH_BYPASS'}
          Path('nlc-princeton-viewer-contract.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nlc-princeton-NJPX95-B1857-viewer-contract
          path: nlc-princeton-viewer-contract.json
          if-no-files-found: error
