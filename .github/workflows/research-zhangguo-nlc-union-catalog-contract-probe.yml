name: research-zhangguo-nlc-union-catalog-contract-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-zhangguo-nlc-union-catalog-contract-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe NLC source-emitted public contract only
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          roots = [
              'http://read.nlc.cn/allSearch/searchList?searchType=62&showType=1&pageNo=1',
              'https://read.nlc.cn/allSearch/searchList?searchType=62&showType=1&pageNo=1',
          ]
          title_t = '新編評註通玄先生張果星宗大全'
          title_s = '新编评注通玄先生张果星宗大全'
          ua = 'Mozilla/5.0 research-contract-probe/1.0'

          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'*/*'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(10_000_000)
                      return {'requested_url':url,'status':r.status,'final_url':r.geturl(),
                              'content_type':r.headers.get('content-type'),'body_len':len(body),
                              'sha256':hashlib.sha256(body).hexdigest(),'body':body}
              except Exception as e:
                  return {'requested_url':url,'error':f'{type(e).__name__}: {e}','body':b''}

          out={'schema':'NLC-RARE-BOOK-UNION-CATALOG-PUBLIC-CONTRACT-PROBE-R1',
               'roots':[],'assets':[],'candidate_literals':[],'target_literal_hits':[]}
          assets=[]
          for root in roots:
              r=fetch(root); body=r.pop('body',b''); text=body.decode('utf-8','replace')
              r['target_literal_present']=title_t in text or title_s in text
              r['html_prefix']=text[:2000]
              out['roots'].append(r)
              base=r.get('final_url') or root
              for raw in re.findall(r'''(?:src|href)=["']([^"']+)["']''',text,re.I):
                  u=urllib.parse.urljoin(base,html.unescape(raw)); p=urllib.parse.urlparse(u)
                  if p.hostname and p.hostname.endswith('nlc.cn') and (p.path.endswith('.js') or '.js?' in u):
                      assets.append(u)
          for u in list(dict.fromkeys(assets))[:50]:
              r=fetch(u); body=r.pop('body',b''); text=body.decode('utf-8','replace')
              r['target_literal_present']=title_t in text or title_s in text
              out['assets'].append(r)
              if r['target_literal_present']: out['target_literal_hits'].append({'asset':u})
              c=set()
              for m in re.findall(r'''https?://[^"'\\\s<>]{4,500}''',text):
                  lo=m.lower()
                  if any(k in lo for k in ('api','search','allsearch','catalog','book','guji','resource','detail','query')): c.add(m[:500])
              for m in re.findall(r'''["'](/[^"'\\]{2,400})["']''',text):
                  lo=m.lower()
                  if any(k in lo for k in ('api','search','allsearch','catalog','book','guji','resource','detail','query')): c.add(m)
              for x in sorted(c): out['candidate_literals'].append({'asset':u,'literal':x})
          ded=[]; seen=set()
          for x in out['candidate_literals']:
              key=(x['asset'],x['literal'])
              if key not in seen: seen.add(key); ded.append(x)
          out['candidate_literals']=ded[:2000]
          out['summary']={
              'root_success_count':sum(x.get('status')==200 for x in out['roots']),
              'js_asset_count':len(out['assets']),
              'candidate_literal_count':len(out['candidate_literals']),
              'target_literal_hit_count':len(out['target_literal_hits']),
              'policy':'SOURCE_EMITTED_CONTRACT_ONLY_NO_GUESSED_API_CALLS_NO_LOGIN_NO_AUTH_BYPASS'
          }
          Path('nlc-union-contract-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nlc-union-catalog-public-contract-probe
          path: nlc-union-contract-probe.json
          if-no-files-found: error
