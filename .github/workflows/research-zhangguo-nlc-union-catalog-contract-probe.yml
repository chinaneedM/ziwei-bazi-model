name: research-zhangguo-nlc-union-catalog-contract-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-zhangguo-nlc-union-catalog-contract-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact NLC result-emitted detail object
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.parse, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          URL='http://read.nlc.cn/allSearch/searchDetail?searchType=62&showType=3&indexName=data_467&fid=NJPX95-B1857'
          UA='Mozilla/5.0 research-contract-probe/1.4'
          req=urllib.request.Request(URL,headers={'User-Agent':UA,'Accept':'text/html,*/*','Referer':'http://read.nlc.cn/allSearch/searchList?searchType=62&showType=1&searchWord=%E5%BC%B5%E6%9E%9C%E6%98%9F%E5%AE%97'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=r.read(12_000_000); meta={'status':r.status,'final_url':r.geturl(),'content_type':r.headers.get('content-type'),'body_len':len(body),'sha256':hashlib.sha256(body).hexdigest()}
          except Exception as e:
              body=b''; meta={'error':f'{type(e).__name__}: {e}'}
          text=body.decode('utf-8','replace')

          class P(HTMLParser):
              def __init__(self): super().__init__(); self.visible=[]; self.links=[]; self.images=[]; self.cur=None
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='a': self.cur={'href':d.get('href'),'text':''}
                  if tag=='img': self.images.append({k:d.get(k) for k in ('src','alt','title') if d.get(k)})
              def handle_data(self,data):
                  s=data.strip()
                  if s: self.visible.append(s)
                  if self.cur is not None: self.cur['text']+=data
              def handle_endtag(self,tag):
                  if tag=='a' and self.cur is not None:
                      self.cur['text']=re.sub(r'\s+',' ',self.cur['text']).strip(); self.links.append(self.cur); self.cur=None
          p=P(); p.feed(text)
          visible=' | '.join(p.visible)
          terms=['新編評註通玄先生張果星宗大全','張果星宗','万历','萬曆','1593','1594','癸巳','甲午','唐謙','唐谦','金陵','南京','現藏','现藏','收藏','館藏','馆藏','亞非','亚非','SOAS','Morrison','周氏文光','文光','十卷','10卷','來源','来源','書號','书号','登錄號','登录号']
          contexts=[]
          for t in terms:
              pos=0
              while len(contexts)<80:
                  i=text.find(t,pos)
                  if i<0: break
                  contexts.append({'term':t,'context':html.unescape(re.sub(r'\s+',' ',text[max(0,i-1200):min(len(text),i+3200)]))})
                  pos=i+len(t)
          emitted=[]
          for a in p.links:
              href=a.get('href'); txt=a.get('text','')
              if href and (any(k in (href.lower()) for k in ('image','img','view','detail','book','resource','pdf','read')) or any(k in txt for k in ('书影','書影','查看','阅读','閱讀','图像','圖像'))):
                  emitted.append(a)
          out={'schema':'NLC-RARE-BOOK-UNION-CATALOG-DETAIL-NJPX95-B1857-R1','request_url':URL,'response':meta,
               'fid':'NJPX95-B1857','indexName':'data_467','visible_text':visible[:30000],
               'term_hits':{t:text.count(t) for t in terms if t in text},'contexts':contexts,
               'links':p.links[:300],'images':p.images[:300],'candidate_emitted_routes':emitted[:200],
               'policy':'FOLLOW_EXACT_FIRST_PARTY_SEARCH_RESULT_LINK_ONLY_NO_GUESSED_ENDPOINTS_NO_LOGIN_NO_AUTH_BYPASS'}
          Path('nlc-detail.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nlc-union-catalog-detail-NJPX95-B1857
          path: nlc-detail.json
          if-no-files-found: error
