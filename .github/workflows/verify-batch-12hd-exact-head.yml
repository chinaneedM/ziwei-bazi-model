name: verify-batch-12hd-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12hd-exact-head.yml
      - .github/workflows/verify-batch-12hc-exact-head.yml
      - docs/research/ZIWEI-SONG-YUNBIN-1950-0211-DING-HUIKANG-FUBAO-INTERMEDIARY-ROUTE-SCOPE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-SONG-YUNBIN-1950-0211-DING-HUIKANG-FUBAO-INTERMEDIARY-ROUTE-SCOPE-HD.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12HD exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-SONG-YUNBIN-1950-0211-DING-HUIKANG-FUBAO-INTERMEDIARY-ROUTE-SCOPE-HD'
          e=json.loads(Path('docs/research/ZIWEI-SONG-YUNBIN-1950-0211-DING-HUIKANG-FUBAO-INTERMEDIARY-ROUTE-SCOPE-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          d=e['diary_intermediary_statement']
          assert d['named_informant']=='赵万里（斐云）'
          assert d['intermediary_person']=='丁惠康'
          assert d['intermediary_relation']=='丁福保之子'
          assert d['ding_side_funding_amount']=='千万元'
          assert d['purchase_scope_wording']=='购铁琴铜剑楼书如干种'
          assert d['onward_donor_display']=='丁福保'
          rel=e['relation_to_hc']
          assert rel['same_underlying_six_book_event']=='STRONGLY_COMPATIBLE_NOT_PROVED'
          assert rel['hc_six_title_count_may_fill_hd_ruganzhong'] is False
          t=e['target_volume_firewall']
          assert t['target_in_ding_intermediary_purchase']=='UNRESOLVED'
          assert t['ding_family_target_intermediary']=='NOT_PROVED'
          assert t['target_specific_intermediary_route_selected'] is False
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,216,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc']=='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-SONG-YUNBIN-1950-0211-DING-HUIKANG-FUBAO-INTERMEDIARY-ROUTE-SCOPE-HD.md'
          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          src={x.get('source_id'):x for x in reg['sources']}
          assert src['EXT-SBKSC-SONG-YUNBIN-DIARY-1950-0211-TIEQIN-EXCERPT']['batch_12hd']['intermediary_person']=='丁惠康'
          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          PY
