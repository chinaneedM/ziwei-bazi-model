name: verify-tianwen-13ir-active-field-control
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13IR-*'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - 'scripts/verify-tianwen-13ir-active-field-control.py'
      - 'tests/test_tianwen_13ir_active_field_control.py'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/verify-tianwen-13ir-active-field-control.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13ir_active_field_control.py' -v
