name: research-kyushu-ogawa-shoushi-licheng-target-pages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/research-kyushu-ogawa-shoushi-licheng-target-pages.yml"
      - "scripts/research_kyushu_ogawa_shoushi_licheng_target_pages.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch directly bound Kyushu Ogawa target pages at native image size
        run: |
          python scripts/research_kyushu_ogawa_shoushi_licheng_target_pages.py \
            --output artifacts/kyushu-ogawa-target-pages
      - name: Upload no-OCR target pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyushu-ogawa-target-pages-${{ github.sha }}
          path: artifacts/kyushu-ogawa-target-pages/
          if-no-files-found: warn
          retention-days: 7
