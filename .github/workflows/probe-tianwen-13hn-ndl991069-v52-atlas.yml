name: probe-tianwen-13hn-ndl991069-v52-atlas
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/probe-tianwen-13hn-ndl991069-v52-atlas.py
      - .github/workflows/probe-tianwen-13hn-ndl991069-v52-atlas.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-v52-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test safe source-only IIIF parser
        run: python -m unittest discover -s tests -p 'test_tianwen_13hn_ndl991069_v52_atlas.py' -v
      - name: Download bounded source-issued previews
        run: python scripts/probe-tianwen-13hn-ndl991069-v52-atlas.py
      - name: Preserve SHA-bound image previews
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13hn-ndl991069-v52-atlas
          path: artifacts/13hn-ndl991069-v52/**
          if-no-files-found: error
