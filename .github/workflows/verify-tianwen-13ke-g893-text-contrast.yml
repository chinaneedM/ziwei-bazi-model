name: verify-tianwen-13ke-g893-text-contrast
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - docs/research/TIANWEN-13KE-*
      - scripts/verify-tianwen-13ke-g893-text-contrast.py
      - tests/test_tianwen_13ke_g893_text_contrast.py
      - .github/workflows/verify-tianwen-13ke-g893-text-contrast.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/verify-tianwen-13ke-g893-text-contrast.py
      - run: python scripts/verify-tianwen-13kd-g893-received-recurrence.py
      - run: python scripts/verify-tianwen-13kc-g893-five-row.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13ke_g893_text_contrast.py' -v
      - run: python scripts/verify-project-continuity-state-r1.py
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
