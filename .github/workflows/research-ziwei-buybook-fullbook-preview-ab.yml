name: research-ziwei-buybook-fullbook-preview-ab

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-buybook-fullbook-preview-ab.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch source-emitted Buybook preview images only
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path
          OUT=Path('probe'); IMG=OUT/'images'; OUT.mkdir(); IMG.mkdir()
          page='https://www.buybook.tw/book-0010746528.htm'
          ua='Mozilla/5.0 provenance-research public-preview'
          def get(url,referer=None):
            h={'User-Agent':ua,'Accept':'text/html,image/avif,image/webp,image/apng,image/*,*/*;q=0.8','Accept-Language':'zh-TW,zh;q=0.9,en;q=0.5'}
            if referer: h['Referer']=referer
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=35) as r:
                data=r.read(12_000_000)
                return r.status,r.geturl(),r.headers.get('content-type'),data,None
            except Exception as e: return None,url,None,b'',repr(e)
          status,final,ct,raw,err=get(page)
          txt=raw.decode('utf-8','replace') if raw else ''
          (OUT/'buybook.html').write_text(txt,encoding='utf-8')
          urls=[]
          for m in re.finditer(r'''(?:src|href|data-src|data-original|data-lazy-src|content)\s*=\s*["']([^"']+)["']''',txt,re.I):
            u=urllib.parse.urljoin(final or page,html.unescape(m.group(1)))
            if re.search(r'\.(?:jpe?g|png|webp)(?:\?|#|$)',u,re.I) and u not in urls: urls.append(u)
          # Restrict to page-emitted image URLs plausibly associated with this book/preview; generic tiny site chrome may be fetched but filtered by size.
          rows=[]
          for i,u in enumerate(urls,1):
            st,fu,ict,data,e=get(u,page)
            row={'url':u,'status':st,'content_type':ict,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest() if data else None,'error':e}
            magic=data[:3]==b'\xff\xd8\xff' or data[:8]==b'\x89PNG\r\n\x1a\n' or data[:4]==b'RIFF'
            if data and st==200 and magic and len(data)>25_000:
              ext='.png' if data[:8]==b'\x89PNG\r\n\x1a\n' else '.webp' if data[:4]==b'RIFF' else '.jpg'
              p=IMG/f'preview-{i:03d}{ext}'; p.write_bytes(data); row['saved_file']=str(p)
            rows.append(row)
          result={'schema':'ZIWEI-BUYBOOK-FULLBOOK-PREVIEW-AB-R1','access_date':'2026-09-09','page_url':page,'page_status':status,'page_bytes':len(raw),'page_sha256':hashlib.sha256(raw).hexdigest() if raw else None,'source_emitted_image_url_count':len(urls),'images':rows,'authentication_attempted':False,'purchase_attempted':False,'identifier_guessing_attempted':False,'access_control_bypass_attempted':False,'adjudication':{'visual_review_status':'PENDING_DIRECT_NO_OCR_REVIEW','target_page_status':'PENDING_DIRECT_NO_OCR_REVIEW','algorithm_effect':'NONE'}}
          (OUT/'buybook-preview-ab.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'page_status':status,'page_bytes':len(raw),'image_url_count':len(urls),'saved':[{'url':r['url'],'bytes':r['bytes'],'sha256':r['sha256'],'saved_file':r.get('saved_file')} for r in rows if r.get('saved_file')]},ensure_ascii=False,indent=2))
      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-buybook-fullbook-preview-ab
          path: probe/
          if-no-files-found: warn
          retention-days: 14
