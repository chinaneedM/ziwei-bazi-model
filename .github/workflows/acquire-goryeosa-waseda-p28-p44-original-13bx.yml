name: acquire-goryeosa-waseda-p28-p44-original-13bx
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-goryeosa-waseda-p28-p44-original-13bx.py
      - scripts/verify-goryeosa-waseda-p26-p27-original-13bx.py
      - tests/test_goryeosa_waseda_p26_p27_original_13bx.py
      - .github/workflows/acquire-goryeosa-waseda-p28-p44-original-13bx.yml
      - docs/research/TIANWEN-13BX-GORYEOSA-WASEDA-P26-P27-ORIGINAL-D39-D56-AND-EXTENDED-FOLIO-ATLAS-R1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-solar-table-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded original image handling
        run: python -m pip install 'Pillow>=10,<12' 'PyMuPDF>=1.24,<2'
      - name: Validate immutable source and forward-only state
        run: |
          python scripts/verify-goryeosa-waseda-p26-p27-original-13bx.py
          python -m unittest discover -s tests -p 'test_goryeosa_waseda_p26_p27_original_13bx.py' -v
      - name: Acquire only official source JPEGs p28-p44 with bounded receipt
        run: python scripts/acquire-goryeosa-waseda-p28-p44-original-13bx.py
      - name: Archive original source bytes and receipt even on access failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goryeosa-13bx-waseda-p28-p44-original-atlas
          path: goryeosa-waseda-13bx-original-atlas/
          retention-days: 30
          if-no-files-found: warn
