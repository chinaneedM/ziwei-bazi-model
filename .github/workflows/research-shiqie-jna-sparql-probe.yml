name: research-shiqie-jna-sparql-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-jna-sparql-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render contact sheets from literal thumbnails in exact fascicle-3 IIIF manifest
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import hashlib, io, json, urllib.request
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps

          manifest_url='https://www.digital.archives.go.jp/api/iiif/4756821/manifest.json'
          ua='ziwei-bazi-model historical-provenance research/2.6 (+exact-public-IIIF-thumbnails)'
          req=urllib.request.Request(manifest_url,headers={'User-Agent':ua,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=45) as r:
              body=r.read(20_000_000); status=r.status; ctype=r.headers.get('content-type')
          data=json.loads(body.decode('utf-8'))
          canvases=data['sequences'][0]['canvases']
          assert len(canvases)==69
          Path('fascicle3-manifest.json').write_bytes(body)
          Path('thumbs').mkdir(); Path('sheets').mkdir()
          records=[]; thumbs=[]
          for i,c in enumerate(canvases,1):
              thumb_url=c['thumbnail']['@id']
              label=str(c.get('label') or f'page{i}')
              # URL is consumed exactly as emitted by the official manifest.
              treq=urllib.request.Request(thumb_url,headers={'User-Agent':ua,'Accept':'image/*,*/*;q=0.5'})
              with urllib.request.urlopen(treq,timeout=30) as r:
                  b=r.read(8_000_000); ts=r.status; tct=r.headers.get('content-type'); final=r.geturl()
              p=Path('thumbs')/f'p{i:02d}.jpg'; p.write_bytes(b)
              im=Image.open(io.BytesIO(b)).convert('RGB')
              records.append({'index':i,'canvas_id':c.get('@id'),'canvas_label':label,'thumbnail_url':thumb_url,'thumbnail_final_url':final,'status':ts,'content_type':tct,'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'image_size':[im.width,im.height]})
              thumbs.append((i,label,im.copy()))

          # Four legible sheets: 1-18, 19-36, 37-54, 55-69.
          groups=[(1,18),(19,36),(37,54),(55,69)]
          for start,end in groups:
              subset=[t for t in thumbs if start <= t[0] <= end]
              cells=[]
              for idx,label,im in subset:
                  im.thumbnail((420,320))
                  canvas=Image.new('RGB',(440,365),'white')
                  x=(440-im.width)//2; y=8
                  canvas.paste(im,(x,y))
                  ImageDraw.Draw(canvas).text((8,338),f'p{idx:02d} {label}',fill='black')
                  cells.append(canvas)
              cols=3; rows=(len(cells)+cols-1)//cols
              sheet=Image.new('RGB',(cols*440,rows*365),'white')
              for j,cell in enumerate(cells): sheet.paste(cell,((j%cols)*440,(j//cols)*365))
              sheet.save(Path('sheets')/f'contact-p{start:02d}-{end:02d}.jpg',quality=92)

          out={'schema':'SHIQIE-JNA-FASCICLE3-IIIF-THUMBNAIL-CONTACT-R1','manifest_url':manifest_url,'manifest_status':status,'manifest_content_type':ctype,'manifest_sha256':hashlib.sha256(body).hexdigest(),'canvas_count':len(canvases),'pages':records,'policy':'ALL PAGE URLS ARE LITERAL thumbnail.@id VALUES FROM THE EXACT OFFICIAL FASCICLE-3 IIIF MANIFEST; NO URL/ID DERIVATION; THUMBNAILS ARE LOCATORS ONLY, NOT FINAL GLYPH AUTHORITY'}
          Path('thumbnail-manifest.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'canvas_count':len(canvases),'manifest_sha256':out['manifest_sha256'],'sheets':[f'{a}-{b}' for a,b in groups]},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-jna-fascicle3-contact-sheets
          path: |
            fascicle3-manifest.json
            thumbnail-manifest.json
            sheets/*.jpg
            thumbs/*.jpg
          if-no-files-found: error
