name: research-shiqie-jna-sparql-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-jna-sparql-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive full public Shidian page order for fascicle 3
        run: |
          python - <<'PY'
          import hashlib, json, re, urllib.request, urllib.error
          from pathlib import Path

          url='https://www.shidianguji.com/zh/book/NA06425/chapter/1m44zy4jwa4ab'
          chapter='1m44zy4jwa4ab'
          target_page='7640563520069697576'
          target_paragraph='7649191097545588762'
          ua='Mozilla/5.0 ziwei-bazi-model historical-provenance research/2.9'
          req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'text/html,*/*'})
          with urllib.request.urlopen(req,timeout=45) as r:
              body=r.read(8_000_000); status=r.status; final=r.geturl(); ctype=r.headers.get('content-type')
          text=body.decode('utf-8','replace')
          Path('shidian-fascicle3.html').write_text(text,encoding='utf-8')

          # Parse structured SSR paragraph records only. The fields after the encoded
          # content string are stable JSON literals: start/endPageId, chapterId,
          # inChapterOrder. No private endpoint or object-id inference is used.
          pat=re.compile(
              r'\{"paragraphId":"(?P<pid>\d+)","paragraphType":\d+,"content":".*?",'
              r'"startPageId":"(?P<start>\d+)","endPageId":"(?P<end>\d+)".*?'
              r'"chapterId":"(?P<chapter>[^"]+)".*?"inChapterOrder":(?P<order>\d+)',
              re.S
          )
          rows=[]
          for m in pat.finditer(text):
              if m.group('chapter')==chapter:
                  rows.append({'paragraph_id':m.group('pid'),'start_page_id':m.group('start'),'end_page_id':m.group('end'),'in_chapter_order':int(m.group('order'))})
          # Fallback narrower matcher in case paragraph content contains sequences that defeat .*?.
          if not rows:
              p2=re.compile(r'"paragraphId":"(\d+)".*?"startPageId":"(\d+)".*?"endPageId":"(\d+)".*?"chapterId":"([^"]+)".*?"inChapterOrder":(\d+)',re.S)
              for m in p2.finditer(text):
                  if m.group(4)==chapter:
                      rows.append({'paragraph_id':m.group(1),'start_page_id':m.group(2),'end_page_id':m.group(3),'in_chapter_order':int(m.group(5))})
          # Deduplicate identical paragraph captures, then sort by explicit chapter order.
          by_pid={}
          for r in rows: by_pid.setdefault(r['paragraph_id'],r)
          rows=sorted(by_pid.values(),key=lambda r:r['in_chapter_order'])
          ordered_pages=[]
          for r in rows:
              for pid in (r['start_page_id'],r['end_page_id']):
                  if pid and (not ordered_pages or ordered_pages[-1]!=pid):
                      # endPage can repeat start; only append when page transition occurs.
                      if pid not in ordered_pages: ordered_pages.append(pid)
          # Independent literal pagePass sequence for cross-check.
          pagepass=re.findall(r'\\"pagePass\\":\{\\"PageId\\":\\"(\d+)\\"\}',text)
          pagepass_unique=[]
          for p in pagepass:
              if p not in pagepass_unique: pagepass_unique.append(p)
          target_row=next((r for r in rows if r['paragraph_id']==target_paragraph),None)
          out={
            'schema':'SHIQIE-SHIDIAN-FASCICLE3-PUBLIC-PAGE-ORDER-R1',
            'source_url':url,'status':status,'final_url':final,'content_type':ctype,'body_len':len(body),'sha256':hashlib.sha256(body).hexdigest(),
            'chapter_id':chapter,'paragraph_count':len(rows),'ordered_unique_page_count':len(ordered_pages),'ordered_page_ids':ordered_pages,
            'pagepass_unique_count':len(pagepass_unique),'pagepass_unique_ids':pagepass_unique,
            'target_page_id':target_page,'target_page_ordinal_1_based':(ordered_pages.index(target_page)+1 if target_page in ordered_pages else None),
            'target_paragraph_id':target_paragraph,'target_paragraph_row':target_row,
            'official_jna_fascicle3_canvas_count_control':69,
            'page_count_matches_official_manifest':len(ordered_pages)==69,
            'policy':'PUBLIC SHIDIAN HTML SSR ONLY; PAGE IDS ARE LOCATORS, NOT GLYPH AUTHORITY; NO LOGIN, PRIVATE API, IMAGE-ID GUESSING, OR ACCESS BYPASS; OFFICIAL JNA CANVAS MAPPING AUTHORIZED ONLY IF THE COMPLETE PAGE COUNT/ORDER CONTROL CLOSES.'
          }
          Path('shidian-fascicle3-page-order.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-shidian-fascicle3-page-order
          path: |
            shidian-fascicle3-page-order.json
            shidian-fascicle3.html
          if-no-files-found: error
