name: research-shiqie-jna-sparql-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-jna-sparql-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact public image contracts for one manifest-listed page
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request, urllib.error
          from pathlib import Path

          manifest_url='https://www.digital.archives.go.jp/api/iiif/4756821/manifest.json'
          item_url='https://www.digital.archives.go.jp/item/4756821'
          ua='Mozilla/5.0 ziwei-bazi-model historical-provenance research/2.7'
          mreq=urllib.request.Request(manifest_url,headers={'User-Agent':ua,'Accept':'application/json','Referer':item_url})
          with urllib.request.urlopen(mreq,timeout=45) as r:
              mbody=r.read(20_000_000); mstatus=r.status; mctype=r.headers.get('content-type')
          data=json.loads(mbody.decode('utf-8'))
          c=data['sequences'][0]['canvases'][0]
          resource_url=c['images'][0]['resource']['@id']
          service_url=c['images'][0]['resource']['service']['@id']
          tests={
            'literal_resource': resource_url,
            'service_info': service_url.rstrip('/') + '/info.json',
            'service_1200': service_url.rstrip('/') + '/full/1200,/0/default.jpg',
          }
          outdir=Path('page1-contracts'); outdir.mkdir()
          result={
            'schema':'SHIQIE-JNA-FASCICLE3-PAGE1-IMAGE-CONTRACT-PROBE-R1',
            'manifest_url':manifest_url,'manifest_status':mstatus,'manifest_content_type':mctype,
            'manifest_sha256':hashlib.sha256(mbody).hexdigest(),
            'item_referer':item_url,
            'canvas_id':c.get('@id'),'canvas_label':c.get('label'),
            'literal_resource_url':resource_url,'literal_service_id':service_url,
            'tests':{},
            'policy':'PAGE/RESOURCE/SERVICE IDS COME ONLY FROM THE EXACT OFFICIAL FASCICLE-3 MANIFEST. service_info AND service_1200 ARE STANDARD IIIF IMAGE API v2 TRANSFORMATIONS OF THE MANIFEST-DECLARED SERVICE ID, NOT OBJECT-ID GUESSING. REFERER IS THE PUBLIC ITEM PAGE FOR NORMAL PUBLIC NAVIGATION; NO LOGIN, TOKEN, COOKIE, OR ACCESS BYPASS.'
          }
          for name,url in tests.items():
              headers={'User-Agent':ua,'Referer':item_url,'Accept':'application/json,*/*;q=0.5' if name=='service_info' else 'image/*,*/*;q=0.5'}
              req=urllib.request.Request(url,headers=headers)
              status=None; final=url; ctype=None; body=b''; error=None
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:
                      status=r.status; final=r.geturl(); ctype=r.headers.get('content-type'); body=r.read(30_000_000)
              except urllib.error.HTTPError as e:
                  status=e.code; final=e.geturl(); ctype=e.headers.get('content-type'); body=e.read(2_000_000); error=str(e)
              except Exception as e:
                  error=repr(e)
              ext='.json' if name=='service_info' else '.bin'
              (outdir/f'{name}{ext}').write_bytes(body)
              result['tests'][name]={'url':url,'status':status,'final_url':final,'content_type':ctype,'body_len':len(body),'sha256':hashlib.sha256(body).hexdigest(),'error':error,'body_prefix':body[:500].decode('utf-8','replace') if ctype and ('text' in ctype or 'json' in ctype) else None}
          Path('page1-contract-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-jna-page1-image-contracts
          path: |
            page1-contract-probe.json
            page1-contracts/*
          if-no-files-found: error
