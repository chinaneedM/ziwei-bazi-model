name: research-shiqie-jna-sparql-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-jna-sparql-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query Japan Search documented public item-search API
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          endpoint='https://jpsearch.go.jp/api/item/search/jps-cross'
          terms={
            'exact_title_traditional':'筮篋理數日抄',
            'exact_title_japanese':'筮篋理数日抄',
            'title_fragment':'理数日抄',
            'catalog_ascii':'子060-0002',
            'catalog_fullwidth':'子０６０－０００２',
          }
          ua='ziwei-bazi-model historical-provenance research/2.3 (+Japan-Search-public-API)'
          outdir=Path('jps-search'); outdir.mkdir()
          manifest={'schema':'SHIQIE-JAPAN-SEARCH-PUBLIC-API-PROBE-R1','endpoint':endpoint,'queries':{},'policy':'DOCUMENTED JAPAN SEARCH PUBLIC API ONLY; EXACT TITLE/CATALOG TERMS; FOLLOW ONLY SOURCE LINKS AND ITEM IDS RETURNED BY API; NO GUESSING'}
          for name,term in terms.items():
              url=endpoint+'?'+urllib.parse.urlencode({'keyword':term,'size':'100'})
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json'})
              status=None; final=url; ctype=None; body=b''; error=None
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      status=r.status; final=r.geturl(); ctype=r.headers.get('content-type'); body=r.read(8_000_000)
              except urllib.error.HTTPError as e:
                  status=e.code; final=e.geturl(); ctype=e.headers.get('content-type'); body=e.read(2_000_000); error=str(e)
              except Exception as e:
                  error=repr(e)
              text=body.decode('utf-8','replace')
              (outdir/f'{name}.json').write_text(text,encoding='utf-8')
              rec={'term':term,'status':status,'final_url':final,'content_type':ctype,'body_len':len(body),'error':error}
              try:
                  data=json.loads(text)
                  rec['hit']=data.get('hit')
                  items=data.get('list',[]) if isinstance(data,dict) else []
                  compact=[]
                  for item in items[:100]:
                      common=item.get('common',{}) if isinstance(item,dict) else {}
                      compact.append({
                        'id':item.get('id'),
                        'title':common.get('title'),
                        'database':common.get('database'),
                        'ownerOrg':common.get('ownerOrg'),
                        'sourceInfo':common.get('sourceInfo'),
                        'contents':common.get('contents'),
                        'url':common.get('url'),
                        'thumbnailUrl':common.get('thumbnailUrl'),
                        'raw_keys':[k for k in item.keys() if k not in ('common','rdfindex')][:20],
                      })
                  rec['items']=compact
              except Exception as exc:
                  rec['parse_error']=repr(exc); rec['body_prefix']=text[:2000]
              manifest['queries'][name]=rec
          Path('jps-search-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-japan-search-public-api-probe
          path: |
            jps-search-manifest.json
            jps-search/*
          if-no-files-found: error
