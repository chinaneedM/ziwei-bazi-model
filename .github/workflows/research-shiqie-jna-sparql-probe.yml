name: research-shiqie-jna-sparql-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-jna-sparql-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact National Archives fascicle-3 IIIF manifest returned by Japan Search
        run: |
          python - <<'PY'
          import hashlib, json, re, urllib.request, urllib.error
          from pathlib import Path

          url='https://www.digital.archives.go.jp/api/iiif/4756821/manifest.json'
          ua='ziwei-bazi-model historical-provenance research/2.5 (+exact-public-IIIF)'
          req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json, application/ld+json;q=0.9, */*;q=0.1'})
          status=None; final=url; ctype=None; body=b''; error=None
          try:
              with urllib.request.urlopen(req,timeout=45) as r:
                  status=r.status; final=r.geturl(); ctype=r.headers.get('content-type'); body=r.read(20_000_000)
          except urllib.error.HTTPError as e:
              status=e.code; final=e.geturl(); ctype=e.headers.get('content-type'); body=e.read(4_000_000); error=str(e)
          except Exception as e:
              error=repr(e)
          Path('fascicle3-manifest.raw').write_bytes(body)
          text=body.decode('utf-8','replace')
          Path('fascicle3-manifest.json').write_text(text,encoding='utf-8')
          out={'schema':'SHIQIE-JNA-FASCICLE3-IIIF-MANIFEST-PROBE-R1','source_item_url':'https://www.digital.archives.go.jp/item/4756821','manifest_url':url,'status':status,'final_url':final,'content_type':ctype,'body_len':len(body),'sha256':hashlib.sha256(body).hexdigest(),'error':error,'policy':'EXACT IIIF URL LITERALLY RETURNED BY OFFICIAL JAPAN SEARCH ITEM API FOR 筮篋理数日抄３; NO ADJACENT-ID OR PAGE-URL GUESSING'}
          try:
              data=json.loads(text)
              out['top_level_keys']=list(data.keys()) if isinstance(data,dict) else []
              seqs=data.get('sequences',[]) if isinstance(data,dict) else []
              canvases=[]
              if seqs and isinstance(seqs[0],dict): canvases=seqs[0].get('canvases',[]) or []
              if not canvases and isinstance(data,dict): canvases=data.get('items',[]) or []
              out['canvas_count']=len(canvases)
              compact=[]
              for i,c in enumerate(canvases):
                  rec={'index':i+1,'id':c.get('@id') or c.get('id'),'label':c.get('label'),'height':c.get('height'),'width':c.get('width')}
                  urls=[]
                  def walk(x,path='$'):
                      if isinstance(x,dict):
                          for k,v in x.items():
                              p=f'{path}.{k}'
                              if isinstance(v,(dict,list)): walk(v,p)
                              elif isinstance(v,str) and (v.startswith('http://') or v.startswith('https://')):
                                  urls.append({'path':p,'value':v})
                      elif isinstance(x,list):
                          for j,v in enumerate(x): walk(v,f'{path}[{j}]')
                  walk(c)
                  dedup=[]; seen=set()
                  for u in urls:
                      key=(u['path'],u['value'])
                      if key not in seen: seen.add(key); dedup.append(u)
                  rec['literal_urls']=dedup
                  compact.append(rec)
              out['canvases']=compact
          except Exception as exc:
              out['parse_error']=repr(exc); out['body_prefix']=text[:4000]
          Path('fascicle3-manifest-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-jna-fascicle3-iiif-manifest
          path: |
            fascicle3-manifest.raw
            fascicle3-manifest.json
            fascicle3-manifest-summary.json
          if-no-files-found: error
