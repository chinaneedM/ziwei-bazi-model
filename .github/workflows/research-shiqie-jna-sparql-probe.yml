name: research-shiqie-jna-sparql-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-jna-sparql-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for ordinary public-viewer access test
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test literal National Archives public item route in a normal browser
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from playwright.sync_api import sync_playwright

          # This URL was returned literally by the documented Japan Search item record.
          # Do not derive or enumerate /img/, canvas, content, or adjacent object ids.
          item_url='https://www.digital.archives.go.jp/item/4756821'
          outdir=Path('jna-browser-route'); outdir.mkdir()
          result={
            'schema':'SHIQIE-JNA-PUBLIC-BROWSER-ROUTE-PROBE-R1',
            'item_url':item_url,
            'policy':'ORDINARY PUBLIC BROWSER NAVIGATION ONLY. ITEM URL IS A LITERAL FIRST-PARTY LINK ALREADY RETURNED BY JAPAN SEARCH. FOLLOW ONLY HREF/SRC VALUES EMITTED BY THE PUBLIC PAGE. NO LOGIN, TOKEN, COOKIE INJECTION, ID DERIVATION, ADJACENT-ID ENUMERATION, OR ACCESS-BYPASS TECHNIQUE.',
            'item':{}, 'viewer':None, 'network':[]
          }

          def compact_page(page):
              anchors=[]
              for a in page.locator('a').all():
                  try:
                      href=a.get_attribute('href')
                      text=' '.join((a.inner_text(timeout=1000) or '').split())[:160]
                      if href:
                          anchors.append({'text':text,'href':href,'absolute':urljoin(page.url,href)})
                  except Exception:
                      pass
              images=[]
              for im in page.locator('img').all():
                  try:
                      src=im.get_attribute('src')
                      if src:
                          images.append({'alt':(im.get_attribute('alt') or '')[:160],'src':src,'absolute':urljoin(page.url,src)})
                  except Exception:
                      pass
              buttons=[]
              for b in page.locator('button').all():
                  try:
                      buttons.append(' '.join((b.inner_text(timeout=1000) or '').split())[:160])
                  except Exception:
                      pass
              return {'url':page.url,'title':page.title(),'anchors':anchors,'images':images,'buttons':buttons}

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(
                  viewport={'width':1440,'height':1200},
                  locale='ja-JP',
                  user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
              )
              page=context.new_page()
              network=[]
              def on_response(resp):
                  try:
                      ct=resp.headers.get('content-type','')
                      u=resp.url
                      if 'digital.archives.go.jp' in u:
                          network.append({'url':u,'status':resp.status,'content_type':ct})
                  except Exception:
                      pass
              page.on('response',on_response)

              item_response=None
              error=None
              try:
                  item_response=page.goto(item_url,wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_timeout(8000)
              except Exception as exc:
                  error=repr(exc)
              result['item']={'navigation_status':item_response.status if item_response else None,'error':error,**compact_page(page)}
              page.screenshot(path=str(outdir/'item-page.png'),full_page=True)
              (outdir/'item-page.html').write_text(page.content(),encoding='utf-8')

              # Follow only a viewer link literally emitted by the first-party public page.
              candidates=[]
              for a in result['item']['anchors']:
                  absolute=a['absolute']
                  if urlparse(absolute).netloc!='www.digital.archives.go.jp':
                      continue
                  blob=(a['text']+' '+a['href']).lower()
                  if '/img/' in a['href'] or 'ビューア' in a['text'] or '画像' in a['text'] or 'viewer' in blob:
                      if absolute not in candidates:
                          candidates.append(absolute)
              result['item']['literal_viewer_candidates']=candidates

              if candidates:
                  viewer_url=candidates[0]
                  viewer_response=None; viewer_error=None
                  try:
                      viewer_response=page.goto(viewer_url,wait_until='domcontentloaded',timeout=60000)
                      page.wait_for_timeout(10000)
                  except Exception as exc:
                      viewer_error=repr(exc)
                  result['viewer']={'literal_url_followed':viewer_url,'navigation_status':viewer_response.status if viewer_response else None,'error':viewer_error,**compact_page(page)}
                  page.screenshot(path=str(outdir/'viewer-page.png'),full_page=True)
                  (outdir/'viewer-page.html').write_text(page.content(),encoding='utf-8')

              browser.close()
              # Deduplicate exact response tuples while preserving order.
              seen=set(); compact=[]
              for r in network:
                  key=(r['url'],r['status'],r['content_type'])
                  if key not in seen:
                      seen.add(key); compact.append(r)
              result['network']=compact
              result['successful_image_responses']=[r for r in compact if r['status']==200 and r['content_type'].lower().startswith('image/')]

          Path('jna-public-browser-route.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({
            'item_status':result['item'].get('navigation_status'),
            'item_final_url':result['item'].get('url'),
            'viewer_candidates':result['item'].get('literal_viewer_candidates'),
            'viewer_status':result['viewer'].get('navigation_status') if result['viewer'] else None,
            'viewer_final_url':result['viewer'].get('url') if result['viewer'] else None,
            'successful_image_response_count':len(result['successful_image_responses']),
          },ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-jna-public-browser-route
          path: |
            jna-public-browser-route.json
            jna-browser-route/*
          if-no-files-found: error
