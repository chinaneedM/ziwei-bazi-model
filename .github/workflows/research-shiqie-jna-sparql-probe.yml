name: research-shiqie-jna-sparql-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-shiqie-jna-sparql-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Japan Search for page-level or OCR target records
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          endpoint='https://jpsearch.go.jp/api/item/search/jps-cross'
          terms={
            'boundary_heading':'論子時隔界',
            'anomaly_token':'上四亥',
            'section_heading':'選時寶鏡局',
            'opening_sentence':'日百刻配十二時',
            'canvas_label':'C103347219500',
            'scan_stem':'M2021052512424615606',
          }
          ua='ziwei-bazi-model historical-provenance research/2.8 (+Japan-Search-page-target)'
          result={'schema':'SHIQIE-JAPAN-SEARCH-PAGE-TARGET-PROBE-R1','endpoint':endpoint,'queries':{},'policy':'DOCUMENTED PUBLIC JAPAN SEARCH API ONLY; TARGET TEXT/CANVAS LITERALS ALREADY ESTABLISHED FROM PUBLIC TRANSCRIPTION OR OFFICIAL MANIFEST; NO ID GUESSING'}
          outdir=Path('jps-target'); outdir.mkdir()
          for name,term in terms.items():
              url=endpoint+'?'+urllib.parse.urlencode({'keyword':term,'size':'100'})
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json'})
              status=None; ctype=None; body=b''; error=None
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      status=r.status; ctype=r.headers.get('content-type'); body=r.read(8_000_000)
              except urllib.error.HTTPError as e:
                  status=e.code; ctype=e.headers.get('content-type'); body=e.read(2_000_000); error=str(e)
              except Exception as e:
                  error=repr(e)
              text=body.decode('utf-8','replace')
              (outdir/f'{name}.json').write_text(text,encoding='utf-8')
              rec={'term':term,'status':status,'content_type':ctype,'body_len':len(body),'error':error}
              try:
                  data=json.loads(text); items=data.get('list',[]) if isinstance(data,dict) else []
                  rec['hit']=data.get('hit') if isinstance(data,dict) else None
                  compact=[]
                  for item in items[:100]:
                      common=item.get('common',{}) if isinstance(item,dict) else {}
                      compact.append({'id':item.get('id'),'title':common.get('title'),'database':common.get('database'),'ownerOrg':common.get('ownerOrg'),'contents':common.get('contents'),'url':common.get('url'),'thumbnailUrl':common.get('thumbnailUrl')})
                  rec['items']=compact
              except Exception as exc:
                  rec['parse_error']=repr(exc); rec['body_prefix']=text[:1000]
              result['queries'][name]=rec
          Path('jps-target-manifest.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shiqie-japan-search-page-target
          path: |
            jps-target-manifest.json
            jps-target/*
          if-no-files-found: error
