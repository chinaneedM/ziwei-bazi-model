name: verify-yehuobian-12vb-registry-growth-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12vb-registry-growth-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - tests/test_yehuobian_npm_jinxiang_12ux.py
      - tests/test_yehuobian_1959_2019_historigraphy_12va.py
      - scripts/verify-yehuobian-1959-2019-historiography-12va.py
      - tests/test_yehuobian_registry_growth_12vb.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Continuity, source shards and genealogy
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Current and historical source count guards
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-1959-2019-historiography-12va.py
          python scripts/verify-yehuobian-npm-jinxiang-12ux.py
          python -m unittest discover -s tests -p 'test_yehuobian_npm_jinxiang_12ux.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_1959_2019_historigraphy_12va.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_registry_growth_12vb.py' -v
