name: verify-batch-12jj-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12jj-exact-head.yml
      - .github/workflows/probe-batch-12jj-zhao-wenhui-1951-sass-holding.yml
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-ZHAO-WANLI-WENHUIBAO-1951-0818-SASS-HOLDING-ROUTE-JJ.md
      - docs/research/ZIWEI-ZHAO-WANLI-WENHUIBAO-1951-0818-SASS-HOLDING-ROUTE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending JJ status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'tianwen/batch-12jj-exact-head', description: 'Batch 12JJ exact-head verification running'})
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12JJ exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-ZHAO-WANLI-WENHUIBAO-1951-0818-SASS-HOLDING-ROUTE-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-ZHAO-WANLI-WENHUIBAO-1951-0818-SASS-HOLDING-ROUTE-JJ'
          assert e['controlling_probe']['workflow_run_id']==36828765852
          assert e['controlling_probe']['artifact_id']==11146151782
          assert e['sass_first_party_holding']['shanghai_wenhui_1951_full_year'] is True
          assert e['sass_first_party_holding']['hongkong_wenhui_separately_listed'] is True
          assert e['sass_first_party_holding']['shanghai_vs_hongkong_disambiguation_closed'] is True
          assert e['tsinghua_retrospective_control']['article_title_present'] is True
          assert e['tsinghua_retrospective_control']['august_18_present'] is False
          assert e['tsinghua_retrospective_control']['wenhui_present'] is False
          assert e['adjudication']['publication_1951_08_18_shanghai_wenhui']=='SECONDARY_LEAD_UNVERIFIED_BY_PRIMARY_PAGE'
          assert e['adjudication']['target_1951_08_18_issue_directly_reviewed'] is False
          assert e['adjudication']['relationship_wenhui_to_wenwu_issue9']=='UNRESOLVED'
          assert e['adjudication']['direct_2011_p197']=='NOT_REVIEWED'
          assert e['transmission_impact']['status']=='NONE'
          assert e['project_consequence']['product_change'] is False
          PY
      - name: Publish success JJ status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'success', context: 'tianwen/batch-12jj-exact-head', description: 'Batch 12JJ exact-head verification passed'})
      - name: Publish failure JJ status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'failure', context: 'tianwen/batch-12jj-exact-head', description: 'Batch 12JJ exact-head verification failed'})
