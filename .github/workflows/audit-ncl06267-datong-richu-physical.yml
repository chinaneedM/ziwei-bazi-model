name: audit-ncl06267-datong-richu-physical

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-ncl06267-datong-richu-physical.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical provenance baseline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
      - name: Install PDF rendering tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdfinfo
          command -v pdftoppm
      - name: Acquire render and deduplicate NCL-06267 physical facsimile
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/ncl06267-datong-richu'
          mkdir -p "$ROOT/pages"
          API='https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo&iiprop=url|size|sha1&titles=File%3ANCL-06267%20%E5%A4%A7%E7%B5%B1%E6%97%A5%E5%87%BA%E5%88%86.pdf'
          curl -L --fail --retry 3 -A 'Tianwen-Provenance-Audit/1.0' "$API" -o "$ROOT/commons-api.json"
          URL="$(python - <<'PY'
          import json
          j=json.load(open('audit/ncl06267-datong-richu/commons-api.json',encoding='utf-8'))
          page=next(iter(j.get('query',{}).get('pages',{}).values()))
          info=page.get('imageinfo') or []
          if not info: raise SystemExit('no imageinfo')
          print(info[0]['url'])
          PY
          )"
          printf '%s\n' "$URL" | tee "$ROOT/resolved-url.txt"
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/NCL-06267-datong-richu.pdf"
          head -c 5 "$ROOT/NCL-06267-datong-richu.pdf" | grep -q '%PDF-'
          sha256sum "$ROOT/NCL-06267-datong-richu.pdf" | tee "$ROOT/pdf.sha256"
          ACTUAL_SHA="$(sha256sum "$ROOT/NCL-06267-datong-richu.pdf" | awk '{print $1}')"
          PRIOR_BATCH_12CG_SHA='0d3ed2b54f92b5eb2f11e5d06babebcc177e04ec5b8c7168b56f1fb25f94797d'
          test "$ACTUAL_SHA" = "$PRIOR_BATCH_12CG_SHA"
          pdfinfo "$ROOT/NCL-06267-datong-richu.pdf" | tee "$ROOT/pdfinfo.txt"
          PAGES="$(awk '/^Pages:/ {print $2}' "$ROOT/pdfinfo.txt")"
          test "$PAGES" = '21'
          for i in $(seq 1 "$PAGES"); do
            out="$ROOT/pages/page-$(printf '%02d' "$i")"
            timeout 45 pdftoppm -f "$i" -l "$i" -singlefile -jpeg -jpegopt quality=88 -r 110 "$ROOT/NCL-06267-datong-richu.pdf" "$out" >/dev/null 2>&1
          done
          COUNT="$(find "$ROOT/pages" -type f -name 'page-*.jpg' | wc -l | tr -d ' ')"
          test "$COUNT" = "$PAGES"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('audit/ncl06267-datong-richu'); pdf=root/'NCL-06267-datong-richu.pdf'; pages=sorted((root/'pages').glob('page-*.jpg'))
          prior_sha='0d3ed2b54f92b5eb2f11e5d06babebcc177e04ec5b8c7168b56f1fb25f94797d'
          actual_sha=hashlib.sha256(pdf.read_bytes()).hexdigest()
          report={
            'schema':'NCL06267-DATONG-RICHU-PHYSICAL-DEDUP-R5',
            'resolved_source_url':(root/'resolved-url.txt').read_text().strip(),
            'source_id':'EXT-NCL-DATONG-RICHU-NCL06267',
            'title':'大統日出分',
            'pdf_bytes':pdf.stat().st_size,
            'pdf_sha256':actual_sha,
            'rendered_page_count':len(pages),
            'rendered_pages':[{'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in pages],
            'prior_batch':'BATCH-12-ZIWEI-DATONG-RICHU-DAILY-TABLE-SANMING-MULTIPOINT-REPLAY-CG',
            'prior_source_id':'EXT-NCL-DATONG-RICHU-NCL06267',
            'prior_pdf_sha256':prior_sha,
            'same_pdf_as_batch_12cg':actual_sha == prior_sha,
            'independent_physical_witness_increment':0,
            'transmission_impact':'NONE',
            'ocr_used_for_glyph_or_numeric_claims':False,
            'adjudication_rule':'Exact PDF identity with Batch 12CG proves this route is a duplicate digital surrogate, not a new independent physical witness. Numerical/glyph claims remain bound to direct visual review.'
          }
          if not report['same_pdf_as_batch_12cg']:
              raise SystemExit('NCL-06267 PDF identity diverged from Batch 12CG')
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:report[k] for k in ['source_id','pdf_sha256','rendered_page_count','same_pdf_as_batch_12cg','independent_physical_witness_increment','transmission_impact']},indent=2))
          PY
      - name: Upload NCL-06267 physical dedup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncl06267-datong-richu-physical-dedup-r5
          path: audit/ncl06267-datong-richu
          if-no-files-found: error
          retention-days: 30
