name: acquire-nlc-goryeosa-group40-13q
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - docs/research/TIANWEN-13Q-NLC-GORYEOSA-WORK52-GROUP40-R1.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF rasterizer
        run: python -m pip install 'PyMuPDF>=1.24,<1.28' 'Pillow>=10,<12'
      - name: Download original public PDF and hash/thumbnail all 64 pages
        run: python scripts/acquire-nlc-goryeosa-group40-13q.py --output goryeosa-13q-evidence
      - name: Archive original PDF and image/receipt evidence
        uses: actions/upload-artifact@v4
        with:
          name: goryeosa-group40-original-pdf-13q
          path: goryeosa-13q-evidence/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
