name: verify-tianwen-13gs-ncl-p74-original-geometry
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/verify-tianwen-13gs-original-column-geometry.py --output-dir /tmp/13gs
      - run: python -m unittest discover -s tests -p 'test_tianwen_13gs*' -v
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13gs-p74-original-geometric-regions
          path: /tmp/13gs/
          if-no-files-found: error
          retention-days: 30
