name: probe-batch-12jd-zheng-yongle-date-conflict
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12jd-zheng-yongle-date-conflict.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text-layer parser
        run: python -m pip install pypdf
      - name: Probe NLC official records and source-emitted newspaper month route
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, html, json, re, urllib.error, urllib.request
          from pathlib import Path
          from urllib.parse import urljoin
          from pypdf import PdfReader

          UA="Mozilla/5.0 (compatible; TianwenHistoricalAudit/1.0; +https://github.com/chinaneedM/ziwei-bazi-model)"
          out=Path("artifacts/batch-12jd"); out.mkdir(parents=True,exist_ok=True)

          def get(url, binary=False):
              req=urllib.request.Request(url,headers={"User-Agent":UA})
              with urllib.request.urlopen(req,timeout=45) as resp:
                  body=resp.read()
                  return resp.status,resp.geturl(),body if binary else body.decode("utf-8",errors="replace")

          nlc2019="https://www.nlc.cn/pcab/zx/xw/20190815_180607.shtml"
          s1,u1,h1=get(nlc2019)
          t1=html.unescape(re.sub(r"<[^>]+>"," ",h1))
          t1=re.sub(r"\s+"," ",t1)
          nlc2019_markers={
              "zheng_title":"郑振铎：关于《永乐大典》" in t1,
              "reprint_people_daily":"转载自《人民日报》" in t1,
              "date_1951_08_13":"1951-08-13" in t1,
              "soviet_eleven":"苏联列宁格勒大学" in t1 and "十一册" in t1,
              "commercial_press_twentyone":"商务印书馆" in t1 and "二十一册" in t1,
          }
          if not all(nlc2019_markers.values()):
              raise SystemExit(f"NLC 2019 markers incomplete: {nlc2019_markers}")
          (out/"nlc-2019.html").write_text(h1,encoding="utf-8")

          nlc2025="https://www.nlc.cn/upload/attachments/2025-04-08/753b026e.pdf"
          s2,u2,b2=get(nlc2025,binary=True)
          (out/"nlc-2025.pdf").write_bytes(b2)
          pdf_sha=hashlib.sha256(b2).hexdigest()
          # Parse the embedded PDF text layer only; no OCR is used.
          reader=PdfReader(str(out/"nlc-2025.pdf"))
          txt="\n".join((page.extract_text() or "") for page in reader.pages)
          (out/"nlc-2025.txt").write_text(txt,encoding="utf-8")
          txt_norm=re.sub(r"\s+","",txt)
          nlc2025_markers={
              "zheng_title":"郑振铎《关于永乐大典》" in txt_norm,
              "date_1951_08_31":"1951年8月31日《人民日报》" in txt_norm,
              "zhao_title":"赵万里《永乐大典展览的意义——一九五一年八月北京图书馆举办》" in txt_norm,
              "zhao_issue_pages":"《文物参考资料》1951年第9期,第221—233页" in txt_norm or "《文物参考资料》1951年第9期，第221—233页" in txt_norm,
          }
          if not all(nlc2025_markers.values()):
              raise SystemExit(f"NLC 2025 markers incomplete: {nlc2025_markers}")

          day13="https://rmrb.zhouenlai.info/%E4%BA%BA%E6%B0%91%E6%97%A5%E6%8A%A5%EF%BC%881946-2003%EF%BC%89/1951/08/1951-08-13.htm"
          s3,u3,h3=get(day13)
          day13_markers={
              "date_heading":"1951-08-13" in h3,
              "title":"关于《永乐大典》" in h3,
              "page3":"第3版" in h3,
              "editor_note_exhibition":"八月十三日举行" in h3 and "永乐大典展览" in h3,
              "soviet_eleven":"苏联列宁格勒大学" in h3 and "十一册" in h3,
              "commercial_press_twentyone":"商务印书馆" in h3 and "二十一册" in h3,
          }
          if not all(day13_markers.values()):
              raise SystemExit(f"8/13 daily markers incomplete: {day13_markers}")
          (out/"rmrb-1951-08-13.html").write_text(h3,encoding="utf-8")

          # Follow only the page's own month-directory link; do not synthesize an 8/31 endpoint.
          month_links=[]
          for m in re.finditer(r'href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',h3,re.I|re.S):
              href,label=m.group(1),re.sub(r"<[^>]+>","",m.group(2))
              if "当月目录" in label:
                  month_links.append(urljoin(u3,html.unescape(href)))
          if not month_links:
              raise SystemExit("No source-emitted month-directory link on 8/13 page")
          sm,um,hm=get(month_links[0])
          (out/"rmrb-1951-08-month.html").write_text(hm,encoding="utf-8")
          links31=[]
          for href in re.findall(r'href=["\']([^"\']+)["\']',hm,re.I):
              u=urljoin(um,html.unescape(href))
              if "1951-08-31" in u:
                  links31.append(u)
          links31=sorted(set(links31))
          if not links31:
              raise SystemExit("No source-emitted 1951-08-31 link on month directory")
          s31,u31,h31=get(links31[0])
          (out/"rmrb-1951-08-31.html").write_text(h31,encoding="utf-8")
          day31={
              "status":s31,
              "final_url":u31,
              "date_heading":"1951-08-31" in h31,
              "target_title_literal":"关于《永乐大典》" in h31,
              "zheng_literal":"郑振铎" in h31,
              "editor_note_exhibition":"永乐大典展览" in h31,
          }
          if not day31["date_heading"]:
              raise SystemExit(f"8/31 source-emitted day identity missing: {day31}")

          result={
              "probe":"BATCH-12JD-ZHENG-YONGLE-DATE-CONFLICT",
              "nlc_2019":{
                  "requested_url":nlc2019,"status":s1,"final_url":u1,
                  "markers":nlc2019_markers,
              },
              "nlc_2025":{
                  "requested_url":nlc2025,"status":s2,"final_url":u2,
                  "bytes":len(b2),"sha256":pdf_sha,
                  "ocr_used":False,"markers":nlc2025_markers,
              },
              "people_daily_public_transcription":{
                  "day13":{"requested_url":day13,"status":s3,"final_url":u3,"markers":day13_markers},
                  "source_emitted_month_directory":month_links[0],
                  "source_emitted_day31_url":links31[0],
                  "day31":day31,
                  "scope":"PUBLIC_TRANSCRIPTION_NOT_OFFICIAL_NEWSPAPER_SCAN",
              },
              "adjudication_input":{
                  "nlc2019_reports_date":"1951-08-13",
                  "nlc2025_reports_date":"1951-08-31",
                  "public_transcription_places_title_on_1951_08_13":True,
                  "public_transcription_1951_08_31_target_title_literal":day31["target_title_literal"],
                  "direct_official_people_daily_scan_reviewed":False,
              },
              "security":{
                  "login_used":False,"account_action_used":False,"payment_used":False,
                  "guessed_day31_url_used":False,"ocr_used":False,
              },
          }
          (out/"probe.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12jd-zheng-yongle-date-conflict
          path: artifacts/batch-12jd
          if-no-files-found: error
