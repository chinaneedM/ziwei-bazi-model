name: acquire-tianwen-13ls-bsb-folio-sweep
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13ls-bsb-folio-sweep.py
      - .github/workflows/acquire-tianwen-13ls-bsb-folio-sweep.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - run: python scripts/acquire-tianwen-13ls-bsb-folio-sweep.py --out /tmp/tianwen-13ls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13ls-bsb-juan35-source-folio-sweep
          path: /tmp/tianwen-13ls/
          if-no-files-found: warn
      - run: python scripts/verify-tianwen-13lp-bsb-source-route.py
      - run: python scripts/verify-tianwen-13lq-bsb-iiif-acquisition.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13l*.py' -v
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
