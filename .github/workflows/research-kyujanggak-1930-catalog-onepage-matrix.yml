name: research-kyujanggak-1930-catalog-onepage-matrix

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1930-catalog-onepage-matrix.yml"
      - "scripts/research_kyujanggak_1930_catalog_onepage.py"

permissions:
  contents: read

jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        volume: ["0001","0002","0003","0004","0005","0006","0007"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi pillow
      - name: Fetch one no-OCR page for this volume
        run: |
          python scripts/research_kyujanggak_1930_catalog_onepage.py \
            --volume "${{ matrix.volume }}" \
            --output "artifacts/kyujanggak-1930-onepage-${{ matrix.volume }}"
      - name: Upload one-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1930-onepage-${{ matrix.volume }}-${{ github.sha }}
          path: artifacts/kyujanggak-1930-onepage-${{ matrix.volume }}/
          if-no-files-found: warn
          retention-days: 7
