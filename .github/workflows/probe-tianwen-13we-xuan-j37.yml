name: probe-tianwen-13we-xuan-j37
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/probe-tianwen-13we-xuan-j37.yml
permissions:
  contents: read
jobs:
  inspect-original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify source hash and emit selected native folios
        run: |
          python -m pip install -q pymupdf pillow
          python - <<'PY'
          import io, urllib.request, hashlib, base64
          import fitz
          from PIL import Image
          url = 'https://upload.wikimedia.org/wikipedia/commons/1/16/NLC892-411999015732-116171_%E5%8F%A4%E4%BB%8A%E5%BE%8B%E6%9B%86%E8%80%83_%E7%AC%AC16%E5%86%8A.pdf'
          request = urllib.request.Request(url, headers={'User-Agent':'Tianwen-Source-Collation/1.0 (public-domain source)'})
          source = urllib.request.urlopen(request, timeout=120).read()
          actual=hashlib.sha256(source).hexdigest()
          assert actual=='58e05a6b5b802fc54bdeabb57758bee41057d4c02e95475adcc1d06a3b4edb20', actual
          print('SOURCE_SHA256|'+actual,flush=True)
          doc=fitz.open(stream=source,filetype='pdf')
          for p in [23,24,25,26,27,28,29,30]:
              page=doc[p-1];scale=min(2800/page.rect.width,2800/page.rect.height)
              pm=page.get_pixmap(matrix=fitz.Matrix(scale,scale),alpha=False)
              im=Image.frombytes('RGB',(pm.width,pm.height),pm.samples)
              buf=io.BytesIO();im.save(buf,'JPEG',quality=80,optimize=True)
              data=buf.getvalue()
              print('PAGE_SHA|'+str(p)+'|'+hashlib.sha256(data).hexdigest()+'|'+str(len(data))+'|'+str(pm.width)+'x'+str(pm.height),flush=True)
              b64=base64.b64encode(data).decode()
              for j in range(0,len(b64),1800):print('PAGE_B64|'+str(p)+'|'+str(j//1800)+'|'+b64[j:j+1800])
          PY
