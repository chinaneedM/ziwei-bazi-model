name: verify-batch-12jb-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12jb-exact-head.yml
      - .github/workflows/probe-batch-12jb-nabunken-wenwu-1951-v2n9.yml
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-WENWU-CANKAO-1951-V2N9-NABUNKEN-EXACT-ISSUE-AND-REMOTE-COPY-BOUNDARY-JB.md
      - docs/research/ZIWEI-WENWU-CANKAO-1951-V2N9-NABUNKEN-EXACT-ISSUE-AND-REMOTE-COPY-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending JB status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'tianwen/batch-12jb-exact-head', description: 'Batch 12JB verification running'})
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12JB exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-WENWU-CANKAO-1951-V2N9-NABUNKEN-EXACT-ISSUE-AND-REMOTE-COPY-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-WENWU-CANKAO-1951-V2N9-NABUNKEN-EXACT-ISSUE-AND-REMOTE-COPY-BOUNDARY-JB'
          item=e['nabunken_exact_issue']
          assert item['ncid']=='AA11467834'
          assert item['local_bib_id']=='SB00333452'
          assert item['hold_id']=='TS00027259'
          assert item['document_id']=='10024273'
          assert item['request_number']=='202.505||3||1951-9C'
          assert item['volume_issue']=='Vol.2, no.9'
          assert item['direct_target_pages_221_233_reviewed'] is False
          p=e['remote_copy_policy']
          assert p['direct_copy_inquiries_from_individuals_accepted'] is False
          assert p['individual_must_use_institution_or_nearest_public_library_intermediary'] is True
          assert p['actual_request_requires_explicit_user_authorization'] is True
          assert e['security']['copy_request_sent'] is False
          assert e['security']['interlibrary_loan_request_sent'] is False
          assert e['security']['payment_used'] is False
          PY
      - name: Publish success JB status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'success', context: 'tianwen/batch-12jb-exact-head', description: 'Batch 12JB exact-head verification passed'})
      - name: Publish failure JB status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'failure', context: 'tianwen/batch-12jb-exact-head', description: 'Batch 12JB exact-head verification failed'})
