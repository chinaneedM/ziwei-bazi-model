name: probe-batch-12ib-r6-r3-beitu1959-pdftext-calibration

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - '.github/workflows/probe-batch-12ib-r6-r3-beitu1959-pdftext-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Test embedded text layer on known-positive pages
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/batch-12ib-r6-r3'
          TMP="$RUNNER_TEMP/ib6r3"
          rm -rf "$ROOT" "$TMP"; mkdir -p "$ROOT" "$TMP"
          URL='https://upload.wikimedia.org/wikipedia/commons/2/28/SSID-12335507_%E5%8C%97%E4%BA%AC%E5%9C%96%E6%9B%B8%E9%A4%A8%E5%96%84%E6%9C%AC%E6%9B%B8%E7%9B%AE_1.pdf'
          EXPECTED_SHA1='3ff9c94a69a5b5b799d65fba4a6d00fc2daecc97'
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils > /dev/null
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 240 -A 'Tianwen-Provenance-Audit/1.0' -o "$TMP/source.pdf" "$URL"
          GOT=$(sha1sum "$TMP/source.pdf" | awk '{print $1}')
          [ "$GOT" = "$EXPECTED_SHA1" ] || { echo sha1-mismatch; exit 1; }
          sha256sum "$TMP/source.pdf" > "$ROOT/source.sha256"
          pdfinfo "$TMP/source.pdf" > "$ROOT/pdfinfo.txt"
          pdffonts "$TMP/source.pdf" > "$ROOT/pdffonts.txt" || true
          pdfimages -list "$TMP/source.pdf" > "$ROOT/pdfimages-list.txt" || true
          for mode in raw layout; do
            pdftotext -f 55 -l 56 -enc UTF-8 -"$mode" "$TMP/source.pdf" "$ROOT/text-$mode.txt" || true
          done
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('audit/batch-12ib-r6-r3')
          targets=['三三六八','3368','七二八三','7283','八六四三','8643','10010']
          results={}
          for p in (root/'text-raw.txt',root/'text-layout.txt'):
            s=p.read_text('utf-8',errors='replace') if p.exists() else ''
            n=re.sub(r'\s+','',s)
            results[p.name]={
              'bytes':len(s.encode('utf-8')),
              'non_whitespace_chars':len(n),
              'hits':[t for t in targets if t in n],
              'preview':s[:8000]
            }
          fonts=(root/'pdffonts.txt').read_text(errors='replace') if (root/'pdffonts.txt').exists() else ''
          summary={
            'source_ssid':'12335507','pages':[55,56],
            'embedded_text_probe':results,
            'font_listing_nonempty':len([x for x in fonts.splitlines()[2:] if x.strip()])>0,
            'known_positive_text_layer_pass':any(('三三六八' in v['hits'] or '3368' in v['hits']) for v in results.values()),
            'role':'NAVIGATION_CAPABILITY_CALIBRATION_ONLY',
            'text_layer_is_historical_authority':False,
            'negative_inference_authorized':False
          }
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          printf '%s\n' 'ROLE=navigation calibration only' 'TEXT_LAYER_AUTHORITY=false' 'NEGATIVE_ABSENCE_INFERENCE_AUTHORIZED=false' > "$ROOT/manifest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ib-r6-r3-pdftext-calibration
          path: audit/batch-12ib-r6-r3/
          if-no-files-found: error
          retention-days: 30
      - name: Publish probe status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); let ok=false
            try { ok=!!JSON.parse(fs.readFileSync('audit/batch-12ib-r6-r3/summary.json','utf8')).known_positive_text_layer_pass } catch(e) {}
            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,
              state:ok?'success':'failure',context:'tianwen/batch-12ib-r6-r3-pdftext',
              description:ok?'embedded text layer locates known-positive 3368':'embedded text layer not calibrated; no inference'
            })
