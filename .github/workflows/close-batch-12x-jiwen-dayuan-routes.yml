name: close-batch-12x-jiwen-dayuan-routes

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/close-batch-12x-jiwen-dayuan-routes.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fusion-chart-core-r1-20260822

      - name: Fail closed if branch advanced after checkout
        shell: bash
        run: |
          git fetch origin agent/fusion-chart-core-r1-20260822
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/fusion-chart-core-r1-20260822)"

      - name: Synchronize Batch 12X state and gates
        shell: python
        run: |
          import json
          from pathlib import Path

          ROOT = Path('.')
          BATCH = 'BATCH-12-ZIWEI-JIWEN-1982-1999-AND-DAYUAN-2012-COPY-TEXT-ROUTES-X'
          DOC = 'docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-JIWEN-1982-1999-AND-DAYUAN-2012-COPY-TEXT-ROUTES-X.md'
          EVID = 'docs/research/ZIWEI-JIWEN-1982-1999-AND-DAYUAN-2012-COPY-TEXT-ROUTES-R1.json'
          JIWEN = 'EXT-JIWEN-ZWDSQJ-1982-1999-ZHOU-COPY-REPRINT'
          DAYUAN = 'EXT-DAYUAN-ZWDSQJ-JINGCHAOBEN-2012'

          for p in (DOC, EVID):
              if not Path(p).is_file():
                  raise SystemExit(f'missing Batch 12X artifact: {p}')

          def load(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          def dump(p, x): Path(p).write_text(json.dumps(x, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          def append_once(text, marker, block):
              return text if marker in text else text.rstrip() + '\n\n' + block.strip() + '\n'
          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Batch 12X verifier sync anchor missing: {label}')
              return text.replace(old, new, 1)

          evidence = load(EVID)
          if evidence.get('batch_id') != BATCH:
              raise SystemExit('Batch 12X evidence batch id mismatch')
          if evidence.get('adjudication', {}).get('direct_independent_hai_glyph_witness_count_added') != 0:
              raise SystemExit('Batch 12X must not add an independent Hai witness')
          if evidence.get('dayuan_2012_route', {}).get('public_toc_philology', {}).get('mechanical_equivalence_authorized') is not False:
              raise SystemExit('Batch 12X 五神/五凶神 firewall must remain false')

          # Historical matrix JSON: enrich only HPA-ZDATE-006; no row/count mutation.
          mp = 'docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json'
          matrix = load(mp)
          row = next((r for r in matrix.get('rows', []) if r.get('rule_id') == 'HPA-ZDATE-006'), None)
          if not row:
              raise SystemExit('HPA-ZDATE-006 missing')
          row.update({
              'batch_12x_jiwen_dayuan_copy_text_artifact': EVID,
              'jiwen_1982_1999_copy_route_status': 'COPY_LEVEL_CANDIDATE_ROUTE_BOUND_TARGET_PAGE_PENDING',
              'jiwen_copy_relation_to_snu_1870': 'UNRESOLVED_NEITHER_SAME_NOR_DIFFERENT_PHYSICAL_COPY_PROVEN',
              'dayuan_2012_copy_text_route_status': 'MANUSCRIPT_COPY_TEXT_ROUTE_BOUND_TARGET_PAGE_AND_STEMMA_PENDING',
              'dayuan_2012_main_text_page_count': 434,
              'dayuan_public_toc_surface': '五神 百字千金訣',
              'dayuan_wushen_to_wuxiongshen_mechanical_normalization_authorized': False,
              'direct_target_page_observed_batch_12x': False,
              'independent_hai_glyph_witness_count_added_batch_12x': 0,
          })
          dump(mp, matrix)

          # External source registry: add two scoped modern acquisition/copy-text routes.
          rp = 'docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json'
          reg = load(rp)
          ids = {s.get('source_id') for s in reg.get('sources', [])}
          if JIWEN not in ids:
              reg['sources'].append({
                  'source_id': JIWEN,
                  'title': '《十八飛星策天紫微斗數全集〈明朝古本〉》集文 1982/1999 複梓路線',
                  'author_attribution': '陳希夷 / 周祖勇提供底本',
                  'historical_period': '1982 REPRODUCTION; 1999 REPRINT OF A CLAIMED QING TONGZHI-9 WOODBLOCK REPRINT COPY',
                  'edition': '集文；1982 初始複梓路線 / 1999 ISBN 9579789800',
                  'provider': '集文 / 星僑網路書店 / Google Books public bibliographic surface',
                  'url': 'https://www.ncc.com.tw/books/goods.php?id=995',
                  'source_role': 'PRIVATE_OLD_PRINT_COPY_REPRODUCTION_ROUTE_FOR_VOLUME4_TARGET_COLLATION',
                  'quality_notes': '周祖勇序在公開商品頁稱其提供珍藏多年之古本明版（清同治九年木刻再版）紫微斗數全六卷供集文複梓；序署民國七十一年孟春。Copy-level identity versus SNU Ilsa 1870 remains unresolved. No direct 五凶神 target page observed.',
                  'isbn10': '9579789800',
                  'isbn13': '9789579789806',
                  'google_books_1982_volume_id': 'YOwLlQEACAAJ',
                  'target_page_observed': False,
                  'independent_witness_increment': 0,
                  'research_artifact': EVID
              })
          if DAYUAN not in ids:
              reg['sources'].append({
                  'source_id': DAYUAN,
                  'title': '《十八飛星策天紫微斗數全集精鈔本》',
                  'author_attribution': '陳希夷著 / 黃家騁編校',
                  'historical_period': '2012 MODERN PUBLICATION OF A 434-PAGE MANUSCRIPT/COPY-TEXT ROUTE',
                  'edition': '大元書局 2012 / ISBN 9789866171680',
                  'provider': '大元書局 / 星僑網路書店 / 信義圖書 / 國家圖書館 acquisition record',
                  'url': 'https://www.ncc.com.tw/books/goods.php?id=7346',
                  'source_role': 'MANUSCRIPT_COPY_TEXT_AND_PUBLIC_INTERNAL_SAMPLE_ROUTE_FOR_VOLUME4_COLLATION',
                  'quality_notes': '公開資料一致標示主文六卷434頁。信義公開大圖直接顯示手寫竪排正文及題名/署名/刊梓表面；公開目錄文字出現「五神 百字千金訣」，不得在未見底頁前靜默正規化為「五凶神」。No direct target late-Zi page observed; stemmatic relation to Jiwen/SNU unresolved.',
                  'isbn13': '9789866171680',
                  'main_text_page_count': 434,
                  'public_toc_surface': '五神 百字千金訣',
                  'wushen_to_wuxiongshen_normalization_authorized': False,
                  'target_page_observed': False,
                  'independent_witness_increment': 0,
                  'research_artifact': EVID
              })
          dump(rp, reg)

          # Matrix narrative.
          mdp = 'docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md'
          md = Path(mdp).read_text(encoding='utf-8')
          md = append_once(md, '### Batch 12X — Jiwen 1982/1999 + Dayuan 2012 copy-text routes', '''
          ### Batch 12X — Jiwen 1982/1999 + Dayuan 2012 copy-text routes

          - 集文 1999 公開頁保留周祖勇序，直接稱其提供珍藏多年、清同治九年木刻再版的六卷古本供集文複梓；1982 Google Books record `YOwLlQEACAAJ` supplies the earlier publication route. Physical-copy identity versus SNU remains unresolved, so witness increment = 0.
          - 大元 2012 `9789866171680` is publicly described as a six-volume 434-page 精鈔本. Xinyi emits large internal samples; direct no-OCR visual review shows handwritten vertical copy text and a title/imprint surface reading `十八飛星策天紫微斗數全集 / 大宋扶搖子白雲先生陳摶著 / 南州草坪徐良弼校正 / 金陵益軒唐謙繡梓`.
          - Public directory text gives `五神 百字千金訣`. This is quarantined as a directory-level variant/possible omission and is **not** mechanically normalized to `五凶神` before the underlying target page is directly collated.
          - No target late-Zi page is observed. HPA-ZDATE-006 remains MISSING_FROM_PRODUCT; 198/166/10/14 and all deterministic-product invariants remain unchanged.
          - Evidence: `docs/research/ZIWEI-JIWEN-1982-1999-AND-DAYUAN-2012-COPY-TEXT-ROUTES-R1.json`.
          ''')
          Path(mdp).write_text(md, encoding='utf-8')

          # README.
          readmep = 'README.md'
          readme = Path(readmep).read_text(encoding='utf-8')
          readme = append_once(readme, '**Batch 12X (Jiwen 1982/1999 + Dayuan 2012 copy-text routes):**', '''
          - **Batch 12X (Jiwen 1982/1999 + Dayuan 2012 copy-text routes):** 集文公開頁 binds 周祖勇's claimed privately held Qing Tongzhi-9 woodblock-reprint six-volume copy to the 1982/1999 reproduction route, while 大元 2012 exposes a 434-page handwritten copy-text route with public internal samples. The public directory surface `五神` is not silently normalized to `五凶神`; no direct target page or independent Hai-glyph witness is added. HPA-ZDATE-006 and 198/166/10/14 remain unchanged. See `docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-JIWEN-1982-1999-AND-DAYUAN-2012-COPY-TEXT-ROUTES-X.md`.
          ''')
          Path(readmep).write_text(readme, encoding='utf-8')

          # Current state.
          sp = 'docs/PROJECT-CURRENT-STATE-R1.json'
          state = load(sp)
          state['schema_version'] = '1.35.0'
          audit = state['historical_audit']
          if BATCH not in audit['completed_batches']:
              audit['completed_batches'].append(BATCH)
          audit['latest_batch_doc'] = DOC
          focus = audit['current_focus']
          additions = [
              'Batch 12X binds a Jiwen 1982/1999 reproduction route whose public Zhou Zuyong preface says he supplied a privately held six-volume old edition identified as a Qing Tongzhi-9 woodblock reprint; physical-copy identity versus SNU remains unresolved and no textual vote is added.',
              'Batch 12X binds Dayuan 2012 ISBN 9789866171680 as a six-volume 434-page 精鈔本/copy-text route. Xinyi public internal samples directly show handwritten vertical text and the title/imprint surface 十八飛星策天紫微斗數全集 / 大宋扶搖子白雲先生陳摶著 / 南州草坪徐良弼校正 / 金陵益軒唐謙繡梓.',
              'Dayuan public directory text surfaces 五神 百字千金訣. This remains PHILOLOGICALLY_UNRESOLVED_DIRECTORY_VARIANT_OR_OMISSION and MUST NOT be mechanically normalized to 五凶神 before direct target-page collation.',
              'HPA-ZDATE-006 remains MISSING_FROM_PRODUCT; Batch 12X adds zero independent Hai-glyph witnesses, changes no 198/166/10/14 accounting and authorizes no candidate selection, collapse or algorithm reopen. Next gate is a direct volume-four 五凶神 page from Jiwen, Dayuan, SNU, Hanyang or another copy with bound provenance.'
          ]
          for s in additions:
              if s not in focus:
                  focus.append(s)
          dump(sp, state)

          # Continuity verifier.
          vp = 'scripts/verify-project-continuity-state-r1.py'
          v = Path(vp).read_text(encoding='utf-8')
          v = replace_once(v,
              'ZIWEI_SNU_QUARK_FOZHU_EVIDENCE = ROOT / "docs/research/ZIWEI-SNU-QUARK-V4-AND-FOZHU16991-PUBLIC-ROUTE-CONTROLS-R1.json"',
              'ZIWEI_SNU_QUARK_FOZHU_EVIDENCE = ROOT / "docs/research/ZIWEI-SNU-QUARK-V4-AND-FOZHU16991-PUBLIC-ROUTE-CONTROLS-R1.json"\nZIWEI_JIWEN_DAYUAN_BATCH = ROOT / "' + DOC + '"\nZIWEI_JIWEN_DAYUAN_EVIDENCE = ROOT / "' + EVID + '"',
              'constants')
          v = replace_once(v,
              '    "BATCH-12-ZIWEI-SNU-QUARK-V4-AND-FOZHU16991-PUBLIC-ROUTE-CONTROLS-W",\n]\nLATEST_BATCH_ID = SUPPLEMENTAL_BATCH_IDS[-1]\nLATEST_BATCH_DOC = "docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-SNU-QUARK-V4-AND-FOZHU16991-PUBLIC-ROUTE-CONTROLS-W.md"',
              '    "BATCH-12-ZIWEI-SNU-QUARK-V4-AND-FOZHU16991-PUBLIC-ROUTE-CONTROLS-W",\n    "' + BATCH + '",\n]\nLATEST_BATCH_ID = SUPPLEMENTAL_BATCH_IDS[-1]\nLATEST_BATCH_DOC = "' + DOC + '"',
              'batch ledger')
          v = replace_once(v,
              'ZIWEI_SNU_QUARK_FOZHU_BATCH, ZIWEI_SNU_QUARK_FOZHU_EVIDENCE):',
              'ZIWEI_SNU_QUARK_FOZHU_BATCH, ZIWEI_SNU_QUARK_FOZHU_EVIDENCE, ZIWEI_JIWEN_DAYUAN_BATCH, ZIWEI_JIWEN_DAYUAN_EVIDENCE):',
              'artifact tuple')
          v = replace_once(v,
              '    ziwei_snu_quark_fozhu_evidence = json.loads(ZIWEI_SNU_QUARK_FOZHU_EVIDENCE.read_text(encoding="utf-8"))',
              '    ziwei_snu_quark_fozhu_evidence = json.loads(ZIWEI_SNU_QUARK_FOZHU_EVIDENCE.read_text(encoding="utf-8"))\n    ziwei_jiwen_dayuan_evidence = json.loads(ZIWEI_JIWEN_DAYUAN_EVIDENCE.read_text(encoding="utf-8"))',
              'evidence load')
          anchor = '    if fzsrc12w.get("target_page_observed") is not False or fzsrc12w.get("independent_witness_increment") != 0:\n        fail("Batch 12W Fozhu16991 registry authority boundary regressed")\n\n'
          checks = '''    # Batch 12X binds Jiwen/Dayuan copy-text routes without silently normalizing directory variants or adding target-text votes.\n    if ziwei_jiwen_dayuan_evidence.get("batch_id") != "BATCH-12-ZIWEI-JIWEN-1982-1999-AND-DAYUAN-2012-COPY-TEXT-ROUTES-X":\n        fail("Batch 12X machine evidence batch identity mismatch")\n    rw12x = ziwei_jiwen_dayuan_evidence.get("research_run", {})\n    if rw12x.get("workflow_run_id") != 34240652003 or rw12x.get("artifact_id") != 10061841718:\n        fail("Batch 12X research run/artifact binding regressed")\n    if rw12x.get("artifact_zip_sha256") != "022d32ef5cb09043ea8b662a13b8a45d09c596e02cd612d673da1c7adde8d7ca":\n        fail("Batch 12X research artifact digest regressed")\n    jw12x = ziwei_jiwen_dayuan_evidence.get("jiwen_1982_1999_route", {})\n    if jw12x.get("isbn13") != "9789579789806" or "清同治九年木刻再版" not in jw12x.get("preface_copy_provenance_surface", ""):\n        fail("Batch 12X Jiwen copy-route provenance regressed")\n    if jw12x.get("direct_five_xiong_shen_target_page_observed") is not False or jw12x.get("independent_textual_witness_increment") != 0:\n        fail("Batch 12X Jiwen target/witness firewall regressed")\n    dy12x = ziwei_jiwen_dayuan_evidence.get("dayuan_2012_route", {})\n    if dy12x.get("isbn13") != "9789866171680" or dy12x.get("public_description", {}).get("main_text_page_count") != 434:\n        fail("Batch 12X Dayuan identity/page-count binding regressed")\n    phil12x = dy12x.get("public_toc_philology", {})\n    if phil12x.get("observed_surface") != "五神 百字千金訣" or phil12x.get("mechanical_equivalence_authorized") is not False:\n        fail("Batch 12X 五神/五凶神 philological firewall regressed")\n    vis12x = dy12x.get("direct_visual_public_samples_no_ocr", {})\n    if vis12x.get("completed") is not True or vis12x.get("five_xiong_shen_target_page_observed") is not False:\n        fail("Batch 12X Dayuan sample-review target boundary regressed")\n    if "金陵益軒唐謙繡梓" not in vis12x.get("sample_087", {}).get("direct_visible_glyphs", []):\n        fail("Batch 12X Dayuan title/imprint visual control regressed")\n    a12x = ziwei_jiwen_dayuan_evidence.get("adjudication", {})\n    if a12x.get("hpa_zdate_006") != "MISSING_FROM_PRODUCT" or a12x.get("direct_independent_hai_glyph_witness_count_added") != 0:\n        fail("Batch 12X HPA-ZDATE-006 witness boundary regressed")\n    if a12x.get("directory_variant_wushen_to_wuxiongshen_normalization_authorized") is not False or a12x.get("algorithm_reopen_authorized") is not False:\n        fail("Batch 12X philology/algorithm firewall regressed")\n    row12x = next((r for r in matrix.get("rows", ()) if r.get("rule_id") == "HPA-ZDATE-006"), None)\n    if not row12x or row12x.get("batch_12x_jiwen_dayuan_copy_text_artifact") != "docs/research/ZIWEI-JIWEN-1982-1999-AND-DAYUAN-2012-COPY-TEXT-ROUTES-R1.json":\n        fail("Batch 12X Matrix artifact binding regressed")\n    if row12x.get("dayuan_wushen_to_wuxiongshen_mechanical_normalization_authorized") is not False or row12x.get("independent_hai_glyph_witness_count_added_batch_12x") != 0:\n        fail("Batch 12X Matrix philology/witness firewall regressed")\n    jwsrc12x = next((s for s in registry.get("sources", ()) if s.get("source_id") == "EXT-JIWEN-ZWDSQJ-1982-1999-ZHOU-COPY-REPRINT"), None)\n    dysrc12x = next((s for s in registry.get("sources", ()) if s.get("source_id") == "EXT-DAYUAN-ZWDSQJ-JINGCHAOBEN-2012"), None)\n    if not jwsrc12x or jwsrc12x.get("target_page_observed") is not False or jwsrc12x.get("independent_witness_increment") != 0:\n        fail("Batch 12X Jiwen registry authority boundary regressed")\n    if not dysrc12x or dysrc12x.get("main_text_page_count") != 434 or dysrc12x.get("wushen_to_wuxiongshen_normalization_authorized") is not False:\n        fail("Batch 12X Dayuan registry authority boundary regressed")\n\n'''
          v = replace_once(v, anchor, anchor + checks, 'Batch 12X checks')
          Path(vp).write_text(v, encoding='utf-8')

          # Cheap structural preflight before committing.
          assert state['invariants']['deterministic_fusion_chart_product_r1'] == 'CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count'] == 0
          assert state['invariants']['algorithm_reopen_count'] == 0
          assert state['invariants']['candidate_collapse_count'] == 0
          assert audit['row_count'] == 198 and audit['audited_row_count'] == 166
          assert audit['current_missing_from_product_row_count'] == 10
          assert audit['identified_missing_candidate_family_count'] == 14

      - name: Run continuity gate before commit
        run: python scripts/verify-project-continuity-state-r1.py

      - name: Commit Batch 12X synchronization
        shell: bash
        run: |
          git config user.name "chinaneedM"
          git config user.email "china.need.grp@gmail.com"
          git add README.md docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json docs/PROJECT-CURRENT-STATE-R1.json scripts/verify-project-continuity-state-r1.py
          git diff --cached --check
          git commit -m "bind Batch 12X Jiwen Dayuan copy-text routes"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
