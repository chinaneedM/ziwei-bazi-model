name: probe-batch-12ls-cnbksy-help-tree-contract

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-batch-12ls-cnbksy-help-tree-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute only the source-closed help-tree empty-object POST
        run: |
          python - <<'PY'
          import collections, hashlib, json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests

          page="https://www.cnbksy.com/portal/footCategory?id=61"
          endpoint_path="/portal/footCategory/footerList?id=61"
          UA="Mozilla/5.0 (Tianwen provenance audit; CNBKSY help tree contract)"
          s=requests.Session()
          s.headers.update({"User-Agent":UA})

          g=s.get(page,timeout=45,allow_redirects=False)
          grow=g.content
          gtxt=grow.decode("utf-8","replace")

          csrf_m=re.search(r'''(?is)<meta\b[^>]*?name\s*=\s*["']_csrf["'][^>]*?content\s*=\s*["']([^"']+)["']''',gtxt)
          if not csrf_m:
              csrf_m=re.search(r'''(?is)<meta\b[^>]*?content\s*=\s*["']([^"']+)["'][^>]*?name\s*=\s*["']_csrf["']''',gtxt)

          csrf_present=bool(csrf_m)
          request_executed=False
          response=None
          parsed=None
          node_inventory=[]
          if csrf_present:
              csrf=csrf_m.group(1)
              endpoint=urljoin(page,endpoint_path)
              headers={
                  "Referer":page,
                  "X-Requested-With":"XMLHttpRequest",
                  "Content-Type":"application/x-www-form-urlencoded; charset=UTF-8",
              }
              r=s.post(endpoint,params={"_csrf":csrf},data={},headers=headers,timeout=45,allow_redirects=False)
              request_executed=True
              raw=r.content
              response={
                  "status":r.status_code,
                  "content_type":r.headers.get("content-type"),
                  "location":r.headers.get("location"),
                  "server":r.headers.get("server"),
                  "bytes":len(raw),
                  "sha256":hashlib.sha256(raw).hexdigest(),
                  "starts_json_like":raw.lstrip()[:1] in (b"[",b"{"),
              }
              try:
                  obj=r.json()
                  if isinstance(obj,list):
                      for idx,item in enumerate(obj):
                          if isinstance(item,dict):
                              node_inventory.append({
                                  "index":idx,
                                  "keys":sorted(str(k) for k in item.keys()),
                                  "id":item.get("id"),
                                  "pId":item.get("pId"),
                                  "name":item.get("name"),
                                  "title":item.get("title"),
                                  "isParent":item.get("isParent"),
                              })
                          else:
                              node_inventory.append({
                                  "index":idx,
                                  "scalar_type":type(item).__name__,
                                  "scalar_preview":str(item)[:300],
                              })
                      parsed={
                          "json_type":"list",
                          "item_count":len(obj),
                          "item_type_counts":dict(collections.Counter(type(x).__name__ for x in obj)),
                      }
                  elif isinstance(obj,dict):
                      parsed={
                          "json_type":"dict",
                          "key_count":len(obj),
                          "keys":sorted(str(k) for k in obj.keys())[:200],
                      }
                  else:
                      parsed={"json_type":type(obj).__name__,"value_preview":str(obj)[:500]}
              except Exception as e:
                  parsed={"json_parse_error":type(e).__name__}

          out={
              "source_contract":{
                  "parent_batch":"12LR",
                  "page_url":page,
                  "endpoint":endpoint_path,
                  "method":"POST",
                  "payload":"EMPTY_OBJECT",
                  "csrf_source":"page meta _csrf",
                  "csrf_value_recorded":False,
                  "findNews_invoked":False,
                  "target_term_submitted":False,
                  "target_query_submitted":False,
              },
              "page_response":{
                  "status":g.status_code,
                  "content_type":g.headers.get("content-type"),
                  "server":g.headers.get("server"),
                  "bytes":len(grow),
                  "sha256":hashlib.sha256(grow).hexdigest(),
              },
              "csrf_present":csrf_present,
              "request_executed":request_executed,
              "response":response,
              "parsed_response":parsed,
              "node_inventory":node_inventory,
              "adjudication":{
                  "only_source_closed_footer_list_post_used":request_executed,
                  "findNews_invoked":False,
                  "target_term_submitted":False,
                  "target_query_submitted":False,
                  "login_used":False,
                  "registration_used":False,
              },
              "security":{
                  "anonymous_session_only":True,
                  "csrf_value_recorded":False,
                  "credential_value_recorded":False,
                  "private_endpoint_guessed":False,
                  "captcha_bypass_used":False,
                  "tls_verification_disabled":False,
              },
          }
          Path("batch-12ls-cnbksy-help-tree-contract.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: batch-12ls-cnbksy-help-tree-contract
          path: batch-12ls-cnbksy-help-tree-contract.json
