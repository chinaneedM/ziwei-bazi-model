name: render-datong-1569-vol6-table-fingerprint

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-datong-1569-vol6-table-fingerprint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick
      - name: Download 1569 Datong facsimile volume 6
        run: |
          set -euo pipefail
          mkdir -p evidence/pages evidence/contact
          url='https://www.kotenmon.com/cal/arabe/vol6.pdf'
          curl -L --fail --retry 3 --retry-delay 2 "$url" -o evidence/datong1569-vol6.pdf
          sha256sum evidence/datong1569-vol6.pdf | tee evidence/source.sha256
          pdfinfo evidence/datong1569-vol6.pdf | tee evidence/pdfinfo.txt
      - name: Render full volume without OCR
        run: |
          set -euo pipefail
          pdftoppm -jpeg -jpegopt quality=90 -r 150 evidence/datong1569-vol6.pdf evidence/pages/page
          sha256sum evidence/pages/*.jpg | sort -V | tee evidence/pages.sha256
          mapfile -t pages < <(find evidence/pages -maxdepth 1 -name 'page-*.jpg' | sort -V)
          montage "${pages[@]}" -thumbnail 300x420 -tile 5x9 -geometry +4+4 evidence/contact/contact-all.jpg
          sha256sum evidence/contact/contact-all.jpg | tee evidence/contact.sha256
          printf 'NO_OCR_USED=true\nSOURCE_ROLE=1569_ZHOU_XIANG_DATONG_VOL6_DIRECT_TABLE_FINGERPRINT_REVIEW\nFULL_PAGE_GLYPH_CLAIMS_AUTHORIZED=true\n' > evidence/manifest.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: datong-1569-vol6-table-fingerprint
          path: |
            evidence/source.sha256
            evidence/pdfinfo.txt
            evidence/pages/
            evidence/pages.sha256
            evidence/contact/
            evidence/contact.sha256
            evidence/manifest.txt
          if-no-files-found: error
          retention-days: 30
