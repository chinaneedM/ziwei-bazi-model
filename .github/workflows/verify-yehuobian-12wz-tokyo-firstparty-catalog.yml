name: verify-yehuobian-12wz-tokyo-firstparty-catalog
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12wz-tokyo-firstparty-catalog.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-SOURCE-REGISTRY-EXTENSIONS-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12WZ-*
      - scripts/verify-yehuobian-12wz-tokyo-seven-firstparty-catalog.py
      - tests/test_yehuobian_12wz_tokyo_seven_firstparty_catalog.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact 7 raw catalog digests, 1 new metadata source, no folio vote
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-12wz-tokyo-seven-firstparty-catalog.py
          python -m unittest discover -s tests -p 'test_yehuobian_12wz_tokyo_seven_firstparty_catalog.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_12wy_tokyo_kanseki_catalog_details.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_12wx_tokyo_kanseki_exact_title.py' -v
