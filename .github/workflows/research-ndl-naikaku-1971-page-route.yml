name: research-ndl-naikaku-1971-page-route

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ndl-naikaku-1971-page-route.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe API-emitted public page routes
        shell: python
        run: |
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          IMG = OUT / "images"
          IMG.mkdir(parents=True)
          PID = "12282052"
          UA = "Mozilla/5.0 provenance-research api-emitted-public-page-route"

          def fetch(url, limit=12_000_000):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "application/json,image/jpeg,image/*,*/*;q=0.8",
                  "Accept-Language": "ja,en;q=0.8",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read(limit)
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "bytes": len(data),
                          "sha256": hashlib.sha256(data).hexdigest(),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "bytes": 0, "data": b""}

          item_url = f"https://dl.ndl.go.jp/api/item/search/info:ndljp/pid/{PID}"
          item = fetch(item_url)
          raw = item.pop("data")
          result = {
              "schema": "NDL-NAIKAKU-1971-API-EMITTED-PAGE-ROUTE-R1",
              "pid": PID,
              "item_api": item,
              "authentication_attempted": False,
              "access_control_bypass_attempted": False,
              "identifier_guessing_attempted": False,
              "page_routes": [],
          }
          if not raw:
              result["adjudication"] = {"page_route_status": "ITEM_API_UNAVAILABLE"}
          else:
              payload = json.loads(raw.decode("utf-8"))
              bundles = payload.get("item", {}).get("contentsBundles", [])
              contents = []
              for bundle in bundles:
                  for c in bundle.get("contents", []) or []:
                      if c.get("publicPath"):
                          contents.append({
                              "id": c.get("id"),
                              "sortKey": c.get("sortKey"),
                              "originalFileName": c.get("originalFileName"),
                              "publicPath": c.get("publicPath"),
                              "meta": c.get("meta"),
                          })
              result["content_count"] = len(contents)
              result["first_content"] = contents[0] if contents else None
              result["last_content"] = contents[-1] if contents else None
              result["indices"] = [
                  {
                      "bundle_id": b.get("id"),
                      "indices": b.get("indices"),
                  }
                  for b in bundles
              ]

              # Test only source-emitted paths. Sample first page, one middle page,
              # and the final 30 pages where the 1971 catalog's document-name list
              # is expected to reside per the National Archives method article.
              positions = []
              if contents:
                  positions.extend([0, len(contents)//2])
                  positions.extend(range(max(0, len(contents)-30), len(contents)))
              positions = sorted(set(positions))
              saved = 0
              for pos in positions:
                  c = contents[pos]
                  url = "https://dl.ndl.go.jp/" + c["publicPath"].lstrip("/")
                  row = fetch(url)
                  data = row.pop("data")
                  rec = {
                      "position_1based": pos + 1,
                      "sortKey": c.get("sortKey"),
                      "originalFileName": c.get("originalFileName"),
                      "publicPath": c.get("publicPath"),
                      "url": url,
                      **row,
                  }
                  ctype = (row.get("content_type") or "").lower()
                  if data and row.get("ok") and ("image" in ctype or data[:3] == b"\xff\xd8\xff"):
                      p = IMG / f"p{pos+1:04d}.jpg"
                      p.write_bytes(data)
                      rec["saved_file"] = str(p)
                      saved += 1
                  result["page_routes"].append(rec)

              result["adjudication"] = {
                  "scope": "ONLY_API_EMITTED_PUBLICPATH_VALUES",
                  "page_route_status": "PUBLIC_IMAGES_OBSERVED" if saved else "NO_PUBLIC_IMAGE_OBJECT_OBSERVED",
                  "saved_image_count": saved,
                  "whole_catalog_negative_authorized": False,
                  "crosswalk_closed": False,
                  "algorithm_effect": "NONE",
              }

          (OUT / "ndl-naikaku-1971-page-route.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "content_count": result.get("content_count"),
              "first_content": result.get("first_content"),
              "last_content": result.get("last_content"),
              "adjudication": result.get("adjudication"),
              "routes": [
                  {k:v for k,v in r.items() if k not in ("publicPath",)}
                  for r in result.get("page_routes", [])
              ],
          }, ensure_ascii=False, indent=2))

      - name: Upload NDL page-route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndl-naikaku-1971-page-route
          path: probe/
          if-no-files-found: warn
          retention-days: 14
