name: verify-batch-12ic-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ic-exact-head.yml
      - docs/research/ZIWEI-ZHANG-LIJUAN-GUOXUEJIKAN11-PUBLIC-FULLTEXT-ROUTE-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-ZHANG-LIJUAN-GUOXUEJIKAN11-PUBLIC-FULLTEXT-ROUTE-BOUNDARY-IC.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IC status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'tianwen/batch-12ic-exact-head',
              description: 'Batch 12IC public-fulltext boundary verification running'
            })

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12IC exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-ZHANG-LIJUAN-GUOXUEJIKAN11-PUBLIC-FULLTEXT-ROUTE-BOUNDARY-IC'
          e=json.loads(Path('docs/research/ZIWEI-ZHANG-LIJUAN-GUOXUEJIKAN11-PUBLIC-FULLTEXT-ROUTE-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          assert e['official_bibliographic_control']['container_seen']=='《国学季刊》第十一期'
          assert e['official_bibliographic_control']['publication_date_claim_seen']=='2018年9月'
          assert e['public_route_probes']['r3_internet_archive_exact_title']['exact_title_hit_adjudication']=='FALSE_POSITIVE_INDEX_MATCH'
          assert e['public_route_probes']['r4_openlibrary']['isbn_endpoint_result']=='HTTP_404'
          assert e['bibliographic_conflict']['isbn_9787209115018_to_issue11_binding_authorized'] is False
          assert e['adjudication']['article_fulltext_retrieved'] is False
          assert e['adjudication']['exact_issue11_isbn']=='UNRESOLVED'
          assert e['adjudication']['exact_3368_to_3288_causal_mechanism']=='UNRESOLVED'
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,241,0)
          assert bid in state['historical_audit']['completed_batches']
          PY

      - name: Publish successful IC status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12ic-exact-head',
              description: 'Batch 12IC public-fulltext boundary gates PASS'
            })

      - name: Publish failed IC status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12ic-exact-head',
              description: 'Batch 12IC exact-head verification FAILED'
            })
