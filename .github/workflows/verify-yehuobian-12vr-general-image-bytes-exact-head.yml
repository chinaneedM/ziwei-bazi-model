name: verify-yehuobian-12vr-general-image-bytes-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12vr-general-image-bytes-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VR-*
      - scripts/verify-yehuobian-original-leaf-intake-r1.py
      - tests/test_yehuobian_original_leaf_intake_12uk.py
      - tests/test_yehuobian_original_leaf_actual_bytes_12vr.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Project state and historical source boundary
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
      - name: Existing six-copy queue and new byte-hash regressions
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-original-leaf-intake-r1.py
          python -m unittest discover -s tests -p 'test_yehuobian_original_leaf_intake_12uk.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_original_leaf_actual_bytes_12vr.py' -v
