name: research-kyujanggak-g893-mf-pdf-probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-g893-mf-pdf-probe.yml"
      - "scripts/research_kyujanggak_g893_mf_pdf_probe.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Probe G893 microfilm PDF list route
        run: |
          python scripts/research_kyujanggak_g893_mf_pdf_probe.py \
            --output artifacts/g893-mf-pdf-probe
      - name: Upload read-only route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g893-mf-pdf-probe-${{ github.sha }}
          path: artifacts/g893-mf-pdf-probe/
          if-no-files-found: warn
          retention-days: 7
