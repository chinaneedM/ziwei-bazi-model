name: research-ziwei-yulgok-b00320-public-viewer-ag

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-yulgok-b00320-public-viewer-ag.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect source-emitted Yulgok public viewer surface
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path("probe"); OUT.mkdir()
          base="https://db.yulgok.or.kr"
          page=base+"/poss/view?cate=clsType&dataId=B005_01_B00320_001"
          ua="Mozilla/5.0 provenance-research yulgok-public-viewer"

          def fetch(url, referer=None, limit=12000000):
              h={"User-Agent":ua,"Accept":"text/html,application/javascript,image/avif,image/webp,image/apng,image/*,*/*;q=0.8","Accept-Language":"ko,en;q=0.7,zh;q=0.6"}
              if referer: h["Referer"]=referer
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=40) as r:
                      data=r.read(limit)
                      return {"ok":True,"status":r.status,"final_url":r.geturl(),"content_type":r.headers.get("content-type"),"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"data":data}
              except Exception as e:
                  return {"ok":False,"error":repr(e),"bytes":0,"data":b""}

          row=fetch(page); raw=row.pop("data")
          txt=raw.decode("utf-8","replace") if raw else ""
          (OUT/"detail.html").write_text(txt,encoding="utf-8")

          attrs=[]
          for pat in [
              r'''(?:src|href|data-src|data-original|data-url|onclick)\s*=\s*["']([^"']+)["']''',
              r'''["']([^"']*B005_01_B00320_001[^"']*)["']'''
          ]:
              for m in re.finditer(pat,txt,re.I):
                  v=html.unescape(m.group(1)).replace("\\/","/").strip()
                  attrs.append(v)
          attrs=list(dict.fromkeys(attrs))
          emitted=[]
          for v in attrs:
              u=urllib.parse.urljoin(row.get("final_url") or page,v)
              if u.startswith(("http://","https://")):
                  emitted.append(u)
          emitted=list(dict.fromkeys(emitted))

          script_urls=[]
          for m in re.finditer(r'''<script[^>]+src=["']([^"']+)["']''',txt,re.I):
              u=urllib.parse.urljoin(row.get("final_url") or page,html.unescape(m.group(1)))
              if u.startswith(base) and u not in script_urls: script_urls.append(u)

          scripts=[]
          discovered=[]
          needles=("B005_01_B00320_001","data/image","원문","국역","image","viewer","dataId","poss/view")
          for i,u in enumerate(script_urls[:40],1):
              x=fetch(u,referer=page,limit=4000000); data=x.pop("data")
              rec={"url":u,**x,"contexts":[]}
              if data:
                  st=data.decode("utf-8","replace")
                  (OUT/f"script-{i:02d}.js").write_text(st,encoding="utf-8")
                  for needle in needles:
                      start=0
                      while True:
                          k=st.find(needle,start)
                          if k<0: break
                          rec["contexts"].append({"needle":needle,"text":st[max(0,k-700):min(len(st),k+1700)]})
                          start=k+len(needle)
                  for mm in re.finditer(r'''["']([^"']*(?:data/image|B005_01_B00320_001|viewer|imageView|original)[^"']*)["']''',st,re.I):
                      vv=html.unescape(mm.group(1)).replace("\\/","/").strip()
                      uu=urllib.parse.urljoin(u,vv)
                      if uu.startswith(("http://","https://")) and uu not in discovered:
                          discovered.append(uu)
              scripts.append(rec)

          image_urls=[]
          for u in emitted:
              if re.search(r'\.(?:jpe?g|png|gif|webp)(?:\?|#|$)',u,re.I) and u not in image_urls:
                  image_urls.append(u)
          images=[]
          for i,u in enumerate(image_urls[:50],1):
              x=fetch(u,referer=page,limit=12000000); data=x.pop("data")
              rec={"url":u,**x}
              if data and x.get("ok") and len(data)>5000:
                  ext=".png" if data[:8]==b"\x89PNG\r\n\x1a\n" else ".webp" if data[:4]==b"RIFF" else ".gif" if data[:6] in (b"GIF87a",b"GIF89a") else ".jpg"
                  p=OUT/f"image-{i:03d}{ext}"; p.write_bytes(data); rec["saved_file"]=str(p)
              images.append(rec)

          contexts=[]
          for needle in ("B005_01_B00320_001","data/image","원문/국역","校正紫薇斗數全書","新鑴希夷陳先生紫薇斗數全書"):
              start=0
              while True:
                  k=txt.find(needle,start)
                  if k<0: break
                  contexts.append({"needle":needle,"text":txt[max(0,k-1200):min(len(txt),k+2600)]})
                  start=k+len(needle)

          result={
              "schema":"ZIWEI-YULGOK-B00320-PUBLIC-VIEWER-AG-R1",
              "access_date":"2026-09-09",
              "page":{**row,"url":page},
              "source_emitted_urls":emitted,
              "source_emitted_image_urls":image_urls,
              "source_emitted_script_urls":script_urls,
              "script_records":scripts,
              "script_discovered_candidate_urls":discovered,
              "page_contexts":contexts,
              "images":images,
              "authentication_attempted":False,
              "identifier_guessing_attempted":False,
              "access_control_bypass_attempted":False,
              "adjudication":{"source_emitted_only":True,"public_viewer_mechanism":"PENDING_SOURCE_REVIEW","target_leaf_status":"PENDING_DIRECT_NO_OCR_REVIEW","textual_witness_increment":0,"algorithm_effect":"NONE"}
          }
          (OUT/"ziwei-yulgok-b00320-public-viewer-ag.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
              "page":{"ok":row.get("ok"),"status":row.get("status"),"bytes":row.get("bytes")},
              "emitted_image_urls":image_urls,
              "script_count":len(script_urls),
              "script_context_hits":sum(len(x["contexts"]) for x in scripts),
              "candidate_urls":discovered[:80],
              "saved_images":[{"file":x.get("saved_file"),"bytes":x.get("bytes"),"sha256":x.get("sha256"),"url":x.get("url")} for x in images if x.get("saved_file")],
              "adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-yulgok-b00320-public-viewer-ag
          path: probe/
          retention-days: 14
