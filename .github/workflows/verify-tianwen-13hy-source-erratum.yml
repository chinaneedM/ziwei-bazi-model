name: verify-tianwen-13hy-source-erratum
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/research/TIANWEN-13HY-NIKH-WINTER-D18-EDITORIAL-TRAILING-THREE-ERRATUM-AND-D13-D17-REPLAY-R1.json
      - docs/research/TIANWEN-13HY-NIKH-WINTER-D18-EDITORIAL-TRAILING-THREE-ERRATUM-AND-D13-D17-REPLAY-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - scripts/verify-tianwen-13hy-source-erratum.py
      - tests/test_tianwen_13hy_source_erratum.py
      - .github/workflows/verify-tianwen-13hy-source-erratum.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forward-only-erratum:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/verify-tianwen-13hy-source-erratum.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13hy_source_erratum.py' -v
