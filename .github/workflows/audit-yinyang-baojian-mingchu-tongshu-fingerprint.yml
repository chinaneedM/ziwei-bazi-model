name: audit-yinyang-baojian-mingchu-tongshu-fingerprint

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/audit-yinyang-baojian-mingchu-tongshu-fingerprint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install document tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pillow

      - name: Acquire both early-Ming Tongshu fascicles and build complete locator
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/yinyang-baojian-mingchu-tongshu-fingerprint'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/render" "$ROOT/contact"

          URL1='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-411999004958-98769%20%E6%96%B0%E5%88%8A%E9%99%B0%E9%99%BD%E5%AF%B6%E9%91%92%E5%85%8B%E6%93%87%E9%80%9A%E6%9B%B8%E5%89%8D%E9%9B%86%20%E7%AC%AC1%E5%86%8A.pdf'
          URL2='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-411999004958-98801%20%E6%96%B0%E5%88%8A%E9%99%B0%E9%99%BD%E5%AF%B6%E9%91%92%E5%85%8B%E6%93%87%E9%80%9A%E6%9B%B8%E5%89%8D%E9%9B%86%20%E7%AC%AC2%E5%86%8A.pdf'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL1" -o "$ROOT/vol1.pdf"
          curl -L --fail --retry 3 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL2" -o "$ROOT/vol2.pdf"

          sha256sum "$ROOT"/vol*.pdf | sort -V | tee "$ROOT/source.sha256"
          pdfinfo "$ROOT/vol1.pdf" | tee "$ROOT/vol1-pdfinfo.txt"
          pdfinfo "$ROOT/vol2.pdf" | tee "$ROOT/vol2-pdfinfo.txt"
          pdftotext -layout "$ROOT/vol1.pdf" "$ROOT/vol1-text.txt" || true
          pdftotext -layout "$ROOT/vol2.pdf" "$ROOT/vol2-text.txt" || true

          pdftoppm -jpeg -jpegopt quality=90 -r 145 "$ROOT/vol1.pdf" "$ROOT/render/v1-page" >/dev/null 2>&1
          pdftoppm -jpeg -jpegopt quality=90 -r 145 "$ROOT/vol2.pdf" "$ROOT/render/v2-page" >/dev/null 2>&1
          test "$(find "$ROOT/render" -name 'v1-page-*.jpg' | wc -l)" -eq 29
          test "$(find "$ROOT/render" -name 'v2-page-*.jpg' | wc -l)" -eq 46
          sha256sum "$ROOT"/render/*.jpg | sort -V > "$ROOT/render.sha256"

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json,re
          root=Path('audit/yinyang-baojian-mingchu-tongshu-fingerprint')
          for prefix,total in [('v1',29),('v2',46)]:
              pages=sorted((root/'render').glob(f'{prefix}-page-*.jpg'),key=lambda p:int(p.stem.split('-')[-1]))
              for i in range(0,len(pages),24):
                  batch=pages[i:i+24]
                  thumbs=[]
                  for p in batch:
                      im=Image.open(p).convert('RGB')
                      im.thumbnail((250,350))
                      c=Image.new('RGB',(270,380),'white')
                      c.paste(im,((270-im.width)//2,24))
                      ImageDraw.Draw(c).text((8,6),p.name,fill='black')
                      thumbs.append(c)
                  cols=6; rows=(len(thumbs)+cols-1)//cols
                  sheet=Image.new('RGB',(cols*270,rows*380),'white')
                  for j,im in enumerate(thumbs):
                      sheet.paste(im,((j%cols)*270,(j//cols)*380))
                  sheet.save(root/'contact'/f'{prefix}-contact-{i+1:03d}-{i+len(batch):03d}.jpg',quality=92)

          terms=['晝夜','百刻','雨水','大寒','四十三刻','四十四刻','四十七刻','四十八刻','十三後','後四日','日出','日入','銅壺','通書']
          hits={}
          for prefix in ('vol1','vol2'):
              txt=(root/f'{prefix}-text.txt').read_text(encoding='utf-8',errors='ignore')
              hits[prefix]={t:len(list(re.finditer(re.escape(t),txt))) for t in terms}
          (root/'text-layer-hits.json').write_text(json.dumps(hits,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          sha256sum "$ROOT"/contact/*.jpg | sort -V > "$ROOT/contact.sha256"

          printf '%s\n' \
            'SOURCE=新刊陰陽寶鑒克擇通書前集 第1-2冊' \
            'NLC_GOOD_BOOK_NUMBER=02238' \
            'PUBLIC_METADATA_DATE=明初[1368-1424]' \
            'SURVIVING_SCOPE=卷1-4; vol1=29pp; vol2=46pp' \
            'QUESTION=Does this securely pre-1578 Tongshu witness preserve a day/night-ke table or the Sanming/Yueling 十三後 / 後四日 fingerprint?' \
            'TEXT_LAYER_ROLE=LOCATOR_ONLY_NOT_GLYPH_AUTHORITY' \
            'OCR_USED_FOR_FINAL_GLYPH_CLAIMS=false' \
            > "$ROOT/manifest.txt"

          rm "$ROOT/vol1.pdf" "$ROOT/vol2.pdf"

      - name: Upload complete early-Ming Tongshu locator
        uses: actions/upload-artifact@v4
        with:
          name: yinyang-baojian-mingchu-tongshu-fingerprint
          path: audit/yinyang-baojian-mingchu-tongshu-fingerprint
          if-no-files-found: error
          retention-days: 30
