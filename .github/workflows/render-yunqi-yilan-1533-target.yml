name: render-yunqi-yilan-1533-target

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-yunqi-yilan-1533-target.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Download Xu Xiu Siku volume 983 facsimile
        run: |
          set -euo pipefail
          mkdir -p evidence/pages
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/%E7%BA%8C%E4%BF%AE%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E7%AC%AC0983%E5%86%8A.pdf'
          curl -L --fail --retry 3 --retry-delay 2 "$url" -o evidence/xuxiu_siku_0983.pdf
          sha256sum evidence/xuxiu_siku_0983.pdf | tee evidence/source.sha256
          pdfinfo evidence/xuxiu_siku_0983.pdf | tee evidence/pdfinfo.txt
      - name: Render candidate Yunqi Yilan span without OCR
        run: |
          set -euo pipefail
          pdftoppm -f 360 -l 445 -jpeg -jpegopt quality=85 -r 120 evidence/xuxiu_siku_0983.pdf evidence/pages/page
          test "$(find evidence/pages -maxdepth 1 -name 'page-*.jpg' | wc -l)" -eq 86
          sha256sum evidence/pages/*.jpg | sort -V | tee evidence/pages.sha256
          printf 'NO_OCR_USED=true\nSOURCE_ROLE=1533_CHENGQIAO_PRINT_FACSIMILE_TARGET_REVIEW\nPDF_RANGE=360-445\nFULL_PAGE_GLYPH_CLAIMS_AUTHORIZED=true\nCONTACT_SHEETS_OMITTED=true\n' > evidence/manifest.txt
      - name: Upload target evidence
        uses: actions/upload-artifact@v4
        with:
          name: yunqi-yilan-1533-target-pages-360-445
          path: |
            evidence/source.sha256
            evidence/pdfinfo.txt
            evidence/pages/
            evidence/pages.sha256
            evidence/manifest.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
