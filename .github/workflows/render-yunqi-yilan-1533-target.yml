name: render-yunqi-yilan-1533-target

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-yunqi-yilan-1533-target.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick
      - name: Download Xu Xiu Siku volume 983 facsimile
        run: |
          set -euo pipefail
          mkdir -p evidence/pages evidence/contact
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/%E7%BA%8C%E4%BF%AE%E5%9B%9B%E5%BA%AB%E5%85%A8%E6%9B%B8%E7%AC%AC0983%E5%86%8A.pdf'
          curl -L --fail --retry 3 --retry-delay 2 "$url" -o evidence/xuxiu_siku_0983.pdf
          sha256sum evidence/xuxiu_siku_0983.pdf | tee evidence/source.sha256
          pdfinfo evidence/xuxiu_siku_0983.pdf | tee evidence/pdfinfo.txt
      - name: Render candidate Yunqi Yilan span without OCR
        run: |
          set -euo pipefail
          pdftoppm -f 360 -l 445 -jpeg -jpegopt quality=85 -r 120 evidence/xuxiu_siku_0983.pdf evidence/pages/page
          sha256sum evidence/pages/*.jpg | sort -V | tee evidence/pages.sha256
          mapfile -t pages < <(find evidence/pages -maxdepth 1 -name 'page-*.jpg' | sort -V)
          chunk=20
          idx=1
          total=${#pages[@]}
          for ((start=0; start<total; start+=chunk)); do
            end=$((start+chunk))
            if (( end > total )); then end=$total; fi
            slice=("${pages[@]:start:end-start}")
            printf -v out 'evidence/contact/contact-%02d.jpg' "$idx"
            montage "${slice[@]}" -thumbnail 360x480 -tile 4x5 -geometry +4+4 "$out"
            idx=$((idx+1))
          done
          sha256sum evidence/contact/*.jpg | sort -V | tee evidence/contact.sha256
          printf 'NO_OCR_USED=true\nSOURCE_ROLE=1533_CHENGQIAO_PRINT_FACSIMILE_TARGET_REVIEW\nPDF_RANGE=360-445\nFULL_PAGE_GLYPH_CLAIMS_AUTHORIZED=true\n' > evidence/manifest.txt
      - name: Upload target evidence
        uses: actions/upload-artifact@v4
        with:
          name: yunqi-yilan-1533-target-pages-360-445
          path: |
            evidence/source.sha256
            evidence/pdfinfo.txt
            evidence/pages/
            evidence/pages.sha256
            evidence/contact/
            evidence/contact.sha256
            evidence/manifest.txt
          if-no-files-found: error
          retention-days: 30
