name: probe-wuzong-shilu-1518-local-calibration

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-wuzong-shilu-1518-local-calibration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Acquire NLC Wuzong Shilu vol18 and locate Zhu Yu memorial
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/wuzong-shilu-1518-local-calibration'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages" "$ROOT/ocr"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra >/dev/null
          python -m pip install --quiet pillow
          python - <<'PY'
          import hashlib, json, pathlib, re, subprocess, urllib.parse, urllib.request
          from PIL import Image, ImageDraw

          root=pathlib.Path("audit/wuzong-shilu-1518-local-calibration")
          title="File:NLC892-CBM0106-366484 大明武宗毅皇帝實錄 一百九十七卷 第18冊.pdf"
          api="https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({
              "action":"query","format":"json","formatversion":"2",
              "prop":"imageinfo","iiprop":"url|size|sha1|extmetadata","titles":title
          })
          req=urllib.request.Request(api,headers={"User-Agent":"Tianwen-Provenance-Audit/1.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              meta=json.load(r)
          page=meta["query"]["pages"][0]
          ii=page["imageinfo"][0]
          url=ii["url"]
          (root/"commons-metadata.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          req=urllib.request.Request(url,headers={"User-Agent":"Tianwen-Provenance-Audit/1.0"})
          with urllib.request.urlopen(req,timeout=180) as r:
              data=r.read()
          pdf=root/"wuzong-shilu-vol18.pdf"
          pdf.write_bytes(data)
          pdf_sha=hashlib.sha256(data).hexdigest()
          info=subprocess.run(["pdfinfo",str(pdf)],stdout=subprocess.PIPE,check=True).stdout.decode("utf-8",errors="replace")
          (root/"pdfinfo.txt").write_text(info,encoding="utf-8")
          m=re.search(r"^Pages:\s+(\d+)",info,re.M)
          pages=int(m.group(1)) if m else None

          subprocess.run(["pdftoppm","-jpeg","-r","140",str(pdf),str(root/"pages"/"page")],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          page_files=sorted((root/"pages").glob("page-*.jpg"))
          terms=["朱裕","漏刻博士","漏刻科","南京","浙江","土圭","壺漏","二十四氣","正德十三年十二月","卷之一百六十九"]
          hits=[]; manifest=[]
          for i,p in enumerate(page_files,1):
              b=p.read_bytes()
              manifest.append({"page":i,"file":p.name,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
              proc=subprocess.run(["tesseract",str(p),"stdout","-l","chi_tra","--psm","6"],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False)
              txt=proc.stdout.decode("utf-8",errors="replace")
              (root/"ocr"/f"page-{i:03d}.txt").write_text(txt,encoding="utf-8")
              compact="".join(txt.split())
              found=[t for t in terms if t in compact]
              diag=sum(ch in compact for ch in ["漏","刻","朱","南","浙","圭"])
              if found or diag>=4:
                  hits.append({"page":i,"terms":found,"diagnostic_score":diag,"context":" ".join(txt.split())[:2800]})

          # full contact sheets
          cols=4; per_sheet=16
          for start in range(0,len(page_files),per_sheet):
              chunk=page_files[start:start+per_sheet]
              thumbs=[]
              for j,p in enumerate(chunk,start+1):
                  im=Image.open(p).convert("RGB"); tw=320
                  ratio=tw/im.width
                  im=im.resize((tw,max(1,int(im.height*ratio))))
                  canvas=Image.new("RGB",(tw,im.height+28),"white")
                  canvas.paste(im,(0,28))
                  ImageDraw.Draw(canvas).text((6,6),f"PDF page {j}",fill="black")
                  thumbs.append(canvas)
              cw=max(x.width for x in thumbs); ch=max(x.height for x in thumbs)
              rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new("RGB",(cols*cw,rows*ch),"white")
              for k,im in enumerate(thumbs):
                  sheet.paste(im,((k%cols)*cw,(k//cols)*ch))
              sheet.save(root/f"contact-{start+1:03d}-{start+len(chunk):03d}.jpg",quality=88,optimize=True)

          report={
              "schema":"WUZONG-SHILU-1518-LOCAL-CALIBRATION-PROBE-R1",
              "schema_version":"1.0.0",
              "commons_file_title":title,
              "source_url":url,
              "commons_sha1":ii.get("sha1"),
              "pdf_sha256":pdf_sha,
              "pdf_pages":pages,
              "rendered_pages":len(page_files),
              "page_manifest":manifest,
              "ocr_locator_hits":hits,
              "ocr_authority":"LOCATOR_ONLY_NOT_FINAL_TEXT_AUTHORITY",
              "target_received_text":[
                  "欽天監漏刻博士朱裕請修改歷法",
                  "觀象臺測驗黃道赤道",
                  "漏刻科推測昏旦中星調品晝夜壺漏",
                  "仍遣官之南京及浙江諸省候土圭",
                  "以測今時與至元天道修短若干節氣早晚何如",
                  "眾途同歸方可成歷"
              ],
              "research_question":"Does a direct Ming Shilu physical surrogate close a pre-1578 official institutional procedure in which local observations, clepsydra work and Nanjing/Zhejiang gnomon measurements are cross-compared before calendar revision?",
              "firewall":"This source is not expected to print Nanjing 59 or a 59.86->59 whole-ke reduction rule. It is a procedure/local-calibration bridge only unless direct pages show more.",
              "product_boundary":"Probe only; no runtime rule change, algorithm reopen or candidate collapse."
          }
          (root/"report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"pdf_sha256":pdf_sha,"pages":pages,"ocr_hits":hits},ensure_ascii=False,indent=2))
          PY

      - name: Upload Wuzong Shilu calibration probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wuzong-shilu-1518-local-calibration
          path: audit/wuzong-shilu-1518-local-calibration
          if-no-files-found: error
          retention-days: 30
