name: research-jielan-wenchengtang-collation-search

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-jielan-wenchengtang-collation-search.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search public Google Books index of Jielan collation edition
        shell: python
        run: |
          import hashlib
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          UA = "Mozilla/5.0 research-only public book-index query"
          VOLUME_ID = "rZRcCwAAQBAJ"
          TERMS = [
              "論人生時要審的確",
              "论人生时要审的确",
              "上五刻",
              "下五刻",
              "亥時",
              "亥时",
              "子時有十刻",
              "子时有十刻",
              "文誠堂",
              "文诚堂",
              "紫微斗數全書",
              "紫微斗数全书",
          ]

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "application/json,text/html,*/*;q=0.8",
                  "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.7",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read(3_000_000)
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "error": repr(exc), "data": b""}

          result = {
              "schema": "JIELAN-WENCHENGTANG-PUBLIC-COLLATION-SEARCH-R1",
              "volume_id": VOLUME_ID,
              "publication_role": "HEART_ONE_JIELAN_FACSIMILE_PLUS_POINT_COLLATED_EDITION_USING_QING_WENCHENGTANG_FULLBOOK_AS_ONE_COLLATION_BASE",
              "search_index_is_glyph_authority": False,
              "physical_wenchengtang_page_claim_authorized": False,
              "authentication_or_paywall_bypass_attempted": False,
              "queries": [],
          }

          templates = [
              "https://books.google.com/books?jscmd=SearchWithinVolume2&q={q}&vid={vid}",
              "https://books.google.com/books?id={vid}&jscmd=SearchWithinVolume2&q={q}",
              "https://books.google.com/books?vid={vid}&jscmd=SearchWithinVolume2&q={q}",
          ]
          for term in TERMS:
              attempts = []
              q = urllib.parse.quote(term)
              for template in templates:
                  url = template.format(q=q, vid=VOLUME_ID)
                  row = fetch(url)
                  data = row.pop("data")
                  rec = {
                      "url": url,
                      **row,
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest() if data else None,
                  }
                  if data:
                      raw = data.decode("utf-8", "replace")
                      rec["raw_excerpt"] = raw[:2500]
                      try:
                          payload = json.loads(raw)
                          rec["number_of_results"] = payload.get("number_of_results")
                          rec["searchable"] = payload.get("searchable")
                          rec["search_results"] = payload.get("search_results", [])
                      except Exception as exc:
                          rec["parse_error"] = repr(exc)
                  attempts.append(rec)
              result["queries"].append({"term": term, "attempts": attempts})

          result["adjudication"] = {
              "target_passage_index_status": "DETERMINE_FROM_RESULTS_ONLY",
              "wenchengtang_collation_note_status": "DETERMINE_FROM_RESULTS_ONLY",
              "authority_ceiling": "EDITORIAL_COLLATION_OR_SEARCH_INDEX_ONLY_NOT_DIRECT_WENCHENGTANG_GLYPH",
              "hpa_zdate_006_effect": "NONE_UNTIL_EVIDENCE_REVIEW",
              "algorithm_effect": "NONE",
          }
          (OUT / "jielan-wenchengtang-collation-search.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "volume_id": VOLUME_ID,
              "queries": [
                  {
                      "term": row["term"],
                      "result_counts": [a.get("number_of_results") for a in row["attempts"]],
                      "page_ids": [
                          [x.get("page_id") for x in a.get("search_results", [])]
                          for a in row["attempts"]
                      ],
                      "snippets": [
                          [x.get("snippet_text") for x in a.get("search_results", [])]
                          for a in row["attempts"]
                      ],
                  }
                  for row in result["queries"]
              ],
          }, ensure_ascii=False, indent=2))

      - name: Upload Jielan/Wenchengtang collation-search evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jielan-wenchengtang-public-collation-search
          path: probe/
          if-no-files-found: warn
          retention-days: 14
