name: research-ziwei-jielan-pt48-adjacent-pt49-ap-r3

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-jielan-pt48-adjacent-pt49-ap-r3.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Follow source-emitted PT48 and only its emitted adjacent images
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          out=Path("batch12ap-r3"); out.mkdir(exist_ok=True)
          vid="rZRcCwAAQBAJ"

          def get(url,name):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read(); status=r.status; final=r.geturl(); ctype=r.headers.get("Content-Type")
              except Exception as e:
                  return {"url":url,"error":repr(e)}
              (out/name).write_bytes(data)
              return {"url":url,"final_url":final,"http_status":status,"content_type":ctype,
                      "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}

          receipt={"scope":"FOLLOW_SOURCE_EMITTED_PT48_AND_ITS_ADJACENCY_ONLY",
                   "access_control_bypass_attempted":False,
                   "pt49_url_constructed_by_probe":False}

          # Get PT48 only from a source-emitted SearchWithinVolume2 page_url.
          search_url="https://books.google.com/books?jscmd=SearchWithinVolume2&q="+urllib.parse.quote("生時")+"&vid="+vid
          receipt["search"]=get(search_url,"search.json")
          obj=json.loads((out/"search.json").read_text("utf-8"))
          pt48=next((x for x in obj.get("search_results",[]) if x.get("page_id")=="PT48" and x.get("page_url")),None)
          receipt["pt48_source_emitted_search_result"]=pt48
          if not pt48:
              raise SystemExit("PT48 source-emitted page_url missing")

          receipt["pt48_page"]=get(pt48["page_url"],"pt48.html")
          txt=(out/"pt48.html").read_text("utf-8",errors="ignore")
          raw=re.findall(r'https?://books\.google\.com/books/publisher/content\?[^"<> ]+',txt)
          links=[]
          for x in raw:
              x=html.unescape(x).replace("\\u0026","&")
              if x not in links: links.append(x)
          receipt["pt48_source_emitted_publisher_content_urls"]=links
          parsed=[]
          for u in links:
              q=urllib.parse.parse_qs(urllib.parse.urlparse(u).query)
              parsed.append({"url":u,"pg":q.get("pg",[None])[0],"img":q.get("img",[None])[0],
                             "zoom":q.get("zoom",[None])[0],"has_sig":bool(q.get("sig"))})
          receipt["pt48_emitted_page_map"]=parsed
          receipt["pt49_image_url_emitted_by_pt48"]=any(x.get("pg")=="PT49" and x.get("img")=="1" for x in parsed)

          # Follow only image URLs actually emitted by PT48.
          images=[]
          for idx,u in enumerate(links):
              q=urllib.parse.parse_qs(urllib.parse.urlparse(u).query)
              pg=q.get("pg",[None])[0]
              if q.get("img",[None])[0]=="1" and pg in {"PT47","PT48","PT49","PT50","PT51"}:
                  rec=get(u,f"{pg or 'unknown'}-{idx}.bin")
                  rec["source_emitted_by_pt48"]=True
                  rec["page_id"]=pg
                  images.append(rec)
          receipt["fetched_adjacent_images"]=images
          receipt["pt49_image_fetched"]=any(x.get("page_id")=="PT49" and x.get("http_status")==200 for x in images)

          (out/"receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n","utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-jielan-pt48-adjacent-pt49-ap-r3
          path: batch12ap-r3
          retention-days: 90
