name: research-zhangguo-nlc-princeton-be-finalize

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-zhangguo-nlc-princeton-be-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align finalizer with current continuity-contract field
        run: |
          sed -i 's/new_chat_startup_contract/continuity_contract/g' .github/scripts/finalize-zhangguo-nlc-princeton-be.py
      - name: Prepare Batch 12BE semantic closure
        run: python .github/scripts/finalize-zhangguo-nlc-princeton-be.py
      - name: Verify prepared continuity state
        run: python scripts/verify-project-continuity-state-r1.py
      - name: Remove one-shot research and finalizer machinery
        run: |
          git rm -f \
            .github/workflows/research-zhangguo-nlc-union-catalog-contract-probe.yml \
            .github/workflows/research-zhangguo-national-shanghai-catalog-query.yml \
            .github/workflows/research-zhangguo-nlc-princeton-be-finalize.yml \
            .github/scripts/finalize-zhangguo-nlc-princeton-be.py
      - name: Verify and commit semantic closure
        run: |
          python scripts/verify-project-continuity-state-r1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts .github
          git status --short
          git commit -m "close Batch 12BE Princeton 1594 holding provenance"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
