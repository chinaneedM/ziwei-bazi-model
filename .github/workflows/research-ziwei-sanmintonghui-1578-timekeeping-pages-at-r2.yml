name: research-ziwei-sanmintonghui-1578-timekeeping-pages-at-r2

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-sanmintonghui-1578-timekeeping-pages-at-r2.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Render NCL 1578 Sanming Tonghui target pages
        shell: python
        run: |
          import hashlib, io, json, urllib.parse, urllib.request
          from pathlib import Path
          import fitz
          from PIL import Image

          out=Path('batch12at-r2'); out.mkdir(exist_ok=True)
          title='File:NCL-06589 2 三命通會.pdf'
          api=('https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo'
               '&iiprop=url%7Csize%7Csha1&titles='+urllib.parse.quote(title))
          req=urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              obj=json.loads(r.read().decode('utf-8'))
          page=next(iter(obj.get('query',{}).get('pages',{}).values()))
          info=(page.get('imageinfo') or [None])[0]
          if not info or not info.get('url'): raise SystemExit('No source-emitted NCL PDF URL')
          pdf=out/'sanming-1578-v2.pdf'
          req=urllib.request.Request(info['url'],headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=180) as r: pdf.write_bytes(r.read())
          doc=fitz.open(str(pdf)); rendered=[]
          for p1 in range(34,45):
              pix=doc[p1-1].get_pixmap(matrix=fitz.Matrix(1.55,1.55),alpha=False)
              im=Image.open(io.BytesIO(pix.tobytes('jpeg'))).convert('RGB')
              fn=f'page-{p1:03d}.jpg'; im.save(out/fn,quality=96)
              rendered.append({'page':p1,'file':fn,'sha256':hashlib.sha256((out/fn).read_bytes()).hexdigest(),'width':im.width,'height':im.height})
          receipt={
            'scope':'BATCH12AT_R2_SANMING_TONGHUI_1578_DIRECT_PHYSICAL_TIMEKEEPING_GLYPH_REVIEW',
            'commons_file_title':title,
            'pdf_sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),
            'pages':[34,44],
            'rendered':rendered,
            'ocr_generated':False,
            'manual_visual_review_required':True,
            'textual_independence_from_tushubian_assumed':False,
            'borrowing_direction_assumed':False,
            'runtime_standard_selected':False,
            'algorithm_reopen_authorized':False
          }
          (out/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n','utf-8')
          pdf.unlink()
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-sanmintonghui-1578-timekeeping-pages-at-r2
          path: batch12at-r2
          retention-days: 90
