name: research-snu-v4-public-share

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-snu-v4-public-share.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Render only the public Quark share surface
        shell: python
        run: |
          import json
          import re
          import time
          import urllib.parse
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          OUT=Path("probe"); OUT.mkdir()
          URL="https://pan.quark.cn/s/3b7b731e41f2"
          TARGET="〖飛星策天紫微斗數全集〗一簑古523.5-J562b-v.1-6 陳博(宋) 著 羊城[同治9年(1870)]明經閣 木版本（4）.pdf"

          opts=Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-gpu")
          opts.add_argument("--window-size=1800,2600")
          opts.add_argument("--lang=zh-CN")
          opts.set_capability("goog:loggingPrefs",{"performance":"ALL"})

          result={
            "schema":"ZIWEI-SNU-V4-PUBLIC-SHARE-R1",
            "source_locator":"XINGHUN_PUBLIC_FREE_RESOURCE_LINK",
            "share_url":URL,
            "target_filename":TARGET,
            "authentication_attempted":False,
            "login_attempted":False,
            "password_or_share_code_attempted":False,
            "hidden_api_guessing_attempted":False,
            "download_click_attempted":False,
          }

          driver=webdriver.Chrome(options=opts)
          try:
            driver.set_page_load_timeout(90)
            driver.get(URL); time.sleep(12)
            result["final_url"]=driver.current_url
            result["title"]=driver.title
            body=driver.find_element(By.TAG_NAME,"body").text
            result["body_text"]=body[:120000]
            result["target_filename_visible"]=TARGET in body
            result["target_stem_visible"]=("523.5-J562b-v.1-6" in body and "木版本（4）" in body)
            buttons=[]
            for el in driver.find_elements(By.CSS_SELECTOR,"button,a,[role='button']"):
              try:
                if not el.is_displayed(): continue
                txt=" ".join((el.text or "").split())
                if txt and any(k in txt for k in ("下载","保存","登录","打开","预览","文件")):
                  buttons.append({"tag":el.tag_name,"text":txt[:500],"href":el.get_attribute("href")})
              except Exception: pass
            seen=set(); dedup=[]
            for x in buttons:
              k=(x["tag"],x["text"],x["href"])
              if k not in seen:
                seen.add(k); dedup.append(x)
            result["visible_action_controls"]=dedup[:300]
            driver.save_screenshot(str(OUT/"share.png"))
            (OUT/"share.html").write_text(driver.page_source,encoding="utf-8")

            net=[]
            for entry in driver.get_log("performance"):
              try: msg=json.loads(entry["message"])["message"]
              except Exception: continue
              if msg.get("method") not in ("Network.requestWillBeSent","Network.responseReceived"): continue
              p=msg.get("params",{})
              if msg["method"]=="Network.requestWillBeSent":
                req=p.get("request",{}); u=req.get("url",""); method=req.get("method"); status=None
              else:
                resp=p.get("response",{}); u=resp.get("url",""); method=None; status=resp.get("status")
              if not any(h in u for h in ("quark.cn","uc.cn")): continue
              s=urllib.parse.urlsplit(u)
              q={}
              for k,v in urllib.parse.parse_qsl(s.query,keep_blank_values=True):
                q[k]="__REDACTED__" if any(t in k.lower() for t in ("token","auth","sign","ticket","session","cookie")) else v[:300]
              net.append({
                "event":msg["method"],"method":method,"status":status,
                "url":urllib.parse.urlunsplit((s.scheme,s.netloc,s.path,"","")),
                "safe_query":q
              })
            result["public_page_network_observations"]=net[-1200:]
          finally:
            driver.quit()

          login_words=("登录","扫码登录","手机号登录","请登录")
          result["adjudication"]={
            "public_share_loaded":bool(result.get("title") or result.get("body_text")),
            "target_file_visible_on_public_surface":result.get("target_filename_visible") or result.get("target_stem_visible"),
            "login_language_visible":any(x in result.get("body_text","") for x in login_words),
            "direct_public_download_established":False,
            "next_gate":"PUBLIC_VISIBLE_DOWNLOAD_OR_PREVIEW_ONLY; OTHERWISE_STOP_AT_ACCESS_BOUNDARY",
            "same_snu_lineage_independent_vote_added":0,
            "algorithm_effect":"NONE"
          }
          (OUT/"snu-v4-public-share.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
            "final_url":result.get("final_url"),
            "title":result.get("title"),
            "target_filename_visible":result.get("target_filename_visible"),
            "target_stem_visible":result.get("target_stem_visible"),
            "visible_action_controls":result.get("visible_action_controls"),
            "adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))

      - name: Upload public-share evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-snu-v4-public-share
          path: probe/
          if-no-files-found: warn
          retention-days: 14
