name: research-ziwei-volume4-public-sample-surfaces-z

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-volume4-public-sample-surfaces-z.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe source-emitted public sample images only
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path("probe"); IMG=OUT/"images"; OUT.mkdir(); IMG.mkdir()
          UA="Mozilla/5.0 provenance-research public-source-emitted-samples"

          pages=[
            ("gujiwu_67626","https://gujiwu.cn/yixue/67626.html"),
            ("jiwen_2book","https://www.2book.tw/products/-58h-11-%E5%85%A8%E6%96%B0%E7%B5%95%E7%89%88%E6%9B%B8-%E6%AD%A3%E5%AE%97%E7%A7%98%E7%AC%88%E5%8D%81%E5%85%AB%E9%A3%9B%E6%98%9F%E7%B4%AB%E5%BE%AE%E6%96%97%E6%95%B8%E5%85%A8%E9%9B%86-%E9%99%B3%E5%B8%8C%E5%A4%B7-%E8%91%97-%E9%9B%86%E6%96%87%E6%9B%B8%E5%B1%80-1999-04"),
            ("jiwen_klbook","https://klbook.com.hk/products/%E5%8D%81%E5%85%AB%E9%A3%9B%E6%98%9F%E7%AD%96%E5%A4%A9%E7%B4%AB%E5%BE%AE%E6%96%97%E6%95%B8%E5%85%A8%E9%9B%86.html"),
            ("hongyeshan_43947","https://hongyeshan.com/post/43947.html"),
            ("guoxuezhan_6058","https://www.guoxuezhan.com/6058.html"),
            ("guoxuezhan_6154","https://www.guoxuezhan.com/6154.html"),
            ("whzj_ch31","https://whzj1688.cn/read/ziweidoushuquanshunanbeishanren/zhangjie31"),
          ]

          def fetch(url, referer=None, limit=12_000_000):
            headers={"User-Agent":UA,"Accept":"text/html,image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8","Accept-Language":"zh-CN,zh-TW;q=0.9,ja;q=0.7,en;q=0.5"}
            if referer: headers["Referer"]=referer
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=35) as resp:
                data=resp.read(limit)
                return {"ok":True,"status":getattr(resp,"status",None),"final_url":resp.geturl(),"content_type":resp.headers.get("content-type"),"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"data":data}
            except Exception as exc:
              return {"ok":False,"error":repr(exc),"bytes":0,"data":b""}

          result={
            "schema":"ZIWEI-VOLUME4-PUBLIC-SAMPLE-SURFACES-Z-R1",
            "access_date":"2026-09-08",
            "authentication_attempted":False,
            "purchase_attempted":False,
            "identifier_guessing_attempted":False,
            "access_control_bypass_attempted":False,
            "pages":[],
            "images":[]
          }

          emitted=[]
          for label,url in pages:
            row=fetch(url); raw=row.pop("data")
            rec={"label":label,"url":url,**row,"source_emitted_image_urls":[]}
            if raw:
              # decode conservatively for URL extraction only
              txt=None
              for enc in ("utf-8","big5","gb18030","latin1"):
                try:
                  txt=raw.decode(enc); break
                except Exception: pass
              txt=txt or raw.decode("utf-8","replace")
              (OUT/f"{label}.html").write_text(txt,encoding="utf-8")
              urls=[]
              for m in re.finditer(r'''(?:src|href|data-src|data-original|data-lazy-src)\s*=\s*["']([^"']+)["']''',txt,re.I):
                u=urllib.parse.urljoin(row.get("final_url") or url,html.unescape(m.group(1)))
                if re.search(r'\.(?:jpe?g|png|webp|avif)(?:\?|$)',u,re.I) and u not in urls:
                  urls.append(u)
              # retain only page-emitted images plausibly belonging to target content/product, not generic UI
              keep=[]
              for u in urls:
                ul=u.lower()
                if label=="gujiwu_67626" and "oss.sishuge.cn/uploads/allimg/20241119/" in ul:
                  keep.append(u)
                elif label=="jiwen_2book" and ("store-assets.com" in ul or "cdn.shopify.com" in ul):
                  keep.append(u)
                elif label=="jiwen_klbook" and ("product_images" in ul or "klbook.com.hk" in ul):
                  keep.append(u)
                elif label=="hongyeshan_43947" and "wp-content/uploads/2023/03/" in ul:
                  keep.append(u)
                elif label.startswith("guoxuezhan_") and ("wp-content/uploads" in ul or "guoxuezhan.com" in ul):
                  keep.append(u)
                elif label=="whzj_ch31" and ("ziweidoushu" in ul or "whzj1688" in ul):
                  keep.append(u)
              rec["source_emitted_image_urls"]=keep
              for u in keep: emitted.append((label,url,u))
            result["pages"].append(rec)

          seen=set()
          for label,page,u in emitted:
            if u in seen: continue
            seen.add(u)
            row=fetch(u,referer=page,limit=10_000_000); raw=row.pop("data")
            item={"source_page":label,"page_url":page,"url":u,**row}
            ct=(row.get("content_type") or "").lower()
            # Save any non-trivial image-like bytes even if server labels them octet-stream.
            magic=(raw[:3]==b"\xff\xd8\xff" or raw[:8]==b"\x89PNG\r\n\x1a\n" or raw[:4] in (b"RIFF",))
            if raw and row.get("ok") and (magic or "image/" in ct or len(raw)>20_000):
              ext=".png" if raw[:8]==b"\x89PNG\r\n\x1a\n" else ".webp" if raw[:4]==b"RIFF" else ".jpg"
              p=IMG/f"{label}-{len(result['images'])+1:03d}{ext}"
              p.write_bytes(raw)
              item["saved_file"]=str(p)
            result["images"].append(item)

          result["adjudication"]={
            "source_emitted_only":True,
            "visual_review_status":"PENDING_DIRECT_NO_OCR_REVIEW",
            "target_page_status":"PENDING_DIRECT_NO_OCR_REVIEW",
            "independent_textual_witness_increment":0,
            "algorithm_effect":"NONE"
          }
          (OUT/"ziwei-volume4-public-sample-surfaces-z.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
            "pages":[{"label":p["label"],"ok":p.get("ok"),"status":p.get("status"),"bytes":p.get("bytes"),"image_url_count":len(p.get("source_emitted_image_urls",[]))} for p in result["pages"]],
            "saved":[{"source_page":x["source_page"],"status":x.get("status"),"bytes":x.get("bytes"),"sha256":x.get("sha256"),"saved_file":x.get("saved_file"),"url":x["url"]} for x in result["images"]],
            "adjudication":result["adjudication"]
          },ensure_ascii=False,indent=2))

      - name: Upload public sample surfaces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-volume4-public-sample-surfaces-z
          path: probe/
          if-no-files-found: warn
          retention-days: 14
