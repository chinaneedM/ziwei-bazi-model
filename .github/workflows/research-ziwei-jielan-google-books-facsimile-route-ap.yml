name: research-ziwei-jielan-google-books-facsimile-route-ap

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-jielan-google-books-facsimile-route-ap.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe only public Google Books / Play sample routes
        shell: python
        run: |
          import hashlib, json, re, urllib.parse, urllib.request
          from pathlib import Path

          out = Path("batch12ap-google-books")
          out.mkdir(exist_ok=True)
          volume_id = "rZRcCwAAQBAJ"

          def fetch(url, name):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = r.read()
                      status = r.status
                      final = r.geturl()
                      ctype = r.headers.get("Content-Type")
              except Exception as e:
                  return {"url":url,"error":repr(e)}
              (out/name).write_bytes(data)
              return {
                  "url": url, "final_url": final, "http_status": status,
                  "content_type": ctype, "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest()
              }

          receipt = {
              "scope":"PUBLIC_METADATA_AND_SOURCE_EMITTED_SAMPLE_ONLY",
              "access_control_bypass_attempted":False,
              "volume_id":volume_id,
              "requests":{},
              "search_within":{}
          }

          receipt["requests"]["volumes_api"] = fetch(
              "https://www.googleapis.com/books/v1/volumes/" + volume_id,
              "volumes.json")
          receipt["requests"]["play"] = fetch(
              "https://play.google.com/store/books/details?id=" + volume_id,
              "play.html")
          receipt["requests"]["books_landing"] = fetch(
              "https://books.google.com/books?id=" + volume_id,
              "books.html")

          terms = ["生時","生时","陰雨","阴雨","羅經","罗经","真確時候","真确时候","行漏","壺漏","壶漏"]
          for idx, term in enumerate(terms):
              q = urllib.parse.quote(term)
              url = "https://books.google.com/books?jscmd=SearchWithinVolume2&q=" + q + "&vid=" + volume_id
              rec = fetch(url, f"search-{idx}.txt")
              path = out/f"search-{idx}.txt"
              txt = path.read_text("utf-8", errors="ignore") if path.exists() else ""
              ids = sorted(set(re.findall(r'"(?:page_id|pageId|pid)"\s*:\s*"([^"]+)"', txt)))
              rec["source_emitted_page_ids"] = ids
              rec["term_literal_present"] = term in txt
              rec["response_preview"] = txt[:2000]
              receipt["search_within"][term] = rec

          # Parse only source-emitted URLs/page tokens visible in public landing HTML.
          for key, fn in [("play","play.html"),("books_landing","books.html")]:
              p=out/fn
              if p.exists():
                  txt=p.read_text("utf-8",errors="ignore")
                  receipt[key+"_public_sample_markers"]={
                      "sample_text_present": any(x in txt for x in ["Free sample","Sampel percuma","免費試閱","免费试读"]),
                      "page_id_tokens": sorted(set(re.findall(r'"page(?:Id|_id)"\s*:\s*"([^"]+)"',txt)))[:100],
                      "books_page_links": sorted(set(re.findall(r'https?://[^"<> ]*books[^"<> ]*(?:pg|jscmd)[^"<> ]*',txt)))[:100]
                  }

          try:
              v=json.loads((out/"volumes.json").read_text("utf-8"))
              ai=v.get("accessInfo",{})
              vi=v.get("volumeInfo",{})
              receipt["volume_metadata"]={
                  "title":vi.get("title"),
                  "publisher":vi.get("publisher"),
                  "publishedDate":vi.get("publishedDate"),
                  "pageCount":vi.get("pageCount"),
                  "industryIdentifiers":vi.get("industryIdentifiers"),
                  "viewability":ai.get("viewability"),
                  "embeddable":ai.get("embeddable"),
                  "publicDomain":ai.get("publicDomain"),
                  "textToSpeechPermission":ai.get("textToSpeechPermission"),
                  "webReaderLink":ai.get("webReaderLink"),
                  "epub":ai.get("epub"),
                  "pdf":ai.get("pdf")
              }
          except Exception as e:
              receipt["volume_metadata_parse_error"]=repr(e)

          (out/"receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n","utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-jielan-google-books-facsimile-route-ap
          path: batch12ap-google-books
          retention-days: 90
