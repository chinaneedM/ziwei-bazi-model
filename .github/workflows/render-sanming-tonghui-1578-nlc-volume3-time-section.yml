name: render-sanming-tonghui-1578-nlc-volume3-time-section

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/render-sanming-tonghui-1578-nlc-volume3-time-section.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download Ming Wanli Sanming Tonghui volume 3 facsimile
        run: |
          set -euo pipefail
          mkdir -p evidence/rendered
          url='https://commons.wikimedia.org/wiki/Special:Redirect/file/NLC892-411999029701-67186_%E4%B8%89%E5%91%BD%E9%80%9A%E6%9C%83_%E7%AC%AC3%E5%86%8A.pdf'
          curl -L --fail --retry 3 --retry-delay 2 "$url" -o evidence/sanming_tonghui_v3.pdf
          sha256sum evidence/sanming_tonghui_v3.pdf | tee evidence/source.sha256
          pdfinfo evidence/sanming_tonghui_v3.pdf | tee evidence/pdfinfo.txt

      - name: Render all 38 pages without OCR
        run: |
          set -euo pipefail
          pdftoppm -jpeg -jpegopt quality=92 -r 220 evidence/sanming_tonghui_v3.pdf evidence/rendered/page
          sha256sum evidence/rendered/*.jpg | sort -V | tee evidence/rendered.sha256
          printf 'NO_OCR_USED=true\nSOURCE_ROLE=MING_WANLI_PRINT_FACSIMILE\nTARGET_SCOPE=卷之二上_論時刻及其前置日出入晝夜刻數\n' > evidence/manifest.txt

      - name: Upload facsimile evidence
        uses: actions/upload-artifact@v4
        with:
          name: sanming-tonghui-1578-nlc-v3-time-section
          path: evidence/
          if-no-files-found: error
          retention-days: 30
