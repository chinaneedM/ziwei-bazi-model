name: verify-yehuobian-12xg-strict-folio-intake
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12xg-strict-folio-intake.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12XG-*
      - scripts/verify-yehuobian-original-folio-intake-12xd.py
      - scripts/verify-yehuobian-original-folio-intake-12xg.py
      - tests/test_yehuobian_original_folio_intake_12xg.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded raster decoder
        run: python -m pip install 'Pillow>=10,<12'
      - name: Verify continuity and strict no-false-original receipt gates
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-original-folio-intake-12xd.py
          python scripts/verify-yehuobian-original-folio-intake-12xg.py
          python -m unittest discover -s tests -p 'test_yehuobian_original_folio_intake_12xd.py' -v
          python -m unittest discover -s tests -p 'test_yehuobian_original_folio_intake_12xg.py' -v
