name: research-kyujanggak-1940-precious-title-crops

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1940-precious-title-crops.yml"
      - "scripts/research_kyujanggak_1940_precious_title_crops.py"

permissions:
  contents: read

jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi pillow
      - name: Build no-OCR high-resolution title crops
        run: |
          python scripts/research_kyujanggak_1940_precious_title_crops.py \
            --output artifacts/kyujanggak-1940-title-crops
      - name: Upload title-crop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1940-title-crops-${{ github.sha }}
          path: artifacts/kyujanggak-1940-title-crops/
          if-no-files-found: warn
          retention-days: 7
