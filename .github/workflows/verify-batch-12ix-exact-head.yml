name: verify-batch-12ix-exact-head
# Exact-head gate: Google Books page-numbered snippets close pagination without full-book acquisition.

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ix-exact-head.yml
      - docs/research/ZIWEI-JI-SHUYING-2009-GOOGLE-BOOKS-PAGE-NUMBERED-SNIPPET-ANCHORS-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-JI-SHUYING-2009-GOOGLE-BOOKS-PAGE-NUMBERED-SNIPPET-ANCHORS-IX.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
      - .github/workflows/probe-batch-12ix-ji15-google-books-public-html.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IX status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'tianwen/batch-12ix-exact-head',
              description: 'Batch 12IX Google Books pagination verification running'
            })
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12IX exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-JI-SHUYING-2009-GOOGLE-BOOKS-PAGE-NUMBERED-SNIPPET-ANCHORS-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-JI-SHUYING-2009-GOOGLE-BOOKS-PAGE-NUMBERED-SNIPPET-ANCHORS-IX'
          assert e['page_numbered_toc_direct']['chapter_9']['start_page']==133
          assert e['page_numbered_toc_direct']['chapter_10']['start_page']==163
          assert e['page_numbered_toc_direct']['chapter_11']['start_page']==179
          assert e['page_numbered_toc_direct']['chapter_12']['start_page']==189
          assert e['chapter_9_direct_page_controls']['exact_printed_span']=={'start_page':133,'end_page':162,'status':'DIRECTLY_CLOSED'}
          assert e['adjacent_chapter_controls']['chapter_10']['direct_end_page_content_reviewed'] is False
          assert e['adjacent_chapter_controls']['chapter_11']['exact_printed_span']['end_page']==188
          assert e['evidence_firewall']['whole_book_acquired'] is False
          assert e['project_consequence']['product_change'] is False
          PY
      - name: Publish success IX status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12ix-exact-head',
              description: 'Batch 12IX exact-head verification passed'
            })
      - name: Publish failure IX status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12ix-exact-head',
              description: 'Batch 12IX exact-head verification failed'
            })
