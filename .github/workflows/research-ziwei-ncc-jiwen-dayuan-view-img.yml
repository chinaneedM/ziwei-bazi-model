name: research-ziwei-ncc-jiwen-dayuan-view-img

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-ncc-jiwen-dayuan-view-img.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch only NCC source-emitted Jiwen/Dayuan sample images
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path('probe'); IMG=OUT/'images'; OUT.mkdir(); IMG.mkdir()
          UA='Mozilla/5.0 provenance-research ncc-public-sample-probe'
          routes=[
            ('dayuan_7346','https://www.ncc.com.tw/books/goods.php?act=view_img&id=7346','7346_'),
            ('jiwen_995','https://www.ncc.com.tw/books/goods.php?act=view_img&id=995','995_'),
          ]

          def fetch(url, limit=10_000_000):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,image/jpeg,image/png,image/webp,*/*;q=0.8','Accept-Language':'zh-TW,zh;q=0.9'})
            try:
              with urllib.request.urlopen(req,timeout=30) as resp:
                data=resp.read(limit)
                return {'ok':True,'status':getattr(resp,'status',None),'final_url':resp.geturl(),'content_type':resp.headers.get('content-type'),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'data':data}
            except Exception as exc:
              return {'ok':False,'error':repr(exc),'bytes':0,'data':b''}

          result={
            'schema':'ZIWEI-NCC-JIWEN-DAYUAN-PUBLIC-SAMPLE-IMAGE-ROUTES-R1',
            'access_date':'2026-09-08',
            'authentication_attempted':False,
            'purchase_attempted':False,
            'identifier_guessing_attempted':False,
            'access_control_bypass_attempted':False,
            'routes':[], 'images':[]
          }

          for label,url,prefix in routes:
            row=fetch(url); data=row.pop('data'); rec={'route':label,'url':url,**row,'source_emitted_relevant_urls':[]}
            if data:
              text=data.decode('utf-8','replace')
              (OUT/f'{label}.html').write_text(text,encoding='utf-8')
              urls=[]
              # Capture href/src and common JS quoted image literals, but only URLs that
              # the returned page itself emits and whose filename carries this product id.
              for pat in [r'''(?:href|src)\s*=\s*["']([^"']+)["']''', r'''["']([^"']*/books/images/[^"']+)["']''']:
                for m in re.finditer(pat,text,re.I):
                  u=urllib.parse.urljoin(row.get('final_url') or url,html.unescape(m.group(1)))
                  if prefix in u and re.search(r'\.(?:jpe?g|png|webp)(?:\?|$)',u,re.I) and u not in urls:
                    urls.append(u)
              rec['source_emitted_relevant_urls']=urls
              rec['source_emitted_relevant_url_count']=len(urls)
              for u in urls:
                ir=fetch(u,limit=8_000_000); raw=ir.pop('data'); item={'source_route':label,'url':u,**ir}
                c=(ir.get('content_type') or '').lower()
                if raw and ir.get('ok') and ('image' in c or raw[:3]==b'\xff\xd8\xff' or raw[:8]==b'\x89PNG\r\n\x1a\n'):
                  ext='.png' if ('png' in c or raw[:8]==b'\x89PNG\r\n\x1a\n') else '.webp' if 'webp' in c else '.jpg'
                  p=IMG/f'{label}-{len([x for x in result["images"] if x["source_route"]==label])+1:02d}{ext}'
                  p.write_bytes(raw); item['saved_file']=str(p)
                result['images'].append(item)
            result['routes'].append(rec)

          result['adjudication']={
            'source_emitted_only':True,
            'target_page_status':'PENDING_DIRECT_VISUAL_REVIEW',
            'independent_textual_witness_increment':0,
            'algorithm_effect':'NONE'
          }
          (OUT/'ziwei-ncc-jiwen-dayuan-public-sample-images.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({
            'routes':[{k:v for k,v in r.items() if k!='source_emitted_relevant_urls'} for r in result['routes']],
            'images':[{'source_route':x['source_route'],'url':x['url'],'status':x.get('status'),'bytes':x.get('bytes'),'sha256':x.get('sha256'),'saved_file':x.get('saved_file')} for x in result['images']],
            'adjudication':result['adjudication']
          },ensure_ascii=False,indent=2))

      - name: Upload public NCC samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-ncc-jiwen-dayuan-public-sample-images
          path: probe/
          if-no-files-found: warn
          retention-days: 14
