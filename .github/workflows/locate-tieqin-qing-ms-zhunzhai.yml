name: locate-tieqin-qing-ms-zhunzhai

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/locate-tieqin-qing-ms-zhunzhai.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Locate Zhunzhai in Tianyige Qing manuscript
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/tieqin-qing-ms-zhunzhai'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/locator" "$ROOT/hires"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-chi-tra-vert >/dev/null
          python -m pip install --quiet pillow

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/Tianyige-330000-1705-0004561%20%E9%90%B5%E7%90%B4%E9%8A%85%E5%8A%8D%E6%A8%93%E8%97%8F%E6%9B%B8%E7%9B%AE%20%E6%B8%85%E7%9E%BF%E9%8F%9E%E7%B7%A8%20%E6%B8%85%E6%8A%84%E6%9C%AC.pdf'
          curl -fL --retry 4 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/source.pdf"
          sha256sum "$ROOT/source.pdf" | tee "$ROOT/source-sha256.txt"
          pdfinfo "$ROOT/source.pdf" | tee "$ROOT/pdfinfo.txt"

          # 24 juan across 582 PDF pages; juan 15 is expected near the middle-late section.
          # Scan a broad but bounded window first; OCR is locator-only.
          pdftoppm -f 300 -l 430 -jpeg -r 125 "$ROOT/source.pdf" "$ROOT/locator/page" >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageEnhance
          import subprocess,re,json,hashlib
          root=Path('audit/tieqin-qing-ms-zhunzhai')
          terms=['準齋','准齋','几漏','九漏','孫逢古','孫逢吉','二十五箭','二十有五箭','文淵閣書目']
          hits=[]
          for p in sorted((root/'locator').glob('page-*.jpg')):
              n=int(re.search(r'-(\d+)\.jpg$',p.name).group(1))
              im=Image.open(p).convert('L')
              im=ImageOps.autocontrast(im)
              im=ImageEnhance.Contrast(im).enhance(1.35)
              tmp=root/'_ocr.png'; im.save(tmp)
              proc=subprocess.run(['tesseract',str(tmp),'stdout','-l','chi_tra_vert','--psm','5'],
                                  stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              txt=proc.stdout.decode('utf-8','ignore')
              compact=''.join(txt.split())
              found=[t for t in terms if t in compact]
              score=sum(1 for ch in '準准齋几九漏孫逢古吉箭文淵閣' if ch in compact)
              if found or score>=8:
                  hits.append({'pdf_page':n,'found':found,'score':score,'context':' '.join(txt.split())[:1800]})
          cand=sorted(set(x['pdf_page'] for x in hits))
          if cand:
              lo=max(1,min(cand)-2); hi=max(cand)+2
              subprocess.run(['pdftoppm','-f',str(lo),'-l',str(hi),'-png','-r','300',
                              str(root/'source.pdf'),str(root/'hires/page')],
                             check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          manifest=[]
          for hp in sorted((root/'hires').glob('page-*.png')):
              n=int(re.search(r'-(\d+)\.png$',hp.name).group(1))
              im=Image.open(hp)
              manifest.append({'pdf_page':n,'sha256':hashlib.sha256(hp.read_bytes()).hexdigest(),
                               'width':im.width,'height':im.height,'file':str(hp.relative_to(root))})
          report={
            'schema':'TIEQIN-QING-MS-ZHUNZHAI-LOCATOR-R1',
            'source_file':'Tianyige-330000-1705-0004561 鐵琴銅劍樓藏書目錄 清瞿鏞編 清抄本.pdf',
            'edition':'Tianyi Pavilion catalogued Qing manuscript; exact copy year unresolved',
            'source_pdf_sha256':hashlib.sha256((root/'source.pdf').read_bytes()).hexdigest(),
            'scan_window':'PDF p300-p430',
            'ocr_authority':'LOCATOR_ONLY_NOT_FINAL_GLYPH_AUTHORITY',
            'hits':hits,'candidate_pages':cand,'hires_manifest':manifest
          }
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if (root/'_ocr.png').exists(): (root/'_ocr.png').unlink()
          for p in (root/'locator').glob('page-*.jpg'): p.unlink()
          PY
          rm "$ROOT/source.pdf"

      - name: Upload locator evidence
        uses: actions/upload-artifact@v4
        with:
          name: tieqin-qing-ms-zhunzhai-r1
          path: audit/tieqin-qing-ms-zhunzhai
          if-no-files-found: error
          retention-days: 30
