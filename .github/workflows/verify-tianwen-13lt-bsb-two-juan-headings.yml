name: verify-tianwen-13lt-bsb-two-juan-headings
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - docs/research/TIANWEN-13LT-*
      - scripts/verify-tianwen-13lt-bsb-36-folios.py
      - tests/test_tianwen_13lt_bsb_folios.py
      - .github/workflows/verify-tianwen-13lt-bsb-two-juan-headings.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<12' beautifulsoup4
      - run: python scripts/verify-tianwen-13lt-bsb-36-folios.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13l*.py' -v
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
