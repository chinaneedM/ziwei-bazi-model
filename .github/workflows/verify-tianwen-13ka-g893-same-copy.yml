name: verify-tianwen-13ka-g893-same-copy
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - docs/research/TIANWEN-13KA-*
      - docs/research/TIANWEN-13JZ-G893-EXACT-PAGE-ACQUISITION-RECEIPT-R1.json
      - scripts/verify-tianwen-13ka-g893-same-copy.py
      - scripts/acquire-tianwen-13jz-g893-exact-pages.py
      - tests/test_tianwen_13jz_g893_exact_pages.py
      - tests/test_tianwen_13ka_g893_same_copy.py
      - .github/workflows/verify-tianwen-13ka-g893-same-copy.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Check source integrity, historical boundaries and handoff
        run: |
          python scripts/verify-tianwen-13ka-g893-same-copy.py
          python -m unittest discover -s tests -p 'test_tianwen_13jz_g893_exact_pages.py' -v
          python -m unittest discover -s tests -p 'test_tianwen_13ka_g893_same_copy.py' -v
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
