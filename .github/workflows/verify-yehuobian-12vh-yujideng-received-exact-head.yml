name: verify-yehuobian-12vh-yujideng-received-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12vh-yujideng-received-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VH-*.json
      - scripts/verify-yehuobian-yujideng-12vh.py
      - tests/test_yehuobian_yujideng_12vh.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify previous state and genealogy
        run: |
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Verify 12VH received-text firewalls and 14 regressions
        run: |
          python scripts/verify-yehuobian-yujideng-12vh.py
          python -m unittest discover -s tests -p 'test_yehuobian_yujideng_12vh.py' -v
