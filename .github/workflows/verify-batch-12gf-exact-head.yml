name: verify-batch-12gf-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gf-exact-head.yml
      - docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-NDL-2008-03-EXACT-CHILD-RECORD-AND-COPY-SURFACE-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-NDL-2008-03-EXACT-CHILD-RECORD-AND-COPY-SURFACE-BOUNDARY-GF.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GF exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-NDL-2008-03-EXACT-CHILD-RECORD-AND-COPY-SURFACE-BOUNDARY-GF'
          ep=Path('docs/research/ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-NDL-2008-03-EXACT-CHILD-RECORD-AND-COPY-SURFACE-BOUNDARY-R1.json')
          dp=Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-DENG-ZHICHENG-WUSHIZHAI28-NDL-2008-03-EXACT-CHILD-RECORD-AND-COPY-SURFACE-BOUNDARY-GF.md')
          assert ep.is_file() and dp.is_file()
          e=json.loads(ep.read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          p=e['parent_list_discovery']
          t=p['target_match']
          assert p['identifier_guessing_performed'] is False
          assert p['requested_offsets']==[0,20,40,60]
          assert t['child_suffix']=='i25264793'
          assert t['href']=='/books/R100000002-Ia0000052718-i25264793'
          assert t['total_issue_number']==66
          assert t['year']==2008 and t['issue']==3
          assert p['exact_target_child_record_status']=='CLOSED_SOURCE_EMITTED_FIRST_PARTY'

          c=e['exact_child_record_control']
          assert c['url']=='https://ndlsearch.ndl.go.jp/books/R100000002-Ia0000052718-i25264793'
          assert c['status']==200
          assert c['response_sha256']=='b8678d1bab127f7ee45ef5851aa8d16fc2a03cc1d5a606e18baad9abc8823e29'
          assert c['displayed_issue']=='2008(3) (通号 66) 2008'
          assert c['call_number']=='Z21-AC41'
          assert c['ndl_bib_id']=='a0000052718'
          assert c['exact_material_label_id']=='UNRESOLVED'
          assert c['target_article_pages_121_129_directly_reviewed'] is False
          assert c['target_article_body_directly_reviewed'] is False

          a=e['child_access_surface_control']
          assert a['generic_copy_help_present'] is True
          assert a['target_specific_remote_copy_eligibility_source_emitted'] is False
          assert a['target_specific_article_location_investigation_eligibility_source_emitted'] is False
          assert a['target_specific_request_button_or_cart_state_source_emitted'] is False
          assert a['exact_material_or_holding_item_id_resolved'] is False
          assert a['account_login_performed'] is False
          assert a['request_submitted'] is False
          assert a['fee_incurred'] is False

          target=e['target_status_after_batch']
          assert target['target_issue_child_record']=='CLOSED_NDL_I25264793'
          assert target['target_article_page_range']=='121-129'
          assert target['target_1950_01_29_exact_journal_page']=='UNRESOLVED'
          assert target['target_1950_01_29_primary_journal_text']=='NOT_REVIEWED'
          assert target['target_specific_ndl_remote_copy_eligibility']=='UNRESOLVED'
          assert target['exact_ndl_material_label_or_item_id']=='UNRESOLVED'
          assert target['target_1950_01_29_exact_facsimile_page']=='UNRESOLVED'
          assert target['target_1950_01_29_facsimile_text']=='NOT_REVIEWED'

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['schema_version']=='1.192.0'
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc'].endswith('NDL-2008-03-EXACT-CHILD-RECORD-AND-COPY-SURFACE-BOUNDARY-GF.md')
          assert state['historical_audit']['row_count']==198
          assert state['historical_audit']['audited_row_count']==166
          assert state['historical_audit']['current_missing_from_product_row_count']==10
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==14
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==14
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          parent=next(x for x in reg['sources'] if x.get('source_id')=='EXT-NDL-ZHONGGUO-DIANJI-YU-WENHUA-Z21-AC41')
          child=next(x for x in reg['sources'] if x.get('source_id')=='EXT-NDL-ZHONGGUO-DIANJI-YU-WENHUA-2008-03-I25264793')
          assert parent['batch_12gf']['exact_target_child_suffix']=='i25264793'
          assert parent['batch_12gf']['target_pages_121_129_reviewed'] is False
          assert child['batch_12gf']['child_suffix']=='i25264793'
          assert child['batch_12gf']['total_issue_number']==66
          assert child['batch_12gf']['target_specific_remote_copy_eligibility']=='UNRESOLVED'
          assert child['batch_12gf']['exact_material_label_or_item_id']=='UNRESOLVED'
          assert child['batch_12gf']['target_pages_121_129_reviewed'] is False

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_row_count_change'] is False
          PY
