name: acquire-ncl03130-summer-day-crops-13du
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - "scripts/acquire-ncl03130-summer-day-crops-13du.py"
      - ".github/workflows/acquire-ncl03130-summer-day-crops-13du.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native-summer:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source pixel libraries (no OCR)
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<1.28" "Pillow>=10,<13" requests
      - name: SHA-fence p86 original and capture D27-D29 numeric columns
        run: python scripts/acquire-ncl03130-summer-day-crops-13du.py
      - name: Keep source-native original crops and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncl03130-13du-summer-original-d27-d29-crops
          path: ncl03130-13du-summer-source-original-rois/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
