name: validate-batch-12br-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/validate-batch-12br-exact-head.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Historical provenance gate
        run: python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
      - name: Project continuity gate
        run: python scripts/verify-project-continuity-state-r1.py
      - name: Product gate
        run: python scripts/verify-fusion-chart-product-r1.py
      - name: Capability gate
        run: python scripts/verify-fusion-chart-capability-performance-r1.py
