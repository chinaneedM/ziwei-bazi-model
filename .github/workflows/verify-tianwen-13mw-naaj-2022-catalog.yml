name: verify-tianwen-13mw-naaj-2022-catalog
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/research/TIANWEN-13MW-NAJ-2022-FACSIMILE-CATALOG-SCOPE-R1.json
      - docs/research/TIANWEN-13MW-NAJ-2022-FACSIMILE-CATALOG-SCOPE-R1.md
      - scripts/verify-tianwen-13mw-naaj-catalog.py
      - tests/test_tianwen_13mw_naaj_catalog.py
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
      - .github/workflows/verify-tianwen-13mw-naaj-2022-catalog.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13mw-naaj-catalog.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13mw_naaj_catalog.py' -v
      - run: python scripts/verify-historical-source-registry-extensions-r1.py
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
