name: verify-batch-12gp-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12gp-exact-head.yml
      - docs/research/ZIWEI-JI-SHUYING-2004-BAICHUAN-ARTICLE-HOLDING-AND-FIFTEEN-LECTURES-SOURCE-GENEALOGY-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-JI-SHUYING-2004-BAICHUAN-ARTICLE-HOLDING-AND-FIFTEEN-LECTURES-SOURCE-GENEALOGY-BOUNDARY-GP.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12GP exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-JI-SHUYING-2004-BAICHUAN-ARTICLE-HOLDING-AND-FIFTEEN-LECTURES-SOURCE-GENEALOGY-BOUNDARY-GP'
          e=json.loads(Path('docs/research/ZIWEI-JI-SHUYING-2004-BAICHUAN-ARTICLE-HOLDING-AND-FIFTEEN-LECTURES-SOURCE-GENEALOGY-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          n=e['nlc_2010_bibliographic_control']
          assert n['provider']=='国家图书馆'
          assert n['article_title']=='百川归海，蔚为大观'
          assert n['container']=='冀淑英文集'
          assert n['publication_year']==2004
          assert n['direct_article_pages_reviewed'] is False

          t=e['taiwan_ncl_2015_control']
          assert t['article_title']=='百川归海，蔚为大观'
          assert t['publication_year']==2004
          assert t['direct_article_pages_reviewed'] is False

          h=e['tokyo_metropolitan_holding_control']
          assert h['provider']=='東京都立図書館'
          assert h['title']=='冀淑英文集'
          assert h['publication_date']=='2004.9'
          assert h['displayed_shelf_sequence']==['022.0','6001','2004']
          assert h['project_submitted_copy_request'] is False

          s=e['secondary_source_genealogy_locator']
          assert s['source_role']=='SECONDARY_DISCOVERY_LOCATOR_NOT_HISTORICAL_OR_BIBLIOGRAPHIC_AUTHORITY'
          assert s['direct_2009_postscript_reviewed'] is False
          assert s['direct_2004_editor_note_reviewed'] is False
          assert s['source_genealogy_status']=='SECONDARY_REPORTED_NOT_DIRECTLY_CLOSED'
          assert s['direct_copy_edge_authorized'] is False

          a=e['adjudication']
          assert a['baichuan_article_identity']=='CLOSED_AS_2004_WENJI_COMPONENT_BY_TWO_INDEPENDENT_INSTITUTIONAL_PUBLICATIONS'
          assert a['direct_2004_article_text']=='NOT_REVIEWED'
          assert a['direct_2009_postscript']=='NOT_REVIEWED'
          assert a['2009_derived_from_2004_baichuan']=='SECONDARY_REPORTED_NOT_DIRECTLY_CLOSED'
          assert a['target_specific_purchase_route_selected'] is False
          assert a['target_specific_donation_route_selected'] is False

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,202,0)
          assert bid in state['historical_audit']['completed_batches']
          assert state['historical_audit']['latest_batch_doc']=='docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-JI-SHUYING-2004-BAICHUAN-ARTICLE-HOLDING-AND-FIFTEEN-LECTURES-SOURCE-GENEALOGY-BOUNDARY-GP.md'

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          ids={x.get('source_id') for x in reg['sources']}
          assert {
            'EXT-NLC-HAIYUANGE-2010-BAICHUAN-WENJI-BIBLIOGRAPHIC-CONTROL',
            'EXT-TAIWAN-NCL-2015-BAICHUAN-WENJI-BIBLIOGRAPHIC-CONTROL',
            'EXT-TOKYO-METROPOLITAN-JI-SHUYING-WENJI-2004-HOLDING',
            'EXT-CINII-JI-SHUYING-WENJI-2004-HOLDINGS',
            'EXT-SHUGE-JI-2009-BAICHUAN-SOURCE-GENEALOGY-LOCATOR',
          }.issubset(ids)

          assert e['transmission_impact']['nodes_added']==[]
          assert e['transmission_impact']['edges_added']==[]
          assert e['transmission_impact']['direct_copy_edge_authorized'] is False
          assert e['chronology_and_rule_firewall']['runtime_rule_change'] is False
          assert e['chronology_and_rule_firewall']['algorithm_reopen_authorized'] is False
          assert e['chronology_and_rule_firewall']['candidate_collapse_authorized'] is False
          assert e['chronology_and_rule_firewall']['matrix_count_change'] is False
          assert e['accounting']['matrix_rows']==198
          assert e['accounting']['audited_rows']==166
          assert e['accounting']['current_missing_from_product_rows']==10
          assert e['accounting']['confirmed_provenance_metadata_defect_count']==14
          assert e['accounting']['repaired_provenance_metadata_defect_count']==14
          PY
