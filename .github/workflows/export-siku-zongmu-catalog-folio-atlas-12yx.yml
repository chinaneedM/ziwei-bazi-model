name: export-siku-zongmu-v106-nlc50-original-atlas-12yx
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/export-siku-zongmu-catalog-folio-atlas-12yx.py
      - .github/workflows/export-siku-zongmu-catalog-folio-atlas-12yx.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact image renderer with no OCR
        run: python -m pip install 'PyMuPDF>=1.24,<1.27' 'Pillow>=10,<12'
      - name: Download NLC fascicle 50 and SSID volume 106 exact public originals with stream SHA
        run: python scripts/export-siku-zongmu-catalog-folio-atlas-12yx.py
      - name: Preserve SHA-bound scanned originals, selected renders and complete page atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siku-zongmu-v106-nlc50-12yx-source-pages-atlas
          path: research-12yx-siku-catalog/
          retention-days: 20
          if-no-files-found: warn
