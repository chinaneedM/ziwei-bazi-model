name: verify-batch-12fn-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12fn-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12FN exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path

          bid='BATCH-12-ZIWEI-LIN-ZHENYUE-PREFACE-GAO-ANNOTATED-CATALOG-SOURCE-ATTRIBUTION-FN'
          e=json.loads(Path('docs/research/ZIWEI-LIN-ZHENYUE-PREFACE-GAO-ANNOTATED-CATALOG-SOURCE-ATTRIBUTION-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid

          p=e['public_text_control']
          assert p['visible_structure']['preface_author']=='林振岳'
          assert p['target_statement_author']=='林振岳'
          assert p['target_statement_is_directly_authored_by_tang_zhibo_or_zhao_yingjie'] is False
          assert p['repost_platform_is_original_authority'] is False

          a=e['adjudication']
          assert a['direct_modern_assertion_author']=='林振岳'
          assert a['underlying_volume_compilers']==['汤志波','赵颖洁']
          assert a['source_layer_collapse_forbidden'] is True
          assert a['gao_annotated_catalog_existence_status']=='ATTESTED_BY_LIN_ZHENYUE_PREFACE'
          assert a['current_holding']=='UNRESOLVED'
          assert a['shelfmark']=='UNRESOLVED'
          assert a['public_surrogate']=='UNRESOLVED'
          assert a['target_3482_3483_annotation']=='NOT_REVIEWED'
          assert a['target_transaction_mode']=='UNRESOLVED'
          assert a['source_attribution_metadata_repair_required'] is True
          assert a['chart_or_product_provenance_defect_counter_increment']==0

          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert state['historical_audit']['latest_batch_doc'].endswith('ZIWEI-LIN-ZHENYUE-PREFACE-GAO-ANNOTATED-CATALOG-SOURCE-ATTRIBUTION-FN.md')
          assert bid in state['historical_audit']['completed_batches']
          assert state['invariants']['deterministic_fusion_chart_product_r1']=='CLOSED'
          assert state['historical_audit']['row_count']==198
          assert state['historical_audit']['audited_row_count']==166
          assert state['historical_audit']['current_missing_from_product_row_count']==10
          assert state['historical_audit']['confirmed_provenance_metadata_defect_count']==13
          assert state['historical_audit']['repaired_provenance_metadata_defect_count']==13
          assert state['invariants']['confirmed_chart_algorithm_defect_count']==0
          assert state['invariants']['algorithm_reopen_count']==0
          assert state['invariants']['candidate_collapse_count']==0

          reg=json.loads(Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json').read_text(encoding='utf-8'))
          byid={x.get('source_id'):x for x in reg['sources']}
          canonical=byid['EXT-LIN-ZHENYUE-2025-PREFACE-QU-TRANSFER-GAO-ANNOTATED-CATALOG']
          alias=byid['EXT-TANG-ZHAO-2026-QU-TRANSFER-CATALOG-SEMANTICS-GAO-ANNOTATED-CATALOG-LEAD']
          profile=byid['EXT-SJTU-LIN-ZHENYUE-OFFICIAL-FACULTY-PROFILE']
          assert canonical['author']=='林振岳'
          assert canonical['batch_12fn']['source_layer_collapse_forbidden'] is True
          assert alias['deprecated_attribution_alias'] is True
          assert alias['superseded_by_source_id']==canonical['source_id']
          assert profile['batch_12fn']['author_identity_closed'] is True
          assert profile['batch_12fn']['target_catalog_custody_proved'] is False

          fl=json.loads(Path('docs/research/ZIWEI-QU-NLC-MIXED-TRANSFER-AND-TARGET-ACQUISITION-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          fls=fl['sources']['gao_xizeng_annotated_catalog_discovery_lead']
          assert fls['direct_statement_author']=='林振岳'
          assert fls['canonical_source_id']==canonical['source_id']

          fm=json.loads(Path('docs/research/ZIWEI-GAO-XIZENG-ANNOTATED-TIEQIN-CATALOG-HOLDING-AND-ACCESS-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert fm['adjudication']['gao_annotated_tieqin_catalog_existence']=='ATTESTED_BY_LIN_ZHENYUE_PREFACE'
          fms=fm['sources']['lin_zhenyue_2025_preface_gao_annotated_catalog_attestation']
          assert fms['preface_author']=='林振岳'
          assert fms['canonical_source_id']==canonical['source_id']

          t=e['transmission_impact']
          assert t['nodes_added']==[] and t['edges_added']==[]
          assert t['acquisition_edge_authorized'] is False
          assert t['same_object_edge_authorized'] is False
          r=e['chronology_and_rule_firewall']
          assert r['direct_sanming_parent_vote_increment']==0
          assert r['runtime_rule_change'] is False
          assert r['algorithm_reopen_authorized'] is False
          assert r['candidate_collapse_authorized'] is False
          assert r['matrix_count_change'] is False

          graph=json.loads(Path('docs/TRANSMISSION-GENEALOGY-GRAPH-R1.json').read_text(encoding='utf-8'))
          assert not any(x.get('latest_scope_update_batch')==bid for x in graph.get('nodes', []))
          assert not any(x.get('latest_scope_update_batch')==bid for x in graph.get('edges', []))
          PY
