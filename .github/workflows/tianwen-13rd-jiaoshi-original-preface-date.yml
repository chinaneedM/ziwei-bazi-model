name: tianwen-13rd-jiaoshi-original-preface-date
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/tianwen-13rd-jiaoshi-original-preface-date.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  original-preface:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --silent puppeteer-core@24.16.0
      - name: Acquire bounded official original preface leaves (no OCR)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tianwen-13rd
          mkdir -p audit/13rd
          cat >audit/13rd/fetch.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const book='GK00067_00', root='/tmp/tianwen-13rd';
          const leaves=['001b','002a','002b','003a','003b','004a','004b'];
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.BROWSER,args:['--no-sandbox','--disable-setuid-sandbox']});
          const page=await browser.newPage();
          await page.goto('https://kyudb.snu.ac.kr/book/list.do?book_cate=SIC04&mid=GDS',{waitUntil:'networkidle2',timeout:90000});
          const source=await page.evaluate(book=>{
            const tr=[...document.querySelectorAll('tr')].find(x=>x.textContent?.includes('交食推步法')&&x.querySelector('input[value="'+book+'"]'));
            return tr?{title:'交食推步法',book_cd:book,firstparty_control:tr.querySelector('a[onclick*="fn_originalImg"]')?.getAttribute('onclick')}:null;
          },book);
          if(!source?.firstparty_control?.includes(book))throw Error('Missing firstparty book ID and original control');
          const results=[];
          for(const p of leaves){
            const fn=`${book}IH_0001_${p}.jpg`;
            const sp=`/data01/stream/SIC/IMG/${book}/${book}_0001/${fn}`;
            const url=`https://kyudb.snu.ac.kr/ImageServlet.do?imgFileNm=${encodeURIComponent(fn)}&path=${encodeURIComponent(sp)}`;
            const tab=await browser.newPage();
            let bytes=null,status=null,error=null;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const response=await tab.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                status=response?.status()??null;
                if(response?.ok()){
                  const x=await response.buffer();
                  if(x.length>50000&&x[0]===255&&x[1]===216){bytes=x;break;}
                }
              }catch(e){error=String(e)}
            }
            await tab.close();
            const item={page:p,http_status:status,byte_length:bytes?.length??0,sha256:bytes?crypto.createHash('sha256').update(bytes).digest('hex'):null,source_url:url,error};
            if(bytes)fs.writeFileSync(`${root}/${p}.jpg`,bytes);
            results.push(item);
            console.log('13RD_ORIGINAL '+JSON.stringify({page:p,status,bytes:item.byte_length,sha256:item.sha256,error}));
          }
          fs.writeFileSync(root+'/receipt.json',JSON.stringify({schema:'TIANWEN-13RD-GK00067-PREFACE-BYTES',source,results,ocr:false,judgment:'UNREAD_ORIGINAL_FOLIOS_NO_DATE_WINNER'},null,2)+'\n');
          await browser.close();
          if(!results.some(x=>x.sha256))process.exitCode=2;
          JS
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          BROWSER="$BROWSER" node audit/13rd/fetch.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tianwen-13rd-jiaoshi-original-preface-pages
          path: /tmp/tianwen-13rd/
          retention-days: 14
          if-no-files-found: warn
