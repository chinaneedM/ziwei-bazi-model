name: acquire-mei-lizhi-v3v4-original-12yr
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-mei-lizhi-v3v4-original-12yr.py
      - .github/workflows/acquire-mei-lizhi-v3v4-original-12yr.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install faithful original DjVu decoding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install 'Pillow>=10,<12'
      - name: Fetch exact IA original source and generate hash-bound no-OCR page atlas
        run: python scripts/acquire-mei-lizhi-v3v4-original-12yr.py
      - name: Preserve downloaded source, hashes, and review atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-v3-v4-12yr-original-djvu-and-atlas
          path: research-12yr-mei-original/
          if-no-files-found: warn
          retention-days: 14
