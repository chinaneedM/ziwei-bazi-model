name: acquire-tianwen-13lm-naaj-p7-native-controls
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-tianwen-13lm-naaj-p7-native-controls.py
      - .github/workflows/acquire-tianwen-13lm-naaj-p7-native-controls.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-color:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/acquire-tianwen-13lm-naaj-p7-native-controls.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13lm-naaj-p7-native-source-regions
          path: 13lm-naaj-p7-native-output/
          retention-days: 7
