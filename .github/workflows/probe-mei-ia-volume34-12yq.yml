name: probe-mei-ia-volume34-route-12yq
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/locate-mei-ia-volume34-12yq.py
      - .github/workflows/probe-mei-ia-volume34-12yq.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover-original-book-route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact archive item from published Wikisource historical scan catalogue
        run: python scripts/locate-mei-ia-volume34-12yq.py
      - name: Preserve non-original metadata locator and network outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mei-datong-lizhi-v3-v4-12yq-ia-catalog-link
          path: research-12yq-mei-ia/
          if-no-files-found: warn
          retention-days: 14
