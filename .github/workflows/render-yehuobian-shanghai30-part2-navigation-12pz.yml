name: render-yehuobian-shanghai30-part2-navigation-12pz
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/render-yehuobian-shanghai30-part2-navigation-12pz.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF imaging tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils imagemagick
      - name: Download fixed Shanghai Library surrogate and check Commons SHA1
        run: |
          set -euo pipefail
          mkdir -p 12pz-sh30/source 12pz-sh30/pages 12pz-sh30/contacts
          root='https://commons.wikimedia.org/wiki/Special:Redirect/file'
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 3 --max-time 1200 -A 'Tianwen-Historical-Provenance-R1/1.0' "$root/Shanghai_%E8%90%AC%E6%9B%86%E9%87%8E%E7%8D%B2%E7%B7%A8%E4%B8%89%E5%8D%81%E5%8D%B7_part_2.pdf" -o 12pz-sh30/source/part2.pdf
          printf '%s  %s\n' '8b6c144319979011238a079260872c5868f9f83d' '12pz-sh30/source/part2.pdf' | sha1sum -c -
          sha256sum 12pz-sh30/source/part2.pdf > 12pz-sh30/source-sha256.txt
          sha1sum 12pz-sh30/source/part2.pdf > 12pz-sh30/source-sha1.txt
          pdfinfo 12pz-sh30/source/part2.pdf > 12pz-sh30/pdfinfo.txt
          test "$(awk '/^Pages:/ {print $2}' 12pz-sh30/pdfinfo.txt)" = 550
      - name: Render page-index navigational contacts with no OCR
        run: |
          set -euo pipefail
          pdftoppm -f 1 -l 550 -scale-to 800 -jpeg -jpegopt quality=80 12pz-sh30/source/part2.pdf 12pz-sh30/pages/p >/dev/null 2>&1
          mapfile -t pages < <(find 12pz-sh30/pages -maxdepth 1 -name 'p-*.jpg' | sort -V)
          test "${#pages[@]}" -eq 550
          for ((offset=0; offset<550; offset+=16)); do
            low=$((1+offset))
            high=$((low+15))
            ((high<=550)) || high=550
            chunk=("${pages[@]:offset:16}")
            montage -label '%f' "${chunk[@]}" -thumbnail 370x300 -tile 4x4 -geometry +5+23 "12pz-sh30/contacts/shanghai30-part2-p${low}-p${high}.jpg"
          done
          test "$(find 12pz-sh30/contacts -name '*.jpg' | wc -l)" -eq 35
          (cd 12pz-sh30 && sha256sum contacts/*.jpg > contact-sha256.txt)
          cat > 12pz-sh30/manifest.txt <<'EOF'
          WITNESS=Shanghai Library labelled thirty-volume Wanli Yehuobian
          SURROGATE=Shanghai_萬曆野獲編三十卷_part_2.pdf
          COMMONS_SHA1=8b6c144319979011238a079260872c5868f9f83d
          PDF_PAGES=550
          THUMBNAIL_NAVIGATION=1..550
          CONTACT_SHEETS=35
          OCR_USED=false
          ORIGINAL_IMPRESSION_1827=NOT_YET_VERIFIED
          PHYSICAL_TARGET_KAIZAO_LOUKE=NOT_YET_LOCATED
          PDF_PAGE_NUMBER_NOT_HISTORICAL_FOLIATION=true
          ABSENCE_CLAIM_FOR_UNINSPECTED_PAGES=FORBIDDEN
          EOF
      - name: Upload contacts and hashes without redistributing 169MB scan
        uses: actions/upload-artifact@v4
        with:
          name: shanghai-yehuobian-30v-part2-navigation-12pz
          path: |
            12pz-sh30/contacts/
            12pz-sh30/source-sha1.txt
            12pz-sh30/source-sha256.txt
            12pz-sh30/contact-sha256.txt
            12pz-sh30/pdfinfo.txt
            12pz-sh30/manifest.txt
          if-no-files-found: error
          retention-days: 30
