name: acquire-ncl03130-part09-complete-page-map-13dl
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - "scripts/acquire-ncl03130-part09-complete-page-map-13dl.py"
      - ".github/workflows/acquire-ncl03130-part09-complete-page-map-13dl.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-visual-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deterministic image dependencies (no OCR)
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.24,<1.28" "Pillow>=10,<13" requests
      - name: Hash-check complete 189-page source and emit original image navigation sheets
        run: python scripts/acquire-ncl03130-part09-complete-page-map-13dl.py
      - name: Retain source page-map and native page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncl03130-part09-complete-visual-map-13dl
          path: ncl03130-13dl-part09-full-visual-map/
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
