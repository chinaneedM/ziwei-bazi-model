name: sync-batch12as-state-once

on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/sync-batch12as-state-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fusion-chart-core-r1-20260822
      - name: Synchronize Batch 12AS continuity state and source registry
        shell: python
        run: |
          import json
          from pathlib import Path

          batch = 'BATCH-12-ZIWEI-TUSHUBIAN-1613-TIMEKEEPING-RECENSION-MAPPING-AS'
          batch_doc = 'docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-TUSHUBIAN-1613-TIMEKEEPING-RECENSION-MAPPING-AS.md'

          state_path = Path('docs/PROJECT-CURRENT-STATE-R1.json')
          state = json.loads(state_path.read_text('utf-8'))
          assert state['schema'] == 'ZIWEI-BAZI-PROJECT-CURRENT-STATE-R1'
          assert state['historical_audit']['row_count'] == 198
          assert state['historical_audit']['audited_row_count'] == 166
          assert state['invariants']['deterministic_fusion_chart_product_r1'] == 'CLOSED'
          assert state['invariants']['confirmed_chart_algorithm_defect_count'] == 0
          assert state['invariants']['algorithm_reopen_count'] == 0
          assert state['invariants']['candidate_collapse_count'] == 0
          assert state['invariants']['ziwei_self_inward_transformation_direction'] == 'NOT_YET_FORMALIZED'

          completed = state['historical_audit']['completed_batches']
          if batch not in completed:
              completed.append(batch)
          state['historical_audit']['latest_batch_doc'] = batch_doc
          state['schema_version'] = '1.52.0'

          focus_additions = [
              'Batch 12AS corrects the Tushu Bian physical locator: Harvard v.32 PDF p3 directly begins 圖書編卷之二十二 / 時令總敘, while Harvard v.38 p3 begins 卷二十八 and is not the timekeeping target. Bare juan numbers are recension-scoped and must not be cross-mapped without edition-specific physical evidence.',
              'Batch 12AS Harvard v.32 p38 directly reads 若子時則上半時在夜半前屬昨日下半時在夜半後屬今日. This strongly corroborates the generic midnight previous/current-day orientation but is not mechanically identical to Fullbook 上五刻屬昨夜亥時 because 屬昨日 does not itself reclassify the upper half to Hai branch.',
              'Batch 12AS Harvard v.32 p39/p41 directly binds 刻漏總論 and clepsydra timekeeping calibrated by astronomical instruments/celestial motion. This strengthens the early technical bridge but does not authorize inserting 行漏/刻漏 into the Fullbook 陰雨之際必須羅經 sentence.',
              'HPA-ZDATE-006 remains MISSING_FROM_PRODUCT after Batch 12AS. Fullbook-line cloudy/rainy current-time acquisition remains unresolved; runtime standard selection, candidate collapse and algorithm reopen all remain forbidden pending a source-scoped mechanical chain.'
          ]
          focus = state['historical_audit']['current_focus']
          for item in focus_additions:
              if item not in focus:
                  focus.append(item)

          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', 'utf-8')

          registry_path = Path('docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json')
          registry = json.loads(registry_path.read_text('utf-8'))
          assert registry['schema'] == 'FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1'
          ids = {s.get('source_id') for s in registry['sources']}
          source_id = 'EXT-TUSHUBIAN-HARVARD-1613-V32'
          if source_id not in ids:
              registry['sources'].append({
                  'source_id': source_id,
                  'title': '《圖書編》卷二十二《時令總敘》/《刻漏總論》',
                  'author': '章潢',
                  'historical_period': '明',
                  'edition': '明萬曆四十一年（1613）涂鏡源等刊本系；Harvard-Yenching physical scan object v.32',
                  'provider': 'Harvard-Yenching Library scan via Wikimedia Commons',
                  'url': 'https://commons.wikimedia.org/wiki/File:Harvard_drs_428499316_%E5%9C%96%E6%9B%B8%E7%B7%A8_v.32.pdf',
                  'source_role': 'DIRECT_PRIMARY_PHYSICAL_FACSIMILE_TIMEKEEPING_AND_RECENSION_MAPPING_WITNESS',
                  'quality_notes': 'Batch 12AS no-OCR direct visual collation. PDF SHA-256 44512e7ca354ff94a87c7c5c84ddea61ba46812371707c2c4ecaf2a2d47f83ba. PDF p3 directly binds internal 卷二十二 / 時令總敘; p37 shows 古漏圖/今漏圖; p38 reads upper-half Zi before midnight as previous day and lower-half after midnight as current day; p39 is 刻漏總論; p41 calibrates timekeeping against 儀象/天星行度. This witness does not prove Fullbook upper-half-Zi Hai-branch reclassification and does not close the Fullbook cloudy/rain current-time acquisition mechanism. Cross-recension bare juan-number equivalence is explicitly forbidden.',
                  'research_artifact': 'docs/research/ZIWEI-TUSHUBIAN-1613-TIMEKEEPING-RECENSION-MAPPING-R1.json',
                  'audit_batch': batch,
                  'workflow_evidence': {
                      'v32_locator_run': 34543115889,
                      'v32_locator_artifact': 10178011062,
                      'timekeeping_pages_run': 34543260640,
                      'timekeeping_pages_artifact': 10178062853
                  }
              })
          registry['access_date'] = '2026-09-11'
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', 'utf-8')
      - name: Verify continuity invariants
        run: python scripts/verify-project-continuity-state-r1.py
      - name: Commit synchronized durable state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PROJECT-CURRENT-STATE-R1.json docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
          if git diff --cached --quiet; then
            echo 'No state changes required.'
            exit 0
          fi
          git commit -m 'sync Batch 12AS continuity state'
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
