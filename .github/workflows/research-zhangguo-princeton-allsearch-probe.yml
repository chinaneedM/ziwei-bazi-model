name: research-zhangguo-princeton-allsearch-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-zhangguo-princeton-allsearch-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe exact Princeton catalog image transport without TLS bypass
        run: |
          python - <<'PY'
          import hashlib, http.client, json, ssl, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          API='https://allsearch-api.princeton.edu/search/catalog'
          UA='Mozilla/5.0 ziwei-bazi-model historical-provenance-research/1.2'

          def https_fetch(url, accept='*/*'):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(40_000_000)
                      return ({
                          'requested_url':url,'status':r.status,'final_url':r.geturl(),
                          'content_type':r.headers.get('content-type'),'body_len':len(b),
                          'sha256':hashlib.sha256(b).hexdigest(),
                      }, b)
              except Exception as e:
                  return ({'requested_url':url,'error':f'{type(e).__name__}: {e}'}, b'')

          search_url=API+'?'+urllib.parse.urlencode({'query':'TC183/2991'})
          sr,sbody=https_fetch(search_url,'application/json')
          data=json.loads(sbody.decode('utf-8'))
          assert data.get('number') == 1, data
          rec=data['records'][0]
          assert rec.get('id') == '9940551833506421', rec
          assert rec.get('other_fields',{}).get('first_call_number') == 'TC183/2991', rec
          resource=rec.get('other_fields',{}).get('resource_url')
          label=rec.get('other_fields',{}).get('resource_url_label')
          assert resource and resource.startswith('https://libimages1.princeton.edu/'), rec
          assert label == 'First page of main text', rec

          # First try the exact HTTPS resource with normal certificate validation.
          https_meta,https_body=https_fetch(resource,'image/jpeg,image/*,*/*')
          if https_meta.get('status') == 200 and len(https_body) > 1000:
              Path('princeton-NJPX95B1857-first-main-text.jpg').write_bytes(https_body)

          # Then test only the same emitted host/path over plain HTTP. This is a transport
          # observation, not a guessed page/resource identifier, and no TLS check is disabled.
          parsed=urllib.parse.urlparse(resource)
          conn=http.client.HTTPConnection(parsed.hostname,80,timeout=30)
          path=parsed.path + (('?' + parsed.query) if parsed.query else '')
          try:
              conn.request('GET',path,headers={'User-Agent':UA,'Accept':'image/jpeg,image/*,*/*'})
              resp=conn.getresponse(); hbody=resp.read(40_000_000)
              http_meta={
                  'requested_url':'http://'+parsed.netloc+path,
                  'status':resp.status,'reason':resp.reason,
                  'location':resp.getheader('Location'),
                  'content_type':resp.getheader('Content-Type'),
                  'body_len':len(hbody),'sha256':hashlib.sha256(hbody).hexdigest(),
              }
              if resp.status == 200 and len(hbody)>1000 and (resp.getheader('Content-Type') or '').lower().startswith('image/'):
                  Path('princeton-NJPX95B1857-first-main-text-http.jpg').write_bytes(hbody)
          except Exception as e:
              http_meta={'requested_url':'http://'+parsed.netloc+path,'error':f'{type(e).__name__}: {e}'}
          finally:
              conn.close()

          out={
              'schema':'ZIWEI-ZHANGGUO-PRINCETON-PUBLIC-CATALOG-IMAGE-TRANSPORT-R1',
              'search_query':'TC183/2991',
              'search_response':sr,
              'search_number':data.get('number'),
              'record':rec,
              'emitted_resource_label':label,
              'emitted_resource_url':resource,
              'https_normal_validation':https_meta,
              'http_same_host_path_transport':http_meta,
              'image_bytes_obtained_with_normal_validation':Path('princeton-NJPX95B1857-first-main-text.jpg').exists(),
              'image_bytes_obtained_over_http_same_path':Path('princeton-NJPX95B1857-first-main-text-http.jpg').exists(),
              'target_leaf_obtained':False,
              'target_glyph_collation_authorized':False,
              'policy':'EXACT_PUBLIC_FIRST_PARTY_ALLSEARCH_RECORD_AND_EXACT_EMITTED IMAGE RESOURCE ONLY; NORMAL TLS VALIDATION; SAME HOST_PATH HTTP TRANSPORT OBSERVATION ONLY; NO CERTIFICATE BYPASS; NO PAGE ID GUESSING; NO LOGIN; NO AUTH BYPASS',
          }
          Path('princeton-zhangguo-image-transport.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: princeton-zhangguo-public-image-transport
          path: |
            princeton-zhangguo-image-transport.json
            princeton-NJPX95B1857-first-main-text*.jpg
          if-no-files-found: error
