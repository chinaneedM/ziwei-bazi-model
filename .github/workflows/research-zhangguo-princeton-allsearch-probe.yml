name: research-zhangguo-princeton-allsearch-probe

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/research-zhangguo-princeton-allsearch-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact Princeton catalog record and emitted first-page resource
        run: |
          python - <<'PY'
          import hashlib, json, urllib.parse, urllib.request
          from pathlib import Path

          API='https://allsearch-api.princeton.edu/search/catalog'
          UA='Mozilla/5.0 ziwei-bazi-model historical-provenance-research/1.1'

          def fetch(url, accept='*/*'):
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':accept})
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read(40_000_000)
                  return {
                      'requested_url':url,'status':r.status,'final_url':r.geturl(),
                      'content_type':r.headers.get('content-type'),'body_len':len(b),
                      'sha256':hashlib.sha256(b).hexdigest(),'body':b,
                  }

          search_url=API+'?'+urllib.parse.urlencode({'query':'TC183/2991'})
          sr=fetch(search_url,'application/json')
          sbody=sr.pop('body')
          data=json.loads(sbody.decode('utf-8'))
          assert data.get('number') == 1, data
          rec=data['records'][0]
          assert rec.get('id') == '9940551833506421', rec
          assert rec.get('other_fields',{}).get('first_call_number') == 'TC183/2991', rec
          resource=rec.get('other_fields',{}).get('resource_url')
          label=rec.get('other_fields',{}).get('resource_url_label')
          assert resource and resource.startswith('https://libimages1.princeton.edu/'), rec
          assert label == 'First page of main text', rec

          cr=fetch(rec['url'],'text/html,*/*'); cbody=cr.pop('body')
          ir=fetch(resource,'image/jpeg,image/*,*/*'); ibody=ir.pop('body')
          assert ir.get('status') == 200 and len(ibody) > 1000, ir
          Path('princeton-NJPX95B1857-first-main-text.jpg').write_bytes(ibody)

          # Standard IIIF info request for the exact same image identifier emitted by Princeton;
          # no other page identifier is derived or guessed.
          info_url=resource.split('/full/full/0/default.jpg',1)[0]+'/info.json'
          try:
              xr=fetch(info_url,'application/json,*/*'); xbody=xr.pop('body')
              try: xdata=json.loads(xbody.decode('utf-8'))
              except Exception: xdata={'body_prefix':xbody[:4000].decode('utf-8','replace')}
          except Exception as e:
              xr={'requested_url':info_url,'error':f'{type(e).__name__}: {e}'}; xdata=None

          out={
              'schema':'ZIWEI-ZHANGGUO-PRINCETON-PUBLIC-CATALOG-FIRST-PAGE-PROBE-R1',
              'search_query':'TC183/2991',
              'search_response':sr,
              'search_number':data.get('number'),
              'record':rec,
              'catalog_page_response':cr,
              'catalog_page_sha256':hashlib.sha256(cbody).hexdigest(),
              'catalog_page_body_len':len(cbody),
              'emitted_resource_label':label,
              'emitted_resource_url':resource,
              'emitted_resource_response':ir,
              'iiif_info_url_same_identifier':info_url,
              'iiif_info_response':xr,
              'iiif_info':xdata,
              'target_leaf_obtained':False,
              'target_glyph_collation_authorized':False,
              'policy':'FOLLOW_EXACT_PUBLIC_FIRST_PARTY_ALLSEARCH_RESULT_AND_EXACT_EMITTED_RESOURCE_URL_ONLY; STANDARD_IIIF_INFO_FOR_SAME_IDENTIFIER_ONLY; NO OTHER PAGE ID GUESSING; NO LOGIN; NO AUTH BYPASS',
          }
          Path('princeton-zhangguo-first-page-probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: princeton-zhangguo-public-first-page-probe
          path: |
            princeton-zhangguo-first-page-probe.json
            princeton-NJPX95B1857-first-main-text.jpg
          if-no-files-found: error
