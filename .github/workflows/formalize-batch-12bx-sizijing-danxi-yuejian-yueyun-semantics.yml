name: formalize-batch-12bx-sizijing-danxi-yuejian-yueyun-semantics

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/formalize-batch-12bx-sizijing-danxi-yuejian-yueyun-semantics.yml

permissions:
  contents: write

jobs:
  formalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Formalize and validate Batch 12BX
        shell: bash
        run: |
          set -euo pipefail
          python scripts/formalize-batch-12bx-sizijing-danxi-yuejian-yueyun-semantics.py
          python scripts/verify-project-continuity-state-r1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/verify-project-continuity-state-r1.py \
            docs/PROJECT-CURRENT-STATE-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-SIZIJING-DANXI-YUEJIAN-YUEYUN-SEMANTICS-BX.md \
            docs/research/ZIWEI-SIZIJING-DANXI-YUEJIAN-YUEYUN-SEMANTICS-R1.json
          if git diff --cached --quiet; then
            echo "No formalization changes required"
            exit 0
          fi
          git commit -m "formalize Batch 12BX Sizijing danxi yuejian yueyun semantics"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
