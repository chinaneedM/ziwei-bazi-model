name: research-ziwei-sanmintonghui-1578-timekeeping-pages-at-r5

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-sanmintonghui-1578-timekeeping-pages-at-r5.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Render exact NCL 1578 target pages at high resolution
        shell: python
        run: |
          import hashlib, io, json, urllib.parse, urllib.request
          from pathlib import Path
          import fitz
          from PIL import Image

          out=Path('batch12at-r5'); out.mkdir(exist_ok=True)
          title='File:NCL-06589 1 三命通會.pdf'
          api=('https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo'
               '&iiprop=url%7Csize%7Csha1&titles='+urllib.parse.quote(title))
          req=urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              obj=json.loads(r.read().decode('utf-8'))
          page=next(iter(obj.get('query',{}).get('pages',{}).values()))
          info=(page.get('imageinfo') or [None])[0]
          if not info or not info.get('url'): raise SystemExit('No source-emitted NCL PDF URL')

          pdf=out/'sanming-1578-main.pdf'
          req=urllib.request.Request(info['url'],headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=240) as r: pdf.write_bytes(r.read())
          doc=fitz.open(str(pdf))
          if len(doc) != 1000: raise SystemExit(f'Unexpected main-file page count: {len(doc)}')

          rendered=[]
          for p1 in (132,133,136,137):
              pix=doc[p1-1].get_pixmap(matrix=fitz.Matrix(1.8,1.8),alpha=False)
              im=Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGB')
              fn=f'page-{p1:04d}.jpg'
              im.save(out/fn,quality=98,subsampling=0)
              rendered.append({
                'page':p1,
                'file':fn,
                'sha256':hashlib.sha256((out/fn).read_bytes()).hexdigest(),
                'width':im.width,
                'height':im.height,
              })

          receipt={
            'scope':'BATCH12AT_R5_SANMING_TONGHUI_1578_DIRECT_TARGET_GLYPH_LOCK',
            'commons_file_title':title,
            'commons_source_sha1':info.get('sha1'),
            'commons_source_size':info.get('size'),
            'pdf_sha256':hashlib.sha256(pdf.read_bytes()).hexdigest(),
            'page_count':len(doc),
            'rendered':rendered,
            'expected_sections':{
              '132':'論日刻',
              '133':'論時刻',
              '136_137':'論曰 birth-time / midnight / Zi-Hai / weather passage'
            },
            'ocr_generated':False,
            'manual_visual_review_required':True,
            'recension_glyph_normalization_authorized':False,
            'textual_independence_from_tushubian_assumed':False,
            'borrowing_direction_assumed':False,
            'fullbook_hai_reclassification_equivalence_assumed':False,
            'fullbook_inclement_time_chain_closed':False,
            'runtime_standard_selected':False,
            'candidate_collapse_authorized':False,
            'algorithm_reopen_authorized':False
          }
          (out/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n','utf-8')
          pdf.unlink()
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-sanmintonghui-1578-target-glyph-lock-at-r5
          path: batch12at-r5
          retention-days: 90
