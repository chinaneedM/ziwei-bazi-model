name: research-ziwei-yulgok-tree-targeted-aj

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-yulgok-tree-targeted-aj.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Follow only current-record path in source-emitted tree
        shell: python
        run: |
          import hashlib, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          OUT=Path("probe"); OUT.mkdir()
          base="https://db.yulgok.or.kr"
          viewer=base+"/viewer/view?dataId=B005_01_B00320_001"
          root=base+"/viewer/treeAjax?itemId=PD&cate=organImg&depth=1&upPath=%EA%B0%9C%EC%9D%B8&treeType=pubSvc&dataId="
          ua="Mozilla/5.0 provenance-research yulgok-targeted-tree"

          def fetch(url):
              h={"User-Agent":ua,"Accept":"text/html,*/*;q=0.8","Referer":viewer,"Accept-Language":"ko,en;q=0.7"}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=25) as r:
                      d=r.read(2500000)
                      return {"ok":True,"status":r.status,"final_url":r.geturl(),"bytes":len(d),"sha256":hashlib.sha256(d).hexdigest(),"data":d}
              except Exception as e:
                  return {"ok":False,"error":repr(e),"bytes":0,"data":b""}

          def urls(txt,current):
              out=[]
              for pat in [r'''\{url:([^}\s]+)\}''',r'''data-url=["']([^"']+)["']''']:
                  for m in re.finditer(pat,txt,re.I):
                      v=html.unescape(m.group(1)).replace("\\/","/").strip().strip("'\"")
                      u=urllib.parse.urljoin(current,v)
                      if u.startswith(base) and u not in out: out.append(u)
              return out

          # Exact path components are taken from dataJSon.upPath embedded in the public viewer:
          # 개인^B005^고전적^자부^술수류(術數類)
          path_tokens=["B005","고전적","자부","술수류","術數類","B00320","紫薇","斗數","자미"]
          frontier=[root]
          seen=set(); recs=[]; contexts=[]; observed_ids=set()
          for level in range(7):
              nxt=[]
              for u in frontier:
                  if u in seen: continue
                  seen.add(u)
                  row=fetch(u); d=row.pop("data")
                  txt=d.decode("utf-8","replace") if d else ""
                  es=urls(txt,row.get("final_url") or u)
                  recs.append({"level":level,"url":u,**row,"emitted_urls":es,"body":txt})
                  for m in re.finditer(r'''B005_01_B00320_[A-Za-z0-9_\-]+''',txt):
                      observed_ids.add(m.group(0))
                  if any(t in txt for t in path_tokens):
                      contexts.append({"level":level,"url":u,"text":txt[:120000]})
                  # Follow only source-returned tree URLs whose own URL or containing body is on the exact current path.
                  for e in es:
                      if "/viewer/treeAjax?" not in e or e in seen: continue
                      dec=urllib.parse.unquote(e)
                      if any(t in dec for t in ("B005","고전적","자부","술수류","術數類")) or any(t in txt for t in ("B005","고전적","자부","술수류","術數類")):
                          if e not in nxt: nxt.append(e)
              frontier=nxt[:30]
              if not frontier: break

          result={"schema":"ZIWEI-YULGOK-TARGETED-TREE-AJ-R1","access_date":"2026-09-09","root":root,"records":[{k:v for k,v in x.items() if k!="body"} for x in recs],"contexts":contexts,"exact_source_observed_data_ids":sorted(observed_ids),"authentication_attempted":False,"identifier_guessing_attempted":False,"access_control_bypass_attempted":False}
          (OUT/"ziwei-yulgok-targeted-tree-aj.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({"requests":len(recs),"levels":sorted(set(x["level"] for x in recs)),"observed_ids":sorted(observed_ids),"context_samples":[{"level":x["level"],"url":x["url"],"text":x["text"][:5000]} for x in contexts[:12]]},ensure_ascii=False,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-yulgok-tree-targeted-aj
          path: probe/
          retention-days: 14
