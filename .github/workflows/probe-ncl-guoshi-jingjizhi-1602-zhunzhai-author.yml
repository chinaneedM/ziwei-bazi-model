name: probe-ncl-guoshi-jingjizhi-1602-zhunzhai-author

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-ncl-guoshi-jingjizhi-1602-zhunzhai-author.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Acquire 1602 original Guoshi Jingjizhi v3 and locate Zhunzhai author
        shell: bash
        run: |
          set -euo pipefail
          ROOT='audit/ncl-guoshi-jingjizhi-1602-zhunzhai-author'
          rm -rf "$ROOT"
          mkdir -p "$ROOT/pages" "$ROOT/ocr" "$ROOT/highres"
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-chi-tra-vert >/dev/null
          python -m pip install --quiet pillow

          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/NCL-04980%2003%20%E5%9C%8B%E5%8F%B2%E7%B6%93%E7%B1%8D%E5%BF%97.pdf'
          curl -fL --retry 4 --retry-delay 2 -A 'Tianwen-Provenance-Audit/1.0' "$URL" -o "$ROOT/guoshi-jingjizhi-1602-v3.pdf"
          sha256sum "$ROOT/guoshi-jingjizhi-1602-v3.pdf" | tee "$ROOT/source-sha256.txt"
          pdfinfo "$ROOT/guoshi-jingjizhi-1602-v3.pdf" | tee "$ROOT/pdfinfo.txt"
          pdftotext -layout "$ROOT/guoshi-jingjizhi-1602-v3.pdf" "$ROOT/embedded-text.txt" || true
          pdftoppm -jpeg -r 150 "$ROOT/guoshi-jingjizhi-1602-v3.pdf" "$ROOT/pages/page" >/dev/null 2>&1

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import hashlib, json, subprocess
          root=Path('audit/ncl-guoshi-jingjizhi-1602-zhunzhai-author')
          pages=sorted(root.joinpath('pages').glob('page-*.jpg'))
          targets=['準齋','准齋','几漏','幾漏','孫逢吉','孙逢吉','逢吉','器用']
          hits=[]; manifest=[]
          for i,p in enumerate(pages,1):
              b=p.read_bytes(); im=Image.open(p).convert('RGB')
              manifest.append({'pdf_page':i,'file':p.name,'sha256':hashlib.sha256(b).hexdigest(),'width':im.width,'height':im.height})
              texts=[]
              for lang,psm in [('chi_tra_vert','5'),('chi_tra','6')]:
                  proc=subprocess.run(['tesseract',str(p),'stdout','-l',lang,'--psm',psm],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,check=False)
                  texts.append(proc.stdout.decode('utf-8',errors='replace'))
              txt='\n'.join(texts)
              root.joinpath('ocr',f'page-{i:03d}.txt').write_text(txt,encoding='utf-8')
              compact=''.join(txt.split())
              found=[t for t in targets if t in compact]
              diag=sum(ch in compact for ch in ['準','齋','漏','孫','逢','吉','器','用'])
              if found or diag>=4:
                  hits.append({'pdf_page':i,'terms':found,'diagnostic_score':diag,'context':' '.join(txt.split())[:2600]})
          # contacts
          cols=4; per=16
          for start in range(0,len(pages),per):
              chunk=pages[start:start+per]; thumbs=[]
              for j,p in enumerate(chunk,start+1):
                  im=Image.open(p).convert('RGB'); tw=360
                  im=im.resize((tw,max(1,int(im.height*tw/im.width))))
                  c=Image.new('RGB',(tw,im.height+30),'white'); c.paste(im,(0,30))
                  ImageDraw.Draw(c).text((6,6),f'PDF p{j}',fill='black'); thumbs.append(c)
              cw=max(t.width for t in thumbs); ch=max(t.height for t in thumbs)
              rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new('RGB',(cols*cw,rows*ch),'white')
              for k,t in enumerate(thumbs): sheet.paste(t,((k%cols)*cw,(k//cols)*ch))
              sheet.save(root/f'contact-{start+1:03d}-{start+len(chunk):03d}.jpg',quality=91)
          cand=set()
          for h in hits:
              for q in range(max(1,h['pdf_page']-2),min(len(pages),h['pdf_page']+2)+1): cand.add(q)
          if not cand: cand.update(range(1,len(pages)+1))
          for i in sorted(cand):
              subprocess.run(['pdftoppm','-f',str(i),'-l',str(i),'-png','-r','360',str(root/'guoshi-jingjizhi-1602-v3.pdf'),str(root/'highres'/f'p{i:03d}')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          report={
            'schema':'NCL-GUOSHI-JINGJIZHI-1602-ZHUNZHAI-AUTHOR-PROBE-R1',
            'source_file':'NCL-04980 03 國史經籍志.pdf',
            'catalog_binding':'明萬曆壬寅（三十年，1602）原刊本; NCL call no. 4980; v3',
            'rendered_page_count':len(pages),
            'ocr_locator_hits':hits,
            'ocr_authority':'LOCATOR_ONLY_NOT_FINAL_GLYPH_AUTHORITY',
            'highres_candidate_pages':sorted(cand),
            'target_claim_to_test':'器用: 準齋几漏圖式一卷 / 孫逢吉',
            'final_adjudication':'PENDING_DIRECT_IMAGE_REVIEW'
          }
          root.joinpath('manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          root.joinpath('report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'pages':len(pages),'hits':hits,'highres_candidates':sorted(cand)},ensure_ascii=False,indent=2))
          PY

      - name: Upload 1602 Guoshi Jingjizhi target corpus
        uses: actions/upload-artifact@v4
        with:
          name: ncl-guoshi-jingjizhi-1602-zhunzhai-author-r1
          path: audit/ncl-guoshi-jingjizhi-1602-zhunzhai-author
          if-no-files-found: error
          retention-days: 30
