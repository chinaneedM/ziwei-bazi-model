name: research-korea-university-ziwei-klin

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-korea-university-ziwei-klin.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Search Korea University public KLIN advanced search for old books
        shell: python
        run: |
          import json,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys

          OUT=Path('probe'); OUT.mkdir()
          URL='https://library.korea.ac.kr/datause/advanced-search/advanced-search-form/'
          QUERIES=['新刻合併十八飛星策天紫微斗數全集','紫微斗數全集']
          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1800,2600'); opts.add_argument('--lang=ko-KR')
          result={'schema':'ZIWEI-KOREA-UNIVERSITY-KLIN-OLDBOOK-R1','source_url':URL,'authentication_attempted':False,'route_guessing_attempted':False,'results':[]}
          d=webdriver.Chrome(options=opts)
          try:
            d.set_page_load_timeout(90)
            for i,q in enumerate(QUERIES,1):
              d.get(URL); time.sleep(5)
              row={'query':q}
              inputs=[]
              for e in d.find_elements(By.CSS_SELECTOR,"input[type='text']"):
                try:
                  if e.is_displayed(): inputs.append(e)
                except Exception: pass
              row['visible_text_inputs']=len(inputs)
              # The advanced form's first visible keyword field is the title/general query row after header search fields.
              candidates=[]
              for e in inputs:
                try:
                  ph=e.get_attribute('placeholder') or ''
                  if '검색어' in ph: candidates.append(e)
                except Exception: pass
              if not candidates:
                candidates=inputs
              if not candidates:
                row['status']='NO_INPUT'; result['results'].append(row); continue
              inp=candidates[-3] if len(candidates)>=3 else candidates[-1]
              inp.clear(); inp.send_keys(q)
              # Select the public 자료유형 고서 checkbox/radio by its nearby label text when exposed.
              old=[]
              for lab in d.find_elements(By.XPATH,"//*[normalize-space(text())='고서']"):
                try:
                  if lab.is_displayed(): old.append(lab)
                except Exception: pass
              row['oldbook_label_count']=len(old)
              if old:
                try: old[-1].click()
                except Exception: d.execute_script('arguments[0].click();',old[-1])
              # Click the visible search button inside the content form; fallback Enter on query field.
              buttons=[]
              for b in d.find_elements(By.XPATH,"//button[normalize-space(text())='검색']"):
                try:
                  if b.is_displayed(): buttons.append(b)
                except Exception: pass
              if buttons:
                try: buttons[-1].click()
                except Exception: d.execute_script('arguments[0].click();',buttons[-1])
              else:
                inp.send_keys(Keys.ENTER)
              time.sleep(7)
              row['after_url']=d.current_url
              body=d.find_element(By.TAG_NAME,'body').text
              row['body_text']=body[:70000]
              row['title_present']='紫微' in body or '飛星' in body
              links=[]
              for a in d.find_elements(By.CSS_SELECTOR,'a[href]'):
                try:
                  if not a.is_displayed(): continue
                  txt=' '.join((a.text or '').split()); href=a.get_attribute('href') or ''
                  if any(k in txt for k in ('紫微','飛星','斗數')):
                    links.append({'text':txt[:1500],'href':href})
                except Exception: pass
              seen=set(); rr=[]
              for x in links:
                k=(x['text'],x['href'])
                if k not in seen: seen.add(k); rr.append(x)
              row['relevant_links']=rr[:100]
              d.save_screenshot(str(OUT/f'query-{i}.png'))
              (OUT/f'query-{i}.html').write_text(d.page_source,encoding='utf-8')
              result['results'].append(row)
          finally:
            d.quit()
          result['adjudication']={'third_physical_copy':'PENDING_FIRST_PARTY_DETAIL','target_page_status':'PENDING_DIRECT_PAGE','algorithm_effect':'NONE'}
          (OUT/'korea-university-klin-oldbook.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'results':[{'query':r.get('query'),'after_url':r.get('after_url'),'title_present':r.get('title_present'),'relevant_links':r.get('relevant_links'),'status':r.get('status')} for r in result['results']],'adjudication':result['adjudication']},ensure_ascii=False,indent=2))
      - name: Upload KLIN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-korea-university-klin-oldbook
          path: probe/
          if-no-files-found: warn
          retention-days: 14
