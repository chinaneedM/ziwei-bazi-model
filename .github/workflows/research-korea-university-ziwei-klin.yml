name: research-korea-university-ziwei-klin

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-korea-university-ziwei-klin.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Search exact titles through Korea University public integrated catalog UI
        shell: python
        run: |
          import json,time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys

          OUT=Path('probe'); OUT.mkdir()
          HOME='https://library.korea.ac.kr/'
          QUERIES=['新刻合併十八飛星策天紫微斗數全集','紫微斗數全集','飛星策天紫微斗數全集']
          TERMS=('紫微','飛星','斗數','陳搏','徐良弼','明經閣')

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu')
          opts.add_argument('--window-size=1800,2600')
          opts.add_argument('--lang=ko-KR')

          result={
            'schema':'ZIWEI-KOREA-UNIVERSITY-KLIN-INTEGRATED-PUBLIC-SEARCH-R1',
            'source_url':HOME,
            'authentication_attempted':False,
            'route_guessing_attempted':False,
            'results':[]
          }

          d=webdriver.Chrome(options=opts)
          try:
            d.set_page_load_timeout(90)
            for i,q in enumerate(QUERIES,1):
              d.get(HOME); time.sleep(6)
              row={'query':q}
              inputs=[]
              for e in d.find_elements(By.CSS_SELECTOR,"input[type='text'],input[type='search']"):
                try:
                  if not e.is_displayed(): continue
                  ph=e.get_attribute('placeholder') or ''
                  aria=e.get_attribute('aria-label') or ''
                  name=e.get_attribute('name') or ''
                  if any(k in (ph+' '+aria+' '+name).lower() for k in ('검색','search','keyword','query','q')):
                    inputs.append(e)
                except Exception: pass
              if not inputs:
                inputs=[e for e in d.find_elements(By.CSS_SELECTOR,"input[type='text'],input[type='search']") if e.is_displayed()]
              row['visible_search_input_count']=len(inputs)
              if not inputs:
                row['status']='NO_PUBLIC_SEARCH_INPUT'; result['results'].append(row); continue
              inp=inputs[0]
              row['input_placeholder']=inp.get_attribute('placeholder')
              row['input_name']=inp.get_attribute('name')
              inp.clear(); inp.send_keys(q); inp.send_keys(Keys.ENTER)
              time.sleep(8)
              row['result_url']=d.current_url
              body=d.find_element(By.TAG_NAME,'body').text
              row['body_text']=body[:100000]
              row['no_result_language']=any(x in body for x in ('검색 결과가 없습니다','검색결과가 없습니다','검색 결과 0','총 0건','0건'))
              row['matching_lines']=[line for line in body.splitlines() if any(t in line for t in TERMS)][:300]

              elems=[]
              for el in d.find_elements(By.XPATH,"//*[contains(normalize-space(.),'紫微') or contains(normalize-space(.),'飛星') or contains(normalize-space(.),'斗數')]"):
                try:
                  if not el.is_displayed(): continue
                  txt=' '.join((el.text or '').split())
                  if not txt or len(txt)>5000: continue
                  attrs={}
                  for a in ('href','onclick','data-id','data-biblio-id','data-record-id','data-key','role','class'):
                    v=el.get_attribute(a)
                    if v: attrs[a]=v[:1500]
                  elems.append({'tag':el.tag_name,'text':txt[:3000],'attrs':attrs})
                except Exception: pass
              elems.sort(key=lambda x:len(x['text']))
              seen=set(); dedup=[]
              for x in elems:
                key=(x['tag'],x['text'],json.dumps(x['attrs'],sort_keys=True,ensure_ascii=False))
                if key not in seen:
                  seen.add(key); dedup.append(x)
              row['relevant_elements']=dedup[:150]

              # Click only an exact/near-exact visible result title, if one exists.
              candidates=[]
              for el in d.find_elements(By.XPATH,"//*[contains(normalize-space(.),'新刻合') and contains(normalize-space(.),'紫微') and contains(normalize-space(.),'斗數')]"):
                try:
                  if not el.is_displayed(): continue
                  txt=' '.join((el.text or '').split())
                  if txt and len(txt)<1800: candidates.append((len(txt),el,txt))
                except Exception: pass
              candidates.sort(key=lambda z:z[0])
              row['exact_candidate_count']=len(candidates)
              if candidates:
                _,el,txt=candidates[0]
                row['clicked_candidate_text']=txt
                target=el
                try:
                  a=el.find_element(By.XPATH,'ancestor-or-self::a[1]')
                  target=a
                except Exception: pass
                row['candidate_href']=target.get_attribute('href')
                before=d.current_url
                try: target.click()
                except Exception: d.execute_script('arguments[0].click();',target)
                time.sleep(8)
                row['detail_url']=d.current_url
                row['detail_url_changed']=d.current_url!=before
                detail=d.find_element(By.TAG_NAME,'body').text
                row['detail_body_text']=detail[:100000]
                row['detail_matching_lines']=[line for line in detail.splitlines() if any(t in line for t in TERMS) or any(k in line for k in ('고서','청구기호','소장','자료실','발행','출판','목판','木板','卷','冊'))][:500]
                d.save_screenshot(str(OUT/f'query-{i}-detail.png'))
                (OUT/f'query-{i}-detail.html').write_text(d.page_source,encoding='utf-8')
              d.save_screenshot(str(OUT/f'query-{i}-results.png'))
              (OUT/f'query-{i}-results.html').write_text(d.page_source,encoding='utf-8')
              result['results'].append(row)
          finally:
            d.quit()

          result['adjudication']={
            'goal':'FIRST_PARTY_BIND_KOREA_UNIVERSITY_PHYSICAL_COPY',
            'third_physical_copy':'PENDING_UNTIL_EXACT_DETAIL_BINDS_HOLDING',
            'target_page_status':'PENDING_DIRECT_PAGE',
            'algorithm_effect':'NONE'
          }
          (OUT/'korea-university-klin-integrated-search.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({
            'results':[{
              'query':r.get('query'),'result_url':r.get('result_url'),'no_result_language':r.get('no_result_language'),
              'matching_lines':r.get('matching_lines'),'relevant_elements':r.get('relevant_elements'),
              'exact_candidate_count':r.get('exact_candidate_count'),'clicked_candidate_text':r.get('clicked_candidate_text'),
              'candidate_href':r.get('candidate_href'),'detail_url':r.get('detail_url'),'detail_url_changed':r.get('detail_url_changed'),
              'detail_matching_lines':r.get('detail_matching_lines'),'status':r.get('status')
            } for r in result['results']],
            'adjudication':result['adjudication']
          },ensure_ascii=False,indent=2))

      - name: Upload KLIN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-korea-university-klin-oldbook
          path: probe/
          if-no-files-found: warn
          retention-days: 14
