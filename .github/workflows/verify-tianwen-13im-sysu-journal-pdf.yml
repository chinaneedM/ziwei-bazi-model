name: verify-tianwen-13im-sysu-journal-pdf
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13IM-*'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - 'scripts/verify-tianwen-13im-sysu-journal-pdf.py'
      - 'scripts/probe-tianwen-13im-sysu-journal-pdf.py'
      - 'tests/test_tianwen_13im_sysu_journal_pdf.py'
  workflow_dispatch:
jobs:
  verify-and-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyMuPDF>=1.24,<2'
      - run: python scripts/verify-tianwen-13im-sysu-journal-pdf.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13im_sysu_journal_pdf.py' -v
      - name: Bounded public institution PDF bytes and hash probe
        run: python scripts/probe-tianwen-13im-sysu-journal-pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13im-official-journal-probe-metadata
          path: docs/research/artifacts/13im-official-journal-probe.json
          if-no-files-found: warn
