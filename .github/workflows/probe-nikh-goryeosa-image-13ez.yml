name: probe-nikh-goryeosa-image-13ez
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/probe-nikh-goryeosa-image-13ez.py
      - tests/test_probe_nikh_goryeosa_image_13ez.py
      - .github/workflows/probe-nikh-goryeosa-image-13ez.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-emitted-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source-emitted link safety tests
        run: |
          python -m py_compile scripts/probe-nikh-goryeosa-image-13ez.py tests/test_probe_nikh_goryeosa_image_13ez.py
          python -m unittest discover -s tests -p 'test_probe_nikh_goryeosa_image_13ez.py' -v
      - name: Bounded read-only official NIKH article, notice and image viewer help
        run: python scripts/probe-nikh-goryeosa-image-13ez.py
      - name: Preserve source-level transport metadata and public HTML, not ancient glyph claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikh-goryeosa-13ez-source-emitted-probe
          path: nikh-goryeosa-13ez-evidence/
          retention-days: 14
          if-no-files-found: warn
