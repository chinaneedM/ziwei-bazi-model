name: probe-kyudb-datong-catalog

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-kyudb-datong-catalog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe current Kyujanggak old-book search contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request, urllib.parse
          base='https://kyudb.snu.ac.kr/book/list.do?mid=GDS'
          req=urllib.request.Request(base, headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          print('HTML_LEN', len(html))
          print('=== FORMS ===')
          for m in re.finditer(r'<form\b[^>]*>.*?</form>', html, re.I|re.S):
              frag=m.group(0)
              if any(k in frag for k in ('검색어','search','sch','query','keyword','서명')):
                  print(re.sub(r'\s+',' ',frag)[:12000])
          print('=== INPUT_SELECT_NAMES ===')
          names=[]
          for tag in re.findall(r'<(?:input|select|textarea)\b[^>]*>', html, re.I):
              nm=re.search(r'\bname=["\']?([^"\' >]+)',tag,re.I)
              if nm and nm.group(1) not in names:
                  names.append(nm.group(1))
                  print(re.sub(r'\s+',' ',tag)[:1000])
          print('NAMES', names)
          print('=== SEARCH-RELATED JS ===')
          for line in html.splitlines():
              if any(k.lower() in line.lower() for k in ('search','검색','schword','keyword','book_nm','bookname')):
                  s=line.strip()
                  if s:
                      print(s[:2500])
          print('=== SCRIPT SRCS ===')
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
              print(src)
          PY
      - name: Probe legacy KOSTMA target URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          url='https://kostma.aks.ac.kr/dataSearch/dataSearchList.aspx?cateQ=dic&curPage=27&pageSize=100&query=&sType=&sort='
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          html=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          for key in ['대통력일통궤','大統曆日通軌','대통력주','大統曆註']:
              print('===',key,'===')
              for m in re.finditer(re.escape(key),html):
                  a=max(0,m.start()-2500); b=min(len(html),m.end()+5000)
                  frag=html[a:b]
                  urls=re.findall(r'https?://[^"\'<> ]+',frag)
                  for u in urls:
                      if 'kyujanggak' in u or 'snu.ac.kr' in u:
                          print(u.replace('&amp;','&'))
          PY
