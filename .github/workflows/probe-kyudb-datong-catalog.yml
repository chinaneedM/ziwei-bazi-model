name: probe-kyudb-datong-catalog

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/probe-kyudb-datong-catalog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe current Kyujanggak old-book search contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          base='https://kyudb.snu.ac.kr/book/list.do?mid=GDS'
          try:
              req=urllib.request.Request(base, headers={'User-Agent':'Mozilla/5.0'})
              html=urllib.request.urlopen(req, timeout=30).read().decode('utf-8','replace')
          except Exception as exc:
              print('KYUDB_ACCESS_BOUNDARY=NETWORK_OR_TLS_FAILURE')
              print(type(exc).__name__, str(exc))
              raise SystemExit(0)
          print('KYUDB_ACCESS_BOUNDARY=OPEN')
          print('HTML_LEN', len(html))
          print('=== FORMS ===')
          for m in re.finditer(r'<form\b[^>]*>.*?</form>', html, re.I|re.S):
              frag=m.group(0)
              if any(k in frag for k in ('검색어','search','sch','query','keyword','서명')):
                  print(re.sub(r'\s+',' ',frag)[:12000])
          print('=== INPUT_SELECT_NAMES ===')
          names=[]
          for tag in re.findall(r'<(?:input|select|textarea)\b[^>]*>', html, re.I):
              nm=re.search(r'\bname=["\']?([^"\' >]+)',tag,re.I)
              if nm and nm.group(1) not in names:
                  names.append(nm.group(1))
                  print(re.sub(r'\s+',' ',tag)[:1000])
          print('NAMES', names)
          print('=== SEARCH-RELATED JS ===')
          for line in html.splitlines():
              if any(k.lower() in line.lower() for k in ('search','검색','schword','keyword','book_nm','bookname')):
                  s=line.strip()
                  if s:
                      print(s[:2500])
          print('=== SCRIPT SRCS ===')
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
              print(src)
          PY
      - name: Probe legacy KOSTMA target anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html as htmlmod
          import re, urllib.request
          url='https://kostma.aks.ac.kr/dataSearch/dataSearchList.aspx?cateQ=dic&curPage=27&pageSize=100&query=&sType=&sort='
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              text=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          except Exception as exc:
              print('KOSTMA_ACCESS_BOUNDARY=NETWORK_OR_TLS_FAILURE')
              print(type(exc).__name__, str(exc))
              raise SystemExit(0)
          print('KOSTMA_ACCESS_BOUNDARY=OPEN')
          targets=['대통력일통궤','大統曆日通軌','대통력주','大統曆註']
          anchors=list(re.finditer(r'<a\b[^>]*>.*?</a>', text, re.I|re.S))
          for key in targets:
              print('===',key,'===')
              hits=0
              for m in re.finditer(re.escape(key),text):
                  hits += 1
                  container=None
                  for a in anchors:
                      if a.start() <= m.start() < a.end():
                          container=a.group(0)
                          break
                  if container:
                      clean=htmlmod.unescape(re.sub(r'\s+',' ',container))
                      print('ANCHOR', clean[:8000])
                  else:
                      a=max(0,m.start()-5000); b=min(len(text),m.end()+9000)
                      frag=text[a:b]
                      print('CONTEXT', htmlmod.unescape(re.sub(r'\s+',' ',frag))[:14000])
                  near=text[max(0,m.start()-7000):min(len(text),m.end()+12000)]
                  attrs=[]
                  for tag in re.findall(r'<(?:a|input|button|form)\b[^>]*>',near,re.I):
                      if any(token in tag.lower() for token in ('href=', 'onclick=', 'value=', 'name=', 'id=')):
                          attrs.append(htmlmod.unescape(re.sub(r'\s+',' ',tag)))
                  print('NEARBY_TAGS')
                  for tag in attrs[:80]:
                      print(tag[:2500])
              print('HIT_COUNT',hits)
          PY
      - name: Resolve legacy viewDicWord navigation contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.parse, urllib.request
          page='https://kostma.aks.ac.kr/dataSearch/dataSearchList.aspx?cateQ=dic&curPage=27&pageSize=100&query=&sType=&sort='
          headers={'User-Agent':'Mozilla/5.0'}
          text=urllib.request.urlopen(urllib.request.Request(page,headers=headers),timeout=30).read().decode('utf-8','replace')
          def emit(label, body):
              hits=[]
              for pat in (r'function\s+viewDicWord\s*\([^)]*\)\s*\{', r'viewDicWord\s*=\s*function\s*\([^)]*\)\s*\{'):
                  for m in re.finditer(pat,body,re.I):
                      hits.append(m.start())
              for pos in sorted(set(hits)):
                  print('VIEWDICWORD_SOURCE',label)
                  print(re.sub(r'\s+',' ',body[pos:min(len(body),pos+6000)])[:6000])
          emit('INLINE_PAGE',text)
          srcs=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I):
              full=urllib.parse.urljoin(page,src)
              if full not in srcs:
                  srcs.append(full)
          print('SCRIPT_COUNT',len(srcs))
          for full in srcs:
              print('SCRIPT',full)
              try:
                  js=urllib.request.urlopen(urllib.request.Request(full,headers=headers),timeout=20).read().decode('utf-8','replace')
              except Exception as exc:
                  print('SCRIPT_FETCH_ERROR',type(exc).__name__,str(exc))
                  continue
              if 'viewDicWord' in js:
                  emit(full,js)
                  for m in re.finditer(r'viewDicWord',js,re.I):
                      a=max(0,m.start()-1200); b=min(len(js),m.end()+4500)
                      print('VIEWDICWORD_CONTEXT',full)
                      print(re.sub(r'\s+',' ',js[a:b])[:5700])
                      break
          PY
