name: verify-tianwen-13ii-secondary-lacuna
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13II-*'
      - 'scripts/verify-tianwen-13ii-secondary-lacuna.py'
      - 'tests/test_tianwen_13ii_secondary_lacuna.py'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
  workflow_dispatch:
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python scripts/verify-tianwen-13ii-secondary-lacuna.py
          python -m unittest discover -s tests -p 'test_tianwen_13ii_secondary_lacuna.py' -v
