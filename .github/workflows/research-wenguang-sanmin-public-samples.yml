name: research-wenguang-sanmin-public-samples

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-wenguang-sanmin-public-samples.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture public Wenguang facsimile sample and index controls
        shell: python
        run: |
          import hashlib
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          OUT = Path("probe")
          OUT.mkdir()
          UA = "Mozilla/5.0 research-only public Wenguang facsimile provenance probe"
          ISBN = "9789888266944"
          VOLUME_ID = "aIRbDgAAQBAJ"
          SANMIN = "https://www.sanmin.com.tw/product/index/006208971"
          PUBLISHER = "https://publish.sunyata.hk/product/973.html"
          SAMPLE_URLS = [
              f"https://cdnec.sanmin.com.tw/tryread/big/988/988826694_b{i}.jpg"
              for i in range(1, 9)
          ]
          QUERIES = [
              "敦化堂",
              "敦化堂刊本",
              "敦化堂藏板",
              "繼述堂",
              "继述堂",
              "繼述堂刊本",
              "繼述堂藏板",
              "文光堂",
              "朱墨",
              "朱墨點校",
              "論人生時要審的確",
              "论人生时要审的确",
              "上五刻",
              "下五刻",
              "亥時",
              "子時有十刻",
          ]

          def fetch(url, max_bytes=10_000_000, accept="*/*"):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA,
                  "Accept": accept,
                  "Accept-Language": "zh-TW,zh;q=0.9,en;q=0.7",
              })
              try:
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      data = resp.read(max_bytes + 1)
                      if len(data) > max_bytes:
                          raise RuntimeError("response exceeded byte guard")
                      return {
                          "ok": True,
                          "status": getattr(resp, "status", None),
                          "final_url": resp.geturl(),
                          "content_type": resp.headers.get("content-type"),
                          "data": data,
                      }
              except Exception as exc:
                  return {"ok": False, "url": url, "error": repr(exc), "data": b""}

          def meta(row):
              data = row.get("data", b"")
              return {k:v for k,v in row.items() if k != "data"} | {
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest() if data else None,
              }

          def search(term):
              url = (
                  "https://books.google.com/books?jscmd=SearchWithinVolume2&q="
                  + urllib.parse.quote(term)
                  + "&vid="
                  + VOLUME_ID
              )
              row = fetch(url, max_bytes=3_000_000, accept="application/json,*/*;q=0.8")
              out = meta(row) | {"query": term, "url": url}
              raw = row.get("data", b"")
              if raw:
                  try:
                      payload = json.loads(raw.decode("utf-8"))
                      out["searchable"] = payload.get("searchable")
                      out["number_of_results"] = payload.get("number_of_results")
                      out["page_ids"] = [
                          item.get("page_id") for item in payload.get("search_results", [])
                      ]
                      out["snippets"] = [
                          item.get("snippet_text") for item in payload.get("search_results", [])
                      ]
                  except Exception as exc:
                      out["parse_error"] = repr(exc)
              return out

          result = {
              "schema": "ZIWEI-WENGUANG-SANMIN-PUBLIC-SAMPLES-R1",
              "isbn": ISBN,
              "google_books_volume_id": VOLUME_ID,
              "target_rule_id": "HPA-ZDATE-006",
              "target_section": "論人生時要審的確",
              "ocr_used": False,
              "authentication_or_paywall_bypass_attempted": False,
              "identifier_guessing_attempted": False,
              "sanmin_product": {},
              "publisher_page": {},
              "public_sample_images": [],
              "search_within_volume": [],
          }

          san = fetch(SANMIN, max_bytes=5_000_000, accept="text/html,*/*;q=0.8")
          result["sanmin_product"] = meta(san)
          if san.get("data"):
              (OUT / "sanmin-product.html").write_bytes(san["data"])
              txt = san["data"].decode("utf-8", "replace")
              result["sanmin_product"]["controls"] = {
                  "isbn_present": ISBN in txt,
                  "page_count_266_present": "266" in txt,
                  "dunhuatang_present": "敦化堂" in txt,
                  "jishutang_present": "繼述堂" in txt or "继述堂" in txt,
                  "wenguang_present": "文光堂" in txt,
                  "red_black_collation_present": "朱墨" in txt,
              }

          pub = fetch(PUBLISHER, max_bytes=5_000_000, accept="text/html,*/*;q=0.8")
          result["publisher_page"] = meta(pub)
          if pub.get("data"):
              (OUT / "publisher-product.html").write_bytes(pub["data"])
              txt = pub["data"].decode("utf-8", "replace")
              result["publisher_page"]["controls"] = {
                  "isbn_present": ISBN in txt,
                  "dunhuatang_present": "敦化堂" in txt,
                  "jishutang_present": "繼述堂" in txt or "继述堂" in txt,
                  "wenguang_present": "文光堂" in txt,
                  "earlier_later_wording_present": "前者年代略早" in txt,
                  "red_black_collation_wording_present": "後者有朱墨點校" in txt or "后者有朱墨点校" in txt,
              }

          for idx, url in enumerate(SAMPLE_URLS, 1):
              row = fetch(url, max_bytes=5_000_000, accept="image/avif,image/webp,image/*,*/*;q=0.8")
              rec = meta(row) | {"index": idx, "url": url}
              data = row.get("data", b"")
              rec["jpeg_magic"] = data.startswith(b"\xff\xd8")
              if row.get("ok") and rec["jpeg_magic"]:
                  fn = f"sanmin-sample-{idx:02d}.jpg"
                  (OUT / fn).write_bytes(data)
                  rec["saved_file"] = fn
              result["public_sample_images"].append(rec)

          result["search_within_volume"] = [search(q) for q in QUERIES]

          target = {
              row["query"]: {
                  "status": row.get("status"),
                  "searchable": row.get("searchable"),
                  "number_of_results": row.get("number_of_results"),
                  "page_ids": row.get("page_ids", []),
                  "snippets": row.get("snippets", []),
              }
              for row in result["search_within_volume"]
          }
          result["adjudication"] = {
              "sample_image_count": sum(1 for x in result["public_sample_images"] if x.get("saved_file")),
              "sample_visual_review_status": "REQUIRES_DIRECT_HUMAN_VISUAL_REVIEW_NO_OCR",
              "pt165_base_copy_identity": "UNRESOLVED_UNTIL_PAGE_LEVEL_DUNHUATANG_OR_JISHUTANG_BINDING_EXISTS",
              "google_index_is_glyph_authority": False,
              "sample_image_is_target_page": "UNRESOLVED_UNTIL_VISUAL_REVIEW",
              "hpa_zdate_006_effect": "NONE_UNTIL_DIRECT_TARGET_PAGE_AND_BASE_COPY_PROVENANCE",
              "algorithm_effect": "NONE",
          }

          (OUT / "wenguang-sanmin-public-samples.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps({
              "sanmin": result["sanmin_product"],
              "publisher": result["publisher_page"],
              "samples": result["public_sample_images"],
              "search": target,
              "adjudication": result["adjudication"],
          }, ensure_ascii=False, indent=2))

      - name: Upload Wenguang public-sample evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-wenguang-sanmin-public-samples
          path: probe/
          if-no-files-found: warn
          retention-days: 14
