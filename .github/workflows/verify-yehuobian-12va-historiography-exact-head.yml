name: verify-yehuobian-12va-historiography-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12va-historiography-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-SOURCE-REGISTRY-EXTENSIONS-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VA-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12VA-*.md
      - scripts/verify-yehuobian-1959-2019-historiography-12va.py
      - tests/test_yehuobian_1959_2019_historigraphy_12va.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mandatory continuity and evidence graph
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: 1959 to 2019 source-scoped historiography
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-1959-2019-historiography-12va.py
          python -m unittest discover -s tests -p 'test_yehuobian_1959_2019_historigraphy_12va.py' -v
