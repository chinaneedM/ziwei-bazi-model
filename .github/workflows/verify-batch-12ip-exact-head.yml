name: verify-batch-12ip-exact-head
# Durable exact-head gate: current publisher Booktext payload is a bounded modern access object, not page evidence.

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ip-exact-head.yml
      - docs/research/ZIWEI-NLCPRESS-JI15-FIRST-PARTY-BOOKTEXT-BOUNDED-PAYLOAD-BOUNDARY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-NLCPRESS-JI15-FIRST-PARTY-BOOKTEXT-BOUNDED-PAYLOAD-BOUNDARY-IP.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
      - .github/workflows/probe-batch-12ip-nlcpress-ji15-booktext-public-postback.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IP status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'tianwen/batch-12ip-exact-head',
              description: 'Batch 12IP Booktext bounded-payload verification running'
            })
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Batch 12IP exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('docs/research/ZIWEI-NLCPRESS-JI15-FIRST-PARTY-BOOKTEXT-BOUNDED-PAYLOAD-BOUNDARY-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']=='BATCH-12-ZIWEI-NLCPRESS-JI15-FIRST-PARTY-BOOKTEXT-BOUNDED-PAYLOAD-BOUNDARY-IP'
          m=e['probe_history']['metadata_only_probe']
          assert m['post_status']==200 and m['content_type']=='application/octet-stream' and m['content_length']==739
          assert m['response_body_read'] is False and m['download_bytes_read']==0
          b=e['probe_history']['bounded_payload_classification']
          assert b['bytes_read']==739
          assert b['body_sha256']=='c79284ab5f39ed7b8b48e8b1071b008990c583314455c7abf00699cd1fe4d1d3'
          assert b['decoded_encoding']=='gb18030' and b['decoded_char_count']==382
          assert b['raw_text_logged'] is False and b['raw_text_saved'] is False
          assert not any(b['chapter_matches'].values())
          p=e['pagination_adjudication']
          assert p['exact_chapter_9_page_range']=='UNRESOLVED'
          assert p['direct_chapter_9_text']=='NOT_REVIEWED'
          assert p['exact_chapter_10_11_pagination']=='UNRESOLVED'
          assert e['project_consequence']['product_change'] is False
          PY
      - name: Publish success IP status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12ip-exact-head',
              description: 'Batch 12IP exact-head verification passed'
            })
      - name: Publish failure IP status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12ip-exact-head',
              description: 'Batch 12IP exact-head verification failed'
            })
