name: verify-yehuobian-12xd-original-folio-intake
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12xd-original-folio-intake.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12XD-*
      - scripts/verify-yehuobian-original-folio-intake-12xd.py
      - tests/test_yehuobian_original_folio_intake_12xd.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate official form field map and negative image admissions
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-yehuobian-original-folio-intake-12xd.py
          python -m unittest discover -s tests -p 'test_yehuobian_original_folio_intake_12xd.py' -v
