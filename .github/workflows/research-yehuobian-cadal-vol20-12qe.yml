name: research-yehuobian-cadal-vol20-12qe
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - docs/research/MING-DATONG-YEHUOBIAN-12QE-CADAL-VOL20-DIRECT-GLYPH-TRIGGER-R1.json
permissions:
  contents: read
jobs:
  bounded-source-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public manuscript raster tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq djvulibre-bin
          python -m pip install Pillow
      - name: Verify exact CADAL file and build 135-page image atlas no OCR
        run: python scripts/probe-yehuobian-cadal-vol20-12qe.py
      - name: Save bounded source pages with hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadal-02096915-vol20-target-atlas-12qe
          path: artifacts/cadal-vol20-source-12qe/
          retention-days: 7
