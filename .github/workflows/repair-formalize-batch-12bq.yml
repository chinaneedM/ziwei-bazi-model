name: repair-formalize-batch-12bq

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/repair-formalize-batch-12bq.yml

permissions:
  contents: write

jobs:
  repair-and-formalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair BQ workflow and execute its atomic generator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          wf = Path('.github/workflows/formalize-batch-12bq-yongle-dadian-inclement-time.yml')
          text = wf.read_text(encoding='utf-8')
          bad = '            "$BATCH_DOC" \\\n            "$RESEARCH_ARTIFACT"'
          good = '            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-YONGLE-DADIAN-18764-INCLEMENT-BIRTH-TIME-EARLY-TEXTUAL-BRIDGE-BQ.md \\\n            docs/research/ZIWEI-YONGLE-DADIAN-18764-INCLEMENT-BIRTH-TIME-EARLY-TEXTUAL-BRIDGE-R1.json'
          if bad in text:
              text = text.replace(bad, good, 1)
              wf.write_text(text, encoding='utf-8')
          elif good not in text:
              raise SystemExit('BQ git-add repair target not found')

          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          code = dedent(text[start:end])
          exec(compile(code, str(wf) + ':embedded-python', 'exec'), {})
          PY

          python scripts/verify-project-continuity-state-r1.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/formalize-batch-12bq-yongle-dadian-inclement-time.yml \
            scripts/verify-project-continuity-state-r1.py \
            docs/PROJECT-CURRENT-STATE-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json \
            docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-YONGLE-DADIAN-18764-INCLEMENT-BIRTH-TIME-EARLY-TEXTUAL-BRIDGE-BQ.md \
            docs/research/ZIWEI-YONGLE-DADIAN-18764-INCLEMENT-BIRTH-TIME-EARLY-TEXTUAL-BRIDGE-R1.json

          git commit -m "formalize Batch 12BQ Yongle Dadian inclement-time bridge"
          git push origin HEAD:agent/fusion-chart-core-r1-20260822
