name: verify-tianwen-13gw-original-paired-headings
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-original-technical-column-headings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/verify-tianwen-13gw-paired-column-headings.py --output-dir /tmp/13gw
      - run: python -m unittest discover -s tests -p 'test_tianwen_13gw*' -v
      - uses: actions/upload-artifact@v4
        with:
          name: tianwen-13gw-p74-original-heading-pixel-boundaries
          path: /tmp/13gw/
          if-no-files-found: error
          retention-days: 30
