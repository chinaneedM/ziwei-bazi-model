name: replay-tianwen-13mt-zhou-renderer-versions
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/replay-tianwen-13mt-zhou-render-profiles.py
      - tests/test_tianwen_13mt_zhou_render_profiles.py
      - .github/workflows/replay-tianwen-13mt-zhou-renderer-versions.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pinned-renderer-two-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install "Pillow==11.3.0" "PyMuPDF==1.26.7"
      - run: python -m unittest discover -s tests -p 'test_tianwen_13mt_zhou_render_profiles.py' -v
      - run: python scripts/replay-tianwen-13mt-zhou-render-profiles.py --version 1.26.7
      - run: python -m pip install --force-reinstall "PyMuPDF==1.28.2"
      - run: python scripts/replay-tianwen-13mt-zhou-render-profiles.py --version 1.28.2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13mt-same-pdf-pinned-two-renderers
          path: /tmp/tianwen-13mt/
          retention-days: 30
          if-no-files-found: warn
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
