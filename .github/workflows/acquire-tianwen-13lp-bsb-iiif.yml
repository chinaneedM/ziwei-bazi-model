name: acquire-tianwen-13lp-bsb-iiif
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/research/TIANWEN-13LP-*
      - scripts/acquire-tianwen-13lp-bsb-iiif.py
      - scripts/verify-tianwen-13lp-bsb-source-route.py
      - tests/test_tianwen_13lp_bsb_source_route.py
      - .github/workflows/acquire-tianwen-13lp-bsb-iiif.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pillow
      - run: python scripts/verify-tianwen-13lp-bsb-source-route.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13lp_bsb_source_route.py' -v
      - run: python scripts/acquire-tianwen-13lp-bsb-iiif.py --out /tmp/tianwen-13lp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13lp-bsb-iiif-catalog-probe
          path: /tmp/tianwen-13lp/
          if-no-files-found: warn
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
