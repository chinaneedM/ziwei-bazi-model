name: research-ziwei-jielan-chapter64-direct-ap-r6

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - .github/workflows/research-ziwei-jielan-chapter64-direct-ap-r6.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Tianji direct chapter 64 and bind semantic terms
        shell: python
        run: |
          import hashlib, json, re, urllib.request
          from pathlib import Path

          out=Path("batch12ap-r6"); out.mkdir(exist_ok=True)
          urls={
            "tw":"https://tianjihq.com/zh-TW/learn/books/ziwei-jielan/64",
            "cn":"https://tianjihq.com/zh-CN/learn/books/ziwei-jielan/64"
          }

          def get(url,name):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      data=r.read(); status=r.status; final=r.geturl(); ctype=r.headers.get("Content-Type")
              except Exception as e:
                  return {"url":url,"error":repr(e)}
              (out/name).write_bytes(data)
              return {"url":url,"final_url":final,"http_status":status,"content_type":ctype,
                      "bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()}

          receipt={"scope":"DIRECT_PUBLIC_TIANJI_CHAPTER_64_ROUTE",
                   "ocr_generated_by_probe":False,
                   "glyph_authority_claimed":False,
                   "chapter_routes":{}}
          terms=[
            "论十二生时难定诀","論十二生時難定訣",
            "亥子丑时安有涯","亥子丑時安有涯",
            "天阴雨下时难定","天陰雨下時難定",
            "便是神仙也有差",
            "昼间若遇阴雨亦难定","晝間若遇陰雨亦難定",
            "将前后二时推之无不验矣","將前後二時推之無不驗矣",
            "罗经","羅經","真确时候","真確時候",
            "以上為古籍原文照錄","以上为古籍原文照录"
          ]
          for key,url in urls.items():
              rec=get(url,key+".html")
              p=out/(key+".html")
              txt=p.read_text("utf-8",errors="ignore") if p.exists() else ""
              compact=re.sub(r"\s+","",txt)
              rec["term_hits"]={t:(t in txt or t in compact) for t in terms}
              rec["chapter_64_route_present"]="/ziwei-jielan/64" in (rec.get("final_url") or url)
              rec["declared_chapter_64_of_246"]=bool(re.search(r"(?:第\s*64\s*/\s*共\s*246|第\s*64\s*章\s*/\s*246|64.{0,20}246)",txt,re.S))
              rec["declared_73_characters"]=bool(re.search(r"73\s*(?:字|characters)",txt,re.I))
              # Preserve bounded contexts around decisive strings; this is HTML text evidence, not glyph authority.
              contexts={}
              for t in ["论十二生时难定诀","亥子丑时安有涯","天阴雨下时难定","便是神仙也有差","昼间若遇阴雨亦难定","将前后二时推之无不验矣",
                        "論十二生時難定訣","亥子丑時安有涯","天陰雨下時難定","晝間若遇陰雨亦難定","將前後二時推之無不驗矣"]:
                  i=txt.find(t)
                  if i>=0: contexts[t]=re.sub(r"\s+"," ",txt[max(0,i-220):i+len(t)+320])
              rec["contexts"]=contexts
              receipt["chapter_routes"][key]=rec

          receipt["adjudication"]={
            "direct_chapter_route_attests_inclement_birth_time_discussion":
                any(r.get("term_hits",{}).get("天阴雨下时难定") or r.get("term_hits",{}).get("天陰雨下時難定")
                    for r in receipt["chapter_routes"].values()),
            "direct_chapter_route_attests_luojing_clause":
                any(r.get("term_hits",{}).get("罗经") or r.get("term_hits",{}).get("羅經")
                    for r in receipt["chapter_routes"].values()),
            "pagination_aggregate_nonattestation_can_be_treated_as_complete_public_text_negative":False,
            "direct_chapter_route_supersedes_batch12ao_aggregate_surface_scope":True,
            "physical_pt49_glyph_authority_obtained":False
          }
          (out/"receipt.json").write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+"\n","utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: ziwei-jielan-chapter64-direct-ap-r6
          path: batch12ap-r6
          retention-days: 90
