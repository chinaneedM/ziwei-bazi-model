name: research-kyujanggak-1912-1920-precious-catalog-renderer

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - ".github/workflows/research-kyujanggak-1912-1920-precious-catalog-renderer.yml"
      - "scripts/research_kyujanggak_1912_1920_precious_catalog_renderer.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated research dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Bind renderer manifest
        run: |
          python scripts/research_kyujanggak_1912_1920_precious_catalog_renderer.py \
            --output artifacts/kyujanggak-1912-1920-precious-catalog-renderer
      - name: Upload renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyujanggak-1912-1920-precious-catalog-renderer-${{ github.sha }}
          path: artifacts/kyujanggak-1912-1920-precious-catalog-renderer/
          if-no-files-found: warn
          retention-days: 7
