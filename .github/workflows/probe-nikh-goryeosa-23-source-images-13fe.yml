name: probe-nikh-goryeosa-23-source-images-13fe
on:
  push:
    branches:
      - agent/fusion-chart-core-r1-20260822
    paths:
      - scripts/probe-nikh-goryeosa-source-atlas-13fe.py
      - tests/test_probe_nikh_goryeosa_source_atlas_13fe.py
      - .github/workflows/probe-nikh-goryeosa-23-source-images-13fe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-declared-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify strict source-list and script gates
        run: |
          python -m py_compile scripts/probe-nikh-goryeosa-source-atlas-13fe.py tests/test_probe_nikh_goryeosa_source_atlas_13fe.py
          python -m unittest discover -s tests -p 'test_probe_nikh_goryeosa_source_atlas_13fe.py' -v
      - name: Capture bounded source-emitted images
        run: python scripts/probe-nikh-goryeosa-source-atlas-13fe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tianwen-13fe-source-list-atlas
          path: /tmp/tianwen-13fe-collation/
          if-no-files-found: warn
          retention-days: 30
