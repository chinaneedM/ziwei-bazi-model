name: verify-yehuobian-12up-old20-juan-seams-exact-head
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-yehuobian-12up-old20-juan-seams-exact-head.yml
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UP-*.json
      - docs/research/MING-DATONG-YEHUOBIAN-12UP-*.md
      - scripts/verify-yehuobian-old20-volume-seams-r1.py
      - tests/test_yehuobian_old20_volume_seams_12up.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify continuity, source sharding and transmission scope
        run: |
          set -euo pipefail
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-historical-source-registry-extensions-r1.py
          python scripts/verify-tianwen-transmission-genealogy-r1.py
      - name: Verify direct-image seam logic against prior 12QD/12UO
        run: |
          set -euo pipefail
          python scripts/verify-yehuobian-old20-volume-seams-r1.py
          python -m unittest discover -s tests -p 'test_yehuobian_old20_volume_seams_12up.py' -v
