          }
          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Human-readable matrix progress is append-only.
          matrix_md_path = Path("docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md")
          matrix_md = matrix_md_path.read_text(encoding="utf-8")
          marker = "## Progress through Batch 12BS"
          if marker not in matrix_md:
              matrix_md += dedent('''\

              ## Progress through Batch 12BS

              - The 1597 NLC/Yimen 《四字經》 opening is now directly collated from a hashed physical DjVu render with no OCR used for final glyph judgment. Page 28 prints `四字經 / 唐德行禪師著 / 明周履靖校正 / 唐明皇論`.
