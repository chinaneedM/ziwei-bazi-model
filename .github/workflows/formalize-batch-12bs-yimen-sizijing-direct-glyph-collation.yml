              - The Yongle-Dadian readings `古經云 / 雨露 / 子丑寅亥` remain a separate recension/transmission witness; Batch 12BS does not call them errors or select a stemmatic winner.
              - The literal `亥` belongs to a difficult-hour list, not an upper-Zi-to-Hai reassignment rule. HPA-ZDATE-006 remains `MISSING_FROM_PRODUCT`; Hai-branch mechanical vote, runtime selection, candidate-collapse and algorithm-reopen counts remain unchanged.
              - Next high-value gate is direct Taiwan NCL 15275-0058 target-leaf collation for edition/impression comparison, while the Fullbook inclement-current-time acquisition chain remains independently open.
              ''')
          matrix_md_path.write_text(matrix_md, encoding="utf-8")

          # Advance the durable handoff state without changing global rule counts.
          state_path = Path("docs/PROJECT-CURRENT-STATE-R1.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["schema_version"] = "1.78.0"
          audit = state["historical_audit"]
