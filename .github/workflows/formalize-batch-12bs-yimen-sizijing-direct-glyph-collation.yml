          }

          # Keep the continuity gate synchronized with the newly completed batch.
          verifier_path = Path("scripts/verify-project-continuity-state-r1.py")
          verifier = verifier_path.read_text(encoding="utf-8")
          if BATCH_ID not in verifier:
              needle = f'    "{PREV_ID}",\n]'
              replacement = f'    "{PREV_ID}",\n    "{BATCH_ID}",\n]'
              if needle not in verifier:
                  raise SystemExit("cannot locate Batch 12BR tail in continuity verifier")
              verifier = verifier.replace(needle, replacement, 1)
          latest_re = re.compile(r'^LATEST_BATCH_DOC = ".*"$', re.MULTILINE)
          replacement_latest = f'LATEST_BATCH_DOC = "{BATCH_DOC}"'
          if replacement_latest not in verifier:
              verifier, n = latest_re.subn(replacement_latest, verifier, count=1)
              if n != 1:
                  raise SystemExit("cannot update LATEST_BATCH_DOC")
          verifier_path.write_text(verifier, encoding="utf-8")

          batch_doc = dedent(f'''\
          # Fusion Chart Historical Provenance Audit R1 — Batch 12BS

          ## 1597《夷門廣牘》本《四字經》直接字形校勘：`唐明皇論`、`古人云`、`雨落`、`亥子丑寅`

          Status: **DIRECT NO-OCR MING-PRINT GLYPH COLLATION COMPLETE FOR THE YIMEN-GUANGDU SIZIJING OPENING / P28 DIRECTLY PRINTS 四字經, 唐德行禪師著, 明周履靖校正, 唐明皇論 / P29 DIRECTLY PRINTS 古人云 AND 天陰雨落難定 AND THE CONTIGUOUS HOUR ORDER 亥子丑寅 / BATCH-12BR YIMEN-SIDE OCR VARIANTS PHYSICALLY ADJUDICATED / YONGLE-DADIAN READINGS REMAIN A SEPARATE RECENSION WITNESS / TAIWAN-NCL EDITION IDENTITY STILL UNRESOLVED / HPA-ZDATE-006 STILL MISSING_FROM_PRODUCT / HAI-BRANCH MECHANICAL VOTE +0 / NO RUNTIME WINNER / NO CANDIDATE COLLAPSE / NO ALGORITHM REOPEN**

          ## 1. Scope and evidence chain

          Batch 12BR proved an independent Ming-print 《四字經》 transmission and isolated three exact variants that could not be trusted from CText automatic OCR alone. The next gate was direct, no-OCR collation of the 1597 《夷門廣牘》 physical scan.

          The exact evidence chain is now reproducible:

          - source object: Wikimedia Commons `明刻本夷門廣牘26.djvu`, previously bound to the NLC-sourced 1597 《夷門廣牘》 route;
          - source DjVu SHA-256: `{SOURCE_DJVU_SHA256}`;
          - renderer commit: `{EVIDENCE_HEAD}` / tree `{EVIDENCE_TREE}`;
          - GitHub Actions run: `{WORKFLOW_RUN}` (`render-yimen26-sizijing-target-pages`), successful at the exact evidence HEAD;
          - artifact: `{ARTIFACT_ID}`, digest `{ARTIFACT_DIGEST}`;
          - rendered pages were produced with `ddjvu` and Pillow only; no OCR was used for the final glyph judgment.

          The direct visual reading in this batch is deliberately limited to the securely legible printed glyphs described below.

          ## 2. Page 28: title, responsibility and opening heading

          Direct review of rendered scan page 28 (`{PAGE_HASHES['p28.jpg']}`) reads:

          ```text
          四字經
          唐德行禪師著
          明周履靖校正
          唐明皇論
          ```

          This directly closes the Yimen-side heading as `唐明皇論` and confirms that the printed object itself carries the 德行禪師 responsibility statement plus 周履靖校正. It still does **not** authenticate a Tang composition date merely from that responsibility line.

          ## 3. Page 29: the three Batch-12BR variants

          Direct review of rendered scan page 29 (`{PAGE_HASHES['p29.jpg']}`) resolves the Yimen-side printed readings:

          | Variant question | 1597 Yimen physical reading | Result |
          | --- | --- | --- |
          | `古經云` vs `古人云` | `古人云` | YIMEN SIDE DIRECTLY ADJUDICATED |
          | `天陰雨露時難定` vs `天陰雨落難定` | `天陰雨落難定` | YIMEN SIDE DIRECTLY ADJUDICATED |
          | `子丑寅亥` vs `亥子丑寅` | contiguous sequence `亥子丑寅` | YIMEN SIDE DIRECTLY ADJUDICATED |

          The page also visibly continues `便是神仙也有差別`. This batch does not attempt a diplomatic transcription of every surrounding character because only the above glyph disputes are material to the current gate.

          ## 4. Philological effect

          The three differences are no longer merely CText-OCR artifacts on the Yimen side. The 1597 physical print itself supports `古人云 / 雨落 / 亥子丑寅`.

          This does **not** authorize the opposite conclusion that the Yongle-Dadian `古經云 / 雨露 / 子丑寅亥` readings are errors. Those readings belong to a different transmission/recension layer and must be preserved until their own physical-glyph chain is adjudicated. Therefore the correct classification is:

          ```text
          SAME_SIZIJING_TEXT_FAMILY_AT_LONG_SEQUENCE_LEVEL
          + REAL_RECENSION_VARIATION_NOW_PHYSICALLY_CONFIRMED_ON_YIMEN_SIDE
          + NO_STEMMATIC_WINNER_SELECTED
          ```

          Batch 12BS also does not prove that Taiwan NCL 15275-0058 is the same impression, an extracted/disbound copy, or an independent edition relative to the NLC/Yimen object.

          ## 5. Effect on HPA-ZDATE-006

          The literal glyph `亥` here occurs inside the list of difficult birth hours `亥子丑寅`; it is **not** a statement that the upper half of Zi hour is reclassified to Hai. Likewise `天陰雨落難定` states the difficulty of determining time under inclement conditions but supplies no complete operational time-acquisition procedure.

          Therefore:

          - `HPA-ZDATE-006 = MISSING_FROM_PRODUCT`;
          - direct 1597 Sizijing target-leaf glyph witness increment: `+1` at the textual-variant layer;
          - HPA-ZDATE-006 Hai-branch mechanical vote increment: `0`;
          - Fullbook cloudy/rain current-time acquisition mechanism closed: `false`;
          - runtime winner selected: `false`;
          - candidate collapsed: `false`;
          - algorithm reopen authorized: `false`.

          Global accounting remains unchanged: `198 rows / 166 audited / 10 MISSING_FROM_PRODUCT / 14 cumulative missing candidate families`; provenance defects remain `11/11`; chart algorithm defect/reopen/collapse remain `0/0/0`.

          ## 6. Next gate

          Highest-value continuation is now:

          1. directly collate the Taiwan NCL 15275-0058 《四字經》 opening leaf for the same heading and three variant loci, so edition/impression identity can be tested with physical glyphs;
          2. if accessible, directly collate the Yongle-Dadian physical target leaf for the same loci rather than treating its transcription as final glyph authority;
          3. separately continue the Fullbook-line cloudy/rain operational-current-time acquisition chain, because the Sizijing sentence remains an uncertainty statement rather than a complete clock-recovery method.

          Research record: `{RESEARCH_ARTIFACT}`.
          ''')
          Path(BATCH_DOC).write_text(batch_doc, encoding="utf-8")

          research = {
