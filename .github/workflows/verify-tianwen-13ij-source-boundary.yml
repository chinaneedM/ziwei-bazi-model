name: verify-tianwen-13ij-source-boundary
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - 'docs/research/TIANWEN-13IJ-*'
      - 'docs/PROJECT-CURRENT-STATE-R1.json'
      - 'docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json'
      - 'scripts/verify-tianwen-13ij-source-boundary.py'
      - 'tests/test_tianwen_13ij_source_boundary.py'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python scripts/verify-tianwen-13ij-source-boundary.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13ij_source_boundary.py' -v
