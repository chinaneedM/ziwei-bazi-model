name: verify-batch-12ig-exact-head

on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - .github/workflows/verify-batch-12ig-exact-head.yml
      - docs/research/ZIWEI-ZHAO-WANLI-P197-OFFICIAL-JOURNAL-QUOTE-AUTHORITY-UPGRADE-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-BATCH-12-ZIWEI-ZHAO-WANLI-P197-OFFICIAL-JOURNAL-QUOTE-AUTHORITY-UPGRADE-IG.md
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-EXTERNAL-SOURCE-REGISTRY-R1.json
      - docs/FUSION-CHART-HISTORICAL-PROVENANCE-AUDIT-MATRIX-R1.md
      - docs/PROJECT-CURRENT-STATE-R1.json
      - scripts/verify-project-continuity-state-r1.py
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish pending IG status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'tianwen/batch-12ig-exact-head',
              description: 'Batch 12IG official quotation verification running'
            })

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Batch 12IG exact head
        run: |
          set -euo pipefail
          python scripts/verify-tianwen-transmission-genealogy-r1.py
          python scripts/verify-project-continuity-state-r1.py
          python scripts/verify-fusion-chart-historical-provenance-audit-r1.py
          python - <<'PY'
          import json
          from pathlib import Path
          bid='BATCH-12-ZIWEI-ZHAO-WANLI-P197-OFFICIAL-JOURNAL-QUOTE-AUTHORITY-UPGRADE-IG'
          e=json.loads(Path('docs/research/ZIWEI-ZHAO-WANLI-P197-OFFICIAL-JOURNAL-QUOTE-AUTHORITY-UPGRADE-R1.json').read_text(encoding='utf-8'))
          assert e['batch_id']==bid
          o=e['official_journal_object']
          assert o['official_pdf_url']=='https://bjb.zjlib.cn/CN/PDF/1737'
          assert o['pdf_sha256']=='2e0b9c1d59ccc95523b48144964cb8f528161c3b9201cb28da0cee41de9cd776'
          assert o['ocr_used'] is False
          p=e['page_level_direct_control']
          assert p['pdf_page']==92
          t=p['directly_observed_tokens']
          assert [t['qu_jicang'],t['fengqi'],t['xuchu']]==['瞿济苍','凤起','旭初']
          assert t['transaction_wording']=='捐赠'
          assert t['edition_display']=='宋刻'
          assert t['title_left_fragment']=='春秋左' and t['title_right_fragment']=='传注疏'
          assert t['donated_title_count_display']=='六十二种'
          assert t['citation_display']=='[2]197'
          c=e['citation_chain']
          assert c['xiao_2026_official_pdf_directly_reviewed'] is True
          assert c['direct_2011_page197_reviewed'] is False
          assert c['direct_1951_original_article_reviewed'] is False
          f=e['object_identity_firewall']
          assert f['exact_identity_with_fid070']=='UNRESOLVED'
          assert f['same_object_collapse_authorized'] is False
          state=json.loads(Path('docs/PROJECT-CURRENT-STATE-R1.json').read_text(encoding='utf-8'))
          assert tuple(int(x) for x in state['schema_version'].split('.')) >= (1,245,0)
          assert bid in state['historical_audit']['completed_batches']
          PY

      - name: Publish successful IG status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'success', context: 'tianwen/batch-12ig-exact-head',
              description: 'Batch 12IG official quotation gates PASS'
            })

      - name: Publish failed IG status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'failure', context: 'tianwen/batch-12ig-exact-head',
              description: 'Batch 12IG exact-head verification FAILED'
            })
