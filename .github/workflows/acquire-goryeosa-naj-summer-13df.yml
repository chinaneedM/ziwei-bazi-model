name: acquire-goryeosa-naj-summer-original-13df
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - scripts/acquire-goryeosa-naj-summer-13df.py
      - .github/workflows/acquire-goryeosa-naj-summer-13df.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  naj-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install supported JPEG parsing and request modules
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<12" requests
      - name: Acquire official original NAJ book51 photos 19-36
        run: python scripts/acquire-goryeosa-naj-summer-13df.py
      - name: Archive firstparty photo originals, manifest, and atlas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goryeosa-naj-book51-summer-13df-original
          path: goryeosa-13df-naj-summer-source/
          compression-level: 0
          retention-days: 45
          if-no-files-found: warn
