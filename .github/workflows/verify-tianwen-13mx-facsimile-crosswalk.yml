name: verify-tianwen-13mx-facsimile-crosswalk
on:
  push:
    branches: [agent/fusion-chart-core-r1-20260822]
    paths:
      - docs/research/TIANWEN-13MX-2019-DATONG-FACSIMILE-CROSSWALK-R1.json
      - docs/research/TIANWEN-13MX-2019-DATONG-FACSIMILE-CROSSWALK-R1.md
      - scripts/verify-tianwen-13mx-facsimile-crosswalk.py
      - tests/test_tianwen_13mx_facsimile_crosswalk.py
      - docs/PROJECT-CURRENT-STATE-R1.json
      - docs/RESEARCH-OMISSION-RISK-LEDGER-R1.json
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-tianwen-13mx-facsimile-crosswalk.py
      - run: python -m unittest discover -s tests -p 'test_tianwen_13mx_facsimile_crosswalk.py' -v
      - run: python scripts/verify-research-omission-risk-ledger-r1.py --check-parent
      - run: python scripts/verify-project-continuity-state-r1.py
